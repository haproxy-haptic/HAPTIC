version: 1

threshold:
  compliance: 100
  coverage: 100

dependenciesRules:
  # Rule 1: Only controller packages can depend on other top-level packages
  - package: "**.pkg.controller.**"
    shouldOnlyDependsOn:
      internal:
        - "**.pkg.buildinfo.**"    # Immutable build identity values
        - "**.pkg.compression.**"  # Decompression for CRD content
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.incremental.**"  # Generic incremental computation graph
        - "**.pkg.lifecycle.**"    # Component lifecycle management
        - "**.pkg.metrics.**"
        - "**.pkg.persistenttree.**" # Domain-free persistent container
        - "**.pkg.rendercontent.**"  # Rendered-output value types
        - "**.pkg.stores.**"       # Store provider abstractions
        - "**.pkg.templating.**"
        - "**.pkg.transportsecurity.**"
        - "**.pkg.webhook.**"
        - "**.pkg.apis.**"         # CRD API types
        - "**.pkg.generated.**"    # Generated Kubernetes clients
        - "**.codegen.**"

  # Rule 2: core packages should NOT depend on other top-level packages
  - package: "**.pkg.core.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 3: dataplane packages should NOT depend on other top-level packages
  - package: "**.pkg.dataplane.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 4: events package should NOT depend on other top-level packages
  - package: "**.pkg.events.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 5: introspection package should NOT depend on other top-level packages (pure infrastructure)
  - package: "**.pkg.introspection.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.k8s.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 6: k8s packages should NOT depend on other top-level packages (except configpublisher)
  - package: "**.pkg.k8s.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 7: templating may use the domain-free persistent container, not domain packages
  - package: "**.pkg.templating.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.incremental.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.rendercontent.**"
        - "**.pkg.webhook.**"

  # Rule 8: cmd packages can depend on all internal packages (composition root)
  - package: "**.cmd.**"
    shouldOnlyDependsOn:
      internal:
        - "**.cmd.**"
        - "**.pkg.**"
        - "**.codegen.**"

  # Rule 9: codegen packages should NOT depend on internal packages (generated code)
  - package: "**.codegen.**"
    shouldNotDependsOn:
      internal:
        - "**.cmd.**"
        - "**.pkg.**"
        - "**.tests.**"

  # Rule 10: tests packages can depend on all internal packages
  - package: "**.tests.**"
    shouldOnlyDependsOn:
      internal:
        - "**.tests.**"
        - "**.cmd.**"
        - "**.pkg.**"
        - "**.codegen.**"

  # Rule 10a: the bare `tests` package (architecture_test.go) — same
  # allowance as `**.tests.**` but the trailing `.**` glob doesn't match
  # the package without a sub-segment, so it needs its own entry to count
  # against the coverage threshold.
  - package: "**.tests"
    shouldOnlyDependsOn:
      internal:
        - "**.tests.**"
        - "**.cmd.**"
        - "**.pkg.**"
        - "**.codegen.**"

  # Rule 10b: scripts/dev-env-assets package (devassets.go) — embeds the
  # static manifests the e2e suite ships and depends on no internal
  # packages.
  - package: "**.scripts.dev-env-assets"
    shouldNotDependsOn:
      internal:
        - "**.cmd.**"
        - "**.pkg.**"
        - "**.tests.**"

  # Rule 11: examples packages can depend on all internal packages (demonstration code)
  - package: "**.examples.**"
    shouldOnlyDependsOn:
      internal:
        - "**.examples.**"
        - "**.pkg.**"
        - "**.codegen.**"

  # Rule 12: metrics package should NOT depend on other top-level packages (pure library)
  - package: "**.pkg.metrics.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 13: httpstore package should NOT depend on other top-level packages (pure library)
  - package: "**.pkg.httpstore.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 14: webhook package should NOT depend on other top-level packages (pure library)
  - package: "**.pkg.webhook.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"

  # Rule 15: apis package should NOT depend on other top-level packages (CRD types)
  - package: "**.pkg.apis.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 16: generated package should NOT depend on other top-level packages (generated code)
  - package: "**.pkg.generated.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 17: lifecycle package should NOT depend on other top-level packages (pure infrastructure)
  - package: "**.pkg.lifecycle.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 18: compression package should NOT depend on other top-level packages (pure library)
  - package: "**.pkg.compression.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.lifecycle.**"
        - "**.pkg.metrics.**"
        - "**.pkg.stores.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 19: stores package should NOT depend on any internal packages (pure library)
  - package: "**.pkg.stores.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.lifecycle.**"
        - "**.pkg.metrics.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 20: persistenttree is a domain-free container (pure leaf)
  - package: "**.pkg.persistenttree.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.lifecycle.**"
        - "**.pkg.metrics.**"
        - "**.pkg.stores.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 21: rendercontent holds rendered-output value types (pure leaf)
  - package: "**.pkg.rendercontent.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.lifecycle.**"
        - "**.pkg.metrics.**"
        - "**.pkg.stores.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  # Rule 22: incremental is a generic computation graph; persistenttree is its
  # only internal dependency
  - package: "**.pkg.incremental.**"
    shouldNotDependsOn:
      internal:
        - "**.pkg.controller.**"
        - "**.pkg.core.**"
        - "**.pkg.dataplane.**"
        - "**.pkg.events.**"
        - "**.pkg.httpstore.**"
        - "**.pkg.introspection.**"
        - "**.pkg.k8s.**"
        - "**.pkg.lifecycle.**"
        - "**.pkg.metrics.**"
        - "**.pkg.rendercontent.**"
        - "**.pkg.stores.**"
        - "**.pkg.templating.**"
        - "**.pkg.webhook.**"

  - package: "**.pkg.transportsecurity.**"
    shouldOnlyDependsOn:
      internal:
        - "**.pkg.transportsecurity.**"

  - package: "**.pkg.buildinfo.**"
    shouldOnlyDependsOn:
      internal:
        - "**.pkg.buildinfo.**"
