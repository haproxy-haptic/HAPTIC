suite: pre-rollout validation hook
templates:
  - templates/pre-rollout-validation-hook.yaml
  # Render the memo writers too; with the hook alone .Values holds no memos.
  - templates/deployment.yaml
  - templates/secret.yaml
  - templates/webhook-cert-secret.yaml
tests:
  # The hook re-renders the chart with these values, so they must pass the
  # values schema; render-time memos in .Values are not values.
  - it: leaves render-time memos out of the values it validates
    template: templates/pre-rollout-validation-hook.yaml
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - notMatchRegex:
          path: stringData["values.yaml"]
          pattern: "(?m)^_"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?m)^controller:"
  - it: prepares the controller only after preflight validation
    template: templates/pre-rollout-validation-hook.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prepare-upgrade
  - it: ends controller preparation before the Job deadline
    template: templates/pre-rollout-validation-hook.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      preRolloutValidation.activeDeadlineSeconds: 600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prepare-timeout=540s
  - it: limits controller mutation to this release deployment
    template: templates/pre-rollout-validation-hook.yaml
    documentSelector:
      path: kind
      value: Role
    release:
      name: example
      namespace: team
    asserts:
      - equal:
          path: metadata.namespace
          value: team
      - equal:
          path: rules[0].resourceNames
          value: [example-haptic-controller]
      - equal:
          path: rules[0].verbs
          value: [get, patch]
