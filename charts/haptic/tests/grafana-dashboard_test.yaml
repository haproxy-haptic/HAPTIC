# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: grafana dashboard
templates:
  - grafana-dashboard.yaml
set:
  # Default: dashboard ConfigMap rendered. The single disabled-render test overrides.
  controller.monitoring.grafanaDashboard.enabled: true
tests:
  - it: should not render when grafanaDashboard is disabled
    set:
      controller.monitoring.grafanaDashboard.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when grafanaDashboard is enabled
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: should include grafana_dashboard label by default
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"

  - it: should include grafana_folder annotation by default
    asserts:
      - equal:
          path: metadata.annotations.grafana_folder
          value: "HAProxy"

  - it: should allow adding extra annotations
    set:
      controller.monitoring.grafanaDashboard.annotations:
        k8s-sidecar-target-directory: "Kubernetes"
    asserts:
      - equal:
          path: metadata.annotations["k8s-sidecar-target-directory"]
          value: "Kubernetes"

  - it: should include custom labels
    set:
      controller.monitoring.grafanaDashboard.labels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels.custom-label
          value: custom-value

  - it: should include custom annotations
    set:
      controller.monitoring.grafanaDashboard.annotations:
        custom-annotation: custom-value
    asserts:
      - equal:
          path: metadata.annotations.custom-annotation
          value: custom-value

  - it: should include common labels
    set:
      commonLabels:
        environment: production
    asserts:
      - equal:
          path: metadata.labels.environment
          value: production

  - it: should include common annotations
    set:
      commonAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform

  - it: should use custom namespace when specified
    set:
      controller.monitoring.grafanaDashboard.namespace: monitoring
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring

  - it: should use release namespace by default
    release:
      namespace: my-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: should include both built-in dashboard json files
    asserts:
      - exists:
          path: data["haptic-controller.json"]
      - exists:
          path: data["haptic-traffic.json"]

  - it: should include controller and traffic dashboard titles
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "HAPTIC Controller"
      - matchRegex:
          path: data["haptic-traffic.json"]
          pattern: "HAPTIC Traffic"

  - it: should include distinct dashboard uids
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: '"uid": "haptic-controller"'
      - matchRegex:
          path: data["haptic-traffic.json"]
          pattern: '"uid": "haptic-traffic"'

  - it: should include reconciliation metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_reconciliation_total"

  - it: should include deployment metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_deployment_total"

  - it: should include leader election metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_leader_election_is_leader"

  - it: should include resource count metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_resource_count"

  - it: should include reconciliation queue wait metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_reconciliation_queue_wait_seconds"

  - it: should include configuration validation outcomes in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_config_validation_total"
      - notMatchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_validation_test_duration_seconds"

  - it: should include observability event drop counts in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_events_dropped_observability_total"
      - notMatchRegex:
          path: data["haptic-controller.json"]
          pattern: "rate\\(haptic_events_dropped_observability_total"

  - it: should include critical event dropping metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_events_dropped_critical_total"

  - it: should include webhook request metrics in dashboard
    asserts:
      - matchRegex:
          path: data["haptic-controller.json"]
          pattern: "haptic_webhook_requests_total"

  - it: should include route and backend target traffic diagnostics
    asserts:
      - matchRegex:
          path: data["haptic-traffic.json"]
          pattern: "haptic_ingress_controller_requests_total"
      - matchRegex:
          path: data["haptic-traffic.json"]
          pattern: "server=~"
      - matchRegex:
          path: data["haptic-traffic.json"]
          pattern: "Abnormal HAProxy termination states by route"

  - it: should use custom dashboard when useBuiltIn is false
    set:
      controller.monitoring.grafanaDashboard.useBuiltIn: false
      controller.monitoring.grafanaDashboard.customDashboard:
        title: "Custom Dashboard"
        panels: []
    asserts:
      - matchRegex:
          path: data["haptic.json"]
          pattern: "Custom Dashboard"
