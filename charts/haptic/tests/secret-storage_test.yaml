# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: secret-storage volume
# Secret files are for sidecars: the agent writes them, the spoa-hub reads them,
# and the haproxy container must never see them.
templates:
  - haproxy-deployment.yaml
  - haproxytemplateconfig.yaml
tests:
  - it: backs the volume with a small tmpfs
    template: haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-storage
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi

  - it: mounts the whole volume read-write in the agent
    template: haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].volumeMounts
          content:
            name: secret-storage
            mountPath: /etc/haproxy/secrets

  - it: mounts the whole volume read-only in the spoa-hub
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].volumeMounts
          content:
            name: secret-storage
            mountPath: /etc/haproxy/secrets
            readOnly: true

  - it: never mounts the volume in the haproxy container
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name=="haproxy")].volumeMounts
          content:
            name: general-storage
          any: true
      - notContains:
          path: spec.template.spec.containers[?(@.name=="haproxy")].volumeMounts
          content:
            name: secret-storage
          any: true

  - it: leaves secretsDir to the controller's default, the mounted directory
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - notExists:
          path: spec.dataplane.secretsDir

  - it: renders an explicitly set secretsDir
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.config.dataplane.secretsDir: /etc/haproxy/secrets
    asserts:
      - equal:
          path: spec.dataplane.secretsDir
          value: /etc/haproxy/secrets
