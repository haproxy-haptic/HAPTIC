# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: haproxy deployment
templates:
  - haproxy-deployment.yaml
set:
  # Default: HAProxy enabled. The single disabled-render test overrides.
  haproxy.enabled: true
tests:
  - it: should render deployment when haproxy enabled
    asserts:
      - isKind:
          of: Deployment

  - it: should not render when haproxy disabled
    set:
      haproxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have haproxy container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: haproxy

  # The agent is a first-class container with its own probes, not a supervised
  # child of a shell loop. It still owns no pod readiness: HAProxy's /ready does.
  - it: should run the agent from the controller image with its own probes
    chart:
      appVersion: 9.8.7-test
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].image
          value: ghcr.io/haproxy-haptic/haptic:9.8.7-test-haproxy3.4
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].command
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].readinessProbe
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].startupProbe
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].livenessProbe.exec.command
          value: [haptic, agent, health, --base-dir=/etc/haproxy]

  - it: should point the agent at the tree and sockets the HAProxy container creates
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          value:
            - agent
            - --base-dir=/etc/haproxy
            - --config=haproxy.cfg
            - --master-socket=haproxy-master.sock
            - --worker-socket=haproxy-worker.sock
            - --listen=:5555
            - --tls-dir=/etc/haptic/agent-tls/..data
            - --tls-client-name=RELEASE-NAME-haptic-controller-tls.NAMESPACE.svc
            - --metrics-listen=:5557
            - --drain-socket=haptic-drain.sock
            - --drain-quiet-period=2s
            - --drain-max-wait=10s
            - --drain-ignore-frontend=status
            - --reload-interval-min=5s

  # One value paces the controller's structural deploys and the agent's reloads;
  # the reload deadline likewise comes from the CRD field, not a second knob.
  - it: should feed the agent's pacing and reload deadline from controller.config.dataplane
    set:
      controller.config.dataplane.minDeploymentInterval: 2s
      controller.config.dataplane.reloadVerificationTimeout: 20s
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --reload-interval-min=2s
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --reload-timeout=20s

  - it: should read the agent credentials from the shared Secret and log at the configured level
    set:
      haproxy.agent.logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].env
          content:
            name: DATAPLANE_USERNAME
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-haptic-credentials
                key: dataplane_username
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].env
          content:
            name: LOG_LEVEL
            value: "debug"

  - it: should expose the agent metrics port under the name the PodMonitor scrapes
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].ports
          content:
            name: agent-metrics
            containerPort: 5557
            protocol: TCP
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].ports
          content:
            name: dataplane
            containerPort: 5555
            protocol: TCP

  # Copying the bootstrap over a working config would drop the pod back to the
  # 503 /ready page on every container restart.
  - it: should copy the bootstrap config only when the config on disk is absent or unparseable
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^if \[ ! -s /etc/haproxy/haproxy\.cfg \] \|\| ! /usr/local/sbin/haproxy -dr -c -f /etc/haproxy/haproxy\.cfg >/dev/null 2>&1; then$'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^  cp /config/haproxy\.cfg /etc/haproxy/haproxy\.cfg$'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^mkdir -p /etc/haproxy/maps .*\n#'

  - it: should check the bootstrap guard with the Enterprise binary in Enterprise mode
    set:
      haproxyVersion: "3.2"
      haproxy.enterprise.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '! /opt/hapee-3\.2/sbin/hapee-lb -dr -c -f /etc/haproxy/haproxy\.cfg'

  - it: should keep the Dataplane API config file, its wrappers and its volumes out of the pod
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'reload\.sh|validate\.sh'
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: dataplane-data
            emptyDir: {}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: dataplane-tmp
            emptyDir: {}
      - lengthEqual:
          path: spec.template.spec.initContainers[?(@.name=="agent")].volumeMounts
          count: 3
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].volumeMounts
          content:
            name: agent-tls
            mountPath: /etc/haptic/agent-tls
            readOnly: true

  - it: should drop all capabilities for the agent container
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].securityContext.readOnlyRootFilesystem
          value: true

  # The agent binds nothing privileged, so it never needs the capability the
  # Enterprise HAProxy binary's file capabilities require.
  - it: should not add NET_BIND_SERVICE to the agent even in Enterprise mode
    set:
      haproxy.enterprise.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].securityContext.capabilities.add
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].securityContext.runAsUser
          value: 1000
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE

  - it: should set resources for the agent container
    set:
      haproxy.agent.resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="agent")].resources.requests.cpu
          value: 100m

  # The pod pulls the HAPTIC image now, so a private-registry install must not
  # need the same secret listed twice.
  - it: should fall back to the controller image pull secrets
    set:
      controller.podSpec.imagePullSecrets:
        - name: registry-creds
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-creds

  - it: should prefer the HAProxy pod's own image pull secrets when set
    set:
      controller.podSpec.imagePullSecrets:
        - name: registry-creds
      haproxy.podSpec.imagePullSecrets:
        - name: haproxy-creds
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: haproxy-creds

  - it: should derive the Enterprise repository and binary path from one series
    set:
      haproxyVersion: "3.2"
      haproxy.enterprise.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: hapee-registry.haproxy.com/haproxy-enterprise:3.2r1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'exec /opt/hapee-3\.2/sbin/hapee-lb '

  - it: should configure readiness probe for haproxy
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: should configure liveness probe for haproxy
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz

  - it: should expose http port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 80
            protocol: TCP

  - it: should expose https port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: https
            containerPort: 443
            protocol: TCP

  - it: should expose stats port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: stats
            containerPort: 8404
            protocol: TCP

  - it: should supervise the SPOA hub and keep its named metrics port
    set:
      spoaHub.enabled: true
      spoaHub.hub.metricsAddr: "0.0.0.0:9095"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].command
          value: ["/bin/sh", "-c"]
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].readinessProbe
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].livenessProbe
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: '(?m)^  /usr/local/bin/haproxy-spoa-hub --config /etc/haproxy/general/spoa-hub-config\.toml &$'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'GET /spoa-hub-child-health HTTP/1\.0'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: "' child-health 8404"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'HTTP/\*" 424 "\*\) exit 1'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: '_watch_child "\$_child_pid" &'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'kill -KILL "\$_watched_pid"'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'SPOA processing is unavailable; restarting in \$\{_backoff\}s'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: '_child_runtime_seconds=\$\(\( \$\(date \+%s\) - _child_started_epoch_seconds \)\)'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'if \[ "\$_child_runtime_seconds" -ge 60 \]; then\s+_backoff=1'
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].ports
          content:
            name: metrics
            containerPort: 9095
            protocol: TCP

  - it: should probe SPOA child health on the configured stats port
    set:
      spoaHub.enabled: true
      haproxy.ports.stats: 9999
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: "' child-health 9999"
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: '/dev/tcp/127\.0\.0\.1/8404'

  - it: should omit the sidecar metrics port when metricsAddr is empty
    set:
      spoaHub.enabled: true
      spoaHub.hub.metricsAddr: ""
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].ports
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: 'GET /spoa-hub-child-health HTTP/1\.0'

  - it: should set replica count from values
    set:
      haproxy.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should run as non-root user
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: should drop all capabilities for haproxy container
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: should include loadbalancer component label
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: loadbalancer

  - it: should set priorityClassName when specified
    set:
      haproxy.podSpec.priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical

  - it: should set resources for haproxy container
    set:
      haproxy.resources:
        limits:
          cpu: 1000m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  # Extra volumes and volume mounts
  - it: should include extra volumes when specified
    set:
      haproxy.extraVolumes:
        - name: custom-config
          configMap:
            name: my-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-config
            configMap:
              name: my-config

  - it: should include extra volume mounts when specified
    set:
      haproxy.extraVolumeMounts:
        - name: custom-config
          mountPath: /etc/custom
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /etc/custom
            readOnly: true

  # Init containers and sidecars
  - it: should include init containers when specified
    set:
      haproxy.initContainers:
        - name: init-config
          image: busybox:1.28
          command: ["sh", "-c", "echo init"]
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-config
            image: busybox:1.28
            command: ["sh", "-c", "echo init"]

  - it: should include sidecars when specified
    set:
      haproxy.sidecars:
        - name: log-collector
          image: fluent/fluent-bit:latest
          readinessProbe:
            exec:
              command: ["true"]
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: log-collector
            image: fluent/fluent-bit:latest
            readinessProbe:
              exec:
                command: ["true"]

  # Lifecycle hooks
  - it: should include lifecycle hooks when specified
    set:
      haproxy.lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "sleep 15"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["/bin/sh", "-c", "sleep 15"]

  - it: should hold termination on the agent's drain socket by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["curl", "-sS", "--connect-timeout", "2", "--max-time", "15", "--unix-socket", "/etc/haproxy/haptic-drain.sock", "http://drain/drain"]
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --drain-socket=haptic-drain.sock
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --drain-quiet-period=2s
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --drain-ignore-frontend=status
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].lifecycle

  - it: should render no hook and no drain socket when the drain is disabled
    set:
      haproxy.drain.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].lifecycle
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="agent")].lifecycle
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="agent")].args
          content: --drain-socket=

  # Termination grace period
  - it: should set default termination grace period
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: should set custom termination grace period
    set:
      haproxy.podSpec.terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  # Update strategy
  - it: should set default update strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  - it: should set custom update strategy
    set:
      haproxy.updateStrategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  # Min ready seconds and revision history
  - it: should set default minReadySeconds
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 0

  - it: should set custom minReadySeconds
    set:
      haproxy.minReadySeconds: 10
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 10

  - it: should set default revisionHistoryLimit
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 10

  - it: should set custom revisionHistoryLimit
    set:
      haproxy.revisionHistoryLimit: 5
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  # DNS configuration
  - it: should set default dnsPolicy
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirst

  - it: should set custom dnsPolicy
    set:
      haproxy.podSpec.dnsPolicy: None
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: None

  - it: should set dnsConfig when specified
    set:
      haproxy.podSpec.dnsConfig:
        nameservers:
          - 8.8.8.8
        options:
          - name: ndots
            value: "2"
    asserts:
      - contains:
          path: spec.template.spec.dnsConfig.nameservers
          content: 8.8.8.8
      - contains:
          path: spec.template.spec.dnsConfig.options
          content:
            name: ndots
            value: "2"

  # Host aliases
  - it: should set hostAliases when specified
    set:
      haproxy.podSpec.hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "foo.local"
    asserts:
      - contains:
          path: spec.template.spec.hostAliases
          content:
            ip: "127.0.0.1"
            hostnames:
              - "foo.local"

  # Runtime class
  - it: should not set runtimeClassName by default
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should set runtimeClassName when specified
    set:
      haproxy.podSpec.runtimeClassName: gvisor
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: gvisor

  # Node selector
  - it: should set nodeSelector when specified
    set:
      haproxy.podSpec.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  # Tolerations
  - it: should set tolerations when specified
    set:
      haproxy.podSpec.tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: node-role.kubernetes.io/master
            effect: NoSchedule

  # Affinity
  - it: should set affinity when specified
    set:
      haproxy.podSpec.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity

  # Common labels and annotations
  - it: should include common labels
    set:
      commonLabels:
        environment: production
        team: platform
    asserts:
      - equal:
          path: metadata.labels.environment
          value: production
      - equal:
          path: metadata.labels.team
          value: platform

  - it: should include common annotations
    set:
      commonAnnotations:
        config.kubernetes.io/managed-by: helm
    asserts:
      - equal:
          path: metadata.annotations["config.kubernetes.io/managed-by"]
          value: helm

  # Topology spread constraints
  - it: should set topologySpreadConstraints when specified
    set:
      haproxy.podSpec.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: haproxy
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: haproxy

  # Bootstrap-copy init containers must declare resources: a ResourceQuota'd
  # namespace rejects the whole pod when any container omits requests/limits.
  - it: vector-bootstrap-copy declares resources
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: vector-bootstrap-copy
          any: true
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'vector-bootstrap-copy')].resources.requests.cpu
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'vector-bootstrap-copy')].resources.requests.memory
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'vector-bootstrap-copy')].resources.limits.memory

  - it: spoa-hub-bootstrap-copy declares resources
    set:
      spoaHub.plugins.coraza.enabled: true
    asserts:
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'spoa-hub-bootstrap-copy')].resources.requests.cpu
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'spoa-hub-bootstrap-copy')].resources.requests.memory
      - exists:
          path: spec.template.spec.initContainers[?(@.name == 'spoa-hub-bootstrap-copy')].resources.limits.memory
