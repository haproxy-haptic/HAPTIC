# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: haproxy rbac
# The drain's routing check reads EndpointSlices, Services and Nodes; nothing
# else, and nothing when the check is off.
templates:
  - haproxy-rbac.yaml
release:
  namespace: edge
tests:
  - it: grants the drain read access to the routing and nothing more
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: ["discovery.k8s.io"]
              resources: ["endpointslices"]
              verbs: ["list", "watch"]
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["list", "watch"]
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: edge
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["list"]
        documentIndex: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-haptic-haproxy-edge
        documentIndex: 3
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-haptic-haproxy
              namespace: edge
        documentIndex: 4

  - it: renders only the token-less ServiceAccount when the routing check is off
    set:
      haproxy.drain.kubeProxyHealthzPort: 0
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: leaves the grants to the operator when chart RBAC is off
    set:
      controller.rbac.create: false
    asserts:
      - hasDocuments:
          count: 1

  - it: renders nothing without the bundled HAProxy fleet
    set:
      haproxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
