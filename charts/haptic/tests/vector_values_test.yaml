suite: vector value guards
# Renders ONLY haproxytemplateconfig.yaml, which is where
# haptic.vector.validateValues is invoked. Kept separate from vector_test.yaml so
# a render error in the deployment can never be mistaken for one of these guards.
templates:
  - haproxytemplateconfig.yaml
tests:
  - it: should reject a socketPath at the filesystem root
    template: haproxytemplateconfig.yaml
    set:
      # dir("/haproxy.sock") is "/", and that parent is what gets mounted as the
      # shared emptyDir — it would shadow both containers' root filesystems.
      vector.socketPath: /haproxy.sock
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath must be inside a subdirectory, not directly at the filesystem root, got "/haproxy.sock". The chart mounts the socket''s parent directory as a shared emptyDir in both the haproxy and vector containers, so a parent of "/" would shadow their root filesystems. Use something like /run/vector/haproxy.sock.'

  - it: should reject shell metacharacters in socketPath
    template: haproxytemplateconfig.yaml
    set:
      # The path is interpolated into the sidecar's /bin/sh -c start script, so
      # this is the boundary that keeps a values string out of a shell. It is
      # quoted there too, but a single quote would break out of the quoting —
      # which is why the charset check, not the quoting, is the real guard.
      vector.socketPath: /run/vector/a;id
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath may only contain letters, digits, dot, underscore, hyphen and slash, got "/run/vector/a;id". It is interpolated into the sidecar''s shell start script, so shell metacharacters are refused.'

  - it: should reject a relative socketPath
    template: haproxytemplateconfig.yaml
    set:
      vector.socketPath: run/vector/haproxy.sock
    asserts:
      - failedTemplate:
          errorMessage: 'vector.socketPath must be an absolute path, got "run/vector/haproxy.sock". HAProxy''s `log <path>` form requires one.'

  - it: should reject a metricsPort that collides with an HAProxy port
    template: haproxytemplateconfig.yaml
    set:
      # 8404 is haproxy.ports.stats; both bind in the same pod network namespace,
      # so without this guard the pod would CrashLoopBackOff on bind instead.
      vector.metricsPort: 8404
    asserts:
      - failedTemplate:
          errorMessage: 'vector.metricsPort (8404) collides with haproxy.ports.stats. Both bind in the same pod network namespace; pick a different port.'

  - it: should reject an unpinned image tag
    template: haproxytemplateconfig.yaml
    set:
      vector.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: 'vector.image.tag must be pinned to an explicit tag so a silent upstream bump can''t change the log pipeline under a running fleet.'

  # Moved keys. Each fails with its destination rather than as an unknown field,
  # so an operator's old values file tells them what to rename.
  - it: should name the new home when vector.excludeMetrics is still set
    template: haproxytemplateconfig.yaml
    set:
      vector.excludeMetrics:
        serverBackendMax:
          enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.excludeMetrics moved to controller\.config\.templatingSettings\.extraContext\.prometheusExporter\.excludeMetrics'

  - it: should name the new home when vector.excludeMaintServerMetrics is still set
    template: haproxytemplateconfig.yaml
    set:
      vector.excludeMaintServerMetrics: false
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.excludeMaintServerMetrics moved to controller\.config\.templatingSettings\.extraContext\.prometheusExporter\.excludeMaintServers'

  - it: should name the new home when vector.podMonitor is still set
    template: haproxytemplateconfig.yaml
    set:
      vector.podMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'vector\.podMonitor moved to haproxy\.monitoring\.podMonitor'

  - it: should name the new home when spoaHub.monitoring is still set
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.monitoring.podMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'spoaHub\.monitoring moved to haproxy\.monitoring'

  # Trace-export guards. Both live in HELM rather than in the Scriggo render, and
  # that placement is the point: a validationTest legitimately pins individual
  # extraContext keys, so the same cross-key check at render time would fail the
  # LOAD GATE on a good config and keep the controller from starting instead of
  # refusing an install.
  - it: should refuse an OTLP endpoint without the vector sidecar
    template: haproxytemplateconfig.yaml
    set:
      vector.enabled: false
      controller.config.templatingSettings.extraContext.tracing.enabled: true
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - failedTemplate:
          errorPattern: 'endpoint is set .* but vector\.enabled is false'

  - it: should refuse an OTLP endpoint while tracing is disabled
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - failedTemplate:
          errorPattern: 'endpoint is set .* but tracing\.enabled is false'

  - it: should accept tracing with an endpoint when the sidecar is on
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.config.templatingSettings.extraContext.tracing.enabled: true
      controller.config.templatingSettings.extraContext.tracing.otlp.endpoint: http://tempo:4318/v1/traces
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.tracing.otlp.endpoint
          value: http://tempo:4318/v1/traces

  - it: should reject a non-boolean omitEmptyLogFields
    template: haproxytemplateconfig.yaml
    set:
      # A string is truthy in the render, so "false" would enable the very transform
      # the operator was switching off.
      vector.omitEmptyLogFields: "false"
    asserts:
      - failedTemplate:
          errorPattern: "at '/vector/omitEmptyLogFields': got string, want boolean"

  - it: should strip empty access-log fields by default
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.vector.omitEmptyLogFields
          value: true

  - it: should bind the hub metrics on loopback with vector on and pod-routable with it off
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.enabled: true
    asserts:
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.hub.metricsAddr
          pattern: '^127\.0\.0\.1:9095$'

  - it: should bind the hub metrics pod-routable when vector is disabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      vector.enabled: false
      spoaHub.enabled: true
    asserts:
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.hub.metricsAddr
          pattern: '^0\.0\.0\.0:9095$'

  - it: should reject an unknown requestMetrics field
    template: haproxytemplateconfig.yaml
    set:
      vector.requestMetrics.terminationStateLabels: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/vector/requestMetrics': additional properties 'terminationStateLabels' not allowed"

  - it: should reject an unknown metric name rather than leaving it inert
    template: haproxytemplateconfig.yaml
    set:
      # A typo here would otherwise pass validation, be skipped by the render,
      # and emit nothing — with the operator believing the metric was on.
      vector.requestMetrics.metrics.request_durations_seconds: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/vector/requestMetrics/metrics': additional properties 'request_durations_seconds' not allowed"

  - it: should reject a label flag given as a string
    template: haproxytemplateconfig.yaml
    set:
      # Truthy in the render, so this would leave `term` on every family while
      # reading as if it had been switched off.
      vector.requestMetrics.terminationStateLabel: "false"
    asserts:
      - failedTemplate:
          errorPattern: "at '/vector/requestMetrics/terminationStateLabel': got string, want boolean"

  - it: should reject bucket boundaries that are not ascending
    template: haproxytemplateconfig.yaml
    set:
      vector.requestMetrics.durationBuckets: [0.005, 0.01, 0.005]
    asserts:
      - failedTemplate:
          errorMessage: 'vector.requestMetrics.durationBuckets must be strictly ascending; 0.005 follows 0.01. Prometheus reads these as cumulative `le` boundaries, so out-of-order values produce silently wrong quantiles.'

  - it: should reject an empty bucket list
    template: haproxytemplateconfig.yaml
    set:
      vector.requestMetrics.sizeBuckets: []
    asserts:
      - failedTemplate:
          errorMessage: 'vector.requestMetrics.sizeBuckets is empty. A histogram with no boundaries reports only +Inf, which carries no information beyond the count.'

  - it: should reject requestMetrics enabled with every metric switched off
    template: haproxytemplateconfig.yaml
    set:
      vector.requestMetrics.metrics:
        requests: false
        request_duration_seconds: false
        response_duration_seconds: false
        connect_duration_seconds: false
        header_duration_seconds: false
        request_size: false
        response_size: false
    asserts:
      - failedTemplate:
          errorMessage: 'vector.requestMetrics.enabled is true but every entry in `metrics` is false, so the pipeline would parse each access-log record and emit nothing. Set vector.requestMetrics.enabled: false instead.'

  - it: should reject a sizeMetricsPort that collides with the primary one
    template: haproxytemplateconfig.yaml
    set:
      vector.sizeMetricsPort: 9598
    asserts:
      - failedTemplate:
          errorMessage: 'vector.metricsPort and vector.sizeMetricsPort are both 9598. They are two prometheus_exporter sinks with different histogram buckets, so they cannot share a port.'

  - it: should reject an unparseable cardinalityLimit action
    template: haproxytemplateconfig.yaml
    set:
      vector.requestMetrics.cardinalityLimit.action: drop
    asserts:
      - failedTemplate:
          errorMessage: 'vector.requestMetrics.cardinalityLimit.action must be "drop_tag" or "drop_event", got "drop". drop_tag collapses the runaway label and keeps the totals; drop_event discards the requests, so a cardinality problem would read as an outage.'

  - it: should default controller_class to the IngressClass controller name
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.vector.requestMetrics.controllerClass
          value: haproxy-haptic.org/controller

  - it: should let controller_class be set to the ingress-nginx value for a drop-in
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      vector.requestMetrics.controllerClass: k8s.io/ingress-nginx
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.vector.requestMetrics.controllerClass
          value: k8s.io/ingress-nginx

  - it: should strip a trailing underscore from the prefix
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      # Operators think of this as `nginx_ingress_controller_`; the exporter joins
      # namespace and name with an underscore itself, so keeping it would render
      # nginx_ingress_controller__requests.
      vector.requestMetrics.prefix: nginx_ingress_controller_
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.vector.requestMetrics.prefix
          value: nginx_ingress_controller

  - it: should reject a bucket boundary below the exporter's precision
    template: haproxytemplateconfig.yaml
    set:
      # Renders as "0" at 9 decimals, so it would emit a le="0" boundary — and a
      # second such value would collapse onto the same one.
      vector.requestMetrics.durationBuckets: [0.0000000001, 1]
    asserts:
      - failedTemplate:
          errorMessage: 'vector.requestMetrics.durationBuckets[0] is 1e-10, smaller than the exporter renders (9 decimals); it would emit a le="0" boundary.'
