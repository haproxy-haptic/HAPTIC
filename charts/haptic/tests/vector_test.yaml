suite: vector sidecar
templates:
  - haproxy-deployment.yaml
  - haproxy-networkpolicy.yaml
tests:
  - it: should render a supervised sidecar without owning pod readiness
    template: haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: vector
          any: true
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="vector")].readinessProbe
      - isNull:
          path: spec.template.spec.initContainers[?(@.name=="vector")].livenessProbe
      # Whole-volume mount, never subPath: kubelet implements subPath as an
      # isolated bind-mount that does not propagate inotify, so --watch-config
      # would never fire and the sidecar would keep its bootstrap config.
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].volumeMounts
          content:
            name: general-storage
            mountPath: /etc/haproxy/general
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].volumeMounts
          content:
            name: vector-socket
            mountPath: /run/vector

  - it: should unlink a stale socket before starting vector
    template: haproxy-deployment.yaml
    asserts:
      # The socket survives a Vector child exit on the shared emptyDir.
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="vector")].command
          value: ["/bin/sh", "-c"]
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          # (?m) so the anchors bind to a LINE — args[0] is a multi-line script
          # and Go's ^/$ would otherwise mean start/end of the whole string.
          # Quoted: the path is interpolated into a shell script. The charset
          # guard in _vector.tpl is the real boundary, this is defence in depth.
          pattern: "(?m)^  rm -f '/run/vector/haproxy\\.sock'$"
      # Waits for the config rather than dying without it: the file can be
      # transiently absent (the dataplane prunes it as an orphan until a reconcile
      # includes it, and a controller rollout has a leaderless window), and vector
      # treats a missing --config as fatal — which turned into CrashLoopBackOff
      # whose backoff outlasted the config actually arriving.
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '(?m)^  while \[ ! -s /etc/haproxy/general/vector\.yaml \]; do$'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '(?m)^  /usr/bin/vector --watch-config --watch-config-method poll --watch-config-poll-interval-seconds 2 --config /etc/haproxy/general/vector\.yaml &$'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '(?m)^  while \[ ! -S ''/run/vector/haproxy\.sock'' \] && \[ "\$_sync_waited" -lt "\$_watch_startup_grace_seconds" \]; do$'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '(?m)^    kill -HUP "\$_child_pid"$'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'trap _shutdown TERM INT'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'grep -q .*prometheus_exporter'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'HEAD /metrics HTTP/1\.0'
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '<>"?/dev/tcp'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '_watch_child "\$_child_pid" &'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '(?s)_watch_startup_grace_seconds=120.*_health_seen=0.*if \[ "\$_health_seen" -eq 1 \] \|\| \[ "\$_watch_runtime_seconds" -ge "\$_watch_startup_grace_seconds" \]'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'kill -TERM "\$_watched_pid"'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'kill -KILL "\$_watched_pid"'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'access-log and merged-metric export are unavailable; restarting in \$\{_backoff\}s'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: '_child_runtime_seconds=\$\(\( \$\(date \+%s\) - _child_started_epoch_seconds \)\)'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'if \[ "\$_child_runtime_seconds" -ge 60 \]; then\s+_backoff=1'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="vector")].args[0]
          pattern: 'if \[ "\$_backoff" -gt 30 \]; then _backoff=30; fi'

  - it: should give the haproxy container write access to the log socket
    template: haproxy-deployment.yaml
    asserts:
      # HAProxy is the datagram SENDER, so it needs the socket directory mounted
      # read-write; a datagram sender gets no error when the socket is missing.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vector-socket
            mountPath: /run/vector

  - it: should remove every trace of the sidecar when disabled
    template: haproxy-deployment.yaml
    set:
      vector.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: vector
          any: true

  - it: should declare the sizes exporter port alongside the primary one
    template: haproxy-deployment.yaml
    asserts:
      # prometheus-operator only builds targets from DECLARED container ports, so
      # an undeclared one is silently never scraped.
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].ports
          content:
            name: vector-metrics
            containerPort: 9598
            protocol: TCP
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].ports
          content:
            name: vector-sizes
            containerPort: 9599
            protocol: TCP

  - it: should omit the sizes port when no size family is enabled
    template: haproxy-deployment.yaml
    set:
      vector.requestMetrics.metrics.request_size: false
      vector.requestMetrics.metrics.response_size: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].ports
          content:
            name: vector-sizes
            containerPort: 9599
            protocol: TCP
      # The primary port is unaffected.
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="vector")].ports
          content:
            name: vector-metrics
            containerPort: 9598
            protocol: TCP

  - it: should let Prometheus reach the vector exporters in restrictive mode
    template: haproxy-networkpolicy.yaml
    set:
      haproxy.networkPolicy.allowExternal: false
      haproxy.networkPolicy.allowedSources:
        - podSelector:
            matchLabels:
              app: prometheus
    asserts:
      # HAProxy's exporter and vector's are separate targets on separate ports;
      # a policy that opens only 8404 silently loses every vector series.
      - contains:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          content:
            port: 9598
            protocol: TCP
      - contains:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          content:
            port: 9599
            protocol: TCP

  - it: should not open the sizes port when its exporter is not rendered
    template: haproxy-networkpolicy.yaml
    set:
      haproxy.networkPolicy.allowExternal: false
      haproxy.networkPolicy.allowedSources:
        - podSelector:
            matchLabels:
              app: prometheus
      vector.requestMetrics.enabled: false
    asserts:
      - contains:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          content:
            port: 9598
            protocol: TCP
      - notContains:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          content:
            port: 9599
            protocol: TCP

  - it: should open no vector port when the sidecar is off
    template: haproxy-networkpolicy.yaml
    set:
      haproxy.networkPolicy.allowExternal: false
      haproxy.networkPolicy.allowedSources:
        - podSelector:
            matchLabels:
              app: prometheus
      vector.enabled: false
    asserts:
      # stats + the agent's endpoint, which is always there.
      - lengthEqual:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          count: 2
      - notContains:
          path: spec.ingress[?(@.ports[0].port==8404)].ports
          content:
            port: 9598
            protocol: TCP
