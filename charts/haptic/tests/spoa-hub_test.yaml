# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: spoa-hub sidecar
templates:
  - haproxy-deployment.yaml
  - spoa-hub-configmap.yaml
  - haproxytemplateconfig.yaml
  - rate-limit-store-networkpolicy.yaml

tests:
  # Baseline: with the plugin-triggering libraries off, the spoa-hub sidecar
  # is not rendered. haproxy-ingress / nginx-ingress auto-enable coraza via
  # spoaHub.plugins.coraza.enabled's `or` predicate (the documented tradeoff
  # for path-scoped `haproxy-ingress.github.io/waf` to work without a second
  # toggle), and the gateway library (on by default) auto-enables the `mirror`
  # plugin so HTTPRoute RequestMirror filters work out of the box. The default
  # annotation library, hapticAnnotations (haproxy-haptic.org/*), does NOT
  # auto-enable any plugin — its waf/external-auth/mirror annotations require
  # the operator to enable the matching plugin explicitly — so a default install
  # renders a sidecar only via the gateway/mirror trigger. These baseline tests
  # pin the inverse: with haproxyIngress / nginxIngress / gateway all disabled,
  # no sidecar.
  - it: should render no spoa-hub sidecar when no plugin-triggering library is enabled
    template: haproxy-deployment.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spoa-socket
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spoa-hub-bootstrap
          any: true

  - it: should render no spoa-hub ConfigMap when no plugin-triggering library is enabled
    template: spoa-hub-configmap.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the spoa-hub sidecar when a plugin is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spoa-hub-bootstrap
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spoa-socket
          any: true

  - it: should mount the spoa-socket volume on the haproxy container when enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spoa-socket
            mountPath: /run/spoa
          any: true

  # ADR-0007 Step 2 (MR2): the bootstrap-copy from the spoa-hub
  # configmap into /etc/haproxy/general/spoa-hub-config.toml runs in
  # an initContainer rather than the haproxy main container's shell
  # init. K8s guarantees init containers complete before any regular
  # container starts, so the spoa-hub sidecar can't race the copy and
  # crash on a missing config file. HAPTIC's controller later
  # overwrites the file via the dataplane API; the hub's file-watch
  # picks up the change without a restart.
  - it: should add the bootstrap-copy initContainer when spoa-hub is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub-bootstrap-copy
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].volumeMounts
          content:
            name: general-storage
            mountPath: /etc/haproxy/general
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].volumeMounts
          content:
            name: spoa-hub-bootstrap
            mountPath: /etc/spoa-hub-bootstrap
            readOnly: true
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "spoa-hub-bootstrap-copy")].args[0]
          pattern: 'cp /etc/spoa-hub-bootstrap/config\.toml /etc/haproxy/general/spoa-hub-config\.toml'

  - it: should NOT add the bootstrap-copy initContainer when spoa-hub is disabled
    template: haproxy-deployment.yaml
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub-bootstrap-copy
          any: true

  - it: haproxy main container does NOT carry the bootstrap copy logic
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      # The bootstrap copy lives in the initContainer, not the
      # haproxy container's shell init. Keep this contract — moving
      # it back into the main container's args would re-introduce the
      # startup race Gitar caught on the first round of MR2.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'cp /etc/spoa-hub-bootstrap/config\.toml'
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spoa-hub-bootstrap
          any: true

  - it: should mount haproxy-runtime/general into the spoa-hub container
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].volumeMounts
          content:
            name: general-storage
            mountPath: /etc/haproxy/general
            readOnly: true
          any: true
      - notContains:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].volumeMounts
          content:
            name: spoa-hub-bootstrap
          any: true
      # The spoa-hub container MUST NOT mount haproxy-runtime — that
      # volume carries SSL private keys, ingress maps, and other
      # high-value content the hub has no business reading. The narrow
      # general-storage overlay above gives it just the config file.
      - notContains:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].volumeMounts
          content:
            name: haproxy-runtime
          any: true

  - it: should pass --config pointing at the shared volume to the spoa-hub binary
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].args[0]
          pattern: '/usr/local/bin/haproxy-spoa-hub --config /etc/haproxy/general/spoa-hub-config\.toml'

  - it: should render the spoa-hub ConfigMap when a plugin is enabled
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "fingerprinting"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "libfingerprinting_plugin\.so"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'messages = \["get-fingerprint"\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'ja4 = true'

  - it: should auto-enable Coraza when dispatch is default-on
    template: spoa-hub-configmap.yaml
    set:
      controller.templateLibraries.gateway.enabled: false
      controller.config.templatingSettings.extraContext.waf.dispatch.mode: default-on
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "coraza"'

  - it: should reject forcing Coraza off while dispatch is default-on
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.dispatch.mode: default-on
      spoaHub.plugins.coraza.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "The configured WAF dispatch/policy behavior requires spoaHub.plugins.coraza. Remove spoaHub.plugins.coraza.enabled=false, set waf.dispatch.mode=opt-in, or remove the WAF policy catalog."

  - it: should reject forcing Coraza off with only a ConfigMap policy catalog
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.policies.configMapRefs.security.namespace: security
      controller.config.templatingSettings.extraContext.waf.policies.configMapRefs.security.name: haptic-waf-policies
      controller.config.templatingSettings.extraContext.waf.policies.configMapRefs.security.key: policies.yaml
      spoaHub.plugins.coraza.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "The configured WAF dispatch/policy behavior requires spoaHub.plugins.coraza. Remove spoaHub.plugins.coraza.enabled=false, set waf.dispatch.mode=opt-in, or remove the WAF policy catalog."

  - it: should reject unknown Coraza dispatch fields
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.dispatch.mod: default-on
    asserts:
      - failedTemplate:
          errorPattern: "at '/controller/config/templatingSettings/extraContext/waf/dispatch': additional properties 'mod' not allowed"

  - it: should map the sso-auth plugin to its quirk lib filename
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.sso-auth.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "libhaproxy_spoa_hub_plugin_sso_auth\.so"'

  - it: should auto-enable the rate-limit plugin from rateLimit.shared.enabled
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "rate_limit"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'library = "librate_limit_plugin\.so"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'messages = \["check-ratelimit"\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'timeout_ms = 50'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_timeout_ms = 10'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'ttl_ms = 3600000'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'fail_open = true'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'invalid_rule_fail_open = false'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_failure_mode = "local"'

  - it: should configure the rate-limit plugin to fail closed when requested
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.failClosed: true
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'fail_open = false'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_failure_mode = "closed"'

  - it: should reject the former controller-owned shared rate-limit path
    template: haproxytemplateconfig.yaml
    set:
      controller.rateLimit.shared.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "controller.rateLimit has moved to the top-level rateLimit tree; use rateLimit.shared instead."

  - it: should fail shared rate-limit rendering without a shared store
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.enabled=true requires a shared store. Leave rateLimit.shared.managedStore.enabled=true for chart-managed HA Valkey, or set rateLimit.shared.externalStore.urls to bring your own Redis/Valkey."

  - it: should inject a single external store URL as store_url
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: false
      rateLimit.shared.externalStore.urls:
        - redis://my-valkey.my-namespace.svc:6379
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_url = "redis://my-valkey\.my-namespace\.svc:6379"'

  - it: should reject external store sharding as one failure domain
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: false
      rateLimit.shared.externalStore.urls:
        - redis://shard-a.svc:6379
        - redis://shard-b.svc:6379
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.externalStore.urls accepts one endpoint. Multiple URLs share one plugin circuit breaker, so one failed shard disables all shards. Use one HA Redis/Valkey/Sentinel/Cluster endpoint."

  - it: should reject an empty scalar in place of the external store URL list
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.externalStore.urls: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/rateLimit/shared/externalStore/urls': got string, want array"

  - it: should fail when the managed store and an external store are both configured
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      rateLimit.shared.externalStore.urls:
        - redis://my-valkey.my-namespace.svc:6379
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.managedStore.enabled=true and rateLimit.shared.externalStore.urls are mutually exclusive; disable the managed store to bring your own Redis/Valkey."

  - it: should fail when store_url is set manually in the rate-limit params scalar
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: false
      spoaHub.plugins.rate-limit.params: |
        store_url = "redis://my-valkey.my-namespace.svc:6379"
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define store_url or store_urls; rateLimit.shared.managedStore (chart-managed HA Valkey) or rateLimit.shared.externalStore.urls (bring your own store) is their single owner."

  - it: should fail shared rate-limit rendering when spoa-hub is forced off
    template: haproxytemplateconfig.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.enabled=true requires the spoaHub sidecar. Remove spoaHub.enabled=false or disable shared rate limiting."

  - it: should fail shared rate-limit rendering when the rate-limit plugin is forced off
    template: haproxytemplateconfig.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.enabled=true requires spoaHub.plugins.rate-limit to be enabled. Remove spoaHub.plugins.rate-limit.enabled=false or disable shared rate limiting."

  - it: should inject the chart-managed Valkey store_url into the rate-limit plugin
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_url = "redis-sentinel://.*haptic-rl-store-sentinel\.[^.]+\.svc:26379/0\?sentinelServiceName=haptic-rate-limit'

  - it: should reject managed Valkey eviction policies
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      rateLimit.shared.managedStore.maxMemoryPolicy: volatile-ttl
    asserts:
      - failedTemplate:
          errorMessage: "rateLimit.shared.managedStore.maxMemoryPolicy must be noeviction. Evicting a limiter key resets its budget; set maxMemoryPolicy: noeviction."

  - it: should render shared rate-limit timeout knobs
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      spoaHub.plugins.rate-limit.timeoutMs: 75
      spoaHub.plugins.rate-limit.storeOperationTimeoutMs: 20
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'timeout_ms = 75'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'store_timeout_ms = 20'

  - it: should prepend managed rate-limit params before user nested tables
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        [plugins.params.custom]
        enabled = true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?s)fail_open = true\ninvalid_rule_fail_open = false\nstore_failure_mode = "local"\nstore_timeout_ms = 10\nttl_ms = 3600000\nstore_url = .*\n\[plugins.params.custom\]'

  - it: should reject duplicate managed rate-limit fail-open params
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        fail_open = false
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define fail_open, store_failure_mode, or invalid_rule_fail_open. rateLimit.shared.failClosed owns store failures; malformed rules always deny."

  - it: should reject duplicate managed rate-limit store failure mode
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        store_failure_mode = "open"
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define fail_open, store_failure_mode, or invalid_rule_fail_open. rateLimit.shared.failClosed owns store failures; malformed rules always deny."

  - it: should reject duplicate managed rate-limit invalid-rule policy
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        invalid_rule_fail_open = true
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define fail_open, store_failure_mode, or invalid_rule_fail_open. rateLimit.shared.failClosed owns store failures; malformed rules always deny."

  - it: should reject duplicate managed rate-limit store timeout params
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        store_timeout_ms = 99
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define store_timeout_ms; spoaHub.plugins.rate-limit.storeOperationTimeoutMs is its single owner."

  - it: should reject duplicate managed rate-limit state TTL params
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      spoaHub.plugins.rate-limit.params: |
        ttl_ms = 60000
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.params must not define ttl_ms; the chart fixes it at the plugin's 3600000 ms maximum and the native annotation library validates its rules against that horizon."

  - it: should fail invalid shared rate-limit plugin timeout
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      spoaHub.plugins.rate-limit.timeoutMs: 0
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.timeoutMs must resolve to a positive integer milliseconds value."

  - it: should fail invalid shared rate-limit store timeout
    template: spoa-hub-configmap.yaml
    set:
      rateLimit.shared.enabled: true
      spoaHub.plugins.rate-limit.storeOperationTimeoutMs: "0"
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.rate-limit.storeOperationTimeoutMs must resolve to an integer greater than or equal to 1."

  - it: should render the managed rate-limit store NetworkPolicy
    template: rate-limit-store-networkpolicy.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: haptic-rate-limit-store
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 26379
            protocol: TCP
          any: true

  - it: should not render the managed rate-limit store NetworkPolicy when disabled
    template: rate-limit-store-networkpolicy.yaml
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      rateLimit.shared.managedStore.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should let spoaHub.enabled=false force the sidecar off even when a plugin is enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.enabled: false
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub
          any: true

  - it: should let spoaHub.enabled=true force the sidecar on with no plugin enabled
    template: haproxy-deployment.yaml
    set:
      spoaHub.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: spoa-hub
          any: true

  - it: should default the spoa-hub image tag to .Chart.AppVersion
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].image
          pattern: 'ghcr\.io/haproxy-haptic/haptic/spoa-hub:\d+\.\d+\.\d+'

  - it: should respect spoaHub.image.tag override
    template: haproxy-deployment.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.image.tag: "v0.9.9-test"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="spoa-hub")].image
          value: ghcr.io/haproxy-haptic/haptic/spoa-hub:v0.9.9-test

  - it: should render the SPOP listener with the configured socketPath
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'address = "/run/spoa/hub\.sock"'

  - it: should render multiple plugins in one ConfigMap
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.coraza.enabled: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "coraza"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'name = "fingerprinting"'

  - it: should not surface a spoaHub extraContext entry when no plugin-triggering library is enabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.templateLibraries.haproxyIngress.enabled: false
      controller.templateLibraries.nginxIngress.enabled: false
      controller.templateLibraries.gateway.enabled: false
    asserts:
      - isNull:
          path: spec.templatingSettings.extraContext.spoaHub

  - it: should surface spoaHub config under extraContext when a plugin is enabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.plugins.fingerprinting.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.enabled
          value: true
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.socketPath
          value: /run/spoa/hub.sock
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.modeSpop
          value: true
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messages
          content: get-fingerprint
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.mirror.targetTimeoutMs
          value: 2000
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.mirror.targetRetries
          value: 0

  - it: should surface an overridden bounded mirror target budget
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.plugins.mirror.targetTimeoutMs: 750
      spoaHub.plugins.mirror.targetRetries: 1
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.mirror.targetTimeoutMs
          value: 750
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.mirror.targetRetries
          value: 1

  - it: should reject an unbounded mirror target timeout
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.mirror.targetTimeoutMs: 60001
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.mirror.targetTimeoutMs must resolve to an integer between 1 and 60000."

  - it: should reject excessive mirror target retries
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.mirror.targetRetries: 11
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.mirror.targetRetries must resolve to an integer between 0 and 10."

  - it: should derive an independent HAProxy timeout for each SPOE message
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.plugins.sso-auth.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.timeoutProcessing
          value: 6100ms
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messageTimeouts["check-sso-auth"]
          value: 6100ms
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messageTimeouts.mirror
          value: 150ms

  - it: should accept an explicit HAProxy processing timeout above all plugin deadlines
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.plugins.sso-auth.enabled: true
      spoaHub.haproxy.timeoutProcessing: 7s
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.timeoutProcessing
          value: 7s
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messageTimeouts.mirror
          value: 7s

  - it: should reject an explicit HAProxy processing timeout below a plugin deadline
    template: haproxytemplateconfig.yaml
    set:
      spoaHub.plugins.sso-auth.enabled: true
      spoaHub.haproxy.timeoutProcessing: 500ms
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.haproxy.timeoutProcessing (500ms) must be at least the largest enabled SPOE message budget (6000ms) plus timeoutProcessingMarginMs (100ms). Lower the relevant plugin timeouts or raise the HAProxy processing timeout."

  - it: should sum plugin timeouts only when plugins share one SPOE message
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      controller.templateLibraries.gateway.enabled: false
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.fingerprinting.timeoutMs: 20
      spoaHub.plugins.fingerprinting.messages: [shared-check]
      spoaHub.plugins.maxmind.enabled: true
      spoaHub.plugins.maxmind.timeoutMs: 30
      spoaHub.plugins.maxmind.messages: [shared-check]
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.timeoutProcessing
          value: 150ms
      - equal:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messageTimeouts.shared-check
          value: 150ms

  - it: should reject zero hub worker threads instead of treating zero as unset
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.hub.workerThreads: 0
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.hub.workerThreads must be an integer greater than or equal to 1."

  - it: should reject zero maximum blocking threads instead of treating zero as unset
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.hub.maxBlockingThreads: 0
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.hub.maxBlockingThreads must be an integer greater than or equal to 1."

  - it: should render an explicit reload drain timeout including the documented zero opt-out
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.hub.reloadDrainTimeoutMs: 0
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'reload_drain_timeout_ms = 0'

  - it: should reject an explicit zero request inspection buffer
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled: true
      controller.config.templatingSettings.extraContext.requestBodyInspection.haproxyBuffer.sizeBytes: 0
    asserts:
      - failedTemplate:
          errorMessage: "controller.config.templatingSettings.extraContext.requestBodyInspection.haproxyBuffer.sizeBytes must be between 16384 and 2097152 bytes."

  - it: should reject an explicit zero custom-rule ingress limit
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.customRules.limits.maxIngresses: 0
    asserts:
      - failedTemplate:
          errorMessage: "controller.config.templatingSettings.extraContext.waf.customRules.limits.maxIngresses must be between 1 and 1024."

  - it: should reject a Coraza policy body default above the policy ceiling
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.policies.requestBody.defaultMaxBytes: 8193
      controller.config.templatingSettings.extraContext.waf.policies.requestBody.maxBytes: 8192
    asserts:
      - failedTemplate:
          errorMessage: "controller.config.templatingSettings.extraContext.waf.policies.requestBody.defaultMaxBytes must not exceed requestBody.maxBytes."

  # The unknown-ConfigMap-reference-field rejection is checked in
  # scripts/test-templates.sh (run_helm_failure_guard): helm-unittest's
  # per-leaf `set` merger cannot reliably build an array element carrying a
  # key absent from values.yaml, while Helm's real --set path preserves it.

  - it: should reject non-string inline Coraza policy descriptions
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.policies.inline.bad.description: 123
    asserts:
      - failedTemplate:
          errorMessage: "waf.policies.inline.bad.description must be a string."

  - it: should reject explicit zero inline policy body caps instead of applying the default
    template: haproxytemplateconfig.yaml
    set:
      controller.config.templatingSettings.extraContext.waf.policies.inline.bad.requestBody.mode: any
      controller.config.templatingSettings.extraContext.waf.policies.inline.bad.requestBody.maxBytes: "0"
    asserts:
      - failedTemplate:
          errorMessage: "waf.policies.inline.bad.requestBody.maxBytes must be between 1 and waf.policies.requestBody.maxBytes (8192)."

  - it: should inject API-gateway managed defaults even with custom params
    template: spoa-hub-configmap.yaml
    set:
      controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled: true
      controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.defaultFailOpen: true
      controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.requestBody.defaultMaxBytes: 4096
      spoaHub.plugins.api-gateway.params: |
        # custom plugin parameters remain after chart-owned defaults
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'default_fail_open = true'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'max_body_bytes = 4096'

  - it: should reject duplicate API-gateway managed params
    template: spoa-hub-configmap.yaml
    set:
      controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled: true
      spoaHub.plugins.api-gateway.params: |
        max_body_bytes = 999
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.api-gateway.params must not define default_fail_open or max_body_bytes; controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation is their single owner."

  - it: should reject duplicate Coraza directives ownership
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.coraza.enabled: true
      spoaHub.plugins.coraza.params: |
        directives = "SecRuleEngine Off"
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.coraza.params must not define directives; spoaHub.plugins.coraza.directives is its single owner."

  - it: should derive Coraza request limits from the shared HAProxy body capacity
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.coraza.enabled: true
      controller.config.templatingSettings.extraContext.requestBodyInspection.haproxyBuffer.sizeBytes: 32768
      controller.config.templatingSettings.extraContext.requestBodyInspection.haproxyBuffer.reservedBytes: 8192
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'request_body_limit = 24576'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'request_body_in_memory_limit = 24576'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'response_check = false'

  - it: should reject manual Coraza body-contract params
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.coraza.enabled: true
      spoaHub.plugins.coraza.params: |
        response_check = true
    asserts:
      - failedTemplate:
          errorMessage: "spoaHub.plugins.coraza.params must not define request_body_limit, request_body_in_memory_limit, response_body_limit, or response_check. The chart derives request limits from controller.config.templatingSettings.extraContext.requestBodyInspection.haproxyBuffer and disables unsupported response-body inspection."

  - it: should reject mirror message slots under plugin runtime settings
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.mirror.minMessageSlots: 8
    asserts:
      - failedTemplate:
          errorPattern: "at '/spoaHub/plugins/mirror': additional properties 'minMessageSlots' not allowed"

  - it: should reject the removed spoaHub.haproxy.mirror field
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.haproxy.mirror.minMessageSlots: 4
    asserts:
      - failedTemplate:
          errorPattern: "at '/spoaHub/haproxy': additional properties 'mirror' not allowed"

  - it: should surface shared rate-limit extraContext and store params
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.rateLimit.shared.enabled
          value: true
      - equal:
          path: spec.templatingSettings.extraContext.rateLimit.shared.managedStore.enabled
          value: true
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messages
          content: check-ratelimit
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.plugins[?(@.name == "rate_limit")].params
          pattern: 'store_url = "redis-sentinel://.*haptic-rl-store-sentinel\.[^.]+\.svc:26379/0\?sentinelServiceName=haptic-rate-limit'
      - matchRegex:
          path: spec.templatingSettings.extraContext.spoaHub.plugins[?(@.name == "rate_limit")].params
          pattern: 'store_timeout_ms = 10'

  - it: should allow disabling the managed rate-limit store PodDisruptionBudget
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      rateLimit.shared.enabled: true
      rateLimit.shared.managedStore.enabled: true
      rateLimit.shared.managedStore.podDisruptionBudget.enabled: false
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.rateLimit.shared.managedStore.podDisruptionBudget.enabled
          value: false

  - it: should union messages from multiple enabled plugins in extraContext
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.coraza.enabled: true
    asserts:
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messages
          content: get-fingerprint
      - contains:
          path: spec.templatingSettings.extraContext.spoaHub.haproxy.messages
          content: check-request

  - it: should preserve a user-supplied params blob verbatim
    template: spoa-hub-configmap.yaml
    set:
      spoaHub.plugins.fingerprinting.enabled: true
      spoaHub.plugins.fingerprinting.params: |
        # this is a user comment
        sort_extensions = false
        ja4 = false
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '# this is a user comment'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'sort_extensions = false'
