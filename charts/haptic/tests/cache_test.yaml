# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: shared Varnish cache tier
templates:
  - haproxytemplateconfig.yaml
  - haproxy-networkpolicy.yaml
  - role.yaml
  - varnish-networkpolicy.yaml

tests:
  - it: should select the bundled Varnish image for the chart version
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
    chart:
      appVersion: test-version
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.image
          value: ghcr.io/haproxy-haptic/haptic/varnish:test-version

  - it: should keep the chart version out of the config while Varnish is disabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    chart:
      appVersion: test-version
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.image
          value: ""

  - it: should validate Varnish with the deployed chart image when enabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config-http-policies
    set:
      cache.varnish.enabled: true
    chart:
      appVersion: test-version
    asserts:
      - equal:
          path: spec.validationTests._global.extraContext.cache.varnish.image
          value: ghcr.io/haproxy-haptic/haptic/varnish:test-version

  - it: should validate an explicit Varnish image even while staging the disabled cache
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config-http-policies
    set:
      cache.varnish.image: example.invalid/cache@sha256:abc
    asserts:
      - equal:
          path: spec.validationTests._global.extraContext.cache.varnish.image
          value: example.invalid/cache@sha256:abc

  - it: should give disabled-cache fixtures a released image independent of the chart version
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config-http-policies
    chart:
      appVersion: test-version
    asserts:
      - equal:
          path: spec.validationTests._global.extraContext.cache.varnish.image
          value: ghcr.io/haproxy-haptic/haptic/varnish:0.6.0

  - it: should preserve an explicit Varnish image
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
      cache.varnish.image: example.invalid/cache@sha256:abc
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.image
          value: example.invalid/cache@sha256:abc

  - it: should reject an unsupported memory-lock capability setting
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.lockSharedMemory: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/cache/varnish': additional properties 'lockSharedMemory' not allowed"

  - it: should reject the former controller-owned cache path
    template: haproxytemplateconfig.yaml
    set:
      controller.cache.varnish.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "controller.cache has moved to the top-level cache tree; use cache.varnish instead."

  - it: should reject HAProxy balancing settings under the Varnish workload
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.hashBalanceFactor: 175
    asserts:
      - failedTemplate:
          errorMessage: "cache.varnish.hashBalanceFactor has moved to cache.haproxy.hashBalanceFactor because HAProxy, not Varnish, consumes it."

  - it: should surface HAProxy-owned cache balancing from the canonical path
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
      cache.haproxy.hashBalanceFactor: 175
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.haproxy.hashBalanceFactor
          value: 175

  - it: should surface the Varnish response deadline from the canonical path
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
      cache.haproxy.responseTimeoutMs: 1250
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.haproxy.responseTimeoutMs
          value: 1250

  - it: should reject a non-positive Varnish response deadline
    template: haproxytemplateconfig.yaml
    set:
      cache.haproxy.responseTimeoutMs: 0
    asserts:
      - failedTemplate:
          errorMessage: "cache.haproxy.responseTimeoutMs must be a positive integer in milliseconds."

  - it: should reject unknown staged cache fields while disabled
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.autoscaling.scaleDownStabilisationSeconds: 60
    asserts:
      - failedTemplate:
          errorPattern: "at '/cache/varnish/autoscaling': additional properties 'scaleDownStabilisationSeconds' not allowed"

  - it: should reject an invalid staged Varnish pull policy while disabled
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.imagePullPolicy: Sometimes
    asserts:
      - failedTemplate:
          errorPattern: "at '/cache/varnish/imagePullPolicy': value must be one of 'Always', 'IfNotPresent', 'Never'"

  - it: should reject a disruption budget that permits every minimum replica to disappear
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.replicas: 1
    asserts:
      - failedTemplate:
          errorMessage: "cache.varnish.podDisruptionBudget.maxUnavailable must be smaller than the minimum Varnish replica count, so voluntary disruptions preserve at least one cache shard."

  - it: should reject an impossible autoscaling range
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.autoscaling.minReplicas: 4
      cache.varnish.autoscaling.maxReplicas: 3
    asserts:
      - failedTemplate:
          errorMessage: "cache.varnish.autoscaling.maxReplicas must be greater than or equal to minReplicas."

  - it: should not render Varnish isolation while the cache tier is disabled
    template: varnish-networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should isolate Varnish by default when the cache tier is enabled
    template: varnish-networkpolicy.yaml
    set:
      cache.varnish.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: haptic-varnish-cache
      - matchRegex:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          pattern: ".+-varnish-cache$"
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 6081
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: haptic
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: loadbalancer
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - equal:
          path: spec.egress[1].ports[0].port
          value: 8090
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: haptic
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: loadbalancer

  - it: should keep the release-scoped Varnish name within DNS label limits
    template: varnish-networkpolicy.yaml
    release:
      name: haptic-release-abcdefghijklmnopqrstuvwxyz-123456789
    set:
      cache.varnish.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"

  - it: should allow disabling Varnish isolation explicitly
    template: varnish-networkpolicy.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should keep default-true Varnish isolation for a null block
    template: varnish-networkpolicy.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.networkPolicy: null
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: should admit release-scoped Varnish loopback traffic in restrictive HAProxy mode
    template: haproxy-networkpolicy.yaml
    set:
      cache.varnish.enabled: true
      haproxy.networkPolicy.allowExternal: false
      haproxy.networkPolicy.allowedSources:
        - ipBlock:
            cidr: 192.0.2.0/24
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
              - port: 8090
                protocol: TCP
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: haptic-varnish-cache
                    app.kubernetes.io/instance: RELEASE-NAME-haptic-varnish-cache

  - it: should expose the dedicated backend-fetch port + origin Service to extraContext
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.loopbackPort
          value: 8090
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.originServiceName
          value: haptic-cache-origin

  - it: should reject a cache tier without the chart-managed HAProxy origin
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.enabled: true
      haproxy.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "cache.varnish.enabled=true requires the chart-managed HAProxy workload (haproxy.enabled=true): Varnish fetches cache misses from a dedicated backend-fetch frontend on the HAProxy pods."

  - it: should reject an invalid dedicated backend-fetch port
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.loopbackPort: 0
    asserts:
      - failedTemplate:
          errorMessage: cache.varnish.loopbackPort must be a port between 1 and 65535.

  - it: should reject a loopback port that collides with a static HAProxy port
    template: haproxytemplateconfig.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.loopbackPort: 8404
    asserts:
      - failedTemplate:
          errorMessage: "cache.varnish.loopbackPort 8404 collides with an existing HAProxy/controller port (http/https/stats/dataplane/agentMetrics/healthz/metrics/proxy-protocol); choose a free port for the dedicated Varnish backend-fetch frontend."

  - it: should surface the default Varnish disruption budget in extraContext
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.podDisruptionBudget.enabled
          value: true
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.podDisruptionBudget.maxUnavailable
          value: 1

  - it: should allow disabling the Varnish disruption budget
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config
    set:
      cache.varnish.enabled: true
      cache.varnish.podDisruptionBudget.enabled: false
    asserts:
      - equal:
          path: spec.templatingSettings.extraContext.cache.varnish.podDisruptionBudget.enabled
          value: false

  - it: should omit the combined cache and rate-limit validation when cache is disabled
    template: haproxytemplateconfig.yaml
    set:
      rateLimit.shared.enabled: true
    asserts:
      - notExists:
          path: spec.validationTests.test-haptic-cache-shared-rate-limit-loopback

  - it: should include the combined cache and rate-limit validation when both are enabled
    template: haproxytemplateconfig.yaml
    documentSelector:
      path: metadata.name
      value: haptic-config-haptic-annotations
    set:
      cache.varnish.enabled: true
      rateLimit.shared.enabled: true
    asserts:
      - exists:
          path: spec.validationTests.test-haptic-cache-shared-rate-limit-loopback

  - it: should keep default-true Varnish disruption budget RBAC for a null block
    template: role.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.podDisruptionBudget: null
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: should grant PodDisruptionBudget access when the Varnish budget is enabled
    template: role.yaml
    set:
      cache.varnish.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: should not grant PodDisruptionBudget access when auxiliary budgets are disabled
    template: role.yaml
    set:
      cache.varnish.enabled: true
      cache.varnish.podDisruptionBudget.enabled: false
      rateLimit.shared.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
