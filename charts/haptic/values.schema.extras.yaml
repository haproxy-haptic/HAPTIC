# Schema-only input to values.schema.json (`make chart-schema`); Helm never reads
# this file. It declares the keys values.yaml cannot carry as defaults:
#   - optional keys that stay unset unless an operator sets them,
#   - value namespaces Helm itself adds to the parent's values,
#   - removed keys, typed `anyOf: [{}]` so the schema lets them through to the
#     chart's migration guard, which names the replacement.

# One namespace per Chart.yaml dependency: Helm coalesces each enabled
# subchart's values, plus `global`, into the parent's values before validation.
helm-helpers:
  global: {}  # @schema additionalProperties: true
base:
  global: {}  # @schema additionalProperties: true
kubernetes-backends:
  global: {}  # @schema additionalProperties: true
ssl:
  global: {}  # @schema additionalProperties: true
ingress:
  global: {}  # @schema additionalProperties: true
ingress-annotations-compat:
  global: {}  # @schema additionalProperties: true
governance:
  global: {}  # @schema additionalProperties: true
spoa-hub:
  global: {}  # @schema additionalProperties: true
http-policies:
  global: {}  # @schema additionalProperties: true
gateway:
  global: {}  # @schema additionalProperties: true
gateway-policies:
  global: {}  # @schema additionalProperties: true
haptic-annotations:
  global: {}  # @schema additionalProperties: true
haproxytech:
  global: {}  # @schema additionalProperties: true
haproxy-ingress:
  global: {}  # @schema additionalProperties: true
nginx-ingress:
  global: {}  # @schema additionalProperties: true
custom-crd-example:
  global: {}  # @schema additionalProperties: true

