controller:
  crdName: null  # @schema anyOf: [{}]; description: Renamed to controller.configName.
  debugPort: null  # @schema anyOf: [{}]; description: Removed, use controller.ports.healthz.
  statusPatches: null  # @schema anyOf: [{}]; description: Moved to controller.config.templatingSettings.extraContext.statusPatches.
  apiGateway: null  # @schema anyOf: [{}]; description: Moved to controller.config.templatingSettings.extraContext.apiGateway.
  cache: null  # @schema anyOf: [{}]; description: Moved to the top-level cache tree.
  rateLimit: null  # @schema anyOf: [{}]; description: Moved to the top-level rateLimit tree.
  defaultSSLCertificate: null  # @schema anyOf: [{}]; description: Moved to the top-level defaultSSLCertificate tree.
  autoscaling:
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 1  # @schema type: [integer, string]
  webhook:
    certManager:
      issuerRef:
        group: cert-manager.io
  config:
    includeMigrationCoverage: null  # @schema anyOf: [{}]; description: Removed, migration coverage is no longer a CRD field.
    migrationCoverage: null  # @schema anyOf: [{}]; description: Removed, migration coverage is no longer a CRD field.
    routing: null  # @schema anyOf: [{}]; description: Moved to controller.config.templatingSettings.extraContext.routing.
    # The remaining HAProxyTemplateConfig spec fields an operator may seed.
    logging:
      level: DEBUG
    templateSnippets: {}  # @schema additionalProperties: true
    maps: {}  # @schema additionalProperties: true
    files: {}  # @schema additionalProperties: true
    sslCertificates: {}  # @schema additionalProperties: true
    k8sResources: {}  # @schema additionalProperties: true
    haproxyConfig: {}  # @schema additionalProperties: true
    validationTests: {}  # @schema additionalProperties: true
    validators: []  # @schema item: object
    credentialsSecretRef:
      namespace: ""
    controller:
      healthzPort: null  # @schema anyOf: [{}]; description: Removed, use controller.ports.healthz.
      metricsPort: null  # @schema anyOf: [{}]; description: Removed, use controller.ports.metrics.
      configPublishing:
        compressionThreshold: 0
    dataplane:
      port: null  # @schema anyOf: [{}]; description: Removed, haproxy.ports.dataplane is the single source.
      configPublishInterval: 10s
      secretsDir: /etc/haproxy/secrets
      deploymentTimeout: 30s
      reloadVerificationTimeout: 10s
      syncTimeout: 2m
    templatingSettings:
      testExtraContext: {}  # @schema additionalProperties: true
      extraContext:
        tls:
          # Defaults live in the ssl library's extraContext.
          ciphers: ""
          ciphersuites: ""
          minVersion: ""
          defaultCertificate: null  # @schema anyOf: [{}]; description: Chart-managed, set the top-level defaultSSLCertificate values.
        tracing:
          otlp:
            clusterName: ""
        accessLog:
          # Keyed by target name.
          targets:  # @schema mergeProperties
            example:
              address: stdout
              format: raw  # @schema enum: [raw, rfc3164, rfc5424, local, priority, short, timed, iso]
              facility: local0  # @schema enum: [kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron, auth2, ftp, ntp, audit, alert, cron2, local0, local1, local2, local3, local4, local5, local6, local7]
              level: info
              ring:
                name: accesslog
                address: 127.0.0.1:6514
                size: 65536
                logProto: legacy  # @schema enum: [legacy, octet-count]
                connectTimeout: 5s  # @schema type: [string, integer]
                serverTimeout: 10s  # @schema type: [string, integer]
                serverOptions: ""
        prometheusExporter:
          excludeMetrics:  # @schema mergeProperties
            example:
              pattern: null  # @schema anyOf: [{}]; description: Removed, HAProxy filters by exact name, list the families instead.

haproxy:
  dataplane: null  # @schema anyOf: [{}]; description: The Dataplane API sidecar is now the HAPTIC agent, configured under haproxy.agent.
  dataplaneBin: null  # @schema anyOf: [{}]; description: Removed, the agent runs from controller.image.
  enterprise:
    version: null  # @schema anyOf: [{}]; description: Removed, haproxyVersion selects the image series.
  # Unset derives nbthread from the CPU limit; supports tpl.
  nbthread: 4  # @schema type: [integer, string]
  shmStats:
    shmSizeLimit: 256Mi

cache:
  varnish:
    hashBalanceFactor: null  # @schema anyOf: [{}]; description: Moved to cache.haproxy.hashBalanceFactor.

rateLimit:
  shared:
    managedStore:
      maxmemory: null  # @schema anyOf: [{}]; description: Renamed to maxMemory.
      maxmemoryPolicy: null  # @schema anyOf: [{}]; description: Renamed to maxMemoryPolicy.

defaultSSLCertificate:
