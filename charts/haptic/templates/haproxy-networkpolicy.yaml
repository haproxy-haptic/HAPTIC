{{- $haproxy := .Values.haproxy }}
{{- $np := $haproxy.networkPolicy }}
{{- if and $haproxy.enabled $np.enabled }}
{{- $ports := $haproxy.ports }}
{{- $proxyProtocol := include "haptic.proxyProtocol" . | fromYaml }}
{{- $http3 := include "haptic.http3" . | fromYaml }}
{{- $name := include "haptic.name" . }}
{{- /*
  Validate configuration to prevent deny-all scenarios
*/ -}}
{{- if and (not $np.allowExternal) (not $np.allowedSources) }}
  {{- fail "haproxy.networkPolicy.allowExternal is false but haproxy.networkPolicy.allowedSources is empty. This would create a deny-all policy. Either set allowExternal: true or provide allowedSources." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "haptic.haproxyFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: loadbalancer
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ $name }}

  policyTypes:
    - Ingress
    - Egress

  # Ingress rules - what can access HAProxy
  ingress:
    {{- if $np.allowExternal }}
    # Permissive mode: allow ALL TCP traffic from anywhere. The chart
    # already declares the workload as externally reachable; restricting
    # by port adds no security and would block dynamic Gateway-listener
    # ports added by the controller via partial-SSA on the Service. This
    # rule covers the static http/https/stats ports plus any
    # gw-<port>-<proto> entries the gateway library writes onto
    # haptic-haproxy.
    {{- $fenced := list (printf "%05d" (int $ports.dataplane)) }}
    {{- if .Values.cache.varnish.enabled }}
    {{- $fenced = append $fenced (printf "%05d" (int (.Values.cache.varnish.loopbackPort | default 8090))) }}
    {{- end }}
    # Carved out below: the internal ports whose own rule further down names a
    # single allowed client. NetworkPolicy rules are additive, so matching them
    # here would union with those rules and re-open the ports cluster-wide.
    - ports:
        {{- $next := 1 }}
        {{- range $padded := ($fenced | uniq | sortAlpha) }}
        {{- /* atoi, not int: int parses the zero-padded string as octal. */ -}}
        {{- $port := atoi $padded }}
        {{- if gt $port $next }}
        - protocol: TCP
          port: {{ $next }}
          endPort: {{ sub $port 1 }}
        {{- end }}
        {{- $next = int (add $port 1) }}
        {{- end }}
        {{- if le $next 65535 }}
        - protocol: TCP
          port: {{ $next }}
          endPort: 65535
        {{- end }}
        {{- if $http3.enabled }}
        # QUIC on every HTTPS listener port, Gateway-derived ones included.
        - protocol: UDP
        {{- end }}
    {{- else }}
    # Restrictive mode: explicit port + source allowlist.
    - ports:
        - port: {{ $ports.http }}
          protocol: TCP
        - port: {{ $ports.https }}
          protocol: TCP
        {{- if $http3.enabled }}
        - port: {{ $ports.https }}
          protocol: UDP
        {{- end }}
        {{- if $proxyProtocol.enabled }}
        - port: {{ int $proxyProtocol.httpPort }}
          protocol: TCP
        - port: {{ int $proxyProtocol.httpsPort }}
          protocol: TCP
        {{- end }}
      from:
        {{- with $np.allowedSources }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    # HAProxy's exporter (stats), the agent's, plus the vector exporters:
    # separate targets on separate ports, so opening `stats` alone silently
    # loses every agent and vector series.
    - ports:
        - port: {{ $ports.stats }}
          protocol: TCP
        - port: {{ $ports.agentMetrics }}
          protocol: TCP
        {{- if .Values.vector.enabled }}
        - port: {{ .Values.vector.metricsPort | int }}
          protocol: TCP
        {{- if include "haptic.vector.sizeExporterEnabled" . }}
        - port: {{ .Values.vector.sizeMetricsPort | int }}
          protocol: TCP
        {{- end }}
        {{- end }}
      from:
        {{- with $np.allowedSources }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        # Default to same-namespace when no sources specified
        - podSelector: {}
        {{- end }}
    {{- end }}

    {{- if .Values.cache.varnish.enabled }}
    # Varnish fetches cache misses from HAProxy's DEDICATED backend-fetch port
    # (the client-facing filter chain is absent there), so this is the boundary
    # that keeps that port a trusted, Varnish-only internal origin. Only the
    # release's Varnish pods may reach it; the Varnish policy independently
    # limits egress to the same destination.
    - ports:
        - port: {{ .Values.cache.varnish.loopbackPort | default 8090 }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: haptic-varnish-cache
              app.kubernetes.io/instance: {{ include "haptic.varnish.cacheName" . }}
    {{- end }}

    # Allow HAPTIC agent access from the controller. The agent's metrics port
    # is deliberately NOT here: Prometheus scrapes it, so it rides the
    # metrics rule above.
    - ports:
        - port: {{ $ports.dataplane }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ $name }}

    {{- with $np.extraIngress }}
    # Additional custom ingress rules
    {{- toYaml . | nindent 4 }}
    {{- end }}

  # Egress rules - what HAProxy can access
  egress:
    # Allow DNS resolution (required for service discovery)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HAProxy to connect to backend services in any namespace
    # This is required for proxying traffic and performing health checks
    # Uses AND logic: pods in any namespace (not all pods everywhere)
    - to:
        - namespaceSelector: {}
          podSelector: {}

    {{- with $np.extraEgress }}
    # Additional custom egress rules
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
