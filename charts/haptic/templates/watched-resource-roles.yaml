{{- if .Values.controller.rbac.create }}
{{- /* One Role and RoleBinding per namespace a watch is limited to. The
       ClusterRole omits these watches, so the controller can read them only here. */ -}}
{{- $scoped := include "haptic.scopedWatches" . | fromYaml }}
{{- $name := printf "%s-watch" (include "haptic.clusterScopedFullname" .) | trunc 63 | trimSuffix "-" }}
{{- range $namespace := keys $scoped | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "haptic.labels" $ | nindent 4 }}
rules:
  {{- include "haptic.watchedResourceRules" (index $scoped $namespace) | trim | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "haptic.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "haptic.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
