{{- $gd := .Values.controller.monitoring.grafanaDashboard }}
{{- if $gd.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "haptic.fullname" . }}-grafana-dashboard
  namespace: {{ $gd.namespace | default .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    {{- with $gd.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $gd.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{- if $gd.useBuiltIn }}
  haptic.json: |-
{{ .Files.Get "dashboards/haptic-controller.json" | indent 4 }}
  haptic-traffic.json: |-
{{ .Files.Get "dashboards/haptic-traffic.json" | indent 4 }}
  {{- else }}
  haptic.json: |
{{ $gd.customDashboard | toJson | indent 4 }}
  {{- end }}
{{- end }}
