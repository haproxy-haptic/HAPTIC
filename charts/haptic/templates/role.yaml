{{- if .Values.controller.rbac.create }}
{{- $cachePDB := .Values.cache.varnish.podDisruptionBudget | default dict }}
{{- $cachePDBEnabled := true }}
{{- if hasKey $cachePDB "enabled" }}
  {{- $cachePDBEnabled = $cachePDB.enabled }}
{{- end }}
{{- $ratePDB := .Values.rateLimit.shared.managedStore.podDisruptionBudget | default dict }}
{{- $ratePDBEnabled := true }}
{{- if hasKey $ratePDB "enabled" }}
  {{- $ratePDBEnabled = $ratePDB.enabled }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "haptic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
rules:
  # HAProxy pods (namespace-scoped). The auto-injected haproxy-pods watcher is
  # pinned to the controller's own namespace (resourcewatcher determineNamespace),
  # so this stays a Role — a cluster-wide grant would be privilege the watcher
  # never exercises. Keep it namespace-scoped if you touch it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Secrets (namespace-scoped)
  # - Credentials: HAPTIC agent credentials (read-only)
  # - SSL Certificates: Published as Secrets for HAProxy runtime config (read-write)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election and retained-state Leases both live in POD_NAMESPACE.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # HAProxyTemplateConfig and the HAProxyTemplateLibrary snippets it references,
  # both watched in the controller's own namespace (k8sClient.Namespace()).
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxytemplateconfigs", "haproxytemplatelibraries"]
    verbs: ["get", "list", "watch"]
  # Stamp the config as owner of the libraries it references, so resource-tree
  # views show the relationship. The chart cannot: an ownerReference needs the
  # owner's UID, which does not exist until the config is applied.
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxytemplatelibraries"]
    verbs: ["patch"]
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxytemplateconfigs/status"]
    verbs: ["update", "patch"]
  # Output CRDs published to the controller's own namespace: the rendered config
  # (HAProxyCfg) and its auxiliary map/general/crt-list file children.
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs", "haproxygeneralfiles", "haproxycrtlistfiles", "haproxymapfiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["haproxy-haptic.org"]
    resources: ["haproxycfgs/status", "haproxygeneralfiles/status", "haproxycrtlistfiles/status", "haproxymapfiles/status"]
    verbs: ["update", "patch"]
  # Services (namespace-scoped — tightens blast radius)
  #
  # Templates that declare Kubernetes resources via the renderResource()
  # template function need RBAC on those resource types. The
  # GatewayStaticAddresses feature spawns one LoadBalancer Service per
  # Gateway with spec.addresses[] in *this* (controller) namespace, with
  # spec.loadBalancerIP plumbed from the Gateway's spec.addresses[].value.
  # Same pattern every other Gateway API implementation uses
  # (envoy-gateway, cilium, istio, NGF) — but scoped to the controller's
  # namespace via Role (not ClusterRole) so a misbehaving template can't
  # escalate beyond the controller's own namespace, even if the
  # in-process RestrictToOwnNamespace guard in resourceapplier were
  # somehow bypassed.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.cache.varnish.enabled }}
  # Shared-cache (Varnish) tier: the haptic-annotations library's k8sResources
  # emit a VCL ConfigMap into the controller's own namespace, applied via SSA by
  # the resource applier. SSA needs patch (with create for first apply); delete
  # covers orphan cleanup when the tier is disabled.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if or .Values.cache.varnish.enabled (and .Values.rateLimit.shared.enabled .Values.rateLimit.shared.managedStore.enabled) }}
  # Template-owned auxiliary workloads: Varnish emits a StatefulSet or
  # Deployment, and shared rate limiting emits a Valkey StatefulSet.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if or (and .Values.cache.varnish.enabled $cachePDBEnabled) (and .Values.rateLimit.shared.enabled .Values.rateLimit.shared.managedStore.enabled $ratePDBEnabled) }}
  # Template-owned auxiliary workloads can emit PodDisruptionBudgets alongside
  # their Varnish or Sentinel-managed Valkey workloads.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.cache.varnish.enabled }}
  {{- if .Values.cache.varnish.autoscaling.enabled }}
  # The cache tier's HPA is applied via SSA when autoscaling is enabled.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- end }}
{{- end }}
