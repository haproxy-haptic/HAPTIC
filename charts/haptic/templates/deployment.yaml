{{- include "haptic.agentTLS.validate" . -}}
{{- $controller := .Values.controller }}
{{- $podSpec := $controller.podSpec }}
{{- $ports := $controller.ports }}
{{- $webhookEnabled := .Values.controller.webhook.enabled }}
{{- $webhookSecretName := include "haptic.webhook.secretName" . }}
{{- $webhookResourceTimeoutSeconds := include "haptic.webhook.resourceTimeoutSeconds" . | int }}
{{- $validatorsEnabled := include "haptic.validators.enabled" . }}
{{- $validators := $controller.validators }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haptic.controllerFullname" . }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
  {{- if or $controller.deploymentAnnotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $controller.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not $controller.autoscaling.enabled }}
  replicas: {{ $controller.replicaCount }}
  {{- end }}
  {{- with $controller.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ $controller.minReadySeconds }}
  revisionHistoryLimit: {{ $controller.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "haptic.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "haptic.dataplane.credentialsChecksum" . }}
        {{- if $validatorsEnabled }}
        {{- /* The validators sidecar reads its plugin set only at start. */}}
        checksum/spoa-hub-config: {{ include "haptic.spoaHub.bootstrapConfigContent" . | sha256sum }}
        {{- end }}
        {{- with $podSpec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "haptic.stableLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: controller
        {{- with $podSpec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "haptic.serviceAccountName" . }}
      {{- include "haptic.podSpec" $podSpec | nindent 6 }}
      {{- with $podSpec.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $controller.initContainers $validatorsEnabled }}
      initContainers:
        {{- with $controller.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $validatorsEnabled }}
        # Start reconciliation only after the external validator can accept requests.
        - name: validators
          restartPolicy: Always
          image: {{ include "haptic.spoaHub.image" . }}
          imagePullPolicy: {{ .Values.spoaHub.image.pullPolicy }}
          env:
            {{- include "haptic.spoaHub.goRuntimeEnv" (dict "root" $ "resources" $validators.resources) | nindent 12 }}
          args:
            - --config
            - /etc/haproxy-spoa-hub/config.toml
            - --validate-socket
            - {{ include "haptic.validators.socketPath" . }}
          securityContext:
            {{- toYaml $validators.securityContext | nindent 12 }}
          resources:
            {{- toYaml $validators.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - test
                - -S
                - {{ include "haptic.validators.socketPath" . }}
            periodSeconds: 1
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -S
                - {{ include "haptic.validators.socketPath" . }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - test
                - -S
                - {{ include "haptic.validators.socketPath" . }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: validators-config
              mountPath: /etc/haproxy-spoa-hub/config.toml
              subPath: config.toml
              readOnly: true
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            # Coraza's filesystem probe needs writable /tmp with a read-only root filesystem.
            - name: validators-tmp
              mountPath: /tmp
            {{- with $validators.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: controller
          {{- with $controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "haptic.controller.image" . | quote }}
          imagePullPolicy: {{ $controller.image.pullPolicy }}
          command: ["/usr/local/bin/haptic"]
          args: ["run"]
          ports:
            {{- range $name := list "healthz" "metrics" }}
            {{- if gt (int (index $ports $name)) 0 }}
            - name: {{ $name }}
              containerPort: {{ index $ports $name }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook
              containerPort: {{ $ports.webhook }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $env := list (dict "name" "POD_NAME" "field" "metadata.name") (dict "name" "POD_NAMESPACE" "field" "metadata.namespace") }}
            - name: {{ $env.name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $env.field }}
            {{- end }}
            - name: CRD_NAME
              {{- /* One name. Which snippets it pulls in, and in what order,
                     is declared in that object's spec.libraryRefs — so there
                     is no second list here that could disagree with it. */}}
              value: {{ .Values.controller.configName | quote }}
            - name: CONTROLLER_POD_SELECTOR
              {{- $selector := list }}
              {{- range $key, $value := include "haptic.controller.selectorLabels" . | fromYaml }}
              {{- $selector = append $selector (printf "%s=%s" $key $value) }}
              {{- end }}
              value: {{ join "," $selector | quote }}
            - name: SECRET_NAME
              value: {{ include "haptic.dataplane.credentialsSecretName" . }}
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "haptic.webhook.serviceName" . }}
            - name: DEBUG_PORT
              value: {{ $ports.healthz | quote }}
            - name: METRICS_PORT
              value: {{ $ports.metrics | quote }}
            {{- with $controller.startupProbe }}
            {{- if .enabled }}
            {{- /* The load-path validationTests run before the startup probe can pass; leave a fifth of the window for the rest of startup. */}}
            - name: LOAD_GATE_TIMEOUT
              value: {{ printf "%ds" (div (mul (add (int .initialDelaySeconds) (mul (int .failureThreshold) (int .periodSeconds))) 4) 5) | quote }}
            {{- end }}
            {{- end }}
            {{- with $controller.kubeClient }}
            - name: KUBE_CLIENT_QPS
              value: {{ .qps | quote }}
            - name: KUBE_CLIENT_BURST
              value: {{ .burst | int64 | quote }}
            {{- end }}
            {{- with $controller.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if $webhookEnabled }}
            - name: WEBHOOK_PORT
              value: {{ $ports.webhook | quote }}
            - name: WEBHOOK_CERT_DIR
              value: /etc/webhook/certs
            - name: WEBHOOK_RESOURCE_ADMISSION_TIMEOUT
              value: {{ printf "%ds" (sub $webhookResourceTimeoutSeconds 1) | quote }}
            {{- end }}
            {{- with $controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.haproxy.agent.tls.enabled }}
            - name: AGENT_TLS_DIR
              value: /etc/haptic/agent-tls/..data
            - name: AGENT_TLS_SERVER_NAME
              value: {{ include "haptic.agentTLS.serverName" . | quote }}
            {{- end }}
          {{- $startupProbe := $controller.startupProbe }}
          {{- if $startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit $startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- with $controller.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.haproxy.agent.tls.enabled }}
            - name: agent-tls
              mountPath: /etc/haptic/agent-tls
              readOnly: true
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
            {{- end }}
            {{- if $validatorsEnabled }}
            - name: validators-socket
              mountPath: {{ $validators.socketDir }}
            {{- end }}
            {{- with $controller.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- with $controller.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.haproxy.agent.tls.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ include "haptic.agentTLS.clientSecretName" . }}
        {{- end }}
        {{- if $webhookEnabled }}
        - name: webhook-certs
          secret:
            secretName: {{ $webhookSecretName }}
        {{- end }}
        {{- if $validatorsEnabled }}
        - name: validators-config
          configMap:
            name: {{ include "haptic.spoaHub.configMapName" . }}
        - name: validators-socket
          emptyDir: {}
        - name: validators-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- with $controller.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
