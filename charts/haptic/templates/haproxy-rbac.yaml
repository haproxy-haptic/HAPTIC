{{- if .Values.haproxy.enabled }}
{{- $haproxyFullname := include "haptic.haproxyFullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $haproxyFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only the agent mounts a token, and only when it observes the routing.
automountServiceAccountToken: false
{{- if and (include "haptic.haproxy.drainRouting" .) .Values.controller.rbac.create }}
{{- $clusterScopedName := printf "%s-%s" $haproxyFullname .Release.Namespace | trunc 63 | trimSuffix "-" }}
---
# The drain reads which Services in this namespace still route to the pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $haproxyFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $haproxyFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $haproxyFullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $haproxyFullname }}
    namespace: {{ .Release.Namespace }}
---
# The drain asks kube-proxy on every node whether it synced the pod's removal.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterScopedName }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterScopedName }}
  labels:
    {{- include "haptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterScopedName }}
subjects:
  - kind: ServiceAccount
    name: {{ $haproxyFullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
