{{- include "haptic.agentTLS.validate" . -}}
{{- $haproxy := .Values.haproxy }}
{{- if $haproxy.enabled }}
{{- $haproxyFullname := include "haptic.haproxyFullname" . }}
{{- $credentialsSecretName := include "haptic.dataplane.credentialsSecretName" . }}
{{- $haproxyImage := include "haptic.haproxy.image" . }}
{{- $haproxyBin := include "haptic.haproxy.bin" . }}
{{- $haproxyUid := include "haptic.haproxy.uid" . }}
{{- $spoaHubEnabled := include "haptic.spoaHub.enabled" . }}
{{- $vectorEnabled := include "haptic.vector.enabled" . }}
{{- $dataplaneConfig := .Values.controller.config.dataplane }}
{{- $podSpec := $haproxy.podSpec }}
{{- $ports := $haproxy.ports }}
{{- $proxyProtocol := include "haptic.proxyProtocol" . | fromYaml }}
{{- $http3 := include "haptic.http3" . | fromYaml }}
{{- $agent := $haproxy.agent }}

{{/*
  The pod spec below hardcodes /etc/haproxy: haproxy-runtime mounts there, the
  agent's --base-dir is the maps dir's parent, and general-storage is a SEPARATE
  emptyDir mounted at /etc/haproxy/general so the spoa-hub sidecar can read
  rendered files without reaching SSL private keys.

  So the auxiliary dirs are only configurable within those limits. Point them
  elsewhere and nothing errors -- the files land in the haproxy-runtime volume
  instead of general-storage, and the sidecar that mounts only general-storage
  reads an empty directory. Fail here instead, while the operator can still see
  why.

  Scoped to haproxy.enabled: with the bundled fleet off, HAPTIC drives an
  external fleet whose layout is none of this chart's business.
*/}}
{{- range $key, $path := dict "mapsDir" $dataplaneConfig.mapsDir "sslCertsDir" $dataplaneConfig.sslCertsDir "generalStorageDir" $dataplaneConfig.generalStorageDir "configFile" $dataplaneConfig.configFile }}
  {{- if ne (dir $path) "/etc/haproxy" }}
    {{- fail (printf "controller.config.dataplane.%s is %q, but the bundled HAProxy pod mounts its config volume at /etc/haproxy and resolves every auxiliary path against it. Files written outside that tree are invisible to HAProxy and to the sidecars. Put %s directly under /etc/haproxy, or set haproxy.enabled=false to manage the fleet yourself." $key $path $key) }}
  {{- end }}
{{- end }}
{{- if ne $dataplaneConfig.generalStorageDir "/etc/haproxy/general" }}
  {{- fail (printf "controller.config.dataplane.generalStorageDir is %q, but the bundled HAProxy pod mounts its general-storage volume at the fixed path /etc/haproxy/general. Rendered files would land in the HAProxy config volume instead, where the spoa-hub and vector sidecars cannot read them. Leave it at /etc/haproxy/general, or set haproxy.enabled=false." $dataplaneConfig.generalStorageDir) }}
{{- end }}
{{- $selectorLabels := include "haptic.selectorLabels" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $haproxyFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $haproxy.keda.enabled }}
  replicas: {{ $haproxy.replicaCount }}
  {{- end }}
  {{- with $haproxy.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ $haproxy.minReadySeconds }}
  revisionHistoryLimit: {{ $haproxy.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
      app.kubernetes.io/component: loadbalancer
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "haptic.dataplane.credentialsChecksum" . }}
        checksum/config: {{ include "haptic.haproxy.bootstrapConfigChecksum" . }}
        {{- with $podSpec.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      labels:
        {{- $selectorLabels | nindent 8 }}
        app.kubernetes.io/component: loadbalancer
    spec:
      {{- /* The pod pulls the HAPTIC image for its agent container, so an
             unset haproxy.podSpec.imagePullSecrets follows the controller's
             rather than leaving a private-registry install half-pullable.
             deepCopy: .Values must survive this render unchanged. */}}
      {{- $haproxyPodSpec := deepCopy $podSpec }}
      {{- if not $haproxyPodSpec.imagePullSecrets }}
      {{- $_ := set $haproxyPodSpec "imagePullSecrets" .Values.controller.podSpec.imagePullSecrets }}
      {{- end }}
      {{- include "haptic.podSpec" $haproxyPodSpec | nindent 6 }}
      {{- if $podSpec.shareProcessNamespace }}
      shareProcessNamespace: true
      {{- end }}
      initContainers:
        {{- if $vectorEnabled }}
        # Seed the config before the Vector sidecar starts.
        - name: vector-bootstrap-copy
          image: {{ $haproxyImage }}
          imagePullPolicy: {{ $haproxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: {{ $haproxyUid }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/vector-bootstrap/vector.yaml /etc/haproxy/general/vector.yaml
          # A ResourceQuota'd namespace rejects the pod when any container
          # omits requests/limits; sized for a one-file cp.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: general-storage
              mountPath: /etc/haproxy/general
            - name: vector-bootstrap
              mountPath: /etc/vector-bootstrap
              readOnly: true
        {{- end }}
        {{- if $spoaHubEnabled }}
        # Seed the config before the SPOA hub sidecar starts.
        - name: spoa-hub-bootstrap-copy
          image: {{ $haproxyImage }}
          imagePullPolicy: {{ $haproxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: {{ $haproxyUid }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/spoa-hub-bootstrap/config.toml /etc/haproxy/general/spoa-hub-config.toml
          # A ResourceQuota'd namespace rejects the pod when any container
          # omits requests/limits; sized for a one-file cp.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            # general-storage (not haproxy-runtime) so the bootstrap
            # placeholder lands in the same volume the spoa-hub
            # sidecar mounts and the agent later overwrites.
            # See volumes section below for why general/ is split off.
            - name: general-storage
              mountPath: /etc/haproxy/general
            - name: spoa-hub-bootstrap
              mountPath: /etc/spoa-hub-bootstrap
              readOnly: true
        {{- end }}
        {{- with $haproxy.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Native sidecars (restartPolicy: Always): started before HAProxy in
        # this order and stopped in reverse only after HAProxy exited, so the
        # log shipper, the SPOE hub and the agent's drain socket outlive its
        # drain and soft stop. Operator sidecars (haproxy.sidecars) stay regular
        # containers.
        {{- if $vectorEnabled }}
        {{- $vector := .Values.vector }}
        # Vector sidecar: receives the HAProxy access log over a UNIX datagram
        # socket, derives the request metrics from it, and re-exports the hub's
        # Prometheus metrics with its own. HAProxy's exporter is scraped directly.
        - name: vector
          restartPolicy: Always
          image: {{ include "haptic.vector.image" . }}
          imagePullPolicy: {{ $vector.image.pullPolicy }}
          env:
            # Vector links plain glibc malloc (no jemalloc — verified against
            # 0.57.0), so it gets glibc's default of up to 8 x ncores per-thread
            # arenas, and freed chunks stay in whichever arena they came from
            # rather than going back to the OS — peak RSS grows with arena count.
            # Measured on an 825-backend fleet: ARENA_MAX=2 bought ~11% of the
            # peak for a little allocator contention across the worker threads.
            - name: MALLOC_ARENA_MAX
              value: "2"
          # Vector does not unlink its UNIX socket after an exit, so each child
          # start removes the stale path before binding it again.
          command: ["/bin/sh", "-c"]
          args:
            - |
              _child_name='Vector'
              _child_impact='access-log and merged-metric export are unavailable'
              _child_health() {
                if ! command -v grep >/dev/null 2>&1; then
                  return 2
                fi
                if ! grep -q '^[[:space:]]*type:[[:space:]]*prometheus_exporter' /etc/haproxy/general/vector.yaml; then
                  return 2
                fi
                if timeout "$_watch_timeout_seconds" /usr/bin/bash -c '
                  exec 3<>"/dev/tcp/127.0.0.1/$1" || exit 1
                  printf "HEAD /metrics HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
                  IFS= read -r _status <&3 || exit 1
                  case "$_status" in HTTP/*) exit 0;; *) exit 1;; esac
                ' child-health {{ $vector.metricsPort | int }}; then
                  return 0
                fi
                return 1
              }
              {{ include "haptic.childSupervisor.shellFunctions" . | nindent 14 }}

              _backoff=1
              while true; do
                rm -f '{{ $vector.socketPath }}'
                # The config can be pruned until the first leader reconcile.
                _waited=0
                while [ ! -s /etc/haproxy/general/vector.yaml ]; do
                  if [ "$_waited" -lt 30 ]; then
                    echo "waiting for /etc/haproxy/general/vector.yaml (not pushed yet; ${_waited}s)"
                  else
                    echo "WARNING: still no /etc/haproxy/general/vector.yaml after ${_waited}s — access-log export is unavailable. Check the controller is Ready and holds the leader lease."
                  fi
                  _waited=$((_waited + 2))
                  sleep 2
                done

                _child_started_epoch_seconds=$(date +%s)
                /usr/bin/vector --watch-config --watch-config-method poll --watch-config-poll-interval-seconds 2 --config /etc/haproxy/general/vector.yaml &
                _child_pid=$!
                _start_watchdog
                # The socket proves the watcher is armed; HUP closes the preceding read/watch race.
                _sync_waited=0
                while [ ! -S '{{ $vector.socketPath }}' ] && [ "$_sync_waited" -lt "$_watch_startup_grace_seconds" ]; do
                  if ! kill -0 "$_child_pid" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                  _sync_waited=$((_sync_waited + 1))
                done
                if [ -S '{{ $vector.socketPath }}' ] && kill -0 "$_child_pid" 2>/dev/null; then
                  kill -HUP "$_child_pid"
                fi
                wait "$_child_pid"
                _status=$?
                _stop_watchdog
                _child_pid=
                _child_runtime_seconds=$(( $(date +%s) - _child_started_epoch_seconds ))
                if [ "$_child_runtime_seconds" -ge 60 ]; then
                  _backoff=1
                fi
                echo "WARNING: Vector exited with status ${_status}; access-log and merged-metric export are unavailable; restarting in ${_backoff}s"
                sleep "$_backoff"
                if [ "$_backoff" -lt 30 ]; then
                  _backoff=$((_backoff * 2))
                  if [ "$_backoff" -gt 30 ]; then _backoff=30; fi
                fi
              done
          ports:
            - name: vector-metrics
              containerPort: {{ $vector.metricsPort | int }}
              protocol: TCP
            {{- if include "haptic.vector.sizeExporterEnabled" . }}
            - name: vector-sizes
              containerPort: {{ $vector.sizeMetricsPort | int }}
              protocol: TCP
            {{- end }}
          securityContext:
            {{- toYaml $vector.securityContext | nindent 12 }}
          resources:
            {{- toYaml $vector.resources | nindent 12 }}
          volumeMounts:
            # Whole-volume mount, NOT `subPath` — kubelet implements subPath as an
            # isolated bind-mount that does not propagate inotify events, so
            # --watch-config would never fire and vector would sit on the bootstrap
            # config forever. Same trap as the spoa-hub's file-watch, documented
            # at length in its volumeMounts above.
            - name: general-storage
              mountPath: /etc/haproxy/general
              readOnly: true
            - name: vector-socket
              mountPath: {{ include "haptic.vector.socketDir" . }}
            # data_dir. Vector requires it to be writable even when no sink uses
            # disk buffering.
            - name: vector-data
              mountPath: /var/lib/vector
            # readOnlyRootFilesystem:true, so give it a writable scratch dir.
            - name: vector-tmp
              mountPath: /tmp
            {{- with $vector.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if $spoaHubEnabled }}
        {{- $spoaHub := .Values.spoaHub }}
        # SPOA hub sidecar — bundles the haproxy-spoa-hub binary plus the
        # plugin .so files. Conditional on at least one plugin being
        # enabled. Communicates with HAProxy over /run/spoa/hub.sock.
        - name: spoa-hub
          restartPolicy: Always
          image: {{ include "haptic.spoaHub.image" . }}
          imagePullPolicy: {{ $spoaHub.image.pullPolicy }}
          env:
            {{- include "haptic.spoaHub.goRuntimeEnv" (dict "root" $ "resources" $spoaHub.resources) | nindent 12 }}
          {{- $metricsPort := include "haptic.spoaHub.metricsPort" $ }}
          {{- if $metricsPort }}
          ports:
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              _child_name='SPOA hub'
              _child_impact='SPOA processing is unavailable'
              _child_health() {
                timeout "$_watch_timeout_seconds" /usr/bin/bash -c '
                    exec 3<>"/dev/tcp/127.0.0.1/$1" || exit 2
                    printf "GET /spoa-hub-child-health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
                    IFS= read -r _status <&3 || exit 1
                    case "$_status" in
                      HTTP/*" 204 "*) exit 0;;
                      HTTP/*" 424 "*) exit 1;;
                      *) exit 2;;
                    esac
                  ' child-health {{ $ports.stats }}
                _probe_status=$?
                case "$_probe_status" in
                  0) return 0;;
                  1) return 1;;
                  *) return 2;;
                esac
              }
              {{ include "haptic.childSupervisor.shellFunctions" . | nindent 14 }}

              _backoff=1
              while true; do
                _child_started_epoch_seconds=$(date +%s)
                /usr/local/bin/haproxy-spoa-hub --config /etc/haproxy/general/spoa-hub-config.toml &
                _child_pid=$!
                _start_watchdog
                wait "$_child_pid"
                _status=$?
                _stop_watchdog
                _child_pid=
                _child_runtime_seconds=$(( $(date +%s) - _child_started_epoch_seconds ))
                if [ "$_child_runtime_seconds" -ge 60 ]; then
                  _backoff=1
                fi
                echo "WARNING: SPOA hub exited with status ${_status}; SPOA processing is unavailable; restarting in ${_backoff}s"
                sleep "$_backoff"
                if [ "$_backoff" -lt 30 ]; then
                  _backoff=$((_backoff * 2))
                  if [ "$_backoff" -gt 30 ]; then _backoff=30; fi
                fi
              done
          securityContext:
            {{- toYaml $spoaHub.securityContext | nindent 12 }}
          resources:
            {{- toYaml $spoaHub.resources | nindent 12 }}
          volumeMounts:
            # ONLY the narrow general-storage volume — NOT
            # haproxy-runtime. The hub needs to see the rendered
            # spoa-hub-config.toml that the agent writes
            # (and the bootstrap initContainer seeded), but it has
            # no business reading SSL private keys or backend maps
            # from haproxy-runtime/{ssl,maps,errors,…}. By splitting
            # general/ into its own emptyDir and mounting only that
            # here, the spoa-hub container's blast radius is the
            # config file alone.
            #
            # We deliberately do NOT use `subPath: general` on a
            # haproxy-runtime mount — kubelet implements subPath as
            # an isolated bind-mount that does NOT propagate inotify
            # events from the source side. The hub binary relies on
            # file-watch on the parent of `--config` to survive
            # atomic-rename writes; through a subPath mount that
            # watch never fires and the hub stays on the bootstrap
            # config forever, silently breaking per-Ingress
            # modsecurity-snippet enforcement. A separate-volume
            # overlay (mounted on haproxy + agent at the same
            # path) gives both narrow scope AND working inotify.
            - name: general-storage
              mountPath: /etc/haproxy/general
              readOnly: true
            - name: spoa-socket
              mountPath: /run/spoa
            # The spoa-hub container runs with readOnlyRootFilesystem:true.
            # Some plugins (e.g. coraza's filesystem-access verifier) need a
            # writable scratch directory at startup; the hub also keeps a
            # short-lived audit-log spool there for some plugin
            # configurations. A small emptyDir mounted at /tmp gives them a
            # place to write without weakening the container's read-only
            # root filesystem. Memory-backed because the contents are
            # ephemeral and tiny — no need for disk-backed storage.
            - name: spoa-hub-tmp
              mountPath: /tmp
            {{- with $spoaHub.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- end }}
        # HAPTIC agent sidecar — owns this pod's file tree and its HAProxy
        # runtime socket. It runs from the controller image, so the two always
        # speak the same wire contract.
        - name: agent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Shares the volume group with HAProxy; the agent writes the tree
            # HAProxy reads.
            runAsUser: {{ $haproxyUid }}
          image: {{ include "haptic.controller.image" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - agent
            - --base-dir={{ dir $dataplaneConfig.mapsDir }}
            - --config={{ base $dataplaneConfig.configFile }}
            - --master-socket=haproxy-master.sock
            - --worker-socket=haproxy-worker.sock
            - --listen=:{{ $ports.dataplane }}
            {{- if $agent.tls.enabled }}
            - --tls-dir=/etc/haptic/agent-tls/..data
            - --tls-client-name={{ include "haptic.agentTLS.clientName" . }}
            {{- end }}
            - --metrics-listen=:{{ $ports.agentMetrics }}
            - --drain-socket={{ if $haproxy.drain.enabled }}haptic-drain.sock{{ end }}
            - --drain-quiet-period={{ int $haproxy.drain.quietPeriodSeconds }}s
            - --drain-max-wait={{ int $haproxy.drain.maxWaitSeconds }}s
            - --drain-ignore-frontend=status
            {{- with $dataplaneConfig.minDeploymentInterval }}
            - --reload-interval-min={{ . }}
            {{- end }}
            {{- with $dataplaneConfig.reloadVerificationTimeout }}
            - --reload-timeout={{ . }}
            {{- end }}
          env:
            {{- range $env := list (dict "name" "DATAPLANE_USERNAME" "key" "dataplane_username") (dict "name" "DATAPLANE_PASSWORD" "key" "dataplane_password") }}
            - name: {{ $env.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecretName }}
                  key: {{ $env.key }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ $agent.logLevel | default "info" | quote }}
            {{- include "haptic.agent.autoGomaxprocs" $agent | nindent 12 }}
            {{- with $agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: dataplane
              containerPort: {{ $ports.dataplane }}
              protocol: TCP
            - name: agent-metrics
              containerPort: {{ $ports.agentMetrics }}
              protocol: TCP
          # HAProxy owns pod readiness; an agent startup gate would wait on HAProxy.
          # Local liveness survives certificate expiry so renewal can recover it.
          livenessProbe:
            exec:
              command: [haptic, agent, health, {{ printf "--base-dir=%s" (dir $dataplaneConfig.mapsDir) | quote }}]
            periodSeconds: 10
          volumeMounts:
            - name: haproxy-runtime
              mountPath: /etc/haproxy
            {{- if $agent.tls.enabled }}
            - name: agent-tls
              mountPath: /etc/haptic/agent-tls
              readOnly: true
            {{- end }}
            # general-storage overlay — same shape as the haproxy container's
            # mount, so files the agent writes under general/ land in the narrow
            # volume the spoa-hub and vector sidecars read.
            - name: general-storage
              mountPath: /etc/haproxy/general
          resources:
            {{- toYaml $agent.resources | nindent 12 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $haproxyUid }}
        runAsGroup: {{ $haproxyUid }}
        fsGroup: {{ $haproxyUid }}
        {{- with $podSpec.podSecurityContext.seccompProfile }}
        seccompProfile:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $podSpec.podSecurityContext.sysctls }}
        sysctls:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
        # HAProxy container
        - name: haproxy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              {{- if $haproxy.enterprise.enabled }}
              # Enterprise binaries have file capabilities requiring NET_BIND_SERVICE
              # PSS Restricted profile allows this capability
              add: [NET_BIND_SERVICE]
              {{- end }}
            runAsNonRoot: true
            runAsUser: {{ $haproxyUid }}
          image: {{ $haproxyImage }}
          imagePullPolicy: {{ $haproxy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /etc/haproxy/maps /etc/haproxy/certs /etc/haproxy/errors /etc/haproxy/general
              # Resume on the config already on disk when it still parses, so a
              # container restart inside a live pod needs no controller round
              # trip. The pod's own binary checks it — right version, right
              # edition. -dr: a DNS failure is not a config error.
              if [ ! -s /etc/haproxy/haproxy.cfg ] || ! {{ $haproxyBin }} -dr -c -f /etc/haproxy/haproxy.cfg >/dev/null 2>&1; then
                cp /config/haproxy.cfg /etc/haproxy/haproxy.cfg
              fi
              {{- $memReq := dig "requests" "memory" "" $haproxy.resources }}
              exec {{ $haproxyBin }} -dr -W -db{{ if $memReq }} -m {{ include "haptic.memoryToMB" $memReq }}{{ end }} -S "/etc/haproxy/haproxy-master.sock,level,admin" -- /etc/haproxy/haproxy.cfg
          env:
            # Which pod served the request. HAProxy reads these once into
            # proc-scoped variables, so the access log and the trace span can
            # name the replica without a per-request lookup. Unset is safe:
            # HAProxy renders an empty value and the field drops out.
            - name: SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- with $haproxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range $name := list "http" "https" "stats" }}
            - name: {{ $name }}
              containerPort: {{ index $ports $name }}
              protocol: TCP
            {{- end }}
            {{- if $http3.enabled }}
            - name: https-quic
              containerPort: {{ $ports.https }}
              protocol: UDP
            {{- end }}
            {{- if $proxyProtocol.enabled }}
            - name: proxy-http
              containerPort: {{ int $proxyProtocol.httpPort }}
              protocol: TCP
            - name: proxy-https
              containerPort: {{ int $proxyProtocol.httpsPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: haproxy-runtime
              mountPath: /etc/haproxy
            # Overlay the general-storage dir on top of
            # haproxy-runtime/general/ with a SEPARATE emptyDir. The
            # spoa-hub sidecar (when enabled) mounts only this narrower
            # volume so it can't read SSL private keys or other
            # haproxy-runtime contents — see volumes section comment.
            - name: general-storage
              mountPath: /etc/haproxy/general
            {{- if $haproxy.shmStats.enabled }}
            - name: devshm
              mountPath: /dev/shm
            {{- end }}
            {{- if $vectorEnabled }}
            # Shared with the vector sidecar. HAProxy's `log <path>` target is a
            # UNIX datagram sender, so it needs write access to the socket vector
            # creates here. Note a datagram sender gets NO error when nothing is
            # listening — records are silently dropped until Vector binds it.
            - name: vector-socket
              mountPath: {{ include "haptic.vector.socketDir" . }}
            {{- end }}
            {{- if $spoaHubEnabled }}
            # Shared with the spoa-hub sidecar; HAProxy connects via a
            # unix socket the hub creates here at startup.
            - name: spoa-socket
              mountPath: /run/spoa
            {{- end }}
            {{- with $haproxy.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: stats
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: stats
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- if $haproxy.lifecycle }}
          lifecycle:
            {{- toYaml $haproxy.lifecycle | nindent 12 }}
          {{- else if $haproxy.drain.enabled }}
          # The agent answers once no new connection reaches the pod; only then
          # does kubelet's SIGUSR1 run HAProxy's own soft stop.
          lifecycle:
            preStop:
              exec:
                command: ["curl", "-sS", "--connect-timeout", "2", "--max-time", "{{ add (int $haproxy.drain.maxWaitSeconds) 5 }}", "--unix-socket", "{{ dir $dataplaneConfig.mapsDir }}/haptic-drain.sock", "http://drain/drain"]
          {{- end }}
          resources:
            {{- toYaml $haproxy.resources | nindent 12 }}

        {{- with $haproxy.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        {{- if $agent.tls.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ include "haptic.agentTLS.serverSecretName" . }}
        {{- end }}
        - name: config
          configMap:
            name: {{ $haproxyFullname }}-config
        - name: haproxy-runtime
          # tmpfs-backed emptyDir. Disk-backed emptyDir lands on the
          # node's container-runtime filesystem (overlayfs on most
          # clusters), where inotify events occasionally fail to
          # propagate to bind-mount consumers in other containers.
          # tmpfs sidesteps that — emptyDir contents never survive a
          # pod restart anyway, so tmpfs vs disk has no semantic
          # impact. 64 MiB ceiling — rendered maps + SSL files + …
          # are well under that for any realistic ingress workload.
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # Narrow overlay volume scoped to the general-storage dir.
        # Mounted at /etc/haproxy/general/ on the haproxy + agent
        # containers (overlaying the same
        # subdirectory of haproxy-runtime), AND on the spoa-hub
        # sidecar (its only volume from the haproxy-runtime tree).
        # The split exists so the hub container can read its
        # config file (and pick up file-watch reloads) without
        # also gaining read access to ssl/ private keys, maps/,
        # or other haproxy-runtime contents — least-privilege via
        # the kubelet mount layout rather than via subPath, which
        # would block inotify event propagation.
        - name: general-storage
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if $haproxy.shmStats.enabled }}
        - name: devshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ include "haptic.haproxy.shmSizeLimit" . }}
        {{- end }}
        {{- if $spoaHubEnabled }}
        # Memory-backed scratch directory for the spoa-hub container's
        # /tmp. Some plugins (notably coraza) write probe files here to
        # verify filesystem access at plugin init; without this the
        # container's readOnlyRootFilesystem makes the writes EROFS
        # and the plugin fails to load. tmpfs keeps the I/O off-disk.
        - name: spoa-hub-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # Helm-rendered bootstrap config for the spoa-hub. Mounted
        # read-only into the haproxy container, which copies it into
        # /etc/haproxy/general/spoa-hub-config.toml during init so the
        # spoa-hub sidecar finds a valid config at its --config path
        # on first start. HAPTIC's controller overwrites the
        # destination via the agent on first reconcile.
        - name: spoa-hub-bootstrap
          configMap:
            name: {{ include "haptic.spoaHub.configMapName" . }}
        - name: spoa-socket
          emptyDir: {}
        {{- end }}
        {{- if $vectorEnabled }}
        # Bootstrap config, copied into general-storage by the init container so
        # vector finds a valid --config on first start.
        - name: vector-bootstrap
          configMap:
            name: {{ include "haptic.vector.configMapName" . }}
        # Holds the log socket. Its own volume rather than a subdirectory of
        # haproxy-runtime so the haproxy container gets write access to the socket
        # without vector gaining access to SSL private keys or backend maps.
        - name: vector-socket
          emptyDir: {}
        # data_dir. Memory-backed: nothing here needs to survive a restart, and a
        # disk-backed emptyDir lands on the node's ephemeral storage.
        - name: vector-data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: vector-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- with $haproxy.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
{{- end }}
