{{- $pr := .Values.controller.monitoring.prometheusRule }}
{{- if $pr.enabled }}
{{- $defaults := $pr.defaultRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "haptic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haptic.labels.withCommon" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: haptic
      rules:
        {{- if $pr.rules }}
        {{- toYaml $pr.rules | nindent 8 }}
        {{- else if $defaults.enabled }}
        {{- if $defaults.retainedConfiguration }}
        - alert: HAProxyRetainedConfigurationActive
          expr: haptic_retained_config_active == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "New HAProxy pods use retained configuration"
            description: "Controller {{ `{{ $labels.pod }}` }} cannot render. New HAProxy pods use a previously loaded configuration with stale endpoint and route data. Inspect the HAProxyTemplateConfig Warning events and repair the render error."
        {{- end }}
        {{- if $defaults.reconciliationErrors }}
        - alert: HAProxyControllerReconciliationErrors
          expr: rate(haptic_reconciliation_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy controller has reconciliation errors"
            description: "Controller {{ `{{ $labels.pod }}` }} has {{ `{{ $value | humanize }}` }} reconciliation errors/sec"
        {{- end }}
        {{- if $defaults.deploymentFailures }}
        - alert: HAProxyControllerDeploymentFailures
          expr: rate(haptic_deployment_errors_total[5m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "HAProxy configuration deployment failures"
            description: "Controller {{ `{{ $labels.pod }}` }} is failing to deploy configs to HAProxy"
        {{- end }}
        {{- if $defaults.fleetDiverged }}
        - alert: HAProxyFleetDiverged
          expr: haptic_haproxy_fleet_converged < haptic_haproxy_fleet_size
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy fleet is diverged"
            description: "Controller {{ `{{ $labels.pod }}` }}: {{ `{{ $value }}` }} of the fleet's HAProxy pods are at the desired config; the rest have not converged for 5m. Transient deploy failures self-heal, so sustained divergence is a real fault."
        {{- end }}
        {{- if $defaults.highQueueDepth }}
        - alert: HAProxyControllerHighQueueDepth
          expr: histogram_quantile(0.95, sum(rate(haptic_reconciliation_queue_wait_seconds_bucket[5m])) by (le)) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy controller reconciliation queue is backing up"
            description: "p95 reconciliation queue wait is {{ `{{ $value | humanizeDuration }}` }}, indicating processing delays"
        {{- end }}
        {{- if $defaults.leaderElectionLost }}
        - alert: HAProxyControllerNoLeader
          expr: sum(haptic_leader_election_is_leader) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "No HAProxy controller leader elected"
            description: "No controller instance holds the leader lock - deployments are stalled"
        {{- end }}
        {{- if $defaults.configRejected }}
        - alert: HAProxyControllerConfigRejected
          expr: increase(haptic_config_rejected_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "HAProxyTemplateConfig rejected by the validation gate"
            description: "Validator {{ `{{ $labels.validator }}` }} rejected a config change - the controller is serving the last-good config and the latest change is NOT live"
        {{- end }}
        {{- if $defaults.configNotValidated }}
        - alert: HAProxyControllerConfigNotValidated
          expr: haptic_config_validated{status="True"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HAProxyTemplateConfig not validated for 10 minutes"
            description: "Controller {{ `{{ $labels.pod }}` }} has not validated its newest HAProxyTemplateConfig for 10m, so the latest change isn't live. Check the HAProxyTemplateConfig's Validated condition and Warning events for the cause."
        {{- end }}
        {{- if $defaults.configPinned }}
        - alert: HAProxyControllerConfigPinned
          expr: haptic_config_pinned > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HAProxy refused the rendered configuration twice; renders are held"
            description: "No new render reaches the HAProxy pods - they keep serving the last configuration HAProxy accepted. The HAProxyCfg's ConfigValidated condition carries HAProxy's own message; fix the input it names"
        {{- end }}
        {{- if $defaults.haproxyPodsRejected }}
        - alert: HAProxyControllerHAProxyPodsRejected
          expr: increase(haptic_haproxy_pods_rejected_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy pods refused admission by discovery"
            description: "Reason {{ `{{ $labels.reason }}` }}: the controller cannot manage discovered HAProxy pods (often a HAProxy major.minor mismatch with the chart's haproxyVersion)"
        {{- end }}
        {{- if $defaults.noHAProxyPods }}
        - alert: HAProxyControllerNoHAProxyPods
          expr: haptic_resource_count{type="haproxy-pods"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No HAProxy pods discovered"
            description: "Controller {{ `{{ $labels.pod }}` }} finds no HAProxy pods to manage - no config is reaching the data plane"
        {{- end }}
        {{- if $defaults.accessLogDropped }}
        - alert: HAProxyAccessLogRecordsDropped
          expr: increase(haproxy_process_dropped_logs_total[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "HAProxy is dropping access-log records"
            description: "HAProxy pod {{ `{{ $labels.pod }}` }} dropped {{ `{{ $value | humanize }}` }} access-log records in 5m. The log reaches the vector sidecar over a UNIX datagram socket, which absorbs only ~167 records; when vector stops draining (topology reload, GC pause, CPU starvation) HAProxy discards records rather than blocking traffic. Requests are unaffected, but the log is incomplete — which matters most during an incident, when it is the evidence you reach for. Raise vector's CPU request or reduce log volume with accessLog.suppress."
        {{- end }}
        {{- if $defaults.applyRejected }}
        - alert: HAProxyAgentApplyRejected
          expr: increase(haptic_apply_rejected_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "An HAProxy pod refused a config apply"
            description: "Pod {{ `{{ $labels.pod }}` }} rejected an apply and is serving its last known good file set; HAProxy's own message is in the pod's status condition and Warning event"
        {{- end }}
        {{- if $defaults.recoveryReloadFailed }}
        - alert: HAProxyAgentRecoveryReloadFailed
          expr: increase(haptic_agent_invariant_violations_total{name="recovery_reload"}[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "An HAProxy worker is running a configuration nobody described"
            description: "Pod {{ `{{ $labels.pod }}` }} rolled back to its last known good file set but the recovery reload failed, so the running worker matches neither the rejected apply nor the restored files. Restart the HAProxy pod after collecting `haptic agent state` from it"
        {{- end }}
        {{- if $defaults.agentInvariantViolated }}
        - alert: HAProxyAgentInvariantViolated
          expr: increase(haptic_agent_invariant_violations_total{name!="recovery_reload"}[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "The HAPTIC agent observed one of its invariants failing"
            description: "Invariant {{ `{{ $labels.name }}` }} failed on pod {{ `{{ $labels.pod }}` }} - this is a defect, not an operator error; collect the agent state (haptic agent state --output json, run in the pod's agent container) and open an issue"
        {{- end }}
        {{- if $defaults.agentVersionSkew }}
        - alert: HAProxyAgentVersionSkew
          expr: increase(haptic_agent_version_skew_total[15m]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy pods run an agent that does not match the controller"
            description: "Applies fall back to a full file set plus a reload because a pod's agent speaks another API major or lacks an op kind - expected during a rolling upgrade, a defect if it persists after one"
        {{- end }}
        {{- if $defaults.criticalEventsDropped }}
        - alert: HAProxyControllerCriticalEventsDropped
          expr: increase(haptic_events_dropped_critical_total[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Critical events dropped from the event bus"
            description: "A critical subscriber's buffer overflowed - reconciliation work has been lost and the data plane may be stale"
        {{- end }}
        {{- end }}
{{- end }}
