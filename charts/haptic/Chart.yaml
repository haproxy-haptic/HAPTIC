apiVersion: v2
name: haptic
description: HAPTIC - HAProxy Template Ingress Controller
type: application
# The oldest Kubernetes release still maintained upstream. Never below 1.33: the
# HAProxy pod's helpers are native sidecars, which outlive HAProxy while it drains.
kubeVersion: ">=1.35.0-0"
version: 0.6.0
appVersion: "0.6.0"
# Template libraries are packaged as conditional subcharts so a release only
# carries the source of the libraries it enables — disabled subcharts are
# pruned from the Helm release Secret, keeping it under the 1 MiB limit. The
# parent merges each enabled subchart's library YAML into the
# HAProxyTemplateConfig (charts/helm-helpers/templates/_libraries.tpl). Every library is a subchart,
# including base/kubernetes-backends/ssl/ingress; spoa-hub carries no condition because its enable
# predicate is an `or` over a template helper, which a Helm condition cannot
# express — its own _helm_load.enable still gates it.
dependencies:
  - name: helm-helpers
    version: 0.1.0
  - name: base
    version: 0.1.0
    condition: controller.templateLibraries.base.enabled
  - name: kubernetes-backends
    version: 0.1.0
    condition: controller.templateLibraries.kubernetesBackends.enabled
  - name: ssl
    version: 0.1.0
    condition: controller.templateLibraries.ssl.enabled
  - name: ingress
    version: 0.1.0
    condition: controller.templateLibraries.ingress.enabled
  - name: ingress-annotations-compat
    version: 0.1.0
    condition: controller.templateLibraries.ingressAnnotationsCompat.enabled
  - name: governance
    version: 0.1.0
    condition: controller.templateLibraries.governance.enabled
  # No condition: spoa-hub's enable predicate is
  # `or .Values.controller.templateLibraries.spoaHub.enabled (include "haptic.spoaHub.enabled" .)`,
  # and Helm's condition: accepts only a values path. Gating on the flag alone
  # empties `backend spoa-hub` on the default profile, where the helper is what
  # turns the library on. The library's own _helm_load.enable still gates it.
  - name: spoa-hub
    version: 0.1.0
  - name: http-policies
    version: "0.1.0"
  - name: gateway
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: gateway-policies
    version: 0.1.0
    condition: controller.templateLibraries.gateway.enabled
  - name: haptic-annotations
    version: 0.1.0
    condition: controller.templateLibraries.hapticAnnotations.enabled
  - name: haproxytech
    version: 0.1.0
    condition: controller.templateLibraries.haproxytech.enabled
  - name: haproxy-ingress
    version: 0.1.0
    condition: controller.templateLibraries.haproxyIngress.enabled
  - name: nginx-ingress
    version: 0.1.0
    condition: controller.templateLibraries.nginxIngress.enabled
  - name: custom-crd-example
    version: 0.1.0
    condition: controller.templateLibraries.customCrdExample.enabled
  - name: vector
    version: 0.1.0
    condition: vector.enabled
keywords:
  - haproxy
  - ingress
  - controller
  - loadbalancer
  - template
home: https://github.com/haproxy-haptic/HAPTIC
sources:
  - https://github.com/haproxy-haptic/HAPTIC
maintainers:
  - name: phihos
annotations:
  # Document all component images (Artifact Hub standard)
  artifacthub.io/images: |
    - name: controller
      image: ghcr.io/haproxy-haptic/haptic:0.6.0-haproxy3.4
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: haproxy
      image: haproxytech/haproxy-debian:3.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: spoa-hub
      image: ghcr.io/haproxy-haptic/haptic/spoa-hub:0.6.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: varnish
      image: ghcr.io/haproxy-haptic/haptic/varnish:0.6.0
      platforms:
        - linux/amd64
        - linux/arm64

  # License
  artifacthub.io/license: Apache-2.0

  # Release highlights; full notes are in the root CHANGELOG.md.
  artifacthub.io/changes: |
    - kind: security
      description: Go 1.27.2 and the bundled Coraza WAF plugin v0.10.1 (Coraza v3.8.1) fix HTTP, TLS, WAF bypass, and crash vulnerabilities
    - kind: security
      description: HAProxy 3.0.30, 3.2.26, 3.3.17, and 3.4.7 fix major HTTP/2 PING and HTTP/1 chunk-size bugs
    - kind: changed
      description: "Breaking: requires Kubernetes 1.35 or newer"
    - kind: removed
      description: "Breaking: HAProxy 3.1, which is past its upstream end of life, is no longer supported"
    - kind: changed
      description: Images and the chart are published on ghcr.io/haproxy-haptic; development moved to GitHub
    - kind: added
      description: Opt-in Pod readiness gate keeps single-replica rollouts from dropping requests
    - kind: fixed
      description: A graceful leader stop saves its recovery checkpoint, so retained recovery works after ordinary leader changes
    - kind: fixed
      description: A replica no longer re-renders on every change while a critical http.Fetch source is down
    - kind: fixed
      description: A new leader deploys critical http.Fetch content as soon as it is accepted, instead of after the next drift-prevention round
    - kind: fixed
      description: Each release's Ingress and Gateway status lists only its own load balancer addresses
    - kind: changed
      description: Reconciliation cost no longer grows with the watched set, and the leader runs haproxy -c once per render
  artifacthub.io/containsSecurityUpdates: "true"

  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://haproxy-haptic.org/docs/0.6.0/
    - name: Issue Tracker
      url: https://github.com/haproxy-haptic/HAPTIC/issues

  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
      description: Required for webhook TLS certificate management when controller.webhook.certManager.enabled=true

  # Minimum HAProxy version requirement
  haproxy.org/minimum-version: "3.0"
