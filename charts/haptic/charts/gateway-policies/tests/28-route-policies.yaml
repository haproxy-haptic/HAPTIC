      pattern: (?m)^gateway/h_default_mixed_0 invalid$
    - type: contains
      target: map:gw-policy-errors.map
      pattern: (?m)^gateway/h_default_mixed_1 invalid$
    - type: contains
      target: status:default/mixed:deployed
      pattern: '"reason":"IncompatibleFilters"'
