validationTests:
  test-gateway-policy-authentication:
    requires:
    - httproutes
    - grpcroutes
    - routepolicies
    fixtures: &authentication-fixtures
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          namespace: default
          name: policy-gateway
          generation: 1
        spec:
          gatewayClassName: haptic
          listeners:
          - name: http
            port: 80
            protocol: HTTP
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          namespace: default
          name: echo
        spec:
          ports:
          - port: 80
            targetPort: 8080
      secrets:
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: jwt-keys
        type: Opaque
        data:
          pubkey.pem: 
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: api-keys
        data:
          keys: a2V5LW9uZTphbGljZQprZXktdHdvOmJvYgo=
      routepolicies:
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: api
        spec:
          authentication:
            apiKey: &id001
              secretRef:
                name: api-keys
              consumerHeader: X-Consumer
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: jwt
        spec:
          authentication:
            jwt: &id002
              secretRef:
                name: jwt-keys
              issuer: https://issuer.example.com
              audience: api
              requiredClaims:
              - exp
              forwardClaims:
              - claim: sub
                header: X-User
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: ssl-passthrough
        spec:
          authentication:
            apiKey: *id001
            jwt: *id002
      httproutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          namespace: default
          name: same-name
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - same-name.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /api
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: api
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /jwt
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: jwt
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /both
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: ssl-passthrough
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /public
      grpcroutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: GRPCRoute
        metadata:
          namespace: default
          name: same-name
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - same-name.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: api
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:haptic-api-key-routes.map
      pattern: (?m)^gateway/h_default_same-name_0 hdr X-API-Key default/api-keys ok X-Consumer true$
    - type: contains
      target: map:haptic-api-key-routes.map
      pattern: (?m)^gateway/g_default_same-name_0 hdr X-API-Key default/api-keys ok X-Consumer true$
    - type: contains
      target: map:haptic-api-key-routes.map
      pattern: '(?m)^gateway/h_default_same-name_2 '
    - type: contains
      target: map:haptic-jwt-routes.map
      pattern: (?m)^gateway/h_default_same-name_1 RS256 haptic-jwt-default_jwt-keys\.pem ok https://issuer\.example\.com
        api ,exp, ,sub:X-User, true true$
    - type: contains
      target: map:haptic-jwt-routes.map
      pattern: '(?m)^gateway/h_default_same-name_2 '
    - type: not_contains
      target: map:haptic-jwt-routes.map
      pattern: h_default_same-name_3
    - type: not_contains
      target: map:haptic-api-key-routes.map
      pattern: h_default_same-name_3
    - type: contains
      target: map:haptic-apikeys.map
      pattern: (?m)^default/api-keys\|key-one alice$
    - type: not_contains
      target: map:gw-policy-errors.map
      pattern: invalid
    - type: not_contains
      target: haproxy.cfg
      pattern: backend ssl-passthrough-default-same-name
    - type: match_order
      target: haproxy.cfg
      patterns:
      - set-var\(txn.policy_id\)
      - str\(route_policy_unavailable\)
      - str\(jwt_signature\)
      - str\(api_key\)
  test-gateway-policy-invalid-dependencies:
    requires:
    - httproutes
    - routepolicies
    fixtures:
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          namespace: default
          name: policy-gateway
          generation: 1
        spec:
          gatewayClassName: haptic
          listeners:
          - name: http
            port: 80
            protocol: HTTP
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          namespace: default
          name: echo
        spec:
          ports:
          - port: 80
            targetPort: 8080
      secrets:
      - apiVersion: v1
        kind: Secret
        immutable: true
        metadata:
          namespace: default
          name: bad-key
        data:
          pubkey.pem: bm90IGEga2V5
      routepolicies:
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: missing-key
        spec:
          authentication:
            jwt:
              secretRef:
                name: absent
      - apiVersion: haproxy-haptic.org/v1alpha1
        kind: HAProxyRoutePolicy
        metadata:
          namespace: default
          name: bad-key
        spec:
          authentication:
            jwt:
              secretRef:
                name: bad-key
      httproutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          namespace: default
          name: partial
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - partial.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /protected
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: absent
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /public
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          namespace: default
          name: missing-key
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - missing-key.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: missing-key
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          namespace: default
          name: bad-key
          generation: 2
        spec:
          parentRefs:
          - name: policy-gateway
          hostnames:
          - bad-key.example.com
          rules:
          - backendRefs:
            - name: echo
              port: 80
            matches:
            - path:
                type: PathPrefix
                value: /
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: bad-key
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:gw-policy-errors.map
      pattern: (?m)^gateway/h_default_partial_0 invalid$
    - type: contains
      target: map:gw-policy-errors.map
      pattern: (?m)^gateway/h_default_missing-key_0 invalid$
    - type: contains
      target: map:gw-policy-errors.map
      pattern: (?m)^gateway/h_default_bad-key_0 invalid$
    - type: not_contains
      target: map:gw-policy-errors.map
      pattern: h_default_partial_1
    - type: not_contains
      target: map:haptic-jwt-routes.map
      pattern: ^gateway/
    - type: contains
      target: status:default/partial:deployed
      pattern: '"status":"True","type":"PartiallyInvalid"'
    - type: contains
      target: status:default/partial:deployed
      pattern: '"reason":"PolicyNotFound"'
    - type: contains
      target: status:default/bad-key:deployed
      pattern: '"status":"False","type":"Accepted"'
