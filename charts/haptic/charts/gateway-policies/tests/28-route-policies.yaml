          rules:
          - backendRefs:
            - name: echo
              port: 80
            filters:
            - type: ExtensionRef
              extensionRef:
                group: haproxy-haptic.org
                kind: HAProxyRoutePolicy
                name: shared
    assertions:
    - type: haproxy_valid
    - type: contains
      target: map:rate-limit.map
      pattern: (?m)^gateway/h_default_same-name_0 50 2 75 exact consumer routepolicy/default/shared$
    - type: contains
      target: map:rate-limit.map
      pattern: (?m)^gateway/h_default_same-name_3 50 2 75 exact consumer routepolicy/default/shared$
    - type: contains
      target: map:rate-limit.map
      pattern: (?m)^gateway/g_default_same-name_0 50 2 75 exact consumer routepolicy/default/shared$
    - type: contains
      target: haproxy.cfg
      pattern: set-var\(txn.rl_budget\) var\(txn.rl_cfg\),field\(6,
    - type: contains
      target: haproxy.cfg
      pattern: set-var\(txn.rl_key\) var\(txn.rl_budget\),concat\(\|,txn.rl_dim\)
    - type: match_order
      target: haproxy.cfg
      patterns:
      - str\(api_key\)
      - str\(policy_consumer_missing\)
      - send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if .*rl_keyspec.*consumer
    - type: not_contains
      target: map:gw-policy-errors.map
      pattern: invalid
    _helm_skip_test: '{{ if not .Values.rateLimit.shared.enabled }}true{{ end }}'
