    - type: contains
      target: map:haptic-cache-ttl.map
      pattern: (?m)^gateway/h_default_same-name_0 60$
    - type: contains
      target: map:haptic-cache-maxsize.map
      pattern: (?m)^gateway/h_default_same-name_0 1048576$
    - type: contains
      target: map:haptic-cache-private.map
      pattern: (?m)^gateway/h_default_same-name_0 1$
    - type: contains
      target: map:haptic-cache-vary.map
      pattern: (?m)^gateway/h_default_same-name_0 X-Api-Version$
    - type: contains
      target: haproxy.cfg
      pattern: X-Haptic-Cache-Vary Z2F0ZXdheS9oX2RlZmF1bHRfc2FtZS1uYW1lXzA=\|%\[var\(txn.haptic_consumer\),base64\]\|%\[req.hdr\(X-Api-Version\),base64\]
    - type: contains
      target: haproxy.cfg
      pattern: X-Haptic-Backend %\[var\(txn.backend_name\)\]
    - type: not_contains
      target: map:gw-policy-errors.map
      pattern: invalid
    - type: match_order
      target: haproxy.cfg
      patterns:
      - str\(policy_consumer_missing\)
      - set-var\(txn.cache_eligible\) bool\(true\)
    extraContext:
      cache:
        varnish:
