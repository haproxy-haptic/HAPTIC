  util-map-gateway-policy-errors:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayPolicyErrorsMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] != "" -%}
            {{- "\n" + tostring(record["id"]) + " invalid" -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-gateway-policy-errors:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro PublishGatewayPolicyErrors(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] != "" -%}
            {%%
              var namespace = dig_string(route, "", "metadata", "namespace")
              var name = dig_string(route, "", "metadata", "name")
              record["kind"] = kind
              record["namespace"] = namespace
              record["name"] = name
              record["resource"] = map[string]any{"apiVersion": dig_string(route, "", "apiVersion"), "kind": kind, "metadata": dig(route, "metadata")}
              record["dependencies"] = append(toSlice(record["dependencies"]), map[string]any{"store": toLower(kind) + "s", "namespace": namespace, "name": name})
              show shared.Publish("errors", tostring(record["ruleID"]), record)
            %%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-map-haptic-jwt-routes-859-gateway:
    template: |-
      {%- import "util-jwt-map-value" for JWTMapValue -%}
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayJWTMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "jwt") != nil -%}
            {{- "\n" + tostring(record["id"]) + " " -}}{{- JWTMapValue(dig(record, "authentication", "jwt").(map[string]any)) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-map-haptic-api-key-routes-861-gateway:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayAPIKeyRoutesMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "apiKey") != nil -%}
            {%- var settings = dig(record, "authentication", "apiKey").(map[string]any) -%}
            {{- "\n" + tostring(record["id"]) + " hdr " + tostring(settings["name"]) + " " + tostring(settings["secretRef"]) + " ok " + tostring(settings["fwd"]) + " " + tostring(settings["fwdSet"]) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-map-haptic-apikeys-861-gateway:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro GatewayAPIKeysMap(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "apiKey") != nil -%}
            {%- var secret = dig_string(record, "", "authentication", "apiKey", "secretRef") -%}
            {%- for key, consumer := range to_str_map(dig(record, "authentication", "apiKeys")) -%}
              {{- shared.Unique("map-haptic-apikeys", secret + "|" + key, "\n" + secret + "|" + key + " " + tostring(consumer)) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-features-854-gateway-jwt-files:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro PublishGatewayJWTFiles(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "jwt") != nil -%}
            {%- var key = dig(record, "authentication", "publicKey") -%}
            {{- shared.Publish("files", dig_string(key, "", "filename"), map[string]any{"filename": dig_string(key, "", "filename"), "content": dig_string(key, "", "content")}) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-features-856-gateway-jwt-names:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro PublishGatewayJWTNames(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "jwt") != nil -%}
            {%- var jwt = dig(record, "authentication", "jwt").(map[string]any) -%}
            {%- var pair = tostring(jwt["alg"]) + "|" + tostring(jwt["keyFile"]) -%}
            {{- shared.Publish("any", "any", "any") -}}
            {{- shared.Publish("keys", pair, pair) -}}
            {%- for _, claim := range toSlice(jwt["req"]) -%}{{- shared.Publish("req", tostring(claim), claim) -}}{%- end -%}
            {%- for _, value := range toSlice(jwt["fwd"]) -%}
              {%- var forward = tostring(value) -%}
              {%- var header = strings_splitn(forward, ":", 2)[1] -%}
              {{- shared.Publish("fwd", forward, forward) -}}
              {{- shared.Publish("fwdhdr", header, header) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-features-856-gateway-api-key-names:
    template: |-
      {%- import "util-gateway-policy-decision" for GatewayPolicyDecision -%}
      {%- macro PublishGatewayAPIKeyNames(route any, kind string) -%}
        {%- for index, rule := range toSlice(dig(route, "spec", "rules")) -%}
          {%- var record = map[string]any{} -%}
          {{- GatewayPolicyDecision(route, kind, rule, index, record) -}}
          {%- if record["attached"] == true && record["error"] == "" && dig(record, "authentication", "apiKey") != nil -%}
            {%- var settings = dig(record, "authentication", "apiKey").(map[string]any) -%}
            {{- shared.Publish("any", "any", "any") -}}
            {{- shared.Publish("hdr", tostring(settings["name"]), settings["name"]) -}}
            {%- if settings["fwdSet"] == true -%}{{- shared.Publish("fwd", tostring(settings["fwd"]), settings["fwd"]) -}}{%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}
