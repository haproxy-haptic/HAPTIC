maps:
  gw-policy-errors.map:
    template: |
      {{ on_own_lines(render_glob "map-gateway-policy-errors-*") -}}

templateSnippets:
  gateway-policy-errors-empty:
    incremental:
      bindingsTemplate: '{}'
      group: gateway-policy-errors
      effects: [publishValue]
    template: '{{- "" -}}'

  features-004-gateway-policy-errors:
    template: |-
      {{- render_glob "gateway-policy-errors-*" -}}
      {%- for _, value := range incremental_values("gateway-policy-errors", "errors") -%}
        {%%
          var record = value.(map[string]any)
          var message = tostring(record["kind"]) + " " + tostring(record["namespace"]) + "/" + tostring(record["name"]) + ": " + tostring(record["error"]) + " Requests for this rule are denied."
          var affected = len(admissionSubject) == 0
          for _, dependency := range toSlice(record["dependencies"]) {
            var store = dig_string(dependency, "", "store")
            var matchesStore = dig_string(admissionSubject, "", "store") == store || dig(admissionSubject, "stores", store) == true
            if matchesStore && dig_string(dependency, "", "namespace") == dig_string(admissionSubject, "", "namespace") &&
              dig_string(dependency, "", "name") == dig_string(admissionSubject, "", "name") {
              affected = true
            }
          }
          if renderMode == "admission" && affected { fail(message) }
          recordEvent(record["resource"], "RoutePolicyInvalid", message)
        %%}
      {%- end -%}

  map-gateway-policy-errors-http:
    requires: [httproutes]
    incremental:
      whenAnyPathExists: ["spec.rules[*].filters", "spec.rules[*].backendRefs[*].filters"]
      source: httproutes
      consumes: [gateway-policy-records]
    template: |-
      {%- import "util-map-gateway-policy-errors" for GatewayPolicyErrorsMap -%}
      {{- GatewayPolicyErrorsMap(item, "HTTPRoute") -}}

  gateway-policy-errors-http:
