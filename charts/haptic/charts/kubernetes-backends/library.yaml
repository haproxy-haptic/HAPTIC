  test-server-named-after-pod:
    requires: [endpoints]
    description: The server IS the pod (pod-named servers) and the log reads its name
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: pn }
          spec:
            ingressClassName: haproxy
            rules:
              - host: pods.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+server echo-pod-1 10\.0\.0\.1:8080 .*# Pod: echo-pod-1$'
        description: >-
          The server IS the pod: its name is the pod name (ADR-0011), so a
          rolling update is an add/remove of named servers over the runtime API.
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^\s+server SRV_[0-9]'
        description: No slot pool — no SRV_N placeholders.
      - {type: contains, target: haproxy.cfg, pattern: '%\(server_pod\)s'}
      - type: not_contains
        target: haproxy.cfg
        pattern: 'bc_dst,map\('
        description: server_pod reads the server name directly, no pod-names.map.
      # namespace/service come from backend-service.map (keyed on the backend),
      # not per-backend set-var lines, so the backend body stays empty (dynamic).
      - {type: contains, target: haproxy.cfg, pattern: '%\(service\)\[var\(txn\.backend_name\),map\([^)]*backend-service\.map\),field\(2,/\)\]'}
      - {type: contains, target: 'map:backend-service.map', pattern: '(?m)^default_pn_svc_echo_80 default/echo$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.service\)'}

  test-pod-readiness-gate-routes-pending-pod:
    requires: [endpoints, backend_pods]
    description: A gated pod with ready containers is routed before Ready and gets the gate only once deployed
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: gated}
          spec:
            ingressClassName: haproxy
            rules:
              - host: gated.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: gated, port: {number: 80}}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: gated}
          spec: {ports: [{port: 80}]}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {namespace: default, name: gated-abc, labels: {kubernetes.io/service-name: gated}}
          addressType: IPv4
          endpoints:
            - addresses: ["10.4.0.1"]
              conditions: {ready: false}
              targetRef: {kind: Pod, name: gated-new}
            - addresses: ["10.4.0.2"]
              conditions: {ready: false}
              targetRef: {kind: Pod, name: ungated-new}
            - addresses: ["10.4.0.3"]
              conditions: {ready: false, terminating: true}
              targetRef: {kind: Pod, name: gated-old}
          ports:
            - port: 8080
      backend_pods:
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: default, name: gated-new, uid: 6b1e6a52-0d55-4f0b-9f43-1a7c1b2f0e01}
          spec:
            containers: [{name: app, image: app}]
            readinessGates: [{conditionType: haproxy-haptic.org/load-balancer-ready}]
          status:
            conditions:
              - {type: ContainersReady, status: "True"}
              - {type: Ready, status: "False"}
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: default, name: ungated-new, uid: 6b1e6a52-0d55-4f0b-9f43-1a7c1b2f0e02}
          spec:
            containers: [{name: app, image: app}]
          status:
            conditions:
              - {type: ContainersReady, status: "True"}
              - {type: Ready, status: "False"}
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: default, name: gated-old, uid: 6b1e6a52-0d55-4f0b-9f43-1a7c1b2f0e03}
          spec:
            containers: [{name: app, image: app}]
            readinessGates: [{conditionType: haproxy-haptic.org/load-balancer-ready}]
          status:
            conditions:
              - {type: ContainersReady, status: "True"}
              - {type: haproxy-haptic.org/load-balancer-ready, status: "True", lastTransitionTime: "2026-01-01T00:00:00Z"}
              - {type: Ready, status: "True"}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server gated-new 10\.4\.0\.1:8080 '}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^\s+server gated-new 10\.4\.0\.1:8080 .*\bdisabled\b'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server ungated-new 10\.4\.0\.2:8080 .*\bdisabled\b'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server gated-old 10\.4\.0\.3:8080 .*\bdisabled\b'}
      - {type: contains, target: 'status:default/gated-new:deployed', pattern: '"type":"haproxy-haptic\.org/load-balancer-ready"'}
      - {type: contains, target: 'status:default/gated-new:deployed', pattern: '"status":"True"'}
      - type: contains
        target: 'status:default/gated-old:deployed'
        pattern: '"lastTransitionTime":"2026-01-01T00:00:00Z"'
        description: An existing True gate keeps its transition time, so the patch is a no-op.
      - type: not_exists
        target: 'status:default/gated-new:rendered'
        description: A rendered-phase gate would let the old pod go before HAProxy has the new one.
      - {type: not_exists, target: 'status:default/ungated-new:deployed'}

