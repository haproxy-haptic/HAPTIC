# SPOA hub library — production templateSnippets, batch 30:
#
# Frontend-scope directives that dispatch into the SPOA hub:
#   - frontend-filters-100-spoa-hub        (filter spoe directive)
#   - frontend-spoe-filters-020-rate-limit-config (shared-limit map lookup)
#   - frontend-spoe-filters-025-rate-limit-ip (pre-WAF source-IP limit)
#   - frontend-spoe-filters-050-coraza     (WAF dispatch + deny)
#   - frontend-spoe-filters-100-external-auth (external-auth subrequest)

templateSnippets:
  # Shared implementation for source-IP and authenticated-consumer rate-limit
  # dispatch. The caller chooses the key dimension and is responsible for
  # attaching the SPOE filter to its proxy. Both paths use the same dependency
  # policy and verdict handling.
  # extraCond ("" for none) is an additional ACL appended to every rule — the
  # cache client-leg dispatch scopes itself to cache-enabled routes with it.
  # A request with txn.rl_allow set (an allowlisted client, decided before this
  # block by the route library) is exempt: no dispatch, no verdict, no headers.
  util-spoa-rate-limit-dispatch:
    template: |
      {% macro DispatchSharedRateLimit(keySpec string, extraCond string, failClosed bool) string %}
      {%- if extraCond != "" %}{%- extraCond = " " + extraCond %}{%- end %}
      http-request unset-var(txn.rl_verdict_class)
      {# Build <ns>/<name>|<dimension>. Consumer mode uses the identity set by
          native API-key/JWT backend rules and falls back to source IP when the
          route has no authenticated identity. #}
      http-request set-var(txn.rl_dim) src if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} }{{ extraCond }}
      {%- if keySpec == "consumer" %}
      http-request set-var(txn.rl_dim) var(txn.haptic_consumer) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str consumer } { var(txn.haptic_consumer) -m found }{{ extraCond }}
      {%- end %}
      http-request set-var(txn.rl_key) var(txn.rl_budget),concat(|,txn.rl_dim) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} }{{ extraCond }}
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.rl_dim),length gt 0 }{{ extraCond }}
      http-request set-var(txn.denied_by) str(rate_limit_shared_invalid) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.rl_rule_invalid) -m bool }{{ extraCond }}
      http-request deny deny_status 429 hdr Retry-After 1 if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.rl_rule_invalid) -m bool }{{ extraCond }}
      http-request send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.rl_rule_invalid) -m bool }{{ extraCond }}
      http-request set-var(txn.rate_limit_degraded) str(1) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.hub.rate_limit.allowed) -m found }{{ extraCond }}
      http-request set-var(txn.rate_limit_degraded) str(1) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.degraded) -m bool }{{ extraCond }}
      {%- if failClosed %}
      http-request set-var(txn.denied_by) str(rate_limit_shared_unavailable) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.hub.rate_limit.allowed) -m found }{{ extraCond }}
      http-request deny deny_status 429 hdr Retry-After 1 if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } !{ var(txn.hub.rate_limit.allowed) -m found }{{ extraCond }}
      {%- end %}
      http-request set-var(txn.rl_verdict_class) str(limited) if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found } !{ var(txn.hub.rate_limit.allowed) -m bool }{{ extraCond }}
      http-request set-var(txn.rl_verdict_class) str(fallback-limited) if { var(txn.rl_verdict_class) -m str limited } { var(txn.hub.rate_limit.degraded) -m bool } { var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      http-request set-var(txn.rl_verdict_class) str(unavailable) if { var(txn.rl_verdict_class) -m str limited } { var(txn.hub.rate_limit.degraded) -m bool } !{ var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      http-request set-var(txn.rl_verdict_class) str(invalid) if { var(txn.rl_verdict_class) -m str limited } { var(txn.hub.rate_limit.degraded) -m found } !{ var(txn.hub.rate_limit.degraded) -m bool } !{ var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      http-request set-var(txn.denied_by) str(rate_limit_shared) if { var(txn.rl_verdict_class) -m str limited }{{ extraCond }}
      http-request set-var(txn.denied_by) str(rate_limit_shared_unavailable) if { var(txn.rl_verdict_class) -m str fallback-limited unavailable }{{ extraCond }}
      http-request set-var(txn.denied_by) str(rate_limit_shared_invalid) if { var(txn.rl_verdict_class) -m str invalid }{{ extraCond }}
      http-request deny deny_status 429 hdr Retry-After %[var(txn.hub.rate_limit.retry_after)] if { var(txn.rl_verdict_class) -m str limited fallback-limited }{{ extraCond }}
      http-request deny deny_status 429 hdr Retry-After 1 if { var(txn.rl_verdict_class) -m str unavailable invalid }{{ extraCond }}
      {# http-after-response also covers HAProxy's internally generated 429. #}
      http-after-response set-header X-RateLimit-Limit %[var(txn.hub.rate_limit.limit)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found } !{ var(txn.hub.rate_limit.degraded) -m found } !{ var(txn.hub.rate_limit.accounted) -m found }{{ extraCond }}
      http-after-response set-header X-RateLimit-Remaining %[var(txn.hub.rate_limit.remaining)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found } !{ var(txn.hub.rate_limit.degraded) -m found } !{ var(txn.hub.rate_limit.accounted) -m found }{{ extraCond }}
      http-after-response set-header X-RateLimit-Reset %[var(txn.hub.rate_limit.reset)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.allowed) -m found } !{ var(txn.hub.rate_limit.degraded) -m found } !{ var(txn.hub.rate_limit.accounted) -m found }{{ extraCond }}
      http-after-response set-header X-RateLimit-Limit %[var(txn.hub.rate_limit.limit)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      http-after-response set-header X-RateLimit-Remaining %[var(txn.hub.rate_limit.remaining)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      http-after-response set-header X-RateLimit-Reset %[var(txn.hub.rate_limit.reset)] if { var(txn.rl_limit) -m found } !{ var(txn.rl_allow) -m bool } { var(txn.rl_keyspec) -m str {{ keySpec }} } { var(txn.hub.rate_limit.accounted) -m bool }{{ extraCond }}
      {% end %}

  # Body-inspecting features pass req.body to SPOE, and HAProxy only exposes
  # buffered bytes — so the buffer has to hold the whole body. The size is a knob
  # here (extraContext.requestBodyInspection.haproxyBuffer.sizeBytes) but the
  # directive belongs to base's global-settings-270-cli-limits, which takes the
  # larger of it and the CLI-batch size: two snippets emitting one global keyword
  # leave the effective value to band order.

  # ==========================================================================
  # JSON access-log fields (extension point: log-fields-*, band 300).
  #
  # Each snippet contributes only when its plugin message is actually enabled,
  # so an install without that feature pays no bytes per log line. All values
  # are plugin write-backs under txn.hub.<plugin>.*, which are transaction-scoped
  # and therefore available at log time. They stay untyped strings: a typed item
  # whose fetch does not resolve renders "" into a numeric slot.
  #
  # See base.yaml's "Access log" block for the contribution contract.
  # ==========================================================================

  log-fields-300-waf:
    template: |-
      {#
        WAF verdict fields.

        waf_rule_id and waf_score are what the Prometheus rule-hit counters
        cannot give you: the join from one specific 403 a user complained about
        to the CRS rule that produced it, and the anomaly score distribution that
        drives threshold tuning in detect mode. waf_rules_hit is the per-request
        count of rules that matched — the detect-mode noise signal for one
        request, where the metric gives only the fleet aggregate. All three are
        near-empty on the happy path.

        None of these is typed :sint. The vars only exist once the coraza SPOE
        message has run, and a typed item whose fetch does not resolve emits ""
        into a numeric JSON slot — a string where the schema promises a number.

        waf_matched_var names the request FIELDS the rules matched on — e.g.
        `ARGS_GET:id,REQUEST_LINE` — and never their values (coraza plugin
        >= v0.8.0). That is the "on what did it fire" half of triage, which
        otherwise requires Coraza's audit log, and that log writes the client IP,
        every request header and the matched bytes to the sidecar's stdout. Names
        are safe to log where values are not, so this needs no opt-in.

        txn.hub.coraza.data is deliberately never logged here — it echoes request
        payload fragments and is off by default (expose_matched_data=false). An
        operator who needs the matched target for false-positive triage opts into
        it knowingly; the JSON encoder escapes quotes and newlines, so the
        remaining cost is PII plus the maxLineBytes budget, not log injection.
      #}
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- if messages contains "check-request" %}
      %(waf_action)[var(txn.hub.coraza.action)]
      %(waf_rule_id)[var(txn.hub.coraza.rule_id)]
      %(waf_score)[var(txn.hub.coraza.anomaly_score)]
      %(waf_rules_hit)[var(txn.hub.coraza.rules_hit)]
      %(waf_matched_var)[var(txn.hub.coraza.matched_var)]
      {%- end %}

  log-fields-310-rate-limit:
    template: |-
      {#
        Shared rate-limit verdict.

        rate_limit_allowed distinguishes "client hit its budget" from a strict
        dependency denial — see the two denied_by values in
        util-spoa-rate-limit-dispatch. rate_limit_remaining is the headroom the
        client was told about, which is what makes a burst pattern readable
        after the fact. The limit/reset/retry_after values are already on the
        wire as X-RateLimit-* response headers and add nothing here.
      #}
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- if messages contains "check-ratelimit" %}
      %(rate_limit_allowed)[var(txn.hub.rate_limit.allowed)]
      %(rate_limit_remaining)[var(txn.hub.rate_limit.remaining)]
      {%- end %}

  log-fields-320-external-auth:
    template: |-
      {#
        External-auth outcome.

        HAProxy always returns 401 to the client regardless of what the auth
        service answered (see the deny in frontend-spoe-filters-100-external-auth),
        so this is the only place the "not logged in" / "forbidden" / "auth
        service broken" distinction survives. The extracted identity headers
        (x_auth_user, x_auth_roles) are deliberately NOT logged: they are PII and
        are already forwarded to the app, which logs them in its own context.
      #}
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- if messages contains "check-auth" %}
      %(auth_status)[var(txn.hub.external_auth.status_code)]
      {%- end %}

  log-fields-330-schema-validation:
    template: |-
      {#
        Request-schema validation outcome — the only field that says WHY a 422 /
        413 / 415 happened. The plugin's free-form `detail` string is not logged:
        it is unbounded and may echo body content.
      #}
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- if messages contains "validate-request" %}
      %(schema_outcome)[var(txn.hub.api_gateway.outcome)]
      %(schema_degraded)[var(txn.schema_degraded)]
      {%- end %}

  frontend-filters-100-spoa-hub:
    template: |-
      {%- if (render "util-spoa-hub-enabled") == "true" %}
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- for _, msg := range messages %}
      filter spoe engine spoa-hub-{{ msg }} config {{ pathResolver.GetPath("spoe.conf", "file") }}
      {%- end %}
      {{- on_own_lines(render_glob "frontend-spoe-filters-*") }}
      {%- end %}

  # Resolve and parse the packed shared-rate-limit rule before any plugin is
  # dispatched. Priority 020 lets source-IP limits reject abusive traffic at
  # 025, before the more expensive Coraza pass at 050. Consumer-keyed limits
  # reuse these transaction variables in the haptic-annotations dispatch block
  # (band 863), after native API-key/JWT rules have established txn.haptic_consumer.
  frontend-spoe-filters-020-rate-limit-config:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-ratelimit" %}
      {# One packed map keyed by resource_key -> "limit period burst mode
          keyspec". Routes without an annotation miss and skip all later
          rate-limit rules. #}
      http-request set-var(txn.rl_identity) var(txn.resource_key)
      http-request set-var(txn.rl_identity) var(txn.policy_id) if { var(txn.policy_id) -m found }
      http-request set-var(txn.rl_cfg) var(txn.rl_identity),map({{ pathResolver.GetPath("rate-limit.map", "map") }}) unless { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_budget) var(txn.rl_identity) if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_budget) var(txn.rl_cfg),field(6,' ') if { var(txn.rl_cfg),field(6,' '),length gt 0 }
      http-request set-var(txn.rl_limit) var(txn.rl_cfg),field(1,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_period) var(txn.rl_cfg),field(2,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_burst) var(txn.rl_cfg),field(3,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_mode) var(txn.rl_cfg),field(4,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_keyspec) var(txn.rl_cfg),field(5,' ') if { var(txn.rl_cfg) -m found }
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_cfg) -m found } !{ var(txn.rl_limit) -m reg ^[1-9][0-9]*$ }
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_cfg) -m found } !{ var(txn.rl_period) -m reg ^(0\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(\.[0-9]+)?)$ }
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_cfg) -m found } !{ var(txn.rl_burst) -m reg ^[1-9][0-9]*$ }
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_cfg) -m found } !{ var(txn.rl_mode) -m str lease exact }
      http-request set-var(txn.rl_rule_invalid) bool(true) if { var(txn.rl_cfg) -m found } !{ var(txn.rl_keyspec) -m str ip consumer }
      http-request set-var(txn.denied_by) str(rate_limit_shared_invalid) if { var(txn.rl_cfg) -m found } { var(txn.rl_rule_invalid) -m bool }
      http-request deny deny_status 429 hdr Retry-After 1 if { var(txn.rl_cfg) -m found } { var(txn.rl_rule_invalid) -m bool }
      {%- end %}

  # Source-IP limits are the public-edge DoS guard. Run them before Coraza so
  # rejected floods do not consume WAF CPU. Consumer quotas deliberately run
  # later (band 863) because their identity is established by then.
  frontend-spoe-filters-025-rate-limit-ip:
    template: |
      {%- import "util-spoa-rate-limit-dispatch" for DispatchSharedRateLimit %}
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-ratelimit" %}
      {%- var failClosed = tostring(extraContext | dig("rateLimit", "shared", "failClosed") | fallback(false)) == "true" %}
      {{ DispatchSharedRateLimit("ip", "", failClosed) }}
      {%- end %}

  # Coraza WAF dispatch. Reusable HAPTIC policies add a per-Ingress body
  # contract: requestBody:none never waits, while requestBody:any/json requires
  # a bounded complete Content-Length body. The plugin receives explicit
  # body-mode/body-complete and detect-only values.
  #
  # Multi-tenant per-path dispatch (no rule bleed across Ingresses):
  #
  # Two maps drive the per-path lookup:
  #   - coraza-app.map (populated by nginx-ingress.yaml's
  #     map-coraza-app-* snippet): `<host><path>` → `<ns>/<name>` for
  #     Ingresses that carry `nginx.ingress.kubernetes.io/modsecurity-snippet`.
  #     The matching app's `[plugins.params.applications."<ns>/<name>"]`
  #     block carries the chart-default base directives + that
  #     Ingress's per-Ingress rules. The plugin routes via the `app=`
  #     SPOE arg below.
  #   - haproxy-ingress-waf.map (populated by haproxy-ingress.yaml's
  #     map-haproxy-ingress-waf-* snippet): `<host><path>` → `deny|detect`
  #     for Ingresses with `haproxy-ingress.github.io/waf`. Drives the
  #     deny-skip predicate below for shadow-mode rollouts.
  #
  # Dispatch fires when either the app or enforcement map matches policy_id.
  # Resources without any matching annotation skip the SPOE roundtrip entirely
  # (matches haproxy-ingress.github.io upstream semantic). The
  # haproxy-ingress.github.io/waf-mode annotation only matters when a
  # `/waf` annotation is also present; without `/waf` the deny rule
  # falls back to its default (deny on rule match).
  #
  # **Behavior change vs pre-multitenant chart:** previously, ANY
  # nginx.ingress.kubernetes.io/modsecurity-snippet anywhere chart-wide
  # caused unconditional dispatch on EVERY request (rules pooled into a
  # single global WAF instance, evaluating against all traffic).
  # That's a privilege-escalation vector in multi-tenant clusters.
  # Now, modsec-snippets only fire on traffic owned by their carrying
  # Ingress (resource_key keying). Operators who depended on the
  # rule-bleed behavior must move shared rules into chart-level
  # `spoaHub.plugins.coraza.directives` (the base ruleset, applied to
  # every per-Ingress app + the default WAF).
  #
  # Priority 050 runs the WAF pass BEFORE the external-auth subrequest
  # at priority 100 — standard "WAF first, auth second" pipeline. Emits
  # nothing unless `check-request` is in the chart's messages union
  # (i.e. coraza is enabled).
  frontend-spoe-filters-050-coraza:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-request" %}
      {%- var dispatchMode = extraContext | dig_string("opt-in", "waf", "dispatch", "mode") %}
      {%- var defaultEnforcement = extraContext | dig_string("deny", "waf", "dispatch", "defaultEnforcement") %}
      {%- var corazaBodyWaitTimeout = extraContext | dig_string("100ms", "waf", "policies", "requestBody", "waitTimeout") %}
      {%- if dispatchMode != "opt-in" && dispatchMode != "default-on" %}
        {%- fail("Invalid WAF dispatch mode '" + dispatchMode + "'; set controller.config.templatingSettings.extraContext.waf.dispatch.mode in Helm values or spec.templatingSettings.extraContext.waf.dispatch.mode in a raw HAProxyTemplateConfig to 'opt-in' or 'default-on'.") %}
      {%- end %}
      {%- if defaultEnforcement != "deny" && defaultEnforcement != "detect" %}
        {%- fail("Invalid WAF default enforcement '" + defaultEnforcement + "'; set controller.config.templatingSettings.extraContext.waf.dispatch.defaultEnforcement in Helm values or spec.templatingSettings.extraContext.waf.dispatch.defaultEnforcement in a raw HAProxyTemplateConfig to 'deny' or 'detect'.") %}
      {%- end %}
      {%- if !regex_search(corazaBodyWaitTimeout, "^[1-9][0-9]*(us|ms|s|m|h|d)?$") %}
        {%- fail("extraContext.waf.policies.requestBody.waitTimeout must be a positive HAProxy duration.") %}
      {%- end %}
      {#- Emitted only while a route has a WAF map entry, or dispatch is
          default-on; the first route reloads once, as does removing the last. #}
      {%- var wafRoutes = strip((render_glob "map-coraza-app-*") + (render_glob "map-haproxy-ingress-waf-*")) %}
      {%- if dispatchMode == "default-on" || wafRoutes != "" %}
      http-request set-var(txn.coraza_app) var(txn.policy_id),map({{ pathResolver.GetPath("coraza-app.map", "map") }}) unless { var(txn.coraza_app) -m found }
      http-request set-var(txn.coraza_mode) var(txn.policy_id),map({{ pathResolver.GetPath("haproxy-ingress-waf.map", "map") }}) unless { var(txn.coraza_mode) -m found }
      http-request set-var(txn.coraza_body_cfg) var(txn.policy_id),map({{ pathResolver.GetPath("coraza-body.map", "map") }}) unless { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_body_policy) var(txn.coraza_body_cfg),field(1,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_content_policy) var(txn.coraza_body_cfg),field(2,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_max_body) var(txn.coraza_body_cfg),field(3,' ') if { var(txn.coraza_body_cfg) -m found }
      http-request set-var(txn.coraza_body_mode) str(none)
      http-request set-var(txn.coraza_body_complete) bool(false)
      http-request set-var(txn.coraza_detect_only) bool(false)
      http-request set-var(txn.coraza_active) bool(false)
      {%- if dispatchMode == "default-on" %}
      http-request set-var(txn.coraza_disabled) var(txn.policy_id),map({{ pathResolver.GetPath("coraza-disabled.map", "map") }}) unless { var(txn.coraza_disabled) -m found }
      http-request set-var(txn.coraza_mode) str({{ defaultEnforcement }}) unless { var(txn.coraza_mode) -m found }
      http-request set-var(txn.coraza_active) bool(true) unless { var(txn.coraza_disabled) -m found }
      {%- else %}
      http-request set-var(txn.coraza_active) bool(true) if { var(txn.coraza_app) -m found } || { var(txn.coraza_mode) -m found }
      {%- end %}
      http-request set-var(txn.coraza_body_mode) str(buffered) if { var(txn.coraza_active) -m bool } { var(txn.coraza_body_policy) -m str buffered } { method POST PUT PATCH DELETE }
      http-request set-var(txn.coraza_detect_only) bool(true) if { var(txn.coraza_active) -m bool } { var(txn.coraza_mode) -m str detect }
      {# Buffered profiles inspect a bounded complete body. A chunked/streaming
          request (Transfer-Encoding, no Content-Length) cannot prove
          completeness from req.body and is rejected 411 — but a request with
          NO body (neither header, e.g. an ordinary DELETE or empty POST) has
          an empty complete body and is passed through to Coraza, not rejected.
          The Content-Type check tolerates the RFC 9110 optional whitespace
          before the parameter `;`. All body-contract rejections are skipped in
          detect (shadow) mode: a detect policy observes without blocking live
          traffic; truncated/uninspectable bodies simply aren't inspected. #}
      http-request set-var(txn.denied_by) str(waf_body_content_type) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_content_policy) -m str json } { req.hdr(Content-Length) -m found } !{ req.hdr(Content-Type),field(1,';'),lower -m reg ^application/([a-z0-9.+-]+\+)?json[[:space:]]*$ }
      http-request return status 415 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_content_policy) -m str json } { req.hdr(Content-Length) -m found } !{ req.hdr(Content-Type),field(1,';'),lower -m reg ^application/([a-z0-9.+-]+\+)?json[[:space:]]*$ }
      http-request set-var(txn.denied_by) str(waf_body_duplicate_content_length) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr_cnt(Content-Length) gt 1 }
      http-request return status 400 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr_cnt(Content-Length) gt 1 }
      http-request set-var(txn.denied_by) str(waf_body_chunked) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr(Transfer-Encoding) -m found } !{ req.hdr(Content-Length) -m found }
      http-request return status 411 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { req.hdr(Transfer-Encoding) -m found } !{ req.hdr(Content-Length) -m found }
      http-request set-var(txn.coraza_body_size) req.body_size if { var(txn.coraza_body_mode) -m str buffered }
      http-request set-var(txn.denied_by) str(waf_body_too_large) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_size),sub(txn.coraza_max_body) -m int gt 0 }
      http-request return status 413 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_size),sub(txn.coraza_max_body) -m int gt 0 }
      {# The wait is split by enforcement mode because only one of them is
          allowed to block.

          A request whose body length is not declared (no Content-Length) and
          that has not finished arriving cannot be waited for safely: HTTP/2
          streaming — gRPC client/bidi streaming above all — keeps the body open
          until the peer is done, so the wait runs to its timeout and HAProxy
          answers 408 with the backend never contacted. A bodyless request is
          NOT affected: it is complete on arrival, so wait-for-body returns
          immediately (verified: an h2 DELETE with no body forwards at TR=0).

          Detect (shadow) mode is documented as observing without blocking live
          traffic, so it must never produce that 408 — it waits only for a body
          whose length is declared, and an unbounded one is simply left
          uninspected, exactly as the other body-contract rules already degrade
          in detect mode.

          Enforce mode keeps waiting unconditionally: a body it cannot bound
          must not reach the backend uninspected, so the timeout's 408 is a
          fail-closed refusal rather than a defect. The consequence is that a
          buffered policy cannot be combined with a streaming route — see
          docs/site/docs/libraries/haptic-annotations.md#waf-and-grpc-streaming. #}
      http-request wait-for-body time {{ corazaBodyWaitTimeout }} if { var(txn.coraza_body_mode) -m str buffered } { var(txn.coraza_detect_only) -m bool } { req.hdr(Content-Length) -m found }
      http-request wait-for-body time {{ corazaBodyWaitTimeout }} if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool }
      http-request set-var(txn.coraza_body_len) req.body_len if { var(txn.coraza_body_mode) -m str buffered }
      http-request set-var(txn.denied_by) str(waf_body_incomplete) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_len),sub(txn.coraza_body_size) -m int lt 0 }
      http-request return status 413 if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool } { var(txn.coraza_body_len),sub(txn.coraza_body_size) -m int lt 0 }
      {# body-complete must mirror the wait split exactly, or it lies. The SPOE
          contract (20-config-content.yaml) is that a buffered profile sets
          complete only after HAProxy proves the advertised body fits and was
          received in full — so the flag may only be asserted where a wait
          actually ran. Detect mode skips the wait for an undeclared body, and
          claiming completeness there would hand Coraza whatever bytes happened
          to be buffered, tagged as a whole body, producing a shadow verdict on
          a truncated request that an operator would read as "enforcement would
          have been safe". Enforce always waits, and a wait that times out has
          already returned 408 before reaching here, so its unconditional form
          stays correct. #}
      http-request set-var(txn.coraza_body_complete) bool(true) if { var(txn.coraza_body_mode) -m str buffered } { var(txn.coraza_detect_only) -m bool } { req.hdr(Content-Length) -m found }
      http-request set-var(txn.coraza_body_complete) bool(true) if { var(txn.coraza_body_mode) -m str buffered } !{ var(txn.coraza_detect_only) -m bool }
      http-request send-spoe-group spoa-hub-check-request check-request-group if { var(txn.coraza_active) -m bool }
      {# Hub admission and plugin engine failures ALLOW the request and record
          it. A WAF reduces risk; it does not establish identity, so a blip in
          our own sidecar must not 503 callers who did nothing wrong — see
          "Runtime dependency failure" in charts/CLAUDE.md. Detect-only coercion
          happens inside Coraza only for completed rule decisions, never for
          infrastructure errors.

          waf.failClosed restores the 503 for operators who would rather refuse
          traffic than let it past uninspected. Off by default.

          Either way txn.waf_degraded is set, so an uninspecting WAF shows up in
          the access log and in haptic_degraded_waf_total rather than
          looking healthy. Its own variable, not a shared one: see the rate
          limiter above. #}
      {%- var wafFailClosed = tostring(extraContext | dig("waf", "failClosed") | fallback(false)) == "true" %}
      http-request set-var(txn.waf_degraded) str(1) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m found }
      http-request set-var(txn.waf_degraded) str(1) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m str ok }
      http-request set-var(txn.waf_degraded) str(1) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.action) -m found }
      {%- if wafFailClosed %}
      http-request set-var(txn.denied_by) str(waf_unavailable) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m found }
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m found }
      http-request set-var(txn.denied_by) str(waf_unavailable) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m str ok }
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.__status) -m str ok }
      http-request set-var(txn.denied_by) str(waf_unavailable) if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.action) -m found }
      http-request return status 503 if { var(txn.coraza_active) -m bool } !{ var(txn.hub.coraza.action) -m found }
      {%- end %}
      http-request set-var(txn.denied_by) str(waf_status_400) if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 400 }
      http-request return status 400 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 400 }
      http-request set-var(txn.denied_by) str(waf_status_413) if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 413 }
      http-request return status 413 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 413 }
      http-request set-var(txn.denied_by) str(waf_unavailable) if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 500:599 }
      http-request return status 503 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.status) -m int 500:599 }
      {# `-m found` first: an unset action means the plugin never answered, and
          `!{ … -m str allow }` alone is true for it — which would 403 the very
          requests fail-open exists to let through. Same gate the rate limiter
          puts on its 429 above. #}
      http-request set-var(txn.denied_by) str(waf) if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.action) -m found } !{ var(txn.hub.coraza.action) -m str allow }
      http-request deny deny_status 403 if { var(txn.coraza_active) -m bool } { var(txn.hub.coraza.action) -m found } !{ var(txn.hub.coraza.action) -m str allow }
      {%- end %}
      {%- end %}

  # External-auth wiring: looks up the per-ingress auth URL in
  # auth-url.map (populated by ingress libraries from their auth-url
  # annotation), triggers the SPOE check, and denies on failure.
  # Conditional on `check-auth` being in the chart's messages union —
  # only emits when the external-auth plugin is enabled.

  frontend-spoe-filters-100-external-auth:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "check-auth" %}
      {#- Emitted only while a route has an auth-url map entry; the first
          route reloads once, as does removing the last. #}
      {%- if strip(render_glob "map-auth-url-*") != "" %}
      http-request set-var(txn.auth_key) var(txn.resource_key)
      {#- A route to the sign-in service itself (oauth2-proxy's /oauth2 path)
          must not require the sign-in it serves. #}
      http-request unset-var(txn.auth_key) if { var(txn.backend_name),map({{ pathResolver.GetPath("auth-exempt-backend.map", "map") }}) -m found }
      {#- frontend-spoe-auth-request-* may preset auth_* variables for its routes. #}
      {{- on_own_lines(render_glob "frontend-spoe-auth-request-*") }}{{ "\n" }}
      http-request set-var(txn.auth_url) var(txn.auth_key),map({{ pathResolver.GetPath("auth-url.map", "map") }}) unless { var(txn.auth_url) -m found }
      http-request set-var(txn.auth_signin) var(txn.auth_key),map({{ pathResolver.GetPath("auth-signin.map", "map") }}) unless { var(txn.auth_signin) -m found }
      http-request set-var(txn.auth_method) var(txn.auth_key),map({{ pathResolver.GetPath("auth-method.map", "map") }}) unless { var(txn.auth_method) -m found }
      http-request set-var(txn.auth_forward_headers) var(txn.auth_key),map({{ pathResolver.GetPath("auth-forward-headers.map", "map") }}) unless { var(txn.auth_forward_headers) -m found }
      http-request set-var(txn.auth_extract_headers) var(txn.auth_key),map({{ pathResolver.GetPath("auth-extract-headers.map", "map") }}) unless { var(txn.auth_extract_headers) -m found }
      {#- frontend-spoe-auth-verdict-* may revoke the verdict before it is read. #}
      http-request send-spoe-group spoa-hub-check-auth check-auth-group if { var(txn.auth_url) -m found }
      {{- on_own_lines(render_glob "frontend-spoe-auth-verdict-*") }}{{ "\n" }}
      {#- Pass-headers extension point: ingress libraries emit one
          `http-request set-header` per unique header in any
          ingress's auth-response-headers / auth-headers-succeed union.
          Each line is gated on `allowed -m bool` (only on auth
          success) and `var ... -m found` (only when the plugin
          actually extracted that header). Empty when no ingress
          uses the annotation. The `{{ "\n" }}` after the glob
          emits a literal newline regardless of whether the glob
          matched anything — without it, when the glob is empty the
          adjacent `{#- ... -#}` trim markers collapse the
          send-spoe-group line into the redirect line. -#}
      {{- on_own_lines(render_glob "frontend-spoe-set-pass-headers-*") }}{{ "\n" }}
      {# Browser-friendly sign-in redirect on auth failure: if the
          ingress has `auth-signin`, redirect to it (302) instead of
          denying. The deny rule below still fires when auth-signin
          isn't configured, preserving the API-friendly default.
          A trailing $escaped_request_uri becomes the URL-encoded path and
          query: HAProxy doesn't expand sample fetches stored in a variable. #}
      http-request set-var(txn.auth_signin_base) var(txn.auth_signin),regsub(\$escaped_request_uri$,) if { var(txn.auth_signin) -m end $escaped_request_uri }
      http-request redirect location %[var(txn.auth_signin_base)]%[pathq,url_enc] code 302 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.auth_signin_base) -m found }
      http-request redirect location %[var(txn.auth_signin)] code 302 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.auth_signin) -m found }
      http-request set-var(txn.denied_by) str(external_auth) if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool }
      http-request deny deny_status 401 if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool }
      {# Fail-headers extension point: ingress libraries emit one
          `http-after-response set-header` per unique header in any
          ingress's auth-headers-fail union. Runs on the deny
          response (and only that — the conditions gate on the
          auth path having run AND not allowed AND the per-header
          var being set). `http-after-response` rather than
          `http-response` because HAProxy's `http-request deny`
          short-circuits the request flow, generating its 401 reply
          internally; `http-response` rules only fire on responses
          received from a backend, so they'd silently skip the deny
          path. Empty when no ingress uses the annotation. Same
          trailing-newline trick as the pass-headers glob. #}
      {{- on_own_lines(render_glob "frontend-spoe-set-fail-headers-*") }}{{ "\n" }}
      {%- end %}
      {%- end %}

  # sso-auth sign-in for routes in sso-auth.map. Authentication fails closed:
  # a missing verdict or an unusable provider answers 503 (see "Runtime
  # dependency failure" in charts/CLAUDE.md). Identity headers are always
  # stripped on these routes so a client can't supply its own.
  frontend-spoe-filters-110-sso-auth:
    template: |
      {%- var messages = toStringSlice(extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{})) %}
      {%- if messages contains "check-sso-auth" && strip(render_glob "map-sso-auth-*") != "" %}
      {%- var sso = "{ var(txn.sso_cfg) -m found }" %}
      {%- var verdict = "txn.hub.sso_auth" %}
      http-request set-var(txn.sso_cfg) var(txn.resource_key),map({{ pathResolver.GetPath("sso-auth.map", "map") }})
      http-request set-var(txn.sso_provider) var(txn.sso_cfg),field(1,' ') if {{ sso }}
      http-request set-var(txn.sso_groups) var(txn.sso_cfg),field(2,' ') if {{ sso }} !{ var(txn.sso_cfg),field(2,' ') -m str -- - }
      http-request set-var(txn.denied_by) str(sso_auth_unavailable) if {{ sso }} { var(txn.sso_provider) -m str -- - }
      http-request return status 503 if {{ sso }} { var(txn.sso_provider) -m str -- - }
      http-request send-spoe-group spoa-hub-check-sso-auth check-sso-auth-group if {{ sso }}
      http-request del-header Authorization if {{ sso }} { var({{ verdict }}.pass_token) -m bool }
      http-request del-header X-Auth-Request-User if {{ sso }}
      http-request del-header X-Auth-Request-Email if {{ sso }}
      http-request del-header X-Auth-Request-Groups if {{ sso }}
      http-request set-var(txn.denied_by) str(sso_auth) if {{ sso }} !{ var({{ verdict }}.allowed) -m bool }
      http-request return status 503 if {{ sso }} !{ var({{ verdict }}.action) -m found }
      http-request redirect location %[var({{ verdict }}.redirect_url)] code 302 if {{ sso }} { var({{ verdict }}.action) -m str redirect }
      http-request deny deny_status 403 if {{ sso }} { var({{ verdict }}.action) -m str forbidden }
      http-request deny deny_status 503 if {{ sso }} !{ var({{ verdict }}.allowed) -m bool } { var({{ verdict }}.status_code) -m int 503 }
      http-request deny deny_status 401 if {{ sso }} !{ var({{ verdict }}.allowed) -m bool }
      http-request set-header Authorization "Bearer %[var({{ verdict }}.token)]" if {{ sso }} { var({{ verdict }}.token) -m found }
      http-request set-header X-Auth-Request-User %[var({{ verdict }}.sub)] if {{ sso }} { var({{ verdict }}.sub) -m found }
      http-request set-header X-Auth-Request-Email %[var({{ verdict }}.email)] if {{ sso }} { var({{ verdict }}.email) -m found }
      http-request set-header X-Auth-Request-Groups %[var({{ verdict }}.groups)] if {{ sso }} { var({{ verdict }}.groups) -m found }
      {#- after-response so HAProxy's own redirects carry the cookies too. #}
      {%- for _, cookieVar := range []string{"set_auth_state_header", "set_cookie_header", "set_cookie_header_1", "set_cookie_header_2"} %}
      http-after-response add-header Set-Cookie %[var({{ verdict }}.{{ cookieVar }})] if { var({{ verdict }}.{{ cookieVar }}) -m found }
      {%- end %}
      {%- end %}

  # API-gateway request validation. Resolves the per-route schema rule from
  # request-schema.map (populated by haptic-annotations), rejects oversized
  # bodies before the SPOE call, waits for a body only on matching validation
  # routes, sends bounded request bodies to the api-gateway plugin, and fails
  # closed when the plugin denies or returns no verdict.
  #
  # Priority 200 runs after auth (100) and the source-IP shared limiter (025):
  # cheap public-edge rejection happens before JSON parsing/schema validation
  # under DoS. Consumer quotas run in the selected backend after native auth.
  frontend-spoe-filters-200-request-validation:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "validate-request" %}
      {%- var requestValidationWaitTimeout = extraContext | dig_string("100ms", "apiGateway", "requestSchemaValidation", "requestBody", "waitTimeout") %}
      {%- if !regex_search(requestValidationWaitTimeout, "^[1-9][0-9]*(us|ms|s|m|h|d)?$") %}
        {%- fail("extraContext.apiGateway.requestSchemaValidation.requestBody.waitTimeout must be a positive HAProxy duration.") %}
      {%- end %}
      {# Packed map keyed by resource_key →
          "schema_id max_body_bytes fail_open content_types". Validation only
          applies to body-carrying methods; routes without a schema map entry
          skip the lookup results and SPOE roundtrip. #}
      http-request set-var(txn.req_schema_cfg) var(txn.resource_key),map({{ pathResolver.GetPath("request-schema.map", "map") }}) unless { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_id) var(txn.req_schema_cfg),field(1,' ') if { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_max_body) var(txn.req_schema_cfg),field(2,' ') if { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.req_schema_fail_open) var(txn.req_schema_cfg),field(3,' ') if { var(txn.req_schema_cfg) -m found }
      http-request set-var(txn.denied_by) str(schema_duplicate_content_length) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { req.hdr_cnt(Content-Length) gt 1 }
      http-request return status 400 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { req.hdr_cnt(Content-Length) gt 1 }
      http-request set-var(txn.denied_by) str(schema_no_content_length) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ req.hdr(Content-Length) -m found }
      http-request return status 411 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ req.hdr(Content-Length) -m found }
      http-request set-var(txn.req_schema_body_size) req.body_size if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request set-var(txn.denied_by) str(schema_body_too_large) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_size),sub(txn.req_schema_max_body) -m int gt 0 }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_size),sub(txn.req_schema_max_body) -m int gt 0 }
      http-request wait-for-body time {{ requestValidationWaitTimeout }} if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request set-var(txn.req_schema_body_len) req.body_len if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request set-var(txn.denied_by) str(schema_body_incomplete) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_len),sub(txn.req_schema_body_size) -m int lt 0 }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.req_schema_body_len),sub(txn.req_schema_body_size) -m int lt 0 }
      http-request send-spoe-group spoa-hub-validate-request validate-request-group if { var(txn.req_schema_id) -m found } { method POST PUT PATCH }
      http-request set-var(txn.schema_degraded) str(1) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ var(txn.hub.api_gateway.allowed) -m found }
      {# Missing verdicts fail closed unless the route explicitly opts out. #}
      http-request set-var(txn.denied_by) str(schema_unavailable) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.req_schema_fail_open) -m str true }
      http-request return status 422 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } !{ var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.req_schema_fail_open) -m str true }
      http-request set-var(txn.denied_by) str(schema_body_too_large) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str body_too_large }
      http-request return status 413 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str body_too_large }
      http-request set-var(txn.denied_by) str(schema_unsupported_media_type) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str unsupported_media_type }
      http-request return status 415 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.outcome) -m str unsupported_media_type }
      http-request set-var(txn.denied_by) str(schema_invalid) if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.hub.api_gateway.allowed) -m bool }
      http-request return status 422 if { var(txn.req_schema_id) -m found } { method POST PUT PATCH } { var(txn.hub.api_gateway.allowed) -m found } !{ var(txn.hub.api_gateway.allowed) -m bool }
      {%- end %}

  # Fire the single mirror SPOE group once per request — the last frontend
  # filter (priority 950), after every mirror source has appended its target
  # entry to txn.gw_mirror_targets (gateway RequestMirror filters at 550, the
  # mirror-target Ingress annotation libraries at 555/820). HAProxy SPOE only
  # processes each group once per stream, but a single `mirror-group` carries
  # ALL targets: the mirror message's arg_targets is the whole list, and the
  # plugin fans out to each entry. So one static message + one group cover
  # every mirror in the cluster — adding a target never changes spoe.conf or
  # the hub TOML, only the frontend append above. The fire must come after all
  # appends, since send-spoe-group captures arg_targets at its position.
  #
  # Resource-agnostic (reads one variable, fires one group). Gated on "mirror"
  # being in the SPOE messages union — the same condition spoe-conf-content uses
  # to declare `mirror-group`, so the reference always resolves (a test that
  # overrides extraContext.spoaHub.haproxy.messages without "mirror" gets no fire
  # and no dangling group). The `-m found` guard makes it a no-op for requests
  # that matched no mirror source.
  frontend-filters-950-spoa-hub-mirror-fire:
    template: |
      {%- var messagesAny = extraContext | dig("spoaHub", "haproxy", "messages") | fallback([]any{}) %}
      {%- var messages = toStringSlice(messagesAny) %}
      {%- if messages contains "mirror" %}
      # spoa-hub/mirror: dispatch every appended target from one NOTIFY
      http-request send-spoe-group spoa-hub-mirror mirror-group if { var(txn.gw_mirror_targets) -m found }
      {%- end %}
