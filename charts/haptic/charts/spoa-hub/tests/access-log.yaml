# SPOA hub library — JSON access-log field and deny-attribution tests.
#
# The field snippets are gated on the plugin message being enabled, so these
# tests pin both directions: the fields appear when the feature is configured,
# and are absent (not permanently empty) when it is not.
_fx:
  pluginsCoraza: &pluginsCoraza
    - name: coraza
      library: libcoraza_plugin.so
      messages: ["check-request"]
      timeoutMs: 15
      dependsOn: []
      directives: |
        SecRuleEngine On
      params: ""

validationTests:
  test-spoa-hub-access-log-fields:
    # The spoa-hub backend renders `mode spop` on HAProxy >= 3.1 and `mode tcp` on
    # 3.0, derived from the rendered version — so this fixture pins neither the
    # version nor the mode. Pinning one would emit a proxy mode the CI job's own
    # binary may not support ("unknown proxy mode 'spop'" on the 3.0 floor).
    description: >-
      With the WAF, shared rate limit, external auth and schema validation
      messages enabled, each plugin contributes its verdict fields to the JSON
      access log, and every gate that returns a status names itself in
      txn.denied_by so a 403/429/422 in the log is attributable.
    extraContext:
      waf: {dispatch: {mode: default-on, defaultEnforcement: deny}}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          messages: ["check-request", "check-ratelimit", "check-auth", "validate-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins: *pluginsCoraza
    fixtures:
      # The SPOE dispatch and its deny gates live in frontend-filters-*, which
      # renders only inside an HTTP frontend — and that frontend only exists when
      # some resource asks for traffic.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: spoa-log
            annotations:
              haproxy-haptic.org/auth-url: "http://auth.svc.cluster.local/check"
          spec:
            ingressClassName: haptic
            rules:
              - host: spoa-log.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(waf_action\)\[var\(txn\.hub\.coraza\.action\)\]'}
      - type: contains
        target: haproxy.cfg
        pattern: '%\(waf_rule_id\)\[var\(txn\.hub\.coraza\.rule_id\)\]'
        description: >-
          The interrupting rule id is the join from one specific 403 to the CRS
          rule that produced it — the aggregate rule-hit metric cannot answer it.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(waf_score\)\[var\(txn\.hub\.coraza\.anomaly_score\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(waf_rules_hit\)\[var\(txn\.hub\.coraza\.rules_hit\)\]'
        description: >-
          Per-request count of matched rules — the detect-mode noise signal for a
          single request, which the fleet-aggregate metric cannot give.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(waf_matched_var\)\[var\(txn\.hub\.coraza\.matched_var\)\]'
        description: >-
          The NAMES of the request fields rules matched on. This is what removes
          the need for Coraza's audit log to answer "on what did it fire" — and
          that log writes the client IP, all request headers and the matched
          bytes to the sidecar's stdout.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(waf_rule_ids\)\[var\(txn\.hub\.coraza\.rule_ids\)\]'
        description: >-
          The scoring rules behind the verdict: in CRS's anomaly mode
          waf_rule_id is 949110 for every request over the threshold.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'waf_matched_var:sint'
        description: >-
          Must stay untyped like its siblings: the var only exists once the
          coraza message has run, and a typed item whose fetch does not resolve
          emits "" into a numeric JSON slot.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'waf_rules_hit:sint'
        description: >-
          Must stay untyped: the var only exists after the coraza SPOE message
          runs, and a typed item whose fetch does not resolve emits "" into a
          numeric JSON slot.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(rate_limit_allowed\)\[var\(txn\.hub\.rate_limit\.allowed\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(rate_limit_remaining\)\[var\(txn\.hub\.rate_limit\.remaining\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(auth_status\)\[var\(txn\.hub\.external_auth\.status_code\)\]'
        description: >-
          HAProxy always answers 401 regardless of what the auth service said, so
          this is the only place the 401/403/500 distinction survives.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(schema_outcome\)\[var\(txn\.hub\.api_gateway\.outcome\)\]'
      - type: contains
        target: haproxy.cfg
        pattern: '%\(schema_degraded\)\[var\(txn\.schema_degraded\)\]'
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.denied_by\) str\(waf\) if \{ var\(txn\.coraza_active\) -m bool \} \{ var\(txn\.hub\.coraza\.action\) -m found \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'
          - 'http-request deny deny_status 403 if \{ var\(txn\.coraza_active\) -m bool \} \{ var\(txn\.hub\.coraza\.action\) -m found \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'
        description: >-
          The marker carries the gate's own condition and precedes it — `deny`
          ends rule processing, so a marker placed after would never run.
      # A missing plugin verdict fails open by default in both modes.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 429 hdr Retry-After 1 if .*\{ var\(txn\.rl_mode\) -m str exact \} !\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 429 hdr Retry-After 1 if \{ var\(txn\.rl_limit\) -m found \} !\{ var\(txn\.rl_allow\) -m bool \} \{ var\(txn\.rl_keyspec\) -m str [a-z]+ \} !\{ var\(txn\.rl_rule_invalid\) -m bool \} !\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.rate_limit_degraded\) str\(1\) if .*!\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.rate_limit_degraded\) str\(1\) if .*\{ var\(txn\.hub\.rate_limit\.degraded\) -m bool \}'
      - type: match_order
        target: haproxy.cfg
        description: >-
          A v0.2 denial has no degraded/accounted fields; v0.3 overrides its
          limited default from the explicit fields.
        patterns:
          - 'unset-var\(txn\.rl_verdict_class\)'
          - 'set-var\(txn\.rl_verdict_class\) str\(limited\) if .*\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \} !\{ var\(txn\.hub\.rate_limit\.allowed\) -m bool \}'
          - 'set-var\(txn\.rl_verdict_class\) str\(fallback-limited\) if \{ var\(txn\.rl_verdict_class\) -m str limited \} \{ var\(txn\.hub\.rate_limit\.degraded\) -m bool \} \{ var\(txn\.hub\.rate_limit\.accounted\) -m bool \}'
          - 'set-var\(txn\.rl_verdict_class\) str\(unavailable\) if \{ var\(txn\.rl_verdict_class\) -m str limited \} \{ var\(txn\.hub\.rate_limit\.degraded\) -m bool \} !\{ var\(txn\.hub\.rate_limit\.accounted\) -m bool \}'
          - 'set-var\(txn\.rl_verdict_class\) str\(invalid\) if \{ var\(txn\.rl_verdict_class\) -m str limited \} \{ var\(txn\.hub\.rate_limit\.degraded\) -m found \} !\{ var\(txn\.hub\.rate_limit\.degraded\) -m bool \} !\{ var\(txn\.hub\.rate_limit\.accounted\) -m bool \}'
          - 'set-var\(txn\.denied_by\) str\(rate_limit_shared\) if \{ var\(txn\.rl_verdict_class\) -m str limited \}'
          - 'set-var\(txn\.denied_by\) str\(rate_limit_shared_unavailable\) if \{ var\(txn\.rl_verdict_class\) -m str fallback-limited unavailable \}'
          - 'set-var\(txn\.denied_by\) str\(rate_limit_shared_invalid\) if \{ var\(txn\.rl_verdict_class\) -m str invalid \}'
          - 'deny deny_status 429 hdr Retry-After %\[var\(txn\.hub\.rate_limit\.retry_after\)\] if \{ var\(txn\.rl_verdict_class\) -m str limited fallback-limited \}'
          - 'deny deny_status 429 hdr Retry-After 1 if \{ var\(txn\.rl_verdict_class\) -m str unavailable invalid \}'
      # Two dispatch blocks per HTTP frontend: source-IP before the WAF and
      # consumer after the identity rules, on all three frontends.
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^  http-request unset-var\(txn\.rl_verdict_class\)$', expected: "6"}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^  http-request set-var\(txn\.rl_verdict_class\) str\(limited\)', expected: "6"}
      - type: not_contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.rl_verdict_class\) str\(limited\) if \{ var\(txn\.rl_limit\) -m found \} !\{ var\(txn\.rl_allow\) -m bool \} \{ var\(txn\.rl_keyspec\) -m str [a-z]+ \} !\{ var\(txn\.hub\.rate_limit\.allowed\) -m bool \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-after-response set-header X-RateLimit-Remaining %\[var\(txn\.hub\.rate_limit\.remaining\)\] if .*\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \} !\{ var\(txn\.hub\.rate_limit\.degraded\) -m found \} !\{ var\(txn\.hub\.rate_limit\.accounted\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-after-response set-header X-RateLimit-Remaining %\[var\(txn\.hub\.rate_limit\.remaining\)\] if .*\{ var\(txn\.hub\.rate_limit\.accounted\) -m bool \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^\s*http-after-response set-header X-RateLimit-Remaining .*\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \}$'
      # The variable is worthless if it never reaches a log line: this is the
      # only signal that a control silently stopped protecting anything.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(rate_limit_degraded\)\[var\(txn\.rate_limit_degraded\)\]'
        description: >-
          A store fallback or missing verdict feeds the access log and counter
          for either lease or exact mode.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(external_auth\) if \{ var\(txn\.auth_url\) -m found \}'
      # Same gate, same reason: a schema verdict that never arrived must not
      # read as "invalid". Pinned on the full condition, not a prefix — the
      # prefix form passes whether or not the `-m found` guard is there.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(schema_invalid\) if \{ var\(txn\.req_schema_id\) -m found \} \{ method POST PUT PATCH \} \{ var\(txn\.hub\.api_gateway\.allowed\) -m found \} !\{ var\(txn\.hub\.api_gateway\.allowed\) -m bool \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'str\(schema_invalid\) if \{ var\(txn\.req_schema_id\) -m found \} \{ method POST PUT PATCH \} !\{ var\(txn\.hub\.api_gateway\.allowed\) -m bool \}'

  test-spoa-hub-access-log-fields-absent-without-messages:
    description: >-
      With only the mirror message enabled (the chart default), no plugin field
      joins the log line — a feature that is not configured must not add a
      permanently-empty key to every record.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          messages: ["mirror"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins: []
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: 'waf_action|rate_limit_allowed|auth_status|schema_outcome'

  test-spoa-hub-rate-limit-fail-closed-opt-in:
    description: >-
      rateLimit.shared.failClosed makes every mode deny a missing verdict.
    extraContext:
      rateLimit: {shared: {enabled: true, failClosed: true}}
      spoaHub:
        haproxy:
          messages: ["check-ratelimit"]
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-strict
            annotations:
              haproxy-haptic.org/rate-limit-requests: "5"
              haproxy-haptic.org/rate-limit-period: "60s"
          spec:
            ingressClassName: haptic
            rules:
              - host: rl-strict.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 429 hdr Retry-After 1 if .*!\{ var\(txn\.hub\.rate_limit\.allowed\) -m found \}'
      - {type: contains, target: haproxy.cfg, pattern: 'str\(rate_limit_shared_unavailable\)'}

  test-spoa-hub-waf-unavailable-requires-verdict-in-deny-mode:
    description: >-
      Active routes require a verdict unless HAProxy resolved detection-only
      mode. This includes compatibility apps without an explicit mode.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    extraContext:
      waf: {failClosed: false, dispatch: {mode: default-on, defaultEnforcement: deny}}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: *pluginsCoraza
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: waf-posture
          spec:
            ingressClassName: haptic
            rules:
              - host: waf-posture.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request return status 503 if \{ var\(txn\.waf_degraded\) -m found \}(?:\n|$)'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 503 if \{ var\(txn\.waf_degraded\) -m found \} !\{ var\(txn\.coraza_detect_only\) -m bool \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.waf_degraded\) str\(1\) if \{ var\(txn\.coraza_active\) -m bool \} !\{ var\(txn\.hub\.coraza\.__status\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.waf_degraded\) str\(1\) if \{ var\(txn\.coraza_active\) -m bool \} !\{ var\(txn\.hub\.coraza\.__status\) -m str ok \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.waf_degraded\) str\(1\) if \{ var\(txn\.coraza_active\) -m bool \} !\{ var\(txn\.hub\.coraza\.action\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'str\(waf_unavailable\) if \{ var\(txn\.waf_degraded\) -m found \} !\{ var\(txn\.coraza_detect_only\) -m bool \}'
      # A detect route with no answer may continue without receiving a 403.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 403 if \{ var\(txn\.coraza_active\) -m bool \} \{ var\(txn\.hub\.coraza\.action\) -m found \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 403 if \{ var\(txn\.coraza_active\) -m bool \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(waf\) if \{ var\(txn\.coraza_active\) -m bool \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'

  test-spoa-hub-waf-fail-closed-opt-in:
    description: >-
      Global strict mode requires a verdict even on detect routes.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    extraContext:
      waf: {failClosed: true, dispatch: {mode: default-on, defaultEnforcement: detect}}
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: *pluginsCoraza
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: waf-posture
          spec:
            ingressClassName: haptic
            rules:
              - host: waf-posture.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 503 if \{ var\(txn\.waf_degraded\) -m found \}(?:\n|$)'
      - {type: contains, target: haproxy.cfg, pattern: 'str\(waf_unavailable\)'}
      # Recorded in both postures, so an uninspecting WAF is never silent.
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.waf_degraded\) str\(1\)'}
      # The `-m found` gate is posture-independent: here the 503 above already
      # caught the unanswered case, so the gate costs nothing and the two
      # postures cannot drift apart.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 403 if \{ var\(txn\.coraza_active\) -m bool \} \{ var\(txn\.hub\.coraza\.action\) -m found \} !\{ var\(txn\.hub\.coraza\.action\) -m str allow \}'
