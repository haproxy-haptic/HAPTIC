# SPOA hub library — general validation tests
#
# Covers default rendering, mode-tcp fallback on HAProxy 3.0, disabled-library
# behaviour, and multi-plugin rendering. Coraza-specific tests live in
# tests/coraza.yaml; external-auth-specific tests live in their owning vendor
# libraries (haproxytech / haproxy-ingress / nginx-ingress).

_fx:
  spoahubEnabledHaproxy: &spoahubEnabledHaproxy
    enabled: true
    haproxy:
      socketPath: /run/spoa/hub.sock
      modeSpop: true
      messages:
        - check-auth
      timeoutHello: 2s
      timeoutIdle: 5m
      timeoutProcessing: 500ms
      poolMaxConn: 100
      poolPurgeDelay: 30s

validationTests:

  test-spoa-hub-disabled:
    description: "With extraContext.spoaHub.enabled=false (or missing), the library must not emit the `backend spoa-hub` block, the SPOE filter, or any spoe.conf reference."
    extraContext: {spoaHub: {enabled: false}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "backend spoa-hub"}
      - {type: not_contains, target: haproxy.cfg, pattern: "filter spoe engine spoa-hub"}

  test-spoa-hub-blocks-absent-without-routes:
    description: "With the WAF and external-auth messages enabled but no route carrying a WAF or auth-url annotation, the SPOE filters are declared and the dispatch blocks that read the (empty) maps are not emitted."
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-request
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: plain
            namespace: default
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "filter spoe engine spoa-hub-check-request config"}
      - {type: contains, target: haproxy.cfg, pattern: "filter spoe engine spoa-hub-check-auth config"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.coraza_app\)'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'send-spoe-group spoa-hub-check-request'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.auth_url\)'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'send-spoe-group spoa-hub-check-auth'}

  test-spoa-hub-rendering:
    # The fixture below pins haproxyVersion=3.2 so the rendered backend
    # uses `mode spop` (which is what the assertions assume). On a 3.0
    # haproxy binary that line is a parser error — `mode spop` was
    # introduced in 3.1. test-spoa-hub-mode-tcp-on-haproxy-3-0 covers
    # the 3.0 fallback path; this test is skipped there.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With extraContext.spoaHub.enabled=true and `check-auth` in the messages union, the library emits the spoa-hub backend, the SPOE filter directive, the per-message group + canonical message body, and the external-auth frontend wiring (auth-url lookup, group trigger, deny rule)."
    extraContext:
      # Pin the HAProxy version to 3.1+ so the rendered backend uses
      # `mode spop` (the assertion below requires it). Native SPOP
      # was introduced in HAProxy 3.1; on 3.0 the chart falls back to
      # `mode tcp`. test-spoa-hub-rendering-mode-tcp-on-haproxy30
      # covers that fallback path.
      haproxyVersion: "3.2"
      spoaHub: *spoahubEnabledHaproxy
    fixtures:
      # Trigger the http_frontend (where the SPOE filter directive +
      # frontend-filters auth-flow assertions live). The auth-url
      # annotation also activates the external-auth dispatch path so
      # the `http-request send-spoe-group ... check-auth-group` and
      # `deny deny_status 401` assertions actually have a route to
      # apply to. After the bind-derivation refactor, an empty
      # fixture leaves the http_frontend unrendered.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: auth-trigger
            namespace: default
            annotations:
              haproxy-haptic.org/auth-url: "http://auth.svc.cluster.local/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: trigger-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend spoa-hub"}
      - {type: contains, target: haproxy.cfg, pattern: "mode spop"}
      - {type: contains, target: haproxy.cfg, pattern: "server hub /run/spoa/hub.sock"}
      - {type: contains, target: haproxy.cfg, pattern: "filter spoe engine spoa-hub-check-auth config"}
      - {type: contains, target: haproxy.cfg, pattern: "option spop-check"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout check 500ms"}
      - {type: contains, target: haproxy.cfg, pattern: "server hub /run/spoa/hub.sock check inter 1s fastinter 500ms downinter 1s fall 2 rise 2"}
      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 204 if { path /spoa-hub-child-health } { dst 127.0.0.0/8 } { srv_is_up\\(spoa-hub/hub\\) }"}
      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 424 if { path /spoa-hub-child-health } { dst 127.0.0.0/8 }"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-auth check-auth-group"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 401"}
      - {type: contains, target: file:spoe.conf, pattern: "spoe-agent spoa-hub-check-auth-agent"}
      - {type: contains, target: file:spoe.conf, pattern: "groups check-auth-group"}
      - {type: contains, target: file:spoe.conf, pattern: "spoe-message check-auth"}
      - {type: contains, target: file:spoe.conf, pattern: "args auth_url=var\\(txn.auth_url\\)"}
      - {type: contains, target: file:spoe.conf, pattern: "spoe-group check-auth-group"}

  test-spoa-hub-frontend-filters-newline-after-forwardfor:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: Forwarded-header rules and the SPOE filter render on separate lines.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub: *spoahubEnabledHaproxy
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: ff-svc}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ff-ingress
            annotations:
              haproxy.org/forwarded-for: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ff.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: ff-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^[ \t]+filter spoe engine '}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^[ \t]+http-request add-header X-Forwarded-For %\[src\]'}

  test-spoa-hub-mode-tcp-on-haproxy-3-0:
    description: "On HAProxy 3.0 the `spop` proxy mode doesn't exist (introduced in 3.1). The chart must auto-fall-back the spoa-hub backend to `mode tcp` — both transports work with the SPOE filter; mode spop is just..."
    extraContext:
      haproxyVersion: "3.0"
      spoaHub: *spoahubEnabledHaproxy
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend spoa-hub"}
      - {type: contains, target: haproxy.cfg, pattern: "mode tcp"}
      - {type: not_contains, target: haproxy.cfg, pattern: "backend spoa-hub\\n    mode spop"}

  # ============================================================================
  # spoa-hub-config.toml rendering (ADR-0007 / MR3)
  # ============================================================================

  test-spoa-hub-spoe-messages-carry-req-id:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: >-
      Every spoe-message carries req_id=unique-id, so the hub adopts HAProxy's
      own request id (spoa-hub >= v0.11.0) and its log lines name the same
      request as the JSON access log. The message bodies are separate snippets,
      so an edit can drop the argument from one of them — this asserts each
      enabled message individually rather than counting.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
            - check-request
            - check-ratelimit
            - validate-request
            - mirror
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: file:spoe.conf
        pattern: '(?m)^spoe-message check-auth$\n\s+args [^\n]*\breq_id=unique-id\b'
        description: >-
          Anchored to the args line immediately after this header. A lazy
          (?s).*? gap would match a LATER message's args line, so the assertion
          would pass while this message had lost the argument.
      - type: contains
        target: file:spoe.conf
        pattern: '(?m)^spoe-message check-request$\n\s+args [^\n]*\breq_id=unique-id\b'
      - type: contains
        target: file:spoe.conf
        pattern: '(?m)^spoe-message check-ratelimit$\n\s+args [^\n]*\breq_id=unique-id\b'
      - type: contains
        target: file:spoe.conf
        pattern: '(?m)^spoe-message validate-request$\n\s+args [^\n]*\breq_id=unique-id\b'
      - type: contains
        target: file:spoe.conf
        pattern: '(?m)^spoe-message mirror$\n\s+args [^\n]*\breq_id=unique-id\b'
      # HAProxy must actually generate an id, or `unique-id` fetches empty and the
      # hub falls back to its own — losing the correlation the argument exists for.
      - {type: contains, target: haproxy.cfg, pattern: 'unique-id-format %\[uuid\(7\)\]'}

  test-spoa-hub-req-id-is-never-client-controlled:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: >-
      req_id must be HAProxy's own generated id, never a client-supplied value.
      The hub validates the charset but cannot know the provenance, and a plugin
      that keyed state on a client-chosen id would let one request's state serve
      another. This pins that no chart edit wires a request-derived fetch in.
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
            - check-request
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: file:spoe.conf
        pattern: 'req_id=(req\.hdr|hdr|urlp|cook|req\.cook|url_param)'

  test-spoa-hub-config-render-default:
    # Skip on HAProxy <3.1: fixture pins haproxyVersion=3.2 so the
    # spoa-hub backend renders `mode spop`, which 3.0 can't parse.
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: "With coraza enabled and no per-Ingress modsecurity-snippet annotations, the rendered spoa-hub-config.toml contains the top-level hub keys, the [[listeners]] block, and one [[plugins]] block for coraza with the base directives wrapped in `directives = \"\"\"...\"\"\"`. No snippet comment markers appear."
    extraContext:
      haproxyVersion: "3.2"
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: ["check-request"]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        hub: {logLevel: info, maxConnections: 1000, blockingThreadKeepAliveSecs: 30}
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: ["check-request"]
            timeoutMs: 15
            dependsOn: []
            # `SecRuleEngine On` deliberately AFTER the include: the
            # recommended conf sets `SecRuleEngine DetectionOnly`, so an
            # `On` placed before it is silently overridden (detection-only
            # WAF). Mirrors the values.yaml default ordering.
            directives: |
              Include @coraza.conf-recommended
              SecRuleEngine On
            params: |
              request_body_limit = 8192
              detect_only = false
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'plugin_dir = "/etc/haproxy-spoa-hub/plugins"'
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'log_level = "info"'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'max_connections = 1000'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: '\[\[listeners\]\]'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'address = "/run/spoa/hub.sock"'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: '\[\[plugins\]\]'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'name = "coraza"'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'library = "libcoraza_plugin.so"'}
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'timeout_ms = 15'}
      - type: contains
        target: file:spoa-hub-config.toml
        pattern: 'Include @coraza.conf-recommended\nSecRuleEngine On'
      - {type: contains, target: file:spoa-hub-config.toml, pattern: 'request_body_limit = 8192'}
      - type: not_contains
        target: file:spoa-hub-config.toml
        pattern: '# nginx-ingress modsecurity-snippet from'
