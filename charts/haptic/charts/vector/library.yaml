# Vector sidecar library — renders the vector config HAPTIC pushes to each
# HAProxy pod.
#
# Loaded only when vector.enabled is true, so when the sidecar is off this file
# contributes nothing at all — no empty general file, no dangling scrape source.
#
# The config is declared as a STATIC `files:` entry rather than registered through
# fileRegistry.Register(): the filename is fixed and there is exactly one of them.
# fileRegistry earns its keep only when the filename or the NUMBER of files is
# computed at render time (per-Ingress CA bundles, per-listener crt-lists).
#
# Delivery path, identical to the spoa-hub's config (ADR-0007):
#   render -> agent general-storage -> <GeneralStorageDir>/vector.yaml
#   -> vector's --watch-config sees the write -> graceful reload, no restart.
#
# The rendered config adds the metrics exporters omitted from the bootstrap
# ConfigMap. Their scrape targets appear after this file is pushed and reloaded.

_helm_load:
  enable: '{{ .Values.vector.enabled }}'
  inject:
    - path: validationTests.test-vector-request-counter-disabled
      from: _test_request_counter_pipeline_off
      when: &requestMetricsOff '{{- if not (dig "requestMetrics" "enabled" false .Values.vector) }}true{{ end -}}'
  unset:
    # ~10 KB of span-building VRL, absent unless spans are actually exported.
    - path: templateSnippets.vector-span-transform
      when: '{{- if not (dig "tracing" "otlp" "endpoint" "" (.Values.controller.config.templatingSettings.extraContext | default dict)) }}true{{ end -}}'
    # Likewise the per-request metric pipeline when nothing consumes it.
    - path: templateSnippets.vector-request-metrics-transform
      when: *requestMetricsOff

_test_request_counter_pipeline_off:
  description: Disabling request metrics removes both counter aliases and every histogram while Vector still exports its own metrics.
  fixtures: {}
  extraContext:
    vector:
      metricsPort: 9598
      sizeMetricsPort: 9599
      logMetrics: {__replace__: true}
      requestMetrics: {enabled: false}
  assertions:
    - type: haproxy_valid
    - {type: not_contains, target: file:vector.yaml, pattern: '(?m)^        name: requests(_total)?$'}
    - {type: not_contains, target: file:vector.yaml, pattern: 'request_metrics_|(?m)^    buckets:|metrics_sizes:'}
    - {type: contains, target: file:vector.yaml, pattern: '(?s)vector_metrics:\s+type: internal_metrics'}
    - {type: contains, target: file:vector.yaml, pattern: '(?s)metrics:\s+type: prometheus_exporter\s+inputs: \[metrics_stream\]\s+address: 0\.0\.0\.0:9598'}

files:
  vector.yaml:
    # HAProxy never opens this file — vector's own --watch-config applies it.
    reloadOnPush: false
    template: |
      {%%
        var vec = extraContext | dig("vector") | fallback(map[string]any{})
        var socketPath = vec | dig_string("/run/vector/haproxy.sock", "socketPath")
        var metricsPort = vec | dig("metricsPort") | fallback(9598)
        var scrapeSecs = vec | dig("scrapeIntervalSecs") | fallback(15)
        var hubPort = vec | dig("spoaHubMetricsPort") | fallback(0)
        var dataDir = vec | dig_string("/var/lib/vector", "dataDir")
      %%}
      {# Endpoint lives under extraContext.tracing, not vector: it describes the
          deployment's tracing setup. Empty = no span pipeline. #}
      {# vector interpolates a field into a tag with its own {{...}} syntax, which
          collides with Scriggo's. Built as a string so the braces reach the config
          instead of being evaluated here. #}
      {%- var metricValueTag = "{{haptic_metric_value}}" -%}
      {#- Log-derived metric registry. Keyed map, not a list: an operator adding an
          entry must not replace the ones the chart ships (charts/CLAUDE.md). Only
          enabled entries are rendered, so a disabled one costs no per-record work. -#}
      {%- var logMetricsAll = vec | dig("logMetrics") | fallback(map[string]any{}) %}
      {%- var logMetrics = map[string]any{} %}
      {%- for _, k := range keys(logMetricsAll.(map[string]any)) %}
        {%- var entry = logMetricsAll.(map[string]any)[k].(map[string]any) %}
        {%- var en, ok = entry["enabled"] %}
        {%- if !ok %}{{ fail("extraContext.vector.logMetrics." + k + " must set `enabled`: an entry without it would sit inert and quietly emit nothing.") }}{%- end %}
        {%- if tostring(en) == "true" %}{%- logMetrics[k] = entry %}{%- end %}
      {%- end %}
      {#- Sink wiring only; vector-request-metrics-transform owns these names.
         test-vector-request-metrics-sink-wiring pins the two together. -#}
      {%- var rm = vec | dig("requestMetrics") | fallback(map[string]any{}) -%}
      {%- var rmOn = (rm | dig("enabled")) == true -%}
      {%- var rmMetrics = rm | dig("metrics") | fallback(map[string]any{}) -%}
      {%- var rmOnMetric = func(n string) bool { v, ok := rmMetrics.(map[string]any)[n]; return ok && tostring(v) == "true" } -%}
      {%- var rmGuarded = rmOn && ((rm | dig("cardinalityLimit")) | dig("enabled")) == true -%}
      {%- var rmCoreOn = rmOn && (rmOnMetric("requests") || rmOnMetric("request_duration_seconds")) -%}
      {%- var rmConnOn = rmOn && rmOnMetric("connect_duration_seconds") -%}
      {%- var rmRespOn = rmOn && (rmOnMetric("header_duration_seconds") || rmOnMetric("response_duration_seconds")) -%}
      {%- var rmSizeOn = rmOn && (rmOnMetric("request_size") || rmOnMetric("response_size")) -%}
      {%- var rmCoreInputs = []string{} -%}
      {%- var rmSizeInputs = []string{} -%}
      {%- if rmCoreOn %}{% rmCoreInputs = append(rmCoreInputs, "request_metrics_core") %}{% end -%}
      {%- if rmConnOn %}{% rmCoreInputs = append(rmCoreInputs, "request_metrics_connect") %}{% end -%}
      {%- if rmRespOn %}{% rmCoreInputs = append(rmCoreInputs, "request_metrics_response") %}{% end -%}
      {%- if rmSizeOn %}{% rmSizeInputs = append(rmSizeInputs, "request_metrics_sizes") %}{% end -%}
      {%- if rmGuarded && len(rmCoreInputs) > 0 %}{% rmCoreInputs = []string{"request_metrics_guard"} %}{% end -%}
      {%- if rmGuarded && len(rmSizeInputs) > 0 %}{% rmSizeInputs = []string{"request_metrics_size_guard"} %}{% end -%}
      {#- %.9f then trim, never tostring(): a float64 1e8 formats as "1e+08",
         which YAML 1.1 reads as a STRING and vector rejects. -#}
      {%- var fmtBucket = func(v any) string {
            var fv, _ = tofloat(v)
            var s = formatFloat(fv, "f", 9)
            for hasSuffix(s, "0") { s = s[0:len(s)-1] }
            if hasSuffix(s, ".") { s = s[0:len(s)-1] }
            return s
          } -%}
      {%- var bucketList = func(field string) string {
            var vals = rm | dig(field) | fallback([]any{}) | toSlice()
            if len(vals) == 0 {
              fail("extraContext.vector.requestMetrics." + field + " is empty; a histogram with no boundaries reports only +Inf.")
            }
            var out = []string{}
            var prev = 0.0
            for i, b := range vals {
              var f, _ = tofloat(b)
              if f <= 0.0 {
                fail("extraContext.vector.requestMetrics." + field + " entries must be greater than zero, got '" + tostring(b) + "'.")
              }
              // Checked on the RENDERED value, not the input: fmtBucket has 9
              // decimals, so anything under 5e-10 formats as "0" and two such
              // inputs collapse onto one boundary. Comparing the inputs would
              // pass both and emit le="0" plus a duplicate.
              var shown = fmtBucket(b)
              var rf, _ = tofloat(shown)
              if rf <= 0.0 {
                fail("extraContext.vector.requestMetrics." + field + " entry '" + tostring(b) + "' is smaller than the exporter renders (9 decimals) and would emit a le=\"0\" boundary.")
              }
              if i > 0 && rf <= prev {
                fail("extraContext.vector.requestMetrics." + field + " must be strictly ascending; '" + tostring(b) + "' does not exceed its predecessor once rendered.")
              }
              prev = rf
              out = append(out, shown)
            }
            return "[" + join(out, ", ") + "]"
          } -%}
      {%- var otlpEndpoint = extraContext | dig_string("", "tracing", "otlp", "endpoint") -%}
      {%- var otlpService = extraContext | dig_string("haptic", "tracing", "otlp", "serviceName") -%}
      {#- Resource attributes describe the EMITTER, so they identify this HAPTIC:
          several per cluster (internal vs external, or one per tenant) would
          otherwise all report service.name=haptic. Chart-derived, except the
          cluster name — Kubernetes exposes none to a pod. Each is omitted when
          empty rather than sent blank. -#}
      {%%
        var resAttrs = []string{}
        var addRes = func(k string, v string) { if v != "" { resAttrs = append(resAttrs, "{\"key\":\"" + k + "\",\"value\":{\"stringValue\":\"" + v + "\"}}") } }
        addRes("service.name", otlpService)
        addRes("service.namespace", tostring(extraContext | dig_string("", "tracing", "otlp", "serviceNamespace")))
        addRes("service.version", tostring(extraContext | dig_string("", "tracing", "otlp", "serviceVersion")))
        addRes("k8s.namespace.name", tostring(extraContext | dig_string("", "tracing", "otlp", "serviceNamespace")))
        addRes("k8s.deployment.name", tostring(extraContext | dig_string("", "tracing", "otlp", "deploymentName")))
        addRes("k8s.cluster.name", tostring(extraContext | dig_string("", "tracing", "otlp", "clusterName")))
        var resJSON = join(resAttrs, ",")
      %%}
      {#- Scriggo's `if` treats any non-empty string as truthy, so a CR with the
          string "false" would ENABLE this. No isbool(); fallback() is nil-only. -#}
      {%- var omitEmptyRaw = vec | dig("omitEmptyLogFields") -%}
      {%- var omitEmpty = true -%}
      {%- if omitEmptyRaw != nil -%}
        {%- var omitEmptyBool, omitIsBool = omitEmptyRaw.(bool) -%}
        {%- if !omitIsBool -%}
          {%- fail("extraContext.vector.omitEmptyLogFields must be a boolean, got '" + tostring(omitEmptyRaw) + "'. A quoted 'false' is truthy here and would silently enable the transform.") -%}
        {%- end -%}
        {%- omitEmpty = omitEmptyBool -%}
      {%- end -%}
      {#- Mirror of haptic.vector.validateValues in _vector.tpl. Duplicated on
          purpose: the HAProxyTemplateConfig CR is a first-class API that bypasses
          Helm, so a Helm-only guard protects nothing for a hand-written CR. -#}
      {%- if !hasPrefix(socketPath, "/") -%}
        {%- fail("extraContext.vector.socketPath must be an absolute path, got '" + socketPath + "'. HAProxy's `log <path>` form requires one.") -%}
      {%- end -%}
      {%- if toint(metricsPort) < 1 || toint(metricsPort) > 65535 -%}
        {%- fail("extraContext.vector.metricsPort must be a TCP port between 1 and 65535, got '" + tostring(metricsPort) + "'.") -%}
      {%- end -%}
      {%- if toint(scrapeSecs) < 1 -%}
        {%- fail("extraContext.vector.scrapeIntervalSecs must be a positive integer, got '" + tostring(scrapeSecs) + "'.") -%}
      {%- end -%}
      # Rendered by HAPTIC — do not edit. Overwritten on every reconciliation.
      data_dir: {{ dataDir }}

      sources:
        {# HAProxy's log target is in the `global` section, which carries BOTH
           access-log records and runtime process messages. The two have different
           shapes, so this is a byte passthrough: parsing as JSON here would drop
           every process line as a decode error. A future log-derived-metrics step
           can parse in a transform without changing this source. #}
        haproxy_log:
          type: socket
          mode: unix_datagram
          path: {{ socketPath }}
          # HAProxy must be able to write to a socket vector created. Both
          # containers run as the pod's runAsUser, so this is belt-and-braces.
          socket_file_mode: 0o666
          framing:
            method: newline_delimited
          decoding:
            codec: bytes
      {%- if toint(hubPort) > 0 %}

        {# Re-export the spoa-hub sidecar's metrics (spoa_*, plugin_coraza_*):
           per plugin, not per backend, so unlike HAProxy's exporter this does not
           grow with the fleet. honor_labels keeps the hub's own label set intact.
           NO instance_tag on purpose: it stamps the scraped target onto every
           series, identical on every pod, and Prometheus adds its own `instance`
           from the pod target anyway. #}
        spoa_hub_metrics:
          type: prometheus_scrape
          endpoints:
            - http://127.0.0.1:{{ toint(hubPort) }}/metrics
          scrape_interval_secs: {{ toint(scrapeSecs) }}
          honor_labels: true
      {%- end %}

        vector_metrics:
          type: internal_metrics

      transforms:
        {# Keep exporter inputs stable so topology changes retain histogram state. #}
        metrics_stream:
          type: filter
          inputs:
        {%- if toint(hubPort) > 0 %}
            - spoa_hub_metrics
        {%- end %}
        {%- for _, k := range keys(logMetrics) %}
            - {{ k }}_metric
        {%- end %}
        {%- for _, i := range rmCoreInputs %}
            - {{ i }}
        {%- end %}
            - vector_metrics
          condition:
            type: is_metric
      {%- if len(rmSizeInputs) > 0 %}
        metrics_size_stream:
          type: filter
          inputs:
          {%- for _, i := range rmSizeInputs %}
            - {{ i }}
          {%- end %}
          condition:
            type: is_metric
      {%- end %}
      {%- if otlpEndpoint != "" %}
      {{ render "vector-span-transform" default "" }}
      {%- end %}
      {%- if rmOn %}
        {{ render "vector-request-metrics-transform" default "" }}
      {%- end %}
      {%- if omitEmpty %}
        {# HAProxy cannot do this itself: its JSON encoder's option set is
            M/Q/X/E/bin/json/cbor with no omit flag, and the nearest one (+M)
            substitutes "-" instead. Rationale and measurements: values.yaml
            vector.omitEmptyLogFields.

            Deliberately a STRING rewrite, not parse_json + encode_json:
            re-encoding sorts keys alphabetically and would bury `ts`, which the
            log-format puts first precisely because `format raw` drops the syslog
            timestamp. It also parses every record; this does not.

            SAFETY: the patterns anchor on the pair separator and restrict the key
            to the field-name charset the log-fields framework enforces. A crafted
            value cannot forge a match, because inside a JSON string an embedded
            quote is escaped as \" and so cannot supply the opening quote.
            Verified against a value containing a literal `", "client_ip": "", `.
            Numbers are untouched: only `: ""` matches. #}
        # Drop fields whose value is empty, so a record carries only what happened.
        log_drop_empty:
          type: remap
          inputs: [haproxy_log]
          source: |
            {# The FALLIBLE string(), never string!(). remap defaults drop_on_abort=true,
               so an abort DISCARDS the event rather than passing it on — verified: with
               .message absent, string!() aborts and the record is gone. The socket source
               always sets .message today, but a dropped log line is invisible, so the
               passthrough guarantee is made structural instead of resting on the codec. #}
            m, err = string(.message)
            if err == null && starts_with(m, "{") {
              m = replace(m, r', "[A-Za-z_][A-Za-z0-9_]*": ""', "")
              m = replace(m, r'\{"[A-Za-z_][A-Za-z0-9_]*": "", ', "{")
              m = replace(m, r'\{"[A-Za-z_][A-Za-z0-9_]*": ""\}', "{}")
              .message = m
            }
      {%- end %}
      {%- if len(logMetrics) > 0 %}
        {# Driven by extraContext.vector.logMetrics — adding one is a data entry,
            not new template code. Extraction is a REGEX over the raw record, never
            parse_json: this pipeline does not parse access-log records, and paying
            a JSON parse per metric per request would undo that. Rationale:
            values.yaml vector.logMetrics. #}
        # Metrics projected from access-log fields, for components that expose no
        # scrape endpoint of their own.
      {%- for _, key := range keys(logMetrics) %}
        {%%
          var m = logMetrics[key].(map[string]any)
          var field = m | dig_string("", "field")
          var kind = m | dig_string("enum", "kind")
          var metricName = m | dig_string("", "metric")
          var tagName = m | dig_string("value", "tag")
          var vals = m | dig("values") | fallback([]any{}) | toSlice()
        %%}
        {#- Field and metric names are embedded in a VRL regex and metric name. -#}
        {%- if !regex_search(field, "^[A-Za-z_][A-Za-z0-9_]*$") %}{{ fail("extraContext.vector.logMetrics." + key + ".field must be an access-log field name (letters, digits, underscore), got '" + field + "'.") }}{%- end %}
        {%- if !regex_search(metricName, "^[A-Za-z_][A-Za-z0-9_]*$") %}{{ fail("extraContext.vector.logMetrics." + key + ".metric must be a Prometheus metric name, got '" + metricName + "'.") }}{%- end %}
        {%- if !regex_search(tagName, "^[A-Za-z_][A-Za-z0-9_]*$") %}{{ fail("extraContext.vector.logMetrics." + key + ".tag must be a Prometheus label name, got '" + tagName + "'.") }}{%- end %}
        {%- if kind != "enum" && kind != "numeric" %}{{ fail("extraContext.vector.logMetrics." + key + ".kind must be \"enum\" or \"numeric\", got '" + kind + "'.") }}{%- end %}
        {%- if kind == "enum" && len(vals) == 0 %}{{ fail("extraContext.vector.logMetrics." + key + " is kind \"enum\" and must list its accepted `values`, or the label would be unbounded.") }}{%- end %}
        {%- var pattern = "[0-9]+" %}
        {%- if kind == "enum" %}
          {%- var esc = []string{} %}
          {%- for _, val := range vals %}
            {%- if !regex_search(tostring(val), "^[A-Za-z0-9_.:-]+$") %}{{ fail("extraContext.vector.logMetrics." + key + ".values entry '" + tostring(val) + "' may only contain letters, digits, and _.:- — it is embedded in a VRL regex.") }}{%- end %}
            {#- Escape before embedding: '.' passes the charset check but is a
                regex wildcard, so a declared value of "1.5" would also match
                "125" — widening the very set `values` exists to bound. -#}
            {%- esc = append(esc, sanitize_regex(tostring(val))) %}
          {%- end %}
          {%- pattern = join(esc, "|") %}
        {%- end %}

        {{ key }}_extract:
          type: remap
          inputs: [haproxy_log]
          source: |
            {# abort, not a filter transform: remap defaults drop_on_abort=true, so a
               record without this field is dropped from THIS branch only — each
               transform consumes its own copy of haproxy_log, so the access log and
               the span pipeline are untouched. #}
            m, err = string(.message)
            if err != null {
              abort
            }
            caps, cerr = parse_regex(m, r'"{{ field }}"\s*:\s*"(?P<v>{{ pattern }})"')
            if cerr != null {
              abort
            }
            .haptic_metric_value = caps.v
        {%- if kind == "numeric" %}
            {# parse_regex yields a STRING. Measured against vector 0.57.0: a
               numeric string is parsed fine by increment_by_value, so this is not
               load-bearing for the shipped `[0-9]+` pattern. It earns its place on
               the failure path — given a NON-numeric value vector logs
               "Failed to parse field as float" and drops the event, once per
               record; converting here drops it quietly instead. #}
            n, nerr = to_float(.haptic_metric_value)
            if nerr != null {
              abort
            }
            .haptic_metric_value = n
        {%- end %}

        {{ key }}_metric:
          type: log_to_metric
          inputs: [{{ key }}_extract]
          metrics:
            - type: counter
              field: haptic_metric_value
              name: {{ metricName }}
              namespace: haptic
        {%- if kind == "enum" %}
              tags:
                {{ tagName }}: "{{ metricValueTag }}"
        {%- else %}
              increment_by_value: true
        {%- end %}
      {%- end %}
      {%- end %}

      sinks:
        {# For now the access log just goes to stdout, so `kubectl logs -c vector`
           shows it. Point this at a real sink by overriding this file's template
           through controller.config.templateSnippets. #}
        stdout:
          type: console
          inputs: [{% if omitEmpty %}log_drop_empty{% else %}haproxy_log{% end %}]
          encoding:
            codec: text
      {%- if otlpEndpoint != "" %}

        {# OTLP/HTTP + JSON. The generic `http` sink, NOT the `opentelemetry` sink:
           that sink's `otlp` codec only encodes resourceLogs / resourceMetrics and
           rejects resourceSpans, and vector has no way to turn a log line into the
           Trace-typed event its trace branch needs. payload_prefix/suffix wrap the
           sink's batched JSON array into one valid ExportTraceServiceRequest, so a
           batch is one document rather than several concatenated ones. #}
        otlp_traces:
          type: http
          inputs: [spans]
          uri: "{{ otlpEndpoint }}"
          method: post
          encoding:
            codec: json
          payload_prefix: '{"resourceSpans":[{"resource":{"attributes":[{{ resJSON }}]},"scopeSpans":[{"scope":{"name":"haptic"},"spans":'
          payload_suffix: '}]}]}'
          request:
            headers:
              content-type: application/json
      {%- end %}

        # The primary scrape target, absent from the bootstrap config. HAProxy's
        # own exporter is NOT re-exported here: Prometheus scrapes it directly
        # (see status-extra-100-prometheus-exporter in the base library).
        metrics:
          type: prometheus_exporter
          inputs: [metrics_stream]
          address: 0.0.0.0:{{ toint(metricsPort) }}
          {#- A sample timestamp is the last event's; it moves backwards between scrapes and Prometheus drops the sample (#537). #}
          suppress_timestamp: true
      {#- Per-SINK in vector, no per-metric override — which is why the size
          histograms get their own exporter below. -#}
      {%- if rmCoreOn || rmConnOn || rmRespOn %}
          buckets: {{ bucketList("durationBuckets") }}
      {%- end %}
      {%- if len(rmSizeInputs) > 0 %}

        {# Bytes and seconds cannot share one `buckets` list. #}
        # Byte-size histograms only; same PodMonitor, second endpoint.
        metrics_sizes:
          type: prometheus_exporter
          inputs: [metrics_size_stream]
          address: 0.0.0.0:{{ toint(vec | dig("sizeMetricsPort") | fallback(9599)) }}
          suppress_timestamp: true
          buckets: {{ bucketList("sizeBuckets") }}
      {%- end %}

templateSnippets:

  vector-request-metrics-transform:
    template: |-
      {# Grouped by VALIDITY GATE, not by metric: log_to_metric emits every metric
          it lists from one event, and a HAProxy timer reads -1 when its phase never
          happened — recording that as 0 claims the backend answered instantly on a
          request that never reached one. Grouped by SINK too, because
          prometheus_exporter takes one `buckets` list per sink. #}
      {%- var rm = extraContext | dig("vector", "requestMetrics") | fallback(map[string]any{}) -%}
      {%- if (rm | dig("enabled")) != true %}{% return %}{% end -%}
      {%- var mm = rm | dig("metrics") | fallback(map[string]any{}) -%}
      {%- var mOn = func(n string) bool { v, ok := mm.(map[string]any)[n]; return ok && tostring(v) == "true" } -%}
      {%- var prefix = rm | dig_string("haptic_ingress_controller", "prefix") -%}
      {#- Re-validated here because a hand-written CR bypasses Helm. -#}
      {%- if !regex_search(prefix, "^[A-Za-z_][A-Za-z0-9_]*$") -%}
        {%- fail("extraContext.vector.requestMetrics.prefix must be a Prometheus metric-name prefix, got '" + prefix + "'.") -%}
      {%- end -%}
      {%- var ctrlClass = rm | dig_string("", "controllerClass") -%}
      {%- var ctrlNs = rm | dig_string("", "controllerNamespace") -%}
      {%- for _, cv := range []string{ctrlClass, ctrlNs} -%}
        {%- if regex_search(cv, "['\"\n\r\\\\]") -%}
          {%- fail("extraContext.vector.requestMetrics.controllerClass and controllerNamespace are embedded in a quoted YAML scalar; '" + cv + "' contains a quote, backslash or newline and would break vector's config.") -%}
        {%- end -%}
      {%- end -%}
      {#- A tag template naming a field the event lacks makes vector drop the whole
          metric, so every tag field is assigned unconditionally below. -#}
      {%- var tagLines = []string{
            "status: \"{{rm_status}}\"",
            "method: \"{{rm_method}}\"",
            "namespace: \"{{rm_ns}}\"",
            "ingress: \"{{rm_ing}}\"",
            "service: \"{{rm_svc}}\"",
            "controller_pod: \"{{rm_pod}}\"",
          } -%}
      {%- if (rm | dig("pathLabel")) == true %}{% tagLines = append(tagLines, "path: \"{{rm_path}}\"") %}{% end -%}
      {%- if (rm | dig("hostLabel")) == true %}{% tagLines = append(tagLines, "host: \"{{rm_host}}\"") %}{% end -%}
      {%- if (rm | dig("terminationStateLabel")) == true %}{% tagLines = append(tagLines, "term: \"{{rm_term}}\"") %}{% end -%}
      {#- `counters` keeps `server` off the histograms, where it multiplies every
          backend pod by each bucket (#564). -#}
      {%- var serverMode = tostring(rm | dig("serverLabel") | fallback(false)) -%}
      {%- if serverMode != "false" && serverMode != "true" && serverMode != "counters" -%}
        {%- fail("extraContext.vector.requestMetrics.serverLabel must be true, false or \"counters\", got '" + serverMode + "'.") -%}
      {%- end -%}
      {%- tagLines = append(tagLines, "controller_class: \"" + ctrlClass + "\"") -%}
      {%- tagLines = append(tagLines, "controller_namespace: \"" + ctrlNs + "\"") -%}
      {#- Absolute output indentation: these are emitted straight after `tags:`. -#}
      {%- var tagBlock = "" -%}
      {%- for _, t := range tagLines %}{% tagBlock = tagBlock + "\n          " + t %}{% end -%}
      {%- var coreOn = mOn("requests") || mOn("request_duration_seconds") -%}
      {%- var sizeOn = mOn("request_size") || mOn("response_size") -%}
      {%- var connOn = mOn("connect_duration_seconds") -%}
      {%- var respOn = mOn("header_duration_seconds") || mOn("response_duration_seconds") -%}
      {# parse_json ONCE, unlike the logMetrics regex extractors: those read one
      field each, while this reads eleven, and eleven regexes cost more than a parse. #}
        # Per-request metrics, projected from fields the access log already carries.
        request_metrics_base:
          type: remap
          inputs: [haproxy_log]
      {# This branch only: the stdout sink still gets every line, including HAProxy's
      process messages and the TCP-mode records dropped below. #}
          drop_on_abort: true
          reroute_dropped: false
          source: |
            m, merr = string(.message)
            if merr != null { abort }
            r, perr = parse_json(m)
            if perr != null { abort }
            o = object(r) ?? {}
            # HTTP-record discriminator: a TCP record has no status, and HAProxy's
            # process lines are not JSON. Doubles as the numeric check.
            if is_null(o.status) { abort }
            st = to_int(o.status) ?? -1
            if st < 0 { abort }
            .rm_status = to_string(st)
            # Empty when HAProxy answered the request itself; it still counts.
            res = split(string(o.resource) ?? "", "/")
            .rm_ns = ""
            .rm_ing = ""
            if length(res) > 1 {
              .rm_ns = string(res[0]) ?? ""
              .rm_ing = string(res[1]) ?? ""
            }
            .rm_svc = string(o.service) ?? ""
            .rm_method = string(o.method) ?? ""
            .rm_pod = string(o.instance_pod) ?? ""
      {%- if serverMode != "false" %}
            .rm_server = string(o.server) ?? ""
            if .rm_server == "<NOSRV>" { .rm_server = "" }
      {%- end %}
            .rm_host = string(o.host) ?? ""
            # The route key carries the host as a prefix; the label wants the path.
            .rm_path = replace(string(o.route) ?? "", r'^[^/]*', "")
            .rm_term = string(o.term) ?? ""
            .rm_one = 1
            .rm_bytes = to_int(o.bytes) ?? 0
            .rm_bytes_in = to_int(o.bytes_in) ?? 0
            # A timer reads -1 when its phase never happened. The two that gate a
            # filter below keep the -1; these three are always meaningful.
            ta = to_int(o.total_time_ms) ?? 0
            if ta < 0 { ta = 0 }
            trq = to_int(o.request_time_ms) ?? 0
            if trq < 0 { trq = 0 }
            tw = to_int(o.queue_time_ms) ?? 0
            if tw < 0 { tw = 0 }
            # The whole upstream call: Ta - TR - Tw is exactly Tc + Tr + Td, and
            # unlike Td itself needs no tracing-gated log field.
            up = ta - trq - tw
            if up < 0 { up = 0 }
            .rm_req_dur = to_float(ta) / 1000.0
            .rm_upstream = to_float(up) / 1000.0
            .rm_connect = to_float(to_int(o.connect_time_ms) ?? -1) / 1000.0
            .rm_header = to_float(to_int(o.response_time_ms) ?? -1) / 1000.0
      {# (log_to_metric type, remap field); the group decides gate and exporter. #}
      {%- var defs = map[string][]string{
            "requests":                  []string{"counter",   "rm_one"},
            "request_duration_seconds":  []string{"histogram", "rm_req_dur"},
            "request_size":              []string{"histogram", "rm_bytes_in"},
            "response_size":             []string{"histogram", "rm_bytes"},
            "connect_duration_seconds":  []string{"histogram", "rm_connect"},
            "header_duration_seconds":   []string{"histogram", "rm_header"},
            "response_duration_seconds": []string{"histogram", "rm_upstream"},
          } -%}
      {%- var emit = func(names []string) string {
            var out = ""
            for _, n := range names {
              if mOn(n) {
                var tags = tagBlock
                if serverMode == "true" || (serverMode == "counters" && defs[n][0] == "counter") {
                  tags = tags + "\n          server: \"{{rm_server}}\""
                }
                var metricNames = []string{n}
                if n == "requests" { metricNames = []string{"requests_total", "requests"} }
                for _, metricName := range metricNames {
                  out = out + "\n      - type: " + defs[n][0] +
                      "\n        field: " + defs[n][1] +
                      "\n        name: " + metricName +
                      "\n        namespace: " + prefix +
                      "\n        tags:" + tags
                }
              }
            }
            return out
          } -%}
      {%- if coreOn %}

        request_metrics_core:
          type: log_to_metric
          inputs: [request_metrics_base]
          metrics:{{ emit([]string{"requests", "request_duration_seconds"}) }}
      {%- end %}
      {%- if sizeOn %}
      {# Its own log_to_metric because these two go to the SIZES exporter, whose
         buckets are byte boundaries. Same source event as the core metrics. #}

        request_metrics_sizes:
          type: log_to_metric
          inputs: [request_metrics_base]
          metrics:{{ emit([]string{"request_size", "response_size"}) }}
      {%- end %}
      {%- if connOn %}
      {# Without this gate every request HAProxy answered itself — a deny, a
         redirect, a 503 with no live endpoint — would report a 0-second connect. #}

        # A backend connection was established.
        request_metrics_connected:
          type: filter
          inputs: [request_metrics_base]
          condition:
            type: vrl
      {# to_float, not a bare comparison: VRL types the field as unknown here and
         refuses a fallible expression in a condition. -1.0 excludes the record. #}
            source: '(to_float(.rm_connect) ?? -1.0) >= 0.0'

        request_metrics_connect:
          type: log_to_metric
          inputs: [request_metrics_connected]
          metrics:{{ emit([]string{"connect_duration_seconds"}) }}
      {%- end %}
      {%- if respOn %}
      {# A connection accepted and then hung up (term sH--) has Tr = -1 and belongs
         in neither histogram; `requests` and its `term` label are where it shows up. #}

        # The upstream produced response headers.
        request_metrics_responded:
          type: filter
          inputs: [request_metrics_base]
          condition:
            type: vrl
            source: '(to_float(.rm_header) ?? -1.0) >= 0.0'

        request_metrics_response:
          type: log_to_metric
          inputs: [request_metrics_responded]
          metrics:{{ emit([]string{"header_duration_seconds", "response_duration_seconds"}) }}
      {%- end %}
      {%- var cl = rm | dig("cardinalityLimit") | fallback(map[string]any{}) -%}
      {%- if (cl | dig("enabled")) == true -%}
      {%- var limit = cl | dig("valueLimit") | fallback(500) -%}
      {%- var action = cl | dig_string("drop_tag", "action") -%}
      {%- if action != "drop_tag" && action != "drop_event" -%}
        {%- fail("extraContext.vector.requestMetrics.cardinalityLimit.action must be \"drop_tag\" or \"drop_event\", got '" + action + "'.") -%}
      {%- end -%}
      {%- if toint(limit) < 1 -%}
        {%- fail("extraContext.vector.requestMetrics.cardinalityLimit.valueLimit must be a positive integer, got '" + tostring(limit) + "'.") -%}
      {%- end -%}
      {#- Per sink branch. Only these metrics: the haproxy_* re-export has bounded
          labels and must keep honor_labels. -#}
      {%- var coreGuarded = []string{} -%}
      {%- if coreOn %}{% coreGuarded = append(coreGuarded, "request_metrics_core") %}{% end -%}
      {%- if connOn %}{% coreGuarded = append(coreGuarded, "request_metrics_connect") %}{% end -%}
      {%- if respOn %}{% coreGuarded = append(coreGuarded, "request_metrics_response") %}{% end -%}
      {%- if len(coreGuarded) > 0 %}

      {# drop_tag collapses the offending label onto one series and keeps the totals
      correct; drop_event would discard the requests, so a cardinality problem would
      read as an outage. State is in memory and resets on restart. #}
        # Backstop for a label that goes unbounded anyway.
        request_metrics_guard:
          type: tag_cardinality_limit
          inputs: [{{ join(coreGuarded, ", ") }}]
      {# exact_fingerprint: 8 bytes per distinct value instead of the string.
      per_metric: a runaway `path` on one family must not spend the others' budget. #}
          mode: exact_fingerprint
          tracking_scope: per_metric
          value_limit: {{ toint(limit) }}
          limit_exceeded_action: {{ action }}
      {%- end %}
      {%- if sizeOn %}

        request_metrics_size_guard:
          type: tag_cardinality_limit
          inputs: [request_metrics_sizes]
          mode: exact_fingerprint
          tracking_scope: per_metric
          value_limit: {{ toint(limit) }}
          limit_exceeded_action: {{ action }}
      {%- end %}
      {%- end %}

  vector-span-transform:
    template: |-
      {# The access-log -> OTLP span transform, in its own snippet so
          _helm_load.unset can drop ~10 KB from the config object when no OTLP
          endpoint is set: a deployment that exports no spans should not carry
          the transform that builds them. vector.yaml keeps the
          `otlpEndpoint != ""` gate, which is the real one. #}
        # Access-log records -> OTLP spans. Coverage is whatever HAProxy logs,
        # which includes every response it generates itself. HAProxy already
        # minted the ids and decided sampling: this stage only reshapes.
        # Rationale: values.yaml extraContext.tracing.
        spans:
          type: remap
          inputs: [haproxy_log]
          # A record that is not a sampled access-log line is dropped from THIS
          # path only — the stdout sink still gets every line, including HAProxy's
          # process messages.
          drop_on_abort: true
          reroute_dropped: false
          source: |
            m, merr = string(.message)
            if merr != null { abort }
            r, perr = parse_json(m)
            if perr != null { abort }
            o = object(r) ?? {}
            tid = string(o.trace_id) ?? ""
            sid = string(o.span_id) ?? ""
            if tid == "" || sid == "" { abort }
            # Honour the sampling decision HAProxy already took and propagated.
            # trace-flags is a BITFIELD, not an enum: W3C defines bit 0 as
            # sampled and reserves the rest, so an adopted "03" (sampled +
            # random-trace-id) is sampled. Test the bit, not the byte — VRL has
            # no % operator, hence mod().
            flags_int = parse_int(string(o.trace_flags) ?? "", 16) ?? 0
            if mod(flags_int, 2) != 1 { abort }
            # A timer reads -1 when its phase never happened. Clamp to 0 for
            # offsets; the -1 itself is the signal for whether a span exists.
            th = to_int(o.handshake_time_ms) ?? 0
            if th < 0 { th = 0 }
            ti = to_int(o.idle_time_ms) ?? 0
            if ti < 0 { ti = 0 }
            trq = to_int(o.request_time_ms) ?? 0
            if trq < 0 { trq = 0 }
            tw = to_int(o.queue_time_ms) ?? 0
            if tw < 0 { tw = 0 }
            tc = to_int(o.connect_time_ms) ?? -1
            trs = to_int(o.response_time_ms) ?? -1
            ta = to_int(o.total_time_ms) ?? 0
            if ta < 0 { ta = 0 }
            # `ts` is accept_date — the CONNECTION accept. Every timer below is
            # request-scoped, so anchoring a span at `ts` starts it one TLS
            # handshake plus keep-alive idle too early, and it can then end
            # before the backend it waited on. Request receipt is
            # accept + Th + Ti; the phases follow HAProxy's fixed order.
            accept_ns = to_unix_timestamp(parse_timestamp(string(o.ts) ?? "", "%Y-%m-%dT%H:%M:%S%.fZ") ?? now(), unit: "nanoseconds")
            ms = 1000000
            req_ns = accept_ns + (th + ti) * ms
            # te_us carries no whole-ms truncation; req+Ta is the fallback.
            te_us = to_int(o.te_us) ?? 0
            end_ns = req_ns + ta * ms
            if te_us > 0 { end_ns = te_us * 1000 }
            if end_ns < req_ns { end_ns = req_ns }
            srv_ns = req_ns + (trq + tw) * ms
            # No negative-duration span: reachable when Ta is -1 (aborted).
            if end_ns < srv_ns { end_ns = srv_ns }
            st = to_int(o.status) ?? 0
            route = string(o.route) ?? ""
            meth = string(o.method) ?? ""
            res = string(o.resource) ?? ""
            # route is the whole matched key, host included: the NAME keeps the
            # host (a deliberate semconv deviation), http.route is the path.
            rt = replace(route, r'^[^/]*', "")
            # Bare method when neither exists; "GET []" is not a name.
            span_name = meth
            if res != "" { span_name = meth + " [" + res + "]" }
            if route != "" { span_name = meth + " " + route }
            # Two loops, not a line per attribute: this template ships inside the
            # config CR, where a literal line costs ~3x a table entry. Empty values
            # are skipped, so no separate filter pass is needed.
            #
            # No client IP in either direction: client_ip (forwarded) and
            # client_ip_peer (raw TCP source) are personal data under GDPR, and a
            # trace is retained and shared far more widely than an access log.
            # Correlate via haptic.req_id, which the log line also carries.
            #
            # hl carries the HAPTIC-specific fields, whose attribute name is
            # `haptic.` + the ACCESS-LOG FIELD NAME. Keeping the two identical is
            # what lets you jump from a log line to the span attribute without a
            # translation table; sm holds the rest, where semconv dictates a name.
            hl = ["resource","req_id","denied_by","gw_route","cache","app_backend",
              "waf_action","waf_rule_id","waf_score","waf_rules_hit","waf_matched_var",
              "auth_status","rate_limit_allowed","rate_limit_remaining","schema_outcome",
              "instance_pod","instance_node"]
            # A LIST, not an object: for_each over a VRL object has no
            # defined key order, so the attribute order in the OTLP payload
            # would vary run to run. "key|log_field" keeps it dense.
            sm = ["http.request.method|method","url.path|path","server.address|host",
              "tls.protocol.version|tls_version","tls.server_name|tls_sni",
              "user.id|consumer","haproxy.frontend|frontend","haproxy.backend|backend",
              "haproxy.term_state|term","haproxy.mtls_verify|mtls_verify",
              "tls.client.subject|mtls_cn","network.local.address|destination_ip"]
            attrs = []
            for_each(hl) -> |_i, f| {
              v = string(get(o, [f]) ?? "") ?? ""
              if v != "" { attrs = push(attrs, {"key": "haptic." + f, "value": {"stringValue": v}}) }
            }
            for_each(sm) -> |_i, e| {
              kv = split(e, "|")
              k = string!(kv[0])
              v = string(get(o, [string!(kv[1])]) ?? "") ?? ""
              if v != "" { attrs = push(attrs, {"key": k, "value": {"stringValue": v}}) }
            }
            # semconv wants "1.1"; HAProxy logs "HTTP/1.1".
            pv = replace(string(o.http_version) ?? "", "HTTP/", "")
            if pv != "" { attrs = push(attrs, {"key":"network.protocol.version","value":{"stringValue": pv}}) }
            if rt != "" { attrs = push(attrs, {"key":"http.route","value":{"stringValue": rt}}) }
            # Absent is not false, and not port 0: both would read as a real
            # measurement on a plaintext frontend.
            if exists(o.tls_resumed) { attrs = push(attrs, {"key":"tls.resumed","value":{"boolValue": to_bool(o.tls_resumed) ?? false}}) }
            if exists(o.listener_port) { attrs = push(attrs, {"key":"server.port","value":{"intValue": to_string(to_int(o.listener_port) ?? 0)}}) }
            if exists(o.bytes) { attrs = push(attrs, {"key":"http.response.body.size","value":{"intValue": to_string(to_int(o.bytes) ?? 0)}}) }
            # Attributes, not child spans: no intra-request event times exist,
            # and the handshake precedes the request span anyway.
            attrs = append(attrs, [
              {"key":"http.response.status_code","value":{"intValue": to_string(st)}},
              {"key":"haproxy.time.client_handshake_ms","value":{"intValue": to_string(th)}},
              {"key":"haproxy.time.idle_ms","value":{"intValue": to_string(ti)}},
              {"key":"haproxy.time.request_ms","value":{"intValue": to_string(trq)}}
            ])
            # semconv {method} {http.route}: the route template, never the URI
            # path (unbounded cardinality). Bracketed fallback = not a path.
            server_span = {
              "traceId": tid,
              "spanId": sid,
              "name": span_name,
              "kind": 2,
              "startTimeUnixNano": to_string(req_ns),
              "endTimeUnixNano": to_string(end_ns),
              "attributes": attrs
            }
            # OTLP: parentSpanId must be ABSENT on a root span, not empty.
            pid = string(o.parent_span_id) ?? ""
            if pid != "" { server_span = set!(server_span, ["parentSpanId"], pid) }
            if st >= 500 { server_span = set!(server_span, ["status"], {"code": 2}) }
            spans = [server_span]
            # CLIENT span for the upstream call. It carries upstream_span_id —
            # what HAProxy propagated — so the backend's span nests inside it.
            # Absent when no backend was contacted (Tc/Tr are -1 for a deny, a
            # 429, a redirect, an errorfile); the SERVER span still covers those.
            usid = string(o.upstream_span_id) ?? ""
            if usid != "" && (tc >= 0 || trs >= 0) {
              tdd = to_int(o.transfer_time_ms) ?? -1
              ctc = tc
              if ctc < 0 { ctc = 0 }
              ctr = trs
              if ctr < 0 { ctr = 0 }
              ctd = tdd
              if ctd < 0 { ctd = 0 }
              # Tc+Tr+Td, not the transaction end: that end includes the write
              # to the CLIENT. Tc+Tr alone stops at the response headers and
              # excluded the body. A -1 timer means the phase never ran, so the
              # attribute is omitted rather than 0. VRL rejects comments inside
              # an object literal, hence these sit out here.
              be = string(o.backend) ?? ""
              up_name = "Server session"
              if be != "" { up_name = "Server session [" + be + "]" }
              up_end_ns = srv_ns + (ctc + ctr + ctd) * ms
              if up_end_ns > end_ns { up_end_ns = end_ns }
              if up_end_ns < srv_ns { up_end_ns = srv_ns }
              # Upstream-leg properties only. The client-side timers (Th, Ti,
              # TR) stay on the SERVER span — they are over before this span
              # starts. Queue, retries and the chosen server describe reaching
              # THIS backend, not the transaction that waited for them.
              upstream_attrs = [{"key":"haproxy.backend","value":{"stringValue": string(o.backend) ?? ""}},
                {"key":"haproxy.time.queue_ms","value":{"intValue": to_string(tw)}},
                {"key":"haproxy.retries","value":{"intValue": to_string(to_int(o.retries) ?? 0)}}]
              sv = string(o.server) ?? ""
              if sv != "" { upstream_attrs = push(upstream_attrs, {"key":"haproxy.server","value":{"stringValue": sv}}) }
              # haproxy.server is the pod name (pod-named servers), so
              # server_pod is the same value; kept as its own attribute.
              pod = string(o.server_pod) ?? ""
              if pod != "" { upstream_attrs = push(upstream_attrs, {"key":"k8s.pod.name","value":{"stringValue": pod}}) }
              kns = string(o.namespace) ?? ""
              if kns != "" { upstream_attrs = push(upstream_attrs, {"key":"k8s.namespace.name","value":{"stringValue": kns}}) }
              ksvc = string(o.service) ?? ""
              if ksvc != "" { upstream_attrs = push(upstream_attrs, {"key":"k8s.service.name","value":{"stringValue": ksvc}}) }
              if tc >= 0 {
                upstream_attrs = push(upstream_attrs, {"key":"haproxy.time.connect_ms","value":{"intValue": to_string(tc)}})
              }
              if trs >= 0 {
                upstream_attrs = push(upstream_attrs, {"key":"haproxy.time.response_ms","value":{"intValue": to_string(trs)}})
              }
              if tdd >= 0 {
                upstream_attrs = push(upstream_attrs, {"key":"haproxy.time.transfer_ms","value":{"intValue": to_string(tdd)}})
              }
              upstream_span = {
                "traceId": tid,
                "spanId": usid,
                "parentSpanId": sid,
                "name": up_name,
                "kind": 3,
                "startTimeUnixNano": to_string(srv_ns),
                "endTimeUnixNano": to_string(up_end_ns),
                "attributes": upstream_attrs
              }
              spans = push(spans, upstream_span)
              # No "Wait for response" span (the official filter has one):
              # HAProxy mints two span ids, and this would need a third. Giving
              # it the upstream id makes it its own parent, and inventing an id
              # in the log pipeline adds a span carrying nothing that
              # haproxy.time.connect_ms / response_ms above do not already say.
            }
            # An array assigned to `.` fans out into one event per element, and
            # the sink batches them back into a single resourceSpans payload.
            . = spans

validationTests:
  test-vector-shipped-log-metrics-are-present:
    description: >-
      The chart's default log-derived metrics must actually render. All three
      cache counters were silently dropped from values.yaml while the library,
      the CR template and two docs pages still promised them, so operators lost
      their cache dashboards on upgrade with nothing to show why.
    fixtures:
      ingresses: []
    assertions:
      # The three cache counters carry `requires: cache.varnish.enabled`, which is
      # resolved at helm time, so a validationTest cannot switch them back on —
      # scripts/check-shipped-log-metrics.sh guards those. This pins the entry
      # that has no `requires` and would have been dropped just as silently.
      - {type: contains, target: file:vector.yaml, pattern: 'name: denied_total'}
      - {type: contains, target: file:vector.yaml, pattern: 'rate_limit_shared_unavailable'}

  test-vector-config-rendered:
    description: Vector config renders with the log socket, the hub scrape source, and the exporter
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 9101
        dataDir: /var/lib/vector
    assertions:
      - {type: haproxy_valid, description: HAProxy config must still be valid with vector enabled}
      - type: contains
        target: file:vector.yaml
        pattern: 'mode: unix_datagram'
        description: Log source must be a UNIX datagram socket
      - type: contains
        target: file:vector.yaml
        pattern: 'path: /run/vector/haproxy\.sock'
        description: Socket path must come from the operator value
      - type: contains
        target: file:vector.yaml
        pattern: 'method: newline_delimited'
      - type: contains
        target: file:vector.yaml
        pattern: 'codec: bytes'
        description: >-
          Byte passthrough, not JSON decoding — the global log target carries
          non-JSON process messages alongside JSON access records
      - type: not_contains
        target: file:vector.yaml
        pattern: 'haproxy_metrics|127\.0\.0\.1:8404'
        description: >-
          HAProxy's exporter is not re-exported — Prometheus scrapes it directly.
          Measured at 2,500 backends: the re-export was 1.3 GB of vector's 1.4 GB
      - type: contains
        target: file:vector.yaml
        pattern: 'http://127\.0\.0\.1:9101/metrics'
        description: Must re-export the spoa-hub's metrics
      - type: not_contains
        target: file:vector.yaml
        # The KEY form, not the bare word: the surrounding comment explains why the
        # option is absent, and a substring match would find that comment instead.
        pattern: '(?m)^\s+instance_tag:'
        description: instance_tag stamps the scraped target onto every series, identical on every pod
      - type: contains
        target: file:vector.yaml
        pattern: 'address: 0\.0\.0\.0:9598'
        description: Exporter must bind the configured metrics port
      - type: contains
        target: file:vector.yaml
        pattern: 'type: prometheus_exporter'
        description: Rendered config must expose the metrics endpoint

  test-vector-otlp-span-pipeline:
    _helm_skip_test: '{{ if not (dig "tracing" "otlp" "endpoint" "" (.Values.controller.config.templatingSettings.extraContext | default dict)) }}true{{ end }}'
    description: An OTLP endpoint renders the span transform and the OTLP/HTTP sink
    fixtures: {}
    extraContext:
      tracing:
        enabled: true
        otlp:
          endpoint: http://tempo:4318/v1/traces
          serviceName: haptic-edge
          clusterName: ""
      vector: { socketPath: /run/vector/haproxy.sock, metricsPort: 9598, scrapeIntervalSecs: 15, spoaHubMetricsPort: 0, dataDir: /var/lib/vector }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^\s+spans:'}
      - {type: contains, target: file:vector.yaml, pattern: 'uri: "http://tempo:4318/v1/traces"'}
      - type: contains
        target: file:vector.yaml
        pattern: '"key":"service\.namespace","value":\{"stringValue":"[^"]+"\}'
        description: >-
          Resource attributes identify WHICH HAPTIC emitted the span. The VALUE
          is the release namespace, so it must not be pinned: these tests run on
          the operator's own config, where asserting "default" is a load-gate
          failure for every install that is not in that namespace
      - type: contains
        target: file:vector.yaml
        pattern: '"key":"k8s\.deployment\.name","value":\{"stringValue":"[^"]+-haproxy"\}'
      - type: not_contains
        target: file:vector.yaml
        pattern: '"key":"k8s\.cluster\.name"'
        description: >-
          Omitted, not blank, when unset: Kubernetes exposes no cluster name to a
          pod, so there is nothing to default it to. Pinned empty in this test's
          own extraContext above — an operator who sets clusterName must not fail
          an assertion that it is absent
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[spans\]'
        description: The sink must read the span transform, not the raw log
      # The generic http sink, NOT the opentelemetry sink: that sink's otlp codec
      # only encodes resourceLogs/resourceMetrics and rejects resourceSpans, and
      # vector cannot turn a log line into the Trace-typed event its trace branch
      # needs. Verified against the real binary and a collector.
      - type: contains
        target: file:vector.yaml
        pattern: 'payload_prefix'
        description: >-
          The batched JSON array is wrapped into ONE ExportTraceServiceRequest;
          without it a batch is several concatenated documents and the collector
          400s while vector drops them as non-retriable
      - type: contains
        target: file:vector.yaml
        pattern: '"stringValue":"haptic-edge"'
        description: serviceName reaches the resource attributes
      - type: contains
        target: file:vector.yaml
        pattern: 'if mod\(flags_int, 2\) != 1 \{ abort \}'
        description: >-
          The sampling decision HAProxy already took is honoured here rather than
          re-made — re-deciding downstream produces half-sampled traces

  test-vector-no-otlp-endpoint-no-span-pipeline:
    description: Without an endpoint neither the span transform nor the sink is rendered
    fixtures: {}
    extraContext:
      tracing: {otlp: {endpoint: ""}}
      vector: { socketPath: /run/vector/haproxy.sock, metricsPort: 9598, scrapeIntervalSecs: 15, spoaHubMetricsPort: 0, dataDir: /var/lib/vector }
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: file:vector.yaml, pattern: 'otlp_traces'}
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?m)^\s+spans:'
        description: No dead transform when nothing consumes it

  test-vector-omit-empty-log-fields:
    description: omitEmptyLogFields renders the remap transform and the stdout sink reads it
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        omitEmptyLogFields: true
    assertions:
      - {type: haproxy_valid, description: HAProxy config must still be valid}
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^\s+log_drop_empty:'
        description: The transform must be emitted as a config KEY, not just described in a comment
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[log_drop_empty\]'
        description: >-
          The stdout sink must read the TRANSFORM. If it still read haproxy_log the
          transform would render and strip nothing — a silent no-op
      - type: contains
        target: file:vector.yaml
        # The pair-separator anchor is the security boundary: it is what stops a
        # crafted field value from forging a match, since an embedded quote inside a
        # JSON string is escaped as \" and cannot open a key.
        pattern: 'replace\(m, r'', "\[A-Za-z_\]\[A-Za-z0-9_\]\*": ""'', ""\)'
        description: The separator-anchored, charset-restricted pattern must reach the config
      - type: not_contains
        target: file:vector.yaml
        pattern: 'string!\(\.message\)'
        description: >-
          Must use the FALLIBLE string(), never string!(). remap defaults
          drop_on_abort=true, so an abort DISCARDS the log record — verified: with
          .message absent, string!() aborts and the line is silently lost
      - type: contains
        target: file:vector.yaml
        pattern: 'm, err = string\(\.message\)'
        description: The fallible form, so no record can ever be dropped by this transform

  test-vector-omit-empty-disabled-passes-through:
    description: With omitEmptyLogFields=false the log goes straight from source to sink
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        omitEmptyLogFields: false
    assertions:
      - {type: haproxy_valid, description: HAProxy config must still be valid}
      - type: not_contains
        target: file:vector.yaml
        pattern: 'log_drop_empty'
        description: >-
          No transform at all — not even a rendered comment mentioning it, or the
          opt-out would look applied while the pipeline says otherwise
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[haproxy_log\]'
        description: The sink reads the raw source, preserving the byte-passthrough path

  test-vector-omit-empty-must-be-a-real-boolean:
    description: A quoted "false" is rejected rather than silently enabling the transform
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        omitEmptyLogFields: "false"
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'omitEmptyLogFields must be a boolean'
        description: Scriggo treats any non-empty string as truthy, so the CR path needs the type check too

  test-vector-exporter-stable-input:
    description: The exporter uses a stable metric stream without filtering metric names
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
    assertions:
      - {type: haproxy_valid, description: HAProxy config must still be valid}
      - type: not_contains
        target: file:vector.yaml
        pattern: 'metrics_filtered:'
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)metrics_stream:\s+type: filter\s+inputs:(\s+- [A-Za-z_]+)*\s+- vector_metrics\s+condition:\s+type: is_metric'
      - type: contains
        target: file:vector.yaml
        pattern: 'inputs: \[metrics_stream\]'

  test-vector-config-no-spoa-hub:
    description: Without a hub metrics port, no dangling spoa_hub scrape source or input is emitted
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        # Explicit 0, not omitted: a test's extraContext MERGES over the _global
        # baseline, so leaving this out inherits the chart's real hub port and the
        # not_contains below would test nothing.
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
    assertions:
      - {type: haproxy_valid, description: HAProxy config must be valid}
      - type: not_contains
        target: file:vector.yaml
        pattern: 'spoa_hub_metrics'
        description: >-
          A scrape source pointing at a port nothing listens on would make vector
          log a connection error every scrape_interval forever
      - type: contains
        target: file:vector.yaml
        pattern: '- vector_metrics'
        description: The exporter still carries vector's own metrics

  test-access-log-target-vector-socket:
    description: >-
      With vector enabled the access log is emitted to the mounted UNIX datagram
      socket instead of stdout — the counterpart to
      test-access-log-target-default-is-stdout in base.yaml.
    fixtures: {}
    extraContext:
      accessLog:
        targets:
          # Same key the chart's own default uses, so this overrides it rather
          # than fanning out to a second identical target.
          vector: {address: /run/vector/haproxy.sock, format: raw}
    assertions:
      - type: haproxy_valid
        description: A plain-path log target must pass HAProxy's config check
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log /run/vector/haproxy\.sock len 16384 format raw local0 info$'
        description: >-
          The plain-path form is HAProxy's UNIX datagram target; deliberately not
          `unix@`, which HAProxy 3.4 rejects for a ring server
      - type: not_contains
        target: haproxy.cfg
        pattern: '^  log stdout '
        description: >-
          Nothing should still be logging to stdout — a second target would double
          every record once vector re-emits to its own stdout

  test-vector-socket-path-must-be-absolute:
    description: A relative socketPath is rejected at render time
    fixtures: {}
    extraContext: {vector: {socketPath: run/vector/haproxy.sock, metricsPort: 9598, scrapeIntervalSecs: 15}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'socketPath must be an absolute path'
        description: HAProxy resolves a relative log path against default-path origin

  test-vector-log-derived-metrics-registry:
    description: >-
      Log-derived metrics are generated from extraContext.vector.logMetrics, so
      adding one is a data entry rather than new template code. Both kinds render:
      enum as a tagged counter, numeric as a counter incremented by the value.
    fixtures: {}
    extraContext:
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        logMetrics:
          __replace__: true
          cacheStatus:
            enabled: true
            field: cache
            kind: enum
            values: ["HIT", "MISS", "STALE"]
            metric: cache_status_total
            tag: status
          cacheAge: {enabled: true, field: cache_age, kind: numeric, metric: cache_age_seconds_total}
          switchedOff:
            enabled: false
            field: never
            kind: enum
            values: ["x"]
            metric: never_total
    assertions:
      - type: haproxy_valid
      # enum: a regex bounded to the declared values, and a tagged counter.
      - type: contains
        target: file:vector.yaml
        pattern: 'parse_regex\(m, r''"cache"\\s\*:\\s\*"\(\?P<v>HIT\|MISS\|STALE\)"''\)'
      - {type: contains, target: file:vector.yaml, pattern: 'name: cache_status_total'}
      # vector's own {{...}} interpolation must survive Scriggo, which shares the
      # delimiters — an evaluated tag renders empty and silently collapses every
      # value onto one series.
      - {type: contains, target: file:vector.yaml, pattern: 'status: "\{\{haptic_metric_value\}\}"'}
      # numeric: no tag, incremented by the value itself.
      - {type: contains, target: file:vector.yaml, pattern: 'name: cache_age_seconds_total'}
      - {type: contains, target: file:vector.yaml, pattern: 'increment_by_value: true'}
      - type: contains
        target: file:vector.yaml
        pattern: 'parse_regex\(m, r''"cache_age"\\s\*:\\s\*"\(\?P<v>\[0-9\]\+\)"''\)'
      # Both reach the scrape endpoint, not just exist.
      - {type: contains, target: file:vector.yaml, pattern: '- cacheStatus_metric'}
      - {type: contains, target: file:vector.yaml, pattern: '- cacheAge_metric'}
      # A disabled entry costs no per-record work at all.
      - {type: not_contains, target: file:vector.yaml, pattern: 'switchedOff'}
      # Scoped: parse_json is legitimate in the span branch and named in this
      # block's own comment. Only a real call inside an extract is a defect.
      - type: not_contains
        target: file:vector.yaml
        pattern: 'cacheStatus_extract:[\s\S]{0,900}parse_json\('
        description: Parsing every record per metric would undo the design

  test-vector-log-metric-rejects-unbounded-enum:
    description: >-
      An enum entry without `values` would let an unexpected field value invent a
      Prometheus label, so it is refused at render time rather than shipping an
      unbounded-cardinality metric.
    fixtures: {}
    extraContext:
      renderMode: admission
      vector:
        socketPath: /run/vector/haproxy.sock
        metricsPort: 9598
        scrapeIntervalSecs: 15
        spoaHubMetricsPort: 0
        dataDir: /var/lib/vector
        logMetrics: {__replace__: true, bad: {enabled: true, field: something, kind: enum, metric: bad_total}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'logMetrics\.bad is kind "enum" and must list its accepted `values`'

  test-vector-request-metrics-server-label-counters:
    _helm_skip_test: *requestMetricsOff
    description: >-
      serverLabel counters puts `server` on the request counter and keeps it off
      every histogram.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          serverLabel: counters
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          cardinalityLimit: {enabled: false}
          metrics:
            __replace__: true
            requests: true
            request_duration_seconds: true
            response_duration_seconds: true
            connect_duration_seconds: true
            header_duration_seconds: true
            request_size: true
            response_size: true
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:vector.yaml, pattern: '\.rm_server = string\(o\.server\)'}
      - {type: match_count, target: file:vector.yaml, pattern: '(?m)^          server: "\{\{rm_server\}\}"$', expected: "2"}
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^        name: requests_total\n(?:(?:        |          )[^\n]*\n)*?          server: '
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?m)^        name: [a-z_]+_(?:seconds|size)\n(?:(?:        |          )[^\n]*\n)*?          server: '

  test-vector-request-metrics-server-label-invalid:
    _helm_skip_test: *requestMetricsOff
    description: A serverLabel mode other than true, false or counters fails the render.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          serverLabel: histograms
          metrics: {__replace__: true, requests: true}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'serverLabel must be true, false or "counters", got .histograms.'

  test-vector-request-metrics-families:
    _helm_skip_test: *requestMetricsOff
    description: >-
      All seven families render with the full label set including `term`, each
      reaching the exporter its bucket domain belongs to.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          controllerClass: haproxy-haptic.org/controller
          controllerNamespace: haptic
          terminationStateLabel: true
          pathLabel: true
          hostLabel: true
          durationBuckets: [0.001, 0.005, 10, 30, 60]
          sizeBuckets: [100, 1000, 100000000]
          cardinalityLimit: {enabled: true, valueLimit: 500, action: drop_tag}
          serverLabel: true
          metrics:
            __replace__: true
            requests: true
            request_duration_seconds: true
            response_duration_seconds: true
            connect_duration_seconds: true
            header_duration_seconds: true
            request_size: true
            response_size: true
    assertions:
      - type: haproxy_valid
      # Every family, under the configured prefix.
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: requests$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: requests_total$'}
      - {type: contains, target: file:vector.yaml, pattern: 'server: "\{\{rm_server\}\}"'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: request_duration_seconds$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: response_duration_seconds$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: connect_duration_seconds$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: header_duration_seconds$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: request_size$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: response_size$'}
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^        namespace: haptic_ingress_controller$'
      # vector's own {{...}} interpolation shares Scriggo's delimiters. Evaluated
      # here, every tag would render empty and collapse the whole family onto one
      # series — silently, since the config would still load.
      - {type: contains, target: file:vector.yaml, pattern: 'status: "\{\{rm_status\}\}"'}
      - {type: contains, target: file:vector.yaml, pattern: 'term: "\{\{rm_term\}\}"'}
      - {type: contains, target: file:vector.yaml, pattern: 'path: "\{\{rm_path\}\}"'}
      - {type: contains, target: file:vector.yaml, pattern: 'host: "\{\{rm_host\}\}"'}
      # Constants, resolved at render time rather than per record.
      - type: contains
        target: file:vector.yaml
        pattern: 'controller_class: "haproxy-haptic\.org/controller"'
      - {type: contains, target: file:vector.yaml, pattern: 'controller_namespace: "haptic"'}
      # Two exporters, each with its own domain's boundaries. A shared list would
      # give latency byte buckets and bytes sub-second ones.
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^    address: 0\.0\.0\.0:9598$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^    address: 0\.0\.0\.0:9599$'}
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^    buckets: \[0\.001, 0\.005, 10, 30, 60\]$'
      # 1e8 must render as an integer: YAML 1.1 reads "1e+08" as a STRING, which
      # vector rejects at config load.
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^    buckets: \[100, 1000, 100000000\]$'}
      # The size families must not reach the primary sink, whose buckets are
      # seconds — scoped to the sizes sink block so it cannot pass vacuously.
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)metrics_sizes:\s+type: prometheus_exporter.{0,200}address: 0\.0\.0\.0:9599'

  test-vector-request-metrics-validity-gates:
    _helm_skip_test: *requestMetricsOff
    description: >-
      The upstream timers are grouped by validity gate: recording a -1 timer as
      zero would claim the backend answered instantly on a request that never
      reached one.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          controllerClass: c
          controllerNamespace: n
          terminationStateLabel: true
          pathLabel: true
          hostLabel: true
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          cardinalityLimit: {enabled: true, valueLimit: 500, action: drop_tag}
          metrics:
            __replace__: true
            requests: true
            request_duration_seconds: true
            response_duration_seconds: true
            connect_duration_seconds: true
            header_duration_seconds: true
            request_size: true
            response_size: true
    assertions:
      - type: haproxy_valid
      # Both gates exist and read the timer, not the derived value.
      - type: contains
        target: file:vector.yaml
        pattern: "source: '\\(to_float\\(\\.rm_connect\\) \\?\\? -1\\.0\\) >= 0\\.0'"
      - type: contains
        target: file:vector.yaml
        pattern: "source: '\\(to_float\\(\\.rm_header\\) \\?\\? -1\\.0\\) >= 0\\.0'"
      # Each pair below binds a metric to the transform that feeds it, using
      # `[^\[]*` as the block delimiter: every transform's `inputs: [...]` line
      # contains a bracket and nothing inside a metric entry does, so the match
      # cannot run past the end of its own block. RE2 has no lookahead, and a
      # plain `.{0,N}` window silently stops testing anything once the rendered
      # block outgrows N.
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)inputs: \[request_metrics_connected\][^\[]*name: connect_duration_seconds'
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)inputs: \[request_metrics_responded\][^\[]*name: header_duration_seconds'
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?s)inputs: \[request_metrics_base\][^\[]*name: connect_duration_seconds'
        description: A record that never reached a backend must not report a 0s connect
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?s)inputs: \[request_metrics_base\][^\[]*name: header_duration_seconds'
        description: An upstream that never sent headers must not report a 0s wait
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?s)inputs: \[request_metrics_base\][^\[]*name: response_duration_seconds'
      # The upstream total is Tc+Tr+Td expressed without a tracing-gated field.
      - {type: contains, target: file:vector.yaml, pattern: 'up = ta - trq - tw'}
      # One JSON parse for all eleven fields, not one regex per field.
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)request_metrics_base:.{0,900}parse_json\(m\)'

  test-vector-request-metrics-label-opt-outs:
    _helm_skip_test: *requestMetricsOff
    description: >-
      Each label opt-out removes its tag from every family rather than blanking
      it, so the rest aggregate exactly as the ingress-nginx set does.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: nginx_ingress_controller
          controllerClass: k8s.io/ingress-nginx
          controllerNamespace: ingress-nginx
          terminationStateLabel: false
          pathLabel: false
          hostLabel: false
          serverLabel: false
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          cardinalityLimit: {enabled: false}
          metrics: {__replace__: true, requests: true}
    assertions:
      - type: haproxy_valid
      # The prefix is what makes these a drop-in for an ingress-nginx install.
      - type: contains
        target: file:vector.yaml
        pattern: '(?m)^        namespace: nginx_ingress_controller$'
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: requests_total$'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: requests$'}
      - {type: contains, target: file:vector.yaml, pattern: 'controller_class: "k8s\.io/ingress-nginx"'}
      # Positive control: the labels that stay are still emitted, so the absence
      # assertions below are testing the opt-outs rather than a broken render.
      - {type: contains, target: file:vector.yaml, pattern: 'status: "\{\{rm_status\}\}"'}
      - {type: contains, target: file:vector.yaml, pattern: 'service: "\{\{rm_svc\}\}"'}
      - type: not_contains
        target: file:vector.yaml
        pattern: 'term: "\{\{rm_term\}\}"'
        description: terminationStateLabel false must drop the tag, not blank it
      - {type: not_contains, target: file:vector.yaml, pattern: 'path: "\{\{rm_path\}\}"'}
      - {type: not_contains, target: file:vector.yaml, pattern: 'host: "\{\{rm_host\}\}"'}
      - {type: not_contains, target: file:vector.yaml, pattern: 'server: "\{\{rm_server\}\}"'}
      # Only `requests` is on, so neither the size exporter nor the upstream
      # branches should exist at all.
      - type: not_contains
        target: file:vector.yaml
        pattern: 'metrics_sizes:'
        description: No size family enabled means no second exporter to scrape
      - {type: not_contains, target: file:vector.yaml, pattern: '(?m)^    address: 0\.0\.0\.0:9599$'}
      - {type: not_contains, target: file:vector.yaml, pattern: 'request_metrics_connected:'}
      # cardinalityLimit off: the guard disappears and the sink reads the
      # log_to_metric transform directly.
      - {type: not_contains, target: file:vector.yaml, pattern: 'tag_cardinality_limit'}
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^      - request_metrics_core$'}

  test-vector-request-metrics-sink-wiring:
    _helm_skip_test: *requestMetricsOff
    description: The generated exporter inputs must name transforms the config defines.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          controllerClass: c
          controllerNamespace: n
          terminationStateLabel: true
          pathLabel: true
          hostLabel: true
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          cardinalityLimit: {enabled: true, valueLimit: 250, action: drop_event}
          metrics: {__replace__: true, requests: true, connect_duration_seconds: true, response_size: true}
    assertions:
      - type: haproxy_valid
      # Guard on: it is the terminal stage, so the sink must read IT, never the
      # log_to_metric transforms it sits in front of.
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)request_metrics_guard:\s+type: tag_cardinality_limit\s+inputs: \[request_metrics_core, request_metrics_connect\]'
      - {type: contains, target: file:vector.yaml, pattern: 'value_limit: 250'}
      - {type: contains, target: file:vector.yaml, pattern: 'limit_exceeded_action: drop_event'}
      # Fan-in keeps exporter inputs unchanged when upstream transforms change.
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)metrics_stream:\s+type: filter\s+inputs:(\s+- [A-Za-z_]+)*\s+- request_metrics_guard'
      - type: contains
        target: file:vector.yaml
        pattern: '(?s)metrics_size_stream:\s+type: filter\s+inputs:\s+- request_metrics_size_guard'
      - {type: contains, target: file:vector.yaml, pattern: '(?s)metrics:\s+type: prometheus_exporter\s+inputs: \[metrics_stream\]'}
      - {type: contains, target: file:vector.yaml, pattern: '(?s)metrics_sizes:\s+type: prometheus_exporter\s+inputs: \[metrics_size_stream\]'}
      - {type: contains, target: file:vector.yaml, pattern: '(?s)metrics:\s+type: prometheus_exporter\s+inputs: \[metrics_stream\]\s+address: [^\n]+\s+suppress_timestamp: true'}
      - {type: contains, target: file:vector.yaml, pattern: '(?s)metrics_sizes:\s+type: prometheus_exporter\s+inputs: \[metrics_size_stream\]\s+address: [^\n]+\s+suppress_timestamp: true'}
      # The guard applies to these metrics only: the hub re-export's label set is
      # already bounded and must stay intact.
      - type: not_contains
        target: file:vector.yaml
        pattern: '(?s)tag_cardinality_limit[\s\S]{0,300}spoa_hub_metrics'
        description: Guarding the re-export would rewrite labels dashboards match on

  test-vector-request-metrics-disabled:
    description: >-
      With the feature off, nothing is rendered: no transforms, no second
      exporter, no `buckets` on the primary sink.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics: {enabled: false}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: file:vector.yaml, pattern: 'request_metrics_'}
      - {type: not_contains, target: file:vector.yaml, pattern: '(?m)^    buckets:'}
      - {type: not_contains, target: file:vector.yaml, pattern: 'metrics_sizes:'}
      # Positive control: the rest of the pipeline is untouched.
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^    address: 0\.0\.0\.0:9598$'}

  test-vector-request-counter-disabled:
    description: Disabling requests removes both aliases while duration observations remain enabled.
    fixtures: {}
    extraContext:
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          metrics: {__replace__: true, requests: false, request_duration_seconds: true}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:vector.yaml, pattern: '(?m)^        name: request_duration_seconds$'}
      - {type: not_contains, target: file:vector.yaml, pattern: '(?m)^        name: requests(_total)?$'}

  test-vector-request-metrics-rejects-bad-prefix:
    _helm_skip_test: *requestMetricsOff
    description: An invalid prefix must fail before it keeps Vector export unavailable.
    fixtures: {}
    extraContext:
      renderMode: admission
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: '9nope-'
          durationBuckets: [0.001, 1]
          sizeBuckets: [100, 1000]
          metrics: {__replace__: true, requests: true}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'requestMetrics\.prefix must be a Prometheus metric-name prefix'

  test-vector-request-metrics-rejects-sub-precision-buckets:
    description: >-
      A boundary below the exporter's 9-decimal precision renders as "0", and two
      of them collapse onto one — so the check runs on the rendered value, not the
      input, where both would pass.
    fixtures: {}
    extraContext:
      renderMode: admission
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          durationBuckets: [0.0000000001, 0.0000000002, 1]
          sizeBuckets: [100, 1000]
          metrics: {__replace__: true, request_duration_seconds: true}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'durationBuckets entry .0\.0000000001. is smaller than the exporter renders'

  test-vector-request-metrics-rejects-unsorted-buckets:
    description: >-
      `le` boundaries are cumulative, so an out-of-order list produces silently
      wrong quantiles rather than an error.
    fixtures: {}
    extraContext:
      renderMode: admission
      vector:
        metricsPort: 9598
        sizeMetricsPort: 9599
        logMetrics: {__replace__: true}
        requestMetrics:
          enabled: true
          prefix: haptic_ingress_controller
          durationBuckets: [1, 0.5, 2]
          sizeBuckets: [100, 1000]
          metrics: {__replace__: true, request_duration_seconds: true}
    assertions:
      - {type: contains, target: rendering_error, pattern: 'durationBuckets must be strictly ascending'}
