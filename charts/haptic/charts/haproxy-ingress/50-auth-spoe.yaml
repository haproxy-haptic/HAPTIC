# haproxy-ingress library — auth, external-auth (SPOE), and WAF.
# Basic-auth userlist + backend directive, the auth-*/waf SPOE map
# contributions, pass/fail header wiring, and the coraza /waf map. Consumes
# the spoa-hub library SPOE extension points.
templateSnippets:
  # ============================================================================
  # Phase 7: Basic Auth
  # ============================================================================

  global-top-600-haproxy-ingress-auth:
    requires: [ingresses, secrets]
    incremental:
      bindingsTemplate: |-
        {{- toJSON(map[string]any{"ingresses": map[string]any{
          "hashRegex": extraContext | dig_string("^\\$(2[aby]|5|6|y)\\$[./0-9A-Za-z$=]+$", "annotationCompatibility", "basicAuth", "passwordHashValidation", "regex"),
          "hashError": extraContext | dig_string("Replace it with a bcrypt, SHA-256/SHA-512 crypt or yescrypt hash, for example from htpasswd -nB <user>", "annotationCompatibility", "basicAuth", "passwordHashValidation", "errorMessage"),
        }}) -}}
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-secret']"]
      group: haproxy-ingress-auth-userlists
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var authSecret = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-secret"] -%}
        {%- if authSecret != "" -%}
          {%- var secretNs = ingress.Metadata.Namespace -%}
          {%- var secretName = authSecret -%}
          {%- if strings_contains(authSecret, "/") -%}
            {%- var parts = split(authSecret, "/") -%}
            {%- secretNs = parts[0] -%}
            {%- secretName = parts[1] -%}
          {%- end -%}
          {%- var fragment = render "util-haproxy-ingress-auth-userlist" -%}
          {%- if fragment != "" -%}
            {{- shared.Unique("haproxy-ingress-auth-userlists", secretNs + "/" + secretName, fragment) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  util-haproxy-ingress-auth-userlist:
    template: |
      {#
        HAProxy-Ingress Basic Auth Userlist Generation

        Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-secret

        Annotations:
          - haproxy-ingress.github.io/auth-secret: "<ns/name>" or "<name>" (required)

        Generates userlist from htpasswd-format Secret:
          userlist auth_<ns>_<name>
            user <username> password <hash>

        Secret format:
          Each key is a username, value is base64-encoded bcrypt/apr1 hash
          Example: admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei4...
      #}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var authSecret = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-secret"] %}
        {%- if authSecret != "" %}
          {#- Parse secret reference (supports "ns/name" or just "name") -#}
          {%- var secretNs = ns %}
          {%- var secretName = authSecret %}
          {%- if strings_contains(authSecret, "/") %}
            {%- var parts = split(authSecret, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var userlistName = "hi_auth_" + secretNs + "_" + secretName %}
            {#-
              Skip both the userlist and the matching backend ACL ref when the
              referenced Secret isn't in the controller's cache (informer not
              yet caught up, or the Secret was just cascade-deleted while the
              Ingress still lingers). The next render — once the cache catches
              up — will produce the full auth setup.

              Both this component and the matching http_auth snippet read the
              render transaction's immutable store snapshot.
            -#}
            {%- var secret = resources.secrets.GetSingle(secretNs, secretName) %}
            {%- if secret != nil %}
      # haproxy-ingress/global-top-auth ({{ key }})
      userlist {{ userlistName }}
              {% var secretData = secret.Data -%}
              {%- var hashRegex = tostring(props["hashRegex"]) %}
              {%- var hashErrMsg = tostring(props["hashError"]) %}
              {#- haproxy-ingress (and ingress-nginx) store credentials as an
                  htpasswd file under a single `auth` Secret key — one
                  "user:hash" (or "user::plaintext") line each. Parse that when
                  present so a migrated Secret authenticates; otherwise fall back
                  to HAPTIC's one-key-per-username shape (base64(hash) value). -#}
              {%- var authBlob, hasAuth = secretData["auth"] %}
              {%- if hasAuth %}
                {%- var htpasswd = authBlob | b64decode() | tostring() %}
                {%- for _, line := range split(htpasswd, "\n") %}
                  {%- var l = strip(line) %}
                  {%- if l == "" || !strings_contains(l, ":") %}{%- continue %}{%- end %}
                  {%- var parts = strings_splitn(l, ":", 2) %}
                  {%- var user = parts[0] %}
                  {%- var rest = parts[1] %}
                  {%- var pwKeyword = "password" %}
                  {%- if hasPrefix(rest, ":") %}{%- pwKeyword = "insecure-password" %}{%- rest = rest[1:] %}{%- end %}
                  {%- if user == "" || rest == "" %}{%- continue %}{%- end %}
                  {%- var pwInj = ConfigInjectionKind(rest, "token") %}
                  {%- if !regex_search(rest, hashRegex) %}
                    {{- fail("Ingress '" + key + "' references Secret '" + secretNs + "/" + secretName + "', whose password hash for user '" + user + "' doesn't match the allowed pattern \"" + hashRegex + "\"; HAPTIC refuses the configuration until it is replaced. " + hashErrMsg) -}}
                  {%- else if pwInj != "" %}
                    {{- fail("Basic-auth credential for user '" + user + "' in Secret '" + secretNs + "/" + secretName + "' referenced on Ingress '" + key + "' contains " + pwInj + ", which would break out of the userlist line. Remove whitespace, quotes and control characters from the hash.") -}}
                  {%- end %}
        user {{ user }} {{ pwKeyword }} {{ rest }}
                {%- end %}
              {%- else %}
                {%- for _, username := range keys(secretData) %}
                  {%- var passwordHash = secretData[username] | b64decode() | tostring() %}
                  {%- var pwInj = ConfigInjectionKind(passwordHash, "token") %}
                  {%- if !regex_search(passwordHash, hashRegex) %}
                    {{- fail("Ingress '" + key + "' references Secret '" + secretNs + "/" + secretName + "', whose password hash for user '" + username + "' doesn't match the allowed pattern \"" + hashRegex + "\"; HAPTIC refuses the configuration until it is replaced. " + hashErrMsg) -}}
                  {%- else if pwInj != "" %}
                    {{- fail("Basic-auth hash for user '" + username + "' in Secret '" + secretNs + "/" + secretName + "' referenced on Ingress '" + key + "' contains " + pwInj + ", which would break out of the userlist line. Remove whitespace, quotes and control characters from the hash.") -}}
                  {%- end %}
        user {{ username }} password {{ passwordHash }}
                {%- end %}
              {%- end %}
            {%- end %}
        {%- end %}
      {%- end -%}

  # External-auth (auth-url) map contribution. The spoa-hub library
  # defines auth-url.map and the SPOE wiring; this snippet feeds the
  # map with one entry per Ingress that has the auth-url annotation
  # set. The frontend looks up the URL by `txn.resource_key`
  # (= `<ns>/<name>`) and triggers the SPOE plugin.
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-external
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-url: "https://auth-svc.example/check"
  #
  map-auth-url-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-url']"]
      group: map-auth-url-ingress
      effects: [recordEvent]
    template: |-
      {# Keyed by <ns>/<name> (resource identity). The frontend looks up
          via var(txn.resource_key),map(...) — see spoa-hub.yaml's
          frontend-spoe-filters-100-external-auth and base.yaml's
          resource_key derivation at the end of frontend-routing-logic. #}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%%
        var ingress = item
        var authUrl = dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/auth-url")
        if authUrl != "" {
          var ns = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          var authUrlInj = ConfigInjectionKind(authUrl, "line")
          if authUrlInj != "" {
            var message = "Ingress " + ns + "/" + name + " annotation 'haproxy-ingress.github.io/auth-url' contains " + authUrlInj + ", which would inject an entry into the auth-url map; external auth is not applied. Remove control characters from the value."
            if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
              fail(message)
            } else {
              recordEvent(ingress, "InvalidAuthURL", message)
            }
          } else {
            if dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/ssl-passthrough") == "true" {
              recordEvent(ingress, "AuthIgnored", "haproxy-ingress.github.io/auth-url is set together with ssl-passthrough; external auth cannot run on SSL-passthrough (L4) traffic and is ignored for this Ingress")
            }
            var key = ns + "/" + name
            show shared.Unique("map-auth-url-ingress", key, "\n" + key + " " + authUrl)
          }
        }
      %%}

  # External-auth sign-in URL: when the auth service returns 401, redirect
  # the browser to this URL instead of denying. Mirrors nginx-ingress's
  # auth-signin handler — same HAProxy machinery (auth-signin.map +
  # frontend redirect rule in the spoa-hub library).
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-external
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-signin: "https://login.example/oauth2/start"
  map-auth-signin-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-signin']"]
      group: map-auth-signin-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%%
        var ingress = item
        var authSignin = dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/auth-signin")
        if authSignin != "" {
          var ns = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          var authSigninInj = ConfigInjectionKind(authSignin, "line")
          if authSigninInj != "" {
            var message = "Ingress " + ns + "/" + name + " annotation 'haproxy-ingress.github.io/auth-signin' contains " + authSigninInj + ", which would inject an entry into the auth-signin map; the sign-in redirect is not applied. Remove control characters from the value."
            if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
              fail(message)
            } else {
              recordEvent(ingress, "InvalidAuthSignin", message)
            }
          } else {
            var key = ns + "/" + name
            show shared.Unique("map-auth-signin-ingress", key, "\n" + key + " " + authSignin)
          }
        }
      %%}

  # External-auth HTTP method override. Mirrors the nginx-ingress
  # variant; both feed the spoa-hub library's auth-method.map and
  # surface in the SPOE check-auth message's `method` arg (plugin
  # v0.3.0+).
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-method
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-method: "POST"
  #
  # Allowed values: GET / HEAD / POST / PUT / PATCH / DELETE / OPTIONS.
  # Body-having methods (POST/PUT/PATCH) go out with an empty body —
  # the plugin does not forward the original request payload.
  map-auth-method-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-method']"]
      group: map-auth-method-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%%
        var ingress = item
        var authMethod = dig_string(ingress, "", "metadata", "annotations", "haproxy-ingress.github.io/auth-method")
        if authMethod != "" {
          var ns = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          var authMethodInj = ConfigInjectionKind(authMethod, "line")
          if authMethodInj != "" {
            var message = "Ingress " + ns + "/" + name + " annotation 'haproxy-ingress.github.io/auth-method' contains " + authMethodInj + ", which would inject an entry into the auth-method map; the method override is not applied. Remove control characters from the value."
            if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
              fail(message)
            } else {
              recordEvent(ingress, "InvalidAuthMethod", message)
            }
          } else {
            var key = ns + "/" + name
            show shared.Unique("map-auth-method-ingress", key, "\n" + key + " " + authMethod)
          }
        }
      %%}

  # oauth: oauth2_proxy — a convenience that desugars onto the external-auth
  # machinery (the auth-url / auth-signin / auth-method / auth-extract-headers
  # maps + the spoa-hub SPOE wiring); no new SPOA plugin. Per upstream
  # haproxy-ingress, the oauth2-proxy backend is the one this Ingress already
  # routes the oauth-uri-prefix path (default /oauth2) to, so the address is
  # derived from that path's Service. auth-url takes precedence, so the oauth
  # desugaring is skipped when auth-url is also set on the same Ingress.
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#oauth
  #
  # Annotations: oauth (oauth2_proxy|oauth2-proxy), oauth-uri-prefix (/oauth2),
  #   oauth-headers (X-Auth-Request-Email).
  #
  # IMPORTANT: emits an http:// auth URL pointing at the in-cluster oauth2-proxy
  # Service — the spoa-hub external-auth plugin must run with allow_plaintext
  # for a plain-HTTP oauth2-proxy.
  map-auth-url-510-haproxy-ingress-oauth:
    requires: [ingresses, services]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
      group: map-auth-url-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {%- if oauth != "" && authUrl == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- if oauth != "oauth2_proxy" && oauth != "oauth2-proxy" -%}
            {{- fail("Invalid value '" + oauth + "' for annotation 'haproxy-ingress.github.io/oauth' on Ingress '" + ns + "/" + name + "'. Only 'oauth2_proxy' (or 'oauth2-proxy') is supported.") -}}
          {%- end -%}
          {%- var prefix = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth-uri-prefix"] -%}
          {%- if prefix == "" -%}{%- prefix = "/oauth2" -%}{%- end -%}
          {%- var prefixInj = ConfigInjectionKind(prefix, "line") -%}
          {%- if prefixInj != "" -%}{{- WebhookRejectOrWarn(ingress, "InvalidOAuthPrefix", "Ingress " + ns + "/" + name + " annotation 'haproxy-ingress.github.io/oauth-uri-prefix' contains " + prefixInj + ", which would inject an entry into the auth-url map; the OAuth route is not applied. Remove control characters from the value.") -}}{%- continue -%}{%- end -%}
          {%- if len(prefix) > 1 && hasSuffix(prefix, "/") -%}{%- prefix = prefix[:len(prefix)-1] -%}{%- end -%}
          {%- var emitted = false -%}
          {%- for _, path := range ingress.Spec.Rules[*].Http.Paths -%}
            {%- if !emitted && path.Path == prefix && path.Backend.Service.Name != "" -%}
              {%- var parts = split(ResolveServicePort(ns, path.Backend.Service.Name, path.Backend.Service.Port, ingress), " ") -%}
      {{ "\n" }}{{ ns }}/{{ name }} http://{{ path.Backend.Service.Name }}.{{ ns }}.svc:{{ parts[0] }}{{ prefix }}/auth
              {%- emitted = true -%}
            {%- end -%}
          {%- end -%}
          {%- if !emitted -%}
            {{- fail("Ingress '" + ns + "/" + name + "' sets 'haproxy-ingress.github.io/oauth: " + oauth + "' but has no Ingress path '" + prefix + "' routing to the oauth2-proxy Service. Add a path for '" + prefix + "' (haproxy-ingress derives the oauth2-proxy backend from that path).") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-auth-signin-510-haproxy-ingress-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
      group: map-auth-signin-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {#- An explicit auth-signin takes precedence over the oauth desugaring (its
            -500- snippet renders first and would shadow this entry). -#}
        {%- var authSignin = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-signin"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authSignin == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var prefix = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth-uri-prefix"] -%}
          {%- if prefix == "" -%}{%- prefix = "/oauth2" -%}{%- end -%}
          {%- var prefixInj = ConfigInjectionKind(prefix, "line") -%}
          {%- if prefixInj != "" -%}{{- WebhookRejectOrWarn(ingress, "InvalidOAuthPrefix", "Ingress " + ns + "/" + name + " annotation 'haproxy-ingress.github.io/oauth-uri-prefix' contains " + prefixInj + ", which would inject an entry into the auth-signin map; the OAuth route is not applied. Remove control characters from the value.") -}}{%- continue -%}{%- end -%}
          {%- if len(prefix) > 1 && hasSuffix(prefix, "/") -%}{%- prefix = prefix[:len(prefix)-1] -%}{%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ prefix }}/start?rd=$escaped_request_uri
        {%- end -%}
      {%- end -%}

  # The oauth2-proxy path serves the sign-in, so it must not require it.
  map-auth-exempt-backend-510-haproxy-ingress-oauth:
    requires: [ingresses, services]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" -%}
          {%- var prefix = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth-uri-prefix"] -%}
          {%- if prefix == "" -%}{%- prefix = "/oauth2" -%}{%- end -%}
          {%- if len(prefix) > 1 && hasSuffix(prefix, "/") -%}{%- prefix = prefix[:len(prefix)-1] -%}{%- end -%}
          {%- for _, path := range ingress.Spec.Rules[*].Http.Paths -%}
            {%- if path.Path == prefix && path.Backend.Service.Name != "" -%}
      {{ "\n" }}{{ BackendNameIngress(ingress, path) }} 1
              {%- break -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-auth-method-510-haproxy-ingress-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
      group: map-auth-method-ingress
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {#- Explicit auth-method takes precedence over the oauth desugaring. -#}
        {%- var authMethod = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-method"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authMethod == "" -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} HEAD
        {%- end -%}
      {%- end -%}

  map-auth-extract-headers-510-haproxy-ingress-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
      group: map-auth-extract-headers-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {#- Explicit auth-headers-succeed owns the extract-headers channel. -#}
        {%- var authHeadersSucceed = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-succeed"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authHeadersSucceed == "" -%}
          {%- var headers = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth-headers"] -%}
          {%- if headers == "" -%}{%- headers = "X-Auth-Request-Email" -%}{%- end -%}
          {#- The companion set-pass-headers snippet validates only the header NAME
              (before ':'); the source part after ':' reaches the map verbatim, so a
              control char here would inject a map entry — guard the whole value. -#}
          {%- var headersInj = ConfigInjectionKind(headers, "line") -%}
          {%- if headersInj != "" -%}{{- WebhookRejectOrWarn(ingress, "InvalidOAuthHeaders", "Ingress " + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + " annotation 'haproxy-ingress.github.io/oauth-headers' contains " + headersInj + ", which would inject an entry into the auth-extract-headers map; the OAuth headers are not applied. Remove control characters from the value.") -}}{%- continue -%}{%- end -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} {{ headers }}
        {%- end -%}
      {%- end -%}

  frontend-spoe-set-pass-headers-510-haproxy-ingress-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/oauth']"]
      group: frontend-spoe-pass-headers-ingress
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {#- Forward the oauth-headers (default X-Auth-Request-Email) from the
          oauth2-proxy auth reply to the backend on success — mirrors the
          auth-headers-succeed handler (frontend-spoe-set-pass-headers-500).
          Only active for the oauth desugaring (auth-url absent). -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-url"] -%}
        {#- Explicit auth-headers-succeed owns the set-header channel (its -500-
            snippet would otherwise emit a duplicate set-header line). -#}
        {%- var authHeadersSucceed = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-succeed"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authHeadersSucceed == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var ingressName = ingress.Metadata.Name -%}
          {%- var headers = ingress.Metadata.Annotations["haproxy-ingress.github.io/oauth-headers"] -%}
          {%- if headers == "" -%}{%- headers = "X-Auth-Request-Email" -%}{%- end -%}
          {%- for _, h := range split(headers, ",") -%}
            {%- var htok = h | strip() -%}
            {#- oauth-headers items may be <header>[:<source>]; key the var on the header name. -#}
            {%- var name = htok -%}
            {%- if index(htok, ":") > 0 -%}{%- name = htok[:index(htok, ":")] | strip() -%}{%- end -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "haproxy-ingress.github.io/oauth-headers", ns, ingressName) -}}
              {%- var varName = replace(toLower(name), "-", "_") -%}
              {{- shared.Unique("frontend-spoe-pass-headers-ingress", varName,
                "\n      http-request del-header " + name + " if { var(txn.auth_url) -m found }" +
                "\n      http-request set-header " + name + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.hub.external_auth." + varName + ") -m found } { var(txn.hub.external_auth.allowed) -m bool }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth request-headers allowlist. Per-ingress comma-separated
  # list of request header names the SPOA hub forwards to the auth
  # service, populated from the haproxy-ingress.github.io/auth-headers-request
  # annotation. Threads into the SPOE check-auth message's
  # `forward_headers` arg (plugin v0.3.0+); empty value = plugin falls
  # back to its plugin-level forward_headers list.
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-headers-request
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-headers-request: "X-Tenant-Id, X-Request-Id"
  #
  # Header names are stored as listed, minus names containing `_`; the
  # plugin compares them case-insensitively. The companion snippet
  # `spoe-message-check-auth-extra-args-500-haproxy-ingress` auto-extends
  # the SPOE check-auth message body so it captures every header listed
  # across the union of `auth-headers-request` annotations — operators
  # don't have to edit `spoe-message-check-auth-body` themselves to
  # forward custom headers.
  map-auth-forward-headers-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-headers-request']"]
      group: map-auth-forward-headers-ingress
    template: |-
      {#- Header names are fail-closed by ValidateAuthHeaderName in the co-rendered spoe-message-check-auth-extra-args-500 snippet (rejects whitespace/control/fetch syntax). -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-request"] -%}
        {%- if authHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var forwarded = []string{} -%}
          {%- for _, h := range split(authHeaders, ",") -%}
            {%- var hn = h | strip() -%}
            {#- The plugin matches X_Api_Key to X-Api-Key; spoe-message-check-auth-extra-args-500 warns about it. -#}
            {%- if hn != "" && !regex_search(hn, "_") -%}{%- forwarded = append(forwarded, hn) -%}{%- end -%}
          {%- end -%}
          {%- if len(forwarded) > 0 -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ join(forwarded, ", ") }}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Auto-extends the SPOE check-auth message body's `args=` line with
  # additional `hdr_<name>=req.hdr(<Name>)` captures based on the union
  # of `auth-headers-request` annotations across all ingresses. The
  # spoe-hub library's spoe-message-check-auth-body template hardcodes
  # the six standard auth headers (Authorization, Cookie,
  # X-Forwarded-{For,Proto,Host,Uri}); this contribution adds anything
  # else operators ask for via the annotation, deduped per header
  # (multiple ingresses listing the same header → one capture). The
  # plugin's per-route `forward_headers` SPOE arg then narrows which of
  # the captured headers actually flow to the auth service.
  #
  # Output format: a sequence of ` hdr_<argname>=req.hdr(<Name>)`
  # tokens with a leading space, on the same line as the existing
  # `args=` directive. Whitespace control on every block boundary
  # ensures no newlines leak in (a stray newline would terminate the
  # SPOE `args` directive at parse time).
  spoe-message-check-auth-extra-args-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-headers-request']"]
      group: spoe-auth-extra-args-ingress
      effects: [recordEvent]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName, RejectUnderscoreAuthHeader -%}
      {#- Exclude the six args spoa-hub already emits; HAProxy 3.0 rejects duplicates. -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-request"] -%}
        {%- if authHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var ingressName = ingress.Metadata.Name -%}
          {%- for _, h := range split(authHeaders, ",") -%}
            {%- var name = h | strip() -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "haproxy-ingress.github.io/auth-headers-request", ns, ingressName) -}}
              {%- if regex_search(name, "_") -%}
                {{- RejectUnderscoreAuthHeader(ingress, name, "haproxy-ingress.github.io/auth-headers-request", ns, ingressName) -}}
                {%- continue -%}
              {%- end -%}
              {# Dedupe on argName: `X-Foo` and `x-foo` share one SPOE arg, and a repeated arg name is malformed SPOE. #}
              {%- var argName = replace(toLower(name), "-", "_") -%}
              {%- if argName != "authorization" && argName != "cookie" &&
                argName != "x_forwarded_for" && argName != "x_forwarded_proto" &&
                argName != "x_forwarded_host" && argName != "x_forwarded_uri" -%}
                {{- shared.Unique("spoe-auth-extra-args-ingress", argName, " hdr_" + argName + "=req.hdr(" + name + ")") -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth response-headers allowlist (success path). Lands in
  # auth-extract-headers.map as the union of pass + fail headers per
  # ingress. The frontend-spoe-set-pass-headers-* glob below emits one
  # `http-request set-header` per unique pass header, gated on
  # `allowed -m bool` and `var ... -m found`.
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-headers-succeed
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-headers-succeed: "X-Auth-User, X-Auth-Roles"
  #
  # The companion annotation `auth-headers-fail` (failure path) shares
  # the same auth-extract-headers.map — the plugin extracts the union
  # so each var is available for whichever path runs.
  map-auth-extract-headers-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-ingress.github.io/auth-headers-succeed']"
        - "metadata.annotations['haproxy-ingress.github.io/auth-headers-fail']"
      group: map-auth-extract-headers-ingress
    template: |-
      {#- Header names are fail-closed by ValidateAuthHeaderName in the co-rendered frontend-spoe-set-pass-headers-500 / -fail-headers snippets (rejects whitespace/control/fetch syntax). -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var passHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-succeed"] -%}
        {%- var failHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-fail"] -%}
        {%- var union = passHeaders -%}
        {%- if passHeaders != "" && failHeaders != "" -%}
          {%- union = passHeaders + ", " + failHeaders -%}
        {%- else if failHeaders != "" -%}
          {%- union = failHeaders -%}
        {%- end -%}
        {%- if union != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ union }}
        {%- end -%}
      {%- end -%}

  # One `http-request set-header` per unique header across all
  # ingresses with auth-headers-succeed. Per-route gating happens
  # implicitly via the plugin's per-route extract_headers SPOE arg —
  # routes that didn't ask for a header have its txn var unset, so
  # the `var ... -m found` gate skips them.
  frontend-spoe-set-pass-headers-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-headers-succeed']"]
      group: frontend-spoe-pass-headers-ingress
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {#- The incremental result replays the same deduplicated directives in both frontends. -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var passHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-succeed"] -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var ingressName = ingress.Metadata.Name -%}
          {%- for _, h := range split(passHeaders, ",") -%}
            {%- var name = h | strip() -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "haproxy-ingress.github.io/auth-headers-succeed", ns, ingressName) -}}
              {# Dedupe on varName so spellings that differ only in
                  dashes vs underscores (e.g. `X-Foo` vs `X_Foo`,
                  both → `x_foo`) collapse to a single set-header
                  directive — the plugin produces the same txn var
                  for both, so the second directive would just
                  duplicate the first. #}
              {%- var varName = replace(toLower(name), "-", "_") -%}
              {{- shared.Unique("frontend-spoe-pass-headers-ingress", varName,
                "\n      http-request del-header " + name + " if { var(txn.auth_url) -m found }" +
                "\n      http-request set-header " + name + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.hub.external_auth." + varName + ") -m found } { var(txn.hub.external_auth.allowed) -m bool }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # External-auth fail-headers allowlist. Per-ingress comma-list of
  # response header names from the auth reply that should surface in
  # the response to the *client* on auth failure (e.g.
  # WWW-Authenticate to drive a Bearer challenge, X-Error-Reason for
  # diagnostics). Plugin v0.3.0+ extracts these on every reply path
  # (so 401 / 5xx replies populate the txn vars too).
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-headers-fail
  #
  # Annotation:
  #   haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
  #
  # The frontend-spoe-set-fail-headers-* glob emits one
  # `http-after-response set-header` per unique fail header, gated on
  # the auth path having run, !allowed, and the var being set. The
  # extract_headers SPOE arg union is built in
  # map-auth-extract-headers-500-haproxy-ingress.
  #
  # `http-after-response` (rather than the more obvious
  # `http-response`) is required because HAProxy's `http-request deny`
  # short-circuits the request flow: the deny response is generated
  # internally, so `http-response` rules — which fire only on
  # responses received from a backend — never apply to it.
  # `http-after-response` runs unconditionally on every response,
  # whether it came from a backend or HAProxy generated it via a
  # deny / errorfile / redirect, which is exactly what we need for
  # auth-headers-fail to surface in the 401 sent back to the client.
  frontend-spoe-set-fail-headers-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-headers-fail']"]
      group: frontend-spoe-fail-headers-ingress
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {#- The incremental result replays the same deduplicated directives in both frontends. -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var failHeaders = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-headers-fail"] -%}
        {%- if failHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var ingressName = ingress.Metadata.Name -%}
          {%- for _, h := range split(failHeaders, ",") -%}
            {%- var name = h | strip() -%}
            {%- if name != "" -%}
              {{- ValidateAuthHeaderName(name, "haproxy-ingress.github.io/auth-headers-fail", ns, ingressName) -}}
              {# Dedupe on varName (after dash→underscore) so
                  spellings that collapse to the same plugin txn var
                  produce one set-header directive, not two. #}
              {%- var varName = replace(toLower(name), "-", "_") -%}
              {{- shared.Unique("frontend-spoe-fail-headers-ingress", varName,
                "\n      http-after-response set-header " + name + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.hub.external_auth." + varName + ") -m found }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # WAF (Coraza, via SPOA hub): per-Ingress opt-in path-scoped WAF.
  # Populates haproxy-ingress-waf.map with one entry per `<host><path>`
  # for Ingresses carrying `haproxy-ingress.github.io/waf: "modsecurity"`.
  # The map's *value* is the resolved enforcement mode (`deny` or
  # `detect`) read from `haproxy-ingress.github.io/waf-mode` (default
  # `deny`); this lets a single map drive both the dispatch gate
  # (`if { var(txn.coraza_mode) -m found }`) and the deny-skip in detect
  # mode (`!{ var(txn.coraza_mode) -m str detect }`) — see
  # `frontend-spoe-filters-050-coraza` in spoa-hub.yaml.
  #
  # Documentation: https://haproxy-ingress.github.io/docs/configuration/keys/#modsecurity
  #
  # Annotations:
  #   haproxy-ingress.github.io/waf: "modsecurity"        (required to opt in; only "modsecurity" supported)
  #   haproxy-ingress.github.io/waf-mode: "deny"|"detect" (default "deny"; "detect" runs WAF in shadow mode)
  #
  # Validation (fail-loud at render time → admission denial):
  #   - waf set to anything other than "modsecurity"             → fail()
  #   - waf-mode set to anything other than "deny" or "detect"   → fail()
  #   - waf-mode set without waf (operator error; no-op upstream) → fail()
  #   - rule lacks a host (map key needs <host><path>)            → fail()
  #
  # Coexistence with `nginx.ingress.kubernetes.io/modsecurity-snippet`:
  # nginx-ingress's annotation appends to coraza's global directives so
  # rules apply chart-wide and dispatch is unconditional. When BOTH
  # styles are present, nginx wins for dispatch (everywhere) but this
  # map's mode lookup still gates the deny rule per-path, so a
  # `waf-mode: detect` path remains in shadow mode under nginx-driven
  # dispatch. See ADR-0007.
  util-haproxy-ingress-waf-bindings:
    template: |-
      {%- import "util-waf-governance" for WafGovernance -%}
      {%- var corazaEnabled = false -%}
      {%- for _, plugin := range extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() -%}
        {%- if tostring(plugin | dig("name")) == "coraza" -%}{%- corazaEnabled = true -%}{%- end -%}
      {%- end -%}
      {%- var governance = map[string]any{} -%}
      {%- var _ = WafGovernance(governance) -%}
      {{- toJSON(map[string]any{"ingresses": map[string]any{
        "corazaEnabled": corazaEnabled,
        "allowEnforcementOverride": governance["allowEnforcementOverride"],
      }}) -}}

  # Validates one Ingress's WAF annotations and returns its map mode ("" when
  # waf is unset). features-960 calls it too, because the map only renders when
  # the spoa-hub library loads; 960 sorts after the features-950 family guard.
  util-haproxy-ingress-waf-mode:
    template: |-
      {%- macro HaproxyIngressWafMode(ingress *resources.ingresses.T, corazaEnabled bool, allowEnforcementOverride bool) string -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var waf = ingress.Metadata.Annotations["haproxy-ingress.github.io/waf"] -%}
        {%- var mode = ingress.Metadata.Annotations["haproxy-ingress.github.io/waf-mode"] -%}
        {#- waf-mode without waf is a no-op upstream; loud here per the
            chart-wide fail-loud convention so operators don't silently
            drop into shadow mode. -#}
        {%- if waf == "" && mode != "" -%}
          {{- fail("Ingress " + key + " sets 'haproxy-ingress.github.io/waf-mode' but not 'haproxy-ingress.github.io/waf'. waf-mode is meaningful only when waf is also set; remove waf-mode or add 'haproxy-ingress.github.io/waf: modsecurity'.") -}}
        {%- end -%}
        {%- if mode != "" && !allowEnforcementOverride -%}
          {{- fail("Ingress " + key + " sets 'haproxy-ingress.github.io/waf-mode', but the HAPTIC administrator disabled Ingress enforcement overrides with extraContext.waf.ingressPermissions.allowEnforcementOverride=false.") -}}
        {%- end -%}
        {%- var resolvedMode = "" -%}
        {%- if waf != "" -%}
          {%- if !corazaEnabled -%}
            {{- fail("Ingress " + key + " sets annotation 'haproxy-ingress.github.io/waf' but the spoaHub coraza plugin is not enabled, so its traffic can't be inspected. Enable spoaHub.plugins.coraza and leave spoaHub.enabled unset or true, or remove the annotation.") -}}
          {%- end -%}
          {%- if waf != "modsecurity" -%}
            {{- fail("Invalid value '" + waf + "' for annotation 'haproxy-ingress.github.io/waf' on Ingress '" + key + "'. Only 'modsecurity' is supported.") -}}
          {%- end -%}
          {%- resolvedMode = mode -%}
          {%- if resolvedMode == "" -%}{%- resolvedMode = "deny" -%}{%- end -%}
          {%- if resolvedMode != "deny" && resolvedMode != "detect" -%}
            {{- fail("Invalid value '" + mode + "' for annotation 'haproxy-ingress.github.io/waf-mode' on Ingress '" + key + "'. Valid values: 'deny', 'detect'.") -}}
          {%- end -%}
        {%- end -%}
        {%- show resolvedMode -%}
      {%- end macro -%}

  map-haproxy-ingress-waf-500-haproxy-ingress:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- render "util-haproxy-ingress-waf-bindings" -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-ingress.github.io/waf']"
        - "metadata.annotations['haproxy-ingress.github.io/waf-mode']"
    template: |-
      {%- import "util-haproxy-ingress-waf-mode" for HaproxyIngressWafMode -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var mode = HaproxyIngressWafMode(ingress, props["corazaEnabled"].(bool), props["allowEnforcementOverride"].(bool)) -%}
        {%- if mode != "" -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} {{ mode }}
        {%- end -%}
      {%- end -%}

  features-960-haproxy-ingress-waf-validation:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- render "util-haproxy-ingress-waf-bindings" -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-ingress.github.io/waf']"
        - "metadata.annotations['haproxy-ingress.github.io/waf-mode']"
    template: |-
      {%- import "util-haproxy-ingress-waf-mode" for HaproxyIngressWafMode -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var _ = HaproxyIngressWafMode(ingress, props["corazaEnabled"].(bool), props["allowEnforcementOverride"].(bool)) -%}
      {%- end -%}

  # Resolves one Ingress's basic auth. result["lane"] is "" (no auth-secret),
  # "map" (state "ok" with userlist and realm, or "missing") or "backend" (a
  # realm that needs escaping or carries a control character).
  util-haproxy-ingress-basic-auth-route:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- macro HaproxyIngressBasicAuthRoute(ingress *resources.ingresses.T, result map[string]any) -%}
        {%- result["lane"] = "" -%}
        {%- var authSecret = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-secret"] -%}
        {%- if authSecret != "" -%}
          {%- var authRealm = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-realm"] -%}
          {%- if authRealm == "" -%}{%- authRealm = "Restricted" -%}{%- end -%}
          {%- var secretNs = ingress.Metadata.Namespace -%}
          {%- var secretName = authSecret -%}
          {%- if strings_contains(authSecret, "/") -%}
            {%- var parts = split(authSecret, "/") -%}
            {%- secretNs = parts[0] -%}
            {%- secretName = parts[1] -%}
          {%- end -%}
          {%- result["userlist"] = "hi_auth_" + secretNs + "_" + secretName -%}
          {%- result["realm"] = authRealm -%}
          {%- result["realmInjection"] = ConfigInjectionKind(authRealm, "line") -%}
          {%- if resources.secrets.GetSingle(secretNs, secretName) == nil -%}
            {%- result["lane"] = "map" -%}
            {%- result["state"] = "missing" -%}
          {%- else -%}
            {%- result["lane"] = "backend" -%}
            {#- The realm is a literal in a quoted config token and in a map
                value: one that needs escaping stays on the backend rule. -#}
            {%- if result["realmInjection"] == "" && regex_search(authRealm, "^[^\"\\\\$\\t]*$") && authRealm == strip(authRealm) -%}
              {%- result["lane"] = "map" -%}
              {%- result["state"] = "ok" -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  backend-directives-680-haproxy-ingress-auth:
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- import "util-haproxy-ingress-basic-auth-route" for HaproxyIngressBasicAuthRoute -%}
      {#-
        haproxy-ingress Basic Auth, backend lane.
        Annotations:
          - haproxy-ingress.github.io/auth-secret: "<ns/name>" or "<name>" (required)
          - haproxy-ingress.github.io/auth-realm: "<realm>" (optional, default: "Restricted")
        A realm that needs escaping keeps the challenge here, which makes the
        backend structural, and a control character in the realm fails closed;
        every other route rides the frontend map lane
        (frontend-filters-900-haproxy-ingress-basic-auth).
      -#}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var rw = map[string]any{} %}
        {{- HaproxyIngressBasicAuthRoute(ingress, rw) -}}
        {%- if rw["lane"] == "backend" %}
          {%- if rw["realmInjection"] != "" %}
            {#- auth-realm is a double-quoted literal; EscapeDquoteValue neutralises
                quotes/$, but a control character can't live in the string, so fail
                closed (auth = security) rather than emit a splittable directive. -#}
            {{- WebhookRejectOrWarn(ingress, "InvalidAuthRealm", "Ingress " + key + " annotation 'haproxy-ingress.github.io/auth-realm' contains " + tostring(rw["realmInjection"]) + "; basic auth cannot be applied, so this route fails closed with 503. Remove control characters from the value.") -}}
      # WARNING haproxy-ingress/auth-realm: invalid value for {{ key }}; failing closed (503).
      http-request set-var(txn.denied_by) str(basic_auth_unavailable)
      http-request deny deny_status 503
          {%- else %}
      # haproxy-ingress/backend-directives-auth ({{ key }}): the realm needs escaping, so it stays a backend rule
      http-request set-var(txn.denied_by) str(basic_auth) unless { http_auth({{ rw["userlist"] }}) }
      http-request auth realm "{{ EscapeDquoteValue(tostring(rw["realm"])) }}" unless { http_auth({{ rw["userlist"] }}) }
          {%- end %}
        {%- end %}
      {%- end -%}

  # Rows, userlists and (userlist, realm) pairs for the map lane; also the
  # fail-closed event. A component cannot both publish and emit text, hence
  # the split from the backend snippet.
  features-680-haproxy-ingress-basic-auth-routes:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-ingress.github.io/auth-secret']"
        - "metadata.annotations['haproxy-ingress.github.io/auth-realm']"
      group: haproxy-ingress-basic-auth-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haproxy-ingress-basic-auth-route" for HaproxyIngressBasicAuthRoute -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var rw = map[string]any{} -%}
        {{- HaproxyIngressBasicAuthRoute(ingress, rw) -}}
        {%- if rw["lane"] == "map" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {{- shared.Publish("any", "any", "any") -}}
          {%- if rw["state"] == "ok" -%}
            {%- var pair = tostring(rw["userlist"]) + " " + tostring(rw["realm"]) -%}
            {{- shared.Publish("row", key, key + " ok " + pair) -}}
            {{- shared.Publish("userlist", tostring(rw["userlist"]), tostring(rw["userlist"])) -}}
            {{- shared.Publish("pair", pair, pair) -}}
          {%- else -%}
            {{- shared.Publish("row", key, key + " missing") -}}
            {{- recordEvent(ingress, "AuthSecretMissing", "Ingress " + key + " sets 'haproxy-ingress.github.io/auth-secret', but that Secret could not be resolved. Basic auth cannot be enforced without it, so this route fails closed with 503. Create the Secret, or remove the auth annotations.") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Basic-auth challenge, map lane: one block per HTTP frontend at band 900,
  # the last request-phase band, where the backend rule used to run.
  frontend-filters-900-haproxy-ingress-basic-auth:
    requires: [ingresses]
    template: |
      {#
        haproxy-ingress-basic-auth-routes.map: "<ns>/<name>" → "ok <userlist> <realm>" | "missing",
        built from the rows features-*-haproxy-ingress-basic-auth-routes publishes. `auth
        realm` and http_auth() take literals only, so there is one rule per
        distinct (userlist, realm) pair, selected by comparing the whole map
        value; a route whose Secret is absent is denied 503. Emitted only while
        a route uses the lane; the first one reloads once, as does removing the
        last or adding a pair.
      #}
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haproxy-ingress-basic-auth-routes", "any") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("haproxyIngressBasicAuthMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("haproxy-ingress-basic-auth-routes", "row") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haproxy-ingress-basic-auth-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
        var userlists = []any{}
        for _, v := range incremental_values("haproxy-ingress-basic-auth-routes", "userlist") {
          userlists = append(userlists, tostring(v))
        }
        var pairs = []any{}
        for _, v := range incremental_values("haproxy-ingress-basic-auth-routes", "pair") {
          pairs = append(pairs, tostring(v))
        }
      %%}
      # haproxy-ingress/basic-auth
      http-request set-var(txn.hi_ba) var(txn.resource_key),map({{ routes }})
      http-request set-var(txn.denied_by) str(basic_auth_unavailable) if { var(txn.hi_ba) -m str missing }
      http-request deny deny_status 503 if { var(txn.hi_ba) -m str missing }
      {%- for _, u := range sort_strings(userlists) %}
      http-request set-var(txn.denied_by) str(basic_auth) if { var(txn.hi_ba) -m beg "ok {{ u }} " } !{ http_auth({{ u }}) }
      {%- end %}
      {%- for _, p := range sort_strings(pairs) %}
      {%- var pair = strings_splitn(tostring(p), " ", 2) %}
      http-request auth realm "{{ pair[1] }}" if { var(txn.hi_ba) -m str "ok {{ p }}" } !{ http_auth({{ pair[0] }}) }
      {%- end %}
      {%- end %}
