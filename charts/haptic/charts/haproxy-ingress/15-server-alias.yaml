# haproxy-ingress library — server-alias / server-alias-regex contributions.
#
# These annotations make extra hostnames route to the SAME backends as the
# Ingress's primary host. The chart's routing keys every path-map entry on the
# normalised host key (`txn.host_match`, produced by host.map /
# host-alias-regex.map lookups), so an alias only needs to resolve to the SAME
# host key as the primary host — then every existing path-map entry for that
# host applies to the alias unchanged. No backend duplication, no path-map
# duplication. A host another Ingress claimed first wins (ingress-host-claims).
#
#   server-alias:       comma-separated list of extra EXACT hostnames.
#                       → host.map entry  `<alias> <primary-host-key>`
#   server-alias-regex: a regular expression matching extra hostnames.
#                       → host-alias-regex.map entry  `^(?:<regex>)$ <primary-host-key>`
#
# Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#server-alias
templateSnippets:
  features-912-haproxy-ingress-host-alias-claims:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - metadata.annotations['haproxy-ingress.github.io/server-alias']
        - metadata.annotations['haproxy-ingress.github.io/server-alias-regex']
      group: ingress-host-claims
      effects: [publishValue]
    template: |-
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostClaimRank, HostAliases, HostAliasProblem, HostAliasRegexKey -%}
      {%- import "util-regex-map-key" for RegexGroupProblem -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%%
        var exactAnnotation = "haproxy-ingress.github.io/server-alias"
        var regexAnnotation = "haproxy-ingress.github.io/server-alias-regex"
        var id = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        if primaryKey != "" {
          var seen = map[string]bool{}
          for _, alias := range HostAliases(dig_string(item, "", "metadata", "annotations", exactAnnotation), "") {
            var aliasKey = tostring(MapKeyForHost(toLower(alias)))
            if HostAliasProblem(alias) != "" || aliasKey == primaryKey || seen[aliasKey] { continue }
            seen[aliasKey] = true
            show shared.PublishRanked("hosts", aliasKey, HostClaimRank(item, exactAnnotation),
              map[string]any{"owner": id, "target": primaryKey, "annotation": exactAnnotation})
          }
          var regex = strip(dig_string(item, "", "metadata", "annotations", regexAnnotation))
          if regex != "" && ConfigInjectionKind(regex, "mapkey") == "" && RegexGroupProblem(regex) == "" {
            show shared.PublishRanked("regexes", HostAliasRegexKey(regex), HostClaimRank(item, regexAnnotation),
              map[string]any{"owner": id, "target": primaryKey, "annotation": regexAnnotation})
          }
        }
      %%}

  map-host-650-haproxy-ingress-alias:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/server-alias']"]
      consumes: [ingress-host-claims]
      effects: [recordEvent]
    template: |-
      {#
        server-alias → host.map entries.

        For each Ingress carrying haproxy-ingress.github.io/server-alias, emit
        one host.map entry per listed hostname, all pointing at the primary
        host's normalised key. The primary host key is MapKeyForHost(rule.Host)
        — the SAME normalisation map-host-500-ingress uses for the primary
        entry, so the alias lands on identical downstream path-map lookups.

        Aliases attach to the FIRST rule's host (haproxy-ingress's model: the
        alias is an Ingress-level alternative name for the resource's host).

        Extension Point: map-host-* (priority 650 - compatibility layer)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostAliases, HostAliasProblem, HostClaimEmits, HostClaimConflict, HostAliasConflictMessage -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var annotation = "haproxy-ingress.github.io/server-alias"
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var id = namespace + "/" + name
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        if primaryKey != "" {
          var block = ""
          var seen = map[string]bool{}
          for _, alias := range HostAliases(dig_string(item, "", "metadata", "annotations", annotation), "") {
            var aliasInj = ConfigInjectionKind(alias, "mapkey")
            if aliasInj != "" {
              _ = WebhookRejectOrWarn(item, "InvalidServerAlias", WebhookOutcomeMessage(
                "Ingress " + id + " annotation '" + annotation + "' value contains " + aliasInj + ", which would split the host map",
                "the Ingress is rejected", "the alias is not applied", "Remove whitespace and control characters from the value."))
              continue
            }
            var problem = HostAliasProblem(alias)
            if problem != "" {
              _ = WebhookRejectOrWarn(item, "InvalidServerAlias", WebhookOutcomeMessage(
                "Ingress " + id + " annotation '" + annotation + "' alias '" + alias + "' " + problem,
                "the Ingress is rejected", "the alias isn't routed", "Use a hostname such as www.example.com or *.example.com."))
              continue
            }
            var aliasKey = tostring(MapKeyForHost(toLower(alias)))
            if aliasKey == primaryKey || seen[aliasKey] { continue }
            seen[aliasKey] = true
            var winner, found = shared.Select("ingress-host-claims", "hosts", aliasKey)
            if HostClaimEmits(winner, found, id, annotation) {
              block += "\n" + aliasKey + " " + primaryKey
            } else if HostClaimConflict(winner, found, id, primaryKey) {
              recordEvent(item, "RouteConflict", HostAliasConflictMessage(annotation, alias, dig_string(winner, "", "owner")))
            }
          }
          if block != "" {
            show shared.Unique("haproxy-ingress-map-host-alias", "header", "\n# haproxy-ingress/map-host-alias\n")
            show shared.Unique("haproxy-ingress-map-host-alias", "resource/" + id,
              "# Ingress: " + id + " server-alias" + block + "\n")
          }
        }
      %%}

  map-hostaliasregex-650-haproxy-ingress-alias:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/server-alias-regex']"]
      consumes: [ingress-host-claims]
      effects: [recordEvent]
    template: |-
      {#
        server-alias-regex → host-alias-regex.map entries.

        The annotation value is a regular expression matched against the whole
        hostname: it is written as ^(?:<regex>)$, and RegexGroupProblem rejects
        anything that could close that group early. base.yaml's routing cascade
        consults host-alias-regex.map last, so one entry routes every matching
        hostname that no exact, wildcard or host-regex.map entry claimed.

        Extension Point: map-hostaliasregex-* (priority 650 - compatibility layer)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostAliasRegexKey, HostClaimEmits, HostClaimConflict, HostAliasConflictMessage -%}
      {%- import "util-regex-map-key" for RegexGroupProblem -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var annotation = "haproxy-ingress.github.io/server-alias-regex"
        var id = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        var regexTrimmed = strip(dig_string(item, "", "metadata", "annotations", annotation))
        if primaryKey != "" && regexTrimmed != "" {
          var regexInj = ConfigInjectionKind(regexTrimmed, "mapkey")
          var problem = RegexGroupProblem(regexTrimmed)
          if regexInj != "" {
            _ = WebhookRejectOrWarn(item, "InvalidServerAliasRegex", WebhookOutcomeMessage(
              "Ingress " + id + " annotation '" + annotation + "' value contains " + regexInj + ", which would split the host-alias-regex map",
              "the Ingress is rejected", "the alias regex is not applied", "Remove whitespace and control characters from the value."))
          } else if problem != "" {
            _ = WebhookRejectOrWarn(item, "InvalidServerAliasRegex", WebhookOutcomeMessage(
              "Ingress " + id + " annotation '" + annotation + "' regex '" + regexTrimmed + "' " + problem,
              "the Ingress is rejected", "the alias regex isn't routed", "Rewrite it so its groups and [ ] classes close within it, without \\Q, \\E, \\c or (*."))
          } else {
            var key = HostAliasRegexKey(regexTrimmed)
            var winner, found = shared.Select("ingress-host-claims", "regexes", key)
            if HostClaimEmits(winner, found, id, annotation) {
              show shared.Unique("haproxy-ingress-map-hostregex-alias", "header", "\n# haproxy-ingress/map-hostregex-alias\n")
              show shared.Unique("haproxy-ingress-map-hostregex-alias", "resource/" + id,
                "# Ingress: " + id + " server-alias-regex\n" + key + " " + primaryKey + "\n")
            } else if HostClaimConflict(winner, found, id, primaryKey) {
              recordEvent(item, "RouteConflict", HostAliasConflictMessage(annotation, regexTrimmed, dig_string(winner, "", "owner")))
            }
          }
        }
      %%}
