# haproxy-ingress library — feature registration + passthrough backends.
templateSnippets:
  features-104-haproxy-ingress-ssl-redirect-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/ssl-redirect']"]
      group: haproxy-ingress-ssl-redirect-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-ingress.github.io/ssl-redirect"] == "true" -%}
        {%- var code = ingress.Metadata.Annotations["haproxy-ingress.github.io/ssl-redirect-code"] -%}
        {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
        {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
          {%- code = "302" -%}
        {%- end -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
          {%- if rule.Host != "" -%}
            {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
              "host": toLower(rule.Host), "code": code,
            }) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-105-haproxy-ingress-ssl-redirect:
    requires: [ingresses]
    template: |
      {#
        HAProxy-Ingress SSL redirect — host registration into the shared map.

        Annotations:
          - haproxy-ingress.github.io/ssl-redirect: "true|false"
          - haproxy-ingress.github.io/ssl-redirect-code: "301|302|303|307|308" (default 302)

        Registers redirected hosts into gf["sslRedirectHosts"] in the features phase
        (before features-160-ssl-redirect-map). ssl.yaml then builds ssl-redirect-<code>.map
        and emits the shared `http-request redirect scheme https` rule. Replaces the
        per-ingress inline-ACL redirect, so adding/removing a redirected host is a
        map-only, reload-free update — matching the haproxytech ssl-redirect path.
      #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("haproxy-ingress-ssl-redirect-hosts", "hosts") %}
        {%- var redirectHosts []any = gf["sslRedirectHosts"] -%}
        {%- gf["sslRedirectHosts"] = append(redirectHosts, entry) -%}
      {%- end -%}

  features-110-haproxy-ingress-mtls:
    requires: [ingresses]
    template: |-
      {%- for _, warning := range incremental_values("mtls-host-policies", "warnings-haproxy-ingress") -%}
        {{- tostring(warning) -}}
      {%- end -%}
      {{- render "mtls-host-policies-100-haproxy-ingress" -}}

  mtls-host-policies-100-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-tls-secret']"]
      group: mtls-host-policies
      effects: [publishValue]
    template: |-
      {#
        HAProxy-Ingress Client-Cert Verification Registration

        Annotations:
          - haproxy-ingress.github.io/auth-tls-secret: "<name>" or "<ns>/<name>"
            (kubernetes.io/tls Secret with `ca.crt` containing the CA bundle
            that signed the clients' certificates)
          - haproxy-ingress.github.io/auth-tls-verify-client: "on" | "off" |
            "optional" | "optional_no_ca" (default: "on")

        Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#auth-tls-secret

        Mirrors features-110-nginx-ingress-mtls — same Secret format,
        same verify-client value mapping, same emission into
        `gf["clientCertVerifyHosts"]`. ssl.yaml's
        features-150-ssl-crtlist owns the actual `[ca-file ... verify ...]`
        crt-list line emission, so both ingress libraries can stack on
        the same SNI-keyed map without coordinating.

        haproxy-ingress's `auth-tls-strict` (when false, accepts unverified
        connections and relies on backend header inspection) overlaps with
        `auth-tls-verify-client: optional` and is intentionally not wired
        as a separate axis — operators wanting "soft" verification should
        use `auth-tls-verify-client: optional` directly.
      #}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var secretRef = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-tls-secret"] %}
        {%- if secretRef != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var verifyClient = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-tls-verify-client"] | toLower() %}
          {%- if verifyClient == "" %}{%- verifyClient = "on" %}{%- end %}
          {%- if verifyClient != "off" %}
          {%- var verifyMode = "" %}
          {%- if verifyClient == "on" %}
            {%- verifyMode = "required" %}
          {%- else if verifyClient == "optional" || verifyClient == "optional_no_ca" %}
            {%- verifyMode = "optional" %}
          {%- else %}
            {{- fail("Ingress " + ns + "/" + name + " has haproxy-ingress.github.io/auth-tls-verify-client=" + verifyClient + " which is not one of 'on', 'off', 'optional', 'optional_no_ca'.") -}}
          {%- end %}

          {%- var secretNs = ns %}
          {%- var secretName = secretRef %}
          {%- if strings_contains(secretRef, "/") %}
            {%- var parts = split(secretRef, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var secret = resources.secrets.GetSingle(secretNs, secretName) %}
          {%- if secret == nil -%}
            {#- Secret missing — emit a render comment and skip mTLS for
                this ingress instead of failing the entire render. The
                latter form (fail()) blocks every ingress's admission,
                because the webhook re-renders the merged config of the
                whole cluster on every CREATE. With skip-and-continue,
                the missing secret is logged at render time, this one
                ingress's mTLS isn't applied (the backend behaves as if
                the annotation were absent), and unrelated ingresses
                continue to render. The webhook still rejects an
                ingress whose OWN secret is missing — it just doesn't
                cascade. -#}
            {{- shared.Publish("warnings-haproxy-ingress", "haproxy-ingress/" + ns + "/" + name + "/0",
              "\n            # WARNING haproxy-ingress.github.io/auth-tls-secret: Secret referenced on Ingress " + ns + "/" + name + " not found at render time; skipping mTLS for this ingress.") -}}
          {%- else -%}
            {%- var caBundleB64 = secret.Data["ca.crt"] %}
            {%- if caBundleB64 == "" -%}
            {{- shared.Publish("warnings-haproxy-ingress", "haproxy-ingress/" + ns + "/" + name + "/0",
              "\n            # WARNING haproxy-ingress.github.io/auth-tls-secret: Secret referenced on Ingress " + ns + "/" + name + " is missing data.ca.crt; skipping mTLS for this ingress.") -}}
            {%- else -%}
            {%- var caBundle = caBundleB64 | b64decode() | tostring() %}
          {#- Register the CA bundle as a "file" (general/) not "cert" (ssl/).
              HAProxy's runtime cert API takes ssl/ entries as
              cert+key bundles ("file should contain both certificate and
              private key" / 500), but a CA bundle has no private key. The
              same library uses "file" for the upstream-side
              secure-verify-ca-secret CA at line 562 — keep parity. HAProxy's
              `crt-list` `[ca-file <path>]` accepts any path, so general/
              works fine. -#}
          {%- var caFilename = secretNs + "-" + secretName + "-client-ca.pem" %}
          {{- shared.Publish("files", "haproxy-ingress/" + ns + "/" + name + "/0",
            map[string]any{"filename": caFilename, "content": caBundle}) -}}

          {%- for ruleIndex, rule := range ingress.Spec.Rules %}
            {%- var host = rule.Host %}
            {%- if host == "" %}
              {{- fail("Ingress " + ns + "/" + name + " has haproxy-ingress.github.io/auth-tls-secret set but a rule without a host. Client-cert verification is keyed by SNI / host; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end %}
            {{- shared.Publish("verifyHosts", "haproxy-ingress/" + ns + "/" + name + "/" + tostring(ruleIndex), map[string]any{
              "host": host, "route": ns + "/" + name, "filename": caFilename, "verifyMode": verifyMode,
            }) -}}
          {%- end %}
            {%- end %}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  features-134-haproxy-ingress-redirect-to-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/redirect-to']"]
      group: haproxy-ingress-redirect-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var redirectTo = ingress.Metadata.Annotations["haproxy-ingress.github.io/redirect-to"] -%}
        {%- if redirectTo != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if regex_search(redirectTo, "[[:cntrl:]]") -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy-ingress.github.io/redirect-to' on Ingress '" + key + "': must not contain control characters — config-injection guard.") -}}
          {%- else -%}
            {%- var code = ingress.Metadata.Annotations["haproxy-ingress.github.io/redirect-to-code"] -%}
            {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
            {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
              {%- code = "302" -%}
            {%- end -%}
            {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
              {%- if rule.Host != "" -%}
                {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                  "host": toLower(rule.Host), "location": redirectTo, "code": code,
                }) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-135-haproxy-ingress-redirect-to:
    requires: [ingresses]
    template: |
      {#
        HAProxy-Ingress redirect-to — host registration into the shared host-keyed
        redirect map. base.yaml's frontend-filters-060-redirect-location emits the
        rule from redirect-loc-<code>.map, so adding/removing a host redirect is a
        map-only, reload-free update (replaces the per-ingress inline-ACL redirect).

        Annotations:
          - haproxy-ingress.github.io/redirect-to: "<url>"
          - haproxy-ingress.github.io/redirect-to-code: "301|302|303|307|308" (default 302)
      #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("haproxy-ingress-redirect-hosts", "hosts") %}
        {%- var rh []any = coalesce(gf["redirectHosts"], []any{}) -%}
        {%- gf["redirectHosts"] = append(rh, entry) -%}
      {%- end -%}

  features-155-haproxy-ingress-hsts:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/hsts']"]
      group: hsts-hosts
      effects: [publishValue]
    template: |
      {#
        haproxy-ingress HSTS — registers host→Strict-Transport-Security value into the
        shared gf["hstsHosts"]; base.yaml features-190-hsts-map builds hsts.map and
        frontend-filters-080-hsts emits the single shared response-header rule
        (map-only, reload-free). Annotations: hsts / hsts-max-age /
        hsts-include-subdomains / hsts-preload.
      #}
      {%- import "util-register-annotation-hsts" for RegisterAnnotationHSTS -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{ RegisterAnnotationHSTS(ingress,
            "haproxy-ingress.github.io/hsts",
            "haproxy-ingress.github.io/hsts-max-age",
            "haproxy-ingress.github.io/hsts-include-subdomains",
            "haproxy-ingress.github.io/hsts-preload",
            "15768000") }}
      {%- end -%}

  features-144-haproxy-ingress-app-root-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/app-root']"]
      group: haproxy-ingress-app-root-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var appRoot = ingress.Metadata.Annotations["haproxy-ingress.github.io/app-root"] -%}
        {%- if appRoot != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if regex_search(appRoot, "[[:cntrl:]]") -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy-ingress.github.io/app-root' on Ingress '" + key + "': must not contain control characters — config-injection guard.") -}}
          {%- else -%}
            {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
              {%- if rule.Host != "" -%}
                {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                  "host": toLower(rule.Host), "path": appRoot,
                }) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-145-haproxy-ingress-app-root:
    requires: [ingresses]
    template: |
      {#
        haproxy-ingress app-root — registers host→path into the shared
        gf["appRootHosts"]. base.yaml features-175-app-root-map builds app-root.map
        and frontend-filters-065-app-root emits the gated rule, so changing an
        app-root is a map-only, reload-free update (replaces the inline-ACL redirect).
        Annotation: haproxy-ingress.github.io/app-root
      #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("haproxy-ingress-app-root-hosts", "hosts") %}
        {%- var ar []any = coalesce(gf["appRootHosts"], []any{}) -%}
        {%- gf["appRootHosts"] = append(ar, entry) -%}
      {%- end -%}

  features-150-haproxy-ingress-mtls-error:
    requires: [ingresses]
    template: |-
      {{- render "mtls-host-policies-500-haproxy-ingress-error" -}}

  mtls-host-policies-500-haproxy-ingress-error:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/auth-tls-error-page']"]
      group: mtls-host-policies
      effects: [publishValue]
    template: |-
      {#
        haproxy-ingress auth-tls-error-page — registers host→error-page URL into the
        shared gf["mtlsErrorHosts"]. base.yaml features-185-mtls-error-map builds
        mtls-error.map and frontend-filters-075-mtls-error emits the
        ssl_c_verify-gated redirect (map-only, reload-free). The X-SSL-Client-* cert
        passthrough headers stay in the vendor frontend-filters-690 snippet.
        Annotation: haproxy-ingress.github.io/auth-tls-error-page
      #}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var errorPage = ingress.Metadata.Annotations["haproxy-ingress.github.io/auth-tls-error-page"] %}
        {%- if errorPage != "" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- if regex_search(errorPage, "[[:cntrl:]]") %}{{ fail("Invalid URL in annotation 'haproxy-ingress.github.io/auth-tls-error-page' on Ingress '" + key + "': must not contain control characters (newlines/tabs) — config-injection guard.") }}{%- end %}
          {%- for ruleIndex, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {{- shared.Publish("errorHosts", "haproxy-ingress/" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + "/" + tostring(ruleIndex),
                map[string]any{"host": toLower(rule.Host), "location": errorPage}) -}}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  backends-501-haproxy-ingress-ssl-passthrough:
    requires: [ingresses, services, endpoints]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/ssl-passthrough']"]
      group: ingress-ssl-passthrough
      effects: [publishValue, backendPlan]
    template: |-
      {%- import "util-annotation-ssl-passthrough-component" for RenderAnnotationSSLPassthrough -%}
      {{- RenderAnnotationSSLPassthrough(item,
        "haproxy-ingress.github.io/ssl-passthrough",
        "ssl-passthrough-hi-", "haproxy-ingress", "haproxy-ingress") -}}
