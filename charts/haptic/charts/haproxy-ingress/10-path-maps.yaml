# haproxy-ingress library — path-matching map contributions.
# Emits map-path-{regex,exact,prefix,pfxexact}-600 entries from the Ingress
# path-type annotation. Merges into the chart-wide path maps base.yaml owns.
templateSnippets:
  map-path-regex-600-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/path-type']"]
      effects: [recordEvent]
    template: |-
      {#
        HAProxy Ingress Regex Path Map Entries

        Purpose: Generates path-regex.map entries for Ingress resources with
                 haproxy-ingress.github.io/path-type: "regex" annotation.

        Extension Point: map-path-regex-* (priority 600 - compatibility layer)

        Matches: Ingress paths with:
          - pathType: ImplementationSpecific
          - Annotation: haproxy-ingress.github.io/path-type: "regex"

        Output: RegexMapKey(host, path) BACKEND:<backend_name> — the value
        has the same shape as ingress.yaml's standard renderers, so base.yaml's
        frontend-routing-logic decodes the qualifier (`field(1,:)`) and
        backend name (`field(2,:)`) from the value identically.

        Reference: https://haproxy-ingress.github.io/docs/configuration/keys/
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-regex-map-key" for RegexGroupProblem, RegexMapKey -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var pathTypeAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/path-type"]
        if pathTypeAnnotation == "regex" {
          show shared.Unique("haproxy-ingress-map-path-regex", "header", "\n# haproxy-ingress/map-path-regex-haproxy-ingress\n")
          var regexPathCount = 0
          for _, path := range ingress.Spec.Rules[*].Http.Paths {
            if path.PathType == "ImplementationSpecific" {
              regexPathCount++
            }
          }
          if regexPathCount > 0 {
            var namespace = ingress.Metadata.Namespace
            var name = ingress.Metadata.Name
            var block = "# Ingress: " + namespace + "/" + name + " (" + tostring(regexPathCount) + " regex paths)"
            for _, rule := range ingress.Spec.Rules {
              for _, path := range rule.Http.Paths {
                if path.PathType == "ImplementationSpecific" {
                  var pathInj = ConfigInjectionKind(path.Path, "mapkey")
                  if pathInj != "" {
                    _ = WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                      "Ingress " + namespace + "/" + name + " has a regex path containing " + pathInj + ", which would split the routing map",
                      "the Ingress is rejected", "the route is not applied", "Remove whitespace and control characters from spec.rules[].http.paths[].path."))
                    continue
                  }
                  var problem = RegexGroupProblem(path.Path)
                  if problem != "" {
                    _ = WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                      "Ingress " + namespace + "/" + name + " has regex path '" + path.Path + "', which " + problem,
                      "the Ingress is rejected", "the path is not routed", "Rewrite it so its groups and [ ] classes close within it, without \\Q, \\E, \\c or (*."))
                    continue
                  }
                  block += "\n" + RegexMapKey(MapKeyForHost(rule.Host), path.Path, "") + " BACKEND:" + BackendNameIngress(ingress, path)
                }
              }
            }
            show shared.Unique("haproxy-ingress-map-path-regex", "resource/" + namespace + "/" + name, block + "\n")
          }
        }
      %%}

  # ============================================================================
  # Phase 3: Path Type Matching - Exact
  # ============================================================================

  map-path-exact-600-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/path-type']"]
      effects: [recordEvent]
    template: |-
      {#
        HAProxy Ingress Exact Path Map Entries

        Purpose: Generates path-exact.map entries for Ingress resources with
                 haproxy-ingress.github.io/path-type: "exact" annotation.

        Extension Point: map-path-exact-* (priority 600 - compatibility layer)

        Matches: Ingress paths with:
          - pathType: ImplementationSpecific
          - Annotation: haproxy-ingress.github.io/path-type: "exact"

        Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#path-type
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var pathTypeAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/path-type"]
        if pathTypeAnnotation == "exact" {
          show shared.Unique("haproxy-ingress-map-path-exact", "header", "\n# haproxy-ingress/map-path-exact-haproxy-ingress\n")
          var namespace = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          var block = ""
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              if path.PathType == "ImplementationSpecific" {
                var pathInj = ConfigInjectionKind(path.Path, "mapkey")
                if pathInj != "" {
                  _ = WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                    "Ingress " + namespace + "/" + name + " has an exact path containing " + pathInj + ", which would split the routing map",
                    "the Ingress is rejected", "the route is not applied", "Remove whitespace and control characters from spec.rules[].http.paths[].path."))
                  continue
                }
                block += MapKeyForHost(rule.Host) + path.Path + " BACKEND:" + BackendNameIngress(ingress, path) + "\n"
              }
            }
          }
          if block != "" {
            show shared.Unique("haproxy-ingress-map-path-exact", "resource/" + namespace + "/" + name, block)
          }
        }
      %%}

  # ============================================================================
  # Phase 3: Path Type Matching - Prefix
  # ============================================================================

  map-path-prefix-600-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/path-type']"]
      effects: [recordEvent]
    template: |-
      {#
        HAProxy Ingress Prefix Path Map Entries

        Purpose: Generates path-prefix.map entries for Ingress resources with
                 haproxy-ingress.github.io/path-type: "prefix" annotation.

        Extension Point: map-path-prefix-* (priority 600 - compatibility layer)

        Matches: Ingress paths with:
          - pathType: ImplementationSpecific
          - Annotation: haproxy-ingress.github.io/path-type: "prefix"

        Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#path-type
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var pathTypeAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/path-type"]
        if pathTypeAnnotation == "prefix" {
          show shared.Unique("haproxy-ingress-map-path-prefix", "header", "\n# haproxy-ingress/map-path-prefix-haproxy-ingress\n")
          var namespace = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          var block = ""
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              if path.PathType == "ImplementationSpecific" {
                var pathInj = ConfigInjectionKind(path.Path, "mapkey")
                if pathInj != "" {
                  _ = WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                    "Ingress " + namespace + "/" + name + " has a prefix path containing " + pathInj + ", which would split the routing map",
                    "the Ingress is rejected", "the route is not applied", "Remove whitespace and control characters from spec.rules[].http.paths[].path."))
                  continue
                }
                var pathValue = path.Path
                if pathValue != "" && !hasSuffix(pathValue, "/") {
                  pathValue += "/"
                }
                block += MapKeyForHost(rule.Host) + pathValue + " BACKEND:" + BackendNameIngress(ingress, path) + "\n"
              }
            }
          }
          if block != "" {
            show shared.Unique("haproxy-ingress-map-path-prefix", "resource/" + namespace + "/" + name, block)
          }
        }
      %%}

  # ============================================================================
  # Phase 3: Path Type Matching - Begin (Legacy)
  # ============================================================================

  map-pfxexact-600-haproxy-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-ingress.github.io/path-type']"]
      effects: [recordEvent]
    template: |-
      {#
        HAProxy Ingress Begin Path Map Entries

        Purpose: Generates path-prefix-exact.map entries for Ingress resources with
                 haproxy-ingress.github.io/path-type: "begin" annotation.

        Extension Point: map-pfxexact-* (priority 600 - compatibility layer)

        The "begin" path type in haproxy-ingress is a legacy type that matches
        if the path begins with the specified prefix (no trailing slash normalization).

        Matches: Ingress paths with:
          - pathType: ImplementationSpecific
          - Annotation: haproxy-ingress.github.io/path-type: "begin"

        Reference: https://haproxy-ingress.github.io/docs/configuration/keys/#path-type
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var pathTypeAnnotation = ingress.Metadata.Annotations["haproxy-ingress.github.io/path-type"]
        if pathTypeAnnotation == "begin" {
          show shared.Unique("haproxy-ingress-map-pfxexact", "header", "\n# haproxy-ingress/map-pfxexact-haproxy-ingress (begin)\n")
          var namespace = ingress.Metadata.Namespace
          var name = ingress.Metadata.Name
          var block = ""
          for _, rule := range ingress.Spec.Rules {
            for _, path := range rule.Http.Paths {
              if path.PathType == "ImplementationSpecific" {
                var pathInj = ConfigInjectionKind(path.Path, "mapkey")
                if pathInj != "" {
                  _ = WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                    "Ingress " + namespace + "/" + name + " has a begin path containing " + pathInj + ", which would split the routing map",
                    "the Ingress is rejected", "the route is not applied", "Remove whitespace and control characters from spec.rules[].http.paths[].path."))
                  continue
                }
                block += MapKeyForHost(rule.Host) + path.Path + " BACKEND:" + BackendNameIngress(ingress, path) + "\n"
              }
            }
          }
          if block != "" {
            show shared.Unique("haproxy-ingress-map-pfxexact", "resource/" + namespace + "/" + name, block)
          }
        }
      %%}
