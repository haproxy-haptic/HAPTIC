# haproxy-ingress library — auth validation tests.
# Basic auth (userlist + password-hash validation), auth-tls client cert,
# and external-auth (SPOE) flows.
_fx:
  extracontextSpoahubEnabled: &extracontextSpoahubEnabled
    spoaHub:
      enabled: true
      haproxy:
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages:
          - check-auth
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
  specApi: &specApi
    ingressClassName: haproxy
    rules:
      - host: protected.example.com
        http:
          paths:
            - path: /api
              pathType: Prefix
              backend: {service: {name: echo, port: {number: 80}}}
  extracontextSpoahubEnabled2: &extracontextSpoahubEnabled2
    spoaHub:
      enabled: true
      haproxy:
        socketPath: /run/spoa/hub.sock
        modeSpop: true
        messages: [check-auth]
        timeoutHello: 2s
        timeoutIdle: 5m
        timeoutProcessing: 500ms
        poolMaxConn: 100
        poolPurgeDelay: 30s
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  # ============================================================================
  # Phase 7: Basic Auth Tests
  # ============================================================================

  test-haproxy-ingress-basic-auth:
    description: HAProxy-Ingress auth-secret generates userlist and auth directive
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: hi-auth-secret}
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-ingress.github.io/auth-secret: "hi-auth-secret"
              haproxy-ingress.github.io/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist hi_auth_default_hi-auth-secret"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password"}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "ProtectedArea"'}

  test-haproxy-ingress-basic-auth-htpasswd-key:
    description: An `auth`-key htpasswd Secret (haproxy-ingress / ingress-nginx native format) is parsed into the userlist; "user::plain" lines use insecure-password
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        # data.auth = base64("admin:$2y$05$...\nguest::plainpw\n")
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: hi-htpasswd}
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCmd1ZXN0OjpwbGFpbnB3Cg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: htpasswd-ingress
            annotations:
              haproxy-ingress.github.io/auth-secret: "hi-htpasswd"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "user admin password [$]2y[$]05[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user guest insecure-password plainpw"}

  test-haproxy-ingress-basic-auth-missing-secret:
    description: >-
      auth-secret referencing a Secret that is ABSENT from the render snapshot
      (informer lag, or a cascade-delete that removed the Secret while the
      Ingress still lingers) must skip the userlist + auth ACL cleanly, not
      panic. Regression for the typed-nil gotcha: resources.secrets.GetSingle's
      result (statically *resources.secrets.T) is a typed-nil when the Secret is
      absent, and boxing it through shared.ComputeIfAbsent's `func() any` made it
      a non-nil `any`, so `secret != nil` passed and the subsequent
      `secret.(*resources.secrets.T).Data` dereferenced a nil pointer.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress-missing-secret
            annotations:
              haproxy-ingress.github.io/auth-secret: "absent-secret"
              haproxy-ingress.github.io/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth-missing.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "userlist hi_auth_default_absent-secret"}
      - {type: not_contains, target: haproxy.cfg, pattern: "http_auth(hi_auth_default_absent-secret)"}

  test-haproxy-ingress-auth-password-hash-validation-reject:
    description: Password hash validation rejects non-matching hashes (haproxy-ingress)
    extraContext:
      annotationCompatibility:
        basicAuth: {passwordHashValidation: {regex: "^\\$apr1\\$", errorMessage: "Bcrypt hashes not allowed"}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: hi-auth-secret}
          type: Opaque
          data: {admin: JDJ5JDEwJGJjcnlwdGhhc2g=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Bcrypt hashes not allowed"}
      - {type: contains, target: rendering_error, pattern: "admin"}

  test-haproxy-ingress-auth-password-hash-validation-allow:
    description: Password hash validation allows matching hashes (haproxy-ingress)
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^\\$2[ayb]\\$"}}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: hi-auth-secret}
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "user admin password"}

  test-haproxy-ingress-auth-default-rejects-apr1:
    description: The default passwordHashValidation refuses an $apr1$ htpasswd line, which HAProxy can't verify, and names the Ingress, Secret and accepted formats.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: hi-auth-secret}
          type: Opaque
          data: {auth: YWRtaW46JGFwcjEka3ZUa0t1VjgkS0RQSjB6ZW5EZ3pKWlZwT3lTYUR3MAo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-test
            annotations:
              haproxy-ingress.github.io/auth-secret: hi-auth-secret
          spec:
            ingressClassName: haproxy
            rules:
              - host: test.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress 'default/auth-test' references Secret 'default/hi-auth-secret', whose password hash for user 'admin' doesn't match the allowed pattern"}
      - {type: contains, target: rendering_error, pattern: "bcrypt, SHA-256/SHA-512 crypt or yescrypt hash, for example from htpasswd -nB"}

  test-haproxy-ingress-auth-tls-secret:
    description: haproxy-ingress.github.io/auth-tls-secret references a Secret whose `ca.crt` is written to the general file dir (not ssl/, whose entries are cert+key bundles) and used in the crt-list line...
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: client-ca}
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: server-tls}
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-ingress.github.io/auth-tls-secret: "client-ca"
              haproxy-ingress.github.io/auth-tls-verify-client: "on"
              haproxy-ingress.github.io/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-ingress.github.io/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: server-tls
            rules:
              - host: api.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
      - type: contains
        target: map:mtls-error.map
        pattern: "api.example.com https%3a%2f%2flogin.example.com%2fcert-required"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.host\\),map\\([^)]*mtls-error\\.map\\),url_dec\\(1\\)\\] code 302 if \\{ ssl_c_verify gt 0 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-SSL-Client-Cert %\\[ssl_c_der,base64\\] if \\{ ssl_c_used \\}"

  test-haproxy-ingress-auth-tls-error-page-injection-rejected:
    description: An auth-tls-error-page value containing whitespace (or newlines, tabs, etc.) must fail loudly — without validation, the value would be interpolated into a `http-request redirect location <url>` direct...
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-redirect
            annotations:
              # Whitespace + injected `http-request deny` after the legitimate URL.
              haproxy-ingress.github.io/auth-tls-error-page: "https://evil.example.com code 301\n      http-request deny if TRUE"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Invalid URL"}
      - {type: contains, target: rendering_error, pattern: "default/bad-redirect"}

  test-haproxy-ingress-external-auth:
    # The auth-url.map and SPOE wiring this test asserts on are
    # contributed by the spoa-hub library, which only auto-loads when
    # the chart's haptic.spoaHub.enabled helper is truthy. Skip when
    # the library isn't loaded (e.g. validate-helm-libraries default
    # render).
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-url annotation populates auth-url.map and the spoa-hub frontend wiring (set-var, send-spoe-group, deny rule). Mirrors test-nginx-ingress-external-auth but uses the haproxy-ingress.github.io/auth-url annotation flavour."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-url.map, pattern: "default/hi-protected https://auth.example/check"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_url\\).*auth-url\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-auth check-auth-group"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 401"}

  test-haproxy-ingress-auth-url-ssl-passthrough-warns:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "An Ingress that sets both haproxy-ingress.github.io/auth-url and ssl-passthrough gets an AuthIgnored Warning event: external auth can't run on undecrypted L4 passthrough traffic, so auth-url is a no-op. The chart warns rather than failing the render (the config is valid; a hard fail would block all config updates over one misconfig)."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: pt-svc}
          spec:
            ports:
              - port: 443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pt-auth
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: pt-auth.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pt-svc, port: {number: 443}}}
    assertions:
      - type: contains
        target: events
        pattern: 'Warning AuthIgnored networking\.k8s\.io/v1 Ingress default/pt-auth: .*ssl-passthrough'

  test-haproxy-ingress-oauth-oauth2-proxy:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth: oauth2_proxy desugars onto external-auth — derives the oauth2-proxy address from the Ingress's own /oauth2 path backend; sets auth-url (/oauth2/auth), auth-signin (/oauth2/start), auth-method HEAD, extract-headers, and forwards X-Auth-Request-Email on success."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-app-svc}
          spec:
            ports:
              - port: 80
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth2-proxy}
          spec:
            ports:
              - port: 4180
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthapp
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthapp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: oauth-app-svc, port: {number: 80}}}
                    - path: /oauth2
                      pathType: Prefix
                      backend: {service: {name: oauth2-proxy, port: {number: 4180}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/oauthapp http://oauth2-proxy.default.svc:4180/oauth2/auth"
      - type: contains
        target: map:auth-signin.map
        pattern: "default/oauthapp /oauth2/start\\?rd=%\\[path\\]"
      - {type: contains, target: map:auth-method.map, pattern: "default/oauthapp HEAD"}
      - type: contains
        target: map:auth-extract-headers.map
        pattern: "default/oauthapp X-Auth-Request-Email"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-Request-Email %\\[var\\(txn.hub.external_auth.x_auth_request_email\\)\\]"
      # Security: a client-supplied copy of the trusted identity header must be
      # stripped on the auth-protected route before the plugin value is re-added,
      # so a forged inbound X-Auth-Request-Email can't survive to the backend when
      # the auth reply omits it. The del-header must precede the set-header.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Auth-Request-Email if \\{ var\\(txn.auth_url\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "(?s)del-header X-Auth-Request-Email if \\{ var\\(txn.auth_url\\) -m found \\}.*set-header X-Auth-Request-Email"

  test-haproxy-ingress-oauth-invalid-value:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth with an unsupported value aborts the render with a clear error naming both accepted spellings."
    extraContext: *extracontextSpoahubEnabled2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthbad
            annotations:
              haproxy-ingress.github.io/oauth: "google"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthbad.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Only 'oauth2_proxy' \\(or 'oauth2-proxy'\\) is supported"

  test-haproxy-ingress-oauth-no-prefix-path:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "oauth set but no Ingress path matches oauth-uri-prefix aborts the render (the oauth2-proxy backend cannot be derived)."
    extraContext: *extracontextSpoahubEnabled2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthnp
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthnp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "has no Ingress path '/oauth2'"}

  test-haproxy-ingress-oauth-auth-url-precedence:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "an explicit auth-url on the same Ingress as oauth takes precedence — the oauth desugaring contributes no auth-url.map entry."
    extraContext: *extracontextSpoahubEnabled2
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-pr-svc}
          spec:
            ports: [{port: 80}]
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth2-proxy}
          spec:
            ports: [{port: 4180}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthpr
            annotations:
              haproxy-ingress.github.io/oauth: "oauth2_proxy"
              haproxy-ingress.github.io/auth-url: "https://explicit.example/check"
          spec:
            ingressClassName: haproxy
            rules:
              - host: oauthpr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: oauth-pr-svc, port: {number: 80}}}
                    - path: /oauth2
                      pathType: Prefix
                      backend: {service: {name: oauth2-proxy, port: {number: 4180}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-url.map, pattern: "default/oauthpr https://explicit.example/check"}
      - {type: not_contains, target: map:auth-url.map, pattern: "default/oauthpr http://oauth2-proxy"}

  test-haproxy-ingress-external-auth-signin:
    # Same prerequisite as the other external-auth tests — needs the
    # spoa-hub library loaded so auth-signin.map is defined.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "HAProxy-Ingress auth-signin annotation makes auth failures redirect (302) to the configured sign-in URL instead of returning 401. Mirrors test-nginx-ingress-external-auth-signin but uses the haproxy-ingress.github.io/auth-signin annotation."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-signin: "https://login.example/oauth2/start"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hi-protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-signin.map
        pattern: "default/hi-protected https://login.example/oauth2/start"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_signin\\).*auth-signin\\.map"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.auth_signin\\)\\] code 302"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 401"}

  test-haproxy-ingress-external-auth-method:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "haproxy-ingress.github.io/auth-method annotation populates auth-method.map and threads through the SPOE check-auth message's `method` arg. Mirrors test-nginx-ingress-external-auth-method but uses the haproxy-ingress.github.io/* annotation prefix."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-method: "POST"
          spec: *specApi
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-method.map, pattern: "default/protected POST"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_method\\).*auth-method\\.map"
      - {type: contains, target: file:spoe.conf, pattern: "method=var\\(txn.auth_method\\)"}

  test-haproxy-ingress-external-auth-headers-request:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "haproxy-ingress.github.io/auth-headers-request annotation populates auth-forward-headers.map and threads through the SPOE check-auth message's `forward_headers` arg, narrowing (or extending — see snip..."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/check"
              haproxy-ingress.github.io/auth-headers-request: "Authorization, X-Forwarded-For"
          spec: *specApi
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-forward-headers.map
        pattern: "default/protected Authorization, X-Forwarded-For"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn.auth_forward_headers\\).*auth-forward-headers\\.map"
