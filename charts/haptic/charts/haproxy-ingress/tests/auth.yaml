            namespace: default
            name: hi-two
            annotations:
              haproxy-ingress.github.io/auth-secret: "hi-auth-secret"
          spec:
            ingressClassName: haproxy
            rules:
              - host: two.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.hi_ba\) var\(txn\.resource_key\),map\(\S*/haproxy-ingress-basic-auth-routes.map\)'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.hi_ba\) -m str missing \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.denied_by\) str\(basic_auth\) if \{ var\(txn\.hi_ba\) -m beg "ok hi_auth_default_hi-auth-secret " \} !\{ http_auth\(hi_auth_default_hi-auth-secret\) \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "Zone A" if \{ var\(txn\.hi_ba\) -m str "ok hi_auth_default_hi-auth-secret Zone A" \} !\{ http_auth\(hi_auth_default_hi-auth-secret\) \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "Restricted" if \{ var\(txn\.hi_ba\) -m str "ok hi_auth_default_hi-auth-secret Restricted" \} !\{ http_auth\(hi_auth_default_hi-auth-secret\) \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'unless \{ http_auth\(hi_auth_default_hi-auth-secret\) \}'}
      - {type: match_count, target: haproxy.cfg, pattern: "userlist hi_auth_default_hi-auth-secret", expected: "1"}
      - {type: contains, target: "map:haproxy-ingress-basic-auth-routes.map", pattern: '(?m)^default/hi-one ok hi_auth_default_hi-auth-secret Zone A$'}
      - {type: contains, target: "map:haproxy-ingress-basic-auth-routes.map", pattern: '(?m)^default/hi-two ok hi_auth_default_hi-auth-secret Restricted$'}
