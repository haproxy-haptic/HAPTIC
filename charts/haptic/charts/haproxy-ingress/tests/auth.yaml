  test-haproxy-ingress-auth-secret-missing-fails-closed-at-admission:
    description: >-
      An unresolvable auth-secret left the backend with no authentication rule and served every request. Rejected when the resource is written.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-noauth
            annotations:
              haproxy-ingress.github.io/auth-type: "basic"
              haproxy-ingress.github.io/auth-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: hi-noauth.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      # Admission must NOT reject. The webhook renders against the
      # watched-resource store, which lags the API server, so a Secret created
      # moments earlier is indistinguishable from one that is missing — this
      # denied correct manifests applied in the correct order. The runtime 503
      # below is the protection, and it self-heals when the store catches up.
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}

  test-haproxy-ingress-basic-auth-map-lane:
    description: Basic auth rides the frontend map lane — routes on one Secret share its userlist, one auth rule per (userlist, realm) pair selected on the whole map value, one denied_by rule per userlist, and no backend challenge
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
