  test-haproxy-ingress-external-auth-headers-fail-both-frontends:
    # Regression for issue #49 — TestIngressAuthHeadersFail in the e2e
    # suite (pipeline 2546220821 job 14503514071) caught the chart
    # emitting `http-request deny deny_status 401` into ONE frontend
    # (http_frontend_h2c) but not the other (http_frontend). Plain
    # HTTP/1.1 traffic landed in http_frontend, hit the routing chain
    # without the deny rule, and reached the backend → 200 instead of
    # the expected 401.
    #
    # Pin both frontends explicitly: the chart's haproxy-ingress
    # auth-headers-fail path uses `first_seen` to dedupe the
    # `http-after-response set-header` directives across ingresses, but
    # that dedup must NOT bleed across the http_frontend and
    # http_frontend_h2c renders — both frontends serve client traffic
    # and need identical auth-deny semantics regardless of which one
    # the request landed in.
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: "auth-url + auth-headers-fail annotations must emit the deny 401 AND the http-after-response set-header directives into BOTH the HTTP/1.1 and H2C frontends. Regression for the asymmetric render that broke TestIngressAuthHeadersFail on MR !974 pipeline 2546220821."
    extraContext: *extracontextSpoahubEnabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-headers-fail
            annotations:
              haproxy-ingress.github.io/auth-url: "https://auth.example/deny-with-fail-headers"
              haproxy-ingress.github.io/auth-headers-fail: "WWW-Authenticate, X-Error-Reason"
          spec:
            ingressClassName: haproxy
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

      # Both frontends must carry the deny 401 directive.
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend\b.*?http-request deny deny_status 401 if \{ var\(txn\.auth_url\) -m found \} !\{ var\(txn\.hub\.external_auth\.allowed\) -m bool \}.*?frontend http_frontend_h2c'

      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend_h2c\b.*?http-request deny deny_status 401 if \{ var\(txn\.auth_url\) -m found \} !\{ var\(txn\.hub\.external_auth\.allowed\) -m bool \}'

      # Both frontends must carry the http-after-response set-header
      # directives for WWW-Authenticate.
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend\b.*?http-after-response set-header WWW-Authenticate.*?frontend http_frontend_h2c'
      - type: contains
        target: haproxy.cfg
        pattern: '(?s)frontend http_frontend_h2c\b.*?http-after-response set-header WWW-Authenticate'

