  test-haproxy-ingress-cert-header-cannot-be-forged:
    description: >-
      auth-tls-cert-header sets X-SSL-Client-* only when a certificate is
      present, so without an unconditional strip a request with no client
      certificate carried the caller's own header to the backend this annotation
      tells to trust it. The strip must not be host-scoped either.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hi-certhdr
            annotations:
              haproxy-ingress.github.io/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.hi-cert.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-CN\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-Cert\n'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'del-header X-SSL-Client-[A-Za-z]+ if'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request del-header X-SSL-Client-CN\n'
          - 'http-request set-header X-SSL-Client-CN'

