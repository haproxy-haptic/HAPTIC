# haproxy-ingress library — annotation validation tests.
# Backend directives, frontend filters, path-type matching, session affinity,
# and basic SSL passthrough.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  # ==========================================================================
  # Phase 1: Backend Directive Tests
  # ==========================================================================

  test-haproxy-ingress-timeouts:
    description: HAProxy-Ingress timeout annotations generate correct config
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: timeout-ingress
            annotations:
              haproxy-ingress.github.io/timeout-server: "60s"
              haproxy-ingress.github.io/timeout-connect: "10s"
              haproxy-ingress.github.io/timeout-queue: "30s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: timeout.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # The settable server timeout lives as ms in backend-timeouts.map
      # (reload-free); connect/queue stay per-value.
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_timeout-ingress_svc_echo_80\|server 60000'}
      - {type: not_contains, target: haproxy.cfg, pattern: "timeout server 60s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout connect 10s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout queue 30s"}

  test-haproxy-ingress-balance-algorithm:
    description: HAProxy-Ingress balance-algorithm annotation works
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-ingress
            annotations:
              haproxy-ingress.github.io/balance-algorithm: "leastconn"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lb.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "balance leastconn"}

  test-haproxy-ingress-health-check:
    description: HAProxy-Ingress health check annotations work
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: health-ingress
            annotations:
              haproxy-ingress.github.io/health-check-uri: "/healthz"
              haproxy-ingress.github.io/backend-check-interval: "7s"
              haproxy-ingress.github.io/health-check-port: "8082"
              haproxy-ingress.github.io/health-check-fall-count: "4"
              haproxy-ingress.github.io/health-check-rise-count: "5"
          spec:
            ingressClassName: haproxy
            rules:
              - host: health.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "option httpchk GET /healthz"}
      # backend-check-interval / health-check-port / -fall-count / -rise-count land
      # on the profile's default-server line (check tuning), read by add-server.
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* inter 7s"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* port 8082"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* fall 4"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* rise 5"}

  test-haproxy-ingress-maxconn-server:
    description: maxconn-server and maxqueue-server land on the default-server line
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: maxconn-ingress
            annotations:
              haproxy-ingress.github.io/maxconn-server: "55"
              haproxy-ingress.github.io/maxqueue-server: "105"
          spec:
            ingressClassName: haproxy
            rules:
              - host: maxconn.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* maxconn 55"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* maxqueue 105"}

  test-haproxy-ingress-initial-weight:
    description: initial-weight sets the default-server weight
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: weight-ingress
            annotations:
              haproxy-ingress.github.io/initial-weight: "7"
          spec:
            ingressClassName: haproxy
            rules:
              - host: weight.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "default-server check.* weight 7"}

  test-haproxy-ingress-secure-backends:
    description: HAProxy-Ingress secure-backends annotation enables SSL
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: secure-service}
          spec:
            ports:
              - port: 443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: secure-ingress
            annotations:
              haproxy-ingress.github.io/secure-backends: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: secure.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: secure-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify none"}

  test-haproxy-ingress-backend-protocol-h2:
    description: HAProxy-Ingress backend-protocol h2 annotation works
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: h2-ingress
            annotations:
              haproxy-ingress.github.io/backend-protocol: "h2"
          spec:
            ingressClassName: haproxy
            rules:
              - host: h2.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "proto h2"}

  test-haproxy-ingress-config-backend-snippet:
    description: HAProxy-Ingress config-backend annotation injects directives
    extraContext: {ingressPermissions: {allowRawHAProxyConfig: true}, waf: {ingressPermissions: {allowRawHAProxyConfig: true}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: snippet-ingress
            annotations:
              haproxy-ingress.github.io/config-backend: |
                http-request set-header X-Custom-Header "custom-value"
                option httplog
          spec:
            ingressClassName: haproxy
            rules:
              - host: snippet.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "X-Custom-Header"}
      - {type: contains, target: haproxy.cfg, pattern: "option httplog"}

  # ==========================================================================
  # Phase 2: Frontend Filter Tests
  # ==========================================================================

  test-haproxy-ingress-ssl-redirect:
    description: HAProxy-Ingress ssl-redirect annotation generates redirect
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: redirect-ingress
            annotations:
              haproxy-ingress.github.io/ssl-redirect: "true"
              haproxy-ingress.github.io/ssl-redirect-code: "301"
          spec:
            ingressClassName: haproxy
            rules:
              - host: redirect.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request redirect scheme https code 301"}
      # Relocated to the shared host map: the host registers into ssl-redirect-301.map
      # (ssl.yaml emits the single map-based redirect rule), so adding/removing a
      # redirected host is reload-free.
      - {type: contains, target: map:ssl-redirect-301.map, pattern: "redirect.example.com 1"}
      # No per-ingress inline-ACL host condition anymore.
      - {type: not_contains, target: haproxy.cfg, pattern: "var\\(txn.host\\) -m str redirect.example.com"}

  test-haproxy-ingress-redirect-to:
    description: HAProxy-Ingress redirect-to registers the host in the shared redirect-loc map (reload-free)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rt-ing
            annotations:
              haproxy-ingress.github.io/redirect-to: "https://new.example.com/"
              haproxy-ingress.github.io/redirect-to-code: "301"
          spec:
            ingressClassName: haproxy
            rules:
              - host: old.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # Host → location lands in the shared per-code redirect map (reload-free add).
      - type: contains
        target: map:redirect-loc-301.map
        pattern: "old.example.com https%3a%2f%2fnew.example.com%2f"
      # base.yaml emits the per-code rule (literal code, location from the map).
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.host\\),map\\([^)]*redirect-loc-301\\.map\\),url_dec\\(1\\)\\] code 301"
      # No per-ingress inline-ACL host condition anymore.
      - {type: not_contains, target: haproxy.cfg, pattern: "var\\(txn.host\\) -m str old.example.com"}

  test-haproxy-ingress-hsts:
    description: HAProxy-Ingress HSTS annotations generate correct headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hsts-ingress
            annotations:
              haproxy-ingress.github.io/hsts: "true"
              haproxy-ingress.github.io/hsts-max-age: "31536000"
              haproxy-ingress.github.io/hsts-include-subdomains: "true"
              haproxy-ingress.github.io/hsts-preload: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hsts.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:hsts.map
        pattern: "hsts.example.com max-age%3d31536000%3b%20includeSubDomains%3b%20preload"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Strict-Transport-Security %\\[var\\(txn.host\\),map\\([^)]*hsts\\.map\\),url_dec\\(1\\)\\] if \\{ ssl_fc \\}"

  test-haproxy-ingress-allowlist:
    description: HAProxy-Ingress allowlist-source-range creates ACL
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: allow-ingress
            annotations:
              haproxy-ingress.github.io/allowlist-source-range: "10.0.0.0/8, 192.168.0.0/16"
          spec:
            ingressClassName: haproxy
            rules:
              - host: allow.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/allow-ingress hi:allow$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^10\.0\.0\.0/8\|default/allow-ingress 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny if \{ var\(txn\.ac\) -m str "hi:allow" "hi:both" \} !\{ var\(txn\.ac_block\),concat\(\|,txn\.resource_key\),map\(\S*/ing-ac-allow\.map\) -m found \}'}

  test-haproxy-ingress-whitelist-source-range-alias:
    description: deprecated whitelist-source-range alias creates an allow ACL when allowlist-source-range is absent
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wl-ingress
            annotations:
              haproxy-ingress.github.io/whitelist-source-range: "10.0.0.0/8"
          spec:
            ingressClassName: haproxy
            rules:
              - host: wl.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/wl-ingress hi:allow$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^10\.0\.0\.0/8\|default/wl-ingress 1$'}

  test-haproxy-ingress-forwardfor:
    description: forwardfor rides the shared X-Forwarded-For map lane; an unknown value is add, as upstream.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: xff-update
            annotations:
              haproxy-ingress.github.io/forwardfor: "update"
          spec:
            ingressClassName: haproxy
            rules:
              - host: xff-update.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: xff-odd
            annotations:
              haproxy-ingress.github.io/forwardfor: "yes"
          spec:
            ingressClassName: haproxy
            rules:
              - host: xff-odd.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-xff-routes.map", pattern: '(?m)^default/xff-update hi:update$'}
      - {type: contains, target: "map:ing-xff-routes.map", pattern: '(?m)^default/xff-odd hi:add$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request add-header X-Forwarded-For %\[src\] if \{ var\(txn\.hi_xff\) -m str "hi:add" \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header X-Forwarded-For %\[src\] if \{ var\(txn\.hi_xff\) -m str "hi:update" \}'}

  test-haproxy-ingress-cors:
    description: HAProxy-Ingress CORS annotations generate correct headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              haproxy-ingress.github.io/cors-enable: "true"
              haproxy-ingress.github.io/cors-allow-origin: "https://example.com"
              haproxy-ingress.github.io/cors-allow-credentials: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cors.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # Feeds the shared lane: the exact origin is a membership row, the matched
      # request Origin is echoed back on http-after-response (also covers the 204).
      - {type: contains, target: "map:ing-cors-routes.map", pattern: '(?m)^default/cors-ingress hi:list 1 1 0 1$'}
      - {type: contains, target: "map:ing-cors-origins.map", pattern: '(?m)^default/cors-ingress\|https://example\.com 1$'}
      - {type: contains, target: "map:ing-cors-maxage.map", pattern: '(?m)^default/cors-ingress 86400$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header Access-Control-Allow-Origin ''%\[var\(txn\.hi_cors_origin\)\]'''}
      - {type: contains, target: haproxy.cfg, pattern: "http-after-response set-header Access-Control-Allow-Credentials 'true' if \\{ var\\(txn\\.hi_cors_ok\\) -m found \\} \\{ var\\(txn\\.hi_cors\\),field\\(2,' '\\) -m str 1 \\}"}
      - {type: contains, target: haproxy.cfg, pattern: "status 204 .*METH_OPTIONS"}

  test-haproxy-ingress-app-root:
    description: HAProxy-Ingress app-root annotation generates redirect
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: approot-ingress
            annotations:
              haproxy-ingress.github.io/app-root: "/dashboard"
          spec:
            ingressClassName: haproxy
            rules:
              - host: approot.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:app-root.map, pattern: "approot.example.com %2fdashboard"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.host\\),map\\([^)]*app-root\\.map\\),url_dec\\(1\\)\\] code 302 if \\{ path / \\}"

  # ============================================================================
  # Phase 3: Path Type Tests
  # ============================================================================

  test-haproxy-ingress-path-type-exact:
    description: HAProxy-Ingress path-type exact annotation uses exact match map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: exact-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: exact-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "exact"
          spec:
            ingressClassName: haproxy
            rules:
              - host: exact.example.com
                http:
                  paths:
                    - path: /api/users
                      pathType: ImplementationSpecific
                      backend: {service: {name: exact-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-exact.map"
        pattern: '(?m)^exact\.example\.com/api/users BACKEND:default_exact-ingress_svc_exact-service_80$'
  test-haproxy-ingress-path-type-prefix:
    description: HAProxy-Ingress path-type prefix annotation uses prefix map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: prefix-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: prefix-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "prefix"
          spec:
            ingressClassName: haproxy
            rules:
              - host: prefix.example.com
                http:
                  paths:
                    - path: /api
                      pathType: ImplementationSpecific
                      backend: {service: {name: prefix-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-prefix.map"
        pattern: '(?m)^prefix\.example\.com/api/ BACKEND:default_prefix-ingress_svc_prefix-service_80$'

  test-haproxy-ingress-path-type-begin:
    description: HAProxy-Ingress path-type begin annotation uses prefix-exact map
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: begin-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: begin-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "begin"
          spec:
            ingressClassName: haproxy
            rules:
              - host: begin.example.com
                http:
                  paths:
                    - path: /static
                      pathType: ImplementationSpecific
                      backend: {service: {name: begin-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-prefix-exact.map"
        pattern: '(?m)^begin\.example\.com/static BACKEND:default_begin-ingress_svc_begin-service_80$'

  test-haproxy-ingress-path-type-regex-stays-on-host:
    description: A top-level | stays inside the path group and a path that closes the group early is not routed (with an Event), so neither can match another host.
    extraContext: {renderMode: reconcile}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: esc-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: esc
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: esc.example.com
                http:
                  paths:
                    - path: /x|/
                      pathType: ImplementationSpecific
                      backend: {service: {name: esc-service, port: {number: 80}}}
                    - path: /y)|(.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: esc-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^\^esc\\\.example\\\.com\(\?:/x\|/\) BACKEND:default_esc_svc_esc-service_80$'
      - {type: match_count, target: "map:path-regex.map", pattern: 'BACKEND:', expected: "1"}
      - {type: contains, target: events, pattern: "has regex path '/y\\)\\|\\(\\.\\*', which closes a group it doesn't open"}

  test-haproxy-ingress-path-type-regex-early-close-rejected:
    description: A regex path that closes the path group early is refused at admission.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: esc
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: esc.example.com
                http:
                  paths:
                    - path: /y)|(.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: esc-service, port: {number: 80}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/esc has regex path '/y\\)\\|\\(\\.\\*', which closes a group it doesn't open; the path is not routed"}

  test-haproxy-ingress-path-type-regex:
    description: "HAProxy-Ingress path-type=regex annotation produces a path-regex.map row keyed by the literal regex pattern with a `BACKEND:<backend_name>` qualifier value. base."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: regex-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: regex-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: regex.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: regex-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^\^regex\\\.example\\\.com\(\?:/api/v\[0-9\]\+/\.\*\) BACKEND:default_regex-ingress_svc_regex-service_80$'
  test-haproxy-ingress-path-type-regex-wildcard-host:
    description: HAProxy-Ingress path-type=regex annotation on a wildcard-host Ingress produces a valid regex (no leading literal `*`). The historical renderer used the raw rule.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: wild-regex-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wild-regex-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              - host: "*.example.com"
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: wild-regex-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^\^\\\.example\\\.com\(\?:/api/v\[0-9\]\+/\.\*\) BACKEND:default_wild-regex-ingress_svc_wild-regex-service_80$'
      - {type: not_contains, target: "map:path-regex.map", pattern: '\*\.example\.com'}
  test-haproxy-ingress-path-type-regex-rule-without-http:
    description: "HAProxy-Ingress path-type=regex with a rule that has no `http` block must not panic or emit any map row for that rule. Regression test for the typed-traversal migration (!1017) — `rule.Http.Paths` is accessed directly, and an absent `http:` in the source YAML must surface as an empty slice (loop emits nothing), not a nil-deref panic."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mixed-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-ingress
            annotations:
              haproxy-ingress.github.io/path-type: "regex"
          spec:
            ingressClassName: haproxy
            rules:
              # Rule with no http block — must be tolerated.
              - host: nohttp.example.com
              # Rule with http block — must still emit its path.
              - host: hashttp.example.com
                http:
                  paths:
                    - path: /api/v[0-9]+/.*
                      pathType: ImplementationSpecific
                      backend: {service: {name: mixed-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "map:path-regex.map"
        pattern: '(?m)^\^hashttp\\\.example\\\.com\(\?:/api/v\[0-9\]\+/\.\*\) BACKEND:default_mixed-ingress_svc_mixed-service_80$'
      - {type: not_contains, target: "map:path-regex.map", pattern: 'nohttp\.example\.com'}
  # ============================================================================
  # Phase 4: Session Affinity Tests
  # ============================================================================

  test-haproxy-ingress-session-affinity-basic:
    description: HAProxy-Ingress cookie affinity generates cookie directive
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: affinity-ingress
            annotations:
              haproxy-ingress.github.io/affinity: "cookie"
          spec:
            ingressClassName: haproxy
            rules:
              - host: affinity.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie INGRESSCOOKIE insert indirect nocache dynamic"}

  test-haproxy-ingress-session-affinity-custom:
    description: HAProxy-Ingress cookie affinity with custom options
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: affinity-custom-ingress
            annotations:
              haproxy-ingress.github.io/affinity: "cookie"
              haproxy-ingress.github.io/session-cookie-name: "MYSESSION"
              haproxy-ingress.github.io/session-cookie-same-site: "Strict"
              haproxy-ingress.github.io/session-cookie-domain: ".example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: affinity-custom.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie MYSESSION insert"}
      - {type: contains, target: haproxy.cfg, pattern: "domain .example.com"}
      - {type: contains, target: haproxy.cfg, pattern: 'attr "SameSite=Strict"'}

  # ============================================================================
  # Phase 5: SSL Features Tests
  # ============================================================================

  test-haproxy-ingress-ssl-passthrough:
    description: HAProxy-Ingress ssl-passthrough creates TCP backend and frontend routing
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: passthrough-service}
          spec:
            ports:
              - port: 443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress
            annotations:
              haproxy-ingress.github.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: passthrough.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: passthrough-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend ssl-passthrough-hi-default-passthrough-ingress"
      - {type: contains, target: haproxy.cfg, pattern: "mode tcp"}
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend ssl-passthrough-hi-default-passthrough-ingress if { req_ssl_sni -m str passthrough.example.com }"

  # ==========================================================================
  # Rate limiting (limit-rps / limit-rpm / limit-whitelist)
  # ==========================================================================

  test-haproxy-ingress-limit-rps:
    description: limit-rps generates a per-source request-rate stick-table and 429 deny
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rps-ingress
            annotations:
              haproxy-ingress.github.io/limit-rps: "10"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rps.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type string len 340 size 102400 expire 1s store http_req_rate\\(1s\\) peers localinstance"
      - {type: contains, target: "map:ing-rl-routes.map", pattern: '(?m)^default/rps-ingress req 1s 10 429$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 429 if \{ var\(txn\.vrl_status\) -m str 429 \}'}
      # The route's backend stays plain — the counters live in the shared table
      # proxy, which is what keeps the backend's servers dynamic.
      - {type: not_contains, target: haproxy.cfg, pattern: 'http-request track-sc0 src'}
  test-haproxy-ingress-limit-rpm:
    description: limit-rpm generates a per-minute request-rate stick-table
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rpm-ingress
            annotations:
              haproxy-ingress.github.io/limit-rpm: "120"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rpm.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type string len 340 size 102400 expire 60s store http_req_rate\\(60s\\) peers localinstance"
      - {type: contains, target: "map:ing-rl-routes.map", pattern: '(?m)^default/rpm-ingress req 60s 120 429$'}
  test-haproxy-ingress-limit-whitelist:
    description: limit-whitelist exempts listed CIDRs from the rate limit
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: wl-ingress
            annotations:
              haproxy-ingress.github.io/limit-rps: "10"
              haproxy-ingress.github.io/limit-whitelist: "10.0.0.0/8, 192.168.1.1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: wl.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-rl-routes.map", pattern: '(?m)^default/wl-ingress req 1s 10 429$'}
      - {type: contains, target: "map:ing-rl-allow-members.map", pattern: '(?m)^10\.0\.0\.0/8\|default/wl-ingress 1$'}
      # A bare address in the list is its own host block.
      - {type: contains, target: "map:ing-rl-allow-members.map", pattern: '(?m)^192\.168\.1\.1/32\|default/wl-ingress 1$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '!\{ src 10\.0\.0\.0/8'}
  test-haproxy-ingress-rewrite-target:
    description: rewrite-target emits replace-path and translates $N capture groups to \N
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rw-ingress
            annotations:
              haproxy-ingress.github.io/rewrite-target: "/api/$1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rw.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request replace-path \\(\\.\\*\\) /api/"}
      - {type: not_contains, target: haproxy.cfg, pattern: "/api/\\$1"}

  test-haproxy-ingress-rewrite-target-literal:
    description: HAProxy-Ingress rewrite-target with no capture group relocates to path-rewrite.map (reload-free)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: rwlit-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rwlit-ing
            annotations:
              haproxy-ingress.github.io/rewrite-target: "/new"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rwlit.example.com
                http:
                  paths:
                    - path: /old
                      pathType: Prefix
                      backend: {service: {name: rwlit-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:path-rewrite.map, pattern: "default_rwlit-ing_svc_rwlit-svc_80 %2fnew"}
      - {type: not_contains, target: haproxy.cfg, pattern: "replace-path \\(\\.\\*\\) /new"}


  test-haproxy-ingress-proxy-body-size:
    description: HAProxy-Ingress proxy-body-size caps request body via body-size.map (relocated from the backend)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: body-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: body-ingress
            annotations:
              haproxy-ingress.github.io/proxy-body-size: "8m"
          spec:
            ingressClassName: haproxy
            rules:
              - host: body.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: body-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # Limit now lives in body-size.map keyed on the backend, not as an
      # http-request deny inside the backend section.
      - type: contains
        target: map:body-size.map
        pattern: "default_body-ingress_svc_body-service_80 8388608"
      # The old per-backend literal deny must be gone (relocated to the
      # resource-agnostic frontend-filters-250-request-body-size scaffold).
      - type: not_contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 413 if \\{ req.body_size gt 8388608 \\}"

  test-haproxy-ingress-proxy-body-size-unlimited:
    description: HAProxy-Ingress proxy-body-size "0" emits no body-size.map entry
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: body0-ingress
            annotations:
              haproxy-ingress.github.io/proxy-body-size: "0"
          spec:
            ingressClassName: haproxy
            rules:
              - host: body0.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # "0" = unlimited → no entry for this backend in body-size.map.
      - {type: not_contains, target: map:body-size.map, pattern: "body0-ingress"}

  test-haproxy-ingress-proxy-body-size-malformed-warns-on-reconcile:
    description: >-
      A malformed proxy-body-size records a Warning Event and emits no entry. It used
      to convert to 0 and drop the cap silently; the Event needs the component's
      recordEvent effect, without which the whole render fails on reconcile.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bodyx-ingress
            annotations:
              haproxy-ingress.github.io/proxy-body-size: "10x"
          spec:
            ingressClassName: haproxy
            rules:
              - host: bodyx-ingress.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: events, pattern: "InvalidAnnotationValue"}
      - {type: not_contains, target: map:body-size.map, pattern: "bodyx-ingress"}

  test-haproxy-ingress-ssl-ciphers-backend:
    description: HAProxy-Ingress ssl-ciphers-backend/ssl-cipher-suites-backend add ciphers to default-server when backend SSL is on
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: cipher-service}
          spec:
            ports:
              - port: 443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cipher-ingress
            annotations:
              haproxy-ingress.github.io/secure-backends: "true"
              haproxy-ingress.github.io/ssl-ciphers-backend: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
              haproxy-ingress.github.io/ssl-cipher-suites-backend: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cipher.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: cipher-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
      - type: contains
        target: haproxy.cfg
        pattern: "ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384"

  test-haproxy-ingress-ssl-ciphers-backend-ignored-without-ssl:
    description: ssl-ciphers-backend is ignored when backend SSL is not enabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cipher-nossl-ingress
            annotations:
              haproxy-ingress.github.io/ssl-ciphers-backend: "ECDHE-RSA-AES128-GCM-SHA256"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cipher-nossl.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "ciphers ECDHE-RSA-AES128-GCM-SHA256"}

  test-haproxy-ingress-agent-check:
    description: HAProxy-Ingress agent-check annotations add agent-check server params to default-server
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: agent-ingress
            annotations:
              haproxy-ingress.github.io/agent-check-port: "9999"
              haproxy-ingress.github.io/agent-check-interval: "5s"
              haproxy-ingress.github.io/agent-check-send: "ping\n"
          spec:
            ingressClassName: haproxy
            rules:
              - host: agent.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "agent-check agent-port 9999 agent-inter 5s"}
      - {type: contains, target: haproxy.cfg, pattern: "agent-send ping"}

  test-haproxy-ingress-agent-check-addr:
    description: HAProxy-Ingress agent-check-addr is appended alongside the required agent-check-port
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: agentaddr-ingress
            annotations:
              haproxy-ingress.github.io/agent-check-port: "9876"
              haproxy-ingress.github.io/agent-check-addr: "10.0.0.5"
          spec:
            ingressClassName: haproxy
            rules:
              - host: agentaddr.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "agent-check agent-port 9876 agent-addr 10.0.0.5"}

  test-haproxy-ingress-agent-check-addr-without-port-rejected:
    description: HAProxy-Ingress agent-check-addr without agent-check-port fails the render
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: agentnoport-ingress
            annotations:
              haproxy-ingress.github.io/agent-check-addr: "10.0.0.5"
          spec:
            ingressClassName: haproxy
            rules:
              - host: agentnoport.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Annotation 'haproxy-ingress\\.github\\.io/agent-check-port' is required to enable the agent check on Ingress 'default/agentnoport-ingress'"

  test-haproxy-ingress-default-backend-redirect:
    description: HAProxy-Ingress default-backend-redirect redirects unmatched requests for the Ingress host
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: dbr-ingress
            annotations:
              haproxy-ingress.github.io/default-backend-redirect: "https://fallback.example.com/"
              haproxy-ingress.github.io/default-backend-redirect-code: "301"
          spec:
            ingressClassName: haproxy
            rules:
              - host: dbr.example.com
                http:
                  paths:
                    - path: /app
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:default-backend-redirect-301.map
        pattern: "dbr.example.com https://fallback.example.com/"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.host\\),map\\([^)]*default-backend-redirect-301\\.map\\)\\] code 301 if !\\{ var\\(txn.backend_name\\) -m found \\}"

  test-haproxy-ingress-default-backend-redirect-default-code:
    description: HAProxy-Ingress default-backend-redirect defaults to code 302
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: dbr2-ingress
            annotations:
              haproxy-ingress.github.io/default-backend-redirect: "https://fallback2.example.com/"
          spec:
            ingressClassName: haproxy
            rules:
              - host: dbr2.example.com
                http:
                  paths:
                    - path: /app
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect location %\\[var\\(txn.host\\),map\\([^)]*default-backend-redirect-302\\.map\\)\\] code 302 if !\\{ var\\(txn.backend_name\\) -m found \\}"
      - type: contains
        target: map:default-backend-redirect-302.map
        pattern: "dbr2.example.com https://fallback2.example.com/"

  # ==========================================================================
  # Security: CIDR-list config-injection guard (ValidateCidrList)
  # ==========================================================================

  test-haproxy-ingress-allowlist-cidr-injection-rejected:
    description: An allowlist-source-range token that is not a bare IP/CIDR aborts the render (config-injection guard)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: inj-ingress
            annotations:
              # The second token is not an IP/CIDR — a crafted value could
              # otherwise smuggle an HAProxy directive into the src ACL line.
              haproxy-ingress.github.io/allowlist-source-range: "10.0.0.0/8, http-request deny"
          spec:
            ingressClassName: haproxy
            rules:
              - host: inj.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Invalid CIDR/IP 'http-request deny'"}
