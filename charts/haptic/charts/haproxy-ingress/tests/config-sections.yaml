# haproxy-ingress library — config-frontend / config-global / config-defaults tests.
# Raw HAProxy directive injection into the http frontend / global / defaults
# sections (complements the existing config-backend snippet).
_fx:
  rawConfigContext: &rawConfigContext
    ingressPermissions: {allowRawHAProxyConfig: true}
    waf:
      ingressPermissions: {allowRawHAProxyConfig: true}
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  # ==========================================================================
  # config-frontend: raw directives into the HTTP frontend
  # ==========================================================================

  test-haproxy-ingress-config-frontend:
    description: config-frontend injects raw directives into the http frontend
    extraContext: *rawConfigContext
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: z-last
            annotations:
              haproxy-ingress.github.io/config-frontend: "http-request set-header X-Haproxy-Ingress-Order last"
          spec:
            ingressClassName: haproxy
            rules:
              - host: z.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: middle-empty
            annotations:
              haproxy-ingress.github.io/config-frontend: " \t "
          spec:
            ingressClassName: haproxy
            rules:
              - host: middle.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: a-first
            annotations:
              haproxy-ingress.github.io/config-frontend: "  http-request set-header X-Haproxy-Ingress-Order first  "
          spec:
            ingressClassName: haproxy
            rules:
              - host: a.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^  # haproxy-ingress/config-frontend$', expected: "3"}
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  # haproxy-ingress/config-frontend\n  # Ingress: default/a-first\n  http-request set-header X-Haproxy-Ingress-Order first\n  # Ingress: default/z-last\n  http-request set-header X-Haproxy-Ingress-Order last$'
        expected: "3"

  # ==========================================================================
  # config-global: raw directives into the global section
  # ==========================================================================

  test-haproxy-ingress-config-global:
    description: config-global injects raw directives into the global section
    extraContext: *rawConfigContext
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: z-last
            annotations:
              haproxy-ingress.github.io/config-global: "tune.maxrewrite 1024"
          spec:
            ingressClassName: haproxy
            rules:
              - host: z.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: middle-empty
            annotations:
              haproxy-ingress.github.io/config-global: "   "
          spec:
            ingressClassName: haproxy
            rules:
              - host: middle.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: a-first
            annotations:
              haproxy-ingress.github.io/config-global: "  tune.bufsize 32768  "
          spec:
            ingressClassName: haproxy
            rules:
              - host: a.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^  # haproxy-ingress/config-global$', expected: "1"}
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  # haproxy-ingress/config-global\n  # Ingress: default/a-first\n  tune\.bufsize 32768\n  # Ingress: default/z-last\n  tune\.maxrewrite 1024$'
        expected: "1"

  # ==========================================================================
  # config-defaults: raw directives into the defaults section
  # ==========================================================================

  test-haproxy-ingress-config-defaults:
    description: config-defaults injects raw directives into the defaults section
    extraContext: *rawConfigContext
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: z-last
            annotations:
              haproxy-ingress.github.io/config-defaults: "timeout queue 1234"
          spec:
            ingressClassName: haproxy
            rules:
              - host: z.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: middle-empty
            annotations:
              haproxy-ingress.github.io/config-defaults: "\n"
          spec:
            ingressClassName: haproxy
            rules:
              - host: middle.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: a-first
            annotations:
              haproxy-ingress.github.io/config-defaults: "  retries 5  "
          spec:
            ingressClassName: haproxy
            rules:
              - host: a.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^  # haproxy-ingress/config-defaults$', expected: "1"}
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  # haproxy-ingress/config-defaults\n  # Ingress: default/a-first\n  retries 5\n  # Ingress: default/z-last\n  timeout queue 1234$'
        expected: "1"
