# Ingress-only macros shared by the three vendor annotation libraries
# (haproxytech, haproxy-ingress, nginx-ingress). Loaded at level 2.5 — after
# ingress/gateway, before those libraries. A vendor library for a non-Ingress
# CRD writes its own. See docs/adr/0003-annotation-compat-scaffold-level-2-5.md

_fx:
  annotationlibrariesHapticNginx: &annotationlibrariesHapticNginx
    haptic: true
    nginx: true
    haproxyIngress: false
    haproxytech: false
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: app, port: { number: 80 } } }
  annotationlibrariesHapticNginx2: &annotationlibrariesHapticNginx2
    haptic: true
    nginx: false
    haproxyIngress: false
    haproxytech: true
  rawConfigDisabled: &rawConfigDisabled
    ingressPermissions: {allowRawHAProxyConfig: false}
    annotationLibraries: {haptic: true, nginx: true, haproxyIngress: true, haproxytech: true}

_helm_load: {enable: '{{ .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}'}

templateSnippets:

  util-auth-validate-header-name:
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- macro ValidateAuthHeaderName(name string, annotation string, ns string, ingressName string) %}
        {%- if !regex_search(name, "^[A-Za-z0-9!#$&'*+.^_`|~-]+$") -%}
          {{- fail("Invalid HTTP header name '" + name + "' in annotation '" + annotation + "' on Ingress " + ns + "/" + ingressName + ". Header names must be RFC 7230 tokens (1*tchar): no whitespace, no special characters, no fetch syntax.") -}}
        {%- end -%}
      {%- end %}
      {#- SPOE argument names can't carry '-': a capture of X_Api_Key would stand in for X-Api-Key on every Ingress forwarding it. Callers skip the header after this. -#}
      {%- macro RejectUnderscoreAuthHeader(ingress any, name string, annotation string, ns string, ingressName string) %}
        {{- WebhookRejectOrWarn(ingress, "InvalidAuthHeader", "Ingress " + ns + "/" + ingressName + " annotation '" + annotation + "' lists header '" + name + "', which contains '_', so it isn't forwarded to the auth service. Use '" + replace(name, "_", "-") + "'.") -}}
      {%- end %}

  util-annotation-ssl-passthrough-component:
    template: |-
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {%- import "util-backend" for PrepareBackend -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {% macro RenderAnnotationSSLPassthrough(item any, annotationKey string, namePrefix string, cell string, commentLabel string) %}{%%
        var ingress = item
        if dig_string(ingress, "", "metadata", "annotations", annotationKey) != "true" {
          return
        }

        var namespace = dig_string(ingress, "", "metadata", "namespace")
        var ingressName = dig_string(ingress, "", "metadata", "name")
        var serviceName = ""
        var servicePort = 0
        var servicePortName = ""
        for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
          for _, path := range toSlice(dig(rule, "http", "paths")) {
            var candidate = dig_string(path, "", "backend", "service", "name")
            if candidate == "" {
              continue
            }
            var resolved = split(ResolveServicePort(namespace, candidate,
              dig(path, "backend", "service", "port"), ingress), " ")
            serviceName = candidate
            servicePort = toint(resolved[0])
            servicePortName = resolved[1]
            break
          }
          if serviceName != "" {
            break
          }
        }
        if serviceName == "" {
          return
        }

        var backendName = namePrefix + namespace + "-" + ingressName
        var serverResult = BackendServersResult(
          serviceName, 0, servicePort, nil, servicePortName, backendName, namespace)
        var hostKeys = []string{}
        var seenHosts = map[string]bool{}
        for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
          var host = dig_string(rule, "", "host")
          if host == "" || seenHosts[host] {
            continue
          }
          seenHosts[host] = true
          hostKeys = append(hostKeys, host)
          show shared.Publish(cell, host, map[string]any{
            "name": backendName,
            "sni": host,
            "namespace": namespace,
            "ingress": ingressName,
            "svcName": serviceName,
            "svcPort": servicePort,
            "svcPortName": servicePortName,
            "degradedByName": serverResult["degradedByName"],
            "resolvedPortName": serverResult["portName"],
          })
        }
        if len(hostKeys) == 0 {
          return
        }

        var record, text = PrepareBackend(map[string]any{
          "name": backendName,
          "mode": "tcp",
          "comments": []any{"# " + commentLabel + "/backends-ssl-passthrough"},
          "servers": serverResult["servers"],
        })
        var token, err = planRegistry.BackendWhenAny(record, text, cell, hostKeys)
        if err != nil {
          fail(err.Error())
        }
        show token + "\n"
      %%}{% end %}

  util-annotation-ssl-passthrough-values:
    template: |-
      {%- var encoded, _ = shared.ComputeIfAbsent("sslPassthroughBackendsCombinedJSON", func() any {
          var gf = shared.Get("globalFeatures").(map[string]any)
          var backends = []any{}
          for _, backend := range toSlice(gf["sslPassthroughBackends"]) {
            backends = append(backends, backend)
          }

          var enabled = extraContext | dig("annotationLibraries") | fallback(map[string]any{})
          var anyEnabled = false
          for _, family := range []string{"haptic", "haproxyIngress", "haproxytech", "nginx"} {
            if tostring(enabled | dig(family) | fallback(false)) == "true" {
              anyEnabled = true
            }
          }
          if anyEnabled {
            for _, cell := range []string{
              "haproxy-ingress", "haproxytech", "haptic", "nginx",
            } {
              for _, backend := range incremental_values("ingress-ssl-passthrough", cell) {
                var info = backend.(map[string]any)
                backends = append(backends, info)
                if info["degradedByName"] == true {
                  var marker = "degradedBackendRef:" +
                    tostring(info["namespace"]) + "/" +
                    tostring(info["svcName"]) + "/" +
                    tostring(info["resolvedPortName"])
                  shared.ComputeIfAbsent(marker, func() any { return true })
                }
              }
            }
          }
          return toJSON(backends)
      }) -%}
      {{- tostring(encoded) -}}

  util-register-annotation-hsts:
    template: |-
      {%- macro RegisterAnnotationHSTS(ingress *resources.ingresses.T, enabledAnn string, maxAgeAnn string, subdomainsAnn string, preloadAnn string, defaultMaxAge string) %}
        {%- if ingress.Metadata.Annotations[enabledAnn] == "true" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- var maxAge = ingress.Metadata.Annotations[maxAgeAnn] %}
          {%- if maxAge == "" %}{%- maxAge = defaultMaxAge %}{%- end %}
          {%- if regex_search(maxAge, "[[:cntrl:]]") %}{{ fail("Invalid value for annotation '" + maxAgeAnn + "' on Ingress '" + key + "': must not contain control characters — config-injection guard.") }}{%- end %}
          {%- var hstsValue = "max-age=" + maxAge %}
          {%- if ingress.Metadata.Annotations[subdomainsAnn] == "true" %}{%- hstsValue = hstsValue + "; includeSubDomains" %}{%- end %}
          {%- if ingress.Metadata.Annotations[preloadAnn] == "true" %}{%- hstsValue = hstsValue + "; preload" %}{%- end %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {{- shared.Publish("hosts", toLower(rule.Host), map[string]any{"host": toLower(rule.Host), "value": hstsValue}) -}}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end macro %}

  # Classifies a validated path-rewrite value in the haproxytech form (a bare
  # <new path>, or `<from> <to>`). result["lane"] is "map" for a prefix strip
  # (the bare form, or `^<prefix>(.*)` with `<new prefix>\1` or a plain `<new
  # path>` as the replacement, <prefix> free of regex metacharacters), with
  # prefix, offset (bytes to drop from the path; past any path length when the
  # rest is dropped) and newPrefix; "backend" for anything else. from and to
  # always carry the replace-path form.
  util-path-rewrite-shape:
    template: |-
      {%- macro PathRewriteShape(safe string, result map[string]any) -%}
        {%- var from = "(.*)" -%}
        {%- var to = safe -%}
        {%- var prefix = "" -%}
        {%- var group = true -%}
        {%- var shape = true -%}
        {%- if strings_contains(safe, " ") -%}
          {%- var parts = split(safe, " ") -%}
          {%- from = parts[0] -%}
          {%- to = join(parts[1:], " ") -%}
          {%- var rest = from -%}
          {%- shape = hasPrefix(rest, "^") -%}
          {%- if shape -%}{%- rest = rest[1:] -%}{%- end -%}
          {%- if hasSuffix(rest, "$") -%}{%- rest = rest[:len(rest)-1] -%}{%- end -%}
          {%- if hasSuffix(rest, "(.*)") -%}
            {%- prefix = rest[:len(rest)-4] -%}
          {%- else if hasSuffix(rest, ".*") -%}
            {%- prefix = rest[:len(rest)-2] -%}
            {%- group = false -%}
          {%- else -%}
            {%- shape = false -%}
          {%- end -%}
          {%- if !regex_search(prefix, "^[^\\\\^$.*+?()\\[\\]{}|]*$") -%}{%- shape = false -%}{%- end -%}
        {%- end -%}
        {%- result["from"] = from -%}
        {%- result["to"] = to -%}
        {%- result["lane"] = "backend" -%}
        {#- The replacement is a log-format on the backend rule but a literal
            map value: `%` keeps it there. A `\1` is honoured only as the
            suffix of the replacement (the kept rest of the path). In the bare
            form the prefix is empty, so a trailing `\1` keeps the whole path
            from offset 0, exactly what `replace-path (.*)` captures. -#}
        {%- if shape && !strings_contains(to, "%") -%}
          {%- var newPrefix = to -%}
          {%- var keepRest = false -%}
          {%- if hasSuffix(to, "\\1") -%}
            {%- newPrefix = to[:len(to)-2] -%}
            {%- keepRest = group -%}
          {%- end -%}
          {%- if !strings_contains(newPrefix, "\\") && (keepRest || !hasSuffix(to, "\\1")) -%}
            {%- result["lane"] = "map" -%}
            {%- result["prefix"] = prefix -%}
            {%- result["newPrefix"] = newPrefix -%}
            {%- result["offset"] = 1048576 -%}
            {%- if keepRest -%}{%- result["offset"] = len(prefix) -%}{%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  # The rules of a path-rewrite map lane. routes is an exact lookup by route
  # id, so a request to any other route pays one tree lookup and never touches
  # the rest. prefixes is a prefix-tree lookup on "<route id>|<path>" giving
  # "<offset> <new prefix>"; the new path is the new prefix plus the path from
  # <offset> on (bytes() yields nothing past the end, which is how the bare
  # form drops the whole path). No regex, so the cost does not grow with the
  # number of rewrite routes. v names the txn variables, one set per library.
  util-path-rewrite-lane:
    template: |-
      {%- macro PathRewriteLane(routes string, prefixes string, v string) -%}
      http-request set-var(txn.{{ v }}_in) path if { var(txn.resource_key),map({{ routes }}) -m found }
      http-request set-var(txn.{{ v }}_v) var(txn.resource_key),concat(|,txn.{{ v }}_in),map_beg({{ prefixes }}) if { var(txn.{{ v }}_in) -m found }
      http-request set-var(txn.{{ v }}_off) var(txn.{{ v }}_v),field(1,' '),add(0) if { var(txn.{{ v }}_v) -m found }
      http-request set-var(txn.{{ v }}_rest) var(txn.{{ v }}_in),bytes(txn.{{ v }}_off) if { var(txn.{{ v }}_v) -m found }
      http-request set-path %[var(txn.{{ v }}_v),field(2,' ',0)]%[var(txn.{{ v }}_rest)] if { var(txn.{{ v }}_v) -m found }
      {%- end macro -%}

  # CORS in the ingress-nginx model: cors-allow-origin is a comma-separated
  # allow-list (single-level "*." wildcards) matched against the request
  # Origin; a lone "*" or unset allows any origin. Publishes the route's rows
  # for the shared lane (util-cors-lane). haproxytech's regex model has its
  # own publisher.
  util-ingress-annotation-cors-publish:
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-cors-publish" for PublishCORS -%}
      {%- macro IngressCORSPublish(ingress *resources.ingresses.T, prefix string, enabledAnn string, defaultMaxAge string, family string) -%}
        {%- if ingress.Metadata.Annotations[enabledAnn] == "true" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- var rawOrigin = ingress.Metadata.Annotations[prefix + "/cors-allow-origin"] -%}
          {%- if rawOrigin == "" -%}{%- rawOrigin = "*" -%}{%- end -%}
          {%- var methods = ingress.Metadata.Annotations[prefix + "/cors-allow-methods"] -%}
          {%- if methods == "" -%}{%- methods = "GET, PUT, POST, DELETE, PATCH, OPTIONS" -%}{%- end -%}
          {%- var headers = ingress.Metadata.Annotations[prefix + "/cors-allow-headers"] -%}
          {%- if headers == "" -%}{%- headers = "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" -%}{%- end -%}
          {%- var credentials = ingress.Metadata.Annotations[prefix + "/cors-allow-credentials"] == "true" -%}
          {%- var exposeHeaders = ingress.Metadata.Annotations[prefix + "/cors-expose-headers"] -%}
          {%- var maxAge = ingress.Metadata.Annotations[prefix + "/cors-max-age"] -%}
          {%- if maxAge == "" -%}{%- maxAge = defaultMaxAge -%}{%- end -%}
          {%- var corsInj = "" -%}
          {%- for _, cv := range []string{methods, headers, maxAge, exposeHeaders} -%}
            {%- if corsInj == "" -%}{%- corsInj = ConfigInjectionKind(cv, "line") -%}{%- end -%}
          {%- end -%}
          {%- if corsInj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Ingress " + key + " has a CORS annotation value containing " + corsInj + "; CORS is not applied. Remove control characters from the cors-allow-methods/-headers/-max-age/-expose-headers values.") -}}
            {%- return -%}
          {%- end -%}
          {%- var allowAny = false -%}
          {%- var exact = []string{} -%}
          {%- var regexes = []string{} -%}
          {%- for _, tok := range split(rawOrigin, ",") -%}
            {%- var o = strip(tok) -%}
            {%- if o == "" -%}{%- continue -%}{%- end -%}
            {%- if o == "*" -%}{%- allowAny = true -%}{%- break -%}{%- end -%}
            {%- if !regex_search(o, "^([a-z]+://(\\*\\.)?[A-Za-z0-9\\-.]*(:[0-9]+)?|null)$") -%}
              {{- fail("Invalid CORS origin '" + o + "' in annotation '" + prefix + "/cors-allow-origin' on Ingress '" + key + "' — must be scheme://host[:port], scheme://*.host[:port], null, or *.") -}}
            {%- end -%}
            {%- if strings_contains(o, "*") -%}
              {%- regexes = append(regexes, replace(sanitize_regex(o), "\\*", "[A-Za-z0-9\\-]+") + "$") -%}
            {%- else -%}
              {%- exact = append(exact, o) -%}
            {%- end -%}
          {%- end -%}
          {{- PublishCORS(key, family, allowAny, exact, regexes, methods, headers, maxAge, credentials, exposeHeaders, !allowAny, 1) -}}
        {%- end -%}
      {%- end macro -%}

  # One route's rows for the CORS lane. The routes row is
  # "<family>:<any|list> <credentials> <vary> <regex> <preflight>" (flags 0/1;
  # preflight 1 answers OPTIONS with an allowed Origin and a request-method
  # header, 2 answers every OPTIONS); regexes are matched from "<offset>" on
  # against "<route id>|<Origin>"; header values are URL-encoded and read
  # back with url_dec(1).
  util-cors-publish:
    template: |-
      {%- macro PublishCORS(rid string, family string, allowAny bool, exact []string, regexes []string, methods string, headers string, maxAge string, credentials bool, expose string, vary bool, preflight int) -%}
        {%- var mode = "list" -%}{%- if allowAny -%}{%- mode = "any" -%}{%- end -%}
        {%- var cred = "0" -%}{%- if credentials -%}{%- cred = "1" -%}{%- end -%}
        {%- var v = "0" -%}{%- if vary -%}{%- v = "1" -%}{%- end -%}
        {%- var re = "0" -%}{%- if len(regexes) > 0 -%}{%- re = "1" -%}{%- end -%}
        {{- shared.Publish(family, "any", "any") -}}
        {{- shared.Publish("route", rid, rid + " " + family + ":" + mode + " " + cred + " " + v + " " + re + " " + tostring(preflight)) -}}
        {%- for _, o := range exact -%}
          {{- shared.Publish("origin", rid + "|" + o, rid + "|" + o + " 1") -}}
        {%- end -%}
        {%- for i, r := range regexes -%}
          {{- shared.Publish("regex", rid + "#" + tostring(i), "^" + sanitize_regex(rid) + "\\|" + r + " 1") -}}
        {%- end -%}
        {{- shared.Publish("methods", rid, rid + " " + queryEscape(methods)) -}}
        {%- if headers != "" -%}{{- shared.Publish("headers", rid, rid + " " + queryEscape(headers)) -}}{%- end -%}
        {%- if maxAge != "" -%}{{- shared.Publish("maxage", rid, rid + " " + queryEscape(maxAge)) -}}{%- end -%}
        {%- if expose != "" -%}{{- shared.Publish("expose", rid, rid + " " + queryEscape(expose)) -}}{%- end -%}
      {%- end macro -%}

  # Renders every family's publisher (ingress-cors-<band>-<library>, plus the
  # declaration below) in one sorted pass: a shared incremental group must
  # render its members in canonical order.
  features-200-ingress-cors:
    template: '{{- render_glob "ingress-cors-*" -}}'

  ingress-cors-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-cors
      effects: [publishValue]
    template: '{{- "" -}}'

  # The CORS lane, one block per family at the band its per-route fragments
  # had. Seven shared maps keyed by route id (built once per render); an
  # exact-origin route costs two tree lookups, a wildcard route one map_reg
  # scan over the wildcard rows. Emitted only while a route of the family
  # uses CORS; the first one reloads once, as does removing the last. Vary is
  # add-header, never set-header: a comma-combinable list (RFC 9110) that the
  # origin and a cache tier also contribute to.
  util-cors-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro CorsLane(family string) -%}
        {%- if incremental_value_count("ingress-cors", family) > 0 -%}
          {%%
            var mapsVal, _ = shared.ComputeIfAbsent("ingressCorsMaps", func() any {
              var lines = func(key string) []string {
                var rows = []any{}
                for _, v := range incremental_values("ingress-cors", key) {
                  rows = append(rows, tostring(v))
                }
                var out = []string{}
                for _, r := range sort_strings(rows) {
                  out = append(out, tostring(r))
                }
                return out
              }
              return map[string]any{
                "routes": RegisterMap("ing-cors-routes.map", lines("route"), map[string]any{"ordered": false}),
                "origins": RegisterMap("ing-cors-origins.map", lines("origin"), map[string]any{"ordered": false}),
                "regex": RegisterMap("ing-cors-regex.map", lines("regex"), map[string]any{"ordered": false}),
                "methods": RegisterMap("ing-cors-methods.map", lines("methods"), map[string]any{"ordered": false}),
                "headers": RegisterMap("ing-cors-headers.map", lines("headers"), map[string]any{"ordered": false}),
                "maxage": RegisterMap("ing-cors-maxage.map", lines("maxage"), map[string]any{"ordered": false}),
                "expose": RegisterMap("ing-cors-expose.map", lines("expose"), map[string]any{"ordered": false}),
              }
            })
            var maps = mapsVal.(map[string]any)
            var v = "txn." + family + "_cors"
          %%}
      # {{ family }}/cors
      http-request set-var({{ v }}) var(txn.resource_key),map({{ maps["routes"] }})
      http-request set-var({{ v }}_origin) req.hdr(Origin) if { var({{ v }}) -m beg "{{ family }}:" }
      http-request set-var({{ v }}_ok) str(1) if { var({{ v }}) -m beg "{{ family }}:any" } { var({{ v }}_origin) -m found }
      http-request set-var({{ v }}_ok) str(1) if { var({{ v }}) -m beg "{{ family }}:list" } { var(txn.resource_key),concat(|,{{ v }}_origin),map({{ maps["origins"] }}) -m found }
      http-request set-var({{ v }}_ok) str(1) if { var({{ v }}),field(4,' ') -m str 1 } !{ var({{ v }}_ok) -m found } { var(txn.resource_key),concat(|,{{ v }}_origin),map_reg({{ maps["regex"] }}) -m found }
      http-request return status 204 if { var({{ v }}),field(5,' ') -m str 1 } { var({{ v }}_ok) -m found } METH_OPTIONS { req.hdr(Access-Control-Request-Method) -m found }
      http-request return status 204 if { var({{ v }}),field(5,' ') -m str 2 } METH_OPTIONS
      http-after-response set-header Access-Control-Allow-Origin '*' if { var({{ v }}_ok) -m found } { var({{ v }}) -m beg "{{ family }}:any" }
      http-after-response set-header Access-Control-Allow-Origin '%[var({{ v }}_origin)]' if { var({{ v }}_ok) -m found } { var({{ v }}) -m beg "{{ family }}:list" }
      http-after-response set-header Access-Control-Allow-Methods %[var(txn.resource_key),map({{ maps["methods"] }}),url_dec(1)] if { var({{ v }}_ok) -m found }
      http-after-response set-header Access-Control-Allow-Headers %[var(txn.resource_key),map({{ maps["headers"] }}),url_dec(1)] if { var({{ v }}_ok) -m found } { var(txn.resource_key),map({{ maps["headers"] }}) -m found }
      http-after-response set-header Access-Control-Max-Age %[var(txn.resource_key),map({{ maps["maxage"] }}),url_dec(1)] if { var({{ v }}_ok) -m found } { var(txn.resource_key),map({{ maps["maxage"] }}) -m found }
      http-after-response set-header Access-Control-Allow-Credentials 'true' if { var({{ v }}_ok) -m found } { var({{ v }}),field(2,' ') -m str 1 }
      http-after-response set-header Access-Control-Expose-Headers %[var(txn.resource_key),map({{ maps["expose"] }}),url_dec(1)] if { var({{ v }}_ok) -m found } { var(txn.resource_key),map({{ maps["expose"] }}) -m found }
      http-after-response add-header Vary Origin if { var({{ v }}_ok) -m found } { var({{ v }}),field(3,' ') -m str 1 }
        {%- end -%}
      {%- end macro -%}

  # X-Forwarded-For from a per-route map: ing-xff-routes.map holds
  # "<route id>" -> "<family>:<add|update|ifmissing>" (ignore publishes
  # nothing). strict refuses an unknown value; haproxy-ingress treats it as
  # add, as upstream does.
  util-forwardfor-publish:
    template: |-
      {%- macro PublishForwardFor(ingress *resources.ingresses.T, annotation string, family string, strict bool) -%}
        {%- var mode = ingress.Metadata.Annotations[annotation] -%}
        {%- if mode != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if mode != "add" && mode != "update" && mode != "ifmissing" && mode != "ignore" -%}
            {%- if strict -%}
              {{- fail("Invalid value '" + mode + "' for annotation '" + annotation + "' on Ingress '" + key + "'. Valid values: add, update, ifmissing, ignore") -}}
            {%- end -%}
            {%- mode = "add" -%}
          {%- end -%}
          {%- if mode != "ignore" -%}
            {{- shared.Publish(family, "any", "any") -}}
            {{- shared.Publish("route", key, key + " " + family + ":" + mode) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-forwardfor:
    template: '{{- render_glob "ingress-forwardfor-*" -}}'

  ingress-forwardfor-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-forwardfor
      effects: [publishValue]
    template: '{{- "" -}}'

  util-forwardfor-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro ForwardForLane(family string) -%}
        {%- if incremental_value_count("ingress-forwardfor", family) > 0 -%}
          {%%
            var routesVal, _ = shared.ComputeIfAbsent("ingressForwardForMap", func() any {
            var lines = func(key string) []string {
              var rows = []any{}
              for _, v := range incremental_values("ingress-forwardfor", key) {
                rows = append(rows, tostring(v))
              }
              var out = []string{}
              for _, r := range sort_strings(rows) {
                out = append(out, tostring(r))
              }
              return out
            }
              return RegisterMap("ing-xff-routes.map", lines("route"), map[string]any{"ordered": false})
            })
            var routes = tostring(routesVal)
          %%}
      # {{ family }}/forwardfor
      http-request set-var(txn.{{ family }}_xff) var(txn.resource_key),map({{ routes }})
      http-request add-header X-Forwarded-For %[src] if { var(txn.{{ family }}_xff) -m str "{{ family }}:add" }
      http-request set-header X-Forwarded-For %[src] if { var(txn.{{ family }}_xff) -m str "{{ family }}:update" }
      http-request set-header X-Forwarded-For %[src] if { var(txn.{{ family }}_xff) -m str "{{ family }}:ifmissing" } !{ req.hdr(X-Forwarded-For) -m found }
        {%- end -%}
      {%- end macro -%}

  # Client address from a trusted request header (set-src) from a per-route
  # map: ing-src-ip-routes.map holds "<route id>" -> "<family>:<Header>".
  # hdr() takes a literal, so the lane emits one set-src per distinct header
  # name of the family: a new name reloads once, a route on a known name is a
  # map edit. Callers validate the name (set-src must fail closed).
  util-src-ip-publish:
    template: |-
      {%- macro PublishSrcIPHeader(key string, header string, family string) -%}
        {{- shared.Publish(family, "any", "any") -}}
        {{- shared.Publish("route", key, key + " " + family + ":" + header) -}}
        {{- shared.Publish("name", family + ":" + header, family + ":" + header) -}}
      {%- end macro -%}

  features-200-ingress-src-ip:
    template: '{{- render_glob "ingress-src-ip-*" -}}'

  ingress-src-ip-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-src-ip
      effects: [publishValue]
    template: '{{- "" -}}'

  util-src-ip-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro SrcIPHeaderLane(family string) -%}
        {%- if incremental_value_count("ingress-src-ip", family) > 0 -%}
          {%%
            var routesVal, _ = shared.ComputeIfAbsent("ingressSrcIPMap", func() any {
            var lines = func(key string) []string {
              var rows = []any{}
              for _, v := range incremental_values("ingress-src-ip", key) {
                rows = append(rows, tostring(v))
              }
              var out = []string{}
              for _, r := range sort_strings(rows) {
                out = append(out, tostring(r))
              }
              return out
            }
              return RegisterMap("ing-src-ip-routes.map", lines("route"), map[string]any{"ordered": false})
            })
            var routes = tostring(routesVal)
            var names = []any{}
            for _, v := range incremental_values("ingress-src-ip", "name") {
              if hasPrefix(tostring(v), family + ":") {
                names = append(names, tostring(v))
              }
            }
          %%}
      # {{ family }}/src-ip-header
          {%- for _, n := range sort_strings(names) %}
      http-request set-src hdr({{ tostring(n)[len(family)+1:] }}) if { var(txn.resource_key),map({{ routes }}) -m str "{{ n }}" }
          {%- end %}
        {%- end -%}
      {%- end macro -%}

  # Upstream Set-Cookie Domain/Path rewriting ("<from> <to>", the ingress-nginx
  # proxy_cookie_* model) from a per-pair lane: the rewrite is a regex with
  # both literals in it, so ing-cookie-rewrite-routes.map holds
  # "<route id>|<family>|<Kind>|<from>|<to>" -> 1 and the block emits one
  # replace-header per distinct pair of the family, gated on the row. A route on
  # a known pair is a map edit; a new pair reloads once. strict refuses a bad
  # arity at admission (haptic); nginx warns and skips, as before.
  util-cookie-rewrite-publish:
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- macro PublishCookieRewrite(ingress *resources.ingresses.T, domainAnnotation string, pathAnnotation string, family string) -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- for _, kind := range []string{"Domain", "Path"} -%}
          {%- var annotation = domainAnnotation -%}
          {%- if kind == "Path" -%}{%- annotation = pathAnnotation -%}{%- end -%}
          {%- var value = ingress.Metadata.Annotations[annotation] -%}
          {%- if value != "" -%}
            {%- var parts = split(strip(value), " ") -%}
            {%- if len(parts) != 2 -%}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation '" + annotation + "' on Ingress '" + key + "' must be two space-separated values '<from> <to>'; got '" + value + "'.") -}}
            {%- else -%}
              {%- var from = ValidateConfigValue(parts[0], annotation, key, false) -%}
              {%- var to = ValidateConfigValue(parts[1], annotation, key, false) -%}
              {%- if strings_contains(from + to, "|") -%}
                {{- fail("Invalid value for annotation '" + annotation + "' on Ingress '" + key + "': '|' is not allowed in the from/to pair.") -}}
              {%- end -%}
              {%- var pair = family + "|" + kind + "|" + from + "|" + to -%}
              {{- shared.Publish(family, "any", "any") -}}
              {{- shared.Publish("pair", pair, pair) -}}
              {{- shared.Publish("route", key + "|" + pair, key + "|" + pair + " 1") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-cookie-rewrite:
    template: '{{- render_glob "ingress-cookie-rewrite-*" -}}'

  ingress-cookie-rewrite-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-cookie-rewrite
      effects: [publishValue]
    template: '{{- "" -}}'

  util-cookie-rewrite-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro CookieRewriteLane(family string) -%}
        {%- if incremental_value_count("ingress-cookie-rewrite", family) > 0 -%}
          {%%
            var routesVal, _ = shared.ComputeIfAbsent("ingressCookieRewriteMap", func() any {
              var rows = []any{}
              for _, v := range incremental_values("ingress-cookie-rewrite", "route") {
                rows = append(rows, tostring(v))
              }
              var lines = []string{}
              for _, r := range sort_strings(rows) {
                lines = append(lines, tostring(r))
              }
              return RegisterMap("ing-cookie-rewrite-routes.map", lines, map[string]any{"ordered": false})
            })
            var routes = tostring(routesVal)
            var pairs = []any{}
            for _, v := range incremental_values("ingress-cookie-rewrite", "pair") {
              if hasPrefix(tostring(v), family + "|") {
                pairs = append(pairs, tostring(v))
              }
            }
          %%}
      {{ "\n" }}# {{ family }}/cookie-rewrite
          {%- for _, p := range sort_strings(pairs) %}
            {%- var f = split(tostring(p), "|") %}
      http-response replace-header Set-Cookie (.*){{ f[1] }}={{ f[2] }}(.*) \1{{ f[1] }}={{ f[3] }}\2 if { var(txn.resource_key),concat(|{{ p }}),map({{ routes }}) -m found }
          {%- end %}
        {%- end -%}
      {%- end macro -%}

  # Upstream Location/Refresh rewriting (the ingress-nginx proxy_redirect model:
  # a literal "from", regex-escaped, and a replacement "to") from the same
  # per-pair lane shape: ing-location-rewrite-routes.map holds
  # "<route id>|<family>|<from>|<to>" -> 1. "default" has no HAProxy
  # equivalent and records an Event; "off" or unset publishes nothing.
  util-location-rewrite-publish:
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- macro PublishLocationRewrite(ingress *resources.ingresses.T, fromAnn string, toAnn string, family string, strict bool) -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var from = ingress.Metadata.Annotations[fromAnn] -%}
        {%- var to = ingress.Metadata.Annotations[toAnn] -%}
        {%- if from == "default" -%}
          {{- recordEvent(ingress, "UnsupportedAnnotationValue", "Annotation '" + fromAnn + "=default' on Ingress '" + key + "' is not supported: HAProxy has no proxy_pass-derived rewrite. Specify an explicit from/to pair.") -}}
        {%- else if from != "" && from != "off" -%}
          {%- if to == "" -%}
            {%- if strict -%}
              {{- fail("Annotation '" + fromAnn + "' on Ingress '" + key + "' requires '" + toAnn + "'.") -}}
            {%- else -%}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Annotation '" + fromAnn + "' on Ingress '" + key + "' requires '" + toAnn + "'; the Location rewrite is skipped.") -}}
            {%- end -%}
          {%- else -%}
            {%- var f = ValidateConfigValue(from, fromAnn, key, false) -%}
            {%- var t = ValidateConfigValue(to, toAnn, key, false) -%}
            {%- if strings_contains(f + t, "|") -%}
              {{- fail("Invalid value for annotation '" + fromAnn + "' or '" + toAnn + "' on Ingress '" + key + "': '|' is not allowed in the from/to pair.") -}}
            {%- end -%}
            {%- var pair = family + "|" + f + "|" + t -%}
            {{- shared.Publish(family, "any", "any") -}}
            {{- shared.Publish("pair", pair, pair) -}}
            {{- shared.Publish("route", key + "|" + pair, key + "|" + pair + " 1") -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-location-rewrite:
    template: '{{- render_glob "ingress-location-rewrite-*" -}}'

  ingress-location-rewrite-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-location-rewrite
      effects: [publishValue]
    template: '{{- "" -}}'

  util-location-rewrite-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro LocationRewriteLane(family string) -%}
        {%- if incremental_value_count("ingress-location-rewrite", family) > 0 -%}
          {%%
            var routesVal, _ = shared.ComputeIfAbsent("ingressLocationRewriteMap", func() any {
              var rows = []any{}
              for _, v := range incremental_values("ingress-location-rewrite", "route") {
                rows = append(rows, tostring(v))
              }
              var lines = []string{}
              for _, r := range sort_strings(rows) {
                lines = append(lines, tostring(r))
              }
              return RegisterMap("ing-location-rewrite-routes.map", lines, map[string]any{"ordered": false})
            })
            var routes = tostring(routesVal)
            var pairs = []any{}
            for _, v := range incremental_values("ingress-location-rewrite", "pair") {
              if hasPrefix(tostring(v), family + "|") {
                pairs = append(pairs, tostring(v))
              }
            }
          %%}
      {{ "\n" }}# {{ family }}/location-rewrite
          {%- for _, p := range sort_strings(pairs) %}
            {%- var f = split(tostring(p), "|") %}
      http-response replace-header Location {{ sanitize_regex(f[1]) }} {{ f[2] }} if { var(txn.resource_key),concat(|{{ p }}),map({{ routes }}) -m found }
      http-response replace-header Refresh {{ sanitize_regex(f[1]) }} {{ f[2] }} if { var(txn.resource_key),concat(|{{ p }}),map({{ routes }}) -m found }
          {%- end %}
        {%- end -%}
      {%- end macro -%}

  # Vendor per-source rate limits — nginx-ingress limit-rps/-rpm/-connections,
  # haproxy-ingress limit-rps/-rpm, haproxytech rate-limit-requests — from one
  # frontend lane. Each vendor kept a stick-table in the route's backend, which
  # made that backend structural; the counters now live in shared table proxies
  # keyed "<route id>|<src>", so a budget is still per route and per client.
  # ing-rl-routes.map: "<route id>" → "<req|conn> <window> <threshold> <status>".
  # A route on a window and status that already exist is a map edit; a new
  # window, table size or status reloads once. sc0 is the slot this lane owns
  # (the HAPTIC-native limiter at 863 owns sc1) and an Ingress carrying two
  # families' annotations is refused, so no route is tracked twice.
  util-rate-limit-publish:
    template: |-
      {%- macro PublishRateLimit(key string, counter string, window string, sizeBytes string, threshold string, status string, allowCidrs string) -%}
        {{- shared.Publish("route", key, key + " " + counter + " " + window + " " + threshold + " " + status) -}}
        {{- shared.Publish("tables", counter + "|" + window + "|" + sizeBytes, counter + "|" + window + "|" + sizeBytes) -}}
        {{- shared.Publish("status", status, status) -}}
        {%- if allowCidrs != "" -%}{{- shared.Publish("allowlist", key, key + " " + allowCidrs) -}}{%- end -%}
      {%- end macro -%}

  # Renders every vendor's publisher (ingress-rate-limit-<band>-<library>, plus
  # the declaration below) in one sorted pass: a shared incremental group must
  # render its members in canonical order.
  features-200-ingress-rate-limit:
    template: '{{- render_glob "ingress-rate-limit-*" -}}'

  ingress-rate-limit-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-rate-limit
      effects: [publishValue]
    template: '{{- "" -}}'

  # The lane's three maps, registered once per render: the route table and the
  # allowlist pair, whose shape is the access-control lane's (map_ip over the
  # disjoint cover of every list, then membership per route).
  util-rate-limit-maps:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro RateLimitMaps(result map[string]any) -%}
        {%%
          var mapsVal, _ = shared.ComputeIfAbsent("ingressRateLimitMaps", func() any {
            var lists = []any{}
            var cidrs = []any{}
            for _, v := range incremental_values("ingress-rate-limit", "allowlist") {
              lists = append(lists, tostring(v))
              for _, c := range split(strings_splitn(tostring(v), " ", 2)[1], " ") {
                cidrs = append(cidrs, c)
              }
            }
            var blocks, err = cidr_partition(cidrs)
            if err != nil {
              fail(tostring(err))
            }
            var seen = map[string]bool{}
            var partitions = []any{}
            for _, list := range blocks {
              for _, b := range list {
                if !seen[b] {
                  seen[b] = true
                  partitions = append(partitions, b)
                }
              }
            }
            var partitionLines = []string{}
            for _, b := range sort_strings(partitions) {
              partitionLines = append(partitionLines, tostring(b) + " " + tostring(b))
            }
            var memberSeen = map[string]bool{}
            var members = []any{}
            for _, r := range lists {
              var parts = strings_splitn(tostring(r), " ", 2)
              for _, c := range split(parts[1], " ") {
                for _, b := range blocks[c] {
                  var line = b + "|" + parts[0] + " 1"
                  if !memberSeen[line] {
                    memberSeen[line] = true
                    members = append(members, line)
                  }
                }
              }
            }
            var memberLines = []string{}
            for _, l := range sort_strings(members) {
              memberLines = append(memberLines, tostring(l))
            }
            var routes = []any{}
            for _, v := range incremental_values("ingress-rate-limit", "route") {
              routes = append(routes, tostring(v))
            }
            var routeLines = []string{}
            for _, r := range sort_strings(routes) {
              routeLines = append(routeLines, tostring(r))
            }
            return map[string]any{
              "routes": RegisterMap("ing-rl-routes.map", routeLines, map[string]any{"ordered": false}),
              "partitions": RegisterMap("ing-rl-allow-partitions.map", partitionLines, map[string]any{"ordered": false}),
              "members": RegisterMap("ing-rl-allow-members.map", memberLines, map[string]any{"ordered": false}),
            }
          })
          var maps = mapsVal.(map[string]any)
          result["routes"] = maps["routes"]
          result["partitions"] = maps["partitions"]
          result["members"] = maps["members"]
        %%}
      {%- end macro -%}

  # The allowlist verdict, ahead of the limiter: the block of the disjoint cover
  # the client falls in, then whether the route exempts it.
  frontend-filters-089-ingress-rate-limit-allowlist:
    requires: [ingresses]
    template: |
      {%- import "util-rate-limit-maps" for RateLimitMaps -%}
      {%- if incremental_value_count("ingress-rate-limit", "allowlist") > 0 -%}
      {%- var maps = map[string]any{} -%}
      {{- RateLimitMaps(maps) -}}
      {{ "\n" }}# ingress/rate-limit-allowlist
      http-request set-var(txn.vrl_allow_block) src,map_ip({{ maps["partitions"] }}) if { var(txn.resource_key) -m found }
      http-request set-var(txn.vrl_allow) bool(true) if { var(txn.vrl_allow_block) -m found } { var(txn.vrl_allow_block),concat(|,txn.resource_key),map({{ maps["members"] }}) -m found }
      {%- end %}

  # One table proxy per distinct (counter, window), sized by the largest request:
  # a frontend holds at most one stick-table of its own, and the window is part
  # of the store type. `peers localinstance` carries the counters from the old
  # worker to the new one on reload, as the per-backend tables did.
  backends-812-ingress-rate-limit-tables:
    template: |
      {%- import "util-backend" for Backend -%}
      {%- var tables = map[string]int{} -%}
      {%- for _, rowAny := range incremental_values("ingress-rate-limit", "tables") -%}
        {%- var parts = split(tostring(rowAny), "|") -%}
        {%- var name = parts[0] + "|" + parts[1] -%}
        {%- var n = toint(parts[2]) -%}
        {%- if n > tables[name] -%}{%- tables[name] = n -%}{%- end -%}
      {%- end -%}
      {%- var names = []any{} -%}
      {%- for name := range tables -%}{%- names = append(names, name) -%}{%- end -%}
      {%- for _, nameAny := range sort_strings(names) %}
        {%- var name = tostring(nameAny) %}
        {%- var parts = split(name, "|") %}
        {%- var store = "conn_cur" %}
        {%- if parts[0] == "req" %}{%- store = "http_req_rate(" + parts[1] + ")" %}{%- end %}
      {{ "\n" }}{{ Backend(map[string]any{
           "name": "ing_rl_tbl_" + parts[0] + "_" + parts[1],
           "comments": []any{"# ingress/rate-limiting shared table (" + parts[0] + ", " + parts[1] + ")"},
           "body": []any{"stick-table type string len 340 size " + tostring(tables[name]) + " expire " + parts[1] + " store " + store + " peers localinstance"},
         }) }}
      {%- end %}

  # The limiter itself: the route's counter, window, threshold and status come
  # from the map, so only the distinct windows (a track rule each) and statuses
  # (a deny each) are spelled out. Runs on the client leg before the cache
  # switch (865), like the HAPTIC-native limiter, so a cache hit and a miss
  # consume the same budget — the per-backend tables only saw misses.
  frontend-filters-863-ingress-rate-limit:
    requires: [ingresses]
    template: |
      {%- import "util-rate-limit-maps" for RateLimitMaps -%}
      {%- if incremental_value_count("ingress-rate-limit", "tables") > 0 -%}
      {%- var maps = map[string]any{} -%}
      {{- RateLimitMaps(maps) -}}
      {%- var windows = []any{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- for _, v := range incremental_values("ingress-rate-limit", "tables") -%}
        {%- var parts = split(tostring(v), "|") -%}
        {%- var name = parts[0] + "|" + parts[1] -%}
        {%- if !seen[name] -%}{%- seen[name] = true -%}{%- windows = append(windows, name) -%}{%- end -%}
      {%- end -%}
      {%- var statuses = []any{} -%}
      {%- for _, v := range incremental_values("ingress-rate-limit", "status") -%}{%- statuses = append(statuses, tostring(v)) -%}{%- end -%}
      {{ "\n" }}# ingress/rate-limiting
      http-request set-var(txn.vrl_cfg) var(txn.resource_key),map({{ maps["routes"] }})
      http-request set-var(txn.vrl_counter) var(txn.vrl_cfg),field(1,' ') if { var(txn.vrl_cfg) -m found }
      http-request set-var(txn.vrl_window) var(txn.vrl_cfg),field(2,' ') if { var(txn.vrl_cfg) -m found }
      http-request set-var(txn.vrl_threshold) var(txn.vrl_cfg),field(3,' ') if { var(txn.vrl_cfg) -m found }
      http-request set-var(txn.vrl_status) var(txn.vrl_cfg),field(4,' ') if { var(txn.vrl_cfg) -m found }
      http-request set-var-fmt(txn.vrl_key) %[var(txn.resource_key)]|%[src] if { var(txn.vrl_cfg) -m found }
      {%- for _, t := range sort_strings(windows) %}
        {%- var parts = split(tostring(t), "|") %}
      http-request track-sc0 var(txn.vrl_key) table ing_rl_tbl_{{ parts[0] }}_{{ parts[1] }} if { var(txn.vrl_counter) -m str {{ parts[0] }} } { var(txn.vrl_window) -m str {{ parts[1] }} }
      {%- end %}
      http-request set-var(txn.denied_by) str(rate_limit_local) if { var(txn.vrl_counter) -m str req } { sc_http_req_rate(0),sub(txn.vrl_threshold) -m int gt 0 } !{ var(txn.vrl_allow) -m bool }
      http-request set-var(txn.denied_by) str(rate_limit_connections) if { var(txn.vrl_counter) -m str conn } { sc_conn_cur(0),sub(txn.vrl_threshold) -m int gt 0 } !{ var(txn.vrl_allow) -m bool }
      {%- for _, s := range sort_strings(statuses) %}
      http-request deny deny_status {{ s }} if { var(txn.vrl_status) -m str {{ s }} } { var(txn.denied_by) -m str rate_limit_local rate_limit_connections }
      {%- end %}
      {%- end %}

  # satisfy=any — the combined address-or-authentication gate, from one frontend
  # lane. The gate was a pair of backend rules (an `acl … src <cidrs>` plus a
  # conditional `http-request auth`), which made every satisfy route structural.
  # `auth realm` and `http_auth()` take literals only, so the lane emits one
  # challenge per distinct (userlist, realm) pair, selected by a membership row:
  # ing-satisfy-routes.map holds "<route id>|<family>|<userlist>|<realm>" → 1.
  # The address half is the access-control lane's shape — map_ip over the
  # disjoint cover of every list, then per-route membership — so a route on an
  # existing pair is a map edit and editing a list is a map operation.
  # A list carrying an IPv6 entry cannot be partitioned; those routes keep the
  # backend gate, and the publisher says so by returning "ipv6".
  util-satisfy-publish:
    template: |-
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- macro PublishSatisfyAny(key string, allowlist string, allowAnnotation string, family string, userlist string, realm string) string -%}
        {%- var cidrs = ValidateCidrList(allowlist, allowAnnotation, key) -%}
        {%- if strings_contains(cidrs, ":") -%}
          {{- "ipv6" -}}
        {%- else -%}
          {%- if strings_contains(userlist + realm, "|") -%}
            {{- fail("Invalid auth realm '" + realm + "' on Ingress '" + key + "': '|' is not allowed in a satisfy=any realm.") -}}
          {%- end -%}
          {%- var pair = family + "|" + userlist + "|" + realm -%}
          {{- shared.Publish(family, "any", "any") -}}
          {{- shared.Publish("pair", pair, pair) -}}
          {{- shared.Publish("route", key + "|" + pair, key + "|" + pair + " 1") -}}
          {{- shared.Publish("allowlist", key, key + " " + cidrs) -}}
          {{- "" -}}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-satisfy:
    template: '{{- render_glob "ingress-satisfy-*" -}}'

  ingress-satisfy-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-satisfy
      effects: [publishValue]
    template: '{{- "" -}}'

  util-satisfy-maps:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro SatisfyMaps(result map[string]any) -%}
        {%%
          var mapsVal, _ = shared.ComputeIfAbsent("ingressSatisfyMaps", func() any {
            var lists = []any{}
            var cidrs = []any{}
            for _, v := range incremental_values("ingress-satisfy", "allowlist") {
              lists = append(lists, tostring(v))
              for _, c := range split(strings_splitn(tostring(v), " ", 2)[1], " ") {
                cidrs = append(cidrs, c)
              }
            }
            var blocks, err = cidr_partition(cidrs)
            if err != nil {
              fail(tostring(err))
            }
            var seen = map[string]bool{}
            var partitions = []any{}
            for _, list := range blocks {
              for _, b := range list {
                if !seen[b] {
                  seen[b] = true
                  partitions = append(partitions, b)
                }
              }
            }
            var partitionLines = []string{}
            for _, b := range sort_strings(partitions) {
              partitionLines = append(partitionLines, tostring(b) + " " + tostring(b))
            }
            var memberSeen = map[string]bool{}
            var members = []any{}
            for _, r := range lists {
              var parts = strings_splitn(tostring(r), " ", 2)
              for _, c := range split(parts[1], " ") {
                for _, b := range blocks[c] {
                  var line = b + "|" + parts[0] + " 1"
                  if !memberSeen[line] {
                    memberSeen[line] = true
                    members = append(members, line)
                  }
                }
              }
            }
            var memberLines = []string{}
            for _, l := range sort_strings(members) {
              memberLines = append(memberLines, tostring(l))
            }
            var routes = []any{}
            for _, v := range incremental_values("ingress-satisfy", "route") {
              routes = append(routes, tostring(v))
            }
            var routeLines = []string{}
            for _, r := range sort_strings(routes) {
              routeLines = append(routeLines, tostring(r))
            }
            return map[string]any{
              "routes": RegisterMap("ing-satisfy-routes.map", routeLines, map[string]any{"ordered": false}),
              "partitions": RegisterMap("ing-satisfy-allow-partitions.map", partitionLines, map[string]any{"ordered": false}),
              "members": RegisterMap("ing-satisfy-allow-members.map", memberLines, map[string]any{"ordered": false}),
            }
          })
          var maps = mapsVal.(map[string]any)
          result["routes"] = maps["routes"]
          result["partitions"] = maps["partitions"]
          result["members"] = maps["members"]
        %%}
      {%- end macro -%}

  # SatisfyLane(family, deniedBy): the family's challenge rules. deniedBy is the
  # txn.denied_by marker the family recorded on its backend gate, or "" for a
  # family that recorded none — the log field is the only reason it differs.
  util-satisfy-lane:
    template: |-
      {%- import "util-satisfy-maps" for SatisfyMaps -%}
      {%- macro SatisfyLane(family string, deniedBy string) -%}
        {%- if incremental_value_count("ingress-satisfy", family) > 0 -%}
          {%- var maps = map[string]any{} -%}
          {{- SatisfyMaps(maps) -}}
          {%- var pairs = []any{} -%}
          {%- for _, v := range incremental_values("ingress-satisfy", "pair") -%}
            {%- if hasPrefix(tostring(v), family + "|") -%}{%- pairs = append(pairs, tostring(v)) -%}{%- end -%}
          {%- end -%}
          {%- var v = "txn." + family + "_sat_allow" -%}
      {{ "\n" }}# {{ family }}/satisfy-any
      http-request set-var({{ v }}_block) src,map_ip({{ maps["partitions"] }}) if { var(txn.resource_key) -m found }
      http-request set-var({{ v }}) bool(true) if { var({{ v }}_block) -m found } { var({{ v }}_block),concat(|,txn.resource_key),map({{ maps["members"] }}) -m found }
          {%- for _, p := range sort_strings(pairs) %}
            {%- var parts = split(tostring(p), "|") %}
            {%- var cond = "{ var(txn.resource_key),concat(|" + tostring(p) + "),map(" + tostring(maps["routes"]) + ") -m found } !{ var(" + v + ") -m bool } !{ http_auth(" + parts[1] + ") }" %}
            {%- if deniedBy != "" %}
      http-request set-var(txn.denied_by) str({{ deniedBy }}) if {{ cond }}
            {%- end %}
      http-request auth realm "{{ parts[2] }}" if {{ cond }}
          {%- end %}
        {%- end -%}
      {%- end macro -%}

  util-byte-size:
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- macro ByteSize(value string, annotation string, key string) string -%}
        {%- if !regex_search(value, "^[0-9]+[kKmMgG]?$") -%}
          {{- fail("Invalid value '" + value + "' for annotation '" + annotation + "' on Ingress '" + key + "'. Expected a byte size like '100k', '1m'.") -}}
        {%- end -%}
        {%- var digits = value -%}
        {%- if !regex_search(value, "^[0-9]+$") -%}{%- digits = value[0:len(value)-1] -%}{%- end -%}
        {%- var factor = 1 -%}
        {%- if hasSuffix(value, "k") || hasSuffix(value, "K") -%}{%- factor = 1024 -%}{%- end -%}
        {%- if hasSuffix(value, "m") || hasSuffix(value, "M") -%}{%- factor = 1048576 -%}{%- end -%}
        {%- if hasSuffix(value, "g") || hasSuffix(value, "G") -%}{%- factor = 1073741824 -%}{%- end -%}
        {%- var n = toint(digits) -%}
        {%- if n <= 0 -%}
          {{- fail("Invalid value '" + value + "' for annotation '" + annotation + "' on Ingress '" + key + "'. Must be a positive byte size.") -}}
        {%- end -%}
        {#- Bound the magnitude BEFORE multiplying. The product is a native
            64-bit int, so an unbounded value wraps: `17179869185g` is 2^64 +
            2^30, which lands on exactly 1 GiB and would ship a wrong throttle
            instead of failing. 4 TiB is far past any real rate or table size. -#}
        {%- if n > 4398046511104 / factor -%}
          {{- fail("Invalid value '" + value + "' for annotation '" + annotation + "' on Ingress '" + key + "'. Must be no larger than 4T.") -}}
        {%- end -%}
        {{- tostring(n * factor) -}}
      {%- end macro -%}
      {#- BodySizeBytes: a request-body cap in bytes, or "" for no cap. "0" means
          unlimited upstream, so it yields "" like an unset annotation. A malformed
          or oversized value used to convert to 0 and silently drop the cap; it is
          now refused at admission and reported on reconcile, and still yields "",
          so an Ingress already carrying one keeps today's behaviour instead of
          failing every render. -#}
      {%- macro BodySizeBytes(ingress *resources.ingresses.T, value string, annotation string) string -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- if regex_search(value, "^0+[kKmMgG]?$") -%}
          {{- "" -}}
        {%- else if !regex_search(value, "^[0-9]+[kKmMgG]?$") -%}
          {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + value + "' for annotation '" + annotation + "' on Ingress '" + key + "': the request body is not limited. Use a byte size like '10m', or '0' for unlimited.") -}}
        {%- else -%}
          {%- var factor = 1 -%}
          {%- if hasSuffix(value, "k") || hasSuffix(value, "K") -%}{%- factor = 1024 -%}{%- end -%}
          {%- if hasSuffix(value, "m") || hasSuffix(value, "M") -%}{%- factor = 1048576 -%}{%- end -%}
          {%- if hasSuffix(value, "g") || hasSuffix(value, "G") -%}{%- factor = 1073741824 -%}{%- end -%}
          {%- var digits = value -%}
          {%- if factor > 1 -%}{%- digits = value[0:len(value)-1] -%}{%- end -%}
          {%- var n = toint(digits) -%}
          {%- if n > 4398046511104 / factor -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + value + "' for annotation '" + annotation + "' on Ingress '" + key + "': it exceeds 4T, so the request body is not limited. Use a size of 4T or less.") -}}
          {%- else -%}
            {{- tostring(n * factor) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  # Per-stream download throttle from one frontend lane. The filter plus its
  # `set-bandwidth-limit` rule lived in the route's backend, and a filter cannot
  # live in a `defaults`, so every throttled route was structural.
  # `set-bandwidth-limit <filter> limit <expr>` takes the rate from a variable,
  # but a filter's `min-size` is part of its declaration, so the lane emits one
  # filter per distinct min-size plus the plain one, and ing-bw-routes.map holds
  # "<route id>" -> "<rate bytes> <min-size bytes|_>". A route on a min-size that
  # already exists is a map edit; a new one reloads once.
  util-bandwidth-publish:
    template: |-
      {%- macro PublishBandwidth(key string, rateBytes string, minSizeBytes string) -%}
        {{- shared.Publish("any", "any", "any") -}}
        {{- shared.Publish("route", key, key + " " + rateBytes + " " + minSizeBytes) -}}
        {%- if minSizeBytes != "_" -%}{{- shared.Publish("minsize", minSizeBytes, minSizeBytes) -}}{%- end -%}
      {%- end macro -%}

  features-200-ingress-bandwidth:
    template: '{{- render_glob "ingress-bandwidth-*" -}}'

  ingress-bandwidth-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-bandwidth
      effects: [publishValue]
    template: '{{- "" -}}'

  # Declared after the compression filter (110), so a download cap meters the
  # compressed bytes that go on the wire — the same ordering the HAPTIC-native
  # bandwidth lane relies on. `default-limit` is only a fallback: every rule
  # passes `limit <expr>`.
  frontend-filters-725-ingress-bandwidth:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("ingress-bandwidth", "any") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("ingressBandwidthMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("ingress-bandwidth", "route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("ing-bw-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
        var unsorted = []any{}
        for _, v := range incremental_values("ingress-bandwidth", "minsize") {
          unsorted = append(unsorted, tostring(v))
        }
        var sizes = sort_strings(unsorted)
      %%}
      {{ "\n" }}# ingress/limit-rate
      filter bwlim-out ing_bw_out default-limit 1m default-period 1s
      {%- for _, s := range sizes %}
      filter bwlim-out ing_bw_out_{{ s }} default-limit 1m default-period 1s min-size {{ s }}
      {%- end %}
      http-request set-var(txn.ibw_cfg) var(txn.resource_key),map({{ routes }})
      http-request set-var(txn.ibw_rate) var(txn.ibw_cfg),field(1,' ') if { var(txn.ibw_cfg) -m found }
      http-request set-var(txn.ibw_min) var(txn.ibw_cfg),field(2,' ') if { var(txn.ibw_cfg) -m found }
      http-request set-bandwidth-limit ing_bw_out limit var(txn.ibw_rate) if { var(txn.ibw_min) -m str _ }
      {%- for _, s := range sizes %}
      http-request set-bandwidth-limit ing_bw_out_{{ s }} limit var(txn.ibw_rate) if { var(txn.ibw_min) -m str {{ s }} }
      {%- end %}
      {%- end %}

  # Request mirroring from one host-keyed map. Every mirror-target Ingress used
  # to append its own frontend line, so adding or retargeting one reloaded.
  # ing-mirror-hosts.map holds "<host>" -> the concatenated txn.gw_mirror_targets
  # entries of every mirror-target Ingress on that host.
  util-mirror-publish:
    template: |-
      {%- macro PublishMirror(key string, hosts []string, entry string) -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- for _, host := range hosts -%}
          {{- shared.Publish("target", host + "\t" + key, host + "\t" + key + "\t" + entry + ";") -}}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-mirror:
    template: '{{- render_glob "ingress-mirror-*" -}}'

  ingress-mirror-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-mirror
      effects: [publishValue]
    template: '{{- "" -}}'

  frontend-filters-820-ingress-mirror:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("ingress-mirror", "any") > 0 -%}
      {%%
        var hostsVal, _ = shared.ComputeIfAbsent("ingressMirrorMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("ingress-mirror", "target") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            var fields = split(tostring(r), "\t")
            var n = len(lines)
            if n > 0 && hasPrefix(lines[n-1], fields[0] + " ") {
              lines[n-1] = lines[n-1] + fields[2]
            } else {
              lines = append(lines, fields[0] + " " + fields[2])
            }
          }
          return RegisterMap("ing-mirror-hosts.map", lines, map[string]any{"ordered": false})
        })
        var hosts = tostring(hostsVal)
      %%}
      {{ "\n" }}# ingress/mirror-target
      http-request set-var(txn.gw_mirror_targets) var(txn.host),map({{ hosts }}),concat(,txn.gw_mirror_targets,) if { var(txn.host),map({{ hosts }}) -m found }
      {%- end %}

  # Canary routing from host-keyed maps. Every canary Ingress used to emit its
  # own use_backend lines, so adding one or stepping its weight reloaded. The
  # filter picks txn.canary_backend in the documented precedence (header >
  # cookie > weight, first match wins) and the switching rule routes to it. A
  # header or cookie NAME is part of a fetch, so each distinct name keeps one
  # rule; a regex header pattern can't come from a map, so a pattern canary
  # still emits its own line. When canaries on one host collide, the first
  # Ingress by namespace/name wins.
  util-canary-publish:
    template: |-
      {%- macro PublishCanary(key string, hosts []string, backend string, header string, headerValue string, cookie string, weight string) -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- for _, host := range hosts -%}
          {%- if header != "" -%}
            {{- shared.Publish("header", host + "|" + header + "\t" + key, host + "|" + header + "\t" + key + "\t" + backend + "\t" + queryEscape(headerValue)) -}}
          {%- end -%}
          {%- if cookie != "" -%}
            {{- shared.Publish("cookie", host + "|" + cookie + "\t" + key, host + "|" + cookie + "\t" + key + "\t" + backend) -}}
          {%- end -%}
          {%- if weight != "" -%}
            {{- shared.Publish("weight", host + "\t" + key, host + "\t" + key + "\t" + backend + "\t" + weight) -}}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  features-200-ingress-canary:
    template: '{{- render_glob "ingress-canary-*" -}}'

  ingress-canary-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-canary
      effects: [publishValue]
    template: '{{- "" -}}'

  util-canary-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- var CanaryLane = func() map[string]any {
          var laneVal, _ = shared.ComputeIfAbsent("ingressCanaryLane", func() any {
            var first = func(kind string) [][]string {
              var rows = []any{}
              for _, v := range incremental_values("ingress-canary", kind) {
                rows = append(rows, tostring(v))
              }
              var out = [][]string{}
              var prev = ""
              for _, r := range sort_strings(rows) {
                var fields = split(tostring(r), "\t")
                if len(out) == 0 || fields[0] != prev {
                  out = append(out, fields)
                }
                prev = fields[0]
              }
              return out
            }
            var nameOf = func(k string) string { return k[index(k, "|")+1:] }
            var headerBackend = []string{}
            var headerValue = []string{}
            var headerNames = []any{}
            var seenHeader = map[string]bool{}
            for _, fields := range first("header") {
              headerBackend = append(headerBackend, fields[0] + " " + fields[2])
              headerValue = append(headerValue, fields[0] + " " + fields[3])
              if !seenHeader[nameOf(fields[0])] {
                seenHeader[nameOf(fields[0])] = true
                headerNames = append(headerNames, nameOf(fields[0]))
              }
            }
            var cookieBackend = []string{}
            var cookieNames = []any{}
            var seenCookie = map[string]bool{}
            for _, fields := range first("cookie") {
              cookieBackend = append(cookieBackend, fields[0] + " " + fields[2])
              if !seenCookie[nameOf(fields[0])] {
                seenCookie[nameOf(fields[0])] = true
                cookieNames = append(cookieNames, nameOf(fields[0]))
              }
            }
            var weightBackend = []string{}
            var weights = []string{}
            for _, fields := range first("weight") {
              weightBackend = append(weightBackend, fields[0] + " " + fields[2])
              weights = append(weights, fields[0] + " " + fields[3])
            }
            return map[string]any{
              "headerBackend": RegisterMap("ing-canary-header-backend.map", headerBackend, map[string]any{"ordered": false}),
              "headerValue": RegisterMap("ing-canary-header-value.map", headerValue, map[string]any{"ordered": false}),
              "headerNames": sort_strings(headerNames),
              "cookieBackend": RegisterMap("ing-canary-cookie-backend.map", cookieBackend, map[string]any{"ordered": false}),
              "cookieNames": sort_strings(cookieNames),
              "weightBackend": RegisterMap("ing-canary-weight-backend.map", weightBackend, map[string]any{"ordered": false}),
              "weight": RegisterMap("ing-canary-weight.map", weights, map[string]any{"ordered": false}),
            }
          })
          return laneVal.(map[string]any)
      } -%}

  # The last filter band: the canary rules used to run at use_backend time,
  # after every http-request rule, so they read headers after every rewrite.
  frontend-filters-996-ingress-canary:
    requires: [ingresses]
    template: |
      {%- import "util-canary-lane" for CanaryLane -%}
      {%- if incremental_value_count("ingress-canary", "any") > 0 -%}
      {%- var lane = CanaryLane() -%}
      {{ "\n" }}# ingress/canary: header > cookie > weight, first match wins
      {%- for _, name := range lane["headerNames"].([]string) %}
      http-request set-var(txn.canary_hval) var(txn.host),concat(|{{ name }}),map({{ lane["headerValue"] }}),url_dec(1) if !{ var(txn.canary_backend) -m found }
      http-request set-var(txn.canary_backend) var(txn.host),concat(|{{ name }}),map({{ lane["headerBackend"] }}) if { var(txn.canary_hval) -m found } { req.hdr({{ name }}),strcmp(txn.canary_hval) -m int eq 0 }
      http-request unset-var(txn.canary_hval)
      {%- end %}
      {%- for _, name := range lane["cookieNames"].([]string) %}
      http-request set-var(txn.canary_backend) var(txn.host),concat(|{{ name }}),map({{ lane["cookieBackend"] }}) if !{ var(txn.canary_backend) -m found } { req.cook({{ name }}) -m str always }
      {%- end %}
      http-request set-var(txn.canary_weight) var(txn.host),map_str_int({{ lane["weight"] }}) if !{ var(txn.canary_backend) -m found }
      http-request set-var(txn.canary_backend) var(txn.host),map({{ lane["weightBackend"] }}) if { var(txn.canary_weight) -m found } { rand(100),sub(txn.canary_weight) -m int lt 0 }
      {%- end %}

  # Pattern canaries route first: each used to precede its Ingress's other
  # canary rules.
  frontend-switching-815-ingress-canary:
    requires: [ingresses]
    template: |-
      {%- if incremental_value_count("ingress-canary", "any") > 0 -%}
        {%- for _, fileAny := range incremental_values("ingress-canary", "files") -%}
          {%- var file = fileAny.(map[string]any) -%}
          {%- var _, err = fileRegistry.Register("file", tostring(file["filename"]), tostring(file["content"])) -%}
          {%- if err != nil -%}{{ fail("Failed to register host match file '" + tostring(file["filename"]) + "': " + err.Error()) }}{%- end -%}
        {%- end -%}
        {%- for _, fragment := range incremental_values("ingress-canary", "pattern") -%}{{- tostring(fragment) -}}{%- end -%}
        {{- "\n# ingress/canary\nuse_backend %[var(txn.canary_backend)] if { var(txn.canary_backend) -m found }\n" -}}
      {%- end -%}

  # aclPrefix must stay distinct per library — validation tests assert on the
  # resulting ACL names.
  # Renders every family's publisher (ingress-access-control-<band>-<library>,
  # plus the declaration below) in one sorted pass: a shared incremental
  # group must render its members in canonical order.
  features-200-ingress-access-control:
    template: '{{- render_glob "ingress-access-control-*" -}}'

  # Declares the group every annotation library publishes its source-IP
  # allow/deny rows into, so the lane's readers find it in every render.
  ingress-access-control-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-access-control
      effects: [publishValue]
    template: '{{- "" -}}'

  # PublishAccessControl: the map-lane publisher, called from a component in
  # group ingress-access-control. An IPv4-only list becomes rows ("<family>"
  # for the gate, "route" → "<id> <family>:allow|deny|both", "allow"/"deny" →
  # "<id> <cidr>..."); a list with an IPv6 entry cannot be partitioned, so the
  # legacy per-route fragment is returned for the caller to publish under
  # "fragments:<family>". family doubles as the legacy ACL prefix.
  util-publish-access-control:
    template: |-
      {%- import "util-emit-annotation-access-control" for EmitAnnotationAccessControl -%}
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- macro PublishAccessControl(ingress *resources.ingresses.T, allowAnnotation string, denyAnnotation string, family string, allowCommentFmt string, denyCommentFmt string) -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var allowlist = "" -%}
        {%- if allowAnnotation != "" -%}{%- allowlist = ingress.Metadata.Annotations[allowAnnotation] -%}{%- end -%}
        {%- var denylist = "" -%}
        {%- if denyAnnotation != "" -%}{%- denylist = ingress.Metadata.Annotations[denyAnnotation] -%}{%- end -%}
        {%- if allowlist != "" || denylist != "" -%}
          {%- var allowCidrs = "" -%}
          {%- if allowlist != "" -%}{%- allowCidrs = ValidateCidrList(allowlist, allowAnnotation, key) -%}{%- end -%}
          {%- var denyCidrs = "" -%}
          {%- if denylist != "" -%}{%- denyCidrs = ValidateCidrList(denylist, denyAnnotation, key) -%}{%- end -%}
          {%- if strings_contains(allowCidrs + denyCidrs, ":") -%}
            {{- EmitAnnotationAccessControl(ingress, allowAnnotation, denyAnnotation, family, allowCommentFmt, denyCommentFmt) -}}
          {%- else -%}
            {%- var mode = "both" -%}
            {%- if denyCidrs == "" -%}{%- mode = "allow" -%}{%- else if allowCidrs == "" -%}{%- mode = "deny" -%}{%- end -%}
            {{- shared.Publish(family, key, key) -}}
            {{- shared.Publish("route", key, key + " " + family + ":" + mode) -}}
            {%- if allowCidrs != "" -%}{{- shared.Publish("allow", key, key + " " + allowCidrs) -}}{%- end -%}
            {%- if denyCidrs != "" -%}{{- shared.Publish("deny", key, key + " " + denyCidrs) -}}{%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  # AccessControlLane(family): one family's four rules at that family's band,
  # then its legacy fragments. The four maps are shared by every family and
  # registered once per render: ing-ac-routes.map (route id → family:mode),
  # ing-ac-partitions.map (the disjoint cover of every CIDR, a map_ip lookup on
  # src), ing-ac-allow.map and ing-ac-deny.map ("<block>|<route id>" → 1). A
  # client outside every block leaves txn.ac_block unset, so the concat fetch
  # fails: an allowlisted route denies it, a denylisted route lets it through,
  # exactly what `src <cidrs>` did.
  util-access-control-lane:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%- macro AccessControlLane(family string) -%}
        {%- if incremental_value_count("ingress-access-control", family) > 0 -%}
          {%%
            var mapsVal, _ = shared.ComputeIfAbsent("ingressAccessControlMaps", func() any {
              var cidrs = []any{}
              var lists = map[string][]any{"allow": []any{}, "deny": []any{}}
              for _, kind := range []string{"allow", "deny"} {
                for _, v := range incremental_values("ingress-access-control", kind) {
                  lists[kind] = append(lists[kind], tostring(v))
                  for _, c := range split(strings_splitn(tostring(v), " ", 2)[1], " ") {
                    cidrs = append(cidrs, c)
                  }
                }
              }
              var blocks, err = cidr_partition(cidrs)
              if err != nil {
                fail(tostring(err))
              }
              var seen = map[string]bool{}
              var partitions = []any{}
              for _, list := range blocks {
                for _, b := range list {
                  if !seen[b] {
                    seen[b] = true
                    partitions = append(partitions, b)
                  }
                }
              }
              var partitionLines = []string{}
              for _, b := range sort_strings(partitions) {
                partitionLines = append(partitionLines, tostring(b) + " " + tostring(b))
              }
              var members = func(kind string) []string {
                var out = []any{}
                var seenLine = map[string]bool{}
                for _, r := range lists[kind] {
                  var parts = strings_splitn(tostring(r), " ", 2)
                  for _, c := range split(parts[1], " ") {
                    for _, b := range blocks[c] {
                      var line = b + "|" + parts[0] + " 1"
                      if !seenLine[line] {
                        seenLine[line] = true
                        out = append(out, line)
                      }
                    }
                  }
                }
                var lines = []string{}
                for _, l := range sort_strings(out) {
                  lines = append(lines, tostring(l))
                }
                return lines
              }
              var routes = []any{}
              for _, v := range incremental_values("ingress-access-control", "route") {
                routes = append(routes, tostring(v))
              }
              var routeLines = []string{}
              for _, r := range sort_strings(routes) {
                routeLines = append(routeLines, tostring(r))
              }
              return map[string]any{
                "routes": RegisterMap("ing-ac-routes.map", routeLines, map[string]any{"ordered": false}),
                "partitions": RegisterMap("ing-ac-partitions.map", partitionLines, map[string]any{"ordered": false}),
                "allow": RegisterMap("ing-ac-allow.map", members("allow"), map[string]any{"ordered": false}),
                "deny": RegisterMap("ing-ac-deny.map", members("deny"), map[string]any{"ordered": false}),
              }
            })
            var maps = mapsVal.(map[string]any)
          %%}
      # {{ family }}/access-control
      http-request set-var(txn.ac) var(txn.resource_key),map({{ maps["routes"] }})
      http-request set-var(txn.ac_block) src,map_ip({{ maps["partitions"] }}) if { var(txn.ac) -m beg "{{ family }}:" }
      http-request deny if { var(txn.ac) -m str "{{ family }}:allow" "{{ family }}:both" } !{ var(txn.ac_block),concat(|,txn.resource_key),map({{ maps["allow"] }}) -m found }
      http-request deny if { var(txn.ac) -m str "{{ family }}:deny" "{{ family }}:both" } { var(txn.ac_block),concat(|,txn.resource_key),map({{ maps["deny"] }}) -m found }
        {%- end -%}
        {%- for _, f := range incremental_values("ingress-access-control", "fragments:" + family) -%}{{- tostring(f) -}}{%- end -%}
      {%- end macro -%}

  util-emit-annotation-access-control:
    template: |
      {%- import "util-validate-cidr-list" for ValidateCidrList %}
      {#- Scoped by matched route, not by Host header. A wildcard rule host never
          equals a concrete request host and a host-less rule has nothing to
          match, so the previous exact host gate dropped the deny entirely and
          served the route to every source address. -#}
      {%- macro EmitAnnotationAccessControl(ingress *resources.ingresses.T, allowAnnotation string, denyAnnotation string, aclPrefix string, allowCommentFmt string, denyCommentFmt string) %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var cond = "{ var(txn.resource_key) -m str " + key + " }" %}
        {%- var allowlist = ingress.Metadata.Annotations[allowAnnotation] %}
        {%- var denylist = ingress.Metadata.Annotations[denyAnnotation] %}
        {%- if allowlist != "" %}
          {%- var aclName = aclPrefix + "_allowlist_" + ns + "_" + name %}
      # {{ replace(allowCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src {{ ValidateCidrList(allowlist, allowAnnotation, key) }}

      http-request deny if {{ cond }} !{{ aclName }}
        {%- end %}
        {%- if denylist != "" %}
          {%- var aclName = aclPrefix + "_denylist_" + ns + "_" + name %}
      # {{ replace(denyCommentFmt, "{KEY}", key) }}
      acl {{ aclName }} src {{ ValidateCidrList(denylist, denyAnnotation, key) }}

      http-request deny if {{ cond }} {{ aclName }}
        {%- end %}
      {%- end macro %}

  # Every comma-separated CIDR annotation interpolated into an HAProxy `src` ACL
  # MUST go through ValidateCidrList: a value carrying a newline would smuggle a
  # second directive into the config and still pass `haproxy -c`.
  util-validate-cidr-list:
    template: |
      {# Charset guard only: malformed-but-clean values (999.0.0.0/8) are left
          for `haproxy -c` to reject. #}
      {%- macro ValidateCidrList(rawList string, annotation string, key string) %}
        {%- var out = []string{} %}
        {%- for _, c := range split(rawList, ",") %}
          {%- var t = trimSpace(c) %}
          {%- if t != "" %}
            {%- if !regex_search(t, "^([0-9]{1,3}\\.){3}[0-9]{1,3}(/[0-9]{1,2})?$|^[0-9a-fA-F:]+(/[0-9]{1,3})?$") %}
              {{- fail("Invalid CIDR/IP '" + t + "' in annotation '" + annotation + "' on Ingress '" + key + "'. Only comma-separated IPv4/IPv6 addresses or CIDR ranges are permitted (config-injection guard).") -}}
            {%- end %}
            {%- out = append(out, t) %}
          {%- end %}
        {%- end %}
        {{- join(out, " ") -}}
      {%- end macro %}

  # Rejects an Ingress that configures the SAME feature through two annotation
  # families: the effective result would be order-dependent. Keyed by canonical
  # feature/parameter, so distinct features (and distinct timeouts) across
  # families stay legal. extraContext.annotationLibraries is injected by
  # templates/haproxytemplateconfig.yaml from controller.templateLibraries.*.enabled.
  features-950-annotation-family-feature-conflict:
    requires: [ingresses]
    incremental:
      effects: [recordEvent]
      bindingsTemplate: |-
        {%%
          var families = []string{"haptic", "haproxyIngress", "haproxytech", "nginx"}
          var configured = extraContext | dig("annotationLibraries") | fallback(map[string]any{})
          var enabled = map[string]any{}
          var enabledCount = 0
          for _, family := range families {
            var isEnabled = tostring(configured | dig(family) | fallback(false)) == "true"
            enabled[family] = isEnabled
            if isEnabled {
              enabledCount++
            }
          }
          var bindings = map[string]any{}
          if enabledCount >= 2 {
            bindings["ingresses"] = map[string]any{"enabled": enabled}
          }
          show toJSON(bindings)
        %%}
    template: |-
      {%%
        var familyPrefix = map[string]string{
          "haptic":         "haproxy-haptic.org/",
          "haproxyIngress": "haproxy-ingress.github.io/",
          "haproxytech":    "haproxy.org/",
          "nginx":          "nginx.ingress.kubernetes.io/",
        }
        // Deterministic iteration order → stable fail() messages.
        var familyOrder = []string{"haptic", "haproxyIngress", "haproxytech", "nginx"}

        // Canonical feature/parameter → family → annotation-key suffixes. A key
        // listed under a family that doesn't use it is harmless; a key filed
        // under the wrong feature is not.
        var registry = []map[string]any{
          {"name": "WAF", "families": map[string][]string{
            "haptic":         {"waf-mode", "waf-policy"},
            "haproxyIngress": {"waf", "waf-mode"},
            "nginx":          {"enable-modsecurity", "modsecurity-snippet"},
          }},
          {"name": "external authentication", "families": map[string][]string{
            "haptic":         {"auth-url", "auth-signin", "auth-method", "auth-headers-request", "auth-headers-succeed", "auth-headers-fail", "oauth", "oauth-uri-prefix", "oauth-headers"},
            "haproxyIngress": {"auth-url", "auth-signin", "auth-method", "auth-headers-request", "auth-headers-succeed", "auth-headers-fail", "oauth", "oauth-uri-prefix", "oauth-headers"},
            "nginx":          {"auth-url", "auth-signin", "auth-method", "auth-response-headers"},
          }},
          {"name": "basic authentication", "families": map[string][]string{
            "haptic":         {"auth-type", "auth-secret", "auth-secret-type", "auth-realm", "satisfy"},
            "haproxyIngress": {"auth-secret", "auth-realm"},
            "haproxytech":    {"auth-type", "auth-secret", "auth-realm"},
            "nginx":          {"auth-type", "auth-secret", "auth-secret-type", "auth-realm", "satisfy"},
          }},
          {"name": "client-certificate (mTLS) authentication", "families": map[string][]string{
            "haptic":         {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-cert-header"},
            "haproxyIngress": {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-cert-header", "auth-tls-strict"},
            "nginx":          {"auth-tls-secret", "auth-tls-verify-client", "auth-tls-error-page", "auth-tls-pass-certificate-to-upstream", "auth-tls-verify-depth"},
          }},
          {"name": "CORS", "families": map[string][]string{
            "haptic":         {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
            "haproxyIngress": {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
            "haproxytech":    {"cors-enable", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-max-age", "cors-respond-to-options"},
            "nginx":          {"enable-cors", "cors-allow-origin", "cors-allow-methods", "cors-allow-headers", "cors-allow-credentials", "cors-expose-headers", "cors-max-age"},
          }},
          {"name": "shared rate limiting", "families": map[string][]string{
            "haptic":         {"rate-limit-requests", "rate-limit-rps", "rate-limit-rpm", "rate-limit-connections", "rate-limit-period", "rate-limit-size", "rate-limit-status-code", "rate-limit-allowlist", "rate-limit-burst", "rate-limit-algorithm", "rate-limit-key", "download-bandwidth-limit", "upload-bandwidth-limit", "bandwidth-limit-scope"},
            "haproxyIngress": {"limit-rps", "limit-rpm", "limit-connections", "limit-whitelist"},
            "haproxytech":    {"rate-limit-requests", "rate-limit-period", "rate-limit-size", "rate-limit-status-code", "rate-limit-whitelist"},
            "nginx":          {"limit-rps", "limit-rpm", "limit-connections", "limit-whitelist", "limit-rate", "limit-rate-after"},
          }},
          {"name": "HTTPS redirect", "families": map[string][]string{
            "haptic":         {"https-redirect", "https-redirect-code", "https-redirect-port"},
            "haproxyIngress": {"ssl-redirect", "ssl-redirect-code"},
            "haproxytech":    {"ssl-redirect", "ssl-redirect-code", "ssl-redirect-port"},
            "nginx":          {"ssl-redirect", "force-ssl-redirect"},
          }},
          {"name": "backend protocol", "families": map[string][]string{
            "haptic":         {"backend-protocol"},
            "haproxyIngress": {"backend-protocol"},
            "haproxytech":    {"server-proto"},
            "nginx":          {"backend-protocol"},
          }},
          {"name": "request body size limit", "families": map[string][]string{
            "haptic":         {"max-request-body-size"},
            "haproxyIngress": {"proxy-body-size"},
            "nginx":          {"proxy-body-size"},
          }},
          {"name": "source-IP allowlist", "families": map[string][]string{
            "haptic":         {"allowlist-source-range"},
            "haproxyIngress": {"allowlist-source-range", "whitelist-source-range"},
            "haproxytech":    {"allow-list", "whitelist"},
            "nginx":          {"whitelist-source-range"},
          }},
          {"name": "source-IP denylist", "families": map[string][]string{
            "haptic":         {"denylist-source-range"},
            "haproxyIngress": {"denylist-source-range"},
            "haproxytech":    {"deny-list", "blacklist"},
            "nginx":          {"denylist-source-range"},
          }},
          {"name": "canary traffic splitting", "families": map[string][]string{
            "haptic": {"canary", "canary-by-cookie", "canary-by-header", "canary-by-header-pattern", "canary-by-header-value", "canary-weight"},
            "nginx":  {"canary", "canary-by-header", "canary-by-header-value", "canary-by-header-pattern", "canary-by-cookie", "canary-weight", "canary-weight-total"},
          }},
          {"name": "session affinity", "families": map[string][]string{
            "haptic":         {"affinity", "session-cookie-name", "session-cookie-domain", "session-cookie-dynamic", "session-cookie-keywords", "session-cookie-max-age", "session-cookie-path", "session-cookie-preserve", "session-cookie-samesite", "session-cookie-secure", "session-cookie-strategy"},
            "haproxyIngress": {"affinity", "session-cookie-name", "session-cookie-strategy", "session-cookie-dynamic", "session-cookie-keywords", "session-cookie-domain", "session-cookie-same-site", "session-cookie-preserve"},
            "haproxytech":    {"cookie-persistence", "cookie-persistence-no-dynamic"},
            "nginx":          {"affinity", "session-cookie-name", "session-cookie-path", "session-cookie-domain", "session-cookie-secure", "session-cookie-samesite", "session-cookie-max-age", "session-cookie-expires", "session-cookie-hash"},
          }},
          {"name": "Host header rewrite", "families": map[string][]string{
            "haptic":      {"set-host"},
            "haproxytech": {"set-host"},
            "nginx":       {"upstream-vhost"},
          }},
          // One entry per timeout parameter: only the same timeout from two
          // families collides.
          {"name": "connect timeout", "families": map[string][]string{
            "haptic":         {"timeout-connect"},
            "haproxyIngress": {"timeout-connect"},
            "haproxytech":    {"timeout-connect"},
            "nginx":          {"proxy-connect-timeout"},
          }},
          {"name": "server (read) timeout", "families": map[string][]string{
            "haptic":         {"timeout-server"},
            "haproxyIngress": {"timeout-server"},
            "haproxytech":    {"timeout-server"},
            "nginx":          {"proxy-read-timeout"},
          }},
          {"name": "queue timeout", "families": map[string][]string{
            "haptic":         {"timeout-queue"},
            "haproxyIngress": {"timeout-queue"},
            "haproxytech":    {"timeout-queue"},
          }},
          {"name": "tunnel timeout", "families": map[string][]string{
            "haptic":         {"timeout-tunnel"},
            "haproxyIngress": {"timeout-tunnel"},
            "haproxytech":    {"timeout-tunnel"},
          }},
          {"name": "http-request timeout", "families": map[string][]string{
            "haptic":         {"timeout-http"},
            "haproxyIngress": {"timeout-http"},
            "haproxytech":    {"timeout-http"},
          }},
          {"name": "keep-alive timeout", "families": map[string][]string{
            "haptic":         {"timeout-keep"},
            "haproxyIngress": {"timeout-keep"},
          }},
          {"name": "health-check timeout", "families": map[string][]string{
            "haptic":      {"timeout-check"},
            "haproxytech": {"timeout-check"},
          }},
          // haproxytech timeout-client and nginx proxy-send-timeout have no
          // cross-family counterpart yet, so no entry.
        }

        var enabled = props | dig("enabled") | fallback(map[string]any{})
        var ingress = item
        var anns = to_str_map(dig(ingress, "metadata", "annotations"))
        for _, entry := range registry {
          var fams = entry["families"].(map[string][]string)
          var hitFamilies = []string{}
          var hitDetail = []string{}
          for _, fam := range familyOrder {
            if tostring(enabled | dig(fam) | fallback(false)) != "true" {
              continue
            }
            var keys, has = fams[fam]
            if !has {
              continue
            }
            var present = []string{}
            for _, k := range keys {
              if _, exists := anns[familyPrefix[fam]+k]; exists {
                present = append(present, familyPrefix[fam]+k)
              }
            }
            if len(present) > 0 {
              hitFamilies = append(hitFamilies, fam)
              hitDetail = append(hitDetail, join(present, ", "))
            }
          }
          if len(hitFamilies) >= 2 {
            var namespace = dig_string(ingress, "", "metadata", "namespace")
            var name = dig_string(ingress, "", "metadata", "name")
            var msg = "Ingress " + namespace + "/" + name + " configures the " + entry["name"].(string) + " feature through annotations from multiple families (" + join(hitDetail, "; ") + "). Configure each feature through a single annotation family: mixing families for one feature is rejected even when the values agree, because the effective configuration is order-dependent."
            if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
              fail(msg)
            } else {
              recordEvent(ingress, "AnnotationFamilyConflict", msg)
            }
          }
        }
      %%}

  # knownAnnotations comes from each enabled library's _migrationCoverage (haptic.projectKnownAnnotations).
  # An Event, not an admission reject: an annotation newer than the coverage map must not block updates.
  features-955-annotation-unknown-key:
    requires: [ingresses]
    incremental:
      effects: [recordEvent]
      whenAnyPathExists: ["metadata.annotations"]
      bindingsTemplate: |-
        {%- var known = extraContext | dig("knownAnnotations") -%}
        {%- if known != nil -%}
          {{- toJSON(map[string]any{"ingresses": map[string]any{"known": known}}) -}}
        {%- else -%}
          {{- "{}" -}}
        {%- end -%}
    template: |-
      {%%
        var namesByPrefix = map[string]map[string]bool{}
        var known = props | dig("known") | fallback(map[string]any{})
        for _, source := range known.(map[string]any) {
          for _, prefix := range toSlice(source | dig("prefixes")) {
            var names = namesByPrefix[tostring(prefix)]
            if names == nil {
              names = map[string]bool{}
              namesByPrefix[tostring(prefix)] = names
            }
            for _, name := range toSlice(source | dig("names")) {
              names[tostring(name)] = true
            }
          }
        }
        var unknown = []any{}
        for key := range to_str_map(dig(item, "metadata", "annotations")) {
          for prefix, names := range namesByPrefix {
            if hasPrefix(key, prefix) && !names[key[len(prefix):]] {
              unknown = append(unknown, key)
              break
            }
          }
        }
        if len(unknown) > 0 {
          var ingressKey = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
          recordEvent(item, "UnknownAnnotation", "Ingress " + ingressKey + " sets " + join(sort_strings(unknown), ", ") + ", which no enabled annotation library recognises, so it has no effect. Fix the annotation name or remove it.")
        }
      %%}

  # The only gate for annotations rendered as raw HAProxy configuration; the
  # raw-annotation probe in scripts/test-templates.sh fails on one it misses.
  features-951-raw-haproxy-config-permission:
    requires: [ingresses]
    incremental:
      whenAnyPathExists:
        - metadata.annotations['haproxy-haptic.org/config-global']
        - metadata.annotations['haproxy-haptic.org/config-defaults']
        - metadata.annotations['haproxy-haptic.org/config-frontend']
        - metadata.annotations['haproxy-haptic.org/config-backend']
        - metadata.annotations['haproxy-ingress.github.io/config-global']
        - metadata.annotations['haproxy-ingress.github.io/config-defaults']
        - metadata.annotations['haproxy-ingress.github.io/config-frontend']
        - metadata.annotations['haproxy-ingress.github.io/config-backend']
        - metadata.annotations['haproxy.org/backend-config-snippet']
        - metadata.annotations['nginx.ingress.kubernetes.io/configuration-snippet']
      bindingsTemplate: |-
        {%- import "util-waf-governance" for WafGovernance -%}
        {%%
          var permissions, permissionsOK = (extraContext | dig("ingressPermissions") | fallback(map[string]any{})).(map[string]any)
          if !permissionsOK { fail("extraContext.ingressPermissions must be a map.") }
          for _, field := range keys(permissions) {
            if field != "allowRawHAProxyConfig" {
              fail("extraContext.ingressPermissions contains unknown field '" + field + "'. Valid fields: allowRawHAProxyConfig.")
            }
          }
          var allowed, allowedOK = (permissions["allowRawHAProxyConfig"] | fallback(false)).(bool)
          if !allowedOK { fail("extraContext.ingressPermissions.allowRawHAProxyConfig must be a boolean.") }
          var deniedBy = ""
          if !allowed {
            deniedBy = "extraContext.ingressPermissions.allowRawHAProxyConfig=false disables raw HAProxy configuration annotations, whose directives can affect every host this controller serves"
          } else {
            var gov = map[string]any{}
            var _ = WafGovernance(gov)
            if !gov["allowRawHAProxyConfig"].(bool) {
              deniedBy = "WAF governance disables raw HAProxy configuration annotations with extraContext.waf.ingressPermissions.allowRawHAProxyConfig=false, because raw directives can bypass WAF enforcement for other routes"
            }
          }
          // A disabled family's annotations are inert. Without annotationLibraries, check every family.
          var families = map[string][]any{
            "haptic": {"haproxy-haptic.org/config-global", "haproxy-haptic.org/config-defaults", "haproxy-haptic.org/config-frontend", "haproxy-haptic.org/config-backend"},
            "haproxyIngress": {"haproxy-ingress.github.io/config-global", "haproxy-ingress.github.io/config-defaults", "haproxy-ingress.github.io/config-frontend", "haproxy-ingress.github.io/config-backend"},
            "haproxytech": {"haproxy.org/backend-config-snippet"},
            "nginx": {"nginx.ingress.kubernetes.io/configuration-snippet"},
          }
          var enabledLibraries = extraContext | dig("annotationLibraries")
          var annotations = []any{}
          for _, family := range keys(families) {
            if enabledLibraries == nil || tostring(enabledLibraries | dig(family) | fallback(false)) == "true" {
              annotations = append(annotations, families[family]...)
            }
          }
          var bindings = map[string]any{}
          if deniedBy != "" && len(annotations) > 0 {
            bindings["ingresses"] = map[string]any{"deniedBy": deniedBy, "annotations": annotations}
          }
          show toJSON(bindings)
        %%}
    template: |-
      {%%
        var values = to_str_map(dig(item, "metadata", "annotations"))
        var present = []string{}
        for _, annotation := range toSlice(props | dig("annotations")) {
          if strip(values[tostring(annotation)]) != "" {
            present = append(present, "'" + tostring(annotation) + "'")
          }
        }
        var fix = "Remove the annotation."
        if len(present) > 1 { fix = "Remove these annotations." }
        if len(present) > 0 {
          fail("Ingress " + dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name") + " sets " + join(present, ", ") + ", but " + tostring(props | dig("deniedBy")) + ". " + fix)
        }
      %%}

# The conflict tests drive the guard via extraContext.annotationLibraries, so its
# gating logic is exercised regardless of which vendor libraries are merged; they
# use plugin-free features so none depends on a SPOA plugin.
validationTests:
  test-annotation-family-conflict-cors-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      Under the admission webhook (renderMode admission), one Ingress enabling
      CORS via both haproxy-haptic.org/cors-enable and
      nginx.ingress.kubernetes.io/enable-cors is rejected — even though both
      values are "true" and thus don't conflict — because the effective result
      is order-dependent.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: mixed-cors }
      annotationLibraries: *annotationlibrariesHapticNginx
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-cors
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-cors.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the CORS feature through annotations from multiple families"
      - {type: contains, target: rendering_error, pattern: "haproxy-haptic.org/cors-enable"}
      - {type: contains, target: rendering_error, pattern: "nginx.ingress.kubernetes.io/enable-cors"}
      - {type: contains, target: rendering_error, pattern: "rejected even when the values agree"}

  test-annotation-family-conflict-different-features-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Two families configuring DIFFERENT features on one Ingress (CORS vs backend-protocol) is allowed.
    extraContext:
      annotationLibraries: *annotationlibrariesHapticNginx
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: diff-features
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          spec:
            ingressClassName: haproxy
            rules:
              - host: diff-features.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-different-timeouts-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Two families setting DIFFERENT timeout parameters (connect vs server) is allowed — timeouts are per-parameter, not one feature.
    extraContext:
      annotationLibraries: *annotationlibrariesHapticNginx2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: diff-timeouts
            annotations:
              haproxy-haptic.org/timeout-connect: "5s"
              haproxy.org/timeout-server: "30s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: diff-timeouts.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-same-timeout-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Under the admission webhook, the SAME timeout parameter (server) from two families collides and is rejected.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: same-timeout }
      annotationLibraries: *annotationlibrariesHapticNginx2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-timeout
            annotations:
              haproxy-haptic.org/timeout-server: "30s"
              haproxy.org/timeout-server: "60s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-timeout.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the server \\(read\\) timeout feature through annotations from multiple families"

  test-annotation-family-conflict-queue-timeout-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: The queue timeout (not just connect/server) is registered per-parameter, so the same timeout from two families collides and is rejected under the webhook.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: same-queue-timeout }
      annotationLibraries: *annotationlibrariesHapticNginx2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-queue-timeout
            annotations:
              haproxy-haptic.org/timeout-queue: "5s"
              haproxy.org/timeout-queue: "10s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-queue-timeout.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the queue timeout feature through annotations from multiple families"

  test-annotation-family-conflict-disabled-family-inert:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: A disabled family's annotation is inert, so native CORS plus a disabled-nginx CORS annotation does NOT collide.
    extraContext:
      annotationLibraries: {haptic: true, nginx: false, haproxyIngress: false, haproxytech: false}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: disabled-family
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: disabled-family.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-single-family-allowed:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: Multiple CORS keys from ONE family on one Ingress is allowed (not a cross-family mix).
    extraContext:
      annotationLibraries: *annotationlibrariesHapticNginx
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: single-family
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-max-age: "600"
          spec:
            ingressClassName: haproxy
            rules:
              - host: single-family.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

  test-annotation-family-conflict-waf-rejected:
    # Needs the coraza plugin so neither family's own WAF processing fails first.
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled) (not .Values.controller.templateLibraries.haproxyIngress.enabled) (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: Under the admission webhook, an Ingress with both haproxy-haptic.org/waf-policy and haproxy-ingress.github.io/waf is rejected — the deny-vs-detect downgrade this guard prevents.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: mixed-waf }
      annotationLibraries: {haptic: true, nginx: false, haproxyIngress: true, haproxytech: false}
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies: {inline: {baseline: {enforcement: deny}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-waf
            annotations:
              haproxy-haptic.org/waf-policy: baseline
              haproxy-ingress.github.io/waf: modsecurity
              haproxy-ingress.github.io/waf-mode: detect
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-waf.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "configures the WAF feature through annotations from multiple families"
      - {type: contains, target: rendering_error, pattern: "haproxy-haptic.org/waf-policy"}
      - {type: contains, target: rendering_error, pattern: "haproxy-ingress.github.io/waf"}

  test-annotation-family-conflict-cors-reconcile-warns:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      During a live reconcile (renderMode reconcile), the same cross-family CORS
      conflict does NOT abort the render — it records a Warning Event on the
      offending Ingress and proceeds, so one already-present conflicting Ingress
      can't brick the whole config.
    extraContext:
      renderMode: reconcile
      annotationLibraries: *annotationlibrariesHapticNginx
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-cors
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mixed-cors.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: events
        pattern: "Warning AnnotationFamilyConflict networking.k8s.io/v1 Ingress default/mixed-cors:"
      - type: contains
        target: events
        pattern: "configures the CORS feature through annotations from multiple families"

  test-annotation-family-conflict-load-gate-warns-not-fails:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.ingressAnnotationsCompat.enabled }}true{{ end }}'
    description: >-
      With renderMode unset (the daemon load gate default), a cross-family
      timeout conflict warns rather than failing, so a pre-existing conflict
      can't fail the load gate at startup.
    extraContext:
      annotationLibraries: *annotationlibrariesHapticNginx2
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: same-timeout
            annotations:
              haproxy-haptic.org/timeout-server: "30s"
              haproxy.org/timeout-server: "60s"
          spec:
            ingressClassName: haproxy
            rules:
              - host: same-timeout.example.com
                http: *httpRoot
    assertions:
      # haproxy_valid is deliberately not asserted: with both families merged the
      # same timeout may be emitted twice — a separate concern from warn-vs-fail.
      - type: not_contains
        target: rendering_error
        pattern: "configures the server \\(read\\) timeout feature through annotations from multiple families"
      - type: contains
        target: events
        pattern: "Warning AnnotationFamilyConflict networking.k8s.io/v1 Ingress default/same-timeout:"

  test-raw-haproxy-config-disabled-rejected:
    description: >-
      With allowRawHAProxyConfig=false (the default), raw configuration
      annotations fail every render, not only admission, so input isolation
      withholds the Ingress instead of serving it partially.
    extraContext: *rawConfigDisabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: raw-native
            annotations:
              haproxy-haptic.org/config-frontend: "http-request deny"
              haproxy-haptic.org/config-backend: "http-request return status 200 file /etc/haproxy/ssl/default-ssl-cert.pem"
          spec:
            ingressClassName: haproxy
            rules:
              - host: raw-native.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Ingress default/raw-native sets 'haproxy-haptic\\.org/config-frontend', 'haproxy-haptic\\.org/config-backend', but extraContext\\.ingressPermissions\\.allowRawHAProxyConfig=false disables raw HAProxy configuration annotations, whose directives can affect every host this controller serves\\. Remove these annotations\\."

  test-raw-haproxy-config-disabled-vendor-rejected:
    description: The same switch rejects each vendor family's raw configuration annotation.
    extraContext: *rawConfigDisabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: raw-vendor
            annotations:
              haproxy-ingress.github.io/config-global: "maxconn 1"
              haproxy.org/backend-config-snippet: "http-request deny"
              nginx.ingress.kubernetes.io/configuration-snippet: "http-request deny"
          spec:
            ingressClassName: haproxy
            rules:
              - host: raw-vendor.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Ingress default/raw-vendor sets 'haproxy-ingress\\.github\\.io/config-global', 'haproxy\\.org/backend-config-snippet', 'nginx\\.ingress\\.kubernetes\\.io/configuration-snippet', but extraContext\\.ingressPermissions\\.allowRawHAProxyConfig=false"

  test-raw-haproxy-config-disabled-other-ingresses-render:
    description: >-
      While raw configuration annotations are disabled, Ingresses without
      them, and raw annotations that hold only whitespace, still render.
    extraContext: *rawConfigDisabled
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain
          spec:
            ingressClassName: haproxy
            rules:
              - host: plain.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: blank-raw
            annotations:
              haproxy-haptic.org/config-frontend: "  "
              haproxy-ingress.github.io/config-defaults: "\n"
          spec:
            ingressClassName: haproxy
            rules:
              - host: blank-raw.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:path-prefix.map, pattern: "(?m)^plain\\.example\\.com/ "}
      - {type: contains, target: map:path-prefix.map, pattern: "(?m)^blank-raw\\.example\\.com/ "}

  test-raw-haproxy-config-disabled-family-inert:
    description: A raw annotation of a disabled annotation library has no effect, so it isn't rejected.
    extraContext:
      ingressPermissions: {allowRawHAProxyConfig: false}
      annotationLibraries: {haptic: true, nginx: false, haproxyIngress: false, haproxytech: false}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: inert-raw
            annotations:
              nginx.ingress.kubernetes.io/configuration-snippet: "# inert"
          spec:
            ingressClassName: haproxy
            rules:
              - host: inert-raw.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid

  test-raw-haproxy-config-unknown-permission-rejected:
    description: A misspelled ingressPermissions field fails the render instead of leaving raw annotations disabled silently.
    extraContext:
      ingressPermissions: {allowRawHaproxyConfig: true}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "extraContext\\.ingressPermissions contains unknown field 'allowRawHaproxyConfig'\\. Valid fields: allowRawHAProxyConfig\\."
