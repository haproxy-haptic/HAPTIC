# Must load after base.yaml: uses frontend-routing-logic and the file registry.

_fx:
  fixturesTlsTriggerDefaultSsl: &fixturesTlsTriggerDefaultSsl
    ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: {name: tls-trigger, namespace: default}
        spec:
          ingressClassName: haproxy
          tls:
            - hosts: ["example.com"]
              secretName: default-ssl-cert
          rules:
            - host: example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend: {service: {name: trigger-svc, port: {number: 80}}}
  extracontextTlsSessiontickets: &extracontextTlsSessiontickets
    tls: {sessionTickets: {enabled: true}, sessionTicketsToday: "20260721"}

_helm_load: {enable: '{{ .Values.controller.templateLibraries.ssl.enabled }}'}

# The default pair is ECDSA, the *_rsa pair RSA — key type is invisible in base64.
_test_tls_crt: &test_tls_crt 
_test_tls_key: &test_tls_key 
_test_tls_crt_rsa: &test_tls_crt_rsa 
_test_tls_key_rsa: &test_tls_key_rsa 

watchedResources:
  secrets:
    apiVersion: v1
    resources: secrets
    indexBy: ["metadata.namespace", "metadata.name"]

# Lowest precedence: controller.config.templatingSettings.extraContext overrides these.
templatingSettings:
  extraContext:
    # HSTS is a global default; a per-Ingress hsts annotation overrides it for its hosts.
    tls:
      hsts:
        enabled: false
        maxAge: "31536000"          # one year
        includeSubdomains: false
        preload: false

      sessionTickets: {enabled: false}

      # Applied to every SSL bind; "" omits a directive (HAProxy built-in default).
      # `ciphers` is one forward-secret superset over ECDSA/RSA/DHE — HAProxy offers
      # only suites it holds a certificate for, so one list fits RSA-only, ECDSA-only
      # and dual deployments. Mirrored in docs/site/docs/ssl-certificates.md and
      # pinned by test-ssl-global-cipher-policy-*; change all copies together.
      ciphers: "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA"
      ciphersuites: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
      minVersion: "TLSv1.2"

    http3:
      enabled: true
      altSvc: {port: 0, maxAge: 86400}

templateSnippets:
  util-ssl-passthrough-backends:
    template: |-
      {%- var SSLPassthroughBackends = func() []any {
        var cached, _ = shared.ComputeIfAbsent("sslPassthroughBackendsCombined", func() any {
          var encoded = render "util-annotation-ssl-passthrough-values" default ""
          if encoded != "" {
            var decoded = []any{}
            if err := unmarshalJSON(encoded, &decoded); err != nil {
              fail(err.Error())
            }
            return decoded
          }
          var gf = shared.Get("globalFeatures").(map[string]any)
          return toSlice(gf["sslPassthroughBackends"])
        })
        return cached.([]any)
      } -%}

  # An entry's optional `targets` ({name, weight}) split its SNI across
  # backends. Each line after the first wins with weight/remaining, so its
  # independent rand() still yields weight/total overall.
  util-ssl-sni-use-backend-lines:
    template: |-
      {%- var SNIUseBackendLines = func(entry any, fetch string) []any {
        var sni = dig_string(entry, "", "sni")
        var condition = "{ " + fetch + " -m str " + sni + " }"
        if hasPrefix(sni, "*.") { condition = "{ " + fetch + " -m end " + sni[1:] + " }" }
        var targets = []any{}
        for _, target := range toSlice(dig(entry, "targets")) {
          if toint(dig(target, "weight") | fallback(0)) > 0 { targets = append(targets, target) }
        }
        if len(toSlice(dig(entry, "targets"))) == 0 {
          targets = []any{map[string]any{"name": dig_string(entry, "", "name"), "weight": 1}}
        }
        var remaining = 0
        for _, target := range targets { remaining = remaining + toint(dig(target, "weight")) }
        var lines = []any{}
        for i, target := range targets {
          var weight = toint(dig(target, "weight"))
          var line = "use_backend " + dig_string(target, "", "name") + " if " + condition
          if i < len(targets) - 1 {
            line = line + " { rand(" + tostring(remaining) + ") -m int lt " + tostring(weight) + " }"
          }
          lines = append(lines, line)
          remaining = remaining - weight
        }
        return lines
      } -%}

  util-ssl-bind-options:
    template: >-
      {{- " " -}}ssl crt-list {{ pathResolver.GetPath("certificate-list.txt", "crt-list") }} alpn h2,http/1.1{% if extraContext | dig("tls", "sessionTickets", "enabled") | fallback(false) %} tls-ticket-keys {{ pathResolver.GetPath("tls-ticket-keys", "file") }}{% end %}

  # Macro twin of util-ssl-bind-options for per-(Gateway, listener) crt-lists; the
  # bare snippet above stays so the chart-static call site remains a one-liner.
  util-ssl-bind-options-for-crtlist:
    template: |
      {%- macro SSLBindOptionsForCrtlist(crtlistFilename string) string -%}
        {{- " " -}}ssl crt-list {{ pathResolver.GetPath(crtlistFilename, "crt-list") }} alpn h2,http/1.1{% if extraContext | dig("tls", "sessionTickets", "enabled") | fallback(false) %} tls-ticket-keys {{ pathResolver.GetPath("tls-ticket-keys", "file") }}{% end %}
      {%- end -%}

  # QUIC twin of a TLS bind: same port over UDP, same certificates, ALPN h3. ""
  # when HTTP/3 is off or the bind caps TLS below 1.3, which QUIC requires.
  util-http3-bind:
    template: |-
      {%- var HTTP3Bind = func(port int, crtlistFilename string, suffix string) string {
        if tostring(extraContext | dig("http3", "enabled") | fallback(true)) != "true" ||
          regex_search(suffix, `ssl-max-ver (SSLv3|TLSv1\.[0-2])`) {
          return ""
        }
        var crtlist, _ = pathResolver.GetPath(crtlistFilename, "crt-list")
        var line = "bind quic4@:" + tostring(port) + " ssl crt-list " + crtlist + " alpn h3"
        if tostring(extraContext | dig("tls", "sessionTickets", "enabled") | fallback(false)) == "true" {
          var ticketKeys, _ = pathResolver.GetPath("tls-ticket-keys", "file")
          line = line + " tls-ticket-keys " + ticketKeys
        }
        return line + suffix
      } -%}

  # alt-svc for responses received on a port that has a QUIC bind in `binds`, so
  # HTTP/3 is never advertised for a listener that isn't there. Never on the
  # PROXY-protocol listener (direct, or via the passthrough loopback's TLV): QUIC
  # can't carry the PROXY header, so h3 clients would lose their real address.
  util-http3-alt-svc:
    template: |-
      {%- var HTTP3AltSvc = func(binds string) string {
        var ports = []string{}
        for _, line := range split(binds, "\n") {
          var trimmed = trimSpace(line)
          if hasPrefix(trimmed, "bind quic4@:") {
            ports = append(ports, split(trimmed[len("bind quic4@:"):], " ")[0])
          }
        }
        if len(ports) == 0 {
          return ""
        }
        var cond = "{ dst_port " + join(ports, " ") + " }"
        if tostring(extraContext | dig("proxyProtocol", "enabled") | fallback(false)) == "true" {
          cond = cond + " !{ so_name https-proxy-protocol } !{ fc_pp_tlv(0xE0) -m str https-proxy-protocol }"
        }
        var maxAge = tostring(toint(extraContext | dig("http3", "altSvc", "maxAge") | fallback(86400)))
        var header = func(port string) string {
          return `http-after-response set-header alt-svc "h3=\":` + port + `\"; ma=` + maxAge + `" if ` + cond
        }
        var advertised = toint(extraContext | dig("http3", "altSvc", "port") | fallback(0))
        if advertised > 0 {
          return "# ssl/http3-alt-svc\n" + header(tostring(advertised))
        }
        return "# ssl/http3-alt-svc: advertise the port the client used for HTTPS\n" +
          `http-request set-var(txn.h3_port) req.hdr(host),regsub("^.*:","") if { req.hdr(host) -m reg :[0-9]+$ }` + "\n" +
          header("%[var(txn.h3_port)]") + " { var(txn.h3_port) -m found }\n" +
          header("443") + " !{ var(txn.h3_port) -m found }"
      } -%}

  # 80 bytes: an 8-byte YYYYMMDD marker inside HAProxy's public 16-byte key-NAME
  # field, then 72 crypto-random bytes (AES-256 + HMAC halves stay full-entropy).
  # The marker dates the key because HAProxy rejects comment lines in this file.
  util-ticket-key:
    template: |
      {%- macro NewTicketKey(dateStr string) string -%}
        {{- base64(dateStr + cycleRandomBytes(72)) -}}
      {%- end -%}

  global-settings-410-ssl-ciphers:
    template: |
      {# Per-listener Gateway TLS options (gateway/92-listener-tls-options) still
          override these per bind. #}
      {%- var ciphers = tostring(extraContext | dig("tls", "ciphers") | fallback("")) -%}
      {%- var ciphersuites = tostring(extraContext | dig("tls", "ciphersuites") | fallback("")) -%}
      {%- var minVer = tostring(extraContext | dig("tls", "minVersion") | fallback("")) -%}
      {#- These render verbatim into the global section. The error names the KEY, never
          the value: a value that failed the charset check may carry the very control
          characters the guard exists to keep out of logs and Events. -#}
      {%- if ciphers != "" && regex_search(ciphers, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.ciphers: only cipher characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if ciphersuites != "" && regex_search(ciphersuites, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.ciphersuites: only cipher characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if minVer != "" && regex_search(minVer, "[^A-Za-z0-9:._+-]") -%}
        {{ fail("Invalid extraContext.tls.minVersion: only version characters (A-Z a-z 0-9 : _ + . -) are allowed — config-injection guard.") }}
      {%- end -%}
      {%- if ciphers != "" %}
      ssl-default-bind-ciphers {{ ciphers }}
      {%- end %}
      {%- if ciphersuites != "" %}
      ssl-default-bind-ciphersuites {{ ciphersuites }}
      {%- end %}
      {%- if minVer != "" %}
      ssl-default-bind-options ssl-min-ver {{ minVer }}
      {%- end %}

  util-crtlist-line:
    template: |
      {# Never add `ca-ignore-err all` / `crt-ignore-err all` here: they are
          bind-scope and HAProxy rejects them inside a crt-list line (the
          per-Gateway bind emits them instead). Empty sniSuffix = catchall. #}
      {%- macro CrtListLine(certFilename string, mtlsCfg any, sniSuffix string) string %}
        {%- var opts = "ocsp-update on" %}
        {%- if mtlsCfg != nil %}
          {%- var cfg = mtlsCfg.(map[string]any) %}
          {%- var caPath = tostring(cfg["ca_path"]) %}
          {%- var verifyMode = tostring(cfg["verify_mode"]) %}
          {%- if caPath != "" && verifyMode != "" %}
            {%- opts = opts + " ca-file " + caPath + " verify " + verifyMode %}
          {%- end %}
        {%- end %}
        {%- var line = certFilename + " [" + opts + "]" %}
        {%- if sniSuffix != "" %}
          {%- line = line + " " + sniSuffix %}
        {%- end %}
        {{- line -}}
      {%- end %}

  log-fields-200-tls:
    template: |-
      {# Gated per INSTALL, not per frontend: one format string is shared by every
          HTTP frontend, so a per-frontend gate would break the single JSON schema
          (ssl_fc_* render "" on plain HTTP). Cipher omitted — the global
          ssl-default-bind-ciphers policy makes it near-constant fleet-wide. #}
      {%- var gfRaw = shared.Get("globalFeatures") -%}
      {%- if gfRaw != nil && tostring(gfRaw.(map[string]any) | dig("needHTTPSFrontend")) == "true" %}
      %(tls_version)[ssl_fc_protocol]
      %(tls_sni)[ssl_fc_sni]
      {%- end %}

  log-fields-205-tls-resumption:
    template: |-
      {# Typed :bool is safe only because ssl_fc_is_resumed always resolves (false on
          a fresh handshake and on plain HTTP); an unresolved fetch would render ""
          into a boolean slot. No metric exposes the resumption rate. #}
      {%- if extraContext | dig("tls", "sessionTickets", "enabled") | fallback(false) %}
      %(tls_resumed:bool)[ssl_fc_is_resumed]
      {%- end %}

  features-050-ssl-initialization:
    template: |
      {# Seed only keys ssl.yaml owns. Keys owned end-to-end by a Level 2+ library
         (gateway's mtlsBlockedListeners, gatewayListenerMTLSConfig) self-seed in
         their producing snippet — ssl.yaml must not know about them. #}
      {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any {
        return map[string]any{
          "sslPassthroughBackends":      []any{},
          "tlsCertificates":             []any{},
          "sslRedirectHosts":            []any{},
          "clientCertVerifyHosts":       map[string]any{},
          "bindHTTPDefault":             false,
          "bindHTTPSDefault":            false,
          "needHTTPFrontend":            false,
          "needHTTPSFrontend":           false,
        }
      }) -%}
      {#- globalFeatures may have been created by another library without these keys. -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- if gf["sslPassthroughBackends"] == nil -%}
        {%- gf["sslPassthroughBackends"] = []any{} -%}
      {%- end -%}
      {%- if gf["tlsCertificates"] == nil -%}
        {%- gf["tlsCertificates"] = []any{} -%}
      {%- end -%}
      {%- if gf["sslRedirectHosts"] == nil -%}
        {%- gf["sslRedirectHosts"] = []any{} -%}
      {%- end -%}
      {%- if gf["clientCertVerifyHosts"] == nil -%}
        {%- gf["clientCertVerifyHosts"] = map[string]any{} -%}
      {%- end -%}
      {#- Each resource library's features-100-* ORs into these. bindHTTP(S)Default is
          narrower than needHTTP(S)Frontend: a listener on a non-default port needs the
          frontend but leaves the chart-static bind off, and a listener whose cert
          failed validation deliberately leaves bindHTTPSDefault false so HAProxy never
          answers its handshakes. -#}
      {%- if gf["bindHTTPDefault"] == nil -%}
        {%- gf["bindHTTPDefault"] = false -%}
      {%- end -%}
      {%- if gf["bindHTTPSDefault"] == nil -%}
        {%- gf["bindHTTPSDefault"] = false -%}
      {%- end -%}
      {%- if gf["needHTTPFrontend"] == nil -%}
        {%- gf["needHTTPFrontend"] = false -%}
      {%- end -%}
      {%- if gf["needHTTPSFrontend"] == nil -%}
        {%- gf["needHTTPSFrontend"] = false -%}
      {%- end -%}

  features-085-ssl-hsts-global:
    template: |
      {# Global default only: frontend-filters-080-hsts emits the per-host rule after
          this one and set-header replaces, so a per-Ingress annotation still wins. #}
      {%- var enabled bool = extraContext | dig("tls", "hsts", "enabled") | fallback(false) -%}
      {%- if enabled -%}
        {%- var maxAge = extraContext | dig("tls", "hsts", "maxAge") | fallback("31536000") | tostring() -%}
        {%- if regex_search(maxAge, "[[:cntrl:]]") -%}{{ fail("Invalid extraContext.tls.hsts.maxAge '" + maxAge + "': must not contain control characters — config-injection guard.") }}{%- end -%}
        {%- var value = "max-age=" + maxAge -%}
        {%- if extraContext | dig("tls", "hsts", "includeSubdomains") | fallback(false) -%}{%- value = value + "; includeSubDomains" -%}{%- end -%}
        {%- if extraContext | dig("tls", "hsts", "preload") | fallback(false) -%}{%- value = value + "; preload" -%}{%- end -%}
        {%- var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} }) -%}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
        {%- gf["hstsGlobalValue"] = value -%}
      {%- end -%}

  features-110-ssl-ticket-keys:
    template: |
      {%- import "util-ticket-key" for NewTicketKey -%}
      {#- One shared key file per fleet, so a ticket sealed by any pod resumes on any
          other. Rotation reads the deployed file back from currentFiles and keys off
          the newest key's date marker; cycleRandomBytes must stay on the seed/rotate paths
          only, or every render differs and reloads HAProxy. The 3-key window keeps
          yesterday's tickets resumable. -#}
      {%- if extraContext | dig("tls", "sessionTickets", "enabled") | fallback(false) -%}
        {#- sessionTicketsToday pins the marker for tests; production uses the clock. -#}
        {%- var today = tostring(extraContext | dig("tls", "sessionTicketsToday") | fallback("")) -%}
        {%- if today == "" -%}{%- today = cycleTimeBucket(86400, "20060102") -%}{%- end -%}
        {%- var cur = tostring(currentFiles["tls-ticket-keys"] | fallback("")) -%}
        {%- var lines = []string{} -%}
        {%- if cur != "" -%}
          {%- for _, ln := range split(trimSpace(cur), "\n") -%}
            {%- if trimSpace(tostring(ln)) != "" -%}
              {%- lines = append(lines, trimSpace(tostring(ln))) -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- var out = []string{} -%}
        {%- if len(lines) < 3 -%}
          {%- out = []string{NewTicketKey(today), NewTicketKey(today), NewTicketKey(today)} -%}
        {%- else -%}
          {%- var newest = tostring(lines[len(lines)-1]) -%}
          {%- var decoded = newest | b64decode() -%}
          {%- var marker = "" -%}
          {%- if len(decoded) >= 8 -%}{%- marker = decoded[:8] -%}{%- end -%}
          {%- if marker == today -%}
            {%- out = lines -%}
          {%- else -%}
            {%- out = []string{lines[len(lines)-2], lines[len(lines)-1], NewTicketKey(today)} -%}
          {%- end -%}
        {%- end -%}
        {%- var content = join(out, "\n") + "\n" -%}
        {%- var _, tkErr = fileRegistry.Register("file", "tls-ticket-keys", content) -%}
        {%- if tkErr != nil -%}{{ fail("failed to register tls-ticket-keys file: " + tostring(tkErr)) }}{%- end -%}
      {%- end -%}

  features-140-ssl-passthrough-binds:
    template: |
      {# Lives here, not in gateway/: an annotation-driven passthrough with no Gateway
          API left bindHTTPSDefault false and silently skipped the ssl-tcp frontend.
          Passthrough deliberately does NOT set needHTTPSTermination — a port with only
          TLS listeners must RST unclaimed SNIs, not serve the 404 the ssl-loopback
          fall-through would give. #}
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var passthroughBackends = SSLPassthroughBackends() %}
      {%%
        if len(passthroughBackends) > 0 {
          gf["bindHTTPSDefault"] = true
          gf["needHTTPSFrontend"] = true
        }
      %%}

  util-ssl-default-certificate-bindings:
    template: |-
      {%- var namespace = extraContext | dig_string("haptic", "tls", "defaultCertificate", "namespace") -%}
      {%- var name = extraContext | dig_string("default-ssl-cert", "tls", "defaultCertificate", "name") -%}
      {{- toJSON(map[string]any{"secrets": map[string]any{
        "keys": []any{namespace, name}, "cell": "default", "key": namespace + "/" + name,
      }}) -}}

  util-ssl-default-ecdsa-certificate-bindings:
    template: |-
      {%- var namespace = extraContext | dig_string("haptic", "tls", "defaultCertificate", "namespace") -%}
      {%- var name = extraContext | dig_string("", "tls", "defaultCertificate", "ecdsaName") -%}
      {%- if name == "" -%}
        {{- toJSON(map[string]any{}) -}}
      {%- else -%}
        {{- toJSON(map[string]any{"secrets": map[string]any{
          "keys": []any{namespace, name}, "cell": "ecdsa", "key": namespace + "/" + name,
        }}) -}}
      {%- end -%}

  ssl-default-certificates-100-secret:
    requires: [secrets]
    incremental:
      mode: resourceProjection
      bindingsTemplate: '{{- render "util-ssl-default-certificate-bindings" -}}'
      group: ssl-default-certificates
      effects: [publishValue]
    template: '{{- "" -}}'

  ssl-default-ecdsa-certificates-100-secret:
    requires: [secrets]
    incremental:
      mode: resourceProjection
      bindingsTemplate: '{{- render "util-ssl-default-ecdsa-certificate-bindings" -}}'
      group: ssl-default-ecdsa-certificates
      effects: [publishValue]
    template: '{{- "" -}}'

  features-150-ssl-crtlist:
    requires: [secrets]
    template: |
      {%- import "util-crtlist-line" for CrtListLine -%}
      {%- var gf = shared.Get("globalFeatures") -%}
      {#- The default cert MUST be the crt-list's FIRST line: HAProxy uses that entry
          for unmatched/absent SNI and inherits ITS options, so a per-host
          `verify required` line landing first makes every unmatched handshake demand
          a client cert (PEER_DID_NOT_RETURN_A_CERTIFICATE). A Gateway listener with
          no hostname outranks the chart default ("no hostname = any hostname", and its
          client may trust only that cert's CA); ties sort by ns/name because map
          iteration order would otherwise change the choice between renders. -#}
      {%- var clientCertVerifyHosts = coalesce(gf["clientCertVerifyHosts"], map[string]any{}).(map[string]any) -%}
      {%- var clientCAPaths = map[string]string{} -%}
      {%- for _, fileAny := range incremental_values("mtls-host-policies", "files") -%}
        {%- var file = fileAny.(map[string]any) -%}
        {%- var filename = tostring(file["filename"]) -%}
        {%- var path, regErr = fileRegistry.Register("file", filename, tostring(file["content"])) -%}
        {%- if regErr != nil -%}
          {{- fail("failed to register client CA " + filename + ": " + tostring(regErr)) -}}
        {%- end -%}
        {%- clientCAPaths[filename] = path -%}
      {%- end -%}
      {%- for _, policyAny := range incremental_values("mtls-host-policies", "verifyHosts") -%}
        {%- var policy = policyAny.(map[string]any) -%}
        {%- var filename = tostring(policy["filename"]) -%}
        {%- clientCertVerifyHosts[tostring(policy["host"])] = map[string]any{
          "ca_path": clientCAPaths[filename],
          "verify_mode": tostring(policy["verifyMode"]),
        } -%}
      {%- end -%}
      {%- var tlsCerts []any = coalesce(gf["tlsCertificates"], []any{}) -%}

      {%- var defaultCertFilename = "default.pem" -%}
      {%- var gatewayDefaultCandidates = []any{} -%}
      {%- for _, tlsCert := range tlsCerts -%}
        {%- var tc any = tlsCert -%}
        {%- if dig(tc, "is_gateway_default") | fallback(false) -%}
          {%- gatewayDefaultCandidates = append(gatewayDefaultCandidates, tc) -%}
        {%- end -%}
      {%- end -%}
      {%- if len(gatewayDefaultCandidates) > 0 -%}
        {%- var keyMap = map[string]map[string]any{} -%}
        {%- var keys = []any{} -%}
        {%- for _, tc := range gatewayDefaultCandidates -%}
          {%- var tcm = tc.(map[string]any) -%}
          {%- var k = tostring(tcm["secret_namespace"]) + "/" + tostring(tcm["secret_name"]) -%}
          {%- keyMap[k] = tcm -%}
          {%- keys = append(keys, k) -%}
        {%- end -%}
        {%- var sortedKeys = sort_strings(keys) -%}
        {%- var winner = keyMap[tostring(sortedKeys[0])] -%}
        {%- defaultCertFilename = tostring(winner["sanitized_filename"] | fallback(tostring(winner["secret_namespace"]) + "_" + tostring(winner["secret_name"]) + ".pem")) -%}
      {%- end -%}
      {#- gateway.yaml records a no-hostname listener's client-cert config under the
          wildcard key "*"; the default line must carry it or unmatched-SNI handshakes
          are answered without client-cert verification. -#}
      {%- var defaultCfg = clientCertVerifyHosts["*"] -%}
      {#- Both default lines must carry the "*" SNI filter, never the single-cert empty
          suffix: with two empty-SNI lines HAProxy keeps only the first as the implicit
          default and the RSA fallback silently breaks for no-SNI clients (HAProxy 3.4).
          ECDSA is emitted first so modern clients get it by precedence. -#}
      {%- var ecdsaDefaultName = tostring(extraContext | dig("tls", "defaultCertificate", "ecdsaName") | fallback("")) -%}
      {%- var ecdsaDefaultFilename = "" -%}
      {%- if ecdsaDefaultName != "" && len(gatewayDefaultCandidates) == 0 -%}
        {%- var ecdsaDefaultNs = tostring(extraContext | dig("tls", "defaultCertificate", "namespace") | fallback("haptic")) -%}
        {{- render "ssl-default-ecdsa-certificates-100-secret" -}}
        {%- var ecdsaCertificates = incremental_values("ssl-default-ecdsa-certificates", "ecdsa") -%}
        {%- if len(ecdsaCertificates) == 0 -%}
        {{ fail("Default ECDSA TLS Secret not found: " + ecdsaDefaultNs + "/" + ecdsaDefaultName + ". Ensure the Secret exists and is watched.") }}
        {%- end -%}
        {%- var ecdsaCertificate = ecdsaCertificates[0].(map[string]any) -%}
        {%- var ecdsaCertificateData = dig(ecdsaCertificate, "data", "tls.crt") -%}
        {%- var ecdsaKeyData = dig(ecdsaCertificate, "data", "tls.key") -%}
        {%- if ecdsaCertificateData == nil || ecdsaKeyData == nil -%}
        {{ fail("Invalid default ECDSA TLS Secret " + ecdsaDefaultNs + "/" + ecdsaDefaultName + ": missing tls.crt or tls.key fields.") }}
        {%- end -%}
        {%- var ecdsaPem = (tostring(ecdsaCertificateData) | b64decode()) +
          "\n" + (tostring(ecdsaKeyData) | b64decode()) -%}
        {%- var ecdsaPath, ecdsaRegErr = fileRegistry.Register(
          "cert", ecdsaDefaultNs + "_" + ecdsaDefaultName + ".pem", ecdsaPem) -%}
        {%- if ecdsaRegErr != nil -%}{{ fail("failed to register default ECDSA certificate: " + tostring(ecdsaRegErr)) }}{%- end -%}
        {%- ecdsaDefaultFilename = basename(ecdsaPath) -%}
      {%- end -%}
      {%- var crtlistLines []any = []any{} -%}
      {%- if ecdsaDefaultFilename != "" -%}
        {%- crtlistLines = []any{CrtListLine(ecdsaDefaultFilename, defaultCfg, "*"), CrtListLine(defaultCertFilename, defaultCfg, "*")} -%}
      {%- else -%}
        {%- crtlistLines = []any{CrtListLine(defaultCertFilename, defaultCfg, "")} -%}
      {%- end -%}

      {#- SNIs under one cert may need different per-line ssl-options (per-host
         auth-tls-secret), so group by (ca_path, verify_mode): HAProxy accepts the
         same cert on several crt-list lines with different options. -#}
      {%- for _, tlsCert := range tlsCerts -%}
        {%- var tc any = tlsCert -%}
        {%- var certFilename = tc | dig("sanitized_filename") | fallback(tostring(tc | dig("secret_namespace")) + "_" + tostring(tc | dig("secret_name")) + ".pem") -%}
        {%- var snis []any = coalesce(tc | dig("sni_patterns"), []any{}).([]any) -%}

        {#- Empty group key = no client-cert verify. -#}
        {%- var snisByConfig = map[string][]any{} -%}
        {%- var configForKey = map[string]any{} -%}
        {%- for _, sni := range snis -%}
          {%- var cfgRaw = clientCertVerifyHosts[tostring(sni)] -%}
          {%- var key = "" -%}
          {%- if cfgRaw != nil -%}
            {%- var cfg = cfgRaw.(map[string]any) -%}
            {%- key = tostring(cfg["ca_path"]) + ":" + tostring(cfg["verify_mode"]) -%}
            {%- configForKey[key] = cfg -%}
          {%- end -%}
          {%- if snisByConfig[key] == nil -%}
            {%- snisByConfig[key] = []any{} -%}
          {%- end -%}
          {%- snisByConfig[key] = append(snisByConfig[key], sni) -%}
        {%- end -%}

        {#- Sort the group keys: map iteration order is unstable across renders, and a
           reordered crt-list reloads HAProxy even when the inputs are identical. -#}
        {%- var keyList = []any{} -%}
        {%- for k := range snisByConfig -%}
          {%- keyList = append(keyList, k) -%}
        {%- end -%}
        {%- var sortedKeys = sort_strings(keyList) -%}
        {%- for _, key := range sortedKeys -%}
          {%- var groupSnis = snisByConfig[key] -%}
          {%- var cfg any = nil -%}
          {%- if key != "" -%}
            {%- cfg = configForKey[key] -%}
          {%- end -%}
          {%- var sniList = groupSnis | toStringSlice() | join(" ") -%}
          {%- var line = CrtListLine(tostring(certFilename), cfg, sniList) -%}
          {%- crtlistLines = append(crtlistLines, line) -%}
        {%- end -%}
      {%- end -%}

      {#- Trailing newline required by HAProxy's parser. -#}
      {%- var crtlistContent = (crtlistLines | toStringSlice() | join("\n")) + "\n" -%}
      {%- var _, crtListErr = fileRegistry.Register("crt-list", "certificate-list.txt", crtlistContent) -%}
      {%- if crtListErr != nil -%}{{ fail("failed to register crt-list: " + tostring(crtListErr)) }}{%- end -%}

  features-160-ssl-redirect-map:
    template: |
      {# Map value 1 is a presence marker for `-m found`. #}

      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}

      {#- Deduplicate with a local presence set, never `first_seen`: its cross-render
          cache leaked between renders and emitted an empty map while
          frontend-filters-050-ssl-redirect still referenced it. Map registration here
          and the rule there must stay in lockstep. -#}
      {%- var hostsByCode = map[string][]any{} -%}
      {%- var seenByCode = map[string]map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- var e any = entry -%}
        {%- var code = tostring(e | dig("code")) -%}
        {%- var host = tostring(e | dig("host")) -%}
        {%- if seenByCode[code] == nil -%}
          {%- seenByCode[code] = map[string]bool{} -%}
          {%- hostsByCode[code] = []any{} -%}
        {%- end -%}
        {%- if !seenByCode[code][host] -%}
          {%- seenByCode[code][host] = true -%}
          {%- hostsByCode[code] = append(hostsByCode[code], host) -%}
        {%- end -%}
      {%- end -%}

      {%- for code, hosts := range hostsByCode -%}
        {%- var lines = []string{} -%}
        {%- for _, host := range hosts -%}
          {%- lines = append(lines, tostring(host) + " 1") -%}
        {%- end -%}
        {%- var mapContent = join(lines, "\n") + "\n" -%}
        {%- var mapFilename = "ssl-redirect-" + code + ".map" -%}
        {%- var _, mapErr = fileRegistry.Register("map", mapFilename, mapContent) -%}
        {%- if mapErr != nil -%}{{ fail("failed to register ssl redirect map: " + tostring(mapErr)) }}{%- end -%}
      {%- end -%}

  frontend-filters-050-ssl-redirect:
    template: |
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}

      {%- var codes = map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- var e any = entry -%}
        {%- codes[tostring(e | dig("code"))] = true -%}
      {%- end -%}

      {#- keys(): map order is random, and these are first-match-wins rules. -#}
      {%- for _, code := range keys(codes) %}
      # ssl/frontend-filters-ssl-redirect (code {{ code }})
      http-request redirect scheme https code {{ code }} if !{ ssl_fc } { var(txn.host),map_str({{ pathResolver.GetPath("ssl-redirect-" + code + ".map", "map") }}) -m found }
      {%- end %}

  # HTTPS twin of base.yaml's http-bind-extra-010-proxy-protocol. Skipped when
  # passthrough moves the HTTPS port to ssl-tcp — terminating here would take
  # passthrough hosts out of SNI routing.
  https-bind-extra-010-proxy-protocol:
    template: |
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- var gfMap = shared.Get("globalFeatures").(map[string]any) -%}
      {%- var passthroughBackends = SSLPassthroughBackends() -%}
      {%- var sslTCPOwnsPort = len(passthroughBackends) > 0 && tostring(gfMap | dig("bindHTTPSDefault")) == "true" -%}
      {%- if !sslTCPOwnsPort && tostring(extraContext | dig("proxyProtocol", "enabled") | fallback(false)) == "true" %}
      bind *:{{ toint(extraContext | dig("proxyProtocol", "httpsPort") | fallback(8444)) }} accept-proxy name https-proxy-protocol{{ render "util-ssl-bind-options" }}
      {%- end -%}

  # Passthrough half of the pair above. `frontend ssl-tcp` exists only when it
  # owns the HTTPS port, so the topology check is the render site itself.
  ssl-tcp-bind-extra-010-proxy-protocol:
    template: |
      {%- if tostring(extraContext | dig("proxyProtocol", "enabled") | fallback(false)) == "true" %}
      bind *:{{ toint(extraContext | dig("proxyProtocol", "httpsPort") | fallback(8444)) }} accept-proxy name https-proxy-protocol
      {%- end -%}

  frontends-500-ssl-tcp:
    template: |
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- import "util-ssl-sni-use-backend-lines" for SNIUseBackendLines -%}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var gfMap = gf.(map[string]any) -%}
      {%- var passthroughBackends = SSLPassthroughBackends() -%}
      {%- var bindHTTPSDefault = tostring(gfMap | dig("bindHTTPSDefault")) == "true" -%}
      {%- if len(passthroughBackends) > 0 && bindHTTPSDefault -%}
      # ssl/frontends-ssl-tcp

      frontend ssl-tcp
          guid fe:ssl-tcp
          mode tcp{{ render "util-log-format-tcp" }}
          bind *:{{ extraContext | dig("httpsPort") | fallback(8443) }}
          {{ render_glob "ssl-tcp-bind-extra-*" | indent(2, true) }}

          # Extract SNI for routing decisions (wait up to 5s for client hello)
          tcp-request inspect-delay 5s

          {# SNI claim contract: reject when a TLS-Passthrough listener's hostname
              pattern matches but no TLSRoute under THAT Gateway claims the SNI; an SNI
              matching no listener pattern falls through, since an HTTPS-terminating
              listener may legitimately want it. The ACLs and rejects are per-Gateway
              because one bind is shared by every Gateway on this port and a sibling
              Gateway's wider pattern must not rescue an SNI this one doesn't claim.
              The rejects MUST precede `tcp-request content accept` — accept ends the
              tcp-request content phase, so a later reject never fires. Ingress-level
              entries carry no Gateway identity and keep their fall-through. #}
          {%%
            var byGateway = map[string]any{}
            var gwOrder = []any{}
            var hasIngressEntry = false
            var validPassthroughCount = 0
            for _, backend := range passthroughBackends {
              var b = backend.(map[string]any)
              var bMode = tostring(b["mode"] | fallback("Passthrough"))
              if bMode != "Passthrough" {
                continue
              }
              var gwNs = tostring(b | dig("gw_namespace") | fallback(""))
              var gwName = tostring(b | dig("gw_name") | fallback(""))
              if gwName == "" {
                hasIngressEntry = true
                continue
              }
              var gwKey = gwNs + ":" + gwName
              var gi map[string]any
              if existing, ok := byGateway[gwKey]; ok {
                gi = existing.(map[string]any)
              } else {
                gi = map[string]any{
                  "ns":               gwNs,
                  "name":             gwName,
                  "listenerPatterns": map[string]bool{},
                  "hasEmptyListener": false,
                  "routeSNIs":        map[string]bool{},
                  "invalidSNIs":      map[string]bool{},
                }
                byGateway[gwKey] = gi
                gwOrder = append(gwOrder, gwKey)
              }
              var lh = tostring(b | dig("listener_hostname") | fallback(""))
              if lh == "" {
                gi["hasEmptyListener"] = true
              } else {
                gi["listenerPatterns"].(map[string]bool)[lh] = true
              }
              var bInvalid = tostring(b | dig("invalid") | fallback("false")) == "true"
              var sni = tostring(b["sni"])
              if bInvalid {
                gi["invalidSNIs"].(map[string]bool)[sni] = true
              } else {
                gi["routeSNIs"].(map[string]bool)[sni] = true
                validPassthroughCount = validPassthroughCount + 1
              }
            }
            var gwOrderSorted = sort_strings(gwOrder)
          %%}
          {%- for _, gwKey := range gwOrderSorted %}
            {%%
              var gi = byGateway[tostring(gwKey)].(map[string]any)
              var aclSan = "gw_" + replace(replace(replace(replace(tostring(gi["ns"]) + "_" + tostring(gi["name"]), "-", "_"), ".", "_"), ":", "_"), "/", "_")
              var listenerPatterns = gi["listenerPatterns"].(map[string]bool)
              var hasEmptyListener = gi["hasEmptyListener"].(bool)
              var routeSNIs = gi["routeSNIs"].(map[string]bool)
              var invalidSNIs = gi["invalidSNIs"].(map[string]bool)
            %%}
            {%%
              var lpRaw = []any{}
              for k := range listenerPatterns {
                lpRaw = append(lpRaw, k)
              }
              var lpKeys = sort_strings(lpRaw)
              var rsRaw = []any{}
              for k := range routeSNIs {
                rsRaw = append(rsRaw, k)
              }
              var rsKeys = sort_strings(rsRaw)
              var invRaw = []any{}
              for k := range invalidSNIs {
                invRaw = append(invRaw, k)
              }
              var invKeys = sort_strings(invRaw)
            %%}
            {%- for _, lpAny := range lpKeys %}
              {%- var lp = tostring(lpAny) %}
              {%- if hasPrefix(lp, "*.") %}
          acl {{ aclSan }}_listener_sni req_ssl_sni -m end {{ lp[1:] }}
              {%- else %}
          acl {{ aclSan }}_listener_sni req_ssl_sni -m str {{ lp }}
              {%- end %}
            {%- end %}
            {%- for _, sniAny := range rsKeys %}
              {%- var sni = tostring(sniAny) %}
              {%- if hasPrefix(sni, "*.") %}
          acl {{ aclSan }}_route_sni req_ssl_sni -m end {{ sni[1:] }}
              {%- else %}
          acl {{ aclSan }}_route_sni req_ssl_sni -m str {{ sni }}
              {%- end %}
            {%- end %}
            {%- for _, sniAny := range invKeys %}
              {%- var sni = tostring(sniAny) %}
              {%- if hasPrefix(sni, "*.") %}
          acl {{ aclSan }}_invalid_sni req_ssl_sni -m end {{ sni[1:] }}
              {%- else %}
          acl {{ aclSan }}_invalid_sni req_ssl_sni -m str {{ sni }}
              {%- end %}
            {%- end %}
          {%- end %}
          {%- for _, gwKey := range gwOrder %}
            {%- var gi = byGateway[tostring(gwKey)].(map[string]any) %}
            {%- var aclSan = "gw_" + replace(replace(replace(replace(tostring(gi["ns"]) + "_" + tostring(gi["name"]), "-", "_"), ".", "_"), ":", "_"), "/", "_") %}
            {%- var listenerPatterns = gi["listenerPatterns"].(map[string]bool) %}
            {%- var hasEmptyListener = gi["hasEmptyListener"].(bool) %}
            {%- var routeSNIs = gi["routeSNIs"].(map[string]bool) %}
            {%- var invalidSNIs = gi["invalidSNIs"].(map[string]bool) %}
            {%- if hasEmptyListener %}
              {#- An empty listener claims every SNI. With no valid route the route_sni
                  ACL is never defined, so reject the invalid_sni patterns instead. -#}
              {%- if len(routeSNIs) > 0 %}
          tcp-request content reject if !{{ aclSan }}_route_sni
              {%- else if len(invalidSNIs) > 0 %}
          tcp-request content reject if {{ aclSan }}_invalid_sni
              {%- end %}
            {%- else %}
              {%- if len(routeSNIs) > 0 %}
          tcp-request content reject if {{ aclSan }}_listener_sni !{{ aclSan }}_route_sni
              {%- else if len(listenerPatterns) > 0 %}
          tcp-request content reject if {{ aclSan }}_listener_sni
              {%- end %}
            {%- end %}
          {%- end %}
          tcp-request content accept if { req_ssl_hello_type 1 }

          # Route to passthrough backends by SNI: wildcard *.host → `-m end .host` (single-label
          # subdomain only, not bare host), exact → `-m str`. See
          # https://haproxy-haptic.org/docs/latest/libraries/ssl/#ssl-passthrough
          {# Passthrough-mode only: the gateway builder also emits Terminate entries
             (consumed by frontends-600-gateway-tls-listener), and Ingress entries carry
             no `mode` at all. An `invalid` entry's backend block was suppressed, so
             routing its SNI here would point at nothing; the rejects above cover it. #}
          {% for _, backend := range passthroughBackends -%}
          {%- var b any = backend %}
          {%- var bMode = tostring(b | dig("mode") | fallback("Passthrough")) %}
          {%- var bInvalid = tostring(b | dig("invalid") | fallback("false")) == "true" %}
          {%- if bMode == "Passthrough" && !bInvalid %}
          {%- for _, line := range SNIUseBackendLines(b, "req_ssl_sni") %}
          {{ line }}
          {%- end %}
          {%- end %}
          {%- end %}

          {%- var needHTTPSTermination = tostring(gfMap | dig("needHTTPSTermination")) == "true" %}
          {%- if needHTTPSTermination %}
          # Unmatched SNIs fall through to ssl-loopback (the chart's HTTPS-frontend bridge) for
          # cert-based TLS termination — HTTPS Gateway listeners / Ingress spec.tls.
          default_backend ssl-loopback
          {%- end %}

      {% end -%}

  backends-500-ssl-loopback:
    template: |
      {%- import "util-backend" for Backend -%}
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- var passthroughBackends = SSLPassthroughBackends() -%}
      {%- if len(passthroughBackends) > 0 -%}
      {%- var serverExtra = []any{map[string]any{"name": "send-proxy-v2"}} -%}
      {#- Tells frontend https which ssl-tcp listener accepted the connection; the
          HTTP/3 alt-svc rules skip the PROXY-protocol one. -#}
      {%- if tostring(extraContext | dig("proxyProtocol", "enabled") | fallback(false)) == "true" -%}
        {%- serverExtra = append(serverExtra, map[string]any{"name": "set-proxy-v2-tlv-fmt(0xE0)", "args": []any{"%[so_name]"}}) -%}
      {%- end -%}
      {{ Backend(map[string]any{
           "name": "ssl-loopback",
           "guid": "be:ssl-loopback",
           "mode": "tcp",
           "shape": "structural",
           "comments": []any{"# ssl/backends-ssl-loopback"},
           "servers": []any{map[string]any{"name": "loopback", "address": "unix@/etc/haproxy/ssl-frontend.sock",
             "extra": serverExtra}},
         }) }}
      {%- end -%}

  frontends-500-https:
    template: |
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- import "util-http3-bind" for HTTP3Bind -%}
      {%- import "util-http3-alt-svc" for HTTP3AltSvc -%}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var gfMap = gf.(map[string]any) -%}
      {%- var passthroughBackends = SSLPassthroughBackends() -%}
      {%- var needHTTPSFrontend = tostring(gfMap | dig("needHTTPSFrontend")) == "true" -%}
      {%- var bindHTTPSDefault = tostring(gfMap | dig("bindHTTPSDefault")) == "true" -%}
      {#- Gated because a frontend with no bind is an HAProxy validation error: render
          only when something terminates TLS (Ingress spec.tls, a Gateway HTTPS/TLS
          listener on any port, or passthrough needing the unix-socket loopback). -#}
      {%- if needHTTPSFrontend -%}
      # ssl/frontends-https

      frontend https
          guid fe:https
          mode http
          option forwardfor{{ render "util-http-frontend-settings" }}
      {%- if len(passthroughBackends) > 0 && bindHTTPSDefault %}
          bind unix@/etc/haproxy/ssl-frontend.sock mode 660{{ render "util-ssl-bind-options" }} accept-proxy
      {%- else if bindHTTPSDefault %}
          bind *:{{ extraContext | dig("httpsPort") | fallback(8443) }}{{ render "util-ssl-bind-options" }}
      {%- end %}
      {#- UDP stays free even when ssl-tcp owns the TCP port for passthrough. -#}
      {%- var quicBind = "" %}
      {%- if bindHTTPSDefault %}
        {%- quicBind = HTTP3Bind(toint(extraContext | dig("httpsPort") | fallback(8443)), "certificate-list.txt", "") %}
      {%- end %}
      {%- if quicBind != "" %}
          {{ quicBind }}
      {%- end %}
      {%- var extraBinds = render_glob "https-bind-extra-*" %}
          {{- extraBinds | indent(2, true) }}
      {%- var altSvc = HTTP3AltSvc(quicBind + "\n" + extraBinds) %}
      {%- if altSvc != "" %}
          {{ altSvc | indent(4) }}
      {%- end %}

          {{- render_glob "frontend-extra-*" | indent(2, true) }}

          {{ render "frontend-routing-logic" | indent(2, true) }}

          {{- render_glob "frontend-filters-*" | indent(2, true) }}
          {{- render_glob "frontend-switching-*" | indent(2, true) }}

          # Use backend from txn.backend_name (set by qualifier logic)
          use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }

          # Default backend
          default_backend default_backend
      {%- end -%}

# Only the default cert is declared here; resource libraries register every other
# TLS Secret at render time via fileRegistry as {namespace}_{secretname}.pem.

sslCertificates:
  default.pem:
    template: |
      {%- var certNamespace = extraContext | dig("tls", "defaultCertificate", "namespace") | fallback("haptic") -%}
      {%- var certName = extraContext | dig("tls", "defaultCertificate", "name") | fallback("default-ssl-cert") -%}
      {{- render "ssl-default-certificates-100-secret" -}}
      {%- var defaultCertificates = incremental_values("ssl-default-certificates", "default") -%}
      {%- if len(defaultCertificates) == 0 -%}
      {{ fail("TLS Secret not found: " + certNamespace + "/" + certName + ". Ensure the Secret exists and is watched.") }}
      {%- end -%}
      {%- var defaultCertificate = defaultCertificates[0].(map[string]any) -%}
      {%- var certificate = dig(defaultCertificate, "data", "tls.crt") -%}
      {%- var key = dig(defaultCertificate, "data", "tls.key") -%}
      {%- if certificate == nil || key == nil -%}
      {{ fail("Invalid TLS Secret " + certNamespace + "/" + certName + ": missing tls.crt or tls.key fields. Ensure the Secret is of type kubernetes.io/tls.") }}
      {%- end -%}
      {{- b64decode(tostring(certificate)) -}}
      {{- b64decode(tostring(key)) -}}

validationTests:
  _global:
    description: Global SSL test fixtures
    # Binds the default certificate to the fixture Secret below, also when tests
    # render with the deployment's extraContext, whose certificate exists only in
    # the cluster. Per-test extraContext still overrides this.
    extraContext:
      tls:
        defaultCertificate: {name: default-ssl-cert, namespace: haptic, ecdsaName: ""}
    fixtures:
      secrets:
        # Name + namespace must match the _global extraContext pin above.
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: default-ssl-cert, namespace: haptic}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        # Merged into every test: a fixture referencing `shared-tls` in namespace
        # default needs no cert of its own.
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: shared-tls, namespace: default}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key

  test-ssl-certificate-loading:
    description: Verify default SSL certificate is loaded correctly
    fixtures: {}
    assertions:
      - type: haproxy_valid

  test-ssl-https-frontend-basic:
    description: Verify HTTPS frontend is generated with correct bind options
    fixtures:
      # Without a TLS-terminating resource nothing renders `frontend https`.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: tls-trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: trigger-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "frontend https"}

      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^\s+mode http$.*?^\s+option forwardfor$'

      - {type: contains, target: haproxy.cfg, pattern: "bind .*:443.*ssl crt"}

      - {type: contains, target: haproxy.cfg, pattern: "alpn h2,http/1.1"}

  test-ssl-hsts-global-enabled:
    description: extraContext.tls.hsts.enabled emits a global Strict-Transport-Security header on TLS responses, plus a no-redirect warning
    extraContext: {tls: {hsts: {enabled: true, includeSubdomains: true, preload: true}}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" if \{ ssl_fc \}'
      - {type: contains, target: haproxy.cfg, pattern: "HSTS is enabled globally but no HTTP"}

  test-ssl-hsts-global-disabled:
    description: Without extraContext.tls.hsts.enabled, no global HSTS header is emitted (default off)
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "Strict-Transport-Security"}

  test-ssl-crtlist-basic:
    description: Verify crt-list file is generated with OCSP configuration
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "ssl crt-list .*/certificate-list\\.txt"}

      - {type: contains, target: crt-list:certificate-list.txt, pattern: "default\\.pem \\[ocsp-update on\\]"}

      - {type: not_contains, target: crt-list:certificate-list.txt, pattern: "^\\s*$"}

  test-ssl-certificate-dots-in-name:
    description: SSL certificate with dots in secret name must use sanitized filename
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: default-ssl-cert, namespace: haproxy-haptic}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: api.example.com-tls, namespace: default}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: api-ingress, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - api.example.com
                secretName: api.example.com-tls
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: crt-list:certificate-list.txt, pattern: "default_api_example_com-tls\\.pem"}

  test-ssl-certificate-custom-namespace:
    description: Default SSL certificate from a custom namespace (e.g. cert-manager) loads correctly
    extraContext: {tls: {defaultCertificate: {namespace: cert-manager, name: cluster-cert}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: cluster-cert, namespace: cert-manager}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
    assertions:
      - type: haproxy_valid

  test-ssl-global-cipher-policy-default:
    description: Global TLS policy renders ssl-default-bind-ciphers / -ciphersuites and ssl-min-ver from the extraContext.tls defaults (a forward-secret superset spanning ECDSA, RSA, and DHE families)
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:.*ECDHE-RSA-AES128-GCM-SHA256.*DHE-RSA-AES256-SHA'
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256'
      - {type: contains, target: haproxy.cfg, pattern: 'ssl-default-bind-options ssl-min-ver TLSv1\.2'}

  test-ssl-global-cipher-policy-override:
    description: extraContext.tls overrides render (custom ciphers, lowered minVersion) and an empty value omits its directive (falls back to HAProxy's built-in default). In real charts a values.yaml override of one sub-key is Helm deep-merged with the library defaults (config template, not exercised by this harness)
    extraContext:
      tls:
        ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
        ciphersuites: ""
        minVersion: "TLSv1.0"
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256'
      - {type: contains, target: haproxy.cfg, pattern: 'ssl-default-bind-options ssl-min-ver TLSv1\.0'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'ssl-default-bind-ciphersuites'}

  test-ssl-global-cipher-policy-injection-guard:
    description: A cipher value containing characters outside the cipher/version charset (here a newline) is rejected by the config-injection guard
    extraContext: {tls: {ciphers: "ECDHE-RSA-AES128-GCM-SHA256\n  evil-injected-directive"}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "config-injection guard"}

  test-ssl-dual-cert-rsa-ecdsa:
    description: An Ingress may reference two TLS Secrets (one ECDSA, one RSA) for the same host; both certs are emitted to the crt-list under the same SNI so HAProxy serves RSA or ECDSA per client capability
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: dual-ecdsa, namespace: default}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: dual-rsa, namespace: default}
          data:
            tls.crt: *test_tls_crt_rsa
            tls.key: *test_tls_key_rsa
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: dual-svc, namespace: default}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: dual-cert-ingress, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["dual.example.com"]
                secretName: dual-ecdsa
              - hosts: ["dual.example.com"]
                secretName: dual-rsa
            rules:
              - host: dual.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: dual-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_dual-ecdsa\.pem \[ocsp-update on\] dual\.example\.com'
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_dual-rsa\.pem \[ocsp-update on\] dual\.example\.com'

  test-ssl-dual-default-cert:
    description: >-
      defaultSSLCertificate with an ECDSA companion (ecdsaSecretName) emits TWO
      default crt-list lines using the "*" SNI filter — the ECDSA companion first
      (precedence), the primary cert second — so HAProxy serves ECDSA to modern
      clients and the primary cert to the rest on the no-SNI / unmatched-SNI
      path. The "*" filter (not the single-cert empty suffix) is what makes the
      fallback work.
    extraContext:
      tls: {defaultCertificate: {namespace: default, name: default-rsa-cert, ecdsaName: default-ecdsa-cert}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: default-rsa-cert, namespace: default}
          data:
            tls.crt: *test_tls_crt_rsa
            tls.key: *test_tls_key_rsa
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: default-ecdsa-cert, namespace: default}
          data:
            tls.crt: *test_tls_crt
            tls.key: *test_tls_key
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_default-ecdsa-cert\.pem \[ocsp-update on\] \*'
      - {type: contains, target: crt-list:certificate-list.txt, pattern: 'default\.pem \[ocsp-update on\] \*'}
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: 'default_default-ecdsa-cert\.pem \[ocsp-update on\] \*\ndefault\.pem \[ocsp-update on\] \*'

  test-ssl-single-default-cert-no-companion:
    description: >-
      Without ecdsaSecretName the default cert stays a SINGLE crt-list line with
      the empty-SNI suffix (not "*"). Proves the dual-default path is opt-in and
      that a single default works with any key type (RSA cert used here; the
      default.pem template is algorithm-agnostic) — so RSA-only and ECDSA-only
      defaults are unchanged.
    extraContext: {tls: {defaultCertificate: {namespace: default, name: default-rsa-cert}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: default-rsa-cert, namespace: default}
          data:
            tls.crt: *test_tls_crt_rsa
            tls.key: *test_tls_key_rsa
    assertions:
      - type: haproxy_valid
      - {type: contains, target: crt-list:certificate-list.txt, pattern: 'default\.pem \[ocsp-update on\]'}
      - type: not_contains
        target: crt-list:certificate-list.txt
        pattern: 'default\.pem \[ocsp-update on\] \*'

  test-ssl-session-tickets-seed:
    description: Session tickets enabled with no current file → three fresh STEK keys seeded (stamped today) and every HTTPS bind carries tls-ticket-keys; haproxy -c accepts them
    extraContext: *extracontextTlsSessiontickets
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'bind \*:443 ssl crt-list \S+ alpn h2,http/1\.1 tls-ticket-keys \S*general/tls-ticket-keys'
      # MjAyNjA3Mj is the base64 prefix of "20260721".
      - {type: match_count, target: file:tls-ticket-keys, pattern: 'MjAyNjA3Mj', expected: "3"}

  test-ssl-session-tickets-stable-same-day:
    description: When the newest current key already carries today's marker, the file is re-emitted unchanged — deterministic, so no spurious reload
    extraContext: *extracontextTlsSessiontickets
    currentFiles:
      tls-ticket-keys: |
        MjAyNjA3MjF1lg4Ku7QD/4vBgigOpTeyXBWr7YEbfGGtOvJy4F2jN7yqkvzCXyeKIzSddp+/e40yxVVDQG/6K0qKBzhxUY0QUm9ZC10HVVw=
        MjAyNjA3MjErsIpmS9wItsqQf9wXky/nqJRWDAhc+gzY//LjL4rfJebcDremmtxy07HV6au8uZ5H7uYKgJ8yuUuaIGfnxoV3Kd+7FHNukBs=
        MjAyNjA3MjGrtAkIIsCl/WPGwjgU0w8y6d8ue6eLGA8sKbY+KG3lzHj/1+5f9wRXhqwE691rSVoO5nixjtvP31seO7YnZiZ8inZ34TqSw9o=
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - {type: contains, target: file:tls-ticket-keys, pattern: 'MjAyNjA3MjGrtAkIIsCl'}
      - {type: match_count, target: file:tls-ticket-keys, pattern: 'MjAyNjA3Mj', expected: "3"}

  test-ssl-session-tickets-rotate:
    description: When the newest current key's marker is older than today, the 3-key window slides — drop the oldest, keep two, append one fresh key stamped today
    extraContext: *extracontextTlsSessiontickets
    currentFiles:
      tls-ticket-keys: |
        MjAyMDAxMDEBk+LdT3waWq9/eMXZ/OrL72ywGnk5iFvamSsGg9ROVL23GJJfFM0wesQcVpiLgm1+3Q10nN7UPo8TKVWQi+CH05wl5v1Snu8=
        MjAyMDAxMDE6V2yKRZF80TBhAzp/xBDTh+WvO3rDEAbCuD/4slIZeNSXJxS+YxUls4akNIRICp1poNnNbVgWgxiJC6m/cnISHta0dwkjGQY=
        MjAyMDAxMDEULATG7B3W7hY19QQOMzEr1a0GmjWsfRWtyCvWhGvE4eJL0aqagzZsRgtxWrKhgouiouA9LOSFu9x7/pG8CUn+qvCyJ4tPdu0=
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: file:tls-ticket-keys, pattern: 'MjAyMDAxMDEBk'}
      - {type: contains, target: file:tls-ticket-keys, pattern: 'MjAyMDAxMDE6V2yKRZF8'}
      - {type: contains, target: file:tls-ticket-keys, pattern: 'MjAyMDAxMDEULATG7B3W'}
      - {type: match_count, target: file:tls-ticket-keys, pattern: 'MjAyMDAxMDE', expected: "2"}
      - {type: match_count, target: file:tls-ticket-keys, pattern: 'MjAyNjA3Mj', expected: "1"}

  test-access-log-tls-fields:
    description: >-
      With TLS terminated anywhere, the TLS handshake fields join the shared JSON
      log-format (they render "" on the plain-HTTP frontend, which is what keeps
      one schema across frontends), and the session-ticket field appears only
      when that feature is on.
    extraContext: {tls: {sessionTickets: {enabled: true}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: access-log-tls }
          spec:
            ingressClassName: haptic
            tls:
              - hosts: [tls-log.example.com]
                secretName: shared-tls
            rules:
              - host: tls-log.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(tls_version\)\[ssl_fc_protocol\]'}
      - {type: contains, target: haproxy.cfg, pattern: '%\(tls_sni\)\[ssl_fc_sni\]'}
      - type: contains
        target: haproxy.cfg
        pattern: '%\(tls_resumed:bool\)\[ssl_fc_is_resumed\]'
        description: >-
          Typed :bool because ssl_fc_is_resumed always resolves; a typed item
          whose fetch does not resolve would render "" into a boolean slot.

  test-access-log-tls-resumption-field-gated:
    description: >-
      Without the session-ticket feature the resumption field is absent rather
      than permanently empty — the gating rule every log-fields-* snippet follows.
    extraContext: {tls: {sessionTickets: {enabled: false}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'tls_resumed'}

  test-proxy-protocol-https-bind:
    description: >-
      With TLS termination (no passthrough backends) `frontend https` owns the
      HTTPS port, so the PROXY-protocol twin lands there and terminates TLS with
      the same crt-list and ALPN as the plain bind.
    extraContext: {proxyProtocol: {enabled: true, httpPort: 8081, httpsPort: 8444}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: tls-trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^\s+bind \*:443 ssl crt-list .*?alpn h2,http/1\.1$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^\s+bind \*:8444 accept-proxy name https-proxy-protocol ssl crt-list .*?alpn h2,http/1\.1$'

  test-proxy-protocol-https-bind-disabled:
    description: >-
      Pins PROXY protocol off independently of operator values; the SSL loopback
      still uses accept-proxy on its Unix socket.
    extraContext: {proxyProtocol: {enabled: false}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: tls-trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts: ["example.com"]
                secretName: default-ssl-cert
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'bind \*:[0-9]+ accept-proxy'}

  test-ssl-http3-quic-bind:
    description: >-
      HTTP/3 adds a QUIC twin of the HTTPS bind with the same crt-list and ALPN
      h3, and alt-svc advertises the client's HTTPS port from Host (443 when
      Host carries none) only for responses on a port with a QUIC bind.
    extraContext: {http3: {enabled: true, altSvc: {port: 0, maxAge: 86400}}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend https$.*?^\s+bind quic4@:443 ssl crt-list \S+/certificate-list\.txt alpn h3$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+http-request set-var\(txn\.h3_port\) req\.hdr\(host\),regsub\("\^\.\*:",""\) if \{ req\.hdr\(host\) -m reg :\[0-9\]\+\$ \}$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+http-after-response set-header alt-svc "h3=\\":%\[var\(txn\.h3_port\)\]\\"; ma=86400" if \{ dst_port 443 \} \{ var\(txn\.h3_port\) -m found \}$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+http-after-response set-header alt-svc "h3=\\":443\\"; ma=86400" if \{ dst_port 443 \} !\{ var\(txn\.h3_port\) -m found \}$'

  test-ssl-http3-disabled:
    description: With http3.enabled=false there is no QUIC bind and no alt-svc header.
    extraContext: {http3: {enabled: false}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:443 ssl crt-list '}
      - {type: not_contains, target: haproxy.cfg, pattern: 'quic4@'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header alt-svc'}

  test-ssl-http3-alt-svc-fixed-port:
    description: A configured altSvc.port replaces the Host-derived port, for load balancers that publish UDP on a different port than TCP.
    extraContext: {http3: {enabled: true, altSvc: {port: 8443, maxAge: 3600}}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+http-after-response set-header alt-svc "h3=\\":8443\\"; ma=3600" if \{ dst_port 443 \}$'
      - {type: not_contains, target: haproxy.cfg, pattern: 'txn\.h3_port'}

  test-ssl-http3-session-tickets:
    description: The QUIC bind resumes sessions with the same ticket keys as the TCP bind.
    extraContext:
      tls: {sessionTickets: {enabled: true}, sessionTicketsToday: "20260721"}
      http3: {enabled: true, altSvc: {port: 0, maxAge: 86400}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind quic4@:443 ssl crt-list \S+ alpn h3 tls-ticket-keys \S*general/tls-ticket-keys$'

  test-ssl-http3-proxy-protocol:
    description: >-
      QUIC can't carry a PROXY header, so the PROXY-protocol listener gets no
      QUIC twin, and responses received on it never advertise HTTP/3.
    extraContext:
      proxyProtocol: {enabled: true, httpPort: 8081, httpsPort: 8444}
      http3: {enabled: true, altSvc: {port: 0, maxAge: 86400}}
    fixtures: *fixturesTlsTriggerDefaultSsl
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'quic4@:8444'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+bind \*:8444 accept-proxy name https-proxy-protocol ssl crt-list '
      - type: match_count
        target: haproxy.cfg
        pattern: 'set-header alt-svc .* if \{ dst_port 443 \} !\{ so_name https-proxy-protocol \} !\{ fc_pp_tlv\(0xE0\) -m str https-proxy-protocol \} !?\{ var\(txn\.h3_port\) -m found \}'
        expected: "2"
