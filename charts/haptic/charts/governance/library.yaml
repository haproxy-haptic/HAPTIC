  test-governance-rule-namespace-scope-reconcile:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: Reconcile applies each rule's namespace scope exactly as admission does.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          host-alias-regex-platform-only:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/host-alias-regex']
            pattern: '^$'
            exemptNamespaces: [platform]
            message: host aliases are allowed only in platform namespaces
          tenant-tier:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
            namespaces: [tenant-a]
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: platform, name: alias-no-tier, annotations: { haproxy-haptic.org/host-alias-regex: "app[0-9]+\\.example\\.com" }, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: alias-no-tier.platform.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: tenant-a, name: alias, annotations: { haproxy-haptic.org/host-alias-regex: "web[0-9]+\\.example\\.com" }, labels: { tier: gold } }
          spec:
            ingressClassName: haptic
            rules:
              - host: alias.tenant-a.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: tenant-a, name: no-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tier.tenant-a.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: tenant-b, name: no-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tier.tenant-b.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: haproxy_valid }
      - { type: contains, target: events, pattern: 'GovernanceViolation networking.k8s.io/v1 Ingress tenant-a/alias: .*host aliases are allowed only in platform namespaces' }
      - { type: contains, target: events, pattern: 'GovernanceViolation networking.k8s.io/v1 Ingress tenant-a/no-tier: .*must set metadata.labels' }
      - { type: not_contains, target: events, pattern: 'platform/alias-no-tier' }
      - { type: not_contains, target: events, pattern: 'tenant-b/no-tier' }

