      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: two-rules, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: two-rules.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_two-rules_svc_echo_80' }
      - { type: contains, target: haproxy.cfg, pattern: 'balance leastconn' }
      # The disabled rule injected nothing, so the rate limiter never armed.
      - { type: not_contains, target: haproxy.cfg, pattern: 'stick-table type ip size 100k expire 1s store http_req_rate' }

  test-governance-selector-skips-labelled:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: >-
      A NotIn selector leaves an Ingress carrying the opt-out label alone, while
      an Ingress without the label gets the default (#582).
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          staff-sources:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/denylist-source-range']
            default: "203.0.113.5"
            selector:
              matchExpressions:
                - {key: example.org/open-to-all, operator: NotIn, values: ["true"]}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: open, labels: { example.org/open-to-all: "true" } }
          spec:
            ingressClassName: haptic
            rules:
              - host: open.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: staff }
          spec:
            ingressClassName: haptic
            rules:
              - host: staff.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:ing-ac-deny.map", pattern: '(?m)^203\.0\.113\.5/32\|default/staff 1$' }
      - { type: not_contains, target: "map:ing-ac-deny.map", pattern: 'default/open' }

