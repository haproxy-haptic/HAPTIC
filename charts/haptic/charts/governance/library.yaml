  test-governance-default-from-key:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: >-
      defaultFrom picks the default by the Ingress's hosts: every host maps to
      the same list, a host missing from values uses default (#582).
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          staff-sources:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/denylist-source-range']
            default: "192.0.2.1"
            defaultFrom:
              path: spec.rules[*].host
              values:
                a.example.com: "203.0.113.5"
                a2.example.com: "203.0.113.5"
                b.example.com: "198.51.100.7"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: a }
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
              - host: a2.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: other }
          spec:
            ingressClassName: haptic
            rules:
              - host: other.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:ing-ac-deny.map", pattern: '(?m)^203\.0\.113\.5/32\|default/a 1$' }
      - { type: contains, target: "map:ing-ac-deny.map", pattern: '(?m)^192\.0\.2\.1/32\|default/other 1$' }

  test-governance-default-from-conflict-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: >-
      Hosts that map to different defaults are a violation, so one Ingress
      can't take the weaker list for every host.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: mixed }
      governance:
        enabled: true
        rules:
          staff-sources:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/denylist-source-range']
            defaultFrom:
              path: spec.rules[*].host
              values:
                a.example.com: "203.0.113.5"
                b.example.com: "198.51.100.7"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: mixed }
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
              - host: b.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: "ingresses default/mixed violates governance rule 'staff-sources': the keys at spec\\.rules\\[\\*\\]\\.host map to different defaults" }

  test-governance-selector-invalid-operator-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A selector operator other than In, NotIn, Exists or DoesNotExist fails the render.
    extraContext:
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/denylist-source-range']
            default: "203.0.113.5"
            selector:
              matchExpressions:
                - {key: example.org/zone, operator: Equals, values: [a]}
    fixtures: *fixturesAnyExampleCom
    assertions:
      - { type: contains, target: rendering_error, pattern: 'governance\.rules\.main\.selector\.matchExpressions operator must be In, NotIn, Exists or DoesNotExist' }
