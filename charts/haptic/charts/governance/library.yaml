# Governance rule engine: declarative constraints over ANY watched resource.
# Generic via dynamic resource bindings, jsonpathGet, and deriveResource — a
# rule names its own target, so it applies to any watched resource.
# Rule shape and worked examples: docs/site/docs/operations/governance.md

_fx:
  fixturesAnyExampleCom: &fixturesAnyExampleCom
    ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: { namespace: default, name: any, annotations: {} }
        spec:
          ingressClassName: haptic
          rules:
            - host: any.example.com
              http:
                paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
  hostAliasesPlatformOnly: &hostAliasesPlatformOnly
    enabled: true
    rules:
      host-alias-platform-only:
        enabled: true
        resource: ingresses
        path: metadata.annotations['haproxy-haptic.org/host-alias']
        pattern: '^$'
        exemptNamespaces: [platform]
        message: host aliases are allowed only in platform namespaces
      host-alias-regex-platform-only:
        enabled: true
        resource: ingresses
        path: metadata.annotations['haproxy-haptic.org/host-alias-regex']
        pattern: '^$'
        exemptNamespaces: [platform]
        message: host aliases are allowed only in platform namespaces
      server-alias-platform-only:
        enabled: true
        resource: ingresses
        path: metadata.annotations['haproxy-ingress.github.io/server-alias']
        pattern: '^$'
        exemptNamespaces: [platform]
        message: host aliases are allowed only in platform namespaces
      server-alias-regex-platform-only:
        enabled: true
        resource: ingresses
        path: metadata.annotations['haproxy-ingress.github.io/server-alias-regex']
        pattern: '^$'
        exemptNamespaces: [platform]
        message: host aliases are allowed only in platform namespaces
      nginx-server-alias-platform-only:
        enabled: true
        resource: ingresses
        path: metadata.annotations['nginx.ingress.kubernetes.io/server-alias']
        pattern: '^$'
        exemptNamespaces: [platform]
        message: host aliases are allowed only in platform namespaces
  governanceEnabledRules: &governanceEnabledRules
    enabled: true
    rules: {main: {enabled: true, resource: ingresses, satisfiedBy: tls}}

_helm_load: {enable: '{{ .Values.controller.templateLibraries.governance.enabled }}'}

# Governance rule shape and worked examples:
# docs/site/docs/operations/governance.md (enforced by features-960-governance).
templatingSettings:
  extraContext:
    governance:
      enabled: false
      exemptNamespaces: []
      # Keyed by rule name so an operator's own rules merge with, rather than
      # replace, the ones the chart ships. Every entry must set `enabled`.
      rules: {}

templateSnippets:
  # Applies the admin-declared rules to every item of their target watched
  # resource without encoding any resource shape.
  features-960-governance:
    incremental:
      effects: [deriveResource, recordEvent]
      bindingsTemplate: |-
        {%%
          var bindings = map[string]any{}
          var gov = extraContext | dig("governance") | fallback(map[string]any{})
          if tostring(gov | dig("enabled") | fallback("false")) == "true" {
            var namespaceSet = func(field string, value any) map[string]bool {
              var names = toSlice(value)
              if names == nil { fail(field + " must be a list of namespace names.") }
              var set = map[string]bool{}
              for _, n := range names {
                if strip(tostring(n)) == "" { fail(field + " must not contain an empty namespace name.") }
                set[tostring(n)] = true
              }
              return set
            }
            var exempt = map[string]any{}
            for n := range namespaceSet("governance.exemptNamespaces", gov | dig("exemptNamespaces")) {
              exempt[n] = true
            }
            var defaultHTTPS = tostring(extraContext | dig("ingressDefaultHTTPS") | fallback("false")) == "true"

            var rulesMap, rulesOk = (gov | dig("rules") | fallback(map[string]any{})).(map[string]any)
            if !rulesOk { fail("governance.rules must be a map of rule name to rule.") }

            var isConcretePath = func(p string) bool {
              return p != "" && !regex_search(p, "[*?@]")
            }
            var byResource = map[string][]any{}
            var tlsByResource = map[string]bool{}
            for _, rname := range keys(rulesMap) {
              var rule, ok = rulesMap[rname].(map[string]any)
              if !ok { fail("governance.rules." + rname + " must be a map.") }
              if tostring(fallback(rule["resource"], "")) == "" {
                fail("governance.rules." + rname + ".resource is required.")
              }
              var enf = tostring(fallback(rule["enforcement"], "reject"))
              if enf != "reject" && enf != "audit" {
                fail("governance.rules." + rname + ".enforcement must be \"reject\" or \"audit\", got \"" + enf + "\".")
              }
              var onV = tostring(fallback(rule["onViolation"], "reject"))
              if onV != "reject" && onV != "clamp" {
                fail("governance.rules." + rname + ".onViolation must be \"reject\" or \"clamp\", got \"" + onV + "\".")
              }
              if rule["min"] != nil && rule["max"] != nil && toint(tostring(rule["min"])) > toint(tostring(rule["max"])) {
                fail("governance.rules." + rname + ".min must be <= max.")
              }
              for _, field := range []string{"default", "defaultFrom"} {
                if rule[field] != nil && !isConcretePath(tostring(fallback(rule["path"], ""))) {
                  fail("governance.rules." + rname + "." + field + " requires a concrete path (filtered/wildcard paths are validate-only).")
                }
              }
              if rule["defaultFrom"] != nil {
                var from, fromOk = rule["defaultFrom"].(map[string]any)
                if !fromOk { fail("governance.rules." + rname + ".defaultFrom must be a map with path and values.") }
                var fromPath = tostring(fallback(from["path"], ""))
                if len(split(fromPath, "[*]")) > 2 || !isConcretePath(replace(fromPath, "[*]", "[0]")) {
                  fail("governance.rules." + rname + ".defaultFrom.path must be a concrete JSONPath with at most one [*], got \"" + fromPath + "\".")
                }
                if _, valuesOk := from["values"].(map[string]any); !valuesOk {
                  fail("governance.rules." + rname + ".defaultFrom.values must be a map from key to default.")
                }
              }
              if rule["selector"] != nil {
                var where = "governance.rules." + rname + ".selector"
                var selector, selectorOk = rule["selector"].(map[string]any)
                if !selectorOk { fail(where + " must be a map with matchLabels and/or matchExpressions.") }
                for _, field := range keys(selector) {
                  if field != "matchLabels" && field != "matchExpressions" { fail(where + "." + field + " isn't supported; use matchLabels or matchExpressions.") }
                }
                var labelKey = "^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$"
                if selector["matchLabels"] != nil {
                  var matchLabels, labelsOk = selector["matchLabels"].(map[string]any)
                  if !labelsOk { fail(where + ".matchLabels must be a map of label to value.") }
                  for _, key := range keys(matchLabels) {
                    if !regex_search(key, labelKey) { fail(where + ".matchLabels key '" + key + "' isn't a label key.") }
                  }
                }
                if selector["matchExpressions"] != nil && toSlice(selector["matchExpressions"]) == nil {
                  fail(where + ".matchExpressions must be a list.")
                }
                for _, exprAny := range toSlice(selector["matchExpressions"]) {
                  var expr, exprOk = exprAny.(map[string]any)
                  if !exprOk { fail(where + ".matchExpressions entries must be maps with key, operator and values.") }
                  var key = tostring(fallback(expr["key"], ""))
                  var operator = tostring(fallback(expr["operator"], ""))
                  var count = len(toSlice(expr["values"]))
                  if !regex_search(key, labelKey) { fail(where + ".matchExpressions key '" + key + "' isn't a label key.") }
                  if operator == "In" || operator == "NotIn" {
                    if count == 0 { fail(where + ".matchExpressions " + key + " " + operator + " needs values.") }
                  } else if operator == "Exists" || operator == "DoesNotExist" {
                    if count > 0 { fail(where + ".matchExpressions " + key + " " + operator + " takes no values.") }
                  } else {
                    fail(where + ".matchExpressions operator must be In, NotIn, Exists or DoesNotExist, got \"" + operator + "\".")
                  }
                }
              }
              var ruleNamespaces = namespaceSet("governance.rules." + rname + ".namespaces", rule["namespaces"])
              namespaceSet("governance.rules." + rname + ".exemptNamespaces", rule["exemptNamespaces"])
              for _, n := range toSlice(rule["exemptNamespaces"]) {
                if ruleNamespaces[tostring(n)] {
                  fail("governance.rules." + rname + " lists namespace " + tostring(n) + " in both namespaces and exemptNamespaces.")
                }
              }
              var en = tostring(fallback(rule["enabled"], ""))
              if en != "true" && en != "false" {
                fail("governance.rules." + rname + ".enabled is required and must be true or false.")
              }
              if en == "true" {
                var resourceName = tostring(rule["resource"])
                var named = map[string]any{}
                for field, value := range rule { named[field] = value }
                named["name"] = rname
                byResource[resourceName] = append(byResource[resourceName], named)
                if tostring(fallback(rule["satisfiedBy"], "")) == "tls" {
                  tlsByResource[resourceName] = true
                }
              }
            }

            for _, resourceName := range keys(byResource) {
              var binding = map[string]any{
                "exemptNamespaces": exempt,
                "rules": byResource[resourceName],
              }
              if tlsByResource[resourceName] {
                binding["defaultHTTPS"] = defaultHTTPS
              }
              bindings[resourceName] = binding
            }
          }
          show toJSON(bindings)
        %%}
    template: |-
      {%%
        var current = item
        var ns = tostring(jsonpathGet(current, "metadata.namespace"))
        var name = tostring(jsonpathGet(current, "metadata.name"))
        var exempt = tostring(props | dig("exemptNamespaces", ns) | fallback(false)) == "true"
        if !exempt {
          var defaultHTTPS = tostring(props | dig("defaultHTTPS") | fallback(false)) == "true"
          var underAdmission = tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission"
          var present = func(v any) bool { return v != nil && strip(tostring(v)) != "" }
          var ruleName = ""
          var violate = func(enf string, custom string, detail string) {
            var message = custom
            if message == "" { message = detail }
            message = source + " " + ns + "/" + name + " violates governance rule '" + ruleName + "': " + message
            if enf == "reject" && underAdmission {
              fail(message)
            } else {
              recordEvent(current, "GovernanceViolation", message)
            }
          }

          var listsNamespace = func(names any) bool {
            for _, n := range toSlice(names) {
              if tostring(n) == ns { return true }
            }
            return false
          }

          var label = func(key string) any { return jsonpathGet(current, "metadata.labels['" + key + "']") }
          var matchesSelector = func(selectorAny any) bool {
            if selectorAny == nil { return true }
            var selector = selectorAny.(map[string]any)
            var matchLabels, _ = selector["matchLabels"].(map[string]any)
            for _, key := range keys(matchLabels) {
              var value = label(key)
              if value == nil || tostring(value) != tostring(matchLabels[key]) { return false }
            }
            for _, exprAny := range toSlice(selector["matchExpressions"]) {
              var expr = exprAny.(map[string]any)
              var value = label(tostring(expr["key"]))
              var inValues = false
              for _, candidate := range toSlice(expr["values"]) {
                if value != nil && tostring(candidate) == tostring(value) { inValues = true }
              }
              var operator = tostring(expr["operator"])
              if operator == "In" && !inValues || operator == "NotIn" && inValues ||
                operator == "Exists" && value == nil || operator == "DoesNotExist" && value != nil {
                return false
              }
            }
            return true
          }

          var defaultFor = func(rule map[string]any) (any, string) {
            if rule["defaultFrom"] == nil { return rule["default"], "" }
            var from = rule["defaultFrom"].(map[string]any)
            var values = from["values"].(map[string]any)
            var keyPath = tostring(from["path"])
            var parts = split(keyPath, "[*]")
            var found = []string{}
            if len(parts) == 1 {
              if present(jsonpathGet(current, keyPath)) { found = append(found, strip(tostring(jsonpathGet(current, keyPath)))) }
            } else {
              for i := 0; ; i++ {
                var element = parts[0] + "[" + tostring(i) + "]"
                if jsonpathGet(current, element) == nil { break }
                var key = jsonpathGet(current, element + parts[1])
                if present(key) { found = append(found, strip(tostring(key))) }
              }
            }
            var chosen = map[string]bool{}
            var result any = nil
            for _, key := range found {
              var value, mapped = values[key]
              if !mapped { value = rule["default"] }
              if value == nil { continue }
              chosen[tostring(value)] = true
              result = value
            }
            if len(found) == 0 { return rule["default"], "" }
            if len(chosen) > 1 {
              return rule["default"], "the keys at " + keyPath + " map to different defaults; move keys with different defaults to separate resources"
            }
            return result, ""
          }

          for _, ruleAny := range toSlice(props | dig("rules") | fallback([]any{})) {
            var rule = ruleAny.(map[string]any)
            ruleName = tostring(rule["name"])
            if len(toSlice(rule["namespaces"])) > 0 && !listsNamespace(rule["namespaces"]) { continue }
            if listsNamespace(rule["exemptNamespaces"]) { continue }
            if !matchesSelector(rule["selector"]) { continue }
            var enf = tostring(fallback(rule["enforcement"], "reject"))
            var custom = tostring(fallback(rule["message"], ""))
            var path = tostring(fallback(rule["path"], ""))

            if tostring(fallback(rule["satisfiedBy"], "")) == "tls" {
              var tlsv = jsonpathGet(current, "spec.tls")
              var hasTLS = tlsv != nil && len(toSlice(tlsv)) > 0
              if !hasTLS && !defaultHTTPS {
                violate(enf, custom, "must terminate TLS (add spec.tls, or enable the chart-wide default HTTPS)")
              }
              continue
            }

            var anyOf = toSlice(rule["anyOf"])
            if len(anyOf) > 0 {
              var anyPresent = false
              for _, p := range anyOf {
                if present(jsonpathGet(current, tostring(p))) { anyPresent = true; break }
              }
              if !anyPresent {
                violate(enf, custom, "must set at least one of the required fields")
              }
              continue
            }

            if path == "" { continue }

            var value = jsonpathGet(current, path)
            if !present(value) {
              var derived, conflict = defaultFor(rule)
              if conflict != "" { violate(enf, custom, conflict) }
              if derived != nil {
                current = deriveResource(source, current, path, derived)
                value = derived
              }
            }

            if tostring(fallback(rule["required"], "false")) == "true" && !present(value) {
              violate(enf, custom, "must set " + path)
              continue
            }
            if !present(value) { continue }
            var valueString = strip(tostring(value))

            if rule["min"] != nil || rule["max"] != nil {
              if !regex_search(valueString, "^[0-9]+$") {
                violate(enf, custom, path + "=" + valueString + " must be a non-negative integer")
                continue
              }
              var number = toint(valueString)
              var below = rule["min"] != nil && number < toint(tostring(rule["min"]))
              var above = rule["max"] != nil && number > toint(tostring(rule["max"]))
              if below || above {
                if tostring(fallback(rule["onViolation"], "reject")) == "clamp" {
                  var clamped = number
                  if below { clamped = toint(tostring(rule["min"])) }
                  if above { clamped = toint(tostring(rule["max"])) }
                  current = deriveResource(source, current, path, tostring(clamped))
                  recordEvent(current, "GovernanceClamped", source + " " + ns + "/" + name + ": " + path + "=" + valueString + " clamped to " + tostring(clamped))
                } else {
                  violate(enf, custom, path + "=" + valueString + " must be within the configured bounds")
                }
                continue
              }
            }

            var allowed = toSlice(rule["allowed"])
            if len(allowed) > 0 {
              var inSet = false
              for _, allowedValue := range allowed {
                if tostring(allowedValue) == valueString { inSet = true; break }
              }
              if !inSet {
                violate(enf, custom, path + "=" + valueString + " is not one of the allowed values")
                continue
              }
            }

            var pattern = tostring(fallback(rule["pattern"], ""))
            if pattern != "" && !regex_search(valueString, pattern) {
              violate(enf, custom, path + "=" + valueString + " does not match required pattern " + pattern)
              continue
            }
          }
        }
      %%}

validationTests:
  # Keeps an operator's governance rules away from the fixtures when tests render
  # with the deployment's extraContext. The governance tests re-enable it per-test.
  _global:
    extraContext:
      governance:
        enabled: false
        # A plain {} would deep-merge and leave the operator's rules in place.
        rules: { __replace__: true }

  test-governance-inject-reaches-consumer:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An injected default rate-limit annotation reaches the rate-limiting consumer.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "100"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: inject-rps, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: inject-rps.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_inject-rps_svc_echo_80' }
      - { type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/inject-rps req 1s 100 429$' }
      - { type: contains, target: haproxy.cfg, pattern: 'backend haptic_rl_tbl_req_1s' }

  test-governance-inject-then-validate-pass:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An injected default within min/max validates without a violation.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "40"
            min: 1
            max: 100
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: inject-ok, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: inject-ok.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: 'backend default_inject-ok_svc_echo_80' }
      - { type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/inject-ok req 1s 40 429$' }

  test-governance-clamp-rewrites:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: An over-limit value is clamped and the consumer emits the cap, not the original.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            max: 50
            onViolation: clamp
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: clamp-rps
            annotations: { haproxy-haptic.org/rate-limit-rps: "8888" }
          spec:
            ingressClassName: haptic
            rules:
              - host: clamp-rps.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      # Assert the consumer's own line, not a bare "8888": the harness's random
      # temp path lands in haproxy.cfg and may contain the number.
      - { type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m)^default/clamp-rps req 1s 50 429$' }
      - { type: not_contains, target: "map:haptic-rate-limit-routes.map", pattern: ' 8888 ' }

  test-governance-rules-apply-in-name-order:
    _helm_skip_test: '{{ if or (not .Values.controller.templateLibraries.governance.enabled) (not .Values.controller.templateLibraries.hapticAnnotations.enabled) }}true{{ end }}'
    description: Rules apply in sorted name order before their derived resource reaches consumers.
    extraContext:
      renderMode: reconcile
      governance:
        enabled: true
        rules:
          z-clamp:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            max: 50
            onViolation: clamp
          a-default:
            enabled: true
            resource: ingresses
            path: metadata.annotations['haproxy-haptic.org/rate-limit-rps']
            default: "100"
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: rule-order, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: rule-order.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m) req 1s 50 429$' }
      - { type: not_contains, target: "map:haptic-rate-limit-routes.map", pattern: '(?m) req 1s 100 429$' }

  test-governance-min-max-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A value above max is rejected at the offending resource's own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { stores: { ingresses: true }, namespace: default, name: over-limit }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['ratelimit']
            min: 1
            max: 100
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: over-limit, labels: { ratelimit: "9999" }}
          spec:
            ingressClassName: haptic
            rules:
              - host: over-limit.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: 'must be within the configured bounds' }

  test-governance-required-absent-reject:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: A required-but-absent value is rejected at the offending resource's own admission.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: no-tier }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: no-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: no-tier.example.com
                http:
                  paths: [{ path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }]
    assertions:
      - { type: contains, target: rendering_error, pattern: "must set metadata.labels" }

  test-governance-audit-warns-not-rejected:
    _helm_skip_test: '{{ if not .Values.controller.templateLibraries.governance.enabled }}true{{ end }}'
    description: An audit rule only warns; a violating resource is admitted under the webhook.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: audit-tier }
      governance:
        enabled: true
        rules:
          main:
            enabled: true
            resource: ingresses
            path: metadata.labels['tier']
            required: true
            enforcement: audit
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: audit-tier, labels: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: audit-tier.example.com
