# Base Template Library for HAPTIC
#
# Provides resource-agnostic building blocks for HAProxy configuration generation.
# Libraries like ingress.yaml and gateway.yaml extend these primitives via:
#   - Plugin patterns: render_glob "backends-*", "map-host-*", etc.

# Chart-time loading rules (consumed by haptic.prepareLibraries; stripped from output).
# The "frontend-routing-logic-regex-last" snippet below is the alternate
# variant of frontend-routing-logic; we conditionally swap it in and always
# strip the alternate so it never appears in the merged HAProxyTemplateConfig.
_fx:
  fixturesBufferingBufferExample: &fixturesBufferingBufferExample
    ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: {namespace: default, name: buffering}
        spec:
          ingressClassName: haptic
          rules:
            - host: buffer.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend: { service: { name: echo, port: { number: 80 } } }

_helm_load:
  enable: '{{ .Values.controller.templateLibraries.base.enabled }}'
  inject:
    - path: watchedResources.controller_services.labelSelector
      value: 'app.kubernetes.io/name={{ include "haptic.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=loadbalancer'
    - path: templateSnippets.frontend-routing-logic
      from: templateSnippets.frontend-routing-logic-regex-last
      when: '{{- with .Values.controller.config.templatingSettings.extraContext.routing -}}{{- if eq .regexMatchOrder "last" }}true{{ end -}}{{- end -}}'
  unset:
    - templateSnippets.frontend-routing-logic-regex-last
    # Tracing plumbing: absent from the config entirely unless tracing is on.
    - path: templateSnippets.log-fields-110-tracing
      when: '{{- if not (dig "tracing" "enabled" false (.Values.controller.config.templatingSettings.extraContext | default dict)) }}true{{ end -}}'
    # The route key is wanted by spans AND by the request metrics' `path` label,
    # so it outlives tracing — see haptic.routeKeyEnabled.
    - path: templateSnippets.util-route-key
      when: &routeKeyOff '{{- if not (include "haptic.routeKeyEnabled" .) }}true{{ end -}}'
    - path: templateSnippets.log-fields-108-route
      when: *routeKeyOff
    - path: templateSnippets.util-want-route
      when: *routeKeyOff
    # %U costs every record its bytes_in field, so only when request_size is on.
    - path: templateSnippets.log-fields-107-request-bytes
      when: &requestBytesOff '{{- if not (and .Values.vector.enabled (dig "requestMetrics" "enabled" false .Values.vector) (dig "requestMetrics" "metrics" "request_size" false .Values.vector)) }}true{{ end -}}'
#   - Composable macros: import and extend utility functions
#
# SSL/TLS infrastructure is in ssl.yaml (loaded separately when needed)

watchedResources:
  controller_services:
    apiVersion: v1
    resources: services
    indexBy: ["metadata.namespace", "metadata.name"]
    # labelSelector: injected by Helm from chart labels to match the LoadBalancer service

templateSnippets:
  # ============================================================================
  # Core Utility Macros
  # ============================================================================

  util-macros:
    template: |
      {# Core utility macros for template rendering #}

      {# Calculates optimal shard count: clamp(count / itemsPerShard, 1, 2*GOMAXPROCS) #}
      {% macro CalculateShardCount(resourceCount int, itemsPerShard int) string %}
        {%%
          var override = extraContext | dig("shardCountOverride")
          if override != nil {
            show tostring(toint(override))
            return
          }
          var maxShards = runtimeEnvironment.GOMAXPROCS * 2
          if maxShards < 1 { maxShards = 1 }
          var shardCount = resourceCount / itemsPerShard
          if shardCount < 1 { shardCount = 1 }
          if shardCount > maxShards { shardCount = maxShards }
          show tostring(shardCount)
        %%}
      {% end %}


  # ============================================================================
  # Ingress Helpers
  # ============================================================================

  # Single source of truth for how hosts get normalised into map keys.
  # Wildcard hosts (`*.example.com`) lose the leading `*` so the key becomes
  # `.example.com` — the same form host.map uses and the same form HAProxy's
  # `regsub(^[^.]*,,)` fallback in frontend-routing-logic produces at request
  # time. Resource-agnostic (operates on a hostname string), so it lives in
  # base and is imported by ingress.yaml, gateway/, and the vendor annotation
  # libraries alike — keeping any of them loadable without the others (gateway
  # imported this from ingress.yaml before, which broke gateway when ingress
  # was disabled). The argument is `any` because Scriggo's dig() returns any;
  # empty input → empty string (caller validates non-empty if it matters).
  util-host-key:
    template: |
      {%- macro MapKeyForHost(host any) string -%}
        {%- show tostring(host | fallback("")) | replace("*", "") -%}
      {%- end macro -%}

  # A regex-map key is the routed host plus a user path regex. The regex sits in
  # a non-capturing group, and RegexGroupProblem rejects anything that could
  # close that group early, so no alternative escapes the host anchor.
  util-regex-map-key:
    template: |-
      {%- var RegexGroupProblem = func(pattern string) string {
        var depth = 0
        var i = 0
        var n = len(pattern)
        for i < n {
          var c = pattern[i:i+1]
          if c == `\` {
            if i+1 >= n { return "ends with a backslash" }
            if strings_contains("QEc", pattern[i+1:i+2]) { return "uses \\" + pattern[i+1:i+2] }
            i += 2
          } else if c == "[" {
            i++
            if i < n && pattern[i:i+1] == "^" { i++ }
            if i < n && pattern[i:i+1] == "]" { i++ }
            var closed = false
            for i < n && !closed {
              var d = pattern[i:i+1]
              if d == `\` {
                if i+1 >= n { return "ends with a backslash" }
                if strings_contains("QEc", pattern[i+1:i+2]) { return "uses \\" + pattern[i+1:i+2] }
                i += 2
              } else if d == "[" && i+1 < n && strings_contains(":.=", pattern[i+1:i+2]) {
                if !regex_search(pattern[i:], `^\[:[a-z]+:\]`) { return "has an unsupported [" + pattern[i+1:i+2] + " class" }
                i += 2
                for pattern[i:i+1] != ":" { i++ }
                i += 2
              } else {
                closed = d == "]"
                i++
              }
            }
            if !closed { return "leaves a [ open" }
          } else if c == "(" {
            if hasPrefix(pattern[i:], "(?") {
              if !regex_search(pattern[i:], `^\(\?(:|=|!|<=|<!|>|[imsU-]+[:)]|P?<[A-Za-z_][A-Za-z0-9_]*>|'[A-Za-z_][A-Za-z0-9_]*')`) {
                return "uses an unsupported (? construct"
              }
            } else if hasPrefix(pattern[i:], "(*") {
              return "uses a (* verb"
            }
            depth++
            i++
          } else if c == ")" {
            depth--
            if depth < 0 { return "closes a group it doesn't open" }
            i++
          } else {
            i++
          }
        }
        if depth != 0 { return "leaves a group open" }
        return ""
      } -%}
      {#- flags (e.g. "(?i)") apply to the path only; one leading ^ is folded into the anchor. -#}
      {%- var RegexMapKey = func(hostKey string, pattern string, flags string) string {
        if hasPrefix(pattern, "^") { pattern = pattern[1:] }
        return "^" + sanitize_regex(hostKey) + flags + "(?:" + pattern + ")"
      } -%}

  util-webhook-reject-or-warn:
    template: |-
      {#
        CALLER CONTRACT: the warn path returns and the render CONTINUES, so the
        caller MUST skip the offending resource's own output right after calling
        this ({% continue %} in a per-resource loop, or stop emitting in a macro)
        — otherwise it emits config built from the value it just rejected.
      #}
      {%- macro WebhookRejectOrWarn(resource any, reason string, message string) -%}
        {%- if renderMode == "admission" -%}
          {{- fail(message) -}}
        {%- else -%}
          {{- recordEvent(resource, reason, message) -}}
        {%- end -%}
      {%- end macro -%}

  # A control character (or, for whitespace-delimited map keys, a space) in an
  # interpolated value would split the config line and smuggle a second directive
  # past `haproxy -c`.
  util-validate-config-value:
    template: |
      {%- macro ValidateConfigValue(value string, annotation string, key string, allowSpaces bool) %}
        {%- if regex_search(value, "[[:cntrl:]]") %}
          {{- fail("Invalid value for annotation '" + annotation + "' on resource '" + key + "': must not contain control characters (newlines/tabs) — config-injection guard.") -}}
        {%- end %}
        {%- if !allowSpaces && strings_contains(value, " ") %}
          {{- fail("Invalid value for annotation '" + annotation + "' on resource '" + key + "': must not contain spaces.") -}}
        {%- end %}
        {{- value -}}
      {%- end macro %}

  # Reject-detector for a tenant value bound for an HAProxy config context. Returns
  # the first offending character's human name, or "" when the value is safe for the
  # given context. Callers reject the resource via WebhookRejectOrWarn (routing) or
  # fail() (auth). Contexts and what each rejects on top of control chars:
  #   line   — nothing extra (a control char alone splits the config line).
  #   mapkey — a space (map files are whitespace-delimited: key is the first field).
  #   token  — a space, ' " # \ (unquoted ACL operand / directive argument).
  #   dquote — a " (double-quoted ACL/value context).
  #   squote — a ' (single-quoted context where escaping is not wanted).
  # "a control character" is generic on purpose: the class is all C0/C1, not just \n.
  util-config-injection-kind:
    template: |-
      {%- macro ConfigInjectionKind(value string, context string) string -%}
        {%- if regex_search(value, "[[:cntrl:]]") -%}a control character
        {%- else if (context == "mapkey" || context == "token") && strings_contains(value, " ") -%}a space
        {%- else if context == "token" && strings_contains(value, "'") -%}a single quote
        {%- else if context == "token" && strings_contains(value, "#") -%}a '#'
        {%- else if context == "token" && strings_contains(value, "\\") -%}a backslash
        {%- else if (context == "dquote" || context == "token") && strings_contains(value, "\"") -%}a double quote
        {%- else if context == "squote" && strings_contains(value, "'") -%}a single quote
        {%- end -%}
      {%- end macro -%}

  # Escapes a value the caller emits INSIDE double quotes: backslash first (so the
  # ones we add are not re-escaped), then the closing quote, then `$` (HAProxy expands
  # `$VAR`/`${VAR}` in double-quoted strings, so a literal `$` must be escaped). The
  # caller MUST first reject control characters (ConfigInjectionKind(value, "line")):
  # a control char cannot live in an HAProxy double-quoted string and a valid header
  # value never carries one. Single quotes pass through untouched, so `'self'` and a
  # quoted ETag survive.
  util-escape-dquote-value:
    template: |-
      {%- macro EscapeDquoteValue(value string) string -%}
        {%- show replace(replace(replace(value, "\\", "\\\\"), "\"", "\\\""), "$", "\\$") -%}
      {%- end macro -%}

  # For a set-header/add-header VALUE, which HAProxy evaluates as a log-format string:
  # `%` introduces a fetch (`%[...]`) at request time, so a literal `%` must be doubled
  # to `%%` on top of the double-quote escaping — otherwise a tenant value reads
  # request-scoped internal state into its own header. NOT for a literal `string` /
  # `content-type` argument, where `%` is not special.
  util-escape-logformat-value:
    template: |-
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- macro EscapeLogFormatValue(value string) string -%}
        {%- show replace(EscapeDquoteValue(value), "%", "%%") -%}
      {%- end macro -%}

  # Thin wrapper preserving the #155 call sites: a value bound for a double-quoted ACL
  # or directive, rejected on a closing quote or a control character.
  util-config-value-injection:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- macro ConfigValueInjection(value string) string -%}
        {%- show ConfigInjectionKind(value, "dquote") -%}
      {%- end macro -%}

  util-ingress-helpers:
    template: |
      {# Generates HAProxy host match condition for use in if-expressions.
          Small host lists use compact inline form: { var(txn.host) -m str host1 host2 ... }
          Large host lists (>30) use file-based matching to avoid HAProxy's 64-word-per-line limit.
      #}
      {% macro HostMatchCondition(hosts []string) string %}
        {%%
          if len(hosts) <= 30 {
            // Compact inline form — stays under HAProxy's 64-word-per-line limit
            show "{ var(txn.host) -m str " + join(hosts, " ") + " }"
          } else {
            // File-based matching: register a host list file and use -f flag
            var content = join(hosts, "\n") + "\n"
            var filename = "host-match-" + md5(content) + ".lst"
            var path, err = fileRegistry.Register("file", filename, content)
            if err != nil {
              fail("Failed to register host match file '" + filename + "': " + err.Error())
            }
            show "{ var(txn.host) -m str -f " + path + " }"
          }
        %%}
      {% end %}

      {#- Scopes a rule to the resources that declared it, by the route actually
          matched rather than by the Host header. Prefer this over
          HostMatchCondition for anything ENFORCING (a deny, an auth gate, an
          identity-header strip): a Kubernetes wildcard rule host never equals a
          concrete request host, so an exact host match silently does not fire,
          and a rule with no host at all cannot be expressed as a host match in
          the first place. Both cases leave the enforcement absent while the
          route keeps serving.

          Takes txn.resource_key ids (`<namespace>/<name>` for an Ingress), set by the routing
          logic, which runs before frontend-filters-*, and is unset when nothing
          matched — so a request that reached no route matches no rule, which is
          what you want. -#}
      {% macro ResourceMatchCondition(resourceIds []string) string %}
        {%%
          if len(resourceIds) <= 30 {
            show "{ var(txn.resource_key) -m str " + join(resourceIds, " ") + " }"
          } else {
            var content = join(resourceIds, "\n") + "\n"
            var filename = "resource-match-" + md5(content) + ".lst"
            var path, err = fileRegistry.Register("file", filename, content)
            if err != nil {
              fail("Failed to register resource match file '" + filename + "': " + err.Error())
            }
            show "{ var(txn.resource_key) -m str -f " + path + " }"
          }
        %%}
      {% end %}

  # ============================================================================
  # Access log (structured JSON)
  #
  # Every frontend emits one JSON object per request/connection, built from
  # HAProxy's native `%{+json}o` log encoding. Libraries contribute fields
  # through the `log-fields-*` extension point; base owns the core field set,
  # the assembly, and the per-frontend emission.
  #
  # Two hard HAProxy constraints shape this (both verified against 3.0 and 3.4):
  #
  #  1. A log-format may only reference items available AT LOG TIME. `path`,
  #     `pathq`, `req.hdr()`, `res.hdr()` and `req.ssl_sni` are rejected at
  #     config-parse time ("needs HTTP request headers / request buffer which is
  #     not available here"), so anything request- or response-scoped must be
  #     materialised into a txn variable first — that is what the txn.* routing
  #     variables (util-routing-prefix/suffix) already do.
  #  2. A `defaults`-section log-format cannot reference HTTP-scoped fetches at
  #     all, so the format is emitted per frontend. `option httplog` stays in
  #     `defaults` as the no-warning fallback for a frontend without one; a
  #     frontend-level log-format alongside an inherited `option httplog` does
  #     NOT warn (the two in the SAME section do).
  # ============================================================================

  util-access-log-targets:
    template: |-
      {#
        Parses and validates extraContext.accessLog.targets once per render into
        shared["accessLogTargets"], a list of normalised maps:
          {address, format, facility, level, ring}   (ring is nil or a map)

        WHY THIS EXISTS: the access log carries a client_ip field — personal data.
        Organisations that must keep it out of a general-purpose log store need to
        route it somewhere access-controlled, and overriding a chart-owned snippet
        is not configuration. HAProxy's own process and alert messages are NOT
        affected: they stay on the `global` stdout target, so `kubectl logs` keeps
        working for on-call while only the personal-data-bearing stream moves.

        Consumers render this snippet (it emits nothing) and then read
        shared.Get("accessLogTargets").

        Verified against HAProxy 3.0 and 3.4:
          - a `log` line may reference a ring defined LATER in the file, so the
            ring sections can come from global-top-* (which renders after
            `defaults`),
          - with a ring target, an unreachable collector costs the data plane
            nothing: 25/25 requests served in 112ms with the collector down, and
            all 25 records buffered and flushed once it came back.
      #}
      {%- var _, _ = shared.ComputeIfAbsent("accessLogTargets", func() any {
        var formats = []string{"raw", "rfc3164", "rfc5424", "local", "priority", "short", "timed", "iso"}
        var facilities = []string{"kern", "user", "mail", "daemon", "auth", "syslog", "lpr", "news",
                                  "uucp", "cron", "auth2", "ftp", "ntp", "audit", "alert", "cron2",
                                  "local0", "local1", "local2", "local3", "local4", "local5", "local6", "local7"}
        // Only the levels that actually emit an access record. The level is a
        // MAX severity filter and access logs are emitted at info, so anything
        // stricter (notice and up) silently drops EVERY record while
        // `haproxy -c` still returns 0 — measured: notice/warning/err each
        // produced zero records. A knob whose plausible values destroy the log
        // is not a knob.
        var levels = []string{"info", "debug"}
        var addrRe = regexp("^(stdout|stderr|fd@[0-9]+|ring@[A-Za-z_][A-Za-z0-9_-]{0,63}|/[^[:space:]]+|\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}|[0-9A-Za-z._-]+:[0-9]{1,5})$")
        var ringNameRe = regexp("^[A-Za-z_][A-Za-z0-9_-]{0,63}$")
        // No unix@ here: HAProxy 3.4 rejects a UNIX ring server outright while
        // 3.0 accepts it, so offering it would render a config that only works
        // on some of the supported versions. A UNIX socket collector is reached
        // with the plain-path address form instead, which is a datagram target.
        var ringAddrRe = regexp("^(\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}|[0-9A-Za-z._-]+:[0-9]{1,5})$")
        var durationRe = regexp("^[0-9]+(us|ms|s|m|h|d)?$")
        // A 5-digit shape match is not enough. HAProxy hard-ALERTs on a port
        // above 65535 ("invalid port '99999'", measured on 3.0 and 3.4), so the
        // value would pass Helm, reach the controller, and take down the config
        // load instead of being rejected where the operator set it. Port 0 it
        // ACCEPTS at config check (exit 0) even though nothing can be delivered
        // there, so only this check catches it.
        var portRe = regexp(":([0-9]{1,5})$")
        var checkPort = func(addr string, what string) {
          // An absolute path is a UNIX socket, not host:port, and a colon is a
          // legal filename character — so `/var/run/log:99999` is a valid
          // destination whose trailing digits are part of the name, not a port.
          if hasPrefix(addr, "/") {
            return
          }
          var m = portRe.FindSubmatch(addr)
          if len(m) > 0 {
            var port = toint(m[1])
            if port < 1 || port > 65535 {
              fail(what + " '" + addr + "' has port " + tostring(port) + ", outside 1-65535. A port above 65535 is rejected by HAProxy at config parse; port 0 is accepted there but no record can ever be delivered to it.")
            }
          }
        }

        // Keyed by target name, not a list: Helm and mergo replace lists
        // wholesale, so an operator adding one target would drop every target
        // the chart ships. keys() is sorted, so the `log` lines are emitted in
        // a stable order.
        var rawTargets = extraContext | dig("accessLog", "targets")
        var targets = map[string]any{}
        if rawTargets != nil {
          var m, ok = rawTargets.(map[string]any)
          if !ok {
            fail("controller.config.templatingSettings.extraContext.accessLog.targets must be a map of target name to log target.")
          }
          targets = m
        }
        // An ABSENT key takes the chart default. An explicitly EMPTY map does
        // not: it would fall back to stdout, which is the one destination this
        // knob exists to move records off, so the operator who wrote it would
        // silently get the opposite of what they asked for.
        if rawTargets != nil && len(targets) == 0 {
          fail("controller.config.templatingSettings.extraContext.accessLog.targets is empty. Name at least one target — use {stdout: {address: stdout}} for the chart default; an empty map would silently fall back to stdout, which is what this setting exists to move the access log away from.")
        }
        if len(targets) == 0 {
          targets = map[string]any{"stdout": map[string]any{"address": "stdout"}}
        }

        // A `log ring@<name>` whose ring does not exist passes `haproxy -c`
        // (return code 0, so the render's validation gate accepts it) and then
        // makes HAProxy REFUSE TO START: "unknown ring named '<name>'", exit 1.
        // Validation green, data plane down. So the only ring names accepted in
        // an address are the ones this chart emits, collected here first.
        var declaredRings = map[string]bool{}
        for _, tname := range keys(targets) {
          var t, ok = targets[tname].(map[string]any)
          if ok && t["ring"] != nil {
            var r, rok = t["ring"].(map[string]any)
            if rok {
              declaredRings[tostring(r["name"] | fallback("accesslog"))] = true
            }
          }
        }

        var out = []any{}
        var seenRings = map[string]bool{}
        var seenLines = map[string]string{}
        for _, tname := range keys(targets) {
          var where = "accessLog.targets." + tname
          var t, ok = targets[tname].(map[string]any)
          if !ok {
            fail(where + " must be a map with an address (or a ring).")
          }
          for _, k := range keys(t) {
            if k != "address" && k != "format" && k != "facility" && k != "level" && k != "ring" {
              fail(where + " contains unknown field '" + k + "'. Valid fields: address, format, facility, level, ring.")
            }
          }

          // A ring is a buffered TCP client the chart emits as its own section;
          // the target then logs to ring@<name>. Giving both is ambiguous.
          var ringRaw = t["ring"]
          var ring any = nil
          var address = tostring(t["address"] | fallback(""))
          if ringRaw != nil {
            var r, rok = ringRaw.(map[string]any)
            if !rok {
              fail(where + ".ring must be a map (name, address, size, logProto, connectTimeout, serverTimeout, serverOptions).")
            }
            if address != "" {
              fail(where + " sets both 'address' (" + address + ") and 'ring'. A ring target logs to ring@<name>, so set one or the other.")
            }
            for _, k := range keys(r) {
              if k != "name" && k != "address" && k != "size" && k != "logProto" && k != "connectTimeout" && k != "serverTimeout" && k != "serverOptions" {
                fail(where + ".ring contains unknown field '" + k + "'. Valid fields: name, address, size, logProto, connectTimeout, serverTimeout, serverOptions.")
              }
            }
            var ringName = tostring(r["name"] | fallback("accesslog"))
            if !ringNameRe.Match(ringName) {
              fail("Invalid " + where + ".ring.name '" + ringName + "'. It names an HAProxy section, so it must match ^[A-Za-z_][A-Za-z0-9_-]{0,63}$.")
            }
            if seenRings[ringName] {
              fail("Duplicate ring name '" + ringName + "' at " + where + ".ring.name. Two ring sections cannot share a name.")
            }
            seenRings[ringName] = true
            var ringAddr = tostring(r["address"] | fallback(""))
            if !ringAddrRe.Match(ringAddr) {
              fail("Invalid " + where + ".ring.address '" + ringAddr + "' for ring '" + ringName + "'. Expected <host>:<port> or [<ipv6>]:<port> — the address of the log collector the ring forwards to. For a UNIX socket collector use a plain-path address target instead; HAProxy 3.4 rejects a UNIX ring server.")
            }
            checkPort(ringAddr, where + ".ring.address")
            var ringSize = toint(r["size"] | fallback(65536))
            if ringSize < 4096 || ringSize > 134217728 {
              fail(where + ".ring.size for ring '" + ringName + "' must be between 4096 and 134217728 bytes; it is the in-memory buffer that holds records while the collector is unavailable.")
            }
            // The ring section carries `maxlen <maxLineBytes>`, and HAProxy caps
            // that at the buffer minus a ~197-byte header. A size below that
            // bound is only a [WARNING] ("event max length ... forced to N") —
            // which the render's haproxy_valid gate treats as success — and then
            // every record longer than N is truncated mid-byte into invalid
            // JSON. Identical on 3.0 and 3.4; 256 is the measured overhead
            // rounded up.
            var rawMaxLine = tostring(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384))
            if regex_search(rawMaxLine, "^[0-9]{1,5}$") {
              var maxLine = toint(rawMaxLine)
              if ringSize < maxLine+256 {
                fail(where + ".ring.size for ring '" + ringName + "' is " + tostring(ringSize) + ", too small for accessLog.maxLineBytes " + tostring(maxLine) + ". HAProxy would cap the ring's maxlen to the buffer minus its header and truncate every longer record into invalid JSON, warning but not failing. Give the ring at least " + tostring(maxLine+256) + " bytes (the buffer holds roughly size/maxLineBytes records while the collector is down).")
              }
            }
            var logProto = tostring(r["logProto"] | fallback("legacy"))
            if logProto != "legacy" && logProto != "octet-count" {
              fail(where + ".ring.logProto for ring '" + ringName + "' must be legacy (RFC 6587 non-transparent framing, newline-delimited) or octet-count.")
            }
            var connectTimeout = tostring(r["connectTimeout"] | fallback("5s"))
            var serverTimeout = tostring(r["serverTimeout"] | fallback("10s"))
            if !durationRe.Match(connectTimeout) || !durationRe.Match(serverTimeout) {
              fail(where + ".ring connectTimeout/serverTimeout for ring '" + ringName + "' must be HAProxy durations such as 5s or 500ms.")
            }
            // serverOptions is spliced verbatim onto the `server` line, which is
            // what makes TLS and any other server keyword reachable without the
            // chart modelling each one. Spaces are therefore allowed; a newline
            // or a comment marker would let it inject a directive.
            var serverOptions = tostring(r["serverOptions"] | fallback(""))
            if regex_search(serverOptions, "[[:cntrl:]#]") {
              fail("Invalid " + where + ".ring.serverOptions for ring '" + ringName + "': it is appended verbatim to the ring's `server` line and must not contain control characters or '#' (config-injection guard).")
            }
            ring = map[string]any{
              "name": ringName, "address": ringAddr, "size": ringSize, "logProto": logProto,
              "connectTimeout": connectTimeout, "serverTimeout": serverTimeout, "serverOptions": serverOptions,
            }
            address = "ring@" + ringName
          }

          if address == "" {
            fail(where + " needs an address (stdout, stderr, fd@<n>, <host>:<port>, /path/to.sock or ring@<name>) or a ring.")
          }
          if !addrRe.Match(address) {
            fail("Invalid " + where + ".address '" + address + "'. Expected stdout, stderr, fd@<n>, <host>:<port>, [<ipv6>]:<port>, an absolute socket path, or ring@<name>.")
          }
          if hasPrefix(address, "ring@") && !declaredRings[address[5:]] {
            fail(where + ".address '" + address + "' points at a ring no target declares. HAProxy accepts this at config check and then refuses to start (\"unknown ring named\"), so the render rejects it instead. Declare the ring on the target itself with a `ring:` block; to use a ring you define yourself, override the util-access-log-targets snippet.")
          }

          checkPort(address, where + ".address")

          // Default the framing to the target: stdout wants bare JSON so
          // `kubectl logs | jq` works, while anything else is a syslog
          // endpoint that expects a header it can parse.
          var defaultFormat = "rfc5424"
          if address == "stdout" || address == "stderr" {
            defaultFormat = "raw"
          }
          var format = tostring(t["format"] | fallback(defaultFormat))
          if !(formats contains format) {
            fail("Invalid " + where + ".format '" + format + "' for address '" + address + "'. Valid: " + join(formats, ", ") + ".")
          }
          var facility = tostring(t["facility"] | fallback("local0"))
          if !(facilities contains facility) {
            fail("Invalid " + where + ".facility '" + facility + "'. It must be one of the 24 standard syslog facilities.")
          }
          var level = tostring(t["level"] | fallback("info"))
          if !(levels contains level) {
            fail("Invalid " + where + ".level '" + level + "'. Valid: " + join(levels, ", ") + ". The level is a maximum-severity filter and access records are emitted at info, so a stricter level (notice and above) silently drops every one of them.")
          }

          // Each target renders one `log` line, and HAProxy sends every record
          // down every one of them. Two targets that produce an IDENTICAL line
          // therefore log each request TWICE — accepted by `haproxy -c`, silent
          // at runtime, and visible only as doubled volume in the collector.
          // The reachable way to hit this is a ring target plus a second entry
          // addressing that same ring. Targets differing in any field are real
          // fan-out and stay allowed.
          var lineKey = address + " " + format + " " + facility + " " + level
          if seenLines[lineKey] != "" {
            fail("accessLog.targets " + seenLines[lineKey] + " and " + tname + " render the same log line ('" + lineKey + "'), so every request would be logged twice. Drop the duplicate, or make the targets differ (a different format, facility, or level).")
          }
          seenLines[lineKey] = tname

          out = append(out, map[string]any{
            "address": address, "format": format, "facility": facility, "level": level, "ring": ring,
          })
        }
        return out
      }) -%}

  util-http-frontend-settings:
    template: |-
      {{ "\n" }}    option idle-close-on-response{{ render "util-log-format-http" }}

  util-log-format-http:
    template: |-
      {#
        util-log-format-http — the access-log directives for an HTTP-mode frontend.

        Emits, in order:
          1. the W3C Trace Context capture (see below),
          2. one `http-request set-var(txn.log_<name>)` line per
             extraContext.accessLog.fields entry,
          3. one `log-format "%{+json}o <items>"` line.

        Items come from `render_glob "log-fields-*"`. HAProxy's JSON encoder
        emits ONLY named items and silently DROPS literal text between them, so a
        malformed contribution would vanish from every log line with no error at
        all. Every token is therefore validated here and a bad one fail()s the
        render.

        CALL CONVENTION: append `{{ render "util-log-format-http" }}` to the END of
        an existing directive line in the frontend — never on a line of its own —
        and place it BEFORE any `http-request return` / `deny` rule, or the
        set-var lines never run for short-circuited requests.
      #}
      {# Off by default: writes `traceparent` onto every upstream request. #}
      {%- var tracingRaw = extraContext | dig("tracing", "enabled") -%}
      {%- var tracingOn = false -%}
      {%- if tracingRaw != nil -%}
        {%- var tb, tok = tracingRaw.(bool) -%}
        {%- if !tok -%}
          {{- fail("controller.config.templatingSettings.extraContext.tracing.enabled must be a boolean, got '" + tostring(tracingRaw) + "'. A quoted 'false' is truthy here and would silently enable trace propagation.") -}}
        {%- end -%}
        {%- tracingOn = tb -%}
      {%- end -%}
      {%- var sampleRate = 100 -%}
      {%- var rateRaw = extraContext | dig("tracing", "sampleRate") -%}
      {%- if rateRaw != nil -%}
        {%- sampleRate = toint(rateRaw) -%}
        {%- if sampleRate < 0 || sampleRate > 100 -%}
          {{- fail("controller.config.templatingSettings.extraContext.tracing.sampleRate must be a whole percentage between 0 and 100, got '" + tostring(rateRaw) + "'. It applies only when HAPTIC is the trace root; an inbound traceparent's decision is always honoured.") -}}
        {%- end -%}
      {%- end -%}
      {#- Cross-key guards (needs vector, needs enabled) live in Helm: a
          validationTest may pin either key, and failing here trips the load gate. -#}
      {%- var otlpEndpoint = extraContext | dig_string("", "tracing", "otlp", "endpoint") -%}
      {%- if otlpEndpoint != "" -%}
        {%- if !hasPrefix(otlpEndpoint, "http://") && !hasPrefix(otlpEndpoint, "https://") -%}
          {{- fail("controller.config.templatingSettings.extraContext.tracing.otlp.endpoint must be an absolute http:// or https:// URL of an OTLP/HTTP traces collector, got '" + otlpEndpoint + "'. Example: http://tempo.observability.svc.cluster.local:4318/v1/traces") -}}
        {%- end -%}
        {#- The endpoint lands in the vector config as a YAML scalar, so a '#'
            or a quote later in the URL would truncate or break the emitted
            document — a silently wrong destination, not a loud failure. -#}
        {%- if regex_search(otlpEndpoint, "[^A-Za-z0-9:/?&=._~%@+,;()\\[\\]-]") -%}
          {{- fail("controller.config.templatingSettings.extraContext.tracing.otlp.endpoint may only contain URL characters (A-Za-z0-9 and :/?&=._~%@+,;()[]-), got '" + otlpEndpoint + "'. It is emitted into the vector config, where a quote, '#' or whitespace would corrupt the document.") -}}
        {%- end -%}
      {%- end -%}
      {#- serviceName is spliced into a JSON string literal in the OTLP payload
          prefix (vector.yaml's otlp_traces sink). A quote or backslash there
          makes every exported batch invalid JSON, and the only symptom is that
          spans stop arriving — so bound it here rather than escaping at use. -#}
      {%- var otlpService = extraContext | dig_string("haptic", "tracing", "otlp", "serviceName") -%}
      {#- Same for every other value spliced into that prefix. clusterName is
          operator-supplied; the rest are chart-derived and safe in practice, but
          one guard over all of them cannot go stale as values are added. -#}
      {%- for _, f := range []string{"clusterName", "serviceNamespace", "serviceVersion", "deploymentName"} -%}
        {%- var v = tostring(extraContext | dig_string("", "tracing", "otlp", f)) -%}
        {%- if regex_search(v, "[^A-Za-z0-9._-]") -%}
          {{- fail("controller.config.templatingSettings.extraContext.tracing.otlp." + f + " may only contain A-Za-z0-9, '.', '_' and '-', got '" + v + "'. It is embedded in a JSON string literal in the OTLP payload, where a quote or backslash would make every exported batch invalid — and the only symptom is that spans stop arriving.") -}}
        {%- end -%}
      {%- end -%}
      {%- if regex_search(otlpService, "[^A-Za-z0-9._-]") -%}
        {{- fail("controller.config.templatingSettings.extraContext.tracing.otlp.serviceName may only contain A-Za-z0-9, '.', '_' and '-', got '" + otlpService + "'. It is embedded in a JSON string literal in the OTLP payload, where a quote or backslash would make every exported batch invalid.") -}}
      {%- end -%}
      {%- var fieldsRaw = extraContext | dig("accessLog", "fields") -%}
      {%- var fields = map[string]any{} -%}
      {%- if fieldsRaw != nil -%}
        {%- var f, ok = fieldsRaw.(map[string]any) -%}
        {%- if !ok -%}
          {{- fail("controller.config.templatingSettings.extraContext.accessLog.fields must be a map of <JSON field name> to <HAProxy sample expression>.") -}}
        {%- end -%}
        {%- fields = f -%}
      {%- end -%}
      {%- var lines = []string{} -%}
      {%- var items = []string{} -%}
      {%- var seen = map[string]string{} -%}
      {#- Full grammar pinned so a junk header contributes nothing.
          https://www.w3.org/TR/trace-context/ -#}
      {%- var tpGrammar = "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$" -%}
      {%- if !tracingOn -%}
        {#- Correlation only. A traceparent we invent but never export would orphan
            every downstream span. -#}
        {%- lines = append(lines, "http-request set-var(txn.trace_id) req.hdr(traceparent),field(2,-) if { req.hdr(traceparent) -m reg " + tpGrammar + " }") -%}
      {%- else -%}
        {#- Adopt an inbound traceparent: same trace, its span is our parent. -#}
        {%- lines = append(lines, "acl haptic_has_traceparent req.hdr(traceparent) -m reg " + tpGrammar) -%}
        {%- lines = append(lines, "http-request set-var(txn.trace_id) req.hdr(traceparent),field(2,-) if haptic_has_traceparent") -%}
        {%- lines = append(lines, "http-request set-var(txn.parent_span_id) req.hdr(traceparent),field(3,-) if haptic_has_traceparent") -%}
        {%- lines = append(lines, "http-request set-var(txn.trace_flags) req.hdr(traceparent),field(4,-) if haptic_has_traceparent") -%}
        {#- Groups 1,2,5 only: 3/4 carry fixed nibbles, and the variant nibble lands
            on byte 8, which TraceIdRatioBased reads — a constant there samples 0%
            at ratios <=0.5 in every downstream SDK. -#}
        {%- lines = append(lines, "http-request set-var-fmt(txn.trace_id) %[uuid(4),field(1,-)]%[uuid(4),field(2,-)]%[uuid(4),field(5,-)]%[uuid(4),field(1,-)] if !haptic_has_traceparent") -%}
        {#- Two rules: HAProxy takes one condition clause per rule. -#}
        {%- if sampleRate >= 100 -%}
          {%- lines = append(lines, "http-request set-var(txn.trace_flags) str(01) if !haptic_has_traceparent") -%}
        {%- else if sampleRate <= 0 -%}
          {%- lines = append(lines, "http-request set-var(txn.trace_flags) str(00) if !haptic_has_traceparent") -%}
        {%- else -%}
          {%- lines = append(lines, "http-request set-var(txn.trace_flags) str(01) if !haptic_has_traceparent { rand(100) lt " + tostring(sampleRate) + " }") -%}
          {%- lines = append(lines, "http-request set-var(txn.trace_flags) str(00) if !haptic_has_traceparent !{ var(txn.trace_flags) -m found }") -%}
        {%- end -%}
        {#- Our own span id is always fresh, adopted parent or not. -#}
        {%- lines = append(lines, "http-request set-var-fmt(txn.span_id) %[uuid(4),field(5,-)]%[uuid(4),field(2,-)]") -%}
        {#- A second id for the span that actually calls the backend. The
            backend must parent to THAT, not to this frontend's span, or its
            span lands beside our upstream span instead of inside it — and the
            shape would differ depending on whether a caller sent traceparent. -#}
        {%- lines = append(lines, "http-request set-var-fmt(txn.upstream_span_id) %[uuid(4),field(2,-)]%[uuid(4),field(5,-)]") -%}
        {#- Propagate. An unsampled trace is still propagated with flags 00 so
            downstream honours the same decision instead of re-deciding. -#}
        {%- lines = append(lines, "http-request set-header traceparent 00-%[var(txn.trace_id)]-%[var(txn.upstream_span_id)]-%[var(txn.trace_flags)]") -%}
      {%- end -%}
      {#- Library-contributed items. Inserting a separator before every item
          means a snippet that forgot its leading newline cannot fuse its first
          item onto the previous snippet's last one; collapsing all whitespace
          afterwards is safe because log-format takes exactly one argument and,
          under +json, whitespace between named items is inert. -#}
      {%- var contributed = render_glob "log-fields-*" -%}
      {%- var flat = strip(regexp("[[:space:]]+").ReplaceAll(replace(contributed, "%(", " %("), " ")) -%}
      {%- if flat == "" -%}
        {{- fail("The JSON access log has no fields: render_glob \"log-fields-*\" produced nothing. base.yaml's log-fields-100-core must always contribute; check that it was not overridden with an empty templateSnippets entry.") -}}
      {%- end -%}
      {%- var itemRe = regexp("^%\\(([A-Za-z_][A-Za-z0-9_]{0,39})(:(sint|str|bool))?\\)(\\[[^[:space:]]+\\]|[A-Za-z]+)$") -%}
      {%- for _, tok := range split(flat, " ") -%}
        {%- var m = itemRe.FindSubmatch(tok) -%}
        {%- if len(m) == 0 -%}
          {{- fail("Invalid access-log item '" + tok + "' contributed by a log-fields-* snippet. Every item must be %(<name>)<ALIAS> or %(<name>)[<fetch>], optionally typed as %(<name>:sint)/%(<name>:str)/%(<name>:bool), with no whitespace. HAProxy's JSON encoder silently drops anything that is not a named item, so it is rejected here instead of disappearing from the log.") -}}
        {%- end -%}
        {%- var prev, dup = seen[m[1]] -%}
        {%- if dup -%}
          {#- Several libraries legitimately contribute the same field (mTLS from
              three annotation libraries, captured headers from two): an
              identical item is deduplicated, a conflicting one is a bug. -#}
          {%- if prev != tok -%}
            {{- fail("Conflicting access-log field '" + m[1] + "': two log-fields-* snippets contribute it with different values ('" + prev + "' and '" + tok + "'). A duplicate JSON key silently corrupts log pipelines — rename one of the fields.") -}}
          {%- end -%}
          {%- continue -%}
        {%- end -%}
        {%- seen[m[1]] = tok -%}
        {%- items = append(items, tok) -%}
      {%- end -%}
      {#- Operator fields. Values are captured at request time into txn.log_<name>
          because a log-format cannot fetch request-scoped data itself, and are
          always JSON strings: typing an expression that may not resolve renders
          "" into a numeric slot, which breaks a typed log index. -#}
      {%- var nameRe = regexp("^[A-Za-z_][A-Za-z0-9_]{0,39}$") -%}
      {%- for _, name := range keys(fields) -%}
        {%- if !nameRe.Match(name) -%}
          {{- fail("Invalid accessLog.fields key '" + name + "'. A JSON field name must match ^[A-Za-z_][A-Za-z0-9_]{0,39}$.") -}}
        {%- end -%}
        {%- var _, clash = seen[name] -%}
        {%- if clash -%}
          {{- fail("accessLog.fields['" + name + "'] collides with the built-in access-log field of the same name. Duplicate JSON keys silently corrupt log pipelines; pick a different field name.") -}}
        {%- end -%}
        {%- var expr = tostring(fields[name]) -%}
        {%- if expr == "" -%}
          {{- fail("accessLog.fields['" + name + "'] is empty. It must hold exactly one HAProxy sample expression, e.g. req.hdr(X-Tenant) or str(prod-eu).") -}}
        {%- end -%}
        {#- Parentheses and brackets are deliberately NOT blocked: every real
            sample expression needs them (req.hdr(X), field(2,-), str(prod-eu)),
            and they cannot escape the JSON item — the item always references
            txn.log_<name>, never the operator's text. An unbalanced one produces
            a set-var line HAProxy rejects, which the render's own `haproxy -c`
            validation fails on, so it is loud rather than silent. -#}
        {%- if regex_search(expr, "[[:space:][:cntrl:]\"\\\\#]") -%}
          {{- fail("Invalid accessLog.fields['" + name + "'] value '" + expr + "': an HAProxy sample expression here must not contain whitespace, '#', '\"' or a backslash (config-injection guard). For a constant label use str(<value>) with no spaces.") -}}
        {%- end -%}
        {%- seen[name] = "accessLog.fields" -%}
        {%- lines = append(lines, "http-request set-var(txn.log_" + name + ") " + expr) -%}
        {%- items = append(items, "%(" + name + ")[var(txn.log_" + name + ")]") -%}
      {%- end -%}
      {%- lines = append(lines, "log-format \"%{+json}o " + join(items, " ") + "\"") -%}

      {# Optional suppression of uninteresting records. OFF unless the operator
          asks for it: a full log is lawful under legitimate interest (GDPR
          Art. 6(1)(f)), and the successful requests either side of a failure are
          what distinguish "one request broke" from "everything was broken" when a
          customer reports a problem.

          http-AFTER-response, not http-response: http-response rules only run for
          responses that came from a SERVER, so a 403 from a WAF deny or any other
          `http-request return` would slip past the condition and — worse — a
          suppression written there would never fire at all for them. Measured on
          3.0 and 3.4: with http-after-response, 5/5 successes are dropped while a
          denial and a 500 are kept; with http-response, all seven are logged.

          The condition keeps every failure and every denial, so the records a
          customer complains about are never the ones discarded. #}
      {# Validated here as well as in Helm: the HAProxyTemplateConfig CR is a
          first-class API that bypasses Helm entirely. A typo'd subkey would
          otherwise leave suppression silently off, which is the failure mode an
          operator would least notice — the log keeps working, just larger than
          they asked for. #}
      {%- var suppressRaw = extraContext | dig("accessLog", "suppress") -%}
      {%- if suppressRaw != nil -%}
        {%- var sup, supOk = suppressRaw.(map[string]any) -%}
        {%- if !supOk -%}
          {{- fail("controller.config.templatingSettings.extraContext.accessLog.suppress must be a map with a 'successful' boolean.") -}}
        {%- end -%}
        {%- for _, k := range keys(sup) -%}
          {%- if k != "successful" -%}
            {{- fail("accessLog.suppress contains unknown field '" + k + "'. Valid fields: successful.") -}}
          {%- end -%}
        {%- end -%}
        {%- var sv, svPresent = sup["successful"] -%}
        {%- if svPresent && tostring(sv) != "true" && tostring(sv) != "false" -%}
          {{- fail("accessLog.suppress.successful must be a boolean, got '" + tostring(sv) + "'.") -}}
        {%- end -%}
      {%- end -%}
      {%- var suppressSuccessful = extraContext | dig("accessLog", "suppress", "successful") | fallback(false) -%}
      {%- if tostring(suppressSuccessful) == "true" -%}
        {%- lines = append(lines, "http-after-response set-log-level silent if { status ge 200 } { status lt 400 } !{ var(txn.denied_by) -m found }") -%}
      {%- end -%}
      {{- "\n  " + join(lines, "\n  ") -}}

  util-log-format-tcp:
    template: |-
      {#
        util-log-format-tcp — the access-log directive for a mode-tcp frontend.

        Emits exactly one `log-format` line. A section may not also carry
        `option tcplog`: the two together make haproxy -c warn ("'log-format'
        overrides previous 'option tcplog'"), and scripts/test-helm-defaults.sh
        treats warnings as fatal.

        There is deliberately no log-fields-* extension point for TCP mode. The
        HTTP field set cannot be reused (a TCP connection has no status, method
        or path — the HTTP-only aliases render empty rather than erroring), and
        no bundled library needs a custom TCP field. Add a `log-fields-tcp-*`
        glob when a second consumer appears.

        CALL CONVENTION: append `{{ render "util-log-format-tcp" }}` to the end of
        the line that preceded `option tcplog`, and delete that line.
      #}
      {%- var items = []string{
            "%(ts)[accept_date(us),us_utime(%Y-%m-%dT%H:%M:%S.%6NZ)]",
            "%(client_ip)ci",
            "%(frontend)f",
            "%(backend)b",
            "%(server)s",
            "%(bytes:sint)B",
            "%(queue_time_ms:sint)Tw",
            "%(connect_time_ms:sint)Tc",
            "%(total_time_ms:sint)Tt",
            "%(retries:sint)rc",
            "%(term)ts",
          } -%}
      {{- "\n  log-format \"%{+json}o " + join(items, " ") + "\"" -}}

  log-fields-106-service:
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      {# namespace/service of the chosen backend's Service, from backend-service.map
          keyed by the selected backend name (var(txn.backend_name)). The pairing
          lives in a map, not `set-var` lines in the backend, so the backend section
          stays empty (dynamic) and a re-key is reload-free; the value is still the
          Service's ns/svc, not the generated backend name. Empty when no backend was
          chosen, so the fields drop out. Bare names, namespace separate, as OTel
          semconv and ECS have it — and so `service` and `server_pod` read the same. #}
      %(namespace)[var(txn.backend_name),map({{ mapPath("backend-service.map") }}),field(1,/)]
      %(service)[var(txn.backend_name),map({{ mapPath("backend-service.map") }}),field(2,/)]

  util-want-route:
    template: |-
      {# "true" when txn.route should be computed. Two features want it — spans for
          http.route, request metrics for `path` — so the condition lives here once
          rather than at each of its three call sites. Mirrored Helm-side by
          haptic.routeKeyEnabled; this copy is what holds for a hand-written CR. #}
      {%- var rm = extraContext | dig("vector", "requestMetrics") | fallback(map[string]any{}) -%}
      {%- if (extraContext | dig("tracing", "enabled")) == true -%}true{%- return %}{%- end -%}
      {%- if (rm | dig("enabled")) == true && (rm | dig("pathLabel")) == true -%}true{%- end -%}

  log-fields-108-route:
    template: |-
      {# Its own snippet, not part of the tracing block, because the request
          metrics want it with tracing off. Base deduplicates identical items. #}
      {%- var want = render "util-want-route" default "" %}
      {%- if strip(want) != "true" %}{% return %}{% end %}
      %(route)[var(txn.route)]

  log-fields-107-request-bytes:
    template: |-
      {# %U is the request BODY only; nginx's $request_length also counts the
          request line and headers, so a migrated histogram reads lower. Gated on
          the one metric that reads it. #}
      {%- var rm = extraContext | dig("vector", "requestMetrics") | fallback(map[string]any{}) %}
      {%- if (rm | dig("enabled")) != true || (rm | dig("metrics", "request_size")) != true %}{% return %}{% end %}
      %(bytes_in:sint)U

  log-fields-105-server-pod:
    template: |-
      {# The server name is the pod name (pod-named servers, ADR-0011), so `%s`
          is the pod the request was served by — no address→name map needed.
          `<NOSRV>` when HAProxy answered the request itself. #}
      %(server_pod)s

  log-fields-100-core:
    template: |-
      {#
        Core JSON access-log fields — resource-agnostic (RULE #1).

        Extension point: log-fields-* (band 100, "basic config"; base sorts first
        so the core keys are stable and cannot be shadowed by a later library).

        Only items available at log time are used: aliases, and txn variables
        that util-routing-prefix/suffix already set. `%HPO` is the path without
        host or query string — the query string is deliberately absent, because
        it is the most common accidental carrier of tokens and session ids; an
        operator who wants it opts in with `accessLog.fields: {query: query}`.

        Types are only applied to items that always resolve. A typed item whose
        fetch does not resolve renders "" — a string in a numeric slot — so every
        txn-variable field stays an untyped string.

        `resource` is <namespace>/<name> of the routing resource that owns the
        matched route, whatever kind produced it; it is what makes a log line
        joinable back to a Kubernetes object. It is empty in frontends that do
        not run the routing logic (status, the cache-origin leg); an unset
        variable renders "" and never omits the key, so the JSON schema is
        identical on every frontend.

        `listener_port` is the port the routing key was built from — the same
        value the `host:<port>` and `:<port>` map lookups use. Gateway host/path
        map keys are `<host>:<port>/...`, so without it a routing miss shows only
        as backend=default_backend with no way to tell a wrong key from a missing
        map entry (that cost a real CI diagnosis). It resolves on the plain-HTTP
        path too: the demux backends send PROXY v2 (`send-proxy-v2`) and the inner
        binds `accept-proxy`, so `dst_port` on a UNIX-socket bind is the ORIGINAL
        TCP listener port, not the socket. `,concat` is a string cast, and it is
        load-bearing: the value is a sint when it comes straight from `dst_port`
        and a string once a `frontend-routing-listener-port-*` library remaps it
        through `map()`, so an uncast item would flip the JSON type between
        `18080` and `"18080"` from one request to the next in the SAME frontend
        and split a typed log index.

        Deliberately omitted: %cp — the client PORT. Note the reason changed with
        the UUIDv7 request id: the old `%ci:%cp_%fi:%fp_...` format carried the
        port, an opaque uuid(7) does not. It stays out because a source port
        identifies a connection rather than a request. Also omitted: %U, %Tt (inflated by
        keep-alive idle next to total_time_ms), the %ac/%fc/%bc/%sc concurrency
        counters and %sq/%bq queue depths (Prometheus answers saturation better,
        and queues stay 0 without an opt-in maxconn), %r (duplicates
        method/path/http_version and carries the query), and %CC/%CS cookies.
      #}
      %(ts)[accept_date(us),us_utime(%Y-%m-%dT%H:%M:%S.%6NZ)]
      %(req_id)ID
      %(trace_id)[var(txn.trace_id)]
      {# The address the client connected TO — which VIP or entry point served
          this. ECS calls it destination.ip; on the span it is
          network.local.address. What it resolves to depends on how traffic
          reaches the pod: the LoadBalancer VIP with MetalLB-style L2/BGP, the
          node IP behind externalTrafficPolicy Local, the pod IP behind a
          DNAT-ing cloud LB. #}
      %(destination_ip)[dst]
      %(instance_pod)[var(proc.self_pod)]
      %(instance_node)[var(proc.self_node)]
      %(client_ip)ci
      %(frontend)f
      %(backend)b
      %(server)s
      %(method)HM
      %(host)[var(txn.host)]
      %(listener_port)[var(txn.listener_port),concat]
      %(path)HPO
      %(http_version)HV
      %(status:sint)ST
      %(bytes:sint)B
      %(request_time_ms:sint)TR
      %(queue_time_ms:sint)Tw
      %(connect_time_ms:sint)Tc
      %(response_time_ms:sint)Tr
      %(total_time_ms:sint)Ta
      %(retries:sint)rc
      %(term)tsc
      %(resource)[var(txn.resource_id)]
      {# Paired with denied_by: that names the control that REFUSED a request,
          these name controls that could not be consulted and were skipped. One
          per control, not one shared field — several can degrade in the same
          request, and a shared variable would keep only the last. #}
      %(rate_limit_degraded)[var(txn.rate_limit_degraded)]
      %(waf_degraded)[var(txn.waf_degraded)]
      %(denied_by)[var(txn.denied_by)]

  # ============================================================================
  # Frontend Routing Logic
  # ============================================================================

  # ----------------------------------------------------------------------------
  # util-routing-prefix / util-routing-suffix
  #
  # The two `frontend-routing-logic{,-regex-last}` variants share ~100 lines
  # of host extraction + host_match cascade + listener_port translation
  # (the prefix) and ~30 lines of qualifier parsing + MULTIBACKEND routing
  # + owner-resource identity (the suffix). The only difference is the
  # four path-matching set-var lines in the middle (regex's place in the
  # cascade). Hoisting the prefix and suffix into shared snippets means
  # there's exactly one source for the cascade — Gitar already caught a
  # lockstep drift on this MR (the regex-last variant was missing the
  # listener_port setup), and the shared snippet is what prevents the
  # next one. The variants below are 1-line shells that render the
  # prefix, emit their unique path-match cascade, and render the suffix.
  # ----------------------------------------------------------------------------
  util-routing-prefix:
    template: |
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      http-request set-var(txn.base) base
      http-request set-var(txn.path) path
      http-request set-var(txn.host_full) req.hdr(Host),lower
      http-request set-var(txn.host) req.hdr(Host),field(1,:),lower
      http-request set-var(txn.dst_port) dst_port
      http-request set-var(txn.listener_port) var(txn.dst_port)
      {# Extension point: libraries may remap txn.listener_port from bind metadata.
          The blank line before render_glob is load-bearing (charts/CLAUDE.md → Whitespace Control). #}

      {{ render_glob "frontend-routing-listener-port-*" }}
      # Listener-scoped keys precede shared hostname keys.
      http-request set-var(txn.host_match) str()

      {{ render_glob "frontend-routing-host-match-*" }}
      http-request set-var(txn.host_match) var(txn.host_full),map({{ mapPath("host.map") }},'') if { var(txn.host_full) -m sub : } { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),concat(:,txn.listener_port,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),regsub(^[^.]*,,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),map_reg({{ mapPath("host-regex.map") }},'') if { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),map_reg({{ mapPath("host-alias-regex.map") }},'') if { var(txn.host_match) -m len 0 }
      # listener-port catch-all (:port keys) when no host matched
      http-request set-var(txn.host_match) str(:),concat(,txn.listener_port,),map({{ mapPath("host.map") }},'') if { var(txn.host_match) -m len 0 }

  log-fields-110-tracing:
    template: |-
      {# Tracing-only access-log fields, in their own snippet so
          _helm_load.unset can drop them from the config when tracing is off.
          The `if` is the real gate: unset runs at Helm time, and a per-test or
          per-render extraContext can still turn tracing on afterwards.

          Gated on a GLOBAL value, never on which frontend renders: the field
          set must stay identical across frontends. #}
      {%- if (extraContext | dig("tracing", "enabled")) == true %}
      %(span_id)[var(txn.span_id)]
      %(parent_span_id)[var(txn.parent_span_id)]
      %(trace_flags)[var(txn.trace_flags)]
      {# The span the BACKEND adopts as its parent, so a reconstructed upstream
          span sits between us and it rather than beside it. #}
      %(upstream_span_id)[var(txn.upstream_span_id)]
      {# Th is the CLIENT side: TCP accept + PROXY protocol + client TLS, and
          only on a connection's first request. Nothing to do with the backend.
          Th and Ti exist only to anchor the spans. `ts` is accept_date — the
          CONNECTION accept — while every duration below is request-scoped, so a
          span anchored at `ts` starts one TLS handshake (plus keep-alive idle)
          too early and can end before the backend it waited on. Request receipt
          is accept_date + Th + Ti; the phases then follow HAProxy's fixed order.
          Both read -1 when the phase did not happen (plaintext, first request on
          a connection), which the span builder treats as zero. #}
      %(handshake_time_ms:sint)Th
      %(idle_time_ms:sint)Ti
      {# Td is the response-payload transfer. Without it the upstream call looks
          like it ends at the response HEADERS (%Tr), so a backend's own span
          overruns ours for any response with a body. #}
      %(transfer_time_ms:sint)Td
      {# `route` (for http.route) is contributed by log-fields-108-route, which
          the request metrics also want — so it is gated on util-want-route rather
          than on tracing alone. #}
      {# Exact transaction end, epoch microseconds: the log line is emitted when
          the response completes, so `date` at log time IS that instant. req+Ta
          closes early by whatever Ta's whole-ms truncation dropped (0.824ms
          measured). Raw integer, not a formatted stamp — the span builder wants
          a number, and parsing one back would cost a parse per record. #}
      %(te_us:sint)[date(0,us)]
      {%- end %}

  util-route-key:
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      {#- The map ENTRY that matched — the template an operator wrote, not the
          request path. `_key` returns the key rather than the value and takes
          no default, so each step guards on not-yet-found. The host stays in
          (the span name uses it; the OTel http.route attribute is the path part
          alone). A prefix match is marked `*`: prefix keys already end in `/`
          and boundary keys never do, so both render `/api/*`.

          Its own snippet so _helm_load.unset can drop it entirely when nothing
          wants it: it repeats the lookup cascade and a prefix map is a list, so a
          deployment that neither traces nor labels metrics by route should carry
          neither the cost nor the config. util-routing-suffix renders it with
          `default ""`. -#}
      {%- var want = render "util-want-route" default "" %}
      {%- if strip(want) != "true" %}{% return %}{% end %}
      {%- var rk = []any{[]string{"path-exact.map", "map_str_key", ""}, []string{"path-regex.map", "map_reg_key", ""}, []string{"path-prefix-exact.map", "map_str_key", ",concat(/*)"}, []string{"path-prefix.map", "map_beg_key", ",concat(*)"}} %}
      {%- for i, e := range rk %}{%- var m = e.([]string) %}
      http-request set-var(txn.route) var(txn.host_match),concat(,txn.path,),{{ m[1] }}({{ mapPath(m[0]) }}){{ m[2] }} if { var(txn.path_match) -m found }{% if i > 0 %} !{ var(txn.route) -m found }{% end %}
      {%- end %}

  util-routing-suffix:
    template: |-
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      {{ render "util-route-key" default "" }}
      # qualifier = field 1 of path_match (BACKEND | MULTIBACKEND)
      http-request set-var(txn.path_match_qualifier) var(txn.path_match),field(1,:)
      {# Advanced matchers (method/header/query) may rewrite path_match; re-parse
          the qualifier afterwards, but only when a matcher actually emitted rules. #}
      {%- var adv = render_glob "frontend-matchers-advanced-*" %}
      {{ adv }}
      {%- if strip(adv) != "" %}
      http-request set-var(txn.path_match_qualifier) var(txn.path_match),field(1,:)
      {%- end %}
      # MULTIBACKEND: weighted random selection
      http-request set-var(txn.total_weight) var(txn.path_match),field(2,:) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.random_weight) rand(),mod(txn.total_weight) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.route_key) var(txn.path_match),field(3,:) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.lookup_key) var(txn.random_weight),concat(:,txn.route_key,) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.backend_name) var(txn.lookup_key),map({{ mapPath("weighted-multi-backend.map") }}) if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      # BACKEND: direct routing
      http-request set-var(txn.backend_name) var(txn.path_match),field(2,:) if { var(txn.path_match_qualifier) -m str BACKEND }
      # owner resource id <ns>/<name> for logs; txn.resource_key below keys per-route feature maps. See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      http-request set-var(txn.resource_namespace) var(txn.backend_name),field(1,_) if { var(txn.path_match_qualifier) -m str BACKEND }
      http-request set-var(txn.resource_name)      var(txn.backend_name),field(2,_) if { var(txn.path_match_qualifier) -m str BACKEND }
      http-request set-var(txn.resource_namespace) var(txn.route_key),field(1,_)    if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      http-request set-var(txn.resource_name)      var(txn.route_key),field(2,_)    if { var(txn.path_match_qualifier) -m str MULTIBACKEND }
      {{ render_glob "frontend-routing-owner-*" }}
      http-request set-var(txn.resource_id) var(txn.resource_namespace),concat(/,txn.resource_name,) if { var(txn.resource_namespace) -m found }
      {#- txn.resource_key keys per-route feature maps; an owner snippet sets it when <ns>/<name> is not unique across route kinds. #}
      http-request set-var(txn.resource_key) var(txn.resource_id) if { var(txn.resource_id) -m found } !{ var(txn.resource_key) -m found }

  frontend-routing-logic:
    template: |-
      {#
        Path-based routing with qualifier system for backend selection.

        Qualifiers (set by map files, resolved here):
          - BACKEND:<name> → Direct routing to named backend
          - MULTIBACKEND:<weight>:<key> → Weighted routing via weighted-multi-backend.map

        Path Matching Order: Exact > Regex > Prefix-exact > Prefix
        (To select the alternative performance-first order — Exact > Prefix-exact >
         Prefix > Regex — set extraContext.routing.regexMatchOrder=last in
         values.yaml. The chart swaps in the frontend-routing-logic-regex-last
         variant below at load time.)

        Extension Points:
          - frontend-matchers-advanced-* → Advanced matchers (method, headers, query)
      #}
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      # base/frontend-routing-logic — host/path → backend. See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      {{ render "util-routing-prefix" }}
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-exact.map") }})
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_reg({{ mapPath("path-regex.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-prefix-exact.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_beg({{ mapPath("path-prefix.map") }}) if !{ var(txn.path_match) -m found }
      {{ render "util-routing-suffix" }}

  frontend-routing-logic-regex-last:
    template: |-
      {#
        Performance-first path matching variant: Exact > Prefix-exact > Prefix > Regex.

        This snippet exists only to be swapped into "frontend-routing-logic" by
        the base library's _helm_load when extraContext.routing.regexMatchOrder=last.
        It is unset before the merged config is rendered, so it never appears in
        the operator-visible HAProxyTemplateConfig output.

        Differs from the default variant only in the four path-matching set-var
        lines below (regex moved to last); the shared prefix and suffix are
        emitted via util-routing-prefix / util-routing-suffix to eliminate
        lockstep drift.
      #}
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      # base/frontend-routing-logic (regex-last variant)
      {{ render "util-routing-prefix" }}
      # Path matching: Exact > Prefix-exact > Prefix > Regex
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-exact.map") }})
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map({{ mapPath("path-prefix-exact.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_beg({{ mapPath("path-prefix.map") }}) if !{ var(txn.path_match) -m found }
      http-request set-var(txn.path_match) var(txn.host_match),concat(,txn.path,),map_reg({{ mapPath("path-regex.map") }}) if !{ var(txn.path_match) -m found }
      {{ render "util-routing-suffix" }}

  # ============================================================================
  # Backend Server Generation
  # ============================================================================

  # ----------------------------------------------------------------------------
  # Backend Server Generation - Helper Macros
  # ----------------------------------------------------------------------------

  util-backend-servers-helpers:
    template: |
      {#
        Helper macros for BackendServers. Import these using:
          {% import "util-backend-servers-helpers" for ServerName %}
      #}

      {# Sanitises a pod (or `<service>-<pod>`) name into an HAProxy server name:
          the CLI splits on whitespace and `;` and uses `/` itself, so anything
          outside [A-Za-z0-9_.-] becomes `-`. Pod and Service names are already
          DNS-1123, so this only guards custom-CRD libraries that pass arbitrary
          names. Capped at 59, not the 63-byte server-name limit: BackendServers'
          de-collision loop may append a `-<n>` suffix (up to `-999`), and the
          final name must still fit 63 bytes. A func var (not a macro) so it is
          callable from BackendServers' func body. #}
      {%- var ServerName = func(podName string) string {
        var clean = ""
        for _, character := range split(podName, "") {
          if strings_contains("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-", character) {
            clean = clean + character
          } else {
            clean = clean + "-"
          }
        }
        if clean == "" {
          clean = "srv"
        }
        if len(clean) > 59 {
          clean = clean[:59]
        }
        return clean
      } -%}

  # ----------------------------------------------------------------------------
  # Backend Declaration
  # ----------------------------------------------------------------------------

  util-backend:
    template: |
      {#
        Backend - emits one `backend` section and declares it to the render plan.

        The section text is built from the record, so the plan always describes
        what HAProxy reads. Emit every backend through it: a section written by
        hand is opaque to the plan and forces a reload on any change.

        Keys (strict - an unknown key or a missing name fails the render):
          name          - backend name (required)
          guid          - value of the `guid` line
          mode          - `mode` line; omit to inherit http from defaults
          balance       - `balance` line
          hashType      - `hash-type` line
          body          - directive lines that must stay in this section
          servers       - server records, from BackendServers() or a library's
                          own list of {name, address, port, weight, disabled,
                          guid, comment}
          defaultServer - `default-server` keyword records {name, args}, formatted
                          into the profile's `default-server` line (use
                          DefaultServerArgs(opts) to build them from serverOpts)
          comments      - provenance lines emitted above the section header
          shape         - derived from body: "dynamic" when empty, "structural"
                          otherwise; set explicitly to override
          shapeReason   - what forced the shape

        Example:
          {{ Backend(map[string]any{
               "name":          beKey,
               "guid":          make_guid("be", beKey),
               "defaultServer": DefaultServerArgs(opts),
               "servers":       BackendServers(svcName, 0, port, opts, portName, beKey, ns),
             }) }}
      #}
      {#- Adds the directive lines of a rendered block (an extension point's
          output) to a `body` list, one entry per non-empty line. -#}
      {%- var AppendLines = func(lines []any, rendered string) []any {
        for _, line := range split(rendered, "\n") {
          if trimmed := trimSpace(line); trimmed != "" {
            lines = append(lines, trimmed)
          }
        }
        return lines
      } -%}
      {%- var ServerLine = func(server map[string]any) string {
        var line = "server " + tostring(server["name"]) + " " + tostring(server["address"])
        // A unix-socket address has no port; a record without one describes such a line.
        if server["port"] != nil {
          line = line + ":" + tostring(server["port"])
        }
        if guid := tostring(server | dig("guid") | fallback("")); guid != "" {
          line = line + " guid " + guid
        }
        // Presence of `disabled` decides whether a state keyword is printed at all.
        if _, has := server["disabled"]; has {
          if server["disabled"] == true {
            line = line + " disabled"
          } else {
            line = line + " enabled"
          }
        }
        // A weight of 0 is meaningful (takes no traffic), so presence decides.
        if server["weight"] != nil {
          line = line + " weight " + tostring(toint(server["weight"]))
        }
        for _, keyword := range toSlice(server["extra"]) {
          var arg = keyword.(map[string]any)
          line = line + " " + join(append([]any{arg["name"]}, toSlice(arg["args"])...), " ")
        }
        if comment := tostring(server | dig("comment") | fallback("")); comment != "" {
          line = line + "  # " + comment
        }
        return line
      } -%}
      {#- Turns a list of ONE-keyword strings ("maxconn 100", "ssl", "ca-file p")
          into structured KeywordArg records ({name, args}). Each entry must be a
          single server keyword — a multi-keyword string would need an HAProxy
          grammar to split (RULE #1), so emitters append one keyword per entry.
          The split is first-space only, exactly how client-native parses a server
          keyword, so the record reconstructs the line the differential test reads.
          Building the args structurally (not a raw default-server string) is what
          lets the deploy side compose a correct, secure `add server` for a
          pod-named server at runtime. -#}
      {%- var FlagsToKeywordArgs = func(flags []any) []any {
        var out = []any{}
        for _, f := range flags {
          var parts = splitN(tostring(f), " ", 2)
          var kw = map[string]any{"name": parts[0]}
          if len(parts) > 1 {
            kw["args"] = []any{parts[1]}
          }
          out = append(out, kw)
        }
        return out
      } -%}
      {#- The structured `default-server` args for a backend: the check directive
          (check|no-check), the per-server keyword flags, and the per-pod maxconn.
          Passed to Backend() as `defaultServer` so the keywords are both on the
          profile's default-server line AND visible in the plan record. -#}
      {%- var DefaultServerArgs = func(serverOpts map[string]any) []any {
        var ds = []any{map[string]any{"name": tostring(serverOpts | dig("checkDirective") | fallback("check"))}}
        for _, kw := range FlagsToKeywordArgs(toSlice(serverOpts["flags"])) {
          ds = append(ds, kw)
        }
        if m := serverOpts | dig("podMaxconnValue"); m != nil {
          ds = append(ds, map[string]any{"name": "maxconn", "args": []any{tostring(m)}})
        }
        return ds
      } -%}
      {#- A directive valid in a named defaults whose value is shared by every
          route that sets it belongs in the content-addressed profile, not in the
          backend: two routes with the same setting then share one section and
          neither makes its backend structural. Rules (http-request ...), tables
          and filters stay in the body: a rule set is per route by construction,
          and HAProxy refuses `filter` in a defaults. -#}
      {%- var ProfileDirective = func(line string) bool {
        for _, prefix := range []string{"timeout ", "fullconn ", "retries ", "retry-on ",
            "compression ", "cookie ", "dynamic-cookie-key ", "option httpchk", "http-check "} {
          if hasPrefix(line, prefix) {
            return true
          }
        }
        return false
      } -%}
      {%- var HasPrefixed = func(lines []any, prefix string) bool {
        for _, line := range lines {
          if hasPrefix(tostring(line), prefix) {
            return true
          }
        }
        return false
      } -%}
      {%- var PrepareBackend = func(spec map[string]any) (map[string]any, string) {
          var name = tostring(spec | dig("name") | fallback(""))

          // A hash-family balance (source/uri/url_param/hdr/rdp-cookie/hash)
          // refuses `add server` unless `hash-type consistent` is set, so a
          // pod-named server can't be added at runtime without it — the backend
          // would reload on every pod change. Inject it by default so pod churn
          // stays reload-free everywhere except static-rr and an explicit
          // `hashType: map-based` opt-out (documented: "pod churn will reload").
          var balance = tostring(spec | dig("balance") | fallback(""))
          var hashType = tostring(spec | dig("hashType") | fallback(""))
          if balance != "" && hashType == "" {
            var algo = split(split(balance, "(")[0], " ")[0]
            for _, h := range []string{"source", "uri", "url_param", "hdr", "rdp-cookie", "hash"} {
              if algo == h {
                hashType = "consistent"
              }
            }
          }
          spec["hashType"] = hashType

          // The rendered body lines are sorted by what they mean to the plan:
          // a `#` line is a comment (recorded so a change explains the text,
          // never shaping), a ProfileDirective joins the profile, and only the
          // rest is body, which is what keeps a backend structural.
          var headerComments = []any{}
          var comments = []any{}
          for _, comment := range toSlice(spec["comments"]) {
            headerComments = append(headerComments, tostring(comment))
            comments = append(comments, tostring(comment))
          }
          var profileLines = []any{}
          for _, line := range toSlice(spec["profile"]) {
            profileLines = append(profileLines, tostring(line))
          }
          var body = []any{}
          var section = []any{}
          for _, lineAny := range toSlice(spec["body"]) {
            var line = trimSpace(tostring(lineAny))
            if line == "" {
              continue
            }
            if hasPrefix(line, "#") {
              comments = append(comments, line)
              section = append(section, line)
            } else if ProfileDirective(line) {
              profileLines = append(profileLines, line)
            } else {
              body = append(body, line)
              section = append(section, line)
            }
          }
          // Compression inherited from the profile next to another filter needs
          // the compression filter declared explicitly, and first, so a
          // bandwidth limit meters the compressed bytes (HAProxy: "require an
          // explicit filter declaration to use HTTP compression").
          if HasPrefixed(profileLines, "compression ") && HasPrefixed(body, "filter ") && !HasPrefixed(body, "filter compression") {
            body = append([]any{"filter compression"}, body...)
            section = append([]any{"filter compression"}, section...)
          }
          spec["comments"] = comments
          spec["body"] = body

          // mode / balance / hash-type / default-server and the profile lines
          // live in a content-addressed `defaults haptic-be-<hash>`; two
          // backends of the same shape get the same profile and one section,
          // which is what lets a route be added at runtime without a reload.
          var profileName, perr = planRegistry.Profile(map[string]any{
            "mode":          spec["mode"],
            "balance":       spec["balance"],
            "hashType":      hashType,
            "defaultServer": spec["defaultServer"],
            "profile":       profileLines,
          })
          if perr != nil {
            fail(perr.Error())
          }

          // The section is `from <profile>` + guid + body + servers; an empty
          // body is dynamic-eligible. The author may force the shape
          // (unix-socket servers, base's own backends).
          if spec["shape"] == nil {
            if len(body) == 0 {
              spec["shape"] = "dynamic"
            } else {
              spec["shape"] = "structural"
            }
          }
          var lines = []any{}
          for _, comment := range headerComments {
            lines = append(lines, tostring(comment))
          }
          lines = append(lines, "backend " + name + " from " + profileName)
          if guid := tostring(spec | dig("guid") | fallback("")); guid != "" {
            lines = append(lines, "    guid " + guid)
          }
          for _, line := range section {
            lines = append(lines, "    " + tostring(line))
          }
          for _, server := range toSlice(spec["servers"]) {
            lines = append(lines, "    " + ServerLine(server.(map[string]any)))
          }

          // The record keeps mode/balance/hash-type/default-server as metadata
          // (the deploy side composes `add backend from <profile>` and
          // `add server` from them); `profile` becomes the resolved name, no
          // longer the input lines.
          spec["profile"] = profileName
          return spec, join(lines, "\n") + "\n"
      } -%}
      {% macro Backend(spec map[string]any) %}
        {%%
          var record, text = PrepareBackend(spec)
          var token, err = planRegistry.Backend(record, text)
          if err != nil {
            fail(err.Error())
          }
          show token
        %%}
      {% end %}

  # A removed operator knob: servers are named after pods (no slot pool,
  # ADR-0011), so there is nothing to size. Operator input, so it fails the
  # render (the config-load gate reports it); `haptic preflight` catches it
  # before an upgrade. The scale-server-slots annotations (tenant input) only
  # warn — see the backend-directives handlers.
  features-005-removed-server-slots:
    template: |
      {%- if (extraContext | dig("serverSlots")) != nil %}
      {{- fail("extraContext.serverSlots is no longer supported: servers are named after their pods (no slot pool), so there is nothing to size. Remove controller.config.templatingSettings.extraContext.serverSlots from your values.") -}}
      {%- end -%}

  # ============================================================================
  # Extension Points
  # ============================================================================

  # Global section directives — override or extend via global-settings-* snippets.
  # Users can override specific groups (e.g., defaults-settings-300-timeouts)
  # or add new ones (e.g., global-settings-500-tuning).
  global-settings:
    template: |
      {# Renders global-settings-* snippets (global section directives) #}
      {{- render_glob "global-settings-*" | strip() -}}

  global-settings-050-experimental:
    template: |
      {%- var shmEnabled bool = extraContext | dig("shmStatsEnabled") | fallback(false) -%}
      {%- if shmEnabled && semver_gte(extraContext | dig("haproxyVersion") | fallback(""), "3.3") %}
      expose-experimental-directives
      {%- end %}

  global-settings-090-instance:
    template: |
      {# Read once at startup into proc-scoped variables: identity is fixed for
          the process, so a per-request fetch would be waste. An unset variable
          renders empty and omitEmptyLogFields drops the field, so a deployment
          that does not set these is unaffected. #}
      set-var proc.self_pod str("$SELF_POD_NAME")
      set-var proc.self_node str("$SELF_NODE_NAME")

  global-settings-100-logging:
    template: |
      {#
        `format raw` strips the syslog header ("<134>Jul 25 21:01:17
        haproxy[1]: ") that would otherwise precede every JSON record and break
        a collector that parses lines directly. It also removes the syslog
        timestamp, which is why log-fields-100-core carries its own `ts`.

        Argument order is mandatory: `log <target> [len <n>] [format <f>]
        <facility> [<level>]`. `format raw len 16384` is a fatal config error.

        `len` truncates mid-byte, and a truncated JSON record is unparseable, so
        the default is generous. Raise it with
        extraContext.accessLog.maxLineBytes if custom fields or captured headers
        push records past it.
      #}
      {# The bound is enforced here as well as in the chart's Helm validation,
          because a hand-written HAProxyTemplateConfig reaches the engine without
          passing through Helm at all. Too small truncates every record into
          invalid JSON; a negative or absurd value is an HAProxy config error. #}
      {# Check the raw value's shape BEFORE converting: toint() saturates an
          absurd digit string to int64 min (-9223372036854775808), which the range
          check below would reject — but reporting that number instead of what the
          operator wrote is a poor diagnostic, and it leans on an overflow
          artifact rather than an explicit rule. Five digits covers 65535. #}
      {%- var rawMax = tostring(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) -%}
      {%- if !regex_search(rawMax, "^[0-9]{1,5}$") -%}
        {{- fail("controller.config.templatingSettings.extraContext.accessLog.maxLineBytes must be an integer between 1024 and 65535, got '" + rawMax + "'.") -}}
      {%- end -%}
      {%- var maxLen = toint(rawMax) -%}
      {%- if maxLen < 1024 || maxLen > 65535 -%}
        {{- fail("controller.config.templatingSettings.extraContext.accessLog.maxLineBytes must be an integer between 1024 and 65535, got " + tostring(maxLen) + ". Below 1024 every JSON access-log record would be truncated into invalid JSON.") -}}
      {%- end -%}
      log stdout len {{ maxLen }} format raw local0 info

  global-settings-200-process:
    template: |
      {%- var processModel = extraContext | dig_string("daemon", "processModel") -%}
      {{ processModel }}
      {%- var nbthread = extraContext | dig("nbthread") | fallback(0) | toint() -%}
      {%- if nbthread > 0 %}
      nbthread {{ nbthread }}
      {%- end %}

  global-settings-210-graceful-reload:
    template: |
      {# Bound retired-worker memory while existing requests finish. #}
      {%- var hsa = extraContext | dig("hardStopAfter") | fallback("60s") | tostring() -%}
      {%- if hsa != "" %}
      hard-stop-after {{ hsa }}
      {%- end %}

  global-settings-220-localpeer:
    template: |
      {# Deterministic local-peer name so the always-on `peers localinstance` #}
      {# section (global-top-050-peers) recognises `peer local ...` as THIS #}
      {# process and LISTENS on it. On a master-worker reload the old worker #}
      {# then teaches the new worker its stick-table contents over that local #}
      {# peer, so per-source counters (e.g. rate-limit http_req_rate) survive #}
      {# the reload instead of resetting to zero. A static name keeps offline #}
      {# `haproxy -c` validation deterministic (no $HOSTNAME dependency); the #}
      {# single 127.0.0.1 peer never connects to other pods, so stick-tables #}
      {# stay per-replica (matches haproxytech/kubernetes-ingress). #}
      localpeer local

  global-settings-250-shm-stats:
    template: |
      {%- var shmEnabled bool = extraContext | dig("shmStatsEnabled") | fallback(false) -%}
      {%- if shmEnabled && semver_gte(extraContext | dig("haproxyVersion") | fallback(""), "3.3") %}
      shm-stats-file {{ extraContext | dig("shmStatsPath") | fallback("/dev/shm/haproxy-stats") }}
      shm-stats-file-max-objects {{ extraContext | dig("shmStatsMaxObjects") | fallback(50000) }}
      {%- end %}

  global-settings-260-runtime-socket:
    template: |
      {# The agent's runtime socket: the master socket relays only the first command #}
      {# of a ';'-joined line and holds no session state (`wait`, payload commands). #}
      stats socket {{ pathResolver.GetBaseDir() }}/haproxy-worker.sock mode 600 level admin

  # The single owner of tune.bufsize. Two snippets emitting it would leave the
  # effective value to band order, and the controller reads this number to size
  # its runtime CLI batches — an over-large batch lands ZERO entries on the
  # worker, so reading a value HAProxy is not running is silent map divergence.
  #
  # Body inspection needs the buffer to hold the whole request body, so the
  # larger of the two knobs wins. Below 3.4 tune.cli.max-payload-size does not
  # exist (verified: 3.0-3.3 reject the keyword) and a CLI payload is capped by
  # tune.bufsize instead.
  util-tune-bufsize:
    template: |-
      {%- var bufsize = toint(extraContext | dig("tune", "bufsize") | fallback(16384)) -%}
      {%- var bodyBuffer = extraContext | dig("requestBodyInspection", "haproxyBuffer", "sizeBytes") -%}
      {%- if bodyBuffer != nil -%}
        {%- if toint(bodyBuffer) < 16384 || toint(bodyBuffer) > 2097152 -%}
          {%- fail("extraContext.requestBodyInspection.haproxyBuffer.sizeBytes must be between 16384 and 2097152 bytes.") -%}
        {%- end -%}
        {%- if toint(bodyBuffer) > bufsize %}{% bufsize = toint(bodyBuffer) %}{% end -%}
      {%- end -%}
      {{- bufsize -}}

  global-settings-270-cli-limits:
    template: |
      tune.bufsize {{ render "util-tune-bufsize" }}
      {%- if semver_gte(extraContext | dig("haproxyVersion") | fallback(""), "3.4") %}
      tune.cli.max-payload-size {{ toint(extraContext | dig("tune", "cliMaxPayloadSize") | fallback(131072)) }}
      {%- end %}

  global-settings-300-paths:
    template: |
      default-path origin {{ pathResolver.GetBaseDir() }}
      crt-base {{ pathResolver.GetPath("", "cert") }}

  # NOTE: there is deliberately no `server-state-file` / `load-server-state-from-file`.
  # HAProxy does not restore an IP-literal server's address from the state file
  # (it only restores port/op-state/admin and stashes the address in lastaddr,
  # applied solely to FQDN/DNS-SRV servers), so the machinery did not preserve
  # pod addresses across reloads and its port restoration minted a stale-slot
  # hybrid. Removed; reloads are config-driven. See
  # docs/adr/0011-no-haproxy-server-state-file.md.

  # Defaults section directives — override or extend via defaults-settings-* snippets.
  defaults-settings:
    template: |
      {# Renders defaults-settings-* snippets (defaults section directives) #}
      {{- render_glob "defaults-settings-*" | strip() -}}

  defaults-settings-100-options:
    template: |
      mode http
      {# Access-log targets, one `log` line each. This replaces the historical
          `log global`, which tied traffic logs to whatever the global section
          used: proxies now log where extraContext.accessLog.targets says, while
          HAProxy's own process and alert messages keep using the global stdout
          target. With the default (stdout/raw/local0/info) the rendered line is
          what `log global` resolved to anyway. #}
      {{- render "util-access-log-targets" -}}
      {%- var alTargets = shared.Get("accessLogTargets").([]any) -%}
      {%- var alMaxLen = toint(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) -%}
      {%- for _, tAny := range alTargets %}
        {%- var t = tAny.(map[string]any) %}
      log {{ t["address"] }} len {{ alMaxLen }} format {{ t["format"] }} {{ t["facility"] }} {{ t["level"] }}
      {%- end %}
      option httplog
      option dontlognull
      option log-health-checks
      # Retry a failed TCP connect on a different server in the backend (not the
      # same dead one); with the default `retries 3` this closes the pod-termination
      # race during rolling updates. See https://haproxy-haptic.org/docs/latest/libraries/base/#connection-reliability-and-timeouts
      option redispatch
      # `option redispatch` above covers only a failed CONNECT. A terminating pod
      # usually still has its socket bound after the app is gone, so the kernel
      # completes the handshake and the app then RSTs — HAProxy logs 502 `SH--`
      # with t_connect 0 and retries 0, because the default `retry-on
      # conn-failure` does not match a connection that succeeded. `empty-response`
      # is the condition that does. Bounded to idempotent methods by
      # frontend-filters-095. Override with extraContext.retryOn.
      retry-on {{ extraContext | dig("retryOn") | fallback("conn-failure empty-response response-timeout") }}

  defaults-settings-150-access-log-request-id:
    template: |
      {#
        Request correlation id, always available as the access log's `req_id`
        field and forwardable upstream by the request-id annotation.

        RFC 9562 UUIDv7 (supported by `uuid()` since HAProxy 3.0, the chart's
        floor): opaque with respect to the client, but time-ordered, which gives
        better index locality in a log store than v4. It deliberately carries NO
        client information — the historical `%ci:%cp_%fi:%fp_%Ts_%rt:%pid` format
        embedded the client IP (personal data under GDPR Art. 4(1) / Recital 30)
        and the frontend's own address into a value that is forwarded upstream,
        echoed to clients, and copied into app logs and support tickets, where
        neither the retention nor the purpose was ever scoped for it. Removing
        the IP from the identifier is what makes dropping the `client_ip` field
        an effective redaction.

        Emitted at band 150 so a raw `config-defaults` injection (band 800) can
        still override it — `uuid()` for UUIDv4 is the documented alternative.
      #}
      unique-id-format %[uuid(7)]

  defaults-settings-200-balance:
    template: |
      balance roundrobin

  defaults-settings-300-timeouts:
    template: |
      # timeout connect 100ms (vs the usual 5s): fast-fail a SYN to a just-terminated
      # pod IP so `option redispatch` retries a live server within ~200ms instead of
      # stalling 5s into a 504. Override extraContext.timeoutConnect on slow networks.
      # See https://haproxy-haptic.org/docs/latest/libraries/base/#connection-reliability-and-timeouts
      timeout connect {{ extraContext | dig("timeoutConnect") | fallback("100") }}
      timeout client {{ extraContext | dig("timeoutClient") | fallback("50000") }}
      timeout server {{ extraContext | dig("timeoutServer") | fallback("50000") }}
      {%- var tHttpReq = extraContext | dig_string("", "timeoutHttpRequest") -%}
      {%- var tKeepAlive = extraContext | dig_string("", "timeoutHttpKeepAlive") -%}
      {%- if tHttpReq != "" %}
      timeout http-request {{ tHttpReq }}
      {%- end -%}
      {%- if tKeepAlive != "" %}
      timeout http-keep-alive {{ tKeepAlive }}
      {%- end %}

  defaults-settings-400-errorfiles:
    template: |
      errorfile 400 {{ pathResolver.GetPath("400.http", "file") }}
      errorfile 403 {{ pathResolver.GetPath("403.http", "file") }}
      errorfile 408 {{ pathResolver.GetPath("408.http", "file") }}
      errorfile 500 {{ pathResolver.GetPath("500.http", "file") }}
      errorfile 502 {{ pathResolver.GetPath("502.http", "file") }}
      errorfile 503 {{ pathResolver.GetPath("503.http", "file") }}
      errorfile 504 {{ pathResolver.GetPath("504.http", "file") }}

  # Sanitize before other filters and SPOE.
  # See docs/site/docs/libraries/base.md#forwarded-headers.
  frontend-filters-010-forwarded-headers:
    template: |
      {%- import "util-forwarded-for-modes" for ForwardedForModes -%}
      {%%
        var modes = ForwardedForModes()
        var trusted = shared.Get("forwardedTrustedProxiesMap") | fallback("") | tostring()
        var unlessTrusted = ""
        if trusted != "" {
          unlessTrusted = " unless haptic_trusted_proxy"
        }
        var xffCondition = unlessTrusted
        if modes != "" && trusted != "" {
          xffCondition = " if { var(txn.xff_mode) -m str replace } || !{ var(txn.xff_mode) -m found } !haptic_trusted_proxy"
        } else if modes != "" {
          xffCondition = " unless { var(txn.xff_mode) -m str append ifmissing ignore }"
        }
      %%}
      # base/forwarded-headers (extraContext.forwardedHeaders)
      {%- if trusted != "" %}
      acl haptic_trusted_proxy src,map_ip({{ trusted }}) -m found
      {%- end %}
      http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]{{ unlessTrusted }}{% if trusted != "" %} { req.hdr(X-Forwarded-Proto) -m found }{% end %}
      http-request del-header X-Forwarded-Host{{ unlessTrusted }}
      http-request del-header X-Forwarded-Port{{ unlessTrusted }}
      {%- if modes != "" %}
      {{ modes }}
      {%- end %}
      http-request del-header X-Forwarded-For{{ xffCondition }}

  # After set-src and the header filters, so the address is the one every
  # src-based rule judged.
  frontend-filters-998-forwarded-for:
    template: |
      {%- import "util-forwarded-for-modes" for ForwardedForModes -%}
      {%- if ForwardedForModes() != "" %}
      http-request add-header X-Forwarded-For %[src] unless { var(txn.xff_mode) -m str ignore } || { var(txn.xff_mode) -m str ifmissing } { req.hdr(X-Forwarded-For) -m found }
      {%- else %}
      http-request add-header X-Forwarded-For %[src]
      {%- end %}

  # Registers the map frontend-filters-010 reads (features render first);
  # haproxy -c rejects an address the charset check lets through.
  features-010-forwarded-headers:
    template: |-
      {%- import "util-register-map" for RegisterMap -%}
      {%%
        _, _ = shared.ComputeIfAbsent("forwardedTrustedProxiesMap", func() any {
          var configured = extraContext | dig("forwardedHeaders", "trustedProxies")
          if configured == nil {
            return ""
          }
          var list, isList = configured.([]any)
          if !isList {
            fail("controller.config.templatingSettings.extraContext.forwardedHeaders.trustedProxies must be a list of CIDRs, got '" + tostring(configured) + "'. Use a list such as [\"10.0.0.0/8\"].")
          }
          var lines = []string{}
          for _, entry := range list {
            var cidr = strip(tostring(entry))
            if !regex_search(cidr, `^[0-9a-fA-F:./]+$`) {
              fail("controller.config.templatingSettings.extraContext.forwardedHeaders.trustedProxies entry '" + cidr + "' is not an IP address or CIDR. Use a value such as 10.0.0.0/8 or 2001:db8::/32.")
            }
            lines = append(lines, cidr + " 1")
          }
          if len(lines) == 0 {
            return ""
          }
          return RegisterMap("forwarded-trusted-proxies.map", lines, map[string]any{"ordered": false})
        })
      %%}

  # The forwarded-for-mode-* rules: each sets txn.xff_mode to replace, append,
  # ifmissing or ignore for the requests it claims.
  util-forwarded-for-modes:
    template: |-
      {%- macro ForwardedForModes() string -%}
      {%%
        var rules, _ = shared.ComputeIfAbsent("forwardedForModeRules", func() any {
          return strip(render_glob "forwarded-for-mode-*")
        })
        show tostring(rules)
      %%}
      {%- end macro -%}

  frontend-filters-095-l7-retry-idempotency:
    template: |
      {#
        Bound the `retry-on` list in `defaults` to idempotent methods.

        An L7 retry replays a request the server already received, so retrying a
        POST or PATCH can double-submit it. RFC 9110 §9.2.2 makes GET, HEAD, PUT,
        DELETE, OPTIONS and TRACE idempotent; everything else is excluded here.
        Same posture as nginx-ingress, which excludes non-idempotent requests
        from `proxy_next_upstream` unless the operator adds `non_idempotent`.

        In the FRONTEND, not per backend: `retry-on` sits in `defaults` and so
        applies to every backend, including the Gateway API ones, which are not
        rendered through the `backend-directives-*` extension point. A
        backend-level guard would leave Gateway routes replaying POSTs.

        `conn-failure` is an L4 retry and is unaffected by `disable-l7-retry`, so
        a failed connect still redispatches for every method.

        extraContext.retryNonIdempotent = true retries every method — only when
        every backend behind this controller is safe to replay.
      #}
      {%- if extraContext | dig("retryNonIdempotent") | fallback(false) %}
      {#- Operator opted in: every method may be replayed. -#}
      {%- else %}
      http-request disable-l7-retry if !METH_GET !METH_HEAD !METH_PUT !METH_DELETE !METH_OPTIONS !METH_TRACE
      {%- end %}

  frontend-filters-100-server-header:
    template: |
      {# Ingress conformance requires a Server header; set it for every backend.
         A preceding snippet may omit its trailing newline. #}
      {{ "\n" }}http-after-response set-header Server haptic

  frontend-filters-090-request-buffering:
    template: |
      {#
        Resource-agnostic request buffering (slow-client / slow-POST defence).

        Holds the request until the body is complete — or the buffer is full, or
        the wait expires — before a backend connection is taken. Without it a
        client that trickles a declared body pins a backend server slot for as
        long as it likes; with it, that client only ever holds HAProxy.

        The gate is `Content-Length present`, and that is the whole gRPC/streaming
        story. A request that streams bidirectionally cannot declare its length
        upfront, so requiring Content-Length excludes every such protocol by
        construction — no Content-Type sniffing, no list of exempt media types to
        keep current. gRPC over HTTP/2 sends neither Content-Length nor
        Transfer-Encoding, for unary AND streaming calls, so it never matches.
        This matters: buffering a bidirectional stream deadlocks it (the client
        waits for a response HAProxy hasn't forwarded yet) until the wait expires
        and the client gets a 408 the backend never saw. See
        docs/site/docs/libraries/base.md#request-buffering.

        Buffering never holds more than `tune.bufsize` — wait-for-body also
        releases on a full buffer — so this is slow-client protection, not an
        upload buffer, and a large upload proceeds as soon as the first bufsize
        bytes land.

        Per-route override comes from request-buffering.map keyed on the resolved
        backend (`on`/`off`); resource libraries populate it via
        map-request-buffering-* snippets. The map's default value carries the
        fleet-wide setting, so one rule covers both directions and flipping a
        single route is a map-only, reload-free change.
      #}
      {%- var rbWait = extraContext | dig_string("10s", "requestBuffering", "waitTimeout") -%}
      {%- if !regex_search(rbWait, "^[0-9]+(us|ms|s|m|h|d)?$") -%}
        {{- fail("Invalid value '" + rbWait + "' for extraContext.requestBuffering.waitTimeout. Expected an HAProxy duration such as '10s', '500ms' or '2m'.") -}}
      {%- end -%}
      {%- var rbDefault = "off" -%}
      {%- if extraContext | dig("requestBuffering", "enabled") | fallback(true) -%}
        {%- rbDefault = "on" -%}
      {%- end -%}
      {%- var rbMap, _ = pathResolver.GetPath("request-buffering.map", "map") %}
      # base/request-buffering (extraContext.requestBuffering, default {{ rbDefault }})
      http-request wait-for-body time {{ rbWait }} if { req.hdr(content-length) -m found } { var(txn.backend_name),map({{ rbMap }},{{ rbDefault }}) -m str on }

  frontend-filters-250-request-body-size:
    template: |
      {%- var bsMap, _ = pathResolver.GetPath("body-size.map", "map") -%}
      {# Resource-agnostic request body-size enforcement. The per-backend limit
         (bytes) is looked up from body-size.map keyed on the resolved backend;
         resource libraries populate that map via map-body-size-* snippets. When a
         backend has no entry the limit resolves to 0 and the deny never fires, so
         this static rule is inert until a map entry exists — which is what makes
         adding or raising a body-size limit a map-only (reload-free) change rather
         than a per-backend `http-request deny` (a backend-section reload). `add(0)`
         forces the map value to a signed integer; `sub(<var>)` then does the
         dynamic comparison the literal `req.body_size gt <N>` form can't express. #}
      {{ "\n" }}http-request set-var(txn.haptic_body_limit) var(txn.backend_name),map({{ bsMap }},0),add(0)
      {# txn.denied_by names the gate that blocked the request in the access log.
          413 is also produced by the WAF and schema-validation body caps, so the
          status code alone can't attribute it. The condition is a byte-for-byte
          copy of the deny's; `deny` ends rule processing, so the first matching
          gate's value is the one that survives. #}
      http-request set-var(txn.denied_by) str(body_too_large) if { var(txn.haptic_body_limit) -m int gt 0 } { req.body_size,sub(txn.haptic_body_limit) -m int gt 0 }
      http-request deny deny_status 413 if { var(txn.haptic_body_limit) -m int gt 0 } { req.body_size,sub(txn.haptic_body_limit) -m int gt 0 }

  frontend-filters-260-request-set-host:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-host.map", "map") -%}
      {# Resource-agnostic upstream Host override, keyed on the resolved backend.
         Relocated from a per-backend `http-request set-header Host`; resource
         libraries populate reqhdr-host.map via map-reqhdr-host-* snippets.
         Inert until a backend has an entry, so changing the Host is map-only.
         Values are URL-encoded by the writers, so url_dec(1) here: the runtime
         map CLI splits a value at the first space and truncates it at a `;`. #}
      {{ "\n" }}http-request set-header Host %[var(txn.backend_name),map({{ m }}),url_dec(1)] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-261-request-set-xfwd-prefix:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-xfwd-prefix.map", "map") -%}
      {# Resource-agnostic X-Forwarded-Prefix override, keyed on the resolved backend. url_dec(1): values are URL-encoded by the writers. #}
      {{ "\n" }}http-request set-header X-Forwarded-Prefix %[var(txn.backend_name),map({{ m }}),url_dec(1)] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-262-request-set-connection:
    template: |
      {%- var m, _ = pathResolver.GetPath("reqhdr-connection.map", "map") -%}
      {# Resource-agnostic Connection header override, keyed on the resolved backend. url_dec(1): values are URL-encoded by the writers. #}
      {{ "\n" }}http-request set-header Connection %[var(txn.backend_name),map({{ m }}),url_dec(1)] if { var(txn.backend_name),map({{ m }}) -m found }

  frontend-filters-400-path-rewrite:
    template: |
      {%- var m, _ = pathResolver.GetPath("path-rewrite.map", "map") -%}
      {# Resource-agnostic full-path rewrite, keyed on the resolved backend. Only
         LITERAL replacements live in the map; capture/regex rewrites stay as
         `http-request replace-path` in the backend (the regex side can't be
         map-driven). Runs after routing (path-based backend selection already
         happened), matching the old in-backend `replace-path (.*) <literal>`.
         url_dec(1): values are URL-encoded by the writers. #}
      {{ "\n" }}http-request set-path %[var(txn.backend_name),map({{ m }}),url_dec(1)] if { var(txn.backend_name),map({{ m }}) -m found }

  features-170-redirect-location-map:
    template: |
      {#
        Builds redirect-loc-<code>.map (host → location URL) per distinct redirect
        code from gf["redirectHosts"]. Resource libraries feed gf["redirectHosts"]
        with {host, location, code} entries in the features phase; the rule is
        emitted by frontend-filters-060-redirect-location. Mirrors the ssl-redirect
        map machinery, but the location is a per-host map VALUE rather than a fixed
        `scheme https`.

        Host-collision policy: first-writer-wins per host — the first redirect
        registered for a host (by feed order: features snippet number, then ingress
        list order) claims it; later redirects for the same host are ignored, so a
        host lands in exactly one code's map. A map is registered for every code
        present (even one whose hosts were all claimed by another code), so the
        rule's per-code map reference always resolves.
      #}
      {%- import "util-host-keyed-map" for HostKeyedMapFile -%}
      {%%
        var gf = shared.Get("globalFeatures")
        var redirectHosts []any = coalesce(gf["redirectHosts"], []any{})
        // Every code present gets a map, including one whose hosts were all
        // claimed by an earlier code — the rule's per-code map reference has
        // to resolve either way. So the codes come from the full list, not
        // from the grouped survivors.
        var codes = redirectHosts |
          map(e => tostring(e | dig("code"))) |
          unique()
        var byCode = redirectHosts |
          reject(e => tostring(e | dig("host")) == "") |
          unique_by("host") |
          group_by("code")
      %%}
      {%- for _, code := range codes -%}
        {{- HostKeyedMapFile(byCode[code], "location", "redirect-loc-" + code + ".map") -}}
      {%- end -%}

  util-haproxy-duration:
    template: |-
      {#
        HAProxyDurationMs parses an HAProxy time value — a bare integer (which
        HAProxy reads as milliseconds) or an integer with a us/ms/s/m/h/d suffix —
        to integer milliseconds as a string, or "" when it is not a valid duration.
        `us` is refused: a sub-millisecond server/tunnel timeout is not meaningful
        and would round to 0 ("no timeout"). This is the render-time validator that
        replaces the `haproxy -c` parse a timeout loses when its value moves out of
        a `timeout server <v>` directive and into backend-timeouts.map.

        Resource-agnostic (RULE #1) — it sees a string.
      #}
      {%- macro HAProxyDurationMs(value string) string -%}
        {%%
          var s = strip(value)
          if s == "" {
            show ""
            return
          }
          var mult = 1
          var num = s
          if hasSuffix(s, "us") {
            show ""
            return
          } else if hasSuffix(s, "ms") {
            num = s[:len(s)-2]
          } else if hasSuffix(s, "s") {
            num = s[:len(s)-1]
            mult = 1000
          } else if hasSuffix(s, "m") {
            num = s[:len(s)-1]
            mult = 60000
          } else if hasSuffix(s, "h") {
            num = s[:len(s)-1]
            mult = 3600000
          } else if hasSuffix(s, "d") {
            num = s[:len(s)-1]
            mult = 86400000
          }
          // Bound the digit count so toint (strconv.Atoi) can't overflow to 0: a
          // value like 99999999999999999999d would otherwise pass the digit check,
          // wrap to 0, and silently DISABLE the timeout ("0" means no timeout)
          // instead of being rejected. 15 digits dwarfs any legitimate timeout.
          if !regex_search(num, "^[0-9]{1,15}$") {
            show ""
            return
          }
          show tostring(toint(num) * mult)
        %%}
      {%- end macro -%}

  util-backend-timeouts:
    template: |-
      {%- import "util-haproxy-duration" for HAProxyDurationMs -%}
      {%- var BackendTimeouts = func(defaults map[string]any, lines []any) map[string]any {
        var result = map[string]any{}
        for key, value := range defaults { result[key] = value }
        var dynamic = map[string]int{}
        var unbounded = false
        for _, inputLine := range lines {
          var fields = []string{}
          for _, field := range split(replace(trimSpace(tostring(inputLine)), "\t", " "), " ") {
            if field != "" { fields = append(fields, field) }
          }
          if len(fields) == 2 && fields[0] == "retries" {
            result["retries"] = toint(fields[1])
          }
          if len(fields) >= 3 && fields[0] == "http-request" && fields[1] == "set-retries" {
            if !regex_search(fields[2], "^[0-9]+$") { unbounded = true } else if toint(fields[2]) > dynamic["retries"] {
              dynamic["retries"] = toint(fields[2])
            }
          }
          if len(fields) >= 4 && fields[0] == "http-request" && fields[1] == "set-timeout" {
            var milliseconds = HAProxyDurationMs(fields[3])
            if milliseconds == "" || toint(milliseconds) == 0 { unbounded = true } else if toint(milliseconds) > dynamic[fields[2]] {
              dynamic[fields[2]] = toint(milliseconds)
            }
          }
          if len(fields) != 3 || fields[0] != "timeout" { continue }
          var key = fields[1]
          if key != "server" && key != "connect" && key != "queue" && key != "tunnel" { continue }
          var milliseconds = HAProxyDurationMs(fields[2])
          if milliseconds != "" {
            result[key] = toint(milliseconds)
            if toint(milliseconds) == 0 { unbounded = true }
          }
        }
        for key, value := range dynamic {
          if value > toint(result[key]) { result[key] = value }
        }
        if unbounded { result["server"] = 0 }
        return result
      } -%}

  util-default-backend-timeouts:
    template: |-
      {%- import "util-backend-timeouts" for BackendTimeouts -%}
      {%- var DefaultBackendTimeouts = func() map[string]any {
        return BackendTimeouts(map[string]any{"server": 0, "connect": 0, "queue": -1, "tunnel": -1, "retries": 3},
          toSlice(split(render "defaults-settings", "\n")))
      } -%}

  util-header-modifier-rules:
    template: |-
      {#
        HeaderModifierRules — one static set/add/del line per distinct header NAME,
        driven by a map keyed `<key>|<op>|<lowercased name>`. Adding a route that
        modifies an already-used header name is then a map entry, not a config line.

        `keyExpr` is the sample expression that yields the key prefix; the macro
        appends `,concat(|<op>|<name>)` to it, so a caller needing more in the key
        ends its own expression with a concat (the Gateway backendRef form does).
        `setNames`/`addNames`/`delNames` carry the spelling to emit, already
        deduplicated by lowercased name — the key always uses the lowercased form,
        because HTTP header names are case-insensitive and two routes spelling one
        header differently must share one line.

        Map values are URL-encoded (`url_dec(1)` here): the runtime CLI splits a
        value at the first space. Encoding also stops the value being re-read as a
        log-format string, so a `%` in it can no longer fetch request state.

        A name lands unquoted in the directive and inside two `concat()` arguments,
        so anything outside the token charset below is dropped here rather than
        emitted — `'` and `"` unbalance HAProxy's tokenizer and take the whole
        configuration down with them. Callers own the operator-facing message:
        reject the name against the same charset and report it, or the tenant
        sees a header silently not applied.

        Resource-agnostic (RULE #1) — it sees an expression and header names.
      #}
      {% macro HeaderModifierRules(direction string, keyExpr string, mapPath string, setNames []string, addNames []string, delNames []string) %}
      {%- var directive = "http-request" %}
      {%- if direction == "response" %}{% directive = "http-after-response" %}{% end %}
      {%- var emittable = func(n string) bool { return regex_search(n, "^[A-Za-z0-9!$&*+.^_~-]+$") } %}
      {%- for _, name := range setNames %}
      {%- if !emittable(name) %}{% continue %}{% end %}
      {%- var k = keyExpr + ",concat(|set|" + toLower(name) + ")" %}
      {{ directive }} set-header {{ name }} %[{{ k }},map({{ mapPath }}),url_dec(1)] if { {{ k }},map({{ mapPath }}) -m found }
      {%- end %}
      {%- for _, name := range addNames %}
      {%- if !emittable(name) %}{% continue %}{% end %}
      {%- var k = keyExpr + ",concat(|add|" + toLower(name) + ")" %}
      {{ directive }} add-header {{ name }} %[{{ k }},map({{ mapPath }}),url_dec(1)] if { {{ k }},map({{ mapPath }}) -m found }
      {%- end %}
      {%- for _, name := range delNames %}
      {%- if !emittable(name) %}{% continue %}{% end %}
      {{ directive }} del-header {{ name }} if { {{ keyExpr }},concat(|del|{{ toLower(name) }}),map({{ mapPath }}) -m found }
      {%- end %}
      {% end macro %}

  # The frontend filter chain, behind one macro on purpose: a render_glob
  # expands into the function table of whatever function contains it, and
  # Scriggo's bytecode caps that table at 256 entries. Expanding the chain
  # directly in each frontend spent most of that budget in the haproxy.cfg
  # top-level function, so the next library to add a snippet was the one that
  # broke the build. Nested here, the chain costs a caller a single entry.
  util-frontend-filter-chain:
    template: |-
      {%- macro FrontendFilterChain() -%}
      {{- render_glob "frontend-filters-*" -}}
      {%- end macro -%}

  util-register-map:
    template: |-
      {#
        RegisterMap — writes a map file and declares whether its entry ORDER is
        load-bearing. Returns the path the configuration references it by.

        `ordered: false` (a map_str / map_beg / map_ip / map_str_int lookup) lets
        the controller add a new entry over the runtime API; the default `true`
        (map_reg / map_sub / map_dom / map_dir / map_end, evaluated as a
        first-match-wins list) makes any insertion rewrite the file and reload.
        Declare it wrong in the unordered direction and a middle insertion is
        appended to the end, where it never matches.

        `lines` is written verbatim, order included — the caller owns the sort,
        because only it knows whether the order is cosmetic (register a map even
        when it has no entries: creating a map file on the first entry and
        deleting it with the last are both reloads).

        Resource-agnostic (RULE #1) — it sees strings, never a kind.
      #}
      {% macro RegisterMap(mapName string, lines []string, opts map[string]any) string %}
      {%%
        var content = ""
        if len(lines) > 0 {
          content = join(lines, "\n") + "\n"
        }
        var path, mapErr = fileRegistry.Register("map", mapName, content)
        if mapErr != nil {
          fail("failed to register " + mapName + ": " + tostring(mapErr))
        }
        var metaErr = planRegistry.MapMeta(mapName, tostring(opts | dig("ordered") | fallback(true)) == "true")
        if metaErr != nil {
          fail("failed to declare " + mapName + " entry order: " + tostring(metaErr))
        }
        show path
      %%}
      {% end macro %}

  util-host-keyed-map:
    template: |-
      {#
        HostKeyedMapFile — writes a `<host> <value>` map file from a gf list of
        {host, <valueKey>} entries.

        First-writer-wins per host, hosts sorted. The sort is not cosmetic: Go
        map order is unstable, and a reordered map file reads as a change to the
        controller, costing a spurious sync/reload. Same rationale as
        features-160-ssl-redirect-map and the ssl.yaml crt-list.

        Values are URL-encoded, so every reader decodes with `url_dec(1)`: the
        runtime CLI splits a map value at the first space and truncates it at a
        `;`, which silently corrupted every HSTS value carrying `includeSubDomains`.

        Resource-agnostic (RULE #1) — it sees a list of maps, never a kind.
      #}
      {%- import "util-register-map" for RegisterMap -%}
      {% macro HostKeyedMapFile(entries []any, valueKey string, mapName string) %}
      {%%
        // sort_by is a separate call here so its error is checked; as a pipe
        // stage the error would be dropped.
        var hosts = entries |
          reject(e => tostring(e | dig("host")) == "") |
          unique_by("host")
        var rows, sortErr = sort_by(hosts, []string{"$.host"})
        if sortErr != nil {
          fail("failed to sort " + mapName + " hosts: " + tostring(sortErr))
        }
        var lines []string
        for _, e := range rows {
          lines = append(lines, tostring(e | dig("host")) + " " + queryEscape(tostring(e | dig(valueKey))))
        }
        var _ = RegisterMap(mapName, lines, map[string]any{"ordered": false})
      %%}
      {% end macro %}

  # The next two declare a publication group so consumers can read it even when
  # no producer library is loaded. The group lives in `incremental:`, so the
  # template has no work to do — but it may not be empty: .template is
  # minLength 1 in the CRD, and "" makes the whole library unstorable.
  features-154-hsts-publication-base:
    requires: [controller_services]
    incremental:
      source: controller_services
      group: hsts-hosts
      effects: [publishValue]
    template: '{# group anchor #}'

  features-109-mtls-publication-base:
    requires: [controller_services]
    incremental:
      source: controller_services
      group: mtls-host-policies
      effects: [publishValue]
    template: '{# group anchor #}'

  features-175-app-root-map:
    template: |
      {#
        Builds app-root.map (host → root-redirect path) from gf["appRootHosts"].
        Resource libraries (haproxy-ingress / nginx app-root) register {host, path}
        entries in the features phase; frontend-filters-065-app-root emits the gated
        rule, so adding/changing an app-root is a map-only, reload-free update.
      #}
      {%- import "util-host-keyed-map" for HostKeyedMapFile -%}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var appRootHosts []any = coalesce(gf["appRootHosts"], []any{}) -%}
      {%- if len(appRootHosts) > 0 -%}
        {{- HostKeyedMapFile(appRootHosts, "path", "app-root.map") -}}
      {%- end -%}

  features-185-mtls-error-map:
    template: |
      {#
        Builds mtls-error.map (host → client-cert-verify error page URL) from
        gf["mtlsErrorHosts"]. Resource libraries (haproxy-ingress / nginx
        auth-tls-error-page) register {host, location} entries in the features phase;
        frontend-filters-075-mtls-error emits the gated rule. The per-vendor
        cert-passthrough set-header directives stay in their own vendor snippets.
      #}
      {%- import "util-host-keyed-map" for HostKeyedMapFile -%}
      {%- var mtlsErrorHosts = incremental_values("mtls-host-policies", "errorHosts") -%}
      {%- if len(mtlsErrorHosts) > 0 -%}
        {{- HostKeyedMapFile(mtlsErrorHosts, "location", "mtls-error.map") -}}
      {%- end -%}

  features-190-hsts-map:
    template: |
      {#
        Builds hsts.map (host → Strict-Transport-Security header value) from
        gf["hstsHosts"]. Resource libraries register {host, value} entries in the
        features phase; frontend-filters-080-hsts emits the single shared
        response-header rule, so changing an HSTS value is a map-only, reload-free
        update.
      #}
      {%- import "util-host-keyed-map" for HostKeyedMapFile -%}
      {%- var hstsHosts = incremental_values("hsts-hosts", "hosts") -%}
      {%- if len(hstsHosts) > 0 -%}
        {{- HostKeyedMapFile(hstsHosts, "value", "hsts.map") -}}
      {%- end -%}

  frontend-filters-060-redirect-location:
    template: |
      {#
        Host-keyed location redirect. Emits one rule per distinct code in
        gf["redirectHosts"]: the `code` must be a literal (HAProxy rejects a map
        expression there), so the location comes from redirect-loc-<code>.map and
        the code is fixed per rule. Runs after ssl-redirect (050) so a scheme-upgrade
        redirect takes precedence for a host that has both. Resource-agnostic:
        references only var(txn.host) + the per-code map.
      #}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var redirectHosts []any = coalesce(gf["redirectHosts"], []any{}) -%}
      {%- var codes = map[string]bool{} -%}
      {%- for _, entry := range redirectHosts -%}
        {%- codes[tostring(entry | dig("code"))] = true -%}
      {%- end -%}
      {#- keys(), not a bare range: Go randomises map iteration, so the rules
          would emit in a different order each render. These are first-match-wins
          redirect rules, and a reordered config is a reload for a config nobody
          changed. -#}
      {%- for _, code := range keys(codes) %}
      {%- var m, _ = pathResolver.GetPath("redirect-loc-" + code + ".map", "map") %}
      # base/redirect-location (code {{ code }})
      http-request redirect location %[var(txn.host),map({{ m }}),url_dec(1)] code {{ code }} if { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-065-app-root:
    template: |
      {#
        Host-keyed app-root redirect: when a registered host is requested at the
        site root, redirect to its configured path (fixed 302). Single shared rule
        driven by app-root.map (built by features-175-app-root-map). Runs before
        path-rewrite so the gate sees the original request path. Resource-agnostic:
        references only var(txn.host), path, and the map.
      #}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var appRootHosts []any = coalesce(gf["appRootHosts"], []any{}) -%}
      {%- if len(appRootHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("app-root.map", "map") %}
      # base/app-root
      http-request redirect location %[var(txn.host),map({{ m }}),url_dec(1)] code 302 if { path / } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-075-mtls-error:
    template: |
      {#
        Host-keyed mTLS error redirect: when client-cert verification failed
        (ssl_c_verify gt 0) for a registered host, redirect to its error page
        (fixed 302). Single shared rule driven by mtls-error.map (built by
        features-185-mtls-error-map). The per-vendor X-SSL-Client-* cert-passthrough
        set-header directives stay in their own vendor snippets. Resource-agnostic.
      #}
      {%- var mtlsErrorHosts = incremental_values("mtls-host-policies", "errorHosts") -%}
      {%- if len(mtlsErrorHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("mtls-error.map", "map") %}
      # base/mtls-error
      http-request redirect location %[var(txn.host),map({{ m }}),url_dec(1)] code 302 if { ssl_c_verify gt 0 } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  frontend-filters-080-hsts:
    template: |
      {#
        HSTS response header(s), gated on a TLS connection (ssl_fc):
          1. A global header on every TLS response when extraContext.hstsEnabled is
             set (value from features-085-ssl-hsts-global's gf["hstsGlobalValue"]).
          2. The host-keyed header driven by hsts.map (built by
             features-190-hsts-map) from per-Ingress annotations. It runs second,
             so a per-host value overrides the global default (set-header replaces).
        var(txn.host) set during request routing is still in scope at response time.
        Resource-agnostic: references only var(txn.host), the map, and the global value.
      #}
      {%- var gf = shared.Get("globalFeatures") -%}
      {%- var hstsHosts = incremental_values("hsts-hosts", "hosts") -%}
      {%- var hstsGlobal = tostring(coalesce(gf["hstsGlobalValue"], "")) -%}
      {%- if hstsGlobal != "" %}
      {%- var redirectHosts []any = coalesce(gf["sslRedirectHosts"], []any{}) -%}
      {%- if len(redirectHosts) == 0 %}
      # WARNING: HSTS is enabled globally but no HTTP→HTTPS redirect is configured.
      #   HSTS is only sent over HTTPS, so plain-HTTP clients get no protection and
      #   no upgrade. Add a redirect (per-Ingress ssl-redirect annotation, or your
      #   platform's global redirect) so clients reach HTTPS.
      {%- end %}
      # base/hsts-global (extraContext.hstsEnabled) — HSTS on every TLS response
      http-after-response set-header Strict-Transport-Security "{{ hstsGlobal }}" if { ssl_fc }
      {%- end %}
      {%- if len(hstsHosts) > 0 %}
      {%- var m, _ = pathResolver.GetPath("hsts.map", "map") %}
      # base/hsts (per-Ingress values; override the global default above)
      http-after-response set-header Strict-Transport-Security %[var(txn.host),map({{ m }}),url_dec(1)] if { ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  # Status frontend directives — override or extend via status-extra-* snippets.
  # The status frontend (port 8404) serves health checks and can expose HAProxy's
  # built-in Prometheus exporter. Snippets are rendered inside the status frontend
  # block after the default health check rules.
  frontend-filters-999-debug:
    template: |
      {%- var debug bool = extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) -%}
      {%- if debug %}
      # HAProxy routing decision introspection
      http-after-response set-header X-HAProxy-Backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
      http-after-response set-header X-HAProxy-Host-Match %[var(txn.host_match)] if { var(txn.host_match) -m found }
      http-after-response set-header X-HAProxy-Path-Match %[var(txn.path_match)] if { var(txn.path_match) -m found }
      http-after-response set-header X-HAProxy-Path-Match-Qualifier %[var(txn.path_match_qualifier)] if { var(txn.path_match_qualifier) -m found }
      http-after-response set-header X-HAProxy-Total-Weight %[var(txn.total_weight)] if { var(txn.total_weight) -m found }
      http-after-response set-header X-HAProxy-Random-Weight %[var(txn.random_weight)] if { var(txn.random_weight) -m found }
      http-after-response set-header X-HAProxy-Route-Key %[var(txn.route_key)] if { var(txn.route_key) -m found }
      {%- end %}

  util-default-backend:
    template: |
      {%- import "util-backend" for Backend -%}
      {%- var contributed = render_glob "default-backend-*" -%}
      {%- if trimSpace(contributed) != "" %}
      {{- contributed }}
      {%- else %}
      {{- Backend(map[string]any{
            "name": "default_backend",
            "guid": "be:default_backend",
            "body": []any{
              "# gRPC-aware fallback: a trailers-only grpc-status 12 (Unimplemented) for",
              "# application/grpc, else a plain 404. content-type is re-added via",
              "# http-after-response (the `return` action strips it). See",
              "# https://haproxy-haptic.org/docs/latest/libraries/base/#grpc-request-handling",
              `http-request return status 200 hdr "grpc-status" "12" hdr "grpc-message" "Unimplemented" if { req.hdr(content-type) -m sub "application/grpc" }`,
              `http-after-response set-header content-type "application/grpc" if { res.hdr(grpc-status) -m found }`,
              "http-request return status 404",
            },
          }) }}
      {%- end %}

  global-top-100-access-log-rings:
    template: |-
      {#
        One `ring` section per access-log target that declares one. A ring is a
        buffered TCP client: records queue in memory when the collector is down
        and flush on reconnect, so a restarting log shipper never touches the
        data plane (measured: 25/25 requests served with the collector stopped,
        all 25 records delivered afterwards). Plain `log <host>:<port>` is UDP
        and drops them instead.

        This renders after the `defaults` section that references the ring, which
        HAProxy accepts — forward references to a ring are resolved post-parse
        (verified on 3.0 and 3.4).
      #}
      {{- render "util-access-log-targets" -}}
      {%- for _, tAny := range shared.Get("accessLogTargets").([]any) %}
        {%- var t = tAny.(map[string]any) %}
        {%- if t["ring"] != nil %}
          {%- var r = t["ring"].(map[string]any) %}
      {{ "\n" }}ring {{ r["name"] }}
          description "haptic access log -> {{ r["address"] }}"
          format {{ t["format"] }}
          maxlen {{ toint(extraContext | dig("accessLog", "maxLineBytes") | fallback(16384)) }}
          size {{ r["size"] }}
          timeout connect {{ r["connectTimeout"] }}
          timeout server {{ r["serverTimeout"] }}
          server {{ r["name"] }} {{ r["address"] }} log-proto {{ r["logProto"] }}{% if r["serverOptions"] != "" %} {{ r["serverOptions"] }}{% end %}
        {%- end %}
      {%- end %}

  global-top-050-peers:
    template: |
      {# Always-on local peers section. Stick-tables opt in by appending #}
      {# `peers localinstance` to their definition (e.g. the haproxytech #}
      {# rate-limit table); HAProxy then replicates their contents from the #}
      {# old worker to the new worker on every reload, so per-source counters #}
      {# survive config churn instead of resetting to zero. The single peer #}
      {# `local` matches `localpeer local` (global-settings-220-localpeer), so #}
      {# HAProxy LISTENS on the socket and resyncs locally; it never connects #}
      {# to other replicas, so tables stay per-pod. The listener is a UNIX #}
      {# socket (not a TCP port) so it can never collide with a frontend or #}
      {# dynamic Gateway listener bind and take the whole proxy down. #}
      peers localinstance
          peer local unix@{{ pathResolver.GetBaseDir() }}/peers.sock

  status-extra-100-prometheus-exporter:
    template: |
      {# The exclusion policy is applied HERE, not by the scraper, so every
          scraper gets it — the chart's PodMonitor and a hand-written job alike.
          A scraper that sends its own query keeps it (`!{ query -m found }`), so
          `/metrics?` returns the unfiltered exposition. Verified on 3.0 and 3.4. #}
      {%- _ = render "util-prometheus-exporter-query" -%}
      {%- var exporterQuery = shared.Get("prometheusExporterQuery").(string) -%}
      {%- if exporterQuery != "" %}
      http-request set-query "{{ exporterQuery }}" if { path /metrics } !{ query -m found }
      {%- end %}
      http-request use-service prometheus-exporter if { path /metrics }

  util-prometheus-exporter-query:
    template: |-
      {#-
        Resolves extraContext.prometheusExporter into the query string HAProxy's
        exporter applies to a scrape that sends none, in shared["prometheusExporterQuery"]:
          excludeMaintServers: bool          -> no-maint
          excludeMetrics.<name>:             -> metrics=-<family>,...
            enabled: bool (required), families: [exact names], requires: dotted
            extraContext path that must be truthy (the family replacing this one
            is actually emitted).
        Re-validated here because a hand-written CR bypasses Helm: HAProxy drops
        an unknown name silently, and set-query takes a log-format string.
      -#}
      {%- var _, _ = shared.ComputeIfAbsent("prometheusExporterQuery", func() any {
        var pe = extraContext | dig("prometheusExporter") | fallback(map[string]any{})
        var params = []string{}
        var noMaintRaw = pe | dig("excludeMaintServers")
        if noMaintRaw != nil {
          var noMaint, isBool = noMaintRaw.(bool)
          if !isBool {
            fail("extraContext.prometheusExporter.excludeMaintServers must be a boolean, got '" + tostring(noMaintRaw) + "'. A quoted 'false' is truthy here and would silently enable HAProxy's ?no-maint filter.")
          }
          if noMaint { params = append(params, "no-maint") }
        }
        var excludes = pe | dig("excludeMetrics") | fallback(map[string]any{})
        var exMap, isMap = excludes.(map[string]any)
        if !isMap {
          fail("extraContext.prometheusExporter.excludeMetrics must be a map of named exclusions, each with `enabled` and `families`.")
        }
        var seen = map[string]bool{}
        var negFams = []any{}
        for _, name := range keys(exMap) {
          var ex, exIsMap = exMap[name].(map[string]any)
          if !exIsMap {
            fail("extraContext.prometheusExporter.excludeMetrics." + name + " must be a map with `enabled` and `families`.")
          }
          for _, field := range keys(ex) {
            if field != "enabled" && field != "families" && field != "requires" {
              fail("extraContext.prometheusExporter.excludeMetrics." + name + " contains unknown field '" + field + "'. Valid fields: enabled, families, requires. HAProxy's exporter filters by exact family name, so a `pattern` has no effect here.")
            }
          }
          var en, hasEnabled = ex["enabled"]
          if !hasEnabled {
            fail("extraContext.prometheusExporter.excludeMetrics." + name + " has no `enabled`. It is required, so that an entry cannot sit inert and silently exclude nothing — set `enabled: false` to keep it and turn it off.")
          }
          var enBool, enIsBool = en.(bool)
          if !enIsBool {
            fail("extraContext.prometheusExporter.excludeMetrics." + name + ".enabled must be a boolean.")
          }
          if !enBool { continue }
          var req = ex | dig_string("", "requires")
          if req != "" {
            if !regex_search(req, "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$") {
              fail("extraContext.prometheusExporter.excludeMetrics." + name + ".requires must be a dotted extraContext path such as `vector.requestMetrics.enabled`, got '" + req + "'.")
            }
            var cur any = extraContext
            for _, seg := range split(req, ".") { cur = dig(cur, seg) }
            if not cur { continue }
          }
          var fams = ex | dig("families") | fallback([]any{}) | toSlice()
          if len(fams) == 0 {
            fail("extraContext.prometheusExporter.excludeMetrics." + name + " is enabled but lists no `families`, so it would sit inert and exclude nothing.")
          }
          for _, f := range fams {
            var fs = tostring(f)
            if !regex_search(fs, "^[a-zA-Z_][a-zA-Z0-9_]*$") {
              fail("extraContext.prometheusExporter.excludeMetrics." + name + ".families entry '" + fs + "' is not a bare metric name, so HAProxy would silently drop it or corrupt the scrape query. Use the exact family name.")
            }
            if seen[fs] { continue }
            seen[fs] = true
            negFams = append(negFams, "-" + fs)
          }
        }
        if len(negFams) > 0 { params = append(params, "metrics=" + join(sort_strings(negFams), ",")) }
        return join(params, "&")
      }) -%}

  global-top:
    template: |
      {# Renders global-top-* snippets (e.g., userlist sections from haproxytech.yaml) #}
      {{- render_glob "global-top-*" -}}

  # A second HTTP bind requiring a PROXY header, for HAProxy behind an L4 load
  # balancer. Its own port, not `accept-proxy` on httpPort: HAProxy has no
  # "PROXY optional" bind, so that would drop every header-less connection.
  # Lands on the mode-tcp frontend, whose loopback send-proxy-v2 then carries
  # the real client into http_frontend.
  http-bind-extra-010-proxy-protocol:
    template: |
      {%- if tostring(extraContext | dig("proxyProtocol", "enabled") | fallback(false)) == "true" %}
      bind *:{{ toint(extraContext | dig("proxyProtocol", "httpPort") | fallback(8081)) }} accept-proxy
      {%- end -%}

# ============================================================================
# Map Files
# ============================================================================
# Map files provide host and path routing tables.
# Resource libraries populate these via map-*-* snippets.

maps:
  host.map:
    ordered: false
    template: |
      # Host to normalized host mapping (strips port, wildcards)
      {{ render_glob "map-host-*" -}}

  host-regex.map:
    template: |
      # Wildcard-host regex fallback: <regex pattern> <normalized host key>, tried
      # after the exact host.map + single-label regsub miss (multi-label hosts under
      # a wildcard listener). See https://haproxy-haptic.org/docs/latest/libraries/base/#frontend-routing-logic
      {{ render_glob "map-hostregex-*" -}}

  host-alias-regex.map:
    template: |
      # Whole-hostname alias regexes: ^(?:<regex>)$ <normalized host key>, tried last.
      # Kept out of host-regex.map, which listener-scoped host-match-* lookups also read.
      {{ render_glob "map-hostaliasregex-*" -}}

  path-exact.map:
    ordered: false
    template: |
      # Exact path matches (use with map() function)
      {{ render_glob "map-path-exact-*" -}}

  path-prefix-exact.map:
    ordered: false
    template: |
      # Prefix boundary matches without trailing slash
      {{ render_glob "map-pfxexact-*" -}}

  path-prefix.map:
    ordered: false
    template: |
      # Prefix matches with trailing slash (use with map_beg())
      {{ render_glob "map-path-prefix-*" -}}

  path-regex.map:
    template: |
      # Regex matches (use with map_reg())
      {{ render_glob "map-path-regex-*" -}}

  weighted-multi-backend.map:
    ordered: false
    template: |
      # Weighted routing: random_weight:route_key → backend_name
      {{ render_glob "map-weighted-backend-*" }}

  body-size.map:
    ordered: false
    template: |
      # Per-backend request body-size limits: backend_name → max bytes. Populated by resource
      # libraries (map-body-size-*); enforced by frontend-filters-250-request-body-size.
      # See https://haproxy-haptic.org/docs/latest/libraries/base/#map-files
      {{ render_glob "map-body-size-*" -}}

  request-buffering.map:
    ordered: false
    template: |
      # Per-backend request-buffering override: backend_name → on|off. Populated by
      # resource libraries (map-request-buffering-*); applied by
      # frontend-filters-090-request-buffering. Backends with no entry inherit the
      # fleet-wide extraContext.requestBuffering.enabled default.
      {{ render_glob "map-request-buffering-*" -}}

  reqhdr-host.map:
    ordered: false
    template: |
      # Per-backend upstream Host override: backend_name → host. Populated by
      # map-reqhdr-host-*; applied by frontend-filters-260-request-set-host.
      {{ render_glob "map-reqhdr-host-*" -}}

  reqhdr-xfwd-prefix.map:
    ordered: false
    template: |
      # Per-backend X-Forwarded-Prefix override: backend_name → prefix. Populated via
      # map-reqhdr-xfwd-prefix-*; applied by frontend-filters-261-request-set-xfwd-prefix.
      {{ render_glob "map-reqhdr-xfwd-prefix-*" -}}

  reqhdr-connection.map:
    ordered: false
    template: |
      # Per-backend Connection header override: backend_name → value. Populated via
      # map-reqhdr-connection-*; applied by frontend-filters-262-request-set-connection.
      {{ render_glob "map-reqhdr-connection-*" -}}

  path-rewrite.map:
    ordered: false
    template: |
      # Per-backend literal full-path rewrite: backend_name → replacement path (capture/regex
      # rewrites stay as http-request replace-path in the backend). Populated via
      # map-path-rewrite-*; applied by frontend-filters-400-path-rewrite.
      {{ render_glob "map-path-rewrite-*" -}}

  backend-timeouts.map:
    ordered: false
    template: |
      # Per-backend settable timeouts: `<backend>|server` / `<backend>|tunnel` → integer ms.
      # Populated by resource libraries (map-backend-timeout-*); read by the two uniform
      # set-timeout lines every ingress backend carries, so editing a timeout annotation is a
      # map-only, reload-free change. The non-settable timeouts (connect/queue/http-request/
      # http-keep-alive/check) stay as per-value backend directives.
      {{ render_glob "map-backend-timeout-*" -}}

  backend-service.map:
    ordered: false
    template: |
      # <backend> -> <namespace>/<service>, read at log time for the `namespace`
      # and `service` access-log fields via var(txn.backend_name). Keeping the
      # namespace/service out of the backend section (they were `set-var` lines)
      # is what lets an ingress/gateway backend be dynamic — its body stays empty.
      # Populated by resource libraries (map-backend-service-*).
      {{ render_glob "map-backend-service-*" -}}

files:
  400.http:
    template: |
      HTTP/1.0 400 Bad Request
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>400 Bad Request</h1>
      <p>Your browser sent a request that this server could not understand.</p>
      </body></html>

  403.http:
    template: |
      HTTP/1.0 403 Forbidden
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>403 Forbidden</h1>
      <p>You don't have permission to access this resource.</p>
      </body></html>

  408.http:
    template: |
      HTTP/1.0 408 Request Time-out
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>408 Request Time-out</h1>
      <p>Your browser didn't send a complete request in time.</p>
      </body></html>

  500.http:
    template: |
      HTTP/1.0 500 Internal Server Error
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>500 Internal Server Error</h1>
      <p>An internal server error occurred.</p>
      </body></html>

  502.http:
    template: |
      HTTP/1.0 502 Bad Gateway
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>502 Bad Gateway</h1>
      <p>The server received an invalid response from an upstream server.</p>
      </body></html>

  503.http:
    template: |
      HTTP/1.0 503 Service Unavailable
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>503 Service Unavailable</h1>
      <p>No server is available to handle this request.</p>
      </body></html>

  504.http:
    template: |
      HTTP/1.0 504 Gateway Time-out
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <html><body><h1>504 Gateway Time-out</h1>
      <p>The server didn't respond in time.</p>
      </body></html>

k8sResources:
  # User-facing HAProxy LoadBalancer Service. Replaces the chart-static
  # templates/haproxy-service.yaml main-Service block so the controller
  # owns the Service end-to-end:
  #
  #   - The set of `spec.ports` is derived from listener state at render
  #     time, not from chart-install-time defaults: the static
  #     http/https/stats triple is augmented with `gw-<port>-<proto>`
  #     entries for every Gateway / admitted ListenerSet listener whose
  #     port is not one of {80, 443, 8404}.
  #   - The resourceapplier injects an OwnerReference at apply time
  #     (controller=true, blockOwnerDeletion=true), so `helm uninstall`
  #     cascade-GCs this Service when the HAProxyTemplateConfig CR
  #     disappears.
  #
  # Service identity (name + namespace) and chart-shaped fields
  # (`type`, `loadBalancerIP`, `loadBalancerClass`,
  # `loadBalancerSourceRanges`, `externalTrafficPolicy`,
  # `internalTrafficPolicy`, `healthCheckNodePort`,
  # `publishNotReadyAddresses`, annotations, labels, selector,
  # per-port `nodePort`) are plumbed in from values.yaml via
  # `extraContext.haproxyService` by `templates/haproxytemplateconfig.yaml`.
  haproxy-service:
    template: |
      {%- var ctrlNs = tostring(extraContext | dig("controllerNamespace") | fallback("")) %}
      {%- var svcName = tostring(extraContext | dig("haproxyServiceName") | fallback("")) %}
      {%- var svc = extraContext | dig("haproxyService") %}
      {%- if ctrlNs == "" || svcName == "" || svc == nil %}{# Service identity not plumbed — chart bug; emit nothing. #}{%- else %}
      {%%
        var svcMap = svc.(map[string]any)
        var svcType = tostring(svcMap | dig("type") | fallback("LoadBalancer"))
        var exposesNodePort = svcType == "NodePort" || svcType == "LoadBalancer"

        // Service ports. The chart's templates/haproxytemplateconfig.yaml
        // builds this list with the http / https / stats defaults
        // (drawn from `haproxy.service.{http,https,stats}` in
        // values.yaml) plus anything the operator added under
        // `haproxy.service.extraPorts`. Non-default Gateway listener
        // ports are appended to the same list below as
        // `gw-<port>-<proto-letter>` entries. Operators consume
        // changes here purely through values.yaml — we don't
        // hardcode anything Service-port-shaped on the Scriggo side.
        var ports = []any{}
        var seenNames = map[string]bool{}
        // Keyed "<port>/<protocol>": a QUIC listener shares its number with the TCP one.
        var seenPorts = map[string]bool{}
        for _, rawPort := range svcMap | dig("ports") | toSlice() {
          var entry = rawPort.(map[string]any)
          var entryName = tostring(entry | dig("name") | fallback(""))
          var entryPort = toint(entry | dig("port") | fallback(0))
          if entryName == "" || entryPort <= 0 {
            continue
          }
          if seenNames[entryName] {
            continue
          }
          seenNames[entryName] = true
          var entryProtocol = tostring(entry | dig("protocol") | fallback("TCP"))
          seenPorts[tostring(entryPort) + "/" + entryProtocol] = true
          var built = map[string]any{
            "name":     entryName,
            "port":     entryPort,
            "protocol": entryProtocol,
          }
          var targetVal = dig(entry, "targetPort")
          if targetVal == nil {
            built["targetPort"] = entryPort
          } else {
            built["targetPort"] = targetVal
          }
          if exposesNodePort {
            var entryNodePort = toint(entry | dig("nodePort") | fallback(0))
            if entryNodePort > 0 {
              built["nodePort"] = entryNodePort
            }
          }
          var appProto = dig(entry, "appProtocol")
          if appProto != nil {
            built["appProtocol"] = tostring(appProto)
          }
          ports = append(ports, built)
        }

        // Dynamic extra ports — extension point for higher-level
        // libraries (gateway, ingress, …) to contribute ports
        // discovered from their own watched resources. Each
        // contributing library populates
        // `shared.extraServicePorts` (a list of {name, port,
        // targetPort, protocol} maps) from its own haproxyConfig
        // render path; base.yaml merges them in here, skipping any
        // port already claimed by the static set so collisions
        // don't surface. shared.Get is used (not gf) because k8sResources
        // templates render in their own context and don't bind gf
        // locally — shared.Get is uniformly available on every
        // render path. Absent value (no contributors) → toSlice
        // returns []any{}, the loop is a no-op, base.yaml stays
        // at Level 0 of the library hierarchy.
        // A holder map, not a list: several libraries contribute, and a
        // library whose resource's CRD is absent must be able to drop out
        // without the others losing their entries.
        var extraPorts = shared.Get("extraServicePorts") | dig("ports") | toSlice()
      %%}
      {%- for _, extraPort := range extraPorts %}
      {%%
        var port = toint(dig(extraPort, "port") | fallback(0))
        var protocol = tostring(dig(extraPort, "protocol") | fallback("TCP"))
        var portKey = tostring(port) + "/" + protocol
        if port <= 0 || seenPorts[portKey] {
          continue
        }
        seenPorts[portKey] = true
        ports = append(ports, map[string]any{
          "name":       tostring(dig(extraPort, "name") | fallback("")),
          "port":       port,
          "targetPort": toint(dig(extraPort, "targetPort") | fallback(port)),
          "protocol":   protocol,
        })
      %%}
      {%- end %}
      {%%
        var labels = svcMap | dig("labels") | fallback(map[string]any{})
        var selector = svcMap | dig("selector") | fallback(map[string]any{})
        var annotations = svcMap | dig("annotations") | fallback(map[string]any{})
        var spec = map[string]any{
          "type":     svcType,
          "selector": selector,
          "ports":    ports,
        }
        // Optional spec fields — only set when non-empty so the rendered
        // YAML stays compact and SSA doesn't track empty-string fields.
        var lbIP = tostring(svcMap | dig("loadBalancerIP") | fallback(""))
        if lbIP != "" {
          spec["loadBalancerIP"] = lbIP
        }
        var lbClass = tostring(svcMap | dig("loadBalancerClass") | fallback(""))
        if lbClass != "" {
          spec["loadBalancerClass"] = lbClass
        }
        var lbRanges = svcMap | dig("loadBalancerSourceRanges") | toSlice()
        if len(lbRanges) > 0 {
          spec["loadBalancerSourceRanges"] = lbRanges
        }
        var extPolicy = tostring(svcMap | dig("externalTrafficPolicy") | fallback(""))
        if extPolicy != "" {
          spec["externalTrafficPolicy"] = extPolicy
        }
        var intPolicy = tostring(svcMap | dig("internalTrafficPolicy") | fallback(""))
        if intPolicy != "" {
          spec["internalTrafficPolicy"] = intPolicy
        }
        var hcNodePort = toint(svcMap | dig("healthCheckNodePort") | fallback(0))
        if hcNodePort > 0 {
          spec["healthCheckNodePort"] = hcNodePort
        }
        var publishNotReady = svcMap | dig("publishNotReadyAddresses") | fallback(false)
        if tostring(publishNotReady) == "true" {
          spec["publishNotReadyAddresses"] = true
        }
        var meta = map[string]any{
          "name":      svcName,
          "namespace": ctrlNs,
          "labels":    labels,
        }
        var annotationsMap = annotations.(map[string]any)
        if len(annotationsMap) > 0 {
          meta["annotations"] = annotationsMap
        }
        var resource = map[string]any{
          "apiVersion": "v1",
          "kind":       "Service",
          "metadata":   meta,
          "spec":       spec,
        }
        var rendered, _ = marshalYAML(resource)
      %%}
      {{ rendered }}
      {%- end %}

haproxyConfig:
  template: |
    {%- import "util-backend" for Backend -%}
    {%- import "util-frontend-filter-chain" for FrontendFilterChain -%}
    global
        {{ render "global-settings" | indent(2, true) }}

    {# haptic-base: the rule-free parent every backend profile inherits from (`defaults haptic-be-<hash> from haptic-base`). Carries defaults-settings; keep it rule-free (a defaults with http-request/tcp-request rules can't be inherited). Go name: rendercontext.baseProfileName — keep the two in step. #}
    defaults haptic-base
        {{ render "defaults-settings" | indent(2, true) }}
    {{ planRegistry.ProfileGroup() }}
    {# haptic-implicit: the trailing, never-referenced defaults every proxy without an explicit `from` inherits. After the profiles so nothing inherits a named profile another proxy references with `from` (the warning `haproxy -c` raises otherwise, spike (c)). #}
    defaults haptic-implicit from haptic-base
    {#- Phase 1: Feature Registration (side effects only, output discarded) -#}
    {#- Initialize SSL features first (if SSL library is loaded) -#}
    {%- _ = render_glob "features-ssl-initialization" -%}
    {#- Let resource libraries scan resources and register infrastructure needs -#}
    {%- _ = render_glob "features-*" -%}
    {#- Phase 1.5: Status Patch Registration (side effects only, output discarded) -#}
    {%- _ = render_glob "status-patches-*" -%}
    {#- Include global top-level snippets (e.g., userlist sections) -#}
    {%- var globalTop = render "global-top" | strip() -%}
    {%- if globalTop != "" %}

    {{ globalTop }}
    {%- end %}

    frontend status
        guid fe:status
        mode http
        bind *:8404
        # Keep health probes quiet without removing the inherited log target:
        # `no log` plus the inherited HTTP log format makes haproxy -c warn.
        option dontlog-normal{{ render "util-http-frontend-settings" }}
        http-request return status 200 content-type text/plain string "OK" if { path /healthz }
        http-request return status 200 content-type text/plain string "READY" if { path /ready }
        {# Extension point for status frontend directives (e.g., Prometheus exporter) #}
        {{- render_glob "status-extra-*" | indent(2, true) }}

    {#- HTTP routing still needs validation when no plaintext listener exists. -#}
    {%- var gf = shared.Get("globalFeatures") -%}
    {%- if gf != nil && tostring(gf.(map[string]any) | dig("needHTTPFrontend")) == "true" %}
    {%- var httpExtraBinds = render_glob "http-bind-extra-*" %}
    {#- Keep invalid non-comment extension output visible to HAProxy validation. -#}
    {%- if tostring(gf.(map[string]any) | dig("bindHTTPDefault")) == "true" || regex_search(httpExtraBinds, "(?m)^[\\t ]*[^\\t #\\r\\n]") %}

    {# ─────────────────────────────────────────────────────────────────
       HTTP listener architecture: tcp inspector + dual loopback frontends.

       To multiplex HTTP/1.1 and HTTP/2 cleartext (h2c) on the same plain
       port, we mirror the chart's existing ssl-tcp → ssl-loopback → https
       chain (libraries/ssl.yaml ~lines 367-536). HAProxy 3.x can't
       multiplex h2c with HTTP/1.1 on a single bind: `proto h2` locks the
       bind H2-only, no `Upgrade: h2c` parser, ALPN works only inside TLS.
       So we inspect the first 24 bytes at a `mode tcp` outer frontend
       (the HTTP/2 prior-knowledge preface
       `PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n` — what gRPC-Go's insecure dial
       sends, and what the upstream Gateway-API GRPCRoute conformance
       suite exercises) and route to one of two unix-socket-bound inner
       frontends in `mode http`. PROXY-protocol v2 across the hop
       preserves the original client IP. The two inner frontends share
       the same routing logic via the same render_glob extension points,
       so any chart snippet that emits HTTP-level directives lands in
       both protocols' paths.

       The cost is ~10µs/request for a unix-socket roundtrip, which is
       invisible against typical backend latency. Plain HTTP carries
       little real-world edge traffic post-HSTS, so this trade-off is
       cheap; the upside is full Gateway-API conformance for GRPCRoutes
       attached to plaintext HTTP listeners.
    -#}

    frontend http-tcp
        guid fe:http-tcp
        mode tcp
        # Override the HTTP log format inherited from defaults. Without this,
        # HAProxy falls back implicitly and warns on every config check.
        #
        # dontlog-normal: this frontend is the internal h2c demultiplexer — every
        # connection it accepts is handed to http_frontend or http_frontend_h2c,
        # which logs the request itself. Logging the normal case here would
        # duplicate every request with a second, near-information-free record.
        # Abnormal terminations (h2c-preface stalls, client aborts before the
        # loopback hop) still log, and they are the only lines anyone reads here.
        option dontlog-normal{{ render "util-log-format-tcp" }}
        {%- if tostring(gf.(map[string]any) | dig("bindHTTPDefault")) == "true" %}
        bind *:{{ extraContext | dig("httpPort") | fallback(8080) }}
        {%- end %}
        {# Extension point for additional bind directives (Gateway HTTP listener ports). #}
        {# Lands on the OUTER tcp frontend so every HTTP port — chart-static and #}
        {# Gateway-derived — goes through the same h2c-detection inspector. #}
        {{- httpExtraBinds | indent(2, true) }}

        # Wait for the first wire bytes so the h2c-preface ACL can classify the
        # connection (safety net for slow initial sends; fast clients aren't delayed).
        tcp-request inspect-delay 1s

        # Detect the h2c prior-knowledge preface (PRI * HTTP/2.0..SM.., 24 bytes; hex
        # below) — the only h2c signal available in mode tcp. See
        # https://haproxy-haptic.org/docs/latest/libraries/base/#h2c-cleartext-detection
        acl is_h2c req.payload(0,24) -m bin 505249202a20485454502f322e300d0a0d0a534d0d0a0d0a

        # Decide as soon as 24 bytes are in; WAIT_END covers shorter HTTP/1.1 sends.
        tcp-request content accept if { req.len ge 24 }
        tcp-request content accept if WAIT_END

        use_backend http-h2c-loopback if is_h2c
        default_backend http-h1-loopback

    {{ Backend(map[string]any{
         "name": "http-h1-loopback",
         "guid": "be:http-h1-loopback",
         "mode": "tcp",
         "shape": "structural",
         "body": []any{"# send-proxy-v2 preserves the original client IP/port across the unix-socket hop."},
         "servers": []any{map[string]any{"name": "loopback", "address": "unix@/etc/haproxy/http-h1-frontend.sock",
           "extra": []any{map[string]any{"name": "send-proxy-v2"}}}},
       }) }}
    {{ Backend(map[string]any{
         "name": "http-h2c-loopback",
         "guid": "be:http-h2c-loopback",
         "mode": "tcp",
         "shape": "structural",
         "servers": []any{map[string]any{"name": "loopback", "address": "unix@/etc/haproxy/http-h2c-frontend.sock",
           "extra": []any{map[string]any{"name": "send-proxy-v2"}}}},
       }) }}

    {%- end %}
    frontend http_frontend
        guid fe:http_frontend
        mode http
        # accept-proxy reads the PROXY v2 header from http-h1-loopback's send-proxy-v2,
        # so `src` and logging see the original client.
        bind unix@/etc/haproxy/http-h1-frontend.sock mode 660 accept-proxy{{ render "util-http-frontend-settings" }}
        {# Extension point for early frontend directives (options, captures, ACLs) #}
        {# Runs BEFORE routing logic; use frontend-filters-* for post-routing manipulation #}
        {{- render_glob "frontend-extra-*" | indent(2, true) }}

        {# Include frontend routing logic (can be overridden by libraries) #}
        {{ render "frontend-routing-logic" | indent(2, true) }}
        {# Extension point for frontend request/response filters #}
        {# Runs AFTER routing decisions, BEFORE backend selection #}
        {# Libraries can inject filter logic here (header modification, redirects, rewrites) #}
        {{- FrontendFilterChain() | indent(2, true) }}
        {{- render_glob "frontend-switching-*" | indent(2, true) }}
        use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
        default_backend default_backend

    frontend http_frontend_h2c
        guid fe:http_frontend_h2c
        mode http
        # `proto h2` locks this bind to HTTP/2 cleartext — required because
        # HAProxy can't auto-detect h2c on plaintext binds. The outer tcp
        # inspector has already classified the connection by preface, so
        # only h2c traffic reaches this socket.
        bind unix@/etc/haproxy/http-h2c-frontend.sock mode 660 accept-proxy proto h2{{ render "util-http-frontend-settings" }}
        {# Same render_glob extension points as the h1 sibling — every #}
        {# routing/filter snippet lands in both protocols' frontends so #}
        {# behaviour stays in lockstep regardless of which protocol the #}
        {# client uses. #}
        {{- render_glob "frontend-extra-*" | indent(2, true) }}
        {{ render "frontend-routing-logic" | indent(2, true) }}
        {{- FrontendFilterChain() | indent(2, true) }}
        {{- render_glob "frontend-switching-*" | indent(2, true) }}
        use_backend %[var(txn.backend_name)] if { var(txn.backend_name) -m found }
        default_backend default_backend
    {%- end %}

    {# Extension point for additional frontends (e.g., custom TCP services) #}
    {# Resource libraries can inject frontends-* snippets #}
    {{- render_glob "frontends-*" -}}

    {# Include all resource-specific backend definitions using plugin pattern #}
    {# Resource libraries implement backends-* snippets (e.g., backends-ingress, backends-gateway) #}
    {{- render_glob "backends-*" }}

    {{ render "util-default-backend" | indent(0, true) }}
    {# Trailing newline preserved #}

  # Post-processing: normalize indentation to 2 spaces
  postProcessing:
    - type: regex_replace
      params: {pattern: "^[ ]+", replace: "  "}
    # Collapse runs of blank / whitespace-only lines (left behind by empty
    # extension-point snippets and render_glob boundaries) into a single blank
    # line. HAProxy ignores blank lines, so this is purely for readability.
    - type: template
      params:
        source: |-
          {{- regexp("\\n([ \\t]*\\n)+").ReplaceAll(input, "\n\n") -}}

validationTests:
  test-graceful-reload-defaults:
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: drain, namespace: default}
          spec:
            ingressClassName: haptic
            rules:
              - host: drain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'hard-stop-after 60s'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend http_frontend\n(?:[ \t]+[^\n]*\n|\n)*?[ \t]+option idle-close-on-response$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^(?:defaults[^\n]*|frontend http-tcp)\n(?:[ \t]+[^\n]*\n|\n)*?[ \t]+option idle-close-on-response$'}

  test-graceful-reload-custom-bound:
    fixtures: {}
    extraContext: {hardStopAfter: 5m}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'hard-stop-after 5m'}

  test-graceful-reload-unbounded:
    fixtures: {}
    extraContext: {hardStopAfter: ""}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'hard-stop-after'}


  test-defaults-timeout-overrides:
    fixtures: {}
    extraContext: {timeoutConnect: "5000", timeoutClient: "60000", timeoutServer: "70000", timeoutHttpRequest: "10s", timeoutHttpKeepAlive: "2s"}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'timeout connect 5000\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'timeout client 60000\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'timeout server 70000\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'timeout http-request 10s\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'timeout http-keep-alive 2s\n'}

  test-retry-on-covers-pod-termination-reset:
    description: "A terminating pod accepts the connection then RSTs, which HAProxy reports as 502 SH-- with retries 0. The default retry-on conn-failure does not match it; empty-response does."
    fixtures: {}
    assertions:
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^  retry-on conn-failure empty-response response-timeout$"
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  option redispatch$"}

  test-retry-on-idempotent-methods-only:
    description: "An L7 retry replays the request, so POST and PATCH are excluded by default — matching nginx-ingress, which needs an explicit non_idempotent to retry them. conn-failure is L4 and stays enabled for every method."
    fixtures:
      # Trigger the http_frontend: frontend-filters-* only render inside it, and
      # the frontend is gated on a resource library declaring a listener.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: retry-trigger, namespace: default }
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: echo, port: { number: 80 } }}
    assertions:
      - type: contains
        target: haproxy.cfg
        pattern: "http-request disable-l7-retry if !METH_GET !METH_HEAD !METH_PUT !METH_DELETE !METH_OPTIONS !METH_TRACE"

  test-retry-on-non-idempotent-opt-in:
    description: "extraContext.retryNonIdempotent drops the idempotency guard so every method may be replayed."
    extraContext: {retryNonIdempotent: true}
    fixtures:
      # Trigger the http_frontend: frontend-filters-* only render inside it, and
      # the frontend is gated on a resource library declaring a listener.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: retry-trigger, namespace: default }
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: echo, port: { number: 80 } }}
    assertions:
      - {type: not_contains, target: haproxy.cfg, pattern: "disable-l7-retry"}
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^  retry-on conn-failure empty-response response-timeout$"

  test-retry-on-override:
    description: "extraContext.retryOn replaces the retry-on condition list."
    extraContext: {retryOn: "conn-failure"}
    fixtures: {}
    assertions:
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  retry-on conn-failure$"}

  test-k8s-haproxy-service-default-ports:
    description: "k8sResources.haproxy-service emits whatever ports the chart hands it under `extraContext.haproxyService.ports`. The chart's default builds an http / https / stats triple from `haproxy.service."
    fixtures: {}
    assertions:
      - {type: contains, target: "k8s:haproxy-service", pattern: "kind: Service"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: http\n"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: https\n"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: stats"}
      # HTTP/3 (default on) shares the HTTPS port number and nodePort over UDP.
      - {type: contains, target: "k8s:haproxy-service", pattern: '- name: https-quic\s+nodePort: 30443\s+port: 443\s+protocol: UDP\s+targetPort: https-quic'}

  test-k8s-haproxy-service-extra-ports:
    description: Operators using haptic without Gateway API (e.g. exposing a raw TCP frontend via a custom haproxyConfig snippet) declare additional Service ports through `haproxy.service.extraPorts` in values.yaml.
    fixtures: {}
    extraContext:
      haproxyService:
        type: ClusterIP
        labels:
          app.kubernetes.io/component: loadbalancer
        selector:
          app.kubernetes.io/component: loadbalancer
        annotations: {}
        loadBalancerIP: ""
        loadBalancerClass: ""
        loadBalancerSourceRanges: []
        externalTrafficPolicy: ""
        internalTrafficPolicy: ""
        healthCheckNodePort: 0
        publishNotReadyAddresses: false
        ports:
          - {name: http, port: 80, targetPort: http, protocol: TCP}
          - {name: https, port: 443, targetPort: https, protocol: TCP}
          - {name: stats, port: 8404, targetPort: stats, protocol: TCP}
          - {name: postgres, port: 5432, targetPort: 5432, protocol: TCP}
    assertions:
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: postgres"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "port: 5432"}
      - {type: contains, target: "k8s:haproxy-service", pattern: "name: http\n"}

  test-address-discovery:
    description: Address discovery reads LoadBalancer status from controller service
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
                - hostname: "lb.example.com"
    assertions:
      - type: haproxy_valid

  test-address-discovery-multiple-services:
    description: Address discovery aggregates addresses from multiple LoadBalancer services
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-public
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "203.0.113.10"
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-internal
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
          status:
            loadBalancer:
              ingress:
                - ip: "192.168.1.50"
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy-pending
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
          status: {loadBalancer: {}}
    assertions:
      - type: haproxy_valid

  test-status-frontend-prometheus-exporter:
    description: >-
      Status frontend exposes the Prometheus exporter on /metrics from any address
      and applies the exclusion policy as the default scrape query: no-maint,
      the enabled families sorted and de-duplicated, an entry whose `requires`
      path is off left out.
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMaintServers: true
        excludeMetrics:
          __replace__: true
          maxima: {enabled: true, families: [haproxy_server_max_sessions, haproxy_backend_max_sessions, haproxy_server_max_sessions]}
          off: {enabled: false, families: [haproxy_backend_status]}
          gated: {enabled: true, requires: vector.requestMetrics.enabled, families: [haproxy_backend_http_requests_total]}
      vector: {requestMetrics: {enabled: false}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        # (?m) so `$` anchors to end-of-LINE; without it Go's `$` means end of the
        # whole config and the assertion can never match.
        pattern: '(?m)^  http-request set-query "no-maint&metrics=-haproxy_backend_max_sessions,-haproxy_server_max_sessions" if \{ path /metrics \} !\{ query -m found \}$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request use-service prometheus-exporter if \{ path /metrics \}$'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request use-service prometheus-exporter if .*dst 127\.0\.0\.0/8.*$'
        description: The exporter answers on the pod IP; Prometheus scrapes it directly

  test-status-frontend-prometheus-exporter-requires-on:
    description: An exclusion whose `requires` extraContext path is truthy joins the default query
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMaintServers: false
        excludeMetrics:
          __replace__: true
          gated: {enabled: true, requires: vector.requestMetrics.enabled, families: [haproxy_backend_http_requests_total]}
      vector: {requestMetrics: {enabled: true}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request set-query "metrics=-haproxy_backend_http_requests_total" if \{ path /metrics \} !\{ query -m found \}$'

  test-status-frontend-prometheus-exporter-no-policy:
    description: With every exclusion off there is no default query — the exporter answers unfiltered
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMaintServers: false
        excludeMetrics: {__replace__: true}
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request set-query '
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request use-service prometheus-exporter if \{ path /metrics \}$'

  test-status-frontend-prometheus-exporter-rejects-bad-family:
    description: A family that is not a bare metric name would corrupt the scrape query, so the render refuses it
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMetrics:
          __replace__: true
          bad: {enabled: true, families: ["haproxy_x,-haproxy_y"]}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'excludeMetrics\.bad\.families entry .haproxy_x,-haproxy_y. is not a bare metric name'

  test-status-frontend-prometheus-exporter-rejects-empty-families:
    description: An enabled exclusion with no families would sit inert, so it is refused
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMetrics:
          __replace__: true
          inert: {enabled: true}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'excludeMetrics\.inert is enabled but lists no `families`'

  test-status-frontend-prometheus-exporter-rejects-pattern:
    description: A regex `pattern` carried over from vector.excludeMetrics has no effect in HAProxy's exporter, so it is refused
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMetrics:
          __replace__: true
          legacy: {enabled: true, pattern: '^haproxy_(server|backend)_max_', families: [haproxy_server_max_sessions]}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "excludeMetrics\\.legacy contains unknown field 'pattern'"

  test-status-frontend-prometheus-exporter-rejects-missing-enabled:
    description: An exclusion without `enabled` would sit inert, so it is refused rather than ignored
    fixtures: {}
    extraContext:
      prometheusExporter:
        excludeMetrics:
          __replace__: true
          inert: {families: [haproxy_backend_status]}
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'excludeMetrics\.inert has no `enabled`'

  test-backend-profiles-dedup-and-order:
    description: >-
      Backends of the same shape share one content-addressed profile
      (defaults haptic-be-<hash>); the profiles sit between haptic-base and the
      trailing, never-referenced haptic-implicit; tune.defaults.purge is never
      emitted (it would make named defaults un-inheritable by add backend).
    fixtures:
      services:
        - {apiVersion: v1, kind: Service, metadata: {name: svc-a, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
        - {apiVersion: v1, kind: Service, metadata: {name: svc-b, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
      ingresses:
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: prof-a, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: a.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: svc-a, port: {number: 80}}}}]}}]}}
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: prof-b, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: b.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: svc-b, port: {number: 80}}}}]}}]}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'tune\.defaults\.purge'}
      # Two plain ingress backends of the same shape are dynamic (from a profile)
      # and share ONE profile section: the ingress profile carries default-server
      # and the two uniform set-timeout lines, and appears exactly once.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend default_prof-a_svc_svc-a_80 from haptic-be-\w+$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend default_prof-b_svc_svc-b_80 from haptic-be-\w+$'}
      - {type: match_count, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$\n\s+default-server check\n\s+http-request set-timeout server ', expected: "1"}
      # Profiles sit between haptic-base and the trailing haptic-implicit.
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-base$.*?^defaults haptic-be-\w+ from haptic-base$.*?^defaults haptic-implicit from haptic-base$'}

  test-ingress-profile-budget:
    description: >-
      Profile budget: four plain ingress backends (four Services) are all the
      same shape, so they share ONE ingress profile — a per-route value sneaking
      into a profile would show up as extra profile sections.
    fixtures:
      services:
        - {apiVersion: v1, kind: Service, metadata: {name: b1, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
        - {apiVersion: v1, kind: Service, metadata: {name: b2, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
        - {apiVersion: v1, kind: Service, metadata: {name: b3, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
        - {apiVersion: v1, kind: Service, metadata: {name: b4, namespace: default}, spec: {ports: [{port: 80, targetPort: 8080}]}}
      ingresses:
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: pb1, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: b1.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: b1, port: {number: 80}}}}]}}]}}
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: pb2, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: b2.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: b2, port: {number: 80}}}}]}}]}}
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: pb3, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: b3.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: b3, port: {number: 80}}}}]}}]}}
        - {apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: {name: pb4, namespace: default}, spec: {ingressClassName: haproxy, rules: [{host: b4.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: b4, port: {number: 80}}}}]}}]}}
    assertions:
      - type: haproxy_valid
      # Four dynamic backends…
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^backend default_pb[1-4]_svc_b[1-4]_80 from haptic-be-\w+$', expected: "4"}
      # …one shared ingress profile.
      - {type: match_count, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$\n\s+default-server check\n\s+http-request set-timeout server ', expected: "1"}

  test-render-plan-no-route-backends:
    description: >-
      With no routing resource the config still carries base's own registered
      backend, and no placeholder line survives assembly.
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "@haptic:"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend default_backend from haptic-be-\w+$.*?^\s+guid be:default_backend$'

  test-guid-directives:
    description: GUIDs are present on frontends, backends, and default_backend
    fixtures:
      # Trigger the http_frontend by declaring an Ingress. After the
      # bind-derivation refactor (chart-static http_frontend is gated
      # on actual listener state), an empty fixture wouldn't render
      # the http_frontend at all.
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: trigger-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "guid fe:status"}
      - {type: contains, target: haproxy.cfg, pattern: "guid fe:http_frontend"}
      - {type: contains, target: haproxy.cfg, pattern: "guid be:default_backend"}
      - {type: not_contains, target: haproxy.cfg, pattern: "@haptic:"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend http-h1-loopback from haptic-be-\w+$.*?^\s+server loopback unix@/etc/haproxy/http-h1-frontend\.sock send-proxy-v2$'
        description: The loopback backends are registered sections, spliced back where the token stood; `mode tcp` moves to the profile.
      - {type: not_contains, target: haproxy.cfg, pattern: "tune\\.ssl\\.default-dh-param"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend status$.*?^\s+mode http$.*?^\s+option dontlog-normal$'
      - {type: not_contains, target: haproxy.cfg, pattern: '(?ms)^frontend status$.*?^\s+no log$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http-tcp$.*?^\s+mode tcp$.*?^\s+option dontlog-normal$.*?^\s+log-format "%\{\+json\}o '
        description: >-
          The TCP demux frontend overrides the inherited HTTP format with the
          TCP-safe JSON one and suppresses its normal lines (the inner HTTP
          frontend logs the request).
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend\n(?:[ \t][^\n]*\n|\n)*?[ \t]+http-request set-header X-Forwarded-Proto %\[ssl_fc,iif\(https,http\)\]\n[ \t]+http-request del-header X-Forwarded-Host\n[ \t]+http-request del-header X-Forwarded-Port\n[ \t]+http-request del-header X-Forwarded-For\n'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend_h2c\n(?:[ \t][^\n]*\n|\n)*?[ \t]+http-request del-header X-Forwarded-For\n(?:[ \t][^\n]*\n|\n)*?[ \t]+http-request add-header X-Forwarded-For %\[src\]\n'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend(_h2c)?\n(?:[ \t][^\n]*\n|\n)*?[ \t]+option forwardfor'
      - type: match_order
        target: haproxy.cfg
        patterns:
          - '(?m)^frontend http_frontend$'
          - 'http-request del-header X-Forwarded-For\n'
          - 'http-request disable-l7-retry'
          - 'http-request add-header X-Forwarded-For %\[src\]\n'
          - 'use_backend %\[var\(txn\.backend_name\)\]'
      - {type: not_contains, target: haproxy.cfg, pattern: 'haptic_trusted_proxy'}

  test-forwarded-headers-trusted-proxies:
    description: >-
      A source in extraContext.forwardedHeaders.trustedProxies keeps its
      X-Forwarded-* headers and gets the client address appended; any other
      source gets the default.
    extraContext:
      forwardedHeaders:
        trustedProxies: ["2001:db8::/32", " 10.0.0.0/8 ", "192.0.2.10"]
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: xfwd, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: xfwd.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: xfwd-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: equals
        target: map:forwarded-trusted-proxies.map
        expected: "2001:db8::/32 1\n10.0.0.0/8 1\n192.0.2.10 1\n"
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend http_frontend\n(?:[ \t][^\n]*\n|\n)*?[ \t]+acl haptic_trusted_proxy src,map_ip\(\S*/forwarded-trusted-proxies\.map\) -m found\n[ \t]+http-request set-header X-Forwarded-Proto %\[ssl_fc,iif\(https,http\)\] unless haptic_trusted_proxy \{ req\.hdr\(X-Forwarded-Proto\) -m found \}\n[ \t]+http-request del-header X-Forwarded-Host unless haptic_trusted_proxy\n[ \t]+http-request del-header X-Forwarded-Port unless haptic_trusted_proxy\n[ \t]+http-request del-header X-Forwarded-For unless haptic_trusted_proxy\n'

  test-forwarded-headers-trusted-proxies-rejects-bad-entry:
    description: A trusted-proxy entry that is not an address could inject configuration, so the render refuses it
    fixtures: {}
    extraContext:
      forwardedHeaders:
        trustedProxies: ["10.0.0.0/8 -m found } || { always_true"]
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'trustedProxies entry .10\.0\.0\.0/8 -m found \} \|\| \{ always_true. is not an IP address or CIDR'

  test-forwarded-headers-trusted-proxies-rejects-scalar:
    description: A single CIDR string instead of a list is refused rather than read as one
    fixtures: {}
    extraContext:
      forwardedHeaders:
        trustedProxies: "10.0.0.0/8"
    assertions:
      - type: contains
        target: rendering_error
        pattern: 'trustedProxies must be a list of CIDRs'

  test-shm-stats-max-objects:
    description: shm-stats-file-max-objects uses configurable fixed value
    minHAProxyVersion: "3.3"
    extraContext: {shmStatsEnabled: true, haproxyVersion: "3.3.0"}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "shm-stats-file /dev/shm/haproxy-stats"}
      - {type: contains, target: haproxy.cfg, pattern: "shm-stats-file-max-objects 50000"}

  test-global-cli-limits-declared:
    description: The runtime CLI's batch ceiling is declared, not inferred — the controller reads these numbers to size its batches, and an over-large batch lands zero entries on the worker.
    minHAProxyVersion: "3.4"
    extraContext: {haproxyVersion: "3.4.0"}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tune\.bufsize 16384$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tune\.cli\.max-payload-size 131072$'}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^\s+tune\.bufsize ', expected: "1"}

  test-global-cli-payload-size-absent-below-3-4:
    description: tune.cli.max-payload-size does not exist below HAProxy 3.4 — emitting it there makes every worker refuse to start, so the version gate is pinned from both sides.
    extraContext: {haproxyVersion: "3.0.0"}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tune\.bufsize 16384$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'tune\.cli\.max-payload-size'}

  test-global-body-inspection-buffer-wins:
    description: Body inspection needs the buffer to hold a whole request body, so the larger knob wins — and one snippet emits the directive, or the effective value would depend on band order.
    extraContext:
      requestBodyInspection: {haproxyBuffer: {sizeBytes: 262144}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tune\.bufsize 262144$'}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^\s+tune\.bufsize ', expected: "1"}

  test-global-worker-runtime-socket:
    description: The rendered global carries the agent's worker runtime socket
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+stats socket \S+/haproxy-worker\.sock mode 600 level admin$'
        description: >-
          The base dir is the operator's dataplane.mapsDir parent, and offline
          validation swaps it for a sandbox, so only the tail is fixed.

  # ==========================================================================
  # Access log (structured JSON)
  # ==========================================================================

  test-tracing-off-by-default-adopts-only:
    description: >-
      With tracing off an inbound trace id is adopted for log correlation, but
      nothing is minted and no traceparent is written upstream
    fixtures: {}
    extraContext: {tracing: {enabled: false}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.trace_id\) req\.hdr\(traceparent\),field\(2,-\) if \{ req\.hdr\(traceparent\) -m reg '
        description: Correlation-only extraction, exactly as it shipped before tracing existed
      - type: not_contains
        target: haproxy.cfg
        pattern: 'set-header traceparent'
        description: >-
          Nothing is propagated by default. A traceparent HAPTIC invents but never
          exports makes every downstream span a child of a parent the backend has
          never seen
      - type: not_contains
        target: haproxy.cfg
        pattern: '%\(span_id\)'
        description: The span fields are absent, not empty, when nothing mints them

  test-tracing-route-key-marks-prefix-matches:
    _helm_skip_test: '{{ if not (dig "tracing" "enabled" false (.Values.controller.config.templatingSettings.extraContext | default dict)) }}true{{ end }}'
    description: http.route is the matched map key, with prefix matches marked
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: rt }
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
                    - path: /exact
                      pathType: Exact
                      backend: { service: { name: echo, port: { number: 80 } } }
    extraContext: {tracing: {enabled: true}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'map_beg_key\([^)]*path-prefix\.map\),concat\(\*\)'
        description: A prefix match is marked, so /api reads as /api/* rather than as an exact route
      - type: contains
        target: haproxy.cfg
        pattern: 'map_str_key\([^)]*path-prefix-exact\.map\),concat\(/\*\)'
        description: >-
          The boundary half of the same prefix rule gets the slash the prefix key
          already carries, so both halves of one rule render one route
      - type: not_contains
        target: haproxy.cfg
        pattern: 'map_str_key\([^)]*path-exact\.map\),concat'
        description: An exact route is never marked as a prefix
      - type: not_contains
        target: haproxy.cfg
        pattern: 'regsub\(\^\[\^/\]\*,\)'
        description: >-
          The host stays in the captured key — the span name uses it and the
          vector transform strips it back off for the http.route attribute

  test-tracing-enabled-mints-and-propagates:
    _helm_skip_test: '{{ if not (dig "tracing" "enabled" false (.Values.controller.config.templatingSettings.extraContext | default dict)) }}true{{ end }}'
    description: tracing.enabled mints W3C-valid ids, honours an inbound parent, and propagates
    fixtures: {}
    extraContext: {tracing: {enabled: true}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'acl haptic_has_traceparent req\.hdr\(traceparent\) -m reg \^\[0-9a-f\]\{2\}-\[0-9a-f\]\{32\}-\[0-9a-f\]\{16\}-\[0-9a-f\]\{2\}\$'
        description: The full grammar is pinned, so a junk header cannot be adopted
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.parent_span_id\) req\.hdr\(traceparent\),field\(3,-\) if haptic_has_traceparent'
        description: An inbound span becomes OUR parent — the child case, not just the root case
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-header traceparent 00-%\[var\(txn\.trace_id\)\]-%\[var\(txn\.upstream_span_id\)\]-%\[var\(txn\.trace_flags\)\]'
        description: The backend adopts the UPSTREAM span, so its span nests inside ours instead of beside it
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var-fmt\(txn\.upstream_span_id\)'
        description: A second id exists for the span that calls the backend
      - type: not_contains
        target: haproxy.cfg
        pattern: 'traceparent 00-%\[var\(txn\.trace_id\)\]-%\[var\(txn\.span_id\)\]'
        description: >-
          Propagating THIS frontend's span id would make the backend a sibling of
          our upstream span, and would give requests that arrive with a
          traceparent a different tree shape than those without
      # THE REGRESSION GUARD. Building the id from a whole UUID pins byte 8 to the
      # variant nibble, and every TraceIdRatioBased sampler reads the low 8 bytes —
      # driving sampling to 0% at any ratio <= 0.5, in EVERY downstream service.
      # Only UUID groups 1, 2 and 5 are free of fixed bits.
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var-fmt\(txn\.trace_id\) %\[uuid\(4\),field\(1,-\)\]%\[uuid\(4\),field\(2,-\)\]%\[uuid\(4\),field\(5,-\)\]%\[uuid\(4\),field\(1,-\)\]'
        description: Minted only from fully-random UUID groups
      - type: not_contains
        target: haproxy.cfg
        pattern: 'uuid\([47]\),regsub'
        description: >-
          The whole-UUID form must never appear — byte 8 would be a constant and
          ratio sampling would silently drop to 0% everywhere downstream
      - type: contains
        target: haproxy.cfg
        pattern: '%\(span_id\)\[var\(txn\.span_id\)\]'
        description: The span fields join the log record, which is what makes it exportable

  test-tracing-enabled-must-be-boolean:
    description: A quoted "false" would silently enable propagation
    fixtures: {}
    extraContext: { tracing: { enabled: "false" } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'tracing.enabled must be a boolean' }

  test-tracing-otlp-cluster-name-charset:
    description: >-
      Every value spliced into the OTLP resource block is bounded, not just
      serviceName — a quote in any of them invalidates the whole batch
    fixtures: {}
    extraContext: { tracing: { enabled: true, otlp: { clusterName: 'prod"eu1' } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'clusterName may only contain' }

  test-tracing-otlp-service-name-charset:
    description: A quote in serviceName would make every exported OTLP batch invalid JSON
    fixtures: {}
    extraContext: { tracing: { enabled: true, otlp: { serviceName: 'ha"ptic' } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'serviceName may only contain' }

  test-tracing-otlp-endpoint-charset:
    description: A '#' in the endpoint would truncate the emitted vector config
    fixtures: {}
    extraContext: { tracing: { enabled: true, otlp: { endpoint: 'http://tempo:4318/v1/traces#frag ment' } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'endpoint may only contain URL characters' }

  test-tracing-sample-rate-out-of-range:
    description: A percentage outside 0-100 is rejected
    fixtures: {}
    extraContext: { tracing: { enabled: true, sampleRate: 150 } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'sampleRate must be a whole percentage' }

  test-access-log-core-fields:
    description: >-
      Every HTTP frontend emits the core JSON field set, the log target drops the
      syslog prefix so records are parseable as-is, and no log-time-illegal
      sample expression reaches a log-format.
    # Pinned off: one assertion below asserts the correlation-only trace_id
    # extraction, which is the tracing-DISABLED form. Inherited, it would fail for
    # any operator who enabled tracing — and a failing validationTest fails the
    # load gate, which crash-loops the controller.
    extraContext: {tracing: {enabled: false}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: access-log-core }
          spec:
            ingressClassName: haptic
            rules:
              - host: log.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log stdout len 16384 format raw local0 info$'
        description: >-
          `log <target> [len N] [format F] <facility>` — the argument order is
          mandatory, and `format raw` is what removes the syslog header that
          would otherwise precede every JSON record.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^  log-format "%\{\+json\}o '}
      - type: contains
        target: haproxy.cfg
        pattern: '%\(status:sint\)ST'
        description: Typed so `status` is a JSON number rather than a string.
      - type: contains
        target: haproxy.cfg
        pattern: '%\(ts\)\[accept_date\(us\),us_utime\(%Y-%m-%dT%H:%M:%S\.%6NZ\)\]'
        description: >-
          `format raw` drops the syslog timestamp, so the record carries its own.
          Microseconds, not milliseconds: this timestamp anchors the derived
          trace spans, and every HAProxy timer is already whole milliseconds, so
          a millisecond anchor threw away the only sub-millisecond precision
          available.
      - {type: contains, target: haproxy.cfg, pattern: '%\(resource\)\[var\(txn\.resource_id\)\]'}
      - type: contains
        target: haproxy.cfg
        pattern: '%\(listener_port\)\[var\(txn\.listener_port\),concat\]'
        description: >-
          The port the host/path map keys were built from — what tells a wrong
          routing key from a missing map entry. `,concat` casts to a string
          because the value is a sint straight from `dst_port` but a string once
          a `frontend-routing-listener-port-*` library remaps it through `map()`;
          without the cast the JSON type flips between requests in one frontend.
      - type: not_contains
        target: haproxy.cfg
        pattern: '%\(listener_port:'
        description: >-
          Untyped deliberately: `frontend status` and the cache-origin leg emit
          the same log-format without running the routing logic, so the variable
          is unset there and a typed item would put "" in a numeric JSON slot.
      - {type: contains, target: haproxy.cfg, pattern: '%\(denied_by\)\[var\(txn\.denied_by\)\]'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.trace_id\) req\.hdr\(traceparent\),field\(2,-\) if \{ req\.hdr\(traceparent\) -m reg '
        description: >-
          A W3C traceparent is captured behind its grammar regex, so junk or
          oversized headers contribute nothing.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'log-format "[^"]*%\[(path|pathq|req\.hdr\(|res\.hdr\(|req\.ssl_sni)'
        description: >-
          HAProxy rejects these at config-parse time inside a log-format ("needs
          HTTP request headers / request buffer which is not available here").
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  option tcplog$'
        description: Replaced everywhere by the TCP-safe JSON variant.

  test-access-log-every-frontend-has-a-format:
    description: >-
      Every frontend this fixture renders carries the JSON log-format, and no
      frontend is left on the old text directives.

      Assertions are anchored to frontend NAMES rather than counting frontends,
      deliberately: validationTests also run as the controller's fatal load gate
      against the operator's own values, so a count would depend on which
      frontend-adding features that deployment happens to enable — enabling the
      Varnish cache tier (which adds haptic_cache_origin) would then crash-loop a
      controller over a test that has nothing to do with caching. The frontends
      other libraries own are asserted in those libraries' own tests
      (haptic-annotations' cache-origin, gateway's per-port TCP frontends), and
      scripts/test-templates.sh carries the repo-side count invariant that catches
      a NEW frontend rendered without a log-format.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: access-log-coverage }
          spec:
            ingressClassName: haptic
            tls:
              - hosts: [coverage.example.com]
                secretName: shared-tls
            rules:
              - host: coverage.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend status$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http-tcp$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http_frontend_h2c$.*?^  log-format "%\{\+json\}o '
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^frontend https$.*?^  log-format "%\{\+json\}o '}
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  option tcplog$'
        description: The TCP-mode frontends use the TCP-safe JSON variant instead.
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^  option httplog$'
        expected: "1"
        description: >-
          Only the `defaults` section keeps it, as the no-warning fallback for a
          frontend that has no format of its own. A second occurrence would mean a
          frontend is emitting text lines.

  test-access-log-custom-fields:
    description: >-
      extraContext.accessLog.fields adds one named item per entry, captured into
      txn.log_<name> at request time so request-scoped fetches work, and emitted
      in sorted-key order so the rendered config does not churn between renders.
    extraContext:
      accessLog: {maxLineBytes: 8192, fields: {tenant: req.hdr(X-Tenant), zulu: str(z), alpha: query}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: deterministic
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^  log stdout len 8192 format raw local0 info$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.log_tenant\) req\.hdr\(X-Tenant\)'
      - {type: contains, target: haproxy.cfg, pattern: '%\(tenant\)\[var\(txn\.log_tenant\)\]'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - '%\(alpha\)\[var\(txn\.log_alpha\)\]'
          - '%\(tenant\)\[var\(txn\.log_tenant\)\]'
          - '%\(zulu\)\[var\(txn\.log_zulu\)\]'
        description: keys() is sorted, so emission order is deterministic.

  test-access-log-rejects-invalid-field-name:
    description: A JSON field name outside the allowed charset is rejected at render time.
    extraContext:
      accessLog:
        fields:
          "bad name": str(x)
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Invalid accessLog.fields key 'bad name'"}

  test-access-log-rejects-colliding-field-name:
    description: >-
      A custom field that shadows a built-in one is rejected — a duplicate JSON
      key is resolved differently by every parser and silently corrupts a log
      pipeline.
    extraContext: {accessLog: {fields: {status: str(1)}}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.fields\\['status'\\] collides with the built-in access-log field"

  test-access-log-rejects-unparseable-max-line-bytes:
    description: >-
      An absurd digit string is rejected on its shape, not by an int64 overflow
      that happens to land below the lower bound — the operator sees what they
      wrote, not -9223372036854775808.
    extraContext: {accessLog: {maxLineBytes: 123456789012345678901234567890}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "maxLineBytes must be an integer between 1024 and 65535, got '1234567890"
      - type: not_contains
        target: rendering_error
        pattern: "-9223372036854775808"
        description: >-
          The diagnostic must name what the operator wrote rather than the int64
          saturation artifact toint() would produce. (The echoed digits differ
          from the literal because a value this large parses as a float.)

  test-access-log-rejects-out-of-range-max-line-bytes:
    description: >-
      The maxLineBytes bound is enforced in the render as well as in Helm, because
      a hand-written HAProxyTemplateConfig never passes through Helm. Below 1024
      every record would be truncated into invalid JSON.
    extraContext: {accessLog: {maxLineBytes: 64}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.maxLineBytes must be an integer between 1024 and 65535, got 64"

  test-access-log-rejects-injection-in-field-value:
    description: >-
      Whitespace in a field expression would let the value continue the
      set-var line with a condition of its own.
    extraContext: {accessLog: {fields: {evil: "str(a) if TRUE"}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "must not contain whitespace"}

  test-request-buffering-default-on:
    description: >-
      Request buffering is on by default and gates on Content-Length, which is
      what keeps gRPC and every other streaming protocol out of it — none can
      declare a length upfront. The per-route map default carries the fleet-wide
      setting, so the rule needs no second form.
    fixtures: *fixturesBufferingBufferExample
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request wait-for-body time 10s if \{ req\.hdr\(content-length\) -m found \} \{ var\(txn\.backend_name\),map\(.*request-buffering\.map,on\) -m str on \}'
      - {type: not_contains, target: haproxy.cfg, pattern: 'option http-buffer-request'}

  test-request-buffering-disabled-fleet-wide:
    description: >-
      Disabling it flips the map's default to off, leaving the same inert rule in
      place so a single route can still opt back in via the map.
    extraContext: {requestBuffering: {enabled: false, waitTimeout: 2s}}
    fixtures: *fixturesBufferingBufferExample
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request wait-for-body time 2s if \{ req\.hdr\(content-length\) -m found \} \{ var\(txn\.backend_name\),map\(.*request-buffering\.map,off\) -m str on \}'

  test-request-buffering-rejects-bad-timeout:
    description: >-
      An unparseable waitTimeout would land verbatim in the config; reject it at
      render time rather than at HAProxy's config check.
    extraContext: {requestBuffering: {waitTimeout: "10 seconds"}}
    fixtures: *fixturesBufferingBufferExample
    assertions:
      - {type: contains, target: rendering_error, pattern: "Expected an HAProxy duration"}

  test-access-log-denied-by-body-size:
    description: >-
      The body-size gate names itself in txn.denied_by, with the deny's own
      condition, so a 413 in the log is attributable to it rather than to the
      WAF or schema-validation body caps.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: access-log-body-limit
            annotations:
              haproxy-haptic.org/max-body-size: "1024"
          spec:
            ingressClassName: haptic
            rules:
              - host: body.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.denied_by\) str\(body_too_large\) if \{ var\(txn\.haptic_body_limit\) -m int gt 0 \}'
          - 'http-request deny deny_status 413 if \{ var\(txn\.haptic_body_limit\) -m int gt 0 \}'
        description: >-
          The marker must precede the deny: `deny` ends rule processing, so a
          marker after it would never run.

  test-access-log-target-default-is-stdout:
    description: >-
      With accessLog.targets set to stdout the access log goes to stdout exactly
      as before, and HAProxy's own process messages keep their own global stdout
      target.
    fixtures: {}
    # Pinned explicitly rather than relying on the absent-key default: the chart
    # now ships vector.enabled=true, which points the default target at the
    # vector socket, so an unpinned test would assert whatever the current
    # sidecar default happens to be instead of the stdout path it exists to
    # cover. test-access-log-target-vector-socket covers the other default.
    extraContext: {accessLog: {targets: {main: {address: stdout}}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log stdout len 16384 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log stdout len 16384 format raw local0 info$'
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^  log global$'
        description: >-
          Replaced by an explicit target, so the access log no longer inherits
          whatever the global section happens to use.
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ring '}

  test-access-log-target-ring:
    description: >-
      A ring target emits its own buffered-TCP ring section and points the
      defaults log line at it, so access records leave the container instead of
      landing on stdout — while process messages still go to stdout.
    extraContext: {accessLog: {targets: {main: {ring: {name: accesslog, address: 127.0.0.1:6514}}}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log ring@accesslog len 16384 format rfc5424 local0 info$'
        description: >-
          The framing defaults to rfc5424 for a non-stdout target: a collector
          parses the syslog envelope and the JSON record inside it.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^ring accesslog$.*?^  server accesslog 127\.0\.0\.1:6514 log-proto legacy$'
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^ring accesslog$.*?^  size 65536$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^global$.*?^  log stdout len 16384 format raw local0 info$'
        description: Process/alert messages are unaffected — kubectl logs still works.
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log stdout'
        description: No access-log copy on stdout, which is the whole point.

  test-access-log-target-remote-and-fanout:
    description: >-
      An address target works without a ring (here a UDP syslog endpoint), and
      several targets fan out — the migration case, where records go to the new
      collector and stdout at once.
    extraContext:
      accessLog:
        targets:
          main: {address: 10.0.0.5:514, format: rfc5424, facility: local6, level: debug}
          second: {address: stdout}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log 10\.0\.0\.5:514 len 16384 format rfc5424 local6 debug$'
      - type: match_count
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log '
        expected: "1"
        description: match_count anchors on the first line only; the fan-out pair is asserted individually.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log stdout len 16384 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log 10\.0\.0\.5:514 len 16384 format rfc5424 local6 debug\n  log stdout len 16384 format raw local0 info$'
        description: >-
          Emitted in sorted key order (main before second). Map iteration is not
          ordered, so without the sort the rendered config would churn between
          renders and every consumer would see a spurious config change.

  test-access-log-target-ring-with-tls-server-options:
    description: >-
      serverOptions is spliced verbatim onto the ring's server line, so TLS (or
      any other server keyword) is reachable without the chart modelling it.

      Two sharp edges this fixture encodes deliberately. The address is an IP
      because HAProxy resolves a ring server's address at config-PARSE time, so a
      name that does not resolve during validation fails the render — a sidecar
      (127.0.0.1) or a literal IP always works, a Service DNS name needs
      `resolvers`/`init-addr` through serverOptions. And the TLS options carry no
      ca-file, because any file referenced here must also exist where the config
      is validated (the controller pod), not just in the HAProxy pod; deliver
      such material through the chart's file mechanism so both see it.
    extraContext:
      accessLog:
        targets:
          main:
            ring:
              name: secure-log
              address: 10.43.12.7:6514
              size: 131072
              logProto: octet-count
              connectTimeout: 2s
              serverTimeout: 30s
              serverOptions: "ssl verify none"
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'server secure-log 10\.43\.12\.7:6514 log-proto octet-count ssl verify none'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  log ring@secure-log len 16384 format rfc5424 local0 info$'

  test-access-log-target-rejects-address-and-ring:
    description: A target that sets both an address and a ring is ambiguous.
    extraContext:
      accessLog: {targets: {main: {address: stdout, ring: {name: accesslog, address: 127.0.0.1:6514}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "sets both 'address' \\(stdout\\) and 'ring'"}

  test-access-log-target-rejects-bad-address:
    description: >-
      The address is spliced into a `log` directive, so it is charset-checked
      rather than trusted.
    extraContext: {accessLog: {targets: {main: {address: "stdout local0 info\nfrontend evil"}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Invalid accessLog\\.targets\\.main\\.address"}

  test-access-log-target-rejects-unknown-field:
    extraContext: {accessLog: {targets: {main: {address: stdout, formatt: raw}}}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog\\.targets\\.main contains unknown field 'formatt'"

  test-access-log-target-rejects-injection-in-server-options:
    description: >-
      serverOptions allows spaces (it carries real server keywords) so a newline
      or comment marker is what would let it inject a directive.
    extraContext:
      accessLog:
        targets: {main: {ring: {name: accesslog, address: 127.0.0.1:6514, serverOptions: "ssl # sneaky"}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "must not contain control characters or '#'"}

  test-access-log-target-rejects-dangling-ring-reference:
    description: >-
      A `log ring@<name>` with no such ring passes `haproxy -c` and then makes
      HAProxy refuse to start — validation green, data plane down. The render
      rejects it instead, because no gate downstream would catch it.
    extraContext: {accessLog: {targets: {main: {address: ring@nowhere}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "points at a ring no target declares"}

  test-access-log-target-socket-path-may-end-in-digits:
    description: >-
      The port bound must not misread a UNIX socket path. A colon is a legal
      filename character, so `/var/run/log:99999` is a valid destination whose
      trailing digits are part of the name — the check applies to the host:port
      forms only.
    extraContext: {accessLog: {targets: {main: {address: /var/run/log:99999}}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log /var/run/log:99999 len 16384 format rfc5424 local0 info$'

  test-access-log-target-rejects-out-of-range-port:
    description: >-
      The address shape allows five port digits, but HAProxy hard-ALERTs above
      65535 ("invalid port '99999'", measured on 3.0 and 3.4). Without this the
      value passes Helm and takes down the controller's config load instead of
      being rejected where the operator set it.
    extraContext: {accessLog: {targets: {main: {address: 10.0.0.5:99999}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "has port 99999, outside 1-65535"}

  test-access-log-target-rejects-out-of-range-ring-port:
    description: >-
      Same bound on a ring server address, which reaches HAProxy through a
      different directive (`server` in the ring section, not `log`).
    extraContext: {accessLog: {targets: {main: {ring: {name: shipper, address: 10.0.0.5:99999}}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "has port 99999, outside 1-65535"}

  test-access-log-target-rejects-ring-too-small-for-a-record:
    description: >-
      The ring section carries `maxlen <maxLineBytes>`, and HAProxy caps that at
      the buffer minus a ~197-byte header. Undersized, it emits only a [WARNING]
      — which `haproxy_valid` treats as success — and then truncates every longer
      record mid-byte into invalid JSON, defeating the point of maxLineBytes.
      Measured identically on HAProxy 3.0 and 3.4.
    extraContext:
      accessLog:
        maxLineBytes: 16384
        targets: {main: {ring: {name: tiny, address: 127.0.0.1:6514, size: 4096}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "too small for accessLog.maxLineBytes 16384"}

  test-access-log-suppress-off-by-default:
    description: >-
      With suppression not requested, no successful-response suppression rule
      is emitted. The test pins accessLog.suppress because validation tests run
      against the operator's config.
    extraContext: {accessLog: {suppress: {successful: false}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'http-after-response set-log-level silent'}

  test-access-log-suppress-successful:
    description: >-
      Opting in emits one http-after-response rule per HTTP frontend that keeps
      every denial, 4xx and 5xx. http-AFTER-response, not http-response: the
      latter only runs for responses that came from a server, so a WAF deny or
      any other `http-request return` would never be evaluated. Measured on 3.0
      and 3.4 — with http-after-response 5/5 successes are dropped and a denial
      plus a 500 are kept; with http-response all seven are logged.
    extraContext: {accessLog: {suppress: {successful: true}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-after-response set-log-level silent if \{ status ge 200 \} \{ status lt 400 \} !\{ var\(txn\.denied_by\) -m found \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-response set-log-level silent'
        description: >-
          Must not be an http-response rule — that hook never runs for
          HAProxy-generated responses, so denials would slip the condition.

  test-access-log-suppress-rejects-unknown-field:
    description: A typo'd subkey would silently leave suppression off, so it is rejected.
    extraContext: {accessLog: {suppress: {successfull: true}}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "accessLog.suppress contains unknown field 'successfull'"

  test-access-log-suppress-rejects-non-boolean:
    description: A non-boolean would be read as false and silently disable suppression.
    extraContext: {accessLog: {suppress: {successful: "maybe"}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "accessLog.suppress.successful must be a boolean"}

  test-access-log-target-rejects-duplicate-log-line:
    description: >-
      HAProxy sends every record down every `log` line, so two targets rendering
      an identical line log each request twice — accepted by `haproxy -c`, and
      visible only as doubled volume at the collector. The reachable way to hit
      this is a ring target plus a second entry addressing that same ring.
    extraContext:
      accessLog:
        targets: {main: {ring: {name: shipper, address: 127.0.0.1:6514}}, second: {address: ring@shipper}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "would be logged twice"}

  test-access-log-targets-fan-out-to-one-address-with-distinct-settings:
    description: >-
      The duplicate-line guard keys on the whole rendered line, not the address,
      so two targets sharing an address but differing in facility are real fan-out
      and stay allowed.
    extraContext:
      accessLog: {targets: {main: {address: stdout}, second: {address: stdout, facility: local1}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log stdout len 16384 format raw local0 info$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-base$.*?^  log stdout len 16384 format raw local1 info$'

  test-access-log-targets-rejects-empty-map:
    description: >-
      An empty target map would fall back to stdout — the one destination this
      setting exists to move records off — so the operator who wrote it would
      silently get the opposite of what they asked for. An ABSENT key still takes
      the default. __replace__ is required: a plain {} deep-merges into the
      chart's own default target and the render would never see it empty.
    extraContext: {accessLog: {targets: { __replace__: true }}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "accessLog\\.targets is empty"}

  test-access-log-target-rejects-duplicate-ring-name:
    description: >-
      Two targets naming the same ring would emit two `ring <name>` sections.
      Reject the second one where the operator can see which target caused it,
      rather than leaving HAProxy to reason about a duplicate section.
    extraContext:
      accessLog:
        targets:
          main: {ring: {name: dup, address: 127.0.0.1:6514}}
          second: {ring: {name: dup, address: 127.0.0.1:6515}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Two ring sections cannot share a name"}

  test-access-log-target-rejects-unusable-level:
    description: >-
      The level is a maximum-severity filter and access records are emitted at
      info, so `notice` and above silently drop every record while haproxy -c
      still returns 0. Measured: notice/warning/err each emitted zero records.
    extraContext: {accessLog: {targets: {main: {address: stdout, level: notice}}}}
    fixtures: {}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "a stricter level \\(notice and above\\) silently drops every one of them"

  test-access-log-target-rejects-unix-ring-server:
    description: >-
      HAProxy 3.4 rejects a UNIX ring server while 3.0 accepts it, so the chart
      refuses the form rather than rendering a config that works on some
      supported versions only.
    extraContext: {accessLog: {targets: {main: {ring: {name: accesslog, address: unix@/var/run/log.sock}}}}}
    fixtures: {}
    assertions:
      - {type: contains, target: rendering_error, pattern: "HAProxy 3.4 rejects a UNIX ring server"}

  test-proxy-protocol-http-bind:
    description: >-
      extraContext.proxyProtocol.enabled adds a second HTTP bind requiring a
      PROXY header. The plain httpPort bind must survive: a bind with
      accept-proxy drops connections that arrive without the header, so
      replacing the port instead of adding one would cut off direct,
      in-cluster and NodePort access.
    extraContext: {proxyProtocol: {enabled: true, httpPort: 8081, httpsPort: 8444}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^frontend http-tcp$.*?^\s+bind \*:80$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend http-tcp$.*?^\s+bind \*:8081 accept-proxy$'

  test-proxy-protocol-http-bind-disabled:
    description: >-
      Negative control for test-proxy-protocol-http-bind. Sets enabled=false
      explicitly rather than leaning on the chart default: per-test extraContext
      deep-merges into the operator's, so an operator who turns proxyProtocol on
      would otherwise fail this test and crash-loop on the load gate. The
      pattern is scoped to `bind *:<port> accept-proxy` because the h1/h2c
      loopback frontends always carry accept-proxy on their unix sockets.
    extraContext: {proxyProtocol: {enabled: false}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: trigger, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'bind \*:[0-9]+ accept-proxy'}

  test-access-log-route-for-metrics:
    _helm_skip_test: *routeKeyOff
    description: The request metrics' `path` label wants `route`, so it renders with tracing off.
    extraContext:
      tracing: {enabled: false}
      vector: {requestMetrics: {enabled: true, pathLabel: true}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: rt }
          spec:
            ingressClassName: haptic
            rules:
              - host: log.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(route\)\[var\(txn\.route\)\]'}
      # The field is worthless without the lookup that fills it.
      - {type: contains, target: haproxy.cfg, pattern: 'set-var\(txn\.route\) var\(txn\.host_match\)'}

  test-access-log-request-bytes-for-metrics:
    _helm_skip_test: *requestBytesOff
    description: The request_size metric wants `bytes_in`, so it renders with tracing off.
    extraContext:
      tracing: {enabled: false}
      vector: {requestMetrics: {enabled: true, metrics: {request_size: true}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: rt }
          spec:
            ingressClassName: haptic
            rules:
              - host: log.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(bytes_in:sint\)U'}

  test-access-log-route-and-request-bytes-absent-when-unused:
    description: >-
      With neither tracing nor the request metrics asking, the route cascade and
      %U are absent — four map lookups and a field on every record.
    extraContext: {tracing: {enabled: false}, vector: {requestMetrics: {enabled: false}}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      # Positive control: the log-format is still assembled, so the absences
      # below are about these two fields rather than a log-format that vanished.
      - {type: contains, target: haproxy.cfg, pattern: '%\(term\)tsc'}
      - {type: not_contains, target: haproxy.cfg, pattern: '%\(route\)'}
      - {type: not_contains, target: haproxy.cfg, pattern: '%\(bytes_in:sint\)U'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-var\(txn\.route\)'}

  test-access-log-route-still-follows-tracing:
    _helm_skip_test: *routeKeyOff
    description: >-
      Moving `route` out of the tracing block must not change what tracing alone
      produces; a span without http.route loses the attribute UIs group on.
    extraContext: {tracing: {enabled: true}, vector: {requestMetrics: {enabled: false}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: rt }
          spec:
            ingressClassName: haptic
            rules:
              - host: log.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '%\(route\)\[var\(txn\.route\)\]'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-var\(txn\.route\) var\(txn\.host_match\)'}
      # request_size is off, so its field must not ride along with tracing.
      - {type: not_contains, target: haproxy.cfg, pattern: '%\(bytes_in:sint\)U'}
