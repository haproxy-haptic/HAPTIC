# HAPTIC-native annotation library — path-matching + host-alias contributions.
#
# Best-of-breed adaptation of the haproxy-ingress vendor fragments
# (10-path-maps.yaml + 15-server-alias.yaml), re-homed under the
# haproxy-haptic.org/* prefix and the 800 priority band. Semantics are carried
# faithfully from haproxy-ingress (the only vendor exposing per-path type
# selection and host aliases), so migrating an Ingress is a pure key rename.
#
#   haproxy-haptic.org/path-type:          regex | exact | prefix | begin
#       Honored only for paths whose pathType is ImplementationSpecific. Drives
#       which path map the path lands in (regex → path-regex.map, exact →
#       path-exact.map, prefix → path-prefix.map, begin → path-prefix-exact.map).
#   haproxy-haptic.org/host-alias:       comma/space list of extra EXACT hosts.
#       → host.map entry  `<alias-key> <primary-host-key>`
#   haproxy-haptic.org/host-alias-regex: a regex matching extra hostnames.
#       → host-alias-regex.map entry  `^(?:<regex>)$ <primary-host-key>`
#
# Map targets use BackendNameIngress + MapKeyForHost so names/keys match
# ingress.yaml (and the standard path-map renderers) byte-for-byte.
templateSnippets:
  map-path-regex-800-haptic-path-type:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/path-type']"]
      effects: [recordEvent]
    template: |
      {#
        haproxy-haptic.org/path-type: "regex" → path-regex.map entries.

        Annotations:
          - haproxy-haptic.org/path-type: "regex" (optional)

        Matches Ingress paths with pathType ImplementationSpecific. The path
        value is a HAProxy-compatible PCRE matched from the start of the
        path, keyed on the normalised host (RegexMapKey). The value shape
        (`BACKEND:<backend>`) matches ingress.yaml's standard path renderers.

        Extension Point: map-path-regex-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-regex-map-key" for RegexGroupProblem, RegexMapKey -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {#- A whitespace path is skipped; features-900-ingress-path-candidates reports it. -#}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} %}
      {%- if ingress.Metadata.Annotations["haproxy-haptic.org/path-type"] == "regex" %}
      {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
      # haptic/path-type ({{ key }})
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- for _, path := range rule.Http.Paths %}
          {%- if path.PathType == "ImplementationSpecific" && ConfigInjectionKind(path.Path, "mapkey") == "" %}
            {%- var problem = RegexGroupProblem(path.Path) %}
            {%- if problem != "" %}
              {{- WebhookRejectOrWarn(ingress, "InvalidPath", WebhookOutcomeMessage(
                "Ingress " + key + " has regex path '" + path.Path + "', which " + problem,
                "the Ingress is rejected", "the path is not routed", "Rewrite it so its groups and [ ] classes close within it, without \\Q, \\E, \\c or (*.")) -}}
              {%- continue %}
            {%- end %}
      {{ RegexMapKey(MapKeyForHost(rule.Host), path.Path, "") }} BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}

  map-path-exact-800-haptic-path-type:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/path-type']"]
    template: |
      {#
        haproxy-haptic.org/path-type: "exact" → path-exact.map entries.

        Annotations:
          - haproxy-haptic.org/path-type: "exact" (optional)

        Matches Ingress paths with pathType ImplementationSpecific; the path
        must match exactly (no prefix semantics).

        Extension Point: map-path-exact-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} %}
      {%- if ingress.Metadata.Annotations["haproxy-haptic.org/path-type"] == "exact" %}
      # haptic/path-type ({{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }})
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- for _, path := range rule.Http.Paths %}
          {%- if path.PathType == "ImplementationSpecific" %}
      {{ MapKeyForHost(rule.Host) }}{{ path.Path }} BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}

  map-path-prefix-800-haptic-path-type:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/path-type']"]
    template: |
      {#
        haproxy-haptic.org/path-type: "prefix" → path-prefix.map entries.

        Annotations:
          - haproxy-haptic.org/path-type: "prefix" (optional)

        Matches Ingress paths with pathType ImplementationSpecific. The path is
        normalised with a trailing "/" so it matches on path segments (Ingress
        Prefix semantics), not on an arbitrary string prefix.

        Extension Point: map-path-prefix-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} %}
      {%- if ingress.Metadata.Annotations["haproxy-haptic.org/path-type"] == "prefix" %}
      # haptic/path-type ({{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }})
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- for _, path := range rule.Http.Paths %}
          {%- if path.PathType == "ImplementationSpecific" %}
            {%- var pathValue = path.Path %}
            {#- Ensure path ends with / for segment-boundary prefix matching -#}
            {%- if pathValue != "" && !hasSuffix(pathValue, "/") %}
              {%- pathValue = pathValue + "/" %}
            {%- end %}
      {{ MapKeyForHost(rule.Host) }}{{ pathValue }} BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}

  map-pfxexact-800-haptic-path-type:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/path-type']"]
    template: |
      {#
        haproxy-haptic.org/path-type: "begin" → path-prefix-exact.map entries.

        Annotations:
          - haproxy-haptic.org/path-type: "begin" (optional)

        The "begin" path type matches when the request path begins with the
        specified prefix, with no trailing-slash normalisation (legacy
        haproxy-ingress semantics).

        Extension Point: map-pfxexact-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} %}
      {%- if ingress.Metadata.Annotations["haproxy-haptic.org/path-type"] == "begin" %}
      # haptic/path-type ({{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }})
        {%- for _, rule := range ingress.Spec.Rules %}
          {%- for _, path := range rule.Http.Paths %}
          {%- if path.PathType == "ImplementationSpecific" %}
      {{ MapKeyForHost(rule.Host) }}{{ path.Path }} BACKEND:{{ BackendNameIngress(ingress, path) }}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
      {%- end %}


  features-911-haptic-host-alias-claims:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - metadata.annotations['haproxy-haptic.org/host-alias']
        - metadata.annotations['haproxy-haptic.org/host-alias-regex']
      group: ingress-host-claims
      effects: [publishValue]
    template: |-
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostClaimRank, HostAliases, HostAliasProblem, HostAliasRegexKey -%}
      {%- import "util-regex-map-key" for RegexGroupProblem -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%%
        var exactAnnotation = "haproxy-haptic.org/host-alias"
        var regexAnnotation = "haproxy-haptic.org/host-alias-regex"
        var id = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        if primaryKey != "" {
          var seen = map[string]bool{}
          for _, alias := range HostAliases(dig_string(item, "", "metadata", "annotations", exactAnnotation), " ") {
            var aliasKey = tostring(MapKeyForHost(toLower(alias)))
            if HostAliasProblem(alias) != "" || aliasKey == primaryKey || seen[aliasKey] { continue }
            seen[aliasKey] = true
            show shared.PublishRanked("hosts", aliasKey, HostClaimRank(item, exactAnnotation),
              map[string]any{"owner": id, "target": primaryKey, "annotation": exactAnnotation})
          }
          var regex = strip(dig_string(item, "", "metadata", "annotations", regexAnnotation))
          if regex != "" && ConfigInjectionKind(regex, "mapkey") == "" && RegexGroupProblem(regex) == "" {
            show shared.PublishRanked("regexes", HostAliasRegexKey(regex), HostClaimRank(item, regexAnnotation),
              map[string]any{"owner": id, "target": primaryKey, "annotation": regexAnnotation})
          }
        }
      %%}

  map-host-800-haptic-host-alias:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/host-alias']"]
      consumes: [ingress-host-claims]
      effects: [recordEvent]
    template: |
      {#
        haproxy-haptic.org/host-alias → host.map entries.

        Annotations:
          - haproxy-haptic.org/host-alias: "a.example.com, b.example.com" (optional)

        For each listed hostname, emit one host.map entry pointing at the
        primary host's normalised key (the FIRST rule's host, MapKeyForHost),
        so the alias resolves to identical downstream path-map lookups. An
        alias another Ingress claimed first (as a rule host or alias) isn't
        emitted; this Ingress gets a RouteConflict Event.

        Extension Point: map-host-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostAliases, HostAliasProblem, HostClaimEmits, HostClaimConflict, HostAliasConflictMessage -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var annotation = "haproxy-haptic.org/host-alias"
        var id = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        if primaryKey != "" {
          var lines = ""
          var seen = map[string]bool{}
          for _, alias := range HostAliases(dig_string(item, "", "metadata", "annotations", annotation), " ") {
            var injection = ConfigInjectionKind(alias, "mapkey")
            if injection != "" {
              _ = WebhookRejectOrWarn(item, "InvalidHostAlias", WebhookOutcomeMessage(
                "Ingress " + id + " annotation '" + annotation + "' value contains " + injection + ", which would split the host map",
                "the Ingress is rejected", "the alias is not applied", "Remove whitespace and control characters from the value."))
              continue
            }
            var problem = HostAliasProblem(alias)
            if problem != "" {
              _ = WebhookRejectOrWarn(item, "InvalidHostAlias", WebhookOutcomeMessage(
                "Ingress " + id + " annotation '" + annotation + "' alias '" + alias + "' " + problem,
                "the Ingress is rejected", "the alias isn't routed", "Use a hostname such as www.example.com or *.example.com."))
              continue
            }
            var aliasKey = tostring(MapKeyForHost(toLower(alias)))
            if aliasKey == primaryKey || seen[aliasKey] { continue }
            seen[aliasKey] = true
            var winner, found = shared.Select("ingress-host-claims", "hosts", aliasKey)
            if HostClaimEmits(winner, found, id, annotation) {
              lines += "\n" + aliasKey + " " + primaryKey
            } else if HostClaimConflict(winner, found, id, primaryKey) {
              recordEvent(item, "RouteConflict", HostAliasConflictMessage(annotation, alias, dig_string(winner, "", "owner")))
            }
          }
          if lines != "" {
            show "\n# haptic/host-alias (" + id + ")" + lines + "\n"
          }
        }
      %%}

  map-hostaliasregex-800-haptic-host-alias-regex:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/host-alias-regex']"]
      consumes: [ingress-host-claims]
      effects: [recordEvent]
    template: |
      {#
        haproxy-haptic.org/host-alias-regex → host-alias-regex.map entries.

        Annotations:
          - haproxy-haptic.org/host-alias-regex: "app[0-9]+\.example\.com" (optional)

        The value is a HAProxy-compatible PCRE matched against the whole
        hostname: it is written as ^(?:<regex>)$, and RegexGroupProblem rejects
        anything that could close that group early. base.yaml's routing cascade
        consults host-alias-regex.map last, after every exact, wildcard and
        host-regex.map lookup missed.

        Extension Point: map-hostaliasregex-* (priority 800 — HAPTIC-native)
      #}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-ingress-host-claims" for HostAliasRegexKey, HostClaimEmits, HostClaimConflict, HostAliasConflictMessage -%}
      {%- import "util-regex-map-key" for RegexGroupProblem -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%%
        var annotation = "haproxy-haptic.org/host-alias-regex"
        var id = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name")
        var rules = toSlice(dig(item, "spec", "rules"))
        var primaryKey = ""
        if len(rules) > 0 { primaryKey = tostring(MapKeyForHost(dig(rules[0], "host"))) }
        var regex = strip(dig_string(item, "", "metadata", "annotations", annotation))
        if primaryKey != "" && regex != "" {
          var injection = ConfigInjectionKind(regex, "mapkey")
          var problem = RegexGroupProblem(regex)
          if injection != "" {
            _ = WebhookRejectOrWarn(item, "InvalidHostAliasRegex", WebhookOutcomeMessage(
              "Ingress " + id + " annotation '" + annotation + "' value contains " + injection + ", which would split the host-alias-regex map",
              "the Ingress is rejected", "the alias regex is not applied", "Remove whitespace and control characters from the value."))
          } else if problem != "" {
            _ = WebhookRejectOrWarn(item, "InvalidHostAliasRegex", WebhookOutcomeMessage(
              "Ingress " + id + " annotation '" + annotation + "' regex '" + regex + "' " + problem,
              "the Ingress is rejected", "the alias regex isn't routed", "Rewrite it so its groups and [ ] classes close within it, without \\Q, \\E, \\c or (*."))
          } else {
            var key = HostAliasRegexKey(regex)
            var winner, found = shared.Select("ingress-host-claims", "regexes", key)
            if HostClaimEmits(winner, found, id, annotation) {
              show "\n# haptic/host-alias-regex (" + id + ")\n" + key + " " + primaryKey + "\n"
            } else if HostClaimConflict(winner, found, id, primaryKey) {
              recordEvent(item, "RouteConflict", HostAliasConflictMessage(annotation, regex, dig_string(winner, "", "owner")))
            }
          }
        }
      %%}
