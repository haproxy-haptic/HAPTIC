# HAPTIC-native annotation library — auth, mTLS, external-auth (SPOE), OAuth2,
# and WAF. Best-of-breed superset of the three vendor auth libraries under the
# haproxy-haptic.org/* prefix:
#   - Basic auth: nginx's explicit auth-type + auth-secret-type (auth-file /
#     auth-map) selector, haproxy-ingress's htpasswd `user::plain` handling, and
#     password-hash validation against extraContext.hapticPasswordHashRegex.
#   - satisfy: nginx's "any" → OR-combine of the allowlist and basic auth.
#   - mTLS: identical nginx / haproxy-ingress registration into
#     gf["clientCertVerifyHosts"] + gf["mtlsErrorHosts"] + the X-SSL-Client-*
#     cert passthrough.
#   - External auth: the auth-* SPOE map contributions + pass/fail header wiring
#     (requires spoaHub.plugins.external-auth — see the plugin note below).
#   - OAuth2-proxy: haproxy-ingress's `oauth` desugaring onto external-auth.
#   - WAF: haproxy-ingress's waf / waf-mode enforcement-mode map + nginx's
#     per-app modsecurity-snippet (both via the spoa-hub coraza plugin).
#
# Plugin requirement (accurate, not auto-enabled): the external-auth and WAF
# capabilities only take effect when the operator has enabled the corresponding
# spoa-hub plugin (spoaHub.plugins external-auth / coraza). The values layer
# owns plugin enablement; these snippets never flip it on. The WAF snippets
# fail-loud when their annotations are present without the coraza plugin (a
# silent no-op would hide a real misconfiguration); the external-auth map
# contributions mirror the vendor behaviour and populate the SPOE maps
# unconditionally — the spoa-hub frontend wiring self-gates on the check-auth
# message being present in the messages union.
templateSnippets:
  # ============================================================================
  # Basic auth — userlist generation (global-top)
  # ============================================================================
  global-top-820-haptic-auth:
    requires: [ingresses]
    template: |
      {#
        HAPTIC Basic Auth Userlist Generation

        Documentation: docs/site/docs/libraries/haptic-annotations.md#basic-auth

        Annotations:
          - haproxy-haptic.org/auth-type: "basic" (required; any other value fails)
          - haproxy-haptic.org/auth-secret: "<ns/name>" or "<name>" (required)
          - haproxy-haptic.org/auth-secret-type: "auth-file" | "auth-map"
            (optional, default "auth-file")

        Secret formats (selected by auth-secret-type):
          auth-file (default): a single `auth` data key holding an htpasswd file
            (base64-encoded). One `username:hash` line each; `username::plain`
            lines (empty hash field, double colon) map to `insecure-password`.
          auth-map: each data key is a username and its base64-decoded value is
            that user's password hash.

        Every credential, `username::plain` lines included, must match
        extraContext.hapticPasswordHashRegex (default: bcrypt, SHA-256/SHA-512
        crypt, yescrypt). A per-line config-injection guard additionally rejects
        whitespace / control characters so a hostile Secret value cannot break
        out of the userlist line.

        Generated HAProxy Config:
          userlist haptic_auth_<secretNs>_<secretName>
            user <username> password <hash>
      #}
      {%- var hashRegex = extraContext | dig_string("^\\$(2[aby]|5|6|y)\\$[./0-9A-Za-z$=]+$", "hapticPasswordHashRegex") %}
      {%- for _, entry := range incremental_values("haptic-auth-userlists", "userlists") %}
        {%- var record = entry.(map[string]any) %}
        {%- var key = tostring(record["ingress"]) %}
        {%- var secretNs = tostring(record["secretNamespace"]) %}
        {%- var secretName = tostring(record["secretName"]) %}
        {%- var secretType = tostring(record["secretType"]) %}
        {%- var userlistName = tostring(record["userlistName"]) %}
        {%- var secretData = to_str_map(record["data"]) %}
                {%- if secretType == "auth-file" %}
                  {%- var authData = secretData["auth"] | b64decode() | tostring() %}
                  {%- if authData == "" %}
                    {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced by annotation 'haproxy-haptic.org/auth-secret' on Ingress '" + key + "' has an empty or missing 'auth' key (auth-file format).") -}}
                  {%- end %}
      # haptic/auth ({{ key }})
      userlist {{ userlistName }}
                  {%- for _, line := range split(authData, "\n") %}
                    {%- var l = strip(line) %}
                    {%- if l == "" || !strings_contains(l, ":") %}{%- continue %}{%- end %}
                    {%- var lparts = strings_splitn(l, ":", 2) %}
                    {%- var user = lparts[0] %}
                    {%- var rest = lparts[1] %}
                    {%- var pwKeyword = "password" %}
                    {%- if hasPrefix(rest, ":") %}{%- pwKeyword = "insecure-password" %}{%- rest = rest[1:] %}{%- end %}
                    {%- if user == "" || rest == "" %}{%- continue %}{%- end %}
                    {#- Config-injection guard: reject whitespace / control chars in
                        both the username and the credential (they land on a single
                        HAProxy `user` line). -#}
                    {%- if !regex_search(user, "^[!-~]+$") || !regex_search(rest, "^[!-~]+$") %}
                      {{- fail("Secret '" + secretNs + "/" + secretName + "' referenced on Ingress '" + key + "' has an invalid username or credential for user '" + user + "' (whitespace / control characters are not permitted).") -}}
                    {%- end %}
                    {%- if !regex_search(rest, hashRegex) %}
                      {{- fail("Ingress '" + key + "' references Secret '" + secretNs + "/" + secretName + "', whose password hash for user '" + user + "' doesn't match the allowed pattern hapticPasswordHashRegex \"" + hashRegex + "\"; HAPTIC refuses the configuration until it is replaced. Replace it with a bcrypt, SHA-256/SHA-512 crypt or yescrypt hash, for example from htpasswd -nB <user>") -}}
                    {%- end %}
        user {{ user }} {{ pwKeyword }} {{ rest }}
                  {%- end %}
                {%- else %}
                  {# auth-map: each Secret data key is a username, its value the hash. #}
      # haptic/auth ({{ key }})
      userlist {{ userlistName }}
                  {%- for _, username := range keys(secretData) %}
                    {%- var passwordHash = secretData[username] | b64decode() | tostring() %}
                    {%- if username == "" || passwordHash == "" %}
                      {{- fail("Secret '" + secretNs + "/" + secretName + "' (auth-map) referenced on Ingress '" + key + "' has an empty username or hash.") -}}
                    {%- end %}
                    {%- if !regex_search(username, "^[!-~]+$") || !regex_search(passwordHash, "^[!-~]+$") %}
                      {{- fail("Secret '" + secretNs + "/" + secretName + "' (auth-map) referenced on Ingress '" + key + "' has an invalid username or hash for user '" + username + "' (whitespace / control characters are not permitted).") -}}
                    {%- end %}
                    {%- if !regex_search(passwordHash, hashRegex) %}
                      {{- fail("Ingress '" + key + "' references Secret '" + secretNs + "/" + secretName + "', whose password hash for user '" + username + "' doesn't match the allowed pattern hapticPasswordHashRegex \"" + hashRegex + "\"; HAPTIC refuses the configuration until it is replaced. Replace it with a bcrypt, SHA-256/SHA-512 crypt or yescrypt hash, for example from htpasswd -nB <user>") -}}
                    {%- end %}
        user {{ username }} password {{ passwordHash }}
                  {%- end %}
                {%- end %}
      {%- end -%}
      {{- render "haptic-auth-userlist-publications" -}}

  haptic-auth-userlist-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/auth-secret']"
        - "metadata.annotations['haproxy-haptic.org/auth-secret-type']"
        - "metadata.annotations['haproxy-haptic.org/auth-type']"
      group: haptic-auth-userlists
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var ns = ingress.Metadata.Namespace -%}
        {%- var name = ingress.Metadata.Name -%}
        {%- var key = ns + "/" + name -%}
        {%- var authType = ingress.Metadata.Annotations["haproxy-haptic.org/auth-type"] -%}
        {%- if authType != "" -%}
          {%- if authType != "basic" -%}
            {{- fail("Unsupported auth-type '" + authType + "' for annotation 'haproxy-haptic.org/auth-type' on Ingress '" + key + "'. Only 'basic' is supported.") -}}
          {%- end -%}
          {%- var authSecret = ingress.Metadata.Annotations["haproxy-haptic.org/auth-secret"] -%}
          {%- if authSecret != "" -%}
            {%- var secretType = ingress.Metadata.Annotations["haproxy-haptic.org/auth-secret-type"] -%}
            {%- if secretType == "" -%}{%- secretType = "auth-file" -%}{%- end -%}
            {%- if secretType != "auth-file" && secretType != "auth-map" -%}
              {{- fail("Invalid value '" + secretType + "' for annotation 'haproxy-haptic.org/auth-secret-type' on Ingress '" + key + "'. Valid values: 'auth-file', 'auth-map'.") -}}
            {%- end -%}
            {%- var secretNs = ns -%}
            {%- var secretName = authSecret -%}
            {%- if strings_contains(authSecret, "/") -%}
              {%- var parts = split(authSecret, "/") -%}
              {%- secretNs = parts[0] -%}
              {%- secretName = parts[1] -%}
            {%- end -%}
            {%- var secret = resources.secrets.GetSingle(secretNs, secretName) -%}
            {%- if secret != nil -%}
              {%- var userlistName = "haptic_auth_" + secretNs + "_" + secretName -%}
              {%- var secretData = map[string]any{} -%}
              {%- for dataKey, dataValue := range secret.Data -%}
                {%- secretData[dataKey] = dataValue -%}
              {%- end -%}
              {{- shared.Publish("userlists", userlistName, map[string]any{
                "ingress": key,
                "secretNamespace": secretNs,
                "secretName": secretName,
                "secretType": secretType,
                "userlistName": userlistName,
                "data": secretData,
              }) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # Runtime half of the mTLS fail-closed. features-110 registers a host here when
  # its auth-tls-secret cannot be resolved, which happens to an ALREADY ADMITTED
  # Ingress whenever the Secret is deleted, renamed or briefly unfetchable.
  #
  # Without this the host keeps being served: HAPTIC terminates every HTTPS host
  # on one shared `bind *:443 ssl crt-list` and client-cert verification is a
  # per-entry option, so dropping the entry's verify clause leaves ordinary
  # server-side TLS answering on the same port. There is no separate mTLS
  # listener to refuse the handshake.
  # ==========================================================================
  frontend-filters-830-haptic-mtls-unavailable:
    requires: [ingresses]
    template: |
      {%- var blocked = map[string]any{} %}
      {%- for _, entry := range incremental_values("mtls-host-policies", "blockedHosts") %}
        {%- var policy = entry.(map[string]any) %}
        {%- blocked[tostring(policy["host"])] = true %}
      {%- end %}
      {%- if len(blocked) > 0 %}
      {{ "\n" }}# haptic/mtls-unavailable — client-cert verification could not be configured
        {%- for _, host := range keys(blocked) %}
          {#- A wildcard Ingress host needs a single-label regex, not `-m end`: the
              suffix form would also deny deeper names (a.b.example.com), which the
              DNS wildcard does not cover and which may be a separate, correctly
              verified route. txn.host is host-header lowercased with the port
              stripped, so the anchors hold. -#}
          {%- var cond = "{ var(txn.host) -m str " + host + " }" %}
          {%- if hasPrefix(host, "*.") %}
            {%- cond = "{ var(txn.host) -m reg ^[^.]+\\." + sanitize_regex(host[2:]) + "$ }" %}
          {%- end %}
      http-request set-var(txn.denied_by) str(mtls_unavailable) if {{ cond }}
      http-request deny deny_status 503 if {{ cond }}
        {%- end %}
      {%- end %}

  # ============================================================================
  # Basic auth — per-route map + frontend challenge
  # ============================================================================
  # Resolves one Ingress's basic-auth settings. result["state"] is "" when the
  # route has no basic auth, else "ok", "missing" (Secret absent) or "nosecret".
  # forSatisfy selects which half of the split this call wants: false for the
  # plain challenge, true for the satisfy=any lane, which needs the same
  # userlist and the same realm rules — the realm is a map value that has to
  # compare equal to the rule's quoted token, so the constraint lives here once.
  util-haptic-basic-auth-route:
    template: |-
      {%- import "util-haptic-satisfy" for SatisfyAnyMode -%}
      {%- macro HapticBasicAuthRoute(ingress *resources.ingresses.T, forSatisfy bool, result map[string]any) -%}
        {%- result["state"] = "" -%}
        {%- var satisfy = SatisfyAnyMode(ingress) == "any" -%}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/auth-type"] == "basic" && satisfy == forSatisfy -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var key = ns + "/" + ingress.Metadata.Name -%}
          {%- var authSecret = ingress.Metadata.Annotations["haproxy-haptic.org/auth-secret"] -%}
          {%- if authSecret == "" -%}
            {%- result["state"] = "nosecret" -%}
          {%- else -%}
            {#- The realm is a quoted config token and a map value that must
                compare equal: no quotes, backslashes, `$` (weak-quote
                expansion), tabs or newlines, and no padding (the map reader
                trims it). -#}
            {%- var realm = strip(ingress.Metadata.Annotations["haproxy-haptic.org/auth-realm"]) -%}
            {%- if realm == "" -%}{%- realm = "Restricted" -%}{%- end -%}
            {%- if !regex_search(realm, "^[^\"\\\\$\\r\\n\\t]*$") -%}
              {{- fail("Invalid auth-realm '" + realm + "' on Ingress '" + key + "': must not contain double-quotes, backslashes, '$', tabs or newlines.") -}}
            {%- end -%}
            {%- var secretNs = ns -%}
            {%- var secretName = authSecret -%}
            {%- if strings_contains(authSecret, "/") -%}
              {%- var parts = split(authSecret, "/") -%}
              {%- secretNs = parts[0] -%}
              {%- secretName = parts[1] -%}
            {%- end -%}
            {%- result["secretRef"] = secretNs + "/" + secretName -%}
            {%- result["userlist"] = "haptic_auth_" + secretNs + "_" + secretName -%}
            {%- result["realm"] = realm -%}
            {%- result["state"] = "ok" -%}
            {%- if resources.secrets.GetSingle(secretNs, secretName) == nil -%}{%- result["state"] = "missing" -%}{%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  map-haptic-basic-auth-routes-900-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-type']"]
    template: |-
      {%- import "util-haptic-basic-auth-route" for HapticBasicAuthRoute -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var route = map[string]any{} -%}
        {{- HapticBasicAuthRoute(ingress, false, route) -}}
        {%- var state = tostring(route["state"]) -%}
        {%- if state == "ok" -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ok {{ route["userlist"] }} {{ route["realm"] }}
        {%- else if state != "" -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} {{ state }}
        {%- end -%}
      {%- end -%}

  # Distinct (userlist, realm) pairs, for the auth rules the frontend block has
  # to spell out; also the fail-closed event. A component cannot both publish
  # and emit text, hence the split from the map producer.
  features-900-haptic-basic-auth-pairs:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-type']"]
      group: haptic-basic-auth-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-basic-auth-route" for HapticBasicAuthRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var route = map[string]any{} -%}
        {{- HapticBasicAuthRoute(ingress, false, route) -}}
        {%- var state = tostring(route["state"]) -%}
        {%- if state != "" -%}
          {{- shared.Publish("any", "any", "any") -}}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if state == "ok" -%}
            {%- var pair = tostring(route["userlist"]) + " " + tostring(route["realm"]) -%}
            {{- shared.Publish("pair", pair, pair) -}}
          {%- else if state == "missing" -%}
            {#- A warning, never an admission rejection: the webhook's store lags
                the API server, so "missing" and "not observed yet" are the same
                here, and rejecting refused correct manifests applied in order. -#}
            {{- recordEvent(ingress, "AuthSecretMissing", "Ingress " + key + " sets 'haproxy-haptic.org/auth-type: basic' with 'auth-secret: " + tostring(route["secretRef"]) + "', but that Secret does not exist. Basic auth cannot be enforced without it, so this route fails closed with 503. Create the Secret, or remove the auth annotations.") -}}
          {%- else -%}
            {{- WebhookRejectOrWarn(ingress, "AuthSecretMissing", "Ingress " + key + " sets 'haproxy-haptic.org/auth-type: basic' but no 'haproxy-haptic.org/auth-secret'. Basic auth cannot be enforced without the credentials Secret, so this route fails closed with 503. Set auth-secret, or remove auth-type.") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # Basic-auth challenge: one block per HTTP frontend. Band 900: after every
  # request check the backend rule used to follow (the rate limits at 863, the
  # backend-TLS-unavailable 503 at 899), so an unauthenticated request is still
  # rate-limited before it is challenged.
  # ==========================================================================
  frontend-filters-900-haptic-basic-auth:
    requires: [ingresses]
    template: |
      {#
        Annotations:
          - haproxy-haptic.org/auth-type: "basic" (required)
          - haproxy-haptic.org/auth-secret: "<ns/name>" | "<name>" (required)
          - haproxy-haptic.org/auth-realm: "<realm>" (default "Restricted")

        The route's state, userlist and realm come from
        haptic-basic-auth-routes.map. `auth realm` and http_auth() take
        literals only, so there is one rule per distinct (userlist, realm)
        pair, selected by comparing the whole map value. A route whose Secret
        is absent or unset is denied 503. satisfy=any routes are not in the
        map: backend-directives-825 owns their IP-or-auth gate. Emitted only
        while a route uses basic auth; the first one reloads once, as does
        removing the last or adding a pair.
      #}
      {%- if incremental_value_count("haptic-basic-auth-routes", "any") > 0 -%}
      {%- var routes, e1 = pathResolver.GetPath("haptic-basic-auth-routes.map", "map") -%}
      {%- if e1 != nil -%}{{ fail(tostring(e1)) }}{%- end -%}
      {%- var pairs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-basic-auth-routes", "pair") -%}{%- pairs = append(pairs, tostring(v)) -%}{%- end -%}
      {{ "\n" }}# haptic/basic-auth
      http-request set-var(txn.ba_cfg) var(txn.resource_key),map({{ routes }})
      http-request set-var(txn.denied_by) str(basic_auth_unavailable) if { var(txn.ba_cfg) -m str missing nosecret }
      http-request deny deny_status 503 if { var(txn.ba_cfg) -m str missing nosecret }
      {%- for _, p := range sort_strings(pairs) %}
      {%- var pair = strings_splitn(tostring(p), " ", 2) %}
      http-request auth realm "{{ pair[1] }}" if { var(txn.ba_cfg) -m str "ok {{ p }}" } !{ http_auth({{ pair[0] }}) }
      {%- end %}
      {%- end %}

  # ============================================================================
  # satisfy — shared predicate + combined IP-or-auth gate
  # ============================================================================
  util-haptic-satisfy:
    template: |
      {#
        satisfy=any predicate. True (returns "any") only when
        haproxy-haptic.org/satisfy == "any" AND an allowlist
        (haproxy-haptic.org/allowlist-source-range) AND basic auth with a
        resolvable Secret are ALL present — i.e. there are genuinely two gates
        to OR together. The allowlist frontend deny (emitted by the
        access-control fragment) and the basic-auth routes map both import this
        macro and suppress themselves when it returns "any", leaving the
        combined gate below as the single OR check.
      #}
      {%- macro SatisfyAnyMode(ingress *resources.ingresses.T) string -%}
        {%%
          if ingress.Metadata.Annotations["haproxy-haptic.org/satisfy"] != "any" {
            show ""
            return
          }
          if ingress.Metadata.Annotations["haproxy-haptic.org/allowlist-source-range"] == "" {
            show ""
            return
          }
          if ingress.Metadata.Annotations["haproxy-haptic.org/auth-type"] != "basic" {
            show ""
            return
          }
          var authSecret = ingress.Metadata.Annotations["haproxy-haptic.org/auth-secret"]
          if authSecret == "" {
            show ""
            return
          }
          var ns = ingress.Metadata.Namespace
          var secretNs = ns
          var secretName = authSecret
          if strings_contains(authSecret, "/") {
            var parts = split(authSecret, "/")
            secretNs = parts[0]
            secretName = parts[1]
          }
          var sec = resources.secrets.GetSingle(secretNs, secretName)
          if sec == nil {
            show ""
            return
          }
          show "any"
        %%}
      {%- end macro -%}

  # A satisfy=any route publishes into the shared lane; one whose allowlist has
  # an IPv6 entry cannot be partitioned and keeps the backend gate below.
  ingress-satisfy-0825-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/satisfy']"
        - "metadata.annotations['haproxy-haptic.org/allowlist-source-range']"
        - "metadata.annotations['haproxy-haptic.org/auth-type']"
        - "metadata.annotations['haproxy-haptic.org/auth-secret']"
        - "metadata.annotations['haproxy-haptic.org/auth-realm']"
      group: ingress-satisfy
      effects: [publishValue]
    template: |-
      {%- import "util-haptic-basic-auth-route" for HapticBasicAuthRoute -%}
      {%- import "util-satisfy-publish" for PublishSatisfyAny -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var route = map[string]any{} -%}
        {{- HapticBasicAuthRoute(ingress, true, route) -}}
        {%- if tostring(route["state"]) == "ok" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- _ = PublishSatisfyAny(key, ingress.Metadata.Annotations["haproxy-haptic.org/allowlist-source-range"],
            "haproxy-haptic.org/allowlist-source-range", "haptic", tostring(route["userlist"]), tostring(route["realm"])) -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-901-haptic-satisfy-any:
    requires: [ingresses]
    template: |-
      {%- import "util-satisfy-lane" for SatisfyLane -%}
      {{- SatisfyLane("haptic", "") -}}

  backend-directives-825-haptic-satisfy-any:
    template: |
      {#
        HAPTIC satisfy=any combined IP-or-auth gate.

        Emits, in the backend:
          acl haptic_satisfy_ip_<ns>_<name> src <cidrs>
          http-request auth realm "<realm>" if !haptic_satisfy_ip_<ns>_<name> !{ http_auth(<userlist>) }

        The challenge fires only for requests whose source IP is NOT in the
        allow-list AND that have not authenticated — the OR semantics of
        satisfy=any. The standalone allowlist deny (access-control fragment) and
        the frontend basic-auth block (the route is left out of its map) suppress
        themselves for this Ingress via SatisfyAnyMode().

        Only reached when the allowlist carries an IPv6 entry: `cidr_partition`
        cannot cover mixed families, so that route keeps this backend gate while
        every other satisfy route is served by
        frontend-filters-901-haptic-satisfy-any. A backend rule makes the route
        structural, which is the cost of the fallback.
      #}
      {%- import "util-haptic-satisfy" for SatisfyAnyMode -%}
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- if ingress != nil %}
        {%- if SatisfyAnyMode(ingress) != "" && strings_contains(ValidateCidrList(ingress.Metadata.Annotations["haproxy-haptic.org/allowlist-source-range"], "haproxy-haptic.org/allowlist-source-range", ingress.Metadata.Namespace + "/" + ingress.Metadata.Name), ":") %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- var allowlist = ingress.Metadata.Annotations["haproxy-haptic.org/allowlist-source-range"] %}
          {%- var authRealm = ingress.Metadata.Annotations["haproxy-haptic.org/auth-realm"] %}
          {%- if authRealm == "" %}{%- authRealm = "Restricted" %}{%- end %}
          {%- if !regex_search(authRealm, "^[^\"\\r\\n]*$") %}
            {{- fail("Invalid auth-realm '" + authRealm + "' on Ingress '" + key + "': must not contain double-quotes or newlines.") -}}
          {%- end %}
          {%- var authSecret = ingress.Metadata.Annotations["haproxy-haptic.org/auth-secret"] %}
          {%- var secretNs = ns %}
          {%- var secretName = authSecret %}
          {%- if strings_contains(authSecret, "/") %}
            {%- var parts = split(authSecret, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var userlistName = "haptic_auth_" + secretNs + "_" + secretName %}
          {%- var aclName = "haptic_satisfy_ip_" + ns + "_" + name %}
      # haptic/satisfy-any ({{ key }})
      acl {{ aclName }} src {{ ValidateCidrList(allowlist, "haproxy-haptic.org/allowlist-source-range", key) }}
      http-request auth realm "{{ authRealm }}" if !{{ aclName }} !{ http_auth({{ userlistName }}) }
        {%- end %}
      {%- end -%}

  # ============================================================================
  # mTLS — client-cert verification registration (features)
  #
  # Registration MUST precede the shared builders that consume the gf maps
  # within the same features-* glob pass: ssl.yaml's features-150-ssl-crtlist
  # reads gf["clientCertVerifyHosts"], base.yaml's features-185-mtls-error-map
  # reads gf["mtlsErrorHosts"]. These snippets therefore use functional 1NN
  # numbers (mirroring the vendor mTLS snippets at 110 / 150) rather than the
  # 8NN band — an 8NN number would run after the builders and leave the crt-list
  # / mtls-error map empty.
  # ============================================================================
  features-110-haptic-auth-tls:
    requires: [ingresses]
    template: |-
      {{- render "mtls-host-policies-200-haptic-annotations" -}}

  mtls-host-policies-200-haptic-annotations:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/auth-tls-secret']"
        - "metadata.annotations['haproxy-haptic.org/auth-tls-verify-client']"
      group: mtls-host-policies
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {#-
        HAPTIC Client-Cert Verification Registration

        Annotations:
          - haproxy-haptic.org/auth-tls-secret: "<name>" or "<ns>/<name>"
            (Secret with `ca.crt` holding the CA bundle that signed the clients'
            certificates)
          - haproxy-haptic.org/auth-tls-verify-client: "on" | "off" | "optional"
            | "optional_no_ca" (default "on")

        Publishes each referenced Secret's `ca.crt` and per-host verification
        policy for immutable replay by the shared TLS consumers.

        Verify-client mapping (→ HAProxy): on → required; off → no entry;
        optional / optional_no_ca → optional.
      -#}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var secretRef = ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-secret"] %}
        {%- if secretRef != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var verifyClient = ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-verify-client"] | toLower() %}
          {%- if verifyClient == "" %}{%- verifyClient = "on" %}{%- end %}
          {%- if verifyClient != "off" %}
          {%- var verifyMode = "" %}
          {%- if verifyClient == "on" %}
            {%- verifyMode = "required" %}
          {%- else if verifyClient == "optional" || verifyClient == "optional_no_ca" %}
            {%- verifyMode = "optional" %}
          {%- else %}
            {{- fail("Ingress " + ns + "/" + name + " has haproxy-haptic.org/auth-tls-verify-client=" + verifyClient + " which is not one of 'on', 'off', 'optional', 'optional_no_ca'.") -}}
          {%- end %}

          {%- var secretNs = ns %}
          {%- var secretName = secretRef %}
          {%- if strings_contains(secretRef, "/") %}
            {%- var parts = split(secretRef, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var secret = resources.secrets.GetSingle(secretNs, secretName) %}
          {#- An unusable CA bundle used to warn and `continue`, which dropped the
              `ca-file … verify required` clause from the crt-list entry while
              LEAVING THE HOST SERVED — HAPTIC terminates every HTTPS host on one
              shared `bind *:443 ssl crt-list`, and client-cert verification is a
              per-entry option, so there is no separate mTLS listener to refuse the
              handshake. The route kept answering with ordinary server-side TLS and
              mTLS was simply gone.

              Both causes (no Secret, Secret without ca.crt) are the same exposure
              and are handled together: a Warning event, and a runtime deny from
              frontend-filters-830 so the route fails closed instead of serving
              unverified. Deliberately NOT an admission rejection — the webhook
              renders against the watched-resource store, which lags the API
              server, so a Secret created moments earlier is indistinguishable
              from one that is absent. The runtime deny recovers on its own once
              the store catches up. -#}
          {%- var failReason = "" %}
          {%- var failCause = "" %}
          {%- if secret == nil %}
            {%- failReason = "AuthTLSSecretMissing" %}
            {%- failCause = "that Secret does not exist" %}
          {%- else if secret.Data["ca.crt"] == "" %}
            {%- failReason = "AuthTLSSecretMissingCACert" %}
            {%- failCause = "that Secret has no data.ca.crt" %}
          {%- end %}
          {%- if failReason != "" %}
            {{- recordEvent(ingress, failReason, "Ingress " + ns + "/" + name + " sets 'haproxy-haptic.org/auth-tls-secret: " + secretNs + "/" + secretName + "', but " + failCause + ". Client-certificate verification cannot be configured without a CA bundle, so this route fails closed with 503. Fix the Secret, or remove the mTLS annotations.") -}}
            {%- for ruleIndex, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}
                {{- shared.Publish("blockedHosts", "haptic-annotations/" + ns + "/" + name + "/" + tostring(ruleIndex),
                  map[string]any{"host": rule.Host}) -}}
              {%- end %}
            {%- end %}
          {%- else %}
            {%- var caBundle = secret.Data["ca.crt"] | b64decode() | tostring() %}
          {#- Register the CA bundle as a "file" (general/) not "cert" (ssl/):
              HAProxy's runtime cert API takes ssl/ entries as cert+key bundles, but a
              CA bundle has no private key. HAProxy's crt-list `[ca-file <path>]`
              accepts any path. -#}
            {%- var caFilename = secretNs + "-" + secretName + "-client-ca.pem" %}
            {{- shared.Publish("files", "haptic-annotations/" + ns + "/" + name + "/0",
              map[string]any{"filename": caFilename, "content": caBundle}) -}}

            {%- for ruleIndex, rule := range ingress.Spec.Rules %}
              {%- var host = rule.Host %}
              {%- if host == "" %}
                {{- fail("Ingress " + ns + "/" + name + " has haproxy-haptic.org/auth-tls-secret set but a rule without a host. Client-cert verification is keyed by SNI / host; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
              {%- end %}
              {{- shared.Publish("verifyHosts", "haptic-annotations/" + ns + "/" + name + "/" + tostring(ruleIndex), map[string]any{
                "host": host, "route": ns + "/" + name, "filename": caFilename, "verifyMode": verifyMode,
              }) -}}
            {%- end %}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  features-140-haptic-auth-tls-error:
    requires: [ingresses]
    template: |-
      {{- render "mtls-host-policies-400-haptic-annotations-error" -}}

  mtls-host-policies-400-haptic-annotations-error:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-tls-error-page']"]
      group: mtls-host-policies
      effects: [publishValue]
    template: |-
      {#
        HAPTIC auth-tls-error-page — registers host→error-page URL into the
        shared gf["mtlsErrorHosts"]. base.yaml features-185-mtls-error-map builds
        mtls-error.map and frontend-filters-075-mtls-error emits the
        ssl_c_verify-gated redirect (map-only, reload-free).
        Annotation: haproxy-haptic.org/auth-tls-error-page
      #}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var errorPage = ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-error-page"] %}
        {%- if errorPage != "" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- if regex_search(errorPage, "[[:cntrl:]]") %}{{ fail("Invalid URL in annotation 'haproxy-haptic.org/auth-tls-error-page' on Ingress '" + key + "': must not contain control characters (newlines/tabs) — config-injection guard.") }}{%- end %}
          {%- for ruleIndex, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {{- shared.Publish("errorHosts", "haptic-annotations/" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + "/" + tostring(ruleIndex),
                map[string]any{"host": toLower(rule.Host), "location": errorPage}) -}}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # ============================================================================
  # mTLS — client-cert passthrough headers (frontend-filters)
  # ============================================================================
  features-900-haptic-fragment-689-auth-tls-cert-header-strip:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-tls-cert-header']"]
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cert-header"] == "true" -%}
        {{- shared.Publish("fragments", "global", "\n# haptic/auth-tls-cert-header — drop any client-supplied identity headers\n      http-request del-header X-SSL-Client-CN\n      http-request del-header X-SSL-Client-DN\n      http-request del-header X-SSL-Client-Cert") -}}
      {%- end -%}

  # Sanitize before certificate-header writers at priority 690 and above.
  frontend-filters-689-haptic-auth-tls-cert-header-strip:
    requires: [ingresses]
    template: |-
      {%- for _, fragment := range incremental_values("features-900-haptic-fragment-689-auth-tls-cert-header-strip", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}

  # auth-tls-cert-header: the X-SSL-Client-* headers for a route that opted in,
  # from haptic-cert-header-routes.map ("<route id>" -> 1); the strip above
  # stays unconditional. No per-route literal, so one block serves every route.
  features-820-haptic-auth-tls-cert-header:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-tls-cert-header']"]
      group: haptic-cert-header
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cert-header"] == "true" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {{- shared.Publish("any", "any", "any") -}}
        {{- shared.Publish("route", key, key + " 1") -}}
      {%- end -%}

  frontend-filters-820-haptic-auth-tls-cert-header:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-cert-header", "any") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("hapticCertHeaderMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("haptic-cert-header", "route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haptic-cert-header-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
      %%}
      {{ "\n" }}# haptic/auth-tls-cert-header
      http-request set-header X-SSL-Client-CN %[ssl_c_s_dn(CN)] if { ssl_c_used } { var(txn.resource_key),map({{ routes }}) -m found }
      http-request set-header X-SSL-Client-DN %[ssl_c_s_dn] if { ssl_c_used } { var(txn.resource_key),map({{ routes }}) -m found }
      http-request set-header X-SSL-Client-Cert %[ssl_c_der,base64] if { ssl_c_used } { var(txn.resource_key),map({{ routes }}) -m found }
      {%- end %}

  # auth-tls-match-subject: one rule per route, because HAProxy can't take a regex from a map.
  frontend-filters-076-haptic-auth-tls-match-subject:
    requires: [ingresses]
    template: |
      {{- render "haptic-match-subject-publications" -}}
      {%- for _, rule := range incremental_values("haptic-match-subject", "rule") %}
      {{ tostring(rule) }}
      {%- end %}

  haptic-match-subject-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-tls-match-subject']"]
      group: haptic-match-subject
      effects: [publishValue]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- import "util-haptic-require-client-cert-verify" for RequireClientCertVerify -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var pattern = ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-match-subject"] -%}
        {%- if pattern != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {{- RequireClientCertVerify(ingress, "haproxy-haptic.org/auth-tls-match-subject") -}}
          {%- var injection = ConfigInjectionKind(pattern, "line") -%}
          {%- if injection != "" -%}
            {{- fail("Ingress " + key + " has haproxy-haptic.org/auth-tls-match-subject with " + injection + ", which would break the client-certificate check. Remove it from the pattern.") -}}
          {%- end -%}
          {{- shared.Publish("rule", key, "# haptic/auth-tls-match-subject (" + key + ")\nhttp-request deny deny_status 403 if { var(txn.resource_key) -m str " + key + " } !{ ssl_c_s_dn(,0,rfc2253) -m reg \"" + EscapeDquoteValue(pattern) + "\" }") -}}
        {%- end -%}
      {%- end -%}

  # A certificate the route's own host doesn't verify proves nothing about the caller.
  util-haptic-require-client-cert-verify:
    template: |-
      {%- macro RequireClientCertVerify(ingress *resources.ingresses.T, annotation string) -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- if ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-secret"] == "" -%}
          {{- fail("Ingress " + key + " sets " + annotation + " without haproxy-haptic.org/auth-tls-secret, so no client certificate is verified for its hosts and the annotation can't be enforced. Add haproxy-haptic.org/auth-tls-secret.") -}}
        {%- end -%}
        {%- if toLower(ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-verify-client"]) == "off" -%}
          {{- fail("Ingress " + key + " sets " + annotation + " with haproxy-haptic.org/auth-tls-verify-client: off, so no client certificate is verified for its hosts and the annotation can't be enforced. Set auth-tls-verify-client to on or optional.") -}}
        {%- end -%}
      {%- end macro -%}

  # auth-tls-cn-header: one del/set pair per distinct header name, selected by
  # haptic-cn-header-routes.map ("<route id>|<lowercased header>" -> 1).
  features-821-haptic-auth-tls-cn-header:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-tls-cn-header']"]
      group: haptic-cn-header
      effects: [publishValue]
    template: |-
      {%- import "util-haptic-require-client-cert-verify" for RequireClientCertVerify -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var header = strip(ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cn-header"]) -%}
        {%- if header != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {{- RequireClientCertVerify(ingress, "haproxy-haptic.org/auth-tls-cn-header") -}}
          {%- if !regex_search(header, "^[A-Za-z0-9!$&*+.^_~-]+$") -%}
            {{- fail("Ingress " + key + " has haproxy-haptic.org/auth-tls-cn-header '" + header + "', which isn't a valid header name, so the CN can't be forwarded. Use letters, digits and '-'.") -}}
          {%- end -%}
          {{- shared.Publish("name", key, header) -}}
          {{- shared.Publish("route", key, key + "|" + toLower(header) + " 1") -}}
        {%- end -%}
      {%- end -%}

  frontend-filters-821-haptic-auth-tls-cn-header:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-cn-header", "route") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("hapticCNHeaderMap", func() any {
          var lines = []string{}
          for _, r := range sort_strings(incremental_values("haptic-cn-header", "route")) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haptic-cn-header-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
        var names = sort_strings(incremental_values("haptic-cn-header", "name")) | unique_by(n => toLower(tostring(n)))
      %%}
      {{ "\n" }}# haptic/auth-tls-cn-header
      {%- for _, name := range names %}
      {%- var match = "{ var(txn.resource_key),concat(|" + toLower(tostring(name)) + "),map(" + routes + ") -m found }" %}
      http-request del-header {{ name }} if {{ match }}
      http-request set-header {{ name }} %[ssl_c_s_dn(CN)] if { ssl_c_used } {{ match }}
      {%- end %}
      {%- end %}

  # ============================================================================
  # External auth (SPOE) — map contributions
  #   Requires spoaHub.plugins.external-auth. The spoa-hub frontend wiring
  #   (frontend-spoe-filters-100-external-auth) self-gates on the check-auth
  #   message being present in the messages union; these snippets only feed the
  #   maps. Keyed by <ns>/<name> (resource id) — matches base.yaml's
  #   txn.resource_key extraction, so any path/host type the routing chain
  #   resolved is covered.
  # ============================================================================
  map-auth-url-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-url']"]
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {%- if authUrl != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- if regex_search(authUrl, "[[:cntrl:]]") -%}
            {{- fail("Invalid value for annotation 'haproxy-haptic.org/auth-url' on Ingress '" + ns + "/" + name + "': must not contain control characters — config-injection guard.") -}}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authUrl }}
        {%- end -%}
      {%- end -%}

  map-auth-signin-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-signin']"]
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authSignin = ingress.Metadata.Annotations["haproxy-haptic.org/auth-signin"] -%}
        {%- if authSignin != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- if regex_search(authSignin, "[[:cntrl:]]") -%}
            {{- fail("Invalid value for annotation 'haproxy-haptic.org/auth-signin' on Ingress '" + ns + "/" + name + "': must not contain control characters — config-injection guard.") -}}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authSignin }}
        {%- end -%}
      {%- end -%}

  map-auth-method-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-method']"]
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authMethod = ingress.Metadata.Annotations["haproxy-haptic.org/auth-method"] -%}
        {%- if authMethod != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {#- Single-token guard: the method is threaded into the SPOE check-auth
              `method` arg; reject whitespace / control characters. -#}
          {%- if !regex_search(authMethod, "^[A-Za-z]+$") -%}
            {{- fail("Invalid value '" + authMethod + "' for annotation 'haproxy-haptic.org/auth-method' on Ingress '" + ns + "/" + name + "': must be a single alphabetic HTTP method token.") -}}
          {%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ authMethod }}
        {%- end -%}
      {%- end -%}

  # auth-headers-request → auth-forward-headers.map (SPOE forward_headers arg).
  map-auth-forward-headers-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-headers-request']"]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var authHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-request"] -%}
        {%- if authHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var forwarded = []string{} -%}
          {%- for _, h := range split(authHeaders, ",") -%}
            {%- var hn = h | strip() -%}
            {%- if hn == "" -%}{%- continue -%}{%- end -%}
            {{- ValidateAuthHeaderName(hn, "haproxy-haptic.org/auth-headers-request", ns, name) -}}
            {#- The plugin matches X_Api_Key to X-Api-Key; features-900 warns about it. -#}
            {%- if !regex_search(hn, "_") -%}{%- forwarded = append(forwarded, hn) -%}{%- end -%}
          {%- end -%}
          {%- if len(forwarded) > 0 -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ join(forwarded, ", ") }}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Auto-extend the SPOE check-auth message body's `args=` line with a
  # `hdr_<name>=req.hdr(<Name>)` capture per unique auth-headers-request header
  # across all ingresses, so operators don't hand-edit spoe-message-check-auth-body.
  # The six standard headers spoa-hub already captures are pre-seeded (underscore
  # form) to avoid duplicate args (HAProxy 3.0 rejects duplicate SPOE arg names).
  features-900-haptic-auth-extra-args-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-headers-request']"]
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName, RejectUnderscoreAuthHeader -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var authHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-request"] -%}
        {%- if authHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, h := range split(authHeaders, ",") -%}
            {%- var hn = h | strip() -%}
            {%- if hn != "" -%}
              {{- ValidateAuthHeaderName(hn, "haproxy-haptic.org/auth-headers-request", ns, name) -}}
              {%- if regex_search(hn, "_") -%}
                {{- RejectUnderscoreAuthHeader(ingress, hn, "haproxy-haptic.org/auth-headers-request", ns, name) -}}
                {%- continue -%}
              {%- end -%}
              {%- var argName = replace(toLower(hn), "-", "_") -%}
              {%- if argName != "authorization" && argName != "cookie" &&
                argName != "x_forwarded_for" && argName != "x_forwarded_proto" &&
                argName != "x_forwarded_host" && argName != "x_forwarded_uri" -%}
                {{- shared.Publish("args", argName, " hdr_" + argName + "=req.hdr(" + hn + ")") -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  spoe-message-check-auth-extra-args-820-haptic:
    requires: [ingresses]
    template: |-
      {%- for _, arg := range incremental_values("features-900-haptic-auth-extra-args-publications", "args") -%}
        {{- tostring(arg) -}}
      {%- end -%}

  # auth-headers-succeed ∪ auth-headers-fail → auth-extract-headers.map.
  map-auth-extract-headers-820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/auth-headers-succeed']"
        - "metadata.annotations['haproxy-haptic.org/auth-headers-fail']"
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var passHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-succeed"] -%}
        {%- var failHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-fail"] -%}
        {%- var union = passHeaders -%}
        {%- if passHeaders != "" && failHeaders != "" -%}
          {%- union = passHeaders + ", " + failHeaders -%}
        {%- else if failHeaders != "" -%}
          {%- union = failHeaders -%}
        {%- end -%}
        {%- if union != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ union }}
        {%- end -%}
      {%- end -%}

  # One http-request set-header per unique auth-headers-succeed header, gated on
  # auth success. Per-route gating is implicit (the plugin only sets the txn var
  # for routes whose extract_headers arg listed the header). Rendered inside
  # frontend-filters-* for both HTTP frontends — a local map dedup (not
  # first_seen) keeps both frontend renders in sync (issue #49).
  features-900-haptic-fragment-spoe-pass-headers-820:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-headers-succeed']"]
      effects: [publishValue]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var passHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-succeed"] -%}
        {%- if passHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, h := range split(passHeaders, ",") -%}
            {%- var hn = h | strip() -%}
            {%- if hn != "" -%}
              {{- ValidateAuthHeaderName(hn, "haproxy-haptic.org/auth-headers-succeed", ns, name) -}}
              {%- var varName = replace(toLower(hn), "-", "_") -%}
              {{- shared.Publish("fragments", varName,
                "\n      http-request del-header " + hn + " if { var(txn.auth_url) -m found }" +
                "\n      http-request set-header " + hn + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.hub.external_auth." + varName + ") -m found } { var(txn.hub.external_auth.allowed) -m bool }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-spoe-set-pass-headers-820-haptic:
    requires: [ingresses]
    template: |-
      {%- for _, fragment := range incremental_values("features-900-haptic-fragment-spoe-pass-headers-820", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}

  # One http-after-response set-header per unique auth-headers-fail header,
  # surfaced to the client on auth failure. http-after-response (not
  # http-response) is required because `http-request deny` short-circuits the
  # backend response path.
  features-900-haptic-fragment-spoe-fail-headers-820:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/auth-headers-fail']"]
      effects: [publishValue]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var failHeaders = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-fail"] -%}
        {%- if failHeaders != "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- for _, h := range split(failHeaders, ",") -%}
            {%- var hn = h | strip() -%}
            {%- if hn != "" -%}
              {{- ValidateAuthHeaderName(hn, "haproxy-haptic.org/auth-headers-fail", ns, name) -}}
              {%- var varName = replace(toLower(hn), "-", "_") -%}
              {{- shared.Publish("fragments", varName,
                "\n      http-after-response set-header " + hn + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.auth_url) -m found } !{ var(txn.hub.external_auth.allowed) -m bool } { var(txn.hub.external_auth." + varName + ") -m found }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-spoe-set-fail-headers-820-haptic:
    requires: [ingresses]
    template: |-
      {%- for _, fragment := range incremental_values("features-900-haptic-fragment-spoe-fail-headers-820", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}

  # ============================================================================
  # OAuth2-proxy — desugars onto the external-auth machinery
  #   haproxy-haptic.org/oauth (oauth2-proxy only) derives the oauth2-proxy
  #   backend from the Ingress's own oauth-uri-prefix path (default /oauth2).
  #   auth-url takes precedence, so the desugaring is skipped when auth-url is
  #   also set on the same Ingress.
  # ============================================================================
  map-auth-url-825-haptic-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/oauth']"
        - "metadata.annotations['haproxy-haptic.org/auth-url']"
        - "metadata.annotations['haproxy-haptic.org/oauth-uri-prefix']"
      effects: [recordEvent]
    template: |-
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-haptic.org/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {%- if oauth != "" && authUrl == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- if oauth != "oauth2_proxy" && oauth != "oauth2-proxy" -%}
            {{- fail("Invalid value '" + oauth + "' for annotation 'haproxy-haptic.org/oauth' on Ingress '" + ns + "/" + name + "'. Only 'oauth2-proxy' (or 'oauth2_proxy') is supported.") -}}
          {%- end -%}
          {%- var prefix = ingress.Metadata.Annotations["haproxy-haptic.org/oauth-uri-prefix"] -%}
          {%- if prefix == "" -%}{%- prefix = "/oauth2" -%}{%- end -%}
          {%- var prefixInj = ConfigInjectionKind(prefix, "mapkey") -%}
          {%- if prefixInj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Ingress " + ns + "/" + name + " annotation 'haproxy-haptic.org/oauth-uri-prefix' value contains " + prefixInj + ", which would inject an entry into the auth routing map; the OAuth route is not applied. Remove whitespace and control characters from the value.") -}}
            {%- continue -%}
          {%- end -%}
          {%- if len(prefix) > 1 && hasSuffix(prefix, "/") -%}{%- prefix = prefix[:len(prefix)-1] -%}{%- end -%}
          {%- var emitted = false -%}
          {%- for _, path := range ingress.Spec.Rules[*].Http.Paths -%}
            {%- if !emitted && path.Path == prefix && path.Backend.Service.Name != "" -%}
              {%- var parts = split(ResolveServicePort(ns, path.Backend.Service.Name, path.Backend.Service.Port, ingress), " ") -%}
      {{ "\n" }}{{ ns }}/{{ name }} http://{{ path.Backend.Service.Name }}.{{ ns }}.svc:{{ parts[0] }}{{ prefix }}/auth
              {%- emitted = true -%}
            {%- end -%}
          {%- end -%}
          {%- if !emitted -%}
            {{- fail("Ingress '" + ns + "/" + name + "' sets 'haproxy-haptic.org/oauth: " + oauth + "' but has no Ingress path '" + prefix + "' routing to the oauth2-proxy Service. Add a path for '" + prefix + "' (the oauth2-proxy backend is derived from that path).") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  map-auth-signin-825-haptic-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/oauth']"
        - "metadata.annotations['haproxy-haptic.org/auth-url']"
        - "metadata.annotations['haproxy-haptic.org/auth-signin']"
        - "metadata.annotations['haproxy-haptic.org/oauth-uri-prefix']"
      effects: [recordEvent]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-haptic.org/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {#- An explicit auth-signin (its -820- snippet renders first) takes
            precedence over the oauth desugaring. -#}
        {%- var authSignin = ingress.Metadata.Annotations["haproxy-haptic.org/auth-signin"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authSignin == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var prefix = ingress.Metadata.Annotations["haproxy-haptic.org/oauth-uri-prefix"] -%}
          {%- if prefix == "" -%}{%- prefix = "/oauth2" -%}{%- end -%}
          {%- var prefixInj = ConfigInjectionKind(prefix, "mapkey") -%}
          {%- if prefixInj != "" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Ingress " + ns + "/" + name + " annotation 'haproxy-haptic.org/oauth-uri-prefix' value contains " + prefixInj + ", which would inject an entry into the auth routing map; the OAuth route is not applied. Remove whitespace and control characters from the value.") -}}
            {%- continue -%}
          {%- end -%}
          {%- if len(prefix) > 1 && hasSuffix(prefix, "/") -%}{%- prefix = prefix[:len(prefix)-1] -%}{%- end -%}
      {{ "\n" }}{{ ns }}/{{ name }} {{ prefix }}/start?rd=%[path]
        {%- end -%}
      {%- end -%}

  map-auth-method-825-haptic-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/oauth']"
        - "metadata.annotations['haproxy-haptic.org/auth-url']"
        - "metadata.annotations['haproxy-haptic.org/auth-method']"
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-haptic.org/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {#- Explicit auth-method takes precedence over the oauth desugaring. -#}
        {%- var authMethod = ingress.Metadata.Annotations["haproxy-haptic.org/auth-method"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authMethod == "" -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} HEAD
        {%- end -%}
      {%- end -%}

  map-auth-extract-headers-825-haptic-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/oauth']"
        - "metadata.annotations['haproxy-haptic.org/auth-url']"
        - "metadata.annotations['haproxy-haptic.org/auth-headers-succeed']"
        - "metadata.annotations['haproxy-haptic.org/oauth-headers']"
    template: |-
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-haptic.org/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {#- Explicit auth-headers-succeed owns the extract-headers channel. -#}
        {%- var authHeadersSucceed = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-succeed"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authHeadersSucceed == "" -%}
          {%- var headers = ingress.Metadata.Annotations["haproxy-haptic.org/oauth-headers"] -%}
          {%- if headers == "" -%}{%- headers = "X-Auth-Request-Email" -%}{%- end -%}
      {{ "\n" }}{{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} {{ headers }}
        {%- end -%}
      {%- end -%}

  features-900-haptic-fragment-spoe-pass-headers-825-oauth:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/oauth']"
        - "metadata.annotations['haproxy-haptic.org/auth-url']"
        - "metadata.annotations['haproxy-haptic.org/auth-headers-succeed']"
        - "metadata.annotations['haproxy-haptic.org/oauth-headers']"
      effects: [publishValue]
    template: |-
      {%- import "util-auth-validate-header-name" for ValidateAuthHeaderName -%}
      {#- Forward the oauth-headers (default X-Auth-Request-Email) from the
          oauth2-proxy auth reply to the backend on success; only active for the
          oauth desugaring (auth-url absent, explicit auth-headers-succeed
          absent). -#}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var oauth = ingress.Metadata.Annotations["haproxy-haptic.org/oauth"] -%}
        {%- var authUrl = ingress.Metadata.Annotations["haproxy-haptic.org/auth-url"] -%}
        {%- var authHeadersSucceed = ingress.Metadata.Annotations["haproxy-haptic.org/auth-headers-succeed"] -%}
        {%- if (oauth == "oauth2_proxy" || oauth == "oauth2-proxy") && authUrl == "" && authHeadersSucceed == "" -%}
          {%- var ns = ingress.Metadata.Namespace -%}
          {%- var name = ingress.Metadata.Name -%}
          {%- var headers = ingress.Metadata.Annotations["haproxy-haptic.org/oauth-headers"] -%}
          {%- if headers == "" -%}{%- headers = "X-Auth-Request-Email" -%}{%- end -%}
          {%- for _, h := range split(headers, ",") -%}
            {%- var htok = h | strip() -%}
            {#- oauth-headers items may be <header>[:<source>]; key on the header name. -#}
            {%- var hn = htok -%}
            {%- if index(htok, ":") > 0 -%}{%- hn = htok[:index(htok, ":")] | strip() -%}{%- end -%}
            {%- if hn != "" -%}
              {{- ValidateAuthHeaderName(hn, "haproxy-haptic.org/oauth-headers", ns, name) -}}
              {%- var varName = replace(toLower(hn), "-", "_") -%}
              {{- shared.Publish("fragments", varName,
                "\n      http-request del-header " + hn + " if { var(txn.auth_url) -m found }" +
                "\n      http-request set-header " + hn + " %[var(txn.hub.external_auth." + varName + ")] if { var(txn.hub.external_auth." + varName + ") -m found } { var(txn.hub.external_auth.allowed) -m bool }") -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-spoe-set-pass-headers-825-haptic-oauth:
    requires: [ingresses]
    template: |-
      {%- for _, fragment := range incremental_values("features-900-haptic-fragment-spoe-pass-headers-825-oauth", "fragments") -%}{{- tostring(fragment) -}}{%- end -%}
