templateSnippets:
  haptic-waf-ingress-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: |-
        {%- import "util-waf-governance" for WafGovernance -%}
        {%- var gov = map[string]any{} -%}
        {%- var _ = WafGovernance(gov) -%}
        {{- toJSON(map[string]any{"ingresses": map[string]any{
          "allIngresses": gov["dispatchMode"] == "default-on" || tostring(gov["defaultPolicy"]) != "",
        }}) -}}
      group: haptic-waf-ingresses
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var namespace = ingress.Metadata.Namespace -%}
        {%- var name = ingress.Metadata.Name -%}
        {%- var annotations = map[string]any{} -%}
        {%- var nativeWAF = false -%}
        {%- for _, key := range []string{
          "haproxy-haptic.org/waf-mode",
          "haproxy-haptic.org/waf-policy",
        } -%}
          {%- var value = ingress.Metadata.Annotations[key] -%}
          {%- if strip(value) != "" -%}
            {%- annotations[key] = value -%}
            {%- nativeWAF = true -%}
          {%- end -%}
        {%- end -%}
        {%- if props["allIngresses"].(bool) || nativeWAF -%}
          {%- for _, key := range []string{
            "haproxy-haptic.org/backend-protocol",
            "nginx.ingress.kubernetes.io/backend-protocol",
          } -%}
            {%- var value = ingress.Metadata.Annotations[key] -%}
            {%- if value != "" %}{%- annotations[key] = value %}{%- end -%}
          {%- end -%}
          {{- shared.Publish("resources", namespace + "/" + name, map[string]any{
            "namespace": namespace,
            "name": name,
            "annotations": annotations,
            "resource": map[string]any{
              "apiVersion": resources.ingresses.APIVersion(),
              "kind": "Ingress",
              "metadata": map[string]any{"namespace": namespace, "name": name},
            },
          }) -}}
        {%- end -%}
      {%- end -%}

  # Central scan/validation pass. Its name sorts after the nginx-ingress vendor
  # scan in spoa-hub's util-*-coraza-scan glob, so it preserves vendor apps and
  # appends HAPTIC apps instead of clobbering them.
  util-waf-haptic-coraza-scan:
    template: |-
      {{- render "util-policy-waf-catalog-scan" -}}
      {%- var _, _ = shared.ComputeIfAbsent("hapticWafIngressPublications", func() any {
        return render "haptic-waf-ingress-publications"
      }) -%}
      {%%
        var _, _ = shared.ComputeIfAbsent("sphCorazaScanHaptic", func() any {
          var _, _ = shared.ComputeIfAbsent("globalFeatures", func() any { return map[string]any{} })
          var gf = shared.Get("globalFeatures").(map[string]any)

          var catalog = shared.Get("wafCatalog").(map[string]any)
          var corazaEnabled = catalog["corazaEnabled"].(bool)
          var corazaBaseDirectives = catalog["corazaBaseDirectives"].(string)
          var governanceEnabled = catalog["governanceEnabled"].(bool)
          var allowPolicySelection = catalog["allowPolicySelection"].(bool)
          var allowEnforcementOverride = catalog["allowEnforcementOverride"].(bool)
          var selfServiceEnabled = catalog["selfServiceEnabled"].(bool)
          var dispatchDefaultEnforcement = catalog["dispatchDefaultEnforcement"].(string)
          var dispatchMode = catalog["dispatchMode"].(string)
          var defaultPolicy = catalog["defaultPolicy"].(string)
          var policyCatalogConfigured = catalog["policyCatalogConfigured"].(bool)
          var maxBodyBytes = catalog["maxBodyBytes"].(string)
          var policyConfiguration = to_str_map(catalog["policyConfiguration"])
          var policySafety = to_str_map(catalog["policySafety"])
          var policyBodyMode = to_str_map(catalog["policyBodyMode"])
          var policySetupDirectives = to_str_map(catalog["policySetupDirectives"])
          var policyContentMode = to_str_map(catalog["policyContentMode"])
          var policyMaxBody = to_str_map(catalog["policyMaxBody"])
          var policyEnforcement = to_str_map(catalog["policyEnforcement"])
          var policySource = to_str_map(catalog["policySource"])
          var trustedBrokenPolicy = to_str_map(catalog["trustedBrokenPolicy"])
          var selfServiceBrokenCatalog = to_str_map(catalog["selfServiceBrokenCatalog"])
          var selfServiceBrokenPolicy = to_str_map(catalog["selfServiceBrokenPolicy"])

          // Preserve apps produced by vendor compatibility libraries. New app
          // entries use appName directly; legacy entries derive ns/name.
          var appsByName = map[string]any{}
          for _, existing := range (gf | dig("sphCorazaApps") | fallback([]any{}) | toSlice()) {
            var e = existing.(map[string]any)
            var appName = ""
            if e["appName"] != nil {
              appName = e["appName"].(string)
            } else {
              appName = e["ns"].(string) + "/" + e["name"].(string)
            }
            appsByName[appName] = e
          }

          var rules = []any{}
          var brokenRoutes = []any{}
          // Vendor and native per-Ingress applications consume the same Coraza
          // application map and therefore share one admission bound.
          for _, ingressAny := range incremental_values("haptic-waf-ingresses", "resources") {
            var ingressRecord = ingressAny.(map[string]any)
            var ns = tostring(ingressRecord["namespace"])
            var name = tostring(ingressRecord["name"])
            var resourceID = ns + "/" + name
            var annotations = to_str_map(ingressRecord["annotations"])
            var ingress = ingressRecord["resource"]
            var mode = strip(annotations["haproxy-haptic.org/waf-mode"])
            var requestedPolicy = strip(annotations["haproxy-haptic.org/waf-policy"])
            var policy = ""
            var selectedSelfService = false
            var routeBrokenReason = ""
            // A route-scoped violation hard-fails ONLY when this route's own
            // resource is the one under admission review (admissionSubject is
            // controller-set from the webhook overlay; empty on reconcile,
            // config-proposal, and bulk renders). Violations on any other —
            // already present — resource record a Warning Event and fail
            // closed per-route (503 via frontend-filters-113), so one bad
            // existing Ingress can never wedge an unrelated admission or a
            // HAProxyTemplateConfig update. First reason wins; later checks
            // for an already-broken route are skipped.
            var subjectMatchesStore = tostring(admissionSubject | dig("store") | fallback("")) == "ingresses" || tostring(admissionSubject | dig("stores", "ingresses") | fallback(false)) == "true"
            var underAdmission = renderMode == "admission" && subjectMatchesStore && tostring(admissionSubject | dig("namespace") | fallback("")) == ns && tostring(admissionSubject | dig("name") | fallback("")) == name
            var rejectRoute = func(reason string, message string) {
              if underAdmission { fail(message) }
              if routeBrokenReason != "" { return }
              recordEvent(ingress, reason, message)
              routeBrokenReason = message
            }
            if requestedPolicy != "" && !allowPolicySelection {
              rejectRoute("WafPermissionDenied", "Ingress " + resourceID + " sets waf-policy, but the HAPTIC administrator disabled Ingress policy selection. Remove the annotation; default policy '" + defaultPolicy + "' applies automatically.")
            }
            // Resolve the requested name: trusted catalog first (bare global
            // names), then the Ingress's OWN namespace's self-service catalog
            // ("<ns>/<name>" store keys — structurally distinct, so neither
            // name space can shadow the other). Resolution failures are
            // scoped: under the admission webhook they fail() (deny the
            // proposed Ingress); on a live render they record a Warning Event
            // and the route fails closed with 503 (frontend-filters-113)
            // instead of serving without the WAF it asked for — and instead
            // of aborting the whole render over one bad route.
            if requestedPolicy != "" {
              var ssStoreKey = ns + "/" + requestedPolicy
              if strings_contains(requestedPolicy, "/") {
                rejectRoute("WafPolicyUnavailable", "Invalid value '" + requestedPolicy + "' for annotation 'haproxy-haptic.org/waf-policy' on Ingress '" + resourceID + "': policy names must not contain '/'. Self-service policies are selectable by bare name from their own namespace only.")
              } else if trustedBrokenPolicy[requestedPolicy] != "" {
                rejectRoute("WafPolicyUnavailable", trustedBrokenPolicy[requestedPolicy])
              } else if selfServiceBrokenPolicy[ssStoreKey] != "" {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "', which failed validation: " + selfServiceBrokenPolicy[ssStoreKey])
              } else if policySource[requestedPolicy] != "" {
                policy = requestedPolicy
              } else if catalog["trustedCatalogUnavailable"] == true {
                rejectRoute("WafPolicyUnavailable", "A trusted WAF catalog is unavailable, so policy '" + requestedPolicy + "' cannot resolve safely. Restore the trusted catalog before selecting namespace policies.")
              } else if policySource[ssStoreKey] != "" {
                policy = ssStoreKey
                selectedSelfService = true
              } else if selfServiceBrokenCatalog[ns] != "" {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "' but its namespace's self-service catalog is broken: " + selfServiceBrokenCatalog[ns])
              } else if !policyCatalogConfigured && !selfServiceEnabled {
                rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " sets 'haproxy-haptic.org/waf-policy' but no reusable WAF policy catalog is configured. Define controller.config.templatingSettings.extraContext.waf.policies.inline/configMapRefs, enable policies.selfService, or remove the annotation.")
              } else {
                var available = []any{}
                for _, existingName := range keys(policySource) {
                  if !strings_contains(existingName, "/") {
                    available = append(available, existingName)
                  } else if hasPrefix(existingName, ns + "/") {
                    available = append(available, existingName[len(ns)+1:])
                  }
                }
                var availableText = "no policies are configured"
                if len(available) > 0 {
                  availableText = "available policies: " + join(available | toStringSlice(), ", ")
                }
                rejectRoute("WafPolicyUnavailable", "Unknown WAF policy '" + requestedPolicy + "' on Ingress " + resourceID + "; " + availableText + ". Policy names are exact and case-sensitive.")
              }
            }
            if policy == "" && routeBrokenReason == "" {
              policy = defaultPolicy
            }
            if policy != "" && trustedBrokenPolicy[policy] != "" {
              rejectRoute("WafPolicyUnavailable", trustedBrokenPolicy[policy])
            }
            if policy != "" && policy == defaultPolicy && dig_string(catalog, "", "defaultPolicyError") != "" {
              rejectRoute("WafPolicyUnavailable", tostring(catalog["defaultPolicyError"]))
            }
            var active = policy != "" || requestedPolicy != ""

            if mode != "" && !active {
              rejectRoute("WafAnnotationInvalid", "Ingress " + resourceID + " sets 'haproxy-haptic.org/waf-mode' without 'haproxy-haptic.org/waf-policy'. Select a WAF policy or remove waf-mode.")
            }
            // Catalog-existence and unknown-policy handling live in the
            // scoped resolution block above (rejectRoute) — they deny at
            // admission but fail closed per-route on a live render, so a
            // policy deleted out from under an existing Ingress can no
            // longer abort the whole render.
            // Mixing a native WAF annotation with a vendor WAF annotation on
            // one Ingress is rejected generically (for any family pair) by
            // the cross-family feature-collision guard in the
            // ingress-annotations-compat library, which renders before these
            // map files — so no policy-scoped check is needed here.
            if active && !corazaEnabled {
              fail("Ingress " + resourceID + " sets HAPTIC WAF annotations but the spoaHub coraza plugin is not enabled, so its traffic can't be inspected. Enable spoaHub.plugins.coraza and leave spoaHub.enabled unset or true, or remove the annotations.")
            }
            if !allowEnforcementOverride && mode != "" {
              rejectRoute("WafPermissionDenied", "Ingress " + resourceID + " sets waf-mode, but the HAPTIC administrator disabled Ingress enforcement overrides with extraContext.waf.ingressPermissions.allowEnforcementOverride=false.")
            }

            if policy != "" {
              if mode == "" {
                mode = policyEnforcement[policy]
              }
            } else if mode == "" {
              mode = "deny"
            }
            if mode != "deny" && mode != "detect" {
              rejectRoute("WafAnnotationInvalid", "Invalid value '" + mode + "' for annotation 'haproxy-haptic.org/waf-mode' on Ingress '" + resourceID + "'. Valid values: 'deny', 'detect'.")
            }
            // A tenant-authored policy must not weaken an administrator's
            // default-on baseline: tenant content in detect mode would turn
            // enforcement off for that route. Trusted-catalog policies may
            // (the admin authored or explicitly trusted them).
            if routeBrokenReason == "" && selectedSelfService && dispatchMode == "default-on" && dispatchDefaultEnforcement == "deny" && mode == "detect" {
              rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects self-service WAF policy '" + requestedPolicy + "' with effective enforcement 'detect', which would weaken the default-on baseline enforcement 'deny'. Only trusted-catalog policies may weaken the baseline; use enforcement: deny or ask the HAPTIC administrator to adopt the policy into a trusted catalog.")
            }

            // A route selecting a policy with setup-position fields
            // (allowedMethods/paranoiaLevel/anomalyThreshold) needs the CRS
            // include in the coraza directives to splice the SecActions
            // before — without it the tuning silently wouldn't apply. Checked
            // per-route (not at registration) so a catalog policy that no
            // route selects never trips it, and route-scoped so one such
            // route fails closed rather than aborting the whole render.
            // corazaEnabled is implied: an active route with coraza off is
            // already rejected by the coraza-not-enabled guard above.
            if routeBrokenReason == "" && policy != "" && policySetupDirectives[policy] != "" && !strings_contains(corazaBaseDirectives, "Include @owasp_crs") {
              rejectRoute("WafPolicyUnavailable", "Ingress " + resourceID + " selects WAF policy '" + requestedPolicy + "' which sets allowedMethods/paranoiaLevel/anomalyThreshold/crsSettings or path-scoped ruleExclusions, but spoaHub.plugins.coraza.directives has no 'Include @owasp_crs' line to insert them before. Keep the CRS include in the coraza directives or remove the setup-position fields from the policy.")
            }

            // A broken route always fails closed — even when active is
            // false (e.g. a dangling waf-mode annotation): serving it as if
            // the annotation weren't there would silently ignore declared
            // intent.
            if routeBrokenReason != "" {
              brokenRoutes = append(brokenRoutes, map[string]any{
                "resourceID": resourceID,
                "reason": routeBrokenReason,
              })
            } else if active {
              var bodyMode = "none"
              var contentMode = "any"
              var ruleMaxBodyBytes = maxBodyBytes
              if policy != "" {
                bodyMode = policyBodyMode[policy]
                contentMode = policyContentMode[policy]
                ruleMaxBodyBytes = policyMaxBody[policy]
              }

              // Only the unambiguous gRPC values match. `h2`/`h2-ssl` is how
              // gRPC travels but is equally a bounded HTTP API, so flagging it
              // would reject working configs; haproxy-ingress has no gRPC value
              // to key on.
              //
              // Warn rather than fail closed: the runtime already refuses the
              // streaming calls (408) and inspects the unary ones, so there is
              // no fail-open to close and 503-ing the route would cause the
              // outage the misconfiguration does not.
              if bodyMode == "buffered" {
                var declaredProto = annotations["haproxy-haptic.org/backend-protocol"]
                var nginxProto = annotations["nginx.ingress.kubernetes.io/backend-protocol"]
                var isGRPC = declaredProto == "grpc" || declaredProto == "grpcs" || nginxProto == "GRPC" || nginxProto == "GRPCS"
                if isGRPC {
                  var wafGRPCMessage = "Ingress " + resourceID + " has a gRPC backend and WAF policy '" + policy +
                    "', which buffers request bodies. A gRPC stream never completes its body, so streaming calls fail with 408." +
                    " Set requestBody.mode: none on the policy."
                  if underAdmission { fail(wafGRPCMessage) }
                  recordEvent(ingress, "WafBodyPolicyOnGRPCRoute", wafGRPCMessage)
                }
              }

              var appName = ""
              if policy != "" {
                appName = "policy:" + policy
                if appsByName[appName] == nil {
                  appsByName[appName] = map[string]any{
                    "appName": appName,
                    "source": policySource[policy],
                    "snippet": policyConfiguration[policy] + policySafety[policy],
                    "requestBodyMaxBytes": ruleMaxBodyBytes,
                    "setupDirectives": policySetupDirectives[policy],
                  }
                }
              }

              rules = append(rules, map[string]any{
                "resourceID": resourceID,
                "mode": mode,
                "appName": appName,
                "bodyMode": bodyMode,
                "contentMode": contentMode,
                "maxBodyBytes": ruleMaxBodyBytes,
              })
            }
          }

          var appNames = keys(appsByName)
          var apps = []any{}
          for _, appName := range appNames {
            apps = append(apps, appsByName[appName])
          }
          gf["sphCorazaApps"] = apps
          gf["corazaPolicyRoutes"] = rules
          gf["corazaBrokenRoutes"] = brokenRoutes
          return true
        })
      %%}

  map-haproxy-ingress-waf-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["mode"].(string) }}
      {%- end -%}

  map-coraza-app-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
        {%- if r["appName"].(string) != "" -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["appName"].(string) }}
        {%- end -%}
      {%- end -%}

  map-coraza-body-820-haptic:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, rule := range (gf["corazaPolicyRoutes"].([]any)) -%}
        {%- var r = rule.(map[string]any) -%}
      {{ "\n" }}{{ r["resourceID"].(string) }} {{ r["bodyMode"].(string) }} {{ r["contentMode"].(string) }} {{ r["maxBodyBytes"].(string) }}
      {%- end -%}

  # Fail-closed guard for routes whose selected WAF policy could not be
  # applied (unknown, ambiguous, or failed-validation self-service policy on a
  # live render). The admission webhook rejects proposed changes that would
  # introduce these, so this rule only covers breakage that pre-dates the
  # webhook or raced past it — such routes asked for a WAF and must fail
  # closed with 503 rather than silently serve unprotected.
  frontend-filters-113-haptic-waf-fail-closed:
    template: |-
      {{- render "util-waf-haptic-coraza-scan" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range (gf | dig("corazaBrokenRoutes") | fallback([]any{}) | toSlice()) -%}
        {%- var e = entry.(map[string]any) -%}
      # WARNING haproxy-haptic.org/waf-policy on Ingress {{ e["resourceID"].(string) }}: {{ replace(e["reason"].(string), "\n", " ") }} Failing closed (503) for this route until it is fixed.
      http-request set-var(txn.denied_by) str(waf_policy_unavailable) if { var(txn.resource_key) -m str {{ e["resourceID"].(string) }} }
      http-request deny deny_status 503 if { var(txn.resource_key) -m str {{ e["resourceID"].(string) }} }
      {%- end -%}
