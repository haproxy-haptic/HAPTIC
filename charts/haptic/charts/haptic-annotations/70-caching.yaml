templateSnippets:
  haptic-cache-record-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"enabled": extraContext | dig("cache", "varnish", "enabled") | fallback("false")}}) -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/cache-enable']"
        - "metadata.annotations['haproxy-haptic.org/cache-ttl']"
        - "metadata.annotations['haproxy-haptic.org/cache-exclude-content-types']"
        - "metadata.annotations['haproxy-haptic.org/cache-max-object-size']"
        - "metadata.annotations['haproxy-haptic.org/cache-negative-ttl']"
        - "metadata.annotations['haproxy-haptic.org/cache-stale-while-revalidate']"
        - "metadata.annotations['haproxy-haptic.org/cache-stale-if-error']"
        - "metadata.annotations['haproxy-haptic.org/cache-revalidate']"
        - "metadata.annotations['haproxy-haptic.org/auth-tls-cert-header']"
        - "metadata.annotations['haproxy-haptic.org/auth-tls-cn-header']"
        - "metadata.annotations['haproxy-haptic.org/cache-key']"
        - "metadata.annotations['haproxy-haptic.org/cache-strip-set-cookie']"
      group: haptic-cache-records
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if tostring(props["enabled"]) == "true" && ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" -%}
        {%- var id = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var certIdentityForwarded = ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cert-header"] -%}
        {%- if strip(ingress.Metadata.Annotations["haproxy-haptic.org/auth-tls-cn-header"]) != "" -%}{%- certIdentityForwarded = "true" -%}{%- end -%}
        {{- shared.Publish("records", id, map[string]any{
          "id": id,
          "ttl": ingress.Metadata.Annotations["haproxy-haptic.org/cache-ttl"],
          "excludeContentTypes": ingress.Metadata.Annotations["haproxy-haptic.org/cache-exclude-content-types"],
          "maxObjectSize": ingress.Metadata.Annotations["haproxy-haptic.org/cache-max-object-size"],
          "negativeTTL": ingress.Metadata.Annotations["haproxy-haptic.org/cache-negative-ttl"],
          "staleWhileRevalidate": ingress.Metadata.Annotations["haproxy-haptic.org/cache-stale-while-revalidate"],
          "staleIfError": ingress.Metadata.Annotations["haproxy-haptic.org/cache-stale-if-error"],
          "revalidate": ingress.Metadata.Annotations["haproxy-haptic.org/cache-revalidate"],
          "authTLSCertHeader": certIdentityForwarded,
          "cacheKey": ingress.Metadata.Annotations["haproxy-haptic.org/cache-key"],
          "stripSetCookie": ingress.Metadata.Annotations["haproxy-haptic.org/cache-strip-set-cookie"],
        }) -}}
      {%- end -%}

  # ==========================================================================
  # Frontend routing: excluded paths go straight to the app; everything else on
  # a cache-enabled route goes to varnish_cache. Runs in every client frontend
  # after txn.resource_key is set, before the default use_backend, so these take
  # precedence (first-match wins). The cache-miss loopback never reaches these
  # frontends — Varnish fetches the dedicated backend-fetch port instead.
  # ==========================================================================
  features-900-haptic-fragment-865-cache-route-items:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/cache-enable']"
        - "metadata.annotations['haproxy-haptic.org/cache-exclude-paths']"
      effects: [publishValue]
    template: |-
      {%- var rows = render "util-haptic-cache-exclusion-condition" -%}
      {%- for _, row := range split(rows, "\n") -%}
        {%- if row != "" -%}{{- shared.Publish("exclude", row, row + " 1") -}}{%- end -%}
      {%- end -%}

  util-haptic-cache-exclusion-condition:
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/cache-enable"] == "true" -%}
        {%- var rid = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var excl = ingress.Metadata.Annotations["haproxy-haptic.org/cache-exclude-paths"] -%}
        {%- if excl != "" -%}
          {%- var paths = []string{} -%}
          {%- for _, tok := range split(excl, ",") -%}
            {%- var path = strip(tok) -%}
            {%- if path != "" -%}
              {%- if !regex_search(path, "^/[!-~]*$") -%}{{ fail("Invalid path '" + path + "' in 'haproxy-haptic.org/cache-exclude-paths' on Ingress '" + rid + "'. Must start with '/' and contain no spaces.") }}{%- end -%}
              {%- if strings_contains(path, "|") -%}{{ fail("Invalid path '" + path + "' in 'haproxy-haptic.org/cache-exclude-paths' on Ingress '" + rid + "'. '|' is not allowed: it separates the route from the path in the exclusion map.") }}{%- end -%}
              {%- paths = append(paths, path) -%}
            {%- end -%}
          {%- end -%}
          {%- for _, path := range paths -%}
      {{ rid }}|{{ path }}{{ "\n" }}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # The shared Varnish backend: consistent-hash sharding (bounded-load) over the
  # Varnish pod endpoints, reserved slots for reload-free scaling. It also owns
  # all X-Haptic-Cache-* header injection: del-header first (anti-poisoning),
  # then set the per-route TTL / skip-ct / max-size (from maps) and the custom
  # cache key (per-route, dynamic value).
  # ==========================================================================
