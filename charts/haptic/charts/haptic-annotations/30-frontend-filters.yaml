# HAPTIC-native annotation library — frontend-filters-* handlers.
#
# Best-of-breed superset of the three vendor frontend-filter fragments, exposed
# under the haproxy-haptic.org/* prefix:
#   - forwardfor        (add|update|ifmissing|ignore)
#   - request/response-set-header, src-ip-header (map lane), request-capture (haproxytech)
#   - cors              (the shared CORS map lane — ingress-nginx model)
#   - allow/deny-list   (the shared EmitAnnotationAccessControl macro)
#   - response-cookie-*          (nginx proxy_cookie_* upstream Set-Cookie rewriting, map lane)
#   - response-location-rewrite-* (nginx proxy_redirect Location/Refresh rewriting, map lane)
#
# Public frontend wrappers replay host-scoped fragments from exact per-Ingress
# producers. Snippets sit in the 800-band (600s=haproxy-ingress, 700s=nginx).
templateSnippets:


  # forwardfor: add keeps the client's X-Forwarded-For and appends the client
  # address, update replaces it, ifmissing keeps it or sets the address,
  # ignore forwards it unchanged. Base's forwarded-headers filters apply it.
  ingress-forwardfor-0800-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/forwardfor']"]
      group: ingress-forwardfor
      effects: [publishValue]
    template: |-
      {%- import "util-forwardfor-publish" for PublishForwardFor -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishForwardFor(ingress, "haproxy-haptic.org/forwardfor", map[string]string{"add": "append", "update": "replace", "ifmissing": "ifmissing", "ignore": "ignore"}, "") -}}
      {%- end -%}

  ingress-access-control-0810-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/allowlist-source-range']"
        - "metadata.annotations['haproxy-haptic.org/denylist-source-range']"
        - "metadata.annotations['haproxy-haptic.org/satisfy']"
      group: ingress-access-control
      effects: [publishValue]
    template: |-
      {#
        HAPTIC IP allow/deny-list: rows for the shared map lane
        (util-access-control-lane), or the legacy per-route fragment for a
        list with an IPv6 entry.
        Annotations:
          - haproxy-haptic.org/allowlist-source-range: "CIDR,CIDR,..." (optional)
          - haproxy-haptic.org/denylist-source-range: "CIDR,CIDR,..." (optional)
        Under satisfy=any the combined IP-or-auth gate (backend-directives-825)
        owns the allowlist, so it is left out here; the denylist still applies.
      #}
      {%- import "util-publish-access-control" for PublishAccessControl -%}
      {%- import "util-haptic-satisfy" for SatisfyAnyMode -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var allowKey = "haproxy-haptic.org/allowlist-source-range" -%}
        {%- if SatisfyAnyMode(ingress) == "any" -%}{%- allowKey = "" -%}{%- end -%}
        {%- var fragment = PublishAccessControl(ingress, allowKey, "haproxy-haptic.org/denylist-source-range", "haptic", "haptic/allowlist-source-range ({KEY})", "haptic/denylist-source-range ({KEY})") -%}
        {%- if fragment != "" -%}{{- shared.Publish("fragments:haptic", ingress.Metadata.Namespace + "/" + ingress.Metadata.Name, fragment) -}}{%- end -%}
      {%- end -%}

  frontend-filters-096-haptic-access-control:
    requires: [ingresses]
    template: |-
      {%- import "util-access-control-lane" for AccessControlLane -%}
      {{- AccessControlLane("haptic") -}}

  # Reload-free: request-set-header and response-set-header (newline-separated
  # "<name> <value>" records) become entries in ing-reqhdr.map / ing-reshdr.map
  # (built by ingress.yaml frontend-filters-263-ingress-headers), keyed on the
  # resolved backend. This scopes each header to the ingress's own backends
  # rather than every request for the host — the wildcard/host-less
  # HostMatchCondition gap goes with it.
  features-820-haptic-header-mods:
    template: '{{- "" -}}'

  ingress-header-mods-0820-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/request-set-header']"
        - "metadata.annotations['haproxy-haptic.org/response-set-header']"
      group: ingress-header-mods
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-header-publish" for PublishIngressHeaderContributions -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishIngressHeaderContributions(ingress,
          "haproxy-haptic.org/request-set-header", "haproxy-haptic.org/response-set-header", "\n", " ", "0820-haptic") -}}
      {%- end -%}

  ingress-cors-0830-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/cors-enable']"]
      group: ingress-cors
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-annotation-cors-publish" for IngressCORSPublish -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- IngressCORSPublish(ingress, "haproxy-haptic.org", "haproxy-haptic.org/cors-enable", "86400", "haptic") -}}
      {%- end -%}

  frontend-filters-830-haptic-cors:
    requires: [ingresses]
    template: |-
      {%- import "util-cors-lane" for CorsLane -%}
      {{- CorsLane("haptic") -}}

  # src-ip-header (haproxytech semantics): the trusted client address from a
  # request header, via the shared map lane (util-src-ip-lane). set-src
  # rewrites the address every src-based ACL then evaluates, so the name
  # fails closed on a bad value and the lane is keyed by route, never by an
  # exact host.
  ingress-src-ip-0840-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/src-ip-header']"]
      group: ingress-src-ip
      effects: [publishValue]
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-src-ip-publish" for PublishSrcIPHeader -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/src-ip-header"] != "" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {{- PublishSrcIPHeader(key, ValidateConfigValue(ingress.Metadata.Annotations["haproxy-haptic.org/src-ip-header"], "haproxy-haptic.org/src-ip-header", key, false), "haptic") -}}
      {%- end -%}

  frontend-filters-840-haptic-src-ip-header:
    requires: [ingresses]
    template: |-
      {%- import "util-src-ip-lane" for SrcIPHeaderLane -%}
      {{- SrcIPHeaderLane("haptic") -}}

  # request-capture (haproxytech semantics): capture slots are frontend-wide
  # and positional, so the block emits one `capture request header <name> len
  # <len>` per distinct pair in use; a route on a known pair changes nothing,
  # a new pair reloads once.
  features-850-haptic-request-capture:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/request-capture']"]
      group: haptic-request-capture
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/request-capture"] != "" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var captureLen = ingress.Metadata.Annotations["haproxy-haptic.org/request-capture-len"] -%}
        {%- if captureLen == "" -%}{%- captureLen = "128" -%}{%- end -%}
        {%- if toint(captureLen) <= 0 -%}
          {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + captureLen + "' for annotation 'haproxy-haptic.org/request-capture-len' on Ingress '" + key + "'. Must be a positive integer.") -}}
        {%- else -%}
          {%- for _, line := range split(ingress.Metadata.Annotations["haproxy-haptic.org/request-capture"], "\n") -%}
            {%- var t = trimSpace(line) -%}
            {%- if t != "" -%}
              {%- var pair = ValidateConfigValue(t, "haproxy-haptic.org/request-capture", key, false) + " len " + captureLen -%}
              {{- shared.Publish("any", "any", "any") -}}
              {{- shared.Publish("pair", pair, pair) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-850-haptic-request-capture:
    requires: [ingresses]
    template: |
      {%- if incremental_value_count("haptic-request-capture", "any") > 0 -%}
      {%%
        var pairs = []any{}
        for _, v := range incremental_values("haptic-request-capture", "pair") {
          pairs = append(pairs, tostring(v))
        }
      %%}
      {{ "\n" }}# haptic/request-capture
      {%- for _, p := range sort_strings(pairs) %}
      capture request header {{ p }}
      {%- end %}
      {%- end %}

  ingress-cookie-rewrite-0860-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/response-cookie-domain']", "metadata.annotations['haproxy-haptic.org/response-cookie-path']"]
      group: ingress-cookie-rewrite
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-cookie-rewrite-publish" for PublishCookieRewrite -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishCookieRewrite(ingress, "haproxy-haptic.org/response-cookie-domain", "haproxy-haptic.org/response-cookie-path", "haptic") -}}
      {%- end -%}

  frontend-filters-860-haptic-response-cookie:
    requires: [ingresses]
    template: |-
      {%- import "util-cookie-rewrite-lane" for CookieRewriteLane -%}
      {{- CookieRewriteLane("haptic") -}}

  ingress-location-rewrite-0870-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/response-location-rewrite-from']"]
      group: ingress-location-rewrite
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-location-rewrite-publish" for PublishLocationRewrite -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishLocationRewrite(ingress, "haproxy-haptic.org/response-location-rewrite-from", "haproxy-haptic.org/response-location-rewrite-to", "haptic", false) -}}
      {%- end -%}

  frontend-filters-870-haptic-response-location-rewrite:
    requires: [ingresses]
    template: |-
      {%- import "util-location-rewrite-lane" for LocationRewriteLane -%}
      {{- LocationRewriteLane("haptic") -}}
