# haptic-annotations library — feature registration, redirects, HSTS, SSL
# passthrough, default-backend, and raw config injection.
#
# Best-of-breed superset of the three vendor libraries, exposed under the
# native haproxy-haptic.org/* prefix. Registration snippets (features-*) push
# host→value entries into the shared gf maps that base.yaml/ssl.yaml emit
# (reload-free, map-only updates); the frontend-filters-*/backends-*/map-* and
# config-injection snippets emit directly into their sections.
#
# Sources adapted:
#   redirect-* ............... Gateway API HTTPRequestRedirectFilter
#   root-redirect / hsts / ssl-passthrough / mTLS-style
#     gf-registration ......... haproxy-ingress/40-features.yaml
#   apex-www ................. nginx-ingress/20-*
#   default-backend-redirect . haproxy-ingress/30-frontend-filters.yaml
#   default-backend .......... nginx-ingress/17-default-backend.yaml
#   config-global/defaults/frontend .. haproxy-ingress/45-config-sections.yaml
templateSnippets:

  # ==========================================================================
  # Redirect — one route-scoped target per Ingress, published into
  # gf["routeRedirects"]. base.yaml builds route-redirect.map and emits the rule,
  # so changing a redirect is a map-only, reload-free update.
  # ==========================================================================
  features-135-haptic-redirect:
    requires: [ingresses]
    template: |-
      {{- render "haptic-redirect-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("haptic-redirects", "routes") -%}
        {%- var redirects []any = coalesce(gf["routeRedirects"], []any{}) -%}
        {%- gf["routeRedirects"] = append(redirects, entry) -%}
      {%- end -%}

  haptic-redirect-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/redirect-scheme']"
        - "metadata.annotations['haproxy-haptic.org/redirect-host']"
        - "metadata.annotations['haproxy-haptic.org/redirect-port']"
        - "metadata.annotations['haproxy-haptic.org/redirect-path']"
        - "metadata.annotations['haproxy-haptic.org/redirect-path-prefix']"
        - "metadata.annotations['haproxy-haptic.org/redirect-query']"
        - "metadata.annotations['haproxy-haptic.org/redirect-code']"
        - "metadata.annotations['haproxy-haptic.org/https-redirect']"
        - "metadata.annotations['haproxy-haptic.org/https-redirect-code']"
        - "metadata.annotations['haproxy-haptic.org/https-redirect-port']"
        - "metadata.annotations['haproxy-haptic.org/permanent-redirect']"
        - "metadata.annotations['haproxy-haptic.org/permanent-redirect-code']"
        - "metadata.annotations['haproxy-haptic.org/temporary-redirect']"
        - "metadata.annotations['haproxy-haptic.org/temporary-redirect-code']"
      group: haptic-redirects
      effects: [publishValue, recordEvent]
    template: |-
      {#
        HAPTIC redirect. Each annotation names one part of the target; a part left
        unset is taken from the request.

        Annotations:
          - haproxy-haptic.org/redirect-scheme  ("http" | "https")
          - haproxy-haptic.org/redirect-host    (hostname)
          - haproxy-haptic.org/redirect-port    (1-65535; unset: the scheme's default,
                                                or the request's when scheme and host
                                                are unset too)
          - haproxy-haptic.org/redirect-path    (replaces the whole path)
          - haproxy-haptic.org/redirect-path-prefix (replaces the matched Ingress
                                                path prefix, keeping the rest)
          - haproxy-haptic.org/redirect-query   ("keep" | "drop", default "keep")
          - haproxy-haptic.org/redirect-code    (301 | 302 | 303 | 307 | 308, default 302)

        Any of scheme, host, port, path, path-prefix, or `query: drop` enables the
        redirect. It
        applies to the Ingress's own routes, and a redirect to the requested URL is
        skipped, so `redirect-scheme: https` only fires on plain HTTP.
      #}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
      {%%
        var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name
        var a = ingress.Metadata.Annotations
        var p = "haproxy-haptic.org/"
        var replacements = map[string]string{
          "https-redirect":           "redirect-scheme: https",
          "https-redirect-code":      "redirect-code",
          "https-redirect-port":      "redirect-scheme: https with redirect-port",
          "permanent-redirect":       "the redirect-* annotations with redirect-code: 301",
          "permanent-redirect-code":  "redirect-code",
          "temporary-redirect":       "the redirect-* annotations with redirect-code: 302",
          "temporary-redirect-code":  "redirect-code",
        }
        for _, removed := range keys(replacements) {
          if a[p + removed] != "" {
            _ = WebhookRejectOrWarn(ingress, "UnsupportedAnnotation", "Ingress " + key + " sets '" + p + removed + "', which was removed, so it has no effect. Use " + replacements[removed] + " instead.")
          }
        }
        var scheme = a["haproxy-haptic.org/redirect-scheme"]
        var host = toLower(a["haproxy-haptic.org/redirect-host"])
        var port = a["haproxy-haptic.org/redirect-port"]
        var path = a["haproxy-haptic.org/redirect-path"]
        var pathPrefix = a["haproxy-haptic.org/redirect-path-prefix"]
        var pathType = a["haproxy-haptic.org/path-type"]
        var query = a["haproxy-haptic.org/redirect-query"]
        var code = a["haproxy-haptic.org/redirect-code"]
        var invalid = func(name string, value string, rule string) string {
          return "Invalid value '" + value + "' for annotation '" + p + name + "' on Ingress '" + key + "'. " + rule
        }
        var pathPattern = "^/[^[:space:][:cntrl:]?#]*$"
        var pathRule = "Must start with / and contain no whitespace, ? or #"
        var problem = ""
        if scheme != "" && scheme != "http" && scheme != "https" {
          problem = invalid("redirect-scheme", scheme, "Valid values: http, https")
        } else if host != "" && !regex_search(host, "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$") {
          problem = invalid("redirect-host", host, "Must be a hostname such as new.example.com")
        } else if port != "" && (!regex_search(port, "^[0-9]{1,5}$") || toint(port) < 1 || toint(port) > 65535) {
          problem = invalid("redirect-port", port, "Must be a port from 1 to 65535")
        } else if path != "" && !regex_search(path, pathPattern) {
          problem = invalid("redirect-path", path, pathRule)
        } else if pathPrefix != "" && !regex_search(pathPrefix, pathPattern) {
          problem = invalid("redirect-path-prefix", pathPrefix, pathRule)
        } else if pathPrefix != "" && path != "" {
          problem = "Ingress " + key + " sets both " + p + "redirect-path and " + p + "redirect-path-prefix, so the redirect target is ambiguous. Remove one of them."
        } else if pathPrefix != "" && (pathType == "regex" || pathType == "begin") {
          problem = "Ingress " + key + " sets " + p + "redirect-path-prefix with " + p + "path-type: " + pathType + ", whose paths are not prefixes, so there is nothing to replace. Use redirect-path or a Prefix path."
        } else if query != "" && query != "keep" && query != "drop" {
          problem = invalid("redirect-query", query, "Valid values: keep, drop")
        } else if code != "" && code != "301" && code != "302" && code != "303" && code != "307" && code != "308" {
          problem = invalid("redirect-code", code, "Valid values: 301, 302, 303, 307, 308")
        }
        var enabled = scheme != "" || host != "" || port != "" || path != "" || pathPrefix != "" || query == "drop"
        if problem == "" && !enabled && (code != "" || query != "") {
          problem = "Ingress " + key + " sets " + p + "redirect-code or " + p + "redirect-query without a redirect target, so nothing is redirected. Add redirect-scheme, redirect-host, redirect-port, redirect-path, or redirect-path-prefix."
        }
        if problem != "" {
          _ = WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", problem)
        } else if enabled {
          if query == "" {
            query = "keep"
          }
          if code == "" {
            code = "302"
          }
          var prefixes = []any{}
          if pathPrefix != "" {
            for _, rule := range ingress.Spec.Rules {
              for _, ingressPath := range rule.Http.Paths {
                if ingressPath.Path != "" {
                  prefixes = append(prefixes, ingressPath.Path)
                }
              }
            }
          }
          _ = shared.Publish("routes", key, map[string]any{
            "route": key, "scheme": scheme, "host": host, "port": port, "path": path,
            "pathPrefix": pathPrefix, "prefixes": prefixes, "query": query, "code": code,
          })
        }
      %%}
      {%- end -%}

  # ==========================================================================
  # Apex/WWW redirect (nginx-style): 301 between apex and www. counterpart.
  # Single-vendor: builds haptic-from-to-www.map and emits two scheme-split
  # rules reading it (map-only, reload-free). Adapted from nginx-ingress.
  # ==========================================================================
  features-900-haptic-apex-www-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/apex-www-redirect']"]
      group: haptic-apex-www-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["haproxy-haptic.org/apex-www-redirect"] == "true" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
          {%- var host = toLower(rule.Host) -%}
          {%- if host != "" -%}
            {%- var target = "www." + host -%}
            {%- if hasPrefix(host, "www.") -%}{%- target = host[4:] -%}{%- end -%}
            {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{"host": host, "target": target}) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-810-haptic-apex-www-redirect:
    template: |
      {#
        HAPTIC apex/www redirect.

        Annotation: haproxy-haptic.org/apex-www-redirect: "true"

        Redirects apex ↔ www with a 301:
          - host `example.com`     → `www.example.com`
          - host `www.example.com` → `example.com`

        Emitted as a true client redirect (`redirect prefix`) that sets the Location
        header, never the Host header, so routing is not corrupted; the request path
        is preserved and the scheme is preserved by gating on ssl_fc.
      #}
      {%- var pairByHost = map[string]string{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- var hostKeys = []any{} -%}
      {%- for _, entryAny := range incremental_values("haptic-apex-www-hosts", "hosts") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var host = tostring(entry["host"]) %}
        {%- if host != "" && !seen[host] %}
          {%- seen[host] = true %}
          {%- pairByHost[host] = tostring(entry["target"]) %}
          {%- hostKeys = append(hostKeys, host) %}
        {%- end %}
      {%- end %}
      {%- if len(hostKeys) > 0 %}
        {%- var sortedHosts = sort_strings(hostKeys) %}
        {%- var lines = []string{} %}
        {%- for _, h := range sortedHosts %}{%- lines = append(lines, tostring(h) + " " + pairByHost[tostring(h)]) %}{%- end %}
        {%- var mapContent = join(lines, "\n") + "\n" %}
        {%- var _, mapErr = fileRegistry.Register("map", "haptic-from-to-www.map", mapContent) %}
        {%- if mapErr != nil %}{{ fail("failed to register haptic from-to-www map: " + tostring(mapErr)) }}{%- end %}
        {%- var m, _ = pathResolver.GetPath("haptic-from-to-www.map", "map") %}
      # haptic/apex-www-redirect
      http-request redirect prefix https://%[var(txn.host),map({{ m }})] code 301 if { ssl_fc } { var(txn.host),map({{ m }}) -m found }
      http-request redirect prefix http://%[var(txn.host),map({{ m }})] code 301 if !{ ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  # ==========================================================================
  # App-root — host registration into gf["appRootHosts"]. base.yaml
  # features-175-app-root-map builds app-root.map and frontend-filters-065-app-root
  # emits the gated redirect, so changing an app-root is a map-only, reload-free
  # update. Adapted from haproxy-ingress/nginx-ingress app-root.
  # ==========================================================================
  features-145-haptic-root-redirect:
    requires: [ingresses]
    template: |-
      {{- render "haptic-app-root-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("haptic-app-root-hosts", "hosts") -%}
        {%- var roots []any = coalesce(gf["appRootHosts"], []any{}) -%}
        {%- gf["appRootHosts"] = append(roots, entry) -%}
      {%- end -%}

  haptic-app-root-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/root-redirect']"]
      group: haptic-app-root-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {#
        HAPTIC root-redirect — redirect requests for "/" to a sub-path.

        Annotation: haproxy-haptic.org/root-redirect: "<path>"

        The path passes a control-char config-injection guard before registration.
      #}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var appRoot = ingress.Metadata.Annotations["haproxy-haptic.org/root-redirect"] %}
        {%- if appRoot != "" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- if regex_search(appRoot, "[[:cntrl:]]") -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy-haptic.org/root-redirect' on Ingress '" + key + "': must not contain control characters — config-injection guard.") -}}
          {%- else -%}
            {%- for ruleIndex, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}
                {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{"host": toLower(rule.Host), "path": appRoot}) -}}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  # ==========================================================================
  # Default-backend redirect (haproxy-ingress-style): redirect requests that
  # match one of this Ingress's hosts but no configured path. Single-vendor:
  # builds haptic-default-backend-redirect-<code>.map and emits the rule.
  # ==========================================================================
  features-900-haptic-default-backend-redirect-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/default-backend-redirect']"
        - "metadata.annotations['haproxy-haptic.org/default-backend-redirect-code']"
      group: haptic-default-backend-redirect-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var location = ingress.Metadata.Annotations["haproxy-haptic.org/default-backend-redirect"] -%}
        {%- if location != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if regex_search(location, "[[:cntrl:]]") -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Invalid value for annotation 'haproxy-haptic.org/default-backend-redirect' on Ingress '" + key + "': must not contain control characters — config-injection guard.") -}}
          {%- else -%}
            {%- var code = ingress.Metadata.Annotations["haproxy-haptic.org/default-backend-redirect-code"] -%}
            {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
            {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
              {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Invalid value '" + code + "' for annotation 'haproxy-haptic.org/default-backend-redirect-code' on Ingress '" + key + "'. Valid values: 301, 302, 303, 307, 308") -}}
            {%- else -%}
              {{- shared.Publish("codes", key, map[string]any{"code": code}) -}}
              {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
                {%- if rule.Host != "" -%}
                  {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                    "host": toLower(rule.Host), "code": code, "location": location,
                  }) -}}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-820-haptic-default-backend-redirect:
    template: |
      {#
        HAPTIC default-backend redirect.

        Annotations:
          - haproxy-haptic.org/default-backend-redirect: "<url>" (enables the redirect)
          - haproxy-haptic.org/default-backend-redirect-code: "301|302|303|307|308" (default 302)

        frontend-filters-* run AFTER the routing cascade, so txn.backend_name is set
        for matched paths and empty otherwise; the guard
        `!{ var(txn.backend_name) -m found }` fires exactly on unmatched requests,
        scoped to this Ingress's host(s). Adapted from
        haproxy-ingress/frontend-filters-680.
      #}
      {%- var codeMap = map[string]map[string]string{} -%}
      {%- var codeHosts = map[string][]any{} -%}
      {%- var seen = map[string]bool{} -%}
      {%- for _, entryAny := range incremental_values("haptic-default-backend-redirect-hosts", "codes") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var code = tostring(entry["code"]) %}
        {%- if codeMap[code] == nil %}{%- codeMap[code] = map[string]string{} %}{%- end %}
      {%- end %}
      {%- for _, entryAny := range incremental_values("haptic-default-backend-redirect-hosts", "hosts") %}
        {%- var entry = entryAny.(map[string]any) %}
        {%- var code = tostring(entry["code"]) %}
        {%- var host = tostring(entry["host"]) %}
        {%- if host != "" && !seen[host] %}
          {%- seen[host] = true %}
          {%- codeMap[code][host] = tostring(entry["location"]) %}
          {%- codeHosts[code] = append(coalesce(codeHosts[code], []any{}).([]any), host) %}
        {%- end %}
      {%- end %}
      {%- for code, hostURL := range codeMap %}
        {%- var sortedHosts = sort_strings(coalesce(codeHosts[code], []any{})) %}
        {%- var lines = []string{} %}
        {%- for _, h := range sortedHosts %}{%- lines = append(lines, tostring(h) + " " + hostURL[tostring(h)]) %}{%- end %}
        {%- var mapContent = join(lines, "\n") + "\n" %}
        {%- var _, mapErr = fileRegistry.Register("map", "haptic-default-backend-redirect-" + code + ".map", mapContent) %}
        {%- if mapErr != nil %}{{ fail("failed to register haptic default-backend-redirect map: " + tostring(mapErr)) }}{%- end %}
        {%- var m, _ = pathResolver.GetPath("haptic-default-backend-redirect-" + code + ".map", "map") %}
      # haptic/default-backend-redirect (code {{ code }})
      http-request redirect location %[var(txn.host),map({{ m }})] code {{ code }} if !{ var(txn.backend_name) -m found } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  # ==========================================================================
  # HSTS — host registration into gf["hstsHosts"] via the shared macro. base.yaml
  # features-190-hsts-map builds hsts.map and frontend-filters-080-hsts emits the
  # single shared response-header rule (map-only, reload-free). Default max-age
  # comes from extraContext.tls.hsts.maxAge, shared with the global HSTS header.
  # ==========================================================================
  features-155-haptic-hsts:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- toJSON(map[string]any{"ingresses": map[string]any{"defaultMaxAge": extraContext | dig("tls", "hsts", "maxAge") | fallback("31536000")}}) -}}'
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/hsts']"
        - "metadata.annotations['haproxy-haptic.org/hsts-include-subdomains']"
        - "metadata.annotations['haproxy-haptic.org/hsts-max-age']"
        - "metadata.annotations['haproxy-haptic.org/hsts-preload']"
      group: hsts-hosts
      effects: [publishValue]
    template: |
      {#
        HAPTIC HSTS — Strict-Transport-Security registration.

        Annotations:
          - haproxy-haptic.org/hsts: "true" enables HSTS for the host(s)
          - haproxy-haptic.org/hsts-max-age: seconds (default extraContext.tls.hsts.maxAge, 31536000)
          - haproxy-haptic.org/hsts-include-subdomains: "true" adds includeSubDomains
          - haproxy-haptic.org/hsts-preload: "true" adds preload
      #}
      {%- import "util-register-annotation-hsts" for RegisterAnnotationHSTS -%}
      {%- var defMaxAge = tostring(props["defaultMaxAge"]) -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {{ RegisterAnnotationHSTS(ingress,
            "haproxy-haptic.org/hsts",
            "haproxy-haptic.org/hsts-max-age",
            "haproxy-haptic.org/hsts-include-subdomains",
            "haproxy-haptic.org/hsts-preload",
            defMaxAge) }}
      {%- end -%}

  backends-840-haptic-ssl-passthrough:
    requires: [ingresses, services, endpoints]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/ssl-passthrough']"]
      group: ingress-ssl-passthrough
      effects: [publishValue, backendPlan]
    template: |-
      {%- import "util-annotation-ssl-passthrough-component" for RenderAnnotationSSLPassthrough -%}
      {{- RenderAnnotationSSLPassthrough(item,
        "haproxy-haptic.org/ssl-passthrough",
        "ssl-passthrough-haptic-", "haptic", "haptic") -}}

  # ==========================================================================
  # Default-backend (nginx-style): per-host catch-all pool from a named Service
  # (first port). A dedicated backend pool plus a per-host "<host>/" prefix entry
  # in path-prefix.map. Silently skipped when the Service can't be resolved.
  # Adapted from nginx-ingress/17-default-backend.yaml.
  # ==========================================================================
  util-haptic-default-backend:
    template: |
      {%- macro ResolveHapticDefaultBackend(ingress *resources.ingresses.T, result map[string]any) %}
        {%%
          result["ok"] = false
          var ann = ingress.Metadata.Annotations["haproxy-haptic.org/default-backend"]
          if ann == "" {
            return
          }
          var ns = ingress.Metadata.Namespace
          var svcNs = ns
          var svcName = ann
          if strings_contains(ann, "/") {
            var parts = split(ann, "/")
            svcNs = parts[0]
            svcName = parts[1]
          }
          // The default-backend names only a Service (no port). Resolve its first
          // port number; the pool can't be built without it.
          var svc = resources.services.GetSingle(svcNs, svcName)
          if svc == nil {
            return
          }
          var port = 0
          var portName = ""
          for _, sp := range svc.Spec.Ports {
            port = toint(sp.Port)
            portName = sp.Name
            break
          }
          if port <= 0 {
            return
          }
          result["svcNs"] = svcNs
          result["svcName"] = svcName
          result["port"] = port
          result["portName"] = portName
          result["backendName"] = ns + "_" + ingress.Metadata.Name + "_default-backend_" + svcName
          result["ok"] = true
        %%}
      {%- end macro -%}

  backends-850-haptic-default-backend:
    requires: [ingresses, services, endpoints, secrets]
    template: |-
      {%- import "util-replay-ingress-backend-effects" for ReplayIngressBackendEffects -%}
      {{- ReplayIngressBackendEffects("850") -}}
      {%- var block = render "backenditems-850-haptic-default-backend" -%}
      {%- if block != "" -%}{{ block }}{{ "\n" }}{%- end -%}

  backenditems-850-haptic-default-backend:
    requires: [ingresses, services, endpoints, secrets]
    incremental:
      bindingsTemplate: '{{- render "util-ingress-backend-bindings" -}}'
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/default-backend']"]
      group: ingress-backends
      effects: [publishValue, backendPlan, recordEvent]
    template: |-
      {%- import "util-haptic-default-backend" for ResolveHapticDefaultBackend -%}
      {%- import "util-generate-annotation-default-backend" for GenerateAnnotationDefaultBackend -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var info = map[string]any{} -%}
        {{- ResolveHapticDefaultBackend(ingress, info) -}}
        {%- if info["ok"] == true -%}
          {%- var svcNs = tostring(info["svcNs"]) -%}
          {%- var svcName = tostring(info["svcName"]) -%}
          {%- var port = toint(info["port"]) -%}
          {%- var portName = tostring(info["portName"]) -%}
          {%- var backendName = tostring(info["backendName"]) -%}
          {{- GenerateAnnotationDefaultBackend(ingress, svcNs, svcName, port, portName, backendName, "850",
            "# haptic/default-backend: Ingress " + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name +
            " → Service " + svcNs + "/" + svcName + ":" + tostring(port)) -}}
        {%- end -%}
      {%- end -%}

  map-path-prefix-850-haptic-default-backend:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/default-backend']"]
    template: |
      {#
        HAPTIC default-backend catch-all path entries.

        For each host on an Ingress carrying haproxy-haptic.org/default-backend,
        emit a "<host>/" prefix entry pointing at the default-backend pool. The
        map_beg longest-prefix match in path-prefix.map prefers the Ingress's own
        rule paths and falls through to this catch-all only when no rule path
        matched.
      #}
      {%- import "util-haptic-default-backend" for ResolveHapticDefaultBackend -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- for _, ingress := range []*resources.ingresses.T{resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))} -%}
        {%- var info = map[string]any{} -%}
        {{- ResolveHapticDefaultBackend(ingress, info) -}}
        {%- if info["ok"] == true -%}
          {%- var backendName = tostring(info["backendName"]) -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- if rule.Host != "" -%}
              {%- var hostKey = MapKeyForHost(rule.Host) -%}
      {{ "\n" }}# haptic/default-backend ({{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }}){{ "\n" }}{{ hostKey }}/ BACKEND:{{ backendName }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # ==========================================================================
  # Raw directive injection (haproxy-ingress-style). Each annotation injects
  # operator-authored HAProxy directives verbatim into the corresponding section.
  # Directives are whole config blocks (newlines are legitimate), so they are
  # strip()-trimmed and emitted as-is, matching the vendor's raw-passthrough
  # contract; deduplication is the operator's responsibility.
  # ==========================================================================
  global-settings-800-haptic-config-global:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/config-global']"]
    template: |-
      {%%
        var ingress = item
        var snippet = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/config-global")
        if snippet != "" && strip(snippet) != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haptic-config-global", "header", "\n# haptic/config-global")
          show shared.Unique("haptic-config-global", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + strip(snippet))
        }
      %%}

  defaults-settings-800-haptic-config-defaults:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/config-defaults']"]
    template: |-
      {%%
        var ingress = item
        var snippet = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/config-defaults")
        if snippet != "" && strip(snippet) != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haptic-config-defaults", "header", "\n# haptic/config-defaults")
          show shared.Unique("haptic-config-defaults", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + strip(snippet))
        }
      %%}

  util-haptic-config-frontend-incremental:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/config-frontend']"]
