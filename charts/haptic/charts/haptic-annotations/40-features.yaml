      {%%
        var ingress = item
        var snippet = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/config-frontend")
        if snippet != "" && strip(snippet) != "" {
          var namespace = dig_string(ingress, "", "metadata", "namespace")
          var name = dig_string(ingress, "", "metadata", "name")
          show shared.Unique("haptic-config-frontend", "header", "\n# haptic/config-frontend")
          show shared.Unique("haptic-config-frontend", "resource/" + namespace + "/" + name,
            "\n# Ingress: " + namespace + "/" + name + "\n" + strip(snippet))
        }
      %%}

  global-settings-799-haptic-config-frontend-cache:
    requires: [ingresses]
    template: |-
      {%- var _, _ = shared.ComputeIfAbsent("haptic-config-frontend-incremental", func() any {
        return render "util-haptic-config-frontend-incremental"
      }) -%}

  frontend-extra-800-haptic-config-frontend:
    requires: [ingresses]
    template: |-
      {%- var block, _ = shared.ComputeIfAbsent("haptic-config-frontend-incremental", func() any {
        return render "util-haptic-config-frontend-incremental"
      }) -%}
