# HAPTIC-native annotation library — API-gateway request gating.
#
# Stateless request-admission controls, one rule block per HTTP frontend fed
# by per-route maps (a route add or remove is a map edit), after routing:
#   - fixed-response        (unconditional canned response — maintenance/sunset)
#   - mock-response         (canned 200 stub — dev/testing)
#   - allowed-methods       (deny 405 on disallowed HTTP methods)
#   - require-content-type  (deny 415 when a body method lacks an allowed type)
#   - require-headers       (deny 400 when a required header is absent)
#
# Band order is load-bearing: the canned responses (802) short-circuit with
# http-request return BEFORE the validators (806-809), so a mocked or
# maintenance route is not also method/header-checked.
#
# NOTE: HMAC auth and consumer-groups ACLs (also API-gateway security) land in
# this fragment in Phase 2; Phase 1 is the stateless-native subset above.
templateSnippets:

  # ==========================================================================
  # Canned responses (fixed-response, mock-response) from per-route maps.
  # haptic-return-routes.map: "<route id>" -> "<code>|<content type>" (an
  # empty type is a bare status); haptic-return-body.map: the URL-encoded
  # body. `status` and `content-type` take literals, so there is one return
  # rule per distinct (code, type) pair: a new pair reloads once, a route on
  # a known pair is a map edit. fixed-response wins over mock-response on
  # the same Ingress, as its band did.
  # ==========================================================================
  util-haptic-return-route:
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- macro HapticReturnRoute(ingress *resources.ingresses.T, kind string, result map[string]any) -%}
        {%- result["lane"] = "" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var ann = ingress.Metadata.Annotations -%}
        {%- var code = "" -%}
        {%- var body = "" -%}
        {%- var ct = "" -%}
        {%- var enabled = false -%}
        {%- if kind == "fixed" && ann["haproxy-haptic.org/fixed-response"] == "true" -%}
          {%- enabled = true -%}
          {%- code = ann["haproxy-haptic.org/fixed-response-code"] -%}
          {%- if code == "" -%}{%- code = "503" -%}{%- end -%}
          {%- body = ann["haproxy-haptic.org/fixed-response-body"] -%}
          {%- if body != "" -%}
            {%- ct = ann["haproxy-haptic.org/fixed-response-content-type"] -%}
            {%- if ct == "" -%}{%- ct = "text/plain" -%}{%- end -%}
          {%- end -%}
        {%- else if kind == "mock" && ann["haproxy-haptic.org/mock-response"] != "" && ann["haproxy-haptic.org/fixed-response"] != "true" -%}
          {%- enabled = true -%}
          {%- body = ann["haproxy-haptic.org/mock-response"] -%}
          {%- code = ann["haproxy-haptic.org/mock-response-code"] -%}
          {%- if code == "" -%}{%- code = "200" -%}{%- end -%}
          {%- ct = ann["haproxy-haptic.org/mock-response-content-type"] -%}
          {%- if ct == "" -%}{%- ct = "application/json" -%}{%- end -%}
        {%- end -%}
        {%- if enabled -%}
          {%- var bodyAnn = "haproxy-haptic.org/" + kind + "-response" -%}
          {%- if kind == "fixed" -%}{%- bodyAnn = bodyAnn + "-body" -%}{%- end -%}
          {%- var inj = ConfigInjectionKind(body, "line") -%}
          {%- if inj != "" -%}
            {%- result["lane"] = "invalid" -%}
            {%- result["message"] = "Ingress " + key + " annotation '" + bodyAnn + "' value contains " + inj + ", which would split the frontend directive; the response is not applied. Remove control characters from the value." -%}
            {%- return -%}
          {%- end -%}
          {%- if toint(code) < 100 || toint(code) > 599 -%}
            {{- fail("Invalid value '" + code + "' for annotation 'haproxy-haptic.org/" + kind + "-response-code' on Ingress '" + key + "'. Must be a valid HTTP status code (100-599).") -}}
          {%- end -%}
          {%- inj = ConfigInjectionKind(ct, "line") -%}
          {%- if inj != "" -%}
            {%- result["lane"] = "invalid" -%}
            {%- result["message"] = "Ingress " + key + " annotation 'haproxy-haptic.org/" + kind + "-response-content-type' value contains " + inj + ", which would split the frontend directive; the response is not applied. Remove control characters from the value." -%}
            {%- return -%}
          {%- end -%}
          {%- result["lane"] = "map" -%}
          {%- result["pair"] = code + "|" + ct -%}
          {%- result["body"] = body -%}
        {%- end -%}
      {%- end macro -%}

  util-haptic-publish-return-route:
    template: |-
      {%- import "util-haptic-return-route" for HapticReturnRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- macro PublishHapticReturnRoute(kind string) -%}
        {%- var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
        {%- if ingress != nil -%}
          {%- var r = map[string]any{} -%}
          {{- HapticReturnRoute(ingress, kind, r) -}}
          {%- if r["lane"] == "invalid" -%}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotation", tostring(r["message"])) -}}
          {%- else if r["lane"] == "map" -%}
            {%- var rid = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
            {%- var pair = tostring(r["pair"]) -%}
            {{- shared.Publish("return", "any", "any") -}}
            {{- shared.Publish("ret-route", rid, rid + " " + pair) -}}
            {{- shared.Publish("ret-pair", pair, pair) -}}
            {%- if tostring(r["body"]) != "" -%}{{- shared.Publish("ret-body", rid, rid + " " + queryEscape(tostring(r["body"]))) -}}{%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  features-802-haptic-fixed-response:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/fixed-response']"]
      group: haptic-gateway-security
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-publish-return-route" for PublishHapticReturnRoute -%}
      {{- PublishHapticReturnRoute("fixed") -}}

  features-804-haptic-mock-response:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/mock-response']"]
      group: haptic-gateway-security
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-publish-return-route" for PublishHapticReturnRoute -%}
      {{- PublishHapticReturnRoute("mock") -}}

  # One block per HTTP frontend, before the validators (806-809) so a canned
  # route is not also method/header-checked.
  frontend-filters-802-haptic-fixed-response:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- if incremental_value_count("haptic-gateway-security", "return") > 0 -%}
      {%%
        var mapsVal, _ = shared.ComputeIfAbsent("hapticReturnMaps", func() any {
          var lines = func(key string) []string {
            var rows = []any{}
            for _, v := range incremental_values("haptic-gateway-security", key) {
              rows = append(rows, tostring(v))
            }
            var out = []string{}
            for _, r := range sort_strings(rows) {
              out = append(out, tostring(r))
            }
            return out
          }
          return map[string]any{
            "routes": RegisterMap("haptic-return-routes.map", lines("ret-route"), map[string]any{"ordered": false}),
            "body": RegisterMap("haptic-return-body.map", lines("ret-body"), map[string]any{"ordered": false}),
          }
        })
        var maps = mapsVal.(map[string]any)
        var pairs = []any{}
        for _, v := range incremental_values("haptic-gateway-security", "ret-pair") {
          pairs = append(pairs, tostring(v))
        }
      %%}
      # haptic/fixed-response
      {%- for _, p := range sort_strings(pairs) %}
        {%- var parts = strings_splitn(tostring(p), "|", 2) %}
        {%- if parts[1] != "" %}
      http-request return status {{ parts[0] }} content-type "{{ EscapeDquoteValue(parts[1]) }}" lf-string %[var(txn.resource_key),map({{ maps["body"] }}),url_dec(1)] if { var(txn.resource_key),map({{ maps["routes"] }}) -m str "{{ EscapeDquoteValue(tostring(p)) }}" }
        {%- else %}
      http-request return status {{ parts[0] }} if { var(txn.resource_key),map({{ maps["routes"] }}) -m str "{{ tostring(p) }}" }
        {%- end %}
      {%- end %}
      {%- end %}

  # ==========================================================================
  # allowed-methods — deny 405 on a method outside the route's list.
  # haptic-methods.map: "<route id>|<METHOD>" -> 1; a route with a list is in
  # haptic-method-routes.map.
  # ==========================================================================
  features-806-haptic-allowed-methods:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/allowed-methods']"]
      group: haptic-gateway-security
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var methods = []string{} -%}
        {%- for _, tok := range split(ingress.Metadata.Annotations["haproxy-haptic.org/allowed-methods"], ",") -%}
          {%- var m = strip(tok) -%}
          {%- if m == "" -%}{%- continue -%}{%- end -%}
          {%- if !regex_search(m, "^[A-Z]+$") -%}
            {{- fail("Invalid method '" + m + "' in annotation 'haproxy-haptic.org/allowed-methods' on Ingress '" + key + "'. Methods must be uppercase letters (e.g. GET, POST).") -}}
          {%- end -%}
          {%- methods = append(methods, m) -%}
        {%- end -%}
        {%- if len(methods) > 0 -%}
          {{- shared.Publish("am", "any", "any") -}}
          {{- shared.Publish("am-route", key, key + " 1") -}}
          {%- for _, m := range methods -%}
            {{- shared.Publish("am-method", key + "|" + m, key + "|" + m + " 1") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-806-haptic-allowed-methods:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-gateway-security", "am") > 0 -%}
      {%%
        var mapsVal, _ = shared.ComputeIfAbsent("hapticMethodMaps", func() any {
          var lines = func(key string) []string {
            var rows = []any{}
            for _, v := range incremental_values("haptic-gateway-security", key) {
              rows = append(rows, tostring(v))
            }
            var out = []string{}
            for _, r := range sort_strings(rows) {
              out = append(out, tostring(r))
            }
            return out
          }
          return map[string]any{
            "routes": RegisterMap("haptic-method-routes.map", lines("am-route"), map[string]any{"ordered": false}),
            "methods": RegisterMap("haptic-methods.map", lines("am-method"), map[string]any{"ordered": false}),
          }
        })
        var maps = mapsVal.(map[string]any)
      %%}
      # haptic/allowed-methods
      http-request set-var(txn.am_method) method if { var(txn.resource_key),map({{ maps["routes"] }}) -m found }
      http-request set-var(txn.denied_by) str(method_not_allowed) if { var(txn.am_method) -m found } !{ var(txn.resource_key),concat(|,txn.am_method),map({{ maps["methods"] }}) -m found }
      http-request deny deny_status 405 if { var(txn.am_method) -m found } !{ var(txn.resource_key),concat(|,txn.am_method),map({{ maps["methods"] }}) -m found }
      {%- end %}

  # require-sni-host-match — 421 when the Host differs from the TLS SNI.
  # haptic-sni-host-routes.map: "<route id>" -> 1.
  features-053-haptic-sni-host-match:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/require-sni-host-match']"]
      group: haptic-gateway-security
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var value = ingress.Metadata.Annotations["haproxy-haptic.org/require-sni-host-match"] -%}
        {%- if value != "true" && value != "false" -%}
          {{- fail("Ingress " + key + " sets haproxy-haptic.org/require-sni-host-match to '" + value + "'. Set \"true\" or \"false\".") -}}
        {%- end -%}
        {%- if value == "true" -%}
          {{- shared.Publish("shm", "any", "any") -}}
          {{- shared.Publish("shm-route", key, key + " 1") -}}
        {%- end -%}
      {%- end -%}

  frontend-filters-053-haptic-sni-host-match:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- import "util-sni-host-mismatch" for SniHostMismatch -%}
      {%- if incremental_value_count("haptic-gateway-security", "shm") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("hapticSniHostRoutes", func() any {
          var rows = []any{}
          for _, v := range incremental_values("haptic-gateway-security", "shm-route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haptic-sni-host-routes.map", lines, map[string]any{"ordered": false})
        })
      %%}
      {{- SniHostMismatch("haptic/require-sni-host-match", "{ var(txn.resource_key),map(" + tostring(routesVal) + ") -m found }") }}
      {%- end %}

  # ==========================================================================
  # require-content-type — 415 when a body method lacks an allowed type.
  # haptic-content-types.map: "<route id>|<type>" -> 1, a map_beg lookup on
  # "<route id>|<Content-Type>" so charset suffixes still match; an absent
  # header looks up "<route id>|", which no row prefixes, and is refused.
  # 415 has no built-in errorfile, hence return, not deny.
  # ==========================================================================
  features-808-haptic-require-content-type:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/require-content-type']"]
      group: haptic-gateway-security
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var types = []string{} -%}
        {%- for _, tok := range split(ingress.Metadata.Annotations["haproxy-haptic.org/require-content-type"], ",") -%}
          {%- var ct = strip(tok) -%}
          {%- if ct == "" -%}{%- continue -%}{%- end -%}
          {%- if !regex_search(ct, "^[A-Za-z0-9./+-]+$") -%}
            {{- fail("Invalid media type '" + ct + "' in annotation 'haproxy-haptic.org/require-content-type' on Ingress '" + key + "'. Allowed characters: letters, digits, '.', '/', '+', '-'.") -}}
          {%- end -%}
          {%- types = append(types, ct) -%}
        {%- end -%}
        {%- if len(types) > 0 -%}
          {{- shared.Publish("ct", "any", "any") -}}
          {{- shared.Publish("ct-route", key, key + " 1") -}}
          {%- for _, ct := range types -%}
            {{- shared.Publish("ct-type", key + "|" + ct, key + "|" + ct + " 1") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-808-haptic-require-content-type:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-gateway-security", "ct") > 0 -%}
      {%%
        var mapsVal, _ = shared.ComputeIfAbsent("hapticContentTypeMaps", func() any {
          var lines = func(key string) []string {
            var rows = []any{}
            for _, v := range incremental_values("haptic-gateway-security", key) {
              rows = append(rows, tostring(v))
            }
            var out = []string{}
            for _, r := range sort_strings(rows) {
              out = append(out, tostring(r))
            }
            return out
          }
          return map[string]any{
            "routes": RegisterMap("haptic-content-type-routes.map", lines("ct-route"), map[string]any{"ordered": false}),
            "types": RegisterMap("haptic-content-types.map", lines("ct-type"), map[string]any{"ordered": false}),
          }
        })
        var maps = mapsVal.(map[string]any)
      %%}
      # haptic/require-content-type
      http-request set-var(txn.ct_route) var(txn.resource_key),map({{ maps["routes"] }}) if { method POST PUT PATCH }
      http-request set-var(txn.ct_in) req.hdr(Content-Type) if { var(txn.ct_route) -m found }
      http-request set-var(txn.denied_by) str(content_type) if { var(txn.ct_route) -m found } !{ var(txn.resource_key),concat(|,txn.ct_in),map_beg({{ maps["types"] }}) -m found }
      http-request return status 415 if { var(txn.ct_route) -m found } !{ var(txn.resource_key),concat(|,txn.ct_in),map_beg({{ maps["types"] }}) -m found }
      {%- end %}

  # ==========================================================================
  # require-headers — 400 when a required request header is absent.
  # haptic-required-headers.map: "<route id>|<Header>" -> 1. req.hdr() takes
  # a literal, so there is one deny pair per distinct header name in use: a
  # new name reloads once, a route on a known name is a map edit.
  # ==========================================================================
  features-809-haptic-require-headers:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/require-headers']"]
      group: haptic-gateway-security
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var names = []string{} -%}
        {%- for _, tok := range split(ingress.Metadata.Annotations["haproxy-haptic.org/require-headers"], ",") -%}
          {%- var hn = strip(tok) -%}
          {%- if hn == "" -%}{%- continue -%}{%- end -%}
          {%- if !regex_search(hn, "^[A-Za-z0-9-]+$") -%}
            {{- fail("Invalid header name '" + hn + "' in annotation 'haproxy-haptic.org/require-headers' on Ingress '" + key + "'. Allowed characters: letters, digits, '-'.") -}}
          {%- end -%}
          {%- names = append(names, hn) -%}
        {%- end -%}
        {%- if len(names) > 0 -%}
          {{- shared.Publish("rh", "any", "any") -}}
          {%- for _, hn := range names -%}
            {{- shared.Publish("rh-route", key + "|" + hn, key + "|" + hn + " 1") -}}
            {{- shared.Publish("rh-name", hn, hn) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-809-haptic-require-headers:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- if incremental_value_count("haptic-gateway-security", "rh") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("hapticRequiredHeadersMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("haptic-gateway-security", "rh-route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("haptic-required-headers.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
        var names = []any{}
        for _, v := range incremental_values("haptic-gateway-security", "rh-name") {
          names = append(names, tostring(v))
        }
      %%}
      # haptic/require-headers
      {%- for _, hn := range sort_strings(names) %}
      http-request set-var(txn.denied_by) str(required_header) if { var(txn.resource_key),concat(|{{ hn }}),map({{ routes }}) -m found } !{ req.hdr({{ hn }}) -m found }
      http-request deny deny_status 400 if { var(txn.resource_key),concat(|{{ hn }}),map({{ routes }}) -m found } !{ req.hdr({{ hn }}) -m found }
      {%- end %}
      {%- end %}

  # ==========================================================================
  # HMAC request-signature verification: one uniform block per HTTP frontend
  # (frontend-filters-861), fed by haptic-hmac-routes.map. The route's base64
  # shared secret travels in the map, so it is visible wherever the map is
  # (the HAProxyMapFile object and the pod) — prefer asymmetric JWT
  # (60-jwt-auth) where only a public key ever appears. Status `different` for
  # this reason plus the non-constant-time signature compare.
  #
  # The per-value text is one signing rule per distinct algorithm and one
  # compare rule per distinct signature header in use (`hmac(<alg>,…)` and
  # `req.hdr(<name>)` take literals); a route add/remove is a map change.
  # ==========================================================================
  util-haptic-hmac-route:
    template: |-
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- macro HapticHMACRoute(ingress any, result map[string]any) -%}
        {%- var ns = dig_string(ingress, "", "metadata", "namespace") -%}
        {%- var key = ns + "/" + dig_string(ingress, "", "metadata", "name") -%}
        {%- var hmacSecret = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/hmac-secret") -%}
        {%- result["enabled"] = hmacSecret != "" -%}
        {%- result["intent"] = "" -%}
        {%- if hmacSecret == "" -%}
          {%- for _, a := range []string{"hmac-algorithm", "hmac-header", "hmac-signed-string"} -%}
            {%- if result["intent"] == "" && dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/" + a) != "" -%}
              {%- result["intent"] = a -%}
              {%- result["enabled"] = true -%}
              {%- result["alg"] = "_" -%}
              {%- result["hdr"] = "_" -%}
              {%- result["signed"] = "_" -%}
              {%- result["state"] = "nosecret" -%}
              {%- result["key"] = "_" -%}
            {%- end -%}
          {%- end -%}
        {%- else -%}
          {%- var alg = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/hmac-algorithm") -%}
          {%- if alg == "" -%}{%- alg = "sha256" -%}{%- end -%}
          {%- if !regex_search(alg, "^(sha1|sha224|sha256|sha384|sha512)$") -%}
            {{- fail("Invalid value '" + alg + "' for annotation 'haproxy-haptic.org/hmac-algorithm' on Ingress '" + key + "'. Valid: sha1, sha224, sha256, sha384, sha512.") -}}
          {%- end -%}
          {%- result["alg"] = alg -%}
          {%- var hdr = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/hmac-header") -%}
          {%- if hdr == "" -%}{%- hdr = "X-Signature" -%}{%- end -%}
          {%- result["hdr"] = ValidateConfigValue(hdr, "haproxy-haptic.org/hmac-header", key, false) -%}
          {%- var signed = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/hmac-signed-string") -%}
          {%- if signed == "" -%}{%- signed = "body" -%}{%- end -%}
          {%- if signed != "body" && signed != "path" -%}
            {{- fail("Invalid value '" + signed + "' for annotation 'haproxy-haptic.org/hmac-signed-string' on Ingress '" + key + "'. Valid: body, path.") -}}
          {%- end -%}
          {%- result["signed"] = signed -%}
          {%- var secretRef = HapticSecretRef(ns, hmacSecret, "haproxy-haptic.org/hmac-secret", key) -%}
          {%- var refParts = split(secretRef, "/") -%}
          {%- result["secretRef"] = secretRef -%}
          {%- var secret = resources.secrets.GetSingle(refParts[0], refParts[1]) -%}
          {%- result["state"] = "ok" -%}
          {%- result["key"] = "_" -%}
          {%- if secret == nil -%}
            {%- result["state"] = "missing" -%}
          {%- else -%}
            {#- HAProxy's hmac converter wants the key base64-encoded, which is the
                Secret's stored form, so Data["secret"] is used as-is. -#}
            {%- var secretVal = secret.Data["secret"] | tostring() -%}
            {%- if strip(secretVal) == "" -%}
              {{- fail("Secret '" + secretRef + "' referenced by 'haproxy-haptic.org/hmac-secret' on Ingress '" + key + "' has an empty or missing 'secret' data key.") -}}
            {%- end -%}
            {%- if !regex_search(secretVal, "^[A-Za-z0-9+/=]+$") -%}
              {{- fail("Secret '" + secretRef + "' referenced by 'haproxy-haptic.org/hmac-secret' on Ingress '" + key + "' has a malformed 'secret' data value.") -}}
            {%- end -%}
            {%- result["key"] = secretVal -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  map-haptic-hmac-routes-861-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/hmac-secret']"
        - "metadata.annotations['haproxy-haptic.org/hmac-algorithm']"
        - "metadata.annotations['haproxy-haptic.org/hmac-header']"
        - "metadata.annotations['haproxy-haptic.org/hmac-signed-string']"
    template: |-
      {%- import "util-haptic-hmac-route" for HapticHMACRoute -%}
      {%- var route = map[string]any{} -%}
      {{- HapticHMACRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
      {{ "\n" }}{{ dig_string(item, "", "metadata", "namespace") }}/{{ dig_string(item, "", "metadata", "name") }} {{ route["alg"] }} {{ route["hdr"] }} {{ route["signed"] }} {{ route["state"] }} {{ route["key"] }}
      {%- end -%}

  features-861-haptic-hmac-names:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/hmac-secret']"
        - "metadata.annotations['haproxy-haptic.org/hmac-algorithm']"
        - "metadata.annotations['haproxy-haptic.org/hmac-header']"
        - "metadata.annotations['haproxy-haptic.org/hmac-signed-string']"
      group: haptic-hmac-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-hmac-route" for HapticHMACRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var route = map[string]any{} -%}
      {{- HapticHMACRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
        {%- var name = dig_string(item, "", "metadata", "name") -%}
        {%- if route["intent"] != "" -%}
          {{- WebhookRejectOrWarn(resources.ingresses.GetSingle(ns, name), "HMACSecretMissing", "Ingress " + ns + "/" + name + " sets 'haproxy-haptic.org/" + tostring(route["intent"]) + "' but no 'haproxy-haptic.org/hmac-secret'. Signatures cannot be checked, so requests return 503. Set hmac-secret.") -}}
        {%- else -%}
          {{- shared.Publish("alg", tostring(route["alg"]), tostring(route["alg"])) -}}
          {{- shared.Publish("hdr", tostring(route["hdr"]), tostring(route["hdr"])) -}}
          {%- if tostring(route["state"]) == "missing" -%}
            {{- recordEvent(resources.ingresses.GetSingle(ns, name), "HMACSecretMissing", "Ingress " + ns + "/" + name + " references Secret '" + tostring(route["secretRef"]) + "' in 'haproxy-haptic.org/hmac-secret', but it could not be resolved. Requests are denied with 503 until the Secret is present.") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  frontend-filters-861-haptic-hmac:
    requires: [ingresses]
    template: |
      {#
        Annotations:
          - haproxy-haptic.org/hmac-secret: "<ns/name>" | "<name>" (required; Secret
            with a `secret` data key holding the shared key)
          - haproxy-haptic.org/hmac-algorithm: sha256 (default) | sha1/sha224/sha384/sha512
          - haproxy-haptic.org/hmac-header: header carrying the client signature
            (default X-Signature); the signature must be lowercase hex
          - haproxy-haptic.org/hmac-signed-string: what to sign — `body` (default)
            or `path`

        A body-signed route waits for the request body the way base's request
        buffering does (extraContext.requestBuffering.waitTimeout), conditionally
        per route instead of a proxy-wide `option http-buffer-request`. Fails
        CLOSED per route (503) while the Secret is absent. Emitted only while a
        route carries HMAC settings; the first one reloads once, as does
        removing the last.
      #}
      {%- if incremental_value_count("haptic-hmac-routes", "any") > 0 -%}
      {%- var routes, e1 = pathResolver.GetPath("haptic-hmac-routes.map", "map") -%}
      {%- if e1 != nil -%}{{ fail(tostring(e1)) }}{%- end -%}
      {%- var bodyWait = extraContext | dig_string("10s", "requestBuffering", "waitTimeout") -%}
      {%- var algs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-hmac-routes", "alg") -%}{%- algs = append(algs, tostring(v)) -%}{%- end -%}
      {%- var hdrs = []any{} -%}
      {%- for _, v := range incremental_values("haptic-hmac-routes", "hdr") -%}{%- hdrs = append(hdrs, tostring(v)) -%}{%- end -%}
      {{ "\n" }}# haptic/hmac
      http-request set-var(txn.hm_cfg) var(txn.resource_key),map({{ routes }})
      http-request set-var(txn.hm_alg) var(txn.hm_cfg),field(1,' ') if { var(txn.hm_cfg) -m found }
      http-request set-var(txn.hm_hdr) var(txn.hm_cfg),field(2,' ') if { var(txn.hm_cfg) -m found }
      http-request set-var(txn.hm_signed) var(txn.hm_cfg),field(3,' ') if { var(txn.hm_cfg) -m found }
      http-request set-var(txn.hm_state) var(txn.hm_cfg),field(4,' ') if { var(txn.hm_cfg) -m found }
      http-request set-var(txn.hm_key) var(txn.hm_cfg),field(5,' ') if { var(txn.hm_cfg) -m found }
      http-request set-var(txn.denied_by) str(hmac_unavailable) if { var(txn.hm_state) -m str missing nosecret }
      http-request deny deny_status 503 if { var(txn.hm_state) -m str missing nosecret }
      http-request set-var(txn.denied_by) str(hmac_no_content_length) if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body } !{ req.hdr(Content-Length) -m found }
      http-request return status 411 if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body } !{ req.hdr(Content-Length) -m found }
      http-request set-var(txn.hm_body_size) req.body_size if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body }
      http-request wait-for-body time {{ bodyWait }} if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body }
      {# wait-for-body also returns when the buffer fills: https://docs.haproxy.org/3.0/configuration.html#4.2-http-request%20wait-for-body #}
      http-request set-var(txn.denied_by) str(hmac_body_incomplete) if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body } !{ req.body_len,sub(txn.hm_body_size) -m int 0 }
      http-request return status 413 if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body } !{ req.body_len,sub(txn.hm_body_size) -m int 0 }
      {%- for _, a := range sort_strings(algs) %}
      http-request set-var(txn.haptic_hmac) req.body,hmac({{ a }},txn.hm_key),hex,lower if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str body } { var(txn.hm_alg) -m str {{ a }} }
      http-request set-var(txn.haptic_hmac) path,hmac({{ a }},txn.hm_key),hex,lower if { var(txn.hm_state) -m str ok } { var(txn.hm_signed) -m str path } { var(txn.hm_alg) -m str {{ a }} }
      {%- end %}
      {%- for _, h := range sort_strings(hdrs) %}
      http-request set-var(txn.denied_by) str(hmac) if { var(txn.hm_state) -m str ok } { var(txn.hm_hdr) -m str {{ h }} } !{ req.hdr({{ h }}),strcmp(txn.haptic_hmac) -m int 0 }
      http-request deny deny_status 401 if { var(txn.hm_state) -m str ok } { var(txn.hm_hdr) -m str {{ h }} } !{ req.hdr({{ h }}),strcmp(txn.haptic_hmac) -m int 0 }
      {%- end %}
      {%- end %}

  # ==========================================================================
  # Consumer-groups authorization: one uniform block per HTTP frontend
  # (frontend-filters-862), after the identity producers (858 JWT, 860 API key).
  # Model: each consumer maps to ONE group; a route allows a SET of groups.
  #   haptic-consumer-group-routes.map  <ns>/<name> → "<secret> <ok|missing|invalid>"
  #   haptic-consumer-group-allow.map   <ns>/<name>|<group> → 1
  #   haptic-consumer-groups.map        <secret>|<consumer> → <group>
  # ==========================================================================
  util-haptic-consumer-group-route:
    template: |-
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- macro HapticConsumerGroupRoute(ingress any, result map[string]any) -%}
        {%- var ns = dig_string(ingress, "", "metadata", "namespace") -%}
        {%- var key = ns + "/" + dig_string(ingress, "", "metadata", "name") -%}
        {%- var cgSecret = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/consumer-groups-secret") -%}
        {%- var allowed = dig_string(ingress, "", "metadata", "annotations", "haproxy-haptic.org/allowed-consumer-groups") -%}
        {#- Fail loud on a half-configured pair: no rule would silently leave the
            route unauthorized (fail-open for a security feature). -#}
        {%- if (cgSecret != "" && allowed == "") || (cgSecret == "" && allowed != "") -%}
          {{- fail("Ingress '" + key + "' sets only one of 'haproxy-haptic.org/consumer-groups-secret' and 'haproxy-haptic.org/allowed-consumer-groups'; consumer-group authorization requires BOTH — a partial config would silently leave the route unauthorized.") -}}
        {%- end -%}
        {%- result["enabled"] = cgSecret != "" && allowed != "" -%}
        {%- result["groups"] = []string{} -%}
        {%- if result["enabled"] == true -%}
          {%- var groups = []string{} -%}
          {%- for _, g := range split(allowed, ",") -%}
            {%- var gt = strip(g) -%}
            {%- if gt != "" -%}
              {%- if !regex_search(gt, "^[!-~]+$") -%}
                {{- fail("Invalid group '" + gt + "' in annotation 'haproxy-haptic.org/allowed-consumer-groups' on Ingress '" + key + "' (whitespace / control characters not permitted).") -}}
              {%- end -%}
              {%- groups = append(groups, gt) -%}
            {%- end -%}
          {%- end -%}
          {%- result["groups"] = groups -%}
          {%- var secretRef = HapticSecretRef(ns, cgSecret, "haproxy-haptic.org/consumer-groups-secret", key) -%}
          {%- var refParts = split(secretRef, "/") -%}
          {%- result["secretRef"] = secretRef -%}
          {%- result["state"] = "ok" -%}
          {#- A non-empty value whose tokens all strip to nothing (", ") passes the
              pair guard but yields no groups; deny rather than skip the check. -#}
          {%- if len(groups) == 0 -%}
            {%- result["state"] = "invalid" -%}
          {%- else if resources.secrets.GetSingle(refParts[0], refParts[1]) == nil -%}
            {%- result["state"] = "missing" -%}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  map-haptic-consumer-group-routes-862-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/consumer-groups-secret']"
        - "metadata.annotations['haproxy-haptic.org/allowed-consumer-groups']"
    template: |-
      {%- import "util-haptic-consumer-group-route" for HapticConsumerGroupRoute -%}
      {%- var route = map[string]any{} -%}
      {{- HapticConsumerGroupRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
      {{ "\n" }}{{ dig_string(item, "", "metadata", "namespace") }}/{{ dig_string(item, "", "metadata", "name") }} {{ route["secretRef"] }} {{ route["state"] }}
      {%- end -%}

  map-haptic-consumer-group-allow-862-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/consumer-groups-secret']"
        - "metadata.annotations['haproxy-haptic.org/allowed-consumer-groups']"
    template: |-
      {%- import "util-haptic-consumer-group-route" for HapticConsumerGroupRoute -%}
      {%- var route = map[string]any{} -%}
      {{- HapticConsumerGroupRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {%- var key = dig_string(item, "", "metadata", "namespace") + "/" + dig_string(item, "", "metadata", "name") -%}
        {%- for _, g := range route["groups"].([]string) -%}
      {{ "\n" }}{{ key }}|{{ g }} 1
        {%- end -%}
      {%- end -%}

  map-haptic-consumer-groups-862-haptic:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['haproxy-haptic.org/consumer-groups-secret']"]
    template: |-
      {%- import "util-haptic-secret-ref" for HapticSecretRef -%}
      {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
      {%- var key = ns + "/" + dig_string(item, "", "metadata", "name") -%}
      {%- var cgSecret = dig_string(item, "", "metadata", "annotations", "haproxy-haptic.org/consumer-groups-secret") -%}
      {%- if cgSecret != "" -%}
        {%- var secretRef = HapticSecretRef(ns, cgSecret, "haproxy-haptic.org/consumer-groups-secret", key) -%}
        {%- var refParts = split(secretRef, "/") -%}
        {%- var secret = resources.secrets.GetSingle(refParts[0], refParts[1]) -%}
        {%- if secret != nil -%}
          {%- var groupsData = secret.Data["groups"] | b64decode() | tostring() -%}
          {%- if strip(groupsData) == "" -%}
            {{- fail("Secret '" + secretRef + "' referenced by annotation 'haproxy-haptic.org/consumer-groups-secret' on Ingress '" + key + "' has an empty or missing 'groups' data key.") -}}
          {%- end -%}
          {%- for _, ln := range split(groupsData, "\n") -%}
            {%- var t = strip(ln) -%}
            {%- if t == "" %}{%- continue %}{%- end -%}
            {%- if !strings_contains(t, ":") -%}
              {{- fail("Secret '" + secretRef + "' (consumer-groups) on Ingress '" + key + "' has a malformed line '" + t + "'; expected '<consumer>:<group>'.") -}}
            {%- end -%}
            {%- var kv = strings_splitn(t, ":", 2) -%}
            {%- var consumer = strip(kv[0]) -%}
            {%- var grp = strip(kv[1]) -%}
            {%- if !regex_search(consumer, "^[!-~]+$") || !regex_search(grp, "^[!-~]+$") -%}
              {{- fail("Secret '" + secretRef + "' (consumer-groups) on Ingress '" + key + "' has an invalid consumer or group token (whitespace / control characters not permitted).") -}}
            {%- end -%}
            {{- shared.Unique("map-haptic-consumer-groups", secretRef + "|" + consumer, "\n" + secretRef + "|" + consumer + " " + grp) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-862-haptic-consumer-groups-names:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['haproxy-haptic.org/consumer-groups-secret']"
        - "metadata.annotations['haproxy-haptic.org/allowed-consumer-groups']"
      group: haptic-consumer-group-routes
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-haptic-consumer-group-route" for HapticConsumerGroupRoute -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var route = map[string]any{} -%}
      {{- HapticConsumerGroupRoute(item, route) -}}
      {%- if route["enabled"] == true -%}
        {{- shared.Publish("any", "any", "any") -}}
        {%- var ns = dig_string(item, "", "metadata", "namespace") -%}
        {%- var name = dig_string(item, "", "metadata", "name") -%}
        {%- var key = ns + "/" + name -%}
        {%- if tostring(route["state"]) == "invalid" -%}
          {{- WebhookRejectOrWarn(resources.ingresses.GetSingle(ns, name), "AllowedConsumerGroupsEmpty", "Ingress " + key + " sets 'haproxy-haptic.org/allowed-consumer-groups' to a value with no group names in it. Consumer-group authorization cannot be enforced against an empty set, so this route fails closed with 503. List at least one group, or remove the annotation.") -}}
        {%- else if tostring(route["state"]) == "missing" -%}
          {{- recordEvent(resources.ingresses.GetSingle(ns, name), "ConsumerGroupsSecretMissing", "Ingress " + key + " references Secret '" + tostring(route["secretRef"]) + "' in 'haproxy-haptic.org/consumer-groups-secret', but it could not be resolved. Requests are denied with 503 until the Secret is present.") -}}
        {%- end -%}
      {%- end -%}

  frontend-filters-862-haptic-consumer-groups:
    requires: [ingresses]
    template: |
      {#
        Annotations:
          - haproxy-haptic.org/consumer-groups-secret: "<ns/name>" | "<name>" (required)
          - haproxy-haptic.org/allowed-consumer-groups: comma-separated group names
            the route permits (required)

        Requires an authenticated consumer (JWT at 858 or API key at 860 sets
        txn.haptic_consumer); with no consumer the group lookup misses and the
        request is denied 403. A missing Secret or an empty group list denies 503.
        Emitted only while a route carries consumer-group settings; the first
        one reloads once, as does removing the last.
      #}
      {%- if incremental_value_count("haptic-consumer-group-routes", "any") > 0 -%}
      {%- var routes, e1 = pathResolver.GetPath("haptic-consumer-group-routes.map", "map") -%}
      {%- if e1 != nil -%}{{ fail(tostring(e1)) }}{%- end -%}
      {%- var allow, e2 = pathResolver.GetPath("haptic-consumer-group-allow.map", "map") -%}
      {%- if e2 != nil -%}{{ fail(tostring(e2)) }}{%- end -%}
      {%- var groups, e3 = pathResolver.GetPath("haptic-consumer-groups.map", "map") -%}
      {%- if e3 != nil -%}{{ fail(tostring(e3)) }}{%- end -%}
      {{ "\n" }}# haptic/consumer-groups
      http-request set-var(txn.cg_cfg) var(txn.resource_key),map({{ routes }})
      http-request set-var(txn.cg_secret) var(txn.cg_cfg),field(1,' ') if { var(txn.cg_cfg) -m found }
      http-request set-var(txn.cg_state) var(txn.cg_cfg),field(2,' ') if { var(txn.cg_cfg) -m found }
      http-request set-var(txn.denied_by) str(consumer_groups_unavailable) if { var(txn.cg_state) -m str missing invalid }
      http-request deny deny_status 503 if { var(txn.cg_state) -m str missing invalid }
      http-request set-var(txn.cg_group) var(txn.cg_secret),concat(|,txn.haptic_consumer),map({{ groups }}) if { var(txn.cg_state) -m str ok } { var(txn.haptic_consumer) -m found }
      http-request set-var(txn.denied_by) str(consumer_groups) if { var(txn.cg_state) -m str ok } !{ var(txn.resource_key),concat(|,txn.cg_group),map({{ allow }}) -m found }
      http-request deny deny_status 403 if { var(txn.cg_state) -m str ok } !{ var(txn.resource_key),concat(|,txn.cg_group),map({{ allow }}) -m found }
      {%- end %}
