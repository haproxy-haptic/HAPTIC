# haptic-annotations library — backend-directives validation tests.
# Timeouts, load-balance, consistent-hash, health checks, and server tuning
# (maxconn/maxqueue/weight/scale-server-slots/proxy-protocol/fullconn).
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  test-haptic-load-balance-hash-type-consistent:
    description: >-
      A hash-family balance (source/uri/hdr/url_param/rdp-cookie/hash) gets
      `hash-type consistent` injected into its profile so pod-named servers can
      be added at runtime without a reload; the servers stay pod-named. A
      non-hash algorithm (leastconn) gets no hash-type.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-source
            annotations: {haproxy-haptic.org/load-balance: source}
          spec:
            ingressClassName: haproxy
            rules:
              - host: src.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-least
            annotations: {haproxy-haptic.org/load-balance: leastconn}
          spec:
            ingressClassName: haproxy
            rules:
              - host: least.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # The hash-family backend's profile carries balance source + hash-type consistent.
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$\n\s+balance source\n\s+hash-type consistent$'}
      # It is still pod-named (add-server eligible now that hash-type is consistent).
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_lb-source_svc_echo_80 from haptic-be-\w+$.*?^\s+server echo-pod-1 10\.0\.0\.1:8080'}
      # leastconn is not hash-family, so no hash-type is injected for it.
      - {type: not_contains, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$\n\s+balance leastconn\n\s+hash-type'}

  test-haptic-timeouts:
    description: >-
      haproxy-haptic.org timeout annotations render timeout directives into the
      backend's profile; the section itself stays plain.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: timeout-ingress
            annotations:
              haproxy-haptic.org/timeout-connect: "10s"
              haproxy-haptic.org/timeout-server: "60s"
              haproxy-haptic.org/timeout-queue: "30s"
              haproxy-haptic.org/timeout-tunnel: "1h"
              haproxy-haptic.org/timeout-http-request: "15s"
              haproxy-haptic.org/timeout-keep-alive: "20s"
              haproxy-haptic.org/timeout-check: "5s"
          spec:
            ingressClassName: haptic
            rules:
              - host: timeout.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "timeout connect 10s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout queue 30s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout http-request 15s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout http-keep-alive 20s"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout check 5s"}
      # A timeout is valid in a defaults, so base carries it in the shared
      # profile; the section keeps only the marker comment and the servers, and a
      # comment never makes a backend structural.
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$(?:\n[ \t]+[^\n]*)*?\n[ \t]+timeout connect 10s$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_timeout-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}
      - {type: contains, target: haproxy.cfg, pattern: '# haptic/timeouts \(default/timeout-ingress\)'}
      # The settable server/tunnel timeouts live URL-free as integer ms in
      # backend-timeouts.map (60s -> 60000, 1h -> 3600000), read by the uniform
      # set-timeout line every backend carries — editing them is a map-only change.
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_timeout-ingress_svc_echo_80\|server 60000'}
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_timeout-ingress_svc_echo_80\|tunnel 3600000'}
      # Exactly one uniform set-timeout line per backend (one backend here), for
      # each of server and tunnel — the value never appears in the config.
      - {type: match_count, target: haproxy.cfg, expected: "1", pattern: 'http-request set-timeout server var\(txn\.backend_name\),concat\(\|server\),map_str_int\([^)]*backend-timeouts\.map\) if \{ var\(txn\.backend_name\),concat\(\|server\),map_str_int\([^)]*backend-timeouts\.map\) -m found \}'}
      - {type: match_count, target: haproxy.cfg, expected: "1", pattern: 'http-request set-timeout tunnel var\(txn\.backend_name\),concat\(\|tunnel\),map_str_int\([^)]*backend-timeouts\.map\) if \{ var\(txn\.backend_name\),concat\(\|tunnel\),map_str_int\([^)]*backend-timeouts\.map\) -m found \}'}
      # The raw value is never a per-backend directive (negative controls).
      - {type: not_contains, target: haproxy.cfg, pattern: "timeout server 60s"}
      - {type: not_contains, target: haproxy.cfg, pattern: "timeout tunnel 1h"}

  test-haptic-timeout-overflow-admission-rejected:
    description: A timeout whose digit count would overflow toint (which returns 0) is rejected at render time, not silently written as `0` — a 0ms timeout means "no timeout", so the malformed annotation would otherwise disable the timeout it was meant to set.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: to-overflow, annotations: {haproxy-haptic.org/timeout-server: "99999999999999999999d"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: ovf.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "is not an HAProxy duration"}

  test-haptic-timeout-overflow-reconcile-skips-not-zeroed:
    description: On reconcile the overflow-length timeout is skipped, never written to backend-timeouts.map as `0` (which would disable the timeout), while a valid sibling still lands.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: to-overflow, annotations: {haproxy-haptic.org/timeout-server: "99999999999999999999d"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: ovf.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: to-good, annotations: {haproxy-haptic.org/timeout-server: "45s"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: good.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_to-good_svc_echo_80\|server 45000'}
      # The overflow value never lands, and never as a 0 (no-timeout) entry.
      - {type: not_contains, target: 'map:backend-timeouts.map', pattern: 'default_to-overflow_svc_echo_80\|server'}

  test-haptic-load-balance:
    description: haproxy-haptic.org/load-balance accepts exact and parameterized algorithms
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-ingress
            annotations:
              haproxy-haptic.org/load-balance: "hdr(X-Custom)"
          spec:
            ingressClassName: haptic
            rules:
              - host: lb.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'balance hdr\(X-Custom\)'}

  test-haptic-upstream-hash:
    description: haproxy-haptic.org/consistent-hash-by maps to a HAProxy consistent hash
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-ingress
            annotations:
              haproxy-haptic.org/consistent-hash-by: "$request_uri"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # balance + hash-type land in the backend's PROFILE (dynamic-eligible), not
      # the backend body — anchored so a move back to the body fails the test.
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$\n\s+balance uri\n\s+hash-type consistent$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend default_hash-ingress_svc_echo_80 from haptic-be-\w+$'}

  test-haptic-health-checks:
    description: haproxy-haptic.org health-check annotations render httpchk and default-server flags
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: health-ingress
            annotations:
              haproxy-haptic.org/health-check-uri: "/healthz"
              haproxy-haptic.org/health-check-port: "8082"
              haproxy-haptic.org/health-check-interval: "7s"
              haproxy-haptic.org/health-check-fall: "4"
              haproxy-haptic.org/health-check-rise: "5"
          spec:
            ingressClassName: haptic
            rules:
              - host: health.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "option httpchk GET /healthz"}
      - {type: contains, target: haproxy.cfg, pattern: "port 8082"}
      - {type: contains, target: haproxy.cfg, pattern: "inter 7s"}
      - {type: contains, target: haproxy.cfg, pattern: "fall 4"}
      - {type: contains, target: haproxy.cfg, pattern: "rise 5"}

  test-haptic-server-tuning:
    description: maxconn/maxqueue/weight/proxy-protocol/fullconn render together; scale-server-slots is tolerated (warned, no effect)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tuning-ingress
            annotations:
              haproxy-haptic.org/maxconn-server: "100"
              haproxy-haptic.org/maxqueue-server: "200"
              haproxy-haptic.org/initial-weight: "50"
              haproxy-haptic.org/proxy-protocol: "proxy-v2"
              haproxy-haptic.org/scale-server-slots: "5"
              haproxy-haptic.org/fullconn: "300"
          spec:
            ingressClassName: haptic
            rules:
              - host: tuning.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "maxconn 100"}
      - {type: contains, target: haproxy.cfg, pattern: "maxqueue 200"}
      - {type: contains, target: haproxy.cfg, pattern: "weight 50"}
      - {type: contains, target: haproxy.cfg, pattern: "send-proxy-v2"}
      - {type: contains, target: haproxy.cfg, pattern: "fullconn 300"}
      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_[0-9]"}

  test-haptic-pod-maxconn-on-server-lines:
    description: pod-maxconn divides the budget by the power-of-two ready HAProxy pod count and sets it on the server lines, not default-server
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pod-maxconn
            annotations: {haproxy-haptic.org/pod-maxconn: "3000"}
          spec:
            ingressClassName: haptic
            rules:
              - host: pod-maxconn.example.com
                http: *httpRoot
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: echo-abc
            namespace: default
            labels: {kubernetes.io/service-name: echo}
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.7"]
              targetRef: {kind: Pod, name: echo-0}
          ports:
            - {port: 8080, protocol: TCP}
      haproxy-pods:
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: haptic-system, name: haproxy-pod-1}
          status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: haptic-system, name: haproxy-pod-2}
          status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
        - apiVersion: v1
          kind: Pod
          metadata: {namespace: haptic-system, name: haproxy-pod-3}
          status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "server echo-0 10\\.0\\.0\\.7:8080 .*maxconn 750"}
      - {type: not_contains, target: haproxy.cfg, pattern: "default-server [^\\n]*maxconn"}
