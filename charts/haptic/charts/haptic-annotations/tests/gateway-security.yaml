# HAPTIC-native annotation library — API-gateway request gating tests.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: dummy, port: { number: 80 } } }

validationTests:
  test-haptic-gateway-security:
    description: >-
      allowed-methods denies 405, require-content-type denies 415 on body
      methods, require-headers denies 400 per missing header, mock-response and
      fixed-response return from per-route maps (one rule per status and
      content-type pair, the URL-encoded body decoded per request).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: gate
            annotations:
              haproxy-haptic.org/allowed-methods: "GET,POST"
              haproxy-haptic.org/require-content-type: "application/json"
              haproxy-haptic.org/require-headers: "X-Api-Key,X-Tenant-Id"
          spec:
            ingressClassName: haptic
            rules:
              - host: gate.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mock
            annotations:
              haproxy-haptic.org/mock-response: '{"stub":true}'
          spec:
            ingressClassName: haptic
            rules:
              - host: mock.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: term
            annotations:
              haproxy-haptic.org/fixed-response: "true"
              haproxy-haptic.org/fixed-response-code: "503"
              haproxy-haptic.org/fixed-response-body: "under maintenance"
          spec:
            ingressClassName: haptic
            rules:
              - host: term.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-method-routes.map", pattern: '(?m)^default/gate 1$'}
      - {type: contains, target: "map:haptic-methods.map", pattern: '(?m)^default/gate\|GET 1$'}
      - {type: contains, target: "map:haptic-methods.map", pattern: '(?m)^default/gate\|POST 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 405 if \{ var\(txn\.am_method\) -m found \} !\{ var\(txn\.resource_key\),concat\(\|,txn\.am_method\),map\(\S*/haptic-methods\.map\) -m found \}'}
      - {type: contains, target: "map:haptic-content-types.map", pattern: '(?m)^default/gate\|application/json 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ct_route\) var\(txn\.resource_key\),map\(\S*/haptic-content-type-routes\.map\) if \{ method POST PUT PATCH \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 415 if \{ var\(txn\.ct_route\) -m found \} !\{ var\(txn\.resource_key\),concat\(\|,txn\.ct_in\),map_beg\(\S*/haptic-content-types\.map\) -m found \}'}
      - {type: contains, target: "map:haptic-required-headers.map", pattern: '(?m)^default/gate\|X-Api-Key 1$'}
      - {type: contains, target: "map:haptic-required-headers.map", pattern: '(?m)^default/gate\|X-Tenant-Id 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 400 if \{ var\(txn\.resource_key\),concat\(\|X-Api-Key\),map\(\S*/haptic-required-headers\.map\) -m found \} !\{ req\.hdr\(X-Api-Key\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 400 if \{ var\(txn\.resource_key\),concat\(\|X-Tenant-Id\),map\(\S*/haptic-required-headers\.map\) -m found \} !\{ req\.hdr\(X-Tenant-Id\) -m found \}'}
      - {type: contains, target: "map:haptic-return-routes.map", pattern: '(?m)^default/mock 200\|application/json$'}
      - {type: contains, target: "map:haptic-return-body.map", pattern: '(?m)^default/mock %7b%22stub%22%3atrue%7d$'}
      - {type: contains, target: "map:haptic-return-routes.map", pattern: '(?m)^default/term 503\|text/plain$'}
      - {type: contains, target: "map:haptic-return-body.map", pattern: '(?m)^default/term under%20maintenance$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 200 content-type "application/json" lf-string %\[var\(txn\.resource_key\),map\(\S*/haptic-return-body\.map\),url_dec\(1\)\] if \{ var\(txn\.resource_key\),map\(\S*/haptic-return-routes\.map\) -m str "200\|application/json" \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 503 content-type "text/plain" lf-string .* -m str "503\|text/plain" \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'string "under maintenance"'}

  test-haptic-allowed-methods-wildcard-and-hostless-enforced:
    description: >-
      The 405 method gate must fire on a wildcard host and on an Ingress with no
      host. Both were silently unenforced while the route kept serving every
      method, because the gate matched the Host header exactly.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: methods-wild
            annotations:
              haproxy-haptic.org/allowed-methods: "GET,HEAD"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.methods.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: methods-hostless
            annotations:
              haproxy-haptic.org/allowed-methods: "GET"
          spec:
            ingressClassName: haptic
            rules:
              - http:
                  paths:
                    - { path: /hostless, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-methods.map", pattern: '(?m)^default/methods-wild\|GET 1$'}
      - {type: contains, target: "map:haptic-methods.map", pattern: '(?m)^default/methods-wild\|HEAD 1$'}
      # The host-less Ingress must be enforced at all — it previously emitted nothing.
      - {type: contains, target: "map:haptic-method-routes.map", pattern: '(?m)^default/methods-hostless 1$'}
      - {type: contains, target: "map:haptic-methods.map", pattern: '(?m)^default/methods-hostless\|GET 1$'}
      # Never gate enforcement on an exact host match again.
      - {type: not_contains, target: haproxy.cfg, pattern: 'deny_status 405 if \{ var\(txn\.host\)'}

  test-haptic-require-sni-host-match:
    description: >-
      require-sni-host-match "true" answers 421 on that route when the Host
      differs from the TLS SNI; a route without it is not in the map (#567).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: strict
            annotations:
              haproxy-haptic.org/require-sni-host-match: "true"
          spec:
            ingressClassName: haptic
            rules:
              - {host: strict.example.com, http: *httpRoot}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lenient
            annotations:
              haproxy-haptic.org/require-sni-host-match: "false"
          spec:
            ingressClassName: haptic
            rules:
              - {host: lenient.example.com, http: *httpRoot}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-sni-host-routes.map", pattern: '(?m)^default/strict 1$'}
      - {type: not_contains, target: "map:haptic-sni-host-routes.map", pattern: 'lenient'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 421 if \{ ssl_fc \} \{ ssl_fc_has_sni 1 \} \{ var\(txn\.sni_host\) -m found \} \{ var\(txn\.resource_key\),map\(\S*haptic-sni-host-routes\.map\) -m found \} !\{ ssl_fc_sni,lower,strcmp\(txn\.sni_host\) eq 0 \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.denied_by\) str\(sni_host_mismatch\) if \{ ssl_fc \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: '# ssl/sni-host-match'}

  test-haptic-require-sni-host-match-invalid:
    description: A require-sni-host-match value other than "true" or "false" fails the render.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: strict
            annotations:
              haproxy-haptic.org/require-sni-host-match: "yes"
          spec:
            ingressClassName: haptic
            rules:
              - {host: strict.example.com, http: *httpRoot}
    assertions:
      - {type: contains, target: rendering_error, pattern: 'require-sni-host-match to .yes.\. Set "true" or "false"'}

  test-ssl-require-sni-host-match-global:
    description: >-
      tls.requireSniHostMatch applies the 421 to every HTTPS request carrying
      SNI, with no route scope (#567).
    extraContext: {tls: {requireSniHostMatch: true}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: plain}
          spec:
            ingressClassName: haptic
            rules:
              - {host: plain.example.com, http: *httpRoot}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '# ssl/sni-host-match'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request return status 421 if \{ ssl_fc \} \{ ssl_fc_has_sni 1 \} \{ var\(txn\.sni_host\) -m found \}  !\{ ssl_fc_sni,lower,strcmp\(txn\.sni_host\) eq 0 \}'

  test-ssl-require-sni-host-match-off-by-default:
    description: Without the setting or the annotation no 421 Host/SNI rule renders.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: plain}
          spec:
            ingressClassName: haptic
            rules:
              - {host: plain.example.com, http: *httpRoot}
    assertions:
      - {type: not_contains, target: haproxy.cfg, pattern: 'str\(sni_host_mismatch\)'}
