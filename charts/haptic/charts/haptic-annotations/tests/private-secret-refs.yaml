# HAPTIC-native annotation library — private Secret material is read only from
# the Ingress namespace, and no message echoes Secret data.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: echo, port: { number: 80 } } }
  foreignSecrets: &foreignSecrets
    - apiVersion: v1
      kind: Secret
      metadata: { namespace: other, name: leak }
      type: Opaque
      data:
        # LEAKMARKERAK:intruder
        keys: TEVBS01BUktFUkFLOmludHJ1ZGVy
        # LEAKMARKERHM
        secret: TEVBS01BUktFUkhN
        # LEAKMARKERCG:admins
        groups: TEVBS01BUktFUkNHOmFkbWlucw==
        # leakmarkerUser:<bcrypt>
        auth: bGVha21hcmtlclVzZXI6JDJ5JDA1JGFiY2RlZmdoaWprbG1ub3BxcnN0dXVNWjlQM3lHcVE0bUdrQ3FLNlExaGsydDdiWnIxWWI2
        # {"title":"LEAKMARKERRS"}
        schema.json: eyJ0aXRsZSI6IkxFQUtNQVJLRVJSUyJ9
        tls.crt: 
        tls.key: 
  foreignIngress: &foreignIngress
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      namespace: default
      name: foreign
      annotations:
        haproxy-haptic.org/api-key-secret: "other/leak"
        haproxy-haptic.org/hmac-secret: "other/leak"
        haproxy-haptic.org/consumer-groups-secret: "other/leak"
        haproxy-haptic.org/allowed-consumer-groups: "admins"
        haproxy-haptic.org/auth-type: "basic"
        haproxy-haptic.org/auth-secret: "other/leak"
        haproxy-haptic.org/backend-protocol: "https"
        haproxy-haptic.org/backend-crt-secret: "other/leak"
    spec:
      ingressClassName: haptic
      rules:
        - host: foreign.example.com
          http: *httpRoot

validationTests:
  test-haptic-foreign-private-secrets-fail-closed:
    description: >-
      api-key, hmac, consumer-groups, basic-auth and backend-crt Secrets in
      another namespace are never read: each feature denies the route with 503
      and records a Warning Event.
    extraContext: {renderMode: reconcile}
    fixtures:
      secrets: *foreignSecrets
      ingresses: [*foreignIngress]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/foreign hdr X-API-Key _ foreign _ false$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.ak_state\) -m str missing nosecret foreign \}'}
      - {type: contains, target: "map:haptic-hmac-routes.map", pattern: '(?m)^default/foreign sha256 X-Signature body foreign _$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.hm_state\) -m str missing nosecret foreign \}'}
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/foreign _ foreign$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.cg_state\) -m str missing invalid foreign \}'}
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/foreign foreign$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.ba_cfg\) -m str missing nosecret foreign \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'userlist haptic_auth_other_leak'}
      - {type: contains, target: "map:haptic-route-unavailable.map", pattern: '(?m)^default/foreign backend_tls_unavailable$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.resource_key\),map\([^)]*haptic-route-unavailable\.map\) -m found \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: ' crt other-leak'}
      - {type: not_exists, target: "cert:other-leak-backend-tls-client.pem"}
      - {type: contains, target: events, pattern: 'Warning ApiKeySecretForeign .*HAPTIC reads this Secret only from the Ingress namespace default; this route fails closed with 503\. Copy the Secret into namespace default'}
      - {type: contains, target: events, pattern: 'Warning HMACSecretForeign '}
      - {type: contains, target: events, pattern: 'Warning ConsumerGroupsSecretForeign '}
      - {type: contains, target: events, pattern: 'Warning AuthSecretForeign '}
      - {type: contains, target: events, pattern: 'Warning BackendCrtSecretForeign '}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?i)leakmarker|intruder|TEVBS01BUktFUk'}
      - {type: not_contains, target: "map:haptic-apikeys.map", pattern: '(?i)leakmarker|intruder|other/leak'}
      - {type: not_contains, target: "map:haptic-hmac-routes.map", pattern: 'TEVBS01BUktFUkhN'}
      - {type: not_contains, target: "map:haptic-consumer-groups.map", pattern: '(?i)leakmarker|other/leak'}
      - {type: not_contains, target: events, pattern: '(?i)leakmarker|intruder|TEVBS01BUktFUk|BEGIN'}

  test-haptic-foreign-private-secret-rejected-at-admission:
    description: Admission refuses an Ingress whose private Secret reference names another namespace.
    extraContext: {renderMode: admission}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-ak
            annotations:
              haproxy-haptic.org/api-key-secret: "other/leak"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-ak.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/foreign-ak references Secret 'other/leak' in 'haproxy-haptic\\.org/api-key-secret', but HAPTIC reads this Secret only from the Ingress namespace default; the Ingress is rejected\\. Copy the Secret into namespace default and reference it by name\\."}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker|intruder'}

  test-haptic-foreign-basic-auth-secret-rejected-at-admission:
    description: Admission refuses a basic-auth Secret in another namespace.
    extraContext: {renderMode: admission}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-ba
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "other/leak"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-ba.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "'haproxy-haptic\\.org/auth-secret', but HAPTIC reads this Secret only from the Ingress namespace default; the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker'}

  test-haptic-foreign-backend-crt-secret-rejected-at-admission:
    description: Admission refuses a backend client certificate in another namespace.
    extraContext: {renderMode: admission}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-crt
            annotations:
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-crt-secret: "other/leak"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-crt.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "'haproxy-haptic\\.org/backend-crt-secret', but HAPTIC reads this Secret only from the Ingress namespace default; the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker|BEGIN'}

  test-haptic-foreign-hmac-and-consumer-groups-rejected-at-admission:
    description: Admission refuses hmac and consumer-groups Secrets in another namespace.
    extraContext: {renderMode: admission}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-hm
            annotations:
              haproxy-haptic.org/hmac-secret: "other/leak"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-hm.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-cg
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "other/leak"
              haproxy-haptic.org/allowed-consumer-groups: "admins"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-cg.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "HAPTIC reads this Secret only from the Ingress namespace default; the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker|TEVBS01BUktFUk'}

  test-haptic-own-namespace-qualified-secret-refs-accepted:
    description: >-
      A namespace-qualified reference naming the Ingress's own namespace is
      accepted, and a bare API key gets a hashed consumer id so the key never
      reaches the access log or the forwarded consumer header.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: own }
          type: kubernetes.io/tls
          data:
            # barekey-7c1d2e / named-key:alice
            keys: YmFyZWtleS03YzFkMmUKbmFtZWQta2V5OmFsaWNlCg==
            secret: c2hhcmVkLWtleQ==
            # alice:admins
            groups: YWxpY2U6YWRtaW5zCg==
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: own
            annotations:
              haproxy-haptic.org/api-key-secret: "default/own"
              haproxy-haptic.org/api-key-consumer-header: "X-Consumer-ID"
              haproxy-haptic.org/hmac-secret: "default/own"
              haproxy-haptic.org/consumer-groups-secret: "default/own"
              haproxy-haptic.org/allowed-consumer-groups: "admins"
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-crt-secret: "default/own"
          spec:
            ingressClassName: haptic
            rules:
              - host: own.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/own hdr X-API-Key default/own ok X-Consumer-ID true$'}
      - {type: contains, target: "map:haptic-apikeys.map", pattern: '(?m)^default/own\|barekey-7c1d2e key-eb8f39f36d07$'}
      - {type: contains, target: "map:haptic-apikeys.map", pattern: '(?m)^default/own\|named-key alice$'}
      - {type: not_contains, target: "map:haptic-apikeys.map", pattern: 'barekey-7c1d2e barekey'}
      - {type: contains, target: "map:haptic-hmac-routes.map", pattern: '(?m)^default/own sha256 X-Signature body ok c2hhcmVkLWtleQ==$'}
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/own default/own ok$'}
      - {type: contains, target: "map:haptic-consumer-groups.map", pattern: '(?m)^default/own\|alice admins$'}
      - {type: contains, target: haproxy.cfg, pattern: ' crt default-own-backend-tls-client\.pem'}
      - {type: not_contains, target: "map:haptic-route-unavailable.map", pattern: 'default/own'}
      - {type: not_contains, target: events, pattern: 'Foreign'}

  test-haptic-own-namespace-qualified-basic-auth-accepted:
    description: A namespace-qualified basic-auth Secret in the Ingress's own namespace builds its userlist.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: own-auth }
          type: Opaque
          data:
            auth: bGVha21hcmtlclVzZXI6JDJ5JDA1JGFiY2RlZmdoaWprbG1ub3BxcnN0dXVNWjlQM3lHcVE0bUdrQ3FLNlExaGsydDdiWnIxWWI2
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: own-ba
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "default/own-auth"
          spec:
            ingressClassName: haptic
            rules:
              - host: own-ba.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/own-ba ok haptic_auth_default_own-auth Restricted$'}
      - {type: contains, target: haproxy.cfg, pattern: 'userlist haptic_auth_default_own-auth'}

  test-haptic-consumer-groups-malformed-line-not-echoed:
    description: A malformed consumer-groups line is reported by its line number, never by its content.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg-bad }
          type: Opaque
          # LEAKMARKERLINE / alice:admins
          data: {groups: TEVBS01BUktFUkxJTkUKYWxpY2U6YWRtaW5zCg==}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cg-bad
            annotations:
              haproxy-haptic.org/consumer-groups-secret: "cg-bad"
              haproxy-haptic.org/allowed-consumer-groups: "admins"
          spec:
            ingressClassName: haptic
            rules:
              - host: cg-bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Secret 'default/cg-bad' \\(consumer-groups\\) on Ingress 'default/cg-bad' has a malformed line 1 in 'groups'"}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker'}

  test-haptic-request-schema-foreign-secret-fails-closed:
    _helm_skip_test: '{{ if not .Values.controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled }}true{{ end }}'
    description: >-
      A request-schema-secret in another namespace is never read: the route is
      denied with 503 and gets a Warning Event.
    extraContext: {renderMode: reconcile}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-rs
            annotations:
              haproxy-haptic.org/request-schema-secret: "other/leak:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-rs.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-route-unavailable.map", pattern: '(?m)^default/foreign-rs request_schema_unavailable$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.denied_by\) str\(request_schema_unavailable\) if \{ var\(txn\.resource_key\),map\([^)]*haptic-route-unavailable\.map\) -m str request_schema_unavailable \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.resource_key\),map\([^)]*haptic-route-unavailable\.map\) -m found \}'}
      - {type: not_contains, target: "map:request-schema.map", pattern: 'default/foreign-rs'}
      - {type: not_contains, target: "file:spoa-hub-config.toml", pattern: 'eyJ0aXRsZSI6IkxFQUtNQVJLRVJSUyJ9|other/leak'}
      - {type: contains, target: events, pattern: 'Warning RequestSchemaSecretForeign '}
      - {type: not_contains, target: events, pattern: '(?i)leakmarker|eyJ0aXRsZSI6'}

  test-haptic-request-schema-foreign-secret-rejected-at-admission:
    _helm_skip_test: '{{ if not .Values.controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled }}true{{ end }}'
    description: Admission refuses a request-schema-secret in another namespace.
    extraContext: {renderMode: admission}
    fixtures:
      secrets: *foreignSecrets
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: foreign-rs
            annotations:
              haproxy-haptic.org/request-schema-secret: "other/leak:schema.json"
          spec:
            ingressClassName: haptic
            rules:
              - host: foreign-rs.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "'haproxy-haptic\\.org/request-schema-secret', but HAPTIC reads this Secret only from the Ingress namespace default; the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: '(?i)leakmarker|eyJ0aXRsZSI6'}

  test-haptic-request-schema-own-namespace-qualified-secret-accepted:
    _helm_skip_test: '{{ if not .Values.controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled }}true{{ end }}'
    description: A namespace-qualified request-schema-secret in the Ingress's own namespace is used.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: secret-schema}
          data: {schema.json: eyJ0eXBlIjoib2JqZWN0In0=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: own-rs
            annotations:
              haproxy-haptic.org/request-schema-secret: "default/secret-schema"
          spec:
            ingressClassName: haptic
            rules:
              - host: own-rs.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:request-schema.map", pattern: "default/own-rs secret/default/secret-schema/schema\\.json/application/json"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'request_schema_unavailable'}
