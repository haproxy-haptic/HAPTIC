# HAPTIC-native annotation library — frontend-filters validation tests.
# Covers forwardfor, request/response-set-header + src-ip-header + request-capture,
# CORS, allow/deny-list access control, and response-cookie / response-location-rewrite.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:

  test-haptic-forwardfor:
    description: >-
      haproxy-haptic.org/forwardfor maps add to append, update to replace, and
      keeps ifmissing and ignore; a src-ip-header naming X-Forwarded-For means
      append unless forwardfor is set. Base's forwarded-headers rules apply the
      mode before and after set-src reads the header.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ff-add, annotations: {haproxy-haptic.org/forwardfor: "add"}}
          spec: {ingressClassName: haptic, rules: [{host: ff-add.example.com, http: *httpRoot}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ff-update, annotations: {haproxy-haptic.org/forwardfor: "update", haproxy-haptic.org/src-ip-header: X-Forwarded-For}}
          spec: {ingressClassName: haptic, rules: [{host: ff-update.example.com, http: *httpRoot}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: src-xff, annotations: {haproxy-haptic.org/src-ip-header: x-forwarded-for}}
          spec: {ingressClassName: haptic, rules: [{host: src-xff.example.com, http: *httpRoot}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ff-ifmissing, annotations: {haproxy-haptic.org/forwardfor: "ifmissing"}}
          spec: {ingressClassName: haptic, rules: [{host: ff-ifmissing.example.com, http: *httpRoot}]}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ff-ignore, annotations: {haproxy-haptic.org/forwardfor: "ignore"}}
          spec: {ingressClassName: haptic, rules: [{host: ff-ignore.example.com, http: *httpRoot}]}
    assertions:
      - type: haproxy_valid
      - type: equals
        target: map:ing-xff-routes.map
        expected: "default/ff-add append\ndefault/ff-ifmissing ifmissing\ndefault/ff-ignore ignore\ndefault/ff-update replace\ndefault/src-xff append\n"
      - type: match_order
        target: haproxy.cfg
        patterns:
          - '(?m)^frontend http_frontend$'
          - 'http-request set-var\(txn\.xff_mode\) var\(txn\.resource_key\),map\(\S*/ing-xff-routes\.map\)\n'
          - 'http-request del-header X-Forwarded-For unless \{ var\(txn\.xff_mode\) -m str append ifmissing ignore \}\n'
          - 'http-request set-src hdr\(X-Forwarded-For\)'
          - 'http-request add-header X-Forwarded-For %\[src\] unless \{ var\(txn\.xff_mode\) -m str ignore \} \|\| \{ var\(txn\.xff_mode\) -m str ifmissing \} \{ req\.hdr\(X-Forwarded-For\) -m found \}\n'

  test-haptic-forwardfor-rejects-unknown-value:
    description: An unknown forwardfor value fails instead of leaving the route on a handling nobody chose.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ff-odd, annotations: {haproxy-haptic.org/forwardfor: "yes"}}
          spec: {ingressClassName: haptic, rules: [{host: ff-odd.example.com, http: *httpRoot}]}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Invalid value 'yes' for annotation 'haproxy-haptic.org/forwardfor'.*Valid values: add, ifmissing, ignore, update"

  test-haptic-header-manipulation:
    description: request/response-set-header (newline form), src-ip-header, and request-capture with a custom length
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-ingress
            annotations:
              haproxy-haptic.org/request-set-header: |-
                X-Custom-Req req-value
                X-Env production
              haproxy-haptic.org/response-set-header: |-
                X-Custom-Resp resp-value
              haproxy-haptic.org/src-ip-header: "X-Real-IP"
              haproxy-haptic.org/request-capture: |-
                X-Forwarded-Proto
                Referer
              haproxy-haptic.org/request-capture-len: "256"
          spec:
            ingressClassName: haptic
            rules:
              - host: hdr.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-twin
            annotations:
              haproxy-haptic.org/request-capture: "X-Forwarded-Proto"
              haproxy-haptic.org/request-capture-len: "256"
          spec:
            ingressClassName: haptic
            rules:
              - host: twin.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # Header modifiers are reload-free: the value lives in ing-reqhdr.map /
      # ing-reshdr.map keyed on the backend, read by one static line per name.
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-custom-req req-value'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-env production'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_hdr-ingress_svc_echo_80\|set\|x-custom-resp resp-value'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header X-Custom-Req %\[var\(txn\.backend_name\),concat\(\|set\|x-custom-req\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header X-Custom-Resp %\[var\(txn\.backend_name\),concat\(\|set\|x-custom-resp\),map\([^)]*ing-reshdr\.map\),url_dec\(1\)\]'}
      # The value never appears as a per-backend directive (negative control).
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header X-Custom-Req "req-value"'}
      - {type: contains, target: "map:ing-src-ip-routes.map", pattern: '(?m)^default/hdr-ingress haptic:X-Real-IP$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-src hdr\(X-Real-IP\) if \{ var\(txn\.resource_key\),map\(\S*/ing-src-ip-routes\.map\) -m str "haptic:X-Real-IP" \}'}
      - {type: not_exists, target: map:ing-xff-routes.map, description: Only a src-ip-header naming X-Forwarded-For sets a forwarded-for mode.}
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Forwarded-Proto len 256"}
      # Two routes share the pair; the slot is emitted once per frontend, never twice.
      - {type: not_contains, target: haproxy.cfg, pattern: 'capture request header X-Forwarded-Proto len 256\n\s*capture request header X-Forwarded-Proto len 256'}

  test-haptic-header-name-shared-across-ingresses:
    description: Two ingresses setting the same header name share one static line per frontend, spelled the lexicographically smallest of the two — which here is the SECOND ingress's, so the choice is a rule, not ingress order. A second ingress reusing a header name is a map entry, never a new config line.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-a, annotations: {haproxy-haptic.org/request-set-header: "x-shared from-a"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-b, annotations: {haproxy-haptic.org/request-set-header: "X-Shared from-b"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: b.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-a_svc_echo_80\|set\|x-shared from-a'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-b_svc_echo_80\|set\|x-shared from-b'}
      # One static line per rendered frontend (h1/h2c/https), not one per ingress.
      - {type: match_count, target: haproxy.cfg, pattern: 'set-header X-Shared %\[var\(txn\.backend_name\),concat\(\|set\|x-shared\)', expected: "3"}
      # Negative control: the lowercase spelling from the first ingress loses.
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header x-shared %'}

  test-haptic-cors:
    description: cors-enable emits the shared CORS macro output (http-after-response Allow-Origin + preflight 204)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-origin: "https://app.example.com"
              haproxy-haptic.org/cors-allow-methods: "GET, POST, OPTIONS"
              haproxy-haptic.org/cors-allow-credentials: "true"
              haproxy-haptic.org/cors-expose-headers: "X-Total-Count"
              haproxy-haptic.org/cors-max-age: "600"
          spec:
            ingressClassName: haptic
            rules:
              - host: cors.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Origin"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Credentials 'true'"
      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 204 if"}
      - {type: contains, target: "map:ing-cors-routes.map", pattern: '(?m)^default/cors-ingress haptic:list 1 1 0 1$'}
      - {type: contains, target: "map:ing-cors-origins.map", pattern: '(?m)^default/cors-ingress\|https://app\.example\.com 1$'}
      - {type: contains, target: "map:ing-cors-methods.map", pattern: '(?m)^default/cors-ingress GET%2c%20POST%2c%20OPTIONS$'}
      - {type: contains, target: "map:ing-cors-expose.map", pattern: '(?m)^default/cors-ingress X-Total-Count$'}
      - {type: contains, target: "map:ing-cors-maxage.map", pattern: '(?m)^default/cors-ingress 600$'}

  test-haptic-access-control:
    description: allowlist/denylist-source-range ride the shared map lane — a routes row, the disjoint CIDR partition, allow and deny member rows keyed by route, and one four-rule block for the haptic family instead of per-route ACLs
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ac-ingress
            annotations:
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8,192.168.1.0/24"
              haproxy-haptic.org/denylist-source-range: "203.0.113.5"
          spec:
            ingressClassName: haptic
            rules:
              - host: ac.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/ac-ingress haptic:both$'}
      - {type: contains, target: "map:ing-ac-partitions.map", pattern: '(?m)^10\.0\.0\.0/8 10\.0\.0\.0/8$'}
      - {type: contains, target: "map:ing-ac-partitions.map", pattern: '(?m)^203\.0\.113\.5/32 203\.0\.113\.5/32$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^10\.0\.0\.0/8\|default/ac-ingress 1$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^192\.168\.1\.0/24\|default/ac-ingress 1$'}
      - {type: contains, target: "map:ing-ac-deny.map", pattern: '(?m)^203\.0\.113\.5/32\|default/ac-ingress 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ac_block\) src,map_ip\(\S*/ing-ac-partitions\.map\) if \{ var\(txn\.ac\) -m beg "haptic:" \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny if \{ var\(txn\.ac\) -m str "haptic:allow" "haptic:both" \} !\{ var\(txn\.ac_block\),concat\(\|,txn\.resource_key\),map\(\S*/ing-ac-allow\.map\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny if \{ var\(txn\.ac\) -m str "haptic:deny" "haptic:both" \} \{ var\(txn\.ac_block\),concat\(\|,txn\.resource_key\),map\(\S*/ing-ac-deny\.map\) -m found \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'acl haptic_(allow|deny)list_'}

  test-haptic-access-control-ipv6-keeps-legacy-rule:
    description: a list with an IPv6 entry cannot be partitioned, so that route keeps the per-route ACL and deny while an IPv4 route on the same frontend rides the lane
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: v6-ingress
            annotations:
              haproxy-haptic.org/allowlist-source-range: "2001:db8::/32,10.0.0.0/8"
          spec:
            ingressClassName: haptic
            rules:
              - host: v6.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: v4-ingress
            annotations:
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8"
          spec:
            ingressClassName: haptic
            rules:
              - host: v4.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'acl haptic_allowlist_default_v6-ingress src 2001:db8::/32 10\.0\.0\.0/8'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny if \{ var\(txn\.resource_key\) -m str default/v6-ingress \} !haptic_allowlist_default_v6-ingress'}
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/v4-ingress haptic:allow$'}
      - {type: not_contains, target: "map:ing-ac-routes.map", pattern: 'v6-ingress'}

  test-haptic-proxy-cookie-and-redirect:
    description: response-cookie-domain/path and response-location-rewrite-from/to rewrite upstream Set-Cookie and Location/Refresh headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: px-ingress
            annotations:
              haproxy-haptic.org/response-cookie-domain: "old.example.com new.example.com"
              haproxy-haptic.org/response-cookie-path: "/old /new"
              haproxy-haptic.org/response-location-rewrite-from: "http://old.svc"
              haproxy-haptic.org/response-location-rewrite-to: "https://new.svc"
          spec:
            ingressClassName: haptic
            rules:
              - host: px.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-cookie-rewrite-routes.map", pattern: '(?m)^default/px-ingress\|haptic\|Domain\|old\.example\.com\|new\.example\.com 1$'}
      - {type: contains, target: "map:ing-cookie-rewrite-routes.map", pattern: '(?m)^default/px-ingress\|haptic\|Path\|/old\|/new 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response replace-header Set-Cookie \(\.\*\)Domain=old\.example\.com\(\.\*\) \\1Domain=new\.example\.com\\2 if \{ var\(txn\.resource_key\),concat\(\|haptic\|Domain\|old\.example\.com\|new\.example\.com\),map\(\S*/ing-cookie-rewrite-routes\.map\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response replace-header Set-Cookie \(\.\*\)Path=/old\(\.\*\) \\1Path=/new\\2 if'}
      - {type: contains, target: "map:ing-location-rewrite-routes.map", pattern: '(?m)^default/px-ingress\|haptic\|http://old\.svc\|https://new\.svc 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-response replace-header Location http://old\\\.svc https://new\.svc if \{ var\(txn\.resource_key\),concat\(\|haptic\|http://old\.svc\|https://new\.svc\),map\(\S*/ing-location-rewrite-routes\.map\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: "http-response replace-header Refresh http://old"}

  test-haptic-security-rules-scoped-by-route-not-host:
    description: >-
      CIDR access control, X-Forwarded-For and src-ip-header must be enforced on
      a wildcard host and on an Ingress with no host. All three were gated on an
      exact Host match, so a wildcard rule host never matched a concrete request
      host and a host-less rule emitted nothing at all — leaving the route served
      with the control absent.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: scoped-wild
            annotations:
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8"
              haproxy-haptic.org/forwardfor: "update"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.scoped.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: scoped-hostless
            annotations:
              haproxy-haptic.org/denylist-source-range: "192.0.2.0/24"
              haproxy-haptic.org/forwardfor: "update"
          spec:
            ingressClassName: haptic
            rules:
              - http:
                  paths:
                    - { path: /scoped-hostless, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # CIDR allow/deny reaches both shapes: the routes map keys on the route id, not the host.
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/scoped-wild haptic:allow$'}
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/scoped-hostless haptic:deny$'}
      - {type: contains, target: "map:ing-ac-deny.map", pattern: '(?m)^192\.0\.2\.0/24\|default/scoped-hostless 1$'}
      # XFF overwrite reaches both shapes — else a forged XFF survives.
      - {type: contains, target: "map:ing-xff-routes.map", pattern: '(?m)^default/scoped-wild replace$'}
      - {type: contains, target: "map:ing-xff-routes.map", pattern: '(?m)^default/scoped-hostless replace$'}
      # No enforcement may be gated on an exact host match again.
      - type: not_contains
        target: haproxy.cfg
        pattern: 'http-request deny if \{ var\(txn\.host\) -m str \*'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'set-header X-Forwarded-For %\[src\] if \{ var\(txn\.host\)'
