# HAPTIC-native annotation library — shared-cache (Varnish tier) tests.
_fx:
  extracontextAdmissionCache: &extracontextAdmissionCache
    renderMode: admission
    cache: {varnish: {enabled: true, replicas: 2}}
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: echo, port: { number: 80 } } }
  extracontextCacheVarnish: &extracontextCacheVarnish
    cache: {varnish: {enabled: true, replicas: 2}}

validationTests:
  test-haptic-cache-workdir-statefulset:
    description: Varnish locks its shared log without running as root.
    extraContext:
      cache:
        varnish: {enabled: true, workload: statefulset}
    fixtures: {}
    assertions:
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: StatefulSet"}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'securityContext:\s+fsGroup: 1000'}
      - {type: contains, target: "k8s:varnish-cache", pattern: '"-n", "/var/lib/varnish/varnishd"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'name: varnish-workdir\s+mountPath: /var/lib/varnish'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'name: varnish-workdir\s+emptyDir:\s+medium: Memory'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'runAsNonRoot: true\s+runAsUser: 1000\s+runAsGroup: 1000\s+allowPrivilegeEscalation: false\s+capabilities:\s+drop: \["ALL"\]\s+add: \["IPC_LOCK"\]'}
      - {type: not_contains, target: "k8s:varnish-cache", pattern: 'privileged:|vsl_space|varnishncsa|varnishlog'}

  test-haptic-cache-workdir-deployment:
    description: Deployment Varnish uses the same tmpfs and capability policy.
    extraContext:
      cache:
        varnish: {enabled: true, workload: deployment}
    fixtures: {}
    assertions:
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: Deployment"}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'securityContext:\s+fsGroup: 1000'}
      - {type: contains, target: "k8s:varnish-cache", pattern: '"-n", "/var/lib/varnish/varnishd"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'name: varnish-workdir\s+mountPath: /var/lib/varnish'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'name: varnish-workdir\s+emptyDir:\s+medium: Memory'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'runAsNonRoot: true\s+runAsUser: 1000\s+runAsGroup: 1000\s+allowPrivilegeEscalation: false\s+capabilities:\s+drop: \["ALL"\]\s+add: \["IPC_LOCK"\]'}
      - {type: not_contains, target: "k8s:varnish-cache", pattern: 'privileged:|vsl_space|varnishncsa|varnishlog'}

  test-haptic-cache-core:
    description: Cache exclusions and canaries preserve routing precedence with request filters before backend switches.
    extraContext:
      cache:
        haproxy: {responseTimeoutMs: 2000}
        varnish:
          enabled: true
          # PDB + anti-affinity need replicas > 1.
          replicas: 2
          podDisruptionBudget: {enabled: true, maxUnavailable: 1}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "300"
              haproxy-haptic.org/cache-key: "consumer,header:X-Api-Version"
              haproxy-haptic.org/cache-exclude-content-types: "text/html,text/xml"
              haproxy-haptic.org/cache-exclude-paths: "/admin,/live"
              haproxy-haptic.org/cache-max-object-size: "1048576"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: second-cache-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-exclude-paths: "/private"
          spec:
            ingressClassName: haptic
            rules:
              - host: second-cache.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-canary
            annotations:
              haproxy-haptic.org/canary: "true"
              haproxy-haptic.org/canary-by-header: "X-Canary"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: '(?m)^[ \t]+use_backend[^\n]*\n(?:[ \t]+[^\n]*\n|\n)*[ \t]+http-request '
      - {type: contains, target: "map:haptic-cache-enable.map", pattern: "default/cache-ingress 1"}
      - {type: contains, target: "map:haptic-cache-ttl.map", pattern: "default/cache-ingress 300"}
      # No source-IP loop-break map: the cache-miss loopback no longer enters the
      # client frontends (Varnish fetches the dedicated backend-fetch port), so
      # the fragile Varnish-pod-IP map is gone entirely.
      - {type: not_contains, target: haproxy.cfg, pattern: "haptic-varnish-src"}
      # Cache outages bypass the cache tier instead of taking the app route down.
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^[ \t]+http-request set-var\(txn\.cache_eligible\) bool\(true\) if \{ var\(txn\.policy_id\),map\([^)]*haptic-cache-enable\.map\) -m found \} \{ method GET HEAD \}$'
      # Exclusions are map rows, one per (route, prefix) pair, read by a single
      # map_beg lookup on `<route>|<path>`, so no route adds rule text.
      - {type: contains, target: "map:haptic-cache-exclude.map", pattern: '(?m)^default/cache-ingress\|/admin 1$'}
      - {type: contains, target: "map:haptic-cache-exclude.map", pattern: '(?m)^default/cache-ingress\|/live 1$'}
      - {type: contains, target: "map:haptic-cache-exclude.map", pattern: '(?m)^default/second-cache-ingress\|/private 1$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^[ \t]+http-request set-var-fmt\(txn\.cache_excl_key\) %\[var\(txn\.policy_id\)\]\|%\[path\] if \{ var\(txn\.cache_eligible\) -m bool \}$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^[ \t]+http-request unset-var\(txn\.cache_eligible\) if \{ var\(txn\.cache_excl_key\),map_beg\([^)]*haptic-cache-exclude\.map\) -m found \}$'
      - {type: not_contains, target: haproxy.cfg, pattern: 'path_beg /admin'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.cache_degraded\) str\(1\) if \{ var\(txn\.cache_eligible\) -m bool \} !haptic_varnish_available'
      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend varnish_cache if \{ var\(txn\.cache_eligible\) -m bool \} haptic_varnish_available'
      - {type: contains, target: haproxy.cfg, pattern: 'acl haptic_varnish_available srv_is_up\(varnish_cache/CACHE_DISPATCH\)'}
      - {type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Probe"}
      - {type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Origin-Transport-Failure"}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Haptic-Backend"
          - "http-request unset-var\\(txn\\.cache_eligible\\) if \\{ var\\(txn\\.cache_excl_key\\),map_beg"
          - "use_backend %\\[var\\(txn\\.canary_backend\\)\\] if \\{ var\\(txn\\.canary_backend\\) -m found \\}"
          - "use_backend varnish_cache if"
      # Dedicated backend-fetch frontend: internal-only bind, routes by the
      # validated X-Haptic-Backend header, refuses infrastructure backends.
      - {type: contains, target: haproxy.cfg, pattern: "frontend haptic_cache_origin"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 204 if \\{ path /.well-known/haptic-cache-ready \\} \\{ req.hdr\\(X-Haptic-Cache-Probe\\) -m str origin \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "(?ms)^frontend haptic_cache_origin$.*?http-request set-log-level silent if \\{ path /.well-known/haptic-cache-ready \\}.*?http-request return status 204 if \\{ path /.well-known/haptic-cache-ready \\}.*?http-request set-var\\(txn.origin_backend\\) req.hdr\\(X-Haptic-Backend\\).*?http-request del-header X-Haptic-Cache-TTL"
      - {type: contains, target: haproxy.cfg, pattern: "bind \\*:8090"}
      - type: contains
        target: haproxy.cfg
        pattern: "acl origin_backend_internal var\\(txn.origin_backend\\) -m str varnish_cache varnish_cache_shards spoa-hub default_backend"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 421 if origin_backend_internal"
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend %\\[var\\(txn.origin_backend\\)\\] if \\{ var\\(txn.origin_backend\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "(?ms)^frontend haptic_cache_origin$.*?http-after-response del-header X-Haptic-Cache-Origin-Transport-Failure\\s+http-after-response set-header X-Haptic-Cache-Origin-Transport-Failure 1 if \\{ txn.sess_term_state -m str SC sC SH sH sQ \\}"
      # The varnish_cache backend stamps the resolved backend for the loopback,
      # stripping any client copy first.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Haptic-Backend\\n\\s*http-request set-header X-Haptic-Backend %\\[var\\(txn.backend_name\\)\\] if \\{ var\\(txn.backend_name\\) -m found \\}"
      - {type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Fetch"}
      # The forgeable-header bypass must be gone from the routing decision.
      - {type: not_contains, target: haproxy.cfg, pattern: "req.hdr\\(X-Haptic-Cache-Fetch\\)"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-TTL %\\[var\\(txn.policy_id\\),map\\([^)]*haptic-cache-ttl\\.map\\)\\]"
      - {type: contains, target: haproxy.cfg, pattern: "backend varnish_cache"}
      - {type: contains, target: haproxy.cfg, pattern: "balance first"}
      - {type: contains, target: haproxy.cfg, pattern: "balance uri"}
      - {type: contains, target: haproxy.cfg, pattern: "hash-type consistent"}
      - {type: contains, target: haproxy.cfg, pattern: "hash-balance-factor 150"}
      - {type: contains, target: haproxy.cfg, pattern: "option httpchk"}
      - {type: contains, target: haproxy.cfg, pattern: "http-check expect status 204"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout check 500ms"}
      - {type: contains, target: haproxy.cfg, pattern: "timeout server 2000ms"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$(?:\n[ \t]+[^\n]*)*?\n[ \t]+timeout server 206900ms$'
      - {type: contains, target: "map:cache-dispatch-timeout.map", pattern: '(?m)^budget 206900$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-timeout server str\(budget\),map_str_int\([^)]*cache-dispatch-timeout\.map\)'}
      - {type: contains, target: haproxy.cfg, pattern: "retries 1"}
      - {type: contains, target: haproxy.cfg, pattern: "retry-on conn-failure empty-response response-timeout 425"}
      - {type: contains, target: haproxy.cfg, pattern: "option redispatch 1"}
      - {type: contains, target: haproxy.cfg, pattern: "frontend haptic_cache_dispatch"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-check send meth GET uri /.well-known/haptic-cache-dispatch-ready ver HTTP/1.1 hdr Host haptic-cache-health hdr X-Haptic-Cache-Probe dispatch"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 204 if \\{ path /.well-known/haptic-cache-dispatch-ready \\} \\{ req.hdr\\(X-Haptic-Cache-Probe\\) -m str dispatch \\} \\{ nbsrv\\(varnish_cache_shards\\) gt 0 \\}"
      - {type: contains, target: haproxy.cfg, pattern: "default_backend varnish_cache_shards"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-status 425 if \\{ txn.sess_term_state -m str SC sC SH sH sQ PH \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-status 425 if \\{ srv_name -m str CACHE_DISPATCH \\} \\{ res.hdr\\(X-Haptic-Cache-Origin-425\\) -m str 1 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-status 425 if \\{ res.hdr\\(X-Haptic-Cache-Failure\\) -m str 1 \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "(?ms)^backend varnish_cache from haptic-be-\\w+$.*?http-after-response del-header X-Haptic-Cache-Origin-Transport-Failure\\s+http-after-response del-header X-Haptic-Cache-Failure"
      - {type: contains, target: haproxy.cfg, pattern: "http-after-response set-var\\(txn.cache_degraded\\) str\\(1\\) if \\{ srv_name -m str ORIGIN_FALLBACK \\}"}
      # Dedicated internal origin Service for the backend-fetch port (ClusterIP,
      # never a LoadBalancer; targets the HAProxy fleet on the loopback port).
      - {type: contains, target: "k8s:varnish-cache", pattern: "name: haptic-cache-origin"}
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "(?s)name: haptic-cache-origin.*?type: ClusterIP.*?port: 8090"
      # Regression guard: a document separator must never fuse with the next
      # document's apiVersion (a stripping `{#- -#}` comment between `---` and
      # `apiVersion` would produce `---apiVersion:` — invalid multi-doc YAML the
      # live SSA apply rejects even though text assertions still pass).
      - {type: not_contains, target: "k8s:varnish-cache", pattern: "(?m)^---[A-Za-z]"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: StatefulSet"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: ConfigMap"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "if \\(resp.status == 425\\)"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "set resp.status = 418"}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'set resp.http.X-Haptic-Cache-Origin-425 = "1"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: "unset beresp.http.X-Haptic-Cache-Failure"}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'set beresp.http.X-Haptic-Cache-Failure = "1"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'set req.http.X-Haptic-Cache-Failure = "fetch-stale-if-error"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'set req.http.X-Haptic-Cache-Failure = "serve-stale-if-error"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: "if \\(beresp.http.X-Haptic-Cache-Origin-Transport-Failure == \"1\"\\)"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "unset beresp.http.X-Haptic-Cache-Origin-Transport-Failure"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "clusterIP: None"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "malloc,256m"}
      # A CPU request must be present so the autoscaling HPA can compute utilization.
      - {type: contains, target: "k8s:varnish-cache", pattern: "cpu: 100m"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: PodDisruptionBudget"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "maxUnavailable: 1"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "podAntiAffinity:"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "topologySpreadConstraints:"}
      # The VCL no longer sets a loopback marker header (source-based loop-break).
      - {type: not_contains, target: "k8s:varnish-cache", pattern: "X-Haptic-Cache-Fetch"}
      - type: contains
        target: "map:haptic-cache-skip-ct.map"
        pattern: "default/cache-ingress \\|text/html\\|text/xml\\|"
      - {type: contains, target: "map:haptic-cache-maxsize.map", pattern: "default/cache-ingress 1048576"}
      - {type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Vary"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Vary %\\[var\\(txn.haptic_consumer\\),base64\\]\\|%\\[req.hdr\\(X-Api-Version\\),base64\\] if \\{ var\\(txn.policy_id\\) -m str default/cache-ingress \\}"
      # An excluded request needs no per-route switch: with cache_eligible unset the
      # varnish switch never matches, and base's trailing
      # `use_backend %[var(txn.backend_name)]` routes it to its own backend.
      - {type: not_contains, target: haproxy.cfg, pattern: 'use_backend %\[var\(txn\.backend_name\)\] if \{ var\(txn\.policy_id\) -m str'}
      - {type: contains, target: "k8s:varnish-cache", pattern: "hash_data\\(req.http.X-Haptic-Cache-Vary\\)"}
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "std.strstr\\(bereq.http.X-Haptic-Cache-Skip-CT"
      - {type: contains, target: "k8s:varnish-cache", pattern: "sub vcl_recv"}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'req.url == "/.well-known/haptic-cache-live"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: 'req.url == "/.well-known/haptic-cache-ready"'}
      - {type: contains, target: "k8s:varnish-cache", pattern: "return \\(synth\\(204\\)\\)"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "std.healthy\\(default\\)"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "return \\(synth\\(503\\)\\)"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "\\.expected_response = 204"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "\\.initial = 0"}
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "readinessProbe:\\s+httpGet:\\s+path: /.well-known/haptic-cache-ready"
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "livenessProbe:\\s+httpGet:\\s+path: /.well-known/haptic-cache-live"
      # The builtin refuses to serve a cached response to a request carrying
      # Authorization or Cookie. Overriding that is only safe when the key
      # identifies the caller, so the bypass demands the auth flag as well —
      # gating on the vary header alone leaked one caller's authenticated
      # response to the next.
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "if \\(req.http.X-Haptic-Cache-Vary && req.http.X-Haptic-Cache-Auth && \\(req.method == \"GET\" \\|\\| req.method == \"HEAD\"\\)\\) \\{"
      - {type: contains, target: "k8s:varnish-cache", pattern: "set resp.http.X-Cache = \"HIT\""}

  test-haptic-cache-init-state-on-haproxy-3-1:
    _helm_skip_test: '{{ if semverCompare "<3.1" .Values.haproxyVersion }}true{{ else }}false{{ end }}'
    description: Cache servers start down on HAProxy 3.1 and newer until their health checks pass.
    extraContext:
      haproxyVersion: "3.1"
      cache: {varnish: {enabled: true, replicas: 2}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "default-server check init-state fully-down inter 1s fastinter 500ms downinter 1s fall 2 rise 2"}
      - {type: contains, target: haproxy.cfg, pattern: "server CACHE_DISPATCH unix@/etc/haproxy/cache-dispatch.sock check init-state fully-down"}
      - {type: contains, target: haproxy.cfg, pattern: "server ORIGIN_FALLBACK 127.0.0.1:8090 no-check init-state fully-up"}

  test-haptic-cache-omits-init-state-on-haproxy-3-0:
    description: HAProxy 3.0 rejects init-state, so cache servers use its default initial state.
    extraContext:
      haproxyVersion: "3.0"
      cache: {varnish: {enabled: true, replicas: 2}}
    fixtures: {}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "init-state"}
      - {type: contains, target: haproxy.cfg, pattern: "server CACHE_DISPATCH unix@/etc/haproxy/cache-dispatch.sock check inter 1s fastinter 500ms downinter 1s fall 2 rise 2"}
      - {type: contains, target: haproxy.cfg, pattern: "server ORIGIN_FALLBACK 127.0.0.1:8090 no-check"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check inter 1s fastinter 500ms downinter 1s fall 2 rise 2"}

  test-haptic-cache-shared-rate-limit-loopback:
    _helm_skip_test: '{{ if not (and .Values.cache.varnish.enabled .Values.rateLimit.shared.enabled) }}true{{ end }}'
    description: >-
      One external request consumes one shared-limit budget even on a cache miss:
      the miss loopback fetches the dedicated backend-fetch frontend, which runs
      no rate-limit dispatch, so there is no second charge and no per-loopback
      unset hack. The client leg still dispatches the shared limiter normally.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-rate-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/rate-limit-requests: "100"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-rate.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # The client leg still dispatches the shared limiter.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-ratelimit check-ratelimit-group"
      # The old per-loopback unset hack is gone — no source-map rl_limit clear.
      - {type: not_contains, target: haproxy.cfg, pattern: "unset-var\\(txn\\.rl_limit\\)"}
      # The loopback is separated onto the dedicated backend-fetch frontend.
      - {type: contains, target: haproxy.cfg, pattern: "frontend haptic_cache_origin"}

  test-haptic-cache-autoscaling:
    description: >-
      With autoscaling enabled, the Varnish tier emits a HorizontalPodAutoscaler
      targeting the workload (CPU utilization, generous scale-down window) and
      omits the static replica count so the HPA owns it.
    extraContext:
      cache:
        varnish:
          enabled: true
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 9
            targetCPUUtilizationPercentage: 65
            scaleDownStabilizationSeconds: 900
          podDisruptionBudget: {enabled: false}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: "k8s:varnish-cache", pattern: "kind: HorizontalPodAutoscaler"}
      - type: contains
        target: "k8s:varnish-cache"
        pattern: "kind: StatefulSet\\s+metadata:\\s+name: [^\\s]*varnish-cache"
      - {type: contains, target: "k8s:varnish-cache", pattern: "minReplicas: 3"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "maxReplicas: 9"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "averageUtilization: 65"}
      - {type: contains, target: "k8s:varnish-cache", pattern: "stabilizationWindowSeconds: 900"}
      # The HPA owns the replica count — the workload must not pin a static one.
      - {type: not_contains, target: "k8s:varnish-cache", pattern: "replicas: 2"}
      - {type: not_contains, target: "k8s:varnish-cache", pattern: "kind: PodDisruptionBudget"}

  test-haptic-cache-ttl-unit-suffix-rejected:
    description: >-
      cache-ttl with a unit suffix (e.g. "60s") is rejected at admission instead
      of being written verbatim into haptic-cache-ttl.map, where the Varnish VCL
      would compute std.duration("60s"+"s")=0s and silently never cache. Regression
      pin for the toint() footgun (Atoi parses "60s" to 0, passing a `< 0` guard).
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-ttl
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-ttl.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '60s' for annotation 'haproxy-haptic.org/cache-ttl'.*Must be a non-negative integer .seconds. with no unit suffix" }

  test-haptic-cache-exclude-path-pipe-rejected:
    description: >-
      '|' separates the route from the path in haptic-cache-exclude.map, so an
      excluded path carrying one would publish a key no request can match and the
      path would be cached after all. The render fails instead.
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-exclude
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-exclude-paths: "/ok,/a|b"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-exclude.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid path '/a\\|b' in 'haproxy-haptic.org/cache-exclude-paths' on Ingress 'default/bad-exclude'. '\\|' is not allowed" }

  test-haptic-cache-max-object-size-unit-suffix-rejected:
    description: >-
      cache-max-object-size with a unit suffix ("1mb") is rejected at admission —
      the digits-only guard, not a reliance on toint()<=0, is what enforces it.
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-maxsize
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-max-object-size: "1mb"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-maxsize.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '1mb' for annotation 'haproxy-haptic.org/cache-max-object-size'.*Must be a positive integer .bytes. with no unit suffix" }

  test-haptic-cache-access-log-fields:
    description: >-
      With the Varnish tier enabled, the cache leg captures Varnish's X-Cache
      verdict into a transaction variable (a log-format cannot fetch response
      headers) and contributes the cache/app_backend fields; the cache-origin
      frontend carries the JSON log-format too, so the second log line a MISS
      produces is in the same schema.
    extraContext: {cache: {varnish: {enabled: true}}}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cache-log
            annotations:
              haproxy-haptic.org/cache-enable: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: cache-log.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-after-response set-var\(txn\.cache_status\) res\.hdr\(X-Cache\) if \{ res\.hdr\(X-Cache\) -m found \}'
      - {type: contains, target: haproxy.cfg, pattern: '%\(cache\)\[var\(txn\.cache_status\)\]'}
      - {type: contains, target: haproxy.cfg, pattern: '%\(cache_degraded\)\[var\(txn\.cache_degraded\)\]'}
      - type: contains
        target: haproxy.cfg
        pattern: '%\(app_backend\)\[var\(txn\.backend_name\)\]'
        description: >-
          A cache-enabled route sets use_backend varnish_cache, so the core
          `backend` field no longer identifies the application backend.
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend haptic_cache_origin$.*?^  log-format "%\{\+json\}o '
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(cache_origin_internal_backend\) if origin_backend_internal'

  test-haptic-cache-staleness-windows:
    description: >-
      stale-while-revalidate and stale-if-error share one total Varnish grace
      window. vcl_hit forces a synchronous refresh after the proactive window,
      then returns to the stale object only if that refresh fails.
      cache-revalidate sets beresp.keep and
      cache-strip-set-cookie drops Set-Cookie before the cacheability test.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: stale-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-stale-while-revalidate: "30"
              haproxy-haptic.org/cache-stale-if-error: "600"
              haproxy-haptic.org/cache-revalidate: "900"
              haproxy-haptic.org/cache-strip-set-cookie: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: stale.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Total window is max(swr, sie) = 600, not 30 and not 630 …
      - { type: contains, target: "map:haptic-cache-grace.map", pattern: "(?m)^default/stale-ingress 600$" }
      # … while proactive stale delivery stops at the swr boundary.
      - { type: contains, target: "map:haptic-cache-swr.map", pattern: "(?m)^default/stale-ingress 30$" }
      - { type: contains, target: "map:haptic-cache-stale-if-error.map", pattern: "(?m)^default/stale-ingress 1$" }
      - { type: contains, target: "map:haptic-cache-keep.map", pattern: "(?m)^default/stale-ingress 900$" }
      - { type: contains, target: "map:haptic-cache-strip-cookie.map", pattern: "(?m)^default/stale-ingress 1$" }
      # A client must not be able to forge any of the new control headers.
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Grace" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Stale-If-Error" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Keep" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Strip-Cookie" }
      # del-header must precede the set-header that re-adds the trusted value.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Haptic-Cache-Grace"
          - "http-request set-header X-Haptic-Cache-Grace %\\[var\\(txn\\.policy_id\\),map\\("
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Stale-If-Error %\\[var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-stale-if-error\\.map\\)\\]"
      # The VCL wires each header to the matching beresp field.
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.grace = std.duration\\(bereq.http.X-Haptic-Cache-Grace" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.keep = std.duration\\(bereq.http.X-Haptic-Cache-Keep" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "unset beresp.http.Set-Cookie" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "set req.grace = std.duration\\(req.http.X-Haptic-Cache-Grace" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "sub vcl_hit" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "obj.ttl \\+ std.duration\\(req.http.X-Haptic-Cache-SWR" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "set req.grace = 0s" }
      - { type: not_contains, target: "k8s:varnish-cache", pattern: "hash_always_miss" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "bereq.is_bgfetch \\|\\| bereq.http.X-Haptic-Cache-Failure == \\\"fetch-stale-if-error\\\"" }
      - type: match_order
        target: "k8s:varnish-cache"
        patterns:
          - "if \\(bereq.http.X-Haptic-Cache-Stale-If-Error && beresp.status >= 500 &&"
          - "if \\(beresp.http.X-Haptic-Cache-Origin-Transport-Failure == \"1\"\\)"
          - "set beresp.http.X-Haptic-Cache-Failure = \"1\""
          - "unset beresp.http.X-Haptic-Cache-Origin-Transport-Failure"
          - "if \\(beresp.http.Cache-Control ~"
          - "if \\(bereq.http.X-Haptic-Cache-Skip-CT"
          - "if \\(bereq.http.X-Haptic-Cache-Max-Size"
          - "if \\(beresp.http.Set-Cookie\\)"
          - "if \\(beresp.status != 200\\)"
      - { type: contains, target: "k8s:varnish-cache", pattern: "sub vcl_backend_error" }
      # A stale delivery is distinguishable from a fresh hit in the access log.
      - { type: contains, target: "k8s:varnish-cache", pattern: "X-Cache = \"STALE\"" }

  test-haptic-cache-ttl-auto-follows-origin:
    description: >-
      cache-ttl "auto" hands the lifetime back to the origin's Cache-Control via
      std.rfc_ttl() (new in Varnish/Vinyl 9.0) instead of forcing a fixed TTL.
      The map carries the literal so the static VCL can branch on it.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auto-ttl
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "auto"
          spec:
            ingressClassName: haptic
            rules:
              - host: auto-ttl.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-ttl.map", pattern: "(?m)^default/auto-ttl auto$" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "if \\(bereq.http.X-Haptic-Cache-TTL == \"auto\"\\) \\{" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "std.rfc_ttl\\(\\);" }
      # The hit-for-pass lifetime follows the operator-tunable parameter rather
      # than a magic number duplicated from its default.
      - { type: contains, target: "k8s:varnish-cache", pattern: "set beresp.ttl = param.uncacheable_ttl;" }
      - { type: not_contains, target: "k8s:varnish-cache", pattern: "set beresp.ttl = 120s;" }

  test-haptic-cache-staleness-unit-suffix-rejected:
    description: >-
      The staleness windows share cache-ttl's unit-suffix footgun — the VCL builds
      the duration by appending "s", so "30s" would become std.duration("30ss")=0s
      and silently disable the window. Rejected at admission instead.
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-swr
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-stale-while-revalidate: "30s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-swr.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '30s' for annotation 'haproxy-haptic.org/cache-stale-while-revalidate'" }

  test-haptic-cache-strip-set-cookie-rejects-non-boolean:
    description: >-
      cache-strip-set-cookie drops a response header, so a typo must fail loudly
      rather than being read as false and leaving the route uncached.
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-strip
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-strip-set-cookie: "yes"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-strip.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value 'yes' for annotation 'haproxy-haptic.org/cache-strip-set-cookie'.*Must be \"true\" or \"false\"" }

  test-haptic-cache-stale-if-error-alone-is-error-only:
    description: >-
      A route that sets stale-if-error WITHOUT stale-while-revalidate must not
      serve stale on ordinary expiry. The total grace window widens to the
      error window, but the proactive window stays 0, so a normal expiry fetches
      synchronously and the wider grace is reachable only when that fetch fails.
      Regression pin for the collapse-into-one-window bug: with a single grace
      value, stale-if-error silently implied stale-while-revalidate.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sie-only
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-stale-if-error: "600"
          spec:
            ingressClassName: haptic
            rules:
              - host: sie-only.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-grace.map", pattern: "(?m)^default/sie-only 600$" }
      # The whole point: proactive staleness is off for this route.
      - { type: contains, target: "map:haptic-cache-swr.map", pattern: "(?m)^default/sie-only 0$" }
      - { type: contains, target: "map:haptic-cache-stale-if-error.map", pattern: "(?m)^default/sie-only 1$" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "(?s)req.restarts == 1 &&\\s+req.http.X-Haptic-Cache-Failure == \\\"fetch-stale-if-error\\\"" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "resp.status == 503 && req.restarts == 1" }
      - { type: contains, target: "k8s:varnish-cache", pattern: "req.restarts == 0" }

  test-haptic-cache-vary-declared-downstream:
    description: >-
      A cache-key built from components the CLIENT sends (header:, cookie:) is
      declared to downstream caches as Vary, so a CDN or proxy in front of HAPTIC
      keys on the same dimensions for cached, direct, and excluded paths instead
      of serving one caller's response to another. add-header preserves origin Vary.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: vary-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version,cookie:sess,query:page"
          spec:
            ingressClassName: haptic
            rules:
              - host: vary.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # cookie:<c> collapses to Cookie; query:<q> contributes nothing because a
      # downstream cache already keys on the URL.
      - { type: contains, target: "map:haptic-cache-vary.map", pattern: "(?m)^default/vary-ingress X-Api-Version,Cookie$" }
      # No identity component here, so the response stays shareable.
      - { type: not_contains, target: "map:haptic-cache-private.map", pattern: "default/vary-ingress" }
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*http-after-response add-header Vary %\\[var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-vary\\.map\\)\\] if \\{ var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-vary\\.map\\) -m found \\}$"
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-after-response add-header Vary %\\[var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-vary\\.map\\)\\]"
          - "use_backend varnish_cache if"

  test-haptic-cache-identity-key-marks-response-private:
    description: >-
      consumer and src cannot be expressed as Vary — a downstream cache never
      receives the discriminator, so declaring it would collapse every caller onto
      one shared variant. Every response path is marked Cache-Control: private,
      which keeps shared caches out while leaving the browser free to cache.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: consumer-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: consumer.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-private.map", pattern: "(?m)^default/consumer-ingress 1$" }
      # Nothing client-sendable to vary on, so no Vary entry for this route.
      - { type: not_contains, target: "map:haptic-cache-vary.map", pattern: "default/consumer-ingress" }
      # A conflicting `public` is rewritten rather than emitted alongside
      # `private`: RFC 9111 defines no precedence for a response carrying both.
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response replace-value Cache-Control \\(\\?i\\)\\^\\[\\[:space:\\]\\]\\*public\\[\\[:space:\\]\\]\\*\\$ private if \\{ var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-private\\.map\\) -m found \\}"
      # Always add an unqualified directive: private="Header" protects only the
      # named field and cannot keep the rest of the response out of shared caches.
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^\\s*http-after-response add-header Cache-Control private if \\{ var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-private\\.map\\) -m found \\}$"
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-after-response replace-value Cache-Control"
          - "use_backend varnish_cache if"
      # The rewrite must run before the add, or the guard reads a stale value.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "replace-value Cache-Control \\(\\?i\\)\\^\\[\\[:space:\\]\\]\\*public\\[\\[:space:\\]\\]\\*\\$ private"
          - "add-header Cache-Control private"

  test-haptic-cache-vary-dedup-is-case-insensitive:
    description: >-
      HTTP header names are case-insensitive, so two cache-key components naming
      the same header in different case are one Vary dimension, not two. The
      operator's original spelling is what gets emitted.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: dedup-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version,header:x-api-version"
          spec:
            ingressClassName: haptic
            rules:
              - host: dedup.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-vary.map", pattern: "(?m)^default/dedup-ingress X-Api-Version$" }
      - { type: not_contains, target: "map:haptic-cache-vary.map", pattern: "x-api-version" }

  test-haptic-cache-negative-caching:
    description: >-
      cache-negative-ttl makes 404 and 410 cacheable on their own shorter clock,
      so scanning traffic stops reaching the origin. It is deliberately separate
      from cache-ttl: a cached 404 during a bad deploy pins the outage for its
      lifetime, so it must be shortenable without shortening everything else.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: neg-ingress
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "600"
              haproxy-haptic.org/cache-negative-ttl: "30"
          spec:
            ingressClassName: haptic
            rules:
              - host: neg.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:haptic-cache-negative-ttl.map", pattern: "(?m)^default/neg-ingress 30$" }
      # Its own clock, not the route's 600.
      - { type: not_contains, target: "map:haptic-cache-negative-ttl.map", pattern: "default/neg-ingress 600" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Negative-TTL" }
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Negative-TTL %\\[var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-negative-ttl\\.map\\)\\]"
      # 404 and 410 only — a 5xx must never be negatively cached, or an origin
      # outage would be served back for the whole window.
      - { type: contains, target: "k8s:varnish-cache", pattern: "beresp.status == 404 \\|\\| beresp.status == 410" }
      # The check must stand OUTSIDE the cache-ttl branch. Nested, the annotation
      # silently did nothing on a route that leaves lifetimes to the origin.
      - type: match_order
        target: "k8s:varnish-cache"
        patterns:
          - "X-Haptic-Cache-Negative-TTL && !beresp.http.Set-Cookie"
          - "if \\(bereq.http.X-Haptic-Cache-TTL\\) \\{"
      # The stale windows are applied through one shared sub, so the three paths
      # that need them cannot drift apart.
      - { type: contains, target: "k8s:varnish-cache", pattern: "sub haptic_stale_windows" }
      - { type: match_count, target: "k8s:varnish-cache", pattern: "call haptic_stale_windows;", expected: "3" }

  test-haptic-cache-negative-ttl-unit-suffix-rejected:
    description: >-
      cache-negative-ttl shares cache-ttl's unit-suffix footgun — the VCL appends
      "s" to build the duration, so "30s" would yield 0s and silently disable
      negative caching rather than failing.
    extraContext: *extracontextAdmissionCache
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad-neg
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-negative-ttl: "30s"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad-neg.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "Invalid value '30s' for annotation 'haproxy-haptic.org/cache-negative-ttl'" }

  test-haptic-cache-auth-bypass-requires-consumer-key:
    description: >-
      Caching a response to an authenticated request is only safe when the cache
      key identifies the caller. A route keyed on something that does not —
      header:, cookie:, query:, src — must NOT get the auth flag, so Varnish keeps
      its builtin refusal and never serves one caller's authenticated response to
      another. Regression pin for a cross-user leak: the bypass used to fire on
      the presence of any cache-key at all.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-keyed
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "header:X-Api-Version"
          spec:
            ingressClassName: haptic
            rules:
              - host: hdr.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: consumer-keyed
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "consumer"
          spec:
            ingressClassName: haptic
            rules:
              - host: consumer.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Only the consumer-keyed route may cache authenticated requests.
      - { type: contains, target: "map:haptic-cache-authkey.map", pattern: "(?m)^default/consumer-keyed 1$" }
      - { type: not_contains, target: "map:haptic-cache-authkey.map", pattern: "default/hdr-keyed" }
      # The flag additionally requires a consumer to have been RESOLVED: an empty
      # identity would put every caller in one bucket, which is the leak itself.
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Auth 1 if \\{ var\\(txn\\.policy_id\\),map\\([^)]*haptic-cache-authkey\\.map\\) -m found \\} \\{ var\\(txn\\.haptic_consumer\\),length gt 0 \\}"
      # A client must not be able to forge the flag.
      - { type: contains, target: haproxy.cfg, pattern: "http-request del-header X-Haptic-Cache-Auth" }
      - type: match_order
        target: haproxy.cfg
        patterns:
          - "http-request del-header X-Haptic-Cache-Auth"
          - "http-request set-header X-Haptic-Cache-Auth 1"

  test-haptic-cache-auth-enforced-on-client-leg:
    description: >-
      A cache-enabled route is switched to `backend varnish_cache` in the
      frontend, so the application backend holding the 401 is never entered on
      the client leg. Without client-leg enforcement an uncredentialed caller is
      served the authenticated response straight from cache — Varnish's builtin
      does not help, because it only refuses cached responses to requests
      carrying Authorization or Cookie, and an API key is neither. The deny and
      the consumer identity must therefore be emitted BEFORE the cache switch.
    extraContext: *extracontextCacheVarnish
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: api-keys }
          type: Opaque
          data:
            # apikey-abc123:alice / apikey-def456:bob
            keys: YXBpa2V5LWFiYzEyMzphbGljZQphcGlrZXktZGVmNDU2OmJvYgo=
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-api
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/cache-key: "consumer"
              haproxy-haptic.org/api-key-secret: api-keys
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-api.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-api-key-routes.map", pattern: '(?m)^default/cached-api hdr X-API-Key default/api-keys ok _ false$'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request deny deny_status 401 if \{ var\(txn\.ak_state\) -m str ok \} !\{ var\(txn\.ak_consumer\) -m found \}'
          - 'use_backend varnish_cache if \{ var\(txn\.cache_eligible\) -m bool \} haptic_varnish_available'
      # And the consumer identity must resolve before the key is built, or
      # cache-key: consumer hashes the empty string and collapses every caller
      # onto one cached response.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.haptic_consumer\) var\(txn\.ak_consumer\)'
          - 'use_backend varnish_cache if \{ var\(txn\.cache_eligible\) -m bool \} haptic_varnish_available'

  test-haptic-cache-with-hmac-enforced-on-client-leg:
    description: >-
      A cache-enabled route is switched to `backend varnish_cache` in the
      frontend, so the application backend holding the HMAC deny is never
      entered — an uncredentialed caller would be served the authenticated
      response from cache. The check must therefore run on the client leg,
      before the cache is consulted. This combination used to be refused
      outright; it is allowed now because the enforcement exists.
    extraContext: *extracontextCacheVarnish
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hmac-keys }
          type: Opaque
          data: {secret: c3VwZXJzZWNyZXQ=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-hmac
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/hmac-secret: hmac-keys
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-hmac.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-hmac-routes.map", pattern: '(?m)^default/cached-hmac sha256 X-Signature body ok '}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.haptic_hmac\) req\.body,hmac\(sha256,txn\.hm_key\),hex,lower'
          - 'http-request deny deny_status 401 if \{ var\(txn\.hm_state\) -m str ok \} \{ var\(txn\.hm_hdr\) -m str X-Signature \} !\{ req\.hdr\(X-Signature\),strcmp\(txn\.haptic_hmac\) -m int 0 \}'
          - 'use_backend varnish_cache'
      - {type: contains, target: "map:haptic-cache-enable.map", pattern: 'default/cached-hmac 1'}

  test-haptic-cache-with-consumer-groups-enforced-on-client-leg:
    description: >-
      Same for consumer-group authorization on a cache-enabled route: the 403
      must be emitted on the client leg, after the api-key snippet has resolved
      txn.haptic_consumer there.
    extraContext: *extracontextCacheVarnish
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg-secret }
          type: Opaque
          data: {groups: YWxpY2U6Z3JvdXAtYQo=}
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: apikeys }
          type: Opaque
          data: {keys: azE6YWxpY2UK}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-cg
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/api-key-secret: apikeys
              haproxy-haptic.org/consumer-groups-secret: cg-secret
              haproxy-haptic.org/allowed-consumer-groups: "group-a"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-cg.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/cached-cg default/cg-secret ok$'}
      - {type: contains, target: "map:haptic-consumer-group-allow.map", pattern: '(?m)^default/cached-cg\|group-a 1$'}
      # Ordering is load-bearing: 860 resolves txn.haptic_consumer, 862 reads it,
      # and both precede the cache switch.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'set-var\(txn\.haptic_consumer\) var\(txn\.ak_consumer\)'
          - 'deny deny_status 403 if \{ var\(txn\.cg_state\) -m str ok \}'
          - 'use_backend varnish_cache'
      - {type: contains, target: "map:haptic-cache-enable.map", pattern: 'default/cached-cg 1'}

  test-haptic-cache-cert-header-without-cache-key:
    description: >-
      A route forwarding client-certificate details must vary on the certificate
      even when it sets no cache-key of its own — the injected header is a
      per-caller identity either way.
    extraContext: *extracontextCacheVarnish
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cert-only
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: cert-only.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Vary %\\[ssl_c_s_dn\\(CN\\),base64\\] if \\{ var\\(txn\\.policy_id\\) -m str default/cert-only \\}"
      - { type: contains, target: "map:haptic-cache-private.map", pattern: "(?m)^default/cert-only 1$" }

  test-haptic-cache-cn-header-varies-on-certificate:
    description: A route forwarding the client CN in a header of its choosing varies the cache on the certificate, as auth-tls-cert-header does.
    extraContext: *extracontextCacheVarnish
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: client-ca }
          type: Opaque
          data:
            ca.crt: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cn-only
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/cache-ttl: "60"
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-cn-header: "X-Scope-OrgID"
          spec:
            ingressClassName: haptic
            rules:
              - host: cn-only.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Haptic-Cache-Vary %\\[ssl_c_s_dn\\(CN\\),base64\\] if \\{ var\\(txn\\.policy_id\\) -m str default/cn-only \\}"
      - { type: contains, target: "map:haptic-cache-private.map", pattern: "(?m)^default/cn-only 1$" }

  test-haptic-cache-consumer-groups-without-identity-denies:
    description: >-
      Consumer-group authorization on a cache-enabled route without an identity
      producer denies 403 on the client leg like any other route: with no consumer
      the group lookup misses. The pairing used to be refused because only api-key
      resolved the identity on the client leg; JWT now does too.
    extraContext: *extracontextCacheVarnish
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: cg-secret }
          type: Opaque
          data: {groups: YWxpY2U6Z3JvdXAtYQo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cached-cg-nokey
            annotations:
              haproxy-haptic.org/cache-enable: "true"
              haproxy-haptic.org/consumer-groups-secret: cg-secret
              haproxy-haptic.org/allowed-consumer-groups: "group-a"
          spec:
            ingressClassName: haptic
            rules:
              - host: cached-cg-nokey.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-consumer-group-routes.map", pattern: '(?m)^default/cached-cg-nokey default/cg-secret ok$'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'deny deny_status 403 if \{ var\(txn\.cg_state\) -m str ok \}'
          - 'use_backend varnish_cache'
