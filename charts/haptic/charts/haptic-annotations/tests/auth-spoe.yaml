        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(basic_auth_unavailable\\)"
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}
      # The render must still succeed: a Secret deleted after admission must not
