# HAPTIC-native annotation library — auth / mTLS / external-auth / OAuth2 / WAF
# validation tests (haproxy-haptic.org/* prefix).
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: { name: echo, port: { number: 80 } }}
  clientCASecret: &clientCASecret
    apiVersion: v1
    kind: Secret
    metadata: { namespace: default, name: client-ca }
    type: Opaque
    data:
      ca.crt: 

  serverTLSSecret: &serverTLSSecret
    apiVersion: v1
    kind: Secret
    metadata: { namespace: default, name: server-tls }
    type: kubernetes.io/tls
    data:
      tls.crt: 
      tls.key: 

validationTests:
  # ============================================================================
  # Basic auth
  # ============================================================================
  test-haptic-basic-auth:
    description: >-
      haproxy-haptic.org/auth-type basic + auth-secret (auth-file htpasswd)
      generates a userlist (bcrypt hash + user::plain → insecure-password), a
      routes-map row and the frontend auth challenge; the backend stays plain.
    extraContext: {hapticPasswordHashRegex: "^.*$"}
    fixtures:
      secrets:
        # data.auth = base64("admin:$2y$05$...\nguest::plainpw\n")
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: haptic-auth }
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCmd1ZXN0OjpwbGFpbnB3Cg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "haptic-auth"
              haproxy-haptic.org/auth-realm: "ProtectedArea"
          spec:
            ingressClassName: haptic
            rules:
              - host: auth.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist haptic_auth_default_haptic-auth"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password [$]2y[$]05[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user guest insecure-password plainpw"}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "ProtectedArea" if \{ var\(txn\.ba_cfg\) -m str "ok haptic_auth_default_haptic-auth ProtectedArea" \} !\{ http_auth\(haptic_auth_default_haptic-auth\) \}'
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/auth-ingress ok haptic_auth_default_haptic-auth ProtectedArea$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'auth realm "ProtectedArea" unless'}

  test-haptic-basic-auth-shared-secret-one-rule-per-pair:
    description: >-
      Routes on one credentials Secret share its userlist; the frontend spells
      out one auth rule per distinct (userlist, realm) pair, a realm may
      contain spaces and is stripped, and every route has its own map row.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: shared-auth }
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ba-one
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "shared-auth"
              haproxy-haptic.org/auth-realm: " Staging Area "
          spec:
            ingressClassName: haptic
            rules:
              - host: one.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ba-two
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "shared-auth"
              haproxy-haptic.org/auth-realm: "Staging Area"
          spec:
            ingressClassName: haptic
            rules:
              - host: two.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ba-three
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "shared-auth"
          spec:
            ingressClassName: haptic
            rules:
              - host: three.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: match_count, target: haproxy.cfg, pattern: "userlist haptic_auth_default_shared-auth", expected: "1"}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "Staging Area" if \{ var\(txn\.ba_cfg\) -m str "ok haptic_auth_default_shared-auth Staging Area" \} !\{ http_auth\(haptic_auth_default_shared-auth\) \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "Restricted" if \{ var\(txn\.ba_cfg\) -m str "ok haptic_auth_default_shared-auth Restricted" \} !\{ http_auth\(haptic_auth_default_shared-auth\) \}'
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/ba-one ok haptic_auth_default_shared-auth Staging Area$'}
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/ba-two ok haptic_auth_default_shared-auth Staging Area$'}
      - {type: contains, target: "map:haptic-basic-auth-routes.map", pattern: '(?m)^default/ba-three ok haptic_auth_default_shared-auth Restricted$'}

  test-haptic-basic-auth-realm-rejects-weak-quote-expansion:
    description: >-
      The realm is a weakly quoted config token and a map value: a `$` would be
      expanded in one and kept in the other, so the rule would never match.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: haptic-auth }
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "haptic-auth"
              haproxy-haptic.org/auth-realm: "Area $HOME"
          spec:
            ingressClassName: haptic
            rules:
              - host: auth.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Invalid auth-realm 'Area [$]HOME' on Ingress 'default/auth-ingress'"}

  test-haptic-basic-auth-map:
    description: >-
      haproxy-haptic.org/auth-secret-type auth-map reads one Secret data key per
      username; the base64-decoded value is that user's password hash, validated
      against hapticPasswordHashRegex.
    fixtures:
      secrets:
        # admin: base64("$2y$05$mN1WVk5Qnbg4QwdAdXbfz.8b3ceH6Q5KOVCKxR2IkNAfJgLi5pIKW")
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: haptic-authmap }
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: authmap-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "haptic-authmap"
              haproxy-haptic.org/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haptic
            rules:
              - host: authmap.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist haptic_auth_default_haptic-authmap"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password [$]2y[$]05[$]"}

  test-haptic-basic-auth-default-hash-schemes-accepted:
    description: >-
      The default hapticPasswordHashRegex admits bcrypt ($2a$/$2b$/$2y$),
      SHA-256/SHA-512 crypt and yescrypt, each verified against the shipped
      HAProxy images' crypt(3).
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hash-policy }
          type: Opaque
          data:
            a2a: JDJhJDA1JDcwVHlacHN4TWkxQWprRGY3R1FHZmVRQzFQYkllMnpGV1pHMEJVa2NQcGdVUFliU2Jucy91
            a2b: JDJiJDA1JEVWdC9nZjMxSUNxUkhoa0ZjVnYvdmVMV1R4VHFlLnNrdVJDS2NDQldVVURwQnJZTmRxQlg2
            a2y: JDJ5JDA1JEVWdC9nZjMxSUNxUkhoa0ZjVnYvdmVMV1R4VHFlLnNrdVJDS2NDQldVVURwQnJZTmRxQlg2
            a5: JDUkSFFHUEdJdTNHL0JNeFNXLiRGcEtwRnN5TnJsMmZ1T2xBb2k3WnBrdVUuZXpkWUVpOTFaSXpDY0ZsQ0Ev
            a6: JDYkWkkxUFVVOXlwM2c1eDBRSCQvZXJ1dFhVc2tQb0dBb2NwMzN2UzJlMWs1dU5jZWVoVDFQRXNGdVI5VmVrRzZNRUpweEk5SEJaU09sQklGU09hblplREtQVTlBLnhpb243bnl3VEhvLw==
            ay: JHkkajlUJFc2c0MvMXhZM0FGMEU0NEtHek1DMi8kcnd6TEFrY3g4bi53dS4vczRRWGxFckZqYkx4TzRTOWxpUlgvSUw1cE1ORA==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-accepted
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "hash-policy"
              haproxy-haptic.org/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash-policy.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "user a2a password [$]2a[$]05[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user a2b password [$]2b[$]05[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user a2y password [$]2y[$]05[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user a5 password [$]5[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user a6 password [$]6[$]"}
      - {type: contains, target: haproxy.cfg, pattern: "user ay password [$]y[$]"}

  test-haptic-basic-auth-default-rejects-apr1:
    description: >-
      Apache $apr1$ hashes never authenticate: the HAProxy images' crypt(3) can't verify them.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hash-policy }
          type: Opaque
          data: {auth: YWRtaW46JGFwcjEka3ZUa0t1VjgkS0RQSjB6ZW5EZ3pKWlZwT3lTYUR3MAo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-apr1
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "hash-policy"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash-policy.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress 'default/hash-apr1' references Secret 'default/hash-policy', whose password hash for user 'admin' doesn't match"}
      - {type: contains, target: rendering_error, pattern: "bcrypt, SHA-256/SHA-512 crypt or yescrypt"}

  test-haptic-basic-auth-default-rejects-md5crypt:
    description: >-
      $1$ MD5-crypt verifies but is too weak to accept by default.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hash-policy }
          type: Opaque
          data: {admin: JDEkYkk0VUJTWVkkZXhwbndmSC9IRjFBelNpcXM3Z0NVMA==}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-md5crypt
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "hash-policy"
              haproxy-haptic.org/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash-policy.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress 'default/hash-md5crypt' references Secret 'default/hash-policy', whose password hash for user 'admin' doesn't match"}
      - {type: contains, target: rendering_error, pattern: "bcrypt, SHA-256/SHA-512 crypt or yescrypt"}

  test-haptic-basic-auth-default-rejects-descrypt:
    description: >-
      DES crypt verifies but only uses the first 8 password bytes.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hash-policy }
          type: Opaque
          data: {admin: eGpjTjduQUQvbThjdw==}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-descrypt
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "hash-policy"
              haproxy-haptic.org/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash-policy.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress 'default/hash-descrypt' references Secret 'default/hash-policy', whose password hash for user 'admin' doesn't match"}
      - {type: contains, target: rendering_error, pattern: "bcrypt, SHA-256/SHA-512 crypt or yescrypt"}

  test-haptic-basic-auth-default-rejects-plaintext:
    description: >-
      A user::plain line is a plaintext credential, not a hash, so the default refuses it.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: hash-policy }
          type: Opaque
          data: {auth: YWRtaW46OnNlY3JldAo=}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-plaintext
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "hash-policy"
          spec:
            ingressClassName: haptic
            rules:
              - host: hash-policy.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress 'default/hash-plaintext' references Secret 'default/hash-policy', whose password hash for user 'admin' doesn't match"}
      - {type: contains, target: rendering_error, pattern: "bcrypt, SHA-256/SHA-512 crypt or yescrypt"}

  # ============================================================================
  # satisfy=any — OR-combine allowlist + basic auth
  # ============================================================================
  test-haptic-satisfy-any-realm-pipe-rejected:
    description: >-
      '|' separates the fields of the lane's map key, so a realm carrying one
      would publish a row that no rule can match. The render fails closed
      rather than shipping a satisfy route with no gate.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: satisfy-auth }
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sat-pipe
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Weird|Realm"
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: sat-pipe.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "on Ingress 'default/sat-pipe': '\\|' is not allowed in a satisfy=any realm"}

  test-haptic-satisfy-any-shares-one-challenge:
    description: >-
      Two satisfy=any routes on one Secret and realm share a single challenge
      rule; only their membership rows differ, so the second is a map edit.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: satisfy-auth }
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sat-a
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Shared"
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: sat-a.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sat-b
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Shared"
              haproxy-haptic.org/allowlist-source-range: "172.16.0.0/12"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: sat-b.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-satisfy-routes.map", pattern: '(?m)^default/sat-a\|haptic\|haptic_auth_default_satisfy-auth\|Shared 1$'}
      - {type: contains, target: "map:ing-satisfy-routes.map", pattern: '(?m)^default/sat-b\|haptic\|haptic_auth_default_satisfy-auth\|Shared 1$'}
      # One challenge per frontend for the shared pair: never two in a row.
      - {type: not_contains, target: haproxy.cfg, pattern: 'auth realm "Shared"[^\n]*\n\s*http-request auth realm "Shared"'}

  test-haptic-satisfy-any-ipv6-keeps-backend-gate:
    description: >-
      An allow-list with an IPv6 entry cannot be cut into a disjoint cover, so
      that route keeps the backend gate instead of joining the frontend lane.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: satisfy-auth }
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sat-v6
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Protected"
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8,2001:db8::/32"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: sat-v6.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'acl haptic_satisfy_ip_default_sat-v6 src 10\.0\.0\.0/8 2001:db8::/32'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "Protected" if !haptic_satisfy_ip_default_sat-v6'}
      # No route joined the lane, so its rules — and its routes map — are absent.
      - {type: not_contains, target: haproxy.cfg, pattern: 'ing-satisfy-routes\.map'}

  test-haptic-satisfy-any:
    description: >-
      satisfy=any folds the allowlist and basic auth into a single backend
      challenge that fires only for non-allow-listed, unauthenticated requests,
      and suppresses the unconditional auth challenge.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: satisfy-auth }
          type: Opaque
          data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: satisfy-any-ingress
            annotations:
              haproxy-haptic.org/auth-type: "basic"
              haproxy-haptic.org/auth-secret: "satisfy-auth"
              haproxy-haptic.org/auth-secret-type: "auth-map"
              haproxy-haptic.org/auth-realm: "Protected"
              haproxy-haptic.org/allowlist-source-range: "10.0.0.0/8,192.168.0.0/16"
              haproxy-haptic.org/satisfy: "any"
          spec:
            ingressClassName: haptic
            rules:
              - host: satisfy.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # The gate is a frontend rule per distinct (userlist, realm) pair, picked
      # by a membership row, so the route itself carries no configuration text.
      - {type: contains, target: "map:ing-satisfy-routes.map", pattern: '(?m)^default/satisfy-any-ingress\|haptic\|haptic_auth_default_satisfy-auth\|Protected 1$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request auth realm "Protected" if \{ var\(txn\.resource_key\),concat\(\|haptic\|haptic_auth_default_satisfy-auth\|Protected\),map\(\S*/ing-satisfy-routes\.map\) -m found \} !\{ var\(txn\.haptic_sat_allow\) -m bool \} !\{ http_auth\(haptic_auth_default_satisfy-auth\) \}'
      # The allow-list half is the access-control shape: the block of the
      # disjoint cover the client falls in, then whether this route exempts it.
      - {type: contains, target: "map:ing-satisfy-allow-partitions.map", pattern: '(?m)^10\.0\.0\.0/8 10\.0\.0\.0/8$'}
      - {type: contains, target: "map:ing-satisfy-allow-members.map", pattern: '(?m)^10\.0\.0\.0/8\|default/satisfy-any-ingress 1$'}
      - {type: contains, target: "map:ing-satisfy-allow-members.map", pattern: '(?m)^192\.168\.0\.0/16\|default/satisfy-any-ingress 1$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'acl haptic_satisfy_ip_default_satisfy-any-ingress'}
      - type: not_contains
        target: haproxy.cfg
        pattern: '-m str "ok haptic_auth_default_satisfy-auth Protected"'
      # The standalone allowlist deny (access-control fragment) is suppressed
      # under satisfy=any — the combined gate above owns the allowlist, so an
      # authenticated request from a non-allow-listed IP still passes.
      - {type: not_contains, target: haproxy.cfg, pattern: "haptic_allowlist_default_satisfy-any-ingress"}
  test-haptic-auth-tls:
    description: >-
      auth-tls-secret registers a SNI-keyed CA verify (verify required) in the
      crt-list, auth-tls-error-page lands in mtls-error.map, and
      auth-tls-cert-header forwards the X-SSL-Client-* headers.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: client-ca }
          type: kubernetes.io/tls
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: server-tls }
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-protected
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-verify-client: "on"
              haproxy-haptic.org/auth-tls-error-page: "https://login.example.com/cert-required"
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            tls:
              - hosts: ["api.example.com"]
                secretName: server-tls
            rules:
              - host: api.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "ca-file [^ ]*general/default-client-ca-client-ca\\.pem verify required\\] api\\.example\\.com"
      - type: contains
        target: map:mtls-error.map
        pattern: "api.example.com https%3a%2f%2flogin.example.com%2fcert-required"
      - {type: contains, target: "map:haptic-cert-header-routes.map", pattern: '(?m)^default/\S+ 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-header X-SSL-Client-Cert %\[ssl_c_der,base64\] if \{ ssl_fc_has_crt \} \{ var\(txn\.resource_key\),map\(\S*/haptic-cert-header-routes\.map\) -m found \}'}

  test-haptic-auth-tls-host-without-own-certificate:
    description: >-
      A verified host with no certificate of its own gets its own crt-list line on
      the certificate that already answers it, so its handshake verifies the client.
    fixtures:
      secrets: [*clientCASecret, *serverTLSSecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: on-default
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: on-wildcard
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-verify-client: "optional"
          spec:
            ingressClassName: haptic
            tls:
              - hosts: ["*.wild.example.com"]
                secretName: server-tls
            rules:
              - host: b.wild.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "crt-list:certificate-list.txt", pattern: '\Adefault\.pem \[ocsp-update on\]\n'}
      - {type: contains, target: "crt-list:certificate-list.txt", pattern: '(?m)^default\.pem \[ocsp-update on ca-file \S+client-ca\.pem verify required\] a\.example\.com$'}
      - {type: contains, target: "crt-list:certificate-list.txt", pattern: '(?m)^default_server-tls\.pem \[ocsp-update on ca-file \S+client-ca\.pem verify optional\] b\.wild\.example\.com$'}

  test-haptic-auth-tls-sni-must-match-host:
    description: >-
      A request routed to a verified route over a TLS connection whose SNI isn't
      one of the route's hosts, or is absent, never had its certificate checked,
      so it gets 421. A host alias reaches the route without being a verified SNI.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: verified
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/host-alias: "alias.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: *httpRoot
              - host: "*.wild.example.com"
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:mtls-routes.map", pattern: '(?m)^default/verified 1$'}
      - {type: contains, target: "map:mtls-route-sni.map", pattern: '(?m)^default/verified\|a\.example\.com 1$'}
      - {type: not_contains, target: "map:mtls-route-sni.map", pattern: 'alias'}
      - {type: contains, target: "map:mtls-route-sni-regex.map", pattern: '(?m)^\^default/verified\\\|\[\^\.\]\+\\\.wild\\\.example\\\.com\$ 1$'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.resource_key\)'
          - 'http-request set-var\(txn\.mtls_route_sni\) var\(txn\.resource_key\),concat\(\|,txn\.mtls_sni\) if \{ var\(txn\.mtls_sni\) -m found \}'
          - 'http-request return status 421 if \{ ssl_fc \} \{ var\(txn\.resource_key\),map\(\S+/mtls-routes\.map\) -m found \} !\{ var\(txn\.mtls_route_sni\),map\(\S+/mtls-route-sni\.map\) -m found \} !\{ var\(txn\.mtls_route_sni\),map_reg\(\S+/mtls-route-sni-regex\.map\) -m found \}'
          - 'use_backend %\[var\(txn\.backend_name\)\]'

  test-haptic-auth-tls-match-subject:
    description: auth-tls-match-subject denies the route with 403 unless the client certificate's RFC 2253 subject DN matches the pattern.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tenant-a
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-match-subject: "^CN=a(,|$)"
          spec:
            ingressClassName: haptic
            rules:
              - host: a.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 403 if \{ var\(txn\.resource_key\) -m str default/tenant-a \} !\{ ssl_c_s_dn\(,0,rfc2253\) -m reg "\^CN=a\(,\|\\\$\)" \}'

  test-haptic-auth-tls-match-subject-needs-secret:
    description: Without auth-tls-secret no certificate is verified for the host, so a subject match is refused instead of silently checking nothing.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad
            annotations:
              haproxy-haptic.org/auth-tls-match-subject: "CN=a"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/bad sets haproxy-haptic.org/auth-tls-match-subject without haproxy-haptic.org/auth-tls-secret"}

  test-haptic-auth-tls-match-subject-verify-off:
    description: auth-tls-verify-client off disables verification, so a subject match is refused.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-verify-client: "off"
              haproxy-haptic.org/auth-tls-match-subject: "CN=a"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/bad sets haproxy-haptic.org/auth-tls-match-subject with haproxy-haptic.org/auth-tls-verify-client: off"}

  test-haptic-auth-tls-match-subject-injection:
    description: A control character in the pattern would break the deny rule onto a second line.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-match-subject: "CN=a\nhttp-request allow"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/bad has haproxy-haptic.org/auth-tls-match-subject with a control character"}

  test-haptic-auth-tls-cn-header:
    description: >-
      auth-tls-cn-header sets the named header to the verified CN. Routes naming
      the same header in different case share one rule pair keyed by the route
      map, and the client-supplied value is dropped before the set.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: loki
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-cn-header: "X-Scope-OrgID"
          spec:
            ingressClassName: haptic
            rules:
              - host: loki.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: tempo
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-verify-client: "optional"
              haproxy-haptic.org/auth-tls-cn-header: "x-scope-orgid"
          spec:
            ingressClassName: haptic
            rules:
              - host: tempo.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-cn-header-routes.map", pattern: '(?m)^default/loki\|x-scope-orgid 1$'}
      - {type: contains, target: "map:haptic-cn-header-routes.map", pattern: '(?m)^default/tempo\|x-scope-orgid 1$'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request del-header X-Scope-OrgID if \{ var\(txn\.resource_key\),concat\(\|x-scope-orgid\),map\(\S*/haptic-cn-header-routes\.map\) -m found \}'
          - 'http-request set-header X-Scope-OrgID %\[ssl_c_s_dn\(CN\)\] if \{ ssl_fc_has_crt \} \{ var\(txn\.resource_key\),concat\(\|x-scope-orgid\),map\(\S*/haptic-cn-header-routes\.map\) -m found \}'
      # One rule pair per distinct header name, whatever its spelling.
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header x-scope-orgid '}

  test-haptic-auth-tls-cn-header-needs-secret:
    description: Without auth-tls-secret no certificate is verified for the host, so forwarding a CN is refused.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad
            annotations:
              haproxy-haptic.org/auth-tls-cn-header: "X-Scope-OrgID"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/bad sets haproxy-haptic.org/auth-tls-cn-header without haproxy-haptic.org/auth-tls-secret"}

  test-haptic-auth-tls-cn-header-invalid-name:
    description: A header name outside the token charset would break the generated rule, so it's refused.
    fixtures:
      secrets: [*clientCASecret]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bad
            annotations:
              haproxy-haptic.org/auth-tls-secret: "client-ca"
              haproxy-haptic.org/auth-tls-cn-header: "X Scope#OrgID"
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "Ingress default/bad has haproxy-haptic.org/auth-tls-cn-header 'X Scope#OrgID', which isn't a valid header name"}

  # ============================================================================
  # External auth (SPOE) — requires spoa-hub loaded
  # ============================================================================
  test-haptic-external-auth:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      auth-url populates auth-url.map and the spoa-hub external-auth frontend
      wiring; auth-headers-succeed emits a per-header set-header on success.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-url: "https://auth.example/check"
              haproxy-haptic.org/auth-signin: "https://login.example/start"
              haproxy-haptic.org/auth-method: "POST"
              haproxy-haptic.org/auth-headers-request: "X-Tenant-Id"
              haproxy-haptic.org/auth-headers-succeed: "X-Auth-User"
              haproxy-haptic.org/auth-headers-fail: "WWW-Authenticate"
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:auth-url.map, pattern: "default/protected https://auth.example/check"}
      - type: contains
        target: map:auth-signin.map
        pattern: "default/protected https://login.example/start"
      - {type: contains, target: map:auth-method.map, pattern: "default/protected POST"}
      - type: contains
        target: haproxy.cfg
        pattern: "http-request send-spoe-group spoa-hub-check-auth check-auth-group"
      - {type: contains, target: map:auth-forward-headers.map, pattern: "default/protected X-Tenant-Id"}
      - {type: contains, target: file:spoe.conf, pattern: "hdr_x_tenant_id=req\\.hdr\\(X-Tenant-Id\\)"}
      # Security: a client-supplied copy of the pass-through header is stripped
      # before the auth value is set, so it can't survive when the auth reply
      # omits the header (identity/privilege-escalation guard).
      - type: contains
        target: haproxy.cfg
        pattern: "http-request del-header X-Auth-User if \\{ var\\(txn.auth_url\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-header X-Auth-User %\\[var\\(txn.hub.external_auth.x_auth_user\\)\\]"
      - {type: contains, target: haproxy.cfg, pattern: "http-after-response set-header WWW-Authenticate"}

  test-haptic-external-auth-headers-request-underscore-not-captured:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      X_Api_Key on one Ingress must not become the capture for X-Api-Key on another; SPOE
      arg names can't tell them apart, so the underscore header is dropped with a Warning.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: underscored
            annotations:
              haproxy-haptic.org/auth-url: "https://auth.example/check"
              haproxy-haptic.org/auth-headers-request: "X_Api_Key, X-Tenant-Id"
          spec:
            ingressClassName: haptic
            rules:
              - host: underscored.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: dashed
            annotations:
              haproxy-haptic.org/auth-url: "https://auth.example/check"
              haproxy-haptic.org/auth-headers-request: "X-Api-Key"
          spec:
            ingressClassName: haptic
            rules:
              - host: dashed.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: file:spoe.conf, pattern: "hdr_x_api_key=req\\.hdr\\(X-Api-Key\\)"}
      - {type: not_contains, target: file:spoe.conf, pattern: "X_Api_Key"}
      - {type: contains, target: map:auth-forward-headers.map, pattern: "(?m)^default/underscored X-Tenant-Id$"}
      - {type: contains, target: map:auth-forward-headers.map, pattern: "(?m)^default/dashed X-Api-Key$"}
      - {type: contains, target: events, pattern: "Warning InvalidAuthHeader networking\\.k8s\\.io/v1 Ingress default/underscored: "}

  test-haptic-external-auth-headers-request-underscore-rejected-at-admission:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: The admission webhook rejects an underscore in auth-headers-request.
    extraContext:
      renderMode: admission
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: underscored
            annotations:
              haproxy-haptic.org/auth-url: "https://auth.example/check"
              haproxy-haptic.org/auth-headers-request: "X_Api_Key"
          spec:
            ingressClassName: haptic
            rules:
              - host: underscored.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "Ingress default/underscored annotation 'haproxy-haptic\\.org/auth-headers-request' lists header 'X_Api_Key', which contains '_'"

  # ============================================================================
  # OAuth2-proxy — desugars onto external-auth
  # ============================================================================
  test-haptic-oauth-oauth2-proxy:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      oauth: oauth2-proxy derives the oauth2-proxy address from the Ingress's own
      /oauth2 path backend, setting auth-url (/oauth2/auth), auth-signin
      (/oauth2/start), and auth-method HEAD.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages:
            - check-auth
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: oauth-app-svc }
          spec: { ports: [{ port: 80 }] }
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: oauth2-proxy }
          spec: { ports: [{ port: 4180 }] }
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: oauthapp
            annotations:
              haproxy-haptic.org/oauth: "oauth2-proxy"
          spec:
            ingressClassName: haptic
            rules:
              - host: oauthapp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: oauth-app-svc, port: { number: 80 } }}
                    - path: /oauth2
                      pathType: Prefix
                      backend: {service: { name: oauth2-proxy, port: { number: 4180 } }}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:auth-url.map
        pattern: "default/oauthapp http://oauth2-proxy.default.svc:4180/oauth2/auth"
      - type: contains
        target: map:auth-signin.map
        pattern: "default/oauthapp /oauth2/start\\?rd=%\\[path\\]"
      - {type: contains, target: map:auth-method.map, pattern: "default/oauthapp HEAD"}

  # ============================================================================
  # WAF (Coraza via SPOA hub) — waf-policy / waf-mode
  # ============================================================================
  test-haptic-waf-without-coraza-rejected:
    description: >-
      haproxy-haptic.org/waf-policy set while the spoaHub coraza plugin is NOT
      enabled fails the render with an explicit diagnostic.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: []
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: []
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies: {defaultPolicy: "", inline: {baseline: {}}, configMapRefs: { __replace__: true }}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: orphan-waf
            annotations:
              haproxy-haptic.org/waf-policy: baseline
          spec:
            ingressClassName: haptic
            rules:
              - host: orphan.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: any, port: { number: 80 } }}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "default/orphan-waf sets HAPTIC WAF annotations but the spoaHub coraza plugin is not enabled"

  test-haptic-waf-setup-fields-policy-with-coraza-disabled-renders:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: >-
      A policy carrying setup-position fields (allowedMethods) must not fail
      config registration when coraza is disabled — the anchor requirement
      only applies when coraza is on. Regression pin for the load-gate crash
      where a deployment-wide allowedMethods policy merged into any baked
      test running without coraza and hard-failed the whole render.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: []
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
        plugins: []
      waf:
        policies:
          defaultPolicy: ""
          inline:
            api-methods:
              enforcement: deny
              allowedMethods: [GET, POST, PUT, DELETE]
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: plain, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: any, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid

  test-haptic-auth-tls-cert-header-cannot-be-forged:
    description: >-
      The X-SSL-Client-* headers are set only when a client certificate is
      present, so without a strip a caller on plain HTTP — or on HTTPS presenting
      no certificate — had their own value forwarded to the application as the
      verified subject. The strip is unconditional for the route; the set stays
      gated on ssl_fc_has_crt.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-app
            annotations:
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Unconditional: a host-scoped strip missed wildcard and host-less rules.
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-CN\n' }
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-DN\n' }
      - { type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-Cert\n' }
      # The strip must precede the set, or the forged value survives.
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request del-header X-SSL-Client-CN\n'
          - "http-request set-header X-SSL-Client-CN %\\[ssl_c_s_dn\\(CN\\)\\] if \\{ ssl_fc_has_crt \\}"
  test-haptic-basic-auth-missing-secret-rejected-at-admission:
    description: >-
      Writing an Ingress that asks for basic auth with a Secret that does not
      exist is refused when the resource is written, so the mistake surfaces at
      kubectl apply rather than as a 503 nobody sees until traffic arrives.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-type: basic
              haproxy-haptic.org/auth-secret: does-not-exist
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      # Admission must NOT reject. The webhook renders against the
      # watched-resource store, which lags the API server, so a Secret created
      # moments earlier is indistinguishable from one that is missing — this
      # denied correct manifests applied in the correct order. The runtime 503
      # below is the protection, and it self-heals when the store catches up.
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}

  test-haptic-basic-auth-secret-deleted-later-fails-closed:
    description: >-
      An Ingress already admitted, whose Secret is deleted afterwards, must
      degrade CLOSED rather than abort the whole render or serve unauthenticated.
      Emitting no rule left the backend with no authentication at all, so a
      deleted Secret silently turned the gate off.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: protected
            annotations:
              haproxy-haptic.org/auth-type: basic
              haproxy-haptic.org/auth-secret: does-not-exist
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request set-var\\(txn.denied_by\\) str\\(basic_auth_unavailable\\)" }
      # Must not reference a userlist that was never produced.
      - { type: not_contains, target: haproxy.cfg, pattern: "http_auth\\(haptic_auth_default_does-not-exist\\)" }

  test-haptic-auth-tls-missing-secret-rejected-at-admission:
    description: >-
      Writing an Ingress whose auth-tls-secret does not exist is refused when the
      resource is written. It previously rendered clean and served the host with
      client-certificate verification silently absent.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-missing-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-missing.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      # Admission must NOT reject. The webhook renders against the
      # watched-resource store, which lags the API server, so a Secret created
      # moments earlier is indistinguishable from one that is missing — this
      # denied correct manifests applied in the correct order. The runtime 503
      # below is the protection, and it self-heals when the store catches up.
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503"}

  test-haptic-auth-tls-secret-deleted-later-fails-closed:
    description: >-
      An already-admitted route whose CA Secret is deleted afterwards must stop
      serving rather than serve with verification absent. HAPTIC terminates every
      HTTPS host on one shared bind and the verify clause is a per-entry option,
      so there is no separate mTLS listener to refuse the handshake.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-missing-ca
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: mtls-missing.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn\\.host\\) -m str mtls-missing\\.example\\.com \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.denied_by\\) str\\(mtls_unavailable\\)"
      # The host must NOT be silently served with verification absent.
      - {type: not_contains, target: haproxy.cfg, pattern: "ca-file [^ ]*no-such-ca"}

  test-haptic-auth-tls-wildcard-host-fails-closed:
    description: >-
      A wildcard Ingress host must be denied by a single-label regex. An exact
      -m str match on the literal '*.example.com' never fires against a concrete
      request host, so the route kept serving with verification absent.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mtls-wildcard
            annotations:
              haproxy-haptic.org/auth-tls-secret: no-such-ca
              haproxy-haptic.org/auth-tls-verify-client: "on"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.wild.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 503 if \{ var\(txn\.host\) -m reg \^\[\^\.\]\+\\\.wild\\\.example\\\.com\$ \}'
      # The literal wildcard must never reach an exact matcher — that is the bug.
      - {type: not_contains, target: haproxy.cfg, pattern: '-m str \*\.wild\.example\.com'}

  test-haptic-auth-tls-secret-without-ca-crt-fails-closed:
