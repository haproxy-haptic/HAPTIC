  test-haptic-auth-tls-cert-header-strip-covers-wildcard-and-hostless:
    description: >-
      The X-SSL-Client-* strip must not be host-scoped. A wildcard host never
      matched the exact -m str condition and a host-less rule skipped the block
      entirely, so a client-supplied identity header reached a backend this
      annotation tells to trust it.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: certhdr-wild
            annotations:
              haproxy-haptic.org/auth-tls-cert-header: "true"
          spec:
            ingressClassName: haptic
            rules:
              - host: "*.certhdr.example.com"
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Unconditional strip — no trailing `if`.
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-CN\n'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-SSL-Client-Cert\n'}
      # The strip must never be gated on a host match again.
      - {type: not_contains, target: haproxy.cfg, pattern: 'del-header X-SSL-Client-[A-Za-z]+ if'}

  test-haptic-basic-auth-without-secret-annotation-fails-closed:
    description: >-
      auth-type basic with no auth-secret served every request unauthenticated - no userlist, no challenge, no warning, nothing at admission.
    fixtures:
      ingresses:
