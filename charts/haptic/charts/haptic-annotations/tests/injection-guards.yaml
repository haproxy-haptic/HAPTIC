# HAPTIC-native annotation library — config-injection guard tests.
# Header/content-type/CORS VALUES are emitted inside double quotes via
# EscapeDquoteValue (a " / $ is escaped, a control char is rejected); oauth-uri-prefix
# is guarded (mapkey) before it reaches an auth routing-map value. Denied at
# admission, warned-and-skipped on reconcile.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:

  # ---- request/response-set-header VALUE escaping + control-char guard ----
  test-haptic-request-set-header-escapes-values:
    description: A set-header value with a single quote ('self'), a double quote, a space, and a dollar sign is URL-encoded in ing-reqhdr.map (space -> %20, ' -> %27, " -> %22, $ -> %24) and decoded with url_dec(1) at request time, so none of them can break the config or read request state.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-esc
            annotations:
              haproxy-haptic.org/request-set-header: "Content-Security-Policy default-src 'self'\nX-Quoted has\"quote\nX-Dollar a$b"
          spec:
            ingressClassName: haptic
            rules:
              - host: esc.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-esc_svc_echo_80\|set\|content-security-policy default-src%20%27self%27'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-esc_svc_echo_80\|set\|x-quoted has%22quote'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-esc_svc_echo_80\|set\|x-dollar a%24b'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-header Content-Security-Policy %\[var\(txn\.backend_name\),concat\(\|set\|content-security-policy\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      # No raw value in a per-backend/frontend directive (negative control).
      - {type: not_contains, target: haproxy.cfg, pattern: "set-header Content-Security-Policy \""}

  test-haptic-request-set-header-control-char-reconcile-warns-and-skips:
    description: A control character in a request-set-header value is skipped while a valid sibling Ingress still emits its header.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-bad, annotations: {haproxy-haptic.org/request-set-header: "X-Bad val\rmore"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-ok, annotations: {haproxy-haptic.org/request-set-header: "X-Good goodval"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: ok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-ok_svc_echo_80\|set\|x-good goodval'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-header X-Good %\[var\(txn\.backend_name\),concat\(\|set\|x-good\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      - {type: not_contains, target: haproxy.cfg, pattern: "X-Bad"}
      - {type: not_contains, target: 'map:ing-reqhdr.map', pattern: "X-Bad"}

  test-haptic-request-set-header-control-char-admission-rejected:
    description: A control character in a request-set-header value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hdr-bad, annotations: {haproxy-haptic.org/request-set-header: "X-Bad val\rmore"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: bad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "would split the frontend directive"}

  test-haptic-response-set-header-control-char-reconcile-warns-and-skips:
    description: A control character in a response-set-header value is skipped while a valid sibling Ingress still emits its header.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: rhdr-bad, annotations: {haproxy-haptic.org/response-set-header: "X-Bad val\rmore"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: rbad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: rhdr-ok, annotations: {haproxy-haptic.org/response-set-header: "X-Good goodval"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: rok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_rhdr-ok_svc_echo_80\|set\|x-good goodval'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header X-Good %\[var\(txn\.backend_name\),concat\(\|set\|x-good\),map\([^)]*ing-reshdr\.map\),url_dec\(1\)\]'}
      - {type: not_contains, target: haproxy.cfg, pattern: "X-Bad"}
      - {type: not_contains, target: 'map:ing-reshdr.map', pattern: "X-Bad"}

  # ---- request-set-header NAME injection guard ----
  test-haptic-request-set-header-hostile-name-admission-rejected:
    description: A header NAME outside the HTTP token charset is denied at admission — it would otherwise become part of an ing-reqhdr.map key, where `|` is the delimiter, and the static line would then silently drop it.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hn-bad, annotations: {haproxy-haptic.org/request-set-header: "X|Bad val"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: hnbad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "is not an HTTP token"}

  test-haptic-response-remove-header-hostile-name-admission-rejected:
    description: A response-remove-header entry outside the HTTP token or '<prefix>*' syntax is denied at admission.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: rdel-bad, annotations: {haproxy-haptic.org/response-remove-header: "x-amz-*, X|Bad"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: rdelbad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "is not an HTTP token or '<prefix>\\*'"}
      - {type: contains, target: rendering_error, pattern: "the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: "the header is skipped"}

  test-haptic-response-remove-header-hostile-name-reconcile-skips:
    description: On reconcile a hostile response-remove-header entry warns and is skipped, while valid entries on the same Ingress still render.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: rdel-mixed, annotations: {haproxy-haptic.org/response-remove-header: "Server, *, x-amz-*"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: rdelmixed.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_rdel-mixed_svc_echo_80\|del\|server 1'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_rdel-mixed_svc_echo_80\|del-beg\|x-amz- 1'}
      - {type: contains, target: events, pattern: "Warning InvalidAnnotation .* names header '\\*'.* the header is skipped"}

  test-haptic-request-set-header-hostile-name-reconcile-skips:
    description: On reconcile the hostile header NAME is skipped and never reaches ing-reqhdr.map, while a valid sibling still emits its entry.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hn-bad, annotations: {haproxy-haptic.org/request-set-header: "X|Bad val"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: hnbad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: hn-ok, annotations: {haproxy-haptic.org/request-set-header: "X-Good goodval"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: hnok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: 'map:ing-reqhdr.map', pattern: "[Xx]\\|[Bb]ad"}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hn-ok_svc_echo_80\|set\|x-good goodval'}

  # ---- HTTP framing and routing header guards ----
  test-haptic-request-remove-header-content-length-admission-rejected:
    description: Admission rejects removal of Content-Length because HAProxy would forward an empty request body.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: del-cl, annotations: {haproxy-haptic.org/request-remove-header: "Content-Length"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: del-cl.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "matches protected header 'content-length'"}

  test-haptic-request-remove-header-prefix-admission-rejected:
    description: Admission rejects a removal prefix that also matches Transfer-Encoding.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: del-prefix, annotations: {haproxy-haptic.org/request-remove-header: "t*"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: del-prefix.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "matches protected header 'transfer-encoding'"}

  test-haptic-request-remove-header-host-admission-rejected:
    description: Admission rejects removal of the request Host header.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: del-host, annotations: {haproxy-haptic.org/request-remove-header: "Host"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: del-host.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "matches protected header 'host'"}

  test-haptic-request-set-header-content-length-admission-rejected:
    description: Admission rejects overwriting Content-Length on requests.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: set-cl, annotations: {haproxy-haptic.org/request-set-header: "Content-Length 0"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: set-cl.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "matches protected header 'content-length'"}

  test-haptic-response-set-header-content-length-admission-rejected:
    description: Admission rejects overwriting Content-Length on responses.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: rset-cl, annotations: {haproxy-haptic.org/response-set-header: "Content-Length 0"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: rset-cl.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "matches protected header 'content-length'"}

  test-haptic-protected-headers-reconcile-skips:
    description: Reconcile skips exact and prefix matches for protected headers while safe header modifications still render.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-protected
            annotations:
              haproxy-haptic.org/request-remove-header: "Content-Length, Transfer-Encoding, t*, c*, content-*, Host, h*, Cookie, cf-*"
              haproxy-haptic.org/response-remove-header: "Content-Length, Transfer-Encoding, c*, Content-Security-Policy, x-amz-*"
              haproxy-haptic.org/request-set-header: "Content-Length 0\nTransfer-Encoding chunked\nHost upstream\nX-Good goodval"
              haproxy-haptic.org/response-set-header: "Content-Length 0\nTransfer-Encoding chunked\nX-Good goodval"
          spec:
            ingressClassName: haptic
            rules:
              - host: protected.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-protected_svc_echo_80\|del\|cookie 1'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-protected_svc_echo_80\|del-beg\|cf- 1'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_hdr-protected_svc_echo_80\|del\|content-security-policy 1'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_hdr-protected_svc_echo_80\|del-beg\|x-amz- 1'}
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-protected_svc_echo_80\|set\|x-good goodval'}
      - {type: contains, target: 'map:ing-reshdr.map', pattern: 'default_hdr-protected_svc_echo_80\|set\|x-good goodval'}
      - {type: not_contains, target: 'map:ing-reqhdr.map', pattern: '\|(?:del|del-beg|set)\|(?:content-length|transfer-encoding|host) '}
      - {type: not_contains, target: 'map:ing-reshdr.map', pattern: '\|(?:del|del-beg|set)\|(?:content-length|transfer-encoding) '}
      - {type: not_contains, target: 'map:ing-reqhdr.map', pattern: '\|del-beg\|(?:c|t|content-|h) 1'}
      - {type: contains, target: events, pattern: "matches protected header 'content-length'"}
      - {type: contains, target: events, pattern: "matches protected header 'host'"}

  # ---- fixed-response / mock-response content-type + body ----
  test-haptic-fixed-response-body-escapes-dollar:
    description: A fixed-response body containing a dollar sign lands URL-encoded in the body map, so HAProxy never sees it as an environment variable.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: fr-dollar
            annotations:
              haproxy-haptic.org/fixed-response: "true"
              haproxy-haptic.org/fixed-response-body: "cost $5"
          spec:
            ingressClassName: haptic
            rules:
              - host: frd.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-return-body.map", pattern: '(?m)^default/\S+ cost%20%245$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'cost'}

  test-haptic-fixed-response-content-type-control-char-reconcile-warns-and-skips:
    description: A control character in fixed-response-content-type is skipped while a valid sibling fixed-response still renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: fr-bad
            annotations:
              haproxy-haptic.org/fixed-response: "true"
              haproxy-haptic.org/fixed-response-body: "maint"
              haproxy-haptic.org/fixed-response-content-type: "text/plain\nacl fr-inj-marker always"
          spec:
            ingressClassName: haptic
            rules:
              - host: frbad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: fr-ok
            annotations:
              haproxy-haptic.org/fixed-response: "true"
              haproxy-haptic.org/fixed-response-body: "ok"
          spec:
            ingressClassName: haptic
            rules:
              - host: frok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-return-body.map", pattern: '(?m)^default/\S+ ok$'}
      - {type: not_contains, target: haproxy.cfg, pattern: "fr-inj-marker"}

  test-haptic-fixed-response-content-type-control-char-admission-rejected:
    description: A control character in fixed-response-content-type is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: fr-bad
            annotations:
              haproxy-haptic.org/fixed-response: "true"
              haproxy-haptic.org/fixed-response-body: "maint"
              haproxy-haptic.org/fixed-response-content-type: "text/plain\nacl fr-inj-marker always"
          spec:
            ingressClassName: haptic
            rules:
              - host: frbad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "would split the frontend directive"}

  test-haptic-mock-response-content-type-control-char-reconcile-warns-and-skips:
    description: A control character in mock-response-content-type is skipped while a valid sibling mock-response still renders.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mock-bad
            annotations:
              haproxy-haptic.org/mock-response: '{"ok":1}'
              haproxy-haptic.org/mock-response-content-type: "application/json\nacl mock-inj-marker always"
          spec:
            ingressClassName: haptic
            rules:
              - host: mockbad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mock-ok
            annotations:
              haproxy-haptic.org/mock-response: 'served'
          spec:
            ingressClassName: haptic
            rules:
              - host: mockok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-return-body.map", pattern: '(?m)^default/mock-ok served$'}
      - {type: not_contains, target: haproxy.cfg, pattern: "mock-inj-marker"}

  # ---- shared EmitAnnotationCORS macro ----
  test-haptic-cors-value-control-char-reconcile-warns-and-skips:
    description: A control character in a CORS value drops the whole CORS block for that Ingress while a valid sibling Ingress still emits CORS.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-bad
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-methods: "GET\nacl cors-inj-marker always"
          spec:
            ingressClassName: haptic
            rules:
              - host: corsbad.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ok
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-origin: "https://app.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: corsok.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "set-header Access-Control-Allow-Origin"}
      - {type: not_contains, target: haproxy.cfg, pattern: "cors-inj-marker"}

  test-haptic-cors-value-control-char-admission-rejected:
    description: A control character in a CORS value is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-bad
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-methods: "GET\nacl cors-inj-marker always"
          spec:
            ingressClassName: haptic
            rules:
              - host: corsbad.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "CORS is not applied"}

  test-haptic-cors-value-percent-escaped:
    description: A CORS value with a log-format fetch lands URL-encoded in the expose map and is decoded only per request, so a tenant cannot read request-scoped state into the CORS response header.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-pct
            annotations:
              haproxy-haptic.org/cors-enable: "true"
              haproxy-haptic.org/cors-allow-origin: "https://app.example.com"
              haproxy-haptic.org/cors-expose-headers: "X-%[req.hdr(y)]"
          spec:
            ingressClassName: haptic
            rules:
              - host: corspct.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-cors-expose.map", pattern: '(?m)^default/cors-pct X-%25%5breq\.hdr%28y%29%5d$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'X-%\[req'}

  # ---- oauth-uri-prefix into auth routing maps (mapkey guard) ----
  test-haptic-oauth-uri-prefix-legit-renders:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: A legit non-default oauth-uri-prefix renders into the signin/url auth maps.
    extraContext:
      spoaHub:
        enabled: true
        haproxy:
          socketPath: /run/spoa/hub.sock
          modeSpop: true
          messages: [check-auth]
          timeoutHello: 2s
          timeoutIdle: 5m
          timeoutProcessing: 500ms
          poolMaxConn: 100
          poolPurgeDelay: 30s
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth-app-svc}
          spec: {ports: [{port: 80}]}
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: oauth2-proxy}
          spec: {ports: [{port: 4180}]}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: oauthcustom, annotations: {haproxy-haptic.org/oauth: "oauth2-proxy", haproxy-haptic.org/oauth-uri-prefix: "/custom-oauth"}}
          spec:
            ingressClassName: haptic
            rules:
              - host: oauthcustom.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: oauth-app-svc, port: {number: 80}}}}
                    - {path: /custom-oauth, pathType: Prefix, backend: {service: {name: oauth2-proxy, port: {number: 4180}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:auth-signin.map', pattern: "default/oauthcustom /custom-oauth/start"}
      - {type: contains, target: 'map:auth-url.map', pattern: "default/oauthcustom http://oauth2-proxy.default.svc:4180/custom-oauth/auth"}

  test-haptic-oauth-uri-prefix-injection-reconcile-warns-and-skips:
    _helm_skip_test: '{{ include "haptic.spoaHub.disabled" . }}'
    description: A control character in oauth-uri-prefix is skipped, so no entry is injected into the auth signin map.
    extraContext:
      renderMode: reconcile
