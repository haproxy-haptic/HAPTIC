                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    httpResources:
      - url: https://issuer.example.com/keys
        content: '{"keys": [{"kty": "RSA", "kid": "old", "n": "u6RhujxV_1Hn5vayn06Zno8bwCH8WSoNJLdZXbHaPG3WhbpyXgUvMH-55udbTepqYwu9yNiH4smAUl4RljsFVoUQ6VpE-N7vbj3aY1GKZuy0xkS35f5KqoUTj-krctEDU-JJrgje7TvQdJQOrFWInyUtsajQvktMv5UJErk2nVd0e4Ir_SYd8cKNxwDz68H3W9ggmfKJoWwljPblQ2B9ZUgC5Feejdi_SavAYCOpjsHceFo4AyYwnOT8j0GUO1vRM63SLPgGRNmrT4HQokKR_KdZkD5CXvDtPIgTlA9oGnWueHBNpZPuJjbmey7b2E_pZdawJrV7wSnG_QPJJ12XwQ", "e": "AQAB", "use": "sig", "alg": "RS256"}, {"kty": "RSA", "kid": "old", "n": "u6RhujxV_1Hn5vayn06Zno8bwCH8WSoNJLdZXbHaPG3WhbpyXgUvMH-55udbTepqYwu9yNiH4smAUl4RljsFVoUQ6VpE-N7vbj3aY1GKZuy0xkS35f5KqoUTj-krctEDU-JJrgje7TvQdJQOrFWInyUtsajQvktMv5UJErk2nVd0e4Ir_SYd8cKNxwDz68H3W9ggmfKJoWwljPblQ2B9ZUgC5Feejdi_SavAYCOpjsHceFo4AyYwnOT8j0GUO1vRM63SLPgGRNmrT4HQokKR_KdZkD5CXvDtPIgTlA9oGnWueHBNpZPuJjbmey7b2E_pZdawJrV7wSnG_QPJJ12XwQ", "e": "AQAB", "use": "sig", "alg": "RS256"}]}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'JWKS URL .* is invalid'}
  test-haptic-jwks-unapproved:
    extraContext:
      jwt:
        allowedJWKSURLs: {}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwks
            annotations:
              haproxy-haptic.org/jwt-jwks-url: "https://issuer.example.com/keys"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwks.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: 'JWKS URL .* is not allowed'}
  test-haptic-jwks-conflicting-sources:
    extraContext:
      jwt:
        allowedJWKSURLs: {issuer: "https://issuer.example.com/keys"}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwks
            annotations:
              haproxy-haptic.org/jwt-secret: keys
              haproxy-haptic.org/jwt-jwks-url: "https://issuer.example.com/keys"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwks.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: 'sets both jwt-secret and jwt-jwks-url'}
