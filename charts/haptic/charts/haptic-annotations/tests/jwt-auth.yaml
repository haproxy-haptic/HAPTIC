# HAPTIC-native annotation library — JWT auth validation tests.
validationTests:
  test-haptic-jwt-auth:
    description: >-
      jwt-secret registers the public key, the route's settings land in
      haptic-jwt-routes.map, and one frontend block runs the alg-confusion-hardened
      verify chain (header-alg guard, a verify rule per key file with the constant
      algorithm), the exp/nbf/iss/aud/required-claim denies, sets the shared consumer
      from sub, and forwards claims after del-header'ing them. A missing key Secret
      fails closed with 503.
    fixtures:
      secrets:
        - &jwt-public-key
          apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: jwt-keys }
          type: Opaque
          data:
            pubkey.pem: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-ingress
            annotations:
              haproxy-haptic.org/jwt-secret: "jwt-keys"
              haproxy-haptic.org/jwt-algorithm: "RS256"
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
              haproxy-haptic.org/jwt-audience: "my-api"
              haproxy-haptic.org/jwt-required-claims: "scope"
              haproxy-haptic.org/jwt-forward-claims: "sub:X-User-Id,email:X-User-Email"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nosecret
            annotations:
              haproxy-haptic.org/jwt-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: nosec.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: echo, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-jwt-routes.map", pattern: '(?m)^default/jwt-ingress RS256 haptic-jwt-default_jwt-keys\.pem ok https://issuer\.example\.com my-api ,scope, ,sub:X-User-Id,email:X-User-Email, true true$'}
      - {type: contains, target: "map:haptic-jwt-routes.map", pattern: '(?m)^default/jwt-nosecret RS256 _ missing _ _ _ _ false false$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.haptic_jwt_nbf\) -m found \} \{ var\(txn\.haptic_jwt_nbf\),sub\(txn\.haptic_jwt_now\) -m int gt 0 \}'
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.jwt_alg\) -m str RS256 \} \{ var\(txn\.jwt_key\) -m str haptic-jwt-default_jwt-keys\.pem \} !\{ http_auth_bearer,jwt_verify\('
          - 'http-request deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.haptic_jwt_nbf\) -m found \}'
          - 'http-request set-var\(txn\.haptic_consumer\) http_auth_bearer,jwt_payload_query\(''\$\.sub''\)'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.haptic_jwt_alg\) http_auth_bearer,jwt_header_query\(''\$\.alg''\) if \{ var\(txn\.jwt_state\) -m str ok \}'
      # The token's alg must equal the configured one, and verification runs with the configured constant.
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} !\{ var\(txn\.haptic_jwt_alg\),strcmp\(txn\.jwt_alg\) -m int 0 \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'jwt_verify\(RS256,"[^"]*haptic-jwt-default_jwt-keys\.pem"\) -m int 1'
      - type: contains
        target: haproxy.cfg
        pattern: 'jwt_payload_query\(''\$\.iss''\),strcmp\(txn\.jwt_iss\) -m int 0'
      - {type: contains, target: haproxy.cfg, pattern: 'jwt_payload_query\(''\$\.aud''\),strcmp\(txn\.jwt_aud\) -m int 0'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.jwt_req\) -m sub ,scope, \} !\{ http_auth_bearer,jwt_payload_query\(''\$\.scope''\) -m found \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.haptic_consumer\) http_auth_bearer,jwt_payload_query\(''\$\.sub''\) if \{ var\(txn\.jwt_state\) -m str ok \} !\{ var\(txn\.haptic_consumer\) -m found \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request del-header X-User-Id if \{ var\(txn\.jwt_fwd\) -m sub :X-User-Id, \}'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-header X-User-Id %\[http_auth_bearer,jwt_payload_query\(''\$\.sub''\)\] if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.jwt_fwd\) -m sub ,sub:X-User-Id, \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(jwt_key_unavailable\) if \{ var\(txn\.jwt_state\) -m str missing \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.jwt_state\) -m str missing nosecret \}'}
      - {type: contains, target: events, pattern: "JWTSecretMissing"}
      # The chain lives on the frontend; the backend section stays plain (dynamic on 3.4).
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^backend default_jwt-ingress_svc_echo_80 from haptic-be-\w+$\n[ \t]+guid [^\n]+\n(?:[ \t]+#[^\n]*\n)*[ \t]+server '}

  test-haptic-jwt-underscore-claims:
    description: An underscore issuer or audience remains a required claim value.
    fixtures:
      secrets: [*jwt-public-key]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-underscore
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-issuer: "_"
              haproxy-haptic.org/jwt-audience: "_"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt-underscore.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:haptic-jwt-routes.map
        pattern: '(?m)^default/jwt-underscore RS256 haptic-jwt-default_jwt-keys\.pem ok _ _ _ _ true true$'
      - type: contains
        target: haproxy.cfg
        pattern: 'deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.jwt_cfg\),field\(8,'' ''\) -m str true \} !\{ http_auth_bearer,jwt_payload_query\(''\$\.iss''\),strcmp\(txn\.jwt_iss\) -m int 0 \}'
      - type: contains
        target: haproxy.cfg
        pattern: 'deny deny_status 401 if \{ var\(txn\.jwt_state\) -m str ok \} \{ var\(txn\.jwt_cfg\),field\(9,'' ''\) -m str true \} !\{ http_auth_bearer,jwt_payload_query\(''\$\.aud''\),strcmp\(txn\.jwt_aud\) -m int 0 \}'

  test-haptic-jwt-annotations-without-secret-fail-closed:
    description: >-
      jwt-issuer and friends are inert without jwt-secret, so a route configured
      with them but no key was served with no token verification at all while the
      annotations read as if JWT auth were on.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nokey
            annotations:
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
              haproxy-haptic.org/jwt-required-claims: "sub"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt-nokey.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-jwt-routes.map", pattern: '(?m)^default/jwt-nokey _ _ nosecret _ _ _ _ false false$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(jwt_unavailable\) if \{ var\(txn\.jwt_state\) -m str nosecret \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.jwt_state\) -m str missing nosecret \}'}
      # The block is emitted for an intent-only route too; that is what fails it closed.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^ *# haptic/jwt$'}
      - {type: contains, target: events, pattern: "JWTSecretMissing"}

  test-haptic-jwt-annotations-without-secret-rejected-at-admission:
    description: >-
      Writing an Ingress with jwt-* annotations but no jwt-secret is refused when
      the resource is written.
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: jwt-nokey
            annotations:
              haproxy-haptic.org/jwt-issuer: "https://issuer.example.com"
          spec:
            ingressClassName: haptic
            rules:
              - host: jwt-nokey.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - {type: contains, target: rendering_error, pattern: "Tokens cannot be verified without the key"}

  test-haptic-jwt-block-absent-without-routes:
    description: >-
      No route carries a jwt-* annotation, so the JWT block is not emitted on the frontends.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: plain-jwt
          spec:
            ingressClassName: haptic
            rules:
              - host: plain-jwt.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# haptic/jwt$'}

  test-haptic-jwt-resource-metadata:
    fixtures: &jwt-metadata-fixtures
      secrets: [*jwt-public-key]
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource":"https://mcp.example.com/mcp","authorization_servers":["https://login.example.com/realms/staff"],"bearer_methods_supported":["header"],"scopes_supported":["openid"]}'
      ingresses:
        - &jwt-metadata-ingress
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mcp
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-resource-metadata-configmap: oauth-metadata
          spec:
            ingressClassName: haptic
            rules:
              - host: mcp.example.com
                http:
                  paths:
                    - {path: /mcp, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: map:jwt-resource-metadata-body.map, pattern: '(?m)^mcp\.example\.com\|mcp\.example\.com\|/\.well-known/oauth-protected-resource/mcp '}
      - {type: contains, target: map:jwt-resource-metadata-body.map, pattern: 'authorization_servers%22%3a%5b%22https%3a%2f%2flogin\.example\.com'}
      - {type: contains, target: map:jwt-resource-metadata-challenge.map, pattern: '(?m)^default/mcp\|mcp\.example\.com Bearer%20resource_metadata%3d%22https%3a%2f%2fmcp\.example\.com%2f\.well-known%2foauth-protected-resource%2fmcp%22$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header WWW-Authenticate .*status 401.*jwt_'}
      - type: match_order
        target: haproxy.cfg
        patterns:
          - 'http-request set-var\(txn\.jwt_metadata_body\)'
          - 'http-request return status 200 content-type application/json .*txn\.jwt_metadata_body'
          - 'http-request deny deny_status 401 .*jwt_verify'

  test-haptic-jwt-resource-metadata-root:
    fixtures:
      <<: *jwt-metadata-fixtures
      ingresses:
        - <<: *jwt-metadata-ingress
          metadata:
            namespace: default
            name: mcp
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-resource-metadata-configmap: oauth-metadata
              haproxy-haptic.org/jwt-resource-metadata-path: /.well-known/oauth-protected-resource
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: map:jwt-resource-metadata-body.map, pattern: '(?m)^mcp\.example\.com\|mcp\.example\.com\|/\.well-known/oauth-protected-resource '}
      - {type: contains, target: map:jwt-resource-metadata-challenge.map, pattern: '(?m)%2foauth-protected-resource%22$'}

  test-haptic-jwt-resource-metadata-without-jwt:
    fixtures:
      <<: *jwt-metadata-fixtures
      ingresses:
        - <<: *jwt-metadata-ingress
          metadata:
            namespace: default
            name: mcp
            annotations:
              haproxy-haptic.org/jwt-resource-metadata-configmap: oauth-metadata
    assertions:
      - {type: contains, target: rendering_error, pattern: 'enables JWT metadata without JWT verification'}

  test-haptic-jwt-resource-metadata-non-object:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '[]'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'not a JSON object'}

  test-haptic-jwt-resource-metadata-null:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: 'null'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'not a JSON object'}

  test-haptic-jwt-resource-metadata-malformed:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'not a JSON object'}

  test-haptic-jwt-resource-metadata-http:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "http://mcp.example.com/mcp"}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'invalid resource URL'}

  test-haptic-jwt-resource-metadata-query:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://mcp.example.com/mcp?"}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'invalid resource URL'}

  test-haptic-jwt-resource-metadata-fragment:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://mcp.example.com/mcp#"}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'invalid resource URL'}

  test-haptic-jwt-resource-metadata-credentials:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://user@mcp.example.com/mcp"}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'invalid resource URL'}

  test-haptic-jwt-resource-metadata-wrong-host:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://other.example.com/mcp"}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'does not serve the metadata resource host'}

  test-haptic-jwt-resource-metadata-issuer:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://mcp.example.com/mcp", "authorization_servers": ["http://issuer.example.com"]}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'invalid authorization server'}

  test-haptic-jwt-resource-metadata-bearer-method:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://mcp.example.com/mcp", "bearer_methods_supported": ["query"]}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'Authorization header'}

  test-haptic-jwt-resource-metadata-scope-type:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: oauth-metadata}
          data:
            metadata.json: '{"resource": "https://mcp.example.com/mcp", "scopes_supported": [1]}'
    assertions:
      - {type: contains, target: rendering_error, pattern: 'non-empty strings'}

  test-haptic-jwt-resource-metadata-conflict:
    fixtures:
      <<: *jwt-metadata-fixtures
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: first-metadata}
          data:
            metadata.json: '{"resource":"https://mcp.example.com/first"}'
        - apiVersion: v1
          kind: ConfigMap
          metadata: {namespace: default, name: second-metadata}
          data:
            metadata.json: '{"resource":"https://mcp.example.com/second"}'
      ingresses:
        - <<: *jwt-metadata-ingress
          metadata:
            namespace: default
            name: first
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-resource-metadata-configmap: first-metadata
              haproxy-haptic.org/jwt-resource-metadata-path: /.well-known/oauth-protected-resource
        - <<: *jwt-metadata-ingress
          metadata:
            namespace: default
            name: second
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-resource-metadata-configmap: second-metadata
              haproxy-haptic.org/jwt-resource-metadata-path: /.well-known/oauth-protected-resource
    assertions:
      - {type: contains, target: rendering_error, pattern: 'metadata documents conflict'}

  test-haptic-jwt-resource-metadata-invalid-path:
    fixtures:
      <<: *jwt-metadata-fixtures
      ingresses:
        - <<: *jwt-metadata-ingress
          metadata:
            namespace: default
            name: invalid-path
            annotations:
              haproxy-haptic.org/jwt-secret: jwt-keys
              haproxy-haptic.org/jwt-resource-metadata-configmap: oauth-metadata
              haproxy-haptic.org/jwt-resource-metadata-path: /mcp
    assertions:
      - {type: contains, target: rendering_error, pattern: 'metadata path is invalid'}
