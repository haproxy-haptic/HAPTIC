  test-haptic-waf-selfservice-trusted-collision-never-silent:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      A self-service policy whose name collides with a trusted-catalog policy
      is never resolved silently in either direction: the colliding namespace's
      selector fails closed with an event, while another namespace selecting
      the same name still gets the trusted policy.
    extraContext:
      renderMode: reconcile
      waf:
        policies:
          defaultPolicy: ""
          configMapRefs: { __replace__: true }
          inline: {shared-name: {requestBody: {mode: none}}}
          selfService: {enabled: true}
    fixtures:
      waf_selfservice_catalogs:
        - apiVersion: v1
          kind: ConfigMap
          metadata: { namespace: team-a, name: waf-policies }
          data:
            policies.yaml: |
              shared-name:
                enforcement: detect
                requestBody:
                  mode: none
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: team-a, name: app, annotations: { haproxy-haptic.org/waf-policy: shared-name } }
          spec: *specRulesHost
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: other, annotations: { haproxy-haptic.org/waf-policy: shared-name } }
          spec:
            ingressClassName: haptic
            rules:
              - host: other.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: events, pattern: "Warning WafPolicyInvalid v1 ConfigMap team-a/waf-policies:.*collides with the trusted-catalog policy" }
      - { type: contains, target: haproxy.cfg, pattern: "http-request deny deny_status 503 if \\{ var\\(txn.resource_key\\) -m str team-a/app \\}" }
      - { type: contains, target: "map:coraza-app.map", pattern: "default/other policy:shared-name" }
      - { type: not_contains, target: "map:coraza-app.map", pattern: "team-a/app" }

