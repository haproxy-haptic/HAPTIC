  test-haptic-waf-policy-rule-exclusions-lower-correctly:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      ruleExclusions lower to the right CRS directives at the right position:
      path-scoped disable -> a chart-owned SecRule + ctl:ruleRemoveById BEFORE
      the CRS include; path-scoped target exclude -> ctl:ruleRemoveTargetById;
      global (no-path) disable/target -> SecRuleRemoveById / SecRuleUpdateTargetById
      AFTER the CRS include. The tenant never writes a SecRule or a regex.
    extraContext:
      spoaHub: *spoahubCoraza
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline:
            tuned:
              enforcement: deny
              ruleExclusions:
                - rules: [930130]
                  onPathContains: ".git/"
                - rules: [941320]
                  excludeTarget: "ARGS:wp_post"
                  onPathPrefix: "/wp-admin/"
                - rules: [913100]
                - rules: [942150]
                  excludeTarget: "ARGS:query"
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: app, annotations: { haproxy-haptic.org/waf-policy: tuned } }
          spec:
            ingressClassName: haptic
            rules:
              - host: app.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # Path-scoped disable: a chart-generated SecRule with a literal @contains and a ctl, before the CRS include.
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)SecRule REQUEST_URI "@contains \.git/".*ctl:ruleRemoveById=930130.*Include @owasp_crs'
      # Path-scoped target exclusion via ctl:ruleRemoveTargetById.
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)SecRule REQUEST_URI "@beginsWith /wp-admin/".*ctl:ruleRemoveTargetById=941320;ARGS:wp_post.*Include @owasp_crs'
      # Global (no-path) forms land AFTER the CRS include.
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)Include @owasp_crs.*SecRuleRemoveById 913100'
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)Include @owasp_crs.*SecRuleUpdateTargetById 942150 "!ARGS:query"'

