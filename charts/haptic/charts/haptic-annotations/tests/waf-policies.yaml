# HAPTIC-native reusable Coraza WAF policy tests.
#
# Every test pins the extraContext.waf values its fixtures and assertions depend
# on. The only `_helm_skip_test` gates are chart-render-time infrastructure
# requirements that no per-test extraContext can satisfy:
#   - the SPOA hub + coraza plugin must be in the bundle (the coraza maps and
#     spoa-hub-config.toml only exist when the spoa-hub library is merged), and
#   - the nginx-ingress / haproxy-ingress vendor library must be loaded when a
#     fixture's vendor annotation is scanned by that library's snippets.
_fx:
  spoahubCoraza: &spoahubCoraza
    enabled: true
    plugins:
      - name: coraza
        library: libcoraza_plugin.so
        messages: [check-request]
        timeoutMs: 15
        params: ""
        dependsOn: []
        directives: |
          Include @coraza.conf-recommended
          Include @crs-setup.conf.example
          Include @owasp_crs/*.conf
          SecRuleEngine On
  wafIngresspermissions: &wafIngresspermissions
    ingressPermissions: {allowPolicySelection: true}
    policies:
      inline: {body-inspection: {requestBody: {mode: any}}, headers-only: {requestBody: {mode: none}}}
      configMapRefs: { __replace__: true }
  wafSelfserviceCatalogs: &wafSelfserviceCatalogs
    - apiVersion: v1
      kind: ConfigMap
      metadata: { namespace: team-a, name: waf-policies }
      data:
        policies.yaml: |
          app-baseline:
            requestBody:
              mode: none
  specRulesHost: &specRulesHost
    ingressClassName: haptic
    rules:
      - host: app.team-a.example.com
        http:
          paths:
            - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
  wafPoliciesRoot: &wafPoliciesRoot
    policies: {defaultPolicy: "", configMapRefs: { __replace__: true }, selfService: {enabled: true}}
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: echo, port: { number: 80 } } }
  policiesRootInline: &policiesRootInline
    defaultPolicy: ""
    inline: {baseline: {}}
    configMapRefs: { __replace__: true }

validationTests:
  test-haptic-waf-policy-cross-namespace-shared:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: exact cross-namespace catalog source is trusted; one policy compiles once and is shared by multiple Ingresses
    extraContext:
      waf:
        ingressPermissions: {allowPolicySelection: true, allowEnforcementOverride: true}
        policies:
          defaultPolicy: ""
          requestBody: {defaultMaxBytes: 4096}
          # Replace (not merge) the deployment's inline catalog: dev-values
          # defines an inline 'streaming-search' that would otherwise
          # collide with this test's trusted-ConfigMap policy of the same
          # name (duplicate-name hard fail at the load gate).
          inline: {__replace__: true}
          configMapRefs:
            __replace__: true
            security: {namespace: security, name: haptic-waf-policies, key: policies.yaml}
    fixtures:
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: { namespace: security, name: haptic-waf-policies }
          data:
            policies.yaml: |
              streaming-search:
                description: Metadata inspection with narrow search exclusions and no body buffering
                requestBody:
                  mode: none
                enforcement: deny
                ruleExclusions:
                  - tags: [attack-sqli, attack-xss]
                    excludeTarget: "ARGS:q"
        # An Ingress author may create a same-named ConfigMap in their own
        # namespace, but it is not a configured source and must be ignored.
        - apiVersion: v1
          kind: ConfigMap
          metadata: { namespace: default, name: haptic-waf-policies }
          data:
            policies.yaml: |
              streaming-search:
                requestBody:
                  mode: json
                secLang: |
                  SecRuleEngine Off
                  # UNTRUSTED_INGRESS_NAMESPACE_POLICY
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: streaming-one
            annotations:
              haproxy-haptic.org/waf-policy: streaming-search
          spec:
            ingressClassName: haptic
            rules:
              - host: streaming-one.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: app, port: { number: 3000 } }}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: streaming-two
            annotations:
              haproxy-haptic.org/waf-policy: streaming-search
              haproxy-haptic.org/waf-mode: detect
          spec:
            ingressClassName: haptic
            rules:
              - host: streaming-two.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: { name: app, port: { number: 3000 } }}
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:coraza-app.map", pattern: "default/streaming-one policy:streaming-search" }
      - { type: contains, target: "map:coraza-app.map", pattern: "default/streaming-two policy:streaming-search" }
      - { type: contains, target: "map:coraza-body.map", pattern: "default/streaming-one none any 4096" }
      - { type: contains, target: "map:haproxy-ingress-waf.map", pattern: "default/streaming-two detect" }
      - { type: match_count, target: "file:spoa-hub-config.toml", pattern: '\[plugins\.params\.applications\."policy:streaming-search"\]', expected: "1" }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: 'SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:q"' }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: 'SecRuleUpdateTargetByTag "attack-xss" "!ARGS:q"' }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: "SecRequestBodyAccess Off" }
      - { type: not_contains, target: "file:spoa-hub-config.toml", pattern: "UNTRUSTED_INGRESS_NAMESPACE_POLICY" }

  test-haptic-waf-policy-buffered-contracts:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: policy authors opt into bounded complete body inspection and optional JSON media-type enforcement
    extraContext:
      requestBodyInspection: {haproxyBuffer: {sizeBytes: 65536}}
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          requestBody: {waitTimeout: "100ms", defaultMaxBytes: 4096}
          inline:
            form-body-inspection: {requestBody: {mode: any}}
            json-api-inspection: {requestBody: {mode: json, maxBytes: 2048}}
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: web
            annotations: { haproxy-haptic.org/waf-policy: form-body-inspection }
          spec:
            ingressClassName: haptic
            rules:
              - host: web.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: web, port: { number: 80 } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: api
            annotations: { haproxy-haptic.org/waf-policy: json-api-inspection }
          spec:
            ingressClassName: haptic
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: api, port: { number: 80 } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:coraza-body.map", pattern: "default/web buffered any 4096" }
      - { type: contains, target: "map:coraza-body.map", pattern: "default/api buffered json 2048" }
      # A size only body inspection asks for, so the assertion still binds if the
      # buffer stops being sized for it.
      - { type: contains, target: haproxy.cfg, pattern: "(?m)^  tune\\.bufsize 65536$" }
      - { type: match_count, target: haproxy.cfg, pattern: "(?m)^  tune\\.bufsize ", expected: "1" }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: '(?s)\[plugins\.params\.applications\."policy:form-body-inspection"\].*request_body_limit = 4096.*request_body_in_memory_limit = 4096' }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: '(?s)\[plugins\.params\.applications\."policy:json-api-inspection"\].*request_body_limit = 2048.*request_body_in_memory_limit = 2048' }
      # Body-contract rejections skip detect (shadow) mode and never fire on a
      # bodyless request; the 411 rejects only a chunked body with no length.
      - { type: contains, target: haproxy.cfg, pattern: "return status 415 if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} !\\{ var\\(txn.coraza_detect_only\\) -m bool \\} \\{ var\\(txn.coraza_content_policy\\) -m str json \\} \\{ req.hdr\\(Content-Length\\) -m found \\}" }
      - { type: contains, target: haproxy.cfg, pattern: "return status 411 if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} !\\{ var\\(txn.coraza_detect_only\\) -m bool \\} \\{ req.hdr\\(Transfer-Encoding\\) -m found \\} !\\{ req.hdr\\(Content-Length\\) -m found \\}" }
      # The wait is split by enforcement mode: detect (shadow) must never block
      # live traffic, so it waits only for a DECLARED body — an HTTP/2 streaming
      # request (gRPC bidi: no Content-Length, body open until the peer is done)
      # would otherwise run the wait to its timeout and get a 408 the backend
      # never saw. Enforce still waits unconditionally: a body it cannot bound
      # must not reach the backend uninspected.
      - { type: contains, target: haproxy.cfg, pattern: "wait-for-body time 100ms if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} \\{ var\\(txn.coraza_detect_only\\) -m bool \\} \\{ req.hdr\\(Content-Length\\) -m found \\}" }
      - { type: contains, target: haproxy.cfg, pattern: "wait-for-body time 100ms if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} !\\{ var\\(txn.coraza_detect_only\\) -m bool \\}" }
      # A detect-mode wait that is not gated on Content-Length is the bug: it
      # blocks streaming traffic that shadow mode promises never to block.
      - { type: not_contains, target: haproxy.cfg, pattern: "wait-for-body time 100ms if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\}\n" }
      # body-complete mirrors the wait split: the SPOE contract only allows it
      # to be asserted where a wait actually ran, so detect mode may not claim a
      # complete body for a request whose length was never declared.
      - { type: contains, target: haproxy.cfg, pattern: "set-var\\(txn.coraza_body_complete\\) bool\\(true\\) if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} \\{ var\\(txn.coraza_detect_only\\) -m bool \\} \\{ req.hdr\\(Content-Length\\) -m found \\}" }
      - { type: contains, target: haproxy.cfg, pattern: "set-var\\(txn.coraza_body_complete\\) bool\\(true\\) if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\} !\\{ var\\(txn.coraza_detect_only\\) -m bool \\}" }
      - { type: not_contains, target: haproxy.cfg, pattern: "set-var\\(txn.coraza_body_complete\\) bool\\(true\\) if \\{ var\\(txn.coraza_body_mode\\) -m str buffered \\}\n" }
      - { type: contains, target: "file:spoe.conf", pattern: "body-mode=var\\(txn.coraza_body_mode\\) body-complete=var\\(txn.coraza_body_complete\\) detect-only=var\\(txn.coraza_detect_only\\)" }

  test-haptic-waf-body-policy-on-grpc-backend-rejected:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      A body-inspecting WAF policy on an Ingress that declares a gRPC backend is
      rejected at admission. Coraza cannot inspect a gRPC stream — the buffered
      wait times out with 408 while unary calls keep working, so the breakage is
      invisible until someone opens a stream.
    extraContext:
      renderMode: admission
      admissionSubject: { stores: { ingresses: true }, namespace: default, name: grpc-api }
      waf: *wafIngresspermissions
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-api
            annotations: { haproxy-haptic.org/waf-policy: body-inspection, haproxy-haptic.org/backend-protocol: grpc }
          spec:
            ingressClassName: haptic
            rules:
              - host: grpc-api.example.com
                http: *httpRoot
    assertions:
      - type: contains
        target: rendering_error
        pattern: "has a gRPC backend and WAF policy 'body-inspection'"

  test-haptic-waf-body-policy-on-nginx-grpc-backend-rejected:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: the same guard sees the nginx-compat spelling of a gRPC backend
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: grpc-api-nginx }
      waf: *wafIngresspermissions
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-api-nginx
            annotations: { haproxy-haptic.org/waf-policy: body-inspection, nginx.ingress.kubernetes.io/backend-protocol: GRPCS }
          spec:
            ingressClassName: haptic
            rules:
              - host: grpc-api-nginx.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "has a gRPC backend and WAF policy"}

  test-haptic-waf-headers-only-policy-on-grpc-backend-allowed:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      requestBody.mode none is the supported combination for gRPC, so it must
      render cleanly — the guard must not fire on the configuration it tells
      operators to adopt. Plain h2 is likewise untouched: HTTP/2 to the backend
      is equally a REST backend whose bodies ARE bounded.
    extraContext:
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: grpc-ok }
      waf: *wafIngresspermissions
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-ok
            annotations: { haproxy-haptic.org/waf-policy: headers-only, haproxy-haptic.org/backend-protocol: grpc }
          spec:
            ingressClassName: haptic
            rules:
              - host: grpc-ok.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: h2-rest
            annotations: { haproxy-haptic.org/waf-policy: body-inspection, haproxy-haptic.org/backend-protocol: h2 }
          spec:
            ingressClassName: haptic
            rules:
              - host: h2-rest.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:coraza-body.map", pattern: "default/grpc-ok none"}
      - {type: contains, target: "map:coraza-body.map", pattern: "default/h2-rest buffered"}

  test-haptic-waf-body-policy-on-grpc-backend-warns-on-reconcile:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      On a live reconcile the same combination must NOT abort the render. A
      pre-existing gRPC Ingress with a body-inspecting policy records a Warning
      Event and keeps serving: unary calls are inspected correctly and the
      streaming ones already fail closed with 408, so there is no fail-open to
      close and no reason to take the fleet down. This is the regression pin
      for the admission-wedge class — a chart upgrade that starts rejecting a
      pre-existing annotation must never break every render.
    extraContext:
      renderMode: reconcile
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          inline: {body-inspection: {requestBody: {mode: any}}}
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-legacy
            annotations: { haproxy-haptic.org/waf-policy: body-inspection, haproxy-haptic.org/backend-protocol: grpc }
          spec:
            ingressClassName: haptic
            rules:
              - host: grpc-legacy.example.com
                http: *httpRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: unaffected}
          spec:
            ingressClassName: haptic
            rules:
              - host: unaffected.example.com
                http: *httpRoot
    assertions:
      # The render completes at all — that is the property under test.
      - type: haproxy_valid
      # The offending route keeps its policy rather than being 503'd: the
      # runtime already refuses exactly the calls that cannot be inspected.
      - {type: contains, target: "map:coraza-body.map", pattern: "default/grpc-legacy buffered"}
      # And an unrelated Ingress still renders, which is what the wedge class
      # destroyed.
      - {type: contains, target: "map:host.map", pattern: "unaffected\\.example\\.com"}

  test-haptic-waf-policy-seclang-shared:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: policy-authored SecLang compiles once and remains reusable across Ingresses
    extraContext:
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline:
            internal-app:
              requestBody: {mode: json, maxBytes: 2048}
              secLang: |
                SecRuleRemoveById 999999
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: custom-one, annotations: { haproxy-haptic.org/waf-policy: internal-app } }
          spec:
            ingressClassName: haptic
            rules:
              - host: custom-one.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: custom-two, annotations: { haproxy-haptic.org/waf-policy: internal-app } }
          spec:
            ingressClassName: haptic
            rules:
              - host: custom-two.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - { type: contains, target: "map:coraza-body.map", pattern: "default/custom-one buffered json 2048" }
      - { type: contains, target: "map:coraza-app.map", pattern: "default/custom-two policy:internal-app" }
      - { type: match_count, target: "file:spoa-hub-config.toml", pattern: '\[plugins\.params\.applications\."policy:internal-app"\]', expected: "1" }
      - { type: contains, target: "file:spoa-hub-config.toml", pattern: "SecRuleRemoveById 999999" }

  test-haptic-waf-policy-invalid-rejected:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: under the admission webhook, an unknown exact policy name is rejected with the approved names
    extraContext:
      admissionSubject: { store: ingresses, namespace: default, name: invalid-policy }
      renderMode: admission
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline:
            # __replace__ makes this map REPLACE the deployment's inline
            # catalog instead of deep-merging into it (the sentinel is
            # stripped by the test runner), so the available-policies list
            # below is exact under any Helm values.
            __replace__: true
            approved-policy: {}
          configMapRefs: { __replace__: true }
          selfService: {enabled: false}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: invalid-policy, annotations: { haproxy-haptic.org/waf-policy: typo-policy } }
          spec:
            ingressClassName: haptic
            rules:
              - host: invalid.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: 'Unknown WAF policy ''typo-policy''.*available policies: (.*, )?approved-policy(, |\. ).*exact and case-sensitive' }

  test-haptic-waf-policy-invalid-reconcile-fails-closed:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      On a live reconcile, an unknown policy (e.g. deleted out from under an
      existing Ingress) no longer aborts the whole render: the route fails
      closed with 503, a Warning Event lands on the Ingress, and every other
      route keeps rendering.
    extraContext:
      renderMode: reconcile
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies: {defaultPolicy: "", inline: {approved-policy: {}}, configMapRefs: { __replace__: true }}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: invalid-policy, annotations: { haproxy-haptic.org/waf-policy: typo-policy } }
          spec:
            ingressClassName: haptic
            rules:
              - host: invalid.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn.resource_key\\) -m str default/invalid-policy \\}"
      - type: contains
        target: events
        pattern: "Warning WafPolicyUnavailable networking.k8s.io/v1 Ingress default/invalid-policy:.*Unknown WAF policy 'typo-policy'"
      # The broken route must not be dispatched to Coraza with a half-applied policy.
      - {type: not_contains, target: "map:coraza-app.map", pattern: "default/invalid-policy"}

  test-haptic-waf-governance-violation-reconcile-fails-closed:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      On a live reconcile, a governance-gate violation on an existing
      Ingress (waf-mode without allowEnforcementOverride) no longer aborts
      the whole render: the violating route fails closed with 503 and a
      Warning Event, and the rest of the cluster keeps rendering. This is
      the regression pin for the admission-wedge class where a chart
      upgrade that tightens governance against pre-existing annotations
      broke every render and, with it, every config and Ingress update.
    extraContext:
      renderMode: reconcile
      waf:
        ingressPermissions: {allowEnforcementOverride: false, allowPolicySelection: true}
        policies: *policiesRootInline
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: legacy-mode
            annotations:
              haproxy-haptic.org/waf-policy: baseline
              haproxy-haptic.org/waf-mode: detect
          spec:
            ingressClassName: haptic
            rules:
              - host: legacy-mode.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: healthy
            annotations:
              haproxy-haptic.org/waf-policy: baseline
          spec:
            ingressClassName: haptic
            rules:
              - host: healthy.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request deny deny_status 503 if \\{ var\\(txn.resource_key\\) -m str default/legacy-mode \\}"
      - type: contains
        target: events
        pattern: "Warning WafPermissionDenied networking.k8s.io/v1 Ingress default/legacy-mode:.*allowEnforcementOverride=false"
      # Broken routes must not register Coraza applications or dispatch rows.
      - { type: not_contains, target: "map:coraza-app.map", pattern: "default/legacy-mode" }
      # The untouched route keeps its policy dispatch.
      - { type: contains, target: "map:coraza-app.map", pattern: "default/healthy policy:baseline" }

  test-haptic-waf-governance-violation-unrelated-admission-unblocked:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      Under the admission webhook, a governance violation on an already
      present Ingress must not deny an UNRELATED resource's admission (or a
      HAProxyTemplateConfig update, which renders with no admission
      subject): the violating route fails closed per-route and the render
      succeeds. Only the violating resource's own admission hard-fails
