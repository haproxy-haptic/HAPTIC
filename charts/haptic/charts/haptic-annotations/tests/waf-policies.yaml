  test-haptic-waf-policy-structured-crs-tuning:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      Structured CRS tuning fields (allowedMethods, paranoiaLevel,
      anomalyThreshold) lower to SETUP-position SecActions spliced BEFORE
      the CRS rules include in the app directives — the position raw policy
      secLang structurally cannot reach (it lands after the include, where
      CRS has already read the tx variables).
    extraContext:
      # Pin the coraza plugin (list leaf → replaces the deployment's plugin
      # set wholesale) so the splice-anchor and base directives are exactly
      # known — a deployment may run a CRS-less custom ruleset (the e2e
      # profile does), which would otherwise hard-fail these policies at
      # the load gate.
      spoaHub: *spoahubCoraza
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline:
            tuned-api:
              enforcement: deny
              allowedMethods: [GET, HEAD, POST, OPTIONS, PUT, PATCH, DELETE]
              paranoiaLevel: 2
              anomalyThreshold: {inbound: 10}
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: api, annotations: { haproxy-haptic.org/waf-policy: tuned-api } }
          spec:
            ingressClassName: haptic
            rules:
              - host: api.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)applications\."policy:tuned-api"\].*?tx\.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE.*?Include @owasp_crs'
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)applications\."policy:tuned-api"\].*?tx\.blocking_paranoia_level=2.*?Include @owasp_crs'
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)applications\."policy:tuned-api"\].*?tx\.inbound_anomaly_score_threshold=10.*?Include @owasp_crs'

  test-haptic-waf-policy-crs-settings-tuning:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: >-
      crsSettings fine-tunes a rule's INPUTS instead of disabling it: the git
      content-type case allowlists application/x-git-upload-pack-request (rather
      than excluding CRS 920420). mergeList emits the chart-owned CRS default
      list PLUS the additions as a full REPLACE (each type |type|-wrapped, the
      way 920420 matches — a runtime %{tx.<var>} append was the earlier bug,
      because the crs-setup default is commented out and unset). boundedInt
      entries replace a scalar. All lower to one setup-position SecAction
      spliced BEFORE the CRS include.
    extraContext:
      spoaHub: *spoahubCoraza
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline:
            git-host:
              enforcement: deny
              requestBody: { mode: none }
              crsSettings:
                allowedRequestContentTypes: [application/x-git-upload-pack-request, application/x-git-receive-pack-request]
                maxFileSize: 1048576
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: git, annotations: { haproxy-haptic.org/waf-policy: git-host } }
          spec:
            ingressClassName: haptic
            rules:
              - host: git.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: git, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # mergeList REPLACES the variable with the chart-owned CRS default list PLUS
      # the git types, each |type|-wrapped (how 920420 matches |content-type|
      # @within), spliced before the CRS include. The default types are present,
      # then both git types wrapped.
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)applications\."policy:git-host"\].*?tx\.allowed_request_content_type=\|application/x-www-form-urlencoded\|.*?\|application/json\| \|application/x-git-upload-pack-request\| \|application/x-git-receive-pack-request\|.*?Include @owasp_crs'
      # Regression guard: it must NOT be a runtime %{tx...} append (the bug that
      # 403'd git clones because the crs-setup default is unset).
      - type: not_contains
        target: "file:spoa-hub-config.toml"
        pattern: 'allowed_request_content_type=%\{tx'
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '(?s)applications\."policy:git-host"\].*?tx\.max_file_size=1048576.*?Include @owasp_crs'

