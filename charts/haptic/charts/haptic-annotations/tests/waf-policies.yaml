              crsSettings:
                allowedRequestContentTypes: [application/json, application/x-git-upload-pack-request, application/x-git-upload-pack-request]
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: dup, annotations: { haproxy-haptic.org/waf-policy: dup } }
          spec:
            ingressClassName: haptic
            rules:
              - host: dup.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: dup, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      # the git type (not in the CRS default) is added once...
      - type: contains
        target: "file:spoa-hub-config.toml"
        pattern: '\|application/x-git-upload-pack-request\|'
      # ...not doubled, even though it was listed twice (dedup among additions)...
      - type: not_contains
