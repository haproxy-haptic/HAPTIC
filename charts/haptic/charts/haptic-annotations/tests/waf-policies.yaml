      load-gate crash where a deployment-wide allowedMethods policy merged
      into baked tests whose coraza directives lack the CRS include.
    extraContext:
      spoaHub:
        enabled: true
        plugins:
          - name: coraza
            library: libcoraza_plugin.so
            messages: [check-request]
            timeoutMs: 15
            params: ""
            dependsOn: []
            directives: |
              SecRuleEngine On
      waf:
        policies:
          defaultPolicy: ""
          inline:
            tuned:
              allowedMethods: [GET, POST]
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { namespace: default, name: plain, annotations: {} }
          spec:
            ingressClassName: haptic
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid

  test-haptic-waf-policy-body-limit-without-inspection-rejected:
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: a body cap cannot silently do nothing under requestBody mode none
    extraContext:
      waf:
        ingressPermissions: {allowPolicySelection: true}
        policies:
          defaultPolicy: ""
          inline: {misleading-body-policy: {requestBody: {mode: none, maxBytes: 1024}}}
          configMapRefs: { __replace__: true }
    fixtures:
      ingresses: []
    assertions:
      - { type: contains, target: rendering_error, pattern: "sets requestBody.maxBytes while requestBody.mode is none.*mode to any or json" }

  test-haptic-waf-policy-vendor-mixing-rejected:
    # Mixing a native HAPTIC WAF annotation with a vendor (nginx) WAF annotation
    # on one Ingress is rejected by the cross-family feature-collision guard in
    # the ingress-annotations-compat library (features-950), which renders
    # before the coraza map files. allowCustomRules is pinned true so a loaded
    # nginx-ingress library accepts the snippet and the ONLY failure is the
    # cross-family rejection.
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) }}true{{ end }}'
    description: under the admission webhook, a vendor WAF annotation cannot be mixed with a HAPTIC WAF policy on one Ingress
    extraContext:
      # renderMode admission = the webhook dry-run, where a cross-family conflict
      # fail()s so the API server denies the Ingress. (During a live reconcile it
      # would warn via a Kubernetes Event instead — see the reconcile-mode tests
      # in ingress-annotations-compat.yaml.)
      renderMode: admission
      admissionSubject: { store: ingresses, namespace: default, name: mixed-waf }
      # Pin nginx as an enabled family so the cross-family guard evaluates the
      # nginx annotation regardless of the deployment's library set (the e2e
      # profile, for instance, leaves nginx-ingress off).
      annotationLibraries: {haptic: true, nginx: true, haproxyIngress: false, haproxytech: false}
      waf:
        ingressPermissions: {allowPolicySelection: true, allowCustomRules: true}
        policies: {defaultPolicy: "", inline: {approved-policy: {}}, configMapRefs: { __replace__: true }}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mixed-waf
            annotations:
              haproxy-haptic.org/waf-policy: approved-policy
              nginx.ingress.kubernetes.io/modsecurity-snippet: 'SecRuleEngine Off'
          spec:
            ingressClassName: haptic
            rules:
              - host: mixed.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }
    assertions:
      - { type: contains, target: rendering_error, pattern: "configures the WAF feature through annotations from multiple families" }
      - { type: contains, target: rendering_error, pattern: "haproxy-haptic.org/waf-policy" }
      - { type: contains, target: rendering_error, pattern: "nginx.ingress.kubernetes.io/modsecurity-snippet" }

  test-haptic-waf-vendor-rule-size-limit:
    # The byte-bound rejection is raised by nginx-ingress's
    # util-nginx-ingress-coraza-scan, so that library must be loaded. No policy
    # catalog is configured: the custom-rule bounds apply independently of
    # policy governance.
    _helm_skip_test: '{{ if or (include "haptic.spoaHub.disabled" .) (not (include "haptic.spoaHub.pluginEnabled" (dict "plugin" .Values.spoaHub.plugins.coraza "root" . "name" "coraza"))) (include "haptic.nginxIngress.disabled" .) }}true{{ end }}'
