# HAPTIC-native annotation library — backend TLS (haproxy-haptic.org/backend-*)
# validation tests: protocol normalisation, verify + CA + client cert, SNI,
# ciphers/ciphersuites, ssl-protocols span, and fail-closed verify.
validationTests:
  test-haptic-backend-tls-verify-full:
    description: >-
      backend-protocol https + backend-verify on + ca/crt secrets + sni +
      verify-host + ciphers + ciphersuites + ssl-protocols emit one coherent
      verified SSL server flag set.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: btls-service}
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: btls-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: btls-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8443
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: be-ca}
          data:
            ca.crt: 
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: be-crt}
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: btls-ingress
            annotations:
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-verify: "on"
              haproxy-haptic.org/backend-ca-secret: "be-ca"
              haproxy-haptic.org/backend-crt-secret: "be-crt"
              haproxy-haptic.org/backend-sni: "upstream.internal"
              haproxy-haptic.org/backend-verify-host: "upstream.internal"
              haproxy-haptic.org/backend-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
              haproxy-haptic.org/backend-ciphersuites: "TLS_AES_128_GCM_SHA256"
              haproxy-haptic.org/backend-ssl-protocols: "TLSv1.2 TLSv1.3"
          spec:
            ingressClassName: haptic
            rules:
              - host: btls.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: btls-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify required"}
      - {type: contains, target: haproxy.cfg, pattern: "ca-file [^ ]*default-be-ca-backend-tls-ca\\.pem"}
      # `crt` resolves against crt-base (the ssl dir), so the value MUST be the
      # bare filename. A ssl/-prefixed value doubles to ssl/ssl/<name> at
      # runtime and fails `haproxy -c` on a real deploy (regression pinned here:
      # offline validation writes the cert to whatever path the config names, so
      # only this exact-value assertion — not haproxy_valid — catches the double).
      - {type: contains, target: haproxy.cfg, pattern: " crt default-be-crt-backend-tls-client\\.pem"}
      - {type: not_contains, target: haproxy.cfg, pattern: "crt ssl/"}
      - {type: contains, target: haproxy.cfg, pattern: "sni str\\(upstream\\.internal\\)"}
      - {type: contains, target: haproxy.cfg, pattern: "verifyhost upstream\\.internal"}
      - type: contains
        target: haproxy.cfg
        pattern: "ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
      - {type: contains, target: haproxy.cfg, pattern: "ciphersuites TLS_AES_128_GCM_SHA256"}
      - {type: contains, target: haproxy.cfg, pattern: "ssl-min-ver TLSv1\\.2"}
      - {type: contains, target: haproxy.cfg, pattern: "ssl-max-ver TLSv1\\.3"}

  test-haptic-backend-system-ca:
    description: The reserved backend-ca-secret value @system-ca verifies an ExternalName upstream against HAProxy's system CA store.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: s3}
          spec:
            type: ExternalName
            externalName: files.s3.example.net
            ports:
              - {name: https, port: 443}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: assets
            annotations:
              haproxy-haptic.org/backend-protocol: https
              haproxy-haptic.org/backend-sni: files.s3.example.net
              haproxy-haptic.org/backend-verify: "true"
              haproxy-haptic.org/backend-verify-host: files.s3.example.net
              haproxy-haptic.org/backend-ca-secret: "@system-ca"
              haproxy-haptic.org/set-host: files.s3.example.net
          spec:
            ingressClassName: haptic
            rules:
              - host: assets.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: s3, port: {number: 443}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify required ca-file @system-ca"}
      - {type: contains, target: haproxy.cfg, pattern: "sni str\\(files\\.s3\\.example\\.net\\)"}
      - {type: contains, target: haproxy.cfg, pattern: "verifyhost files\\.s3\\.example\\.net"}
      - {type: contains, target: haproxy.cfg, pattern: 'server [^\n]*files\.s3\.example\.net:443[^\n]*resolvers dns init-addr last,libc,none'}
      - {type: contains, target: "map:reqhdr-host.map", pattern: '(?m)^default_assets_svc_s3_https files\.s3\.example\.net$'}
      - {type: not_contains, target: "map:haptic-route-unavailable.map", pattern: 'default/assets'}

  test-haptic-backend-protocol-grpcs:
    description: backend-protocol grpcs enables TLS to the upstream and negotiates h2 (proto h2 + ssl).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: grpcs-service}
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: grpcs-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: grpcs-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
          ports:
            - port: 8443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpcs-ingress
            annotations:
              haproxy-haptic.org/backend-protocol: "grpcs"
          spec:
            ingressClassName: haptic
            rules:
              - host: grpcs.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: grpcs-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "proto h2"}
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify none"}

  test-haptic-backend-protocol-grpc-plaintext:
    description: backend-protocol grpc negotiates cleartext h2 (proto h2) without enabling TLS to the upstream.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-ingress
            annotations:
              haproxy-haptic.org/backend-protocol: "grpc"
          spec:
            ingressClassName: haptic
            rules:
              - host: grpc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "proto h2"}
      - {type: not_contains, target: haproxy.cfg, pattern: "ssl verify"}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# haptic/route-unavailable$'}

  test-haptic-backend-verify-without-ca-rejected:
    description: >-
      backend-verify on with no backend-ca-secret is a static misconfiguration —
      it cannot race the resource store — so admission still rejects it rather
      than silently downgrading to verify none.
    extraContext: {renderMode: admission}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: fc-service}
          spec:
            ports: [{port: 443}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: fc-ingress
            annotations:
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-verify: "True"
          spec:
            ingressClassName: haptic
            rules:
              - host: fc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: fc-service, port: {number: 443}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "sets 'haproxy-haptic.org/backend-verify: on' but no"
      - {type: contains, target: rendering_error, pattern: "the Ingress is rejected"}
      - {type: not_contains, target: rendering_error, pattern: "fails closed with 503"}

  test-haptic-backend-ca-secret-missing-fails-closed:
    description: >-
      Naming a backend-ca-secret is the request to verify the upstream
      certificate. An absent Secret fell through to `ssl verify none` behind a
      render comment, so the connection was unverified while the operator
      believed it was checked.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: btls-noca
            annotations:
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-ca-secret: "does-not-exist"
          spec:
            ingressClassName: haptic
            rules:
              - host: btls-noca.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:haptic-route-unavailable.map", pattern: '(?m)^default/btls-noca backend_tls_unavailable$'}
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request set-var\(txn\.denied_by\) str\(backend_tls_unavailable\) if \{ var\(txn\.resource_key\),map\([^)]*haptic-route-unavailable\.map\) -m str backend_tls_unavailable \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.resource_key\),map\([^)]*haptic-route-unavailable\.map\) -m found \}'}
      - {type: contains, target: events, pattern: "BackendCASecretMissing"}

  test-haptic-backend-ca-secret-present-still-verifies:
    description: >-
      Control for the guard above: a resolvable CA Secret must still render
      `ssl verify required` with its ca-file, not be caught by the new branch.
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: { namespace: default, name: btls-ca }
          type: Opaque
          data:
            ca.crt: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: btls-ca-ok
            annotations:
              haproxy-haptic.org/backend-protocol: "https"
              haproxy-haptic.org/backend-ca-secret: "btls-ca"
          spec:
            ingressClassName: haptic
            rules:
              - host: btls-ca-ok.example.com
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: echo, port: { number: 80 } } } }
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify required ca-file"}
      # The deny block is in place while nothing is blocked, so losing the CA
      # later is a map entry, not a reload.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^ *# haptic/route-unavailable$'}
      - {type: not_contains, target: "map:haptic-route-unavailable.map", pattern: 'btls-ca-ok'}
