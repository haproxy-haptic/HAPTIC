# Migration coverage for the HAPTIC-native annotation library.
#
# haptic-annotations is a best-of-breed SUPERSET of the three vendor
# libraries — one clean haproxy-haptic.org/* annotation per capability,
# adopting whichever vendor's semantics is best. Every key is `supported`
# or `different` (works but diverges, see note), except one `dropped` key
# that is inert and only warns (scale-server-slots, removed by ADR-0011). This
# block is pinned against the annotation keys the fragments actually read
# by scripts/check-migration-coverage.sh, and documented on the library's
# page by scripts/check-annotation-{docs,status}.sh.
_migrationCoverage:
  - source: haptic-annotations
    detect:
      ingressClasses: ["haptic"]
      annotationPrefixes: ["haproxy-haptic.org/"]
    annotations:
      haproxy-haptic.org/affinity:
        status: supported
        note: "value 'cookie' enables the session-affinity cookie directive"
      haproxy-haptic.org/agent-check-addr:
        status: supported
        note: "→ `agent-addr <addr>`; fails if set without agent-check-port; guarded."
      haproxy-haptic.org/agent-check-interval:
        status: supported
        note: "→ `agent-inter <dur>`; fails if set without agent-check-port; guarded."
      haproxy-haptic.org/agent-check-port:
        status: supported
        note: "1-65535, enables the agent check → `agent-check agent-port <n>`; prerequisite for the other agent-check keys."
      haproxy-haptic.org/agent-check-send:
        status: supported
        note: "→ `agent-send <string>`; fails if set without agent-check-port; guarded (control chars rejected)."
      haproxy-haptic.org/allowed-consumer-groups:
        status: supported
        note: "Comma-separated group set the route permits → `http-request deny deny_status 403` unless the request's consumer (from API-key/JWT) maps to one via consumer-groups-secret."
      haproxy-haptic.org/allowed-methods:
        status: supported
        note: "Comma-separated HTTP method allow-list → host-scoped `http-request deny deny_status 405` on any other method; each method validated (uppercase A-Z)."
      haproxy-haptic.org/allowlist-source-range:
        status: supported
        note: "CIDR allow-list ACL + host-scoped deny via shared EmitAnnotationAccessControl (aclPrefix haptic); CIDRs validated"
      haproxy-haptic.org/api-key-consumer-header:
        status: supported
        note: "Forwards the resolved consumer id to the upstream in the named header."
      haproxy-haptic.org/api-key-header:
        status: supported
        note: "Header carrying the API key (default X-API-Key); mutually exclusive with api-key-query."
      haproxy-haptic.org/api-key-query:
        status: supported
        note: "Query parameter carrying the API key; mutually exclusive with api-key-header."
      haproxy-haptic.org/api-key-secret:
        status: supported
        note: "Secret (data key `keys`, newline apikey[:consumer]) → reload-free apikeys map; deny 401 on unknown key; sets the shared txn.haptic_consumer identity; fails closed with 503 while the Secret is absent."
      haproxy-haptic.org/root-redirect:
        status: supported
        note: "Redirects requests for the host root path (`/`) to the given sub-path."
      haproxy-haptic.org/auth-headers-fail:
        status: supported
        note: "Failure-path response headers → http-after-response set-header (survives http-request deny short-circuit)."
      haproxy-haptic.org/auth-headers-request:
        status: supported
        note: "Forwarded request-header allowlist → auth-forward-headers.map + auto-extended SPOE check-auth args (six standard headers pre-seeded to avoid duplicate args)."
      haproxy-haptic.org/auth-headers-succeed:
        status: supported
        note: "Success-path response headers → one http-request set-header per unique header, gated on external_auth.allowed."
      haproxy-haptic.org/auth-method:
        status: supported
        note: "External-auth HTTP method override → auth-method.map; guarded to a single alphabetic token."
      haproxy-haptic.org/auth-realm:
        status: supported
        note: "Basic-auth realm (default \"Restricted\"); guarded against double-quote/newline injection."
      haproxy-haptic.org/auth-secret:
        status: supported
        note: "References the credentials Secret (ns/name or name); an absent Secret skips the userlist+challenge cleanly."
      haproxy-haptic.org/auth-secret-type:
        status: supported
        note: "auth-file (htpasswd in the `auth` key) or auth-map (one key per user); default auth-file."
      haproxy-haptic.org/auth-signin:
        status: supported
        note: "External-auth sign-in redirect URL → auth-signin.map."
      haproxy-haptic.org/auth-tls-cert-header:
        status: supported
        note: "Forwards X-SSL-Client-CN/DN/Cert to the backend on hosts that presented a client cert (gated on ssl_fc_has_crt)."
      haproxy-haptic.org/auth-tls-cn-header:
        status: supported
        note: "Sets the named request header to the verified client certificate's CN and drops a client-supplied value; requires auth-tls-secret."
      haproxy-haptic.org/auth-tls-error-page:
        status: supported
        note: "Registers host→URL into gf[\"mtlsErrorHosts\"]; base emits the ssl_c_verify-gated redirect (map-only, reload-free)."
      haproxy-haptic.org/auth-tls-match-subject:
        status: supported
        note: "403 unless the client certificate's RFC 2253 subject DN matches the regex (nginx auth-tls-match-cn semantics); requires auth-tls-secret."
      haproxy-haptic.org/auth-tls-secret:
        status: supported
        note: "SNI-keyed client-cert CA verify; ca.crt written via fileRegistry and registered into gf[\"clientCertVerifyHosts\"]; host required (host-less rule fails)."
      haproxy-haptic.org/auth-tls-verify-client:
        status: different
        note: "on→verify required, optional/optional_no_ca→verify optional (HAProxy has no distinct optional_no_ca mode), off→no entry."
      haproxy-haptic.org/auth-type:
        status: supported
        note: "Basic-auth gate; must be \"basic\" (any other value fails loud at render)."
      haproxy-haptic.org/auth-url:
        status: supported
        note: "External-auth: populates auth-url.map (requires spoaHub.plugins.external-auth; spoa-hub frontend self-gates on the check-auth message)."
      haproxy-haptic.org/backend-ca-secret:
        status: supported
        note: "Secret ca.crt registered as fileRegistry file and emitted as ca-file; supplying it implies verify required. Missing Secret/key -> warning comment + skip."
      haproxy-haptic.org/backend-ciphers:
        status: supported
        note: "ciphers <list> (TLS<=1.2); only on a TLS-enabled backend; ValidateConfigValue-guarded."
      haproxy-haptic.org/backend-ciphersuites:
        status: supported
        note: "ciphersuites <list> (TLS1.3); only on a TLS-enabled backend; ValidateConfigValue-guarded."
      haproxy-haptic.org/backend-crt-secret:
        status: supported
        note: "kubernetes.io/tls Secret tls.crt+tls.key combined, registered as cert (ssl/ dir), presented to upstream via crt in any verify mode. Missing -> warning + skip."
      haproxy-haptic.org/backend-protocol:
        status: supported
        note: "Accepts h1|h2|h1-ssl|h2-ssl|http|https|grpc|grpcs; normalized to proto h2 (h2/grpc/h2-ssl/grpcs) and TLS-to-upstream (h1-ssl/https/h2-ssl/grpcs)."
      haproxy-haptic.org/backend-sni:
        status: supported
        note: "host/sni keyword -> sni req.hdr(host); any other value -> sni str(<literal>), ValidateConfigValue-guarded (single token)."
      haproxy-haptic.org/backend-ssl-protocols:
        status: different
        note: "Space-separated version list mapped to ssl-min-ver (lowest) / ssl-max-ver (highest); HAProxy expresses only a contiguous span, so a listed gap (e.g. skipping TLSv1.2) cannot be represented."
      haproxy-haptic.org/backend-verify:
        status: supported
        note: "Truthy (on/true/yes/1, case-insensitive) requires verification; fail-closed if no usable CA, never a silent downgrade to verify none."
      haproxy-haptic.org/backend-verify-host:
        status: supported
        note: "verifyhost <host>, set independently of SNI; ValidateConfigValue-guarded."
      haproxy-haptic.org/cache-enable:
        status: supported
        note: "\"true\" routes the Ingress's requests through the shared, consistent-hash-sharded Varnish cache tier (loopback origin); requires cache.varnish.enabled."
      haproxy-haptic.org/cache-exclude-content-types:
        status: supported
        note: "Comma-separated response media types never cached even if otherwise eligible (matched in Varnish vcl_backend_response via std.strstr after stripping the charset suffix)."
      haproxy-haptic.org/cache-exclude-paths:
        status: supported
        note: "Comma-separated request path prefixes that bypass the cache — routed straight to the app, never to Varnish."
      haproxy-haptic.org/cache-key:
        status: supported
        note: "Custom cache-key vary spec (`consumer` | `src` | `header:<h>` | `cookie:<c>` | `query:<q>`, composite via comma) added to Varnish's host+URL hash so e.g. per-consumer responses stay separate; del-header'd off the client first (anti-poisoning). Only the `consumer` component opts the route into caching Authorization/Cookie GET/HEAD requests: the custom vcl_recv bypass additionally requires an auth flag HAProxy sets only for a consumer-keyed route with a resolved consumer. Keying on header:/cookie:/query:/src does NOT lift the builtin's refusal, because those need not correlate with the caller. The same variance is declared downstream: header:/cookie: components become Vary (add-header, so an origin Vary survives), while consumer/src cannot be expressed as Vary — a downstream cache never sees the discriminator — so those routes get Cache-Control: private instead."
      haproxy-haptic.org/cache-max-object-size:
        status: supported
        note: "Max cacheable response size in bytes; a response larger (by Content-Length) than this stays uncacheable."
      haproxy-haptic.org/cache-negative-ttl:
        status: supported
        note: "Seconds to cache a 404 or 410 so scanning traffic stops reaching the origin. Independent of cache-ttl (nesting it there made the annotation a silent no-op on routes that leave lifetimes to the origin) and on its own clock — a cached 404 during a bad deploy pins the outage for its lifetime. Only 404/410; 5xx is never negatively cached, and stale-if-error covers the outage case instead."
      haproxy-haptic.org/cache-revalidate:
        status: supported
        note: "Seconds past expiry the object is kept for conditional revalidation (Varnish beresp.keep), so the refresh can be an If-None-Match the origin answers with 304 instead of a full body. Costs cache storage; default 0 keeps nothing."
      haproxy-haptic.org/cache-stale-if-error:
        status: supported
        note: "Seconds past expiry a stale object may still be served, but only when the refresh fails. Widens beresp.grace (the total window the object may be used) while leaving req.grace at the stale-while-revalidate value, so ordinary expiry still fetches synchronously; the VCL then abandons a fetch that returns 5xx, which is what makes Varnish fall back to the object instead of serving the error."
      haproxy-haptic.org/cache-stale-while-revalidate:
        status: supported
        note: "Seconds past expiry a stale object is served immediately while Varnish refreshes it in the background. Sets req.grace, which caps how much of beresp.grace is spent on proactive stale delivery. Without it a route falls back to Varnish's 10s default_grace."
      haproxy-haptic.org/cache-strip-set-cookie:
        status: supported
        note: "\"true\" drops Set-Cookie from the response before the cacheability test, so a public asset behind an analytics cookie stays cacheable. Never set it on a route whose Set-Cookie carries a session."
      haproxy-haptic.org/cache-ttl:
        status: supported
        note: "Cache TTL in seconds for the route, carried as X-Haptic-Cache-TTL and applied as the Varnish object TTL (non-2xx / Set-Cookie responses stay uncacheable). \"auto\" instead follows the origin's Cache-Control/Expires via std.rfc_ttl()."
      haproxy-haptic.org/canary:
        status: supported
        note: "Marks the Ingress as a canary for a shared host; excluded from base-route ownership (features-800 registers it in gf[\"coLocatedIngresses\"]) so the main Ingress owns the map entry and the canary only overlays a use_backend split."
      haproxy-haptic.org/canary-by-cookie:
        status: supported
        note: "Cookie-gated split (req.cook(<name>) -m str always); guarded by ValidateConfigValue."
      haproxy-haptic.org/canary-by-header:
        status: supported
        note: "Header-gated use_backend split (req.hdr(<name>) -m str always by default); value guarded by ValidateConfigValue."
      haproxy-haptic.org/canary-by-header-pattern:
        status: supported
        note: "Regex header match (req.hdr(<name>) -m reg <pattern>), takes precedence over header-value; guarded by ValidateConfigValue."
      haproxy-haptic.org/canary-by-header-value:
        status: supported
        note: "Overrides the matched header value (req.hdr(<name>) -m str <value>); guarded by ValidateConfigValue."
      haproxy-haptic.org/canary-weight:
        status: supported
        note: "Weighted split via rand(100) lt <weight>; bounds-checked to an integer 0-100 (fail-loud otherwise)."
      haproxy-haptic.org/check:
        status: supported
        note: "on/off toggle; false → serverOpts.checkDirective=no-check so servers aren't health-checked."
      haproxy-haptic.org/config-backend:
        status: supported
        note: "Injects raw, operator-authored HAProxy directives verbatim into the `backend` section. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`."
      haproxy-haptic.org/compress-algorithm:
        status: supported
        note: "Response compression algorithm (default gzip; deflate/raw-deflate). brotli/zstd fail loud — unavailable in the community HAProxy build."
      haproxy-haptic.org/compress-enable:
        status: supported
        note: "\"true\" enables HAProxy-side response compression for the backend (`compression algo`/`type` in its profile, filter on the frontend); \"false\" opts out. Compression is off unless enabled by an annotation or administrator default."
      haproxy-haptic.org/compress-types:
        status: supported
        note: "Comma-separated MIME types to compress (default a standard text/JSON/XML/SVG set)."
      haproxy-haptic.org/config-defaults:
        status: supported
        note: "Raw operator-authored directives injected verbatim into the defaults section. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`."
      haproxy-haptic.org/config-frontend:
        status: supported
        note: "Raw operator-authored directives injected at frontend-extra-* (before routing) into every frontend. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`."
      haproxy-haptic.org/config-global:
        status: supported
        note: "Injects raw operator-authored HAProxy directives verbatim into the `global` section. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`."
      haproxy-haptic.org/backend-connection-header:
        status: supported
        note: "Overrides the `Connection` header sent to the backend server."
      haproxy-haptic.org/consumer-groups-secret:
        status: supported
        note: "Secret (data key `groups`, newline `<consumer>:<group>`) → reload-free consumer→group map (one group per consumer), checked against allowed-consumer-groups; requires an authenticated consumer and fails closed with 503 while the Secret is absent."
      haproxy-haptic.org/cors-allow-credentials:
        status: supported
        note: "Access-Control-Allow-Credentials 'true' when set (via macro)"
      haproxy-haptic.org/cors-allow-headers:
        status: supported
        note: "Access-Control-Allow-Headers via http-after-response (via macro)"
      haproxy-haptic.org/cors-allow-methods:
        status: supported
        note: "Access-Control-Allow-Methods via http-after-response (via macro)"
      haproxy-haptic.org/cors-allow-origin:
        status: supported
        note: "comma-separated allow-list with single-level '*.' wildcard, matched request Origin echoed back (via macro); default '*'"
      haproxy-haptic.org/cors-enable:
        status: supported
        note: "gates the shared CORS map lane; always-on preflight 204 is the best-of-breed behaviour (no respond-to-options knob)"
      haproxy-haptic.org/cors-expose-headers:
        status: supported
        note: "Access-Control-Expose-Headers when set (via macro)"
      haproxy-haptic.org/cors-max-age:
        status: supported
        note: "Access-Control-Max-Age; default 86400 (via macro)"
      haproxy-haptic.org/default-backend:
        status: different
        note: "Routes requests that match the host but none of its configured paths to a named Service as a catch-all backend pool, using the Service's first port. Produces no backend, and no error, when the Service or its first port can't be resolved."
      haproxy-haptic.org/default-backend-redirect:
        status: supported
        note: "Builds haptic-default-backend-redirect-<code>.map and redirects host-matched-but-path-unmatched requests via !{ var(txn.backend_name) -m found }. Control-char guarded."
      haproxy-haptic.org/default-backend-redirect-code:
        status: supported
        note: "default-backend-redirect code (default 302); validated fail-loud."
      haproxy-haptic.org/denylist-source-range:
        status: supported
        note: "CIDR deny-list ACL + host-scoped deny via shared EmitAnnotationAccessControl (aclPrefix haptic); CIDRs validated"
      haproxy-haptic.org/forwardfor:
        status: supported
        note: "add appends to the client's X-Forwarded-For, update replaces it, ifmissing keeps or sets it, ignore forwards it unchanged; route-scoped; invalid enum fails loud"
      haproxy-haptic.org/apex-www-redirect:
        status: supported
        note: "Issues a `301` redirect between the apex domain and its `www` subdomain, in both directions, preserving the request path and scheme."
      haproxy-haptic.org/fullconn:
        status: supported
        note: "Emits `fullconn <n>` on the backend. HAProxy uses this threshold to scale each server's `minconn`/`maxconn` range as backend load rises. For a hard per-server cap, use `maxconn-server`."
      haproxy-haptic.org/health-check-fall:
        status: supported
        note: "Positive int → default-server `fall <n>`."
      haproxy-haptic.org/health-check-interval:
        status: supported
        note: "→ default-server `inter <dur>`; skipped when check=false; guarded."
      haproxy-haptic.org/health-check-port:
        status: supported
        note: "1-65535 → default-server `port <n>`."
      haproxy-haptic.org/health-check-rise:
        status: supported
        note: "Positive int → default-server `rise <n>`."
      haproxy-haptic.org/health-check-uri:
        status: supported
        note: "→ `option httpchk`; a value with a space is used verbatim, a bare path becomes `GET <path>`; guarded."
      haproxy-haptic.org/hmac-algorithm:
        status: supported
        note: "HMAC digest algorithm (default sha256; sha1/sha224/sha256/sha384/sha512)."
      haproxy-haptic.org/hmac-header:
        status: supported
        note: "Header carrying the client HMAC signature (default X-Signature; lowercase hex)."
      haproxy-haptic.org/hmac-secret:
        status: different
        note: "Secret (data key `secret`) → HMAC request-signature verification, deny 401 on mismatch. DIVERGES: the shared key is inlined (base64) into the rendered config and the compare is not constant-time — prefer asymmetric JWT. Fails closed (503) when the Secret is absent."
      haproxy-haptic.org/hmac-signed-string:
        status: supported
        note: "What the HMAC covers: `body` (default, forces option http-buffer-request) or `path`."
      haproxy-haptic.org/hsts:
        status: supported
        note: "Enables HSTS; via RegisterAnnotationHSTS registers host->value into gf[\"hstsHosts\"]; base builds hsts.map and emits the shared response-header rule."
      haproxy-haptic.org/hsts-include-subdomains:
        status: supported
        note: "Appends includeSubDomains to the Strict-Transport-Security value when \"true\"."
      haproxy-haptic.org/hsts-max-age:
        status: supported
        note: "HSTS max-age seconds; default from extraContext tls.hsts.maxAge (31536000). Control-char guarded in the macro."
      haproxy-haptic.org/hsts-preload:
        status: supported
        note: "Appends preload to the Strict-Transport-Security value when \"true\"."
      haproxy-haptic.org/initial-weight:
        status: supported
        note: "Integer 0-256 → default-server `weight <n>`."
      haproxy-haptic.org/jwt-algorithm:
        status: supported
        note: "JWT signature algorithm (default RS256); asymmetric only (RS/ES/PS 256/384/512) — symmetric HS* is rejected to avoid inlining a shared secret."
      haproxy-haptic.org/jwt-audience:
        status: different
        note: "Required `aud` claim value, exact string match. DIVERGES: an array `aud` (multiple audiences) is not matched — scalar aud only."
      haproxy-haptic.org/jwt-forward-claims:
        status: supported
        note: "Comma-separated `<claim>:<header>` pairs forwarded upstream after verification; each header is del-header'd first (anti-spoof)."
      haproxy-haptic.org/jwt-issuer:
        status: supported
        note: "Required `iss` claim value (exact match)."
      haproxy-haptic.org/jwt-required-claims:
        status: supported
        note: "Comma-separated claim names that must be present in the payload; a missing claim → 401."
      haproxy-haptic.org/jwt-secret:
        status: supported
        note: "Secret (data key `pubkey.pem`) → asymmetric JWT verification with an alg-confusion guard (token alg must equal the configured alg AND jwt_verify uses the constant configured alg), exp/iss/aud/required-claim checks, and the shared consumer identity from `sub`. Fails closed (503) per route when the Secret is absent; key rotation needs a reload."
      haproxy-haptic.org/download-bandwidth-limit:
        status: supported
        note: "Caps the bytes per second sent toward the client via a `bwlim-out` filter plus `http-request set-bandwidth-limit`. Byte sizes are validated before interpolation."
      haproxy-haptic.org/upload-bandwidth-limit:
        status: supported
        note: "Caps the bytes per second received from the client via a `bwlim-in` filter. Byte sizes are validated before interpolation."
      haproxy-haptic.org/bandwidth-limit-scope:
        status: supported
        note: "Who shares the bandwidth budget: `stream` (default), `client` (per source IP, `key src`) or `service` (whole backend, `key be_id`). The shared scopes add a backend stick-table, so they exclude the per-source rate-limit caps."
      haproxy-haptic.org/load-balance:
        status: supported
        note: "Parameterized algorithms roundrobin|static-rr|leastconn|first|source|random plus uri|url_param(NAME)|hdr(NAME)|rdp-cookie(NAME); invalid value fails the render."
      haproxy-haptic.org/maxconn-server:
        status: supported
        note: "Positive int → per-server `maxconn <n>` via default-server flags."
      haproxy-haptic.org/maxqueue-server:
        status: supported
        note: "Positive int → per-server `maxqueue <n>` via default-server flags."
      haproxy-haptic.org/mirror-target:
        status: supported
        note: "Fire-and-forget request mirroring via the spoa-hub mirror plugin (scheme://host[:port] authority → per-Ingress SPOE slot). Requires spoaHub.plugins.mirror (auto-enabled with the gateway library) and a rule host; both are enforced with fail-loud guards. Buffers the request body (option http-buffer-request)."
      haproxy-haptic.org/mock-response:
        status: supported
        note: "Non-empty body enables a canned `http-request return` stub (default 200/application/json); body escaped for HAProxy's quoted string. Short-circuits before the validators."
      haproxy-haptic.org/mock-response-code:
        status: supported
        note: "HTTP status for mock-response (default 200; 100-599)."
      haproxy-haptic.org/mock-response-content-type:
        status: supported
        note: "Content-Type for the mock-response body (default application/json)."
      haproxy-haptic.org/oauth:
        status: supported
        note: "oauth2-proxy only; desugars onto external-auth, deriving the oauth2-proxy backend from the Ingress's own oauth-uri-prefix path; skipped when auth-url is set."
      haproxy-haptic.org/oauth-headers:
        status: supported
        note: "Headers forwarded from the oauth2-proxy reply on success (default X-Auth-Request-Email); <header>[:<source>] form keyed on header name."
      haproxy-haptic.org/oauth-uri-prefix:
        status: supported
        note: "oauth2-proxy path prefix (default /oauth2); trailing slash trimmed."
      haproxy-haptic.org/path-rewrite:
        status: supported
        note: "<from> <to> → replace-path with both tokens; bare value → replace-path (.*) <value>"
      haproxy-haptic.org/path-type:
        status: supported
        note: "regex|exact|prefix|begin honored only for pathType ImplementationSpecific; selects path-regex/path-exact/path-prefix(trailing-slash normalised)/path-prefix-exact map"
      haproxy-haptic.org/permanent-redirect:
        status: supported
        note: "URL registered into gf[\"redirectHosts\"] with code (default 301); base emits from redirect-loc-<code>.map. Control-char guarded."
      haproxy-haptic.org/permanent-redirect-code:
        status: supported
        note: "Permanent redirect code (default 301); validated fail-loud."
      haproxy-haptic.org/pod-maxconn:
        status: supported
        note: "Cluster budget divided by count of Ready HAProxy pods, quantized up to a power of two; result set on serverOpts.maxconn for BackendServersResult to emit as per-server maxconn."
      haproxy-haptic.org/max-request-body-size:
        status: supported
        note: "Limits the request body size (accepts `k`, `m`, or `g` suffixes), returning `413` when exceeded; `0` means unlimited."
      haproxy-haptic.org/response-cookie-domain:
        status: supported
        note: "Rewrites the `Domain` attribute of upstream `Set-Cookie` response headers, given a `<from> <to>` pair, preserving the rest of the cookie string. Host-scoped; a wrong-arity value fails the render."
      haproxy-haptic.org/response-cookie-path:
        status: supported
        note: "Rewrites the `Path` attribute of upstream `Set-Cookie` response headers, given a `<from> <to>` pair, preserving the rest of the cookie string. Host-scoped; a wrong-arity value fails the render."
      haproxy-haptic.org/retry-on:
        status: supported
        note: "Sets the conditions under which HAProxy retries a failed request against the next server, emitting `retry-on`. Conditions cover connection failures, response timeouts, malformed responses, and per-status-code retries (`http_<code>`); a disable value emits `retries 0`. `option redispatch` in defaults sends the retry to a different server."
      haproxy-haptic.org/retries:
        status: supported
        note: "Sets the number of retry attempts against backend servers via HAProxy `retries`; `0` keeps the default."
      haproxy-haptic.org/proxy-protocol:
        status: supported
        note: "proxy/proxy-v1→send-proxy, proxy-v2, proxy-v2-ssl, proxy-v2-ssl-cn; any other value fails the render."
      haproxy-haptic.org/response-location-rewrite-from:
        status: supported
        note: "Names the literal text to match in the `Location` and `Refresh` response headers; the matched text is regex-escaped and replaced with the value of `response-location-rewrite-to`. Host-scoped."
      haproxy-haptic.org/response-location-rewrite-to:
        status: supported
        note: "Supplies the replacement text for `response-location-rewrite-from`; required whenever a match pattern is set, or the render fails."
      haproxy-haptic.org/rate-limit-connections:
        status: supported
        note: "Per-source concurrent-connection cap via conn_cur counter; ignored when rps or rpm is set (separate counter type, comment records it)."
      haproxy-haptic.org/rate-limit-algorithm:
        status: supported
        note: "Shared SPOA limiter algorithm: token-bucket (lease mode) or gcra (exact synchronous store check). Requires rate-limit-requests and rateLimit.shared.enabled."
      haproxy-haptic.org/rate-limit-burst:
        status: supported
        note: "Shared SPOA limiter burst allowance; positive integer, defaults to rate-limit-requests."
      haproxy-haptic.org/rate-limit-key:
        status: supported
        note: "Shared SPOA limiter key dimension: ip (default, dispatched before Coraza for DoS protection) or consumer (dispatched after native auth establishes txn.haptic_consumer, falling back to source IP when absent)."
      haproxy-haptic.org/rate-limit-period:
        status: supported
        note: "Overrides the rate window. For stick-tables, derives from rps/rpm/connections when unset and accepts HAProxy time suffixes; for shared SPOA limiting defaults to 1s and accepts ms/s/m/h/d. Malformed or zero shared periods fail the render."
      haproxy-haptic.org/rate-limit-requests:
        status: supported
        note: "Enables the shared fleet-wide rate limiter for the Ingress: N requests per period via the bundled rate-limit SPOA plugin. Requires rateLimit.shared.enabled; rateLimit.shared.managedStore.enabled deploys HA Valkey with Sentinel and auto-injects store_url."
      haproxy-haptic.org/rate-limit-rpm:
        status: supported
        note: "Per-source requests/minute cap (http_req_rate, 60s window); ignored when rate-limit-rps is also set (single stick-table, comment records it)."
      haproxy-haptic.org/rate-limit-rps:
        status: supported
        note: "Hard per-source-IP requests/sec cap via http_req_rate stick-table; over-cap rejected with deny_status (default 429). No burst allowance."
      haproxy-haptic.org/rate-limit-size:
        status: supported
        note: "Stick-table size (default 100k); validated as a byte-size token (^[0-9]+[kKmMgG]?$) before interpolation."
      haproxy-haptic.org/rate-limit-status-code:
        status: supported
        note: "Sets the HTTP status returned to rejected requests (default 429). Validated as a 3-digit HTTP status before interpolation, then emitted as the `http-request deny deny_status` code."
      haproxy-haptic.org/rate-limit-allowlist:
        status: supported
        note: "Comma-separated CIDRs exempted via a trailing negated src guard; routed through ValidateCidrList so invalid CIDRs fail loudly."
      haproxy-haptic.org/request-buffering:
        status: supported
        note: "on|off per-route override of extraContext.requestBuffering.enabled → reload-free request-buffering.map; only Content-Length-carrying requests are ever buffered, so gRPC and chunked streaming are excluded either way."
      haproxy-haptic.org/request-capture:
        status: supported
        note: "newline-separated header names -> capture request header, frontend-wide (capture slots are positional, not host-scopable); guarded"
      haproxy-haptic.org/request-capture-len:
        status: supported
        note: "capture length, default 128; positive-integer validated"
      haproxy-haptic.org/request-id:
        status: supported
        note: "\"true\" enables a per-request correlation id: emits `unique-id-format` once in defaults and a host-scoped `http-request set-header` forwarding `%[unique-id]` upstream."
      haproxy-haptic.org/request-id-accept-inbound:
        status: supported
        note: "\"true\" preserves a client-supplied id (set only when the header is absent); default overwrites with a fresh id (a client id can't be trusted for internal correlation)."
      haproxy-haptic.org/request-id-header:
        status: supported
        note: "Header carrying the correlation id (default X-Request-ID); validated single token."
      haproxy-haptic.org/request-schema-configmap:
        status: supported
        note: "Enables JSON request-body validation via the api-gateway SPOA plugin using a ConfigMap data key (`[ns/]name[:key]`, default key schema.json). Requires extraContext.apiGateway.requestSchemaValidation.enabled; schemas compile at plugin init/validate."
      haproxy-haptic.org/request-schema-content-types:
        status: supported
        note: "Comma-separated media types accepted for request-schema validation (default application/json). The plugin compares Content-Type after stripping parameters and rejects mismatches with 415."
      haproxy-haptic.org/request-schema-fail-open:
        status: supported
        note: "Per-route missing-verdict policy for request-schema validation. Defaults to extraContext.apiGateway.requestSchemaValidation.defaultFailOpen; false fails closed on hub/plugin timeout or missing verdict."
      haproxy-haptic.org/request-schema-max-body-size:
        status: supported
        note: "Per-route request validation input cap in bytes (1..1048576). It must fit within extraContext.requestBodyInspection.haproxyBuffer.sizeBytes minus reservedBytes. HAProxy returns 413 before the SPOE call when the validation body is larger; the plugin repeats the bound defensively. This does not replace haproxy-haptic.org/max-request-body-size, the general backend body-size limit."
      haproxy-haptic.org/request-schema-secret:
        status: supported
        note: "Enables JSON request-body validation via the api-gateway SPOA plugin using a Secret data key (`[ns/]name[:key]`, default key schema.json) whose value is already base64 encoded."
      haproxy-haptic.org/request-set-header:
        status: supported
        note: "newline-separated '<name> <value>' lines -> http-request set-header, host-scoped; name (no-space) and value ValidateConfigValue-guarded"
      haproxy-haptic.org/fixed-response:
        status: supported
        note: "The value `true` returns a fixed response for every request matching the route's host(s) via `http-request return` — for maintenance windows or sunset routes. Runs before mocking and the validators. Defaults to status 503 / `text/plain`, and can return a bare status with no body."
      haproxy-haptic.org/fixed-response-body:
        status: supported
        note: "Optional response body for `fixed-response`."
      haproxy-haptic.org/fixed-response-code:
        status: supported
        note: "HTTP status for `fixed-response` (default 503; must be 100-599)."
      haproxy-haptic.org/fixed-response-content-type:
        status: supported
        note: "Content-Type for the `fixed-response` body (default `text/plain`)."
      haproxy-haptic.org/require-content-type:
        status: supported
        note: "Comma-separated media types required on body methods (POST/PUT/PATCH) → `http-request return status 415` (prefix-matched, charset-tolerant) when Content-Type is not allowed."
      haproxy-haptic.org/require-headers:
        status: supported
        note: "Comma-separated required request headers → one host-scoped `http-request deny deny_status 400` per missing header."
      haproxy-haptic.org/response-set-header:
        status: supported
        note: "newline-separated '<name> <value>' lines -> http-after-response set-header, host-scoped; guarded"
      haproxy-haptic.org/satisfy:
        status: supported
        note: "\"any\" OR-combines allowlist-source-range and basic auth into one backend gate, suppressing both the standalone allowlist deny and the standalone auth challenge so an allow-listed OR authenticated request passes."
      haproxy-haptic.org/scale-server-slots:
        status: dropped
        note: "Inert: servers are named after their pods (ADR-0011), so there is no slot pool to size. Setting it emits an UnsupportedAnnotation Warning Event."
      haproxy-haptic.org/host-alias:
        status: supported
        note: "Adds extra exact hostnames (comma- or space-separated) that route to the same backends as the Ingress's primary host. Each hostname becomes a host-map entry pointing at the primary host's normalized routing key, so no backends or path-map entries are duplicated. Each hostname must be a valid DNS name, optionally starting with `*.`, and is matched case-insensitively; a hostname another Ingress claimed first stays with that Ingress."
      haproxy-haptic.org/host-alias-regex:
        status: supported
        note: "Adds a regular-expression hostname pattern (HAProxy-compatible PCRE) that routes every matching hostname to the same backends as the Ingress's primary host. The pattern is matched against the whole hostname and consulted after every exact and wildcard host lookup missed. A pattern whose groups or `[ ]` classes do not close within it is rejected."
      haproxy-haptic.org/session-cookie-domain:
        status: supported
        note: "native 'domain <d>' cookie keyword; injection-guarded"
      haproxy-haptic.org/session-cookie-dynamic:
        status: supported
        note: "default true → adds 'dynamic' keyword plus per-backend dynamic-cookie-key sha256(ns/name)"
      haproxy-haptic.org/session-cookie-keywords:
        status: supported
        note: "appended verbatim (injection-guarded, spaces allowed) e.g. 'httponly'"
      haproxy-haptic.org/session-cookie-max-age:
        status: supported
        note: "non-negative integer seconds → 'attr Max-Age=<n>' (browser cookie lifetime, not HAProxy maxlife); non-integer → fail"
      haproxy-haptic.org/session-cookie-name:
        status: supported
        note: "cookie name; defaults to INGRESSCOOKIE; injection-guarded"
      haproxy-haptic.org/session-cookie-path:
        status: supported
        note: "surfaced as 'attr Path=<path>' (HAProxy has no bare path keyword); injection-guarded"
      haproxy-haptic.org/session-cookie-preserve:
        status: supported
        note: "'true' → 'preserve' keyword on the cookie directive"
      haproxy-haptic.org/session-cookie-samesite:
        status: supported
        note: "None|Lax|Strict → 'attr SameSite=<v>'; invalid → fail"
      haproxy-haptic.org/session-cookie-secure:
        status: supported
        note: "'true' → 'attr Secure'"
      haproxy-haptic.org/session-cookie-strategy:
        status: supported
        note: "insert|rewrite|prefix (default insert); insert/prefix add indirect nocache; invalid → fail"
      haproxy-haptic.org/set-host:
        status: supported
        note: "Overrides upstream Host via reload-free reqhdr-host.map"
      haproxy-haptic.org/src-ip-header:
        status: supported
        note: "http-request set-src hdr(<name>), host-scoped; header name ValidateConfigValue-guarded; naming X-Forwarded-For keeps the client's X-Forwarded-For for the route"
      haproxy-haptic.org/ssl-passthrough:
        status: supported
        note: "Incremental per-Ingress SNI publication with winner-conditioned backends; ssl.yaml builds the SNI TCP frontend."
      haproxy-haptic.org/https-redirect:
        status: supported
        note: "Redirects plain HTTP requests for the host to HTTPS. Hosts that also set `https-redirect-port` are handled there instead, avoiding a double redirect."
      haproxy-haptic.org/https-redirect-code:
        status: supported
        note: "Sets the HTTP-to-HTTPS redirect status code (`301`, `302`, `303`, `307`, or `308`; default `302`)."
      haproxy-haptic.org/https-redirect-port:
        status: supported
        note: "Redirects plain HTTP requests to HTTPS on an explicit port, preserving the request URI."
      haproxy-haptic.org/temporary-redirect:
        status: supported
        note: "Redirects the host to the given URL with a temporary status code (default `302`)."
      haproxy-haptic.org/temporary-redirect-code:
        status: supported
        note: "Sets the status code for `temporary-redirect` (default `302`)."
      haproxy-haptic.org/timeout-check:
        status: supported
        note: "Emits `timeout check <x>`; guarded."
      haproxy-haptic.org/timeout-connect:
        status: supported
        note: "Emits `timeout connect <x>`; value guarded by ValidateConfigValue."
      haproxy-haptic.org/timeout-http-request:
        status: supported
        note: "Emits `timeout http-request <x>`; guarded."
      haproxy-haptic.org/timeout-keep-alive:
        status: supported
        note: "Emits `timeout http-keep-alive <x>`; guarded."
      haproxy-haptic.org/timeout-queue:
        status: supported
        note: "Emits `timeout queue <x>`; guarded."
      haproxy-haptic.org/timeout-server:
        status: supported
        note: "Emits `timeout server <x>`; guarded."
      haproxy-haptic.org/timeout-tunnel:
        status: supported
        note: "Emits `timeout tunnel <x>`; guarded."
      haproxy-haptic.org/consistent-hash-by:
        status: supported
        note: "Configures consistent hashing on the backend, emitting a `balance` directive plus `hash-type consistent`. Accepts a hash key: `uri`, `source`, `$http_<name>`, `$arg_<name>`, or `$cookie_<name>`; any other value is used verbatim as a HAProxy fetch expression via `balance hash <value>`."
      haproxy-haptic.org/waf-mode:
        status: supported
        note: "deny|detect (default from the selected policy, otherwise deny); administrator-controlled by ingressPermissions.allowEnforcementOverride, and invalid or context-free values fail loud."
      haproxy-haptic.org/waf-policy:
        status: supported
        note: "Selects one exact administrator-approved reusable Coraza policy from chart values or an explicitly trusted ConfigMap; Ingresses cannot define or redirect policy sources."
      haproxy-haptic.org/x-forwarded-prefix:
        status: supported
        note: "X-Forwarded-Prefix via reload-free reqhdr-xfwd-prefix.map"
