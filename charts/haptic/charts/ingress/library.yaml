_fx:
  servicesServiceSvcA: &servicesServiceSvcA
    - apiVersion: v1
      kind: Service
      metadata: {name: svc-a, namespace: team-a}
      spec:
        ports:
          - {name: http, port: 80, targetPort: 8080}
    - apiVersion: v1
      kind: Service
      metadata: {name: svc-b, namespace: team-b}
      spec:
        ports:
          - {name: http, port: 80, targetPort: 8080}
  fixturesPlainPlainExampleCom: &fixturesPlainPlainExampleCom
    ingresses:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: {name: plain, namespace: default}
        spec:
          ingressClassName: haproxy
          rules:
            - host: plain.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend: {service: {name: echo, port: {number: 80}}}
  specHttp8080: &specHttp8080
    ports:
      - {name: http, port: 8080, targetPort: 8080}
  backendSvcA: &backendSvcA
    service: {name: svc-a, port: {number: 80}}
  backendSvcB: &backendSvcB
    service: {name: svc-b, port: {number: 80}}
  specPortsPort: &specPortsPort
    ports:
      - {port: 80, targetPort: 8080}

_helm_load:
  enable: '{{ .Values.controller.templateLibraries.ingress.enabled }}'
  inject:
    - path: watchedResources.ingresses.fieldSelector
      value: 'spec.ingressClassName={{ .Values.ingressClass.name }}'

# Lowest precedence: controller.config.templatingSettings.extraContext overrides these.
templatingSettings:
  extraContext:
    # Serve Ingress over HTTPS without spec.tls; no-op without a default certificate.
    ingressDefaultHTTPS: true
    # Only hosts actually served over HTTPS (default bind on, or spec.tls) redirect.
    ingressDefaultSSLRedirect: false
    # One of 301, 302, 303, 307, 308.
    ingressDefaultSSLRedirectCode: "308"

watchedResources:
  ingresses:
    apiVersion: networking.k8s.io/v1
    resources: ingresses
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

templateSnippets:

  features-070-ingress-route-colocation:
    requires: [ingresses]
    incremental:
      source: ingresses
      group: ingress-route-colocation
      effects: [publishValue]
    template: '{{- "" -}}'

  features-100-ingress-bind:
    template: |-
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var tlsDefault bool = extraContext | dig("ingressDefaultHTTPS") | fallback(true) %}
      {%- var haveDefaultCert = tostring(extraContext | dig("tls", "defaultCertificate", "name") | fallback("")) != "" %}
      {%- var httpsByDefault = tlsDefault && haveDefaultCert %}
      {%- gf["ingressHTTPSByDefault"] = httpsByDefault %}
      {%- var flags = render "featuresvalues-100-ingress-bind" -%}
      {%- gf["haveIngresses"] = strings_contains(flags, "H") -%}
      {%- if strings_contains(flags, "H") -%}
        {%- gf["bindHTTPDefault"] = true -%}
        {%- gf["needHTTPFrontend"] = true -%}
      {%- end -%}
      {%- if strings_contains(flags, "S") -%}
        {%- gf["bindHTTPSDefault"] = true -%}
        {%- gf["needHTTPSFrontend"] = true -%}
        {%- gf["needHTTPSTermination"] = true -%}
      {%- end %}

  util-ingress-bind-bindings:
    template: |-
      {%- var tlsDefault bool = extraContext | dig("ingressDefaultHTTPS") | fallback(true) -%}
      {%- var haveDefaultCert = tostring(extraContext | dig("tls", "defaultCertificate", "name") | fallback("")) != "" -%}
      {{- toJSON(map[string]any{"ingresses": map[string]any{"httpsByDefault": tlsDefault && haveDefaultCert}}) -}}

  featuresvalues-100-ingress-bind:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- render "util-ingress-bind-bindings" -}}'
    template: |-
      {{- shared.Unique("flags", "http", "H") -}}
      {%- if props["httpsByDefault"] == true || len(item | dig("spec", "tls") | toSlice()) > 0 -%}
        {{- shared.Unique("flags", "https", "S") -}}
      {%- end -%}

  features-100-ingress-tls:
    template: |
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {{- render "ingress-tls-certificate-publications" -}}
      {%- var seenSecrets = map[string]bool{} -%}
      {%- for _, occurrenceAny := range incremental_values("ingress-tls-certificates", "occurrences") -%}
        {%- var occurrence = occurrenceAny.(map[string]any) -%}
        {%- var namespace = tostring(occurrence["secretNamespace"]) -%}
        {%- var secretName = tostring(occurrence["secretName"]) -%}
        {%- var secretKey = namespace + "/" + secretName -%}
        {%- if seenSecrets[secretKey] -%}{%- continue -%}{%- end -%}
        {%- seenSecrets[secretKey] = true -%}
        {%- var certFilename = namespace + "_" + secretName + ".pem" -%}
        {%- var certPath, certRegErr = fileRegistry.Register("cert", certFilename, tostring(occurrence["pem"])) -%}
        {%- if certRegErr != nil -%}
          {{- fail("failed to register certificate " + certFilename + ": " + tostring(certRegErr)) -}}
        {%- end -%}
        {%- gf["tlsCertificates"] = append(gf["tlsCertificates"].([]any), map[string]any{
          "secret_namespace": namespace,
          "secret_name": secretName,
          "sni_patterns": occurrence["sniPatterns"],
          "sanitized_filename": basename(certPath),
        }) -%}
      {%- end %}

  ingress-tls-certificate-publications:
    requires: [ingresses, secrets]
    incremental:
      source: ingresses
      whenAnyPathExists: ["spec.tls"]
      group: ingress-tls-certificates
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var namespace = ingress.Metadata.Namespace -%}
        {%- var ingressKey = namespace + "/" + ingress.Metadata.Name -%}
        {%- for tlsIndex, tls := range ingress.Spec.Tls -%}
          {%- var secretName = tls.SecretName -%}
          {%- if secretName == "" -%}{%- continue -%}{%- end -%}
          {%- var secret = resources.secrets.GetSingle(namespace, secretName) -%}
          {%- if secret == nil -%}{%- continue -%}{%- end -%}
          {%- var tlsCrt, hasCrt = secret.Data["tls.crt"] -%}
          {%- var tlsKey, hasKey = secret.Data["tls.key"] -%}
          {%- if !hasCrt || !hasKey -%}{%- continue -%}{%- end -%}
          {%- var indexKey = "000000000" + tostring(tlsIndex) -%}
          {%- indexKey = indexKey[len(indexKey)-9:] -%}
          {{- shared.Publish("occurrences", ingressKey + "\x00" + indexKey, map[string]any{
            "secretNamespace": namespace,
            "secretName": secretName,
            "sniPatterns": tls.Hosts | toSlice(),
            "pem": (tlsCrt | b64decode()) + "\n" + (tlsKey | b64decode()),
          }) -}}
        {%- end -%}
      {%- end -%}

  util-ingress-default-ssl-redirect-bindings:
    template: |-
      {%- var enabled bool = extraContext | dig("ingressDefaultSSLRedirect") | fallback(false) -%}
      {%- if !enabled -%}{}{%- else -%}
        {%- var code = extraContext | dig("ingressDefaultSSLRedirectCode") | fallback("308") | tostring() -%}
        {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
          {{- fail("Invalid extraContext.ingressDefaultSSLRedirectCode '" + code + "': must be one of 301, 302, 303, 307, 308.") -}}
        {%- end -%}
        {%- var tlsDefault bool = extraContext | dig("ingressDefaultHTTPS") | fallback(true) -%}
        {%- var haveDefaultCert = tostring(extraContext | dig("tls", "defaultCertificate", "name") | fallback("")) != "" -%}
        {{- toJSON(map[string]any{"ingresses": map[string]any{
          "code": code, "httpsByDefault": tlsDefault && haveDefaultCert,
        }}) -}}
      {%- end -%}

  features-105-ingress-ssl-redirect:
    template: |
      {{- render "ingress-default-ssl-redirect-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("ingress-default-ssl-redirect-hosts", "hosts") -%}
        {%- var redirectHosts []any = gf["sslRedirectHosts"] -%}
        {%- gf["sslRedirectHosts"] = append(redirectHosts, entry) -%}
      {%- end %}

  ingress-default-ssl-redirect-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: '{{- render "util-ingress-default-ssl-redirect-bindings" -}}'
      group: ingress-default-ssl-redirect-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var tlsHosts = map[string]bool{} -%}
        {%- for _, tls := range ingress.Spec.Tls -%}
          {%- for _, host := range tls.Hosts -%}
            {%- tlsHosts[toLower(host)] = true -%}
          {%- end -%}
        {%- end -%}
        {%- var ingressKey = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
          {%- var host = toLower(rule.Host) -%}
          {%- if host != "" && (props["httpsByDefault"] == true || tlsHosts[host]) -%}
            {%- var indexKey = "000000000" + tostring(ruleIndex) -%}
            {%- indexKey = indexKey[len(indexKey)-9:] -%}
            {{- shared.Publish("hosts", ingressKey + "\x00" + indexKey,
              map[string]any{"host": host, "code": tostring(props["code"])}) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}


  util-backend-name-ingress:
    template: |
      {% macro BackendNameIngress(ingress any, path any) string %}{%%
        var namespace = dig_string(ingress, "", "metadata", "namespace")
        var name = dig_string(ingress, "", "metadata", "name")
        var serviceName = tostring(path | dig("backend", "service", "name") | fallback(""))
        var portName = tostring(path | dig("backend", "service", "port", "name") | fallback(""))
        var portNumber = path | dig("backend", "service", "port", "number") | fallback(0)

        if portName == "" && toint(portNumber) > 0 {
          var svc = resources.services.GetSingle(namespace, serviceName)
          if svc != nil {
            for _, sp := range svc.Spec.Ports {
              if toint(sp.Port) == toint(portNumber) {
                portName = sp.Name
                break
              }
            }
          }
        }

        var portIdentifier = portName
        if portIdentifier == "" {
          portIdentifier = tostring(portNumber)
        }

        show namespace + "_" + name + "_svc_" + serviceName + "_" + portIdentifier
      %%}{% end %}

  features-900-ingress-path-candidates:
    requires: [ingresses]
    incremental:
      source: ingresses
      group: ingress-path-candidates
      consumes: [ingress-route-colocation]
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%%
        var ingress = item
        var id = dig_string(ingress, "", "metadata", "namespace") + "/" +
          dig_string(ingress, "", "metadata", "name")
        var _, coLocated = shared.Select("ingress-route-colocation", "identities", id)
        var rejected = false
        for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
          for _, path := range toSlice(dig(rule, "http", "paths")) {
            var pathValue = dig_string(path, "", "path")
            if pathValue != "" && !rejected &&
              (regex_search(pathValue, "[[:cntrl:]]") || strings_contains(pathValue, " ")) {
              rejected = true
              _ = WebhookRejectOrWarn(ingress, "InvalidPath", "Ingress '" + id +
                "' has a path containing whitespace or control characters, which cannot be written to the routing map; the route is not applied. Remove spaces, tabs and newlines from spec.rules[].http.paths[].path.")
            }
          }
        }
        show shared.Publish("statuses", id, map[string]any{"coLocated": coLocated, "rejected": rejected})
        if !rejected {
          var class = "0"
          if coLocated { class = "1" }
          var rank = class + "/" + dig_string(ingress, "", "metadata", "creationTimestamp") + "/" + id
          for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
            for _, path := range toSlice(dig(rule, "http", "paths")) {
              var pathValue = dig_string(path, "", "path")
              if pathValue == "" { continue }
              var slot = dig_string(path, "", "pathType")
              if slot == "ImplementationSpecific" { slot = "Prefix" }
              if slot != "Exact" && len(pathValue) > 1 && hasSuffix(pathValue, "/") {
                pathValue = pathValue[:len(pathValue)-1]
              }
              var key = slot + "|" + MapKeyForHost(dig(rule, "host")) + pathValue
              show shared.PublishRanked("owners", key, rank, map[string]any{"owner": id})
            }
          }
        }
      %%}

  features-905-ingress-default-backend-candidates:
    requires: [ingresses]
    incremental:
      source: ingresses
      group: ingress-default-backend-candidates
      effects: [publishValue]
    template: |-
      {%- import "util-host-key" for MapKeyForHost -%}
      {%%
        var ingress = item
        var defaultBackend = dig(ingress, "spec", "defaultBackend", "service")
        if defaultBackend != nil {
          var id = dig_string(ingress, "", "metadata", "namespace") + "/" +
            dig_string(ingress, "", "metadata", "name")
          var timestamp = dig_string(ingress, "", "metadata", "creationTimestamp")
          var reverseTimestamp = "9999999999999999999"
          if timestamp != "" {
            reverseTimestamp = formatInt(toint(9223372036854775807 -
              parseTime("2006-01-02T15:04:05Z07:00", timestamp).UnixNano()), 10)
          }
          var rank = reverseTimestamp + "/" + id
          var rules = toSlice(dig(ingress, "spec", "rules"))
          if len(rules) == 0 {
            show shared.PublishRanked("hosts", "\x00", rank, map[string]any{"owner": id})
          } else {
            for _, rule := range rules {
              var hostKey = MapKeyForHost(dig(rule, "host"))
              show shared.PublishRanked("hosts", hostKey, rank, map[string]any{"owner": id})
            }
          }
        }
      %%}

  util-path-map-entry-ingress:
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {% macro PathMapEntryIngress(ingress *resources.ingresses.T, pathTypes []string, suffix string, reportConflicts bool) string %}
        {%- var id = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var status, _ = shared.Select("ingress-path-candidates", "statuses", id) -%}
        {%- var rejected bool = status | dig("rejected") | fallback(false) -%}
        {%- if !rejected -%}
        {%- var coLocated bool = status | dig("coLocated") | fallback(false) -%}
        {%- var matchCount = 0 -%}
        {%- for _, rule := range ingress.Spec.Rules -%}
          {%- for _, path := range rule.Http.Paths -%}
            {%- if path.Path == "" -%}{%- continue -%}{%- end -%}
            {%- for _, checkType := range pathTypes -%}
              {%- if path.PathType != checkType -%}{%- continue -%}{%- end -%}
              {%- var slot = tostring(path.PathType) -%}
              {%- if slot == "ImplementationSpecific" -%}{%- slot = "Prefix" -%}{%- end -%}
              {%- var normalizedPath = path.Path -%}
              {%- if slot != "Exact" && len(normalizedPath) > 1 && hasSuffix(normalizedPath, "/") -%}
                {%- normalizedPath = normalizedPath[:len(normalizedPath)-1] -%}
              {%- end -%}
              {%- var winner, found = shared.Select("ingress-path-candidates", "owners",
                slot + "|" + MapKeyForHost(rule.Host) + normalizedPath) -%}
              {%- var winnerID = dig_string(winner, "", "owner") -%}
              {%- if found && winnerID == id -%}
                {%- matchCount = matchCount + 1 -%}
              {%- else if reportConflicts && !coLocated -%}
                {{- recordEvent(ingress, "RouteConflict",
                  "host \""+rule.Host+"\" path \""+path.Path+"\" ("+
                    tostring(path.PathType)+") is already served by Ingress "+
                    winnerID+", which takes precedence; this Ingress's route is not applied") -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- if matchCount > 0 -%}
      {{ "\n" }}# Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} ({{ matchCount }} paths)
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- if path.Path == "" -%}{%- continue -%}{%- end -%}
              {%- for _, checkType := range pathTypes -%}
                {%- if path.PathType != checkType -%}{%- continue -%}{%- end -%}
                {%- var slot = tostring(path.PathType) -%}
                {%- if slot == "ImplementationSpecific" -%}{%- slot = "Prefix" -%}{%- end -%}
                {%- var normalizedPath = path.Path -%}
                {%- if slot != "Exact" && len(normalizedPath) > 1 && hasSuffix(normalizedPath, "/") -%}
                  {%- normalizedPath = normalizedPath[:len(normalizedPath)-1] -%}
                {%- end -%}
                {%- var winner, _ = shared.Select("ingress-path-candidates", "owners",
                  slot + "|" + MapKeyForHost(rule.Host) + normalizedPath) -%}
                {%- if dig_string(winner, "", "owner") != id -%}{%- continue -%}{%- end -%}
                {%- var pathStr = ValidateConfigValue(path.Path, "spec.rules[].http.paths[].path", id, false) -%}
                {%- if suffix == "" && pathStr == "/" -%}{%- continue -%}{%- end -%}
                {%- var actualSuffix = suffix -%}
                {%- if suffix == "/" && hasSuffix(pathStr, "/") -%}{%- actualSuffix = "" -%}{%- end -%}
                {%- if path.PathType != "Exact" && suffix == "" && len(pathStr) > 1 && hasSuffix(pathStr, "/") -%}
                  {%- pathStr = pathStr[:len(pathStr)-1] -%}
                {%- end -%}
      {{ "\n" }}{{ MapKeyForHost(rule.Host) }}{{ pathStr }}{{ actualSuffix }} BACKEND:{{ BackendNameIngress(ingress, path) }}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- end -%}
      {% end %}


  util-generate-backends-ingress:
    template: |
      {%- import "util-backend" for AppendLines, DefaultServerArgs, PrepareBackend -%}
      {%- import "util-ingress-timeout-metadata" for PublishIngressTimeouts -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {%- import "util-service-port-resolution" for ResolveServicePort -%}
      {#- The profile carries the two uniform set-timeout rules (identical across
          every ingress backend → one shared profile for the plain case) plus any
          defaults-legal lines a snippet declared on serverOpts["profile"]. The
          per-server keywords (check, ssl, maxconn, …) are passed to Backend() as
          the structured `defaultServer` (DefaultServerArgs), so they sit on the
          profile's default-server line AND appear in the plan record — the deploy
          side composes `add server` from the record, not the profile text. The
          body carries only structural directives (stick-table, filter, raw
          injections); an empty body is a dynamic-eligible backend. -#}
      {%- var IngressProfile = func(serverOpts map[string]any, beTimeoutSrv string, beTimeoutTun string) []any {
        var profile = []any{beTimeoutSrv, beTimeoutTun}
        for _, l := range toSlice(serverOpts["profile"]) {
          profile = append(profile, l)
        }
        return profile
      } -%}
      {%- var IngressBody = func(serverOpts map[string]any, directives []any) []any {
        var body = []any{}
        for _, l := range toSlice(serverOpts["body"]) {
          body = append(body, l)
        }
        for _, l := range directives {
          body = append(body, l)
        }
        return body
      } -%}
      {% macro GenerateIngressBackends(ingress *resources.ingresses.T, effectPrefix string) string %}
        {%- var ns = ingress.Metadata.Namespace -%}
        {%- var name = ingress.Metadata.Name -%}
        {{- shared.Publish("headers", "ingress", true) -}}
        {%- var backendFiles = []any{} -%}
        {%- var degradedMarkers = map[string]bool{} -%}
        {%- var seenBackends = map[string]bool{} -%}
        {%- var FilePath = func(fileType string, filename string) string {
          var base = tostring(props["fileDir"])
          if fileType == "map" {
            base = tostring(props["mapDir"])
          } else if fileType == "cert" || fileType == "crt-list" {
            base = tostring(props["certDir"])
          }
          if base == "" {
            return filename
          }
          return base + "/" + filename
        } -%}
        {%- var RegisterBackendFile = func(fileType string, filename string, content string) (string, error) {
          backendFiles = append(backendFiles, map[string]any{
            "type": fileType, "filename": filename, "content": content,
          })
          return FilePath(fileType, filename), nil
        } -%}
        {#- Two uniform, byte-identical set-timeout lines every backend carries. -#}
        {%- var toMap = FilePath("map", "backend-timeouts.map") -%}
        {%- var beTimeoutSrv = "http-request set-timeout server var(txn.backend_name),concat(|server),map_str_int(" + tostring(toMap) + ") if { var(txn.backend_name),concat(|server),map_str_int(" + tostring(toMap) + ") -m found }" -%}
        {%- var beTimeoutTun = "http-request set-timeout tunnel var(txn.backend_name),concat(|tunnel),map_str_int(" + tostring(toMap) + ") if { var(txn.backend_name),concat(|tunnel),map_str_int(" + tostring(toMap) + ") -m found }" -%}
        {%- var RenderOne = func(path any, svcName string, portRef any, label string) string {
          var resolvedParts = split(ResolveServicePort(ns, svcName, portRef, ingress), " ")
          var port = toint(resolvedParts[0])
          var portName = resolvedParts[1]
          var portId = portName
          if portId == "" { portId = tostring(port) }
          var dedupKey = svcName + "\x00" + portId
          if seenBackends[dedupKey] { return "" }
          seenBackends[dedupKey] = true
          var backendKey = BackendNameIngress(ingress, path)
          var serverOpts = map[string]any{"flags": []any{}, "profile": []any{}, "body": []any{}}
          var directives = AppendLines([]any{}, on_own_lines(render_glob "backend-directives-*" inherit_context))
          var profile = IngressProfile(serverOpts, beTimeoutSrv, beTimeoutTun)
          var body = IngressBody(serverOpts, directives)
          var serverResult = BackendServersResult(svcName, 0, port, serverOpts, portName, backendKey, ns)
          if serverResult["degradedByName"] == true {
            degradedMarkers["degradedBackendRef:" + ns + "/" + svcName + "/" + tostring(serverResult["portName"])] = true
          }
          _ = shared.Publish("owners", backendKey, map[string]any{"backend": backendKey})
          if props["cacheVarnishEnabled"] == true {
            _ = PublishIngressTimeouts(ingress, backendKey, toSlice(serverOpts["profile"]), body)
          }
          var record, text = PrepareBackend(map[string]any{
            "name": backendKey,
            "guid": make_guid("be", backendKey),
            "comments": []any{"# " + label + ": Ingress " + ns + "/" + name + " → Service " + svcName + ":" + tostring(port)},
            "balance": serverOpts | dig("balance") | fallback(nil),
            "hashType": serverOpts | dig("hashType") | fallback(nil),
            "shape": serverOpts | dig("shape") | fallback(nil),
            "defaultServer": DefaultServerArgs(serverOpts),
            "profile": profile,
            "body": body,
            "servers": serverResult["servers"],
          })
          var token, planErr = planRegistry.BackendWhenAny(record, text, "owners", []string{backendKey})
          if planErr != nil { fail(planErr.Error()) }
          return token
        } -%}
        {%- for _, rule := range ingress.Spec.Rules -%}
          {%- for _, path := range rule.Http.Paths -%}
            {%- var svcName = path.Backend.Service.Name -%}
            {%- if svcName != "" -%}
      {{ RenderOne(path, svcName, path.Backend.Service.Port, "Backend for") }}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- var dbSvcName = ingress.Spec.DefaultBackend.Service.Name -%}
        {%- if dbSvcName != "" -%}
          {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} -%}
      {{ RenderOne(path, dbSvcName, ingress.Spec.DefaultBackend.Service.Port, "Default backend for") }}
        {%- end -%}
        {%- var degraded = []any{} -%}
        {%- for _, marker := range keys(degradedMarkers) -%}
          {%- degraded = append(degraded, marker) -%}
          {{- shared.Publish("degraded", marker, true) -}}
        {%- end -%}
        {%- if len(backendFiles) > 0 || len(degraded) > 0 -%}
          {{- shared.Publish("effects", effectPrefix + "/" + ns + "/" + name, map[string]any{
            "phase": effectPrefix, "files": backendFiles, "degraded": degraded,
          }) -}}
        {%- end -%}
      {% end %}

  util-generate-annotation-default-backend:
    template: |-
      {%- import "util-backend" for AppendLines, DefaultServerArgs, PrepareBackend -%}
      {%- import "util-ingress-timeout-metadata" for PublishIngressTimeouts -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {% macro GenerateAnnotationDefaultBackend(ingress *resources.ingresses.T, svcNs string,
        svcName string, port int, portName string, backendName string, effectPrefix string,
        comment string) string %}
        {%- var backendFiles = []any{} -%}
        {%- var FilePath = func(fileType string, filename string) string {
          var base = tostring(props["fileDir"])
          if fileType == "map" {
            base = tostring(props["mapDir"])
          } else if fileType == "cert" || fileType == "crt-list" {
            base = tostring(props["certDir"])
          }
          if base == "" { return filename }
          return base + "/" + filename
        } -%}
        {%- var RegisterBackendFile = func(fileType string, filename string, content string) (string, error) {
          backendFiles = append(backendFiles, map[string]any{
            "type": fileType, "filename": filename, "content": content,
          })
          return FilePath(fileType, filename), nil
        } -%}
        {%- var serverOpts = map[string]any{"flags": []any{}, "profile": []any{}, "body": []any{}} -%}
        {%- var path = map[string]any{"backend": map[string]any{"service": map[string]any{
          "name": svcName, "port": map[string]any{"number": port},
        }}} -%}
        {%- var directives = AppendLines([]any{}, on_own_lines(render_glob "backend-directives-*" inherit_context)) -%}
        {%- var profile = []any{} -%}
        {%- for _, line := range toSlice(serverOpts["profile"]) -%}{%- profile = append(profile, line) -%}{%- end -%}
        {%- var body = []any{} -%}
        {%- for _, line := range toSlice(serverOpts["body"]) -%}{%- body = append(body, line) -%}{%- end -%}
        {%- for _, line := range directives -%}{%- body = append(body, line) -%}{%- end -%}
        {%- var serverResult = BackendServersResult(svcName, 0, port, serverOpts, portName, backendName, svcNs) -%}
        {%- var degraded = []any{} -%}
        {%- if serverResult["degradedByName"] == true -%}
          {%- degraded = append(degraded, "degradedBackendRef:" + svcNs + "/" + svcName + "/" + tostring(serverResult["portName"])) -%}
          {{- shared.Publish("degraded", tostring(degraded[0]), true) -}}
        {%- end -%}
        {{- shared.Publish("owners", backendName, map[string]any{"backend": backendName}) -}}
        {%- if props["cacheVarnishEnabled"] == true -%}
          {{- PublishIngressTimeouts(ingress, backendName, profile, body) -}}
        {%- end -%}
        {%- if len(backendFiles) > 0 || len(degraded) > 0 -%}
          {{- shared.Publish("effects", effectPrefix + "/" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name,
            map[string]any{"phase": effectPrefix, "files": backendFiles, "degraded": degraded}) -}}
        {%- end -%}
        {%- var record, text = PrepareBackend(map[string]any{
          "name": backendName,
          "guid": make_guid("be", backendName),
          "comments": []any{comment},
          "balance": serverOpts | dig("balance") | fallback(nil),
          "hashType": serverOpts | dig("hashType") | fallback(nil),
          "shape": serverOpts | dig("shape") | fallback(nil),
          "defaultServer": DefaultServerArgs(serverOpts),
          "profile": profile,
          "body": body,
          "servers": serverResult["servers"],
        }) -%}
        {%- var token, planErr = planRegistry.BackendWhenAny(record, text, "owners", []string{backendName}) -%}
        {%- if planErr != nil -%}{{ fail(planErr.Error()) }}{%- end -%}
        {{- token -}}
      {% end %}

  util-ingress-backend-bindings:
    template: |-
      {%- var mapDir, mapErr = pathResolver.GetPath("", "map") -%}
      {%- if mapErr != nil -%}{{ fail(tostring(mapErr)) }}{%- end -%}
      {%- var fileDir, fileErr = pathResolver.GetPath("", "file") -%}
