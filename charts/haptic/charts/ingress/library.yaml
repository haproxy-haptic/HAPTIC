  pathitems-default-501-ingress:
    requires: [ingresses, services]
    incremental:
      source: ingresses
      group: ingress-default-backends
      consumes: [ingress-default-backend-candidates]
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
      {%- if ingress.Spec.DefaultBackend.Service -%}
        {%- var id = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var hostKeys = []any{} -%}
        {%- if len(ingress.Spec.Rules) == 0 -%}
          {%- hostKeys = append(hostKeys, "") -%}
        {%- else -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- hostKeys = append(hostKeys, MapKeyForHost(rule.Host)) -%}
          {%- end -%}
        {%- end -%}
        {%- var seen = map[string]bool{} -%}
        {%- for _, host := range hostKeys -%}
          {%- var hostKey = tostring(host) -%}
          {%- if seen[hostKey] -%}{%- continue -%}{%- end -%}
          {%- seen[hostKey] = true -%}
          {%- var publicationKey = hostKey -%}
          {%- if publicationKey == "" -%}{%- publicationKey = "\x00" -%}{%- end -%}
          {%- var winner, found = shared.Select("ingress-default-backend-candidates", "hosts", publicationKey) -%}
          {%- if !found || dig_string(winner, "", "owner") != id -%}{%- continue -%}{%- end -%}
          {%- var path = map[string]any{"backend": ingress.Spec.DefaultBackend} %}
      # Ingress: {{ ingress.Metadata.Namespace }}/{{ ingress.Metadata.Name }} (defaultBackend → "{{ hostKey }}/")
      {{ hostKey }}/ BACKEND:{{ BackendNameIngress(ingress, path) }}
        {%- end -%}
      {%- end -%}
      {%- end -%}


  # Feeds backend-service.map (<backend> -> <ns>/<svc>) so the namespace/service
  # access-log fields need no per-backend `set-var` lines — which is what lets an
  # ingress backend stay dynamic (empty body). Mirrors the generator's iteration
  # and backend naming, deduped per backend name.
  map-backend-service-100-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%%
        var ingress = item
        var ns = dig_string(ingress, "", "metadata", "namespace")
        for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
          for _, path := range toSlice(dig(rule, "http", "paths")) {
            var svc = dig_string(path, "", "backend", "service", "name")
            if svc == "" {
              continue
            }
            var be = BackendNameIngress(ingress, path)
            show shared.Unique("map-backend-service-ingress", be, "\n" + be + " " + ns + "/" + svc)
          }
        }
        var defaultBackend = dig(ingress, "spec", "defaultBackend")
        var dbSvc = dig_string(defaultBackend, "", "service", "name")
        if dbSvc != "" {
          var dbPath = map[string]any{"backend": defaultBackend}
          var be = BackendNameIngress(ingress, dbPath)
          show shared.Unique("map-backend-service-ingress", be, "\n" + be + " " + ns + "/" + dbSvc)
        }
      %%}

  util-ingress-timeout-metadata:
    template: |-
      {%- import "util-backend-timeouts" for BackendTimeouts -%}
      {% macro PublishIngressTimeouts(ingress any, backendKey string, profile []any, body []any) string %}
        {{- shared.Publish("timeouts", backendKey, BackendTimeouts(map[string]any{}, append(profile, body...))) -}}
        {%- for _, line := range split(on_own_lines(render_glob "backend-timeout-metadata-*" inherit_context), "\n") -%}
          {%- if trimSpace(line) == "" -%}{%- continue -%}{%- end -%}
          {%- var fields = split(line, " ") -%}
          {{- shared.Publish("timeout-overrides", backendKey + "|" + line, map[string]any{fields[0]: toint(fields[1])}) -}}
        {%- end -%}
