    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend default_web-ingress_svc_web-svc_80"}

  test-ingress-named-port:
    description: Ingress backend referencing the service port by name (port.name) must resolve to the correct numeric pod port, not fall back to 80
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: unifi, namespace: default}
          spec:
            ports:
              - {name: https-gui, port: 8443, targetPort: https-gui}
              - {name: controller, port: 8080, targetPort: controller}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: unifi-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: unifi
          addressType: IPv4
          endpoints:
