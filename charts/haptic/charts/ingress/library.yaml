      {%- for _, bucket := range []string{"timeouts", "timeout-overrides"} -%}
        {%- for _, entry := range incremental_values("ingress-backends", bucket) -%}
          {%- for key, value := range entry.(map[string]any) -%}
            {{- key + " " + tostring(value) + "\n" -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Emits one Ingress's validated timeout map contributions for annotation libraries.
  util-ingress-backend-timeout:
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-haproxy-duration" for HAProxyDurationMs -%}
      {% macro IngressBackendTimeoutMapEntries(ingress any, serverAnn string, tunnelAnn string) %}
      {%%
        var anns = []string{serverAnn, tunnelAnn}
        var kinds = []string{"server", "tunnel"}
        for i := 0; i < len(anns); i++ {
          var ann = anns[i]
          var kind = kinds[i]
          if ann == "" {
            continue
          }
          var v = dig_string(ingress, "", "metadata", "annotations", ann)
          if v == "" {
            continue
          }
          var ms = HAProxyDurationMs(v)
          if ms == "" {
            var key = dig_string(ingress, "", "metadata", "namespace") + "/" + dig_string(ingress, "", "metadata", "name")
            var message = "Annotation '" + ann + "' on Ingress '" + key + "' has value '" + v + "', which is not an HAProxy duration; the timeout is not applied. Use a value like 30s, 1m or 2000ms."
            if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
              fail(message)
            } else {
              recordEvent(ingress, "InvalidTimeout", message)
            }
            continue
          }
          for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
            for _, path := range toSlice(dig(rule, "http", "paths")) {
              var be = BackendNameIngress(ingress, path)
              show shared.Unique("map-backend-timeout", be + "|" + kind, "\n" + be + "|" + kind + " " + ms)
            }
          }
        }
      %%}
      {% end %}

  util-ingress-header-publish:
    template: |-
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {% macro PublishIngressHeaderContributions(ingress *resources.ingresses.T, reqAnn string, respAnn string, recordSep string, kvSep string, rankPrefix string) %}
      {%%
        var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name
        var seen = map[string]bool{}
        var contribute = func(ann string, bucket string) {
          if ann == "" {
            return
          }
          var annVal = ingress.Metadata.Annotations[ann]
          if annVal == "" {
            return
          }
          for _, rec := range split(annVal, recordSep) {
            var t = trimSpace(rec)
            if t == "" || !strings_contains(t, kvSep) {
              continue
            }
            var parts = split(t, kvSep)
            var hn = trimSpace(parts[0])
            var hv = trimSpace(parts[1:] | join(kvSep))
            if hn == "" {
              continue
            }
            if !regex_search(hn, "^[A-Za-z0-9!$&*+.^_~-]+$") {
              _ = WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation '" + ann + "' on Ingress '" + key + "' names header '" + hn + "', which is not an HTTP token; the header is skipped. Use letters, digits and -._~!$&*+^.")
              continue
            }
            if ConfigInjectionKind(hv, "line") != "" {
              _ = WebhookRejectOrWarn(ingress, "InvalidAnnotation", "Annotation '" + ann + "' on Ingress '" + key + "' has a value containing " + ConfigInjectionKind(hv, "line") + ", which would split the frontend directive; the header is not applied. Remove control characters from the value.")
              continue
            }
            for _, rule := range ingress.Spec.Rules {
              for _, path := range rule.Http.Paths {
                var be = BackendNameIngress(ingress, path)
                var lower = toLower(hn)
                var identity = bucket + "\x00" + be + "\x00" + lower
                if seen[identity] {
                  continue
                }
                seen[identity] = true
                _ = shared.PublishRanked(bucket, be + "|set|" + lower, rankPrefix + "/" + key,
                  map[string]any{"backend": be, "op": "set", "name": hn, "value": hv})
              }
            }
          }
        }
        contribute(reqAnn, "ingReqHeaderMods")
        contribute(respAnn, "ingRespHeaderMods")
      %%}
      {% end %}

  util-ingress-host-match-publication:
    template: |-
      {%- var IngressHostMatchPublication = func(hosts []string, fileDir string) map[string]any {
        var condition = "{ var(txn.host) -m str " + join(hosts, " ") + " }"
        var result = map[string]any{"condition": condition}
        if len(hosts) > 30 {
          var content = join(hosts, "\n") + "\n"
          var filename = "host-match-" + md5(content) + ".lst"
          result["condition"] = "{ var(txn.host) -m str -f " + fileDir + "/" + filename + " }"
          result["file"] = map[string]any{"filename": filename, "content": content}
        }
        return result
      } -%}

  ingress-header-mods-9999-declaration:
    incremental:
      bindingsTemplate: '{}'
      group: ingress-header-mods
      effects: [publishValue]
    template: '{{- "" -}}'

  features-301-ingress-header-mods:
    template: |-
      {{- render_glob "ingress-header-mods-*" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("ingress-header-mods", "ingReqHeaderMods") -%}
        {%- gf["ingReqHeaderMods"] = append(toSlice(gf["ingReqHeaderMods"]), entry) -%}
      {%- end -%}
      {%- for _, entry := range incremental_values("ingress-header-mods", "ingRespHeaderMods") -%}
        {%- gf["ingRespHeaderMods"] = append(toSlice(gf["ingRespHeaderMods"]), entry) -%}
      {%- end -%}

  # Reload-free ingress request/response header modifiers. The annotation
  # libraries append {backend, op, name, value} to gf["ingReqHeaderMods"] /
  # gf["ingRespHeaderMods"] in their features-* snippets; this builds
  # ing-reqhdr.map / ing-reshdr.map (key `<backend>|<op>|<name>`, value
  # URL-encoded, `1` for del) once per render and emits one static set/add/del
  # line per distinct header NAME, keyed on the resolved backend. Adding a route
  # that reuses a header name is then a map entry, not a config line — the reload
  # this machinery avoids. The maps are registered whenever ingresses exist, so
  # the first header in the cluster is a map entry too, and the static lines read
  # backend_name, so a backendRef-style per-backend override is a map entry.
  frontend-filters-263-ingress-headers:
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {%- import "util-header-modifier-rules" for HeaderModifierRules -%}
      {%- if shared.Get("globalFeatures").(map[string]any)["haveIngresses"] != true %}{% return %}{% end -%}
      {%%
        // Capture the result of the single compute call directly — do not follow
        // it with a `func() any { return nil }` read-back, which would cache nil
        // permanently for this render if it ever ran before the write.
        var hmVal, _ = shared.ComputeIfAbsent("ingressHeaderMaps", func() any {
          var gf = shared.Get("globalFeatures").(map[string]any)
          // Smallest spelling per lowercased name wins, so two ingresses spelling
          // one header differently share one static line and the choice does not
          // depend on ingress order. `1` marks a del; set/add carry the value.
          var build = func(mods any, mapName string) map[string]any {
            var names = map[string]any{"set": map[string]string{}, "add": map[string]string{}, "del": map[string]string{}}
            var entries = []string{"# <backend>|set|add|del|<header> -> URL-encoded value (1 for del)"}
            for _, e := range toSlice(mods) {
              var be = tostring(dig(e, "backend"))
              var op = tostring(dig(e, "op"))
              var name = tostring(dig(e, "name"))
              var lower = toLower(name)
              var m = names[op].(map[string]string)
              var cur, seen = m[lower]
              if !seen || name < cur {
                m[lower] = name
              }
              if op == "del" {
                entries = append(entries, be + "|del|" + lower + " 1")
              } else {
                entries = append(entries, be + "|" + op + "|" + lower + " " + queryEscape(tostring(dig(e, "value"))))
              }
            }
            var display = func(op string) []string {
              var m = names[op].(map[string]string)
              var lowered = []any{}
              for _, k := range keys(m) {
                lowered = append(lowered, k)
              }
              var out = []string{}
              for _, k := range sort_strings(lowered) {
                out = append(out, m[tostring(k)])
              }
              return out
            }
            return map[string]any{"path": RegisterMap(mapName, entries, map[string]any{"ordered": false}),
              "set": display("set"), "add": display("add"), "del": display("del")}
          }
          return map[string]any{"req": build(gf["ingReqHeaderMods"], "ing-reqhdr.map"),
            "res": build(gf["ingRespHeaderMods"], "ing-reshdr.map")}
        })
      %%}
      {%- var hm = hmVal.(map[string]any) %}
      {%- var req = hm["req"].(map[string]any) %}
      {%- var res = hm["res"].(map[string]any) %}
      {{- HeaderModifierRules("request", "var(txn.backend_name)", tostring(req["path"]), req["set"].([]string), req["add"].([]string), req["del"].([]string)) -}}
      {{- HeaderModifierRules("response", "var(txn.backend_name)", tostring(res["path"]), res["set"].([]string), res["add"].([]string), res["del"].([]string)) -}}

  status-patches-190-ingress-addresses:
    requires: [controller_services]
    incremental:
      bindingsTemplate: '{%- if extraContext | dig("statusPatches", "enabled") | fallback(true) -%}{"controller_services":{}}{%- else -%}{}{%- end -%}'
      group: ingress-status-addresses
      effects: [publishValue]
    template: |-
      {%%
        for _, address := range item | dig("status", "loadBalancer", "ingress") | toSlice() {
          var ip = dig_string(address, "", "ip")
          var hostname = dig_string(address, "", "hostname")
          if ip == "" && hostname == "" {
            continue
          }
          var clean = map[string]any{}
          if ip != "" {
            clean["ip"] = ip
          }
          if hostname != "" {
            clean["hostname"] = hostname
          }
          shared.Publish("loadBalancer", ip + "/" + hostname, clean)
        }
        for _, address := range item | dig("spec", "clusterIPs") | toSlice() {
          var ip = tostring(address)
          if ip != "" && ip != "None" {
            shared.Publish("cluster", ip, map[string]any{"ip": ip})
          }
        }
      %%}

  status-patches-200-ingress:
    requires: [ingresses, controller_services]
    incremental:
      bindingsTemplate: '{%- if extraContext | dig("statusPatches", "enabled") | fallback(true) -%}{"ingresses":{}}{%- else -%}{}{%- end -%}'
      group: ingress-status-patches
      consumes: [ingress-status-addresses]
      effects: [statusPatch]
    template: |-
      {%%
        var addresses = shared.SelectValues("ingress-status-addresses", "loadBalancer")
        if len(addresses) == 0 {
          addresses = shared.SelectValues("ingress-status-addresses", "cluster")
        }
        statusPatch(item, map[string]any{
            "deployed": map[string]any{
              "loadBalancer": map[string]any{
                "ingress": addresses,
              },
            },
            "deployFailed": map[string]any{
              "loadBalancer": map[string]any{
                "ingress": []any{},
              },
            },
          })
      %%}

  k8sitems-ingress-degraded-backend-events:
    requires: [ingresses]
    incremental:
      source: ingresses
      group: ingress-degraded-backend-events
      consumes: [ingress-backends]
    template: |-
      {%%
        var ingress = resources.ingresses.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        var ns = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        if ingress != nil && ns != "" && name != "" {
          var refs = ingress.Spec.Rules | flat_map(r => r.Http.Paths) | map(p => p.Backend.Service)
          refs = append(refs, ingress.Spec.DefaultBackend.Service)
          refs = refs | reject(s => s.Name == "" || s.Port.Name == "") |
            unique_by(s => s.Name + "/" + s.Port.Name)
          var degraded = []string{}
          for _, ref := range refs {
            var marker = "degradedBackendRef:" + ns + "/" + ref.Name + "/" + ref.Port.Name
            var _, found = shared.Select("ingress-backends", "degraded", marker)
            if found {
              degraded = append(degraded,
                "Service '" + ns + "/" + ref.Name + "' (port name '" + ref.Port.Name + "')")
            }
          }
          if len(degraded) > 0 {
            var evName = name + ".backend-unresolved"
            if len(evName) > 253 {
              evName = "backend-unresolved-" + sha256(name)[:32]
            }
            var resource = map[string]any{
              "apiVersion": "v1",
              "kind":       "Event",
              "metadata": map[string]any{"name": evName, "namespace": ns},
              "involvedObject": map[string]any{
                "apiVersion": "networking.k8s.io/v1",
                "kind":       "Ingress",
                "namespace":  ns,
                "name":       name,
                "uid":        ingress.Metadata.Uid,
              },
              "type":   "Warning",
              "reason": "BackendUnresolved",
              "message": "Backend " + join(degraded, ", ") +
                " not found: a by-name port reference resolves only through the" +
                " Service, so the backend has no endpoints and serves 503 until" +
                " the Service appears. If it never appears, check the Ingress" +
                " backend for a Service-name typo.",
              "lastTimestamp": "HAPTIC_INCREMENTAL_EVENT_LAST_TIMESTAMP",
              "source": map[string]any{"component": "haptic"},
            }
            var rendered = marshalYAML(resource)
            show rendered + "\n---\n"
          }
        }
      %%}

k8sResources:
  ingress-degraded-backend-events:
    template: |-
      {%- var docs = render "k8sitems-ingress-degraded-backend-events" default "" -%}
      {%- if docs != "" -%}
        {%- var lastSeen = cycleTimeBucket(1200, "2006-01-02T15:04:05Z07:00") -%}
        {{- replaceAll(trimSuffix(docs, "\n---\n"), "HAPTIC_INCREMENTAL_EVENT_LAST_TIMESTAMP", lastSeen) -}}
      {%- end -%}

validationTests:
  test-gateway-frontend-blocks-absent-without-routes:
    requires: [ingresses]
    description: >-
      An Ingress-only fleet has no Gateway and no route, so none of the
      Gateway frontend blocks is emitted.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: plain, namespace: default}
          spec:
            ingressClassName: haptic
            rules:
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: app, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:path-prefix.map, pattern: "plain.example.com/ BACKEND:"}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-extra-misdirected$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-matchers-advanced-010-route-id-setup$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-matchers-advanced-900-path-match$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-redirect$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-urlrewrite$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-mirror$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/mirror-buffer:'}

  test-ingress-host-map-incremental-order-and-duplicates:
    description: Cold incremental host-map rendering keeps resource and rule order without removing duplicate host lines.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: z-last, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: duplicate.example.com
                http: {paths: []}
              - host: last.example.com
                http: {paths: []}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: a-first, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: second.example.com
                http: {paths: []}
              - host: duplicate.example.com
                http: {paths: []}
    assertions:
      - type: haproxy_valid
      - {type: match_count, target: map:host.map, pattern: '(?m)^# ingress/map-host-ingress$', expected: "1"}
      - {type: match_count, target: map:host.map, pattern: '(?m)^duplicate\.example\.com duplicate\.example\.com$', expected: "2"}
      - type: contains
        target: map:host.map
        pattern: '(?m)^# ingress/map-host-ingress$\n\n# Ingress: default/a-first \(2 hosts\)$\n\nsecond\.example\.com second\.example\.com$\n\nduplicate\.example\.com duplicate\.example\.com$\n\n# Ingress: default/z-last \(2 hosts\)$\n\nduplicate\.example\.com duplicate\.example\.com$\n\nlast\.example\.com last\.example\.com$'

  test-ingress-host-map-incremental-empty:
    description: An empty Ingress store emits no Ingress host-map header.
    fixtures: {}
    assertions:
      - {type: not_contains, target: map:host.map, pattern: '(?m)^# ingress/map-host-ingress$'}

  test-ingress-backend-service-map-incremental-order-and-dedup:
    description: Incremental backend-service entries retain resource order and deduplicate repeated backends.
    fixtures:
      services:
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: alpha}, spec: {ports: [{name: http, port: 80}]}}
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: fallback}, spec: {ports: [{name: alternate, port: 8080}]}}
        - {apiVersion: v1, kind: Service, metadata: {namespace: default, name: zeta}, spec: {ports: [{name: web, port: 80}]}}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: z-last}
          spec:
            ingressClassName: haproxy
            rules:
              - host: z.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: zeta, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: a-first}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: fallback, port: {number: 8080}}}
            rules:
              - host: a.example.com
                http:
                  paths:
                    - {path: /one, pathType: Prefix, backend: {service: {name: alpha, port: {number: 80}}}}
                    - {path: /two, pathType: Prefix, backend: {service: {name: alpha, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:backend-service.map
        pattern: '(?m)^default_a-first_svc_alpha_http default/alpha\ndefault_a-first_svc_fallback_alternate default/fallback\ndefault_z-last_svc_zeta_web default/zeta$'
      - {type: match_count, target: map:backend-service.map, pattern: '(?m)^default_a-first_svc_alpha_http ', expected: "1"}

  test-render-plan-many-backends-leave-no-tokens:
    description: >-
      Every generated backend is registered and spliced back in place: the
      sections are complete and no placeholder line reaches HAProxy.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: shop-svc, namespace: default}
          spec:
            ports: [{name: http, port: 80, targetPort: 8080}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: plan-a, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: a.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: shop-svc, port: {number: 80}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: plan-b, namespace: default}
          spec:
            ingressClassName: haproxy
            defaultBackend: {service: {name: shop-svc, port: {number: 80}}}
            rules:
              - host: b.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "@haptic:"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^backend default_plan-a_svc_shop-svc_http from haptic-be-\w+$\n\s+guid be:default_plan-a_svc_shop-svc_http$'
      - {type: contains, target: haproxy.cfg, pattern: "backend default_plan-b_svc_echo_80"}
      - {type: contains, target: haproxy.cfg, pattern: "backend default_plan-b_svc_shop-svc_http"}

  test-ingress-duplicate-backend-different-ports:
    description: Ingress with multiple paths to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-svc, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
              - {name: admin, port: 81, targetPort: 8081}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: multi-port, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 80}}}
                    - path: /admin
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 81}}}
                    - path: /app
                      pathType: Prefix
                      backend: {service: {name: api-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend default_multi-port_svc_api-svc_http"}

      - {type: contains, target: haproxy.cfg, pattern: "backend default_multi-port_svc_api-svc_admin"}

      - type: match_count
        target: haproxy.cfg
        pattern: "backend default_multi-port_svc_api-svc_"
        expected: "2"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/api/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/admin/ BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix.map
        pattern: "example.com/app/ BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/api BACKEND:default_multi-port_svc_api-svc_http"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/admin BACKEND:default_multi-port_svc_api-svc_admin"

      - type: contains
        target: map:path-prefix-exact.map
        pattern: "example.com/app BACKEND:default_multi-port_svc_api-svc_http"

      - {type: not_contains, target: map:host.map, pattern: "hosts\\)\\S"}

      - {type: not_contains, target: map:path-prefix.map, pattern: "paths\\)\\S"}

      - {type: not_contains, target: map:path-prefix-exact.map, pattern: "paths\\)\\S"}

      - {type: contains, target: map:host.map, pattern: "(?m)^example\\.com example\\.com$"}

      - {type: contains, target: map:path-prefix.map, pattern: "(?m)^example\\.com/api/ BACKEND:"}

      - {type: contains, target: map:path-prefix-exact.map, pattern: "(?m)^example\\.com/api BACKEND:"}

  test-ingress-tls-basic:
    description: Ingress with spec.tls should register TLS certificates
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: example-tls, namespace: default}
          data:
            tls.crt: 
            tls.key: 
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: tls-ingress, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - example.com
                  - www.example.com
                secretName: example-tls
            rules:
              - host: example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: crt-list:certificate-list.txt
        pattern: "default_example-tls\\.pem \\[ocsp-update on\\] example\\.com www\\.example\\.com"

      - {type: contains, target: cert:default_example-tls.pem, pattern: "BEGIN CERTIFICATE"}

  test-ingress-default-https:
    description: "A plain Ingress with no spec.tls is served over HTTPS by default — the chart binds its https port and terminates TLS with the default certificate (extraContext.ingressDefaultHTTPS defaults true). See features-100-ingress-bind."
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^frontend https$"}
      - {type: contains, target: haproxy.cfg, pattern: "bind \\*:443 ssl crt-list"}

  test-ingress-default-https-disabled:
    description: "extraContext.ingressDefaultHTTPS=false keeps a plain Ingress (no spec.tls) plaintext-only — no https frontend is emitted even though the default certificate is configured. See features-100-ingress-bind."
    extraContext: {ingressDefaultHTTPS: false}
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^frontend https$"}

  test-ingress-default-ssl-redirect:
    description: "extraContext.ingressDefaultSSLRedirect=true redirects every HTTPS-served Ingress host from HTTP to HTTPS with the configured code (default 308), reusing the shared ssl-redirect map. See features-105-ingress-ssl-redirect."
    extraContext: {ingressDefaultSSLRedirect: true}
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "http-request redirect scheme https code 308 if !\\{ ssl_fc \\}"
      - {type: contains, target: map:ssl-redirect-308.map, pattern: "(?m)^plain\\.example\\.com 1$"}

  test-ingress-default-ssl-redirect-disabled:
    description: "By default (ingressDefaultSSLRedirect unset) an HTTPS-served Ingress emits no global HTTP→HTTPS redirect — the feature is opt-in. See features-105-ingress-ssl-redirect."
    fixtures: *fixturesPlainPlainExampleCom
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "redirect scheme https"}

  test-ingress-default-ssl-redirect-per-host:
    description: "With the default-HTTPS bind off (ingressDefaultHTTPS=false), the global redirect only registers hosts that carry their own certificate: a partly-TLS Ingress redirects its spec.tls host but not its bare host, which isn't served over HTTPS. See features-105-ingress-ssl-redirect."
    extraContext: {ingressDefaultHTTPS: false, ingressDefaultSSLRedirect: true}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: partial-tls, namespace: default}
          spec:
            ingressClassName: haproxy
            tls:
              - hosts:
                  - secure.example.com
                secretName: shared-tls
            rules:
              - host: secure.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
              - host: plain.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:ssl-redirect-308.map, pattern: "(?m)^secure\\.example\\.com 1$"}
      - {type: not_contains, target: map:ssl-redirect-308.map, pattern: "plain\\.example\\.com"}

  test-ingress-servers-named-after-pods:
    description: >-
      Endpoints become one server each, named after the pod (no slot pool, no
      placeholders): a rolling update is add/remove of named servers at runtime.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: pool-svc, namespace: default}
          spec: *specPortsPort
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: pool-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: pool-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef: {kind: Pod, name: pool-pod-1}
            - addresses: ["10.0.0.2"]
              targetRef: {kind: Pod, name: pool-pod-2}
          ports:
            - {port: 8080, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: pool-test, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: pool-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pool-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server pool-pod-1 10\.0\.0\.1:8080 .*# Pod: pool-pod-1$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server pool-pod-2 10\.0\.0\.2:8080 .*# Pod: pool-pod-2$'}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^\s+server pool-pod-[12] ', expected: "2"}
      - {type: not_contains, target: haproxy.cfg, pattern: 'server SRV_[0-9]'}
      - {type: not_contains, target: haproxy.cfg, pattern: '192\.0\.2\.1:1'}

  test-ingress-server-name-collision-and-bound:
    description: >-
      Two endpoints whose names sanitise to the same server name (a custom
      source may hold `alpha/one` and `alpha:one`, both → `alpha-one`) render
      TWO distinct servers — the second is suffixed `-2`, never dropped. A name
      at the 63-byte limit that is then suffixed stays within 63 bytes, because
      ServerName caps the base at 59 to reserve the suffix room.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: coll-svc, namespace: default}
          spec: *specPortsPort
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: coll-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: coll-svc
          addressType: IPv4
          endpoints:
            # Distinct source names that sanitise to the same string.
            - addresses: ["10.0.0.1"]
              targetRef: {kind: Pod, name: alpha/one}
            - addresses: ["10.0.0.2"]
              targetRef: {kind: Pod, name: alpha:one}
            # One pod under two addresses whose name is 63 bytes: sanitised to
            # 59, the suffixed repeat must stay within the 63-byte bound.
            - addresses: ["10.0.0.3", "10.0.0.4"]
              targetRef: {kind: Pod, name: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz}
          ports:
            - {port: 8080, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: coll-test, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: coll-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: coll-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # Distinct names sanitising alike: both servers present, none dropped.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server alpha-one 10\.0\.0\.1:8080 '}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server alpha-one-2 10\.0\.0\.2:8080 '}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^\s+server alpha-one', expected: "2"}
      # 63-byte name truncated to 59; the suffixed repeat is 61 bytes (≤ 63).
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server z{59} 10\.0\.0\.3:8080 '}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server z{59}-2 10\.0\.0\.4:8080 '}
      # No server name keeps 60+ of the source bytes: the base was capped at 59.
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^\s+server z{60}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'server SRV_[0-9]'}

  test-ingress-endpoint-conditions-filter:
    description: |
      EndpointSlice entries with conditions.ready=false (pod starting up) or
      conditions.terminating=true (pod being shut down) become `disabled`
      servers, not dropped: they take no traffic (so no 503 SC-- to a
      not-yet-listening or draining pod), but a readiness flip is then a runtime
      `set server state`, not a del+add. Ready endpoints carry no state keyword.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: cond-svc, namespace: default}
          spec: *specPortsPort
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: cond-svc-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: cond-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              conditions: {ready: true, serving: true, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-ready}
            - addresses: ["10.0.0.2"]
              conditions: {ready: false, serving: false, terminating: false}
              targetRef: {kind: Pod, name: cond-pod-starting}
            - addresses: ["10.0.0.3"]
              conditions: {ready: false, serving: false, terminating: true}
              targetRef: {kind: Pod, name: cond-pod-terminating}
            # Absent conditions means Ready=true per the EndpointSlice spec.
            - addresses: ["10.0.0.4"]
              targetRef: {kind: Pod, name: cond-pod-noconds}
          ports:
            - {port: 8080, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {name: cond-test, namespace: default}
          spec:
            ingressClassName: haproxy
            rules:
              - host: cond-test.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: cond-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid

      # Ready endpoints: named servers ending in the pod comment — no state
      # keyword between the guid and the comment (RE2 has no lookahead).
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server cond-pod-ready 10\.0\.0\.1:8080 guid \S+  # Pod: cond-pod-ready$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server cond-pod-noconds 10\.0\.0\.4:8080 guid \S+  # Pod: cond-pod-noconds$'}

      # Not-ready and terminating endpoints: present, but disabled (take no traffic).
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server cond-pod-starting 10\.0\.0\.2:8080 .*disabled'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+server cond-pod-terminating 10\.0\.0\.3:8080 .*disabled'}

  test-ingress-status-patches:
    description: Ingress status patches register LoadBalancer addresses from controller service
    fixtures:
      controller_services:
        - apiVersion: v1
          kind: Service
          metadata:
            name: haptic-haproxy
            namespace: haptic-system
            labels:
              app.kubernetes.io/name: haptic
              app.kubernetes.io/component: loadbalancer
          spec: {type: LoadBalancer}
