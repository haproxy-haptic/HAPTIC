                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend default_slots-ingress_svc_echo_80 from haptic-be-"}
      - {type: not_contains, target: haproxy.cfg, pattern: "server SRV_[0-9]"}

  # ---------------------------------------------------------------------------
  # Config-injection guards (#157, phase 2). The centralized utilities are behavior-
  # tested once in base/library.yaml (phase 1); these are wiring checks. One hostile
  # fixture drives every routing guard at once (a shared ZZINJECT marker must never
  # reach the config); positive fixtures prove the load-bearing special cases
  # (single-quoted regex origin, %→%% header value, \N path backref, escaped realm);
  # the security sites fail closed.
  # ---------------------------------------------------------------------------

  test-haproxytech-injection-routing-warns-and-skips:
    description: Every haproxy.org routing value carrying an injection payload is skipped (reconcile), so the ZZINJECT marker never reaches the config; a single unguarded site would leak it.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: inj-a
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "https://ok.example.com"
              haproxy.org/cors-allow-methods: "GET\nZZINJECT"
              haproxy.org/timeout-server: "30s\nZZINJECT"
              haproxy.org/load-balance: "hdr(x-session-id)\nZZINJECT"
              haproxy.org/check-http: "/h\nZZINJECT"
              haproxy.org/check-interval: "10s\nZZINJECT"
              haproxy.org/cookie-persistence: "SID\nZZINJECT"
              haproxy.org/path-rewrite: "/a\nZZINJECT"
              haproxy.org/server-proto: "h2\nZZINJECT"
              haproxy.org/request-set-header: "X-Inj ZZINJECT\tval"
              haproxy.org/response-set-header: "Y-Inj ZZINJECT\tval"
              haproxy.org/request-capture: "X-Cap ZZINJECT"
          spec: *specTestExampleComRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: inj-b
            annotations:
              haproxy.org/cookie-persistence-no-dynamic: "SID\nZZINJECT"
              haproxy.org/request-capture: "X-ValidCap"
              haproxy.org/request-capture-len: "5\nZZINJECT"
          spec:
            ingressClassName: haproxy
            rules:
              - host: inj-b.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "ZZINJECT"}

  test-haproxytech-guarded-values-render:
    description: Legit values still render correctly through the new guards, including the load-bearing cases — %→%% in a header value, a \N path backreference, and a regex CORS origin whose backslashes reach its map row intact.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ok-be
            annotations:
              haproxy.org/timeout-server: "30s"
              haproxy.org/load-balance: "leastconn"
              haproxy.org/check-interval: "10s"
              haproxy.org/cookie-persistence: "SESSIONID"
              haproxy.org/server-proto: "h2"
              haproxy.org/check-http: "GET /healthz HTTP/1.1"
              haproxy.org/src-ip-header: "X-Real-IP"
              haproxy.org/request-capture: "X-Forwarded-For"
              haproxy.org/request-capture-len: "256"
              haproxy.org/request-set-header: "X-Pct a%b"
              haproxy.org/path-rewrite: "/api/(.*) /v2/\\1"
          spec: *specTestExampleComRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ok-cors
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "https://.*\\.example\\.com"
              haproxy.org/cors-allow-methods: "GET, POST"
              haproxy.org/cors-allow-headers: "X-H%K"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ok-cors.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      # The settable server timeout lives as ms in backend-timeouts.map (reload-free).
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_ok-be_svc_echo_80\|server 30000'}
      - {type: not_contains, target: haproxy.cfg, pattern: "timeout server 30s"}
      - {type: contains, target: haproxy.cfg, pattern: "balance leastconn"}
      - {type: contains, target: haproxy.cfg, pattern: "default-server check inter 10s"}
      - {type: contains, target: haproxy.cfg, pattern: "cookie SESSIONID insert indirect nocache dynamic"}
      - {type: contains, target: haproxy.cfg, pattern: "proto h2"}
      - {type: contains, target: haproxy.cfg, pattern: "option httpchk GET /healthz HTTP/1.1"}
      - {type: contains, target: "map:ing-src-ip-routes.map", pattern: '(?m)^default/ok-be haproxytech:X-Real-IP$'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-src hdr\(X-Real-IP\) if \{ var\(txn\.resource_key\),map\(\S*/ing-src-ip-routes\.map\) -m str "haproxytech:X-Real-IP" \}'}
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Forwarded-For len 256"}
      # Header manipulation is reload-free: the value lives URL-encoded in
      # ing-reqhdr.map (a%b -> a%25b), read by one static line keyed on the backend.
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_ok-be_svc_echo_80\|set\|x-pct a%25b'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-header X-Pct %\[var\(txn\.backend_name\),concat\(\|set\|x-pct\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header X-Pct "a'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path /api/\(\.\*\) /v2/\\1'}
      - {type: contains, target: "map:ing-cors-regex.map", pattern: '(?m)^\^default/ok-cors\\\|\.\*\(https://\.\*\\\.example\\\.com\) 1$'}
      - {type: contains, target: "map:ing-cors-methods.map", pattern: '(?m)^default/ok-cors GET%2c%20POST$'}
      - {type: contains, target: "map:ing-cors-headers.map", pattern: '(?m)^default/ok-cors X-H%25K$'}

  test-haproxytech-request-capture-shared-pair-emitted-once:
    description: Two Ingresses capturing the same header with the same length yield one capture slot per frontend; a second length is a second slot.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cap-a
            annotations:
              haproxy.org/request-capture: "X-Trace-Id"
              haproxy.org/request-capture-len: "64"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cap-a.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cap-b
            annotations:
              haproxy.org/request-capture: |
                X-Trace-Id
                X-Tenant
              haproxy.org/request-capture-len: "64"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cap-b.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cap-c
            annotations:
              haproxy.org/request-capture: "X-Trace-Id"
              haproxy.org/request-capture-len: "128"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cap-c.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Trace-Id len 64"}
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Tenant len 64"}
      - {type: contains, target: haproxy.cfg, pattern: "capture request header X-Trace-Id len 128"}
      # The shared pair is one slot per frontend: the sorted slots never repeat a line.
      - {type: not_contains, target: haproxy.cfg, pattern: 'capture request header X-Trace-Id len 64\n\s*capture request header X-Trace-Id len 64'}

  test-haproxytech-path-rewrite-map-lane:
    description: haproxy.org/path-rewrite prefix strips and the bare form ride the frontend maps; a pattern that is not a prefix strip keeps its backend replace-path.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-strip
            annotations:
              haproxy.org/path-rewrite: "^/api/v1/(.*) /\\1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: strip.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-bare
            annotations:
              haproxy.org/path-rewrite: "/backend"
          spec:
            ingressClassName: haproxy
            rules:
              - host: bare.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-regex
            annotations:
              haproxy.org/path-rewrite: "/api/(.*) /v2/\\1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: regex.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ht_rw_in\) path if \{ var\(txn\.resource_key\),map\(\S*/haproxytech-rewrite-routes\.map\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ht_rw_v\) var\(txn\.resource_key\),concat\(\|,txn\.ht_rw_in\),map_beg\(\S*/haproxytech-rewrite-prefix\.map\) if \{ var\(txn\.ht_rw_in\) -m found \}'}
      - {type: contains, target: haproxy.cfg, pattern: "http-request set-path %\\[var\\(txn\\.ht_rw_v\\),field\\(2,' ',0\\)\\]%\\[var\\(txn\\.ht_rw_rest\\)\\] if \\{ var\\(txn\\.ht_rw_v\\) -m found \\}"}
      - {type: contains, target: "map:haproxytech-rewrite-routes.map", pattern: '(?m)^default/pr-strip 1$'}
      - {type: contains, target: "map:haproxytech-rewrite-routes.map", pattern: '(?m)^default/pr-bare 1$'}
      - {type: not_contains, target: "map:haproxytech-rewrite-routes.map", pattern: 'pr-regex'}
      - {type: contains, target: "map:haproxytech-rewrite-prefix.map", pattern: '(?m)^default/pr-strip\|/api/v1/ 8 /$'}
      - {type: contains, target: "map:haproxytech-rewrite-prefix.map", pattern: '(?m)^default/pr-bare\| 1048576 /backend$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request replace-path /api/\(\.\*\) /v2/\\1'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'replace-path \^/api/v1/'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'replace-path \(\.\*\) /backend'}

  test-haproxytech-cors-origin-single-quote-rejected:
    description: A single quote in the regex cors-allow-origin is denied at admission (it would close the strong-quoted -m reg operand).
    extraContext: {renderMode: admission}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-origin-quote
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "https://ok.example.com' or { always_true } '"
          spec: *specTestExampleComRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "would split the frontend directive"}

  test-haproxytech-src-ip-header-fails-closed:
    description: A control character in src-ip-header fails closed (set-src rewrites the trusted client address; skipping is not an option).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: srcip-bad, annotations: {haproxy.org/src-ip-header: "X-Real-IP\nZZINJECT"}}
          spec: *specTestExampleComRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "haproxy.org/src-ip-header"}
      - {type: contains, target: rendering_error, pattern: "break the set-src directive"}

  test-haproxytech-rate-limit-fails-closed:
    description: A control character in a rate-limit field fails closed (rate limiting must stay enforceable).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rl-bad
            annotations:
              haproxy.org/rate-limit-requests: "10"
              haproxy.org/rate-limit-period: "10s\nZZINJECT"
          spec: *specTestExampleComRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "haproxy.org/rate-limit-period"}
      - {type: contains, target: rendering_error, pattern: "Rate limiting must stay enforceable"}

  test-haproxytech-auth-realm-fails-closed:
    description: A control character in auth-realm fails closed (auth is security-critical).
    fixtures:
      secrets:
        - {apiVersion: v1, kind: Secret, metadata: {namespace: default, name: realm-auth}, type: Opaque, data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: realm-bad
            annotations: {haproxy.org/auth-type: basic-auth, haproxy.org/auth-secret: realm-auth, haproxy.org/auth-realm: "Prod\nZZINJECT"}
          spec: *specTestExampleComRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "haproxy.org/auth-realm"}

  test-haproxytech-auth-realm-quote-escaped:
    description: A double quote in auth-realm is escaped inside the quoted realm string.
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        - {apiVersion: v1, kind: Secret, metadata: {namespace: default, name: realm-auth2}, type: Opaque, data: {admin: JDJ5JDA1JG1OMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: realm-quote
            annotations: {haproxy.org/auth-type: basic-auth, haproxy.org/auth-secret: realm-auth2, haproxy.org/auth-realm: "My\"Realm"}
          spec: *specTestExampleComRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'auth realm "My\\"Realm"'}

  test-haproxytech-server-tls-warning-name-free:
    description: Missing server-ca/server-crt Secrets render name-free warning comments (the tenant Secret name goes only to the Event), so a newline in the reference cannot inject a directive.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: ca-missing, annotations: {haproxy.org/server-ca: "absent-ca\nZZINJECT"}}
          spec: *specTestExampleComRoot
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: {namespace: default, name: crt-missing, annotations: {haproxy.org/server-crt: "absent-crt\nZZINJECT"}}
          spec:
            ingressClassName: haproxy
            rules:
              - host: crt.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "server-ca: referenced Secret not found; upstream verification skipped"}
      - {type: contains, target: haproxy.cfg, pattern: "server-crt: referenced Secret not found; no client certificate presented"}
      - {type: not_contains, target: haproxy.cfg, pattern: "absent-ca"}
      - {type: not_contains, target: haproxy.cfg, pattern: "absent-crt"}
      - {type: not_contains, target: haproxy.cfg, pattern: "ZZINJECT"}

# Consumed by the playground's migration report and the generated tables in
# docs/site/docs/migrating.md; scripts/check-migration-coverage.sh pins drift.
# Upstream haproxytech/kubernetes-ingress also reads many of these on Services and
# ConfigMaps — HAPTIC reads Ingress annotations only, so those don't carry over.
_migrationCoverage:
  - source: haproxytech
    detect:
      ingressClasses: ["haproxy"]
      annotationPrefixes: ["haproxy.org/"]
    annotations:
      haproxy.org/timeout-server:
        status: supported
        note: Mapped to HAProxy's timeout server.
      haproxy.org/timeout-connect:
        status: supported
        note: Mapped to HAProxy's timeout connect.
      haproxy.org/timeout-queue:
        status: supported
        note: Mapped to HAProxy's timeout queue.
      haproxy.org/timeout-tunnel:
        status: supported
        note: Mapped to HAProxy's timeout tunnel.
      haproxy.org/timeout-check:
        status: supported
        note: Mapped to HAProxy's timeout check.
      haproxy.org/load-balance:
        status: supported
        note: roundrobin, static-rr, leastconn, first, source and random, plus parameterized uri/url_param/hdr/rdp-cookie, are accepted; other values fail the render.
      haproxy.org/pod-maxconn:
        status: different
        note: Divided across the number of ready HAProxy pods (quantized to a power of two) rather than applied per-server verbatim; must be a positive integer.
        doc: annotation-support
      haproxy.org/check:
        status: supported
        note: '"true"/"false" toggle health checks; other values fail the render.'
      haproxy.org/check-http:
        status: supported
        note: Emits option httpchk (a bare path becomes GET <path>).
      haproxy.org/check-interval:
        status: supported
        note: Sets the check interval (inter); ignored when check is "false".
      haproxy.org/rate-limit-requests:
        status: supported
        note: Deny threshold that enables rate limiting; exceeding it returns the rate-limit-status-code.
      haproxy.org/rate-limit-period:
        status: supported
        note: Stick-table window (default 1s).
      haproxy.org/rate-limit-size:
        status: supported
        note: Stick-table size (default 100k).
      haproxy.org/rate-limit-status-code:
        status: supported
        note: Deny status (default 403).
      haproxy.org/rate-limit-whitelist:
        status: supported
        note: Comma-separated CIDRs never rate-limited; invalid CIDRs fail the render.
      haproxy.org/ssl-redirect:
        status: supported
        note: '"true" redirects HTTP to HTTPS; the default can be flipped via extraContext.sslRedirectDefault.'
      haproxy.org/ssl-redirect-code:
        status: supported
        note: Redirect status code (default 302).
      haproxy.org/ssl-redirect-port:
        status: supported
        note: Redirects to HTTPS on an explicit port, preserving the request URI, via a reload-free map.
      haproxy.org/request-redirect:
        status: supported
        note: Host-scoped redirect to a URL via a reload-free map.
      haproxy.org/request-redirect-code:
        status: different
        note: Default 302; an invalid code fails the render.
        doc: annotation-support
      haproxy.org/set-host:
        status: supported
        note: Overrides the upstream Host header via a reload-free map.
      haproxy.org/request-set-header:
        status: supported
        note: Newline-separated "name value" pairs set on requests.
      haproxy.org/response-set-header:
        status: supported
        note: Newline-separated "name value" pairs set on responses.
      haproxy.org/path-rewrite:
        status: supported
        note: A single "<from> <to>" pair maps to replace-path; a bare value rewrites the whole path.
      haproxy.org/src-ip-header:
        status: different
        note: Rewrites the source IP from the named header (set-src) for the route, from a per-route map.
        doc: annotation-support
      haproxy.org/request-capture:
        status: supported
        note: Newline-separated fetch expressions captured into the log.
      haproxy.org/request-capture-len:
        status: supported
        note: Capture length for request-capture (default 128).
      haproxy.org/cookie-persistence:
        status: supported
        note: Dynamic cookie-based stickiness.
      haproxy.org/cookie-persistence-no-dynamic:
        status: different
        note: Static (non-dynamic) cookie stickiness; setting it together with cookie-persistence fails the render.
        doc: annotation-support
      haproxy.org/auth-type:
        status: different
        note: Only "basic-auth" is supported; other values fail the render (note the value differs from ingress-nginx's "basic").
        doc: annotation-support
      haproxy.org/auth-secret:
        status: different
        note: Secret format is one key per username with a base64(hash) value — different from ingress-nginx's htpasswd. By default only bcrypt, SHA-256/SHA-512 crypt and yescrypt hashes are accepted; `$1$` (MD5-crypt) is refused. A missing Secret makes the route serve 503 until it appears, and writing such an Ingress is rejected by the admission webhook.
        doc: annotation-support
      haproxy.org/auth-realm:
        status: different
        note: Default "Protected-Content" (matching the upstream controller); spaces in the realm are replaced with dashes, as upstream does.
        doc: annotation-support
      haproxy.org/send-proxy-protocol:
        status: different
        note: proxy, proxy-v1, proxy-v2, proxy-v2-ssl and proxy-v2-ssl-cn map to the matching send-proxy flags; any other value is silently ignored.
        doc: annotation-support
      haproxy.org/server-ssl:
        status: supported
        note: '"true" enables TLS to the upstream (ssl alpn h2,http/1.1 verify none).'
      haproxy.org/server-proto:
        status: supported
        note: Sets the upstream ALPN/proto (e.g. h2).
      haproxy.org/server-ca:
        status: different
        note: Verifies the upstream certificate against the Secret's ca.crt; a missing Secret or missing ca.crt renders a warning comment and silently skips verification instead of failing.
        doc: annotation-support
      haproxy.org/server-crt:
        status: different
        note: Presents a client certificate to the upstream from the Secret; a missing Secret or missing tls.crt/tls.key renders a warning comment and skips the client cert instead of failing.
        doc: annotation-support
      haproxy.org/scale-server-slots:
        status: dropped
        note: Inert; servers are named after their pods (ADR-0011), so there is no slot pool to size. Setting it emits an UnsupportedAnnotation Warning Event.
      haproxy.org/backend-config-snippet:
        status: different
        note: Raw HAProxy directives injected into the backend section. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`.
        doc: annotation-support
      haproxy.org/ssl-passthrough:
        status: supported
        note: SNI-based TCP passthrough; HTTP-level annotations don't apply to passthrough hosts.
      haproxy.org/forwarded-for:
        status: different
        note: '"true" keeps the controller-wide X-Forwarded-For handling, which replaces a client-sent value unless the source is a trusted proxy; "false" forwards the client''s header unchanged; other values fail the render.'
      haproxy.org/allow-list:
        status: different
        note: Host-scoped source-IP allowlist — only gates rules with an explicit host; invalid CIDRs fail the render.
        doc: annotation-support
      haproxy.org/deny-list:
        status: different
        note: Host-scoped source-IP denylist — only gates rules with an explicit host; invalid CIDRs fail the render.
        doc: annotation-support
      haproxy.org/whitelist:
        status: different
        note: Deprecated alias of allow-list, honoured only when allow-list is absent; host-scoped.
        doc: annotation-support
      haproxy.org/blacklist:
        status: different
        note: Deprecated alias of deny-list, honoured only when deny-list is absent; host-scoped.
        doc: annotation-support
      haproxy.org/cors-enable:
        status: supported
        note: Emits the Access-Control-* headers via http-after-response (matching the upstream controller). By default OPTIONS preflights flow to the backend; set cors-respond-to-options "true" to have HAProxy answer them with a 204.
        doc: annotation-support
      haproxy.org/cors-allow-origin:
        status: supported
        note: The value is a regex matched against the request Origin; the Allow-Origin header echoes the matched origin (default "*" allows any). Combining "*" with cors-allow-credentials "true" fails the render.
        doc: annotation-support
      haproxy.org/cors-allow-methods:
        status: supported
        note: Default "*", matching the upstream controller.
        doc: annotation-support
      haproxy.org/cors-allow-headers:
        status: supported
        note: Allowed request headers for preflight responses (default "*").
      haproxy.org/cors-allow-credentials:
        status: supported
        note: Only emitted when "true"; combining it with cors-allow-origin "*" fails the render.
        doc: annotation-support
      haproxy.org/cors-max-age:
        status: supported
        note: Preflight cache duration in seconds; default 5. Unlike the upstream controller, HAPTIC takes a plain integer (seconds), not an HAProxy duration string.
      haproxy.org/cors-respond-to-options:
        status: supported
        note: When "true", HAProxy answers the CORS preflight (OPTIONS) with a 204 instead of forwarding it to the backend, matching the upstream controller.
      haproxy.org/timeout-client:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/timeout-http-request:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/timeout-http-keep-alive:
        status: dropped
        note: A frontend-level timeout owned by HAPTIC's shared frontend, not settable per Ingress.
        doc: annotation-support
      haproxy.org/standalone-backend:
        status: dropped
        note: Not implemented; HAPTIC always shares the backend model.
        doc: annotation-support
