  test-haproxytech-basic-auth-map-lane:
    description: Basic auth rides the frontend map lane — routes on one Secret share its userlist, one auth rule per (userlist, realm) pair selected on the whole map value (spaces dashed as upstream does), one denied_by rule per userlist, and no backend challenge
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: api-auth}
          type: Opaque
          data: {apiuser: JDJ5JDA1JDJlV1VoQVU5Z0VlZ2FDZkY4Uk4xZHV1WUNrdlhoUGtpS1BDL3pkTFBvN2xNYlkxcWlUQXRP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ht-one
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: api-auth
              haproxy.org/auth-realm: "Zone A"
          spec:
            rules:
              - host: one.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 8080}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ht-two
            annotations:
              haproxy.org/auth-type: basic-auth
              haproxy.org/auth-secret: api-auth
          spec:
            rules:
              - host: two.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: api-service, port: {number: 8080}}}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: api-service}
          spec:
            ports:
              - port: 8080
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ht_ba\) var\(txn\.resource_key\),map\(\S*/haproxytech-basic-auth-routes.map\)'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 503 if \{ var\(txn\.ht_ba\) -m str missing \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.denied_by\) str\(basic_auth\) if \{ var\(txn\.ht_ba\) -m beg "ok auth_default_api-auth " \} !\{ http_auth\(auth_default_api-auth\) \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "Zone-A" if \{ var\(txn\.ht_ba\) -m str "ok auth_default_api-auth Zone-A" \} !\{ http_auth\(auth_default_api-auth\) \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request auth realm "Protected-Content" if \{ var\(txn\.ht_ba\) -m str "ok auth_default_api-auth Protected-Content" \} !\{ http_auth\(auth_default_api-auth\) \}'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'unless \{ http_auth\(auth_default_api-auth\) \}'}
      - {type: match_count, target: haproxy.cfg, pattern: "userlist auth_default_api-auth", expected: "1"}
      - {type: contains, target: "map:haproxytech-basic-auth-routes.map", pattern: '(?m)^default/ht-one ok auth_default_api-auth Zone-A$'}
      - {type: contains, target: "map:haproxytech-basic-auth-routes.map", pattern: '(?m)^default/ht-two ok auth_default_api-auth Protected-Content$'}

