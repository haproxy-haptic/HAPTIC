  test-haproxytech-cors-regex-anchor:
    description: CORS non-wildcard origin regex-matches the request Origin and echoes it back (upstream model), and a regex $ anchor must not cause a parse error
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-regex-ingress
            annotations:
              haproxy.org/cors-enable: "true"
              haproxy.org/cors-allow-origin: "^https://(.+\\.)?(dev\\.|test\\.)?example\\.com$"
              haproxy.org/cors-allow-methods: "GET, POST, OPTIONS"
          spec:
            ingressClassName: haproxy
            rules:
              - host: api.example.com
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend: {service: {name: echo, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # The regex origin becomes one regex row keyed by route, its leading ^ kept
      # at the start of the Origin and its escaped dots intact.
      - {type: contains, target: "map:ing-cors-regex.map", pattern: '(?m)\\\|\(https://\(\.\+\\\.\)\?\(dev\\\.\|test\\\.\)\?example\\\.com\$\) 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'concat\(\|,txn\.haproxytech_cors_origin\),map_reg\(\S*/ing-cors-regex\.map\) -m found'}
      - type: contains
        target: haproxy.cfg
        pattern: "Access-Control-Allow-Origin '%\\[var\\(txn\\.haproxytech_cors_origin\\)\\]'"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Access-Control-Allow-Origin"

