templateSnippets:
  ingress-access-control-0700-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/whitelist-source-range']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/denylist-source-range']"
      group: ingress-access-control
      effects: [publishValue, recordEvent]
    template: |-
      {#- Rows for the shared map lane (util-access-control-lane), or the legacy
          per-route fragment for a list with an IPv6 entry. Under satisfy=any the
          allow-list deny would block an IP that auth could still rescue, so that
          arm is left out; backend-directives-765 emits the combined gate. -#}
      {%- import "util-publish-access-control" for PublishAccessControl -%}
      {%- import "util-nginx-ingress-satisfy" for SatisfyAnyMode -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var allowAnn = "nginx.ingress.kubernetes.io/whitelist-source-range" -%}
        {%- if SatisfyAnyMode(ingress) != "" -%}{%- allowAnn = "" -%}{%- end -%}
        {%- var fragment = PublishAccessControl(ingress, allowAnn, "nginx.ingress.kubernetes.io/denylist-source-range", "ni", "nginx-ingress/whitelist-source-range ({KEY})", "nginx-ingress/denylist-source-range ({KEY})") -%}
        {%- if fragment != "" -%}{{- shared.Publish("fragments:ni", ingress.Metadata.Namespace + "/" + ingress.Metadata.Name, fragment) -}}{%- end -%}
      {%- end -%}

  frontend-filters-099-nginx-ingress-access-control:
    requires: [ingresses]
    template: |-
      {%- import "util-access-control-lane" for AccessControlLane -%}
      {{- AccessControlLane("ni", "") -}}

  # ssl-redirect and hsts live in features-105/-155: they register hosts into gf maps
  # that ssl.yaml/base.yaml emit one shared map-driven rule from — don't move them back
  # to per-ingress inline ACLs here, that costs a reload per host change.

  frontend-filters-730-nginx-ingress-cors:
    requires: [ingresses]
    template: |-
      {%- import "util-cors-lane" for CorsLane -%}
      {{- CorsLane("ni") -}}

  ingress-cors-0730-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/enable-cors']"]
      group: ingress-cors
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-annotation-cors-publish" for IngressCORSPublish -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- IngressCORSPublish(ingress, "nginx.ingress.kubernetes.io", "nginx.ingress.kubernetes.io/enable-cors", "1728000", "ni") -}}
      {%- end -%}

  # Reload-free: custom-request/response-headers become entries in
  # ing-reqhdr.map / ing-reshdr.map (built by ingress.yaml
  # frontend-filters-263-ingress-headers), keyed on the resolved backend. This
  # scopes the header to the ingress's own backends rather than every request
  # for the host — the wildcard/host-less HostMatchCondition gap goes with it.
  features-740-nginx-ingress-custom-headers:
    template: '{{- "" -}}'

  ingress-header-mods-0740-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/custom-request-headers']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/custom-response-headers']"
      group: ingress-header-mods
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-header-publish" for PublishIngressHeaderContributions -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{- PublishIngressHeaderContributions(ingress,
          "nginx.ingress.kubernetes.io/custom-request-headers",
          "nginx.ingress.kubernetes.io/custom-response-headers", "|", ":", "0740-nginx-ingress") -}}
      {%- end -%}

  # app-root and permanent/temporal-redirect live in features-145/-140: they register
  # hosts into gf maps that base.yaml emits one shared map-driven rule from — don't
  # move them back to per-ingress inline ACLs here, that costs a reload per change.

  frontend-filters-775-nginx-ingress-from-to-www-redirect:
    requires: [ingresses]
    template: |-
      {# `redirect prefix` only sets Location; never rewrite the Host header instead,
          that corrupts routing. Map indirection keeps host changes reload-free. #}
      {{- render "nginx-ingress-from-to-www-publications" -}}
      {%- var pairByHost = map[string]string{} -%}
      {%- var hostKeys = []any{} -%}
      {%- for _, entryAny := range incremental_values("nginx-ingress-from-to-www-hosts", "hosts") -%}
        {%- var entry = entryAny.(map[string]any) -%}
        {%- var srcHost = tostring(entry["host"]) -%}
        {%- pairByHost[srcHost] = tostring(entry["target"]) -%}
        {%- hostKeys = append(hostKeys, srcHost) -%}
      {%- end %}
      {%- if len(hostKeys) > 0 %}
        {%- var sortedHosts = sort_strings(hostKeys) %}
        {%- var lines = []string{} %}
        {%- for _, h := range sortedHosts %}{%- lines = append(lines, tostring(h) + " " + pairByHost[tostring(h)]) %}{%- end %}
        {%- var mapContent = join(lines, "\n") + "\n" %}
        {%- var _, mapErr = fileRegistry.Register("map", "from-to-www.map", mapContent) %}
        {%- if mapErr != nil %}{{ fail("failed to register from-to-www map: " + tostring(mapErr)) }}{%- end %}
        {%- var m, _ = pathResolver.GetPath("from-to-www.map", "map") %}
      # nginx-ingress/from-to-www-redirect
      http-request redirect prefix https://%[var(txn.host),map({{ m }})] code 301 if { ssl_fc } { var(txn.host),map({{ m }}) -m found }
      http-request redirect prefix http://%[var(txn.host),map({{ m }})] code 301 if !{ ssl_fc } { var(txn.host),map({{ m }}) -m found }
      {%- end %}

  nginx-ingress-from-to-www-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/from-to-www-redirect']"]
      group: nginx-ingress-from-to-www-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/from-to-www-redirect"] == "true" -%}
        {%- var seen = map[string]bool{} -%}
        {%- for _, rule := range ingress.Spec.Rules -%}
          {%- var srcHost = toLower(rule.Host) -%}
          {%- if srcHost != "" && !seen[srcHost] -%}
            {%- seen[srcHost] = true -%}
            {%- var targetHost = "" -%}
            {%- if hasPrefix(srcHost, "www.") -%}{%- targetHost = srcHost[4:] -%}{%- else -%}{%- targetHost = "www." + srcHost -%}{%- end -%}
            {{- shared.Publish("hosts", srcHost, map[string]any{"host": srcHost, "target": targetHost}) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  ingress-canary-0780-nginx-ingress:
    requires: [ingresses]
    incremental:
      bindingsTemplate: |-
        {%- var fileDir, err = pathResolver.GetPath("", "file") -%}
        {%- if err != nil -%}{{ fail(tostring(err)) }}{%- end -%}
        {{- toJSON(map[string]any{"ingresses": map[string]any{"fileDir": fileDir}}) -}}
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/canary']"]
      group: ingress-canary
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-ingress-host-match-publication" for IngressHostMatchPublication -%}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-canary-publish" for PublishCanary -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil %}
        {%- var isCanary = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary"] %}
        {%- if isCanary == "true" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
            {%- var hosts = []string{} %}
            {%- var canaryBackend = "" %}
            {%- for _, rule := range ingress.Spec.Rules %}
              {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
              {%- if canaryBackend == "" %}
                {%- var http = rule | dig("http") %}
                {%- if http != nil %}
                  {%- var paths []any = http | dig("paths") | toSlice() %}
                  {%- if len(paths) > 0 %}
                    {%- canaryBackend = BackendNameIngress(ingress, paths[0]) %}
                  {%- end %}
                {%- end %}
              {%- end %}
            {%- end %}
            {%- if len(hosts) > 0 && canaryBackend != "" -%}
              {%%
                var canaryHeader = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header"]
                var canaryHeaderValue = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-value"]
                var canaryHeaderPattern = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-header-pattern"]
                var canaryCookie = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-by-cookie"]
                var canaryWeight = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/canary-weight"]
              %%}
              {#- The header/cookie NAMES and the numeric weight are emitted unquoted
                  (req.hdr(<h>), req.cook(<c>), rand(100) lt <w>), so a space or quote
                  there breaks out of the ACL — token context. The regex/exact match
                  VALUES are single-quoted below (-m reg '<p>' / -m str '<v>'), where
                  HAProxy strong-quoting passes a backslash (e.g. \d+) literally with no
                  $ expansion — only a ' or a control character is a danger, so squote.
                  Only the operands that will actually be emitted are checked. -#}
              {%- var canaryInj = "" %}
              {%- var canaryField = "" %}
              {%- if canaryHeader != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryHeader, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-by-header" %}{%- end %}
                {%- if canaryInj == "" && canaryHeaderPattern != "" %}
                  {%- canaryInj = ConfigInjectionKind(canaryHeaderPattern, "squote") %}
                  {%- if canaryInj != "" %}{%- canaryField = "canary-by-header-pattern" %}{%- end %}
                {%- else if canaryInj == "" && canaryHeaderValue != "" %}
                  {%- canaryInj = ConfigInjectionKind(canaryHeaderValue, "squote") %}
                  {%- if canaryInj != "" %}{%- canaryField = "canary-by-header-value" %}{%- end %}
                {%- end %}
              {%- end %}
              {%- if canaryInj == "" && canaryCookie != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryCookie, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-by-cookie" %}{%- end %}
              {%- end %}
              {%- if canaryInj == "" && canaryWeight != "" %}
                {%- canaryInj = ConfigInjectionKind(canaryWeight, "token") %}
                {%- if canaryInj != "" %}{%- canaryField = "canary-weight" %}{%- end %}
              {%- end %}
              {#- A header or cookie name is also a converter argument in the shared canary
                  lane (concat(|<name>)), where a , ) or | would break every frontend. -#}
              {%- var badName = "" %}
              {%- if canaryHeader != "" && !regex_search(canaryHeader, "^[A-Za-z0-9_.-]+$") %}{%- badName = "canary-by-header" %}
              {%- else if canaryCookie != "" && !regex_search(canaryCookie, "^[A-Za-z0-9_.-]+$") %}{%- badName = "canary-by-cookie" %}{%- end %}
              {%- if canaryInj == "" && badName != "" %}
                {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/" + badName + "' may contain only letters, digits, '_', '.' and '-', so the canary route is not applied. Rename the header or cookie.") -}}
              {%- else if canaryInj == "" && canaryWeight != "" && !regex_search(canaryWeight, "^[0-9]+$") %}
                {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/canary-weight' is '" + canaryWeight + "', not an integer, so the canary route is not applied. Set a weight from 0 to 100.") -}}
              {%- else if canaryInj != "" %}
                {%- var message = "Ingress '" + key + "' annotation 'nginx.ingress.kubernetes.io/" + canaryField + "' value contains " + canaryInj + ", which would break out of the canary routing condition; the canary route is not applied. Remove it from the value." -%}
                {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
                  {{- fail(message) -}}
                {%- else -%}
                  {{- recordEvent(ingress, "InvalidAnnotationValue", message) -}}
                {%- end -%}
              {%- else if canaryHeader != "" && canaryHeaderPattern != "" %}
                {%- var match = IngressHostMatchPublication(hosts, tostring(props["fileDir"])) %}
                {{- shared.Publish("pattern", key, "\n# nginx-ingress/canary (" + key + ")\nuse_backend " + canaryBackend + " if { req.hdr(" + canaryHeader + ") -m reg '" + canaryHeaderPattern + "' } " + tostring(match["condition"])) -}}
                {%- if match["file"] != nil -%}
                  {{- shared.Publish("files", key, match["file"]) -}}
                {%- end -%}
                {{- PublishCanary(key, hosts, canaryBackend, "", "", canaryCookie, canaryWeight) -}}
              {%- else %}
                {%- var headerValue = canaryHeaderValue %}
                {%- if headerValue == "" %}{%- headerValue = "always" %}{%- end %}
                {{- PublishCanary(key, hosts, canaryBackend, canaryHeader, headerValue, canaryCookie, canaryWeight) -}}
              {%- end %}
            {%- end %}
        {%- end %}
      {%- end -%}

  # One rule per Ingress: HAProxy can't take a regex from a map. RFC 2253 matches nginx's $ssl_client_s_dn.
  frontend-filters-076-nginx-ingress-mtls-match-cn:
    requires: [ingresses]
    template: |
      {{- render "nginx-ingress-match-cn-publications" -}}
      {%- for _, rule := range incremental_values("nginx-ingress-match-cn", "rule") %}
      {{ tostring(rule) }}
      {%- end %}

  nginx-ingress-match-cn-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-match-cn']"]
      group: nginx-ingress-match-cn
      effects: [publishValue]
    template: |-
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-dquote-value" for EscapeDquoteValue -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-secret"] != "" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var pattern = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-match-cn"] -%}
        {%- var injection = ConfigInjectionKind(pattern, "line") -%}
        {%- if injection != "" -%}
          {{- fail("Invalid value for annotation 'nginx.ingress.kubernetes.io/auth-tls-match-cn' on Ingress '" + key + "': contains " + injection + ", which would break the client-certificate check. Remove it from the pattern.") -}}
        {%- end -%}
        {%- if pattern != "" -%}
          {{- shared.Publish("rule", key, "# nginx-ingress/auth-tls-match-cn (" + key + ")\nhttp-request deny deny_status 403 if { var(txn.resource_key) -m str " + key + " } !{ ssl_c_s_dn(,0,rfc2253) -m reg \"" + EscapeDquoteValue(pattern) + "\" }") -}}
        {%- end -%}
      {%- end -%}

  frontend-filters-789-nginx-ingress-mtls-strip:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream']"]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true" -%}
        {{- shared.Unique("fragments", "global", "\n# nginx-ingress/auth-tls-pass-certificate-to-upstream — drop client-supplied copies\nhttp-request del-header ssl-client-cert\nhttp-request del-header ssl-client-subject-dn") -}}
      {%- end -%}

  # auth-tls-pass-certificate-to-upstream: the ssl-client-* headers for a
  # route that opted in, from nginx-cert-header-routes.map ("<route id>" -> 1);
  # the strip (789) stays unconditional. auth-tls-error-page lives in
  # features-150 (map-driven).
  frontend-filters-790-nginx-ingress-mtls-error:
    requires: [ingresses]
    template: |
      {%- import "util-register-map" for RegisterMap -%}
      {{- render "nginx-ingress-cert-header-publications" -}}
      {%- if incremental_value_count("nginx-ingress-cert-header", "any") > 0 -%}
      {%%
        var routesVal, _ = shared.ComputeIfAbsent("nginxCertHeaderMap", func() any {
          var rows = []any{}
          for _, v := range incremental_values("nginx-ingress-cert-header", "route") {
            rows = append(rows, tostring(v))
          }
          var lines = []string{}
          for _, r := range sort_strings(rows) {
            lines = append(lines, tostring(r))
          }
          return RegisterMap("nginx-cert-header-routes.map", lines, map[string]any{"ordered": false})
        })
        var routes = tostring(routesVal)
      %%}
      {{ "\n" }}# ni/auth-tls-pass-certificate-to-upstream
      http-request set-header ssl-client-cert %[ssl_c_der,base64] if { var(txn.resource_key),map({{ routes }}) -m found }
      http-request set-header ssl-client-subject-dn %[ssl_c_s_dn] if { var(txn.resource_key),map({{ routes }}) -m found }
      {%- end %}

  nginx-ingress-cert-header-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream']"]
      group: nginx-ingress-cert-header
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {{- shared.Publish("any", "any", "any") -}}
        {{- shared.Publish("route", key, key + " 1") -}}
      {%- end -%}

  frontend-filters-093-nginx-ingress-mirror-buffer:
    template: |-
      {{- render "nginx-ingress-mirror-buffer-publications" -}}
      {%- for _, fragment := range incremental_values("nginx-ingress-mirror-buffer", "fragments") -%}
        {{- tostring(fragment) -}}
      {%- end -%}

  nginx-ingress-mirror-buffer-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: |-
        {%- var plugins = extraContext | dig("spoaHub", "plugins") | fallback([]any{}) | toSlice() -%}
        {%- var mirrorEnabled = false -%}
        {%- for _, plugin := range plugins -%}
          {%- if plugin.(map[string]any)["name"].(string) == "mirror" -%}
            {%- mirrorEnabled = true -%}
          {%- end -%}
        {%- end -%}
        {%- var requestBufferingMap, _ = pathResolver.GetPath("request-buffering.map", "map") -%}
        {{- toJSON(map[string]any{"ingresses": map[string]any{
          "mirrorEnabled": mirrorEnabled,
          "mirrorWait": extraContext | dig_string("10s", "requestBuffering", "waitTimeout"),
          "requestBufferingMap": requestBufferingMap,
        }}) -}}
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/mirror-target']"]
      group: nginx-ingress-mirror-buffer
      effects: [publishValue]
    template: |
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] != "" -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- if !props["mirrorEnabled"].(bool) -%}
          {{- fail("Ingress " + key + " sets 'nginx.ingress.kubernetes.io/mirror-target' but the spoaHub mirror plugin is not enabled. Either enable spoaHub.plugins.mirror or remove the annotation.") -}}
        {%- end -%}
      {# Content-Length-gated, not frontend-wide `option http-buffer-request`: one
          mirrored Ingress would buffer the whole shared frontend and stall every
          gRPC/streaming route on it into a 408. Trade-off: chunked bodies are not
          mirrored. The map check honours a route's `request-buffering: off`, and
          needs txn.backend_name — set by frontend-routing-logic, which is why this
          is a frontend-filters-* and not the earlier frontend-extra-*. Map default
          `on`, not the fleet setting: mirroring needs the body regardless. #}
        {%- var fragment = "\n# nginx-ingress/mirror-buffer: buffer the request body so it reaches the mirror plugin\n" +
          "http-request wait-for-body time " + tostring(props["mirrorWait"]) +
          " if { req.hdr(content-length) -m found } !{ var(txn.backend_name),map(" +
          tostring(props["requestBufferingMap"]) + ",on) -m str off }" -%}
        {{- shared.Publish("fragments", "global", fragment) -}}
      {%- end -%}

  ingress-mirror-0555-nginx-ingress:
    requires: [ingresses]
    incremental:
      bindingsTemplate: |-
        {{- toJSON(map[string]any{"ingresses": map[string]any{
          "targetTimeoutMs": extraContext | dig("spoaHub", "mirror", "targetTimeoutMs") | fallback(2000),
          "targetRetries": extraContext | dig("spoaHub", "mirror", "targetRetries") | fallback(0),
        }}) -}}
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/mirror-target']"]
      group: ingress-mirror
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-mirror-publish" for PublishMirror -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {#- Only `mirror-target` is honoured: the plugin forces the mirrored Host to the
          target authority and always forwards the buffered body, so `mirror-host` and
          `mirror-request-body: off` cannot be supported without a plugin change. Only
          the authority is used — the plugin re-attaches the live path/query.
          A new target touches neither spoe.conf nor the hub TOML: the lane's
          entries share the single NOTIFY in frontend-filters-950-spoa-hub-mirror-fire. -#}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil %}
        {%- var mt = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/mirror-target"] %}
        {%- if mt != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var key = ns + "/" + name %}
          {%- var hosts = []string{} %}
          {%- for _, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}{%- hosts = append(hosts, rule.Host) %}{%- end %}
          {%- end %}
          {%- var valid = true -%}
          {%- if len(hosts) == 0 %}
            {%- var message = "Ingress '" + key + "' sets 'nginx.ingress.kubernetes.io/mirror-target' but defines no host; host-less / default-backend mirroring is not supported. Add a host to the Ingress rule." -%}
            {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
              {{- fail(message) -}}
            {%- else -%}
              {{- recordEvent(ingress, "InvalidAnnotationValue", message) -}}
            {%- end -%}
            {%- valid = false -%}
          {%- end %}
          {%- if valid -%}
          {#- nginx appends the path/variable (e.g. $request_uri) with no '/' separator,
              so the authority ends at the first '/' or '$'. -#}
          {%- var scheme = "http" %}
          {%- var rest = mt %}
          {%- if hasPrefix(mt, "https://") %}
            {%- scheme = "https" %}
            {%- rest = mt[8:] %}
          {%- else if hasPrefix(mt, "http://") %}
            {%- rest = mt[7:] %}
          {%- end %}
          {%- var cut = len(rest) %}
          {%- var sl = index(rest, "/") %}
          {%- var dl = index(rest, "$") %}
          {%- if sl >= 0 && sl < cut %}{%- cut = sl %}{%- end %}
          {%- if dl >= 0 && dl < cut %}{%- cut = dl %}{%- end %}
          {%- var authority = rest[:cut] %}
          {%- if !strings_contains(authority, ":") %}
            {%- if scheme == "https" %}{%- authority = authority + ":443" %}{%- else %}{%- authority = authority + ":80" %}{%- end %}
          {%- end %}
          {%- if !regex_search(authority, "^[A-Za-z0-9._-]+:[0-9]{1,5}$") %}
            {{- fail("Invalid value '" + mt + "' for annotation 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Expected scheme://host[:port][/path]; could not derive a host:port authority (got '" + authority + "').") -}}
          {%- end %}
          {#- The charset regex above still accepts :0 and :99999. -#}
          {%- var portNum = toint(authority[index(authority, ":")+1:]) %}
          {%- if portNum < 1 || portNum > 65535 %}
            {{- fail("Invalid port '" + tostring(portNum) + "' in 'nginx.ingress.kubernetes.io/mirror-target' on Ingress '" + key + "'. Port must be 1-65535.") -}}
          {%- end %}
          {%- var safeAuthority = ValidateConfigValue(authority, "nginx.ingress.kubernetes.io/mirror-target", key, false) %}
          {%- var timeoutMs = toint(props["targetTimeoutMs"]) %}
          {%- var retriesCount = toint(props["targetRetries"]) %}
          {%- var entry = scheme + "|" + safeAuthority + "|" + tostring(timeoutMs) + "|" + tostring(retriesCount) %}
          {{- PublishMirror(key, hosts, entry) -}}
          {%- end -%}
        {%- end %}
      {%- end %}
  log-fields-730-nginx-ingress-mtls:
    template: |-
      {# Byte-identical to the haptic-annotations and haproxy-ingress log-fields
          contributions on purpose: base deduplicates identical items, so several
          annotation libraries can be enabled at once. #}
      {{- render "nginx-ingress-log-fields-mtls-publications" -}}
      {%- for _, fragment := range incremental_values("nginx-ingress-log-fields-mtls", "fragments") -%}
        {{- tostring(fragment) -}}
      {%- end -%}

  nginx-ingress-log-fields-mtls-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-secret']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream']"
      group: nginx-ingress-log-fields-mtls
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && (ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-secret"] != "" || ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream"] == "true") -%}
        {{- shared.Publish("fragments", "global", "\n%(mtls_verify)[ssl_c_verify]\n%(mtls_cn)[ssl_c_s_dn(CN)]") -}}
      {%- end -%}
