templateSnippets:
  backend-timeout-metadata-700-nginx:
    template: |-
      {%- for _, key := range []string{"nginx.ingress.kubernetes.io/proxy-read-timeout", "nginx.ingress.kubernetes.io/proxy-send-timeout"} -%}
        {%- var value = dig_string(ingress, "", "metadata", "annotations", key) -%}
        {%- if regex_search(value, "^[0-9]+$") && toint(value) > 0 -%}
          {{- "server " + tostring(toint(value) * 1000) + "\n" -}}
        {%- end -%}
      {%- end -%}


  util-nginx-ingress-rewrite-target:
    template: |
      {% macro RewriteTargetCaptures(target string) string %}{%%
        for group := 1; group <= 9; group++ {
          target = replace(target, "$" + tostring(group), "\\" + tostring(group))
        }
        show target
      %%}{% end %}

  backend-directives-670-nginx-ingress-session-affinity:
    template: |
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var affinity = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/affinity"] %}
        {%- if affinity == "cookie" %}
          {#- HAProxy cookie persistence is always "persistent"; "balanced" can't rebalance on scale-up. The mode emits nothing, so a bad value still gets affinity. -#}
          {%- var affinityMode = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/affinity-mode"] %}
          {%- if affinityMode != "" && affinityMode != "balanced" && affinityMode != "persistent" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", WebhookOutcomeMessage(
              "Annotation 'nginx.ingress.kubernetes.io/affinity-mode' on Ingress '" + key + "' is '" + affinityMode + "', which isn't a session affinity mode",
              "the Ingress is rejected", "the value is ignored", "Set it to balanced or persistent.")) -}}
          {%- end %}
          {%- var cookieName = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-name"] %}
          {%- if cookieName == "" %}{%- cookieName = "INGRESSCOOKIE" %}{%- end %}
          {%- var cookiePath = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-path"] %}
          {%- var scInj = ConfigInjectionKind(cookieName, "token") %}
          {%- if scInj == "" && cookiePath != "" %}{%- scInj = ConfigInjectionKind(cookiePath, "token") %}{%- end %}
          {%- var cookieDir = "cookie " + cookieName + " insert indirect nocache dynamic" %}
          {%- if cookiePath != "" %}
            {#- HAProxy's `cookie` has no bare `path` keyword; the path rides on `attr Path=`. -#}
            {%- cookieDir = cookieDir + " attr Path=" + cookiePath %}
          {%- end %}
          {%- var cookieSecure = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-secure"] %}
          {%- if cookieSecure == "true" %}
            {%- cookieDir = cookieDir + " attr Secure" %}
          {%- end %}
          {%- var cookieSameSite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-samesite"] %}
          {%- if cookieSameSite != "" %}
            {%- if cookieSameSite != "Strict" && cookieSameSite != "Lax" && cookieSameSite != "None" %}
              {{- fail("Invalid value '" + cookieSameSite + "' for annotation 'nginx.ingress.kubernetes.io/session-cookie-samesite' on Ingress '" + key + "'. Valid values: Strict, Lax, None") -}}
            {%- end %}
            {%- cookieDir = cookieDir + " attr SameSite=" + cookieSameSite %}
          {%- end %}
          {%- var cookieDomain = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-domain"] %}
          {%- if cookieDomain != "" %}
            {%- cookieDir = cookieDir + " domain " + ValidateConfigValue(cookieDomain, "nginx.ingress.kubernetes.io/session-cookie-domain", key, false) %}
          {%- end %}
          {#- Max-Age is the browser cookie lifetime, not HAProxy's `maxlife` stickiness window; Expires maps here too because HAProxy can't emit an absolute date. -#}
          {%- var cookieMaxAge = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-max-age"] %}
          {%- var cookieExpires = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-expires"] %}
          {%- var cookieLife = cookieMaxAge %}
          {%- var cookieLifeKey = "nginx.ingress.kubernetes.io/session-cookie-max-age" %}
          {%- if cookieLife == "" %}
            {%- cookieLife = cookieExpires %}
            {%- cookieLifeKey = "nginx.ingress.kubernetes.io/session-cookie-expires" %}
          {%- end %}
          {%- if cookieLife != "" %}
            {%- if !regex_search(cookieLife, "^[0-9]+$") %}
              {{- fail("Invalid value '" + cookieLife + "' for annotation '" + cookieLifeKey + "' on Ingress '" + key + "'. Must be a non-negative integer (seconds).") -}}
            {%- end %}
            {%- cookieDir = cookieDir + " attr Max-Age=" + cookieLife %}
          {%- end %}
          {%- var cookieHash = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/session-cookie-hash"] %}
          {%- if cookieHash != "" %}
      # Warning: nginx.ingress.kubernetes.io/session-cookie-hash on Ingress {{ key }} is not configurable in HAProxy — dynamic cookies always hash via dynamic-cookie-key.
          {%- end %}
          {%- if scInj != "" %}
            {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", WebhookOutcomeMessage(
              "Ingress '" + key + "' session-cookie-name/-path contains " + scInj + ", which would break the backend cookie directive",
              "the Ingress is rejected", "session affinity is not applied", "Remove whitespace and control characters from the value.")) -}}
          {%- else %}
      # nginx-ingress/session-affinity ({{ key }})
      {{ cookieDir }}
      dynamic-cookie-key {{ sha256(key) }}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-700-nginx-ingress-timeouts:
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {#- proxy-read-timeout / proxy-send-timeout collapse into HAProxy's single
          settable server timeout (the larger wins), which moves to
          backend-timeouts.map via map-backend-timeout-700-nginx-timeouts
          (reload-free). timeout-connect stays per-value here. -#}
      {%- if ingress != nil %}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
        {%- var connectTimeout = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-connect-timeout"] %}
        {%- if connectTimeout != "" %}
          {%- if !regex_search(connectTimeout, "^[0-9]+$") %}
            {{- WebhookRejectOrWarn(ingress, "InvalidTimeout", WebhookOutcomeMessage(
              "Annotation 'nginx.ingress.kubernetes.io/proxy-connect-timeout' on Ingress '" + key + "' is not a whole number of seconds",
              "the Ingress is rejected", "the timeout is not applied", "")) -}}
          {%- else %}
      # nginx-ingress/backend-directives-timeouts
      timeout connect {{ connectTimeout }}s
          {%- end %}
        {% end %}
      {%- end -%}

  # Reload-free settable timeout: proxy-read-timeout / proxy-send-timeout (seconds,
  # larger wins) become a `<backend>|server` entry in backend-timeouts.map as ms.
  # There is no tunnel equivalent in the nginx annotation set.
  map-backend-timeout-700-nginx-timeouts:
    requires: [ingresses]
    incremental:
      source: ingresses
      group: map-backend-timeout-ingress
      effects: [recordEvent]
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%%
        var ingress = item
        var key = dig_string(ingress, "", "metadata", "namespace") + "/" + dig_string(ingress, "", "metadata", "name")
        var readT = dig_string(ingress, "", "metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-read-timeout")
        var sendT = dig_string(ingress, "", "metadata", "annotations", "nginx.ingress.kubernetes.io/proxy-send-timeout")
        var bad = ""
        if readT != "" && !regex_search(readT, "^[0-9]+$") {
          bad = "proxy-read-timeout"
        }
        if sendT != "" && !regex_search(sendT, "^[0-9]+$") {
          bad = "proxy-send-timeout"
        }
        if bad != "" {
          var message = "Annotation 'nginx.ingress.kubernetes.io/" + bad + "' on Ingress '" + key + "' is not a whole number of seconds; the timeout is not applied."
          if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" {
            fail(message)
          } else {
            recordEvent(ingress, "InvalidTimeout", message)
          }
        } else {
          var secs = toint(readT)
          if toint(sendT) > secs {
            secs = toint(sendT)
          }
          if secs > 0 {
            for _, rule := range toSlice(dig(ingress, "spec", "rules")) {
              for _, path := range toSlice(dig(rule, "http", "paths")) {
                var be = BackendNameIngress(ingress, path)
                show shared.Unique("map-backend-timeout", be + "|server", "\n" + be + "|server " + tostring(secs * 1000))
              }
            }
          }
        }
      %%}

  backend-directives-710-nginx-ingress-load-balance:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var lb = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/load-balance"] %}
        {%- if lb != "" %}
          {%- var algo = "" %}
          {%- if lb == "round_robin" %}
            {%- algo = "roundrobin" %}
          {%- else if lb == "least_conn" %}
            {%- algo = "leastconn" %}
          {%- else if lb == "ip_hash" %}
            {%- algo = "source" %}
          {%- else if lb == "random" %}
            {%- algo = "random" %}
          {%- else if lb == "ewma" %}
            {%- algo = "leastconn" %}
          {%- else %}
            {{- fail("Invalid value '" + lb + "' for annotation 'nginx.ingress.kubernetes.io/load-balance' on Ingress '" + key + "'. Valid values: round_robin, least_conn, ip_hash, random, ewma") -}}
          {%- end %}
          {#- Structured Backend() arg (profile), so the macro adds
              `hash-type consistent` for a hash-family algorithm (ip_hash → source). -#}
          {%- serverOpts["balance"] = algo %}
        {%- end %}
      {%- end -%}

  backend-directives-715-nginx-ingress-next-upstream:
    template: |
      {# A retry lands on a different server only because base.yaml's defaults set `option redispatch`. #}
      {# Silently ignored, no HAProxy CE equivalent: non_idempotent, proxy-next-upstream-timeout. #}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var nu = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream"] %}
        {%- var tries = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-next-upstream-tries"] %}
        {%- if nu != "" || tries != "" %}
          {%- var off = false %}
          {%- var conds = []string{} %}
          {%- var seen = map[string]bool{} %}
          {%- for _, tok := range split(nu, " ") %}
            {%- var t = trimSpace(tok) %}
            {%- var mapped = "" %}
            {%- if t == "off" %}
              {%- off = true %}
            {%- else if t == "error" %}
              {%- mapped = "conn-failure" %}
            {%- else if t == "timeout" %}
              {%- mapped = "response-timeout" %}
            {%- else if t == "invalid_header" %}
              {%- mapped = "junk-response" %}
            {%- else if hasPrefix(t, "http_") %}
              {%- var code = t[5:] %}
              {%- if !regex_search(code, "^[1-5][0-9][0-9]$") %}
                {{- fail("Invalid status '" + code + "' in 'nginx.ingress.kubernetes.io/proxy-next-upstream' on Ingress '" + key + "'. Use http_<3-digit-status>.") -}}
              {%- end %}
              {%- mapped = code %}
            {%- end %}
            {%- if mapped != "" && !seen[mapped] %}
              {%- seen[mapped] = true %}
              {%- conds = append(conds, mapped) %}
            {%- end %}
          {%- end %}
          {%- if off %}
      # nginx-ingress/proxy-next-upstream ({{ key }}) - disabled
      retries 0
          {%- else %}
            {%- if len(conds) > 0 %}
      # nginx-ingress/proxy-next-upstream ({{ key }})
      retry-on {{ join(conds, " ") }}
            {%- end %}
            {%- if tries != "" %}
              {#- toint() returns 0 for junk like "abc"/"2.5", so an unchecked typo would silently drop the retry limit. -#}
              {%- if !regex_search(tries, "^[0-9]+$") %}
                {{- fail("Invalid value '" + tries + "' for 'nginx.ingress.kubernetes.io/proxy-next-upstream-tries' on Ingress '" + key + "'. Must be a non-negative integer.") -}}
              {%- end %}
              {%- var n = toint(tries) %}
              {%- if n > 0 %}
      retries {{ n }}
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  map-body-size-720-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/proxy-body-size']"]
      group: map-body-size
      effects: [recordEvent]
    template: |
      {# "0" means unlimited in nginx, hence no map entry. #}
      {# base.yaml's frontend-filters-250-request-body-size enforces the map (deny 413) keyed on the resolved backend, so a cap change is map-only and reload-free. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-byte-size" for BodySizeBytes -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var bodySize = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-body-size"] -%}
        {%- if bodySize != "" -%}
          {%- var bytes = BodySizeBytes(ingress, bodySize, "nginx.ingress.kubernetes.io/proxy-body-size") -%}
          {%- if bytes != "" -%}
            {%- for _, rule := range ingress.Spec.Rules -%}
              {#- rule.Http is a value struct: .Paths is empty without an http block, so no nil guard. -#}
              {%- for _, path := range rule.Http.Paths -%}
                {%- var be = BackendNameIngress(ingress, path) -%}
                {{- shared.Unique("map-body-size", be, "\n" + be + " " + tostring(bytes)) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # proxy-request-buffering on|off overrides extraContext.requestBuffering.enabled
  # per route through request-buffering.map (base frontend-filters-090).
  map-request-buffering-835-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/proxy-request-buffering']"]
      group: map-request-buffering
      effects: [recordEvent]
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var buffering = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-request-buffering"] -%}
        {%- if buffering != "on" && buffering != "off" -%}
          {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", WebhookOutcomeMessage(
            "Annotation 'nginx.ingress.kubernetes.io/proxy-request-buffering' on Ingress '" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + "' is '" + buffering + "'",
            "the Ingress is rejected", "the fleet-wide request buffering applies", "Set it to on or off.")) -}}
        {%- else -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {{- shared.Unique("map-request-buffering", be, "\n" + be + " " + buffering) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # Response headers must fit the process-wide tune.bufsize minus tune.maxrewrite;
  # a tenant mustn't raise fleet-wide memory, so an oversized value is reported, not applied.
  features-957-nginx-ingress-proxy-buffer-size:
    requires: [ingresses]
    incremental:
      effects: [recordEvent]
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/proxy-buffer-size']"]
      bindingsTemplate: |-
        {{- toJSON(map[string]any{"ingresses": map[string]any{"bufsize": toint(render "util-tune-bufsize")}}) -}}
    template: |-
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var size = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/proxy-buffer-size"] -%}
        {%- if !regex_search(size, "^[0-9]{1,9}[kKmM]?$") -%}
          {{- WebhookRejectOrWarn(ingress, "InvalidAnnotationValue", WebhookOutcomeMessage(
            "Annotation 'nginx.ingress.kubernetes.io/proxy-buffer-size' on Ingress '" + key + "' is '" + size + "', which isn't a byte size",
            "the Ingress is rejected", "the value is ignored", "Use a size like '16k'.")) -}}
        {%- else -%}
          {%- var factor = 1 -%}
          {%- if hasSuffix(size, "k") || hasSuffix(size, "K") -%}{%- factor = 1024 -%}{%- end -%}
          {%- if hasSuffix(size, "m") || hasSuffix(size, "M") -%}{%- factor = 1048576 -%}{%- end -%}
          {%- var digits = size -%}
          {%- if factor > 1 -%}{%- digits = size[0:len(size)-1] -%}{%- end -%}
          {%- var bufsize = toint(props | dig("bufsize")) -%}
          {%- var maxrewrite = 1024 -%}
          {%- if bufsize / 2 < maxrewrite -%}{%- maxrewrite = bufsize / 2 -%}{%- end -%}
          {%- var capacity = bufsize - maxrewrite -%}
          {%- if toint(digits) * factor > capacity -%}
            {{- recordEvent(ingress, "ProxyBufferSizeExceeded", "Ingress " + key + " sets nginx.ingress.kubernetes.io/proxy-buffer-size: " + size + ", but HAProxy fits at most " + tostring(capacity) + " bytes of response headers, so larger headers fail with 502. Raise extraContext.tune.bufsize to at least " + tostring(toint(digits) * factor + maxrewrite) + ".") -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # limit-rate is a per-stream cap, so it maps onto `set-bandwidth-limit … limit
  # <expr>` with the rate from the lane's map. limit-rate-after becomes the
  # filter's min-size, which is HAProxy's forward-chunk size and NOT nginx's
  # "throttle after N bytes" — the closest available knob, declared `different`
  # in migration coverage rather than claimed equivalent.
  ingress-bandwidth-0725-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-rate']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-rate-after']"
      group: ingress-bandwidth
      effects: [publishValue]
    template: |-
      {%- import "util-bandwidth-publish" for PublishBandwidth -%}
      {%- import "util-byte-size" for ByteSize -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var rate = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate"] -%}
        {%- if rate != "" -%}
          {%- var after = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rate-after"] -%}
          {%- var minSize = "_" -%}
          {%- if after != "" -%}
            {%- minSize = ByteSize(after, "nginx.ingress.kubernetes.io/limit-rate-after", key) -%}
          {%- end -%}
          {{- PublishBandwidth(key, ByteSize(rate, "nginx.ingress.kubernetes.io/limit-rate", key), minSize) -}}
        {%- end -%}
      {%- end -%}

  backend-directives-730-nginx-ingress-backend-protocol:
    template: |
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var proto = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/backend-protocol"] %}
        {%- if proto != "" %}
          {%- if proto == "HTTP" %}
            {#- HTTP/1.1 needs no server flag -#}
          {%- else if proto == "HTTPS" %}
            {#- One keyword per flag entry so the plan record carries each as a
                structured KeywordArg (FlagsToKeywordArgs). -#}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl") %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "verify none") %}
          {%- else if proto == "GRPC" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto h2") %}
          {%- else if proto == "GRPCS" %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "ssl") %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "verify none") %}
            {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "proto h2") %}
          {%- else if proto == "AJP" %}
            {{- fail("Backend protocol 'AJP' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else if proto == "FCGI" %}
            {{- fail("Backend protocol 'FCGI' is not supported by HAProxy. Annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'.") -}}
          {%- else %}
            {{- fail("Invalid value '" + proto + "' for annotation 'nginx.ingress.kubernetes.io/backend-protocol' on Ingress '" + key + "'. Valid values: HTTP, HTTPS, GRPC, GRPCS") -}}
          {%- end %}
        {%- end %}
      {%- end -%}

  backend-directives-740-nginx-ingress-proxy-protocol:
    template: |
      {%- if ingress != nil %}
        {%- var pp = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/use-proxy-protocol"] %}
        {%- if pp == "true" %}
          {%- serverOpts["flags"] = append(serverOpts["flags"].([]any), "send-proxy-v2") %}
        {%- end %}
      {%- end -%}

  backend-directives-750-nginx-ingress-rewrite-target:
    template: |
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-nginx-ingress-regex-paths" for NginxPathRecords, NginxLocationArg -%}
      {%- import "util-regex-map-key" for RegexGroupProblem -%}
      {%- import "util-nginx-ingress-rewrite-target" for RewriteTargetCaptures -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- if ingress != nil %}
        {%- var ns = ingress.Metadata.Namespace %}
        {%- var name = ingress.Metadata.Name %}
        {%- var key = ns + "/" + name %}
        {%- var target = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/rewrite-target"] %}
        {%- var rewrite = RewriteTargetCaptures(target) -%}
        {#- Only a \N backreference forces backend scope (the regex side can't be map-driven); literal rewrites go to path-rewrite.map via map-path-rewrite-750-nginx-ingress. -#}
        {%- if regex_search(rewrite, "\\\\[1-9]") %}
          {%- var injRw = ConfigInjectionKind(rewrite, "line") %}
          {%- if injRw != "" %}{{- WebhookRejectOrWarn(ingress, "InvalidRewriteTarget", WebhookOutcomeMessage(
            "Ingress " + key + " annotation 'nginx.ingress.kubernetes.io/rewrite-target' contains " + injRw,
            "the Ingress is rejected", "the rewrite is not applied", "Remove control characters from the value.")) -}}{%- else %}
            {#- \N binds to the groups of the path regex nginx routed by; with several
                paths on this backend, the longest one matching on the request's
                own host is that location. -#}
            {%- var backend = BackendNameIngress(ingress, path) %}
            {%- var patterns = []string{} %}
            {%- var locations = []string{} %}
            {%- for _, record := range NginxPathRecords(ingress) %}
              {%- var p = tostring(record | dig("path")) %}
              {%- if tostring(record | dig("backend")) == backend && p != target && ConfigInjectionKind(p, "mapkey") == "" && RegexGroupProblem(p) == "" %}
                {%- patterns = append(patterns, NginxLocationArg("", p)) %}
                {%- locations = append(locations, NginxLocationArg(MapKeyForHost(record | dig("host")), p)) %}
              {%- end %}
            {%- end %}
            {%- if len(patterns) > 0 %}
      # nginx-ingress/backend-directives-rewrite-target ({{ key }})
            {%- end %}
            {%- if len(patterns) == 1 %}
      http-request replace-path {{ patterns[0] }} {{ rewrite }}
            {%- else if len(patterns) > 1 %}
              {%- for i, location := range locations %}
      http-request set-var(txn.nginx_rewrite_location) int({{ i }}) if !{ var(txn.nginx_rewrite_location) -m found } { var(txn.host_match),concat(,txn.path,) -m reg {{ location }} }
              {%- end %}
              {%- for i, pattern := range patterns %}
      http-request replace-path {{ pattern }} {{ rewrite }} if { var(txn.nginx_rewrite_location) -m int {{ i }} }
              {%- end %}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  map-path-rewrite-750-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/rewrite-target']"]
      group: map-path-rewrite
    template: |
      {# Literal rewrites only (no \N); base.yaml's frontend-filters-400-path-rewrite applies them as set-path. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-nginx-ingress-rewrite-target" for RewriteTargetCaptures -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var rewrite = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/rewrite-target"] -%}
        {%- if rewrite != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- rewrite = RewriteTargetCaptures(rewrite) -%}
          {%- if !regex_search(rewrite, "\\\\[1-9]") -%}
            {%- for _, rule := range ingress.Spec.Rules -%}
              {%- for _, path := range rule.Http.Paths -%}
                {%- if path.Path == rewrite -%}{%- continue -%}{%- end -%}
                {%- var be = BackendNameIngress(ingress, path) -%}
                {{- shared.Unique("map-path-rewrite", be,
                  "\n" + be + " " + queryEscape(ValidateConfigValue(rewrite,
                    "nginx.ingress.kubernetes.io/rewrite-target", key, true))) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  # limit-rps > limit-rpm > limit-connections: a route carries one counter (a
  # stick table stores each data type once), the capped-out annotations record
  # an Event. The threshold reaches an ACL operand through the routes map, so a
  # malformed value fails rather than shipping the route without its limit.
  ingress-rate-limit-0770-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-rps']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-rpm']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-connections']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/limit-whitelist']"
      group: ingress-rate-limit
      effects: [publishValue, recordEvent]
    template: |-
      {%- import "util-validate-cidr-list" for ValidateCidrList -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-rate-limit-publish" for PublishRateLimit -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var limitRps = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rps"] -%}
        {%- var limitRpm = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-rpm"] -%}
        {%- var limitConn = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-connections"] -%}
        {%- var counter = "req" -%}
        {%- var window = "" -%}
        {%- var field = "" -%}
        {%- var value = "" -%}
        {%- var ignored = []string{} -%}
        {%- if limitRps != "" -%}
          {%- field = "limit-rps" -%}{%- value = limitRps -%}{%- window = "1s" -%}
          {%- if limitRpm != "" -%}{%- ignored = append(ignored, "limit-rpm") -%}{%- end -%}
          {%- if limitConn != "" -%}{%- ignored = append(ignored, "limit-connections") -%}{%- end -%}
        {%- else if limitRpm != "" -%}
          {%- field = "limit-rpm" -%}{%- value = limitRpm -%}{%- window = "60s" -%}
          {%- if limitConn != "" -%}{%- ignored = append(ignored, "limit-connections") -%}{%- end -%}
        {%- else if limitConn != "" -%}
          {%- field = "limit-connections" -%}{%- value = limitConn -%}{%- window = "30s" -%}{%- counter = "conn" -%}
        {%- end -%}
        {%- if value != "" -%}
          {%- var injection = ConfigInjectionKind(value, "token") -%}
          {%- if injection != "" -%}
            {{- fail("Invalid value '" + value + "' for annotation 'nginx.ingress.kubernetes.io/" + field + "' on Ingress '" + key + "': contains " + injection + ", which would break the rate-limit ACL. Use a plain integer.") -}}
          {%- end -%}
          {%- if toint(value) <= 0 -%}
            {{- fail("Invalid value '" + value + "' for annotation 'nginx.ingress.kubernetes.io/" + field + "' on Ingress '" + key + "'. Must be a positive integer.") -}}
          {%- end -%}
          {%- var allow = "" -%}
          {%- var whitelist = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-whitelist"] -%}
          {%- if whitelist != "" -%}{%- allow = ValidateCidrList(whitelist, "nginx.ingress.kubernetes.io/limit-whitelist", key) -%}{%- end -%}
          {%- if len(ignored) > 0 -%}
            {{- recordEvent(ingress, "RateLimitCapIgnored", "Ingress " + key + ": " + join(ignored, ", ") + " ignored, a route has one rate-limit counter and limit-rps > limit-rpm > limit-connections wins.") -}}
          {%- end -%}
          {%- var threshold = toint(value) -%}
          {%- var burst = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/limit-burst-multiplier"] -%}
          {%- if burst != "" && counter == "req" -%}
            {%- if !regex_search(burst, "^[0-9]{1,3}$") || toint(burst) < 1 || toint(burst) > 100 -%}
              {{- fail("Invalid value '" + burst + "' for annotation 'nginx.ingress.kubernetes.io/limit-burst-multiplier' on Ingress '" + key + "'. Must be an integer from 1 to 100.") -}}
            {%- end -%}
            {#- nginx's burst of rate x multiplier becomes a window multiplier times longer with the same average rate. -#}
            {%- window = tostring(toint(window[0:len(window)-1]) * toint(burst)) + "s" -%}
            {%- threshold = threshold * toint(burst) -%}
          {%- end -%}
          {{- PublishRateLimit(key, counter, window, "102400", tostring(threshold), "429", allow) -}}
        {%- end -%}
      {%- end -%}

  # These maps are consumed by base.yaml's frontend-filters-26x-request-set-* rules,
  # so changing a header value is a map-only, reload-free update.
  map-reqhdr-host-760-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/upstream-vhost']"]
      group: map-reqhdr-host
    template: |
      {# Shares the "map-reqhdr-host" first_seen namespace with the haproxytech set-host emitter. #}
      {%- import "util-backend-name-ingress" for BackendNameIngress -%}
      {%- import "util-validate-config-value" for ValidateConfigValue -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var v = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/upstream-vhost"] -%}
        {%- if v != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- for _, rule := range ingress.Spec.Rules -%}
            {%- for _, path := range rule.Http.Paths -%}
              {%- var be = BackendNameIngress(ingress, path) -%}
              {{- shared.Unique("map-reqhdr-host", be,
                "\n" + be + " " + queryEscape(ValidateConfigValue(v,
                  "nginx.ingress.kubernetes.io/upstream-vhost", key, true))) -}}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

