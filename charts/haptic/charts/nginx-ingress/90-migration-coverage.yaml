# nginx-ingress library — migration coverage declaration.
#
# Machine-readable classification of every nginx.ingress.kubernetes.io/*
# annotation this library reads (plus the known-unsupported ones), consumed
# by the playground's migration report and by the generated annotation-support
# tables in docs/site/docs/annotation-compatibility.md. The configMap section
# does the same for the controller ConfigMap (docs/site/docs/migrating.md).
# An Ingress annotation under the prefix
# that isn't declared here records an UnknownAnnotation Event (see
# haptic.projectKnownAnnotations).
#
# Status vocabulary:
#   supported — semantics carried over from ingress-nginx.
#   different — acted on, but with behaviour differences to check (the note
#               says which); includes annotations whose render can fail where
#               ingress-nginx accepted the value.
#   dropped   — accepted with no effect (silently or with a rendered warning).
#   fails     — setting the annotation fails the render.
#
# Drift pinning: scripts/check-migration-coverage.sh diffs the annotation
# keys the library templates actually read against this map (both ways).
# Adding an annotation handler without declaring it here — or declaring a
# supported/different/fails annotation nothing reads — fails `make lint`.
_migrationCoverage:
  - source: ingress-nginx
    detect:
      ingressClasses: ["nginx"]
      annotationPrefixes: ["nginx.ingress.kubernetes.io/"]
    annotations:
      # --- Backend configuration ---
      nginx.ingress.kubernetes.io/proxy-connect-timeout:
        status: supported
        note: Plain seconds, mapped to HAProxy's timeout connect.
      nginx.ingress.kubernetes.io/proxy-read-timeout:
        status: different
        note: Collapses with proxy-send-timeout into HAProxy's single timeout server — the larger value wins, asymmetric read/send timeouts are lost.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-send-timeout:
        status: different
        note: Collapses with proxy-read-timeout into HAProxy's single timeout server — the larger value wins, asymmetric read/send timeouts are lost.
        doc: annotation-support
      nginx.ingress.kubernetes.io/load-balance:
        status: supported
        note: round_robin, least_conn, ip_hash and random map directly; ewma maps to leastconn (closest equivalent); other values fail the render.
      nginx.ingress.kubernetes.io/proxy-body-size:
        status: supported
        note: Enforced as a 413 via a reload-free map entry; "0" disables the limit.
      nginx.ingress.kubernetes.io/backend-protocol:
        status: different
        note: HTTP, HTTPS, `GRPC` and `GRPCS` map to HAProxy server options; `AJP` and `FCGI` have no HAProxy equivalent and fail the render with an error.
        doc: annotation-support
      nginx.ingress.kubernetes.io/use-proxy-protocol:
        status: supported
        note: Sends PROXY protocol v2 to the backend.
      nginx.ingress.kubernetes.io/configuration-snippet:
        status: different
        note: Injected verbatim into the backend section — the value must contain HAProxy directives, not nginx configuration; existing nginx snippets need rewriting. Rejected unless `extraContext.ingressPermissions.allowRawHAProxyConfig` is `true`.
        doc: annotation-support
      nginx.ingress.kubernetes.io/upstream-hash-by:
        status: supported
        note: $request_uri, $remote_addr, $cookie_*, $http_* and $arg_* translate to HAProxy fetches with consistent hashing; other $variables fail the render; non-$ values pass through as HAProxy fetch expressions.
      nginx.ingress.kubernetes.io/proxy-next-upstream:
        status: different
        note: Maps to HAProxy retry-on (error→conn-failure, timeout→response-timeout, invalid_header→junk-response, `http_NNN`→`NNN`); `non_idempotent` is ignored per route — non-idempotent methods are excluded from L7 retries globally (matching nginx's own default), liftable via extraContext.retryNonIdempotent; "off" emits retries 0.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries:
        status: supported
        note: Maps to HAProxy retries; "0" (nginx meaning unlimited) falls back to HAProxy's default retry count.
      nginx.ingress.kubernetes.io/upstream-vhost:
        status: supported
        note: Sets the Host header toward the backend via a reload-free map.
      nginx.ingress.kubernetes.io/x-forwarded-prefix:
        status: supported
        note: Sets the X-Forwarded-Prefix request header via a reload-free map.
      nginx.ingress.kubernetes.io/connection-proxy-header:
        status: supported
        note: Sets the Connection header toward the backend via a reload-free map.
      nginx.ingress.kubernetes.io/proxy-next-upstream-timeout:
        status: dropped
        note: HAProxy bounds each retry by the connect and server timeouts; there is no overall retry deadline.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-http-version:
        status: dropped
        note: HAProxy always speaks HTTP/1.1 to the backend (HTTP/2 for `backend-protocol` `GRPC`), which is the ingress-nginx default; HTTP/1.0 isn't available.
        doc: annotation-support
      nginx.ingress.kubernetes.io/service-upstream:
        status: dropped
        note: Backends always list the Service's ready endpoints and update them without a reload, so routing through the ClusterIP isn't needed.
        doc: annotation-support
      nginx.ingress.kubernetes.io/upstream-hash-by-subset:
        status: dropped
        note: HAProxy's consistent hashing maps a key to one server; subset hashing isn't available.
        doc: annotation-support
      nginx.ingress.kubernetes.io/upstream-hash-by-subset-size:
        status: dropped
        note: HAProxy's consistent hashing maps a key to one server; subset hashing isn't available.
        doc: annotation-support
      # --- Buffering ---
      nginx.ingress.kubernetes.io/proxy-request-buffering:
        status: different
        note: on/off overrides extraContext.requestBuffering.enabled for the route via a reload-free map, but HAProxy buffers only requests with a Content-Length and at most tune.bufsize, so "on" guards against slow clients rather than spooling a whole upload; other values are rejected at admission and warned about otherwise.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-buffer-size:
        status: different
        note: HAProxy has no per-route response buffer; response headers must fit the fleet-wide tune.bufsize minus 1 KiB (15 KiB by default). A larger value records a ProxyBufferSizeExceeded Event naming the extraContext.tune.bufsize that fits.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-buffering:
        status: dropped
        note: HAProxy streams responses through fixed-size buffers; there is no response spooling to switch on or off.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-buffers-number:
        status: dropped
        note: HAProxy streams responses through fixed-size buffers; there is no response spooling to switch on or off.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-busy-buffers-size:
        status: dropped
        note: HAProxy streams responses through fixed-size buffers; there is no response spooling to switch on or off.
        doc: annotation-support
      nginx.ingress.kubernetes.io/client-body-buffer-size:
        status: dropped
        note: HAProxy holds request bodies in tune.bufsize-sized memory buffers and never spools them to disk; see proxy-request-buffering.
        doc: annotation-support
      # --- Rate limiting ---
      nginx.ingress.kubernetes.io/limit-rps:
        status: different
        note: Hard per-source-IP cap rejecting with 429 — ingress-nginx allows a 5x burst and rejects with 503.
        doc: annotation-support
      nginx.ingress.kubernetes.io/limit-rpm:
        status: different
        note: Same hard-cap/429 semantics as limit-rps, and ignored when limit-rps is also set (HAProxy stores one request-rate counter per backend).
        doc: annotation-support
      nginx.ingress.kubernetes.io/limit-connections:
        status: different
        note: Rejects with 429, and ignored when limit-rps or limit-rpm is set (one stick-table per backend).
        doc: annotation-support
      nginx.ingress.kubernetes.io/limit-burst-multiplier:
        status: different
        note: The limit-rps/limit-rpm window becomes multiplier times longer at the same average rate (limit-rps 10 with multiplier 5 allows 50 requests per 5 s), so bursts pass without queueing; it has no effect on limit-connections, and values outside 1-100 fail the render. Without it the limit stays a hard cap rather than ingress-nginx's default 5x burst.
        doc: annotation-support
      nginx.ingress.kubernetes.io/limit-whitelist:
        status: supported
        note: Listed CIDRs are exempt from the rate limits; invalid CIDRs fail the render.
      nginx.ingress.kubernetes.io/limit-rate:
        status: different
        note: Download throttle via an outbound bandwidth-limit filter, but applied per stream — an HTTP/2 client gets the limit once per stream, not once per connection.
      nginx.ingress.kubernetes.io/limit-rate-after:
        status: different
        note: "Mapped to the filter's `min-size`, the smallest chunk forwarded at a time — not the start-throttling-after-N-bytes offset nginx applies, which HAProxy can't express. A large value adds latency rather than delaying the throttle."
      # --- Session affinity ---
      nginx.ingress.kubernetes.io/affinity:
        status: supported
        note: '"cookie" enables dynamic cookie-based stickiness (the only affinity mode, matching ingress-nginx).'
      nginx.ingress.kubernetes.io/affinity-mode:
        status: different
        note: HAProxy's cookie stickiness is always "persistent"; with "balanced" (the ingress-nginx default) existing sessions also stay on their pod when the Service scales up. Other values are rejected at admission and warned about otherwise.
        doc: annotation-support
      nginx.ingress.kubernetes.io/affinity-canary-behavior:
        status: dropped
        note: The canary is picked per request and session affinity doesn't pin a client to it, which is ingress-nginx's "legacy" behaviour; "sticky" isn't available.
        doc: annotation-support
      nginx.ingress.kubernetes.io/session-cookie-change-on-failure:
        status: dropped
        note: When the pinned pod is gone HAProxy always sends the request to another pod and re-pins the cookie, which is ingress-nginx's "true" behaviour.
        doc: annotation-support
      nginx.ingress.kubernetes.io/session-cookie-conditional-samesite-none:
        status: dropped
        note: HAProxy can't vary cookie attributes by User-Agent; SameSite=None is sent to every browser.
        doc: annotation-support
      nginx.ingress.kubernetes.io/session-cookie-name:
        status: supported
        note: Default INGRESSCOOKIE.
      nginx.ingress.kubernetes.io/session-cookie-path:
        status: supported
        note: Emitted as a Path cookie attribute.
      nginx.ingress.kubernetes.io/session-cookie-domain:
        status: supported
        note: Emitted via HAProxy's domain cookie keyword.
      nginx.ingress.kubernetes.io/session-cookie-secure:
        status: supported
        note: Adds the Secure cookie attribute when "true".
      nginx.ingress.kubernetes.io/session-cookie-samesite:
        status: supported
        note: Strict, Lax or None; other values fail the render.
      nginx.ingress.kubernetes.io/session-cookie-max-age:
        status: supported
        note: Emitted as a Max-Age cookie attribute.
      nginx.ingress.kubernetes.io/session-cookie-expires:
        status: different
        note: Emitted as a Max-Age attribute — HAProxy can't compute an absolute Expires date; browsers treat both equivalently.
        doc: annotation-support
      nginx.ingress.kubernetes.io/session-cookie-hash:
        status: dropped
        note: HAProxy's dynamic-cookie hashing isn't selectable; the value is ignored and a warning comment is rendered.
        doc: annotation-support
      # --- URL rewriting / redirects ---
      nginx.ingress.kubernetes.io/rewrite-target:
        status: supported
        note: $N refers to the groups of the Ingress path's regex, which the annotation switches on as in ingress-nginx; literal rewrites are applied reload-free via a map.
      nginx.ingress.kubernetes.io/use-regex:
        status: different
        note: A path with regex syntax matches as a case-insensitive regex anchored at the path start; a literal path keeps its Kubernetes Prefix/Exact match, other Ingresses on the host are unaffected, and regex paths are tried before prefix paths instead of longest first.
        doc: annotation-support
      nginx.ingress.kubernetes.io/app-root:
        status: supported
        note: Redirects "/" to the given path for each rule host.
      nginx.ingress.kubernetes.io/permanent-redirect:
        status: supported
        note: Host-scoped redirect via a reload-free map; rules without a host are skipped.
      nginx.ingress.kubernetes.io/permanent-redirect-code:
        status: supported
        note: Default 301.
      nginx.ingress.kubernetes.io/temporal-redirect:
        status: supported
        note: Host-scoped redirect via a reload-free map; rules without a host are skipped.
      nginx.ingress.kubernetes.io/temporal-redirect-code:
        status: supported
        note: Default 302.
      nginx.ingress.kubernetes.io/from-to-www-redirect:
        status: supported
        note: 301 between the apex host and its www. counterpart, preserving path and scheme.
      nginx.ingress.kubernetes.io/ssl-redirect:
        status: different
        note: Redirects only when explicitly "true" — ingress-nginx redirects TLS-enabled Ingresses by default; the code comes from extraContext.nginxHttpRedirectCode (default 308, matching ingress-nginx's http-redirect-code).
        doc: annotation-support
      nginx.ingress.kubernetes.io/force-ssl-redirect:
        status: supported
        note: Same redirect as ssl-redirect (code from nginxHttpRedirectCode, default 308).
      nginx.ingress.kubernetes.io/preserve-trailing-slash:
        status: dropped
        note: The HTTPS redirect always keeps the request path unchanged, trailing slash included, which is ingress-nginx's "true" behaviour.
        doc: annotation-support
      # --- HSTS ---
      nginx.ingress.kubernetes.io/hsts:
        status: different
        note: By default the header is emitted only when the Ingress sets `hsts` to `"true"`, whereas ingress-nginx enables HSTS globally by default. Set extraContext.tls.hsts.enabled=true to send HSTS on all TLS hosts (matching ingress-nginx); a per-Ingress `hsts` annotation still overrides the value for its hosts.
        doc: annotation-support
      nginx.ingress.kubernetes.io/hsts-max-age:
        status: supported
        note: Default 15724800, matching ingress-nginx.
      nginx.ingress.kubernetes.io/hsts-include-subdomains:
        status: different
        note: includeSubDomains is added only when explicitly "true" — ingress-nginx defaults it to true.
        doc: annotation-support
      nginx.ingress.kubernetes.io/hsts-preload:
        status: supported
        note: Adds preload when "true".
      # --- CORS ---
      nginx.ingress.kubernetes.io/enable-cors:
        status: supported
        note: CORS preflight (OPTIONS) is answered by HAProxy with a 204 carrying the Access-Control-* headers, exactly like ingress-nginx; the backend never sees the preflight. Simple cross-origin responses get the headers added on the way out.
        doc: annotation-support
      nginx.ingress.kubernetes.io/cors-allow-origin:
        status: supported
        note: Comma-separated allow-list with single-level "*." subdomain wildcards, matched against the request Origin; the matched origin is echoed back (a Vary Origin header is added for non-wildcard lists), matching ingress-nginx. A malformed origin fails the render (ingress-nginx skips and logs it).
        doc: annotation-support
      nginx.ingress.kubernetes.io/cors-allow-methods:
        status: supported
        note: Default matches ingress-nginx.
      nginx.ingress.kubernetes.io/cors-allow-headers:
        status: supported
        note: Default matches ingress-nginx.
      nginx.ingress.kubernetes.io/cors-allow-credentials:
        status: different
        note: The header is only sent when explicitly "true" — ingress-nginx defaults it to true.
        doc: annotation-support
      nginx.ingress.kubernetes.io/cors-expose-headers:
        status: supported
        note: Optional Access-Control-Expose-Headers value.
      nginx.ingress.kubernetes.io/cors-max-age:
        status: supported
        note: Default 1728000, matching ingress-nginx.
      # --- Access control ---
      nginx.ingress.kubernetes.io/whitelist-source-range:
        status: different
        note: Host-scoped — the allowlist only gates rules with an explicit host, so an Ingress without rule hosts gets no filtering; invalid CIDRs fail the render.
        doc: annotation-support
      nginx.ingress.kubernetes.io/denylist-source-range:
        status: different
        note: Host-scoped — the denylist only gates rules with an explicit host, so an Ingress without rule hosts gets no filtering; invalid CIDRs fail the render.
        doc: annotation-support
      # --- Custom headers ---
      nginx.ingress.kubernetes.io/custom-request-headers:
        status: supported
        note: Pipe-separated name:value pairs set on requests for the Ingress's hosts (HAPTIC extension — ingress-nginx itself takes custom headers from a ConfigMap).
      nginx.ingress.kubernetes.io/custom-response-headers:
        status: supported
        note: Pipe-separated name:value pairs set on responses for the Ingress's hosts (HAPTIC extension — ingress-nginx itself takes custom headers from a ConfigMap).
      # --- Basic authentication ---
      nginx.ingress.kubernetes.io/auth-type:
        status: different
        note: Only "basic" is supported; "digest" fails the render.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-secret:
        status: different
        note: By default only bcrypt, SHA-256/SHA-512 crypt and yescrypt hashes are accepted. An htpasswd Secret with `$apr1$`, `{SHA}`, `$1$` or plaintext entries works under ingress-nginx but is refused here; regenerate those hashes, for example with `htpasswd -nB <user>`.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-secret-type:
        status: supported
        note: Both auth-file (htpasswd in a single "auth" key) and auth-map (one key per user) are supported.
      nginx.ingress.kubernetes.io/auth-realm:
        status: supported
        note: Default "Restricted".
      nginx.ingress.kubernetes.io/satisfy:
        status: different
        note: '"any" OR-combines whitelist-source-range with basic auth only; unlike ingress-nginx it doesn''t extend to external auth (`auth-url`).'
        doc: annotation-support
      # --- External authentication (SPOA hub external-auth plugin) ---
      nginx.ingress.kubernetes.io/auth-url:
        status: supported
        note: External auth via the SPOA hub external-auth plugin (auto-enabled with this library); 2xx allows, otherwise 401 or the auth-signin redirect.
      nginx.ingress.kubernetes.io/auth-signin:
        status: different
        note: nginx variables (`$escaped_request_uri`, …) aren't expanded — the URL is used verbatim.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-method:
        status: different
        note: Overrides the auth subrequest method; POST/PUT/PATCH are sent with an empty body.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-response-headers:
        status: supported
        note: Listed auth-service response headers are forwarded to the backend on auth success.
      nginx.ingress.kubernetes.io/auth-proxy-set-headers:
        status: dropped
        note: The auth subrequest forwards the client's request headers; extra headers from a ConfigMap can't be added.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-request-redirect:
        status: dropped
        note: No X-Auth-Request-Redirect header is sent to the auth service.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-signin-redirect-param:
        status: dropped
        note: auth-signin is used verbatim; no parameter carrying the original URL is appended.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-always-set-cookie:
        status: dropped
        note: Cookies set by the auth service aren't passed to the client.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-cache-key:
        status: dropped
        note: Auth responses aren't cached; every request is checked against `auth-url`.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-cache-duration:
        status: dropped
        note: Auth responses aren't cached; every request is checked against `auth-url`.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-keepalive:
        status: dropped
        note: Connection reuse toward the auth service is managed by the external-auth plugin and isn't configurable per Ingress.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-keepalive-requests:
        status: dropped
        note: Connection reuse toward the auth service is managed by the external-auth plugin and isn't configurable per Ingress.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-keepalive-timeout:
        status: dropped
        note: Connection reuse toward the auth service is managed by the external-auth plugin and isn't configurable per Ingress.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-keepalive-share-vars:
        status: dropped
        note: nginx variables don't exist in HAProxy; the auth subrequest doesn't share request state with the backend request.
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-global-auth:
        status: dropped
        note: HAPTIC has no global `auth-url`, so there is nothing to opt out of.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-snippet:
        status: dropped
        note: Freeform nginx configuration can't be translated to HAProxy; the haproxy-ingress library's auth-headers-request annotation covers the common use case.
        doc: annotation-support
      # --- Client certificate auth (mTLS) ---
      nginx.ingress.kubernetes.io/auth-tls-secret:
        status: different
        note: Client-CA verification is keyed by SNI — every rule needs an explicit host or the render fails; a missing Secret (or missing ca.crt) skips mTLS for the Ingress with a rendered warning.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-tls-verify-client:
        status: different
        note: '"on"→required; "optional" and "optional_no_ca"→optional (HAProxy has no verify-but-accept-invalid mode); other values fail the render.'
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-tls-error-page:
        status: different
        note: 302 redirect on client-certificate verification failure, applied reload-free via a map — but it only fires when auth-tls-verify-client is optional/optional_no_ca. Under the default "on" (HAProxy verify required) an invalid/missing client cert aborts the TLS handshake, so the request never reaches the redirect and the client sees a TLS error instead of the page.
      nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream:
        status: different
        note: Forwards ssl-client-cert (base64 DER — ingress-nginx sends URL-encoded PEM) and ssl-client-subject-dn; ssl-client-verify and ssl-client-issuer-dn aren't set.
        doc: annotation-support
      nginx.ingress.kubernetes.io/auth-tls-match-cn:
        status: supported
        note: Requests whose client certificate subject DN (RFC 2253, as nginx's $ssl_client_s_dn) doesn't match the regex get 403; like ingress-nginx, it applies only together with auth-tls-secret.
      nginx.ingress.kubernetes.io/auth-tls-verify-depth:
        status: dropped
        note: HAProxy has no per-server/per-crt-list chain-depth option; a warning comment is rendered and the CA bundle scope bounds the accepted chain instead.
        doc: annotation-support
      # --- Backend TLS (proxy-ssl-*) ---
      nginx.ingress.kubernetes.io/proxy-ssl-secret:
        status: supported
        note: Client certificate (tls.crt/tls.key) and CA (ca.crt) toward the upstream; only takes effect with backend-protocol HTTPS or GRPCS.
      nginx.ingress.kubernetes.io/proxy-ssl-verify:
        status: supported
        note: '"on" requires a resolvable proxy-ssl-secret with ca.crt — the render fails instead of silently skipping verification.'
      nginx.ingress.kubernetes.io/proxy-ssl-name:
        status: supported
        note: Used as SNI and, when verifying, as verifyhost.
      nginx.ingress.kubernetes.io/proxy-ssl-ciphers:
        status: supported
        note: Cipher list for the upstream TLS connection.
      nginx.ingress.kubernetes.io/proxy-ssl-protocols:
        status: supported
        note: The listed versions are collapsed into an ssl-min-ver/ssl-max-ver span; gaps in the list can't be expressed.
      nginx.ingress.kubernetes.io/proxy-ssl-verify-depth:
        status: dropped
        note: HAProxy has no per-server chain-depth option; a warning comment is rendered.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-ssl-server-name:
        status: dropped
        note: Not read; SNI toward the upstream is controlled via proxy-ssl-name instead.
        doc: annotation-support
      # --- Upstream cookie / redirect rewriting ---
      nginx.ingress.kubernetes.io/proxy-cookie-domain:
        status: different
        note: Only the "<from> <to>" rewrite form is supported; any other value (including "off") fails the render.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-cookie-path:
        status: different
        note: Only the "<from> <to>" rewrite form is supported; any other value (including "off") fails the render.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-redirect-from:
        status: different
        note: '"default" isn''t supported (warning comment, no rewrite); requires proxy-redirect-to; values must be space-free.'
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-redirect-to:
        status: supported
        note: Replacement text for the Location/Refresh response headers, together with proxy-redirect-from.
      # --- Server alias / default backend ---
      nginx.ingress.kubernetes.io/server-alias:
        status: supported
        note: Aliases route exactly like the Ingress's first rule host, without duplicating path entries.
      nginx.ingress.kubernetes.io/default-backend:
        status: supported
        note: Per-host catch-all backend from the named Service (its first port); silently skipped when the Service is missing.
      nginx.ingress.kubernetes.io/custom-http-errors:
        status: different
        note: Upstream responses with a listed status are replaced by a snapshot of the default backend's page — JSON when the client's first Accept entry is application/json, HTML otherwise. Per-request headers (X-Original-URI, X-Request-ID, X-Service-Name, …) can't influence the page. A changed page is served after the next refresh (extraContext.nginxCustomHTTPErrorsRefreshInterval, default 5m) plus a render and rollout, with one hitless reload. HAProxy's own error responses keep the chart's error pages.
        doc: annotation-support
      # --- SSL passthrough ---
      nginx.ingress.kubernetes.io/ssl-passthrough:
        status: supported
        note: SNI-based TCP passthrough; HTTP-level annotations don't apply to passthrough hosts.
      # --- Canary ---
      nginx.ingress.kubernetes.io/canary:
        status: supported
        note: The canary Ingress must share a host with the main Ingress; rules without a host are skipped.
      nginx.ingress.kubernetes.io/canary-by-header:
        status: supported
        note: Routes to the canary when the header matches (value/pattern via the companion annotations, default "always").
      nginx.ingress.kubernetes.io/canary-by-header-value:
        status: supported
        note: Exact header value required for canary routing.
      nginx.ingress.kubernetes.io/canary-by-header-pattern:
        status: supported
        note: Regex header match for canary routing.
      nginx.ingress.kubernetes.io/canary-by-cookie:
        status: supported
        note: Routes to the canary when the cookie value is "always".
      nginx.ingress.kubernetes.io/canary-weight:
        status: supported
        note: Percentage 0-100 of traffic routed to the canary.
      nginx.ingress.kubernetes.io/canary-weight-total:
        status: dropped
        note: The weight base is fixed at 100.
        doc: annotation-support
      # --- WAF (Coraza / ModSecurity) ---
      nginx.ingress.kubernetes.io/modsecurity-snippet:
        status: supported
        note: SecRule directives are enforced per-Ingress by the bundled Coraza WAF (ModSecurity-compatible) via the SPOA hub; requires the coraza plugin (auto-enabled with this library), otherwise the render fails.
      nginx.ingress.kubernetes.io/enable-modsecurity:
        status: different
        note: '"false" opts the route out of the WAF; "true" sends the route to the Coraza WAF in detect mode, like the detection-only ingress-nginx default (under `default-on` dispatch every route is already inspected); other values fail the render.'
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-owasp-core-rules:
        status: dropped
        note: The Coraza WAF runs the Open Worldwide Application Security Project (OWASP) Core Rule Set v4 on every route it inspects; set `enable-modsecurity` to `false` to opt a route out.
        doc: annotation-support
      nginx.ingress.kubernetes.io/modsecurity-transaction-id:
        status: dropped
        note: Coraza assigns its own transaction ID; the nginx variable expression can't be evaluated.
        doc: annotation-support
      # --- Request mirroring (SPOA hub mirror plugin) ---
      nginx.ingress.kubernetes.io/mirror-target:
        status: different
        note: Mirrors via the SPOA hub mirror plugin — requires spoaHub.plugins.mirror and a rule host (the render fails otherwise); only the URL's authority is used, the live request path/query is re-attached.
        doc: annotation-support
      nginx.ingress.kubernetes.io/mirror-host:
        status: dropped
        note: The mirror plugin forces the mirrored Host header to the target authority.
        doc: annotation-support
      nginx.ingress.kubernetes.io/mirror-request-body:
        status: dropped
        note: The buffered request body is always forwarded to the mirror target.
        doc: annotation-support
      # --- Not carried over ---
      nginx.ingress.kubernetes.io/server-snippet:
        status: dropped
        note: nginx server-level directives have no HAProxy equivalent.
        doc: annotation-support
      nginx.ingress.kubernetes.io/stream-snippet:
        status: dropped
        note: nginx stream directives have no HAProxy equivalent.
        doc: annotation-support
      nginx.ingress.kubernetes.io/proxy-max-temp-file-size:
        status: dropped
        note: HAProxy buffers in memory; there is no temp-file spooling.
        doc: annotation-support
      nginx.ingress.kubernetes.io/custom-headers:
        status: dropped
        note: Response headers from a ConfigMap aren't read; set them with custom-response-headers.
        doc: annotation-support
      nginx.ingress.kubernetes.io/ssl-ciphers:
        status: dropped
        note: Ciphers apply to every TLS host; set them with extraContext.tls.ciphers.
        doc: annotation-support
      nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers:
        status: dropped
        note: HAProxy always prefers the server's cipher order, which is ingress-nginx's "true" behaviour.
        doc: annotation-support
      nginx.ingress.kubernetes.io/http2-push-preload:
        status: dropped
        note: HAProxy doesn't implement HTTP/2 server push, which browsers have also removed.
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-access-log:
        status: dropped
        note: Access logging can't be switched off per Ingress; extraContext.accessLog.suppress.successful drops successful requests fleet-wide.
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-rewrite-log:
        status: dropped
        note: nginx rewrite debugging has no HAProxy equivalent.
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-opentelemetry:
        status: dropped
        note: This annotation requires the nginx OpenTelemetry module. Configure HAPTIC tracing through extraContext.tracing instead.
        doc: annotation-support
      nginx.ingress.kubernetes.io/opentelemetry-trust-incoming-span:
        status: dropped
        note: This annotation requires the nginx OpenTelemetry module. Configure HAPTIC tracing through extraContext.tracing instead.
        doc: annotation-support
      nginx.ingress.kubernetes.io/opentelemetry-operation-name:
        status: dropped
        note: This annotation requires the nginx OpenTelemetry module. Configure HAPTIC tracing through extraContext.tracing instead.
        doc: annotation-support
      nginx.ingress.kubernetes.io/enable-opentracing:
        status: dropped
        note: This annotation requires the nginx OpenTracing module. Configure HAPTIC tracing through extraContext.tracing instead.
        doc: annotation-support
      nginx.ingress.kubernetes.io/opentracing-trust-incoming-span:
        status: dropped
        note: This annotation requires the nginx OpenTracing module. Configure HAPTIC tracing through extraContext.tracing instead.
        doc: annotation-support
    # Controller ConfigMap keys. scripts/gen-migration-docs.sh renders them into docs/site/docs/migrating.md.
    configMap:
      detect:
        names:
        - ingress-nginx-controller
        - nginx-configuration
        labels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
      settings:
      - keys:
        - name: proxy-connect-timeout
          default: '5'
        setting: '`extraContext.timeoutConnect` (`100` ms)'
        status: different
        note: The short default lets a failed connect retry another pod quickly. Raise it only if healthy backends take longer to connect. See [timeouts](libraries/base.md#connection-reliability-and-timeouts).
      - keys:
        - name: proxy-read-timeout
          default: '60'
        - name: proxy-send-timeout
          default: '60'
        setting: '`extraContext.timeoutServer` (`50000` ms)'
        status: different
        note: One inactivity timeout covers both directions.
      - keys:
        - name: client-header-timeout
          default: '60'
        setting: '`extraContext.timeoutHttpRequest` (unset: `timeoutClient`, `50000` ms)'
        status: supported
      - keys:
        - name: client-body-timeout
          default: '60'
        setting: '`extraContext.requestBuffering.waitTimeout` (`10s`)'
        status: different
        note: The total wait for the body before HAProxy forwards the request, not the gap between reads. See [request buffering](libraries/base.md#request-buffering).
      - keys:
        - name: keep-alive
          default: '75'
        setting: '`extraContext.timeoutHttpKeepAlive` (unset: `timeoutHttpRequest`, then `timeoutClient`)'
        status: supported
      - keys:
        - name: worker-shutdown-timeout
          default: 240s
        setting: '`extraContext.hardStopAfter` (`60s`)'
        status: supported
        note: See [graceful reload drain bound](operations/performance.md#graceful-reload-drain-bound).
      - keys:
        - name: proxy-next-upstream
        - name: proxy-next-upstream-tries
        setting: '`extraContext.retryOn` (`conn-failure empty-response response-timeout`); HAProxy retries 3 times'
        status: different
        note: Takes HAProxy `retry-on` conditions, not nginx ones.
      - keys:
        - name: retry-non-idempotent
          default: 'false'
        setting: '`extraContext.retryNonIdempotent` (`false`)'
        status: supported
      - keys:
        - name: upstream-keepalive-*
        status: dropped
        note: HAProxy reuses idle backend connections without configuration.
      - keys:
        - name: proxy-body-size
          default: 1m
        setting: Governance default for `haproxy-haptic.org/max-request-body-size`
        status: different
        note: HAPTIC doesn't limit the body size unless you set a limit.
      - keys:
        - name: client-header-buffer-size
        - name: large-client-header-buffers
        setting: '`extraContext.tune.bufsize` (`16384`)'
        status: different
        note: The request line and all headers must fit in one HAProxy buffer.
      - keys:
        - name: proxy-request-buffering
          default: 'on'
        setting: '`extraContext.requestBuffering.enabled` (`true`)'
        status: different
        note: Buffers at most `tune.bufsize` bytes of the body.
      - keys:
        - name: ssl-protocols
          default: TLSv1.2 TLSv1.3
        setting: '`extraContext.tls.minVersion` (`TLSv1.2`)'
        status: different
        note: Sets a minimum version, not a list. See [TLS cipher suites and protocol versions](ssl-certificates.md#tls-cipher-suites-and-protocol-versions).
      - keys:
        - name: ssl-ciphers
        setting: '`extraContext.tls.ciphers` (TLS 1.2), `extraContext.tls.ciphersuites` (TLS 1.3)'
        status: supported
      - keys:
        - name: ssl-session-tickets
          default: 'false'
        setting: '`extraContext.tls.sessionTickets.enabled` (`false`)'
        status: supported
        note: See [TLS session resumption](ssl-certificates.md#tls-session-resumption).
      - keys:
        - name: enable-ocsp
          default: 'false'
        status: different
        note: 'Always on: every certificate loads with `ocsp-update on`.'
      - keys:
        - name: ssl-redirect
          default: 'true'
        setting: '`extraContext.ingressDefaultSSLRedirect` (`false`)'
        status: different
        note: Off by default. When on, it redirects every host HAPTIC serves over HTTPS, including hosts without `spec.tls`. See [Redirect HTTP to HTTPS](libraries/ingress.md#redirect-http-to-https).
      - keys:
        - name: http-redirect-code
          default: '308'
        setting: '`extraContext.ingressDefaultSSLRedirectCode` (`"308"`); `extraContext.nginxHttpRedirectCode` (`"308"`) for the `ssl-redirect` annotation'
        status: supported
      - keys:
        - name: hsts
          default: 'true'
        setting: '`extraContext.tls.hsts.enabled` (`false`)'
        status: different
        note: Off by default. See [HSTS](ssl-certificates.md#http-strict-transport-security-hsts).
      - keys:
        - name: hsts-max-age
          default: '31536000'
        setting: '`extraContext.tls.hsts.maxAge` (`"31536000"`)'
        status: supported
      - keys:
        - name: hsts-include-subdomains
          default: 'true'
        setting: '`extraContext.tls.hsts.includeSubdomains` (`false`)'
        status: different
        note: Off by default.
      - keys:
        - name: hsts-preload
          default: 'false'
        setting: '`extraContext.tls.hsts.preload` (`false`)'
        status: supported
      - keys:
        - name: use-forwarded-headers
          default: 'false'
        - name: compute-full-forwarded-for
          default: 'false'
        - name: proxy-real-ip-cidr
        setting: '`extraContext.forwardedHeaders.trustedProxies` (`[]`)'
        status: different
        note: 'Like `use-forwarded-headers: false`, HAPTIC replaces `X-Forwarded-For` with the client address and sets `X-Forwarded-Proto`, but drops a client-sent `X-Forwarded-Host` and `X-Forwarded-Port` instead of setting them. Listed sources keep these headers, with the client address appended to `X-Forwarded-For`; HAPTIC doesn''t take the client address from them. See [forwarded headers](operations/security.md#forwarded-headers).'
      - keys:
        - name: forwarded-for-header
        - name: enable-real-ip
        setting: 'Per Ingress: `haproxy-haptic.org/src-ip-header`'
        status: different
        note: '`src-ip-header` takes the client address from the named header on every connection; there''s no trusted-CIDR list for it.'
      - keys:
        - name: use-proxy-protocol
          default: 'false'
        setting: '`extraContext.proxyProtocol.enabled` (`false`)'
        status: different
        note: Adds separate PROXY-protocol ports (`8081`, `8444`) and leaves the HTTP and HTTPS ports unchanged. See [PROXY protocol](haproxy-deployment.md#proxy-protocol).
      - keys:
        - name: use-gzip
          default: 'false'
        - name: gzip-types
        setting: 'Governance default for `haproxy-haptic.org/compress-enable`: set the `default` of the bundled `haptic-compress-enable` rule to `"true"`. Types: `haproxy-haptic.org/compress-types`'
        status: supported
        note: See [compression](libraries/haptic-annotations.md#compression).
      - keys:
        - name: enable-brotli
          default: 'false'
        status: dropped
        note: The community HAProxy build has no Brotli.
      - keys:
        - name: load-balance
          default: round_robin
        setting: Governance default for `haproxy-haptic.org/load-balance` (`roundrobin`)
        status: different
        note: No `ewma`; `leastconn` is the closest.
      - keys:
        - name: whitelist-source-range
        - name: denylist-source-range
        setting: Governance default for `haproxy-haptic.org/allowlist-source-range` or `haproxy-haptic.org/denylist-source-range`
        status: supported
      - keys:
        - name: custom-http-errors
        setting: Override `400.http` … `504.http` under `controller.config.files`
        status: different
        note: Replaces the error pages HAProxy generates; error responses from backends pass through unchanged unless the Ingress sets the [`custom-http-errors` annotation](libraries/nginx-ingress.md#nginxingresskubernetesiocustom-http-errors). See [general files](template-files.md#general-files).
      - keys:
        - name: server-tokens
          default: 'false'
        - name: allow-backend-server-header
          default: 'false'
        status: different
        note: 'Every response carries `Server: haptic`, without a version, replacing any backend `Server` header.'
      - keys:
        - name: allow-snippet-annotations
          default: 'false'
        setting: '`extraContext.ingressPermissions.allowRawHAProxyConfig` (`false`)'
        status: supported
        note: Also covers the raw configuration annotations of the other annotation libraries. See [raw configuration annotations](operations/security.md#raw-configuration-annotations).
      - keys:
        - name: main-snippet
        - name: http-snippet
        - name: server-snippet
        setting: '`controller.config.templateSnippets` at a base-library [extension point](libraries/base.md#available-extension-points)'
        status: different
        note: The content must be HAProxy configuration; rewrite nginx snippets.
      - keys:
        - name: log-format-upstream
        - name: log-format-escape-json
        setting: '`extraContext.accessLog.fields`'
        status: different
        note: The access log is JSON with a fixed core field set. You add fields; you can't redefine the format. See [access logging](operations/access-logging.md).
      - keys:
        - name: access-log-path
        - name: enable-syslog
        - name: syslog-host
        - name: syslog-port
        setting: '`extraContext.accessLog.targets`'
        status: supported
      - keys:
        - name: generate-request-id
          default: 'true'
        status: supported
        note: Every access-log record carries a `req_id`. Forward it upstream with `haproxy-haptic.org/request-id`.
      - keys:
        - name: enable-opentelemetry
        - name: otlp-collector-host
        - name: otlp-collector-port
        - name: otel-service-name
        - name: otel-sampler-ratio
        setting: '`extraContext.tracing.enabled`, `.otlp.endpoint`, `.otlp.serviceName`, `.sampleRate` (a percentage)'
        status: different
        note: Spans are built from access-log records.
      - keys:
        - name: enable-modsecurity
        - name: enable-owasp-modsecurity-crs
        setting: '`extraContext.waf.dispatch.mode: default-on`'
        status: different
        note: Coraza with the Core Rule Set replaces ModSecurity. See [WAF policies](operations/waf-policies.md).
      - keys:
        - name: worker-processes
        setting: '`haproxy.nbthread`'
        status: different
        note: HAProxy runs threads, not processes.
