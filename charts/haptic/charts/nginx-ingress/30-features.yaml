# nginx-ingress library — feature registration + passthrough backends.
templateSnippets:
  # ============================================================================
  # SSL Passthrough
  # ============================================================================

  features-080-nginx-ingress-canary-coexist:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/canary']"]
      group: ingress-route-colocation
      effects: [publishValue]
    template: |-
      {%%
        var ingress = item
        if dig_string(ingress, "", "metadata", "annotations", "nginx.ingress.kubernetes.io/canary") == "true" {
          var identity = dig_string(ingress, "", "metadata", "namespace") + "/" +
            dig_string(ingress, "", "metadata", "name")
          show shared.Publish("identities", identity, true)
        }
      %%}

  features-105-nginx-ingress-ssl-redirect:
    requires: [ingresses]
    template: |-
      {{- render "nginx-ingress-ssl-redirect-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("nginx-ingress-ssl-redirect-hosts", "hosts") -%}
        {%- var redirectHosts []any = gf["sslRedirectHosts"] -%}
        {%- gf["sslRedirectHosts"] = append(redirectHosts, entry) -%}
      {%- end -%}

  nginx-ingress-ssl-redirect-publications:
    requires: [ingresses]
    incremental:
      bindingsTemplate: |-
        {%- var code = extraContext | dig("nginxHttpRedirectCode") | fallback("308") | tostring() -%}
        {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
          {{- fail("Invalid extraContext.nginxHttpRedirectCode '" + code + "': must be one of 301, 302, 303, 307, 308 (the nginx http-redirect-code values).") -}}
        {%- end -%}
        {{- toJSON(map[string]any{"ingresses": map[string]any{"code": code}}) -}}
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/ssl-redirect']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/force-ssl-redirect']"
      group: nginx-ingress-ssl-redirect-hosts
      effects: [publishValue]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil && (ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/ssl-redirect"] == "true" ||
          ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/force-ssl-redirect"] == "true") -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
          {%- if rule.Host != "" -%}
            {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
              "host": toLower(rule.Host), "code": tostring(props["code"]),
            }) -}}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-110-nginx-ingress-mtls:
    requires: [ingresses]
    template: |-
      {%- for _, warning := range incremental_values("mtls-host-policies", "warnings-nginx-ingress") -%}
        {{- tostring(warning) -}}
      {%- end -%}
      {{- render "mtls-host-policies-300-nginx-ingress" -}}

  mtls-host-policies-300-nginx-ingress:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-secret']"]
      group: mtls-host-policies
      effects: [publishValue]
    template: |-
      {#
        Nginx Ingress Client-Cert Verification Registration

        Annotations:
          - nginx.ingress.kubernetes.io/auth-tls-secret: "<name>" or "<ns>/<name>"
            (kubernetes.io/tls Secret with `ca.crt` containing the CA bundle
            that signed the clients' certificates)
          - nginx.ingress.kubernetes.io/auth-tls-verify-client: "on" | "off" |
            "optional" | "optional_no_ca" (default: "on")

        Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#client-certificate-authentication

        Looks up each referenced Secret, writes its `ca.crt` to the SSL
        cert dir via fileRegistry (path becomes `ssl/<ns>-<name>-client-ca.pem`),
        and registers per-host config in `gf["clientCertVerifyHosts"]`.
        ssl.yaml's `features-150-ssl-crtlist` reads that map and emits a
        crt-list line with `[ca-file <path> verify <mode>]` for each
        affected host, so HAProxy verifies incoming client certs against
        the configured CA.

        nginx-ingress's `auth-tls-verify-depth` is intentionally NOT
        wired: HAProxy's crt-list does not expose a per-line verify-depth
        option (depth is global, controlled at the bind level). Operators
        needing a strict depth can rely on the CA bundle scope: only
        certs signed within the bundle's chain depth are accepted.

        Verify-client value mapping (nginx → HAProxy):
          - on               → verify required
          - off              → no entry registered (host falls through to
                               default crt-list line, no client-cert verify)
          - optional         → verify optional
          - optional_no_ca   → verify optional (HAProxy doesn't have a
                               distinct mode for "verify but accept invalid";
                               operators wanting to accept self-signed
                               certs should set verify=optional and inspect
                               ssl_c_used in their auth-tls-error-page logic)
      #}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var secretRef = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-secret"] %}
        {%- if secretRef != "" %}
          {%- var ns = ingress.Metadata.Namespace %}
          {%- var name = ingress.Metadata.Name %}
          {%- var verifyClient = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-verify-client"] | toLower() %}
          {%- if verifyClient == "" %}{%- verifyClient = "on" %}{%- end %}
          {%- if verifyClient != "off" %}
          {%- var verifyMode = "" %}
          {%- if verifyClient == "on" %}
            {%- verifyMode = "required" %}
          {%- else if verifyClient == "optional" || verifyClient == "optional_no_ca" %}
            {%- verifyMode = "optional" %}
          {%- else %}
            {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-tls-verify-client=" + verifyClient + " which is not one of 'on', 'off', 'optional', 'optional_no_ca'.") -}}
          {%- end %}

          {%- var secretNs = ns %}
          {%- var secretName = secretRef %}
          {%- if strings_contains(secretRef, "/") %}
            {%- var parts = split(secretRef, "/") %}
            {%- secretNs = parts[0] %}
            {%- secretName = parts[1] %}
          {%- end %}
          {%- var secret = resources.secrets.GetSingle(secretNs, secretName) %}
          {%- if secret == nil -%}
            {#- See the matching block in haproxy-ingress.yaml for why we
                skip-and-continue rather than fail() here: a missing
                referenced Secret on one Ingress should not cascade to
                webhook-rejection of every other Ingress in the cluster. -#}
            {{- shared.Publish("warnings-nginx-ingress", "nginx-ingress/" + ns + "/" + name + "/0",
              "\n            # WARNING nginx.ingress.kubernetes.io/auth-tls-secret: Secret referenced on Ingress " + ns + "/" + name + " not found at render time; skipping mTLS for this ingress.") -}}
          {%- else -%}
            {%- var caBundleB64 = secret.Data["ca.crt"] %}
            {%- if caBundleB64 == "" -%}
            {{- shared.Publish("warnings-nginx-ingress", "nginx-ingress/" + ns + "/" + name + "/0",
              "\n            # WARNING nginx.ingress.kubernetes.io/auth-tls-secret: Secret referenced on Ingress " + ns + "/" + name + " is missing data.ca.crt; skipping mTLS for this ingress.") -}}
            {%- else -%}
            {%- var caBundle = caBundleB64 | b64decode() | tostring() %}
          {#- Register the CA bundle as a "file" (general/) not "cert" (ssl/).
              HAProxy's runtime cert API takes ssl/ entries as
              cert+key bundles ("file should contain both certificate and
              private key" / 500), but a CA bundle has no private key. -#}
          {%- var caFilename = secretNs + "-" + secretName + "-client-ca.pem" %}
          {{- shared.Publish("files", "nginx-ingress/" + ns + "/" + name + "/0",
            map[string]any{"filename": caFilename, "content": caBundle}) -}}

          {%- for ruleIndex, rule := range ingress.Spec.Rules %}
            {%- var host = rule.Host %}
            {%- if host == "" %}
              {{- fail("Ingress " + ns + "/" + name + " has nginx.ingress.kubernetes.io/auth-tls-secret set but a rule without a host. Client-cert verification is keyed by SNI / host; host-less rules can't be enforced. Add an explicit host to the rule.") -}}
            {%- end %}
            {{- shared.Publish("verifyHosts", "nginx-ingress/" + ns + "/" + name + "/" + tostring(ruleIndex), map[string]any{
              "host": host, "route": ns + "/" + name, "filename": caFilename, "verifyMode": verifyMode,
            }) -}}
          {%- end %}
            {%- end %}
          {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  features-140-nginx-ingress-redirects:
    requires: [ingresses]
    template: |-
      {{- render "nginx-ingress-redirect-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("nginx-ingress-redirect-hosts", "hosts") -%}
        {%- var redirects []any = coalesce(gf["redirectHosts"], []any{}) -%}
        {%- gf["redirectHosts"] = append(redirects, entry) -%}
      {%- end -%}

  nginx-ingress-redirect-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/permanent-redirect']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/temporal-redirect']"
      group: nginx-ingress-redirect-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
        {%- var valid = true -%}
        {%- var permUrl = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/permanent-redirect"] -%}
        {%- if permUrl != "" -%}
          {%- if regex_search(permUrl, "[[:cntrl:]]") -%}
            {%- var message = "Invalid value for annotation 'nginx.ingress.kubernetes.io/permanent-redirect' on Ingress '" + key + "': must not contain control characters — config-injection guard." -%}
            {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
              {{- fail(message) -}}
            {%- else -%}
              {{- recordEvent(ingress, "InvalidAnnotation", message) -}}
            {%- end -%}
            {%- valid = false -%}
          {%- else -%}
            {%- var code = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/permanent-redirect-code"] -%}
            {%- if code == "" -%}{%- code = "301" -%}{%- end -%}
            {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
              {%- var message = "Annotation 'nginx.ingress.kubernetes.io/permanent-redirect-code' on Ingress '" + key + "' must be one of 301, 302, 303, 307, 308; the redirect is not applied." -%}
              {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
                {{- fail(message) -}}
              {%- else -%}
                {{- recordEvent(ingress, "InvalidRedirect", message) -}}
              {%- end -%}
              {%- valid = false -%}
            {%- else -%}
              {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
                {%- if rule.Host != "" -%}
                  {{- shared.Publish("hosts", key + "/permanent/" + tostring(ruleIndex), map[string]any{
                    "host": toLower(rule.Host), "location": permUrl, "code": code,
                  }) -}}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
        {%- var tempUrl = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/temporal-redirect"] -%}
        {%- if valid && tempUrl != "" -%}
          {%- if regex_search(tempUrl, "[[:cntrl:]]") -%}
            {%- var message = "Invalid value for annotation 'nginx.ingress.kubernetes.io/temporal-redirect' on Ingress '" + key + "': must not contain control characters — config-injection guard." -%}
            {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
              {{- fail(message) -}}
            {%- else -%}
              {{- recordEvent(ingress, "InvalidAnnotation", message) -}}
            {%- end -%}
          {%- else -%}
            {%- var code = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/temporal-redirect-code"] -%}
            {%- if code == "" -%}{%- code = "302" -%}{%- end -%}
            {%- if code != "301" && code != "302" && code != "303" && code != "307" && code != "308" -%}
              {%- var message = "Annotation 'nginx.ingress.kubernetes.io/temporal-redirect-code' on Ingress '" + key + "' must be one of 301, 302, 303, 307, 308; the redirect is not applied." -%}
              {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
                {{- fail(message) -}}
              {%- else -%}
                {{- recordEvent(ingress, "InvalidRedirect", message) -}}
              {%- end -%}
            {%- else -%}
              {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
                {%- if rule.Host != "" -%}
                  {{- shared.Publish("hosts", key + "/temporal/" + tostring(ruleIndex), map[string]any{
                    "host": toLower(rule.Host), "location": tempUrl, "code": code,
                  }) -}}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-145-nginx-ingress-app-root:
    requires: [ingresses]
    template: |-
      {{- render "nginx-ingress-app-root-publications" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) -%}
      {%- for _, entry := range incremental_values("nginx-ingress-app-root-hosts", "hosts") -%}
        {%- var roots []any = coalesce(gf["appRootHosts"], []any{}) -%}
        {%- gf["appRootHosts"] = append(roots, entry) -%}
      {%- end -%}

  nginx-ingress-app-root-publications:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/app-root']"]
      group: nginx-ingress-app-root-hosts
      effects: [publishValue, recordEvent]
    template: |-
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var appRoot = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/app-root"] -%}
        {%- if appRoot != "" -%}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name -%}
          {%- if regex_search(appRoot, "[[:cntrl:]]") -%}
            {%- var message = "Invalid value for annotation 'nginx.ingress.kubernetes.io/app-root' on Ingress '" + key + "': must not contain control characters — config-injection guard." -%}
            {%- if tostring(renderSubject | dig("mode") | fallback("reconcile")) == "admission" -%}
              {{- fail(message) -}}
            {%- else -%}
              {{- recordEvent(ingress, "InvalidAnnotation", message) -}}
            {%- end -%}
          {%- else -%}
            {%- for ruleIndex, rule := range ingress.Spec.Rules -%}
              {%- if rule.Host != "" -%}
                {{- shared.Publish("hosts", key + "/" + tostring(ruleIndex), map[string]any{
                  "host": toLower(rule.Host), "path": appRoot,
                }) -}}
              {%- end -%}
            {%- end -%}
          {%- end -%}
        {%- end -%}
      {%- end -%}

  features-150-nginx-ingress-mtls-error:
    requires: [ingresses]
    template: |-
      {{- render "mtls-host-policies-600-nginx-ingress-error" -}}

  mtls-host-policies-600-nginx-ingress-error:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/auth-tls-error-page']"]
      group: mtls-host-policies
      effects: [publishValue]
    template: |-
      {#
        nginx auth-tls-error-page — registers host→error-page URL into the shared
        gf["mtlsErrorHosts"]. base.yaml features-185-mtls-error-map builds
        mtls-error.map and frontend-filters-075-mtls-error emits the
        ssl_c_verify-gated redirect, so changing the error page is map-only and
        reload-free. The cert-passthrough set-headers stay in the vendor
        frontend-filters-790 snippet. Annotation: auth-tls-error-page
      #}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {%- var errorPage = ingress.Metadata.Annotations["nginx.ingress.kubernetes.io/auth-tls-error-page"] %}
        {%- if errorPage != "" %}
          {%- var key = ingress.Metadata.Namespace + "/" + ingress.Metadata.Name %}
          {%- if regex_search(errorPage, "[[:cntrl:]]") %}{{ fail("Invalid URL in annotation 'nginx.ingress.kubernetes.io/auth-tls-error-page' on Ingress '" + key + "': must not contain control characters (newlines/tabs) — config-injection guard.") }}{%- end %}
          {%- for ruleIndex, rule := range ingress.Spec.Rules %}
            {%- if rule.Host != "" %}
              {{- shared.Publish("errorHosts", "nginx-ingress/" + ingress.Metadata.Namespace + "/" + ingress.Metadata.Name + "/" + tostring(ruleIndex),
                map[string]any{"host": toLower(rule.Host), "location": errorPage}) -}}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end -%}

  features-155-nginx-ingress-hsts:
    requires: [ingresses]
    incremental:
      source: ingresses
      whenAnyPathExists:
        - "metadata.annotations['nginx.ingress.kubernetes.io/hsts']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/hsts-max-age']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/hsts-include-subdomains']"
        - "metadata.annotations['nginx.ingress.kubernetes.io/hsts-preload']"
      group: hsts-hosts
      effects: [publishValue]
    template: |
      {#
        nginx HSTS — registers host→Strict-Transport-Security value into the shared
        gf["hstsHosts"]; base.yaml features-190-hsts-map builds hsts.map and
        frontend-filters-080-hsts emits the single shared response-header rule
        (map-only, reload-free). Annotations: hsts / hsts-max-age /
        hsts-include-subdomains / hsts-preload.
      #}
      {%- import "util-register-annotation-hsts" for RegisterAnnotationHSTS -%}
      {%- var ingress = resources.ingresses.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if ingress != nil -%}
        {{ RegisterAnnotationHSTS(ingress,
            "nginx.ingress.kubernetes.io/hsts",
            "nginx.ingress.kubernetes.io/hsts-max-age",
            "nginx.ingress.kubernetes.io/hsts-include-subdomains",
            "nginx.ingress.kubernetes.io/hsts-preload",
            "15724800") }}
      {%- end -%}

  backends-501-nginx-ingress-ssl-passthrough:
    requires: [ingresses, services, endpoints]
    incremental:
      source: ingresses
      whenAnyPathExists: ["metadata.annotations['nginx.ingress.kubernetes.io/ssl-passthrough']"]
      group: ingress-ssl-passthrough
      effects: [publishValue, backendPlan]
    template: |-
      {%- import "util-annotation-ssl-passthrough-component" for RenderAnnotationSSLPassthrough -%}
      {{- RenderAnnotationSSLPassthrough(item,
        "nginx.ingress.kubernetes.io/ssl-passthrough",
        "ssl-passthrough-ni-", "nginx", "nginx-ingress") -}}
