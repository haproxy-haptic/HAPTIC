            name: bodysize-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: bodysize-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8080
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: bodysize-ingress
