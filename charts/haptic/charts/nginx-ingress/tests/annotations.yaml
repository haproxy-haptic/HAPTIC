              - host: lr-zero.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: lr-service, port: {number: 80}}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "limit-rate' on Ingress 'default/lr-zero'. Must be a positive byte size"}

  test-nginx-ingress-limit-rate:
    description: limit-rate / limit-rate-after map to a per-stream bwlim-out download throttle
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: lr-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lr-ingress
            annotations:
              nginx.ingress.kubernetes.io/limit-rate: "100k"
              nginx.ingress.kubernetes.io/limit-rate-after: "1m"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: lr-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # The rate comes from the map; only the min-size is spelled out, because a
      # filter's min-size is part of its declaration and can't come from a map.
      # Both values are stored as bytes, so "1m" and "1048576" share one filter.
      - {type: contains, target: "map:ing-bw-routes.map", pattern: '(?m)^default/lr-ingress 102400 1048576$'}
      - {type: contains, target: haproxy.cfg, pattern: 'filter bwlim-out ing_bw_out_1048576 default-limit 1m default-period 1s min-size 1048576'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-bandwidth-limit ing_bw_out_1048576 limit var\(txn\.ibw_rate\) if \{ var\(txn\.ibw_min\) -m str 1048576 \}'}
      # The route's backend keeps no filter, which is what makes it dynamic.
      - {type: not_contains, target: haproxy.cfg, pattern: 'ni_limitrate_default_lr-ingress'}
  test-nginx-ingress-proxy-redirect:
    description: proxy-redirect-from/-to rewrites the upstream Location response header
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: pr-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: pr-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-redirect-from: "http://backend.local"
              nginx.ingress.kubernetes.io/proxy-redirect-to: "https://public.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: pr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: pr-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'http-response replace-header Location http://backend\\.local https://public\.example\.com if \{ var\(txn\.resource_key\),concat\(\|ni\|http://backend\.local\|https://public\.example\.com\),map\(\S*/ing-location-rewrite-routes\.map\) -m found \}'
      - {type: contains, target: "map:ing-location-rewrite-routes.map", pattern: '(?m)^default/pr-ingress\|ni\|http://backend\.local\|https://public\.example\.com 1$'}

  test-nginx-ingress-rate-limit-rps:
    description: Nginx Ingress limit-rps annotation generates stick-table and deny 429
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: ratelimit-ingress
            annotations:
              nginx.ingress.kubernetes.io/limit-rps: "10"
          spec:
            ingressClassName: haproxy
            rules:
              - host: ratelimit.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "stick-table type string len 340 size 102400 expire 1s store http_req_rate\\(1s\\) peers localinstance"
      - type: contains
        target: haproxy.cfg
        pattern: 'http-request track-sc0 var\(txn\.vrl_key\) table ing_rl_tbl_req_1s if \{ var\(txn\.vrl_counter\) -m str req \} \{ var\(txn\.vrl_window\) -m str 1s \}'
      - {type: contains, target: haproxy.cfg, pattern: 'http-request deny deny_status 429 if \{ var\(txn\.vrl_status\) -m str 429 \}'}
      - {type: contains, target: "map:ing-rl-routes.map", pattern: '(?m)^default/ratelimit-ingress req 1s 10 429$'}
      # The route's backend stays plain — the counters live in the shared table
      # proxy, which is what keeps the backend's servers dynamic.
      - {type: not_contains, target: haproxy.cfg, pattern: 'http-request track-sc0 src'}
  test-nginx-ingress-rate-limit-rpm:
    description: Nginx Ingress limit-rpm annotation generates per-minute stick-table and deny 429
    fixtures:
