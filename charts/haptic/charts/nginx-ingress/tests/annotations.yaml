  test-nginx-ingress-limit-rate-shares-one-filter:
    description: Two routes with the same limit-rate-after share one filter; a route without it uses the plain one.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: lr-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lr-a
            annotations:
              nginx.ingress.kubernetes.io/limit-rate: "100k"
              nginx.ingress.kubernetes.io/limit-rate-after: "1m"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lr-a.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: lr-service, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lr-b
            annotations:
              nginx.ingress.kubernetes.io/limit-rate: "200k"
              nginx.ingress.kubernetes.io/limit-rate-after: "1m"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lr-b.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: lr-service, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lr-plain
            annotations:
              nginx.ingress.kubernetes.io/limit-rate: "50k"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lr-plain.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: lr-service, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      # Different rates, one shared filter: the rate is a map value.
      - {type: contains, target: "map:ing-bw-routes.map", pattern: '(?m)^default/lr-a 102400 1048576$'}
      - {type: contains, target: "map:ing-bw-routes.map", pattern: '(?m)^default/lr-b 204800 1048576$'}
      - {type: contains, target: "map:ing-bw-routes.map", pattern: '(?m)^default/lr-plain 51200 _$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'filter bwlim-out ing_bw_out_1048576[^\n]*\n\s*filter bwlim-out ing_bw_out_1048576'}
      # The route with no limit-rate-after takes the plain filter.
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-bandwidth-limit ing_bw_out limit var\(txn\.ibw_rate\) if \{ var\(txn\.ibw_min\) -m str _ \}'}

  test-nginx-ingress-limit-rate-overflow-rejected:
    description: >-
      A magnitude large enough to overflow the 64-bit product is refused. '17179869185g'
      wraps to exactly 1 GiB, which would ship a wrong throttle instead of failing.
    fixtures:
