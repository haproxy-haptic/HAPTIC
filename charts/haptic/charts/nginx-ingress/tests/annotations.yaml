# nginx-ingress library — annotation validation tests.
# Backend directives, frontend filters, session affinity, basic auth, and
# SSL passthrough.
_fx:
  httpRoot: &httpRoot
    paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: echo, port: {number: 80}}}

validationTests:
  # ==========================================================================
  # Backend Directive Tests
  # ==========================================================================

  test-nginx-ingress-timeouts:
    description: Nginx Ingress timeout annotations generate correct config
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: timeout-ingress
            annotations:
              nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
          spec:
            ingressClassName: haproxy
            rules:
              - host: timeout.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "timeout connect 10s"}
      # read/send timeout collapses into the settable server timeout, stored as ms
      # in backend-timeouts.map (reload-free) rather than a per-backend directive.
      - {type: contains, target: 'map:backend-timeouts.map', pattern: 'default_timeout-ingress_svc_echo_80\|server 60000'}
      - {type: not_contains, target: haproxy.cfg, pattern: "timeout server 60s"}

  test-nginx-ingress-load-balance:
    description: Nginx Ingress load-balance annotation maps to HAProxy algorithm
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: lb-ingress
            annotations:
              nginx.ingress.kubernetes.io/load-balance: "least_conn"
          spec:
            ingressClassName: haproxy
            rules:
              - host: lb.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "balance leastconn"}

  test-nginx-ingress-ssl-redirect:
    description: Nginx Ingress ssl-redirect annotation generates 308 redirect (matches ingress-nginx)
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: redirect-ingress
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: redirect.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "redirect scheme https code 308"}
      # Relocated to the shared host map (reload-free host add/remove).
      - {type: contains, target: map:ssl-redirect-308.map, pattern: "redirect.example.com 1"}
      - {type: not_contains, target: haproxy.cfg, pattern: "var\\(txn.host\\) -m str redirect.example.com"}

  test-nginx-ingress-ssl-redirect-code-override:
    description: ssl-redirect honours the nginxHttpRedirectCode extraContext override
    extraContext: {nginxHttpRedirectCode: "301"}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: redirect-ingress
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: redirect.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "redirect scheme https code 301"}
      - {type: contains, target: map:ssl-redirect-301.map, pattern: "redirect.example.com 1"}

  test-nginx-ingress-force-ssl-redirect:
    description: Nginx Ingress force-ssl-redirect annotation generates 308 redirect
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: force-redirect-ingress
            annotations:
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: force-redirect.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "redirect scheme https code 308"}
      - {type: contains, target: map:ssl-redirect-308.map, pattern: "force-redirect.example.com 1"}

  test-nginx-ingress-cors:
    description: Nginx Ingress CORS annotations generate correct headers
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              nginx.ingress.kubernetes.io/enable-cors: "true"
              nginx.ingress.kubernetes.io/cors-allow-origin: "https://example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cors.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # The route feeds the shared lane: the exact origin is a membership row and
      # the Allow-Origin header echoes the matched request Origin (never the raw
      # annotation), matching ingress-nginx, on http-after-response so it also
      # covers the synthetic preflight 204.
      - {type: contains, target: "map:ing-cors-routes.map", pattern: '(?m)^default/cors-ingress ni:list 0 1 0 1$'}
      - {type: contains, target: "map:ing-cors-origins.map", pattern: '(?m)^default/cors-ingress\|https://example\.com 1$'}
      - {type: contains, target: "map:ing-cors-methods.map", pattern: '(?m)^default/cors-ingress GET%2c%20PUT%2c%20POST%2c%20DELETE%2c%20PATCH%2c%20OPTIONS$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ni_cors_origin\) req\.hdr\(Origin\) if \{ var\(txn\.ni_cors\) -m beg "ni:" \}'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header Access-Control-Allow-Origin ''%\[var\(txn\.ni_cors_origin\)\]'' if \{ var\(txn\.ni_cors_ok\) -m found \} \{ var\(txn\.ni_cors\) -m beg "ni:list" \}'}
      - {type: contains, target: haproxy.cfg, pattern: "http-after-response add-header Vary Origin"}
      - {type: contains, target: haproxy.cfg, pattern: "status 204 .*METH_OPTIONS"}
      - {type: not_contains, target: haproxy.cfg, pattern: "acl cors_origin_"}

  test-nginx-ingress-cors-multiorigin:
    description: cors-allow-origin accepts a comma-separated allow-list with single-level wildcards; exact origins go to -m str, wildcards compile to anchored -m reg
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cors-ingress
            annotations:
              nginx.ingress.kubernetes.io/enable-cors: "true"
              nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.com, https://*.example.com"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cors.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      # Exact origin -> membership row; single-level wildcard -> an anchored
      # regex row keyed by route; the matched request Origin is echoed back.
      - {type: contains, target: "map:ing-cors-routes.map", pattern: '(?m)^default/cors-ingress ni:list 0 1 1 1$'}
      - {type: contains, target: "map:ing-cors-origins.map", pattern: '(?m)^default/cors-ingress\|https://app\.example\.com 1$'}
      - {type: contains, target: "map:ing-cors-regex.map", pattern: '(?m)^\^default/cors-ingress\\\|https://\[A-Za-z0-9\\-\]\+\\\.example\\\.com\$ 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'concat\(\|,txn\.ni_cors_origin\),map_reg\(\S*/ing-cors-regex\.map\) -m found'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-after-response set-header Access-Control-Allow-Origin ''%\[var\(txn\.ni_cors_origin\)\]'''}

  test-nginx-ingress-access-control:
    description: Nginx Ingress whitelist-source-range creates ACL and deny rule
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: allow-ingress
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
          spec:
            ingressClassName: haproxy
            rules:
              - host: allow.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-ac-routes.map", pattern: '(?m)^default/allow-ingress ni:allow$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^10\.0\.0\.0/8\|default/allow-ingress 1$'}
      - {type: contains, target: "map:ing-ac-allow.map", pattern: '(?m)^192\.168\.0\.0/16\|default/allow-ingress 1$'}
      - {type: contains, target: haproxy.cfg, pattern: 'http-request set-var\(txn\.ac_denied\) bool\(1\) if \{ var\(txn\.ac\) -m str "ni:allow" "ni:both" \} !\{ var\(txn\.ac_block\),concat\(\|,txn\.resource_key\),map\(\S*/ing-ac-allow\.map\) -m found \}'}

  test-nginx-ingress-hsts:
    description: Nginx Ingress HSTS annotations generate correct header
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hsts-ingress
            annotations:
              nginx.ingress.kubernetes.io/hsts: "true"
              nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
              nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
              nginx.ingress.kubernetes.io/hsts-preload: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hsts.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:hsts.map
        pattern: "hsts.example.com max-age%3d31536000%3b%20includeSubDomains%3b%20preload"
      - type: contains
        target: haproxy.cfg
        pattern: "http-after-response set-header Strict-Transport-Security %\\[var\\(txn.host\\),map\\([^)]*hsts\\.map\\),url_dec\\(1\\)\\] if \\{ ssl_fc \\}"

  test-nginx-ingress-backend-protocol-https:
    description: Nginx Ingress backend-protocol HTTPS adds ssl to server options
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: https-service}
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: https-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: https-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: https-ingress
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          spec:
            ingressClassName: haproxy
            rules:
              - host: https.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: https-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "ssl verify none"}

  test-nginx-ingress-backend-protocol-grpc:
    description: Nginx Ingress backend-protocol GRPC adds proto h2 to server options
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: grpc-service}
          spec:
            ports:
              - port: 50051
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: grpc-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: grpc-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 50051
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: grpc-ingress
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
          spec:
            ingressClassName: haproxy
            rules:
              - host: grpc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: grpc-service, port: {number: 50051}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "proto h2"}

  test-nginx-ingress-session-affinity:
    description: Nginx Ingress cookie affinity generates cookie directive
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: affinity-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "SERVERID"
          spec:
            ingressClassName: haproxy
            rules:
              - host: affinity.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie SERVERID insert indirect nocache dynamic"}

  test-nginx-ingress-session-cookie-hash-ignored:
    description: session-cookie-hash is not configurable in HAProxy and surfaces a warning instead of being silently ignored
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: hash-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hash-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hash.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: hash-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "Warning:.*session-cookie-hash"}

  test-nginx-ingress-session-cookie-domain-maxage:
    description: session-cookie-domain and session-cookie-max-age map to the cookie domain / Max-Age attributes
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: sc-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sc-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "SRVID"
              nginx.ingress.kubernetes.io/session-cookie-domain: "example.com"
              nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
          spec:
            ingressClassName: haproxy
            rules:
              - host: sc.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: sc-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie SRVID insert.* domain example.com"}
      - {type: contains, target: haproxy.cfg, pattern: "cookie SRVID insert.* attr Max-Age=3600"}

  test-nginx-ingress-session-cookie-expires:
    description: legacy session-cookie-expires maps to attr Max-Age when session-cookie-max-age is absent
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: sce-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sce-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "SRVID"
              nginx.ingress.kubernetes.io/session-cookie-expires: "7200"
          spec:
            ingressClassName: haproxy
            rules:
              - host: sce.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: sce-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie SRVID insert.* attr Max-Age=7200"}

  test-nginx-ingress-session-cookie-maxage-precedence:
    description: session-cookie-max-age takes precedence over session-cookie-expires when both are set
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: scp-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: scp-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "SRVID"
              nginx.ingress.kubernetes.io/session-cookie-max-age: "100"
              nginx.ingress.kubernetes.io/session-cookie-expires: "999"
          spec:
            ingressClassName: haproxy
            rules:
              - host: scp.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: scp-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "cookie SRVID insert.* attr Max-Age=100"}
      - {type: not_contains, target: haproxy.cfg, pattern: "Max-Age=999"}

  test-nginx-ingress-session-cookie-maxage-invalid:
    description: a non-integer session-cookie-max-age aborts the render
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: sci-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: sci-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-max-age: "abc"
          spec:
            ingressClassName: haproxy
            rules:
              - host: sci.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: sci-service, port: {number: 80}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Must be a non-negative integer"}

  test-nginx-ingress-session-cookie-secure-samesite:
    description: session-cookie-secure and session-cookie-samesite add Secure / SameSite cookie attrs
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: cookieattr-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: cookieattr-ingress
            annotations:
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "AFFINITY"
              nginx.ingress.kubernetes.io/session-cookie-secure: "true"
              nginx.ingress.kubernetes.io/session-cookie-samesite: "Strict"
          spec:
            ingressClassName: haproxy
            rules:
              - host: cookieattr.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: cookieattr-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "cookie AFFINITY insert indirect nocache dynamic attr Secure attr SameSite=Strict"

  test-nginx-ingress-auth-basic-missing-secret:
    description: >-
      nginx.ingress.kubernetes.io/auth-secret referencing a Secret absent from
      the render snapshot (informer lag / cascade-delete) must skip the userlist
      + auth ACL cleanly, not panic. Regression for the typed-nil gotcha
      (GetSingle returns a typed-nil *resources.secrets.T when absent; boxing it
      through shared.ComputeIfAbsent's func() any made `!= nil` pass, then
      `.Data["auth"]` dereferenced nil).
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress-missing-secret
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "absent-secret"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth-missing.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "userlist ni_auth_default_absent-secret"}
      - {type: not_contains, target: haproxy.cfg, pattern: "http_auth(ni_auth_default_absent-secret)"}

  test-nginx-ingress-auth-basic:
    description: Nginx Ingress basic auth generates userlist and auth directive
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: my-auth}
          type: Opaque
          data:
            auth: YWRtaW46JDJ5JDA1JG1PMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtXCg==
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: auth-ingress
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "my-auth"
          spec:
            ingressClassName: haproxy
            rules:
              - host: auth.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist ni_auth_default_my-auth"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password"}
      - {type: contains, target: haproxy.cfg, pattern: "http-request auth"}

  test-nginx-ingress-auth-secret-type-map:
    description: auth-secret-type=auth-map reads usernames from Secret data keys (values = password hashes)
    extraContext: {annotationCompatibility: {basicAuth: {passwordHashValidation: {regex: "^.*$"}}}}
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: authmap-secret}
          type: Opaque
          data: {admin: JDJ5JDA1JG1PMVdWazVRbmJnNFF3ZEFkWGJmei44YjNjZUg2UTVLT1ZDS3hSMklrTkFmSmdMaTVwSUtX}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: authmap-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: authmap-ingress
            annotations:
              nginx.ingress.kubernetes.io/auth-type: "basic"
              nginx.ingress.kubernetes.io/auth-secret: "authmap-secret"
              nginx.ingress.kubernetes.io/auth-secret-type: "auth-map"
          spec:
            ingressClassName: haproxy
            rules:
              - host: authmap.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: authmap-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "userlist ni_auth_default_authmap-secret"}
      - {type: contains, target: haproxy.cfg, pattern: "user admin password"}

  test-nginx-ingress-auth-secret-type-map-invalid-hash:
    description: auth-map rejects a Secret value outside the htpasswd-hash charset (config-injection guard)
    fixtures:
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {namespace: default, name: badmap-secret}
          type: Opaque
          data: {admin: ZXZpbCd2YWw=}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: badmap-service}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: badmap-ingress
            annotations:
