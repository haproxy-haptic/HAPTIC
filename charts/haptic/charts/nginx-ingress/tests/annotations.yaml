              nginx.ingress.kubernetes.io/proxy-body-size: "10m"
          spec:
            ingressClassName: haproxy
            rules:
              - host: bodysize.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: bodysize-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:body-size.map
        pattern: "default_bodysize-ingress_svc_bodysize-service_80 10485760"
      # The old per-backend literal deny must be gone (relocated to the
      # resource-agnostic frontend-filters-250-request-body-size scaffold).
      - {type: not_contains, target: haproxy.cfg, pattern: "req.body_size gt 10485760"}

  test-nginx-ingress-ssl-passthrough:
    description: Nginx Ingress ssl-passthrough creates TCP backend and SNI routing
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: passthrough-service}
          spec:
            ports:
              - port: 443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: passthrough-service-abc
            namespace: default
            labels:
              kubernetes.io/service-name: passthrough-service
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
          ports:
            - port: 8443
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: passthrough.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: passthrough-service, port: {number: 443}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: "backend ssl-passthrough-ni-default-passthrough-ingress"
      - {type: contains, target: haproxy.cfg, pattern: "mode tcp"}
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend ssl-passthrough-ni-default-passthrough-ingress if { req_ssl_sni -m str passthrough.example.com }"

  test-nginx-ingress-ssl-passthrough-skips-ingress-without-paths:
    description: "Regression test for the dry-run race that flaked TestIngressAnnotations/nginx-ssl-passthrough on !893. The passthrough component resolves a usable service before publishing an SNI, so an Ingress without http.paths emits neither use_backend nor backend."
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: passthrough-ingress-no-paths
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: noservice.example.com
                # Note: no `http:` block, so no paths.
    assertions:
      - type: haproxy_valid
      - type: not_contains
        target: haproxy.cfg
        pattern: "ssl-passthrough-ni-default-passthrough-ingress-no-paths"
  test-nginx-ingress-ssl-passthrough-named-port:
    description: nginx-ingress SSL passthrough must resolve a port.name backend to the numeric pod port.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: secure-app, namespace: default}
          spec:
            ports:
              - {name: https, port: 8443, targetPort: https}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secure-app-xyz
            namespace: default
            labels:
              kubernetes.io/service-name: secure-app
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.50"]
              targetRef: {kind: Pod, name: secure-app-0}
          ports:
            - {name: https, port: 8443, protocol: TCP}
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: secure-app
            namespace: default
            annotations:
              nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: secure-app.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: secure-app, port: {name: https}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "server secure-app-0 10.0.0.50:8443 "}
      - {type: not_contains, target: haproxy.cfg, pattern: "server secure-app-0 10.0.0.50:80 "}

  # ==========================================================================
  # Upstream request headers (upstream-vhost / x-forwarded-prefix / connection-proxy-header)
  # ==========================================================================

  test-nginx-ingress-upstream-headers:
    description: upstream-vhost, x-forwarded-prefix, and connection-proxy-header set upstream request headers
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: uh-svc}
          spec:
            ports:
              - port: 80
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: uh-ingress
            annotations:
              nginx.ingress.kubernetes.io/upstream-vhost: "internal.example.com"
              nginx.ingress.kubernetes.io/x-forwarded-prefix: "/app"
              nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
          spec:
            ingressClassName: nginx
            rules:
              - host: uh.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: uh-svc, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      # Relocated to per-header maps keyed on the backend; the shared frontend
      # set-header rules in base.yaml apply them. Adding/changing a value is now
      # a map-only, reload-free update.
      - type: contains
        target: map:reqhdr-host.map
        pattern: "default_uh-ingress_svc_uh-svc_80 internal.example.com"
      - {type: contains, target: map:reqhdr-xfwd-prefix.map, pattern: "default_uh-ingress_svc_uh-svc_80 %2fapp"}
      - type: contains
        target: map:reqhdr-connection.map
        pattern: "default_uh-ingress_svc_uh-svc_80 keep-alive"

  test-nginx-ingress-mirror-target:
    _helm_skip_test: '{{ include "haptic.spoaHub.pluginUnavailable" (dict "root" . "name" "mirror") }}'
    description: "mirror-target mirrors the Ingress's requests to the spoa-hub mirror plugin — a host-gated append to txn.gw_mirror_targets + the single send-spoe-group mirror-group, plus a Content-Length-gated http-request wait-for-body. Only the authority of the nginx URL template is used as the target."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mt-service}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mt-ingress
            annotations:
              nginx.ingress.kubernetes.io/mirror-target: "https://mirror.example.com$request_uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mirror-app.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: {service: {name: mt-service, port: {number: 80}}}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'set-var\(txn\.gw_mirror_targets\) var\(txn\.host\),map\([^)]*ing-mirror-hosts\.map\),concat\(,txn\.gw_mirror_targets,\)'
      - {type: contains, target: "map:ing-mirror-hosts.map", pattern: '(?m)^mirror-app\.example\.com https\|mirror\.example\.com:443\|2000\|0;$'}
      - type: contains
        target: haproxy.cfg
        pattern: "send-spoe-group spoa-hub-mirror mirror-group if \\{ var\\(txn.gw_mirror_targets\\) -m found \\}"
      - type: contains
        target: haproxy.cfg
        pattern: "http-request wait-for-body time 10s if \\{ req\\.hdr\\(content-length\\) -m found \\} !\\{ var\\(txn\\.backend_name\\),map\\(.*request-buffering\\.map,on\\) -m str off \\}"

  test-nginx-ingress-mirror-target-same-host-both-mirror:
    _helm_skip_test: '{{ include "haptic.spoaHub.pluginUnavailable" (dict "root" . "name" "mirror") }}'
    description: "Two mirror-target Ingresses sharing a host share one map row carrying both entries, so a request to that host mirrors to both targets from the single NOTIFY."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mh-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mh-ingress-a
            annotations:
              nginx.ingress.kubernetes.io/mirror-target: "http://mirror-a.example.com$request_uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shared.example.com
                http:
                  paths:
                    - {path: /a, pathType: Prefix, backend: {service: {name: mh-svc, port: {number: 80}}}}
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mh-ingress-b
            annotations:
              nginx.ingress.kubernetes.io/mirror-target: "http://mirror-b.example.com$request_uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: shared.example.com
                http:
                  paths:
                    - {path: /b, pathType: Prefix, backend: {service: {name: mh-svc, port: {number: 80}}}}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "map:ing-mirror-hosts.map", pattern: '(?m)^shared\.example\.com http\|mirror-a\.example\.com:80\|2000\|0;http\|mirror-b\.example\.com:80\|2000\|0;$'}
      - {type: not_contains, target: haproxy.cfg, pattern: "mirror-2-group"}

  test-nginx-ingress-mirror-target-hostless-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.pluginUnavailable" (dict "root" . "name" "mirror") }}'
    description: "mirror-target on a host-less Ingress is rejected (no host to gate on)."
    extraContext: {renderMode: admission}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mhl-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mhl-ingress
            annotations:
              nginx.ingress.kubernetes.io/mirror-target: "http://mirror.example.com$request_uri"
          spec:
            ingressClassName: haproxy
            rules:
              - http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: mhl-svc, port: {number: 80}}}}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "host-less / default-backend mirroring is not supported"

  test-nginx-ingress-mirror-target-bad-port-rejected:
    _helm_skip_test: '{{ include "haptic.spoaHub.pluginUnavailable" (dict "root" . "name" "mirror") }}'
    description: "mirror-target with an out-of-range port is rejected at render time."
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {namespace: default, name: mbp-svc}
          spec:
            ports: [{port: 80}]
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: mbp-ingress
            annotations:
              nginx.ingress.kubernetes.io/mirror-target: "http://mirror.example.com:99999$request_uri"
          spec:
            ingressClassName: haproxy
            rules:
              - host: mbp.example.com
                http:
                  paths:
                    - {path: /, pathType: Prefix, backend: {service: {name: mbp-svc, port: {number: 80}}}}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Port must be 1-65535"}

  # ==========================================================================
  # Config-injection guards (issue #157). Char-class rejection itself is proven
  # by base's ConfigInjectionKind / Escape* utility tests; these are per-site
  # wiring checks that each guard is actually called at its emission point.
  # ==========================================================================
  # One hostile Ingress at once exercises the routing/presentation guards that
  # warn-and-skip: server-alias (host.map key), canary match value (single-quoted
  # ACL operand), custom-request-headers value (frontend directive) and
  # session-cookie-name (backend cookie token). A dropped guard would surface its
  # marker; a valid config still renders (admission denial is base-tested).
  test-nginx-ingress-warn-guards-skip-injection:
    description: A single Ingress with injection payloads in server-alias, canary, custom-request-headers and session-cookie-name renders clean — every guarded value is skipped, no smuggled marker survives.
    extraContext: {renderMode: reconcile}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hostile
            annotations:
              nginx.ingress.kubernetes.io/server-alias: "ok.example.com,inj\nALIASWN.example.com"
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "SID COOKIEWN"
              nginx.ingress.kubernetes.io/canary: "true"
              nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
              nginx.ingress.kubernetes.io/canary-by-header-value: "v1' } { CANARYWN"
              nginx.ingress.kubernetes.io/custom-request-headers: "X-Foo: v1\nHEADERWN"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hostile.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:host.map, pattern: "ok\\.example\\.com hostile\\.example\\.com"}
      - {type: not_contains, target: map:host.map, pattern: "ALIASWN"}
      - {type: not_contains, target: haproxy.cfg, pattern: "COOKIEWN"}
      - {type: not_contains, target: haproxy.cfg, pattern: "CANARYWN"}
      - {type: not_contains, target: haproxy.cfg, pattern: "HEADERWN"}

  # Load-bearing special case: a custom-request-headers value is double-quoted and
  # log-format escaped, so a literal `%` is doubled and can't read request state.
  test-nginx-ingress-custom-request-header-value-log-format-escaped:
    description: A literal percent in a custom-request-headers value is URL-encoded (% -> %25) in ing-reqhdr.map and decoded with url_dec(1), so HAProxy can't interpret it as a log-format fetch.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: hdr-escape
            annotations:
              nginx.ingress.kubernetes.io/custom-request-headers: "X-Discount: 50%off"
          spec:
            ingressClassName: haproxy
            rules:
              - host: hdr.example.com
                http: *httpRoot
    assertions:
      - type: haproxy_valid
      - {type: contains, target: 'map:ing-reqhdr.map', pattern: 'default_hdr-escape_svc_echo_80\|set\|x-discount 50%25off'}
      - {type: contains, target: haproxy.cfg, pattern: 'set-header X-Discount %\[var\(txn\.backend_name\),concat\(\|set\|x-discount\),map\([^)]*ing-reqhdr\.map\),url_dec\(1\)\]'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'set-header X-Discount "'}

  # A malformed rate-limit threshold reaches an unquoted ACL operand and must fail
  # closed rather than silently ship without the limit (rpm/connections share the
  # same guard). Wiring check that the guard is called.
  test-nginx-ingress-limit-rps-injection-fails:
    description: A space in limit-rps fails the render — the rate limit is never silently dropped.
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: rps-attacker
            annotations:
              nginx.ingress.kubernetes.io/limit-rps: "10 } { sc_conn_cur(0) gt 0"
          spec:
            ingressClassName: haproxy
            rules:
              - host: rps.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "break the rate-limit ACL"}

  test-nginx-ingress-modsecurity-without-coraza-fails:
    description: enable-modsecurity "true" without the coraza plugin fails the render, also when the spoa-hub library isn't loaded.
    extraContext:
      spoaHub: {plugins: []}
    fixtures:
      ingresses:
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            namespace: default
            name: orphan-modsec
            annotations:
              nginx.ingress.kubernetes.io/enable-modsecurity: "true"
          spec:
            ingressClassName: haproxy
            rules:
              - host: orphan-modsec.example.com
                http: *httpRoot
    assertions:
      - {type: contains, target: rendering_error, pattern: "default/orphan-modsec sets annotation 'nginx\\.ingress\\.kubernetes\\.io/enable-modsecurity' but the spoaHub coraza plugin is not enabled"}
