                          minLength: 1
                          type: string
                        name:
                          description: Name is the resource name.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the resource namespace.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                  setID:
                    description: SetID identifies the auxiliary publication committed
                      with these references.
                    type: string
                  sslCaFiles:
                    description: SSLCaFiles lists the Secret resources containing
                      SSL CA files.
                    items:
                      description: ResourceReference identifies a related Kubernetes
                        resource.
                      properties:
                        kind:
                          description: Kind is the resource type (e.g., HAProxyMapFile,
