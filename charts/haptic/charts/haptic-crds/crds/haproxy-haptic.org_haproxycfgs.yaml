    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HAProxyCfg contains the rendered HAProxy configuration for a specific
          HAProxyTemplateConfig.

          This is a read-only resource automatically created and updated by the controller
          to expose the actual runtime configuration applied to HAProxy pods.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HAProxyCfgSpec contains the rendered configuration content.
            properties:
              checksum:
                description: |-
                  Checksum is the SHA-256 hash of the original (uncompressed) configuration content.

                  Used to detect configuration changes and verify consistency across pods.
                  Format: sha256:<hex-digest>
                minLength: 1
                type: string
              compressed:
                description: |-
                  Compressed indicates the content is zstd+base64 encoded.

                  When true, consumers must decompress before use.
                type: boolean
              content:
                description: |-
                  Content is the rendered HAProxy configuration file content.

                  This is the actual haproxy.cfg content that was validated and deployed
                  to HAProxy pods.
                minLength: 1
                type: string
              path:
                description: |-
                  Path is the file system path where this configuration is stored.

                  Default: /etc/haproxy/haproxy.cfg
                minLength: 1
                type: string
              retainedPlan:
                description: RetainedPlan contains zstd+base64 encoded deployment
                  declarations for a retained snapshot.
                type: string
            required:
            - checksum
            - content
            - path
            type: object
          status:
            description: HAProxyCfgStatus tracks deployment state and auxiliary files.
            properties:
              auxiliaryFiles:
                description: AuxiliaryFiles references the associated map files and
                  certificates.
                properties:
                  crtListFiles:
                    description: CRTListFiles lists the HAProxyCRTListFile resources
