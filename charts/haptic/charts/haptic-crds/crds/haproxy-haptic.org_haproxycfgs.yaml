                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployedToPods:
                description: |-
                  DeployedToPods tracks which HAProxy pods currently have this configuration.

                  Pods are automatically added when configuration is applied and removed when
                  the pod terminates.

                  The list is keyed by podName so each pod's status update can land via
                  Server-Side Apply with its own field manager — concurrent updates from
                  different pods merge naturally instead of last-write-wins on the
                  full-object UpdateStatus path that preceded this CRD shape.
                items:
                  description: PodDeploymentStatus tracks deployment to a specific
                    pod.
                  properties:
                    appliedPlanID:
                      description: AppliedPlanID is the render plan this pod last
                        accepted.
                      type: string
                    checksum:
                      description: Checksum of the configuration deployed to this
                        pod.
                      type: string
                    consecutiveErrors:
                      description: |-
                        ConsecutiveErrors is the count of consecutive sync failures.

                        This counter increments on each failure and resets to 0 on success.
                        High values indicate persistent problems requiring investigation.
                      minimum: 0
                      type: integer
                    lastError:
                      description: |-
                        LastError contains the error message from the most recent failed sync attempt.

                        This field is cleared when a sync succeeds. Combined with ConsecutiveErrors,
                        this helps identify persistent vs transient issues.
                      type: string
                    mode:
                      description: Mode is how the plan was applied to this pod.
                      enum:
                      - runtime
                      - file_only
                      - reload
                      - scheduled
                      - noop
                      - rejected
                      type: string
                    podName:
                      description: PodName is the name of the HAProxy pod.
                      minLength: 1
                      type: string
                    podRuntimeID:
                      description: PodRuntimeID binds the deployment proof to the
                        pod's container execution epoch.
                      type: string
                    podUID:
                      description: PodUID binds the deployment proof to the Kubernetes
                        pod incarnation.
                      type: string
                    reasons:
                      description: Reasons explain the apply mode, most significant
                        first.
                      items:
                        type: string
                      maxItems: 8
                      type: array
                    runningPlanID:
                      description: RunningPlanID is the render plan this pod's running
                        HAProxy serves.
                      type: string
                    workerOpsPlanID:
                      description: WorkerOpsPlanID identifies the configuration after
                        accepted runtime operations.
                      type: string
                  required:
                  - podName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - podName
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration reflects the generation of the spec that was most recently processed.

                  This is used to track whether status is up-to-date with latest spec changes.
                format: int64
                type: integer
              retainedConfigs:
                description: RetainedConfigs references complete, acknowledged snapshots,
                  newest first.
                items:
                  description: RetainedConfigReference binds a recovery checkpoint
                    to one object incarnation.
                  properties:
                    checksum:
                      type: string
                    name:
                      type: string
                    uid:
                      type: string
                  required:
                  - checksum
                  - name
                  - uid
                  type: object
                type: array
              validationError:
                description: |-
                  ValidationError contains the error message if this configuration failed validation.

                  Only populated for HAProxyCfg resources published with the -invalid suffix.
                  When present, this configuration was not deployed to HAProxy instances.
                type: string
            type: object
