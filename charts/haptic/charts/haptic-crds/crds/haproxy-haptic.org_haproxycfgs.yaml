                          minLength: 1
                          type: string
                        name:
                          description: Name is the resource name.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the resource namespace.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                  mapFiles:
                    description: MapFiles lists the HAProxyMapFile resources associated
