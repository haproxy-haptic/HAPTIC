_fx:
  specHttp: &specHttp
    gatewayClassName: haptic
    listeners:
      - name: http
        protocol: HTTP
        port: 80
        allowedRoutes: {namespaces: {from: Same}}
  gatewayclassesGatewayclass: &gatewayclassesGatewayclass
    - apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata: {name: haptic}
      spec: {controllerName: haproxy-haptic.org/controller}
  specHttp2: &specHttp2
    ports:
      - {name: http, port: 80, targetPort: 8080}

validationTests:
  test-httproute-session-persistence-cookie-default:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence]
    # sessionPersistence is an experimental-channel HTTPRoute field; skip when
    # that channel is absent (the snippet correctly emits no cookie directive,
    # so the assertion can't pass). See haptic.gatewayExperimental.disabled.
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: HTTPRoute rule with sessionPersistence (type unset → Cookie) emits the HAProxy cookie-insert + dynamic-cookie-key directives on the rule's backend."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: &sessionGateways
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-sp, namespace: default, generation: 1}
          spec: *specHttp
      services: &sessionServices
        - apiVersion: v1
          kind: Service
          metadata: {name: sticky-svc, namespace: default}
          spec: *specHttp2
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: sticky-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: sticky-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef: {kind: Pod, name: sticky-pod-1}
          ports:
            - {name: http, port: 8080, protocol: TCP}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: sp-route, namespace: default}
          spec:
            parentRefs:
              - {name: gw-sp, namespace: default}
            hostnames:
              - sticky.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                sessionPersistence:
                  sessionName: MYSESSION
                  type: Cookie
                  absoluteTimeout: 1h
                  idleTimeout: 10m
                backendRefs:
                  - {name: sticky-svc, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_h_default_sp-route_sticky-svc_80"}

      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^  cookie MYSESSION insert indirect nocache dynamic maxlife 3600s maxidle 600s$"

      - {type: contains, target: haproxy.cfg, pattern: "dynamic-cookie-key "}

  test-httproute-session-persistence-cookie-defaultname:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: HTTPRoute sessionPersistence with no sessionName defaults the cookie name to SESSION (type Cookie is the apiserver-defaulted value the stored object carries)."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-sp2, namespace: default, generation: 1}
          spec: *specHttp
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: sticky-svc2, namespace: default}
          spec: *specHttp2
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: sp-route2, namespace: default}
          spec:
            parentRefs:
              - {name: gw-sp2, namespace: default}
            hostnames:
              - sticky2.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                sessionPersistence: {type: Cookie}
                backendRefs:
                  - {name: sticky-svc2, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "cookie SESSION insert indirect nocache dynamic"}

  test-httproute-session-persistence-only-on-declaring-rule:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: a sessionPersistence on one rule must NOT leak its cookie directive onto a sibling rule's distinct backend."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-sp3, namespace: default, generation: 1}
          spec: *specHttp
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: sticky-a, namespace: default}
          spec: *specHttp2
        - apiVersion: v1
          kind: Service
          metadata: {name: plain-b, namespace: default}
          spec: *specHttp2
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: sp-route3, namespace: default}
          spec:
            parentRefs:
              - {name: gw-sp3, namespace: default}
            hostnames:
              - mixed.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /sticky}
                sessionPersistence: {sessionName: STICKY}
                backendRefs:
                  - {name: sticky-a, port: 80}
              - matches:
                  - path: {type: PathPrefix, value: /plain}
                backendRefs:
                  - {name: plain-b, port: 80}
    assertions:
      - type: haproxy_valid

      # The cookie rides in the backend's profile (a named defaults), so the
      # backend is dynamic (from a profile) and the profile carries the cookie.
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^backend gw_h_default_sp-route3_sticky-a_80_r0 from haptic-be-\\w+$"}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie STICKY insert"}

      - {type: match_count, target: haproxy.cfg, pattern: "(?m)^  cookie .* insert ", expected: "1"}

      - type: not_contains
        target: haproxy.cfg
        pattern: "(?s)backend gw_h_default_sp-route3_plain-b_80.*?cookie .* insert"

  test-grpcroute-session-persistence-cookie:
    requires: [gatewayclasses, gateways, grpcroutes]
    requiresFields: [grpcroutes.spec.rules.sessionPersistence]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619: GRPCRoute rule with sessionPersistence emits the cookie-insert directive on its backend."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-spg, namespace: default, generation: 1}
          spec: *specHttp
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-sticky, namespace: default}
          spec:
            ports:
              - {name: grpc, port: 9090, targetPort: 9090}
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: spg-route, namespace: default}
          spec:
            parentRefs:
              - {name: gw-spg, namespace: default}
            hostnames:
              - grpc-sticky.example.com
            rules:
              - matches:
                  - method: {type: Exact, service: com.example.API, method: Method1}
                sessionPersistence:
                  sessionName: GRPCSESSION
                  cookie: {name: GRPCSESSION}
                  type: Cookie
                backendRefs:
                  - {name: grpc-sticky, port: 9090}
    assertions:
      - type: haproxy_valid

      # Cookie in the backend's profile; the backend is dynamic (from a profile).
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^backend gw_g_default_spg-route_grpc-sticky_9090_r0 from haptic-be-\\w+$"}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie GRPCSESSION insert indirect nocache dynamic"}

  test-httproute-session-persistence-cookie-name:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.cookie.name]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-cookie, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence:
                  type: Cookie
                  cookie: {name: HTTPSESSION}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie HTTPSESSION insert indirect nocache dynamic"}
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^  cookie SESSION "}

  test-grpcroute-session-persistence-cookie-name:
    requires: [gatewayclasses, gateways, grpcroutes]
    requiresFields: [grpcroutes.spec.rules.sessionPersistence.cookie.name]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: session-cookie, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence:
                  type: Cookie
                  cookie: {name: GRPCSESSION}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie GRPCSESSION insert indirect nocache dynamic"}
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^  cookie SESSION "}

  test-httproute-session-persistence-header:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.sessionName]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619 type Header: the session header is replayed as the dynamic cookie, and the inserted cookie is returned as the header and expired on the client."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-header, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence: {type: Header, sessionName: X-Sticky, absoluteTimeout: 30m}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie X-Sticky insert indirect nocache dynamic maxlife 1800s attr Max-Age=0$"}
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  http-request add-header Cookie "X-Sticky=%\[req\.fhdr\(X-Sticky\)\]" if \{ req\.fhdr\(X-Sticky\) -m found \}$'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^  http-after-response set-header X-Sticky %\[res\.cook\(X-Sticky\)\] if \{ res\.cook\(X-Sticky\) -m found \}$'

  test-httproute-session-persistence-header-name:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.header.name]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619 type Header names the header with header.name where the schema serves it."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-header, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence: {type: Header, header: {name: X-Route-Session}}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie X-Route-Session insert indirect nocache dynamic attr Max-Age=0$"}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  http-after-response set-header X-Route-Session "}

  test-grpcroute-session-persistence-header:
    requires: [gatewayclasses, gateways, grpcroutes]
    requiresFields: [grpcroutes.spec.rules.sessionPersistence.sessionName]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619 type Header on a GRPCRoute uses the same header-to-cookie profile as an HTTPRoute."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: session-header, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence: {type: Header, sessionName: grpc-session}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^backend gw_g_default_session-header_sticky-svc_80_r0 from haptic-be-\\w+$"}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie grpc-session insert indirect nocache dynamic attr Max-Age=0$"}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  http-request add-header Cookie \"grpc-session="}

  test-httproute-session-persistence-permanent-cookie:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.cookieConfig.lifetimeType]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619 lifetimeType Permanent gives the cookie a Max-Age of absoluteTimeout; HAProxy still enforces the same lifetime through maxlife."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-permanent, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence:
                  sessionName: LONGLIVED
                  absoluteTimeout: 1h30m
                  cookieConfig: {lifetimeType: Permanent}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie LONGLIVED insert indirect nocache dynamic maxlife 5400s attr Max-Age=5400$"}

  test-httproute-session-persistence-cookie-path-permanent:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.cookie.path]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "GEP-1619 cookie.path scopes the inserted cookie, and cookie.lifetimeType Permanent gives it a Max-Age of absoluteTimeout."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-path, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence:
                  type: Cookie
                  absoluteTimeout: 1h
                  cookie: {name: CART, path: /shop, lifetimeType: Permanent}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: contains, target: haproxy.cfg, pattern: "(?m)^  cookie CART insert indirect nocache dynamic maxlife 3600s attr Max-Age=3600 attr Path=/shop$"}

  test-httproute-session-persistence-invalid-cookie-path-rejected:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.cookie.path]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "A cookie path that would break the cookie directive is refused instead of being spliced into the configuration."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-bad-path, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence: {type: Cookie, cookie: {name: CART, path: "/a; Domain=evil"}}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^  cookie "}
      - {type: contains, target: events, pattern: "Warning InvalidSessionPersistence .*HTTPRoute default/session-bad-path rule 0: cookie path '/a; Domain=evil' contains a character"}

  test-httproute-session-persistence-invalid-name-rejected:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [httproutes.spec.rules.sessionPersistence.sessionName]
    _helm_skip_test: '{{ include "haptic.gatewayExperimental.disabled" . }}'
    description: "A session name HAProxy can't take as a cookie or header name is refused instead of being spliced into the configuration."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways: *sessionGateways
      services: *sessionServices
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: session-bad, namespace: default}
          spec:
            parentRefs: [{name: gw-sp}]
            hostnames: [sticky.example.com]
            rules:
              - sessionPersistence: {sessionName: "BAD insert preserve"}
                backendRefs: [{name: sticky-svc, port: 80}]
    assertions:
      - {type: haproxy_valid}
      - {type: not_contains, target: haproxy.cfg, pattern: "(?m)^  cookie "}
      - {type: contains, target: events, pattern: "Warning InvalidSessionPersistence .*HTTPRoute default/session-bad rule 0: session name 'BAD insert preserve' contains a character"}
