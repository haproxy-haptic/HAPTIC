validationTests:
  test-gateway-https-listener-with-invalid-cert-no-bind:
    requires: [gatewayclasses, gateways]
    description: "A Gateway HTTPS listener with a malformed cert gets no listener bind and its cert never reaches the default HTTPS port, which serves only the default certificate."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: invalid-cert-gw, namespace: default}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: malformed-cert}
      secrets:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata: {name: malformed-cert, namespace: default}
          data:
            # Garbage that fails b64decode -> won't reach the PEM check
            tls.crt: bm90LWFjdHVhbGx5LXBlbQ==
            tls.key: bm90LWFjdHVhbGx5LXBlbQ==
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:443 ssl crt-list \S*/certificate-list\.txt '}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gw-default-invalid-cert-gw-https'}
      - {type: not_contains, target: "crt-list:certificate-list.txt", pattern: 'malformed|example\.com'}

  test-gateway-https-listener-mtls-unresolved-ca-no-bind:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "GatewayFrontendInvalidDefaultClientCertificateValidation: a listener whose client-CA refs don't resolve gets no listener bind, and its server cert never reaches the default HTTPS port."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-bad-ca-gw, namespace: default}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: shared-tls}
                  frontendValidation:
                    caCertificateRefs: *cacertificaterefsConfigmap
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs: *cacertificaterefsConfigmap
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:443 ssl crt-list \S*/certificate-list\.txt '}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gw-default-mtls-bad-ca-gw-https'}
      - {type: not_contains, target: "crt-list:certificate-list.txt", pattern: 'shared-tls|example\.com'}
  test-gateway-conformance-invalid-default-client-validation:
    requires: [gatewayclasses, gateways, httproutes]
    requiresFields: [gateways.spec.tls.frontend]
    description: "The GatewayFrontendInvalidDefaultClientCertificateValidation manifest: the blocked no-hostname HTTPS listener's cert never becomes the default HTTPS port's default certificate, and the HTTP listener keeps serving."
    extraContext: {httpPort: 80, httpsPort: 443}
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: invalid-default-client-validation-config, namespace: default}
          spec:
            gatewayClassName: haproxy
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs: [{kind: ConfigMap, group: "", name: does-not-exist}]
                perPort:
                  - port: 80
                    tls:
                      validation:
                        caCertificateRefs: [{kind: ConfigMap, group: "", name: also-missing}]
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls:
                  certificateRefs: [{group: "", kind: Secret, name: shared-tls, namespace: default}]
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes: {namespaces: {from: Same}}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: invalid-default-client-validation-config, namespace: default}
          spec:
            parentRefs: [{name: invalid-default-client-validation-config}]
            hostnames: [example.org]
            rules: [{backendRefs: [{name: echo, port: 80}]}]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend http-tcp\n(?:[ \t].*\n|\n)*?[ \t]+bind \*:80$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend https\n(?:[ \t].*\n|\n)*?[ \t]+bind \*:443 ssl crt-list \S*/certificate-list\.txt '}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gw-default-invalid-default-client-validation-config-https'}
      - {type: contains, target: "crt-list:certificate-list.txt", pattern: '\Adefault\.pem '}
      - {type: not_contains, target: "crt-list:certificate-list.txt", pattern: 'shared-tls'}

  test-gateway-https-listener-mtls-unresolved-ca-status-conditions:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Status-side companion of test-gateway-https-listener-mtls- unresolved-ca-no-bind. The chart-side fix for GatewayFrontendInvalidDefaultClientCertificateValidation requires BOTH:"
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: mtls-bad-ca-gw, namespace: default}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: shared-tls}
            tls:
              frontend:
                default:
                  validation:
                    mode: AllowValidOnly
                    caCertificateRefs: *cacertificaterefsConfigmap
    assertions:
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"InvalidCACertificateRef"'
      - type: contains
        target: "status:default/mtls-bad-ca-gw:rendered"
        pattern: '"reason":"NoValidCACertificate"'
      - {type: contains, target: "status:default/mtls-bad-ca-gw:rendered", pattern: '"status":"False"'}
      - {type: contains, target: "status:default/mtls-bad-ca-gw:rendered", pattern: '"name":"https"'}

  test-gateway-https-listener-with-valid-cert-binds:
    requires: [gatewayclasses, gateways]
    description: "The companion test to the invalid-cert case: a Gateway HTTPS listener at httpsPort with a resolvable cert is served on the default HTTPS port: `frontend https` binds `*:443 ssl crt-list`."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: valid-cert-gw, namespace: default}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 443
                hostname: example.com
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: shared-tls}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "frontend https"}
      - {type: contains, target: haproxy.cfg, pattern: "bind .*:443.*ssl crt-list"}

  test-gateway-https-listener-cross-namespace-cert-without-grant-no-bind:
    requires: [gatewayclasses, gateways, referencegrants, secrets]
    description: A cross-namespace certificateRef without a ReferenceGrant gets no per-listener bind or crt-list, even when a permitted Gateway resolved the same Secret.
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: permitted-gw, namespace: default}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 8443
                hostname: permitted.example.com
                tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: shared-tls}]}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: intruder-gw, namespace: tenant}
          spec:
            gatewayClassName: haproxy
            listeners:
              - name: https
                protocol: HTTPS
                port: 8443
                hostname: intruder.example.com
                tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: shared-tls, namespace: default}]}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: status:tenant/intruder-gw:rendered
        pattern: '"reason":"RefNotPermitted"'
      - type: contains
        target: haproxy.cfg
        pattern: 'crt-list \S+/gw-default-permitted-gw-https-crtlist\.txt'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'gw-tenant-intruder-gw-https-crtlist'

  test-gateway-https-misdirected-listener-claim-maps:
    requires: [gatewayclasses, gateways]
    description: HTTPS listener hostnames are emitted as listener-claim maps and the misdirected directive references them
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass2
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: catch-all
                port: 443
                protocol: HTTPS
                tls: *tlsSecretSharedTls
              - name: with-host
                port: 443
                hostname: second-example.org
                protocol: HTTPS
                tls: *tlsSecretSharedTls
              - name: with-wildcard
                port: 443
                hostname: "*.wildcard.org"
                protocol: HTTPS
                tls: *tlsSecretSharedTls
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:listener-hostname-claim.map
        pattern: "(?m)^second-example\\.org second-example\\.org$"

      - type: contains
        target: map:listener-hostname-claim-regex.map
        pattern: "(?m)^\\^\\[\\^\\.\\]\\+\\\\\\.wildcard\\\\\\.org\\$ \\*\\.wildcard\\.org$"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_sni_listener\\) ssl_fc_sni,lower,map\\("

      - type: contains
        target: haproxy.cfg
        pattern: "http-request return status 421 if .* var\\(txn\\.gw_sni_listener\\),strcmp\\(txn\\.gw_host_listener\\) eq 0"
  test-backendtlspolicy-compiles:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: BackendTLSPolicy is watched and the chart compiles when one is present
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass2
      gateways: *gatewaysGatewayGw
      services: *servicesServiceBackendSvc
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {name: ca-cert, namespace: gateway-conformance-infra}
          data: *dataCaCrtBeginCertificate
      httproutes: *httproutesHttprouteBtlsRoute
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata: {name: btls-policy, namespace: gateway-conformance-infra}
          spec:
            targetRefs: *targetrefsServiceBackendSvc
            validation:
              caCertificateRefs:
                - {group: "", kind: ConfigMap, name: ca-cert}
              hostname: backend.example.com
    assertions:
      - type: haproxy_valid

      - type: contains
        target: haproxy.cfg
        pattern: "default-server check ssl ca-file [^\\s]+ verify required sni str\\(backend\\.example\\.com\\) verifyhost backend\\.example\\.com"

  test-backendtlspolicy-status-transition-time-preserved:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: "Sweep companion to test-gatewayclass-status-transition-time-preserved (issue #63): BackendTLSPolicy conditions live under .status.ancestors[].conditions (GEP-713 PolicyStatus), but the status snippet used RouteParentTransitionTime, which navigates .status.parents — a path that doesn't exist on policies — so every render re-stamped lastTransitionTime regardless of resource shape. The fix matches the existing ancestor entry by identity (controllerName + ancestorRef), not by index: the ancestors list read back from the apiserver can interleave entries from other controllers, so the fixture puts a foreign controller's entry FIRST (same ancestorRef, different timestamp) — positional matching would preserve the wrong entry's timestamp; identity matching must skip it and preserve ours."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass2
      gateways: *gatewaysGatewayGw
      services: *servicesServiceBackendSvc
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {name: ca-cert, namespace: gateway-conformance-infra}
          data: *dataCaCrtBeginCertificate
      httproutes: *httproutesHttprouteBtlsRoute
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata: {name: btls-policy, namespace: gateway-conformance-infra, generation: 2}
          spec:
            targetRefs: *targetrefsServiceBackendSvc
            validation:
              caCertificateRefs:
                - {group: "", kind: ConfigMap, name: ca-cert}
              hostname: backend.example.com
          status:
            ancestors:
              # Foreign controller's entry for the SAME ancestorRef comes
              # first — index-based matching would preserve its timestamp.
              - ancestorRef: {group: gateway.networking.k8s.io, kind: Gateway, name: gw}
                controllerName: example.com/other-controller
                conditions:
                  - type: Accepted
                    status: "True"
                    reason: Accepted
                    message: Accepted by other controller
                    observedGeneration: 1
                    lastTransitionTime: "2022-09-09T09:09:09Z"
              # Our previously written entry (shape matches what the
              # snippet emits: parentRef without namespace → ancestorRef
              # without namespace; controllerName comes from the chart's
              # extraContext.controllerName default).
              - ancestorRef: {group: gateway.networking.k8s.io, kind: Gateway, name: gw}
                controllerName: haproxy-haptic.org/controller
                conditions:
                  - type: Accepted
                    status: "True"
                    reason: Accepted
                    message: Policy accepted
                    observedGeneration: 1
                    lastTransitionTime: "2021-03-04T05:06:07Z"
                  - type: ResolvedRefs
                    status: "True"
                    reason: ResolvedRefs
                    message: All references resolved
                    observedGeneration: 1
                    lastTransitionTime: "2021-03-04T05:06:07Z"
    assertions:
      - type: haproxy_valid
      - type: match_count
        target: "status:gateway-conformance-infra/btls-policy:rendered"
        pattern: '"lastTransitionTime":"2021-03-04T05:06:07Z"'
        expected: "2"
        description: "Unchanged Accepted=True and ResolvedRefs=True must both keep the pre-existing lastTransitionTime from haptic's own ancestor entry"
      - type: not_contains
        target: "status:gateway-conformance-infra/btls-policy:rendered"
        pattern: '"lastTransitionTime":"2022-09-09T09:09:09Z"'
        description: "The foreign controller's timestamp must not leak in — ancestor matching is by controllerName + ancestorRef, not by index"

  test-backendtlspolicy-invalid-ca-cert-ref-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: "BackendTLSPolicy with caCertificateRefs that don't resolve (no matching ConfigMap or Secret in the cluster) and no wellKnownCACertificates: System fallback marks the targeted backend as broken."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass2
      gateways: *gatewaysGatewayGw
      services: *servicesServiceBackendSvc
      httproutes: *httproutesHttprouteBtlsRoute
      backendtlspolicies:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: BackendTLSPolicy
          metadata: {name: btls-policy, namespace: gateway-conformance-infra}
          spec:
            targetRefs: *targetrefsServiceBackendSvc
            validation:
              caCertificateRefs:
                - {group: "", kind: ConfigMap, name: nonexistent-ca-cm}
              hostname: backend.example.com
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "http-request return status 503"}
      # Emitted last: a final action before the set-timeout rule would make it a warned-about NOOP.
      - {type: contains, target: haproxy.cfg, pattern: '(?s)http-request set-timeout server var\(txn\.gw_rule_id\).*?http-request return status 503'}

      - {type: not_contains, target: haproxy.cfg, pattern: "default-server check ssl ca-file"}

  test-gateway-insecure-frontend-validation-mode-default:
    requires: [gateways]
    description: Gateway with spec.tls.frontend.default.mode=AllowInsecureFallback compiles cleanly. The status patch (verified end-to-end by the GatewayInsecureFrontendValidationMode conformance test) appends Insecur...
    extraContext: {controllerName: "haproxy-haptic.org/controller", controllerNamespace: "haptic-system"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-insecure-default, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                tls: {mode: Terminate}
            tls: {frontend: {default: {mode: AllowInsecureFallback}}}
    assertions:
      - type: haproxy_valid

  test-gateway-insecure-frontend-validation-mode-per-port:
    requires: [gateways]
    description: "Gateway with spec.tls.frontend.perPort[*].tls.validation.mode=AllowInsecureFallback compiles cleanly (GEP-91 perPort override path)."
    extraContext: {controllerName: "haproxy-haptic.org/controller", controllerNamespace: "haptic-system"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-insecure-perport, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                tls: {mode: Terminate}
            tls:
              frontend:
                default: {mode: AllowValidOnly}
                perPort:
                  - port: 443
                    tls: {validation: {mode: AllowInsecureFallback}}
    assertions:
      - type: haproxy_valid

  test-gateway-frontend-client-cert-default-line-verify:
    requires: [gatewayclasses, gateways]
    requiresFields: [gateways.spec.tls.frontend]
    description: "Mirrors the upstream Gateway API GatewayFrontendClientCertificateValidation conformance fixture: a Gateway with two HTTPS listeners on different ports — one with no hostname (port 443, default fronten."
    fixtures:
      gatewayclasses: *gatewayclassesGatewayclass2
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: client-validation-default, namespace: gateway-conformance-infra}
          spec:
            gatewayClassName: haptic
            tls:
              frontend:
                default:
                  validation:
                    caCertificateRefs:
                      - {kind: ConfigMap, group: "", name: tls-validity-checks-ca-certificate}
                perPort:
                  - port: 8443
                    tls:
                      validation:
                        caCertificateRefs:
                          - {kind: ConfigMap, group: "", name: tls-validity-checks-per-port-ca-certificate}
            listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecret
              - name: https-with-hostname
                port: 8443
                hostname: second-example.org
                protocol: HTTPS
                allowedRoutes: {namespaces: {from: Same}}
                tls: *tlsSecret
      namespaces: *namespacesNamespace
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {name: tls-validity-checks-certificate, namespace: gateway-conformance-infra}
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
      configmaps:
        - apiVersion: v1
          kind: ConfigMap
          metadata: {name: tls-validity-checks-ca-certificate, namespace: gateway-conformance-infra}
          data: *dataCaCrtBeginCertificate
        - apiVersion: v1
          kind: ConfigMap
