          - name: tls-passthrough
            port: 9443
            protocol: TLS
            hostname: tls.example.com
            allowedRoutes: {namespaces: {from: All}}
            tls: {mode: Passthrough}
  tlsroutesTlsRouteAllListeners: &tlsroutesTlsRouteAllListeners
    - apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      metadata: {name: tls-route, namespace: gateway-conformance-infra}
      spec:
        parentRefs:
          - {name: gw}
        hostnames: [tls.example.com]
        rules:
          - backendRefs:
              - {name: backend-svc, port: 443}
  backendtlspoliciesBtlsPolicySection: &backendtlspoliciesBtlsPolicySection
    - apiVersion: gateway.networking.k8s.io/v1
      kind: BackendTLSPolicy
      metadata: {name: btls-policy, namespace: gateway-conformance-infra, generation: 1}
      spec:
        targetRefs:
          - {group: "", kind: Service, name: backend-svc, sectionName: btls}
        validation:
          caCertificateRefs:
            - {group: "", kind: ConfigMap, name: ca-cert}
          hostname: backend.example.com
  backendtlspoliciesBtlsPolicyMissingCa: &backendtlspoliciesBtlsPolicyMissingCa
    - apiVersion: gateway.networking.k8s.io/v1
      kind: BackendTLSPolicy
      metadata: {name: btls-policy, namespace: gateway-conformance-infra, generation: 1}
      spec:
        targetRefs:
          - {group: "", kind: Service, name: backend-svc}
        validation:
          caCertificateRefs:
            - {group: "", kind: ConfigMap, name: nonexistent-ca}
          hostname: backend.example.com
  reencryptDefaultServer: &reencryptDefaultServer 'default-server check ssl ca-file [^ ]+ verify required sni str\(backend\.example\.com\) verifyhost backend\.example\.com'
  gatewayAncestor: &gatewayAncestor '"ancestorRef":\{"group":"gateway\.networking\.k8s\.io","kind":"Gateway","name":"gw"\}'
  serviceAncestor: &serviceAncestor '"ancestorRef":\{"group":"","kind":"Service","name":"backend-svc","namespace":"gateway-conformance-infra"\}'

  backendtlspoliciesURI: &backendtlspoliciesURI
    - apiVersion: gateway.networking.k8s.io/v1
      kind: BackendTLSPolicy
      metadata: {name: btls-policy, namespace: gateway-conformance-infra, generation: 1}
      spec:
        targetRefs:
          - {group: "", kind: Service, name: backend-svc}
        validation:
          caCertificateRefs:
            - {group: "", kind: ConfigMap, name: ca-cert}
          hostname: backend.example.com
          subjectAltNames:
            - {type: URI, uri: "spiffe://cluster.local/ns/x/sa/y"}
  gatewaysTCP: &gatewaysTCP
    - apiVersion: gateway.networking.k8s.io/v1
