      kind: TCPRoute
      metadata: {name: tcp-route, namespace: gateway-conformance-infra}
      spec:
        parentRefs:
          - {name: gw, sectionName: tcp}
        rules:
          - backendRefs:
              - {name: backend-svc, port: 443}

validationTests:
  test-backendtlspolicy-ancestor-from-grpcroute:
    requires: [backendtlspolicies, gatewayclasses, gateways, grpcroutes, httproutes]
    description: A Service consumed only by a GRPCRoute reports the route's Gateway as the policy ancestor, not the target Service.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            hostnames: [abc.example.com]
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}
      - {type: not_contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"kind":"Service"'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"reason":"Accepted","status":"True","type":"Accepted"'}

  test-backendtlspolicy-ancestor-from-tlsroute:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: A Service consumed only by a TLSRoute reports the route's Gateway as the policy ancestor.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: tls-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            hostnames: [tls.example.com]
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}
      - {type: not_contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"kind":"Service"'}

  test-backendtlspolicy-ancestor-deduplicated-across-route-kinds:
    requires: [backendtlspolicies, gatewayclasses, gateways, grpcroutes, httproutes]
    description: An HTTPRoute and a GRPCRoute attached to the same Gateway yield one ancestor entry.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: http-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: match_count, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"ancestorRef":', expected: "1"}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}

  test-backendtlspolicy-ancestor-follows-backend-ref-namespace:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: The consuming route is matched by the backendRef's namespace, not the route's. A cross-namespace ref to the policy's Service contributes its Gateway; a same-named Service in the route's own namespace does not.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: consumer, namespace: apps}
          spec:
            parentRefs:
              - {name: gw, namespace: gateway-conformance-infra}
            rules:
              - backendRefs:
                  - {name: backend-svc, namespace: gateway-conformance-infra, port: 443}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: decoy, namespace: apps}
          spec:
            parentRefs:
              - {name: gw-decoy}
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"ancestorRef":\{"group":"gateway\.networking\.k8s\.io","kind":"Gateway","name":"gw","namespace":"gateway-conformance-infra"\}'}
      - {type: not_contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: 'gw-decoy'}
      - {type: not_contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"kind":"Service"'}

  test-backendtlspolicy-ancestor-falls-back-to-target-without-routes:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes]
    description: With no route consuming the Service, the policy reports its target Service as the ancestor so its conditions remain visible.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
    assertions:
      - type: haproxy_valid

      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *serviceAncestor}

  test-backendtlspolicy-grpcroute-port-name-reencrypts:
    requires: [backendtlspolicies, gatewayclasses, gateways, grpcroutes, httproutes]
    description: A policy targeting a Service port by sectionName applies to a GRPCRoute backend on that port, and the TLS h2 server negotiates ALPN h2, which gRPC servers require.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicySection
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            hostnames: [abc.example.com]
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: 'default-server check proto h2 ssl ca-file [^ ]+ verify required sni str\(backend\.example\.com\) verifyhost backend\.example\.com alpn h2'}

  test-backendtlspolicy-tlsroute-terminate-reencrypts:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: A Terminate listener hands the TLSRoute backend plaintext, so its BackendTLSPolicy re-encrypts the server side with the policy's CA, SNI, and verifyhost.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGwTlsTerminate
      secrets: *secretsTlsCert
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      tlsroutes: *tlsroutesTlsRoute
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0'}
      - {type: contains, target: haproxy.cfg, pattern: *reencryptDefaultServer}
      - {type: not_contains, target: haproxy.cfg, pattern: 'default-server check proto h2'}

  test-backendtlspolicy-tlsroute-passthrough-forwards-client-tls:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: A Passthrough listener forwards the client's TLS bytes untouched, so a BackendTLSPolicy on the backend Service must not wrap them in a second handshake.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGwTlsPassthrough
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      tlsroutes: *tlsroutesTlsRoute
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'default-server check ssl'}

  test-backendtlspolicy-tlsroute-terminate-unresolvable-ca-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: A Terminate-listener backend whose policy CA cannot be resolved rejects connections instead of falling back to plaintext.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGwTlsTerminate
      secrets: *secretsTlsCert
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      backendtlspolicies: *backendtlspoliciesBtlsPolicyMissingCa
      tlsroutes: *tlsroutesTlsRoute
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0 from [^\n]*\n  guid [^\n]*\n  tcp-request content reject'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'default-server check ssl'}

  test-backendtlspolicy-tlsroute-mixed-listeners-split-per-mode:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: A rule attached to both a Terminate and a Passthrough listener gets one backend per mode; only the Terminate leg re-encrypts through the policy.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGwTlsMixed
      secrets: *secretsTlsCert
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicy
      tlsroutes: *tlsroutesTlsRouteAllListeners
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0_terminate from haptic-be-'}
      - {type: contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0_passthrough from haptic-be-'}
      - {type: contains, target: haproxy.cfg, pattern: *reencryptDefaultServer}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^defaults haptic-be-[0-9a-f]+ from haptic-base\n  mode tcp\n  default-server check$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-8443$\n(?:  [^\n]*\n|\n)*?  use_backend gtw_tls_gateway-conformance-infra_tls-route_0_terminate if \{ ssl_fc_sni,lower -m str tls\.example\.com \}$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-9443$\n(?:  [^\n]*\n|\n)*?  use_backend gtw_tls_gateway-conformance-infra_tls-route_0_passthrough if \{ req_ssl_sni,lower -m str tls\.example\.com \}$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'backend gtw_tls_gateway-conformance-infra_tls-route_0 from'}

  test-backendtlspolicy-grpcroute-unsupported-identity-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, grpcroutes, httproutes]
    description: Unsupported URI identities block backend traffic.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGw
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesURI
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: grpc-route, namespace: gateway-conformance-infra}
          spec:
            parentRefs:
              - {name: gw}
            hostnames: [abc.example.com]
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'http-request return status 503'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'verifyhost backend\.example\.com'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}

  test-backendtlspolicy-tlsroute-unsupported-identity-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, httproutes, tlsroutes]
    description: Unsupported URI identities block backend traffic.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysGwTlsTerminate
      secrets: *secretsTlsCert
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesURI
      tlsroutes: *tlsroutesTlsRoute
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'tcp-request content reject'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'verifyhost backend\.example\.com'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}

  test-backendtlspolicy-tcproute-reencrypts:
    requires: [backendtlspolicies, gatewayclasses, gateways, tcproutes]
    description: TCP backends enforce the policy's trust and identity requirements.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysTCP
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicySection
      tcproutes: *tcproutesBackend
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}
      - {type: contains, target: haproxy.cfg, pattern: 'server [^ ]+ 10\.0\.0\.1:8443[^\n]+ssl ca-file [^ ]+ verify required sni str\(backend\.example\.com\) verifyhost backend\.example\.com'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'tcp-request content reject'}

  test-backendtlspolicy-tcproute-unsupported-identity-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, tcproutes]
    description: TCP backends enforce the policy's trust and identity requirements.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysTCP
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesURI
      tcproutes: *tcproutesBackend
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}
      - {type: contains, target: haproxy.cfg, pattern: 'tcp-request content reject'}
      - {type: not_contains, target: haproxy.cfg, pattern: '10\.0\.0\.1:8443'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"reason":"Invalid","status":"False","type":"Accepted"'}

  test-backendtlspolicy-tcproute-missing-ca-rejects:
    requires: [backendtlspolicies, gatewayclasses, gateways, tcproutes]
    description: TCP backends enforce the policy's trust and identity requirements.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysTCP
      services: *servicesBackendSvc
      endpoints: *endpointsBackendSvc
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicyMissingCa
      tcproutes: *tcproutesBackend
    assertions:
      - type: haproxy_valid
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: *gatewayAncestor}
      - {type: contains, target: haproxy.cfg, pattern: 'tcp-request content reject'}
      - {type: not_contains, target: haproxy.cfg, pattern: '10\.0\.0\.1:8443'}
      - {type: contains, target: "status:gateway-conformance-infra/btls-policy:rendered", pattern: '"reason":"NoValidCACertificate","status":"False","type":"Accepted"'}

  test-backendtlspolicy-tcproute-weighted-tls-isolation:
    requires: [backendtlspolicies, gatewayclasses, gateways, tcproutes]
    description: Weighted TCP backends apply TLS only to the policy's target Service.
    fixtures:
      gatewayclasses: *gatewayclassesHaptic
      gateways: *gatewaysTCP
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend-svc, namespace: gateway-conformance-infra}
          spec:
            ports: [{name: btls, port: 443, targetPort: 8443}]
        - apiVersion: v1
          kind: Service
          metadata: {name: plaintext, namespace: gateway-conformance-infra}
          spec:
            ports: [{name: http, port: 80, targetPort: 8080}]
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: tls
            namespace: gateway-conformance-infra
            labels: {kubernetes.io/service-name: backend-svc}
          addressType: IPv4
          endpoints: [{addresses: ["192.0.2.10"], conditions: {ready: true}}]
          ports: [{name: btls, port: 8443, protocol: TCP}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: plaintext
            namespace: gateway-conformance-infra
            labels: {kubernetes.io/service-name: plaintext}
          addressType: IPv4
          endpoints: [{addresses: ["192.0.2.11"], conditions: {ready: true}}]
          ports: [{name: http, port: 8080, protocol: TCP}]
      configmaps: *configmapsCaCert
      backendtlspolicies: *backendtlspoliciesBtlsPolicySection
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: {name: weighted, namespace: gateway-conformance-infra}
          spec:
            parentRefs: [{name: gw, sectionName: tcp}]
            rules:
              - backendRefs:
                  - {name: backend-svc, port: 443, weight: 2}
                  - {name: plaintext, port: 80, weight: 3}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: 'server backend-svc-[^ ]+ 192\.0\.2\.10:8443[^\n]+weight 2 ssl ca-file [^ ]+ verify required sni str\(backend\.example\.com\) verifyhost backend\.example\.com'}
      - {type: contains, target: haproxy.cfg, pattern: 'server plaintext-[^ ]+ 192\.0\.2\.11:8080[^\n]+weight 3  #'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'default-server[^\n]*ssl|tcp-request content reject'}
