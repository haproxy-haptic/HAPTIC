  gatewaysGwTlsTerminate: &gatewaysGwTlsTerminate
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: gateway-conformance-infra}
      spec:
        gatewayClassName: haptic
        listeners:
          - name: tls
            port: 8443
            protocol: TLS
            hostname: tls.example.com
            allowedRoutes: {namespaces: {from: All}}
            tls:
              mode: Terminate
              certificateRefs:
                - {kind: Secret, name: tls-cert}
  gatewaysGwTlsPassthrough: &gatewaysGwTlsPassthrough
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: gateway-conformance-infra}
      spec:
        gatewayClassName: haptic
        listeners:
          - name: tls
            port: 8443
            protocol: TLS
            hostname: tls.example.com
            allowedRoutes: {namespaces: {from: All}}
            tls: {mode: Passthrough}
  tlsroutesTlsRoute: &tlsroutesTlsRoute
    - apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      metadata: {name: tls-route, namespace: gateway-conformance-infra}
      spec:
        parentRefs:
          - {name: gw, sectionName: tls}
        hostnames: [tls.example.com]
        rules:
          - backendRefs:
              - {name: backend-svc, port: 443}
  gatewaysGwTlsMixed: &gatewaysGwTlsMixed
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {name: gw, namespace: gateway-conformance-infra}
      spec:
        gatewayClassName: haptic
        listeners:
          - name: tls-terminate
            port: 8443
            protocol: TLS
            hostname: tls.example.com
            allowedRoutes: {namespaces: {from: All}}
            tls:
              mode: Terminate
              certificateRefs:
