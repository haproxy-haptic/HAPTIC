validationTests:
  test-httproute-crosspath-hostname-exact:
    requires:
    - gatewayclasses
    - gateways
    - httproutes
    fixtures:
      gatewayclasses: &id001
      - apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: haptic
        spec:
          controllerName: haproxy.org/haptic
      services: &id002
      - apiVersion: v1
        kind: Service
        metadata:
          name: app-v1
          namespace: default
        spec:
          ports:
          - port: 80
      - apiVersion: v1
        kind: Service
        metadata:
          name: app-v2
          namespace: default
        spec:
          ports:
          - port: 80
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: gateway
          namespace: default
        spec:
          gatewayClassName: haptic
          listeners:
          - name: http
            port: 80
            hostname: abc.example.com
            protocol: HTTP
      httproutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: older
          namespace: default
          creationTimestamp: '2024-01-01T00:00:00Z'
        spec:
          parentRefs:
          - name: gateway
          rules:
          - matches:
            - path:
                type: PathPrefix
                value: /app/longer
            backendRefs:
            - name: app-v1
              port: 80
          hostnames:
          - '*.example.com'
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: newer
          namespace: default
          creationTimestamp: '2024-01-02T00:00:00Z'
        spec:
          parentRefs:
          - name: gateway
          rules:
          - matches:
            - path:
                type: PathPrefix
                value: /app
            backendRefs:
            - name: app-v2
              port: 80
          hostnames:
          - abc.example.com
    assertions:
    - type: haproxy_valid
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^  bind \*:18742$
    - type: match_order
      target: haproxy.cfg
      patterns:
      - set-var\(txn.gw_rule_id\) str\(h_default_newer_0\).*var\(txn.host_match\) -m str "abc\.example\.com:18742".*
      - set-var\(txn.gw_rule_id\) str\(h_default_older_0\).*var\(txn.host_match\) -m str "abc\.example\.com:18742".*
    - type: contains
      target: haproxy.cfg
      pattern: set-var\(txn.gw_rule_id\) str\(h_default_newer_0\).*var\(txn.host_match\) -m str "abc\.example\.com:18742".*\{\
        path\ \-m\ reg\ "\^/app\(/\|\\\$\)"\ \}
    - type: contains
      target: haproxy.cfg
      pattern: set\-var\(txn\.path_match\)\ str\(BACKEND:gw_h_default_newer_app\-v2_80\)\ if\ \{\ var\(txn\.gw_rule_id\)\
        \-m\ str\ "h_default_newer_0"\ \}
    - type: contains
      target: haproxy.cfg
      pattern: set-var\(txn.gw_rule_id\) str\(h_default_older_0\).*var\(txn.host_match\) -m str "abc\.example\.com:18742".*\{\
        path\ \-m\ reg\ "\^/app/longer\(/\|\\\$\)"\ \}
    - type: contains
      target: haproxy.cfg
      pattern: set\-var\(txn\.path_match\)\ str\(BACKEND:gw_h_default_older_app\-v1_80\)\ if\ \{\ var\(txn\.gw_rule_id\)\
        \-m\ str\ "h_default_older_0"\ \}
    - type: not_contains
      target: haproxy.cfg
      pattern: set-var\(txn.gw_rule_id\) str\(h_default_(newer|older)_0\).*var\(req.gw_routeId\)
