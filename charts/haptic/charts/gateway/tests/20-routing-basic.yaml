_fx:
  specHttp: &specHttp
    ports:
      - {name: http, port: 80, targetPort: 8080}
  rulesBackend8080: &rulesBackend8080
    - backendRefs:
        - {name: backend, port: 8080}

validationTests:
  test-httproute-duplicate-backend-different-ports:
    requires: [httproutes]
    description: HTTPRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-svc, namespace: default}
          spec:
            ports:
              - {name: http, port: 80, targetPort: 8080}
              - {name: admin, port: 81, targetPort: 8081}
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: api-svc-abc
            namespace: default
            labels:
              kubernetes.io/service-name: api-svc
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef: {kind: Pod, name: api-pod-1}
          ports:
            - {name: http, port: 8080, protocol: TCP}
            - {name: admin, port: 8081, protocol: TCP}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: multi-port, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                backendRefs:
                  - {name: api-svc, port: 80}
              - matches:
                  - path: {type: PathPrefix, value: /admin}
                backendRefs:
                  - {name: api-svc, port: 81}
              - matches:
                  - path: {type: PathPrefix, value: /app}
                backendRefs:
                  - {name: api-svc, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_h_default_multi-port_api-svc_80"}

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_h_default_multi-port_api-svc_81"}

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^backend gw_h_default_multi-port_api-svc_"
        expected: "2"

      - {type: contains, target: haproxy.cfg, pattern: "10.0.0.1:8080"}

      - {type: contains, target: haproxy.cfg, pattern: "10.0.0.1:8081"}

  test-grpcroute-duplicate-backend-different-ports:
    requires: [grpcroutes]
    description: GRPCRoute with multiple rules to same service but different ports (tests deduplication)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-svc, namespace: default}
          spec:
            ports:
              - {name: grpc, port: 9090, targetPort: 9090}
              - {name: grpc-admin, port: 9091, targetPort: 9091}
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: multi-port, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - grpc.example.com
            rules:
              - matches:
                  - method: {type: Exact, service: com.example.API, method: Method1}
                backendRefs:
                  - {name: grpc-svc, port: 9090}
              - matches:
                  - method: {type: Exact, service: com.example.Admin, method: Method1}
                backendRefs:
                  - {name: grpc-svc, port: 9091}
              - matches:
                  - method: {type: Exact, service: com.example.App, method: Method1}
                backendRefs:
                  - {name: grpc-svc, port: 9090}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_g_default_multi-port_grpc-svc_9090"}

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_g_default_multi-port_grpc-svc_9091"}

      - type: match_count
        target: haproxy.cfg
        pattern: "(?m)^backend gw_g_default_multi-port_grpc-svc_"
        expected: "2"

  test-httproute-route-key-shapes:
    requires: [httproutes]
    description: >-
      Gateway routes land in the same path maps as Ingress, with the same key
      shapes, so the shared route capture marks them identically
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: { namespace: default, name: app }
          spec: { ports: [{ name: http, port: 80, targetPort: 8080 }] }
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: { namespace: default, name: rk }
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - rk.example.com
            rules:
              - matches:
                  - path: { type: PathPrefix, value: /api }
                backendRefs: [{ name: app, port: 80 }]
              - matches:
                  - path: { type: Exact, value: /exact }
                backendRefs: [{ name: app, port: 80 }]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: map:path-prefix.map
        pattern: '(?m)^rk\.example\.com/api/ '
        description: >-
          The trailing slash is what the route capture appends `*` to, giving
          /api/*. Without it a Gateway prefix would render as an exact route
      - type: contains
        target: map:path-prefix-exact.map
        pattern: '(?m)^rk\.example\.com/api '
        description: The boundary half carries no trailing slash, so the capture appends /*
      - type: contains
        target: map:path-exact.map
        pattern: '(?m)^rk\.example\.com/exact '
        description: An Exact match is unmarked, and must not gain a prefix marker

  test-httproute-single-backend:
    requires: [httproutes]
    description: HTTPRoute with single backend uses BACKEND qualifier
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: app, namespace: default}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: single-backend, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - single.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                backendRefs:
                  - {name: app, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: "backend gw_h_default_single-backend_app_80"}

      - type: contains
        target: map:path-prefix.map
        pattern: "single.example.com/ GW_ROUTE_ID:http:h_default_single-backend_0"

      - {type: not_contains, target: map:weighted-multi-backend.map, pattern: "default_single-backend"}

      # A route exists, so the route-id blocks are in place; no route carries a
      # redirect, rewrite or mirror filter, so those blocks are not.
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-matchers-advanced-010-route-id-setup$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-matchers-advanced-900-path-match$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-redirect$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-urlrewrite$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/frontend-filters-gateway-mirror$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^ *# gateway/mirror-buffer:'}

  test-httproute-method-matching:
    requires: [httproutes]
    description: HTTPRoute with method matching (GET vs POST to same path)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: read-service, namespace: default}
          spec: *specHttp
        - apiVersion: v1
          kind: Service
          metadata: {name: write-service, namespace: default}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: method-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    method: GET
                backendRefs:
                  - {name: read-service, port: 80}
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    method: POST
                backendRefs:
                  - {name: write-service, port: 80}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: map:path-prefix.map, pattern: "api.example.com/api/ GW_ROUTE_ID:http"}

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(h_default_method-route_0\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"h_default_method-route_0__h_default_method-route_1\" \\} \\{ method GET \\}"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.gw_rule_id\\) str\\(h_default_method-route_1\\) if !\\{ var\\(txn\\.gw_rule_id\\) -m found \\} \\{ var\\(req\\.gw_routeId\\) -m str \"h_default_method-route_0__h_default_method-route_1\" \\} \\{ method POST \\}"

  test-httproute-multi-hostname-map-newlines:
    requires: [httproutes]
    description: HTTPRoute with 3 hostnames must generate separate map file lines
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: app, namespace: default}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: multi-host, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - one.example.com
              - two.example.com
              - three.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /}
                backendRefs:
                  - {name: app, port: 80}
    assertions:
      - type: haproxy_valid

      - type: not_contains
        target: map:host.map
        pattern: "one\\.example\\.com one\\.example\\.comtwo\\.example\\.com"

      - type: match_count
        target: map:host.map
        pattern: "(?m)^.*\\.example\\.com .*\\.example\\.com$"
        expected: "3"

  test-grpcroute-multi-hostname-map-newlines:
    requires: [grpcroutes]
    description: GRPCRoute with 3 hostnames must generate separate map file lines
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: grpc-app, namespace: default}
          spec:
            ports:
              - {name: grpc, port: 9090, targetPort: 9090}
      grpcroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GRPCRoute
          metadata: {name: multi-host-grpc, namespace: default}
          spec:
            parentRefs:
              - {name: gateway, namespace: default}
            hostnames:
              - one.example.com
              - two.example.com
              - three.example.com
            rules:
              - matches:
                  - method: {type: Exact, service: com.example.Service, method: TestMethod}
                backendRefs:
                  - {name: grpc-app, port: 9090}
    assertions:
      - type: haproxy_valid

      - type: not_contains
        target: map:host.map
        pattern: "one\\.example\\.com one\\.example\\.comtwo\\.example\\.com"

      - type: match_count
        target: map:host.map
        pattern: "(?m)^.*\\.example\\.com .*\\.example\\.com$"
        expected: "3"

  test-httproute-path-exact:
    requires: [httproutes]
    description: HTTPRoute with Exact path type (no prefix matching)
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: exact-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: exact-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: Exact, value: /api/users}
                backendRefs:
                  - {name: exact-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-exact.map
        pattern: "api.example.com/api/users GW_ROUTE_ID:http:h_default_exact-route_0"

      - {type: not_contains, target: map:path-prefix.map, pattern: "api.example.com/api/users"}

  test-httproute-path-regex:
    requires: [httproutes]
    description: HTTPRoute with RegularExpression path type
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: versioned-service, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-route, namespace: default}
          spec:
            hostnames:
              - api.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/api/v[0-9]+/users$"}
                backendRefs:
                  - {name: versioned-service, port: 80}
    assertions:
      - type: haproxy_valid

      - type: contains
        target: map:path-regex.map
        pattern: '(?m)^\^api\\\.example\\\.com\(\?:/api/v\[0-9\]\+/users\$\) GW_ROUTE_ID:http:h_default_regex-route_0$'

      - {type: not_contains, target: map:path-prefix.map, pattern: "api.example.com/.*users"}

  # Cross-tenant map-injection guard (#153). Map keys are whitespace-delimited, so a
  # newline or space in an HTTPRoute path value smuggles a second entry that hijacks
  # another tenant's host+path. The path is guarded before it is written to the map:
  # denied at admission, warned-and-skipped on reconcile.
  test-httproute-regex-path-stays-on-host:
    requires: [httproutes]
    description: A top-level | in an HTTPRoute RegularExpression path stays inside the path group and a path that closes the group early is not applied (with an Event), so neither can match another host.
    extraContext: {renderMode: reconcile}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: web, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-alt, namespace: default}
          spec:
            hostnames:
              - alt.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "/x|/"}
                backendRefs:
                  - {name: web, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-esc, namespace: default}
          spec:
            hostnames:
              - esc.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "/y)|(.*"}
                backendRefs:
                  - {name: web, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:path-regex.map, pattern: '(?m)^\^alt\\\.example\\\.com\(\?:/x\|/\) GW_ROUTE_ID:http:h_default_regex-alt_0$'}
      - {type: match_count, target: map:path-regex.map, pattern: 'GW_ROUTE_ID:', expected: "1"}
      - {type: contains, target: events, pattern: "Route regex path '/y\\)\\|\\(\\.\\*' \\(host 'esc\\.example\\.com'\\) closes a group it doesn't open"}

  test-httproute-regex-path-early-close-rejected:
    requires: [httproutes]
    description: An HTTPRoute RegularExpression path that closes the path group early is refused at admission.
    extraContext: {renderMode: admission}
    fixtures:
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-esc, namespace: default}
          spec:
            hostnames:
              - esc.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "/y)|(.*"}
                backendRefs:
                  - {name: web, port: 80}
    assertions:
      - {type: contains, target: rendering_error, pattern: "Route regex path '/y\\)\\|\\(\\.\\*' \\(host 'esc\\.example\\.com'\\) closes a group it doesn't open; the route is not applied"}

  test-httproute-regex-path-injection-reconcile-warns-and-skips:
    requires: [httproutes]
    description: A newline in an HTTPRoute RegularExpression path is skipped; the smuggled regex-map line never appears while valid routes render.
    extraContext: {renderMode: reconcile}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: web, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/a$\nvictim.example.com/secret gw_h_default_evil_web_80\n#"}
                backendRefs:
                  - {name: web, port: 80}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: regex-good, namespace: default}
          spec:
            hostnames:
              - good.example.com
            rules:
              - matches:
                  - path: {type: RegularExpression, value: "^/ok$"}
                backendRefs:
                  - {name: web, port: 80}
    assertions:
      - type: haproxy_valid
      - {type: contains, target: map:path-regex.map, pattern: '(?m)^\^good\\\.example\\\.com\(\?:/ok\$\) GW_ROUTE_ID:http:h_default_regex-good_0$'}
      - {type: contains, target: map:route-backend.map, pattern: "h_default_regex-good_0 BACKEND:gw_h_default_regex-good_web_80"}
      - {type: not_contains, target: map:path-regex.map, pattern: "victim\\.example\\.com/secret"}

  test-httproute-path-injection-admission-rejected:
    requires: [httproutes]
    description: A space in an HTTPRoute Exact path is denied by the admission webhook.
    extraContext: {renderMode: admission}
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: web, namespace: default}
          spec:
            ports:
              - port: 80
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: attacker, namespace: default}
          spec:
            hostnames:
              - attacker.example.com
            rules:
              - matches:
                  - path: {type: Exact, value: "/a victim.example.com/secret"}
                backendRefs:
                  - {name: web, port: 80}
    assertions:
      - type: contains
        target: rendering_error
        pattern: "contains whitespace or control characters"

  test-httproute-listener-port-matching:
    requires: [gatewayclasses, gateways, httproutes]
    description: Routes attached to listeners on different ports get port-suffixed host map entries
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw, namespace: default}
          spec:
            gatewayClassName: haptic
            listeners:
              - {name: l-80, port: 80, hostname: foo.com, protocol: HTTP}
              - {name: l-8080, port: 8080, hostname: foo.com, protocol: HTTP}
              - {name: l-8090, port: 8090, hostname: foo.com, protocol: HTTP}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: backend, namespace: default}
          spec:
            ports:
              - {port: 8080, targetPort: 8080}
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: route-on-80, namespace: default}
          spec:
            parentRefs:
              - {name: gw, port: 80}
            rules: *rulesBackend8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: route-on-8080, namespace: default}
          spec:
            parentRefs:
              - {name: gw, port: 8080}
            rules: *rulesBackend8080
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: route-on-8090-by-section, namespace: default}
          spec:
            parentRefs:
              - {name: gw, sectionName: l-8090}
            rules: *rulesBackend8080
    assertions:
      - type: haproxy_valid

      - {type: contains, target: map:host.map, pattern: "(?m)^foo\\.com:18168 foo\\.com:18168$"}

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:18878 foo\\.com:18878$"

      - type: contains
        target: map:host.map
        pattern: "(?m)^foo\\.com:18024 foo\\.com:18024$"

      - type: contains
        target: haproxy.cfg
        pattern: "http-request set-var\\(txn\\.host_full\\) req\\.hdr\\(Host\\),lower"

      - type: contains
        target: haproxy.cfg
        pattern: "(?s)set-var\\(txn\\.host_match\\) var\\(txn\\.host\\),concat\\(:,txn\\.listener_port,\\),map\\(.*?set-var\\(txn\\.host_match\\) var\\(txn\\.host\\),map\\("

  test-httproute-path-only-route-resolved-by-map:
    requires: [httproutes]
    description: >-
      An HTTPRoute whose rules all match on path alone is resolved by the host/path maps
      plus route-winner/route-backend, so it contributes no per-request http-request line.
      The chain is evaluated on every request and grows with route count: emitting it for
      routes that cannot lose to a sibling cost 2.2x throughput at ~500 routes.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: plain-service, namespace: default}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: plain-route, namespace: default}
          spec:
            hostnames:
              - plain.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /shop}
                backendRefs:
                  - {name: plain-service, port: 80}
    assertions:
      - type: haproxy_valid

      # Routing still resolves, now entirely through maps.
      - {type: contains, target: map:path-prefix.map, pattern: "plain.example.com/shop/ GW_ROUTE_ID:http"}
      - {type: contains, target: map:route-winner.map, pattern: "h_default_plain-route_0 h_default_plain-route_0"}
      - {type: contains, target: map:route-backend.map, pattern: "h_default_plain-route_0 BACKEND:gw_h_default_plain-route_plain-service_80"}

      # txn.gw_rule_id is still set, so the access log keeps its resource attribution.
      # Anchored: unanchored it also matched the directive fused into the marker
      # comment above it, which HAProxy reads as comment text -- every route 404s.
      - type: contains
        target: haproxy.cfg
        pattern: "(?m)^ *http-request set-var\\(txn\\.gw_rule_id\\) var\\(req\\.gw_routeId\\),map\\("

      # ...and no per-route matcher line is emitted.
      - type: not_contains
        target: haproxy.cfg
        pattern: "set-var\\(txn\\.gw_rule_id\\) str\\(h_default_plain-route_0\\)"

  test-httproute-path-only-fallback-kept-within-route:
    requires: [httproutes]
    description: >-
      A path-only rule must keep its matcher line when ANY rule of the same HTTPRoute
      matches on more than the path. Its condition is scoped `-m beg "<ns>_<name>_"`, so it
      rescues a request whose more-specific path selected a DIFFERENT rule of that route
      whose method/header/query matcher then failed. Scoping the skip per conflict group
      instead of per HTTPRoute drops that line and sends the request to the default backend
      (caught by e2e TestHTTPRouteCombined, not by any assertion here before this test).
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: api-service, namespace: default}
          spec: *specHttp
        - apiVersion: v1
          kind: Service
          metadata: {name: catch-service, namespace: default}
          spec: *specHttp
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: mixed-route, namespace: default}
          spec:
            hostnames:
              - mixed.example.com
            rules:
              - matches:
                  - path: {type: PathPrefix, value: /api}
                    method: POST
                backendRefs:
                  - {name: api-service, port: 80}
              - matches:
                  - path: {type: PathPrefix, value: /}
                backendRefs:
                  - {name: catch-service, port: 80}
    assertions:
      - type: haproxy_valid

      # The advanced rule keeps its method matcher.
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn\\.gw_rule_id\\) str\\(h_default_mixed-route_0\\) .*\\{ method POST \\}"

      # The path-only sibling MUST still be emitted: it is the fallback when POST fails.
      - type: contains
        target: haproxy.cfg
        pattern: "set-var\\(txn\\.gw_rule_id\\) str\\(h_default_mixed-route_1\\)"

  test-httproute-externalname-backend:
    requires: [httproutes]
    description: An HTTPRoute pointing at an ExternalName Service emits a server line with runtime DNS resolution.
    fixtures:
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: s3, namespace: default}
          spec:
            type: ExternalName
            externalName: files.s3.example.net
      httproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: s3-route, namespace: default}
          spec:
            hostnames:
              - files.example.com
            rules:
              - backendRefs:
                  - {name: s3, port: 443}
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: 'server s3 files\.s3\.example\.net:443[^\n]*resolvers dns init-addr last,libc,none'
