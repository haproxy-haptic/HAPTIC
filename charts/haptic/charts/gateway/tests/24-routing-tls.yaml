  test-tlsroute-mixed-termination-protocol-conflict:
    requires: [gatewayclasses, gateways]
    description: "Mirrors the upstream Gateway API TLSRouteListenerMixedTerminationNotSupported conformance fixture: a Gateway with two TLS listeners on the same port, one in `tls."
    fixtures:
      gatewayclasses:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata: {name: haptic}
          spec: {controllerName: haproxy.org/haptic}
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: gateway-tlsroute-mixed-termination-not-supported
