_fx:
  specTls443: &specTls443
    gatewayClassName: haptic
    listeners:
      - name: tls
        protocol: TLS
        port: 443
        hostname: "*.example.com"
        allowedRoutes:
          namespaces: {from: Same}
          kinds:
            - kind: TLSRoute
        tls: {mode: Passthrough}
  servicesServiceTcpBackend: &servicesServiceTcpBackend
    - apiVersion: v1
      kind: Service
      metadata: {name: tcp-backend, namespace: default}
      spec:
        ports:
          - port: 8443
  servicesServiceTcpBackend2: &servicesServiceTcpBackend2
    - apiVersion: v1
      kind: Service
      metadata: {name: tcp-backend, namespace: default}
      spec:
        ports:
          - port: 443
  metadataTlsApp: &metadataTlsApp
    name: tls-app
    namespace: default
    generation: 1
  rulesTcpBackend8443: &rulesTcpBackend8443
    - backendRefs:
        - {name: tcp-backend, port: 8443}
  rulesTlsBackend443: &rulesTlsBackend443
    - backendRefs:
        - {name: tls-backend, port: 443}
  rulesTcpBackend443: &rulesTcpBackend443
    - backendRefs:
        - {name: tcp-backend, port: 443}
  metadataGwTls: &metadataGwTls
    name: gw-tls
    namespace: default
    generation: 1

validationTests:
  test-tlsroute-terminate-on-chart-static-httpsport:
    requires: [gateways, tlsroutes]
    description: "Mirrors the upstream TLSRouteTerminateSimpleSameNamespace conformance fixture: a Gateway with one TLS-Terminate listener on port 8443 (which is also the chart's default httpsPort) and nothing else com."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-terminate-default, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tlsterm
                protocol: TLS
                port: 8443
                hostname: tls.example.com
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: shared-tls, namespace: default}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute-terminate-default
            hostnames:
              - tls.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-8443$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:8443 ssl crt-list '}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:8443', expected: "1"}
  test-tlsroute-invalid-backend-rejects-on-frontend:
    requires: [gateways, tlsroutes]
    description: "Mirror of the upstream TLSRouteInvalidBackendRefUnknownKind conformance fixture's chart-side contract: a TLS Passthrough listener has a TLSRoute attached whose backendRef points at an unknown kind."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-invalid, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 9445
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: invalid-backend, namespace: default, generation: 1}
          spec:
            parentRefs:
              - name: gw-tlsroute-invalid
            hostnames:
              - example.com
            rules:
              - backendRefs:
                  - {group: unknownkind.example.com, kind: NonExistent, name: tls-backend, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-9445$'}

      - {type: not_contains, target: haproxy.cfg, pattern: 'use_backend .* req_ssl_sni -m str example\.com'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tcp-request content reject$'}
  test-tlsroute-invalid-backend-rejects-on-chart-static:
    requires: [gateways, tlsroutes]
    description: "Mirrors the upstream TLSRouteInvalidBackendRefNonexistent / TLSRouteInvalidBackendRefUnknownKind conformance scenario at chart-static httpsPort (443/8443): a TLS Passthrough listener on the chart-static port has a TLSRoute attached whose backendRef points at a non-existent Service. The route is recorded in sslPassthroughBackends with `invalid: true`; this lights bindHTTPSDefault so chart-static `frontend ssl-tcp` renders, and the route's claimed SNI joins listener_sni so connections to that SNI hit the reject path (not the ssl-loopback fallback)."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-invalid-default, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 8443
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: invalid-backend-default, namespace: default, generation: 1}
          spec:
            parentRefs:
              - name: gw-tlsroute-invalid-default
            hostnames:
              - example.com
            rules:
              - backendRefs:
                  - {name: nonexistent-service, port: 443}
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend ssl-tcp$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'use_backend .* req_ssl_sni -m str example\.com'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)acl gw_default_gw_tlsroute_invalid_default_invalid_sni req_ssl_sni -m str example\.com'
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+tcp-request content reject if gw_default_gw_tlsroute_invalid_default_invalid_sni$'
  test-tlsroute-hostname-intersection-multi-gateway:
    requires: [gateways, tlsroutes]
    description: "Mirrors the upstream TLSRouteHostnameIntersection conformance fixture: four Gateways on port 443 (chart-static httpsPort), each with a different listener-hostname pattern (exact / *.example.com / *.com / empty). Each Gateway has TLSRoutes whose hostnames intersect with the parent listener pattern. Per Gateway-API spec, a SNI matching one Gateway's listener pattern but not claimed by any of THAT Gateway's routes must be rejected — even if a sibling Gateway on the same port has routes that would accept the SNI under a wider pattern. Without per-Gateway routing isolation the chart's union-style route_sni ACL would let `non.matching.com` reach G4's `*.com` backend via G3's `*.com` listener, breaking the spec contract."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-exact-hostname-x-1, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-exact
                protocol: TLS
                port: 443
                hostname: abc.example.com
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-more-specific-wc-hostname-x-2, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-more-specific-wc
                protocol: TLS
                port: 443
                hostname: "*.example.com"
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-less-specific-wc-hostname-x-3, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-less-specific-wc
                protocol: TLS
                port: 443
                hostname: "*.com"
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-empty-hostname-x-4, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: l-empty
                protocol: TLS
                port: 443
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: r-x-1, namespace: default}
          spec:
            parentRefs:
              - name: gw-tlsroute-exact-hostname-x-1
            hostnames:
              - "*.example.com"
            rules: *rulesTlsBackend443
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: r-x-2-exact, namespace: default}
          spec:
            parentRefs:
              - name: gw-tlsroute-more-specific-wc-hostname-x-2
            hostnames:
              - abc.example.com
            rules: *rulesTlsBackend443
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: r-x-3-exact, namespace: default}
          spec:
            parentRefs:
              - name: gw-tlsroute-less-specific-wc-hostname-x-3
            hostnames:
              - abc.example.com
            rules: *rulesTlsBackend443
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: r-x-4-less, namespace: default}
          spec:
            parentRefs:
              - name: gw-tlsroute-empty-hostname-x-4
            hostnames:
              - "*.com"
            rules: *rulesTlsBackend443
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: tls-backend, namespace: default}
          spec:
            ports:
              - port: 443
    assertions:
      - type: haproxy_valid

      # Each Gateway's listener_sni pattern is emitted as its OWN ACL
      # (per-Gateway isolation). G1 (exact abc.example.com):
      - type: contains
        target: haproxy.cfg
        pattern: 'acl gw_default_gw_tlsroute_exact_hostname_x_1_listener_sni req_ssl_sni -m str abc\.example\.com'

      # G2 (more-specific wildcard *.example.com):
      - type: contains
        target: haproxy.cfg
        pattern: 'acl gw_default_gw_tlsroute_more_specific_wc_hostname_x_2_listener_sni req_ssl_sni -m end \.example\.com'

      # G3 (less-specific wildcard *.com):
      - type: contains
        target: haproxy.cfg
        pattern: 'acl gw_default_gw_tlsroute_less_specific_wc_hostname_x_3_listener_sni req_ssl_sni -m end \.com'

      # G3's reject rule fires when its listener (`*.com`) matches but
      # no G3 route claims the SNI (covers the test case where
      # `non.matching.com` is sent — matches G3 listener, none of G3's
      # routes claim it).
      - type: contains
        target: haproxy.cfg
        pattern: 'tcp-request content reject if gw_default_gw_tlsroute_less_specific_wc_hostname_x_3_listener_sni !gw_default_gw_tlsroute_less_specific_wc_hostname_x_3_route_sni'
      # G4 (empty listener) has no listener_sni ACL (catchall) — the
      # reject just gates on its own route_sni:
      - type: contains
        target: haproxy.cfg
        pattern: 'tcp-request content reject if !gw_default_gw_tlsroute_empty_hostname_x_4_route_sni'
  test-tlsroute-terminate-nondefault-port-frontend:
    requires: [gateways, tlsroutes]
    description: TLSRoute attached to a TLS Terminate listener on a non-chart- static port renders a per-port mode-tcp frontend with TLS termination on the bind.
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-terminate, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tlsterm
                protocol: TLS
                port: 9444
                hostname: tls.example.com
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
                    - {kind: Secret, name: shared-tls, namespace: default}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute-terminate
            hostnames:
              - tls.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-9444$'}

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:9444 ssl crt-list '}
      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if \{ ssl_fc_sni -m str tls\.example\.com \}'
      - type: not_contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if .*req_ssl_sni'
  test-tlsroute-passthrough-nondefault-port-frontend:
    requires: [gateways, tlsroutes]
    description: "TLSRoute attached to a TLS Passthrough listener on a port OTHER than the chart-static httpsPort lands on the new `frontends-600-gateway-tls-listener` per-port frontend, not on the chart's static ssl-t."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-9443, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 9443
                hostname: "*.example.com"
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute-9443
            hostnames:
              - abc.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-9443$'}

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+mode tcp$'}

      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend gateway-tls-port-9443$.*?^\s+mode tcp$.*?^\s+log-format "%\{\+json\}o '

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:9443$'}
      - {type: contains, target: haproxy.cfg, pattern: 'tcp-request inspect-delay 5s'}
      - type: contains
        target: haproxy.cfg
        pattern: 'use_backend gtw_tls_default_tls-app_0 if \{ req_ssl_sni -m str abc\.example\.com \}'
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+tcp-request content reject if !allowed_sni$'}
  test-tlsroute-same-sni-on-two-passthrough-ports:
    requires: [gateways, tlsroutes]
    description: A rule attached to two Passthrough listeners on different ports keeps its single backend and is dispatched on both per-port frontends.
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-two-ports, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls-6443
                protocol: TLS
                port: 6443
                hostname: "*.example.com"
                allowedRoutes: {namespaces: {from: Same}, kinds: [{kind: TLSRoute}]}
                tls: {mode: Passthrough}
              - name: tls-7443
                protocol: TLS
                port: 7443
                hostname: "*.example.com"
                allowedRoutes: {namespaces: {from: Same}, kinds: [{kind: TLSRoute}]}
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute-two-ports
            hostnames:
              - abc.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid

      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-6443$\n(?:  [^\n]*\n|\n)*?  use_backend gtw_tls_default_tls-app_0 if \{ req_ssl_sni -m str abc\.example\.com \}$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tls-port-7443$\n(?:  [^\n]*\n|\n)*?  use_backend gtw_tls_default_tls-app_0 if \{ req_ssl_sni -m str abc\.example\.com \}$'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gtw_tls_default_tls-app_0_'}

  test-tlsroute-passthrough-basic:
    requires: [gateways, tlsroutes]
    description: "TLSRoute attached to a TLS Passthrough listener emits a TCP-mode backend named gtw_tls_<ns>_<route>_<rule> and a SNI-keyed use_backend rule on the ssl-tcp frontend."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute, namespace: default, generation: 1}
          spec: *specTls443
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute
            hostnames:
              - abc.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: "backend gtw_tls_default_tls-app_0"}
      - type: contains
        target: haproxy.cfg
        pattern: "use_backend gtw_tls_default_tls-app_0 if \\{ req_ssl_sni -m str abc\\.example\\.com \\}"
      - {type: contains, target: haproxy.cfg, pattern: "frontend ssl-tcp"}
      - type: not_contains
        target: haproxy.cfg
        pattern: "use_backend gtw_tls_default_tls-app_0 if .*ssl_fc_sni"

  test-tlsroute-cross-namespace-backend-without-referencegrant-rejected:
    requires: [gateways, referencegrants, tlsroutes]
    description: "A TLSRoute passthrough backendRef in another namespace without a covering ReferenceGrant is unresolved: no use_backend for its SNI and no backend carrying the foreign pod address; the SNI stays claimed so the connection is rejected."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-xns, namespace: default, generation: 1}
          spec: *specTls443
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: tls-xns, namespace: default, generation: 1}
          spec:
            parentRefs:
              - name: gw-tlsroute-xns
            hostnames:
              - xns.example.com
            rules:
              - backendRefs:
                  - {name: secret-tls, namespace: other, port: 8443}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: secret-tls, namespace: other}
          spec:
            ports:
              - port: 8443
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: secret-tls-1
            namespace: other
            labels: {kubernetes.io/service-name: secret-tls}
          addressType: IPv4
          ports: [{port: 8443}]
          endpoints:
            - addresses: ["10.9.9.9"]
              conditions: {ready: true}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: 'use_backend gtw_tls_default_tls-xns_0'}
      - {type: not_contains, target: haproxy.cfg, pattern: '10\.9\.9\.9'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+tcp-request content reject if gw_default_gw_tlsroute_xns_listener_sni$'

  test-tlsroute-no-tls-listener:
    requires: [gateways, tlsroutes]
    description: "TLSRoute parented to an HTTP-only Gateway (no TLS listener) must NOT produce a TLSRoute backend. Mirrors conformance tlsroute-invalid-no-matching-listener for the HTTP / HTTPS case."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-http-only, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes: {namespaces: {from: Same}}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: tls-app, namespace: default}
          spec:
            parentRefs:
              - name: gw-http-only
            hostnames:
              - tls.example.com
            rules: *rulesTcpBackend443
      services: *servicesServiceTcpBackend2
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "backend gtw_tls_default_tls-app"}

  test-tlsroute-hostname-mismatch:
    requires: [gateways, tlsroutes]
    description: "TLSRoute hostname not intersecting the listener hostname does NOT produce a passthrough backend. Mirrors conformance tlsroute-invalid-no-matching-listener-hostname."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: *metadataGwTls
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 443
                hostname: example.com
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: tls-mismatch, namespace: default}
          spec:
            parentRefs:
              - name: gw-tls
            hostnames:
              - other.test
            rules: *rulesTcpBackend443
      services: *servicesServiceTcpBackend2
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: "backend gtw_tls_default_tls-mismatch"}

  test-tlsroute-wildcard-listener-exact-route:
    requires: [gateways, tlsroutes]
    description: "Wildcard listener \"*.example.com\" + exact route \"abc.example.com\" produces a backend keyed on the exact route hostname (per Gateway API HostnameSinglePairIntersection)."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-wildcard, namespace: default, generation: 1}
          spec: *specTls443
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: {name: tls-exact, namespace: default}
          spec:
            parentRefs:
              - name: gw-wildcard
            hostnames:
              - abc.example.com
            rules: *rulesTcpBackend443
      services: *servicesServiceTcpBackend2
