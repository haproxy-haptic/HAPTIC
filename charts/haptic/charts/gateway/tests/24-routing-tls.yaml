      namespaces:
        - apiVersion: v1
          kind: Namespace
          metadata: {name: gateway-conformance-infra}
      secrets:
        - apiVersion: v1
          kind: Secret
          metadata: {name: tls-terminate-checks-certificate, namespace: gateway-conformance-infra}
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
    assertions:
      - type: haproxy_valid

      # Both listeners' status: Accepted=False/ProtocolConflict.
      - type: match_count
        target: "status:gateway-conformance-infra/gateway-tlsroute-mixed-termination-not-supported:rendered"
        pattern: '"reason":"ProtocolConflict","status":"False","type":"Accepted"'
        expected: "2"
      - type: match_count
        target: "status:gateway-conformance-infra/gateway-tlsroute-mixed-termination-not-supported:rendered"
        pattern: '"attachedRoutes":0'
        expected: "2"
      - type: match_count
        target: "status:gateway-conformance-infra/gateway-tlsroute-mixed-termination-not-supported:rendered"
        pattern: '"supportedKinds":\[\]'
        expected: "2"

  test-proxy-protocol-passthrough-binds-on-ssl-tcp:
    requires: [gateways, tlsroutes]
    description: >-
      With a TLS-Passthrough listener on the chart-static HTTPS port, `frontend
      ssl-tcp` owns that port and `frontend https` is fed over a unix socket.
      The PROXY-protocol bind must follow the port onto ssl-tcp: terminating it
      on `frontend https` instead would take passthrough SNIs out of the
      SNI-routing path without any error.
    extraContext:
      controllerName: "haproxy-haptic.org/controller"
      proxyProtocol: {enabled: true, httpPort: 8081, httpsPort: 8444}
      http3: {enabled: true, altSvc: {port: 0, maxAge: 86400}}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute, namespace: default, generation: 1}
          spec: *specTls443
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute
            hostnames:
              - abc.example.com
            rules: *rulesTcpBackend8443
      services: *servicesServiceTcpBackend
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend ssl-tcp$.*?^\s+bind \*:8444 accept-proxy name https-proxy-protocol$'
      - {type: not_contains, target: haproxy.cfg, pattern: 'bind \*:8444 accept-proxy\b.*\bssl\b'}
      # ssl-tcp owns TCP 443 but UDP 443 is free, so QUIC binds on frontend https directly.
      - {type: contains, target: haproxy.cfg, pattern: '(?ms)^frontend https$.*?^\s+bind quic4@:443 ssl crt-list '}
      # The loopback names the accepting ssl-tcp listener, so PROXY-protocol
      # connections still get no alt-svc after the unix-socket hop.
      - {type: contains, target: haproxy.cfg, pattern: 'server loopback unix@/etc/haproxy/ssl-frontend\.sock send-proxy-v2 set-proxy-v2-tlv-fmt\(0xE0\) %\[so_name\]'}
      - {type: match_count, target: haproxy.cfg, pattern: 'set-header alt-svc .* if \{ dst_port 443 \} !\{ so_name https-proxy-protocol \} !\{ fc_pp_tlv\(0xE0\) -m str https-proxy-protocol \}', expected: "2"}
      # The first frontends-* snippet starts its own line instead of continuing default_backend (#408).
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^# ssl/frontends-ssl-tcp$'}

  test-tlsroute-weighted-backends:
    requires: [gateways, tlsroutes]
    description: "A TLSRoute rule with several backendRefs gets one backend per weighted ref; the SNI dispatch picks each with probability weight/total, and a weight-0 ref gets neither a backend nor a dispatch line."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute, namespace: default, generation: 1}
          spec: *specTls443
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute
            hostnames:
              - abc.example.com
            rules:
              - backendRefs:
                  - {name: tls-a, port: 8443, weight: 70}
                  - {name: tls-b, port: 8443, weight: 30}
                  - {name: tls-c, port: 8443, weight: 0}
      services: &weightedTLSServices
        - apiVersion: v1
          kind: Service
          metadata: {name: tls-a, namespace: default}
          spec: {ports: [{port: 8443}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: tls-b, namespace: default}
          spec: {ports: [{port: 8443}]}
        - apiVersion: v1
          kind: Service
          metadata: {name: tls-c, namespace: default}
          spec: {ports: [{port: 8443}]}
      endpoints: &weightedTLSEndpoints
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {name: tls-a-1, namespace: default, labels: {kubernetes.io/service-name: tls-a}}
          addressType: IPv4
          ports: [{port: 8443}]
          endpoints: [{addresses: ["10.0.1.1"], conditions: {ready: true}, targetRef: {kind: Pod, name: tls-a-pod}}]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {name: tls-b-1, namespace: default, labels: {kubernetes.io/service-name: tls-b}}
          addressType: IPv4
          ports: [{port: 8443}]
          endpoints: [{addresses: ["10.0.2.1"], conditions: {ready: true}, targetRef: {kind: Pod, name: tls-b-pod}}]
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend ssl-tcp$\n(?:  [^\n]*\n|\n)*?  use_backend gtw_tls_default_tls-app_0_0 if \{ req_ssl_sni -m str abc\.example\.com \} \{ rand\(100\) -m int lt 70 \}\n  use_backend gtw_tls_default_tls-app_0_1 if \{ req_ssl_sni -m str abc\.example\.com \}$'
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend gtw_tls_default_tls-app_0_0\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+server tls-a-pod 10\.0\.1\.1:8443'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend gtw_tls_default_tls-app_0_1\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+server tls-b-pod 10\.0\.2\.1:8443'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gtw_tls_default_tls-app_0_2'}
      - {type: not_contains, target: haproxy.cfg, pattern: 'gw-tls-reject'}

  test-tlsroute-weighted-invalid-ref-share-rejected:
    requires: [gateways, tlsroutes]
    description: "An invalid TLSRoute backendRef keeps its weight: that share of connections is dispatched to gw-tls-reject, which refuses them, while the valid ref serves the rest."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tlsroute-9443, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tls
                protocol: TLS
                port: 9443
                hostname: "*.example.com"
                allowedRoutes: {namespaces: {from: Same}, kinds: [{kind: TLSRoute}]}
                tls: {mode: Passthrough}
      tlsroutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata: *metadataTlsApp
          spec:
            parentRefs:
              - name: gw-tlsroute-9443
            hostnames:
              - abc.example.com
            rules:
              - backendRefs:
                  - {name: missing, port: 8443, weight: 1}
                  - {name: tls-b, port: 8443, weight: 3}
      services: *weightedTLSServices
      endpoints: *weightedTLSEndpoints
    assertions:
      - type: haproxy_valid
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^frontend gateway-tls-port-9443$\n(?:  [^\n]*\n|\n)*?  use_backend gw-tls-reject if \{ req_ssl_sni -m str abc\.example\.com \} \{ rand\(4\) -m int lt 1 \}\n  use_backend gtw_tls_default_tls-app_0_1 if \{ req_ssl_sni -m str abc\.example\.com \}$'
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend gw-tls-reject\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+tcp-request content reject$'}
      - {type: match_count, target: haproxy.cfg, pattern: '(?m)^backend gw-tls-reject\b', expected: "1"}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^backend gtw_tls_default_tls-app_0_0\b'}

  test-tlsroute-weighted-terminate-listener:
