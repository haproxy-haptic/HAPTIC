            listeners:
              - name: tls-terminate
                port: 8443
                protocol: TLS
                hostname: terminate.example.com
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TLSRoute
                tls:
                  mode: Terminate
                  certificateRefs:
