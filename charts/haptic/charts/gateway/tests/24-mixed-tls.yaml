validationTests:
  test-tlsroute-mixed-termination-routing:
    requires:
    - gateways
    - tlsroutes
    fixtures:
      gateways:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: mixed
          namespace: default
        spec:
          gatewayClassName: haptic
          listeners:
          - name: terminate
            hostname: tls.example.com
            protocol: TLS
            port: 9443
            tls:
              mode: Terminate
              certificateRefs:
              - name: shared-tls
          - name: passthrough
            hostname: '*.example.com'
            protocol: TLS
            port: 9443
            tls:
              mode: Passthrough
      tlsroutes:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: terminated
          namespace: default
        spec:
          parentRefs:
          - name: mixed
            sectionName: terminate
          hostnames:
          - tls.example.com
          rules:
          - backendRefs:
            - name: app
              port: 8080
      - apiVersion: gateway.networking.k8s.io/v1
        kind: TLSRoute
        metadata:
          name: encrypted
          namespace: default
        spec:
          parentRefs:
          - name: mixed
            sectionName: passthrough
          hostnames:
          - '*.example.com'
          rules:
          - backendRefs:
            - name: app
              port: 8080
      services:
      - apiVersion: v1
        kind: Service
        metadata:
          name: app
          namespace: default
        spec:
          ports:
          - port: 8080
    assertions:
    - type: haproxy_valid
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^frontend gateway-tls-port-9443$
    - type: contains
      target: haproxy.cfg
      pattern: bind unix@/etc/haproxy/gw-tls-9443-647d237e187bb04de135cbf49f2a9a042d6b87c860b5797a95051be68b3935d3\.sock mode 600 accept-proxy
        ssl crt-list [^\n]*gw-default-mixed-terminate-crtlist
    - type: contains
      target: haproxy.cfg
      pattern: server terminate unix@/etc/haproxy/gw-tls-9443-647d237e187bb04de135cbf49f2a9a042d6b87c860b5797a95051be68b3935d3\.sock send-proxy-v2
    - type: contains
      target: haproxy.cfg
      pattern: use_backend gateway-tls-bridge-9443-647d237e187bb04de135cbf49f2a9a042d6b87c860b5797a95051be68b3935d3 if \{ var\(sess.gateway_tls_listener\)
        -m str 647d237e187bb04de135cbf49f2a9a042d6b87c860b5797a95051be68b3935d3 \}
    - type: contains
      target: haproxy.cfg
      pattern: use_backend gtw_tls_default_encrypted_0 if \{ req_ssl_sni,lower -m end \.example\.com \} \{ var\(sess.gateway_tls_listener\) -m
        str 6689dd787133f9dd7d3c19b0b8ce9e6808f05280ab610e96a153514a00a679c8 \}
    - type: contains
      target: haproxy.cfg
      pattern: use_backend gtw_tls_default_terminated_0 if \{ ssl_fc_sni,lower -m str tls\.example\.com \}
    - type: contains
      target: haproxy.cfg
      pattern: (?s)set-var\(sess.gateway_tls_listener\) str\(647d237e187bb04de135cbf49f2a9a042d6b87c860b5797a95051be68b3935d3\).*?set-var\(sess.gateway_tls_listener\)
        str\(6689dd787133f9dd7d3c19b0b8ce9e6808f05280ab610e96a153514a00a679c8\)
    - type: contains
      target: haproxy.cfg
      pattern: (?m)^  default_backend gateway-tls-unmatched-9443$
    - type: contains
      target: haproxy.cfg
      pattern: bind unix@/etc/haproxy/gw-tls-9443-[^ ]+ mode 600 accept-proxy ssl crt-list [^ ]+ alpn h2,http/1\.1

