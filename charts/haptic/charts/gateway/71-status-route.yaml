  util-generate-httproute-status-patches:
    requires: [gateways, httproutes, referencegrants]
    template: |
      {#
        Generate HTTPRoute Status Patches

        Conditions emitted per parentRef:
          - Accepted: True/Accepted | False/{NoMatchingParent,
                       NotAllowedByListeners, NoMatchingListenerHostname}
          - ResolvedRefs: True/ResolvedRefs | False/{InvalidKind,
                       RefNotPermitted, BackendNotFound}

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex).
      #}
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {%- import "util-gateway-policy-status" for GatewayPolicyStatusSummary, ApplyGatewayPolicyConditions -%}
      {% macro GenerateHTTPRouteStatusPatch(route any) %}
        {%- var controllerName = dig_string(props, "", "controllerName") %}
        {#- Resolved at runtime: the version the controller actually
            watches, so status SSA always targets a served version
            (v1beta1 on pre-1.0 Gateway API installs). -#}
        {%- var apiVersion = resources.httproutes.APIVersion() %}
        {%- var kind = "HTTPRoute" %}

          {%%
            var nsStr = dig_string(route, "", "metadata", "namespace")
            var nameStr = dig_string(route, "", "metadata", "name")
            var generation = toint(dig(route, "metadata", "generation") | fallback(0))
            // Coerce to []any: downstream HostnamesIntersect expects []any
            // (polymorphic-route ergonomics). Same pattern as TLSRoute.
            var routeHostnames = dig(route, "spec", "hostnames") | toSlice()

            // ResolvedRefs computation — fail-fast on first invalid
            // backendRef. Spec precedence: InvalidKind > RefNotPermitted
            // > BackendNotFound. Flattened via `[*]`: outer rule loop
            // only accessed rule.BackendRefs.
            var policyStatus = map[string]any{}
            GatewayPolicyStatusSummary(route, kind, policyStatus)
            var allRefsResolved = true
            var refFailReason = ""
            var refFailMsg = ""
            for _, rule := range toSlice(dig(route, "spec", "rules")) {
              for _, backendRef := range toSlice(dig(rule, "backendRefs")) {
              var svcName = dig_string(backendRef, "", "name")
              var svcNamespace = dig_string(backendRef, "", "namespace")
              if svcNamespace == "" { svcNamespace = nsStr }
              var group = dig_string(backendRef, "", "group")
              var refKind = dig_string(backendRef, "", "kind")
              if refKind == "" { refKind = "Service" }

              if !((group == "" || group == "core") && refKind == "Service") {
                allRefsResolved = false
                refFailReason = "InvalidKind"
                refFailMsg = "Unsupported backend kind " + group + "/" + refKind
                break
              }
              if svcNamespace != nsStr {
                if ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", kind, nsStr,
                  "", "Service", svcNamespace, svcName) != "true" {
                  allRefsResolved = false
                  refFailReason = "RefNotPermitted"
                  refFailMsg = "Cross-namespace backend ref " + svcNamespace + "/" + svcName + " requires a matching ReferenceGrant"
                  break
                }
              }
              var svc = resources.services.GetSingle(svcNamespace, svcName)
              if svc == nil {
                allRefsResolved = false
                refFailReason = "BackendNotFound"
                refFailMsg = "Backend not found: " + svcNamespace + "/" + svcName
                break
              }
              }
              if !allRefsResolved { break }
            }

            // Build parents array
            var parents = []any{}
            for _, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
              var gwGroup = dig_string(parentRef, "", "group")
              if gwGroup == "" { gwGroup = "gateway.networking.k8s.io" }
              var gwKind = dig_string(parentRef, "", "kind")
              if gwKind == "" { gwKind = "Gateway" }
              var gwNamespace = dig_string(parentRef, "", "namespace")
              if gwNamespace == "" { gwNamespace = nsStr }
              var gwName = dig_string(parentRef, "", "name")

              // ListenerSet parentRef → resolve to its parent Gateway
              // for the listener-attach evaluation, but emit the
              // status entry with kind=ListenerSet so conformance
              // readers see the route as attached to the LS.
              // The publication is absent when the ListenerSet API isn't served.
              var listenerSetInfo any = nil
              var resolvedGatewayNamespace = gwNamespace
              var resolvedGatewayName = gwName
              if gwGroup == "gateway.networking.k8s.io" && gwKind == "ListenerSet" {
                var selectedListenerSet, foundListenerSet = shared.Select(
                  "gateway-host-listenersets", "listenersets", gwNamespace + "/" + gwName)
                if foundListenerSet &&
                  tostring(dig(selectedListenerSet, "accepted") | fallback(false)) == "true" {
                  listenerSetInfo = selectedListenerSet
                  resolvedGatewayNamespace = dig_string(selectedListenerSet, "", "gatewayNamespace")
                  resolvedGatewayName = dig_string(selectedListenerSet, "", "gatewayName")
                }
              }
              if gwGroup == "gateway.networking.k8s.io" &&
                (gwKind == "Gateway" || (gwKind == "ListenerSet" && listenerSetInfo != nil)) {
                var gw = resources.gateways.GetSingle(resolvedGatewayNamespace, resolvedGatewayName)
                if gw != nil {
                  var parentRefStatus = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  gwKind,
                    "name":  gwName,
                  }
                  // dig() preserves the "namespace specified in spec"
                  // round-trip for status reflection.
                  if dig(parentRef, "namespace") != nil {
                    parentRefStatus["namespace"] = gwNamespace
                  }
                  var sectionNameStr = ""
                  if dig(parentRef, "sectionName") != nil {
                    sectionNameStr = dig_string(parentRef, "", "sectionName")
                    parentRefStatus["sectionName"] = sectionNameStr
                  }
                  var parentPort = toint(dig(parentRef, "port") | fallback(0))
                  if parentPort != 0 { parentRefStatus["port"] = parentPort }

                  // Evaluate Accepted-by-listener for this parentRef.
                  // listenerOwner stays polymorphic: a Gateway and a
                  // ListenerSet have structurally identical listeners
                  // but distinct Go types from typegen, so we can't
                  // express both with a single typed variable. dig()
                  // walks both shapes via JSON-tag lookup.
                  var listenerOwner any = gw
                  if gwKind == "ListenerSet" {
                    listenerOwner = map[string]any{"spec": map[string]any{
                      "listeners": dig(listenerSetInfo, "candidates") | toSlice(),
                    }}
                  }
                  var acceptedStatus = "False"
                  var acceptedReason = "NotAllowedByListeners"
                  var acceptedMsg = "No listener accepts this route"
                  var sawSectionMatch = false
                  var sawPortMatch = false
                  var sawKindNs = false
                  var sawHostnameMismatch = false
                  if listenerOwner != nil {
                    for _, listener := range dig(listenerOwner, "spec", "listeners") | toSlice() {
                      var listenerName = dig_string(listener, "", "name")

                      if sectionNameStr != "" && listenerName != sectionNameStr {
                        continue
                      }
                      if sectionNameStr != "" {
                        sawSectionMatch = true
                      }
                      var listenerPort = toint(dig(listener, "port") | fallback(0))
                      if parentPort != 0 && listenerPort != parentPort {
                        continue
                      }
                      if parentPort != 0 {
                        sawPortMatch = true
                      }

                      // Kind filter
                      var kindOk = true
                      var allowedKindsRaw = dig(listener, "allowedRoutes", "kinds")
                      if allowedKindsRaw != nil {
                        kindOk = false
                        for _, ak := range toSlice(allowedKindsRaw) {
                          var akGroup = dig_string(ak, "gateway.networking.k8s.io", "group")
                          var akKind = dig_string(ak, "", "kind")
                          if akGroup == "gateway.networking.k8s.io" && akKind == kind {
                            kindOk = true
                            break
                          }
                        }
                      }

                      // Namespace filter
                      var nsOk = false
                      var fromMode = dig_string(listener, "Same", "allowedRoutes", "namespaces", "from")
                      switch fromMode {
                      case "Same":
                        nsOk = nsStr == gwNamespace
                      case "All":
                        nsOk = true
                      case "Selector":
                        var ml = dig(listener, "allowedRoutes", "namespaces", "selector", "matchLabels")
                        if ml != nil {
                          var nsObj = resources.namespaces.GetSingle(nsStr)
                          if nsObj != nil {
                            // ml stays `any` (polymorphic via listenerOwner);
                            // to_str_map normalises both shapes.
                            var selectorMap = to_str_map(ml)
                            var allMatch = true
                            for k, v := range selectorMap {
                              var actual, ok = nsObj.Metadata.Labels[k]
                              if !ok || actual != v {
                                allMatch = false
                                break
                              }
                            }
                            nsOk = allMatch
                          }
                        }
                      }

                      if !kindOk || !nsOk {
                        sawKindNs = true
                        continue
                      }

                      var listenerHostname = dig_string(listener, "", "hostname")
                      if HostnamesIntersect(listenerHostname, routeHostnames) != "true" {
                        sawHostnameMismatch = true
                        continue
                      }

                      acceptedStatus = "True"
                      acceptedReason = "Accepted"
                      acceptedMsg = "Route accepted"
                      break
                    }
                  }
                  if acceptedStatus == "False" {
                    if sectionNameStr != "" && !sawSectionMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "Section " + sectionNameStr + " not found on parent gateway"
                    } else if parentPort != 0 && !sawPortMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "No listener with port " + tostring(parentPort) + " on parent gateway"
                    } else if sawHostnameMismatch && !sawKindNs {
                      acceptedReason = "NoMatchingListenerHostname"
                      acceptedMsg = "No listener hostname intersects the route's hostnames"
                    } else {
                      acceptedReason = "NotAllowedByListeners"
                      acceptedMsg = "No listener accepts the route's namespace or kind"
                    }
                  }

                  var resolvedStatus = "True"
                  var resolvedReason = "ResolvedRefs"
                  var resolvedMsg = "All backend references resolved"
                  if !allRefsResolved {
                    resolvedStatus = "False"
                    resolvedReason = refFailReason
                    resolvedMsg = refFailMsg
                  }

                  var policyConditions = map[string]any{"conditions": []any{
                    condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                      generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "Accepted", acceptedStatus)),
                    condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                      generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "ResolvedRefs", resolvedStatus)),
                  }}
                  ApplyGatewayPolicyConditions(route, parentRefStatus, controllerName, policyStatus, policyConditions)
                  parents = append(parents, map[string]any{
                    "parentRef": parentRefStatus,
                    "controllerName": controllerName,
                    "conditions": policyConditions["conditions"],
                  })
                }
              }
            }

            if len(parents) > 0 {
              // See deployed-only emission rationale in
              // util-generate-route-status-patches (preserved for
              // continuity).
              statusPatch(route, map[string]interface{}{
                  "deployed": map[string]interface{}{
                    "parents": parents,
                  },
                }, map[string]any{"/parents": map[string]any{"controllerName": controllerName}})
            }
          %%}
      {% end %}

  status-patches-201-gateway-httproute:
    requires: [gateways, httproutes, referencegrants]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-httproute-status-bindings" -}}'
      root: gateway-http-route-pre-analysis
      group: gateway-httproute-status
      consumes: [gateway-policy-records]
      optionalConsumes: [gateway-host-listenersets]
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-httproute-status-patches" for GenerateHTTPRouteStatusPatch -%}
      {%- var route = item -%}
      {%- if route != nil -%}{{- GenerateHTTPRouteStatusPatch(route) -}}{%- end -%}

  util-generate-grpcroute-status-patches:
    requires: [gateways, grpcroutes, referencegrants]
    template: |
      {#
        Generate GRPCRoute Status Patches

        Typed sibling of GenerateHTTPRouteStatusPatches; the body is
        identical apart from `kind = "GRPCRoute"` and the route slice
        type. Kept as a separate macro rather than parameterised because
        the typed `*resources.grpcroutes.T` parameter is the whole point
        of the split — sharing the body would require widening it back
        to `any`.
      #}
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {%- import "util-gateway-policy-status" for GatewayPolicyStatusSummary, ApplyGatewayPolicyConditions -%}
      {% macro GenerateGRPCRouteStatusPatch(route *resources.grpcroutes.T) %}
        {%- var controllerName = dig_string(props, "", "controllerName") %}
        {%- var apiVersion = resources.grpcroutes.APIVersion() %}
        {%- var kind = "GRPCRoute" %}

          {%%
            var nsStr = route.Metadata.Namespace
            var nameStr = route.Metadata.Name
            var generation = route.Metadata.Generation
            var routeHostnames = route.Spec.Hostnames | toSlice()

            var policyStatus = map[string]any{}
            GatewayPolicyStatusSummary(route, kind, policyStatus)
            var allRefsResolved = true
            var refFailReason = ""
            var refFailMsg = ""
            for _, backendRef := range route.Spec.Rules[*].BackendRefs {
              var svcName = backendRef.Name
              var svcNamespace = backendRef.Namespace
              if svcNamespace == "" { svcNamespace = nsStr }
              var group = backendRef.Group
              var refKind = backendRef.Kind
              if refKind == "" { refKind = "Service" }

              if !((group == "" || group == "core") && refKind == "Service") {
                allRefsResolved = false
                refFailReason = "InvalidKind"
                refFailMsg = "Unsupported backend kind " + group + "/" + refKind
                break
              }
              if svcNamespace != nsStr {
                if ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", kind, nsStr,
                  "", "Service", svcNamespace, svcName) != "true" {
                  allRefsResolved = false
                  refFailReason = "RefNotPermitted"
                  refFailMsg = "Cross-namespace backend ref " + svcNamespace + "/" + svcName + " requires a matching ReferenceGrant"
                  break
                }
              }
              var svc = resources.services.GetSingle(svcNamespace, svcName)
              if svc == nil {
                allRefsResolved = false
                refFailReason = "BackendNotFound"
                refFailMsg = "Backend not found: " + svcNamespace + "/" + svcName
                break
              }
            }

            var parents = []any{}
            for _, parentRef := range route.Spec.ParentRefs {
              var gwGroup = parentRef.Group
              if gwGroup == "" { gwGroup = "gateway.networking.k8s.io" }
              var gwKind = parentRef.Kind
              if gwKind == "" { gwKind = "Gateway" }
              var gwNamespace = parentRef.Namespace
              if gwNamespace == "" { gwNamespace = nsStr }
              var gwName = parentRef.Name

              // The publication is absent when the ListenerSet API isn't served.
              var listenerSetInfo any = nil
              var resolvedGatewayNamespace = gwNamespace
              var resolvedGatewayName = gwName
              if gwGroup == "gateway.networking.k8s.io" && gwKind == "ListenerSet" {
                var selectedListenerSet, foundListenerSet = shared.Select(
                  "gateway-host-listenersets", "listenersets", gwNamespace + "/" + gwName)
                if foundListenerSet &&
                  tostring(dig(selectedListenerSet, "accepted") | fallback(false)) == "true" {
                  listenerSetInfo = selectedListenerSet
                  resolvedGatewayNamespace = dig_string(selectedListenerSet, "", "gatewayNamespace")
                  resolvedGatewayName = dig_string(selectedListenerSet, "", "gatewayName")
                }
              }
              if gwGroup == "gateway.networking.k8s.io" &&
                (gwKind == "Gateway" || (gwKind == "ListenerSet" && listenerSetInfo != nil)) {
                var gw = resources.gateways.GetSingle(resolvedGatewayNamespace, resolvedGatewayName)
                if gw != nil {
                  var parentRefStatus = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  gwKind,
                    "name":  gwName,
                  }
                  if dig(parentRef, "namespace") != nil {
                    parentRefStatus["namespace"] = gwNamespace
                  }
                  var sectionNameStr = ""
                  if dig(parentRef, "sectionName") != nil {
                    sectionNameStr = parentRef.SectionName
                    parentRefStatus["sectionName"] = sectionNameStr
                  }
                  var parentPort = toint(parentRef.Port)
                  if parentPort != 0 { parentRefStatus["port"] = parentPort }

                  var listenerOwner any = gw
                  if gwKind == "ListenerSet" {
                    listenerOwner = map[string]any{"spec": map[string]any{
                      "listeners": dig(listenerSetInfo, "candidates") | toSlice(),
                    }}
                  }
                  var acceptedStatus = "False"
                  var acceptedReason = "NotAllowedByListeners"
                  var acceptedMsg = "No listener accepts this route"
                  var sawSectionMatch = false
                  var sawPortMatch = false
                  var sawKindNs = false
                  var sawHostnameMismatch = false
                  if listenerOwner != nil {
                    for _, listener := range dig(listenerOwner, "spec", "listeners") | toSlice() {
                      var listenerName = dig_string(listener, "", "name")

                      if sectionNameStr != "" && listenerName != sectionNameStr {
                        continue
                      }
                      if sectionNameStr != "" {
                        sawSectionMatch = true
                      }
                      var listenerPort = toint(dig(listener, "port") | fallback(0))
                      if parentPort != 0 && listenerPort != parentPort {
                        continue
                      }
                      if parentPort != 0 {
                        sawPortMatch = true
                      }

                      var kindOk = true
                      var allowedKindsRaw = dig(listener, "allowedRoutes", "kinds")
                      if allowedKindsRaw != nil {
                        kindOk = false
                        for _, ak := range toSlice(allowedKindsRaw) {
                          var akGroup = dig_string(ak, "gateway.networking.k8s.io", "group")
                          var akKind = dig_string(ak, "", "kind")
                          if akGroup == "gateway.networking.k8s.io" && akKind == kind {
                            kindOk = true
                            break
                          }
                        }
                      }

                      var nsOk = false
                      var fromMode = dig_string(listener, "Same", "allowedRoutes", "namespaces", "from")
                      switch fromMode {
                      case "Same":
                        nsOk = nsStr == gwNamespace
                      case "All":
                        nsOk = true
                      case "Selector":
                        var ml = dig(listener, "allowedRoutes", "namespaces", "selector", "matchLabels")
                        if ml != nil {
                          var nsObj = resources.namespaces.GetSingle(nsStr)
                          if nsObj != nil {
                            var selectorMap = to_str_map(ml)
                            var allMatch = true
                            for k, v := range selectorMap {
                              var actual, ok = nsObj.Metadata.Labels[k]
                              if !ok || actual != v {
                                allMatch = false
                                break
                              }
                            }
                            nsOk = allMatch
                          }
                        }
                      }

                      if !kindOk || !nsOk {
                        sawKindNs = true
                        continue
                      }

                      var listenerHostname = dig_string(listener, "", "hostname")
                      if HostnamesIntersect(listenerHostname, routeHostnames) != "true" {
                        sawHostnameMismatch = true
                        continue
                      }

                      acceptedStatus = "True"
                      acceptedReason = "Accepted"
                      acceptedMsg = "Route accepted"
                      break
                    }
                  }
                  if acceptedStatus == "False" {
                    if sectionNameStr != "" && !sawSectionMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "Section " + sectionNameStr + " not found on parent gateway"
                    } else if parentPort != 0 && !sawPortMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "No listener with port " + tostring(parentPort) + " on parent gateway"
                    } else if sawHostnameMismatch && !sawKindNs {
                      acceptedReason = "NoMatchingListenerHostname"
                      acceptedMsg = "No listener hostname intersects the route's hostnames"
                    } else {
                      acceptedReason = "NotAllowedByListeners"
                      acceptedMsg = "No listener accepts the route's namespace or kind"
                    }
                  }

                  var resolvedStatus = "True"
                  var resolvedReason = "ResolvedRefs"
                  var resolvedMsg = "All backend references resolved"
                  if !allRefsResolved {
                    resolvedStatus = "False"
                    resolvedReason = refFailReason
                    resolvedMsg = refFailMsg
                  }

                  var policyConditions = map[string]any{"conditions": []any{
                    condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                      generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "Accepted", acceptedStatus)),
                    condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                      generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "ResolvedRefs", resolvedStatus)),
                  }}
                  ApplyGatewayPolicyConditions(route, parentRefStatus, controllerName, policyStatus, policyConditions)
                  parents = append(parents, map[string]any{
                    "parentRef": parentRefStatus,
                    "controllerName": controllerName,
                    "conditions": policyConditions["conditions"],
                  })
                }
              }
            }

            if len(parents) > 0 {
              statusPatch(route, map[string]interface{}{
                  "deployed": map[string]interface{}{
                    "parents": parents,
                  },
                }, map[string]any{"/parents": map[string]any{"controllerName": controllerName}})
            }
          %%}
      {% end %}

  status-patches-202-gateway-grpcroute:
    requires: [gateways, grpcroutes, referencegrants]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-grpcroute-status-bindings" -}}'
      group: gateway-grpcroute-status
      consumes: [gateway-policy-records]
      optionalConsumes: [gateway-host-listenersets]
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-grpcroute-status-patches" for GenerateGRPCRouteStatusPatch -%}
      {%- var route = resources.grpcroutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{{- GenerateGRPCRouteStatusPatch(route) -}}{%- end -%}

  util-generate-tlsroute-status-patches:
    requires: [gateways, namespaces, referencegrants, services, tlsroutes]
    template: |
      {#
        Generate TLSRoute Status Patches

        TLSRoute-specific status patches. The shape parallels HTTPRoute /
        GRPCRoute (`util-generate-route-status-patches`) but the listener
        attachment rules differ in three ways:

          1. **Protocol filter** — TLSRoute attaches only to listeners
             with protocol == "TLS". Listeners with protocol HTTP or
             HTTPS reject the route with NotAllowedByListeners regardless
             of their explicit allowedRoutes.kinds setting (the HTTP /
             HTTPS protocol-default kinds don't include TLSRoute, so
             conformance treats this as "no listener accepts").

          2. **Backend ref kind** — the spec restricts TLSRoute
             backendRefs to core/v1 Service like the other routes; the
             ref-resolution loop matches HTTPRoute exactly.

        Conditions emitted per parentRef:
          - Accepted: True/Accepted | False/{NoMatchingParent,
                       NotAllowedByListeners, NoMatchingListenerHostname}
          - ResolvedRefs: True/ResolvedRefs | False/{InvalidKind,
                       RefNotPermitted, BackendNotFound}

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex).
      #}
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {%- import "util-resource-helpers" for ListenerProtocolOr -%}
      {% macro GenerateTLSRouteStatusPatch(route *resources.tlsroutes.T) %}
        {%- var controllerName = dig_string(props, "", "controllerName") %}
        {#- TLSRoute is v1 in Gateway API v1.5+ — the v1alpha2 served-version
            was retired and the API server returns 404 on patch attempts to
            gateway.networking.k8s.io/v1alpha2. Use v1 to match the
            current CRD storageVersion. -#}
        {%- var apiVersion = resources.tlsroutes.APIVersion() %}
        {%- var kind = "TLSRoute" %}

          {%%
            var nsStr = route.Metadata.Namespace
            var nameStr = route.Metadata.Name
            var generation = route.Metadata.Generation
            // Coerce to []any: downstream HostnamesIntersect macro
            // expects []any (polymorphic-route ergonomics).
            var routeHostnames = route.Spec.Hostnames | toSlice()

            // ResolvedRefs computation — fail-fast on first invalid
            // backendRef. Same precedence as HTTPRoute: InvalidKind >
            // RefNotPermitted > BackendNotFound. Flattened via `[*]`:
            // outer rule loop only accessed rule.BackendRefs; the
            // single desugared loop's `break` replaces the outer
            // `if !allRefsResolved { break }` re-check.
            var allRefsResolved = true
            var refFailReason = ""
            var refFailMsg = ""
            for _, backendRef := range route.Spec.Rules[*].BackendRefs {
              var svcName = backendRef.Name
              var svcNamespace = backendRef.Namespace
              if svcNamespace == "" { svcNamespace = nsStr }
              var group = backendRef.Group
              var refKind = backendRef.Kind
              if refKind == "" { refKind = "Service" }

              if !((group == "" || group == "core") && refKind == "Service") {
                allRefsResolved = false
                refFailReason = "InvalidKind"
                refFailMsg = "Unsupported backend kind " + group + "/" + refKind
                break
              }
              if svcNamespace != nsStr {
                if ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", kind, nsStr,
                  "", "Service", svcNamespace, svcName) != "true" {
                  allRefsResolved = false
                  refFailReason = "RefNotPermitted"
                  refFailMsg = "Cross-namespace backend ref " + svcNamespace + "/" + svcName + " requires a matching ReferenceGrant"
                  break
                }
              }
              var svc = resources.services.GetSingle(svcNamespace, svcName)
              if svc == nil {
                allRefsResolved = false
                refFailReason = "BackendNotFound"
                refFailMsg = "Backend not found: " + svcNamespace + "/" + svcName
                break
              }
            }

            var parents = []any{}
            for _, parentRef := range route.Spec.ParentRefs {
              var gwGroup = parentRef.Group
              if gwGroup == "" { gwGroup = "gateway.networking.k8s.io" }
              var gwKind = parentRef.Kind
              if gwKind == "" { gwKind = "Gateway" }
              var gwNamespace = parentRef.Namespace
              if gwNamespace == "" { gwNamespace = nsStr }
              var gwName = parentRef.Name

              if gwGroup == "gateway.networking.k8s.io" && gwKind == "Gateway" {
                var gw = resources.gateways.GetSingle(gwNamespace, gwName)
                if gw != nil {
                  var parentRefStatus = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  "Gateway",
                    "name":  gwName,
                  }
                  // dig() preserves the "namespace specified in spec"
                  // round-trip for status reflection — typed access
                  // alone would collapse absent and "" into the same
                  // zero value (omitempty + empty string both look
                  // identical).
                  if dig(parentRef, "namespace") != nil {
                    parentRefStatus["namespace"] = gwNamespace
                  }
                  // sectionName is also optional; same dig()-for-
                  // presence pattern preserves the spec/status
                  // round-trip behaviour.
                  var sectionNameStr = ""
                  if dig(parentRef, "sectionName") != nil {
                    sectionNameStr = parentRef.SectionName
                    parentRefStatus["sectionName"] = sectionNameStr
                  }
                  var parentPort = toint(parentRef.Port)
                  if parentPort != 0 { parentRefStatus["port"] = parentPort }

                  var acceptedStatus = "False"
                  var acceptedReason = "NotAllowedByListeners"
                  var acceptedMsg = "No listener accepts this route"
                  var sawSectionMatch = false
                  var sawPortMatch = false
                  var sawKindNs = false
                  var sawHostnameMismatch = false
                  if gw != nil {
                    for _, listener := range gw.Spec.Listeners {
                      var listenerName = listener.Name

                      if sectionNameStr != "" && listenerName != sectionNameStr {
                        continue
                      }
                      if sectionNameStr != "" {
                        sawSectionMatch = true
                      }
                      var listenerPort = toint(listener.Port)
                      if parentPort != 0 && listenerPort != parentPort {
                        continue
                      }
                      if parentPort != 0 {
                        sawPortMatch = true
                      }

                      // Protocol filter: TLSRoute only attaches to TLS
                      // protocol listeners. Other protocols never list
                      // TLSRoute in their default kinds (per the
                      // listener-status snippet's defaultKinds map),
                      // so an HTTP / HTTPS listener never accepts
                      // TLSRoute regardless of allowedRoutes.kinds
                      // explicit settings.
                      var listenerProto = ListenerProtocolOr(listener, "HTTP")
                      if listenerProto != "TLS" {
                        sawKindNs = true
                        continue
                      }

                      // allowedRoutes.kinds intersection. Typed
                      // iteration over the optional slice is a no-op
                      // when absent (l.AllowedRoutes.Kinds is nil
                      // zero-value); dig() outer guard preserves the
                      // "kinds absent → permit all" semantic by
                      // skipping the kindOk = false initialisation
                      // when the field was never specified.
                      var kindOk = true
                      if dig(listener, "allowedRoutes", "kinds") != nil {
                        kindOk = false
                        for _, ak := range listener.AllowedRoutes.Kinds {
                          var akGroup = ak.Group
                          if akGroup == "" { akGroup = "gateway.networking.k8s.io" }
                          if akGroup == "gateway.networking.k8s.io" && ak.Kind == kind {
                            kindOk = true
                            break
                          }
                        }
                      }

                      var nsOk = false
                      var fromMode = listener.AllowedRoutes.Namespaces.From
                      if fromMode == "" { fromMode = "Same" }
                      switch fromMode {
                      case "Same":
                        nsOk = nsStr == gwNamespace
                      case "All":
                        nsOk = true
                      case "Selector":
                        // listener is typed *Gateway.Listeners[i] in
                        // this typed-route path — MatchLabels is
                        // map[string]string directly, no to_str_map
                        // normalisation needed.
                        var selectorMap = listener.AllowedRoutes.Namespaces.Selector.MatchLabels
                        if len(selectorMap) > 0 {
                          var nsObj = resources.namespaces.GetSingle(nsStr)
                          if nsObj != nil {
                            var allMatch = true
                            for k, v := range selectorMap {
                              var actual, ok = nsObj.Metadata.Labels[k]
                              if !ok || actual != v {
                                allMatch = false
                                break
                              }
                            }
                            nsOk = allMatch
                          }
                        }
                      }

                      if !kindOk || !nsOk {
                        sawKindNs = true
                        continue
                      }

                      var listenerHostname = listener.Hostname
                      if HostnamesIntersect(listenerHostname, routeHostnames) != "true" {
                        sawHostnameMismatch = true
                        continue
                      }

                      acceptedStatus = "True"
                      acceptedReason = "Accepted"
                      acceptedMsg = "Route accepted"
                      break
                    }
                  }
                  if acceptedStatus == "False" {
                    if sectionNameStr != "" && !sawSectionMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "Section " + sectionNameStr + " not found on parent gateway"
                    } else if parentPort != 0 && !sawPortMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "No listener with port " + tostring(parentPort) + " on parent gateway"
                    } else if sawHostnameMismatch && !sawKindNs {
                      acceptedReason = "NoMatchingListenerHostname"
                      acceptedMsg = "No listener hostname intersects the route's hostnames"
                    } else {
                      acceptedReason = "NotAllowedByListeners"
                      acceptedMsg = "No listener accepts the route's namespace, kind, or protocol"
                    }
                  }

                  var resolvedStatus = "True"
                  var resolvedReason = "ResolvedRefs"
                  var resolvedMsg = "All backend references resolved"
                  if !allRefsResolved {
                    resolvedStatus = "False"
                    resolvedReason = refFailReason
                    resolvedMsg = refFailMsg
                  }

                  parents = append(parents, map[string]any{
                    "parentRef":      parentRefStatus,
                    "controllerName": controllerName,
                    "conditions": []any{
                      condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                        generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "Accepted", acceptedStatus)),
                      condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                        generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "ResolvedRefs", resolvedStatus)),
                    },
                  })
                }
              }
            }

            if len(parents) > 0 {
              // Same rendered/deployed gate as the HTTPRoute / GRPCRoute
              // path above — hold Accepted=True until HAProxy actually
              // reloads with the new TLSRoute, so the test's dial sees
              // a routable backend instead of falling through to
              // default_backend.
              // Rendered parents = deployed parents (byte-identical). See
              // the analogous comment in 70-status-gateway.yaml — the
              // Route conditions (Accepted, ResolvedRefs per parent) are
              // contractually config-level per Gateway-API spec, but the
              // gRPC conformance suite (and similar dialing tests) treats
              // Route.Accepted=True as their "data plane is ready" signal —
              // they call kubernetes.GatewayAndRoutesMustBeAccepted which
              // ONLY waits for Route Accepted, never for listener
              // Programmed. Once a dial fails the conformance gRPC client's
              // persistent HTTP/2 connection enters a "closing" state and
              // every subsequent retry returns Canceled immediately, so we
              // get exactly one shot at the first dial.
              //
              // To make that shot succeed we emit Route status only on the
              // deployed variant. With phase-scoped field managers the
              // haptic-rendered manager never touches Route status — only
              // haptic-deployed writes the conditions, after HAProxy has
              // reloaded with the route. Tests block in their Accepted=True
              // wait until that happens, then dial against an HAProxy that
              // already serves the route. Stricter than spec (we delay
              // signalling "Accepted" until data plane is ready), but
              // still spec-compliant: Accepted=True is eventually emitted
              // and always correct when it appears.
              statusPatch(route, map[string]interface{}{
                  "deployed": map[string]interface{}{
                    "parents": parents,
                  },
                }, map[string]any{"/parents": map[string]any{"controllerName": controllerName}})
            }
          %%}
      {% end %}

  util-generate-tcproute-status-patches:
    requires: [gateways, namespaces, referencegrants, services, tcproutes]
    template: |
      {#
        Generate TCPRoute Status Patches

        L4 raw-TCP routing. Mirrors the TLSRoute generator but simpler:
        TCPRoute has NO hostnames (no SNI) and no TLS mode, so there is no
        hostname-intersection step and no Passthrough/Terminate
        TLS-mode checks. Attaches only to `protocol: TCP` listeners.

        Conditions emitted per parentRef:
          - Accepted: True/Accepted | False/{NoMatchingParent,
                       NotAllowedByListeners}
          - ResolvedRefs: True/ResolvedRefs | False/{InvalidKind,
                       RefNotPermitted, BackendNotFound}

        Status is emitted on the DEPLOYED variant only (same rationale as
        TLSRoute) so a conformance dial sees a routable backend before
        Accepted=True appears. TCPRoute is v1 (v1alpha2 retired).
      #}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for RouteParentTransitionTime -%}
      {%- import "util-resource-helpers" for ListenerProtocolOr -%}
      {% macro GenerateTCPRouteStatusPatch(route *resources.tcproutes.T) %}
        {%- var controllerName = dig_string(props, "", "controllerName") %}
        {%- var apiVersion = resources.tcproutes.APIVersion() %}
        {%- var kind = "TCPRoute" %}

          {%%
            var nsStr = route.Metadata.Namespace
            var nameStr = route.Metadata.Name
            var generation = route.Metadata.Generation

            // ResolvedRefs — fail-fast on first invalid backendRef.
            // Precedence: InvalidKind > RefNotPermitted > BackendNotFound.
            var allRefsResolved = true
            var refFailReason = ""
            var refFailMsg = ""
            for _, backendRef := range route.Spec.Rules[*].BackendRefs {
              var svcName = backendRef.Name
              var svcNamespace = backendRef.Namespace
              if svcNamespace == "" { svcNamespace = nsStr }
              var group = backendRef.Group
              var refKind = backendRef.Kind
              if refKind == "" { refKind = "Service" }
              if !((group == "" || group == "core") && refKind == "Service") {
                allRefsResolved = false
                refFailReason = "InvalidKind"
                refFailMsg = "Unsupported backend kind " + group + "/" + refKind
                break
              }
              if svcNamespace != nsStr {
                if ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", kind, nsStr,
                  "", "Service", svcNamespace, svcName) != "true" {
                  allRefsResolved = false
                  refFailReason = "RefNotPermitted"
                  refFailMsg = "Cross-namespace backend ref " + svcNamespace + "/" + svcName + " requires a matching ReferenceGrant"
                  break
                }
              }
              var svc = resources.services.GetSingle(svcNamespace, svcName)
              if svc == nil {
                allRefsResolved = false
                refFailReason = "BackendNotFound"
                refFailMsg = "Backend not found: " + svcNamespace + "/" + svcName
                break
              }
            }

            var parents = []any{}
            for _, parentRef := range route.Spec.ParentRefs {
              var gwGroup = parentRef.Group
              if gwGroup == "" { gwGroup = "gateway.networking.k8s.io" }
              var gwKind = parentRef.Kind
              if gwKind == "" { gwKind = "Gateway" }
              var gwNamespace = parentRef.Namespace
              if gwNamespace == "" { gwNamespace = nsStr }
              var gwName = parentRef.Name

              if gwGroup == "gateway.networking.k8s.io" && gwKind == "Gateway" {
                var gw = resources.gateways.GetSingle(gwNamespace, gwName)
                if gw != nil {
                  var parentRefStatus = map[string]any{
                    "group": "gateway.networking.k8s.io",
                    "kind":  "Gateway",
                    "name":  gwName,
                  }
                  if dig(parentRef, "namespace") != nil {
                    parentRefStatus["namespace"] = gwNamespace
                  }
                  var sectionNameStr = ""
                  if dig(parentRef, "sectionName") != nil {
                    sectionNameStr = parentRef.SectionName
                    parentRefStatus["sectionName"] = sectionNameStr
                  }
                  var parentPort = toint(parentRef.Port)
                  if parentPort != 0 { parentRefStatus["port"] = parentPort }
                  var acceptedStatus = "False"
                  var acceptedReason = "NotAllowedByListeners"
                  var acceptedMsg = "No listener accepts this route"
                  var sawSectionMatch = false
                  var sawPortMatch = false
                  if gw != nil {
                    for _, listener := range gw.Spec.Listeners {
                      var listenerName = listener.Name
                      if sectionNameStr != "" && listenerName != sectionNameStr {
                        continue
                      }
                      if sectionNameStr != "" {
                        sawSectionMatch = true
                      }
                      var listenerPort = toint(listener.Port)
                      if parentPort != 0 && listenerPort != parentPort {
                        continue
                      }
                      if parentPort != 0 {
                        sawPortMatch = true
                      }
                      // Protocol filter: TCPRoute only attaches to TCP listeners.
                      var listenerProto = ListenerProtocolOr(listener, "HTTP")
                      if listenerProto != "TCP" {
                        continue
                      }
                      // allowedRoutes.kinds intersection (absent → permit all).
                      var kindOk = true
                      if dig(listener, "allowedRoutes", "kinds") != nil {
                        kindOk = false
                        for _, ak := range listener.AllowedRoutes.Kinds {
                          var akGroup = ak.Group
                          if akGroup == "" { akGroup = "gateway.networking.k8s.io" }
                          if akGroup == "gateway.networking.k8s.io" && ak.Kind == kind {
                            kindOk = true
                            break
                          }
                        }
                      }
                      var nsOk = false
                      var fromMode = listener.AllowedRoutes.Namespaces.From
                      if fromMode == "" { fromMode = "Same" }
                      switch fromMode {
                      case "Same":
                        nsOk = nsStr == gwNamespace
                      case "All":
                        nsOk = true
                      case "Selector":
                        var selectorMap = listener.AllowedRoutes.Namespaces.Selector.MatchLabels
                        if len(selectorMap) > 0 {
                          var nsObj = resources.namespaces.GetSingle(nsStr)
                          if nsObj != nil {
                            var allMatch = true
                            for k, v := range selectorMap {
                              var actual, ok = nsObj.Metadata.Labels[k]
                              if !ok || actual != v {
                                allMatch = false
                                break
                              }
                            }
                            nsOk = allMatch
                          }
                        }
                      }
                      if !kindOk || !nsOk {
                        continue
                      }
                      acceptedStatus = "True"
                      acceptedReason = "Accepted"
                      acceptedMsg = "Route accepted"
                      break
                    }
                  }
                  if acceptedStatus == "False" {
                    if sectionNameStr != "" && !sawSectionMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "Section " + sectionNameStr + " not found on parent gateway"
                    } else if parentPort != 0 && !sawPortMatch {
                      acceptedReason = "NoMatchingParent"
                      acceptedMsg = "No listener with port " + tostring(parentPort) + " on parent gateway"
                    }
                  }

                  var resolvedStatus = "True"
                  var resolvedReason = "ResolvedRefs"
                  var resolvedMsg = "All backend references resolved"
                  if !allRefsResolved {
                    resolvedStatus = "False"
                    resolvedReason = refFailReason
                    resolvedMsg = refFailMsg
                  }

                  parents = append(parents, map[string]any{
                    "parentRef":      parentRefStatus,
                    "controllerName": controllerName,
                    "conditions": []any{
                      condition("Accepted", acceptedStatus, acceptedReason, acceptedMsg,
                        generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "Accepted", acceptedStatus)),
                      condition("ResolvedRefs", resolvedStatus, resolvedReason, resolvedMsg,
                        generation, RouteParentTransitionTime(route, parentRefStatus, controllerName, "ResolvedRefs", resolvedStatus)),
                    },
                  })
                }
              }
            }

            if len(parents) > 0 {
              statusPatch(route, map[string]interface{}{
                  "deployed": map[string]interface{}{
                    "parents": parents,
                  },
                }, map[string]any{"/parents": map[string]any{"controllerName": controllerName}})
            }
          %%}
      {% end %}
