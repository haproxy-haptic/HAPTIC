  backenditems-501-gateway-ssl-passthrough-http:
    requires: [endpoints, httproutes, services]
    incremental:
      source: httproutes
      whenAnyPathExists: ["spec.rules[*].filters"]
      group: gateway-ssl-passthrough-backend-specs
      consumes: [gateway-ssl-passthrough]
      effects: [publishValue]
    template: |-
      {%- import "util-gateway-http-ssl-passthrough" for GatewayHTTPSSLPassthrough -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {%%
        var route = item
        var namespace = dig_string(route, "", "metadata", "namespace")
        var routeName = dig_string(route, "", "metadata", "name")
        var backendName = ""
        var rank = ""
        var hasPassthrough = GatewayHTTPSSLPassthrough(route) == "true"
        for _, hostname := range toSlice(dig(route, "spec", "hostnames")) {
          var candidateRank = "0/http/" + tostring(hostname)
          var candidate, found = shared.Select(
            "gateway-ssl-passthrough", "backends", candidateRank)
          if !found || dig_string(candidate, "", "route_type") != "httproute" ||
            dig_string(candidate, "", "namespace") != namespace ||
            dig_string(candidate, "", "route") != routeName {
            continue
          }
          if rank == "" || candidateRank < rank {
            rank = candidateRank
            backendName = dig_string(candidate, "", "name")
          }
        }
        var backendRef any
        for _, rule := range toSlice(dig(route, "spec", "rules")) {
          var refs = toSlice(dig(rule, "backendRefs"))
          if len(refs) > 0 {
            backendRef = refs[0]
            break
          }
        }
        if hasPassthrough && backendName != "" && backendRef != nil {
          var refName = dig_string(backendRef, "", "name")
          var refPort = toint(dig(backendRef, "port") | fallback(0))
          if refPort == 0 { refPort = 80 }
          var servers = BackendServersResult(
            refName, 0, refPort, nil, nil, backendName, namespace)
          show shared.Publish("specs", rank, map[string]any{
            "backend": map[string]any{
              "name": backendName,
              "guid": make_guid("be", backendName),
              "mode": "tcp",
              "comments": []any{"# gateway/backends-gateway-ssl-passthrough"},
              "servers": servers["servers"],
            },
            "degraded": map[string]any{
              "active": servers["degradedByName"],
              "namespace": namespace,
              "service": refName,
              "portName": servers["portName"],
            },
          })
        }
      %%}

  util-gateway-tls-backend-bindings:
    template: |-
      {%- import "util-gateway-backend-bindings" for GatewayBackendProps -%}
      {{- toJSON(map[string]any{"tlsroutes": GatewayBackendProps()}) -}}

  backenditems-501-gateway-ssl-passthrough-tls:
    requires: [configmaps, endpoints, secrets, services, tlsroutes]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-tls-backend-bindings" -}}'
      group: gateway-ssl-passthrough-backend-specs
      consumes: [gateway-ssl-passthrough]
      optionalConsumes: [gateway-backend-tls-policies]
      effects: [publishValue]
    template: |-
      {%- import "util-backend" for FlagsToKeywordArgs -%}
      {%- import "util-backend-servers-result" for BackendServersResult -%}
      {%- import "util-resolve-backend-tls" for ResolveBackendTLS -%}
      {%%
        var route = item
        var namespace = dig_string(route, "", "metadata", "namespace")
        var routeName = dig_string(route, "", "metadata", "name")
        var files = []any{}
        var fixed = func(value int) string {
          var encoded = tostring(value)
          var zeroes = "0000000000"
          if len(encoded) >= len(zeroes) { return encoded }
          return zeroes[:len(zeroes)-len(encoded)] + encoded
        }
        for ruleIndex, rule := range toSlice(dig(route, "spec", "rules")) {
          var definitionKey = "1/tls/" + namespace + "/" + routeName + "/" + fixed(ruleIndex)
          var definition, found = shared.Select(
            "gateway-ssl-passthrough", "definitions", definitionKey)
          if !found || dig(definition, "invalid") == true { continue }
          var refs = toSlice(dig(rule, "backendRefs"))
          var refTargets = toSlice(dig(definition, "refs"))
          var rank = dig_string(definition, definitionKey, "rank")
          var rejectsShare = false
          for _, refTarget := range refTargets {
            if dig(refTarget, "valid") != true && toint(dig(refTarget, "weight")) > 0 { rejectsShare = true }
          }
          if rejectsShare {
            show shared.Publish("specs", rank + "/gw-tls-reject", map[string]any{
              "backend": map[string]any{
                "name": "gw-tls-reject",
                "guid": make_guid("be", "gw-tls-reject"),
                "mode": "tcp",
                "comments": []any{"# gateway/backends-gateway-ssl-passthrough: share of invalid TLSRoute backendRefs"},
                "body": []any{"tcp-request content reject"},
              },
              "degraded": map[string]any{"active": false},
            })
          }
          for _, backendAny := range toSlice(dig(definition, "backends")) {
            for _, refTarget := range refTargets {
              if dig(refTarget, "valid") != true || toint(dig(refTarget, "weight")) <= 0 { continue }
              var refIndex = toint(dig(refTarget, "index"))
              var backendRef = refs[refIndex]
              var refName = dig_string(backendRef, "", "name")
              var refPort = toint(dig(backendRef, "port") | fallback(0))
              if refPort == 0 { refPort = 443 }
              var refNamespace = dig_string(backendRef, namespace, "namespace")
              if refNamespace == "" { refNamespace = namespace }
              var backendName = dig_string(backendAny, "", "name")
              if len(refTargets) > 1 { backendName = backendName + "_" + tostring(refIndex) }
              var servers = BackendServersResult(
                refName, 0, refPort, nil, nil, backendName, refNamespace)
              var defaultServer = []any{map[string]any{"name": "check"}}
              var body = []any{}
              // A Terminate listener hands the backend plaintext, so a BackendTLSPolicy
              // re-encrypts here; a Passthrough listener forwards the client's TLS untouched.
              if dig(backendAny, "terminate") == true {
                var btls = ResolveBackendTLS(refNamespace, refName, refPort)
                if btls["found"] == true {
                  var caPath = ""
                  if tostring(btls["caBundle"]) != "" {
                    var caFilename = tostring(btls["caFilename"])
                    files = append(files, map[string]any{
                      "type": "ca-file", "filename": caFilename, "content": tostring(btls["caBundle"]),
                    })
                    caPath = caFilename
                    if tostring(props["fileDir"]) != "" { caPath = tostring(props["fileDir"]) + "/" + caFilename }
                  } else if btls["systemCA"] == true {
                    caPath = "@system-ca"
                  }
                  if caPath == "" {
                    body = append(body, "tcp-request content reject")
                  } else {
                    var flags = []any{"ssl"}
                    if caPath != "@system-ca" { flags = append(flags, "ca-file " + caPath) }
                    flags = append(flags, "verify required")
                    if tostring(btls["hostname"]) != "" {
                      flags = append(flags, "sni str(" + tostring(btls["hostname"]) + ")")
                    }
                    if tostring(btls["verifyHost"]) != "" {
                      flags = append(flags, "verifyhost " + tostring(btls["verifyHost"]))
                    }
                    for _, kw := range FlagsToKeywordArgs(flags) { defaultServer = append(defaultServer, kw) }
                  }
                }
              }
              show shared.Publish("specs", rank + "/" + backendName, map[string]any{
                "backend": map[string]any{
                  "name": backendName,
                  "guid": make_guid("be", backendName),
                  "mode": "tcp",
                  "comments": []any{"# gateway/backends-gateway-ssl-passthrough (tlsroute)"},
                  "defaultServer": defaultServer,
                  "body": body,
                  "servers": servers["servers"],
                },
                "degraded": map[string]any{
                  "active": servers["degradedByName"],
                  "namespace": refNamespace,
                  "service": refName,
                  "portName": servers["portName"],
                },
              })
            }
          }
        }
        if len(files) > 0 {
          show shared.Publish("effects", "tls/" + namespace + "/" + routeName, map[string]any{"files": files})
        }
      %%}

  backends-501-gateway-ssl-passthrough:
    requires: [endpoints, gateways, namespaces, referencegrants, services]
    template: |
      {%- import "util-backend" for Backend -%}
      {%- import "util-replay-gateway-backend-effects" for ReplayGatewayBackendEffects -%}
      {{- render "backendtlsvalues-490-gateway" default "" -}}
      {{ render_glob "gateway-ssl-passthrough-*" }}
      {{- render_glob "backenditems-501-gateway-ssl-passthrough-*" -}}
      {{- ReplayGatewayBackendEffects("gateway-ssl-passthrough-backend-specs") -}}
      {%- var emitted = map[string]bool{} -%}
      {%- for _, publicationAny := range incremental_values("gateway-ssl-passthrough-backend-specs", "specs") %}
      {%- var publication = publicationAny.(map[string]any) -%}
      {%- var backendName = tostring(publication["backend"].(map[string]any)["name"]) -%}
      {%- if emitted[backendName] -%}{%- continue -%}{%- end -%}
      {%- emitted[backendName] = true -%}
      {%- var degraded = publication["degraded"].(map[string]any) -%}
      {%- if degraded["active"] == true -%}
        {%- var _, _ = shared.ComputeIfAbsent(
          "degradedBackendRef:" + tostring(degraded["namespace"]) + "/" +
            tostring(degraded["service"]) + "/" + tostring(degraded["portName"]),
          func() any { return true }) -%}
      {%- end %}
      {{ Backend(namespace(publication["backend"].(map[string]any))) }}
      {%- end %}
