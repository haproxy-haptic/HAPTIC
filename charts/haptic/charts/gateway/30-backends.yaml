  # Feed backend-service.map (<backend> -> <ns>/<svc>) for the namespace/service
  # log fields, so the gateway backend needs no per-backend set-var lines and its
  # section stays empty (dynamic). Mirrors the generators' backend naming + dedup.
  map-backend-service-200-gateway-http:
    requires: [gateways, httproutes, referencegrants, services]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: map-backend-service-gateway
    template: |-
      {%- import "util-backend-name-gateway-rule" for BackendNameGatewayRule -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%%
        var route = item
        var routeNs = tostring(dig(route, "metadata", "namespace") | fallback(""))
        for ruleIndex, rule := range toSlice(dig(route, "spec", "rules")) {
          for _, backendRef := range toSlice(dig(rule, "backendRefs")) {
            if BackendRefValid("HTTPRoute", routeNs, backendRef) != "true" {
              continue
            }
            var backendName = tostring(dig(backendRef, "name") | fallback(""))
            var backendPort = toint(dig(backendRef, "port"))
            if backendPort == 0 { backendPort = 80 }
            var backendNs = tostring(dig(backendRef, "namespace") | fallback(routeNs))
            if backendNs == "" { backendNs = routeNs }
            var beKey = BackendNameGatewayRule(route, rule, ruleIndex, map[string]any{"namespace": backendNs, "name": backendName, "port": backendPort})
            show shared.Unique("map-backend-service-gw", beKey, "\n" + beKey + " " + backendNs + "/" + backendName)
          }
        }
      %%}

