# Gateway API TCPRoute (L4 TCP routing)
#
# A Gateway listener with `protocol: TCP` forwards raw TCP on its port to
# the backend Service(s) referenced by a TCPRoute attached to that
# listener. Unlike TLSRoute, there is NO SNI / TLS inspection — the
# connection is a straight `default_backend` forward in `mode tcp`.
#
# Shape (one TCP listener -> one tcp frontend -> its TCPRoute's backend):
#
#   frontend gateway-tcp-port-<port>
#       mode tcp
#       bind *:<port>
#       default_backend gtw_tcp_<routeNs>_<routeName>_<ruleIdx>
#
#   backend gtw_tcp_<routeNs>_<routeName>_<ruleIdx> from haptic-be-<hash>
#       server <pod> <pod-ip>:<pod-port> ...
#
# Layout mirrors the TLSRoute passthrough path (22-ssl-passthrough.yaml +
# backends-501-gateway-ssl-passthrough + frontends-600-gateway-tls-
# listener) but without the SNI allowlist / use_backend dispatch.
#
# Attachment (which TCPRoute attaches to which TCP listener) reuses the
# same listener-attachment filters as the passthrough path: protocol
# (TCP), allowedRoutes.kinds (default TCPRoute), allowedRoutes.namespaces
# (Same / All / Selector), parentRef sectionName + port. TCP has no
# hostname, so there is no hostname-intersection step.
#
# Single- and weighted multi-backendRef routing are implemented: one
# routable backendRef forwards the whole port; several become a `balance
# roundrobin` mode-tcp backend, each Service in a disjoint slot range
# (SRV<i>_) carrying its weight (weight 0 → no traffic). When several
# TCPRoutes claim the same port, the oldest (creationTimestamp) wins.
_fx:
  endpointsEndpointsliceTcp: &endpointsEndpointsliceTcp
    - apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: tcp-backend-abc
        namespace: default
        labels:
          kubernetes.io/service-name: tcp-backend
      addressType: IPv4
      endpoints:
        - addresses: ["10.0.0.42"]
          targetRef: {kind: Pod, name: tcp-backend-pod-1}
      ports:
        - {port: 9100, protocol: TCP}
  specTcp9100: &specTcp9100
    gatewayClassName: haptic
    listeners:
      - name: tcp
        protocol: TCP
        port: 9100
        allowedRoutes:
          namespaces: {from: Same}
          kinds:
            - kind: TCPRoute
  servicesServiceTcpBackend: &servicesServiceTcpBackend
    - apiVersion: v1
      kind: Service
      metadata: {name: tcp-backend, namespace: default}
      spec:
        ports:
          - {port: 9100, targetPort: 9100}
  specGwTcpTcpBackend: &specGwTcpTcpBackend
    parentRefs:
      - name: gw-tcp
    rules:
      - backendRefs:
          - {name: tcp-backend, port: 9100}

templateSnippets:
  util-publish-gateway-tcproute-claims:
    requires: [gateways, namespaces, referencegrants, services, endpoints, tcproutes]
    template: |
      {%- import "util-resource-helpers" for ListenerName, ListenerProtocol %}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted %}
      {%- import "util-backend-servers-result" for BackendServersResult %}
      {%- import "util-resolve-backend-tls" for ResolveBackendTLS %}
      {%- import "util-backend" for FlagsToKeywordArgs %}
      {%- macro PublishGatewayTCPRouteClaims(route *resources.tcproutes.T) -%}
      {%%
        var nsStr = route.Metadata.Namespace
        var nameStr = route.Metadata.Name
        var routeTs = route.Metadata.CreationTimestamp
        var routeKey = nsStr + "/" + nameStr
        var routeRank = "1/" + routeKey
        if routeTs != "" { routeRank = "0/" + routeTs + "/" + routeKey }
        var fixed = func(value int) string {
          var encoded = tostring(value)
          var zeroes = "0000000000"
          if len(encoded) >= len(zeroes) { return encoded }
          return zeroes[:len(zeroes)-len(encoded)] + encoded
        }

        for ruleIdx, rule := range route.Spec.Rules {
              var refName = ""
              var refs = []any{}
              for _, br := range rule.BackendRefs {
                var brGroup = br.Group
                var brKind = br.Kind
                if brKind == "" { brKind = "Service" }
                if (brGroup != "" && brGroup != "core") || brKind != "Service" {
                  continue
                }
                var brNs = br.Namespace
                if brNs == "" { brNs = nsStr }
                if resources.services.GetSingle(brNs, br.Name) == nil {
                  continue
                }
                // A cross-namespace ref without a ReferenceGrant must not
                // receive traffic (status reports RefNotPermitted).
                if brNs != nsStr && ReferenceGrantPermitted("gateway.networking.k8s.io", "TCPRoute", nsStr, "", "Service", brNs, br.Name) != "true" {
                  continue
                }
                var brPort = toint(br.Port)
                if brPort == 0 { brPort = 80 }
                var brWeight = 1
                if br.Weight != nil { brWeight = toint(br.Weight) }
                refs = append(refs, map[string]any{
                  "name": br.Name, "port": brPort, "ns": brNs, "weight": brWeight,
                })
                if refName == "" {
                  refName = br.Name
                }
              }
              if refName == "" {
                continue
              }

              var backendName = "gtw_tcp_" + nsStr + "_" + nameStr + "_" + tostring(ruleIdx)
              var balance = ""
              var servers = []any{}
              var body = []any{}
              var files = []any{}
              if len(refs) > 1 { balance = "roundrobin" }
              for _, r := range refs {
                var rm = r.(map[string]any)
                var backendNamespace = tostring(rm["ns"])
                var serviceName = tostring(rm["name"])
                var servicePort = toint(rm["port"])
                var btls = ResolveBackendTLS(backendNamespace, serviceName, servicePort)
                var flags = []any{}
                if btls["found"] == true {
                  var caPath = ""
                  if tostring(btls["caBundle"]) != "" {
                    var caFilename = tostring(btls["caFilename"])
                    files = append(files, map[string]any{
                      "type": "ca-file", "filename": caFilename, "content": tostring(btls["caBundle"]),
                    })
                    caPath = caFilename
                    if tostring(props["fileDir"]) != "" { caPath = tostring(props["fileDir"]) + "/" + caFilename }
                  } else if btls["systemCA"] == true {
                    caPath = "@system-ca"
                  }
                  if caPath == "" {
                    body = []any{"tcp-request content reject"}
                    continue
                  }
                  flags = append(flags, "ssl")
                  if caPath != "@system-ca" { flags = append(flags, "ca-file " + caPath) }
                  flags = append(flags, "verify required", "sni str(" + tostring(btls["hostname"]) + ")",
                    "verifyhost " + tostring(btls["verifyHost"]))
                }
                var opts = map[string]any{}
                if len(refs) > 1 {
                  opts["namePrefix"] = serviceName + "-"
                  opts["weight"] = toint(rm["weight"])
                }
                var serverResult = BackendServersResult(serviceName, 0, servicePort,
                  opts, nil, backendName, backendNamespace)
                for _, server := range serverResult["servers"].([]any) {
                  var record = server.(map[string]any)
                  if len(flags) > 0 { record["extra"] = FlagsToKeywordArgs(flags) }
                  servers = append(servers, record)
                }
              }

              // Walk parentRefs and find every accepted TCP listener.
              for _, parentRef := range route.Spec.ParentRefs {
                var prGroup = parentRef.Group
                if prGroup == "" { prGroup = "gateway.networking.k8s.io" }
                var prKind = parentRef.Kind
                if prKind == "" { prKind = "Gateway" }
                if prGroup != "gateway.networking.k8s.io" || prKind != "Gateway" {
                  continue
                }
                var prNs = parentRef.Namespace
                if prNs == "" { prNs = nsStr }
                var prName = parentRef.Name
                var prSection = parentRef.SectionName
                var prPort = toint(parentRef.Port)

                var gw = resources.gateways.GetSingle(prNs, prName)
                // NOTE: a nested-if guard (NOT `if gw == nil { continue }`).
                // Scriggo mis-lowers a `continue` inside this deep nested-if/
                // for structure so it terminates the OUTER route loop, not
                // just this parentRef iteration (same footgun documented in
                // 20-route-analysis.yaml's conflict detection). An orphaned
                // TCPRoute whose parentRef Gateway was deleted hits the nil
                // branch; a `continue` there dropped EVERY later TCPRoute
                // from routing (TCPRouteWeightedRouting / ParentRefPortAnd-
                // SectionName / ReferenceGrant all fail once a stale route
                // co-resides). Guard with `if gw != nil { … }` instead.
                if gw != nil {
                for _, listener := range gw.Spec.Listeners {
                  var lName = ListenerName(listener)
                  var lProto = ListenerProtocol(listener)
                  var lPort = toint(listener.Port)

                  if lProto != "TCP" || lPort <= 0 {
                    continue
                  }
                  if prSection != "" && prSection != lName {
                    continue
                  }
                  if prPort != 0 && prPort != lPort {
                    continue
                  }

                  // allowedRoutes.kinds intersection: when omitted, the
                  // protocol-default kind applies (TCP -> TCPRoute).
                  var kindOk = true
                  if len(listener.AllowedRoutes.Kinds) > 0 {
                    kindOk = false
                    for _, ak := range listener.AllowedRoutes.Kinds {
                      var akG = ak.Group
                      if akG == "" { akG = "gateway.networking.k8s.io" }
                      if akG == "gateway.networking.k8s.io" && ak.Kind == "TCPRoute" {
                        kindOk = true
                        break
                      }
                    }
                  }
                  if !kindOk {
                    continue
                  }

                  // allowedRoutes.namespaces gating.
                  var nsOk = false
                  var fromMode = listener.AllowedRoutes.Namespaces.From
                  if fromMode == "" { fromMode = "Same" }
                  switch fromMode {
                  case "Same":
                    nsOk = (nsStr == prNs)
                  case "All":
                    nsOk = true
                  case "Selector":
                    var selectorMap = listener.AllowedRoutes.Namespaces.Selector.MatchLabels
                    if selectorMap != nil {
                      var nsObj = resources.namespaces.GetSingle(nsStr)
                      if nsObj != nil {
                        var allMatch = true
                        for k, v := range selectorMap {
                          var actual, ok = nsObj.Metadata.Labels[k]
                          if !ok || actual != v { allMatch = false; break }
                        }
                        nsOk = allMatch
                      }
                    }
                  }
                  if !nsOk {
                    continue
                  }

                  show shared.PublishRanked("ports", fixed(lPort),
                    routeRank + "/" + fixed(ruleIdx), map[string]any{
                      "port":        lPort,
                      "backendName": backendName,
                      "routeNs":     nsStr,
                      "routeName":   nameStr,
                      "ruleIdx":     ruleIdx,
                      "balance":     balance,
                      "servers":     servers,
                      "body":        body,
                      "files":       files,
                    })
                }
                }
              }
        }
      %%}
      {%- end macro -%}

  util-gateway-tcp-backend-bindings:
    template: |-
      {%- import "util-gateway-backend-bindings" for GatewayBackendProps -%}
      {{- toJSON(map[string]any{"tcproutes": GatewayBackendProps()}) -}}

  gateway-tcproute-claims-100-route:
    requires: [gateways, namespaces, referencegrants, services, endpoints, tcproutes]
    incremental:
      group: gateway-tcproute-claims
      bindingsTemplate: '{{- render "util-gateway-tcp-backend-bindings" -}}'
      optionalConsumes: [gateway-backend-tls-policies]
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-tcproute-claims" for PublishGatewayTCPRouteClaims -%}
      {%- var route = resources.tcproutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{{- PublishGatewayTCPRouteClaims(route) -}}{%- end -%}

  # backends-502-gateway-tcproute
  #
  # Emits one `mode tcp` backend per claimed TCP listener port. Hooks
  # into base.yaml's `render_glob "backends-*"` extension point. The
  # `502` ordinal keeps it after the ssl-passthrough TCP backends (501)
  # for stable output ordering.
  backends-502-gateway-tcproute:
    requires: [gateways, namespaces, referencegrants, services, endpoints, tcproutes]
    template: |
      {%- import "util-backend" for Backend %}
      {{ render "backendtlsvalues-490-gateway" default "" }}
      {{ render "gateway-tcproute-claims-100-route" }}
        {%- var claims = incremental_values("gateway-tcproute-claims", "ports") %}
        {#- A TCPRoute attaching to multiple listener ports (e.g. one that
            attaches to every listener on a Gateway) claims several ports
            that all resolve to the SAME (route, rule) backend name
            `gtw_tcp_<ns>_<name>_<ruleIdx>` — the name is keyed by route+rule,
            not port. Emitting the backend once per port would declare the
            same `backend` name twice, which HAProxy 3.3+ rejects as a fatal
            parse error. Emit each unique backend
            exactly once; the per-port frontends (frontends-700) all forward
            to the shared backend, which is correct — the same Service:port
            is simply reachable on multiple listener ports. -#}
        {%- var seenBackends = map[string]bool{} %}
        {%- for _, claim := range claims %}
          {%- var info = claim.(map[string]any) %}
          {%- var port = toint(info["port"]) %}
          {%- var beName = tostring(info["backendName"]) %}
          {%- if !seenBackends[beName] %}
            {%- seenBackends[beName] = true %}
            {%- for _, file := range toSlice(info["files"]) %}
              {%- var record = file.(map[string]any) %}
              {%- var _, registerErr = fileRegistry.Register(tostring(record["type"]), tostring(record["filename"]), tostring(record["content"])) %}
              {%- if registerErr != nil %}{{ fail(tostring(registerErr)) }}{%- end %}
            {%- end %}
      {{ Backend(map[string]any{
           "name": beName,
           "guid": make_guid("be", beName),
           "mode": "tcp",
           "balance": tostring(info["balance"]),
           "comments": []any{"# gateway/backends-502-gateway-tcproute: " + tostring(info["routeNs"]) + "/" +
             tostring(info["routeName"]) + " rule " + tostring(info["ruleIdx"]) + " (port " + tostring(port) + ")"},
           "servers": info["servers"].([]any),
           "body": info["body"],
         }) }}
          {%- end %}
        {%- end %}

  # frontends-700-gateway-tcp-listener
  #
  # Emits one `mode tcp` frontend per claimed TCP listener port, bound to
  # that port and forwarding straight to the route's backend. Hooks into
  # base.yaml's `render_glob "frontends-*"` extension point (same point
  # frontends-600-gateway-tls-listener uses).
  #
  # Port-collision guard: a TCP listener declared on a port the chart-
  # static HTTP / HTTPS frontends already bind (httpPort / httpsPort)
  # would produce a duplicate `bind *:<port>` and a config parse error.
  # We drop such listeners silently here (the spec surfaces the conflict
  # via the Gateway listener status; the data plane just stays
  # parseable). Ports claimed by the per-port TLS frontends
  # (frontends-600) cannot collide because a port is single-protocol in
  # a Gateway, so a TCP listener and a TLS listener never share a port.
  frontends-700-gateway-tcp-listener:
    requires: [gateways, namespaces, referencegrants, services, endpoints, tcproutes]
    template: |
      {{ render "backendtlsvalues-490-gateway" default "" }}
      {{ render "gateway-tcproute-claims-100-route" }}
        {%- var claims = incremental_values("gateway-tcproute-claims", "ports") %}
        {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
        {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
        {%- for _, claim := range claims %}
          {%- var info = claim.(map[string]any) %}
          {%- var port = toint(info["port"]) %}
          {%- if port != httpPort && port != httpsPort %}
            {%- var beName = tostring(info["backendName"]) %}

      # gateway/frontends-700-gateway-tcp-listener: port {{ port }}

      frontend gateway-tcp-port-{{ port }}
          guid fe:gateway-tcp-port-{{ port }}
          mode tcp{{ render "util-log-format-tcp" }}
          bind *:{{ port }}
          default_backend {{ beName }}
          {%- end %}
        {%- end %}

  gateway-route-attachments-400-tcp:
    requires: [gateways, namespaces, tcproutes]
    incremental:
      source: tcproutes
      group: gateway-route-attachments
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-route-attachments" for PublishGatewayRouteAttachments -%}
      {{- PublishGatewayRouteAttachments(item, "TCPRoute", false, true) -}}

  util-gateway-tcproute-status-bindings:
    template: |-
      {{- toJSON(map[string]any{"tcproutes": map[string]any{
        "controllerName": extraContext | dig_string("", "controllerName"),
      }}) -}}

  status-patches-210-gateway-tcproute:
    requires: [gateways, namespaces, referencegrants, services, tcproutes]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-tcproute-status-bindings" -}}'
      group: gateway-tcproute-status
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-tcproute-status-patches" for GenerateTCPRouteStatusPatch -%}
      {%- var route = resources.tcproutes.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if route != nil -%}{{- GenerateTCPRouteStatusPatch(route) -}}{%- end -%}

validationTests:
  test-tcproute-basic-l4-forward:
    requires: [gateways, tcproutes]
    description: "Gateway API TCPRoute (L4): a Gateway listener with protocol TCP on port 9100 has a TCPRoute attached whose single backendRef points at a Service. The chart must emit a mode-tcp frontend bound to 9100 with default_backend to a mode-tcp backend carrying the Service's endpoint as a server line."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tcp, namespace: default, generation: 1}
          spec: *specTcp9100
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: {name: tcp-app, namespace: default, generation: 1}
          spec: *specGwTcpTcpBackend
      services: *servicesServiceTcpBackend
      endpoints: *endpointsEndpointsliceTcp
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tcp-port-9100$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+bind \*:9100$'}
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^frontend gateway-tcp-port-9100$.*?^\s+mode tcp$.*?^\s+log-format "%\{\+json\}o '
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+default_backend gtw_tcp_default_tcp-app_0$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^backend gtw_tcp_default_tcp-app_0 from haptic-be-\w+$'}
      # mode tcp lives in the backend's profile (a named defaults).
      - type: contains
        target: haproxy.cfg
        pattern: '(?ms)^defaults haptic-be-\w+ from haptic-base$.*?^\s+mode tcp$'
      - {type: contains, target: haproxy.cfg, pattern: 'server tcp-backend-pod-1 10\.0\.0\.42:9100'}

  test-tcproute-oldest-route-wins-port:
    requires: [gateways, tcproutes]
    description: >
      When two TCPRoutes claim the same listener port, Gateway API conflict
      resolution binds the OLDEST (earliest creationTimestamp) route. The
      newer route is named alphabetically first (tcp-a-newer) so a naive
      List()-order first-claim would pick it; the sort must instead bind
      tcp-b-older. Mirrors the TCPRouteMultipleRoutesAttachment conformance
      test's traffic-binding assertion.
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tcp, namespace: default, generation: 1}
          spec: *specTcp9100
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata:
            name: tcp-a-newer
            namespace: default
            generation: 1
            creationTimestamp: "2026-02-01T00:00:00Z"
          spec: *specGwTcpTcpBackend
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata:
            name: tcp-b-older
            namespace: default
            generation: 1
            creationTimestamp: "2026-01-01T00:00:00Z"
          spec: *specGwTcpTcpBackend
      services: *servicesServiceTcpBackend
      endpoints: *endpointsEndpointsliceTcp
    assertions:
      - type: haproxy_valid
      # The older route is bound as the port's default_backend.
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+default_backend gtw_tcp_default_tcp-b-older_0$'
      # The newer route is NOT bound to the port.
      - {type: not_contains, target: haproxy.cfg, pattern: 'default_backend gtw_tcp_default_tcp-a-newer_0'}

  test-tcproute-weighted-routing:
    requires: [gateways, tcproutes]
    description: >
      A TCPRoute rule with multiple weighted backendRefs becomes one
      mode-tcp backend with `balance roundrobin`, each Service's pods named
      `<service>-<pod>` carrying its weight; a weight-0 backend is emitted
      with `weight 0` (no traffic). Mirrors the TCPRouteWeightedRouting
      conformance test.
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tcp, namespace: default}
          spec: *specTcp9100
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: {name: tcp-weighted, namespace: default}
          spec:
            parentRefs:
              - name: gw-tcp
            rules:
              - backendRefs:
                  - {name: tcp-v1, port: 9100, weight: 70}
                  - {name: tcp-v2, port: 9100, weight: 30}
                  - {name: tcp-v3, port: 9100, weight: 0}
      services:
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-v1, namespace: default }
          spec:
            ports: [ { port: 9100, targetPort: 9100 } ]
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-v2, namespace: default }
          spec:
            ports: [ { port: 9100, targetPort: 9100 } ]
        - apiVersion: v1
          kind: Service
          metadata: { name: tcp-v3, namespace: default }
          spec:
            ports: [ { port: 9100, targetPort: 9100 } ]
      endpoints:
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {name: tcp-v1-a, namespace: default, labels: { kubernetes.io/service-name: tcp-v1 }}
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.1"]
              targetRef: { kind: Pod, name: tcp-v1-pod }
          ports: [ { port: 9100, protocol: TCP } ]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {name: tcp-v2-a, namespace: default, labels: { kubernetes.io/service-name: tcp-v2 }}
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.2"]
              targetRef: { kind: Pod, name: tcp-v2-pod }
          ports: [ { port: 9100, protocol: TCP } ]
        - apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata: {name: tcp-v3-a, namespace: default, labels: { kubernetes.io/service-name: tcp-v3 }}
          addressType: IPv4
          endpoints:
            - addresses: ["10.0.0.3"]
              targetRef: { kind: Pod, name: tcp-v3-pod }
          ports: [ { port: 9100, protocol: TCP } ]
    assertions:
      - type: haproxy_valid
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^\s+balance roundrobin$'}
      # v1 weight 70, named <service>-<pod>
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+server tcp-v1-tcp-v1-pod 10\.0\.0\.1:9100 .*weight 70'
      # v2 weight 30
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+server tcp-v2-tcp-v2-pod 10\.0\.0\.2:9100 .*weight 30'
      # v3 weight 0 (no traffic)
      - type: contains
        target: haproxy.cfg
        pattern: '(?m)^\s+server tcp-v3-tcp-v3-pod 10\.0\.0\.3:9100 .*weight 0'

  test-tcproute-multi-listener-single-backend:
    requires: [gateways, tcproutes]
    description: "A TCPRoute with a no-sectionName parentRef attaches to EVERY TCP listener on the Gateway (here ports 9100 and 9101). Both listener ports resolve to the same (route, rule) backend name gtw_tcp_default_tcp-multi_0. The chart must emit that backend exactly ONCE (a per-port frontend each, both forwarding to the shared backend) — emitting it per-port would declare a duplicate `backend` name, which HAProxy 3.3+ rejects as a fatal parse error."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tcp-multi, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tcp1
                protocol: TCP
                port: 9100
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TCPRoute
              - name: tcp2
                protocol: TCP
                port: 9101
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TCPRoute
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: {name: tcp-multi, namespace: default, generation: 1}
          spec:
            parentRefs:
              - name: gw-tcp-multi
            rules:
              - backendRefs:
                  - {name: tcp-backend, port: 9100}
      services: *servicesServiceTcpBackend
      endpoints: *endpointsEndpointsliceTcp
    assertions:
      # haproxy -c is the decisive check: a duplicate `backend` name is a
      # fatal parse error, so this fails if the dedup regresses.
      - type: haproxy_valid
      # Both listener ports get their own frontend...
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tcp-port-9100$'}
      - {type: contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tcp-port-9101$'}
      # ...forwarding to the one shared backend.
      - type: match_count
        target: haproxy.cfg
        pattern: '(?m)^backend gtw_tcp_default_tcp-multi_0 from haptic-be-\w+$'
        expected: "1"

  test-tcproute-unattached-no-frontend:
    requires: [gateways, tcproutes]
    description: "A TCPRoute whose parentRef points at a Gateway with no matching TCP listener (wrong port) produces no tcp frontend/backend — attachment gating must hold."
    extraContext: {controllerName: "haproxy-haptic.org/controller"}
    fixtures:
      gateways:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: {name: gw-tcp-mismatch, namespace: default, generation: 1}
          spec:
            gatewayClassName: haptic
            listeners:
              - name: tcp
                protocol: TCP
                port: 9200
                allowedRoutes:
                  namespaces: {from: Same}
                  kinds:
                    - kind: TCPRoute
      tcproutes:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: TCPRoute
          metadata: {name: tcp-app-mismatch, namespace: default, generation: 1}
          spec:
            parentRefs:
              # sectionName targets a listener name that does not exist
              - {name: gw-tcp-mismatch, sectionName: nonexistent}
            rules:
              - backendRefs:
                  - {name: tcp-backend, port: 9200}
      services:
        - apiVersion: v1
          kind: Service
          metadata: {name: tcp-backend, namespace: default}
          spec:
            ports:
              - {port: 9200, targetPort: 9200}
    assertions:
      - type: haproxy_valid
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^frontend gateway-tcp-port-9200$'}
      - {type: not_contains, target: haproxy.cfg, pattern: '(?m)^backend gtw_tcp_default_tcp-app-mismatch_0$'}
