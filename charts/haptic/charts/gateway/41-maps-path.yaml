templateSnippets:
  util-publish-gateway-route-paths:
    requires: [grpcroutes, httproutes]
    template: |
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-regex-map-key" for RegexGroupProblem, RegexMapKey -%}
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- macro PublishGatewayRoutePaths(route any, routeKind string) -%}
      {%%
        var namespace = dig_string(route, "", "metadata", "namespace")
        var name = dig_string(route, "", "metadata", "name")
        var routeKey = routeKind + "/" + namespace + "/" + name
        var routeIndex, foundRoute = shared.Select("gateway-route-analysis", "routes", routeKey)
        if !foundRoute {
          return
        }
        for _, entryIDAny := range toSlice(dig(routeIndex, "entries")) {
          var entryID = tostring(entryIDAny)
          var entry, foundEntry = shared.Select("gateway-route-analysis", "entries", entryID)
          if !foundEntry || tostring(dig(entry, "rawRepresentative") | fallback(false)) != "true" {
            continue
          }
          var pathType = dig_string(entry, "PathPrefix", "pathType")
          var pathValue = dig_string(entry, "/", "pathValue")
          var hostname = dig_string(entry, "", "hostname")
          var groupKind = dig_string(entry, "HTTPRoute", "groupKind")
          var groupNamespace = dig_string(entry, "", "groupRouteNamespace")
          var groupName = dig_string(entry, "", "groupRouteName")
          var groupRoute any = nil
          if groupKind == "GRPCRoute" {
            groupRoute = resources.grpcroutes.GetSingle(groupNamespace, groupName)
          } else {
            groupRoute = resources.httproutes.GetSingle(groupNamespace, groupName)
          }
          if groupRoute == nil {
            continue
          }
          if regex_search(pathValue, "[[:cntrl:]]") || strings_contains(pathValue, " ") {
            show WebhookRejectOrWarn(groupRoute, "InvalidPath", WebhookOutcomeMessage(
              "Route path '" + pathValue + "' (host '" + hostname + "') contains whitespace or control characters, which cannot be written to the routing map",
              "the route is rejected", "the route is not applied", "Remove spaces, tabs and newlines from the HTTPRoute path value."))
            continue
          }
          if pathType == "RegularExpression" {
            var problem = RegexGroupProblem(pathValue)
            if problem != "" {
              show WebhookRejectOrWarn(groupRoute, "InvalidPath", WebhookOutcomeMessage(
                "Route regex path '" + pathValue + "' (host '" + hostname + "') " + problem,
                "the route is rejected", "the route is not applied", "Rewrite it so its groups and [ ] classes close within it, without \\Q, \\E, \\c or (*."))
              continue
            }
          }
          var routeTypeShort = "http"
          if groupKind == "GRPCRoute" { routeTypeShort = "grpc" }
          var line = func(suffix string) string {
            var emittedPath = pathValue
            var pathSuffix = suffix
            if suffix == "/" && hasSuffix(emittedPath, "/") { pathSuffix = "" }
            if suffix == "" && pathType != "RegularExpression" && len(emittedPath) > 1 && hasSuffix(emittedPath, "/") {
              emittedPath = emittedPath[:len(emittedPath)-1]
            }
            var key = MapKeyForHost(hostname) + emittedPath + pathSuffix
            if pathType == "RegularExpression" { key = RegexMapKey(MapKeyForHost(hostname), emittedPath, "") }
            return "\n\n" + key +
              " GW_ROUTE_ID:" + routeTypeShort + ":" + dig_string(entry, "", "conflictGroup")
          }
          var rank = dig_string(entry, "", "groupRank")
          var pathKey = dig_string(entry, "", "pathKey")
          if pathType == "Exact" {
            show shared.PublishRanked("exact", pathKey, rank, line(""))
          } else if pathType == "PathPrefix" {
            if pathValue != "/" {
              show shared.PublishRanked("pfxexact", pathKey, rank, line(""))
            }
            show shared.PublishRanked("prefix", pathKey, rank, line("/"))
          } else if pathType == "RegularExpression" {
            show shared.PublishRanked("regex", pathKey, rank, line(""))
          }
        }
      %%}
      {%- end macro -%}

  gateway-route-paths-100-http:
    requires: [grpcroutes, httproutes]
    incremental:
      source: httproutes
      root: gateway-http-route-post-analysis
      group: gateway-route-paths
      consumes: [gateway-route-analysis]
      effects: [publishValue, recordEvent]
    template: |
      {%- import "util-publish-gateway-route-paths" for PublishGatewayRoutePaths -%}
      {{- PublishGatewayRoutePaths(item, "HTTPRoute") -}}

  gateway-route-paths-200-grpc:
    requires: [grpcroutes, httproutes]
    incremental:
      source: grpcroutes
      group: gateway-route-paths
      consumes: [gateway-route-analysis]
      effects: [publishValue, recordEvent]
    template: |
      {%- import "util-publish-gateway-route-paths" for PublishGatewayRoutePaths -%}
      {{- PublishGatewayRoutePaths(item, "GRPCRoute") -}}

  util-gateway-route-path-publications:
    requires: [gateways, grpcroutes, httproutes]
    template: |-
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "map-hostvalues-490-gateway-port-scopes" -}}
      {{- render "gateway-route-candidates-100-http" -}}
      {{- render "gateway-route-candidates-200-grpc" -}}
      {{- render "gateway-route-analysis-100-http" -}}
      {{- render "gateway-route-analysis-200-grpc" -}}
      {{- render "gateway-route-paths-100-http" -}}
      {{- render "gateway-route-paths-200-grpc" -}}

  util-path-map-entry-gateway:
    template: |
      {%- macro GeneratePathMapEntries(pathType string, cell string) %}
      # gateway/util-path-map-entry-gateway ({{ pathType }})

      {{ incremental_ranked_fragments("gateway-route-paths", cell) }}
      {%- end macro %}

  map-path-exact-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-exact-gateway
      {{ render "util-gateway-route-path-publications" }}{{ "\n" -}}
      {{ GeneratePathMapEntries("Exact", "exact") }}{{ "\n" }}

  map-pfxexact-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate prefix-exact path map entries for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-pfxexact-gateway
      {{ render "util-gateway-route-path-publications" }}{{ "\n" -}}
      {{ GeneratePathMapEntries("PathPrefix", "pfxexact") }}{{ "\n" }}

  map-path-prefix-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate prefix path map entries with trailing slash for HTTPRoute #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-prefix-gateway
      {{ render "util-gateway-route-path-publications" }}{{ "\n" -}}
      {{ GeneratePathMapEntries("PathPrefix", "prefix") }}{{ "\n" }}

  map-path-regex-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {# Generate regex path map entries for HTTPRoute with RegularExpression type.
         Emits the same GW_ROUTE_ID qualifier as the exact and prefix maps: pointing
         straight at a backend left txn.gw_rule_id unset, so a regex route got no
         filters, no timeouts and no resource fields in the access log. #}
      {%- import "util-path-map-entry-gateway" for GeneratePathMapEntries %}
      # gateway/map-path-regex-gateway
      {{ render "util-gateway-route-path-publications" }}{{ "\n" -}}
      {{ GeneratePathMapEntries("RegularExpression", "regex") }}{{ "\n" }}
