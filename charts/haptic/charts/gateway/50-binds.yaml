templateSnippets:
  # ----------------------------------------------------------------------------
  # util-gateway-extra-port-binds
  #
  # Walks Gateway-owned + admitted-ListenerSet listeners and emits one
  # `bind *:<port><sslOptionsSuffix>` line per unique listener port
  # matching the protocol filter. Drives both http-bind-extra-050 and
  # https-bind-extra-050: each calls in with its own protocol +
  # ssl-options suffix and a `seen[]` set seeded with the chart-static
  # ports it should NOT redirect (so non-default HTTP listeners on
  # port 80 fall through to the chart-static bind, and non-default
  # HTTPS listeners on port 443 / port 80 don't double-render).
  #
  # ListenerSet admission comes from gateway-host-listenersets.
  # ----------------------------------------------------------------------------
  # Listener ports per protocol, published per Gateway (own listeners first, then
  # admitted ListenerSets by rank) so the winner per port is the oldest claim and
  # an unrelated change replays the cached claims (#226).
  gateway-listener-ports-100-gateway:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-listener-ports
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var gatewayKey = namespace + "/" + name
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          var claim = func(protocol string, port int, rank string) {
            if protocol == "" { protocol = "HTTP" }
            if port > 0 {
              _ = shared.PublishRanked(protocol, tostring(port), rank, port)
            }
          }
          for listenerIndex, listener := range gateway.Spec.Listeners {
            claim(listener.Protocol, toint(listener.Port), gatewayKey + "\x000\x00" + fixed(listenerIndex))
          }
          var listenerSets = shared.SelectValues("gateway-host-listenersets",
            "gateway\x00" + namespace + "\x00" + name)
          listenerSets = listenerSets | sort_by([]string{"$.rank"})
          for _, listenerSet := range listenerSets {
            if tostring(dig(listenerSet, "accepted") | fallback(false)) != "true" { continue }
            for _, listener := range toSlice(dig(listenerSet, "candidates")) {
              claim(dig_string(listener, "", "protocol"), toint(dig(listener, "port") | fallback(0)),
                gatewayKey + "\x001\x00" + dig_string(listenerSet, "", "rank") + "\x00" +
                fixed(toint(dig(listener, "index") | fallback(0))))
            }
          }
        }
      %%}

  util-gateway-extra-port-binds:
    requires: [gateways, referencegrants]
    template: |
      {%- import "util-http3-bind" for HTTP3Bind %}
      {%- macro ExtraPortBinds(protocol string, sslOptionsSuffix string, seenInitial []int) %}
        {%- var seen = map[int]bool{} %}
        {%- for _, p := range seenInitial %}
          {%- seen[p] = true %}
        {%- end %}
        {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
        {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
        {{- render "gateway-listener-ports-100-gateway" -}}
        {%- for _, claimed := range incremental_values("gateway-listener-ports", protocol) %}
          {%- var port = toint(claimed) %}
          {%- if port > 0 && !seen[port] %}
            {%- seen[port] = true %}
      bind *:{{ port }}{{ sslOptionsSuffix }}
            {%- var quicBind = "" %}
            {%- if protocol == "HTTPS" %}
              {%- quicBind = HTTP3Bind(port, "certificate-list.txt", "") %}
            {%- end %}
            {%- if quicBind != "" %}
      {{ quicBind }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}

  http-bind-extra-050-gateway-multi-port-bind:
    requires: [gateways, referencegrants]
    template: |
      {# Non-default HTTP ports declared by Gateway listeners or admitted
          ListenerSets land on the http_frontend via this snippet. We seed
          `seen` with httpPort (the chart-static HTTP bind, default 80) and
          httpsPort (a Gateway HTTP listener on the chart-static HTTPS port
          would collide with the sibling frontend's bind, so skip — the
          spec surfaces the conflict as Accepted=False, we just keep the
          data plane parseable). See util-gateway-extra-port-binds for the
          walk. #}
      {%- import "util-gateway-extra-port-binds" for ExtraPortBinds %}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      {{ ExtraPortBinds("HTTP", "", []int{httpPort, httpsPort}) }}

  # gateway/https-bind-extra-050-gateway-multi-port-bind:
  # Sibling to http-bind-extra-050-gateway-multi-port-bind. Hooks into the
  # HTTPS-frontend-only `https-bind-extra-*` extension point (added to
  # ssl.yaml's `frontends-500-https`) so the binds don't double-render
  # into the http_frontend (where they'd conflict with the chart-static
  # HTTP bind on the same port). The `util-ssl-bind-options` suffix emits
  # the same crt-list / ALPN options chart-static HTTPS uses, so a
  # non-default Gateway HTTPS listener gets the same TLS handshake
  # behaviour without re-deriving the option set.
  https-bind-extra-050-gateway-multi-port-bind:
    requires: [gateways, referencegrants]
    template: |
      {%- import "util-gateway-extra-port-binds" for ExtraPortBinds %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var sslSuffix = render "util-ssl-bind-options" %}
      {{ ExtraPortBinds("HTTPS", tostring(sslSuffix), []int{httpsPort, httpPort}) }}
  # gateway/frontend-extra-100-gateway-misdirected:
  # Implements HTTPS listener-isolation 421 detection per the
  # HTTPRouteHTTPSListenerDetectMisdirectedRequests conformance test.
  #
  # The naive "SNI != Host → 421" check is wrong: it returns 421 when
  # SNI=example.org and Host=unknown-example.org (no listener claims
  # `unknown-example.org`, so the request just routes through the
  # catch-all listener and 404s on the path lookup).
  #
  # The spec-correct rule is: a request is misdirected only when its
  # Host belongs to a *different* HTTPS listener than the one selected
  # by SNI. To express that we materialise two maps from the chart's
  # known HTTPS listeners (one per Gateway, the chart loops them
  # below):
  #   - listener-hostname-claim.map: exact hostname → itself
  #   - listener-hostname-claim-regex.map: regex (matching the wildcard
  #       expansion of `*.example.com` etc.) → the wildcard pattern
  #
  # A single terminating listener binds directly; mixed or multiple terminating
  # listeners use private TLS leaves to keep bind-wide policies isolated.
  frontends-600-gateway-tls-listener:
    requires: [gateways, namespaces, referencegrants, secrets, services]
    template: |
      {%- import "util-ssl-passthrough-backends" for SSLPassthroughBackends -%}
      {%- import "util-gateway-tls-dispatch-frontend" for TLSDispatchFrontend, TLSListenerBindOptions, TLSRouteLines -%}
      {%- import "util-backend" for Backend -%}
      {%- var byPortRaw = shared.Get("gatewayTLSListenersByPort") %}
      {%- if byPortRaw == nil %}
        {#- No TLS Gateway listeners declared — emit nothing. -#}
      {%- else %}
        {{- render_glob "gateway-ssl-passthrough-*" -}}
        {{- render "gateway-terminating-listeners-100-gateway" -}}
        {%- var certificates = map[string]any{} %}
        {%- for _, certificate := range incremental_values("gateway-terminating-listeners", "listeners") %}
          {%- var key = dig_string(certificate, "", "gatewayNamespace") + "/" +
            dig_string(certificate, "", "gatewayName") + "/" + dig_string(certificate, "", "listenerName") %}
          {%- certificates[key] = certificate %}
        {%- end %}
        {%- var byPort = byPortRaw.(map[int]any) %}
        {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
        {%- var allBackends = incremental_values("gateway-ssl-passthrough", "backends") | sort_by([]string{"$.rank"}) %}
        {#- Determine whether the chart-static HTTPS frontend or ssl-tcp
            will bind the chart-static httpsPort. The two flags
            (bindHTTPSDefault + len(passthroughBackends)>0) cover both
            cases: bindHTTPSDefault gates the chart-static `bind *:httpsPort`
            in mode-http; the ssl-tcp frontend renders only when
            bindHTTPSDefault AND there's at least one passthrough
            backend. If both are absent, the port is free for the new
            TLS frontend to claim — which is what the upstream
            TLSRouteTerminateSimpleSameNamespace fixture needs (a
            Gateway with a TLS-Terminate listener on httpsPort and
            nothing else competing for that port). -#}
        {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
        {%- var bindHTTPSDefault = tostring(dig(gf, "bindHTTPSDefault")) == "true" %}
        {%- var hasPassthroughBackends = len(SSLPassthroughBackends()) > 0 %}
        {%- var chartStaticBindsHTTPSPort = bindHTTPSDefault || hasPassthroughBackends %}
        {#- Sort port keys numerically for deterministic output. Bare
            sort_strings would give "10" before "2"; sort_ints is the
            right tool because byPort is keyed by port number. -#}
        {%- var portKeysRaw = []any{} %}
        {%- for k, _ := range byPort %}
          {%- portKeysRaw = append(portKeysRaw, k) %}
        {%- end %}
        {%- var portKeys = sort_ints(portKeysRaw) %}
        {%- for _, port := range portKeys %}
          {#- The allocated Gateway pod port remains active when a chart-static frontend owns the source port. -#}
          {%- if port != httpsPort || !chartStaticBindsHTTPSPort %}
            {%- var portEntry = byPort[port].(map[string]any) %}
            {%- var portMode = tostring(portEntry["mode"]) %}
            {%- if len(toSlice(portEntry["listeners"])) > 1 %}
              {{ TLSDispatchFrontend(port, portEntry, allBackends) }}
              {%- continue %}
            {%- end %}
            {%- var servable = false %}
            {%- for _, listener := range toSlice(portEntry["listeners"]) %}
              {%- if dig(listener, "servable") == true %}{%- servable = true %}{%- end %}
            {%- end %}
            {%- if !servable %}{%- continue %}{%- end %}
            {%- var certificate any %}
            {%- if portMode == "Terminate" %}
              {%- var listener = toSlice(portEntry["listeners"])[0] %}
              {%- certificate = certificates[dig_string(listener, "", "gwNs") + "/" +
                dig_string(listener, "", "gwName") + "/" + dig_string(listener, "", "name")] %}
              {%- if certificate == nil %}{%- continue %}{%- end %}
            {%- end %}
            {%- var sourcePort = toint(portEntry["sourcePort"]) %}
            {%- var gatewayName = tostring(portEntry["gatewayName"]) %}
            {%- var gatewayNamespace = tostring(portEntry["gatewayNamespace"]) %}
            {%- var portRoutes = []any{} %}
            {%- var validRoutes = 0 %}
            {%- var rejectBackend = "gateway-tls-unmatched-" + tostring(port) %}
            {%- for _, beAny := range allBackends %}
              {%- var be = beAny.(map[string]any) %}
              {%- var matchesGateway = gatewayName == "" ||
                (tostring(be["gw_name"]) == gatewayName && tostring(be["gw_namespace"]) == gatewayNamespace) %}
              {%- if toint(be["port"] | fallback(0)) == sourcePort && matchesGateway %}
                {%- portRoutes = append(portRoutes, be) %}
                {%- if dig(be, "invalid") != true %}
                  {%- validRoutes++ %}
                {%- end %}
              {%- end %}
            {%- end %}

      # gateway/frontends-600-gateway-tls-listener: port {{ port }} ({{ portMode }})

      frontend gateway-tls-port-{{ port }}
          guid fe:gateway-tls-port-{{ port }}
          mode tcp{{ render "util-log-format-tcp" }}
            {%- if portMode == "Terminate" %}
          bind *:{{ port }}{{ TLSListenerBindOptions(certificate) }}
            {%- else %}
          bind *:{{ port }}
          # Read SNI from the unbuffered TCP stream without terminating.
          tcp-request inspect-delay 5s
            {%- end %}

            {%- if validRoutes == 0 %}
          tcp-request content reject
            {%- else %}
              {%- var fetch = "req_ssl_sni,lower" %}
              {%- if portMode == "Terminate" %}{%- fetch = "ssl_fc_sni,lower" %}{%- end %}
                {%- for _, route := range portRoutes %}
                  {%- if dig(route, "invalid") == true %}{%- continue %}{%- end %}
                  {%- var sni = dig_string(route, "", "sni") %}
                  {%- if hasPrefix(sni, "*.") %}
          acl allowed_sni {{ fetch }} -m end {{ sni[1:] }}
                  {%- else %}
          acl allowed_sni {{ fetch }} -m str {{ sni }}
                  {%- end %}
                {%- end %}
          tcp-request content reject if !allowed_sni
              {%- if portMode != "Terminate" %}
          tcp-request content accept if { req_ssl_hello_type 1 }
              {%- end %}
              {%- for _, route := range portRoutes %}
                {%- for _, line := range TLSRouteLines(route, fetch, rejectBackend) %}
          {{ line }}
                {%- end %}
              {%- end %}
          default_backend {{ rejectBackend }}
      {{ Backend(map[string]any{
        "name": rejectBackend, "guid": "be:" + rejectBackend, "mode": "tcp",
        "body": []any{"tcp-request content reject"},
      }) }}
            {%- end %}
          {%- end %}
        {%- end %}
      {%- end %}
