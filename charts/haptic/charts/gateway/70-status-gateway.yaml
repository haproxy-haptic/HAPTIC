templateSnippets:
  util-gateway-status-bindings:
    template: |-
      {%%
        var bindings = map[string]any{}
        var enabled = extraContext | dig("statusPatches", "enabled") | fallback(true)
        if tostring(enabled) == "true" {
          bindings["gateways"] = map[string]any{
            "controllerNamespace": tostring(extraContext | dig("controllerNamespace") | fallback("")),
            "haproxyPodSelector": extraContext | dig("haproxyPodSelector"),
            "http3": tostring(extraContext | dig("http3", "enabled") | fallback(true)) == "true",
          }
        }
      %%}
      {{- toJSON(bindings) -}}

  gateway-status-addresses-100-controller-service:
    requires: [controller_services, gateways]
    incremental:
      source: controller_services
      group: gateway-status-addresses
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var service = resources.controller_services.GetSingle(namespace, name)
        if service != nil {
          for _, address := range service.Status.LoadBalancer.Ingress {
            if address.Ip == "" && address.Hostname == "" { continue }
            var value = map[string]any{}
            if address.Ip != "" { value["ip"] = address.Ip }
            if address.Hostname != "" { value["hostname"] = address.Hostname }
            show shared.Publish("loadbalancer", address.Ip + "/" + address.Hostname, value)
          }
          for _, ip := range service.Spec.ClusterIPs {
            if ip != "" && ip != "None" {
              show shared.Publish("cluster", ip, map[string]any{"ip": ip})
            }
          }
        }
      %%}

  util-publish-gateway-route-attachments:
    requires: [gateways, namespaces]
    template: |-
      {%- import "util-hostname-intersect-gateway" for HostnamesIntersect -%}
      {%- macro PublishGatewayRouteAttachments(route any, routeKind string,
        needsTLSProtocol bool, needsTCPProtocol bool) -%}
      {%%
        var routeNamespace = dig_string(route, "", "metadata", "namespace")
        var routeName = dig_string(route, "", "metadata", "name")
        var routeHostnames = toSlice(dig(route, "spec", "hostnames"))
        var fixed = func(value int) string {
          var encoded = tostring(value)
          var zeroes = "0000000000"
          if len(encoded) >= len(zeroes) { return encoded }
          return zeroes[:len(zeroes)-len(encoded)] + encoded
        }
        for parentIndex, parentRef := range toSlice(dig(route, "spec", "parentRefs")) {
          var parentGroup = dig_string(parentRef, "gateway.networking.k8s.io", "group")
          if parentGroup == "" { parentGroup = "gateway.networking.k8s.io" }
          var parentKind = dig_string(parentRef, "Gateway", "kind")
          if parentKind == "" { parentKind = "Gateway" }
          if parentGroup != "gateway.networking.k8s.io" {
            continue
          }
          var parentNamespace = dig_string(parentRef, routeNamespace, "namespace")
          if parentNamespace == "" { parentNamespace = routeNamespace }
          var parentName = dig_string(parentRef, "", "name")
          var key = routeKind + "/" + routeNamespace + "/" + routeName + "/" + fixed(parentIndex)
          var sectionName = dig_string(parentRef, "", "sectionName")
          var parentPort = toint(dig(parentRef, "port") | fallback(0))
          if parentKind == "Gateway" {
            var gateway = resources.gateways.GetSingle(parentNamespace, parentName)
            if gateway == nil { continue }
            for _, listener := range gateway.Spec.Listeners {
              if sectionName != "" && listener.Name != sectionName { continue }
              var listenerPort = toint(listener.Port)
              if parentPort != 0 && listenerPort != parentPort { continue }
              var listenerProtocol = listener.Protocol
              if listenerProtocol == "" { listenerProtocol = "HTTP" }
              if needsTLSProtocol && listenerProtocol != "TLS" { continue }
              if needsTCPProtocol && listenerProtocol != "TCP" { continue }
              if len(listener.AllowedRoutes.Kinds) > 0 {
                var kindAllowed = false
                for _, allowedKind := range listener.AllowedRoutes.Kinds {
                  var allowedGroup = allowedKind.Group
                  if allowedGroup == "" { allowedGroup = "gateway.networking.k8s.io" }
                  if allowedGroup == "gateway.networking.k8s.io" && allowedKind.Kind == routeKind {
                    kindAllowed = true
                    break
                  }
                }
                if !kindAllowed { continue }
              }
              var namespaceMode = listener.AllowedRoutes.Namespaces.From
              if namespaceMode == "" { namespaceMode = "Same" }
              var namespaceAllowed = false
              switch namespaceMode {
              case "Same":
                namespaceAllowed = routeNamespace == parentNamespace
              case "All":
                namespaceAllowed = true
              case "Selector":
                var matchLabels = listener.AllowedRoutes.Namespaces.Selector.MatchLabels
                if len(matchLabels) > 0 {
                  var namespace = resources.namespaces.GetSingle(routeNamespace)
                  if namespace != nil {
                    namespaceAllowed = true
                    for label, expected := range matchLabels {
                      var actual, found = namespace.Metadata.Labels[label]
                      if !found || actual != expected {
                        namespaceAllowed = false
                        break
                      }
                    }
                  }
                }
              }
              if !namespaceAllowed || HostnamesIntersect(listener.Hostname, routeHostnames) != "true" {
                continue
              }
              show shared.Publish("gateway-listener\x00" + parentNamespace + "\x00" +
                parentName + "\x00" + listener.Name, key, true)
            }
          } else if parentKind == "ListenerSet" &&
            (routeKind == "HTTPRoute" || routeKind == "GRPCRoute") {
            var listenerSet, found = shared.Select(
              "gateway-host-listenersets", "listenersets", parentNamespace + "/" + parentName)
            if !found { continue }
            for _, listener := range toSlice(dig(listenerSet, "candidates")) {
              var listenerName = dig_string(listener, "", "name")
              if sectionName != "" && listenerName != sectionName { continue }
              var namespaces = dig(listener, "allowedRoutes", "namespaces")
              var namespaceMode = dig_string(namespaces, "Same", "from")
              if namespaceMode == "" { namespaceMode = "Same" }
              var namespaceAllowed = false
              switch namespaceMode {
              case "Same":
                namespaceAllowed = routeNamespace == parentNamespace
              case "All":
                namespaceAllowed = true
              case "Selector":
                var selector = dig(namespaces, "selector")
                if selector != nil {
                  var namespace = resources.namespaces.GetSingle(routeNamespace)
                  if namespace != nil {
                    namespaceAllowed = true
                    for label, expected := range to_str_map(dig(selector, "matchLabels")) {
                      var actual, hasLabel = namespace.Metadata.Labels[label]
                      if !hasLabel || actual != expected {
                        namespaceAllowed = false
                        break
                      }
                    }
                  }
                }
              }
              if !namespaceAllowed { continue }
              show shared.Publish("listenerset-listener\x00" + parentNamespace + "\x00" +
                parentName + "\x00" + listenerName, key, true)
            }
          }
        }
      %%}
      {%- end macro -%}

  gateway-route-attachments-100-http:
    requires: [gateways, httproutes, namespaces]
    incremental:
      source: httproutes
      root: gateway-http-route-pre-analysis
      group: gateway-route-attachments
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-route-attachments" for PublishGatewayRouteAttachments -%}
      {{- PublishGatewayRouteAttachments(item, "HTTPRoute", false, false) -}}

  gateway-route-attachments-200-grpc:
    requires: [gateways, grpcroutes, namespaces]
    incremental:
      source: grpcroutes
      group: gateway-route-attachments
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |-
      {%- import "util-publish-gateway-route-attachments" for PublishGatewayRouteAttachments -%}
      {{- PublishGatewayRouteAttachments(item, "GRPCRoute", false, false) -}}

  gateway-listenerset-schema-100:
    requires: [gateways, listenersets]
    incremental:
      source: gateways
      group: gateway-listenerset-schema
      effects: [publishValue]
    template: |-
      {{- shared.Publish("available", dig_string(item, "", "metadata", "namespace") + "/" +
        dig_string(item, "", "metadata", "name"), true) -}}

  gateway-service-resources-100-gateway-status:
    requires: [gateways]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-status-bindings" -}}'
      group: gateway-service-resources
      consumes: [gateway-host-port-scopes]
      effects: [publishValue]
    template: |-
      {%- import "util-bounded-k8s-name" for BoundedK8sName -%}
      {%- import "util-bounded-name" for BoundedName -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var labels = map[string]any{
            "gateway.networking.k8s.io/gateway-name": BoundedName(name, 63),
            "gateway.networking.k8s.io/gateway-namespace": namespace,
          }
          var annotations = map[string]any{}
          var infrastructureLabels = to_str_map(dig(gateway, "spec", "infrastructure", "labels"))
          var infrastructureAnnotations = to_str_map(dig(gateway, "spec", "infrastructure", "annotations"))
          for key, value := range infrastructureLabels {
            if key != "gateway.networking.k8s.io/gateway-name" &&
              key != "gateway.networking.k8s.io/gateway-namespace" {
              labels[key] = value
            }
          }
          for key, value := range infrastructureAnnotations { annotations[key] = value }

          var controllerNamespace = dig_string(props, "", "controllerNamespace")
          var podSelector = dig(props, "haproxyPodSelector")
          if len(gateway.Spec.Addresses) > 0 && controllerNamespace != "" && podSelector != nil {
            var ports = []any{}
            var seenPorts = map[int]bool{}
            for _, listener := range gateway.Spec.Listeners {
              var port = toint(listener.Port)
              if port <= 0 || seenPorts[port] { continue }
              seenPorts[port] = true
              var targetPort = port
              if listener.Protocol == "HTTP" || listener.Protocol == "HTTPS" || listener.Protocol == "TLS" {
                var selectedPort, found = shared.Select("gateway-host-port-scopes", "ports",
                  namespace + "/" + name + ":" + tostring(port))
                if !found {
                  fail("Gateway " + namespace + "/" + name + " listener " + listener.Name +
                    " has no isolated pod port. Traffic cannot be routed. Check perGatewayPodPortRange.")
                }
                targetPort = toint(selectedPort)
              }
              ports = append(ports, map[string]any{
                "name": "p" + tostring(port), "port": port, "targetPort": targetPort, "protocol": "TCP",
              })
              if listener.Protocol == "HTTPS" && tostring(dig(props, "http3")) == "true" {
                ports = append(ports, map[string]any{
                  "name": "q" + tostring(port), "port": port, "targetPort": targetPort, "protocol": "UDP",
                })
              }
            }
            if len(ports) > 0 {
              for _, address := range gateway.Spec.Addresses {
                var addressType = address.Type
                if addressType == "" { addressType = "IPAddress" }
                if addressType != "IPAddress" || address.Value == "" { continue }
                var serviceName = BoundedK8sName("gw", namespace, name, replace(address.Value, ".", "-"))
                var serviceAnnotations = map[string]any{}
                for key, value := range annotations { serviceAnnotations[key] = value }
                serviceAnnotations["metallb.universe.tf/loadBalancerIPs"] = address.Value
                var resource = map[string]any{
                  "apiVersion": "v1", "kind": "Service",
                  "metadata": map[string]any{
                    "name": serviceName, "namespace": controllerNamespace,
                    "labels": labels, "annotations": serviceAnnotations,
                  },
                  "spec": map[string]any{
                    "type": "LoadBalancer", "selector": podSelector, "ports": ports,
                  },
                }
                var rendered = marshalYAML(resource)
                var resourceKey = controllerNamespace + "/" + serviceName
                show shared.PublishRanked("static-addresses", resourceKey, resourceKey, rendered)
              }
            }
          }

          if len(infrastructureLabels) > 0 || len(infrastructureAnnotations) > 0 {
            var serviceName = BoundedK8sName("gw", namespace, name, "")
            var resource = map[string]any{
              "apiVersion": "v1", "kind": "Service",
              "metadata": map[string]any{
                "name": serviceName, "namespace": namespace,
                "labels": labels, "annotations": annotations,
              },
              "spec": map[string]any{
                "type": "ClusterIP", "clusterIP": "None",
                "ports": []any{map[string]any{"name": "marker", "port": 1, "protocol": "TCP"}},
              },
            }
            var rendered = marshalYAML(resource)
            var resourceKey = namespace + "/" + serviceName
            show shared.PublishRanked("infrastructure", resourceKey, resourceKey, rendered)
          }
        }
      %%}

  util-generate-gateway-status-patches:
    requires: [configmaps, gateways, namespaces, referencegrants, secrets, services]
    template: |
      {#
        Generate Gateway Status Patches

        For each Gateway, registers a status patch with:
          - deployed: Accepted + Programmed conditions, addresses, listener status
          - deployFailed: Accepted + Programmed(False) conditions, empty addresses

        Parameters:
          gateways: Slice of Gateway resources to process

        Thread-safe: Yes (statusPatch uses StatusPatchCollector with mutex)
      #}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- import "util-condition-transition-time" for TopLevelTransitionTime, ListenerTransitionTime -%}
      {%- import "util-bounded-k8s-name" for BoundedK8sName -%}
      {% macro GenerateGatewayStatusPatch(gateway *resources.gateways.T) %}
        {%- var rawAddresses = shared.SelectValues("gateway-status-addresses", "loadbalancer") %}
        {%- if len(rawAddresses) == 0 -%}
          {%- rawAddresses = shared.SelectValues("gateway-status-addresses", "cluster") -%}
        {%- end -%}
        {%- var gatewayAddresses = []any{} %}
        {%- for _, address := range rawAddresses %}
          {%%
            var ip = dig(address, "ip")
            var hostname = dig(address, "hostname")
            if ip != nil {
              gatewayAddresses = append(gatewayAddresses, map[string]any{
                "type": "IPAddress",
                "value": tostring(ip),
              })
            } else if hostname != nil {
              gatewayAddresses = append(gatewayAddresses, map[string]any{
                "type": "Hostname",
                "value": tostring(hostname),
              })
            }
          %%}
        {%- end %}

          {%%
            var nsStr = gateway.Metadata.Namespace
            var nameStr = gateway.Metadata.Name
            var generation = gateway.Metadata.Generation
            var frontendMTLSResolution, _ = shared.Select("gateway-frontend-mtls", "resolutions", nsStr + "/" + nameStr)


            // Static-addresses handling (per Gateway).
            //
            // SupportGatewayStaticAddresses lets users pin a Gateway to a
            // specific IP via spec.addresses[]. Per the universal pattern
            // every other Gateway API implementation follows (envoy-gateway,
            // cilium, istio, NGF), we provision a per-Gateway LoadBalancer
            // Service in the controller's own namespace with
            // spec.loadBalancerIP set from the Gateway's spec.addresses[].value.
            // MetalLB / cloud LB-IPAM does the actual binding; the shared
            // HAProxy serves the traffic via the Service's selector.
            //
            // We never bind HAProxy itself to specific IPs — that would
            // require per-Gateway HAProxy instances, a different product
            // architecture. Instead we let MetalLB issue the user-requested
            // IP to a per-Gateway Service that points to the same shared
            // HAProxy pods.
            //
            // Gateway API status conditions per spec:
            //   Accepted=False/UnsupportedAddress when spec.addresses
            //     contains a type the implementation doesn't support
            //     (anything other than IPAddress / Hostname / NamedAddress).
            //   Programmed=False/AddressNotUsable when spec.addresses are
            //     all of supported types but at least one isn't realized
            //     by the LB (e.g. MetalLB hasn't allocated yet, or the
            //     requested IP is outside any IPAddressPool).
            //   status.addresses contains only those spec.addresses that
            //     are supported AND realized by the LB. Empty when none
            //     are realized; full LB-discovered set when spec.addresses
            //     is unset (no per-Gateway pinning).
            var gwSpecAddrs = gateway.Spec.Addresses
            var gwAcceptedStatus = "True"
            var gwAcceptedReason = "Accepted"
            var gwAcceptedMessage = "Gateway accepted"
            // spec.infrastructure.parametersRef: HAPTIC implements no
            // implementation-specific infrastructure parameters, so ANY
            // parametersRef references an unsupported resource →
            // Accepted=False/InvalidParameters (GatewayInvalidParametersRef).
            // The address checks below may further refine to
            // UnsupportedAddress/AddressNotUsable if spec.addresses is also bad.
            if dig(gateway, "spec", "infrastructure", "parametersRef") != nil {
              gwAcceptedStatus = "False"
              gwAcceptedReason = "InvalidParameters"
              gwAcceptedMessage = "spec.infrastructure.parametersRef references an unsupported resource"
            }
            var gwEffectiveAddresses []any = gatewayAddresses
            var hasUnsupportedAddrType = false
            var hasUnusableAddr = false
            if gwSpecAddrs != nil && len(gwSpecAddrs) > 0 {
              // Spec invariant: when spec.addresses is set the implementation
              // honours *only* those addresses; the controller-Service address
              // set is no longer the source of truth. Reset upfront so a
              // partial-realize path doesn't silently leak the LB IPs in
              // status. Sets hasUnusableAddr unless every spec entry is
              // realized below.
              gwEffectiveAddresses = []any{}
              var validIPs = []any{}
              var nonIPCount = 0
              for _, addr := range gwSpecAddrs {
                var addrType = addr.Type
                if addrType == "" { addrType = "IPAddress" }
                var addrValue = addr.Value
                if addrType != "IPAddress" && addrType != "Hostname" && addrType != "NamedAddress" {
                  hasUnsupportedAddrType = true
                  continue
                }
                if addrType == "IPAddress" && addrValue != "" {
                  validIPs = append(validIPs, addrValue)
                } else {
                  // Hostname / NamedAddress entries are spec-supported types
                  // but the chart's shared-frontend HAProxy can't realize
                  // them (would need DNS provisioning or cloud-LB hostname
                  // wiring). Surface as AddressNotUsable so the operator
                  // sees the gap in status — this matches every other
                  // shared-frontend Gateway implementation's behaviour.
                  nonIPCount++
                }
              }
              if hasUnsupportedAddrType {
                gwAcceptedStatus = "False"
                gwAcceptedReason = "UnsupportedAddress"
                gwAcceptedMessage = "spec.addresses contains an unsupported address type"
              } else if nonIPCount > 0 && len(validIPs) == 0 {
                // Hostname / NamedAddress only — no Service to spawn,
                // nothing the chart can realize.
                hasUnusableAddr = true
              } else if len(validIPs) > 0 {
                var controllerNamespace = dig_string(props, "", "controllerNamespace")
                var podSelector = dig(props, "haproxyPodSelector")
                if controllerNamespace != "" && podSelector != nil {
                  var realizedIPs = map[string]bool{}
                  for _, validIP := range validIPs {
                    var ip = tostring(validIP)
                    var serviceName = BoundedK8sName("gw", nsStr, nameStr, replace(ip, ".", "-"))
                    var service = resources.services.GetSingle(controllerNamespace, serviceName)
                    if service != nil {
                      for _, ingress := range service.Status.LoadBalancer.Ingress {
                        if ingress.Ip == ip {
                          realizedIPs[ip] = true
                        }
                      }
                    }
                  }
                  gwEffectiveAddresses = []any{}
                  for _, validIP := range validIPs {
                    var ip = tostring(validIP)
                    if realizedIPs[ip] {
                      gwEffectiveAddresses = append(gwEffectiveAddresses,
                        map[string]any{"type": "IPAddress", "value": ip})
                    } else {
                      hasUnusableAddr = true
                    }
                  }
                }
                // Mixed spec.addresses (IP + Hostname/NamedAddress):
                // even if the IPAddress entries realize cleanly, the
                // Hostname / NamedAddress entries can't. Mark
                // AddressNotUsable so the operator sees the gap.
                if nonIPCount > 0 {
                  hasUnusableAddr = true
                }
              }
            }

            // Wait for the isolated Service address before marking the Gateway programmed.
            var phase5CtrlNs = dig_string(props, "", "controllerNamespace")
            if len(gwSpecAddrs) == 0 && phase5CtrlNs != "" {
              var hasIsolatedListener = false
              for _, listener := range gateway.Spec.Listeners {
                if listener.Protocol == "HTTPS" || listener.Protocol == "HTTP" || listener.Protocol == "TLS" {
                  hasIsolatedListener = true
                  break
                }
              }
              if hasIsolatedListener {
                // Per-Gateway IP path takes ownership of status.addresses
                // here, REPLACING the chart-static fallback. Reset
                // upfront so a not-yet-realized Service leaves
                // status.addresses empty (which trips Programmed=False
                // until MetalLB allocates) instead of leaking the
                // chart's main LB IP — that's what the conformance
                // test relies on to wait for the right address.
                gwEffectiveAddresses = []any{}
                var perGwSvcName = BoundedK8sName("gw", nsStr, nameStr, "")
                var perGwSvc = resources.services.GetSingle(phase5CtrlNs, perGwSvcName)
                if perGwSvc != nil {
                  for _, ing := range perGwSvc.Status.LoadBalancer.Ingress {
                    var ipStr = ing.Ip
                    if ipStr != "" {
                      gwEffectiveAddresses = append(gwEffectiveAddresses, map[string]any{
                        "type":  "IPAddress",
                        "value": ipStr,
                      })
                    }
                  }
                }
              }
            }

            // Pre-compute per-listener data the deployed and deployFailed
            // variants both consume. Specifically: allowedRoutes.kinds
            // intersection with the protocol-default kinds (per Gateway
            // API spec — ResolvedRefs goes False/InvalidRouteKinds when
            // the user requests an unsupported kind, supportedKinds
            // shrinks to the intersection). Computing once and reusing
            // ensures the two variants stay in lockstep.
            var listenerData = []any{}
            for _, listener := range gateway.Spec.Listeners {
              var listenerName = listener.Name
              var protocol = listener.Protocol
              if protocol == "" { protocol = "HTTP" }

              // Default kinds the chart's data-plane supports per
              // listener protocol. The conformance suite treats this
              // as the "core" set; any user-requested kind not in this
              // set is rejected with InvalidRouteKinds.
              var defaultKinds = []any{}
              switch protocol {
              case "HTTP", "HTTPS":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute"},
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "GRPCRoute"},
                }
              case "TLS":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "TLSRoute"},
                }
              case "TCP":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "TCPRoute"},
                }
              case "UDP":
                defaultKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "UDPRoute"},
                }
              }

              // If the listener spec declares allowedRoutes.kinds, the
              // intersection with defaultKinds is what we report. If
              // anything was filtered out, ResolvedRefs goes False with
              // reason InvalidRouteKinds (per the Gateway API spec for
              // listener-status conditions).
              var supportedKinds = []any{}
              var hasInvalidKind = false
              if len(listener.AllowedRoutes.Kinds) == 0 {
                supportedKinds = defaultKinds
              } else {
                for _, reqEntry := range listener.AllowedRoutes.Kinds {
                  var reqGroup = reqEntry.Group
                  if reqGroup == "" { reqGroup = "gateway.networking.k8s.io" }
                  var reqKind = reqEntry.Kind
                  var matched = false
                  for _, def := range defaultKinds {
                    if tostring(dig(def, "group")) == reqGroup && tostring(dig(def, "kind")) == reqKind {
                      matched = true
                      break
                    }
                  }
                  if matched {
                    supportedKinds = append(supportedKinds, map[string]any{"group": reqGroup, "kind": reqKind})
                  } else {
                    hasInvalidKind = true
                  }
                }
              }

              // ResolvedRefs status / reason / message are derived from
              // (1) the kinds filter result and (2) certificateRef
              // validity for HTTPS/TLS listeners. InvalidRouteKinds and
              // InvalidCertificateRef are mutually exclusive reasons in
              // the spec; if both apply, kinds-based wins (the user
              // can fix kinds first to get a clearer cert error).
              // The transitionTime helper preserves the existing
              // timestamp when status doesn't change so the patch is
              // idempotent.
              var resolvedRefsStatus = "True"
              var resolvedRefsReason = "ResolvedRefs"
              var resolvedRefsMessage = "All references resolved"

              // Validate certificateRefs for HTTPS / TLS listeners.
              // Per Gateway API spec: an unsupported group/kind, a
              // missing target Secret, a Secret missing tls.crt /
              // tls.key data, or a cross-namespace ref without a
              // matching ReferenceGrant each makes the listener
              // ResolvedRefs=False with a different reason:
              //   InvalidCertificateRef — bad group/kind or malformed
              //     Secret content
              //   RefNotPermitted       — cross-ns ref without
              //     a permitting ReferenceGrant
              // The chart's existing TLS-cert rendering already
              // gracefully skips invalid refs (no haproxy crash), but
              // status didn't reflect the failure — conformance gates
              // on this.
              var hasInvalidCertRef = false
              var hasRefNotPermitted = false
              if protocol == "HTTPS" || protocol == "TLS" {
                for _, ref := range listener.Tls.CertificateRefs {
                  var refGroup = ref.Group
                  var refKind = ref.Kind
                  if refKind == "" { refKind = "Secret" }
                  if refGroup != "" && refGroup != "core" {
                    hasInvalidCertRef = true
                    continue
                  }
                  if refKind != "Secret" {
                    hasInvalidCertRef = true
                    continue
                  }
                  var refName = ref.Name
                  var refNs = ref.Namespace
                  if refNs == "" { refNs = nsStr }
                    if refName == "" {
                      hasInvalidCertRef = true
                      continue
                    }
                    // Cross-namespace gate: requires a matching
                    // ReferenceGrant in the target Secret's namespace.
                    if refNs != nsStr {
                      var permitted = ReferenceGrantPermitted(
                        "gateway.networking.k8s.io", "Gateway", nsStr,
                        "", "Secret", refNs, refName,
                      )
                      if permitted != "true" {
                        hasRefNotPermitted = true
                        continue
                      }
                    }
                    var sec = resources.secrets.GetSingle(refNs, refName)
                    if sec == nil {
                      hasInvalidCertRef = true
                      continue
                    }
                    var crtB64 = sec.Data["tls.crt"]
                    var keyB64 = sec.Data["tls.key"]
                    if crtB64 == "" || keyB64 == "" {
                      hasInvalidCertRef = true
                    } else {
                      var crt, crtErr = b64decode(crtB64)
                      var key, keyErr = b64decode(keyB64)
                      if crtErr != nil || keyErr != nil {
                        hasInvalidCertRef = true
                      } else if !hasPrefix(crt, "-----BEGIN ") || !hasPrefix(key, "-----BEGIN ") {
                        hasInvalidCertRef = true
                      }
                    }
                  }
                }
              var hasNoValidFrontendCA = false
              var feFailReason = ""
              var feFailMessage = ""
              var listenerAcceptedStatus = "True"
              var listenerAcceptedReason = "Accepted"
              var listenerAcceptedMessage = "Listener accepted"
              // Supported-protocol gate (Gateway API core): the chart routes
              // HTTP, HTTPS, TLS and TCP listeners. Any other protocol (UDP,
              // or a bogus value like INVALID) makes the listener
              // Accepted=False with reason UnsupportedProtocol, and the
              // listener contributes no bind (the allocator / bind snippets
              // already ignore non-HTTP/HTTPS/TLS/TCP). A Gateway whose
              // listeners are ALL unsupported ends up with zero accepted
              // listeners and is not Accepted (handled by the gateway-level
              // aggregation); a mix keeps the Gateway Accepted with only the
              // unsupported listener rejected (GatewayListenerUnsupportedProtocol).
              if protocol != "HTTP" && protocol != "HTTPS" && protocol != "TLS" && protocol != "TCP" {
                listenerAcceptedStatus = "False"
                listenerAcceptedReason = "UnsupportedProtocol"
                listenerAcceptedMessage = "Protocol " + protocol + " is not supported"
              }
              if listenerAcceptedStatus == "True" && resolvedRefsStatus == "True" &&
                (protocol == "HTTPS" || (protocol == "TLS" && listener.Tls.Mode != "Passthrough")) {
                var listenerPort = toint(listener.Port)
                var frontendCAStatus = dig(frontendMTLSResolution, "defaultStatus")
                for _, entry := range toSlice(dig(frontendMTLSResolution, "perPort")) {
                  if toint(dig(entry, "port") | fallback(0)) != listenerPort { continue }
                  frontendCAStatus = dig(entry, "status")
                  break
                }
                if frontendCAStatus != nil {
                  hasNoValidFrontendCA = dig_string(frontendCAStatus, "false", "hasValid") != "true"
                  feFailReason = dig_string(frontendCAStatus, "", "reason")
                  feFailMessage = dig_string(frontendCAStatus, "", "message")
                }
              }

              if hasInvalidKind {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "InvalidRouteKinds"
                resolvedRefsMessage = "Listener references unsupported route kinds"
              } else if hasRefNotPermitted {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "RefNotPermitted"
                resolvedRefsMessage = "Listener references a Secret across namespaces with no matching ReferenceGrant"
              } else if hasInvalidCertRef {
                resolvedRefsStatus = "False"
                resolvedRefsReason = "InvalidCertificateRef"
                resolvedRefsMessage = "Listener references unsupported, missing, or malformed Secret"
              } else if feFailReason != "" {
                resolvedRefsStatus = "False"
                resolvedRefsReason = feFailReason
                resolvedRefsMessage = feFailMessage
                if hasNoValidFrontendCA {
                  listenerAcceptedStatus = "False"
                  listenerAcceptedReason = "NoValidCACertificate"
                  listenerAcceptedMessage = feFailMessage
                }
              }

              var attached = shared.Count("gateway-route-attachments",
                "gateway-listener\x00" + nsStr + "\x00" + nameStr + "\x00" + listenerName)

              // Per Gateway API spec, when a listener's references are
              // unresolvable (cert invalid, kind unsupported, …) the
              // listener also can't be Programmed — the dataplane
              // can't realise a binding it has no cert for. Programmed
              // mirrors ResolvedRefs in those cases (with reason
              // "Invalid" because the spec's listener-Programmed reasons
              // are coarser than ResolvedRefs's).
              var programmedListenerStatus = "True"
              var programmedListenerReason = "Programmed"
              var programmedListenerMessage = "Listener programmed"
              if resolvedRefsStatus != "True" {
                programmedListenerStatus = "False"
                programmedListenerReason = "Invalid"
                programmedListenerMessage = resolvedRefsMessage
              }

              listenerData = append(listenerData, map[string]any{
                "name":                  listenerName,
                "supportedKinds":        supportedKinds,
                "attachedRoutes":        attached,
                "resolvedRefsStatus":    resolvedRefsStatus,
                "resolvedRefsReason":    resolvedRefsReason,
                "resolvedRefsMessage":   resolvedRefsMessage,
                "acceptedStatus":        listenerAcceptedStatus,
                "acceptedReason":        listenerAcceptedReason,
                "acceptedMessage":       listenerAcceptedMessage,
                "programmedStatus":      programmedListenerStatus,
                "programmedReason":      programmedListenerReason,
                "programmedMessage":     programmedListenerMessage,
              })
            }

            // Emit BOTH a "rendered" and "deployed" variant carrying the
            // same content. The "rendered" variant fires after every
            // successful render — that's what the Gateway API spec
            // expects: status reflects the latest spec the controller
            // observed, even when the resulting HAProxy config is
            // byte-identical to the previous render and deployment is
            // skipped. Without it, a Gateway whose .spec mutates
            // without producing a HAProxy config diff (e.g. listener
            // hostname change that doesn't shift any path-map rows)
            // would have stale observedGeneration in its conditions.
            // The conformance test GatewayObservedGenerationBump pins
            // exactly this behaviour.
            //
            // The applier's per-(resource, gvr) checksum cache
            // dedupes redundant patches, so emitting the same content
            // in two phases doesn't double the API traffic — it just
            // closes the timing window between render and deploy.
            //
            // Gateway-level Programmed reflects listener health: per
            // spec, a Gateway is Programmed=True only when every
            // listener it owns can also be programmed. If any listener
            // failed to resolve refs (bad cert, unsupported kind, …)
            // the Gateway-level condition flips to False/Invalid with
            // a message pointing at the listener-side reason.
            // Conformance GatewayInvalidTLSConfiguration explicitly
            // checks this top-level Programmed=False alongside the
            // listener-level ResolvedRefs=False/InvalidCertificateRef.
            var gwProgrammedStatus = "True"
            var gwProgrammedReason = "Programmed"
            var gwProgrammedMessage = "Gateway programmed into the data plane"
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              if tostring(ldm["programmedStatus"]) == "False" {
                gwProgrammedStatus = "False"
                gwProgrammedReason = "Invalid"
                gwProgrammedMessage = "Listener " + tostring(ldm["name"]) + " is not programmed: " + tostring(ldm["programmedMessage"])
                break
              }
            }

            // Aggregate top-level Gateway ResolvedRefs from listener
            // ResolvedRefs and the optional spec.tls.backend.client
            // CertificateRef. Per Gateway API spec, the Gateway-level
            // condition surfaces overall reference resolution; the
            // GatewayBackendClientCertificate conformance test reads
            // it directly. False/InvalidCertificateRef wins over
            // RefNotPermitted (matching listener-status precedence).
            var gwResolvedRefsStatus = "True"
            var gwResolvedRefsReason = "ResolvedRefs"
            var gwResolvedRefsMessage = "All references resolved"
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              if tostring(ldm["resolvedRefsStatus"]) != "True" {
                gwResolvedRefsStatus = "False"
                gwResolvedRefsReason = tostring(ldm["resolvedRefsReason"])
                gwResolvedRefsMessage = "Listener " + tostring(ldm["name"]) + ": " + tostring(ldm["resolvedRefsMessage"])
                break
              }
            }
            // A Gateway with listeners but NONE accepted (e.g. every listener
            // uses an unsupported protocol) is itself Accepted=False. One or
            // more accepted listeners keeps it Accepted (GatewayListenerUnsupported
            // Protocol: the all-unsupported Gateway is not accepted; the mixed
            // HTTP+unsupported Gateway stays accepted with only the bad listener
            // rejected). Only override the default Accepted=True — never revive a
            // Gateway already False for another reason (e.g. UnsupportedAddress).
            if gwAcceptedStatus == "True" && len(listenerData) > 0 {
              var anyListenerAccepted = false
              var anyListenerRejected = false
              for _, ld := range listenerData {
                if tostring(ld.(map[string]any)["acceptedStatus"]) == "True" {
                  anyListenerAccepted = true
                } else {
                  anyListenerRejected = true
                }
              }
              if !anyListenerAccepted {
                gwAcceptedStatus = "False"
                gwAcceptedReason = "ListenersNotValid"
                gwAcceptedMessage = "No listeners are accepted"
              } else if anyListenerRejected {
                // Mixed: at least one listener accepted, at least one rejected.
                // The Gateway stays Accepted=True (it can serve the good
                // listeners) but reports ListenersNotValid so consumers see
                // that not every listener is valid. The conformance test
                // GatewayListenerUnsupportedProtocol pins exactly
                // Accepted=True / Reason=ListenersNotValid for this shape.
                gwAcceptedReason = "ListenersNotValid"
                gwAcceptedMessage = "One or more listeners are not accepted"
              }
            }
            // Validate spec.tls.backend.clientCertificateRef when set.
            // The chart's util-generate-backends-gateway resolves this
            // ref at backend-emit time; we replay the same checks here
            // so the Gateway status reflects the same resolution.
            if dig(gateway, "spec", "tls", "backend", "clientCertificateRef") != nil && gwResolvedRefsStatus == "True" {
              var ccRef = dig(gateway, "spec", "tls", "backend", "clientCertificateRef")
              var ccGroup = dig_string(ccRef, "", "group")
              var ccKind = dig_string(ccRef, "", "kind")
              if ccKind == "" { ccKind = "Secret" }
              var ccName = dig_string(ccRef, "", "name")
              var ccNs = dig_string(ccRef, "", "namespace")
              if ccNs == "" { ccNs = nsStr }
              if (ccGroup != "" && ccGroup != "core") || ccKind != "Secret" || ccName == "" {
                gwResolvedRefsStatus = "False"
                gwResolvedRefsReason = "InvalidClientCertificateRef"
                gwResolvedRefsMessage = "spec.tls.backend.clientCertificateRef must reference a core/v1 Secret"
              } else if ccNs != nsStr && ReferenceGrantPermitted(
                  "gateway.networking.k8s.io", "Gateway", nsStr,
                  "", "Secret", ccNs, ccName) != "true" {
                gwResolvedRefsStatus = "False"
                gwResolvedRefsReason = "RefNotPermitted"
                gwResolvedRefsMessage = "Cross-namespace clientCertificateRef requires a matching ReferenceGrant"
              } else {
                var ccSec = resources.secrets.GetSingle(ccNs, ccName)
                if ccSec == nil {
                  gwResolvedRefsStatus = "False"
                  gwResolvedRefsReason = "InvalidClientCertificateRef"
                  gwResolvedRefsMessage = "Backend clientCertificateRef Secret " + ccNs + "/" + ccName + " not found"
                } else {
                  // ccSec is typed *resources.secrets.T — ccSec.Data is
                  // map[string]string directly.
                  var ccCrt, hasCrt = ccSec.Data["tls.crt"]
                  var ccKey, hasKey = ccSec.Data["tls.key"]
                  if !hasCrt || !hasKey || ccCrt == "" || ccKey == "" {
                    gwResolvedRefsStatus = "False"
                    gwResolvedRefsReason = "InvalidClientCertificateRef"
                    gwResolvedRefsMessage = "Backend clientCertificateRef Secret " + ccNs + "/" + ccName + " missing tls.crt or tls.key"
                  }
                }
              }
            }

            // Static-addresses Programmed override: spec.addresses set,
            // types all valid, but at least one isn't realized by the LB
            // yet → Programmed=False/AddressNotUsable per Gateway API
            // spec. Listener-side Programmed problems (cert refs, etc.)
            // already detected above take precedence — the most specific
            // failure wins.
            if hasUnusableAddr && gwProgrammedStatus == "True" {
              gwProgrammedStatus = "False"
              gwProgrammedReason = "AddressNotUsable"
              gwProgrammedMessage = "Some addresses in spec.addresses are not yet realized by the LoadBalancer"
            }

            // Build individual condition entries so we can compose the
            // rendered vs deployed payloads from disjoint subsets.
            var gwAcceptedCond = condition("Accepted", gwAcceptedStatus, gwAcceptedReason, gwAcceptedMessage,
              generation, TopLevelTransitionTime(gateway, "Accepted", gwAcceptedStatus))
            var gwProgrammedCond = condition("Programmed", gwProgrammedStatus, gwProgrammedReason, gwProgrammedMessage,
              generation, TopLevelTransitionTime(gateway, "Programmed", gwProgrammedStatus))
            var gwResolvedRefsCond = condition("ResolvedRefs", gwResolvedRefsStatus, gwResolvedRefsReason, gwResolvedRefsMessage,
              generation, TopLevelTransitionTime(gateway, "ResolvedRefs", gwResolvedRefsStatus))

            // GEP-91: GatewayConditionInsecureFrontendValidationMode is
            // emitted when the Gateway opts into AllowInsecureFallback
            // for client-cert validation (gateway-level default OR any
            // perPort override). The reason is ConfigurationChanged.
            // Conformance: GatewayInsecureFrontendValidationMode.
            // Removed (not appended) when every relevant validation
            // mode is AllowValidOnly / unset.
            var insecureFallback = false
            // dig() outer presence guard for consistency with the
            // earlier mTLS-resolvability blocks in this file (line
            // 862) and 10-features.yaml (line 269). Typed access on
            // absent optionals returns zero values rather than
            // panicking (typegen wraps only scalars in pointers), so
            // the guard is performance/style — not a correctness fix.
            if dig(gateway, "spec", "tls", "frontend") != nil {
              if dig_string(gateway, "", "spec", "tls", "frontend", "default", "validation", "mode") == "AllowInsecureFallback" {
                insecureFallback = true
              }
              if !insecureFallback {
                for _, perPort := range dig(gateway, "spec", "tls", "frontend", "perPort") | toSlice() {
                  if dig_string(perPort, "", "tls", "validation", "mode") == "AllowInsecureFallback" {
                    insecureFallback = true
                    break
                  }
                }
              }
            }
            var gwInsecureFrontendCond any = nil
            if insecureFallback {
              gwInsecureFrontendCond = condition("InsecureFrontendValidationMode", "True", "ConfigurationChanged",
                "Gateway is using AllowInsecureFallback for client-cert validation",
                generation, TopLevelTransitionTime(gateway, "InsecureFrontendValidationMode", "True"))
            }
            var attachedLSCount = 0
            var winningProtocolByPort = map[int]string{}
            var claimedHostnameByPort = map[string]bool{}
            var claimListener = func(listener any) bool {
              var port = toint(dig(listener, "port") | fallback(0))
              if port <= 0 {
                return false
              }
              var protocol = dig_string(listener, "HTTP", "protocol")
              if protocol == "" { protocol = "HTTP" }
              var winningProtocol, claimedPort = winningProtocolByPort[port]
              if !claimedPort {
                winningProtocolByPort[port] = protocol
              } else if winningProtocol != protocol {
                return false
              }
              var hostnameKey = tostring(port) + "|" + dig_string(listener, "", "hostname")
              if claimedHostnameByPort[hostnameKey] {
                return false
              }
              claimedHostnameByPort[hostnameKey] = true
              return true
            }
            for _, listener := range gateway.Spec.Listeners {
              claimListener(listener)
            }
            var listenerSets = shared.SelectValues("gateway-host-listenersets",
              "gateway\x00" + nsStr + "\x00" + nameStr)
            listenerSets = sort_by(listenerSets, []string{"$.rank"})
            for _, listenerSet := range listenerSets {
              var accepted = tostring(dig(listenerSet, "accepted") | fallback(false)) == "true"
              var hasAcceptedListener = false
              for _, listener := range toSlice(dig(listenerSet, "candidates")) {
                var survives = false
                if accepted {
                  survives = claimListener(listener)
                }
                if survives {
                  hasAcceptedListener = true
                }
              }
              if accepted && hasAcceptedListener {
                attachedLSCount++
              }
            }


            // Split the status payload by data-plane dependence so each
            // pipeline phase owns a disjoint slice of the resource:
            //
            //   - rendered (haptic-rendered field manager):
            //       Accepted, ResolvedRefs, InsecureFrontendValidationMode,
            //       addresses, attachedListenerSets,
            //       per-listener {name, supportedKinds, attachedRoutes,
            //                     conditions: [Accepted, ResolvedRefs, Conflicted]}.
            //     These are all determined from the index alone — the
            //     controller knows them as soon as the render succeeds,
            //     no HAProxy reload required. Applied eagerly.
            //
            //   - deployed (haptic-deployed field manager):
            //       Programmed top-level + per-listener Programmed only.
            //     Programmed=True genuinely means "HAProxy is serving
            //     this listener" and must wait for reload verification.
            //     Applied on DeploymentCompletedEvent.
            //
            //   - deployFailed (haptic-deployFailed field manager):
            //       Programmed=False top-level + per-listener Programmed=False.
            //     Mirrors the deployed shape so the same condition fields
            //     are owned but with failure values.
            //
            // With phase-scoped SSA field managers, each variant's apply
            // claims ownership of exactly the conditions it lists.
            // Previously the chart shipped byte-identical rendered+deployed
            // payloads (commit 83671a40), which flipped Programmed=True
            // before HAProxy reload — racing the conformance suite's
            // poll-then-dial loop. With Programmed=True isolated to the
            // deployed variant, tests waiting for Programmed=True correctly
            // block until reload is verified, while Accepted/ResolvedRefs
            // (which don't depend on HAProxy state) are surfaced immediately.
            //
            // NOTE: the rendered variant must NOT emit Programmed at all. The
            // Gateway CRD pre-seeds Programmed=Unknown at observedGeneration=0,
            // which looks stale to the conformance obsGen helper until the
            // deployed variant lands — but emitting Programmed=Unknown here to
            // bump observedGeneration is worse: the rendered phase would then
            // Force-own Programmed and every re-render (constant on the shared
            // all-namespaces gateway as routes attach/detach) resets it to
            // Unknown, flickering the deployed Programmed=True back down so it
            // never stabilises under churn. The real remedy for the stale
            // gen-0 window is deploy-pipeline throughput (land the deployed
            // Programmed=True/gen sooner), not a rendered-phase placeholder.
            var renderedTopConditions = []any{gwAcceptedCond, gwResolvedRefsCond}
            if gwInsecureFrontendCond != nil {
              renderedTopConditions = append(renderedTopConditions, gwInsecureFrontendCond)
            }
            var deployedTopConditions = []any{gwProgrammedCond}
            var failedProgrammedCond = condition("Programmed", "False", "AddressNotAssigned",
              "Gateway addresses not yet assigned",
              generation, TopLevelTransitionTime(gateway, "Programmed", "False"))
            var failedTopConditions = []any{failedProgrammedCond}

            // Listener entries for each variant. Rendered carries the
            // structural fields (name, supportedKinds, attachedRoutes)
            // plus the data-plane-independent conditions. Deployed and
            // deployFailed only emit name + their Programmed claim.
            // The listType=map key is `name` for status.listeners and
            // `type` for the inner conditions list — different field
            // managers can co-own the same listener entry as long as
            // they touch disjoint sub-fields.
            var renderedListenerEntries = []any{}
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              var lname = tostring(ldm["name"])
              renderedListenerEntries = append(renderedListenerEntries, map[string]any{
                "name":           ldm["name"],
                "supportedKinds": ldm["supportedKinds"],
                "attachedRoutes": ldm["attachedRoutes"],
                "conditions": []any{
                  condition("Accepted",
                    tostring(ldm["acceptedStatus"]),
                    tostring(ldm["acceptedReason"]),
                    tostring(ldm["acceptedMessage"]),
                    generation, ListenerTransitionTime(gateway, lname, "Accepted", tostring(ldm["acceptedStatus"]))),
                  condition("ResolvedRefs",
                    tostring(ldm["resolvedRefsStatus"]),
                    tostring(ldm["resolvedRefsReason"]),
                    tostring(ldm["resolvedRefsMessage"]),
                    generation,
                    ListenerTransitionTime(gateway, lname, "ResolvedRefs", tostring(ldm["resolvedRefsStatus"]))),
                  condition("Conflicted", "False", "NoConflicts", "No conflicts detected",
                    generation, ListenerTransitionTime(gateway, lname, "Conflicted", "False")),
                },
              })
            }
            var deployedListenerEntries = []any{}
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              var lname = tostring(ldm["name"])
              deployedListenerEntries = append(deployedListenerEntries, map[string]any{
                "name": ldm["name"],
                // attachedRoutes is REQUIRED on every listener status entry
                // (Gateway CRD ListenerStatus.required = [attachedRoutes,
                // conditions, name] — and OLD schemas, Gateway API v1.1/v1.4,
                // additionally list supportedKinds in required). If this
                // deployed variant applies a listener entry before the
                // rendered variant creates it (e.g. an all-invalid Gateway
                // that fails/deploys before its first rendered status lands,
                // or the rendered patch itself failing to apply), an entry
                // missing a required field is rejected by the API server —
                // and that apply then fails and retries forever, flooding
                // the status applier. Emit the same values as the rendered
                // variant so any apply order is valid; identical values make
                // the SSA shared-field co-ownership benign.
                "attachedRoutes": ldm["attachedRoutes"],
                "supportedKinds": ldm["supportedKinds"],
                "conditions": []any{
                  condition("Programmed",
                    tostring(ldm["programmedStatus"]),
                    tostring(ldm["programmedReason"]),
                    tostring(ldm["programmedMessage"]),
                    generation,
                    ListenerTransitionTime(gateway, lname, "Programmed", tostring(ldm["programmedStatus"]))),
                },
              })
            }
            var failedListenerEntries = []any{}
            for _, ld := range listenerData {
              var ldm = ld.(map[string]any)
              var lname = tostring(ldm["name"])
              var failProgrammedStatus = "False"
              var failProgrammedReason = "Invalid"
              var failProgrammedMessage = "Gateway not yet programmed"
              if tostring(ldm["programmedStatus"]) == "False" {
                failProgrammedReason = tostring(ldm["programmedReason"])
                failProgrammedMessage = tostring(ldm["programmedMessage"])
              }
              failedListenerEntries = append(failedListenerEntries, map[string]any{
                "name": ldm["name"],
                // Required fields — see the deployed variant above. A failed
                // deploy is the MOST likely path to apply a listener entry
                // before the rendered variant (an all-invalid Gateway), so
                // this variant must carry attachedRoutes and supportedKinds
                // too (the latter is required by v1.1/v1.4 Gateway schemas).
                "attachedRoutes": ldm["attachedRoutes"],
                "supportedKinds": ldm["supportedKinds"],
                "conditions": []any{
                  condition("Programmed", failProgrammedStatus, failProgrammedReason, failProgrammedMessage,
                    generation, ListenerTransitionTime(gateway, lname, "Programmed", failProgrammedStatus)),
                },
              })
            }
            // attachedListenerSets only exists on Gateway CRD schemas that
            // ship GEP-1713 (Gateway API >= v1.5 experimental). Against an
            // older schema the field makes the WHOLE rendered patch fail at
            // SSA typed-patch construction (".status.attachedListenerSets:
            // field not declared in schema") — the Gateway then never gets
            // its Accepted condition or addresses at all. Gate the key on
            // the ListenerSet index: listenerSetCandidatesByLS is non-nil
            // exactly when the listenersets watch is active (its producer is
            // stripped together with the watch when the CRD is unserved).
            var renderedVariant = map[string]interface{}{
              "addresses":  gwEffectiveAddresses,
              "conditions": renderedTopConditions,
              "listeners":  renderedListenerEntries,
            }
            var _, listenerSetSchemaAvailable = shared.Select(
              "gateway-listenerset-schema", "available", nsStr + "/" + nameStr)
            if listenerSetSchemaAvailable {
              renderedVariant["attachedListenerSets"] = attachedLSCount
            }
            statusPatch(gateway, map[string]interface{}{
                "rendered": renderedVariant,
                "deployed": map[string]interface{}{
                  "conditions": deployedTopConditions,
                  "listeners":  deployedListenerEntries,
                },
                "deployFailed": map[string]interface{}{
                  "conditions": failedTopConditions,
                  "listeners":  failedListenerEntries,
                },
              })
          %%}
      {% end %}

  gateway-status-100:
    requires: [configmaps, gateways, namespaces, referencegrants, secrets, services]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-status-bindings" -}}'
      group: gateway-status
      consumes:
        - gateway-frontend-mtls
        - gateway-route-attachments
        - gateway-status-addresses
      optionalConsumes:
        - gateway-host-listenersets
        - gateway-listenerset-schema
      effects: [statusPatch]
    template: |-
      {%- import "util-generate-gateway-status-patches" for GenerateGatewayStatusPatch -%}
      {%- var gateway = resources.gateways.GetSingle(
        dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name")) -%}
      {%- if gateway != nil -%}{{- GenerateGatewayStatusPatch(gateway) -}}{%- end -%}

  status-patches-200-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |-
      {{- render "gateway-frontend-ca-permissions-100-gateway" default "" -}}
      {{- render "gateway-frontend-mtls-100-gateway" -}}
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "gateway-route-attachments-100-http" -}}
      {{- render "gateway-route-attachments-200-grpc" -}}
      {{- render "gateway-route-attachments-300-tls" default "" -}}
      {{- render "gateway-route-attachments-400-tcp" default "" -}}
      {{- render "gateway-status-addresses-100-controller-service" -}}
      {{- render "gateway-listenerset-schema-100" default "" -}}
      {{- render "gateway-status-100" -}}

  status-patches-220-listenerset:
    requires: [configmaps, gateways, listenersets, namespaces, referencegrants, secrets]
    incremental:
      source: listenersets
      group: gateway-listenerset-status
      consumes:
        - gateway-host-listenersets
        - gateway-route-attachments
      effects: [statusPatch]
    template: |
      {#
        ListenerSet (GEP-1713) Status Patches

        Reads the immutable per-ListenerSet publication used by routing and
        binding components.

        Top-level conditions:
          Accepted=True/Accepted          when at least one listener is
                                          permitted AND not conflicted
          Accepted=False/NotAllowed       parent Gateway denied the LS
                                          (allowedListeners gate or RG
                                          missing for cross-ns parentRef)
          Accepted=False/ListenersNotValid
                                          permitted but every listener
                                          lost a (port, hostname/protocol)
                                          conflict — no usable listeners
          Accepted=False/Pending          parent Gateway not yet observed
          Programmed=True/Programmed      mirrors Accepted=True (after F2
                                          listener-merge the listeners
                                          actually program into HAProxy)

        Per-listener status emits Accepted, Programmed, ResolvedRefs,
        and Conflicted conditions plus supportedKinds (intersection of
        allowedRoutes.kinds with the chart's per-protocol defaults) and
        attachedRoutes count.

        ResolvedRefs cert-ref validation matches the Gateway listener
        loop (util-generate-gateway-status-patches): unsupported group/
        kind, missing Secret, missing tls.crt/tls.key, malformed PEM,
        and cross-ns ref without ReferenceGrant. The RG check uses
        source kind="ListenerSet" (vs "Gateway" for the Gateway loop)
        so the ListenerSetReferenceGrant conformance test sees
        ResolvedRefs=False/RefNotPermitted on listeners whose Secret
        ns has no matching RG for ListenerSets.

        attachedRoutes counts routes whose parentRef.kind="ListenerSet"
        resolves to this LS + sectionName (sectionless parentRefs
        attach to every listener on this LS).

        Resource-agnostic: no controller code change.
      #}
      {%- import "util-condition-transition-time" for TopLevelTransitionTime, ListenerTransitionTime -%}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%%
        var ls = resources.listenersets.GetSingle(
          dig_string(item, "", "metadata", "namespace"), dig_string(item, "", "metadata", "name"))
        if ls != nil {
          var lsNs = ls.Metadata.Namespace
          var lsName = ls.Metadata.Name
          var lsKey = lsNs + "/" + lsName
          var lsGen = ls.Metadata.Generation

          // Resolve parent Gateway via spec.parentRef.
          var parentName = ls.Spec.ParentRef.Name
          var parentNs = ls.Spec.ParentRef.Namespace
          if parentNs == "" { parentNs = lsNs }
          var parentGw = resources.gateways.GetSingle(parentNs, parentName)

          var lsAccepted = "False"
          var lsAcceptedReason = "Pending"
          var lsAcceptedMsg = "Parent Gateway not yet observed"
          var lsProgrammed = "False"
          var lsProgrammedReason = "Pending"
          var lsProgrammedMsg = "Awaiting parent Gateway acceptance"

          var statusEntryAny, hasEntry = shared.Select(
            "gateway-host-listenersets", "listenersets", lsKey)
          var permitted = false
          var rejectReason = "Pending"
          var rejectMsg = "Parent Gateway not yet observed"
          var conflictByName = map[string]any{}
          var hasInlineFallback = false
          if hasEntry {
            permitted = tostring(dig(statusEntryAny, "accepted") | fallback(false)) == "true"
            if !permitted {
              rejectReason = "NotAllowed"
              rejectMsg = "Parent Gateway does not allow ListenerSets from this namespace"
            }
            var winningProtocolByPort = map[int]string{}
            var claimedHostnameByPort = map[string]bool{}
            var claim = func(listener any) string {
              var port = toint(dig(listener, "port") | fallback(0))
              if port <= 0 {
                return ""
              }
              var protocol = dig_string(listener, "HTTP", "protocol")
              if protocol == "" { protocol = "HTTP" }
              var winner, foundWinner = winningProtocolByPort[port]
              if !foundWinner {
                winningProtocolByPort[port] = protocol
              } else if winner != protocol {
                return "ProtocolConflict"
              }
              var hostnameKey = tostring(port) + "|" + dig_string(listener, "", "hostname")
              if claimedHostnameByPort[hostnameKey] {
                return "HostnameConflict"
              }
              claimedHostnameByPort[hostnameKey] = true
              return ""
            }
            if parentGw != nil {
              for _, listener := range parentGw.Spec.Listeners {
                claim(listener)
              }
            }
            var ownConflicts = []any{}
            var siblings = shared.SelectValues("gateway-host-listenersets",
              "gateway\x00" + parentNs + "\x00" + parentName)
            siblings = sort_by(siblings, []string{"$.rank"})
            for _, sibling := range siblings {
              var siblingKey = dig_string(sibling, "", "listenerSetNamespace") + "/" +
                dig_string(sibling, "", "listenerSetName")
              var siblingAccepted = tostring(dig(sibling, "accepted") | fallback(false)) == "true"
              for _, listener := range toSlice(dig(sibling, "candidates")) {
                var conflictReason = ""
                if siblingAccepted {
                  conflictReason = claim(listener)
                }
                if siblingKey == lsKey {
                  var conflict = map[string]any{
                    "name": dig_string(listener, "", "name"),
                    "index": toint(dig(listener, "index") | fallback(0)),
                    "conflicted": conflictReason,
                    "accepted": siblingAccepted,
                  }
                  ownConflicts = append(ownConflicts, conflict)
                  conflictByName[dig_string(listener, "", "name")] = conflict
                }
              }
            }
            statusEntryAny = map[string]any{"listenerConflicts": ownConflicts}
          }


          // Top-level acceptance derivation.
          if parentGw == nil {
            lsAcceptedReason = "Pending"
            lsAcceptedMsg = "Parent Gateway " + parentNs + "/" + parentName + " not found"
            lsProgrammedReason = "Pending"
            lsProgrammedMsg = lsAcceptedMsg
          } else if !hasEntry && !hasInlineFallback {
            lsAcceptedReason = "Pending"
            lsAcceptedMsg = "ListenerSet acceptance state not yet computed"
            lsProgrammedReason = "Pending"
            lsProgrammedMsg = lsAcceptedMsg
          } else if !permitted {
            lsAcceptedReason = rejectReason
            lsAcceptedMsg = rejectMsg
            lsProgrammedReason = rejectReason
            lsProgrammedMsg = rejectMsg
          } else {
            // Permitted by parent Gateway. Drill into per-listener
            // conflict state AND per-listener cert-ref / kind-ref
            // resolution to pick the top-level reason: if every
            // declared listener is conflicted OR has unresolvable
            // refs, the LS itself is rejected with ListenersNotValid
            // (per ListenerSetHostnameConflict /
            // ListenerSetProtocolConflict / ListenerSetReferenceGrant
            // conformance tests).
            //
            // The conflict state lives on the cache entry; the inline-
            // fallback path (cache miss) doesn't have it, so we
            // optimistically assume no conflicts. The per-listener
            // ref-resolution check is computed inline here (mirrors
            // the per-listener loop below) so even a cache miss
            // surfaces the right top-level reason for tests like
            // ListenerSetReferenceGrant where every cert ref fails.
            var anyValid = false
            var allConflicts = []any{}
            if hasEntry {
              allConflicts = statusEntryAny.(map[string]any)["listenerConflicts"].([]any)
            }
            // Pre-scan listeners for cert-ref / kind-ref resolution
            // failures, so the top-level decision can fold both
            // signals (conflict + ref-resolution). The check mirrors
            // the per-listener loop below; we keep the two in sync
            // via shape rather than refactoring the per-listener loop
            // upward, because the per-listener loop also computes
            // supportedKinds / attachedRoutes / Programmed details
            // that don't matter at the top level.
            var listenerHasValidRefs = map[string]bool{}
            for _, l := range ls.Spec.Listeners {
              var lname = l.Name
              var lprotocol = l.Protocol
              if lprotocol == "" { lprotocol = "HTTP" }
              var refsOk = true
              // Kind validity (allowedRoutes.kinds intersection).
              var defKinds = []any{}
              switch lprotocol {
              case "HTTP", "HTTPS":
                defKinds = []any{
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute"},
                  map[string]any{"group": "gateway.networking.k8s.io", "kind": "GRPCRoute"},
                }
              case "TLS":
                defKinds = []any{map[string]any{"group": "gateway.networking.k8s.io", "kind": "TLSRoute"}}
              case "TCP":
                defKinds = []any{map[string]any{"group": "gateway.networking.k8s.io", "kind": "TCPRoute"}}
              case "UDP":
                defKinds = []any{map[string]any{"group": "gateway.networking.k8s.io", "kind": "UDPRoute"}}
              }
              // Drop the explicit `requestedKinds != nil` gate; typed
              // iteration over the optional slice is a no-op when
              // absent (l.AllowedRoutes.Kinds is nil zero-value).
              for _, reqEntry := range l.AllowedRoutes.Kinds {
                var reqGroup = reqEntry.Group
                if reqGroup == "" { reqGroup = "gateway.networking.k8s.io" }
                var reqKind = reqEntry.Kind
                var matched = false
                for _, def := range defKinds {
                  if tostring(dig(def, "group")) == reqGroup && tostring(dig(def, "kind")) == reqKind {
                    matched = true
                    break
                  }
                }
                if !matched {
                  refsOk = false
                  break
                }
              }
              // Cert ref validity (cross-ns RG check + Secret
              // resolution + PEM check, source kind="ListenerSet").
              if refsOk && (lprotocol == "HTTPS" || lprotocol == "TLS") {
                for _, ref := range l.Tls.CertificateRefs {
                  var refGroup = ref.Group
                  var refKind = ref.Kind
                  if refKind == "" { refKind = "Secret" }
                  if (refGroup != "" && refGroup != "core") || refKind != "Secret" {
                    refsOk = false
                    continue
                  }
                  var refName = ref.Name
                  var refNs = ref.Namespace
                  if refNs == "" { refNs = lsNs }
                  if refName == "" {
                    refsOk = false
                    continue
                  }
                  if refNs != lsNs {
                    var rgOk = ReferenceGrantPermitted(
                      "gateway.networking.k8s.io", "ListenerSet", lsNs,
                      "", "Secret", refNs, refName)
                    if rgOk != "true" {
                      refsOk = false
                      continue
                    }
                  }
                  var sec = resources.secrets.GetSingle(refNs, refName)
                  if sec == nil {
                    refsOk = false
                    continue
                  }
                  var crtB64 = sec.Data["tls.crt"]
                  var keyB64 = sec.Data["tls.key"]
                  if crtB64 == "" || keyB64 == "" {
                    refsOk = false
                    continue
                  }
                  var crt, crtErr = b64decode(crtB64)
                  var key, keyErr = b64decode(keyB64)
                  if crtErr != nil || keyErr != nil {
                    refsOk = false
                    continue
                  }
                  if !hasPrefix(crt, "-----BEGIN ") || !hasPrefix(key, "-----BEGIN ") {
                    refsOk = false
                    continue
                  }
                }
              }
              listenerHasValidRefs[lname] = refsOk
            }
            // A listener is "valid" at the top level when:
            //   - its refs resolved (cert + kind), AND
            //   - it isn't conflicted with a sibling on the same port
            // The cache's `accepted` flag covers the conflict half;
            // when cache misses, we optimistically pretend conflict
            // info isn't telling us anything (all conflicts are []),
            // and rely solely on listenerHasValidRefs.
            var anyConflictData = false
            for _, lc := range allConflicts {
              anyConflictData = true
              var lcm = lc.(map[string]any)
              var lcName = tostring(lcm["name"])
              var notConflicted = tostring(lcm["conflicted"]) == ""
              var conflictAccepted = lcm["accepted"].(bool)
              var refsOk = listenerHasValidRefs[lcName]
              if notConflicted && conflictAccepted && refsOk {
                anyValid = true
                break
              }
            }
            if !anyConflictData {
              // No cache, no conflict signal — every listener with
              // resolved refs counts as valid.
              for _, ok := range listenerHasValidRefs {
                if ok {
                  anyValid = true
                  break
                }
              }
              if len(listenerHasValidRefs) == 0 {
                anyValid = true
              }
            }
            if anyValid {
              lsAccepted = "True"
              lsAcceptedReason = "Accepted"
              lsAcceptedMsg = "ListenerSet accepted by parent Gateway"
              lsProgrammed = "True"
              lsProgrammedReason = "Programmed"
              lsProgrammedMsg = "ListenerSet listeners programmed into the data plane"
            } else {
              lsAccepted = "False"
              lsAcceptedReason = "ListenersNotValid"
              lsAcceptedMsg = "All listeners on this ListenerSet lost a conflict, have unsupported route kinds, or have unresolvable cert refs"
              lsProgrammed = "False"
              lsProgrammedReason = "ListenersNotValid"
              lsProgrammedMsg = lsAcceptedMsg
            }
          }

          // Phase-scoped conditions: data-plane-independent Accepted goes
          // in the rendered variant; data-plane-dependent Programmed goes
          // in the deployed variant. See the Gateway split above for the
          // full reasoning. lsTopConditions remains for any debug
          // consumers but no longer feeds the patch payload.
          var lsAcceptedCond = condition("Accepted", lsAccepted, lsAcceptedReason, lsAcceptedMsg,
            lsGen, TopLevelTransitionTime(ls, "Accepted", lsAccepted))
          var lsProgrammedCond = condition("Programmed", lsProgrammed, lsProgrammedReason, lsProgrammedMsg,
            lsGen, TopLevelTransitionTime(ls, "Programmed", lsProgrammed))
          var lsTopConditions = []any{lsAcceptedCond, lsProgrammedCond}
          _ = lsTopConditions

          // Per-listener data: supportedKinds, ResolvedRefs (cert refs
          // with RG check using source kind="ListenerSet"), and
          // Accepted/Programmed/Conflicted. Split into two parallel arrays:
          // renderedListeners carries data-plane-independent fields
          // (supportedKinds, attachedRoutes, Accepted, ResolvedRefs,
          // Conflicted); deployedListeners carries only the Programmed
          // condition per listener (post-reload signal).
          var renderedListeners = []any{}
          var deployedListeners = []any{}
          for _, l := range ls.Spec.Listeners {
            var listenerName = l.Name
            var protocol = l.Protocol
            if protocol == "" { protocol = "HTTP" }

            // supportedKinds
            var defaultKinds = []any{}
            switch protocol {
            case "HTTP", "HTTPS":
              defaultKinds = []any{
                map[string]any{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute"},
                map[string]any{"group": "gateway.networking.k8s.io", "kind": "GRPCRoute"},
              }
            case "TLS":
              defaultKinds = []any{
                map[string]any{"group": "gateway.networking.k8s.io", "kind": "TLSRoute"},
              }
            case "TCP":
              defaultKinds = []any{
                map[string]any{"group": "gateway.networking.k8s.io", "kind": "TCPRoute"},
              }
            case "UDP":
              defaultKinds = []any{
                map[string]any{"group": "gateway.networking.k8s.io", "kind": "UDPRoute"},
              }
            }
            // dig() outer presence guard keeps the "absent kinds →
            // defaultKinds" branch distinct from "empty list kinds →
            // empty supportedKinds"; typed access collapses both
            // into a nil-or-empty slice.
            var supportedKinds = []any{}
            var hasInvalidKind = false
            if dig(l, "allowedRoutes", "kinds") == nil {
              supportedKinds = defaultKinds
            } else {
              for _, reqEntry := range l.AllowedRoutes.Kinds {
                var reqGroup = reqEntry.Group
                if reqGroup == "" { reqGroup = "gateway.networking.k8s.io" }
                var reqKind = reqEntry.Kind
                var matched = false
                for _, def := range defaultKinds {
                  if tostring(dig(def, "group")) == reqGroup && tostring(dig(def, "kind")) == reqKind {
                    matched = true
                    break
                  }
                }
                if matched {
                  supportedKinds = append(supportedKinds, map[string]any{"group": reqGroup, "kind": reqKind})
                } else {
                  hasInvalidKind = true
                }
              }
            }

            // Cert ref validation for HTTPS/TLS listeners. RG source is
            // ListenerSet (not Gateway) so cross-ns Secret refs need a RG
            // matching from {ListenerSet, lsNs}.
            var hasInvalidCertRef = false
            var hasRefNotPermitted = false
            if protocol == "HTTPS" || protocol == "TLS" {
              for _, ref := range l.Tls.CertificateRefs {
                var refGroup = ref.Group
                var refKind = ref.Kind
                if refKind == "" { refKind = "Secret" }
                if refGroup != "" && refGroup != "core" {
                  hasInvalidCertRef = true
                  continue
                }
                if refKind != "Secret" {
                  hasInvalidCertRef = true
                  continue
                }
                var refName = ref.Name
                var refNs = ref.Namespace
                if refNs == "" { refNs = lsNs }
                if refName == "" {
                  hasInvalidCertRef = true
                  continue
                }
                if refNs != lsNs {
                  var rgOk = ReferenceGrantPermitted(
                    "gateway.networking.k8s.io", "ListenerSet", lsNs,
                    "", "Secret", refNs, refName)
                  if rgOk != "true" {
                    hasRefNotPermitted = true
                    continue
                  }
                }
                var sec = resources.secrets.GetSingle(refNs, refName)
                if sec == nil {
                  hasInvalidCertRef = true
                  continue
                }
                var crtB64 = sec.Data["tls.crt"]
                var keyB64 = sec.Data["tls.key"]
                if crtB64 == "" || keyB64 == "" {
                  hasInvalidCertRef = true
                } else {
                  var crt, crtErr = b64decode(crtB64)
                  var key, keyErr = b64decode(keyB64)
                  if crtErr != nil || keyErr != nil {
                    hasInvalidCertRef = true
                  } else if !hasPrefix(crt, "-----BEGIN ") || !hasPrefix(key, "-----BEGIN ") {
                    hasInvalidCertRef = true
                  }
                }
              }
            }

            var resolvedRefsStatus = "True"
            var resolvedRefsReason = "ResolvedRefs"
            var resolvedRefsMessage = "All references resolved"
            if hasInvalidKind {
              resolvedRefsStatus = "False"
              resolvedRefsReason = "InvalidRouteKinds"
              resolvedRefsMessage = "Listener references unsupported route kinds"
            } else if hasRefNotPermitted {
              resolvedRefsStatus = "False"
              resolvedRefsReason = "RefNotPermitted"
              resolvedRefsMessage = "Listener references a Secret across namespaces with no matching ReferenceGrant"
            } else if hasInvalidCertRef {
              resolvedRefsStatus = "False"
              resolvedRefsReason = "InvalidCertificateRef"
              resolvedRefsMessage = "Listener references unsupported, missing, or malformed Secret"
            }

            // Default Accepted/Programmed: mirrors ResolvedRefs. Then
            // overridden by parent-gate rejection or conflict state.
            var listenerAcceptedStatus = "True"
            var listenerAcceptedReason = "Accepted"
            var listenerAcceptedMessage = "Listener accepted"
            var listenerProgrammedStatus = "True"
            var listenerProgrammedReason = "Programmed"
            var listenerProgrammedMessage = "Listener programmed"
            if resolvedRefsStatus != "True" {
              listenerProgrammedStatus = "False"
              listenerProgrammedReason = "Invalid"
              listenerProgrammedMessage = resolvedRefsMessage
            }

            // Apply parent-gate rejection.
            if parentGw == nil {
              listenerAcceptedStatus = "False"
              listenerAcceptedReason = "Pending"
              listenerAcceptedMessage = "Parent Gateway not yet observed"
              listenerProgrammedStatus = "False"
              listenerProgrammedReason = "Pending"
              listenerProgrammedMessage = listenerAcceptedMessage
            } else if hasEntry && !permitted {
              listenerAcceptedStatus = "False"
              listenerAcceptedReason = rejectReason
              listenerAcceptedMessage = rejectMsg
              listenerProgrammedStatus = "False"
              listenerProgrammedReason = rejectReason
              listenerProgrammedMessage = rejectMsg
            }

            // Apply conflict state.
            var conflictedStatus = "False"
            var conflictedReason = "NoConflicts"
            var conflictedMessage = "No conflicts detected"
            var cAny, hasC = conflictByName[listenerName]
            if hasC {
              var cm = cAny.(map[string]any)
              var cReason = tostring(cm["conflicted"])
              if cReason != "" {
                conflictedStatus = "True"
                conflictedReason = cReason
                conflictedMessage = "Listener conflicts with a higher-precedence sibling on the same port"
                listenerAcceptedStatus = "False"
                listenerAcceptedReason = cReason
                listenerAcceptedMessage = conflictedMessage
                listenerProgrammedStatus = "False"
                listenerProgrammedReason = cReason
                listenerProgrammedMessage = conflictedMessage
              }
            }

            var attachedRoutes = shared.Count("gateway-route-attachments",
              "listenerset-listener\x00" + lsNs + "\x00" + lsName + "\x00" + listenerName)
            renderedListeners = append(renderedListeners, map[string]any{
              "name":           listenerName,
              "supportedKinds": supportedKinds,
              "attachedRoutes": attachedRoutes,
              "conditions": []any{
                condition("Accepted",
                  listenerAcceptedStatus, listenerAcceptedReason, listenerAcceptedMessage,
                  lsGen, ListenerTransitionTime(ls, listenerName, "Accepted", listenerAcceptedStatus)),
                condition("ResolvedRefs",
                  resolvedRefsStatus, resolvedRefsReason, resolvedRefsMessage,
                  lsGen, ListenerTransitionTime(ls, listenerName, "ResolvedRefs", resolvedRefsStatus)),
                condition("Conflicted",
                  conflictedStatus, conflictedReason, conflictedMessage,
                  lsGen, ListenerTransitionTime(ls, listenerName, "Conflicted", conflictedStatus)),
              },
            })
            deployedListeners = append(deployedListeners, map[string]any{
              "name": listenerName,
              // attachedRoutes is REQUIRED on every ListenerSet listener status
              // entry (same as Gateway ListenerStatus). If this deployed /
              // deployFailed variant applies a listener entry before the
              // rendered variant creates it, an entry without attachedRoutes is
              // rejected by the API server and the apply retries forever,
              // flooding the status applier. Emit the same count the rendered
              // variant does so any apply order is valid. supportedKinds rides
              // along for the same phase-order self-sufficiency (mirroring the
              // Gateway deployed/deployFailed variants, whose entries old
              // Gateway schemas reject without it); identical values make the
              // SSA shared-field co-ownership benign.
              "attachedRoutes": attachedRoutes,
              "supportedKinds": supportedKinds,
              "conditions": []any{
                condition("Programmed",
                  listenerProgrammedStatus, listenerProgrammedReason, listenerProgrammedMessage,
                  lsGen, ListenerTransitionTime(ls, listenerName, "Programmed", listenerProgrammedStatus)),
              },
            })
          }

          // The ListenerSet CRD ships a status default that pre-populates
          // .status.conditions with Accepted=Unknown AND Programmed=Unknown,
          // both with observedGeneration unset (so they serialise as 0).
          // If the rendered variant only emits Accepted, the API-server-
          // defaulted Programmed entry sticks around with
          // observedGeneration=0 until the deployed variant lands after
          // the data-plane reload. The Gateway-API conformance helper
          // `ListenerSetListenersMustHaveConditions` fast-fails the first
          // time it observes any top-level condition whose
          // observedGeneration trails the LS's metadata.generation — so a
          // poll between rendered and deployed applies sees Programmed
          // (observedGen=0) and bails the whole suite. Emitting
          // lsProgrammedCond in the rendered variant too bumps Programmed's
          // observedGeneration immediately, closing the race. The chart's
          // lsProgrammed is computed from the LS spec + parent Gateway
          // state alone (no data-plane state), so rendered and deployed
          // emit byte-identical Programmed conditions on the success path —
          // the deployed apply still owns Programmed via SSA Force=true,
          // and the checksum cache skips redundant re-applies, so no flicker.
          var lsRenderedCond = []any{lsAcceptedCond, lsProgrammedCond}
          statusPatch(ls, map[string]interface{}{
              "rendered": map[string]interface{}{
                "conditions": lsRenderedCond,
                "listeners":  renderedListeners,
              },
              "deployed": map[string]interface{}{
                "conditions": []any{lsProgrammedCond},
                "listeners":  deployedListeners,
              },
              "deployFailed": map[string]interface{}{
                "conditions": []any{lsProgrammedCond},
                "listeners":  deployedListeners,
              },
            })
        }
      %%}
