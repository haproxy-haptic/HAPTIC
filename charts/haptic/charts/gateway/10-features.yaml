templateSnippets:
  gateway-listener-state-100-gateway:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-listener-state
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          show shared.Publish("resources", namespace + "/" + name, map[string]any{
            "apiVersion": dig_string(gateway, "", "apiVersion"),
            "kind": dig_string(gateway, "", "kind"),
            "metadata": map[string]any{"namespace": namespace, "name": name},
          })
          for listenerIndex, listener := range gateway.Spec.Listeners {
            var certificateRefs = []any{}
            for _, certificateRef := range listener.Tls.CertificateRefs {
              var certificateRefKind = certificateRef.Kind
              if certificateRefKind == "" { certificateRefKind = "Secret" }
              var certificateRefNamespace = certificateRef.Namespace
              if certificateRefNamespace == "" { certificateRefNamespace = namespace }
              certificateRefs = append(certificateRefs, map[string]any{
                "group": certificateRef.Group,
                "kind": certificateRefKind,
                "name": certificateRef.Name,
                "namespace": certificateRefNamespace,
              })
            }
            var tlsOptions = map[string]any{}
            for option, value := range listener.Tls.Options {
              tlsOptions[option] = value
            }
            show shared.Publish("listeners", namespace + "/" + name + "/" + tostring(listenerIndex),
              map[string]any{
                "gatewayNamespace": namespace,
                "gatewayName": name,
                "gatewayHasAddresses": len(gateway.Spec.Addresses) > 0,
                "listenerIndex": listenerIndex,
                "name": listener.Name,
                "hostname": listener.Hostname,
                "port": listener.Port,
                "protocol": listener.Protocol,
                "tls": map[string]any{
                  "mode": listener.Tls.Mode,
                  "options": tlsOptions,
                  "certificateRefs": certificateRefs,
                },
              })
          }
        }
      %%}

  features-002-gateway-listener-publications:
    requires: [gateways]
    template: |-
      {{- render "gateway-listener-state-100-gateway" -}}
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}

  # ----------------------------------------------------------------------------
  # util-tls-cert-by-secret
  #
  # Indexes gf.tlsCertificates by `<secret_namespace>/<secret_name>` so the
  # cert-resolvability check in phases 1/2/4 plus features-150-gateway-bind
  # is a single map lookup instead of an O(N) scan. Cached via
  # shared.ComputeIfAbsent so the index is built at most once per render
  # (any caller can render this util — order is irrelevant since the cache
  # ignores duplicate calls).
  #
  # Usage:
  #   {{ render "util-tls-cert-by-secret" -}}
  #   {%- var certBySecret = shared.Get("tlsCertBySecret").(map[string]any) %}
  #
  # Map value: the full tlsCertificate entry (so callers needing
  # `.sanitized_filename` get it for free). For presence-only callers,
  # `certBySecret[key] != nil` is the membership test.
  # ----------------------------------------------------------------------------
  util-tls-cert-by-secret:
    template: |
      {%- var _, _ = shared.ComputeIfAbsent("tlsCertBySecret", func() any {
        var gf = shared.Get("globalFeatures").(map[string]any)
        var index = map[string]any{}
        for _, tc := range gf["tlsCertificates"].([]any) {
          var tcm = tc.(map[string]any)
          var key = tostring(tcm["secret_namespace"]) + "/" + tostring(tcm["secret_name"])
          index[key] = tcm
        }
        return index
      }) %}

  features-100-gateway-ssl-passthrough:
    requires: [gateways, namespaces, referencegrants, services]
    template: |
      {# Register SSL passthrough backends with global feature registry. #}
      {{- render_glob "gateway-ssl-passthrough-*" -}}
      {{- render "util-gateway-static-tls-groups" default "" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%%
        var groups = map[string]any{}
        if value := shared.Get("gatewayStaticTLSGroups"); value != nil { groups = value.(map[string]any) }
        var ordered = incremental_values("gateway-ssl-passthrough", "backends") | sort_by([]string{"$.rank"})
        for _, backend := range ordered {
          if dig_string(backend, "", "route_type") != "tlsroute" {
            gf["sslPassthroughBackends"] = append(gf["sslPassthroughBackends"].([]any), backend)
            continue
          }
          var key = dig_string(backend, "", "gw_namespace") + "/" + dig_string(backend, "", "gw_name") + "/" + tostring(dig(backend, "port"))
          if groups[key] == nil {
            continue
          }
          var group = groups[key].(map[string]any)
          var published = map[string]any{}
          for k, v := range backend.(map[string]any) { published[k] = v }
          var listenerKey = dig_string(backend, "", "gw_namespace") + "/" + dig_string(backend, "", "gw_name") + "/" + dig_string(backend, "", "listener_name")
          published["condition"] = "{ var(sess.gateway_tls_static_" + sha256(key) + ") -m str " + sha256(listenerKey) + " }"
          published["sampleFetch"] = "req_ssl_sni,lower"
          group["routes"] = append(group["routes"].([]any), backend)
          gf["sslPassthroughBackends"] = append(gf["sslPassthroughBackends"].([]any), published)
        }
      %%}

  gateway-tls-permissions-100-gateway:
    requires: [gateways, referencegrants]
    incremental:
      source: gateways
      group: gateway-tls-permissions
      effects: [publishValue]
    template: |-
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var permissions = map[string]any{}
          for _, listener := range gateway.Spec.Listeners {
            if listener.Tls.Mode != "" && listener.Tls.Mode != "Terminate" { continue }
            for _, ref := range listener.Tls.CertificateRefs {
              if ref.Kind != "" && ref.Kind != "Secret" { continue }
              if ref.Namespace == "" || ref.Namespace == namespace { continue }
              if ReferenceGrantPermitted("gateway.networking.k8s.io", "Gateway", namespace,
                "", "Secret", ref.Namespace, ref.Name) == "true" {
                permissions[ref.Namespace + "/" + ref.Name] = true
              }
            }
          }
          show shared.Publish("permissions", namespace + "/" + name, permissions)
        }
      %%}

  gateway-tls-certificates-100-gateway:
    requires: [gateways, secrets]
    incremental:
      source: gateways
      group: gateway-tls-certificates
      optionalConsumes: [gateway-tls-permissions]
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var permissions, _ = shared.Select("gateway-tls-permissions", "permissions", namespace + "/" + name)
          for listenerIndex, listener := range gateway.Spec.Listeners {
            var tlsMode = listener.Tls.Mode
            if tlsMode != "" && tlsMode != "Terminate" { continue }
            for referenceIndex, certificateRef := range listener.Tls.CertificateRefs {
              var kind = certificateRef.Kind
              if kind == "" { kind = "Secret" }
              if kind != "Secret" { continue }
              var secretName = certificateRef.Name
              var secretNamespace = certificateRef.Namespace
              if secretNamespace == "" { secretNamespace = namespace }
              if secretNamespace != namespace && dig_string(permissions, "false", secretNamespace + "/" + secretName) != "true" {
                continue
              }
              var occurrenceKey = namespace + "/" + name + "/" +
                tostring(listenerIndex) + "/" + tostring(referenceIndex)
              var occurrence = map[string]any{
                "secret_namespace": secretNamespace,
                "secret_name": secretName,
                "listener_hostname": listener.Hostname,
                "listener_port": listener.Port,
              }
              show shared.Publish("occurrences", occurrenceKey, occurrence)

              var secret = resources.secrets.GetSingle(secretNamespace, secretName)
              if secret == nil { continue }
              var tlsCrtB64 = secret.Data["tls.crt"]
              var tlsKeyB64 = secret.Data["tls.key"]
              if tlsCrtB64 == "" || tlsKeyB64 == "" { continue }
              var tlsCrt, crtErr = b64decode(tlsCrtB64)
              var tlsKey, keyErr = b64decode(tlsKeyB64)
              if crtErr != nil || keyErr != nil { continue }
              if !hasPrefix(tlsCrt, "-----BEGIN ") || !hasPrefix(tlsKey, "-----BEGIN ") {
                continue
              }
              occurrence["pem"] = tlsCrt + "\n" + tlsKey
              show shared.Publish("resolved", occurrenceKey, occurrence)
              show shared.Publish("secrets", secretNamespace + "/" + secretName, true)
            }
          }
        }
      %%}

  util-aggregate-gateway-cert-metadata:
    requires: [gateways, secrets]
    template: |
      {{- render "gateway-tls-permissions-100-gateway" default "" -}}
      {{- render "gateway-tls-certificates-100-gateway" -}}
      {%%
        var _, _ = shared.ComputeIfAbsent("gatewayCertAggregates", func() any {
          var certAggregates = map[string]map[string]any{}
          for _, occurrence := range incremental_values("gateway-tls-certificates", "resolved") {
            var secretNamespace = dig_string(occurrence, "", "secret_namespace")
            var secretName = dig_string(occurrence, "", "secret_name")
            var secretKey = secretNamespace + "/" + secretName
            var existing = certAggregates[secretKey]
            if existing == nil {
              existing = map[string]any{
                "secret_namespace": secretNamespace,
                "secret_name": secretName,
                "sni_patterns": []any{},
                "is_gateway_default": false,
                "listener_ports": []any{},
                "pem": dig_string(occurrence, "", "pem"),
              }
              certAggregates[secretKey] = existing
            }
            var listenerHostname = dig_string(occurrence, "", "listener_hostname")
            if listenerHostname != "" {
              existing["sni_patterns"] = append(existing["sni_patterns"].([]any), listenerHostname)
            } else {
              existing["is_gateway_default"] = true
            }
            var listenerPort = toint(dig(occurrence, "listener_port") | fallback(0))
            if listenerPort > 0 {
              existing["listener_ports"] = append(existing["listener_ports"].([]any), listenerPort)
            }
            certAggregates[secretKey] = existing
          }
          return certAggregates
        })
      %%}

  features-100-gateway-tls:
    requires: [gateways, secrets]
    template: |
      {# Register TLS certificates from Gateway listeners with TLS mode "Terminate" #}
      {# Dynamically generates certificate files using fileRegistry.Register() #}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {# Gateway API TLS configuration structure:
          Gateway.spec.listeners[]:
            - name: https
              protocol: HTTPS  # or GRPC
              port: 443
              hostname: example.com  # optional, can be wildcard
              tls:
                mode: Terminate  # we only handle Terminate here, not Passthrough
                certificateRefs:
                  - kind: Secret
                    name: example-tls
                    namespace: default  # optional, defaults to Gateway namespace
      #}
      {# Two-pass cert registration. Pass 1 — walking every
          (gateway, listener, certRef) triple to aggregate per-secret
          (sni_patterns, listener_ports, is_gateway_default) — lives in
          util-aggregate-gateway-cert-metadata. We render that snippet
          to populate the shared cache, then load the result and emit
          one tlsCert entry per unique secret here.

          Cross-namespace refs are gated by ReferenceGrant: a Gateway
          referencing a Secret in a different namespace requires a
          ReferenceGrant in the Secret's namespace whose `from` matches
          the Gateway and `to` matches the Secret. Without a matching
          grant the cert is skipped (status patch reflects this with
          ResolvedRefs=False/RefNotPermitted, set elsewhere). #}
      {{ render "util-aggregate-gateway-cert-metadata" }}
      {%- var certAggregates = shared.Get("gatewayCertAggregates").(map[string]map[string]any) %}

      {#- Pass 2: emit one tlsCert entry per unique secret. Keys sorted
          for deterministic ordering — Scriggo map iteration is not stable
          and a reordered tlsCerts list would churn the rendered crt-list
          (HAProxy reload thrash on otherwise-identical input). -#}
      {%- var aggKeys = []any{} %}
      {%- for k := range certAggregates %}
        {%- aggKeys = append(aggKeys, k) %}
      {%- end %}
      {%- var sortedAggKeys = sort_strings(aggKeys) %}
      {%- for _, secretKey := range sortedAggKeys %}
        {%%
          var agg = certAggregates[secretKey]
          var certNamespace = tostring(agg["secret_namespace"])
          var certName = tostring(agg["secret_name"])

          var combinedPem = tostring(agg["pem"])
          var certFilename = certNamespace + "_" + certName + ".pem"
          var certPath, _ = fileRegistry.Register("cert", certFilename, combinedPem)
          var sanitizedFilename = basename(certPath)

          var tlsCert = map[string]any{
            "secret_namespace":   certNamespace,
            "secret_name":        certName,
            "sni_patterns":       agg["sni_patterns"],
            "sanitized_filename": sanitizedFilename,
            "is_gateway_default": agg["is_gateway_default"],
            "listener_ports":     agg["listener_ports"],
          }
          var tlsCerts []any = gf["tlsCertificates"]
          gf["tlsCertificates"] = append(tlsCerts, tlsCert)
        %%}
      {%- end %}

  global-settings-002-gateway-frontend-mtls:
    requires: [configmaps, gateways, secrets]
    template: |-
      {{- render "gateway-frontend-ca-permissions-100-gateway" default "" -}}
      {{- render "gateway-frontend-mtls-100-gateway" -}}

  gateway-frontend-ca-permissions-100-gateway:
    requires: [gateways, referencegrants]
    incremental:
      source: gateways
      whenAnyPathExists: [spec.tls.frontend]
      group: gateway-frontend-ca-permissions
      effects: [publishValue]
    template: |-
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var validations = []any{dig(gateway, "spec", "tls", "frontend", "default", "validation")}
          for _, entry := range toSlice(dig(gateway, "spec", "tls", "frontend", "perPort")) {
            var validation = dig(entry, "tls", "validation")
            if validation != nil { validations = append(validations, validation) }
          }
          var permissions = map[string]any{}
          for _, validation := range validations {
            for _, ref := range toSlice(dig(validation, "caCertificateRefs")) {
              var refNamespace = dig_string(ref, namespace, "namespace")
              if refNamespace == "" || refNamespace == namespace { continue }
              var refGroup = dig_string(ref, "", "group")
              var refKind = dig_string(ref, "", "kind")
              var refName = dig_string(ref, "", "name")
              if (refGroup != "" && refGroup != "core") || (refKind != "ConfigMap" && refKind != "Secret") { continue }
              if ReferenceGrantPermitted("gateway.networking.k8s.io", "Gateway", namespace,
                "", refKind, refNamespace, refName) == "true" {
                permissions[refKind + "/" + refNamespace + "/" + refName] = true
              }
            }
          }
          show shared.Publish("permissions", namespace + "/" + name, permissions)
        }
      %%}

  gateway-frontend-mtls-100-gateway:
    requires: [configmaps, gateways, secrets]
    incremental:
      source: gateways
      whenAnyPathExists: [spec.tls.frontend]
      group: gateway-frontend-mtls
      optionalConsumes: [gateway-frontend-ca-permissions]
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var permissions, _ = shared.Select("gateway-frontend-ca-permissions", "permissions", namespace + "/" + name)
          var resolveValidation = func(validation any) (any, any) {
            if validation == nil { return nil, nil }
            var refs = toSlice(dig(validation, "caCertificateRefs"))
            if len(refs) == 0 { return nil, nil }
            var verifyMode = "required"
            if dig_string(validation, "AllowValidOnly", "mode") == "AllowInsecureFallback" {
              verifyMode = "optional"
            }
            var parts = []any{}
            var failures = map[string]string{}
            var failing = 0
            var recordFailure = func(reason string, message string) {
              failing = failing + 1
              if failures[reason] == "" { failures[reason] = message }
            }
            for _, ref := range refs {
              var refGroup = dig_string(ref, "", "group")
              var refKind = dig_string(ref, "", "kind")
              var refName = dig_string(ref, "", "name")
              var refNamespace = dig_string(ref, namespace, "namespace")
              if refNamespace == "" { refNamespace = namespace }
              var reference = refKind + " " + refNamespace + "/" + refName
              if (refGroup != "" && refGroup != "core") || (refKind != "ConfigMap" && refKind != "Secret") {
                recordFailure("InvalidCACertificateKind", "Frontend CA " + reference + " uses unsupported group/kind " +
                  refGroup + "/" + refKind + ". It cannot supply client trust. Use a core ConfigMap or Secret.")
                continue
              }
              if refName == "" {
                recordFailure("InvalidCACertificateRef", "Frontend CA " + reference +
                  " has no name and cannot be resolved. Set the referenced object's name.")
                continue
              }
              if refNamespace != namespace && dig_string(permissions, "false", refKind + "/" + refNamespace + "/" + refName) != "true" {
                recordFailure("RefNotPermitted", "Frontend CA " + reference +
                  " is not permitted for this Gateway. Client validation cannot use it. Add a matching ReferenceGrant in " + refNamespace + ".")
                continue
              }
              var content = ""
              var found = false
              if refKind == "ConfigMap" {
                var cm = resources.configmaps.GetSingle(refNamespace, refName)
                if cm != nil {
                  found = true
                  content = cm.Data["ca.crt"]
                }
              } else {
                var secret = resources.secrets.GetSingle(refNamespace, refName)
                if secret != nil {
                  found = true
                  var encoded = secret.Data["ca.crt"]
                  if encoded == "" { encoded = secret.Data["tls.crt"] }
                  var decoded, decodeErr = b64decode(encoded)
                  if decodeErr != nil {
                    recordFailure("InvalidCACertificateRef", "Frontend CA " + reference +
                      " contains invalid base64 and cannot supply client trust. Base64-encode its CA certificate data.")
                    continue
                  }
                  content = decoded
                }
              }
              if !found {
                recordFailure("InvalidCACertificateRef", "Frontend CA " + reference +
                  " does not exist. Client validation cannot use it. Create the referenced object.")
                continue
              }
              if content == "" {
                recordFailure("InvalidCACertificateRef", "Frontend CA " + reference +
                  " has no CA data. Client validation cannot use it. Supply non-empty ca.crt in its data.")
                continue
              }
              parts = append(parts, content)
            }
            var status any = nil
            for _, reason := range []string{"InvalidCACertificateKind", "RefNotPermitted", "InvalidCACertificateRef"} {
              if failures[reason] == "" { continue }
              // One reason per condition, so name how many other references failed too.
              var message = failures[reason]
              if failing > 1 {
                var others = tostring(failing - 1) + " other CA reference"
                if failing > 2 { others = others + "s" }
                message = message + " " + others + " failed as well."
              }
              status = map[string]any{"hasValid": len(parts) > 0, "reason": reason, "message": message}
              break
            }
            if len(parts) == 0 { return nil, status }
            return map[string]any{"bundle": join(parts, "\n"), "verifyMode": verifyMode}, status
          }
          var detachValidation = func(validation any) any {
            if validation == nil { return nil }
            var refs = []any{}
            for _, ref := range toSlice(dig(validation, "caCertificateRefs")) {
              refs = append(refs, map[string]any{
                "group": dig_string(ref, "", "group"),
                "kind": dig_string(ref, "", "kind"),
                "name": dig_string(ref, "", "name"),
                "namespace": dig_string(ref, "", "namespace"),
              })
            }
            return map[string]any{
              "mode": dig_string(validation, "", "mode"),
              "caCertificateRefs": refs,
            }
          }
          var listeners = []any{}
          for _, listener := range gateway.Spec.Listeners {
            listeners = append(listeners, map[string]any{
              "name": listener.Name, "hostname": listener.Hostname,
              "port": listener.Port, "protocol": listener.Protocol, "tls": map[string]any{"mode": listener.Tls.Mode},
            })
          }
          var perPort = []any{}
          var perPortResolutions = []any{}
          for _, entry := range toSlice(dig(gateway, "spec", "tls", "frontend", "perPort")) {
            var port = toint(dig(entry, "port") | fallback(0))
            var validation = dig(entry, "tls", "validation")
            perPort = append(perPort, map[string]any{
              "port": port,
              "tls": map[string]any{
                "validation": detachValidation(validation),
              },
            })
            var resolution, status = resolveValidation(validation)
            perPortResolutions = append(perPortResolutions, map[string]any{
              "port": port, "resolution": resolution, "status": status,
            })
          }
          var defaultValidation = dig(gateway, "spec", "tls", "frontend", "default", "validation")
          var defaultResolution, defaultStatus = resolveValidation(defaultValidation)
          show shared.Publish("gateways", namespace + "/" + name, map[string]any{
            "namespace": namespace,
            "name": name,
            "defaultValidation": detachValidation(defaultValidation),
            "perPort": perPort,
            "listeners": listeners,
          })
          show shared.Publish("resolutions", namespace + "/" + name, map[string]any{
            "namespace": namespace,
            "name": name,
            "default": defaultResolution,
            "defaultStatus": defaultStatus,
            "perPort": perPortResolutions,
          })
        }
      %%}

  util-gateway-listener-mtls-bindings:
    template: |-
      {%- var fileDir, fileErr = pathResolver.GetPath("", "file") -%}
      {%- if fileErr != nil -%}{{ fail(tostring(fileErr)) }}{%- end -%}
      {{- toJSON(map[string]any{"gateways": map[string]any{"fileDir": fileDir}}) -}}

  # Per-listener client-certificate policy, published per Gateway: CA bundles as
  # file effects, {ca_path, verify_mode} per listener as values, so a change
  # elsewhere replays them instead of re-resolving every Gateway (#226).
  gateway-listener-mtls-100-gateway:
    requires: [configmaps, gateways, secrets]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-listener-mtls-bindings" -}}'
      group: gateway-listener-mtls
      consumes: [gateway-frontend-mtls]
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |-
      {%- import "util-resource-helpers" for ListenerKey -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gatewayKey = namespace + "/" + name
        var gateway, found = shared.Select("gateway-frontend-mtls", "gateways", gatewayKey)
        if found {
          var resolution, _ = shared.Select("gateway-frontend-mtls", "resolutions", gatewayKey)
          var fileDir = tostring(props["fileDir"])
          var filePath = func(fname string) string {
            if fileDir == "" { return fname }
            return fileDir + "/" + fname
          }
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          var files = []any{}
          var defaultValidation = dig(gateway, "defaultValidation")
          var defaultPath = ""
          var defaultMode = ""
          var defaultResolution = dig(resolution, "default")
          if defaultResolution != nil {
            var fname = "frontend-mtls-" + namespace + "-" + name + "-default.crt"
            files = append(files, map[string]any{
              "type": "ca-file", "filename": fname, "content": dig_string(defaultResolution, "", "bundle"),
            })
            defaultPath = filePath(fname)
            defaultMode = dig_string(defaultResolution, "", "verifyMode")
          }
          var perPortValidations = map[int]any{}
          for _, entry := range toSlice(dig(gateway, "perPort")) {
            var port = toint(dig(entry, "port") | fallback(0))
            if port > 0 {
              perPortValidations[port] = dig(entry, "tls", "validation")
            }
          }
          var perPortResolved = map[int][]string{}
          for _, entry := range toSlice(dig(resolution, "perPort")) {
            var port = toint(dig(entry, "port") | fallback(0))
            var resolved = dig(entry, "resolution")
            if port <= 0 || resolved == nil { continue }
            var fname = "frontend-mtls-" + namespace + "-" + name + "-port-" + tostring(port) + ".crt"
            files = append(files, map[string]any{
              "type": "ca-file", "filename": fname, "content": dig_string(resolved, "", "bundle"),
            })
            var mode = dig_string(resolved, "", "verifyMode")
            if mode != "" {
              perPortResolved[port] = []string{filePath(fname), mode}
            }
          }
          // The parent Gateway's spec.tls.frontend applies to its own listeners and
          // to the listeners of every accepted ListenerSet attached to it.
          var allListeners = toSlice(dig(gateway, "listeners"))
          var listenerSets = shared.SelectValues("gateway-host-listenersets",
            "gateway\x00" + namespace + "\x00" + name)
          listenerSets = listenerSets | sort_by([]string{"$.rank"})
          for _, listenerSet := range listenerSets {
            if tostring(dig(listenerSet, "accepted") | fallback(false)) != "true" {
              continue
            }
            for _, candidate := range toSlice(dig(listenerSet, "candidates")) {
              allListeners = append(allListeners, candidate)
            }
          }
          for position, listener := range allListeners {
            var protocol = tostring(listener | dig("protocol") | fallback("HTTP"))
            if protocol != "HTTPS" && (protocol != "TLS" || dig_string(listener, "", "tls", "mode") == "Passthrough") {
              continue
            }
            var listenerPort = toint(listener | dig("port") | fallback(0))
            var listenerName = tostring(listener | dig("name") | fallback(""))
            var hadValidationConfig = false
            var caPath = ""
            var verifyMode = ""
            var validation, hasOverride = perPortValidations[listenerPort]
            if hasOverride {
              hadValidationConfig = validation != nil
              if override, resolved := perPortResolved[listenerPort]; resolved {
                caPath = override[0]
                verifyMode = override[1]
              }
            } else if defaultValidation != nil {
              caPath = defaultPath
              verifyMode = defaultMode
              hadValidationConfig = true
            }
            var entryKey = gatewayKey + "/" + fixed(position)
            if hadValidationConfig && (caPath == "" || verifyMode == "") {
              if listenerName != "" {
                show shared.Publish("blocked", ListenerKey(namespace, name, listenerName), map[string]any{
                  "listener": ListenerKey(namespace, name, listenerName),
                })
              }
              continue
            }
            if caPath == "" || verifyMode == "" {
              continue
            }
            show shared.Publish("listeners", entryKey, map[string]any{
              "gatewayNamespace": namespace,
              "gatewayName": name,
              "listenerName": listenerName,
              "hostname": tostring(listener | dig("hostname") | fallback("")),
              "ca_path": caPath,
              "verify_mode": verifyMode,
            })
          }
          if len(files) > 0 {
            show shared.Publish("effects", gatewayKey, map[string]any{"files": files})
          }
        }
      %%}

  features-110-gateway-frontend-mtls:
    requires: [configmaps, gateways, secrets]
    template: |
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "gateway-frontend-ca-permissions-100-gateway" default "" -}}
      {{- render "gateway-frontend-mtls-100-gateway" -}}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {#- Self-seed the two gateway-owned mTLS shared-state keys before the
          first read. ssl.yaml used to pre-seed these for convenience, but
          ssl.yaml is Level 1 (knows only base) and the keys are produced
          and consumed entirely within the gateway library — seeding them
          here keeps the Level-1 boundary clean. -#}
      {%- if gf["mtlsBlockedListeners"] == nil -%}
        {%- gf["mtlsBlockedListeners"] = map[string]any{} -%}
      {%- end -%}
      {%- if gf["gatewayListenerMTLSConfig"] == nil -%}
        {%- gf["gatewayListenerMTLSConfig"] = map[string]any{} -%}
      {%- end -%}
      {%- var clientCertVerifyHosts = gf["clientCertVerifyHosts"].(map[string]any) %}
      {#- mtlsBlockedListeners: set of listener keys
          (`<gw-ns>/<gw-name>/<listener-name>`) where the configured
          frontend mTLS validation either failed to resolve any CA
          (caCertificateRefs all unresolvable) or pointed at an empty
          set. Per Gateway API spec a Gateway listener with
          spec.tls.frontend.default.validation set MUST refuse TLS
          handshakes when the configured CA can't be resolved — closes
          the GatewayFrontendInvalidDefaultClientCertificateValidation
          conformance gap. Read by features-150-gateway-bind to gate
          bindHTTPSDefault / needHTTPSFrontend so the listener's bind
          line drops out of the rendered HAProxy config. -#}
      {%- var mtlsBlockedListeners = gf["mtlsBlockedListeners"].(map[string]any) %}
      {#- gatewayListenerMTLSConfig: per-(Gateway, listener) resolved
          mTLS state, keyed by `<gwNs>/<gwName>/<listenerName>`. Each
          entry is `{ca_path, verify_mode}` (the same shape stored
          under `clientCertVerifyHosts[hostname]`, but unambiguously
          scoped to ONE listener so two Gateways with different
          mTLS configs but overlapping hostnames don't collide).
          Phase 2 of the per-Gateway-IP refactor
          (features-160-gateway-crtlist-per-listener) reads this
          map to emit one crt-list line per listener with the
          listener-specific verify clause. Phase 4's per-Gateway
          bind references the resulting crt-list. -#}
      {%- var gatewayListenerMTLSConfig = gf["gatewayListenerMTLSConfig"].(map[string]any) %}
      {{- render "gateway-listener-mtls-100-gateway" -}}
      {%- for _, effect := range incremental_values("gateway-listener-mtls", "effects") -%}
        {%- for _, file := range toSlice(effect | dig("files")) -%}
          {%- var record = file.(map[string]any) -%}
          {%- var _, registerErr = fileRegistry.Register(
            tostring(record["type"]), tostring(record["filename"]), tostring(record["content"])) -%}
          {%- if registerErr != nil -%}{{ fail(tostring(registerErr)) }}{%- end -%}
        {%- end -%}
      {%- end -%}
      {%- for _, blocked := range incremental_values("gateway-listener-mtls", "blocked") -%}
        {%- mtlsBlockedListeners[dig_string(blocked, "", "listener")] = true -%}
      {%- end -%}
      {%- for _, entry := range incremental_values("gateway-listener-mtls", "listeners") -%}
        {%%
          var caPath = dig_string(entry, "", "ca_path")
          var verifyMode = dig_string(entry, "", "verify_mode")
          var hostKey = dig_string(entry, "", "hostname")
          if hostKey == "" {
            hostKey = "*"
          }
          clientCertVerifyHosts[hostKey] = map[string]any{
            "ca_path":     caPath,
            "verify_mode": verifyMode,
          }
          var listenerName = dig_string(entry, "", "listenerName")
          if listenerName != "" {
            gatewayListenerMTLSConfig[dig_string(entry, "", "gatewayNamespace") + "/" +
              dig_string(entry, "", "gatewayName") + "/" + listenerName] = map[string]any{
              "ca_path":     caPath,
              "verify_mode": verifyMode,
            }
          }
        %%}
      {%- end -%}
      {%- gf["clientCertVerifyHosts"] = clientCertVerifyHosts %}
      {%- gf["mtlsBlockedListeners"] = mtlsBlockedListeners %}
      {%- gf["gatewayListenerMTLSConfig"] = gatewayListenerMTLSConfig %}

  # ============================================================================
  # haproxy-service extra ports (gateway / listenerset contribution)
  # ============================================================================
  # base.yaml owns the chart's haproxy Service (k8sResources/haproxy-service)
  # but stays at Level 0 of the library hierarchy — it cannot reference
  # `resources.gateways` / `resources.listenersets` directly. To add
  # the non-default listener ports to the Service surface, we populate
  # `shared.extraServicePorts` here (gateway is Level 2 and has typed
  # access to its own resources), and base.yaml's haproxy-service
  # template reads from shared and appends. Gateways with
  # spec.addresses set get their own dedicated LoadBalancer Service
  # via the gateway-static-addresses k8sResources template — skip
  # them here so we don't double-count.
  # The ListenerSet half lives in features-141, gated on its own CRD, so this
  # snippet never has to reach a ListenerSet through an untyped seam.
  util-gateway-service-port-entry:
    template: |
      {#
        One Service-port entry per (port, protocol). The name carries the key,
        so deduping on it keeps the first contributor of a pair.
      #}
      {#- A func var, not a macro: a macro returns text, and this returns a map. -#}
      {%- var ServicePortEntry = func(port int, protocol string) map[string]any {
        if protocol == "" { protocol = "HTTP" }
        var key = tostring(port) + "-" + toLower(protocol[0:1])
        return map[string]any{
          "name":             "gw-" + key,
          "port":             port,
          "targetPort":       port,
          "protocol":         "TCP",
          "listenerProtocol": protocol,
        }
      } -%}

  # UDP twin of an HTTPS listener's Service port, for its QUIC bind; nil
  # otherwise. Separate from the TCP entry because it reads extraContext, which
  # the incremental publisher above can't.
  util-gateway-quic-service-port-entry:
    template: |
      {%- var QUICServicePortEntry = func(entry map[string]any) map[string]any {
        if tostring(entry["listenerProtocol"]) != "HTTPS" ||
          tostring(extraContext | dig("http3", "enabled") | fallback(true)) != "true" {
          return nil
        }
        var port = toint(entry["port"])
        return map[string]any{
          "name":       "gw-" + tostring(port) + "-q",
          "port":       port,
          "targetPort": port,
          "protocol":   "UDP",
        }
      } -%}

  # Service port entries per Gateway; the winner per name is the first claim in
  # Gateway order, replayed for unrelated changes (#226).
  gateway-service-ports-100-gateway:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-service-ports
      effects: [publishValue]
    template: |-
      {%- import "util-gateway-service-port-entry" for ServicePortEntry -%}
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil && len(gateway.Spec.Addresses) == 0 {
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          for listenerIndex, listener := range gateway.Spec.Listeners {
            var port = toint(listener.Port)
            if port > 0 {
              var entry = ServicePortEntry(port, listener.Protocol)
              show shared.PublishRanked("ports", tostring(entry["name"]),
                namespace + "/" + name + "/" + fixed(listenerIndex), entry)
            }
          }
        }
      %%}

  features-140-gateway-service-extra-ports:
    requires: [gateways]
    template: |
      {%- import "util-gateway-quic-service-port-entry" for QUICServicePortEntry -%}
      {{- render "gateway-service-ports-100-gateway" -}}
      {%%
        // A holder, so features-141 can add to it when the ListenerSet CRD is
        // present. ComputeIfAbsent cannot be re-entered, so the value it
        // returns has to be the mutable thing.
        var holderAny, _ = shared.ComputeIfAbsent("extraServicePorts", func() any {
          return map[string]any{"ports": []map[string]any{}}
        })
        var holder = holderAny.(map[string]any)
        var ports = []map[string]any{}
        for _, entry := range incremental_values("gateway-service-ports", "ports") {
          ports = append(ports, entry.(map[string]any))
          if quic := QUICServicePortEntry(entry.(map[string]any)); quic != nil {
            ports = append(ports, quic)
          }
        }
        holder["ports"] = ports
      %%}

  # Conservative: all declared listenersets contribute their ports to the
  # Service surface; the routing-layer admission gate still applies separately.
  gateway-listenerset-service-ports-100-listenerset:
    requires: [listenersets]
    incremental:
      source: listenersets
      group: gateway-listenerset-service-ports
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var listenerSet = resources.listenersets.GetSingle(namespace, name)
        if listenerSet != nil {
          for listenerIndex, listener := range listenerSet.Spec.Listeners {
            show shared.Publish("ports", namespace + "/" + name + "/" +
              tostring(listenerIndex), map[string]any{
                "port": listener.Port,
                "protocol": listener.Protocol,
              })
          }
        }
      %%}

  features-141-listenerset-service-extra-ports:
    requires: [listenersets]
    template: |
      {%- import "util-gateway-service-port-entry" for ServicePortEntry -%}
      {%- import "util-gateway-quic-service-port-entry" for QUICServicePortEntry -%}
      {{- render "gateway-listenerset-service-ports-100-listenerset" -}}
      {%%
        var holderAny, _ = shared.ComputeIfAbsent("extraServicePorts", func() any {
          return map[string]any{"ports": []map[string]any{}}
        })
        var holder = holderAny.(map[string]any)
        var ports = holder["ports"].([]map[string]any)
        for _, listener := range incremental_values("gateway-listenerset-service-ports", "ports") {
          var port = toint(dig(listener, "port") | fallback(0))
          if port > 0 {
            var entry = ServicePortEntry(port, dig_string(listener, "", "protocol"))
            ports = append(ports, entry)
            if quic := QUICServicePortEntry(entry); quic != nil {
              ports = append(ports, quic)
            }
          }
        }
        holder["ports"] = ports | unique_by(e => tostring(e["name"]))
      %%}

  # ============================================================================
  # Route Analysis (Cached)
  # ============================================================================

  util-gateway-bind-flags-bindings:
    template: |-
      {{- toJSON(map[string]any{"gateways": map[string]any{
        "httpPort": toint(extraContext | dig("httpPort") | fallback(8080)),
        "httpsPort": toint(extraContext | dig("httpsPort") | fallback(8443)),
      }}) -}}

  # Each Gateway's contribution to the chart-static bind flags and its TLS
  # listeners, published once per Gateway and replayed for unrelated changes
  # (#226). An HTTPS or TLS-Terminate listener counts only with a resolved
  # certificate and no blocked frontend validation, so an invalid cert never
  # lights the HTTPS bind.
  gateway-bind-flags-100-gateway:
    requires: [gateways, secrets]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-bind-flags-bindings" -}}'
      group: gateway-bind-flags
      consumes: [gateway-tls-certificates]
      optionalConsumes: [gateway-host-listenersets, gateway-listener-mtls]
      effects: [publishValue]
    template: |-
      {%%
        var namespace = dig_string(item, "", "metadata", "namespace")
        var name = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(namespace, name)
        if gateway != nil {
          var gatewayKey = namespace + "/" + name
          var httpPort = toint(props["httpPort"])
          var httpsPort = toint(props["httpsPort"])
          var fixed = func(value int) string {
            var encoded = tostring(value)
            var zeroes = "0000000000"
            if len(encoded) >= len(zeroes) { return encoded }
            return zeroes[:len(zeroes)-len(encoded)] + encoded
          }
          var flags = map[string]bool{}
          var tlsListeners = []any{}
          var apply = func(listener any, resolvedCert bool) {
            var protocol = dig_string(listener, "", "protocol")
            var port = toint(dig(listener, "port") | fallback(0))
            var listenerName = dig_string(listener, "", "name")
            if protocol == "HTTP" {
              flags["needHTTPFrontend"] = true
              if port == httpPort { flags["bindHTTPDefault"] = true }
              return
            }
            if protocol != "HTTPS" && protocol != "TLS" { return }
            var _, blocked = shared.Select("gateway-listener-mtls", "blocked", gatewayKey + "/" + listenerName)
            var tlsMode = tostring(listener | dig("tls", "mode") | fallback("Terminate"))
            if protocol == "TLS" {
              tlsListeners = append(tlsListeners, map[string]any{
                "port": port, "gwNs": namespace, "gwName": name, "name": listenerName,
                "hostname": dig_string(listener, "", "hostname"), "mode": tlsMode,
                "servable": !blocked && (tlsMode == "Passthrough" || resolvedCert),
              })
              return
            }
            if blocked || !resolvedCert { return }
            flags["needHTTPSFrontend"] = true
            flags["needHTTPSTermination"] = true
            if port == httpsPort { flags["bindHTTPSDefault"] = true }
          }
          for listenerIndex, listener := range gateway.Spec.Listeners {
            var resolved = false
            for referenceIndex := range listener.Tls.CertificateRefs {
              var _, found = shared.Select("gateway-tls-certificates", "resolved",
                gatewayKey + "/" + tostring(listenerIndex) + "/" + tostring(referenceIndex))
              if found { resolved = true; break }
            }
            apply(listener, resolved)
          }
          var listenerSets = shared.SelectValues("gateway-host-listenersets",
            "gateway\x00" + namespace + "\x00" + name)
          listenerSets = listenerSets | sort_by([]string{"$.rank"})
          for _, listenerSet := range listenerSets {
            if tostring(dig(listenerSet, "accepted") | fallback(false)) != "true" { continue }
            for _, candidate := range toSlice(dig(listenerSet, "candidates")) {
              var resolved = false
              for _, certificateRef := range toSlice(dig(candidate, "tls", "certificateRefs")) {
                var kind = dig_string(certificateRef, "", "kind")
                if kind != "" && kind != "Secret" { continue }
                var secretName = dig_string(certificateRef, "", "name")
                if secretName == "" { continue }
                var secretNamespace = dig_string(certificateRef, "", "namespace")
                if secretNamespace == "" { secretNamespace = namespace }
                var _, found = shared.Select("gateway-tls-certificates", "secrets", secretNamespace + "/" + secretName)
                if found { resolved = true; break }
              }
              apply(candidate, resolved)
            }
          }
          for _, flag := range []string{"needHTTPFrontend", "bindHTTPDefault", "needHTTPSFrontend", "needHTTPSTermination", "bindHTTPSDefault"} {
            if flags[flag] {
              show shared.Publish("flags", flag, flag)
            }
          }
          for index, entry := range tlsListeners {
            show shared.Publish("tls", gatewayKey + "/" + fixed(index), entry)
          }
        }
      %%}

  features-150-gateway-bind:
    requires: [configmaps, gateways, grpcroutes, httproutes, namespaces, secrets]
    template: |
      {{- render "gateway-route-candidates-100-http" -}}
      {{- render "gateway-route-candidates-200-grpc" -}}
      {#-
        Gateway / ListenerSet contribution to the chart-static bind decision.

        Runs at priority 150, after features-100-* have populated
        gf["tlsCertificates"] (Terminate listeners with valid certs)
        and gf["sslPassthroughBackends"] (Passthrough listeners).
        Here we OR our findings into:
          - bindHTTPDefault   — emit `bind *:httpPort` for HTTP listeners
                                at the chart's default http port
          - bindHTTPSDefault  — emit `bind *:httpsPort` only when at
                                least one valid cert (or passthrough
                                backend) wants traffic on that port
          - needHTTPFrontend  — render http_frontend block (any HTTP
                                listener at any port — even non-default
                                ones, so http-bind-extra-* has somewhere
                                to attach)
          - needHTTPSFrontend — same idea for HTTPS / TLS listeners /
                                passthrough

        The conformance gap this closes:
        GatewayFrontendInvalidDefaultClientCertificateValidation
        sends an HTTPS listener with NoValidCACertificate. The cert
        registration in features-100-gateway-tls fails the PEM check
        and skips the listener, so `tlsCertificates` ends up without
        an entry for that secret. Reading the populated structure
        rather than re-walking listeners means an invalid cert never
        lights up the bind, and the LB doesn't expose port 443 to
        connections HAProxy would otherwise answer with the chart's
        default cert.
      -#}
      {%- var gf = shared.Get("globalFeatures").(map[string]any) %}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "gateway-listener-mtls-100-gateway" default "" -}}
      {{- render "gateway-bind-flags-100-gateway" -}}
      {%- for _, flag := range incremental_values("gateway-bind-flags", "flags") %}
        {%- gf[tostring(flag)] = true %}
      {%- end %}
      {{- render "util-gateway-pod-port-allocator" -}}
      {%%
        var tlsRecords = incremental_values("gateway-bind-flags", "tls")
        var allocations = shared.Get("gatewayPodPortAllocations").(map[string]any)
        if len(tlsRecords) > 0 {
          var byPortRaw, _ = shared.ComputeIfAbsent("gatewayTLSListenersByPort", func() any { return map[int]any{} })
          var byPort = byPortRaw.(map[int]any)
          for _, recordAny := range tlsRecords {
            var record = recordAny.(map[string]any)
            var sourcePort = toint(record["port"])
            var ports = []int{sourcePort}
            var allocationKey = tostring(record["gwNs"]) + "/" + tostring(record["gwName"]) + ":" +
              tostring(record["name"]) + ":" + tostring(sourcePort)
            var allocated, found = allocations[allocationKey]
            if found && toint(allocated) != sourcePort { ports = append(ports, toint(allocated)) }
            for _, port := range ports {
              var portEntry, exists = byPort[port]
              if !exists {
                portEntry = map[string]any{
                  "mode": tostring(record["mode"]), "listeners": []any{}, "sourcePort": sourcePort,
                  "gatewayNamespace": "", "gatewayName": "",
                }
                if port != sourcePort {
                  portEntry.(map[string]any)["gatewayNamespace"] = record["gwNs"]
                  portEntry.(map[string]any)["gatewayName"] = record["gwName"]
                }
              }
              var pe = portEntry.(map[string]any)
              if tostring(pe["mode"]) != tostring(record["mode"]) { pe["mode"] = "Mixed" }
              pe["listeners"] = append(pe["listeners"].([]any), map[string]any{
                "gwNs": tostring(record["gwNs"]), "gwName": tostring(record["gwName"]),
                "name": tostring(record["name"]), "hostname": tostring(record["hostname"]),
                "mode": tostring(record["mode"]), "servable": record["servable"],
              })
              byPort[port] = pe
            }
          }
        }
      %%}
      {#- HTTPRoutes / GRPCRoutes contribute to needHTTPFrontend
          even when they aren't pinned to a specific Gateway in the
          fixtures we see. Their routing logic emits inside the
          http_frontend block (regardless of bind port — the routing
          logic uses dst_port to disambiguate listener ports), so
          the frontend has to exist whenever at least one route is
          declared. The narrower bindHTTPDefault flag stays gated on
          actual listeners at the chart's default httpPort. -#}
      {%- if incremental_value_count("gateway-route-candidates", "presence-http") > 0 ||
        incremental_value_count("gateway-route-candidates", "presence-grpc") > 0 -%}
        {%- gf["needHTTPFrontend"] = true -%}
      {%- end -%}
      {#- Ingress contribution: any cert registered via
          features-100-ingress-tls indicates an Ingress with spec.tls,
          which the chart routes through the chart-static https
          frontend at httpsPort. ingress.yaml's
          features-100-ingress-bind already lit bindHTTPSDefault
          + needHTTPSFrontend for that case; this is a defensive
          re-affirmation when an Ingress's cert ends up in
          tlsCertificates without going through that path. -#}
      {%%
        for _, certEntry := range gf["tlsCertificates"].([]any) {
          var entry = certEntry.(map[string]any)
          // Ingress-registered entries have no listener_ports key;
          // detect by absence and infer the chart's default httpsPort.
          var ports = entry | dig("listener_ports") | toSlice()
          if len(ports) == 0 {
            gf["needHTTPSFrontend"] = true
            gf["bindHTTPSDefault"] = true
            // HTTPS termination is configured: chart-static
            // ssl-tcp's default_backend should fall through to
            // ssl-loopback for SNIs not claimed by a passthrough
            // route (the chart's pre-existing behaviour).
            gf["needHTTPSTermination"] = true
          }
        }
      %%}
      {# HTTPS-Passthrough bind decisions moved to ssl.yaml's
          `features-140-ssl-passthrough-binds`: `sslPassthroughBackends`
          is cross-library shared state owned by ssl.yaml (any of
          gateway, haproxy-ingress, nginx-ingress can populate it),
          so the consequent bind-decision lives next to the consumer
          (frontends-500-ssl-tcp) rather than in this Level-2 library.
          Without that move, an ingress-only chart with annotation-driven
          ssl-passthrough never saw `bindHTTPSDefault` lit, and the
          TCP frontend silently failed to bind. #}
