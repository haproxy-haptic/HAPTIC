templateSnippets:
  util-gateway-route-identity:
    template: |
      {%- macro GatewayRoutePrefix(kind string, namespace string, name string) string -%}
        {%- var prefix = "" -%}
        {%- if kind == "HTTPRoute" -%}
          {%- prefix = "h" -%}
        {%- else if kind == "GRPCRoute" -%}
          {%- prefix = "g" -%}
        {%- else -%}
          {{- fail("Route " + namespace + "/" + name + " cannot generate a rule ID. Set kind to HTTPRoute or GRPCRoute.") -}}
        {%- end -%}
        {{- prefix + "_" + namespace + "_" + name -}}
      {%- end macro -%}
      {%- macro GatewayRuleID(kind string, namespace string, name string, index int) string -%}
        {{- GatewayRoutePrefix(kind, namespace, name) + "_" + tostring(index) -}}
      {%- end macro -%}

  util-backend-name-gateway:
    template: |
      {%- macro BackendNameGateway(route any, backend any) string -%}
        {%- var namespace = dig_string(route, "", "metadata", "namespace") -%}
        {%- var kind = dig_string(route, "", "kind") -%}
        {%- var name = dig_string(route, "", "metadata", "name") -%}
        {%- if kind != "HTTPRoute" && kind != "GRPCRoute" -%}
          {{- fail("Route " + namespace + "/" + name + " cannot generate an HTTP backend. Set kind to HTTPRoute or GRPCRoute.") -}}
        {%- end -%}
        {%- var targetNamespace = dig_string(backend, namespace, "namespace") -%}
        {%- if targetNamespace == "" -%}{%- targetNamespace = namespace -%}{%- end -%}
        {%- var prefix = "gw_h" -%}
        {%- if kind == "GRPCRoute" -%}{%- prefix = "gw_g" -%}{%- end -%}
        {%- var identity = prefix + "_" + namespace + "_" + name -%}
        {%- if targetNamespace != namespace -%}{%- identity += "_" + targetNamespace -%}{%- end -%}
        {{- identity + "_" + dig_string(backend, "", "name") + "_" +
            dig_string(backend, "", "port") -}}
      {%- end macro -%}

  util-backend-name-gateway-rule:
    template: |
      {%- import "util-backend-name-gateway" for BackendNameGateway -%}
      {#- HAProxy keeps retry and cookie settings per backend, so a rule with its
          own retry or sessionPersistence policy gets its own backend. -#}
      {%- macro BackendNameGatewayRule(route any, rule any, ruleIndex int, backend any) string -%}
        {{- BackendNameGateway(route, backend) -}}
        {%- if dig(rule, "retry") != nil || dig(rule, "sessionPersistence") != nil -%}_r{{ ruleIndex }}{%- end -%}
      {%- end macro -%}

  util-resource-helpers:
    template: |
      {# Scriggo macros are text-typed: every helper returns a string, so callers wrap
          numeric fields (listener.port) in toint(). #}
      {%- macro ResourceNamespace(r any) string -%}
      {{- dig(r, "metadata", "namespace") | fallback("") -}}
      {%- end macro -%}

      {%- macro ResourceName(r any) string -%}
      {{- dig(r, "metadata", "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro GatewayKey(ns string, name string) string -%}
      {{- ns -}}/{{- name -}}
      {%- end macro -%}

      {%- macro ListenerKey(gwNs string, gwName string, listenerName string) string -%}
      {{- gwNs -}}/{{- gwName -}}/{{- listenerName -}}
      {%- end macro -%}

      {%- macro ListenerProtocol(listener any) string -%}
      {{- dig(listener, "protocol") | fallback("") -}}
      {%- end macro -%}

      {#- Gateway API defaults a missing protocol to HTTP; pass "" only when absent must stay
          distinguishable from a concrete value. -#}
      {%- macro ListenerProtocolOr(listener any, defaultProto string) string -%}
      {{- dig(listener, "protocol") | fallback(defaultProto) -}}
      {%- end macro -%}

      {%- macro ListenerName(listener any) string -%}
      {{- dig(listener, "name") | fallback("") -}}
      {%- end macro -%}

      {%- macro ListenerHostname(listener any) string -%}
      {{- dig(listener, "hostname") | fallback("") -}}
      {%- end macro -%}

      {%- macro ResolveCertRefKey(listener any, defaultNs string) string -%}
      {%- var certRefs = dig(listener, "tls", "certificateRefs") | toSlice() -%}
      {%- if len(certRefs) > 0 -%}
        {%- var cr = certRefs[0] -%}
        {%- var crNs = tostring(dig(cr, "namespace") | fallback(defaultNs)) -%}
        {%- var crName = tostring(dig(cr, "name") | fallback("")) -%}
        {{- crNs -}}/{{- crName -}}
      {%- end -%}
      {%- end macro -%}

  util-bounded-k8s-name:
    template: |
      {# 63 = the RFC 1123 label limit on K8s object names. Over-long inputs keep an 8-char hash of
          the untruncated key so inputs that collide after truncation still get distinct names. #}
      {%- macro BoundedK8sName(prefix string, ns string, name string, suffix string) string -%}
      {%- var middle = ns + "-" + name -%}
      {%- var joined = prefix + "-" + middle -%}
      {%- if suffix != "" -%}{%- joined = joined + "-" + suffix -%}{%- end -%}
      {%- if len(joined) <= 63 -%}
      {{- joined -}}
      {%- else -%}
      {%- var hashKey = ns + "/" + name -%}
      {%- if suffix != "" -%}{%- hashKey = hashKey + "/" + suffix -%}{%- end -%}
      {%- var hashTag = sha256(hashKey)[0:8] -%}
      {%- var tail = "-" + hashTag -%}
      {%- if suffix != "" -%}{%- tail = tail + "-" + suffix -%}{%- end -%}
      {%- var room = 63 - len(prefix) - 1 - len(tail) -%}
      {%- if room < 1 -%}{%- room = 1 -%}{%- end -%}
      {%- if len(middle) > room -%}{%- middle = middle[0:room] -%}{%- end -%}
      {{- prefix + "-" + middle + tail -}}
      {%- end -%}
      {%- end macro -%}

  util-bounded-name:
    template: |
      {# Over-long values keep an 8-char hash of the full value so distinct inputs stay
          distinct; 63 is the label-value limit, 255 the file-name limit. #}
      {%- macro BoundedName(value string, limit int) string -%}
      {%- if len(value) <= limit -%}{{- value -}}{%- else -%}{{- value[0:limit-9] + "-" + sha256(value)[0:8] -}}{%- end -%}
      {%- end macro -%}

  util-condition-transition-time:
    template: |
      {# Gateway-API status paths live here, not in the resource-agnostic transitionTime() filter
          (RULE #1). Re-stamping lastTransitionTime on an unchanged status breaks the
          status-applier checksum dedup and self-feeds an SSA-write -> re-render loop. #}
      {%- macro TopLevelTransitionTime(resource any, conditionType string, newStatus string) string -%}
      {{- transitionTime(dig(resource, "status", "conditions"), conditionType, newStatus) -}}
      {%- end macro -%}

      {#- dig(), not .(map[string]any): listener and parent entries are typed structs in production
          and maps in fixture-only paths; the assertion panics on the typed shape. -#}
      {%- macro ListenerTransitionTime(gateway any, listenerName string, conditionType string, newStatus string) string -%}
      {%- var listeners = dig(gateway, "status", "listeners") | toSlice() -%}
      {%- var found []any = nil -%}
      {%- for _, l := range listeners -%}
        {%- if found == nil && tostring(dig(l, "name") | fallback("")) == listenerName -%}
          {%- found = dig(l, "conditions") | toSlice() -%}
        {%- end -%}
      {%- end -%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {%- macro RouteParentTransitionTime(route any, parentRef map[string]any, controllerName string, conditionType string, newStatus string) string -%}
      {%%
        var found []any = nil
        for _, parent := range toSlice(dig(route, "status", "parents")) {
          if dig_string(parent, "", "controllerName") != controllerName { continue }
          var matches = true
          for _, field := range []string{"group", "kind", "name", "namespace", "sectionName", "port"} {
            if dig_string(parent, "", "parentRef", field) != dig_string(parentRef, "", field) {
              matches = false
              break
            }
          }
          if matches {
            found = toSlice(dig(parent, "conditions"))
            break
          }
        }
      %%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

      {#- Match ancestors by identity, not index: the list read back from the apiserver interleaves
          other controllers' entries. Refs compare in the exact shape we wrote them (an omitted
          namespace stays ""), so our own entry always re-matches. -#}
      {%- macro AncestorTransitionTime(policy any, ancestorRef map[string]any, controllerName string, conditionType string, newStatus string) string -%}
      {%%
        var found []any = nil
        var wantGroup = tostring(fallback(ancestorRef["group"], ""))
        var wantKind = tostring(fallback(ancestorRef["kind"], ""))
        var wantName = tostring(fallback(ancestorRef["name"], ""))
        var wantNs = tostring(fallback(ancestorRef["namespace"], ""))
        for _, a := range dig(policy, "status", "ancestors") | toSlice() {
          if dig_string(a, "", "controllerName") != controllerName {
            continue
          }
          if dig_string(a, "", "ancestorRef", "group") != wantGroup {
            continue
          }
          if dig_string(a, "", "ancestorRef", "kind") != wantKind {
            continue
          }
          if dig_string(a, "", "ancestorRef", "name") != wantName {
            continue
          }
          if dig_string(a, "", "ancestorRef", "namespace") != wantNs {
            continue
          }
          found = dig(a, "conditions") | toSlice()
          break
        }
      %%}
      {{- transitionTime(found, conditionType, newStatus) -}}
      {%- end macro -%}

  util-hostname-intersect-gateway:
    template: |
      {# Scriggo macros can only return text, so these return "true"/"false" strings; callers
          compare == "true". #}
      {%- macro HostnamesIntersect(listenerHostname string, routeHostnames []any) -%}
        {%- if listenerHostname == "" -%}
          true
        {%- else if len(routeHostnames) == 0 -%}
          true
        {%- else -%}
          {%- var matched = "false" -%}
          {%- for _, rh := range routeHostnames -%}
            {%- if matched == "false" -%}
              {%- if HostnameSinglePairMatch(listenerHostname, tostring(rh)) == "true" -%}
                {%- matched = "true" -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ matched -}}
        {%- end -%}
      {%- end macro -%}

      {%- macro HostnameSinglePairMatch(lh string, rh string) -%}
        {%- if HostnameSinglePairIntersection(lh, rh) == "" -%}
          false
        {%- else -%}
          true
        {%- end -%}
      {%- end macro -%}

      {#- Tier offsets keep exact (100000+) > wildcard (100+) > catch-all (0) totally ordered
          without tuple comparison; within a tier the longer hostname wins. Used by listener
          isolation to find the most specific listener claiming a host. -#}
      {%- macro HostnameRank(h string) -%}
        {%- if h == "" -%}
          0
        {%- else if hasPrefix(h, "*.") -%}
          {{ 100 + len(h[2:]) }}
        {%- else -%}
          {{ 100000 + len(h) }}
        {%- end -%}
      {%- end macro -%}

      {#- Gateway API v1 wildcard semantics, NOT RFC 1034: "*.X" matches any host ending in ".X"
          with at least one label before it, so multi.label.foo.X matches too; bare X does not.
          Returns the more specific of the two hostnames, or "" when they don't intersect. -#}
      {%- macro HostnameSinglePairIntersection(lh string, rh string) -%}
        {%- if lh == rh -%}
          {{ lh }}
        {%- else if hasPrefix(lh, "*.") && !hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- if hasSuffix(rh, "."+lhBase) && len(rh) > len("."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- else if !hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var rhBase = rh[2:] -%}
          {%- if hasSuffix(lh, "."+rhBase) && len(lh) > len("."+rhBase) -%}
            {{ lh }}
          {%- end -%}
        {%- else if hasPrefix(lh, "*.") && hasPrefix(rh, "*.") -%}
          {%- var lhBase = lh[2:] -%}
          {%- var rhBase = rh[2:] -%}
          {%- if lhBase == rhBase -%}
            {{ lh }}
          {%- else if hasSuffix(lhBase, "."+rhBase) -%}
            {{ lh }}
          {%- else if hasSuffix(rhBase, "."+lhBase) -%}
            {{ rh }}
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-reference-grant-permitted:
    requires: [referencegrants]
    template: |
      {# Scriggo macros can only return text, so this returns "true"/"false"; callers compare
          == "true". #}
      {%- macro ReferenceGrantPermitted(
          fromGroup string, fromKind string, fromNs string,
          toGroup string, toKind string, toNs string, toName string) -%}
        {%- if fromNs == toNs -%}
          true
        {%- else -%}
          {%- var permitted = "false" -%}
          {%- for _, g := range resources.referencegrants.Fetch(toNs) -%}
            {%- if permitted == "false" -%}
              {%- var fromOk = false -%}
              {%- for _, fr := range g.Spec.From -%}
                {%- if fr.Group == fromGroup && fr.Kind == fromKind && fr.Namespace == fromNs -%}
                  {%- fromOk = true -%}
                {%- end -%}
              {%- end -%}
              {%- if fromOk -%}
                {%- for _, to := range g.Spec.To -%}
                  {%- if permitted == "false" -%}
                    {%- if to.Group == toGroup && to.Kind == toKind && (to.Name == "" || to.Name == toName) -%}
                      {%- permitted = "true" -%}
                    {%- end -%}
                  {%- end -%}
                {%- end -%}
              {%- end -%}
            {%- end -%}
          {%- end -%}
          {{ permitted -}}
        {%- end -%}
      {%- end macro -%}

  util-backend-ref-valid:
    requires: [referencegrants]
    template: |
      {# One validity verdict for a route backendRef, shared by the frontend
          backend selector, the weighted map, and the backend generator, so a map
          value never names a backend section that was not emitted. Valid means:
          core/v1 Service, the Service exists, and a cross-namespace ref is
          covered by a ReferenceGrant. Text-typed macro: compare == "true". #}
      {%- import "util-reference-grant-permitted" for ReferenceGrantPermitted -%}
      {%- macro BackendRefValid(routeKind string, routeNs string, ref any) -%}
        {%- var refGroup = ref | dig_string("", "group") -%}
        {%- var refKind = ref | dig_string("Service", "kind") -%}
        {%- if (refGroup != "" && refGroup != "core") || refKind != "Service" -%}
          false
        {%- else -%}
          {%- var refName = ref | dig_string("", "name") -%}
          {%- var refNs = ref | dig_string(routeNs, "namespace") -%}
          {%- if refNs == "" %}{%- refNs = routeNs %}{%- end -%}
          {%- if resources.services.GetSingle(refNs, refName) == nil -%}
            false
          {%- else if refNs != routeNs && ReferenceGrantPermitted("gateway.networking.k8s.io", routeKind, routeNs, "", "Service", refNs, refName) != "true" -%}
            false
          {%- else -%}
            true
          {%- end -%}
        {%- end -%}
      {%- end macro -%}

  util-gateway-retry-policy:
    template: |-
      {#- `unsupported` lists the retry.codes HAProxy's retry-on can't match. -#}
      {%- var GatewayRetryPolicy = func(retry any, haproxyVersion string) map[string]any {
        var retryable = map[int]bool{401: true, 403: true, 404: true, 408: true, 425: true, 429: true,
          500: true, 501: true, 502: true, 503: true, 504: true}
        if semver_gte(haproxyVersion, "3.1") { retryable[421] = true }
        var attempts = 3
        if configured := dig(retry, "attempts"); configured != nil { attempts = toint(configured) }
        var codes = []any{}
        var unsupported = []any{}
        for _, code := range toSlice(dig(retry, "codes")) {
          if retryable[toint(code)] {
            codes = append(codes, tostring(toint(code)))
          } else {
            unsupported = append(unsupported, tostring(toint(code)))
          }
        }
        if len(codes) == 0 && len(unsupported) == 0 { codes = []any{"500", "502", "503", "504"} }
        var retryOn = "conn-failure empty-response response-timeout"
        if len(codes) > 0 { retryOn = retryOn + " " + join(codes, " ") }
        return map[string]any{
          "directives": []any{"retries " + tostring(attempts), "retry-on " + retryOn},
          "unsupported": unsupported,
        }
      } -%}

  util-gateway-session-persistence:
    template: |-
      {#- A rule's sessionPersistence as backend profile lines, or a non-empty
          `error`. Header persistence reuses the dynamic cookie: the request
          header is replayed as the cookie, and the cookie HAProxy inserts is
          copied into the response header and expired on the client. -#}
      {%- var GatewaySessionPersistence = func(sp any, cookieKey string) map[string]any {
        var spType = dig_string(sp, "Cookie", "type")
        var name = dig_string(sp, "", "sessionName")
        var defaultName = "SESSION"
        if spType == "Header" {
          defaultName = "X-Session"
          if headerName := dig_string(sp, "", "header", "name"); headerName != "" { name = headerName }
        } else if cookieName := dig_string(sp, "", "cookie", "name"); cookieName != "" {
          name = cookieName
        }
        if name == "" { name = defaultName }
        if !regex_search(name, "^[A-Za-z0-9!$&*+.^_~-]+$") {
          return map[string]any{"error": "session name '" + name + "' contains a character HAProxy can't take in a cookie or header name"}
        }
        var seconds = func(field string) (int, string) {
          var value = dig_string(sp, "", field)
          if value == "" { return 0, "" }
          var duration, err = parseDuration(value)
          if err != nil || toint(duration.Milliseconds()) <= 0 {
            return 0, field + " '" + value + "' isn't a positive duration"
          }
          return (toint(duration.Milliseconds()) + 999) / 1000, ""
        }
        var absolute, absErr = seconds("absoluteTimeout")
        if absErr != "" { return map[string]any{"error": absErr} }
        var idle, idleErr = seconds("idleTimeout")
        if idleErr != "" { return map[string]any{"error": idleErr} }
        var lifetime = dig_string(sp, "", "cookie", "lifetimeType")
        if lifetime == "" { lifetime = dig_string(sp, "", "cookieConfig", "lifetimeType") }
        var cookie = "cookie " + name + " insert indirect nocache dynamic"
        if absolute > 0 { cookie = cookie + " maxlife " + tostring(absolute) + "s" }
        if idle > 0 { cookie = cookie + " maxidle " + tostring(idle) + "s" }
        if spType == "Header" {
          cookie = cookie + " attr Max-Age=0"
        } else if lifetime == "Permanent" && absolute > 0 {
          cookie = cookie + " attr Max-Age=" + tostring(absolute)
        }
        var path = dig_string(sp, "", "cookie", "path")
        if spType != "Header" && path != "" {
          if !regex_search(path, "^/[A-Za-z0-9._~!$&()*+,=:@%/-]*$") {
            return map[string]any{"error": "cookie path '" + path + "' contains a character HAProxy can't take in a cookie attribute"}
          }
          cookie = cookie + " attr Path=" + path
        }
        var directives = []any{"# GEP-1619 session persistence (" + spType + ")", cookie, "dynamic-cookie-key " + cookieKey}
        if spType == "Header" {
          directives = append(directives,
            "http-request add-header Cookie \"" + name + "=%[req.fhdr(" + name + ")]\" if { req.fhdr(" + name + ") -m found }",
            "http-after-response set-header " + name + " %[res.cook(" + name + ")] if { res.cook(" + name + ") -m found }")
        }
        return map[string]any{"directives": directives, "error": ""}
      } -%}

  util-gw-mtls-blocked-value:
    requires: [gateways, configmaps, secrets]
    template: |
      {%- macro ComputeGwMtlsBlockedValue(gw *resources.gateways.T, blocked map[string]bool) -%}
      {%%
        if dig(gw, "spec", "tls", "frontend") == nil {
          return
        }
        var gwNs = gw.Metadata.Namespace
        var resolutions, _ = shared.Select("gateway-frontend-mtls", "resolutions", gwNs + "/" + gw.Metadata.Name)
        var defaultValidation = dig(gw, "spec", "tls", "frontend", "default", "validation")
        var perPortValidations = map[int]any{}
        for _, pp := range dig(gw, "spec", "tls", "frontend", "perPort") | toSlice() {
          var p = toint(dig(pp, "port") | fallback(0))
          if p > 0 {
            perPortValidations[p] = dig(pp, "tls", "validation")
          }
        }
        var perPortResolutions = map[int]any{}
        for _, entry := range toSlice(dig(resolutions, "perPort")) {
          perPortResolutions[toint(dig(entry, "port") | fallback(0))] = dig(entry, "resolution")
        }
        for _, listener := range gw.Spec.Listeners {
          if listener.Protocol != "HTTPS" && listener.Protocol != "TLS" {
            continue
          }
          var validation, hasOverride = perPortValidations[toint(listener.Port)]
          var resolution = perPortResolutions[toint(listener.Port)]
          if !hasOverride {
            validation = defaultValidation
            resolution = dig(resolutions, "default")
          }
          if validation != nil && resolution == nil {
            blocked[listener.Name] = true
          }
        }
      %%}
      {%- end macro -%}
