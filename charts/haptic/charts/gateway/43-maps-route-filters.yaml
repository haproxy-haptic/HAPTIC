# Per-route filter logic, driven by map files instead of per-route directives.
#
# Every rule-level and backendRef-level filter HAProxy can source from a map at
# request time is built here once and read by static lines: adding a route then
# changes a map entry, not haproxy.cfg, so it deploys without a reload. What
# stays structural is listed in docs/site/docs/libraries/gateway.md.
#
# The maps are registered even when empty. Creating a map file on the first
# route that needs it, and deleting it with the last, are both structural
# changes to haproxy.cfg — the reload this machinery exists to avoid.
templateSnippets:
  util-gateway-route-filter-bindings:
    template: |-
      {%- import "util-gateway-external-auth-settings" for GatewayExternalAuthSettings -%}
      {%- var GatewayRouteFilterProps = func() map[string]any {
        var reqPath, reqErr = pathResolver.GetPath("gw-reqhdr.map", "map")
        if reqErr != nil { fail(tostring(reqErr)) }
        var resPath, resErr = pathResolver.GetPath("gw-reshdr.map", "map")
        if resErr != nil { fail(tostring(resErr)) }
        var extauthRespPath, extauthRespErr = pathResolver.GetPath("gw-extauth-response.map", "map")
        if extauthRespErr != nil { fail(tostring(extauthRespErr)) }
        return map[string]any{
          "reqPath": reqPath,
          "resPath": resPath,
          "extauthRespPath": extauthRespPath,
          "externalAuth": GatewayExternalAuthSettings(),
          "mirrorTimeoutMs": extraContext | dig("spoaHub", "mirror", "targetTimeoutMs") | fallback(2000),
          "mirrorRetries": extraContext | dig("spoaHub", "mirror", "targetRetries") | fallback(0),
          "haproxyVersion": extraContext | dig("haproxyVersion") | fallback(""),
        }
      } -%}

  util-gateway-http-route-filter-bindings:
    template: |-
      {%- import "util-gateway-route-filter-bindings" for GatewayRouteFilterProps -%}
      {{- toJSON(map[string]any{"httproutes": GatewayRouteFilterProps()}) -}}

  util-gateway-grpc-route-filter-bindings:
    template: |-
      {%- import "util-gateway-route-filter-bindings" for GatewayRouteFilterProps -%}
      {{- toJSON(map[string]any{"grpcroutes": GatewayRouteFilterProps()}) -}}

  util-publish-gateway-route-filter-maps:
    requires: [grpcroutes, httproutes, referencegrants, services]
    template: |
      {%- import "util-webhook-reject-or-warn" for WebhookOutcomeMessage, WebhookRejectOrWarn -%}
      {%- import "util-gateway-external-auth" for GatewayExternalAuth -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-backend-name-gateway-rule" for BackendNameGatewayRule -%}
      {%- import "util-gateway-retry-policy" for GatewayRetryPolicy -%}
      {%- import "util-gateway-session-persistence" for GatewaySessionPersistence -%}
      {%- macro PublishGatewayRouteFilterMaps(route any, routeKind string, routeProps map[string]any) -%}
      {%%
        var namespace = dig_string(route, "", "metadata", "namespace")
        var name = dig_string(route, "", "metadata", "name")
        var routeKey = routeKind + "/" + namespace + "/" + name
        var routeIndex, foundRoute = shared.Select("gateway-route-analysis", "routes", routeKey)
        if !foundRoute { return }
        var fixed = func(value int) string {
          var encoded = tostring(value)
          var zeroes = "0000000000"
          if len(encoded) >= len(zeroes) { return encoded }
          return zeroes[:len(zeroes)-len(encoded)] + encoded
        }
        var routeEntries = []any{}
        for _, entryIDAny := range toSlice(dig(routeIndex, "entries")) {
          var entry, foundEntry = shared.Select(
            "gateway-route-analysis", "entries", tostring(entryIDAny))
          if foundEntry { routeEntries = append(routeEntries, entry) }
        }
        routeEntries = sort_by(routeEntries, []string{"$.allRank"})
        var entriesByRule = map[string]any{}
        var ruleOrder = []string{}
        for _, entry := range routeEntries {
          var ruleKey = tostring(dig(entry, "ruleIdx") | fallback(0))
          var entries, found = entriesByRule[ruleKey]
          if !found {
            entries = []any{}
            ruleOrder = append(ruleOrder, ruleKey)
          }
          entriesByRule[ruleKey] = append(entries.([]any), entry)
        }
        var nameOk = func(headerName string) bool {
          return regex_search(headerName, "^[A-Za-z0-9!$&*+.^_~-]+$")
        }
        var hostOk = func(host string) bool {
          return regex_search(toLower(host), "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
        }
        var normPrefix = func(path string) string {
          if path == "" || path == "/" { return "" }
          if hasSuffix(path, "/") { return path[:len(path)-1] }
          return path
        }
        var redirectCodes = map[string]bool{
          "301": true, "302": true, "303": true, "307": true, "308": true}
        for _, ruleKey := range ruleOrder {
          var entries = entriesByRule[ruleKey].([]any)
          if len(entries) == 0 { continue }
          var representative = entries[0]
          var ruleIndex = toint(ruleKey)
          var routeID = dig_string(representative, "", "routeId")
          var representativeRank = dig_string(representative, "", "allRank")
          var sequence = 0
          var publishLine = func(cell string, line string) {
            sequence++
            _ = shared.PublishRanked(cell, routeKey + "/" + ruleKey + "/" + fixed(sequence),
              representativeRank + "\x00" + fixed(sequence), line + "\n")
          }
          var publishConfigLine = func(cell string, line string) {
            sequence++
            _ = shared.PublishRanked(cell, routeKey + "/" + ruleKey + "/" + fixed(sequence),
              representativeRank + "\x00" + fixed(sequence), "\n" + line)
          }
          var pathLens = map[string]bool{}
          for _, entry := range entries {
            if dig_string(entry, "", "pathType") != "PathPrefix" {
              pathLens["none"] = true
            } else {
              pathLens[tostring(len(normPrefix(dig_string(entry, "", "pathValue"))))] = true
            }
          }
          var multiPrefix = len(pathLens) > 1
          var needsRuntimePrefix = false
          var pathFields = func(pathMod any, entry any) map[string]any {
            var mode = ""
            var prefixLength = "0"
            var newPath = ""
            if pathMod != nil {
              var pathType = dig_string(pathMod, "", "type")
              if pathType == "ReplaceFullPath" {
                mode = "F"
                newPath = dig_string(pathMod, "", "replaceFullPath")
              } else if pathType == "ReplacePrefixMatch" {
                if dig_string(entry, "", "pathType") == "RegularExpression" {
                  return map[string]any{"bad": "regex", "packed": ""}
                }
                mode = "P"
                newPath = normPrefix(dig_string(pathMod, "", "replacePrefixMatch"))
                prefixLength = tostring(len(normPrefix(dig_string(entry, "", "pathValue"))))
                if multiPrefix {
                  prefixLength = "M"
                  needsRuntimePrefix = true
                }
              }
            }
            var bad = ""
            if newPath != "" && ConfigInjectionKind(newPath, "line") != "" { bad = "cntrl" }
            return map[string]any{
              "bad": bad,
              "packed": mode + "|" + prefixLength + "|" + queryEscape(newPath),
            }
          }
          var rules = toSlice(dig(route, "spec", "rules"))
          if ruleIndex < 0 || ruleIndex >= len(rules) { continue }
          var rule = rules[ruleIndex]
          var filters = toSlice(dig(rule, "filters"))
          var backendRefs = toSlice(dig(rule, "backendRefs"))
          var anySeen = map[string]bool{}
          var publishHeaderName = func(bucket string, operation string, headerName string) {
            var direction = "http-request"
            var mapPath = dig_string(routeProps, "", "reqPath")
            var keyExpr = "var(txn.gw_rule_id)"
            if hasPrefix(bucket, "res-") {
              direction = "http-response"
              mapPath = dig_string(routeProps, "", "resPath")
            }
            if hasSuffix(bucket, "-be") {
              keyExpr = "var(txn.gw_rule_id),concat(|,txn.backend_name,)"
            }
            var lower = toLower(headerName)
            var line = ""
            if operation == "del" {
              line = "\n" + direction + " del-header " + headerName + " if { " + keyExpr +
                ",concat(|del|" + lower + "),map(" + mapPath + ") -m found }"
            } else {
              var key = keyExpr + ",concat(|" + operation + "|" + lower + ")"
              var directive = "set-header"
              if operation == "add" { directive = "add-header" }
              line = "\n" + direction + " " + directive + " " + headerName + " %[" + key +
                ",map(" + mapPath + "),url_dec(1)] if { " + key + ",map(" + mapPath + ") -m found }"
            }
            _ = shared.PublishRanked("cfg-" + bucket + "-" + operation, lower,
              lower + "\x00" + headerName, line)
          }
          var publishModifiers = func(mod any, keyPrefix string, bucket string) {
            if mod == nil { return }
            var markAny = func() {
              var key = routeID + "|" + bucket[:3]
              if !anySeen[key] {
                anySeen[key] = true
                publishLine(bucket[:3], routeID + "|any 1")
              }
            }
            for _, operation := range []string{"set", "add"} {
              for _, header := range toSlice(dig(mod, operation)) {
                var headerName = dig_string(header, "", "name")
                var headerValue = dig_string(header, "", "value")
                if !nameOk(headerName) {
                  _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", WebhookOutcomeMessage(
                    "Gateway route " + namespace + "/" + name + " modifies header '" + headerName + "', which is not an HTTP token",
                    "the route is rejected", "the header is not applied", "Use letters, digits and -._~!$&*+^."))
                  continue
                }
                var injection = ConfigInjectionKind(headerValue, "line")
                if injection != "" {
                  _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", WebhookOutcomeMessage(
                    "Gateway route " + namespace + "/" + name + " sets header '" + headerName + "' to a value containing " + injection + ", which would inject a header break at request time",
                    "the route is rejected", "the header is not applied", "Remove control characters from the value."))
                  continue
                }
                markAny()
                publishHeaderName(bucket, operation, headerName)
                publishLine(bucket[:3], keyPrefix + "|" + operation + "|" +
                  toLower(headerName) + " " + queryEscape(headerValue))
              }
            }
            for _, headerAny := range toSlice(dig(mod, "remove")) {
              var headerName = tostring(headerAny)
              if !nameOk(headerName) {
                _ = WebhookRejectOrWarn(route, "InvalidHeaderModifier", WebhookOutcomeMessage(
                  "Gateway route " + namespace + "/" + name + " removes header '" + headerName + "', which is not an HTTP token",
                  "the route is rejected", "the removal is not applied", "Use letters, digits and -._~!$&*+^."))
                continue
              }
              markAny()
              publishHeaderName(bucket, "del", headerName)
              publishLine(bucket[:3], keyPrefix + "|del|" + toLower(headerName) + " 1")
            }
          }
          var publishRedirect = func(filter any, key string) {
            var redirect = dig(filter, "requestRedirect")
            if redirect == nil { return }
            var code = toint(dig(redirect, "statusCode") | fallback(302))
            if !redirectCodes[tostring(code)] {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " RequestRedirect statusCode is " + tostring(code),
                "the HTTPRoute is rejected", "the redirect is not applied", "Use 301, 302, 303, 307 or 308."))
              return
            }
            var scheme = dig_string(redirect, "", "scheme")
            if scheme != "" && scheme != "http" && scheme != "https" {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " RequestRedirect scheme is '" + scheme + "'",
                "the HTTPRoute is rejected", "the redirect is not applied", "Use http or https."))
              return
            }
            var host = dig_string(redirect, "", "hostname")
            if host != "" && !hostOk(host) {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " RequestRedirect hostname '" + host + "' is not a DNS name",
                "the HTTPRoute is rejected", "the redirect is not applied", "Use letters, digits, '-' and '.'."))
              return
            }
            var port = dig_string(redirect, "", "port")
            if port != "" && (toint(port) < 1 || toint(port) > 65535) {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " RequestRedirect port " + port + " is outside 1-65535",
                "the HTTPRoute is rejected", "the redirect is not applied", ""))
              return
            }
            var portPart = ""
            if port == "" && scheme == "" {
              portPart = "L"
            } else if port != "" {
              var isDefault = (port == "80" && (scheme == "" || scheme == "http")) ||
                (port == "443" && (scheme == "" || scheme == "https"))
              if !isDefault { portPart = ":" + port }
            }
            var pathSpec = pathFields(dig(redirect, "path"), representative)
            if dig_string(pathSpec, "", "bad") == "cntrl" {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " RequestRedirect path contains a control character, which would break the redirect target",
                "the HTTPRoute is rejected", "the redirect is not applied", ""))
              return
            }
            if dig_string(pathSpec, "", "bad") == "regex" {
              _ = WebhookRejectOrWarn(route, "InvalidRedirect", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " uses RequestRedirect ReplacePrefixMatch on a RegularExpression path match, which has no prefix to replace",
                "the HTTPRoute is rejected", "the redirect is not applied", "Match on a PathPrefix, or use ReplaceFullPath."))
              return
            }
            publishLine("redirect", key + " " + tostring(code) + "|" + scheme + "|" +
              queryEscape(host) + "|" + portPart + "|" + dig_string(pathSpec, "", "packed"))
          }
          var publishRewrite = func(filter any, key string) {
            var rewrite = dig(filter, "urlRewrite")
            if rewrite == nil { return }
            var host = dig_string(rewrite, "", "hostname")
            if host != "" && !hostOk(host) {
              _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " URLRewrite hostname '" + host + "' is not a DNS name",
                "the HTTPRoute is rejected", "the rewrite is not applied", "Use letters, digits, '-' and '.'."))
              return
            }
            var pathSpec = pathFields(dig(rewrite, "path"), representative)
            if dig_string(pathSpec, "", "bad") == "cntrl" {
              _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " URLRewrite path contains a control character, which would break the rewritten path",
                "the HTTPRoute is rejected", "the rewrite is not applied", ""))
              return
            }
            if dig_string(pathSpec, "", "bad") == "regex" {
              _ = WebhookRejectOrWarn(route, "InvalidURLRewrite", WebhookOutcomeMessage(
                "HTTPRoute " + namespace + "/" + name + " uses URLRewrite ReplacePrefixMatch on a RegularExpression path match, which has no prefix to replace",
                "the HTTPRoute is rejected", "the rewrite is not applied", "Match on a PathPrefix, or use ReplaceFullPath."))
              return
            }
            publishLine("urlrewrite", key + " " + queryEscape(host) + "|" +
              dig_string(pathSpec, "", "packed"))
          }
          var mirrorTargets = []any{}
          var mirrorPercentages = map[string]bool{}
          for _, filter := range filters {
            var filterType = dig_string(filter, "", "type")
            if filterType == "RequestHeaderModifier" {
              publishModifiers(dig(filter, "requestHeaderModifier"), routeID, "req-rule")
            } else if filterType == "ResponseHeaderModifier" {
              publishModifiers(dig(filter, "responseHeaderModifier"), routeID, "res-rule")
            } else if filterType == "RequestRedirect" && routeKind == "HTTPRoute" {
              publishRedirect(filter, routeID)
            } else if filterType == "URLRewrite" && routeKind == "HTTPRoute" {
              publishRewrite(filter, routeID)
            } else if filterType == "RequestMirror" {
              var mirror = dig(filter, "requestMirror")
              var backendRef = dig(mirror, "backendRef")
              var backendName = dig_string(backendRef, "", "name")
              if backendName == "" { continue }
              var backendNamespace = dig_string(backendRef, namespace, "namespace")
              if backendNamespace == "" { backendNamespace = namespace }
              var backendPort = toint(dig(backendRef, "port") | fallback(80))
              if backendPort < 1 || backendPort > 65535 {
                _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", WebhookOutcomeMessage(
                  "Gateway route " + namespace + "/" + name + " mirrors to port " + tostring(backendPort) + ", outside 1-65535",
                  "the route is rejected", "the mirror is not applied", ""))
                continue
              }
              var target = backendName + "." + backendNamespace + ".svc.cluster.local"
              if !hostOk(target) {
                _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", WebhookOutcomeMessage(
                  "Gateway route " + namespace + "/" + name + " mirrors to '" + backendNamespace + "/" + backendName + "', which is not a DNS name",
                  "the route is rejected", "the mirror is not applied", ""))
                continue
              }
              var scheme = "http"
              var service = resources.services.GetSingle(backendNamespace, backendName)
              if service != nil {
                for _, servicePort := range service.Spec.Ports {
                  if toint(servicePort.Port) == backendPort &&
                    (servicePort.AppProtocol == "https" || servicePort.AppProtocol == "kubernetes.io/https" || servicePort.Name == "https") {
                    scheme = "https"
                  }
                }
              }
              var percentage = 100
              var configuredPercent = dig(mirror, "percent")
              if configuredPercent != nil {
                percentage = toint(configuredPercent)
              } else if dig(mirror, "fraction") != nil {
                var fraction = dig(mirror, "fraction")
                var denominator = toint(dig(fraction, "denominator") | fallback(100))
                if denominator > 0 {
                  percentage = (toint(dig(fraction, "numerator") | fallback(0)) * 100) / denominator
                }
              }
              if percentage < 0 || percentage > 100 {
                _ = WebhookRejectOrWarn(route, "InvalidRequestMirror", WebhookOutcomeMessage(
                  "Gateway route " + namespace + "/" + name + " mirrors " + tostring(percentage) + "% of requests, outside 0-100",
                  "the route is rejected", "the mirror is not applied", ""))
                continue
              }
              mirrorTargets = append(mirrorTargets, map[string]any{
                "entry": scheme + "|" + target + ":" + tostring(backendPort) + "|" +
                  dig_string(routeProps, "2000", "mirrorTimeoutMs") + "|" +
                  dig_string(routeProps, "0", "mirrorRetries"),
                "percentage": percentage,
              })
              mirrorPercentages[tostring(percentage)] = true
            }
          }
          if len(mirrorTargets) > 0 {
            var maxPercentage = 0
            for _, target := range mirrorTargets {
              var percentage = toint(dig(target, "percentage") | fallback(0))
              if percentage > maxPercentage { maxPercentage = percentage }
            }
            publishLine("mirror-pct", routeID + " " + tostring(maxPercentage))
            if len(mirrorPercentages) > 1 {
              for _, target := range mirrorTargets {
                var percentage = toint(dig(target, "percentage") | fallback(0))
                var sampleCondition = ""
                if percentage < 100 {
                  sampleCondition = " { rand(100) -m int lt " + tostring(percentage) + " }"
                }
                publishConfigLine("cfg-mirror-fallback", "http-request set-var(txn.gw_mirror_targets) str(" +
                  dig_string(target, "", "entry") + ";),concat(,txn.gw_mirror_targets,) if { var(txn.gw_rule_id) -m str \"" +
                  routeID + "\" }" + sampleCondition)
              }
            } else {
              var packed = []string{}
              for _, target := range mirrorTargets {
                packed = append(packed, dig_string(target, "", "entry"))
              }
              publishLine("mirror", routeID + " " + queryEscape(join(packed, ";") + ";"))
            }
          }
          var externalAuth = map[string]any{}
          GatewayExternalAuth(route, routeKind, rule, dig(routeProps, "externalAuth"), externalAuth)
          if externalAuth["attached"] == true && externalAuth["error"] != "" {
            publishLine("extauth-error", routeID + " 1")
          } else if externalAuth["attached"] == true {
            publishLine("extauth-url", "gateway/" + routeID + " " + tostring(externalAuth["url"]))
            publishLine("extauth-forward", "gateway/" + routeID + " " + tostring(externalAuth["forward"]))
            var extract = []string{}
            for _, headerAny := range toSlice(externalAuth["responseHeaders"]) {
              var header = tostring(headerAny)
              var lower = toLower(header)
              var variable = "txn.hub.external_auth." + replace(lower, "-", "_")
              var copyCondition = "{ var(txn.gw_extauth) -m bool } { var(txn.gw_rule_id),concat(|" + lower + "),map(" +
                dig_string(routeProps, "", "extauthRespPath") + ") -m found }"
              extract = append(extract, lower)
              publishLine("extauth-resp", routeID + "|" + lower + " 1")
              _ = shared.PublishRanked("cfg-extauth-pass", lower, lower + "\x00" + header,
                "\n      http-request del-header " + header + " if " + copyCondition +
                "\n      http-request set-header " + header + " %[var(" + variable + ")] if " + copyCondition +
                " { var(" + variable + ") -m found } { var(txn.hub.external_auth.allowed) -m bool }")
            }
            publishLine("extauth-extract", "gateway/" + routeID + " " + join(extract, ","))
            _ = shared.PublishRanked("cfg-extauth-args", "host", "host", " hdr_host=req.hdr(host)")
            for _, headerAny := range toSlice(externalAuth["requestHeaders"]) {
              var header = tostring(headerAny)
              _ = shared.PublishRanked("cfg-extauth-args", header, header,
                " hdr_" + replace(header, "-", "_") + "=req.hdr(" + header + ")")
            }
          }
          var timeout = dig_string(rule, "", "timeouts", "backendRequest")
          if timeout != "" {
            var duration, durationErr = parseDuration(timeout)
            if durationErr != nil {
              _ = WebhookRejectOrWarn(route, "InvalidTimeout", WebhookOutcomeMessage(
                "Gateway route " + namespace + "/" + name + " sets timeout '" + timeout + "', which is not a duration",
                "the route is rejected", "the timeout is not applied", "Use a value like 30s or 1m30s."))
            } else if duration == 0 {
              // set-timeout server 0 inherits the default; see docs/site/docs/libraries/gateway.md#timeout-limits.
              publishLine("timeout", routeID + " 2147483647")
            } else if toint(duration.Milliseconds()) <= 0 {
              _ = WebhookRejectOrWarn(route, "InvalidTimeout", WebhookOutcomeMessage(
                "Gateway route " + namespace + "/" + name + " sets timeout '" + timeout + "', which is under a millisecond",
                "the route is rejected", "the timeout is not applied", ""))
            } else {
              publishLine("timeout", routeID + " " + tostring(toint(duration.Milliseconds())))
            }
          }
          var routeLabel = routeKind + " " + namespace + "/" + name
          if retry := dig(rule, "retry"); retry != nil {
            var unsupported = GatewayRetryPolicy(retry, tostring(routeProps["haproxyVersion"]))["unsupported"].([]any)
            if len(unsupported) > 0 {
              recordEvent(route, "RetryCodeUnsupported", routeLabel + " retries on status " + join(unsupported, ", ") +
                ", which HAProxy can't retry on; those responses reach the client without a retry. Remove them from retry.codes.")
            }
            var backoff = dig_string(retry, "", "backoff")
            var backoffDuration, backoffErr = parseDuration(backoff)
            if backoff != "" && (backoffErr != nil || toint(backoffDuration.Milliseconds()) > 0) {
              recordEvent(route, "RetryBackoffUnsupported", routeLabel + " sets retry.backoff " + backoff +
                ", which HAProxy can't enforce; failed requests are retried without waiting. Remove retry.backoff to accept immediate retries.")
            }
          }
          if sp := dig(rule, "sessionPersistence"); sp != nil {
            var persistenceErr = tostring(GatewaySessionPersistence(sp, "")["error"])
            if persistenceErr != "" {
              _ = WebhookRejectOrWarn(route, "InvalidSessionPersistence", WebhookOutcomeMessage(
                routeLabel + " rule " + ruleKey + ": " + persistenceErr,
                "the route is rejected", "the rule gets no session persistence", "Fix sessionPersistence."))
            }
          }
          for _, backendRef := range backendRefs {
            if len(toSlice(dig(backendRef, "filters"))) == 0 { continue }
            var backendKey = routeID + "|" + BackendNameGatewayRule(route, rule, ruleIndex, backendRef)
            for _, filter := range toSlice(dig(backendRef, "filters")) {
              var filterType = dig_string(filter, "", "type")
              if filterType == "RequestHeaderModifier" {
                publishModifiers(dig(filter, "requestHeaderModifier"), backendKey, "req-be")
              } else if filterType == "ResponseHeaderModifier" {
                publishModifiers(dig(filter, "responseHeaderModifier"), backendKey, "res-be")
              } else if filterType == "RequestRedirect" && routeKind == "HTTPRoute" {
                publishRedirect(filter, backendKey)
              } else if filterType == "URLRewrite" && routeKind == "HTTPRoute" {
                publishRewrite(filter, backendKey)
              }
            }
          }
          if needsRuntimePrefix {
            var seenPaths = map[string]bool{}
            for _, entry := range entries {
              var pathType = dig_string(entry, "", "pathType")
              if pathType != "PathPrefix" && pathType != "Exact" { continue }
              var pathValue = dig_string(entry, "", "pathValue")
              if pathType == "PathPrefix" { pathValue = normPrefix(pathValue) }
              if seenPaths[pathType + "\x00" + pathValue] { continue }
              seenPaths[pathType + "\x00" + pathValue] = true
              var injection = ConfigInjectionKind(pathValue, "dquote")
              if injection != "" {
                _ = WebhookRejectOrWarn(route, "InvalidPath", WebhookOutcomeMessage(
                  "HTTPRoute " + namespace + "/" + name + " has a path match containing " + injection + ", which cannot be written to the prefix-length rule",
                  "the HTTPRoute is rejected", "that match keeps the original path", "Remove double quotes and control characters from the path."))
                continue
              }
              var condition = "{ path -m reg \"^" + sanitize_regex(pathValue) + "(/|\\$)\" }"
              if pathType == "Exact" { condition = "{ path -m str \"" + pathValue + "\" }" }
              _ = shared.PublishRanked("cfg-prefix-fallback", routeID + "|" + pathType + "|" + pathValue,
                fixed(len(pathValue)) + "\x00" + routeID + "\x00" + dig_string(entry, "", "allRank"),
                "\nhttp-request set-var(txn.gw_pfxlen) int(" + tostring(len(pathValue)) +
                  ") if { var(txn.gw_rule_id) -m str \"" + routeID + "\" } " + condition)
            }
          }
        }
      %%}
      {%- end macro -%}

  gateway-route-filter-maps-100-http:
    requires: [grpcroutes, httproutes, referencegrants, services]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-http-route-filter-bindings" -}}'
      root: gateway-http-route-post-analysis
      group: gateway-route-filter-maps
      consumes: [gateway-route-analysis]
      effects: [publishValue, recordEvent]
    template: |
      {%- import "util-publish-gateway-route-filter-maps" for PublishGatewayRouteFilterMaps -%}
      {{- PublishGatewayRouteFilterMaps(item, "HTTPRoute", props) -}}

  gateway-route-filter-maps-200-grpc:
    requires: [grpcroutes, httproutes, referencegrants, services]
    incremental:
      bindingsTemplate: '{{- render "util-gateway-grpc-route-filter-bindings" -}}'
      group: gateway-route-filter-maps
      consumes: [gateway-route-analysis]
      effects: [publishValue, recordEvent]
    template: |
      {%- import "util-publish-gateway-route-filter-maps" for PublishGatewayRouteFilterMaps -%}
      {{- PublishGatewayRouteFilterMaps(item, "GRPCRoute", props) -}}

  util-gateway-route-filter-publications:
    requires: [gateways, grpcroutes, httproutes]
    template: |-
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "map-hostvalues-490-gateway-port-scopes" -}}
      {{- render "gateway-route-candidates-100-http" -}}
      {{- render "gateway-route-candidates-200-grpc" -}}
      {{- render "gateway-route-analysis-100-http" -}}
      {{- render "gateway-route-analysis-200-grpc" -}}
      {{- render "gateway-route-filter-maps-100-http" -}}
      {{- render "gateway-route-filter-maps-200-grpc" -}}

  util-register-gateway-route-map:
    template: |-
      {%- macro RegisterGatewayRouteMap(name string, header string, cell string) string -%}
      {%%
        var content = header + "\n" + incremental_ranked_fragments("gateway-route-filter-maps", cell)
        var path, registerErr = fileRegistry.Register("map", name, content)
        if registerErr != nil { fail(tostring(registerErr)) }
        var metadataErr = planRegistry.MapMeta(name, false)
        if metadataErr != nil { fail(tostring(metadataErr)) }
        show path
      %%}
      {%- end macro -%}

  util-gateway-route-maps:
    requires: [gateways, grpcroutes, httproutes]
    template: |-
      {%- import "util-register-gateway-route-map" for RegisterGatewayRouteMap -%}
      {{- render "util-gateway-route-filter-publications" -}}
      {%%
        var _, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any {
          return map[string]any{
            "reqPath": RegisterGatewayRouteMap("gw-reqhdr.map", "# <rule_id>[|<backend>]|set|add|del|<header> -> URL-encoded value", "req"),
            "resPath": RegisterGatewayRouteMap("gw-reshdr.map", "# <rule_id>[|<backend>]|set|add|del|<header> -> URL-encoded value", "res"),
            "redirectPath": RegisterGatewayRouteMap("gw-redirect.map", "# <rule_id>[|<backend>] -> code|scheme|host|port|pathmode|pfxlen|path", "redirect"),
            "urlrewritePath": RegisterGatewayRouteMap("gw-urlrewrite.map", "# <rule_id>[|<backend>] -> host|pathmode|pfxlen|path", "urlrewrite"),
            "timeoutPath": RegisterGatewayRouteMap("gw-timeout.map", "# <rule_id> -> server inactivity timeout in ms", "timeout"),
            "mirrorPath": RegisterGatewayRouteMap("gw-mirror.map", "# <rule_id> -> scheme|host:port|timeout_ms|retries;... (URL-encoded)", "mirror"),
            "mirrorPctPath": RegisterGatewayRouteMap("gw-mirror-pct.map", "# <rule_id> -> mirror sampling percentage", "mirror-pct"),
            "extauthErrorPath": RegisterGatewayRouteMap("gw-extauth-errors.map", "# <rule_id> -> 1 when its ExternalAuth filter cannot be enforced", "extauth-error"),
            "extauthRespPath": RegisterGatewayRouteMap("gw-extauth-response.map", "# <rule_id>|<header> -> 1 when ExternalAuth copies that header", "extauth-resp"),
          }
        })
      %%}

  # Registers the maps in the features phase, so they exist before any frontend
  # renders — frontend-filters-* render once per frontend and must not each
  # build their own copy.
  features-500-gateway-route-maps:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}

  # One snippet for every filter whose value comes out of a map, because the
  # order between them is a contract rather than a coincidence of how four
  # snippet names sorted: the per-match prefix lengths have to be set before the
  # redirect and rewrite blocks read txn.gw_pfxlen, and a backendRef-level header
  # modifier has to run after the rule-level one it overrides — which the old
  # placement (rule-level in the frontend, backendRef-level in the backend) got
  # backwards for responses, since HAProxy evaluates a backend's http-response
  # rules first.
  frontend-filters-495-gateway-route-filters:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var gwm = gwmVal.(map[string]any) %}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-prefix-fallback") -}}
      # gateway/frontend-filters-gateway-headers
      {%- if extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) %}
      http-request set-var(txn.filters_applied) str(RequestHeaderModifier) if { var(txn.gw_rule_id),concat(|any),map({{ tostring(gwm["reqPath"]) }}) -m found } !{ var(txn.filters_applied) -m found }
      http-request set-var(txn.filters_applied) str(ResponseHeaderModifier) if { var(txn.gw_rule_id),concat(|any),map({{ tostring(gwm["resPath"]) }}) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-rule-set") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-rule-add") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-rule-del") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-rule-set") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-rule-add") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-rule-del") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-be-set") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-be-add") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-req-be-del") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-be-set") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-be-add") -}}
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-res-be-del") -}}
      {%- var debug = extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false) %}
      {#- The redirect, rewrite and mirror blocks exist only while a route
          carries that filter; the first one reloads once, as does removing
          the last. #}
      {%- if incremental_ranked_fragment_bytes("gateway-route-filter-maps", "redirect") > 0 %}
      {%- var redirMap = tostring(gwm["redirectPath"]) %}
      {#- Fallbacks are the pod-internal 8080/8443 (chart-wide convention);
          extraContext.httpPort/httpsPort is always plumbed in production. -#}
      {%- var httpPort = toint(extraContext | dig("httpPort") | fallback(8080)) %}
      {%- var httpsPort = toint(extraContext | dig("httpsPort") | fallback(8443)) %}
      # gateway/frontend-filters-gateway-redirect
      {# The backendRef-level entry is read first so a rule-level entry, read last, overrides it. #}
      http-request set-var(txn.gw_redir) var(txn.gw_rule_id),concat(|,txn.backend_name,),map({{ redirMap }}) if { var(txn.gw_rule_id),concat(|,txn.backend_name,),map({{ redirMap }}) -m found }
      http-request set-var(txn.gw_redir) var(txn.gw_rule_id),map({{ redirMap }}) if { var(txn.gw_rule_id),map({{ redirMap }}) -m found }
      {# Spec: an unset spec.scheme MUST keep the request's scheme, not downgrade. #}
      http-request set-var(txn.gw_redir_scheme) var(txn.gw_redir),field(2,|) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_scheme) str(http) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_scheme) -m len 0 } !{ ssl_fc }
      http-request set-var(txn.gw_redir_scheme) str(https) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_scheme) -m len 0 } { ssl_fc }
      http-request set-var(txn.gw_redir_host) var(txn.gw_redir),field(3,|),url_dec(1) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_host) req.hdr(Host),field(1,:) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_host) -m len 0 }
      {# "L" means both scheme and port were unset, so Location carries the Gateway
         listener port, resolved per request because one route can serve several.
         txn.gw_listener_port, not txn.listener_port or dst_port: on the
         per-Gateway-IP path those are the allocated pod port (e.g. 18000). #}
      http-request set-var(txn.gw_redir_port) var(txn.gw_redir),field(4,|) if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_port) str() if { var(txn.gw_redir_port) -m str L } { var(txn.gw_listener_port) -m int {{ httpPort }} } !{ ssl_fc }
      http-request set-var(txn.gw_redir_port) str() if { var(txn.gw_redir_port) -m str L } { var(txn.gw_listener_port) -m int {{ httpsPort }} } { ssl_fc }
      http-request set-var(txn.gw_redir_port) str(:),concat(,txn.gw_listener_port,) if { var(txn.gw_redir_port) -m str L }
      {# A stored pfxlen of "M" defers to the per-match lines of
         frontend-filters-495-gateway-route-filters. #}
      http-request set-var(txn.gw_pfxlen) var(txn.gw_redir),field(6,|),add(0) if { var(txn.gw_redir),field(5,|) -m str P } !{ var(txn.gw_redir),field(6,|) -m str M }
      http-request set-var(txn.gw_redir_rest) path,bytes(txn.gw_pfxlen) if { var(txn.gw_redir),field(5,|) -m str P }
      {# A prefix of "/" strips nothing, so the whole path is the remainder — but
         the request path "/" must then yield the replacement itself, not
         "<replacement>/". #}
      http-request set-var(txn.gw_redir_rest) str() if { var(txn.gw_pfxlen) -m int 0 } { var(txn.gw_redir_rest) -m str / }
      http-request set-var(txn.gw_redir_path) path if { var(txn.gw_redir) -m found }
      http-request set-var(txn.gw_redir_path) var(txn.gw_redir),field(7,|),url_dec(1) if { var(txn.gw_redir),field(5,|) -m str F }
      http-request set-var(txn.gw_redir_path) var(txn.gw_redir),field(7,|),url_dec(1),concat(,txn.gw_redir_rest,) if { var(txn.gw_redir),field(5,|) -m str P }
      http-request set-var(txn.gw_redir_path) str(/) if { var(txn.gw_redir) -m found } { var(txn.gw_redir_path) -m len 0 }
      {# The query the request arrived with, kept across the redirect: HAProxy's
         own `keep-query` does not exist on 3.0. #}
      http-request set-var(txn.gw_redir_query) pathq,regsub(^[^?]*,) if { var(txn.gw_redir) -m found }
      {%- if debug %}
      http-request set-var(txn.filters_applied) str(RequestRedirect) if { var(txn.gw_redir) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}

      {%- end %}
      {%- if incremental_ranked_fragment_bytes("gateway-route-filter-maps", "urlrewrite") > 0 %}
      {%- var rwMap = tostring(gwm["urlrewritePath"]) %}
      # gateway/frontend-filters-gateway-urlrewrite
      http-request set-var(txn.gw_rw) var(txn.gw_rule_id),concat(|,txn.backend_name,),map({{ rwMap }}) if { var(txn.gw_rule_id),concat(|,txn.backend_name,),map({{ rwMap }}) -m found }
      http-request set-var(txn.gw_rw) var(txn.gw_rule_id),map({{ rwMap }}) if { var(txn.gw_rule_id),map({{ rwMap }}) -m found }
      http-request set-header Host %[var(txn.gw_rw),field(1,|),url_dec(1)] if { var(txn.gw_rw) -m found } !{ var(txn.gw_rw),field(1,|) -m len 0 }
      http-request set-var(txn.gw_pfxlen) var(txn.gw_rw),field(3,|),add(0) if { var(txn.gw_rw),field(2,|) -m str P } !{ var(txn.gw_rw),field(3,|) -m str M }
      http-request set-var(txn.gw_rw_rest) path,bytes(txn.gw_pfxlen) if { var(txn.gw_rw),field(2,|) -m str P }
      http-request set-var(txn.gw_rw_rest) str() if { var(txn.gw_pfxlen) -m int 0 } { var(txn.gw_rw_rest) -m str / }
      http-request set-var(txn.gw_rw_path) var(txn.gw_rw),field(4,|),url_dec(1) if { var(txn.gw_rw),field(2,|) -m str F }
      http-request set-var(txn.gw_rw_path) var(txn.gw_rw),field(4,|),url_dec(1),concat(,txn.gw_rw_rest,) if { var(txn.gw_rw),field(2,|) -m str P }
      http-request set-var(txn.gw_rw_path) str(/) if { var(txn.gw_rw) -m found } { var(txn.gw_rw_path) -m len 0 }
      http-request set-path %[var(txn.gw_rw_path)] if { var(txn.gw_rw_path) -m found }
      {%- if debug %}
      http-request set-var(txn.filters_applied) str(URLRewrite) if { var(txn.gw_rw) -m found } !{ var(txn.filters_applied) -m found }
      {%- end %}
      {%- end %}

  # Appends `scheme|host:port|timeout_ms|retries` entries to txn.gw_mirror_targets.
  # One static SPOE message + mirror-group carries the whole list — HAProxy runs a
  # group at most once per stream and the plugin (mirror v0.6.0+) fans out to every
  # entry — so spoe.conf never changes when routes do.
  # frontend-filters-950-spoa-hub-mirror-fire fires the group after the appends.
  frontend-filters-550-gateway-mirror:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var gwm = gwmVal.(map[string]any) %}
      {%- var m = tostring(gwm["mirrorPath"]) %}
      {%- var pctMap = tostring(gwm["mirrorPctPath"]) %}
      {%- if incremental_ranked_fragment_bytes("gateway-route-filter-maps", "mirror") > 0 || incremental_ranked_fragment_bytes("gateway-route-filter-maps", "cfg-mirror-fallback") > 0 %}
      # gateway/frontend-filters-gateway-mirror
      http-request set-var(txn.gw_mirror_pct) var(txn.gw_rule_id),map_str_int({{ pctMap }}) if { var(txn.gw_rule_id),map_str_int({{ pctMap }}) -m found }
      {# rand(100) draws 0..99, so 100% always samples and 0% never does. #}
      http-request set-var(txn.gw_mirror_targets) var(txn.gw_rule_id),map({{ m }}),url_dec(1) if { var(txn.gw_rule_id),map({{ m }}) -m found } { rand(100),sub(txn.gw_mirror_pct) -m int lt 0 }
      {{- incremental_ranked_text_fragment("gateway-route-filter-maps", "cfg-mirror-fallback") -}}
      {%- end %}

  frontend-filters-951-gateway-redirect:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- if incremental_ranked_fragment_bytes("gateway-route-filter-maps", "redirect") > 0 %}
      {# The code must be a literal (HAProxy rejects an expression there), so every
         code Gateway API expresses gets one line — a fixed five, whatever the
         routes do. #}
      {%- for _, code := range []string{"301", "302", "303", "307", "308"} %}
      http-request redirect location "%[var(txn.gw_redir_scheme)]://%[var(txn.gw_redir_host)]%[var(txn.gw_redir_port)]%[var(txn.gw_redir_path)]%[var(txn.gw_redir_query)]" code {{ code }} if { var(txn.gw_redir),field(1,|) -m str {{ code }} }
      {%- end %}
      {%- end %}
