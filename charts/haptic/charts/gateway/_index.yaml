# Gateway API Template Library
#
# Provides Kubernetes Gateway API v1 (Standard channel) support, plus TLSRoute
# (Standard as of v1.5) and TCPRoute (Experimental channel, resolved at runtime).
# Documentation: ../docs/libraries/gateway.md
#
# Resources: GatewayClass, Gateway, HTTPRoute, GRPCRoute, TLSRoute, TCPRoute,
#   ReferenceGrant, BackendTLSPolicy, ListenerSet (GEP-1713).
#
# Features:
#   - HTTPRoute matching: path (Exact/PathPrefix/RegularExpression), header
#     (Exact/RegularExpression), query param, method
#   - GRPCRoute matching: service/method (Exact/RegularExpression), headers
#   - Filters: RequestHeaderModifier, ResponseHeaderModifier, RequestRedirect,
#     URLRewrite (ReplaceFullPath/ReplacePrefixMatch), RequestMirror (via the
#     SPOA-hub mirror plugin), CORS (GEP-1767), ExternalAuth (HTTP, via the
#     SPOA-hub external-auth plugin), ExtensionRef
#   - Traffic splitting: weighted backends (HTTPRoute, GRPCRoute, TLSRoute, TCPRoute)
#   - Backend inactivity timeouts (backendRequest), retries (GEP-1731:
#     attempts + retry-on codes; backoff isn't expressible in HAProxy),
#     session persistence (GEP-1619, type Cookie and Header)
#   - TLS: listener Terminate + Passthrough (TLSRoute SNI), per-listener TLS
#     options (GEP-2907: min/max version, ciphers), BackendTLSPolicy (CA refs
#     via Secret/ConfigMap, hostname + SAN verification, well-known/system CAs)
#   - Cross-namespace refs via ReferenceGrant; allowedRoutes kinds + namespaces
#     (incl. namespace Selector); Gateway spec.addresses (static-IP binds) and
#     spec.infrastructure metadata propagation
#   - Status conditions for Gateway, *Route, GatewayClass, BackendTLSPolicy,
#     ListenerSet
#
# Architecture:
#   - util-gateway-analysis: Central cached analysis of all routes
#   - Sharded generation: Automatic parallel processing for large route sets
#   - Extension points: frontend-matchers-advanced-*, frontend-filters-*

# Chart-time loading rules (consumed by haptic.prepareLibraries; stripped from output).
#
# The library loads whenever the operator enables it — there is NO
# .Capabilities gate anymore. Availability of the Gateway API CRDs is a
# RUNTIME question: every gateway watchedResources entry below is
# `optional: true` with an ordered `apiVersions` candidate list, and the
# controller resolves each entry against live apiserver discovery at
# iteration start. Kinds whose CRD is not served (at any candidate version)
# are dropped together with every templateSnippet / validationTest whose
# `requires` names them; a CRD watch re-resolves on install/upgrade/removal,
# so features activate or retire at runtime with no helm operation.
#
# Snippet/test discipline: a snippet that references `resources.<kind>`
# (typed access or List()) or imports a typed <kind> macro MUST declare
# `requires: [<kind>, ...]` — its transitive imports/renders included.
# Snippets that must survive a strip reach stripped kinds only through
# compile-safe seams: `render "..." default ""`, `render_glob` extension
# points, or shared-state read-backs. Never a direct typed reference.
_helm_load:
  enable: '{{ .Values.controller.templateLibraries.gateway.enabled }}'
  inject:
    - path: watchedResources.gateways.fieldSelector
      value: 'spec.gatewayClassName={{ .Values.gatewayClass.name }}'
    - path: watchedResources.gatewayclasses.fieldSelector
      value: 'spec.controllerName={{ .Values.gatewayClass.controllerName }}'

watchedResources:
  gatewayclasses:
    # v1 since Gateway API v1.0; v1beta1 served continuously since v0.5.
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1beta1]
    optional: true
    resources: gatewayclasses
    # GatewayClass is cluster-scoped, so no namespace key. metadata.name is
    # globally unique already; indexing by name lets the templates look up
    # the matching class without scanning the whole list.
    indexBy: ["metadata.name"]
    # Admission stays off: the controller emits this GatewayClass's spec itself
    # via k8sResources SSA (see 80-k8s-resources.yaml), so an admission rule on
    # gatewayclasses CREATE/UPDATE would intercept the controller's own write —
    # circular, and pointless since the object it would check is one it rendered.
    enableValidationWebhook: false
    statusPatch: true
    # fieldSelector: injected by Helm to scope to GatewayClasses we own
    # (spec.controllerName == .Values.gatewayClass.controllerName).

  gateways:
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1beta1]
    optional: true
    resources: gateways
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # The controller writes this counter on every route change and reads it
    # nowhere; every route reads its Gateway, so the write's echo would
    # otherwise re-render them all.
    ignoreFields: ["status.listeners[*].attachedRoutes"]
    # fieldSelector: injected by Helm from gatewayClass.name

  httproutes:
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1beta1]
    optional: true
    resources: httproutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true
    # Filter by Gateway reference using label selector
    # Users can label HTTPRoutes to target specific Gateways
    # Example: kubectl label httproute my-route gateway=haproxy

  grpcroutes:
    # v1 standard since Gateway API v1.1; v1alpha2 (experimental channel)
    # before — schema-compatible, served until v1.2 removed it.
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1alpha2]
    optional: true
    resources: grpcroutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  tlsroutes:
    # v1 standard since Gateway API v1.5; experimental v1alpha3 (v1.4+) and
    # v1alpha2 (v0.5+) before — validation-tightening deltas only, field
    # names identical across all three.
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1alpha3, gateway.networking.k8s.io/v1alpha2]
    optional: true
    resources: tlsroutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  tcproutes:
    # v1 standard since Gateway API v1.6; experimental v1alpha2 before.
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1alpha2]
    optional: true
    resources: tcproutes
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  namespaces:
    apiVersion: v1
    resources: namespaces
    # Cluster-scoped; metadata.name is globally unique. Watched so the
    # listener-attachment evaluator can resolve `allowedRoutes.namespaces.from:
    # Selector` against namespace labels (per Gateway API spec). Without this
    # the chart can't tell whether a route's namespace matches the listener's
    # namespace selector and the listener's `attachedRoutes` count drifts
    # from what conformance expects.
    indexBy: ["metadata.name"]

  referencegrants:
    # v1 served since Gateway API v1.5; v1beta1 continuously since v0.6
    # (storage version to this day — no retirement scheduled).
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1beta1]
    optional: true
    resources: referencegrants
    # ReferenceGrant lives in the namespace that GRANTS access. Index by
    # namespace+name so the cert/backend-ref validators can list grants
    # in a target namespace efficiently. Per Gateway API spec, a
    # cross-namespace cert ref or backendRef is permitted iff a
    # ReferenceGrant in the TARGET namespace lists the source's
    # group/kind/namespace under spec.from and the target's group/kind
    # (and optional name) under spec.to.
    indexBy: ["metadata.namespace", "metadata.name"]

  listenersets:
    # v1 since Gateway API v1.5 (its predecessor XListenerSet lived in the
    # gateway.networking.x-k8s.io group with a different plural — deliberately
    # out of scope).
    apiVersions: [gateway.networking.k8s.io/v1]
    optional: true
    resources: listenersets
    # ListenerSet (GEP-1713) lets users add listeners to a Gateway from
    # a separate resource — designed for shared-frontend dataplanes
    # (which is haptic's exact architecture). Indexed by namespace +
    # name so incremental components and route parentRefs resolve one exact
    # ListenerSet without scanning the watched store.
    indexBy: ["metadata.namespace", "metadata.name"]
    statusPatch: true
    # Same counter echo as gateways.
    ignoreFields: ["status.listeners[*].attachedRoutes"]

  backendtlspolicies:
    # v1 standard since Gateway API v1.4; experimental v1alpha3 (v1.1-1.3)
    # before. v1alpha2 (v1.0) is DELIBERATELY excluded: incompatible shape
    # (targetRef->targetRefs, tls->validation renames), never co-served.
    apiVersions: [gateway.networking.k8s.io/v1, gateway.networking.k8s.io/v1alpha3]
    optional: true
    resources: backendtlspolicies
    indexBy: ["metadata.namespace", "metadata.name"]
    enableValidationWebhook: true
    statusPatch: true

  configmaps:
    apiVersion: v1
    resources: configmaps
    # Resolves BackendTLSPolicy CACertificateRefs and HAProxyRoutePolicy
    # sourceAddress ConfigMap references.
    indexBy: ["metadata.namespace", "metadata.name"]
    # This is an unscoped cluster-wide watch, but the chart only ever reads a
    # handful of ConfigMaps by name (GetSingle) for CA bundles — it never
    # List()s them. Keeping every cluster ConfigMap body resident in a full
    # MemoryStore is pure overhead, so use on-demand (CachedStore): only
    # references stay resident and bodies are fetched live on access. Combined
    # with informer body projection (ADR-0012), even the informer cache drops
    # the bodies. Same access profile as the secrets watch.
    store: on-demand
