templateSnippets:
  frontend-routing-host-match-100-gateway:
    requires: [gateways]
    template: |
      {%- var mapPath = func(name string) string { p, _ := pathResolver.GetPath(name, "map"); return p } -%}
      http-request set-var(txn.gw_host_scope) var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) if { var(txn.dst_port),map({{ mapPath("pod-listener-port.map") }}) -m found }
      http-request set-var(txn.host_match) var(txn.host),concat(:,txn.gw_host_scope,),map({{ mapPath("host.map") }},'') if { var(txn.gw_host_scope) -m found }
      http-request set-var(txn.host_match) var(txn.host),regsub(^[^.]*,,),concat(:,txn.gw_host_scope,),map({{ mapPath("host.map") }},'') if { var(txn.gw_host_scope) -m found } { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) var(txn.host),concat(:,txn.gw_host_scope,),map_reg({{ mapPath("host-regex.map") }},'') if { var(txn.gw_host_scope) -m found } { var(txn.host_match) -m len 0 }
      http-request set-var(txn.host_match) str(:),concat(,txn.gw_host_scope,) if { var(txn.gw_host_scope) -m found } { var(txn.host_match) -m len 0 }

  frontend-routing-owner-500-gateway:
    template: |-
      http-request set-var(txn.resource_namespace) var(txn.gw_rule_id),field(2,_) if { var(txn.gw_rule_id) -m found }
      http-request set-var(txn.resource_name) var(txn.gw_rule_id),field(3,_) if { var(txn.gw_rule_id) -m found }
      http-request set-var(txn.resource_key) str(gateway/),concat(,txn.gw_rule_id) if { var(txn.gw_rule_id) -m found }

  gateway-listener-hostname-claims-100-gateway:
    requires: [gateways]
    incremental:
      source: gateways
      group: gateway-listener-hostname-claims
      optionalConsumes: [gateway-host-listenersets]
      effects: [publishValue]
    template: |-
      {%%
        var gatewayNamespace = dig_string(item, "", "metadata", "namespace")
        var gatewayName = dig_string(item, "", "metadata", "name")
        var gateway = resources.gateways.GetSingle(gatewayNamespace, gatewayName)
        if gateway != nil {
          _ = shared.Publish("present", "any", true)
          var winningProtocolByPort = map[int]string{}
          var claimedHostnameByPort = map[string]bool{}
          var claimListener = func(listener any) bool {
            var port = toint(dig(listener, "port") | fallback(0))
            if port <= 0 { return false }
            var protocol = dig_string(listener, "HTTP", "protocol")
            if protocol == "" { protocol = "HTTP" }
            var winningProtocol, claimedPort = winningProtocolByPort[port]
            if !claimedPort {
              winningProtocolByPort[port] = protocol
            } else if winningProtocol != protocol {
              return false
            }
            var hostname = dig_string(listener, "", "hostname")
            var hostnameKey = tostring(port) + "|" + hostname
            if claimedHostnameByPort[hostnameKey] { return false }
            claimedHostnameByPort[hostnameKey] = true
            if protocol != "HTTPS" && protocol != "TLS" { return true }
            if hostname == "" || hostname == "*" {
              var gatewayKey = gatewayNamespace + "/" + gatewayName
              _ = shared.PublishRanked("regex", "catchall:" + gatewayKey,
                "1/" + gatewayKey, "^.*$ catchall:" + gatewayKey + "\n")
            } else if hasPrefix(hostname, "*.") {
              var suffix = hostname[2:]
              var regexBase = tostring(replace(suffix, ".", "\\."))
              _ = shared.PublishRanked("regex", hostname, "0/" + hostname,
                "^[^.]+\\." + regexBase + "$ " + hostname + "\n")
            } else {
              _ = shared.PublishRanked("exact", hostname, hostname,
                hostname + " " + hostname + "\n")
            }
            return true
          }
          for _, listener := range gateway.Spec.Listeners {
            claimListener(listener)
          }
          var listenerSets = shared.SelectValues("gateway-host-listenersets",
            "gateway\x00" + gatewayNamespace + "\x00" + gatewayName)
          var sortedListenerSets = listenerSets | sort_by([]string{"$.rank"})
          for _, listenerSet := range sortedListenerSets {
            if tostring(dig(listenerSet, "accepted") | fallback(false)) != "true" { continue }
            for _, listener := range toSlice(dig(listenerSet, "candidates")) {
              claimListener(listener)
            }
          }
        }
      %%}

  util-gateway-listener-hostname-claim-publications:
    requires: [gateways]
    template: |-
      {{- render "map-hostvalues-479-gateway-listenersets-empty" -}}
      {{- render "map-hostvalues-480-gateway-listenersets" default "" -}}
      {{- render "gateway-listener-hostname-claims-100-gateway" -}}

  # Emitted only while a Gateway claims a hostname; the first one reloads
  # once, as does removing the last.
  frontend-extra-100-gateway-misdirected:
    requires: [gateways, referencegrants]
    template: |
      {{- render "util-gateway-listener-hostname-claim-publications" -}}
      {%- if incremental_value_count("gateway-listener-hostname-claims", "present") > 0 -%}
      {%- var exactContent = incremental_ranked_fragments("gateway-listener-hostname-claims", "exact") -%}
      {%- var regexContent = incremental_ranked_fragments("gateway-listener-hostname-claims", "regex") -%}
      {%- if exactContent == "" %}{%- exactContent = "\n" %}{%- end -%}
      {%- if regexContent == "" %}{%- regexContent = "\n" %}{%- end -%}
      {%- var exactPath, _ = fileRegistry.Register("map", "listener-hostname-claim.map", exactContent) %}
      {%- var regexPath, _ = fileRegistry.Register("map", "listener-hostname-claim-regex.map", regexContent) %}
      # gateway/frontend-extra-misdirected
      http-request set-var(txn.gw_host_canonical) req.fhdr(Host),lower,field(1,:)
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map({{ exactPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 }
      http-request set-var(txn.gw_sni_listener) ssl_fc_sni,lower,map_reg({{ regexPath }},'') if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_sni_listener) -m len 0 }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map({{ exactPath }},'') if { var(txn.gw_host_canonical) -m found }
      http-request set-var(txn.gw_host_listener) var(txn.gw_host_canonical),map_reg({{ regexPath }},'') if { var(txn.gw_host_canonical) -m found } { var(txn.gw_host_listener) -m len 0 }
      {# The `^.*$ catchall:` markers keep gw_sni_listener non-empty for a Gateway with a
          hostname-less listener; without them the `len 0` gate kills the 421 that conformance
          HTTPRouteHTTPSListenerDetectMisdirectedRequests requires. The gate then only fires for
          orphan TLS (SNI matches no Gateway), where a 421 would mis-flag the request. #}
      # 421: SNI matched one listener but the Host belongs to a different one (misdirected request).
      {# A second 421 source (cache-origin frontend) makes `frontend` alone ambiguous in
          the access log. The condition must stay byte-identical to the return below. #}
      http-request set-var(txn.denied_by) str(gw_sni_host_mismatch) if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_host_canonical) -m found } !{ var(txn.gw_sni_listener) -m len 0 } !{ var(txn.gw_sni_listener),strcmp(txn.gw_host_listener) eq 0 }
      http-request return status 421 if { ssl_fc } { ssl_fc_has_sni 1 } { var(txn.gw_host_canonical) -m found } !{ var(txn.gw_sni_listener) -m len 0 } !{ var(txn.gw_sni_listener),strcmp(txn.gw_host_listener) eq 0 }
      {%- end %}

  log-fields-500-gateway:
    requires: [gateways]
    template: |-
      {# txn.gw_rule_id (<kind>_<ns>_<name>_<ruleIdx>) comes from frontend-matchers-advanced-500-gateway;
          gated on Gateways existing so an Ingress-only install has no permanently-empty log key. #}
      {{- render "util-gateway-listener-hostname-claim-publications" -}}
      {%- if incremental_value_count("gateway-listener-hostname-claims", "present") > 0 %}
      %(gw_route)[var(txn.gw_rule_id)]
      {%- end %}

  # This block and 900 exist only while an HTTPRoute or GRPCRoute does; the
  # first route reloads once, as does removing the last.
  frontend-matchers-advanced-010-route-id-setup:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-frontend-publications" -}}
      {%- if incremental_value_count("gateway-route-candidates", "presence-http") > 0 || incremental_value_count("gateway-route-candidates", "presence-grpc") > 0 -%}
      {# txn.path_match qualifier format: GW_ROUTE_ID:<route_type>:<routeIds>, e.g. GW_ROUTE_ID:http:h_ns1_route1_0__h_ns2_route2_1 #}
      # gateway/frontend-matchers-advanced-010-route-id-setup
      http-request set-var(req.gw_route_type) var(txn.path_match),field(2,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }
      http-request set-var(req.gw_routeId) var(txn.path_match),field(3,:) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID }
      {%- end %}

  util-gateway-route-frontend-bindings:
    template: |-
      {%- var GatewayRouteFrontendProps = func() map[string]any {
        return map[string]any{
          "debug": extraContext | dig("diagnostics", "routingHeaders", "enabled") | fallback(false),
        }
      } -%}

  util-gateway-http-route-frontend-bindings:
    template: |-
      {%- import "util-gateway-route-frontend-bindings" for GatewayRouteFrontendProps -%}
      {{- toJSON(map[string]any{"httproutes": GatewayRouteFrontendProps()}) -}}

  util-gateway-grpc-route-frontend-bindings:
    template: |-
      {%- import "util-gateway-route-frontend-bindings" for GatewayRouteFrontendProps -%}
      {{- toJSON(map[string]any{"grpcroutes": GatewayRouteFrontendProps()}) -}}

  util-publish-gateway-route-frontend:
    requires: [grpcroutes, httproutes, referencegrants, services]
    template: |
      {%- import "util-gateway-route-identity" for GatewayRoutePrefix -%}
      {%- import "util-host-key" for MapKeyForHost -%}
      {%- import "util-backend-name-gateway-rule" for BackendNameGatewayRule -%}
      {%- import "util-backend-ref-valid" for BackendRefValid -%}
      {%- import "util-webhook-reject-or-warn" for WebhookRejectOrWarn -%}
      {%- import "util-config-value-injection" for ConfigValueInjection -%}
      {%- import "util-config-injection-kind" for ConfigInjectionKind -%}
      {%- import "util-escape-logformat-value" for EscapeLogFormatValue -%}
      {%- macro PublishGatewayRouteFrontend(route any, routeKind string, routeProps map[string]any) -%}
      {%%
        var namespace = dig_string(route, "", "metadata", "namespace")
        var name = dig_string(route, "", "metadata", "name")
        var routeKey = routeKind + "/" + namespace + "/" + name
        var routeIndex, foundRoute = shared.Select("gateway-route-analysis", "routes", routeKey)
        if !foundRoute { return }
        var entries = []any{}
        for _, entryIDAny := range toSlice(dig(routeIndex, "entries")) {
          var entry, foundEntry = shared.Select(
            "gateway-route-analysis", "entries", tostring(entryIDAny))
          if foundEntry { entries = append(entries, entry) }
        }
        var rules = toSlice(dig(route, "spec", "rules"))
        for _, entry := range entries {
          var entryID = dig_string(entry, "", "entryID")
          var routeID = dig_string(entry, "", "routeId")
          var conflictGroup = dig_string(entry, "", "conflictGroup")
          var ruleIndex = toint(dig(entry, "ruleIdx") | fallback(0))
          var matchIndex = toint(dig(entry, "matchIdx") | fallback(0))
          if ruleIndex < 0 || ruleIndex >= len(rules) { continue }
          var rule = rules[ruleIndex]
          var matches = toSlice(dig(rule, "matches"))
          var match any = nil
          if matchIndex >= 0 && matchIndex < len(matches) { match = matches[matchIndex] }
          var advancedScope = tostring(dig(entry, "advancedScope") | fallback(false)) == "true"
          if advancedScope {
            var hostnamePrecedence = tostring(dig(entry, "hostnamePrecedence") | fallback(false)) == "true"
            var pathType = dig_string(entry, "PathPrefix", "pathType")
            var pathValue = dig_string(entry, "/", "pathValue")
            var hasMethod = false
            var method = ""
            var headerSpecs = []any{}
            var parameterSpecs = []any{}
            var hasGRPCMethod = false
            var grpcService = ""
            var grpcMethod = ""
            var grpcType = "Exact"
            if match != nil {
              if routeKind == "HTTPRoute" {
                method = dig_string(match, "", "method")
                hasMethod = method != ""
                for _, header := range toSlice(dig(match, "headers")) {
                  var headerType = dig_string(header, "Exact", "type")
                  if headerType == "" { headerType = "Exact" }
                  headerSpecs = append(headerSpecs, map[string]any{
                    "type": headerType,
                    "name": dig_string(header, "", "name"),
                    "value": dig_string(header, "", "value"),
                  })
                }
                for _, parameter := range toSlice(dig(match, "queryParams")) {
                  var parameterType = dig_string(parameter, "Exact", "type")
                  if parameterType == "" { parameterType = "Exact" }
                  parameterSpecs = append(parameterSpecs, map[string]any{
                    "type": parameterType,
                    "name": dig_string(parameter, "", "name"),
                    "value": dig_string(parameter, "", "value"),
                  })
                }
              } else {
                grpcService = dig_string(match, "", "method", "service")
                grpcMethod = dig_string(match, "", "method", "method")
                grpcType = dig_string(match, "Exact", "method", "type")
                if grpcType == "" { grpcType = "Exact" }
                hasGRPCMethod = grpcService != ""
                for _, header := range toSlice(dig(match, "headers")) {
                  var headerType = dig_string(header, "Exact", "type")
                  if headerType == "" { headerType = "Exact" }
                  headerSpecs = append(headerSpecs, map[string]any{
                    "type": headerType,
                    "name": dig_string(header, "", "name"),
                    "value": dig_string(header, "", "value"),
                  })
                }
              }
            }
            var pathOnly = !hasMethod && len(headerSpecs) == 0 && len(parameterSpecs) == 0 && !hasGRPCMethod
            var matchValues = []any{}
            if pathOnly || hostnamePrecedence { matchValues = append(matchValues, pathValue) }
            for _, header := range headerSpecs { matchValues = append(matchValues, dig_string(header, "", "value")) }
            for _, parameter := range parameterSpecs { matchValues = append(matchValues, dig_string(parameter, "", "value")) }
            if hasGRPCMethod { matchValues = append(matchValues, grpcService, grpcMethod) }
            var matchInjection = ""
            for _, value := range matchValues {
              if matchInjection == "" { matchInjection = ConfigValueInjection(tostring(value)) }
            }
            if matchInjection != "" {
              _ = WebhookRejectOrWarn(route, "InvalidMatch", routeKind + " " + namespace + "/" + name + " has a match value containing " + matchInjection + ", which would break out of its routing ACL; the route is not applied. Remove double quotes and control characters from the match value.")
            } else {
              var conditions = []string{"!{ var(txn.gw_rule_id) -m found }"}
              if (pathOnly || hostnamePrecedence) && routeKind == "HTTPRoute" {
                if hostnamePrecedence {
                  conditions = append(conditions, "{ var(req.gw_route_type) -m str http }")
                  conditions = append(conditions, "{ var(txn.host_match) -m str \"" + MapKeyForHost(dig_string(entry, "", "hostname")) + "\" }")
                } else {
                  conditions = append(conditions, "{ var(req.gw_routeId) -m beg \"" + GatewayRoutePrefix(routeKind, namespace, name) + "_\" }")
                }
                if pathType == "Exact" {
                  conditions = append(conditions, "{ path \"" + pathValue + "\" }")
                } else if pathType == "RegularExpression" {
                  conditions = append(conditions, "{ path -m reg \"" + replace(pathValue, "$", "\\$") + "\" }")
                } else if pathValue == "/" || pathValue == "" {
                  conditions = append(conditions, "{ path_beg \"/\" }")
                } else {
                  var prefix = pathValue
                  if hasSuffix(prefix, "/") { prefix = prefix[:len(prefix)-1] }
                  conditions = append(conditions, "{ path -m reg \"^" + sanitize_regex(prefix) + "(/|\\$)\" }")
                }
              } else {
                conditions = append(conditions, "{ var(req.gw_routeId) -m str \"" + conflictGroup + "\" }")
              }
              if hasMethod { conditions = append(conditions, "{ method " + method + " }") }
              for _, header := range headerSpecs {
                var headerType = dig_string(header, "", "type")
                var headerName = dig_string(header, "", "name")
                var headerValue = dig_string(header, "", "value")
                if headerType == "Exact" {
                  conditions = append(conditions, "{ req.hdr(" + headerName + ") \"" + headerValue + "\" }")
                } else if headerType == "RegularExpression" {
                  conditions = append(conditions, "{ req.hdr(" + headerName + ") -m reg \"" + replace(headerValue, "$", "\\$") + "\" }")
                }
              }
              for _, parameter := range parameterSpecs {
                var parameterType = dig_string(parameter, "", "type")
                var parameterName = dig_string(parameter, "", "name")
                var parameterValue = dig_string(parameter, "", "value")
                if parameterType == "Exact" {
                  conditions = append(conditions, "{ urlp(" + parameterName + ") \"" + parameterValue + "\" }")
                } else if parameterType == "RegularExpression" {
                  conditions = append(conditions, "{ urlp(" + parameterName + ") -m reg \"" + replace(parameterValue, "$", "\\$") + "\" }")
                }
              }
              if hasGRPCMethod {
                var grpcPath = "/" + grpcService
                if grpcMethod != "" { grpcPath = grpcPath + "/" + grpcMethod }
                if grpcType == "Exact" {
                  conditions = append(conditions, "{ path \"" + grpcPath + "\" }")
                } else if grpcType == "RegularExpression" {
                  conditions = append(conditions, "{ path -m reg \"" + replace(grpcPath, "$", "\\$") + "\" }")
                }
              }
              var description = []string{}
              if hasMethod { description = append(description, "method " + method) }
              if len(headerSpecs) > 0 { description = append(description, tostring(len(headerSpecs)) + " headers") }
              if len(parameterSpecs) > 0 { description = append(description, tostring(len(parameterSpecs)) + " query params") }
              if hasGRPCMethod { description = append(description, "gRPC method") }
              var matcherDescription = "path-only"
              if len(description) > 0 { matcherDescription = join(description, ", ") }
              var conditionText = join(conditions, " ")
              var fragment = "\n# Rule: " + routeKind + " " + namespace + "/" + name + " rule[" +
                tostring(ruleIndex) + "] - " + matcherDescription +
                "\nhttp-request set-var(txn.gw_rule_id) str(" + routeID + ") if " + conditionText
              if tostring(dig(routeProps, "debug") | fallback(false)) == "true" {
                var matchTypes = []string{}
                if hasMethod { matchTypes = append(matchTypes, "method") }
                if len(headerSpecs) > 0 { matchTypes = append(matchTypes, "header") }
                if len(parameterSpecs) > 0 { matchTypes = append(matchTypes, "query") }
                if hasGRPCMethod { matchTypes = append(matchTypes, "grpc-method") }
                var matchReason = "advanced"
                if len(matchTypes) > 0 { matchReason = join(matchTypes, "+") }
                fragment = fragment + "\nhttp-request set-var(txn.matched_route) str(" + namespace + "/" + name +
                  "/rule" + tostring(ruleIndex) + ") if " + conditionText +
                  "\nhttp-request set-var(txn.match_reason) str(" + matchReason + ") if " + conditionText
              }
              _ = shared.PublishRanked("advanced", entryID, dig_string(entry, "", "sortRank"), fragment)
            }
          }
          var backendRefs = toSlice(dig(rule, "backendRefs"))
          var validRefs = []any{}
          for _, backendRef := range backendRefs {
            if BackendRefValid(routeKind, namespace, backendRef) == "true" {
              validRefs = append(validRefs, backendRef)
            }
          }
          var qualifier = ""
          if len(validRefs) == 0 {
            qualifier = "BACKEND:gw-invalid-backend"
          } else if len(backendRefs) == 1 {
            var backendRef = validRefs[0]
            qualifier = "BACKEND:" + BackendNameGatewayRule(route, rule, ruleIndex, backendRef)
          } else {
            var totalWeight = 0
            for _, backendRef := range backendRefs {
              totalWeight = totalWeight + toint(dig(backendRef, "weight") | fallback(1))
            }
            if totalWeight <= 0 {
              qualifier = "BACKEND:gw-invalid-backend"
            } else {
              qualifier = "MULTIBACKEND:" + tostring(totalWeight) + ":" + routeID
            }
          }
          if advancedScope {
            _ = shared.PublishRanked("backend-config", entryID, dig_string(entry, "", "allRank"),
              "\nhttp-request set-var(txn.path_match) str(" + qualifier +
                ") if { var(txn.gw_rule_id) -m str \"" + routeID + "\" }")
          } else if tostring(dig(entry, "groupWinner") | fallback(false)) == "true" {
            var winnerLine = conflictGroup + " " + routeID
            _ = shared.PublishRanked("route-winner", conflictGroup, winnerLine, winnerLine + "\n")
            var backendLine = routeID + " " + qualifier
            _ = shared.PublishRanked("route-backend", conflictGroup + "\x00" + routeID,
              backendLine + "\x00" + conflictGroup, backendLine + "\n")
          }
          if routeKind != "HTTPRoute" { continue }
          for _, filter := range toSlice(dig(rule, "filters")) {
            if dig_string(filter, "", "type") != "CORS" || dig(filter, "cors") == nil { continue }
            var cors = dig(filter, "cors")
            var allowOrigins = toSlice(dig(cors, "allowOrigins"))
            var wildcardOrigin = false
            var originAlternatives = []string{}
            for _, originAny := range allowOrigins {
              var origin = tostring(originAny)
              if origin == "*" {
                wildcardOrigin = true
              } else if regex_search(origin, "\\*") {
                var literal = sanitize_regex(origin)
                originAlternatives = append(originAlternatives, "^" +
                  replace(literal, "\\*\\.", "[^.]+(?:\\.[^.]+)*\\.") + "\\$")
              } else {
                originAlternatives = append(originAlternatives, "^" + sanitize_regex(origin) + "\\$")
              }
            }
            var originRegex = ""
            if !wildcardOrigin && len(originAlternatives) > 0 {
              originRegex = "(?:" + join(originAlternatives, "|") + ")"
            }
            var allowCredentials = tostring(dig(cors, "allowCredentials") | fallback(false)) == "true"
            var methods = []string{}
            var wildcardMethod = false
            for _, methodAny := range toSlice(dig(cors, "allowMethods")) {
              var method = tostring(methodAny)
              if method == "*" { wildcardMethod = true; break }
              methods = append(methods, method)
            }
            var headers = []string{}
            for _, headerAny := range toSlice(dig(cors, "allowHeaders")) {
              var header = tostring(headerAny)
              if header == "*" { headers = []string{"*"}; break }
              headers = append(headers, header)
            }
            var exposed = []string{}
            for _, headerAny := range toSlice(dig(cors, "exposeHeaders")) {
              exposed = append(exposed, tostring(headerAny))
            }
            var injection = ""
            for _, value := range methods { if injection == "" { injection = ConfigInjectionKind(value, "line") } }
            for _, value := range headers { if injection == "" && value != "*" { injection = ConfigInjectionKind(value, "line") } }
            for _, value := range exposed { if injection == "" { injection = ConfigInjectionKind(value, "line") } }
            for _, value := range allowOrigins { if injection == "" { injection = ConfigInjectionKind(tostring(value), "dquote") } }
            if injection != "" {
              _ = WebhookRejectOrWarn(route, "InvalidCORS", "HTTPRoute " + namespace + "/" + name + " has a CORS filter value containing " + injection + ", which would break out of the CORS response header directive; the CORS filter is not applied. Remove control characters and double quotes from allowMethods, allowHeaders, exposeHeaders and allowOrigins.")
              continue
            }
            var routeCondition = "{ var(txn.gw_rule_id) -m str \"" + routeID + "\" }"
            var originCondition = "{ req.fhdr(Origin) -m found }"
            if originRegex != "" { originCondition = originCondition + " { req.fhdr(Origin) -m reg \"" + originRegex + "\" }" }
            var corsFragment = "\nhttp-request set-var(txn.gw_cors_origin) req.fhdr(Origin) if " +
              originCondition + " " + routeCondition
            if len(headers) > 0 && headers[0] == "*" {
              corsFragment = corsFragment + "\nhttp-request set-var(txn.gw_cors_acrh) req.fhdr(Access-Control-Request-Headers) if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found }"
            }
            if wildcardMethod {
              corsFragment = corsFragment + "\nhttp-request set-var(txn.gw_cors_acrm) req.fhdr(Access-Control-Request-Method) if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found }"
            }
            var preflight = []string{"hdr access-control-allow-origin \"%[var(txn.gw_cors_origin)]\""}
            if allowCredentials { preflight = append(preflight, "hdr access-control-allow-credentials \"true\"") }
            if wildcardMethod {
              preflight = append(preflight, "hdr access-control-allow-methods \"%[var(txn.gw_cors_acrm)]\"")
            } else if len(methods) > 0 {
              preflight = append(preflight, "hdr access-control-allow-methods \"" + EscapeLogFormatValue(join(methods, ", ")) + "\"")
            }
            if len(headers) > 0 {
              if headers[0] == "*" {
                preflight = append(preflight, "hdr access-control-allow-headers \"%[var(txn.gw_cors_acrh)]\"")
              } else {
                preflight = append(preflight, "hdr access-control-allow-headers \"" + EscapeLogFormatValue(join(headers, ", ")) + "\"")
              }
            }
            var maxAge = toint(dig(cors, "maxAge") | fallback(0))
            if maxAge > 0 { preflight = append(preflight, "hdr access-control-max-age \"" + tostring(maxAge) + "\"") }
            if len(exposed) > 0 {
              preflight = append(preflight, "hdr access-control-expose-headers \"" + EscapeLogFormatValue(join(exposed, ", ")) + "\"")
            }
            corsFragment = corsFragment + "\nhttp-request return status 200 " + join(preflight, " ") +
              " if METH_OPTIONS { var(txn.gw_cors_origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found } " + routeCondition +
              "\nhttp-request return status 204 if METH_OPTIONS { req.fhdr(Origin) -m found } { req.fhdr(Access-Control-Request-Method) -m found } " + routeCondition + " !{ var(txn.gw_cors_origin) -m found }" +
              "\nhttp-response set-header \"access-control-allow-origin\" \"%[var(txn.gw_cors_origin)]\" if { var(txn.gw_cors_origin) -m found } " + routeCondition
            if allowCredentials {
              corsFragment = corsFragment + "\nhttp-response set-header \"access-control-allow-credentials\" \"true\" if { var(txn.gw_cors_origin) -m found } " + routeCondition
            }
            if len(exposed) > 0 {
              corsFragment = corsFragment + "\nhttp-response set-header \"access-control-expose-headers\" \"" +
                EscapeLogFormatValue(join(exposed, ", ")) + "\" if { var(txn.gw_cors_origin) -m found } " + routeCondition
            }
            corsFragment = corsFragment + "\n"
            _ = shared.PublishRanked("cors", entryID + "\x00" + tostring(len(corsFragment)),
              dig_string(entry, "", "allRank"), corsFragment)
          }
        }
      %%}
      {%- end macro -%}

