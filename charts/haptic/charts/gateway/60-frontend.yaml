  util-register-gateway-route-frontend-map:
    template: |-
      {%- macro RegisterGatewayRouteFrontendMap(name string, header string, cell string) string -%}
      {%%
        var content = header + "\n" + incremental_ranked_fragments("gateway-route-frontend", cell)
        var path, registerErr = fileRegistry.Register("map", name, content)
        if registerErr != nil { fail(tostring(registerErr)) }
        var metadataErr = planRegistry.MapMeta(name, false)
        if metadataErr != nil { fail(tostring(metadataErr)) }
        show path
      %%}
      {%- end macro -%}

  frontend-matchers-advanced-500-gateway:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-frontend-publications" -}}
      {# Declared as a plan fragment rather than shown: at 3,000 routes these
         rules are ~2.5 MB, 90% of the raw document, and emitting them sends
         every byte through the template writer on every render even though the
         fragment tree is already memoised per publication. The token costs ~40
         bytes; assembly splices the memoised text in its place, so the rendered
         config is byte-identical. #}
      {%- var advancedBytes = incremental_ranked_fragment_bytes("gateway-route-frontend", "advanced") -%}
      {{- "" }}
      # gateway/frontend-matchers-advanced-500-gateway
      {%- if advancedBytes > 0 %}
      # Advanced route matching (method/header/query)
      {%- var advancedToken, advancedErr = planRegistry.Fragment(
        "gateway-route-frontend-advanced",
        incremental_ranked_text_fragment("gateway-route-frontend", "advanced")) -%}
      {%- if advancedErr != nil %}{{ fail(tostring(advancedErr)) }}{%- end -%}
      {{- advancedToken -}}
      {%- end %}

  frontend-matchers-advanced-900-path-match:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {%- import "util-register-gateway-route-frontend-map" for RegisterGatewayRouteFrontendMap -%}
      {{- render "util-gateway-route-frontend-publications" -}}
      {%- if incremental_value_count("gateway-route-candidates", "presence-http") > 0 || incremental_value_count("gateway-route-candidates", "presence-grpc") > 0 -%}
      {{- "" }}
      # gateway/frontend-matchers-advanced-900-path-match
      {{- incremental_ranked_text_fragment("gateway-route-frontend", "backend-config") -}}
      {%- var routeWinnerPath = RegisterGatewayRouteFrontendMap(
        "route-winner.map", "# Candidate group -> the routeId that wins it", "route-winner") -%}
      {%- var routeBackendPath = RegisterGatewayRouteFrontendMap(
        "route-backend.map", "# routeId -> its path_match qualifier", "route-backend") -%}
      {#- A fragment that ranks nothing emits no newline of its own. #}
      {{- "" }}
      http-request set-var(txn.gw_rule_id) var(req.gw_routeId),map({{ routeWinnerPath }}) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID } !{ var(txn.gw_rule_id) -m found } { var(req.gw_routeId),map({{ routeWinnerPath }}) -m found }
      http-request set-var(txn.path_match) var(txn.gw_rule_id),map({{ routeBackendPath }}) if { var(txn.path_match),field(1,:) -m str GW_ROUTE_ID } { var(txn.gw_rule_id),map({{ routeBackendPath }}) -m found }
      {%- end %}

  frontend-filters-450-gateway-cors:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |-
      {{- render "util-gateway-route-frontend-publications" -}}
      {{- incremental_ranked_text_fragment("gateway-route-frontend", "cors") -}}

  # Gated on Content-Length, not frontend-wide `option http-buffer-request`: one
  # mirrored route turns this on for the whole shared frontend, and unconditional
  # buffering deadlocks a gRPC stream into a 408 the backend never saw. Nothing that
  # streams can send a Content-Length, so the gate excludes them by construction;
  # a chunked body is therefore mirrored empty rather than breaking the frontend.
  # Lives in frontend-filters-* because txn.backend_name — the key of the per-route
  # `request-buffering: off` opt-out map — is only set by frontend-routing-logic,
  # which runs after frontend-extra-*. That map defaults to `on` rather than the
  # fleet-wide setting because mirroring needs the body even where buffering is off.
  frontend-filters-091-gateway-mirror-buffer:
    requires: [gateways, grpcroutes, httproutes, referencegrants]
    template: |
      {{- render "util-gateway-route-maps" -}}
      {%- var gwmVal, _ = shared.ComputeIfAbsent("gatewayRouteMaps", func() any { return nil }) %}
      {%- if gwmVal == nil %}{% return %}{% end %}
      {%- var mirrorWait = extraContext | dig_string("10s", "requestBuffering", "waitTimeout") %}
      {%- var rbMap, _ = pathResolver.GetPath("request-buffering.map", "map") %}
      {%- var m = tostring(gwmVal.(map[string]any)["mirrorPctPath"]) %}
      {%- if incremental_ranked_fragment_bytes("gateway-route-filter-maps", "mirror") > 0 || incremental_ranked_fragment_bytes("gateway-route-filter-maps", "cfg-mirror-fallback") > 0 %}
      # gateway/mirror-buffer: required so req.body reaches
      # the mirror plugin (see frontend-filters-550-gateway-mirror).
      http-request wait-for-body time {{ mirrorWait }} if { req.hdr(content-length) -m found } !{ var(txn.backend_name),map({{ rbMap }},on) -m str off } { var(txn.gw_rule_id),map_str_int({{ m }}) -m found }
      {%- end %}
