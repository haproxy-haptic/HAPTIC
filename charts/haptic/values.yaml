# Default values for haptic.
#
# Port architecture: Container ports (*.ports.*) are the source of truth.
# Services reference them by name (targetPort: http). See README for details.

# Common labels added to all resources
# These are merged with chart-defined labels
commonLabels: {}  # @schema additionalProperties: true
# environment: production
# team: platform

# Common annotations added to all resources
commonAnnotations: {}  # @schema additionalProperties: true
# config.kubernetes.io/managed-by: helm

# HAProxy version - selects the major.minor series for both controller and HAProxy pod images
# HAProxy pod image: haproxytech/haproxy-debian:<patch from haproxyPatchVersions[<series>]>
# The enum lists the series CI builds; scripts/check-image-pins.py keeps it equal to versions.env.
# Not Renovate-managed: cutting over to a new series is an operational decision
# (must also update Chart.yaml artifacthub annotation and dev-env manifests to match).
haproxyVersion: "3.4"  # @schema enum: ["3.0", "3.2", "3.3", "3.4"]

# Latest tested patch versions for each supported HAProxy major.minor.
# Used as the default HAProxy pod image tag unless haproxy.image.tag is set.
# Renovate updates each entry to the latest patch within its own series (the
# series clamp is derived from the map key by the custom manager in
# renovate.json, so adding or removing a series needs no config change).
haproxyPatchVersions:  # @schema skipProperties; additionalProperties: {type: string}
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.0": "3.0.30"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.2": "3.2.26"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.3": "3.3.17"
  # renovate: datasource=docker depName=haproxytech/haproxy-debian
  "3.4": "3.4.7"

# Latest tested revision tags for each supported HAProxy Enterprise major.minor.
# Enterprise uses HAProxy's revision scheme (e.g. 3.2r1, 3.2r2).
# See https://www.haproxy.com/documentation/haproxy-enterprise/release-notes/ for new revisions.
# Updated manually during chart releases.
haproxyEnterprisePatchVersions:  # @schema skipProperties; additionalProperties: {type: string}
  "3.0": "3.0r1"
  "3.2": "3.2r1"
  "3.3": ""
  "3.4": ""

nameOverride: ""
fullnameOverride: ""

# CustomResourceDefinition lifecycle.
#
# Root-level (not under extraContext) because it governs Kubernetes resources
# the chart creates — a pre-install/pre-upgrade Job plus its scoped RBAC — not
# the render context.
#
# Helm installs the CRDs in crds/ exactly once and never upgrades them on a
# subsequent `helm upgrade` (a documented Helm limitation). Without this hook,
# additive CRD schema changes (new fields, printer columns, validation) shipped
# in a chart upgrade would be silently pruned by the API server. The hook runs
# `haptic apply-crds`, which server-side applies the bundled CRDs.
crds:
  upgradeJob:
    # Run the pre-install/pre-upgrade Job that server-side applies the bundled
    # CRDs. Disable if you manage CRDs out-of-band (GitOps, a separate CRD
    # chart) or lack cluster-scoped CRD write permission at upgrade time.
    enabled: true
    # Delete-succeeded/before-creation is Helm's default for hooks here; the
    # Job and its RBAC are removed once the apply succeeds and recreated on the
    # next run. A failed Job is kept for inspection.
    backoffLimit: 2
    activeDeadlineSeconds: 300
    resources:  # @schema skipProperties; additionalProperties: true
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Extra annotations/labels for the Job (merged with chart defaults).
    annotations: {}  # @schema skipProperties; additionalProperties: true
    labels: {}  # @schema skipProperties; additionalProperties: true

# Pre-rollout validation: a pre-install/pre-upgrade hook Job that renders the
# chart embedded in the controller image with THIS release's values and runs
# the controller's own load gate over the result — structural validation, the
# full validationTests suite including `haproxy -c`. A failing configuration
# fails the release before any object is applied; the previous release keeps
# serving. Works identically under Argo CD (PreSync). The fail-closed load
# gate still guards every path that skips hooks (--no-hooks, kubectl,
# rollback).
#
# The Job hard-fails if the controller image's embedded chart version differs
# from the chart being installed — validating the wrong chart would pass on
# the wrong input. Disable the hook when deliberately running a drifted image.
preRolloutValidation:
  enabled: true
  backoffLimit: 1
  # Schema fetch + engine compile + ~700 haproxy -c checks; generous for cold
  # CI nodes (the in-cluster load gate budget is 120s under a 300s probe).
  activeDeadlineSeconds: 600
  resources:  # @schema skipProperties; additionalProperties: true
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # Measured 644 MiB peak RSS rendering the chart with every library
      # enabled and running its 844 validationTests. The previous 512Mi was
      # sized against a 215 MiB measurement and OOMKilled the hook once
      # incremental rendering raised the render's working set.
      memory: 1Gi
  annotations: {}  # @schema skipProperties; additionalProperties: true
  labels: {}  # @schema skipProperties; additionalProperties: true

# Controller configuration
controller:
  # Controller workload. Component-owned settings live in this tree so generic
  # names such as image, resources, service, and networkPolicy cannot be
  # confused with the managed HAProxy, SPOA hub, Varnish, or Valkey workloads.
  # Default: 2 replicas for high availability with leader election. Only the
  # leader deploys configs; followers remain ready for failover.
  replicaCount: 2
  image:
    repository: ghcr.io/haproxy-haptic/haptic
    pullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
    # Base tag with an appended HAProxy suffix; empty uses release digest metadata, then appVersion.
    tag: ""
    # Pins controller, agent, and hook Pod images by SHA-256 digest; overrides tag.
    digest: ""  # @schema pattern: ^$|^sha256:[a-f0-9]{64}$
  # Deployment-level annotations (different from pod annotations).
  deploymentAnnotations: {}  # @schema skipProperties; additionalProperties: true
  # reloader.stakater.com/auto: "true"
  updateStrategy:
    type: RollingUpdate  # @schema enum: [RollingUpdate, Recreate]
    rollingUpdate:
      maxSurge: 25%  # @schema type: [integer, string]
      maxUnavailable: 25%  # @schema type: [integer, string]
  minReadySeconds: 0
  revisionHistoryLimit: 10
  # Name of the HAProxyTemplateConfig object this controller watches.
  configName: haptic-config
  # Initial log level for the controller
  # Values: TRACE, DEBUG, INFO, WARN, ERROR (case-insensitive)
  # This sets the LOG_LEVEL environment variable
  # Can be overridden at runtime via controller.config.logging.level
  logLevel: INFO
  # Client-side rate limit for the controller's own apiserver requests.
  # The default (qps <= 0) disables client-side throttling so the controller
  # relies on the apiserver's API Priority & Fairness (APF) — the modern posture
  # shared by controller-runtime and kgateway. Unlike the client-side token
  # bucket (which blocks a throttled request), APF returns 429 + Retry-After,
  # which client-go retries. Set a positive qps to reinstate a client-side cap;
  # it becomes one shared budget across all the controller's clients. burst is
  # used only when qps > 0 (0 means 2*qps).
  kubeClient:
    qps: -1
    burst: 0
  # Controller listener ports. These are the single source of truth for the
  # process environment, container ports, Service, probes, and NetworkPolicy.
  ports:
    # Shared /healthz and /debug/* introspection listener.
    healthz: 8080
    # Prometheus /metrics listener.
    metrics: 9090
    webhook: 9443  # Admission webhook HTTPS endpoint
  # Admission webhook served by the controller process. The HTTPS listener is
  # controller.ports.webhook; service.port is the API-server-facing port.
  webhook:
    enabled: true
    # Watched-resource admission deadline. HAPTIC keeps one second internally
    # to return a structured response, so the accepted range is 2..30.
    timeoutSeconds: 10
    # TLS Secret containing tls.crt, tls.key, and ca.crt. Empty derives the
    # release-specific name.
    secretName: ""
    service:
      port: 443
    # Set enabled=true for cert-manager. The default chart-managed self-signed
    # certificate is reused across upgrades but does not auto-rotate.
    certManager:
      enabled: false
      createIssuer: true
      issuerRef:
        name: ""
        kind: Issuer
      duration: 8760h
      renewBefore: 720h
    selfSigned:
      certValidityDays: 3650
    # Set for manually managed webhook certificates; empty selects the chart's
    # self-signed mode when cert-manager is disabled.
    caBundle: ""
  serviceAccount:
    # Specifies whether a service account should be created.
    create: true
    # Automatically mount the ServiceAccount's API credentials.
    automount: true
    annotations: {}  # @schema skipProperties; additionalProperties: true
    # If empty and create=true, the chart generates a name.
    name: ""
  rbac:
    # Create the controller's Role, ClusterRole, and bindings.
    create: true
    # Read Secrets only in the release namespace: the ClusterRole drops its
    # Secret rule, a Role grants get/list/watch there, and the controller
    # watches only that namespace. An Ingress, Gateway, or policy that references
    # a Secret elsewhere is rejected. For platforms that serve only the default
    # or a wildcard certificate and use no per-Ingress certificate or auth
    # Secrets. Not under extraContext because it changes the chart's RBAC objects.
    releaseNamespaceSecretsOnly: false
  # Service exposing the controller's health and metrics listeners.
  service:
    type: ClusterIP  # @schema enum: [ClusterIP, NodePort, LoadBalancer]
    annotations: {}  # @schema skipProperties; additionalProperties: true
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    externalTrafficPolicy: ""
    internalTrafficPolicy: ""
    sessionAffinity: ""
    sessionAffinityConfig: {}  # @schema skipProperties; additionalProperties: true
  # Controller container security context (PSS Restricted compatible).
  securityContext:  # @schema skipProperties; additionalProperties: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
  resources:  # @schema skipProperties; additionalProperties: true
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  # Controller-container and controller-pod extension points.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  sidecars: []
  lifecycle: {}  # @schema skipProperties; additionalProperties: true
  # /livez and /readyz judge the configuration that is serving; /healthz
  # reports whether the newest one started (ADR-0028).
  livenessProbe:  # @schema skipProperties; additionalProperties: true
    httpGet:
      path: /livez
      port: healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:  # @schema skipProperties; additionalProperties: true
    httpGet:
      path: /readyz
      port: healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  # Enabled by default because validationTests can make first startup exceed
  # the normal liveness budget on slow or contended nodes.
  startupProbe:  # @schema skipProperties; additionalProperties: true
    enabled: true
    httpGet:
      path: /healthz
      port: healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1  # @schema type: [integer, string]
    # maxUnavailable: 1
  # Prometheus resources and Grafana dashboard for controller metrics.
  monitoring:
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}  # @schema skipProperties; additionalProperties: true
      relabelings: []
      metricRelabelings: []
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}  # @schema skipProperties; additionalProperties: true
      relabelings: []
      metricRelabelings: []
    prometheusRule:
      enabled: false
      labels: {}  # @schema skipProperties; additionalProperties: true
      rules: []
      defaultRules:
        enabled: true
        reconciliationErrors: true
        deploymentFailures: true
        highQueueDepth: true
        leaderElectionLost: true
        fleetDiverged: true
        retainedConfiguration: true
        configRejected: true
        configNotValidated: true
        configPinned: true
        haproxyPodsRejected: true
        noHAProxyPods: true
        criticalEventsDropped: true
        applyRejected: true
        agentInvariantViolated: true
        recoveryReloadFailed: true
        agentVersionSkew: true
        # HAProxy discarded access-log records because the vector sidecar
        # stopped draining the UNIX datagram socket. Traffic is unaffected;
        # the log is not.
        accessLogDropped: true
    grafanaDashboard:
      enabled: false
      labels:  # @schema skipProperties; additionalProperties: true
        grafana_dashboard: "1"
      annotations:  # @schema skipProperties; additionalProperties: true
        grafana_folder: "HAProxy"
      namespace: ""
      useBuiltIn: true
      customDashboard: {}  # @schema skipProperties; additionalProperties: true
  # NetworkPolicy selecting only controller pods. HAProxy, Varnish, and the
  # managed rate-limit store each own their policy in their component tree.
  networkPolicy:
    enabled: true
    egress:
      allowDNS: true
      # Replace the broad dual-stack defaults with your API-server/node CIDRs
      # when hardening a production installation.
      kubernetesApi:
        - cidr: 0.0.0.0/0
          ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
        - cidr: "::/0"
          ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
      haproxyPods:
        enabled: true
        podSelector:  # @schema skipProperties; additionalProperties: true
          matchLabels:
            app.kubernetes.io/component: loadbalancer
        # Empty omits namespaceSelector and therefore limits this peer to the
        # policy namespace. Set matchLabels for a cross-namespace HAProxy fleet.
        namespaceSelector: {}  # @schema skipProperties; additionalProperties: true
      # Keeps template http.Fetch() usable against cluster Services by default.
      # Set [] to restrict egress to DNS, Kubernetes API, and HAProxy pods.
      additionalRules:  # @schema itemProperties: {to: {}, ports: {}}
        - to:
            - namespaceSelector: {}
              podSelector: {}
    ingress:
      monitoring:
        enabled: false
        podSelector: {}  # @schema skipProperties; additionalProperties: true
        namespaceSelector: {}  # @schema skipProperties; additionalProperties: true
      healthChecks:
        enabled: true
        from:  # @schema itemProperties: {ipBlock: {}, namespaceSelector: {}, podSelector: {}}
          - podSelector: {}
      # Empty accepts the webhook port from any source: the kube-apiserver often
      # reaches it from the host network, which selectors don't match and which
      # Cilium doesn't match against ipBlock. List node/apiserver peers to restrict.
      webhook:
        enabled: true
        from: []  # @schema item: object; itemProperties: {ipBlock: {}, namespaceSelector: {}, podSelector: {}}
      additionalRules: []
  # Template libraries. Each enabled one is rendered as its own
  # HAProxyTemplateConfig and the controller merges them in the order fixed by
  # templates/_libraries.tpl (haptic.libraryFiles); see ADR-0014. Merge-order
  # docs and per-library references:
  # https://haproxy-haptic.org/docs/0.9.0/template-libraries/
  templateLibraries:
    # Resource-agnostic core. Defines the haproxyConfig template and the
    # render_glob extension points the other libraries plug into.
    base:
      enabled: true
    # Kubernetes Service port and EndpointSlice backend resolution shared by
    # the bundled Ingress, Gateway, and annotation libraries.
    kubernetesBackends:
      enabled: true
      # Readiness gate `haproxy-haptic.org/load-balancer-ready`. Not under
      # extraContext: it adds a cluster-wide Pod watch and pods/status RBAC. See
      # https://haproxy-haptic.org/docs/latest/operations/pod-readiness-gate/
      podReadinessGate:
        enabled: false
    # HTTPS frontend + SSL passthrough infrastructure + default cert loading.
    ssl:
      enabled: true
    # networking.k8s.io/v1 Ingress support.
    ingress:
      enabled: true
    # gateway.networking.k8s.io/v1 support (HTTPRoute, GRPCRoute, TLSRoute).
    # Disable this library if you don't use Gateway API. When enabled, the
    # controller resolves available resource versions at runtime.
    gateway:
      enabled: true
      # Set true only when the Gateway API *Experimental* channel is installed
      # (experimental-install.yaml). As of v1.6 the Standard and Experimental
      # installs ship an IDENTICAL set of CRDs — the difference is field-level
      # additions to HTTPRoute (retry / GEP-1731, sessionPersistence / GEP-1619),
      # which Helm .Capabilities cannot detect (it sees GVKs, not fields). The
      # validationTests that assert those directives can only pass when the
      # fields exist, so they are skipped unless this flag opts in. The route
      # snippets themselves emit the directives only when the typed field is
      # present, so leaving this false on a Standard-channel cluster is safe —
      # it just skips the experimental-field self-tests.
      experimentalChannel: false
    # Required shared Ingress-scoped macros for all enabled annotation libraries
    # below (level 2.5). Rationale:
    # https://github.com/haproxy-haptic/HAPTIC/blob/v0.9.0/docs/adr/0003-annotation-compat-scaffold-level-2-5.md
    ingressAnnotationsCompat:
      enabled: true
    # Governance rule engine. Generic over any watched resource, so it is
    # independent of the annotation libraries above. Inert until you define
    # controller.config.templatingSettings.extraContext.governance.rules.
    governance:
      enabled: true
    # haproxy-haptic.org/* — HAPTIC's native annotation vocabulary and the
    # only annotation library enabled by default. A best-of-breed superset of
    # the three vendor libraries below; the vocabulary to use for a powerful
    # ingress controller from scratch. The vendor libraries are opt-in migration
    # aids — enable the one matching the controller you're coming from to keep
    # its annotations working, and optionally migrate to haproxy-haptic.org/* at
    # your own pace. All prefixes can be mixed on the same Ingress.
    hapticAnnotations:
      enabled: true
    # haproxy.org/* compatibility (haproxytech/kubernetes-ingress migration).
    # Opt-in: set true to keep existing haproxy.org/* annotations working.
    haproxytech:
      enabled: false
    # haproxy-ingress.github.io/* compatibility (jcmoraisjr/haproxy-ingress
    # migration). Opt-in.
    haproxyIngress:
      enabled: false
    # nginx.ingress.kubernetes.io/* compatibility (ingress-nginx migration). Opt-in.
    nginxIngress:
      enabled: false
    # Worked example of a resource-agnostic library for a custom Route CRD, for
    # learning or exercising the reload-free author contract. Not for production
    # routing (it watches a demo `Route` kind). Opt-in.
    customCrdExample:
      enabled: false
    # HAProxy-side wiring for the bundled spoa-hub sidecar. Auto-loaded when
    # any spoaHub.plugins.* is on; flip to true
    # here only to force-load the library with no plugins enabled.
    spoaHub:
      enabled: false
  # Pluggable validator sidecar
  # Runs a second instance of the haproxy-spoa-hub binary alongside the
  # controller pod, in --validate-socket mode. Every render pipeline
  # consults it to reject plugin TOML (e.g. coraza modsecurity-snippet)
  # that would be broken on the data plane. Loads the same plugins and config.toml as
  # the HAProxy-side sidecar (so the validator and runtime see identical
  # plugin behavior). Communicates via a Unix socket on a shared emptyDir.
  validators:
    # Master enable. Leave as null to auto-derive from the spoa-hub
    # sidecar's own enable (the typical case — plugins that need
    # rendered-output validation are the same plugins that run on the
    # data plane). Set to false to force the validator sidecar off.
    # Set to true to render it even when spoaHub is off (useful for
    # bench/test setups validating template fragments without a
    # data-plane sidecar).
    enabled: null  # @schema type: [boolean, null]
    # Directory for the validator Unix socket (a shared emptyDir mounted
    # into both the controller container and the validator sidecar).
    socketDir: /var/run/haptic-validators
    # Socket filename. The full path (socketDir + socketName) is what
    # the controller dials and what the chart writes into spec.validators
    # entries below.
    socketName: spoa-hub.sock
    # Resource requests/limits for the validator sidecar. Validation is
    # content-cached and typically bursty, so this is sized small.
    resources:  # @schema skipProperties; additionalProperties: true
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Container-level securityContext for the validator sidecar.
    # runAsUser=65532 matches the controller's nonroot UID so the Unix
    # socket the sidecar creates under socketDir is readable / writable
    # by the controller without extra fsGroup plumbing.
    securityContext:  # @schema skipProperties; additionalProperties: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    # Extra volume mounts added to the validator sidecar only. Useful
    # when a plugin's validate() override needs auxiliary data (e.g.
    # MMDB databases for maxmind, OWASP CRS rule files for coraza).
    # Same shape as spoaHub.extraVolumeMounts.
    extraVolumeMounts: []
    # Entries appended to spec.validators (CRD shape: name, socketPath,
    # files glob list, optional timeoutMs/maxConnections). Operators wire
    # their own globs per enabled plugin.
    entries: []
  # Pod-spec scheduling, runtime, and metadata for the controller Deployment.
  # The chart's _pod-spec.tpl helper renders the universally-shared fields
  # (priorityClassName / runtimeClassName / terminationGracePeriodSeconds /
  # dnsPolicy / dnsConfig / hostAliases / topologySpreadConstraints /
  # nodeSelector / affinity / tolerations / imagePullSecrets) from this block.
  # The remaining fields (podAnnotations, podLabels, podSecurityContext) are
  # consumed directly by templates/deployment.yaml, which mixes them with
  # workload-specific data (config checksums, component labels, container UID).
  podSpec:
    # Image pull secrets (private registry access)
    imagePullSecrets: []
    # Pod annotations
    podAnnotations: {}  # @schema skipProperties; additionalProperties: true
    # Pod labels
    podLabels: {}  # @schema skipProperties; additionalProperties: true
    # Priority class for pod scheduling
    # Used to mark critical workloads for preferential scheduling and preemption
    # Common values:
    #   - system-cluster-critical: Highest priority for cluster infrastructure
    #   - system-node-critical: High priority for node management components
    #   - "" (empty): Default priority (recommended for most deployments)
    # Requires priority class to be pre-created in the cluster
    priorityClassName: ""
    # Topology spread constraints for high availability
    # Controls pod distribution across topology domains (zones, nodes, etc.)
    # Default: [] (empty, user opt-in)
    # Example for zone spreading:
    #   - maxSkew: 1
    #     topologyKey: topology.kubernetes.io/zone
    #     whenUnsatisfiable: DoNotSchedule
    #     labelSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: haptic
    #         app.kubernetes.io/component: controller
    topologySpreadConstraints: []
    # Pod security context
    # Complies with Pod Security Standards (PSS) Restricted profile
    podSecurityContext:  # @schema skipProperties; additionalProperties: true
      runAsNonRoot: true
      runAsUser: 65532  # nonroot user
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # Node selector
    nodeSelector: {}  # @schema skipProperties; additionalProperties: true
    # Tolerations
    tolerations: []
    # Affinity rules
    affinity: {}  # @schema skipProperties; additionalProperties: true
    # Termination grace period in seconds
    terminationGracePeriodSeconds: 90
    # DNS policy (ClusterFirst, ClusterFirstWithHostNet, Default, None)
    dnsPolicy: ClusterFirst
    # DNS config for custom DNS settings
    dnsConfig: {}  # @schema skipProperties; additionalProperties: true
    # nameservers:
    #   - 8.8.8.8
    # searches:
    #   - my-namespace.svc.cluster.local
    # options:
    #   - name: ndots
    #     value: "2"
    # Host aliases (/etc/hosts entries)
    hostAliases: []
    # - ip: "127.0.0.1"
    #   hostnames:
    #     - "foo.local"
    #     - "bar.local"
    # Runtime class name (for specialized runtimes like gVisor, Kata)
    runtimeClassName: ""
  # HAProxyTemplateConfig specification
  # This configuration is rendered into a HAProxyTemplateConfig CRD
  # Users can customize this configuration using Helm values or create
  # the HAProxyTemplateConfig resource manually
  config:
    # Reference to the Secret containing the HAPTIC agent credentials
    # The Secret is automatically created by the Helm chart
    credentialsSecretRef:
      # Name will be set by the template to: {{ include "haptic.fullname" . }}-credentials
      name: ""  # Will be filled in by Helm template
      # Namespace defaults to Release.Namespace if not specified
    podSelector:
      matchLabels:  # @schema skipProperties; additionalProperties: true
        app.kubernetes.io/component: loadbalancer
        # app.kubernetes.io/name and app.kubernetes.io/instance are set dynamically by template
    controller:
      # Leader election for high availability
      # When multiple controller replicas are running, only the leader performs
      # write operations (deploying configs to HAProxy). All replicas continue
      # watching resources, rendering configs, and validating (hot standby).
      leaderElection:
        # Enable leader election (recommended when replicaCount > 1)
        enabled: true
        # Name of the Lease resource used for coordination
        # Defaults to the Helm release fullname if not specified
        # This ensures multiple releases in the same namespace don't conflict
        leaseName: ""
        # The timing values below are deliberately 2x the client-go
        # convention (15s/10s/2s). renewDeadline is the leader's budget for
        # riding out apiserver unavailability or CPU starvation without
        # losing the lease; on loaded nodes stalls of 10s+ have been
        # observed, and a lost lease costs a full controller
        # reinitialization before the replica can lead again. The trade-off
        # is hard-failover latency: after a leader dies WITHOUT releasing
        # the lease (node crash, OOM-kill), a standby waits up to
        # leaseDuration (+ one retryPeriod) before taking over. Voluntary
        # handoffs (rolling update, graceful shutdown) release the lease
        # immediately and are unaffected. Tune down for faster
        # crash-failover, keeping leaseDuration > renewDeadline > retryPeriod.
        #
        # Duration that non-leader candidates wait to acquire leadership
        # Default: 30s (crash failover happens within this time after leader failure)
        leaseDuration: 30s
        # Duration the leader retries refreshing leadership before giving up
        # Default: 20s (must be < leaseDuration, maintains 1.5x safety ratio)
        renewDeadline: 20s
        # Interval between leadership refresh attempts
        # Default: 5s (must be < renewDeadline, typically 1/4 of it)
        retryPeriod: 5s
      # Shortest start-to-start spacing of the render gate's `haproxy -c` runs.
      # The gate validates each render off the reconcile wall clock, on a
      # semaphore slot of its own, so this only caps how much CPU a render
      # storm can take from the admission webhook. At 3000 routes one check
      # costs ~350 ms, so 1s keeps the gate under ~35% of one core.
      # Default: 1s
      renderGateInterval: 1s
    dataplane:
      # The controller connection port is injected from
      # haproxy.ports.dataplane so the client and managed sidecar cannot drift.
      # Minimum time between reload-inducing (structural) deployments. With the
      # bundled fleet this same value paces the agent's reloads
      # (--reload-interval-min), so the two cannot drift. The agent accepts at
      # most 60s and exits at startup above it, so the chart fails the render.
      # A new or changed Ingress / Gateway route reloads HAProxy at most
      # once per this interval; bursts coalesce (latest-wins) into the
      # next window. This deliberately does NOT gate endpoint changes:
      # pod IP / admin-state changes (rolling restart, scale up/down)
      # apply instantly via the runtime fast path, which fires OUTSIDE
      # the deployment scheduler's rate limit. So endpoints converge
      # instantly while structural changes are batched — matching the
      # operator expectation that endpoints react immediately but
      # ingress/gateway changes can take a moment.
      #
      # 5s throttles the reload storm that parallel-test churn — or a busy
      # production cluster — otherwise produces. Frequent reloads (a) leave
      # brief windows where the HAProxy master socket is unavailable and a
      # coincident runtime push is clobbered, and (b) churn worker
      # generations fast enough that a request looped through the
      # http-tcp -> unix-socket -> http_frontend path can land on a stale
      # draining worker mid-reload and be rejected as a <BADREQ> 400.
      # 5s matches the official haproxytech/kubernetes-ingress --sync-period
      # default. An earlier 0s default predates the fast path, when this
      # gate also delayed the endpoint *deploy*; it no longer does, so
      # throttling reloads here costs endpoints nothing (they bypass it).
      # Default: 5s
      minDeploymentInterval: 5s
      # Interval for periodic drift prevention deployments
      # Triggers deployment if no deployment occurred within this interval
      # Helps detect and correct configuration drift from external changes
      # Default: 60s
      driftPreventionInterval: 60s
      # Directory paths for HAProxy auxiliary files
      # These paths are used for both validation and deployment
      #
      # With the bundled fleet (haproxy.enabled=true) these are constrained by
      # the pod spec: it mounts its config volume at /etc/haproxy and resolves
      # every auxiliary path against it, so all of them must live directly under
      # that. generalStorageDir must be exactly /etc/haproxy/general, because a
      # separate volume is mounted there for the spoa-hub and vector sidecars to
      # read rendered files without reaching SSL private keys. secretsDir must be
      # exactly /etc/haproxy/secrets, a tmpfs only the agent and spoa-hub mount.
      # The chart fails the render rather than deploy a pod whose sidecars see
      # an empty dir.
      # Set haproxy.enabled=false to drive an external fleet with any layout.
      # See: https://www.haproxy.com/documentation/haproxy-data-plane-api/reference/configuration-file/#resources
      mapsDir: /etc/haproxy/maps
      sslCertsDir: /etc/haproxy/ssl
      generalStorageDir: /etc/haproxy/general
      configFile: /etc/haproxy/haproxy.cfg
      # secretsDir defaults to /etc/haproxy/secrets in the controller. It is left
      # unset so the rendered config fits the CRDs of releases that predate it.
      # secretsDir: /etc/haproxy/secrets
      # Optional sync knobs (uncomment to override):
      # configPublishInterval: 10s     # observability CRD republish throttle
      # reloadVerificationTimeout: 10s # agent --reload-timeout; unset = 1m, its max
      # syncTimeout: 2m                # per-endpoint sync budget
    # Runtime log level override (optional)
    # Uncomment to override controller.logLevel at runtime without pod restart
    # logging:
    #   level: DEBUG
    # Template rendering settings
    # extraContext provides custom variables available to all templates
    templatingSettings:
      # @schema enum: [scriggo]
      engine: scriggo  # Template engine: "scriggo" (Go templates)
      extraContext:  # @schema additionalProperties: true
        diagnostics:
          routingHeaders:
            # Response headers exposing HAProxy's routing decision. Disabled by
            # default because they reveal backend and route internals to clients.
            enabled: false
        # Extra HTTP/HTTPS binds that require a PROXY protocol header, for a
        # deployment behind an L4 load balancer (edge HAProxy, cloud NLB). The
        # balancer sends `send-proxy-v2`; HAProxy then reports the real client in
        # logs, rate limiting, WAF and IP ACLs instead of the balancer's address.
        #
        # These are ADDITIONAL ports — haproxy.ports.http/https stay open and
        # unchanged. HAProxy has no "PROXY optional" bind, so a bind that
        # requires the header rejects every connection without one; putting it on
        # a separate port keeps direct, in-cluster and NodePort access working.
        # Point only the balancer at these ports.
        #
        # Enabling adds them to the HAProxy Service, the container ports, and the
        # NetworkPolicy. See
        # https://haproxy-haptic.org/docs/latest/haproxy-deployment/#proxy-protocol
        proxyProtocol:
          enabled: false
          httpPort: 8081
          httpsPort: 8444
        # Keep forwarding metadata from these L7 proxy source addresses (CIDRs).
        # Other sources have their client-address, scheme and authority headers
        # sanitized. See the complete header list and route exceptions:
        # https://haproxy-haptic.org/docs/latest/operations/security/#forwarded-headers
        forwardedHeaders:
          trustedProxies: []  # @schema item: string
        # HTTP/3 over QUIC. Every TLS-terminating HTTPS listener gets a UDP twin
        # on the same port with the same certificates, the HAProxy Service and
        # container get a UDP port, and responses carry an `alt-svc` header that
        # points clients at it. Firewalls and load balancers in front of HAProxy
        # must pass UDP on the HTTPS port. Responses on the PROXY-protocol
        # listener never advertise HTTP/3: QUIC can't carry the PROXY header. See
        # https://haproxy-haptic.org/docs/latest/haproxy-deployment/#http3-quic
        http3:
          enabled: true
          altSvc:
            # Port advertised to clients. 0 advertises the port the client used
            # for HTTPS (the Host header's port, else 443), which is right
            # whenever UDP is published on the same port as TCP. Set it when your
            # load balancer publishes UDP on a different port.
            port: 0
            # Seconds a client may cache the advertisement (alt-svc `ma`).
            maxAge: 86400
        # HAProxy access log. Every frontend emits one JSON object per
        # request (or per connection, for the TCP-mode frontends), using
        # HAProxy's native JSON log encoding. The log target is `format raw`, so
        # lines carry no syslog prefix and a collector can parse them directly;
        # each record carries its own `ts` field instead.
        #
        # HAProxy's own process and health-check messages share that stream and
        # are NOT JSON, so a collector must tolerate non-JSON lines. The
        # bootstrap config the HAProxy pod starts with (before the controller's
        # first render, a few seconds) also emits the plain text format.
        #
        # Template libraries contribute feature fields through the log-fields-*
        # extension point, each gated on that feature actually being configured:
        # WAF verdicts, rate-limit outcome, cache HIT/MISS/STALE, TLS version, the
        # authenticated consumer, and `denied_by`, which names the gate that
        # blocked a request. See
        # https://haproxy-haptic.org/docs/latest/haproxy-deployment/#access-logging
        # W3C Trace Context. OFF by default, deliberately: turning it on writes a
        # `traceparent` header onto every upstream request, and there is no
        # sensible default destination for traces, so it is an explicit opt-in
        # rather than something that changes what your backends receive on an
        # upgrade.
        #
        # With it OFF, an inbound trace id is still adopted into the access log's
        # `trace_id` field, so records can be joined to a trace someone else is
        # collecting. Nothing is minted and nothing is propagated.
        #
        # With it ON, HAProxy owns trace identity entirely, so this works with the
        # spoa-hub disabled (the hub has no part in tracing and no otel plugin):
        #   - a valid inbound traceparent is adopted (same trace, its span becomes
        #     the parent, its sampling decision is honoured),
        #   - otherwise a W3C-valid trace id and span id are minted,
        #   - `traceparent` is set on the request before it reaches the backend,
        #     so your services join the same trace,
        #   - `span_id`, `parent_span_id` and `trace_flags` join the access log,
        #     which is what lets the log record be exported as a span.
        tracing:
          enabled: false
          # Percentage of requests sampled when HAPTIC is the trace ROOT. An
          # inbound traceparent's decision is always honoured instead, because
          # re-deciding mid-trace produces half-sampled traces. Requests that are not sampled requests
          # still propagate `traceparent` with flags 00, so downstream honours the
          # same decision rather than starting its own.
          sampleRate: 100
          # Export spans to an OTLP/HTTP collector. Leave the endpoint empty for
          # propagation-only tracing: HAProxy still sets `traceparent` so your
          # backends join the trace and their spans reach whatever they already
          # report to — HAPTIC just contributes no span of its own.
          #
          # Spans are built from ACCESS-LOG RECORDS in the vector sidecar, not from
          # a SPOA hop. That is what gives complete coverage: `http-response` rules
          # never run for HAProxy-generated responses, so a SPOE-based exporter
          # cannot see a single 502/503/504, deny, redirect or errorfile — the
          # failures traces exist for. Every one of those produces a log record.
          # It also costs no round trip on the request path.
          #
          # Requires vector.enabled=true; the render fails otherwise rather than
          # exporting nothing silently.
          otlp:
            # Full URL of an OTLP/HTTP traces endpoint, e.g.
            # http://tempo.observability.svc.cluster.local:4318/v1/traces
            endpoint: ""
            # `service.name` reported for HAPTIC's own spans.
            serviceName: haptic
        accessLog:
          # Extra JSON fields: <field name> -> exactly one HAProxy sample
          # expression. Each is captured into txn.log_<name> at request time,
          # because a log-format cannot fetch request-scoped data itself, and is
          # emitted as a JSON string. Field names must match
          # ^[A-Za-z_][A-Za-z0-9_]{0,39}$, must not collide with a built-in
          # field, and expressions must not contain whitespace, '#', '"' or a
          # backslash.
          #
          #   fields:
          #     tenant: req.hdr(X-Tenant)
          #     query: query              # opt in: query strings often carry tokens
          #     region: str(prod-eu)      # constant label
          fields: {}  # @schema additionalProperties: {type: string}
          # `log ... len <bytes>`. HAProxy truncates a longer line mid-byte,
          # which makes the record invalid JSON, so raise this if custom fields
          # or captured request headers push records past it. Accepted range:
          # 1024-65535; outside it the render fails rather than truncating.
          maxLineBytes: 16384
          # Drop records for uninteresting requests. OPT-IN, and off by default
          # on purpose.
          #
          # Retaining a full access log for weeks is lawful under legitimate
          # interest (GDPR Art. 6(1)(f)) — data minimisation does not require
          # discarding it. And it is operationally valuable: when a customer
          # reports a broken request, the SUCCESSFUL requests immediately before
          # and after it are what let you tell "this one request failed" from
          # "everything was failing", or spot the retry that succeeded. Suppress
          # only when volume genuinely forces it.
          #
          # Volume for scale: a record is ~740 bytes, so ~700 MB per million
          # requests.
          #
          #   successful   drop 2xx/3xx records that no gate denied. Denials
          #                (denied_by set), 4xx and 5xx are ALWAYS kept, so the
          #                failures a customer reports are never the ones lost.
          suppress:
            successful: false
          # Where access-log records go. Defaults to the container's stdout.
          #
          # HAProxy's own process and alert messages are NOT affected by this —
          # they keep their own stdout target, so `kubectl logs` stays useful for
          # on-call even when the access log is routed elsewhere. That split is
          # the point: the access log carries a client_ip field (personal data
          # under GDPR), which many organisations must keep out of a general
          # log store that every employee can read.
          #
          # A map of target name to target. Each target renders one HAProxy `log`
          # line. Several targets fan out to several destinations, which is what
          # a migration needs.
          #
          #   address   stdout | stderr | fd@<n> | <host>:<port> | [<ipv6>]:<port>
          #             | /path/to.sock | ring@<name>. Plain <host>:<port> is UDP.
          #             A ring@<name> must name a ring declared by one of these
          #             targets: HAProxy accepts a dangling reference at config
          #             check and then refuses to start.
          #   format    raw | rfc3164 | rfc5424 | local | priority | short | timed
          #             | iso. Defaults to raw for stdout/stderr (so `kubectl logs
          #             | jq` works) and rfc5424 otherwise (a collector parses the
          #             syslog envelope, then the JSON record inside it).
          #   facility  one of the 24 syslog facilities (default local0)
          #   level     info (default) or debug. This is a MAXIMUM severity and
          #             access records are emitted at info, so anything stricter
          #             drops every one of them while haproxy -c still passes.
          #   ring      buffered TCP client instead of a bare address; the chart
          #             emits the ring section and logs to ring@<name>. Records
          #             queue in memory while the collector is down and flush on
          #             reconnect, so a restarting log shipper never affects
          #             traffic. Plain UDP would drop them.
          #
          # Ship to a Vector (or Fluent Bit) sidecar over a buffered TCP ring:
          #
          #   targets:
          #     shipper:
          #       ring:
          #         name: accesslog
          #         address: 127.0.0.1:6514   # <host>:<port>; no UNIX sockets
          #         size: 65536               # in-memory buffer, bytes; must be
          #                                   # at least maxLineBytes + 256
          #         logProto: legacy          # legacy (newline) | octet-count
          #         connectTimeout: 5s
          #         serverTimeout: 10s
          #         # appended verbatim to the ring's `server` line, e.g.
          #         # "ssl verify required ca-file /etc/haproxy/ssl/ca.pem" or
          #         # "resolvers dns init-addr last,libc,none" for a DNS name.
          #         # Any file referenced here must ALSO exist where the config is
          #         # validated (the controller pod), not only in the HAProxy pod.
          #         serverOptions: ""
          #
          # A ring server's address is resolved at config-parse time, so use a
          # loopback sidecar address or a literal IP unless you pass resolvers
          # through serverOptions.
          #
          # LEFT UNSET on purpose. Omitting it means `{stdout: {address: stdout}}` — the
          # snippet applies that default itself. Unset is what lets the chart tell
          # "operator chose stdout" apart from "operator chose nothing": with
          # vector.enabled=true the chart points this at the vector socket, and it
          # only does so when this key is absent, so setting it here (to anything,
          # including stdout) keeps your choice and leaves the sidecar with no log
          # source. An explicitly EMPTY map is rejected rather than defaulted.
          #
          #   targets:
          #     stdout:
          #       address: stdout
        # HAProxy's Prometheus exporter (status frontend, port haproxy.ports.stats,
        # path /metrics). Prometheus scrapes it directly on every pod; the sidecar
        # does not re-export it. The exclusions below are applied by HAProxy itself,
        # as the query string of a scrape that sends none, so every scraper gets
        # them — the chart's PodMonitor and a hand-written job alike. A scrape that
        # sends its own query keeps it (`/metrics?` returns the raw exposition).
        prometheusExporter:
          # HAProxy's `?no-maint`: omit servers in MAINT state. The single biggest
          # lever on scrape size, because in HAPTIC's model MAINT means "reserved
          # slot with no backing pod" — backends keep spare slots so scaling within
          # the headroom needs no reload, and each spare slot still emits a full
          # metric set of zeros. Measured on a real 2-pod fleet: 159 of 193 slots
          # (82%) were empty placeholders, 10,176 of 15,116 series (67%).
          #
          # No metric NAME disappears, so name-selecting dashboards keep working;
          # haproxy_backend_agg_server_status{state="MAINT"} still reports how many
          # slots are free (which is why haproxy_backend_agg_* is NOT excluded below).
          # Set to false if you alert on an individual drained server.
          # Honoured on HAProxy 3.0 (the supported floor) and 3.4.
          excludeMaintServers: true
          # Metric families HAProxy leaves out of the exposition (`metrics=-<name>`).
          # A MAP keyed by name, not a list: Helm replaces a list wholesale, so
          # turning one exclusion off would mean restating every other and silently
          # inheriting none of the defaults added later. Against a map you disable
          # exactly what you mean to:
          #
          #     prometheusExporter:
          #       excludeMetrics:
          #         backendAggCheckStatus:
          #           enabled: false
          #
          # Add your own the same way. `enabled` and `families` are both required:
          # an entry without `enabled` is refused at render time rather than
          # sitting inert. `families` are EXACT metric names — the exporter has no
          # regex filter; anything else is ignored silently, so a name is
          # validated at render time. `requires` is a dotted extraContext path
          # that must be truthy for the exclusion to apply: the family replacing
          # this one is actually emitted.
          #
          # The default drops HAProxy's host-computed maxima, which are a
          # Prometheus anti-pattern: they cannot be aggregated across pods, and a
          # "since the process started" maximum never resets.
          #
          #   haproxy_*_max_sessions / _max_queue / _max_session_rate
          #       -> max_over_time(haproxy_*_current_sessions[1h]) etc. — a WINDOWED
          #          max from series that are already exported.
          #   haproxy_*_max_*_time_seconds
          #       -> a since-boot latency maximum is not aggregatable and cannot be
          #          reset; use the _average_seconds series (kept, see below) or
          #          the request-metrics histograms for tail latency.
          #
          # NOT dropped by default, though both are aggregates:
          #
          #   haproxy_backend_agg_*  — with excludeMaintServers above it becomes the
          #       ONLY remaining free-slot census, so dropping it would remove the
          #       signal rather than duplicate it. Exclude haproxy_backend_agg_server_status
          #       here if you keep the per-server series instead
          #       (excludeMaintServers: false), where
          #       count by (proxy) (haproxy_server_status == 1) reproduces it sliceably.
          #   haproxy_server_http_responses_total — per SERVER, so the request
          #       metrics do not cover it (those carry no server dimension, by design).
          #
          # The series counts below are measured on a real 825-backend / 8203-server
          # fleet, after no-maint, where the exposition is 84,973 series and
          # per-BACKEND families are ~75% of it — backend count is the driver at
          # scale, not server count.
          excludeMetrics:  # @schema mergeProperties
            # Since-boot maxima and "max over the last 1024 connections". Not
            # aggregatable across pods, never reset, and derivable from the raw
            # series with max_over_time() / count by ().
            serverBackendMax:
              enabled: true
              families:
                - haproxy_backend_max_connect_time_seconds
                - haproxy_backend_max_queue
                - haproxy_backend_max_queue_time_seconds
                - haproxy_backend_max_response_time_seconds
                - haproxy_backend_max_session_rate
                - haproxy_backend_max_sessions
                - haproxy_backend_max_total_time_seconds
                - haproxy_server_max_connect_time_seconds
                - haproxy_server_max_queue
                - haproxy_server_max_queue_time_seconds
                - haproxy_server_max_response_time_seconds
                - haproxy_server_max_session_rate
                - haproxy_server_max_sessions
                - haproxy_server_max_total_time_seconds

            # -13,168 series (15.5%). LOSSLESS: summing haproxy_server_check_status
            # by (proxy,state) reproduces this family exactly — verified across all
            # 823 populated backends x 16 states with zero mismatches, and 12,885 of
            # the 13,168 series are structural zeros. Queries must use the sum form.
            backendAggCheckStatus:
              enabled: true
              families:
                - haproxy_backend_agg_check_status

            # -4,115 series (4.8%). Byte-identical to haproxy_backend_agg_server_status
            # (which is KEPT — it is the free-slot census) on every (proxy,state)
            # pair, because HAPTIC renders a uniform `default-server check`.
            # Set enabled: false if you use the agent-check annotations — with an
            # agent check the two families can diverge, and this one carries the
            # distinction.
            backendAggServerCheckStatus:
              enabled: true
              families:
                - haproxy_backend_agg_server_check_status

            # Keep compression metrics for routes that opt in; enable exclusion
            # only if no route uses compression.
            backendHttpCompression:
              enabled: false
              families:
                - haproxy_backend_http_comp_bytes_bypassed_total
                - haproxy_backend_http_comp_bytes_in_total
                - haproxy_backend_http_comp_bytes_out_total
                - haproxy_backend_http_comp_responses_total

            # -1,650 series (1.9%). Every one is zero unless a template adds
            # HAProxy's native `cache` section (the chart's caching annotations are
            # a Varnish tier and do not emit these). Set enabled: false if you add one.
            backendHttpCache:
              enabled: true
              families:
                - haproxy_backend_http_cache_hits_total
                - haproxy_backend_http_cache_lookups_total

            # -1,108 series (1.3%). HAPTIC renders no backup servers, so both are
            # constant. Deliberately does NOT touch haproxy_backend_active_servers /
            # haproxy_server_active: `active_servers == 0` is the standard "this
            # backend has no live endpoint" alert.
            backupTopology:
              enabled: true
              families:
                - haproxy_backend_backup_servers
                - haproxy_server_backup

            # An average over the last 1024 connections: not aggregatable across
            # pods and blind to the tail. The request-metrics duration histograms
            # measure the same four phases with real quantiles.
            requestTimingAverages:
              enabled: true
              requires: vector.requestMetrics.enabled
              families:
                - haproxy_backend_connect_time_average_seconds
                - haproxy_backend_queue_time_average_seconds
                - haproxy_backend_response_time_average_seconds
                - haproxy_backend_total_time_average_seconds
                - haproxy_server_connect_time_average_seconds
                - haproxy_server_queue_time_average_seconds
                - haproxy_server_response_time_average_seconds
                - haproxy_server_total_time_average_seconds

            # Status counts bucketed into 1xx..5xx per proxy; <prefix>_requests
            # carries the exact code plus route, method, host and service. What
            # you give up: HAProxy counts in the data path, these come from the
            # access log, which is lossy under back-pressure — set false to keep
            # an exact census.
            #
            # haproxy_server_http_responses_total is NOT matched: it is per-server,
            # a dimension the request metrics do not carry.
            httpRequestCounters:
              enabled: true
              requires: vector.requestMetrics.enabled
              families:
                - haproxy_backend_http_requests_total
                - haproxy_backend_http_responses_total
                - haproxy_frontend_http_responses_total
        # Template-library routing behavior. This lives in extraContext so the
        # rendered HAProxyTemplateConfig carries the same setting that selected
        # the library variant at Helm render time.
        routing:
          # default: Exact > Regex > Prefix-exact > Prefix
          # last:    Exact > Prefix-exact > Prefix > Regex
          regexMatchOrder: default  # @schema enum: [default, last]
        # Template-owned status writes. Disable during side-by-side migration
        # so an incumbent controller remains the sole owner of status/DNS data.
        statusPatches:
          enabled: true
        # Parallel sharding is auto-calculated based on resource count and GOMAXPROCS.
        # Formula: clamp(resourceCount / 300, 1, 2 * GOMAXPROCS)
        # Override by setting shardCountOverride to a specific value:
        # shardCountOverride: 8
        # HAProxy bind ports are defined in haproxy.ports (referenced by templates)
        ingressPermissions:
          # Accept annotations whose value is inserted into haproxy.cfg verbatim:
          # haproxy-haptic.org/config-*, haproxy-ingress.github.io/config-*,
          # haproxy.org/backend-config-snippet, and
          # nginx.ingress.kubernetes.io/configuration-snippet. Their directives
          # can affect every host and read HAProxy's files, TLS keys included.
          # While WAF governance is active, waf.ingressPermissions must allow
          # them too. See
          # https://haproxy-haptic.org/docs/latest/operations/security/#raw-configuration-annotations
          allowRawHAProxyConfig: false
        annotationCompatibility:
          basicAuth:
            passwordHashValidation:
              # bcrypt, SHA-256/SHA-512 crypt, yescrypt. HAProxy's crypt(3) can't
              # verify $apr1$; $1$ (MD5-crypt) and DES crypt are too weak.
              regex: '^\$(2[aby]|5|6|y)\$[./0-9A-Za-z$=]+$'
              errorMessage: "Replace it with a bcrypt, SHA-256/SHA-512 crypt or yescrypt hash, for example from htpasswd -nB <user>"
        tls:
          hsts:
            # Global HSTS is opt-in; per-Ingress hsts annotations still win.
            enabled: false
            # Also the default for haproxy-haptic.org/hsts-max-age.
            maxAge: "31536000"  # @schema pattern: ^[0-9]+$
            includeSubdomains: false
            preload: false
          # Fleet-wide TLS session resumption. Off by default. When on, the SSL
          # library emits a self-rotating session-ticket key (STEK) file shared by
          # every HAProxy pod, so a returning client resumes on any pod (TLS 1.2
          # and 1.3). The key rotates daily via a 3-key window (one hitless
          # reload), crypto-random, no secret to manage. See
          # docs/site/docs/ssl-certificates.md#tls-session-resumption.
          sessionTickets:
            enabled: false
          # Answer 421 to an HTTPS request whose Host differs from its TLS SNI.
          # Off by default: proxies and CDNs that re-encrypt to HAProxy often send
          # the origin's name as SNI. The haproxy-haptic.org/require-sni-host-match
          # annotation enables it for one Ingress.
          requireSniHostMatch: false
        # Shared HAProxy buffering contract for request-body inspectors.
        # tune.bufsize is process-global, so JSON Schema validation and Coraza
        # deliberately share one capacity instead of exposing conflicting knobs.
        requestBodyInspection:
          haproxyBuffer:
            # Total HAProxy buffer size. The buffer also holds the request line,
            # headers, and rewrite space; it is not all available to the body.
            sizeBytes: 16384
            # Capacity reserved for everything except the request body. Increase
            # this for large cookies, JWTs, tracing headers, or similar metadata.
            reservedBytes: 8192

        # Wait for the request body before opening a backend connection, so a
        # client that trickles its upload pins an HAProxy buffer instead of a
        # backend server slot (the "slow POST" attack). HAProxy releases the
        # request once the body is complete OR tune.bufsize is full, so this
        # never buffers a whole upload — a large body proceeds as soon as the
        # first bufsize bytes arrive.
        #
        # Only requests that declare a Content-Length are held. Nothing that
        # streams can declare its length upfront, so gRPC (which sends neither
        # Content-Length nor Transfer-Encoding, for unary and streaming calls
        # alike) and chunked streaming uploads are never buffered — buffering
        # those deadlocks the stream until the wait expires and the client gets
        # a 408 the backend never saw.
        #
        # Override per route with the haproxy-haptic.org/request-buffering
        # annotation. See
        # https://haproxy-haptic.org/docs/latest/libraries/base/#request-buffering
        requestBuffering:
          enabled: true
          # How long HAProxy waits for the declared body. On expiry the client
          # gets 408 and the backend is never contacted, so keep this above the
          # time your slowest legitimate client needs to send tune.bufsize bytes.
          waitTimeout: 10s  # @schema type: [string, integer]

        # Template-library behavior for API-gateway features. Plugin execution
        # limits remain under spoaHub.plugins.api-gateway.
        apiGateway:
          requestSchemaValidation:
            # Enables native JSON request-schema annotations. Annotations fail
            # loudly while disabled, and enabling this auto-enables the plugin.
            enabled: false
            requestBody:
              # Maximum time HAProxy waits for a matching POST/PUT/PATCH body.
              # Routes without request-schema annotations never wait here.
              waitTimeout: 100ms  # @schema type: [string, integer]
              # Default per-route cap when the Ingress does not set
              # request-schema-max-body-size. Oversized requests are rejected
              # before JSON parsing or schema-validation CPU is spent.
              defaultMaxBytes: 8192
            # Default when the plugin returns no verdict — an unknown schema id,
            # a hub reload, a timeout. True allows the request: schema validation
            # reduces risk, it does not establish identity, so a blip in our own
            # sidecar must not refuse callers who did nothing wrong. See the
            # runtime-failure rule in charts/CLAUDE.md. The event is still
            # recorded, and missing referenced Kubernetes objects still fail at
            # render time. Set false where a malformed body reaching the backend
            # is worse than refusing the caller.
            defaultFailOpen: true

        customResponses:
          # <namespace>/<name> of a ConfigMap in the haproxy-haptic.org/error-pages
          # format whose pages apply to every Ingress; an Ingress's own pages
          # override it per status code. Empty: HAProxy's default pages.
          defaultErrorPages: ""
          # Log-format expressions an Ingress author may use in an lf-file
          # haproxy-haptic.org/error-pages page, besides %%. Every enabled entry
          # is open to every Ingress author: never enable env(), map(),
          # variables or an unescaped request header.
          expressions:  # @schema additionalProperties: {type: object, required: [enabled, expression], additionalProperties: false, properties: {enabled: {type: boolean}, expression: {type: string}}}
            clientAddress: {enabled: true, expression: "%[src]"}
            host: {enabled: true, expression: "%[req.hdr(host),lower,url_enc]"}
            requestId: {enabled: true, expression: "%ID"}

        # OIDC sign-in (haproxy-haptic.org/sso-auth). Each Ingress names a
        # provider Secret in its own namespace; the SPOA hub fetches that
        # provider's discovery document, keys and tokens from the HAProxy pods.
        ssoAuth:
          # Issuer URL prefixes a provider Secret's discovery-url may start
          # with, keyed by a name of your choice. Empty: every sso-auth route
          # answers 503. Example:
          #   keycloak: https://keycloak.example.com/realms/main/
          allowedIssuers: {}  # @schema skipProperties; additionalProperties: {type: string}

        # WAF routing and policy behavior. This remains engine-neutral; Coraza
        # implementation/runtime settings belong under spoaHub.plugins.coraza.
        waf:
          # What happens when the SPOA hub or coraza plugin cannot answer — a
          # reload, a restart, a timeout. Default false: the request is ALLOWED.
          # A WAF reduces risk, it does not establish identity, so a blip in our
          # own sidecar must not refuse traffic that did nothing wrong. Either
          # way the event is counted (haptic_degraded_waf_total and
          # the waf_degraded access-log field), so a WAF that is silently not
          # inspecting stays visible.
          #
          # Set true only where letting a request past uninspected is worse than
          # refusing it. Requests the WAF did inspect and rejected are denied
          # with 403 in both postures.
          failClosed: false
          dispatch:
            # opt-in: inspect only routes activated by a native or compatibility
            # WAF annotation. default-on: inspect every route unless an
            # authorized nginx-compatible enable-modsecurity=false annotation
            # opts it out.
            mode: opt-in  # @schema enum: [opt-in, default-on]
            # Enforcement for default-on routes without a policy or route
            # override. Ignored in opt-in mode. Valid values: deny, detect.
            defaultEnforcement: deny  # @schema enum: [deny, detect]
          # Replaces the OWASP CRS compiled into the coraza plugin with one
          # fetched over HTTP, so a CRS release can be adopted without
          # rebuilding and redeploying the plugin image.
          #
          # Empty (the default) uses the embedded ruleset. When set, HAPTIC
          # substitutes the fetched files for the `@crs-setup.conf.example` and
          # `@owasp_crs/*.conf` includes in spoaHub.plugins.coraza.directives;
          # everything else there, including the ORDER that decides whether the
          # WAF blocks or only detects, is left alone.
          #
          # The URL must serve a gzip-compressed tar of a CRS release. HAPTIC
          # writes each `.conf` to general storage prefixed `crs-`, and each
          # `.data` under its exact upstream name — CRS rules reference those by
          # bare name via @pmFromFile, so they cannot be renamed.
          #
          # If the ruleset cannot be obtained, HAPTIC falls back in order:
          # the last ruleset deployed to the fleet, then the plugin's embedded
          # CRS. A failed fetch never fails the render, so an upstream outage
          # cannot block unrelated configuration changes.
          crs:
            url: ""
            # Refresh interval. The fetcher issues a conditional GET
            # (If-None-Match / If-Modified-Since); a 304 or unchanged content
            # costs nothing — no re-render, no push, no WAF recompile.
            refreshInterval: 1h
            timeout: 30s
            retries: 3

          # Capabilities granted to Ingress authors whenever an administrator-
          # owned WAF baseline exists: reusable policies are enabled or dispatch
          # mode is default-on. They are deliberately outside `policies` because
          # vendor annotations can weaken a default-on baseline without selecting
          # a reusable policy. In plain opt-in compatibility mode these controls
          # stay dormant, preserving the vendor libraries' upstream behavior.
          ingressPermissions:
            allowPolicySelection: true
            allowEnforcementOverride: false
            # Separate from enforcement-mode changes: disabling the WAF is a
            # stronger capability than selecting deny/detect and is denied by
            # default even if mode overrides are authorized.
            allowWafDisable: false
            # Permit route authors to supply arbitrary WAF rules through the
            # native before/after annotations or vendor SecLang snippets.
            allowCustomRules: false
            # Can only narrow extraContext.ingressPermissions.allowRawHAProxyConfig.
            allowRawHAProxyConfig: false
          # Bounds for arbitrary SecLang supplied by Ingress annotations. These
          # always apply, even when the reusable policy catalog is disabled, so
          # compatibility annotations cannot create unbounded Coraza state.
          customRules:
            limits:
              # Maximum number of Ingress-specific Coraza applications.
              maxIngresses: 32
              # Maximum combined SecLang bytes accepted from one Ingress.
              maxBytesPerIngress: 16384
          # Centrally administered reusable policies selected by exact name via
          # haproxy-haptic.org/waf-policy.
          policies:
            # Optional policy applied when an Ingress does not select one. Pair
            # with ingressPermissions.allowPolicySelection=false to make it an
            # immutable baseline for every managed Ingress.
            defaultPolicy: ""
            requestBody:
              # Wait applies only to policies whose requestBody.mode is not none.
              waitTimeout: 100ms  # @schema type: [string, integer]
              # Default body cap for policies that omit requestBody.maxBytes.
              defaultMaxBytes: 8192
              # Maximum body cap a policy may request. Keep this separate from
              # the default so approving a larger policy does not silently
              # enlarge every policy that omitted an explicit cap. The effective
              # per-policy limit is also written into Coraza's application config.
              maxBytes: 8192
            limits:
              maxCount: 16
              maxSecLangBytes: 65536
              maxRuleExclusions: 256
            # Inline policies use the same schema as ConfigMap policies:
            #
            # inline:
            #   public-web:
            #     description: Public web application, metadata only
            #     enforcement: deny       # deny (default) or detect
            #     requestBody:
            #       mode: none            # none (default), any, or json
            #       maxBytes: 4096         # optional; <= policies.requestBody.maxBytes
            #     # Structured CRS tuning — lowered to setup-position
            #     # SecActions BEFORE the CRS rules include (a position raw
            #     # secLang cannot reach), and allowed in self-service
            #     # catalogs because no arbitrary rule code is involved.
            #     allowedMethods: [GET, HEAD, POST, OPTIONS, PUT, PATCH, DELETE]
            #     paranoiaLevel: 2          # 1 (default) .. 4
            #     anomalyThreshold:
            #       inbound: 10
            #     # Structured, self-service-safe rule exclusions. The tenant
            #     # supplies only numeric CRS rule IDs, an exact target
            #     # variable, and a literal path — the chart owns the SecRule
            #     # and its literal operator, so no tenant regex ever runs on
            #     # the request path. CRS setup/anomaly-scoring/correlation
            #     # rules are reserved (can't disable enforcement itself).
            #     ruleExclusions:
            #       # disable a rule only on matching paths (the git-host case):
            #       - rules: [930130]
            #         onPathContains: ".git/"      # or onPathPrefix/onPathExact/onPathSuffix
            #       # drop one parameter from a rule (optionally path-scoped):
            #       - rules: [941320]
            #         excludeTarget: "ARGS:wp_post"
            #       # disable a rule everywhere in this app (no path):
            #       - rules: [913100]
            #     secLang: |
            #       SecRuleRemoveById 941320
            inline: {}  # @schema additionalProperties: true
            # Trusted cross-namespace policy catalogs, keyed by catalog name
            # like `inline` above — Helm merges maps key by key, so adding one
            # catalog keeps the rest. Sources never override each other;
            # duplicate names fail. Protect these ConfigMaps with RBAC because
            # their writers are WAF policy authors.
            #
            # configMapRefs:
            #   security:
            #     namespace: security
            #     name: haptic-waf-policies
            #     key: policies.yaml
            configMapRefs: {}  # @schema additionalProperties: {type: object, additionalProperties: false, properties: {namespace: {type: string}, name: {type: string}, key: {type: string}}}
            # Namespaced self-service policy authoring. When enabled, every
            # namespace may define WAF policies for ITS OWN Ingresses in a
            # ConfigMap named `configMapName` (data key `key`) in that
            # namespace — no per-namespace registration. Safe by construction:
            #
            #   * Namespace-scoped identity: a self-service policy is selectable
            #     only by Ingresses in its own namespace and can never collide
            #     with or shadow another namespace's or the trusted catalog's
            #     names (an ambiguous name is rejected, never silently resolved).
            #   * Scoped failure: a broken self-service catalog or policy records
            #     Warning Events on the ConfigMap and fails ONLY that namespace's
            #     selecting routes closed (503) — it never aborts the global
            #     render, and the admission webhook still rejects a proposed
            #     change that introduces the breakage.
            #   * Bounded content: secLang is refused unless allowSecLang is
            #     true; requestBody stays bounded by the requestBody.maxBytes
            #     ceiling above; per-namespace and total policy counts are
            #     capped. Note the caps bound size and count, not rule CPU —
            #     enabling allowSecLang lets namespaces run arbitrary SecLang in
            #     the shared Coraza process.
            #
            # defaultPolicy always resolves in the trusted catalog only, so a
            # tenant policy can never become the cluster baseline.
            selfService:
              enabled: false
              configMapName: waf-policies
              key: policies.yaml
              allowSecLang: false
              limits:
                maxPoliciesPerNamespace: 4
                maxTotalPolicies: 64
    watchedResourcesIgnoreFields:
      - metadata.managedFields
      - metadata.annotations['kubectl.kubernetes.io/last-applied-configuration']
    watchedResources:  # @schema skipProperties; additionalProperties: true
      # Resource-specific watched resources are defined in template libraries:
      # - ingresses: Defined in ingress library (when enabled)
      # - httproutes, grpcroutes: Defined in gateway library (when enabled)
      #
      # Core resources (always watched):
      services:
        apiVersion: v1
        resources: services
        indexBy: ["metadata.namespace", "metadata.name"]
      endpoints:
        apiVersion: discovery.k8s.io/v1
        resources: endpointslices
        indexBy: ["metadata.namespace", "metadata.labels.kubernetes\\.io/service-name"]
        # "0" = no per-watcher debounce: fire on every EndpointSlice change so
        # a pod-IP rotation reaches HAProxy inside the kubelet Ready→SIGTERM
        # window. The coordinator still coalesces triggers that arrive while a
        # render is in flight.
        debounceInterval: "0"
      secrets:
        apiVersion: v1
        resources: secrets
        store: on-demand
        indexBy: ["metadata.namespace", "metadata.name"]
        #
        # Add custom or override library-defined entries. Per-resource
        # debounceInterval is supported (default 100ms).
    # Add or override templateSnippets, maps, files, and haproxyConfig here.
    # Additional validationTests must have unique names across all libraries.
    # templateSnippets:
    # maps:
    # files:
    # haproxyConfig:
    # validationTests:

# IngressClass resource
# Creates an IngressClass resource for Kubernetes 1.18+
# Only created when ingress library is enabled and API is available
ingressClass:
  # Enable IngressClass creation
  enabled: true
  # Name of the IngressClass
  # Default is "haptic" (not "haproxy") to avoid conflicts with other HAProxy
  # ingress controllers during side-by-side migration. Override to "haproxy"
  # (or any other value) if you are replacing an existing controller and want
  # existing Ingress manifests to match without edits.
  name: haptic
  # Mark as default IngressClass for the cluster
  # Warning: Only one IngressClass should be marked as default cluster-wide
  # Set to true only if this is the sole ingress controller
  default: false
  # Controller identifier (must be unique across all ingress controllers)
  # This value should match what the controller uses to identify itself
  controllerName: haproxy-haptic.org/controller
# GatewayClass resource
# Creates a GatewayClass resource for Gateway API
# Only created when gateway library is enabled and Gateway API CRDs are installed
# Prerequisites: Gateway API CRDs must be installed first:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.0/standard-install.yaml
gatewayClass:
  # Enable GatewayClass creation
  enabled: true
  # Name of the GatewayClass
  # Default is "haptic" (matching ingressClass.name) to avoid conflicts with
  # other HAProxy Gateway controllers during side-by-side migration.
  name: haptic
  # Mark as default GatewayClass for the cluster
  # Warning: Only one GatewayClass should be marked as default cluster-wide
  # Set to true only if this is the sole Gateway API controller
  default: false
  # Controller identifier (must be unique across all Gateway API controllers)
  # This value should match what the controller uses to identify itself
  controllerName: haproxy-haptic.org/controller
  # Reference to HAProxyTemplateConfig for controller-specific configuration
  # Automatically points to the HAProxyTemplateConfig created by this chart
  # This links Gateway API configuration to the controller's template-based config
  parametersRef:
    group: haproxy-haptic.org
    kind: HAProxyTemplateConfig
    # Name will default to controller.configName if empty
    name: ""
    # Namespace will default to Release.Namespace if empty
    namespace: ""
# Basic credentials for the explicit legacy agent transport. The controller
# still reads this Secret when mutual TLS is enabled.
credentials:
  # Read an externally managed Secret instead of rendering credentials.
  existingSecret: ""
  dataplane:
    username: admin
    password: ""  # Leave empty for a random auto-generated password
# HAProxy data plane configuration
# Deploys HAProxy pods with a HAPTIC agent sidecar
# The controller manages these pods' configurations
haproxy:
  # Enable HAProxy deployment as part of this chart
  # Set to false to use external HAProxy pods (bring your own HAProxy)
  enabled: true
  # HAProxy container ports. http/https default to the literal Gateway
  # listener-port numbers (80/443) so Gateway listeners on those ports
  # never collide with the chart-static internal binds.
  ports:
    http: 80  # HTTP frontend
    https: 443  # HTTPS frontend
    stats: 8404  # Health/stats page
    dataplane: 5555  # Agent apply/state API (for controller communication)
    agentMetrics: 5557  # Agent Prometheus endpoint (scraped by the PodMonitor)
  # Number of HAProxy replicas
  replicaCount: 2
  # Preserve at least one ready HAProxy pod during voluntary disruptions.
  podDisruptionBudget:
    enabled: true
    # Null derives 0 for a one-pod minimum fleet and 1 otherwise.
    maxUnavailable: null  # @schema type: [integer, null]
  # Prometheus scraping of the HAProxy pod. The bundled controller
  # ServiceMonitor/PodMonitor cover the controller only, never this pod.
  monitoring:
    # One PodMonitor (prometheus-operator CRDs required) for every metrics
    # endpoint the HAProxy pod exposes: HAProxy's own exporter on the `stats`
    # port (haproxy_*, filtered by extraContext.prometheusExporter), vector's
    # `vector-metrics` (+ `vector-sizes` while a request-metrics size family is
    # on) when the sidecar is enabled, and the spoa-hub's `metrics` port when the
    # hub is on and vector is off (with vector on, vector re-exports the hub over
    # loopback, so spoaHub.hub.metricsAddr can stay on its loopback default).
    # The pod's NetworkPolicy allows these ports from `allowedSources`.
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}  # @schema skipProperties; additionalProperties: true
      relabelings: []
      metricRelabelings: []
  # HAProxy image configuration
  # Tag defaults to the patch version from haproxyPatchVersions (community) or
  # haproxyEnterprisePatchVersions (enterprise) for the selected haproxyVersion.
  image:
    # Empty derives the repository from enterprise.enabled:
    # community -> haproxytech/haproxy-debian
    # enterprise -> hapee-registry.haproxy.com/haproxy-enterprise
    repository: ""
    pullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
    # Override the HAProxy pod image tag. Leave empty to use the patch version
    # from haproxyPatchVersions or haproxyEnterprisePatchVersions (recommended).
    # Example: "3.2.10" (community) or "3.2r2" (enterprise)
    tag: ""
  # Enterprise mode configuration
  # Set to true when using HAProxy Enterprise images (hapee-registry.haproxy.com/haproxy-enterprise)
  # Enterprise images have different binary paths and user configuration
  enterprise:
    enabled: false
  # HAProxy binary path - automatically derived from enterprise settings.
  # Override only if using a custom image with a non-standard path.
  # Community default:  /usr/local/sbin/haproxy
  # Enterprise default: /opt/hapee-{haproxyVersion}/sbin/hapee-lb
  haproxyBin: ""
  # HAProxy service configuration
  # Service exposes HAProxy container ports externally
  # targetPort references are defined in template using named ports
  service:
    type: NodePort  # @schema enum: [ClusterIP, NodePort, LoadBalancer]
    annotations: {}  # @schema skipProperties; additionalProperties: true
    # LoadBalancer configuration (when type: LoadBalancer)
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    # External traffic policy (Cluster or Local)
    # Local preserves client source IP but may cause uneven load distribution
    externalTrafficPolicy: ""
    # Internal traffic policy
    internalTrafficPolicy: ""
    # Health check node port (for LoadBalancer with Local traffic policy)
    healthCheckNodePort: ""  # @schema type: [string, integer]
    # Publish not-ready addresses
    publishNotReadyAddresses: false
    # Port configurations
    http:
      port: 80
      # targetPort: http (set in template)
      nodePort: 30080
    https:
      port: 443
      # targetPort: https (set in template)
      nodePort: 30443
    stats:
      port: 8404
      # targetPort: stats (set in template)
      nodePort: 30404
    # Additional Service ports (corev1.ServicePort shape). Concatenated
    # with the http/https/stats entries above. Set http/https/stats.port=0
    # to drop a default entry.
    extraPorts: []
  # HAPTIC agent sidecar. It runs from the controller image and owns this pod's
  # file tree and HAProxy runtime socket: the controller sends it the rendered
  # file set plus the runtime commands, and it writes, reloads, and reports.
  # Pod readiness stays with HAProxy's own /ready — see the HAProxy deployment
  # page in the docs for the readiness semantics.
  agent:
    tls:
      enabled: true
      # Managed identities renew automatically; false uses external Secrets.
      managed: true
      issuerSecretName: ""
      serverSecretName: ""
      clientSecretName: ""
      serverName: ""
      clientName: ""
      certValidityDays: 365
      renewal:
        resources:  # @schema skipProperties; additionalProperties: true
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      certManager:
        enabled: false
        createIssuer: true
        issuerRef:
          name: ""
          kind: Issuer
          group: cert-manager.io
    # Log level for the agent, which logs JSON on stdout: one record per apply,
    # plus every reload and every runtime command HAProxy rejected.
    #
    # Raise to `debug` or `trace` when diagnosing an apply that the controller
    # reports as failing but HAProxy accepts.
    #
    # This stream carries no end-user data: the only client is the HAPTIC
    # controller, so the logged addresses are its pod IP.
    #
    #   trace | debug | info | warning | error
    logLevel: info  # @schema enum: [trace, debug, info, warning, error]
    service:
      type: ClusterIP  # @schema enum: [ClusterIP, NodePort, LoadBalancer]
      # port references haproxy.ports.dataplane (set in template)
    # Credentials are configured via top-level 'credentials.dataplane' section
    # Resource limits and requests for the agent sidecar.
    # No CPU limit is set to avoid throttling.
    resources:  # @schema skipProperties; additionalProperties: true
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi
    # Extra environment variables for the agent container
    # Example:
    #   extraEnv:
    #     - name: GOMAXPROCS
    #       value: "4"
    # GOMAXPROCS overrides Go's CPU-based default.
    extraEnv: []
  # Extra environment variables for HAProxy container
  # Example:
  #   extraEnv:
  #     - name: MY_VAR
  #       value: "my-value"
  extraEnv: []
  # Shared memory stats file (shm-stats-file global directive, HAProxy 3.3+).
  # Persists HAProxy stats counters in a memory-mapped file across reloads,
  # eliminating false metric drops on dashboards when HAProxy reloads.
  # Requires HAProxy 3.3+ (version-gated in templates via semver_gte).
  shmStats:
    enabled: false
    path: "/dev/shm/haproxy-stats"
    # Maximum number of objects in the shm-stats file. Each HAProxy frontend,
    # backend, listen, and server directive counts as one object. The shm-stats
    # file is fixed-size once created — HAProxy cannot resize it on reload.
    # Formula: (number of backends + number of servers) * safety margin.
    # Default 50000 supports ~40k servers with headroom.
    maxObjects: 50000
    # /dev/shm emptyDir size cap (medium: Memory). Auto-calculated from
    # maxObjects (~4KB/object +10%). Counts against pod memory limit.
    # shmSizeLimit: "256Mi"
  # HAProxy nbthread. When unset: derived from the CPU limit below if one is
  # set (ceil to whole cores); otherwise omitted so HAProxy auto-detects all
  # node cores from its CPU affinity. This uses every core on static on-prem
  # nodes without inflating CPU requests, and respects the quota in the cloud.
  # Set 0 to force-omit the directive; a positive int overrides. Supports tpl.
  # nbthread: 4
  # Guaranteed-QoS memory (requests=limits) for eviction protection. No
  # CPU limit — HAProxy then uses all node cores (nbthread auto-detects);
  # set limits.cpu to cap both the quota and nbthread. ~32KB per connection.
  resources:  # @schema skipProperties; additionalProperties: true
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  # Pod-spec scheduling, runtime, and metadata for the HAProxy Deployment.
  # The chart's _pod-spec.tpl helper renders the universally-shared fields
  # from this block. podSecurityContext, podAnnotations, and shareProcessNamespace
  # are consumed directly by templates/haproxy-deployment.yaml.
  podSpec:
    # Image pull secrets (private registry access). The pod pulls the HAProxy
    # image and the HAPTIC image (for its agent container); empty follows
    # controller.podSpec.imagePullSecrets.
    imagePullSecrets: []
    # Priority class for pod scheduling
    # Used to mark critical workloads for preferential scheduling and preemption
    # Common values:
    #   - system-cluster-critical: Highest priority for cluster infrastructure
    #   - system-node-critical: High priority for node management components
    #   - "" (empty): Default priority (recommended for most deployments)
    # Requires priority class to be pre-created in the cluster
    priorityClassName: ""
    # Topology spread constraints for high availability
    # Controls pod distribution across topology domains (zones, nodes, etc.)
    # Default: [] (empty, user opt-in)
    # Example for zone spreading:
    #   - maxSkew: 1
    #     topologyKey: topology.kubernetes.io/zone
    #     whenUnsatisfiable: DoNotSchedule
    #     labelSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: haptic
    #         app.kubernetes.io/component: loadbalancer
    topologySpreadConstraints: []
    # Node selector for HAProxy pods
    nodeSelector: {}  # @schema skipProperties; additionalProperties: true
    # Tolerations for HAProxy pods
    tolerations: []
    # Affinity rules for HAProxy pods
    affinity: {}  # @schema skipProperties; additionalProperties: true
    # DNS policy (ClusterFirst, ClusterFirstWithHostNet, Default, None)
    dnsPolicy: ClusterFirst
    # DNS config for custom nameservers, searches, and options
    dnsConfig: {}  # @schema skipProperties; additionalProperties: true
    # nameservers:
    #   - 8.8.8.8
    # searches:
    #   - my-namespace.svc.cluster.local
    # options:
    #   - name: ndots
    #     value: "2"
    # Host aliases (/etc/hosts entries)
    hostAliases: []
    # - ip: "127.0.0.1"
    #   hostnames:
    #     - "foo.local"
    # Runtime class name (for specialized runtimes like gVisor, Kata)
    runtimeClassName: ""
    # Extra pod annotations for HAProxy pods (supports template expressions)
    podAnnotations: {}  # @schema skipProperties; additionalProperties: true
    # Share process namespace between containers (required for signal-based sidecar reload)
    shareProcessNamespace: false
    # Termination grace period in seconds
    terminationGracePeriodSeconds: 90
    # Pod security context for HAProxy deployment
    # Complies with Pod Security Standards (PSS) Restricted profile.
    # HAProxy binds the literal 80/443 (+8404 stats) — see haproxy.ports.
    # Enterprise images add CAP_NET_BIND_SERVICE (their binaries carry file
    # capabilities requiring it; see templates/haproxy-deployment.yaml).
    # Community images drop ALL capabilities and run non-root, so binding the
    # privileged 80/443 ports relies on the node permitting non-root binds to
    # low ports (net.ipv4.ip_unprivileged_port_start <= 80, as in kind and
    # Docker's default). A cluster keeping the kernel default (1024) would need
    # CAP_NET_BIND_SERVICE added for community HAProxy or the sysctl lowered.
    #
    # UIDs are auto-derived based on enterprise.enabled:
    #   Community: runAsUser=99, runAsGroup=99, fsGroup=99 (haproxy user)
    #   Enterprise: runAsUser=1000, runAsGroup=1000, fsGroup=1000 (hapee-lb user)
    podSecurityContext:  # @schema skipProperties; additionalProperties: true
      seccompProfile:
        type: RuntimeDefault
      # Pod-level sysctls (requires kubelet allowedUnsafeSysctls for unsafe sysctls)
      sysctls: []
      # Example:
      #   - name: net.ipv4.tcp_wmem
      #     value: "4096 16384 536870912"
  # Extra volumes for HAProxy pod
  extraVolumes: []
  # - name: custom-config
  #   configMap:
  #     name: my-haproxy-config
  # Extra volume mounts for HAProxy container
  extraVolumeMounts: []
  # - name: custom-config
  #   mountPath: /etc/haproxy/custom
  #   readOnly: true
  # Init containers for HAProxy pod
  initContainers: []
  # - name: init-config
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'echo "Initializing..."']
  # Extra containers for the HAProxy pod, run as regular containers next to
  # HAProxy. The bundled agent, spoa-hub and vector are native sidecars instead
  # (started first, stopped last); put a container here only if it may stop
  # together with HAProxy.
  sidecars: []
  # - name: log-shipper
  #   image: fluent/fluent-bit:latest
  # Termination: kubelet stops HAProxy with SIGUSR1, HAProxy's own soft stop
  # (listeners unbind, in-flight connections finish, hardStopAfter caps the
  # drain). Before that signal the HAProxy container's preStop hook waits on the
  # agent's drain socket until no new connection has reached the pod for
  # quietPeriodSeconds, never longer than maxWaitSeconds. Silence doesn't prove
  # kube-proxy stopped routing to the pod: a client that pauses longer than
  # quietPeriodSeconds can be refused; see "Pod termination" in the docs. The agent, spoa-hub and vector are native
  # sidecars, stopped only after HAProxy exited from the same grace budget:
  # maxWaitSeconds plus hardStopAfter plus their shutdown must fit in
  # terminationGracePeriodSeconds.
  drain:
    enabled: true
    quietPeriodSeconds: 2
    maxWaitSeconds: 10
  # Container lifecycle hooks for the HAProxy container; when set they replace
  # the drain hook.
  lifecycle: {}  # @schema skipProperties; additionalProperties: true
  # Deployment update strategy
  updateStrategy:
    type: RollingUpdate  # @schema enum: [RollingUpdate, Recreate]
    rollingUpdate:
      maxSurge: 1  # @schema type: [integer, string]
      maxUnavailable: 0  # @schema type: [integer, string]
  # Minimum seconds for pod to be considered ready
  minReadySeconds: 0
  # Number of old ReplicaSets to retain
  revisionHistoryLimit: 10
  # KEDA autoscaling for HAProxy loadbalancer
  # Enables event-driven scaling based on traffic metrics
  keda:
    enabled: false
    # Scaling limits
    minReplicaCount: 2
    maxReplicaCount: 10
    # How often KEDA checks triggers (seconds)
    pollingInterval: 30
    # Cooldown period before scaling down (seconds)
    cooldownPeriod: 300
    # Fallback configuration if trigger fails
    fallback:
      failureThreshold: 3
      replicas: 2
    # Advanced HPA behavior configuration
    advanced: {}  # @schema skipProperties; additionalProperties: true
    # horizontalPodAutoscalerConfig:
    #   behavior:
    #     scaleDown:
    #       stabilizationWindowSeconds: 300
    #       policies:
    #         - type: Percent
    #           value: 10
    #           periodSeconds: 60
    #     scaleUp:
    #       stabilizationWindowSeconds: 0
    # Triggers (required when keda.enabled is true)
    # See: https://keda.sh/docs/2.17/scalers/
    triggers: []
    # CPU/memory/prometheus/cron triggers (standard KEDA ScaledObject trigger shape).
  # HAProxy bootstrap config (replaced by the controller on first
  # reconcile). Processed via Helm `tpl` — chart helpers and value refs
  # are available. CRITICAL: keep the /ready 503 below; returning 200
  # before controller takeover routes traffic to an empty backend set
  # (clients see 404s).
  initialConfig: |
    global
        log stdout len 4096 local0 info
        # The HAPTIC agent's runtime socket; the master socket runs neither
        # batched nor payload commands. Keep it in the rendered global too.
        stats socket /etc/haproxy/haproxy-worker.sock mode 600 level admin
        {{- with include "haptic.haproxy.nbthread" . }}
        nbthread {{ . }}
        {{- end }}
        {{- $hardStopAfter := "60s" }}
        {{- if hasKey .Values.controller.config.templatingSettings.extraContext "hardStopAfter" }}
        {{- $hardStopAfter = .Values.controller.config.templatingSettings.extraContext.hardStopAfter }}
        {{- end }}
        {{- if $hardStopAfter }}
        # Bound the bootstrap worker's drain after the controller installs the
        # real configuration. Keep this aligned with extraContext.hardStopAfter,
        # which controls the same directive in the rendered configuration.
        hard-stop-after {{ $hardStopAfter }}
        {{- end }}

    defaults
        mode http
        log global
        option httplog
        option idle-close-on-response
        # 100ms matches the controller-rendered default in
        # libraries/base.yaml defaults-settings-300-timeouts; the
        # bootstrap config doesn't have real backends (only the status
        # frontend + default_backend returning 404) so this value
        # rarely matters in practice, but staying consistent prevents
        # confusion if an operator inspects the live config before the
        # first controller-rendered push lands.
        timeout connect 100
        timeout client 50000
        timeout server 50000

    frontend status
        bind *:{{ .Values.haproxy.ports.stats }}
        http-request return status 200 content-type text/plain string "OK" if { path /healthz }
        http-request return status 503 content-type text/plain string "Not ready - waiting for controller config" if { path /ready }

    frontend http_frontend
        bind *:{{ .Values.haproxy.ports.http }}
        default_backend default_backend

    backend default_backend
        http-request return status 404
  # NetworkPolicy for HAProxy loadbalancer pods. Requires a CNI that
  # enforces NetworkPolicy (Calico, Cilium, etc.).
  # allowExternal=false with empty allowedSources fails install by
  # design (blocks accidental deny-all).
  networkPolicy:
    enabled: true
    # true = omit `from`, accept any source (public ingress pattern).
    # false = restrict to allowedSources (must be non-empty).
    allowExternal: true
    # namespaceSelector / podSelector / ipBlock entries; required when
    # allowExternal=false.
    allowedSources: []
    # Extra ingress rules merged into the NetworkPolicy as-is.
    extraIngress: []
    # Additional custom egress rules
    # Default egress rules allow DNS and backend service connections
    # Use this to add additional egress restrictions
    # Example:
    # extraEgress:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             name: external-api
    #     ports:
    #       - port: 443
    extraEgress: []
# Shared response cache (Varnish tier). When enabled, requests to Ingresses
# carrying the haproxy-haptic.org/cache-* annotations are routed through a
# chart-deployed, consistent-hash-sharded Varnish workload so the cache is
# shared across the whole HAProxy fleet (loopback origin: on a miss Varnish
# fetches back through HAProxy, which routes to the app). See the caching docs.
cache:
  # HAProxy-side integration for the managed cache tier.
  haproxy:
    # Bounded-load consistent hashing: cap any one shard's share to this factor
    # of the mean (prevents a hot key pinning a pod). 0 disables.
    hashBalanceFactor: 150
    # Inactivity timeout on the Varnish hop. Before response headers, a failed
    # GET/HEAD retries directly; a response already in flight can't be replayed.
    responseTimeoutMs: 2000
  varnish:
    # Deploy the Varnish tier and emit the cache routing/backend. Off by default.
    enabled: false
    # Varnish fetches cache misses from a DEDICATED internal HAProxy frontend on
    # this port (the "sandwich" backend leg), never the client-facing frontend —
    # so WAF/rate-limit/auth/routing run exactly once, on the client request.
    # Reached only by Varnish via the haptic-cache-origin ClusterIP Service and
    # gated by the haproxy NetworkPolicy; never published on the LoadBalancer.
    loopbackPort: 8090
    # Name of that internal ClusterIP Service (in the release namespace).
    originServiceName: haptic-cache-origin
    # statefulset (default; an ordered rollout keeps 1/N of the cache warm on
    # restart) or deployment (ephemeral accelerator).
    workload: statefulset  # @schema enum: [statefulset, deployment]
    replicas: 2
    # Empty selects the bundled non-root image for this chart version.
    image: ""
    imagePullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
    # Object storage only; budget shared logs, VCL, and process overhead separately.
    malloc: 256m
    # Pod resources. A CPU request is REQUIRED for the autoscaling HPA to
    # compute utilization (a `Utilization` target is a percentage of the
    # request). Include the tmpfs workdir in this limit: shared logs default to
    # 80 MiB, in addition to malloc storage, VCL, and process/object overhead.
    resources:  # @schema skipProperties; additionalProperties: true
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi
    # Keep at least one cache shard serving during voluntary disruptions.
    # The workload also prefers one shard per node, while remaining usable
    # on single-node clusters.
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Isolate the cache shards from the rest of the cluster. The default
    # policy admits cache requests only from this release's HAProxy pods and
    # permits Varnish egress only to DNS and the HAProxy HTTP origin. Effective
    # only when the cluster CNI enforces NetworkPolicy.
    networkPolicy:
      enabled: true
    # Horizontal autoscaling of the Varnish tier. Bounded-load consistent
    # hashing keeps per-shard load even, so average CPU is a sound signal.
    # When enabled, the HPA owns the replica count (the static `replicas`
    # above is ignored). A scale event re-maps only ~1/(N±1) of keys, so use a
    # generous scale-down window to avoid thrashing a warm cache.
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      # Seconds the HPA waits before acting on a scale-down (cache-warmth guard).
      scaleDownStabilizationSeconds: 600

# Shared request-rate limiting via the bundled rate-limit SPOA plugin. This
# is independent of the per-pod stick-table limiter (`rate-limit-rps` /
# `rate-limit-rpm`): when enabled, routes carrying
# `haproxy-haptic.org/rate-limit-requests` consume one budget across the
# whole HAProxy fleet.
rateLimit:
  shared:
    # Runtime dependency policy. False falls back from Valkey to the plugin's
    # per-sidecar limiter; if the hub/plugin cannot answer, HAProxy allows the
    # request. Both paths set rate_limit_degraded. True denies when the store or
    # plugin cannot answer. Lease mode still spends an existing local lease
    # before applying either store-failure policy.
    failClosed: false
    # Enables the native shared rate-limit annotations and auto-enables the
    # spoaHub.plugins.rate-limit plugin. Off by default; annotations fail the
    # render loudly while this is false so a missing opt-in cannot become an
    # inert, unprotected route.
    enabled: false
    # Chart-managed store used by the shared limiter. Disable this only when
    # bringing your own Redis/Valkey/Sentinel/Cluster endpoint through
    # externalStore.urls below.
    managedStore:
      # Enabled by default so turning on the shared limiter is production-ready
      # without another hidden opt-in. It only takes effect when
      # rateLimit.shared.enabled is also true: this is a sub-option of the shared
      # limiter, not an independent switch, and nothing consumes the store while the
      # limiter is off. The store's render gate deliberately requires both flags,
      # matching the RBAC gate in templates/role.yaml — a store rendered without the
      # matching grant cannot be applied and the controller retries it forever.
      enabled: true
      # renovate: datasource=docker depName=valkey/valkey
      image: valkey/valkey:9.2-alpine
      imagePullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
      port: 6379
      # One writable primary with Sentinel failover. Three replicas gives
      # Sentinel quorum and one promoted survivor during a single pod/node loss.
      # This is intentionally not an HPA-scaled Valkey Cluster: horizontal
      # scaling requires slot management and is left to BYO Redis/Valkey
      # platforms.
      replicas: 3
      # Keep Valkey below the container memory limit without silently resetting
      # active budgets. Memory pressure becomes an explicit store error.
      maxMemory: 96mb
      maxMemoryPolicy: noeviction
      sentinel:
        port: 26379
        quorum: 2
        # Must stay above 3333. Sentinel blinds itself for a fixed 30s (TILT)
        # when a blocking hostname lookup for the deleted primary stalls its
        # event loop, and then refuses any replica whose link has been down
        # longer than this value x 10 — so a lower setting makes failover abort
        # forever rather than merely run late. The chart rejects unsafe values.
        downAfterMilliseconds: 5000
        failoverTimeoutMilliseconds: 10000
        parallelSyncs: 1
        resources:  # @schema skipProperties; additionalProperties: true
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 64Mi
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      networkPolicy:
        # Selects the chart-managed Valkey pods and only allows HAProxy/SPOA
        # pods plus same-store Sentinel/replication traffic. Effective only when
        # the cluster CNI enforces NetworkPolicy.
        enabled: true
      resources:  # @schema skipProperties; additionalProperties: true
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 128Mi
    # Bring-your-own shared store, used with managedStore.enabled=false
    # (setting both is rejected). Supply one HA endpoint: the plugin's circuit
    # breaker spans all configured URLs, so the chart rejects sharding here.
    externalStore:
      # One Redis/Valkey/Sentinel/Cluster URL, e.g.
      #   - redis://my-valkey.my-namespace.svc:6379
      urls: []  # @schema item: string

# Default HAProxy TLS certificate. This chart-level resource and HAProxy
# configuration input is intentionally not nested under `controller`.
#
# DEFAULT BEHAVIOR (works out of the box with cert-manager):
# The chart creates a self-signed certificate for localdev.me (dev/test only).
# For production, override certManager.dnsNames and certManager.issuerRef.
#
# Certificate management options:
#   1. cert-manager (default): Uses self-signed issuer for localdev.me
#   2. Manual: Set certManager.enabled=false, create TLS Secret externally
#   3. Inline (testing only): Set create=true with cert/key values
#
# Self-signed fallback: when certManager.enabled is true but the
# cert-manager API is absent, the chart generates a self-signed Secret
# (for certManager.dnsNames, 10-year validity, not auto-rotated) so the
# install converges out of the box — an already-existing Secret is never
# touched, and manual mode (certManager.enabled=false) is unaffected.
# GitOps tools that render without cluster access regenerate it every
# sync; use cert-manager or an explicit certificate there.
defaultSSLCertificate:
  # Enable default SSL certificate requirement
  # Set to false to disable HTTPS support (HTTP only mode)
  enabled: true
  # Name of the Kubernetes TLS Secret containing the default certificate
  # When using cert-manager, this is the Secret name that cert-manager will create
  secretName: "default-ssl-cert"
  # Namespace of the TLS Secret
  # Defaults to Release.Namespace if empty
  namespace: ""
  # Optional ECDSA companion for the default certificate. Set to the name of a
  # second TLS Secret holding an ECDSA (P-256) cert for the same name(s) — e.g. a
  # wildcard `*.example.com`. HAProxy then serves ECDSA to modern clients and the
  # primary `secretName` cert (typically RSA) to the rest on the default
  # (no-SNI / unmatched-SNI) path. The secret must live in the same `namespace`
  # as the primary. Empty = single default cert (unchanged). Does not apply when
  # a Gateway no-hostname listener owns the default slot (use its certificateRefs
  # for dual there). See docs/site/docs/ssl-certificates.md.
  ecdsaSecretName: ""
  #
  # cert-manager configuration (enabled by default)
  # Requires cert-manager to be installed in the cluster
  # Creates a Certificate resource that provisions the TLS Secret automatically
  certManager:
    enabled: true
    # Create a self-signed Issuer for the certificate
    # When true, the chart creates an Issuer named <release>-ssl-selfsigned
    # When false, you must provide an existing Issuer via issuerRef
    createIssuer: true
    # DNS names for the certificate
    # Default: localdev.me (resolves to 127.0.0.1, useful for local development)
    # PRODUCTION: Override with your actual domain names
    dnsNames:
      - "localdev.me"
      - "*.localdev.me"
    # Issuer reference for cert-manager Certificate resource
    # When createIssuer=true, this is auto-configured to use the self-signed Issuer
    # When createIssuer=false, you must specify an existing Issuer or ClusterIssuer
    issuerRef:
      # Name of the Issuer (auto-set when createIssuer=true)
      name: ""
      kind: Issuer
      # group: cert-manager.io  # Optional, defaults to cert-manager.io
    # Certificate validity duration (default: 1 year for self-signed)
    duration: 8760h  # 1 year
    # Renew certificate when this much time is left (default: 30 days)
    renewBefore: 720h  # 30 days
  #
  # Manual certificate management
  # Set certManager.enabled=false and create the TLS Secret externally
  #
  # Inline certificate (testing only)
  # WARNING: NOT recommended - embeds secrets in Helm values
  create: false
  # cert: |
  #   -----BEGIN CERTIFICATE-----
  #   MIIDXTCCAkWgAwIBAgIJAKJ... (your certificate)
  #   -----END CERTIFICATE-----
  # key: |
  #   -----BEGIN PRIVATE KEY-----
  #   MIIEvQIBADANBgkqhkiG9w... (your private key)
  #   -----END PRIVATE KEY-----

# SPOA hub sidecar
# Bundles the haproxy-spoa-hub binary plus eight plugin shared libraries
# (api-gateway, coraza, external-auth, fingerprinting, maxmind, mirror,
# rate-limit, sso-auth) inside
# the HAProxy pod. Communicates with HAProxy over a Unix-domain socket.
# The sidecar is rendered conditionally — absent when no plugin is
# enabled, automatically present when at least one is.
spoaHub:
  # Master enable. Leave as null to auto-derive from plugins.*.enabled
  # (the typical case). Set to false to force the sidecar off even when a
  # plugin is enabled (rare; mostly for migrations or chart testing).
  # Set to true to deploy the sidecar even when the plugins you want are
  # not auto-enabled by their default predicates — you must still enable at
  # least one plugin under plugins.*, because a hub with no enabled plugin
  # has no SPOE message to serve. Rendering fails with an explanatory error
  # if you set this true and leave every plugin disabled.
  enabled: null  # @schema type: [boolean, null]

  image:
    repository: ghcr.io/haproxy-haptic/haptic/spoa-hub
    pullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
    # Override the tag. Leave empty to use .Chart.AppVersion (recommended).
    tag: ""

  resources:  # @schema skipProperties; additionalProperties: true
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Hub-side runtime knobs (rendered into /etc/haproxy-spoa-hub/config.toml).
  hub:
    # info | debug | warn | error
    logLevel: "info"  # @schema enum: [trace, debug, info, warn, error]
    # Tokio worker thread count. Leave null for the default (CPU count).
    workerThreads: null  # @schema type: [integer, null]
    maxConnections: 1000
    blockingThreadKeepAliveSecs: 30
    # Optional process-wide blocking-pool cap. Null derives the safe sum of
    # resolved per-plugin concurrency limits. An explicit value must not be
    # lower than that sum. This is a process-start setting; the chart's config
    # checksum rolls the HAProxy pod when it changes.
    maxBlockingThreads: null  # @schema type: [integer, null]
    # Maximum time a hot reload waits for users of the retiring plugin
    # generation to quiesce and drain. Null derives 1.5x the largest plugin
    # timeout, clamped to 1-30 seconds. Zero deliberately disables draining and
    # is unsafe for plugins with in-flight/background work; use only to restore
    # legacy behavior while diagnosing a broken plugin shutdown.
    reloadDrainTimeoutMs: null  # @schema type: [integer, null]
    # Prometheus /metrics endpoint. Loopback by default; the haproxy
    # container scrapes via the shared pod netns. Set to "" to disable
    # (loses per-plugin counters); set to "0.0.0.0:9095" to expose
    # cluster-wide (carries per-Ingress/route cardinality — careful).
    # "auto" binds /metrics where whatever scrapes it can actually reach it:
    #   vector.enabled=true  -> 127.0.0.1:9095, because vector scrapes over
    #                           loopback from inside the pod and re-exports on its
    #                           own port; answering on the pod IP would expose the
    #                           endpoint for nothing.
    #   vector.enabled=false -> 0.0.0.0:9095, because Prometheus then scrapes the
    #                           pod IP directly and a loopback bind is a dead target.
    # Set an explicit "<ip>:<port>" to override, or "" to disable hub metrics
    # entirely. A literal address always wins over the derivation.
    metricsAddr: auto
    # Go garbage-collector target percentage (GOGC) for the sidecar's embedded
    # Go runtime (the coraza plugin). The default 100 collects often under load,
    # stealing CPU from the request path and draining the plugin's transaction
    # pool; 300 trims GC frequency for a lower p99 tail while staying well within
    # the sidecar's memory. GOMEMLIMIT is derived automatically as a soft cap at
    # 90% of the memory limit so a higher value can't breach it. Set to 100 to
    # restore Go's default.
    goGCPercent: 300

  # HAProxy-side wiring. The chart surfaces these into
  # templatingSettings.extraContext.spoaHub (see
  # templates/haproxytemplateconfig.yaml), and the spoa-hub template
  # library reads them when emitting the `backend spoa-hub` block,
  # the `filter spoe engine` directive, and the spoe.conf agent.
  haproxy:
    socketPath: /run/spoa/hub.sock
    # `mode spop` is the native SPOP backend mode, introduced in HAProxy
    # 3.1. The chart auto-falls back to `mode tcp` on HAProxy 3.0 (where
    # this proxy mode doesn't exist) — both work with the SPOE filter,
    # mode spop is just the more efficient transport. Set this to false
    # to force tcp on 3.1+ as well (rare; mostly for compat testing).
    modeSpop: true
    timeoutHello: 2s  # @schema type: [string, integer]
    timeoutIdle: 5m  # @schema type: [string, integer]
    # HAProxy's outer SPOE processing deadline. Null derives each message
    # engine's deadline from that message's plugin budget plus
    # timeoutProcessingMarginMs. An explicit duration applies to every engine
    # and must cover every enabled message's budget plus the margin.
    timeoutProcessing: null  # @schema type: [string, integer, null]
    # Scheduling/serialization margin between the hub's plugin deadline and
    # HAProxy's outer SPOE deadline.
    timeoutProcessingMarginMs: 100
    poolMaxConn: 100
    poolPurgeDelay: 30s  # @schema type: [string, integer]

  # Plugins. Each entry has chart-managed lifecycle keys (enabled, timeoutMs,
  # messages, dependsOn), optional admission controls (maxConcurrency,
  # maxQueue, queueTimeoutMs, adaptiveConcurrency), plus a free-form `params:`
  # TOML string spliced
  # verbatim under `[plugins.params]`. `enabled` is `tpl`-evaluated so
  # libraries that need a plugin can auto-enable it; explicit `--set ...
  # .enabled=<bool>` always wins. Inside `params:` use dotted keys or the
  # full `[plugins.params.<x>]` header — a bare `[x]` closes the scope.
  plugins:  # @schema additionalProperties: {type: object, additionalProperties: false, properties: {enabled: {type: [boolean, string]}, timeoutMs: {type: [integer, string]}, messages: {type: array, items: {type: string}}, dependsOn: {type: array, items: {type: string}}, maxConcurrency: {type: [integer, string]}, maxQueue: {type: [integer, string]}, queueTimeoutMs: {type: [integer, string]}, adaptiveConcurrency: {type: boolean}, params: {type: string}}}
    api-gateway:
      # JSON request-body validation via the api-gateway plugin. Opt-in (off by
      # default). Drive it per route with the
      # haproxy-haptic.org/request-schema-* annotations.
      enabled: '{{ .Values.controller.config.templatingSettings.extraContext.apiGateway.requestSchemaValidation.enabled }}'  # @schema type: [boolean, string]
      # The plugin does no I/O on the request path: schemas are compiled at
      # init, then each request is bounded by max_body_bytes, content-type
      # checked, parsed as JSON, and validated in memory. Keep the SPOE timeout
      # tight so overload fails closed quickly.
      timeoutMs: 25  # @schema type: [integer, string]
      messages: ["validate-request"]
      dependsOn: []  # @schema item: string
      # Admission concurrency (ADR-0002). Bound work exactly as for Coraza:
      # adaptive by default so the right concurrency is found from live latency
      # with no manual tuning, and maxConcurrency is the ceiling — derived from
      # the sidecar's memory so it self-scales across small and large
      # deployments. Set adaptiveConcurrency: false for a fixed cap.
      adaptiveConcurrency: true
      maxConcurrency: '{{ include "haptic.spoaHub.adaptiveCeiling" . }}'  # @schema type: [integer, string]
      maxQueue: 0  # @schema type: [integer, string]
      # The chart injects default_fail_open and max_body_bytes from the
      # requestSchemaValidation feature tree so replacing this free-form blob
      # cannot silently sever the template and plugin defaults.
      params: ""
    coraza:
      # Auto-enabled when nginx-ingress OR haproxy-ingress is on. Configures
      # the WAF *service* (rules, limits, runtime knobs → spoa-hub TOML);
      # dispatch lives separately under
      # `controller.config.templatingSettings.extraContext.waf.dispatch`.
      # A non-empty inline/ConfigMap policy catalog activates policy support;
      # there is no second `enabled` switch that can leave a configured catalog
      # inert by accident.
      enabled: '{{ or (eq .Values.controller.config.templatingSettings.extraContext.waf.dispatch.mode "default-on") (gt (len .Values.controller.config.templatingSettings.extraContext.waf.policies.inline) 0) (gt (len .Values.controller.config.templatingSettings.extraContext.waf.policies.configMapRefs) 0) (ne .Values.controller.config.templatingSettings.extraContext.waf.policies.defaultPolicy "") (eq (toString .Values.controller.config.templatingSettings.extraContext.waf.policies.selfService.enabled) "true") .Values.controller.templateLibraries.nginxIngress.enabled .Values.controller.templateLibraries.haproxyIngress.enabled }}'  # @schema type: [boolean, string]
      timeoutMs: 15  # @schema type: [integer, string]
      messages: ["check-request"]
      dependsOn: []  # @schema item: string
      # Concurrent WAF checks per HAProxy pod. A coraza check holds its slot
      # ~0.9ms but uses only ~0.1ms of CPU, so the right concurrency is many
      # times the core count and varies by request mix — no single number is
      # correct across machines. So it's ADAPTIVE by default (ADR-0002): the hub
      # resizes the admission semaphore at runtime from live latency, finding the
      # concurrency that keeps CPU busy without over-subscribing — no manual
      # tuning, on small and large deployments alike. `maxConcurrency` is then
      # the controller's CEILING (a runaway backstop), derived from the sidecar's
      # MEMORY (concurrency = blocking OS threads, so memory is the binding
      # resource, not cores) so it self-scales: give the sidecar more memory and
      # the ceiling rises. Set adaptiveConcurrency: false for a fixed cap, or set
      # maxConcurrency to a literal to override the derived ceiling.
      adaptiveConcurrency: true
      maxConcurrency: '{{ include "haptic.spoaHub.adaptiveCeiling" . }}'  # @schema type: [integer, string]
      maxQueue: 0  # @schema type: [integer, string]
      # Coraza WAF rule directives. The chart appends these to the
      # rendered TOML's `directives = """..."""` field, then appends
      # any per-Ingress `nginx.ingress.kubernetes.io/modsecurity-snippet`
      # values from watched Ingresses, so per-resource rules land in the
      # runtime hub's coraza section without per-request SPOE shipping.
      # Order is: this base, then snippets sorted by `<ns>/<name>` for
      # determinism. Each appended snippet is preceded by a comment of
      # the form `# nginx-ingress modsecurity-snippet from <ns>/<name>`.
      #
      # Do NOT also set `directives = "..."` inside `params:` below —
      # the chart emits its own `directives = """..."""` line, so a
      # duplicate would produce a coraza parse error.
      #
      # `SecRuleEngine On` MUST come AFTER the includes: directives are
      # processed sequentially and `@coraza.conf-recommended` itself sets
      # `SecRuleEngine DetectionOnly`, so an `On` placed before the include
      # is silently overridden — rules still match and log, but
      # interruptions (deny/403) are suppressed and the WAF becomes
      # detection-only. Custom rules appended below the includes (and the
      # per-Ingress modsecurity-snippet appends) then never block.
      directives: |
        Include @coraza.conf-recommended
        SecRxPreFilter On
        Include @crs-setup.conf.example
        Include @owasp_crs/*.conf
        SecRuleEngine On
      params: |
        # Request-body limits are chart-managed from the shared HAProxy buffer
        # contract and injected ahead of this block. Response inspection is not
        # wired by the chart, so the chart injects response_check=false.
        detect_only = false
        transaction_ttl_ms = 10000
        max_cached_transactions = 1024
        rule_match_log = false
        matched_data_log = "none"
        expose_matched_data = false
    external-auth:
      # Auto-enabled when nginx-ingress is enabled (it's opt-in by default,
      # so flipping it on signals the operator wants its features —
      # including the auth-url wiring). haproxy-ingress is intentionally
      # NOT in the OR even though it has an auth-url handler: that library
      # is ON by default and most operators with it enabled don't use
      # external-auth, so OR-ing it in would deploy the spoa-hub sidecar
      # for everyone (~50 MB extra in the haproxy pod). Operators using
      # haproxy-ingress.github.io/auth-url should set this to 'true'
      # explicitly. The haproxytech library has no external-auth
      # annotation in its public schema.
      enabled: '{{ .Values.controller.templateLibraries.nginxIngress.enabled }}'  # @schema type: [boolean, string]
      timeoutMs: 6000  # @schema type: [integer, string]
      messages: ["check-auth"]
      dependsOn: []  # @schema item: string
      params: |
        timeout_ms = 5000
        fail_open = false
        method = "GET"
        allow_plaintext = false
        forward_headers = [
          "authorization", "cookie",
          "x-forwarded-for", "x-forwarded-proto",
          "x-forwarded-host", "x-forwarded-uri"
        ]
        extract_headers = ["x-auth-user", "x-auth-roles"]
    fingerprinting:
      enabled: '{{ false }}'  # @schema type: [boolean, string]
      timeoutMs: 5  # @schema type: [integer, string]
      messages: ["get-fingerprint"]
      dependsOn: []  # @schema item: string
      params: |
        sort_extensions = true
        exclude_extensions = [41]
        ja4 = true
    maxmind:
      enabled: '{{ false }}'  # @schema type: [boolean, string]
      timeoutMs: 10  # @schema type: [integer, string]
      messages: ["geoip-enrich"]
      dependsOn: []  # @schema item: string
      # Site-specific: supply MMDB paths and lookup definitions.
      # See https://github.com/haproxy-haptic/haproxy-spoa-hub-plugin-maxmind
      params: |
        # [databases]
        # city = { path = "/data/GeoLite2-City.mmdb" }
        # asn  = { path = "/data/GeoLite2-ASN.mmdb" }
        #
        # [[lookups]]
        # name       = "country_code"
        # message    = "geoip-enrich"
        # database   = "city"
        # path       = ["country", "iso_code"]
        # output_var = "geo_country"
    mirror:
      # Auto-enabled when the gateway library is on. The Gateway API
      # HTTPRouteFilter of type RequestMirror is the only chart consumer
      # of this plugin today; flipping the gateway library on signals the
      # operator wants Gateway-API features including request mirroring.
      # Without this auto-derive an operator who configures a Gateway
      # with a RequestMirror filter would get silently-ignored mirroring
      # unless they also flipped this flag — and the controller would
      # then emit a chart-render error pointing at the missing plugin.
      enabled: '{{ .Values.controller.templateLibraries.gateway.enabled }}'  # @schema type: [boolean, string]
      # SPOE-side processing timeout. The plugin's `process()` only does
      # synchronous SPOE-arg parsing and a tokio spawn — microseconds —
      # so the ack is back to HAProxy long before this hits. The actual
      # HTTP roundtrip to the mirror backend is governed by the plugin's
      # per-target budget below and never blocks HAProxy.
      timeoutMs: 50  # @schema type: [integer, string]
      # Bound fire-and-forget work independently of application backend
      # timeouts. A dead mirror target must release shared hub capacity quickly
      # and must not amplify load through retries.
      targetTimeoutMs: 2000  # @schema type: [integer, string]
      targetRetries: 0  # @schema type: [integer, string]
      # A single static `mirror` message that fans out to every target.
      # The chart never grows this list: each mirror source (Gateway
      # RequestMirror filters, mirror-target Ingress annotations) appends
      # its target to a per-request list variable (txn.gw_mirror_targets),
      # the message ships that whole list as arg_targets, and the plugin
      # (haproxy-spoa-hub-plugin-mirror v0.6.0+) dispatches one request per
      # entry. So adding or removing a mirror target changes only the
      # HAProxy frontend — never spoe.conf or this plugin's TOML — and
      # never triggers a hub config reload.
      messages: ["mirror"]
      dependsOn: []  # @schema item: string
      # Mirror plugin runtime knobs (1:1 with PluginConfig in
      # haproxy-spoa-hub-plugin-mirror/src/config.rs).
      params: |
        max_body_bytes = 1048576
        request_concurrency = 1024
        verify_tls = false
        # worker_threads = 4
        pool_max_idle_per_host = 32
    rate-limit:
      # Shared, fleet-wide rate limiting via the haproxy-spoa-hub
      # rate-limit plugin. Opt-in (off by default). Unlike the per-pod
      # stick-table limiter (haproxy-haptic.org/rate-limit-rps), this
      # enforces ONE limit across ALL haproxy pods through a shared store.
      # Drive it per route with the haproxy-haptic.org/rate-limit-requests
      # (+ -period / -burst / -key / -algorithm) annotations.
      #
      # The shared store is a Valkey/Redis reachable at `store_url`. Either
      # let the chart deploy one (rateLimit.shared.managedStore.enabled=true,
      # which injects store_url automatically) or bring your own via
      # rateLimit.shared.externalStore.urls. HAPTIC fails the render when
      # shared rate limiting is enabled without a store, because per-pod
      # fallback is not a shared fleet budget.
      enabled: '{{ .Values.rateLimit.shared.enabled }}'  # @schema type: [boolean, string]
      # The plugin's default lease mode is a local in-memory token-bucket
      # check. The shared store handles bounded/coalesced background refreshes
      # and a coalesced synchronous borrow when a cold or depleted pool needs
      # tokens, not every steady-state request. Keep the SPOE timeout tight so an
      # overloaded hub cannot add a long request tail under DoS. The chart maps
      # rateLimit.shared.failClosed to the store-failure policy.
      # max_keys separately bounds the lease and emergency registries, so each
      # can hold this many entries. An explicit store-failure policy gives new
      # lease keys no optimistic batch: they borrow from Valkey before applying
      # the fallback. At emergency capacity, the default dependency policy allows
      # untracked and marks the request degraded.
      # Exact mode (rate-limit-algorithm: gcra) does one synchronous store
      # round-trip per request; store_timeout_ms below is intentionally very
      # low so it can switch to the configured dependency policy before the hub
      # drops the plugin result. Keep public-edge DoS limits on the default lease
      # mode; exact mode is for low-volume contractual budgets.
      timeoutMs: 50  # @schema type: [integer, string]
      messages: ["check-ratelimit"]
      dependsOn: []  # @schema item: string
      # Per-operation shared-store timeout. Exact `gcra` mode waits on this
      # path for every request, so keep it short on public edges and tune it to
      # measured Redis/Valkey round-trip and failover behavior. The chart owns
      # the generated `store_timeout_ms` and `ttl_ms` TOML keys and rejects
      # duplicates in params below. ttl_ms uses the plugin's one-hour maximum;
      # the annotation library rejects rules with a longer refill horizon.
      storeOperationTimeoutMs: 10  # @schema type: [integer, string]
      # Runtime knobs (1:1 with PluginConfig in
      # haproxy-spoa-hub-plugin-rate-limit/src/config.rs). The chart owns the
      # generated fail_open, store_failure_mode, invalid_rule_fail_open, and
      # store endpoint lines. failClosed controls store failure, malformed rules
      # always deny, and rateLimit.shared.managedStore injects
      # the Sentinel store_url, rateLimit.shared.externalStore.urls injects
      # one store_url for a BYO store — and rejects a manual store_url/store_urls
      # here so overriding this scalar can never drop or
      # duplicate the store wiring.
      params: |
        sync_interval_ms = 200
        low_water_percent = 20
        breaker_threshold = 3
        breaker_cooldown_ms = 5000
        max_keys = 50000
        idle_ttl_ms = 120000
        max_prefetch_queue = 8192
    # OIDC sign-in for Ingresses with haproxy-haptic.org/sso-auth. Each provider
    # comes from a Secret in the Ingress's namespace; its issuer must be listed
    # in extraContext.ssoAuth.allowedIssuers. timeoutMs covers the token
    # exchange with the identity provider.
    sso-auth:
      enabled: '{{ false }}'  # @schema type: [boolean, string]
      timeoutMs: 6000  # @schema type: [integer, string]
      messages: ["check-sso-auth"]
      dependsOn: []  # @schema item: string
      # Plugin settings (cookie_lifetime_secs, cookie_samesite, fail_open, ...);
      # see the haproxy-spoa-hub-plugin-sso-auth config schema.
      params: ""

  # Container-level securityContext for the spoa-hub container. runAsUser=99
  # matches the pod's existing fsGroup (99) so the unix socket the hub
  # creates under /run/spoa is accessible to the haproxy container without
  # extra plumbing.
  securityContext:  # @schema skipProperties; additionalProperties: true
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 99
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Extra volume mounts added to the spoa-hub container only. Useful for
  # mounting MMDB files (maxmind), OIDC client secrets (sso-auth), etc.
  # Example:
  #   - name: maxmind-data
  #     mountPath: /data
  #     readOnly: true
  extraVolumeMounts: []

# Vector sidecar (https://vector.dev) on every HAProxy pod: it receives the
# HAProxy access log over a mounted UNIX datagram socket, derives the request
# metrics from it, and re-exports the SPOA hub's Prometheus metrics alongside
# its own. HAProxy's exporter is scraped directly (extraContext.prometheusExporter).
#
# Root-level rather than under extraContext because the chart builds Kubernetes
# resources from it (a sidecar container, a bootstrap ConfigMap); only its
# render-facing bits are projected into extraContext.accessLog. See
# "Operator-facing values default to extraContext (RULE)" in charts/CLAUDE.md.
vector:
  # Enabled by default. When false, nothing below is rendered: HAProxy logs
  # straight to its own stdout and Prometheus scrapes the hub (if enabled)
  # directly. HAProxy's own exporter is scraped directly either way; see
  # controller.config.templatingSettings.extraContext.prometheusExporter.
  enabled: true

  image:
    repository: timberio/vector
    pullPolicy: IfNotPresent  # @schema enum: [Always, IfNotPresent, Never]
    # Pinned, not floating: a silent vector upgrade would change the log
    # pipeline under a running fleet. Renovate bumps this via the
    # `vector image tag` customManager in renovate.json — keep the comment
    # directly above the `tag:` line or the manager stops matching it.
    # renovate: datasource=docker depName=timberio/vector
    tag: "0.61.0-debian"

  # Port the /metrics endpoint listens on: vector's own series, the hub's
  # re-exported ones and the log-derived and request metrics. 9598 is vector's
  # documented default for prometheus_exporter.
  metricsPort: 9598

  # Second endpoint, carrying only the requestMetrics size histograms. Exists
  # because vector's prometheus_exporter takes ONE `buckets` list per sink and
  # bytes and seconds are different domains
  # (github.com/vectordotdev/vector/discussions/16543). Rendered, with its
  # container port and PodMonitor endpoint, only while a size family is on.
  sizeMetricsPort: 9599

  # Per-request metrics from the access log: the RED signals keyed by ROUTE, with
  # the upstream call split into the phases HAProxy measures separately. HAProxy's
  # own exporter offers no per-route dimension, no quantiles and no phase
  # breakdown. Reference: docs/site/docs/operations/monitoring.md#request-metrics.
  #
  # Series per pod is roughly routes x statuses x methods x hosts x terminations,
  # per family, and the histograms multiply again by bucket count. The label
  # opt-outs below are the cheapest lever, then `metrics`.
  requestMetrics:
    enabled: true

    # Mirrors ingress-nginx's `nginx_ingress_controller_` shape. Set it to that
    # value to keep existing dashboards and alerts working after a migration.
    # A trailing underscore is accepted and stripped.
    prefix: haptic_ingress_controller

    # `controller_class` label. Empty means ingressClass.controllerName;
    # ingress-nginx uses `k8s.io/ingress-nginx`.
    controllerClass: ""

    # Each removes its label from ALL families rather than blanking it, so the
    # rest aggregate exactly as they would have without it.
    #
    # `term` is HAProxy's termination state (%tsc): sH-- is a server timeout, SC--
    # a refused connection, cD-- a client that gave up. It answers "who ended this
    # request, and why", which a 5xx rate never does — and it is the most
    # expensive, multiplying the histograms too.
    terminationStateLabel: true
    # `path` is the matched route template, bounded by rule count. Off also
    # switches off the HAProxy-side route lookup, saving per-request work.
    pathLabel: true
    # The equivalent of ingress-nginx's --metrics-per-host.
    hostLabel: true
    # HAProxy's selected server name, matching the native exporter's server label.
    # `counters` puts it on requests_total only: on the histograms it multiplies
    # every backend pod by each bucket, and pods get new names on each rollout.
    serverLabel: false  # @schema type: [boolean, string]; enum: [false, true, counters]

    # Not ingress-nginx's, which are weak in both domains; the migration guide has
    # a snippet to restore them. Durations are a strict SUPERSET of its
    # --time-buckets, so a rule hardcoding le="0.5" still resolves, extended to
    # 1ms (backends answer in 1-3ms) and 60s (it stops at 10s, below the server
    # timeouts this chart ships).
    # @schema item: number
    durationBuckets: [0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5,
                      1, 2.5, 5, 10, 30, 60]
    # A 1-3-10 ladder. ingress-nginx measures sizes against 10..100 BYTES, so
    # every real payload lands in +Inf and its _bucket series say nothing.
    # @schema item: number
    sizeBuckets: [100, 300, 1000, 3000, 10000, 30000, 100000, 300000,
                  1000000, 3000000, 10000000, 100000000]

    # Backstop for a label that goes unbounded anyway — a regex route, a Host an
    # attacker controls. drop_tag collapses it onto one series and keeps totals
    # correct; drop_event would discard the requests. In-memory, resets on restart.
    cardinalityLimit:
      enabled: true
      valueLimit: 500
      action: drop_tag

    # Keys are the emitted name suffixes; an unknown one fails the render.
    # Sources: requests (one per record), request_duration_seconds %Ta,
    # response_duration_seconds Tc+Tr+Td, connect_duration_seconds %Tc,
    # header_duration_seconds %Tr, request_size %U, response_size %B.
    #
    # The three upstream timers are recorded only when the phase happened, so a
    # request HAProxy answered itself lands in `requests` and nowhere else.
    metrics:
      # Emits requests_total and its unsuffixed compatibility alias.
      requests: true
      request_duration_seconds: true
      response_duration_seconds: true
      connect_duration_seconds: true
      header_duration_seconds: true
      request_size: true
      response_size: true

  # UNIX datagram socket HAProxy writes access-log records to. Lives on its own
  # emptyDir shared with the haproxy container. HAProxy's `log <path>` form is a
  # datagram target (deliberately not `unix@` — HAProxy 3.4 rejects a UNIX ring
  # server while 3.0 accepts it).
  socketPath: /run/vector/haproxy.sock

  # Scrape interval vector uses for the spoa-hub endpoint it re-exports. Keep
  # at or below Prometheus's own interval, otherwise Prometheus samples a value
  # vector has not refreshed yet.
  scrapeIntervalSecs: 15

  # Strip access-log fields whose value is the empty string, so a record carries only
  # what actually happened.
  #
  # A feature that did not fire still costs its field on every line. Measured on a real
  # fleet, trace_id, denied_by, waf_matched_var, consumer and cache were empty in 100%
  # of records, and dropping every empty made records 27% smaller (815 -> 595 bytes
  # average). Sending nothing rather than an empty value is also what Elastic Common
  # Schema and OpenTelemetry both recommend.
  #
  # HAProxy itself cannot do this — its JSON encoder has no omit option, and the closest
  # one (`+M`) substitutes "-" instead — so vector strips them in a `remap` transform.
  # Field ORDER is preserved (the transform rewrites the line rather than re-encoding
  # it, because re-encoding sorts keys alphabetically and would bury `ts`). Numbers are
  # untouched: a genuine `queue_time_ms: 0` is kept, only `""` is dropped.
  #
  # Set to false if you feed a strongly typed index (a ClickHouse table, an
  # Elasticsearch mapping) or have queries written as `field == ""`, where a stable
  # field set matters more than the bytes. HAProxy process messages on the same stream
  # are never touched either way.
  omitEmptyLogFields: true


  # Metrics derived from the access log. Several in-path components expose no
  # scrape endpoint of their own — Varnish has none at all — but the access log
  # already carries their verdict per request.
  #
  # Each entry names a log `field` and how to project it: `enum` becomes a
  # counter tagged with the value (accepted `values` listed, so an unexpected one
  # cannot invent an unbounded label), `numeric` a counter incremented BY the
  # value. `requires` is a dotted values path that must be truthy, so an entry
  # whose emitter is off costs nothing per record.
  logMetrics:  # @schema mergeProperties
    cacheStatus:
      enabled: true
      requires: cache.varnish.enabled
      field: cache
      kind: enum  # @schema enum: [enum, numeric]
      values: ["HIT", "MISS", "STALE"]
      metric: cache_status_total
      tag: status
    # How old served objects are. A healthy-looking hit rate with ages near zero
    # is churn — objects evicted or expiring before reuse — which the hit rate
    # alone cannot distinguish from a genuinely warm cache.
    cacheAge:
      enabled: true
      requires: cache.varnish.enabled
      field: cache_age
      kind: numeric  # @schema enum: [enum, numeric]
      metric: cache_age_seconds_total
    # Why responses were NOT stored, otherwise invisible: a route that silently
    # never caches looks identical to one that is always missing.
    cacheReason:
      enabled: true
      requires: cache.varnish.enabled
      field: cache_uncacheable_reason
      kind: enum  # @schema enum: [enum, numeric]
      values: ["content_type_excluded", "too_large", "set_cookie", "status_not_cacheable", "origin_refused_sharing"]
      metric: cache_uncacheable_total
      tag: reason
    cacheDegraded:
      enabled: true
      requires: cache.varnish.enabled
      field: cache_degraded
      kind: numeric  # @schema enum: [enum, numeric]
      metric: degraded_cache_total
    # Requests for which a non-identity control could not be consulted. An open
    # policy allows them; a strict policy also sets denied_by. Without separate
    # counters, a control that stopped answering looks like one with nothing to
    # report.
    rateLimitDegraded:
      enabled: true
      field: rate_limit_degraded
      kind: numeric  # @schema enum: [enum, numeric]
      metric: degraded_rate_limit_total
    wafDegraded:
      enabled: true
      field: waf_degraded
      kind: numeric  # @schema enum: [enum, numeric]
      metric: degraded_waf_total
    schemaDegraded:
      enabled: true
      field: schema_degraded
      kind: numeric  # @schema enum: [enum, numeric]
      metric: degraded_schema_total
    # Which control rejected a request. The `*_unavailable` reasons are the ones
    # to alert on: they mean a control could not reach its dependency and shed
    # legitimate traffic rather than a client hitting a limit it was given.
    # scripts/check-shipped-log-metrics.sh keeps this list in step with the chart.
    deniedBy:
      enabled: true
      field: denied_by
      kind: enum  # @schema enum: [enum, numeric]
      values: ["api_key", "api_key_unavailable", "backend_tls_unavailable", "basic_auth", "basic_auth_unavailable", "body_too_large", "cache_origin_internal_backend", "consumer_groups", "consumer_groups_unavailable", "content_type", "external_auth", "external_auth_unavailable", "gw_sni_host_mismatch", "hmac", "hmac_body_incomplete", "hmac_no_content_length", "hmac_unavailable", "jwt_algorithm", "jwt_audience", "jwt_expired", "jwt_issuer", "jwt_key_unavailable", "jwt_not_yet_valid", "jwt_required_claim", "jwt_signature", "jwt_unavailable", "method_not_allowed", "mtls_sni_host_mismatch", "mtls_unavailable", "policy_consumer_missing", "rate_limit_connections", "rate_limit_local", "rate_limit_shared", "rate_limit_shared_invalid", "rate_limit_shared_unavailable", "required_header", "route_policy_unavailable", "schema_body_incomplete", "schema_body_too_large", "schema_duplicate_content_length", "schema_invalid", "schema_no_content_length", "schema_unavailable", "schema_unsupported_media_type", "sni_host_mismatch", "sso_auth", "sso_auth_unavailable", "waf", "waf_body_chunked", "waf_body_content_type", "waf_body_duplicate_content_length", "waf_body_incomplete", "waf_body_too_large", "waf_policy_unavailable", "waf_status_400", "waf_status_413", "waf_unavailable"]
      metric: denied_total
      tag: reason

  # What drives memory is the SERIES vector holds between scrapes: the request
  # metrics (traffic shape — routes x statuses x methods x hosts, times the
  # histogram buckets, bounded by requestMetrics.cardinalityLimit) plus the hub's
  # re-export and its own. HAProxy's exporter is no longer re-exported: measured
  # standalone at 2,500 backends that re-export alone was 1.3 GB steady / 2.3 GB
  # peak (1.8 KB per retained series plus a same-sized parse burst per scrape;
  # allocator and scrape-interval knobs changed it by under 5%). Without it, the
  # same vector.yaml idles at 146 MB and, fed 5,000 distinct routes at 500
  # records/s, settles at 364 MB with a 698 MB peak.
  #
  # The cap covers that measured peak with headroom; the request stays lower so
  # the headroom is burstable rather than reserved. Raise BOTH for a fleet with
  # far more distinct routes and hosts, or lower cardinalityLimit.valueLimit and
  # the request-metrics label opt-outs — that is the cheaper lever.
  #
  # Under-sizing can still affect availability. The supervisor recovers an exited
  # or unresponsive Vector child without changing HAProxy readiness, but a
  # whole-container OOM restarts the container and can briefly make the pod NotReady.
  resources:  # @schema skipProperties; additionalProperties: true
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  securityContext:  # @schema skipProperties; additionalProperties: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  # Extra volume mounts added to the vector container only. Useful for
  # mounting credentials for a downstream sink (S3, Loki, Kafka, …).
  extraVolumeMounts: []

# Extra Kubernetes resources to deploy alongside the chart. List or
# dict; supports Helm templating. The list and dict forms merge differently
# (a dict merges by key; a list appends).
extraDeploy: {}  # @schema type: [object, array]; additionalProperties: true
