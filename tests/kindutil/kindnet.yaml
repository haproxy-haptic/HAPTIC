# kindnet v1.0.2 install-kindnet.yaml; flags, verbosity and scheduling match kind's bundled kindnetd.
# Replaces it until kind bundles kubernetes-sigs/kube-network-policies#402 (nfqueue drops on sync).
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kindnet
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
      - watch
      - patch
  - apiGroups:
     - ""
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
     - "networking.k8s.io"
    resources:
      - networkpolicies
    verbs:
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kindnet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kindnet
subjects:
- kind: ServiceAccount
  name: kindnet
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kindnet
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kindnet
  namespace: kube-system
  labels:
    tier: node
    app: kindnet
    k8s-app: kindnet
spec:
  selector:
    matchLabels:
      app: kindnet
  template:
    metadata:
      labels:
        tier: node
        app: kindnet
        k8s-app: kindnet
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      serviceAccountName: kindnet
      initContainers:
      - name: install-cni-bin
        image: registry.k8s.io/networking/kindnet:v1.0.2@sha256:91b60692216e4d52f15cfde287084a633a9449701aac1c7d2e3993552083781d
        command: ['sh', '-c', 'cat /opt/cni/bin/cni-kindnet > /cni/cni-kindnet ; chmod +x /cni/cni-kindnet']
        volumeMounts:
        - name: cni-bin
          mountPath: /cni
      # kindnetd's conntrack metrics listener sets NETLINK_BROADCAST_ERROR; whenever it lags, the
      # kernel drops every SYN that reopens a TIME_WAIT entry (nf_conntrack_proto_tcp.c, nf_ct_kill).
      - name: disable-conntrack-events
        image: registry.k8s.io/networking/kindnet:v1.0.2@sha256:91b60692216e4d52f15cfde287084a633a9449701aac1c7d2e3993552083781d
        command: ['sh', '-c', 'echo 0 > /proc/sys/net/netfilter/nf_conntrack_events']
        securityContext:
          privileged: true
      containers:
      - name: kindnet-cni
        image: registry.k8s.io/networking/kindnet:v1.0.2@sha256:91b60692216e4d52f15cfde287084a633a9449701aac1c7d2e3993552083781d
        command:
        - /bin/kindnetd
        - --hostname-override=$(NODE_NAME)
        - --network-policy=true
        - --masquerading=true
        - --dns-caching=false
        - --disable-cni=false
        - --fastpath-threshold=0
        - --ipsec-overlay=false
        - --nat64=false
        - --v=0
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: cni-cfg
          mountPath: /etc/cni/net.d
        - name: var-lib-kindnet
          mountPath: /var/lib/cni-kindnet
        - name: nri-plugin
          mountPath: /var/run/nri
        - name: netns
          mountPath: /var/run/netns
          mountPropagation: HostToContainer
        resources:
          requests:
            cpu: "100m"
            memory: "50Mi"
        securityContext:
          privileged: true
      volumes:
      - name: cni-bin
        hostPath:
          path: /opt/cni/bin
          type: DirectoryOrCreate
      - name: cni-cfg
        hostPath:
          path: /etc/cni/net.d
          type: DirectoryOrCreate
      - name: var-lib-kindnet
        hostPath:
          path: /var/lib/cni-kindnet
          type: DirectoryOrCreate
      - name: nri-plugin
        hostPath:
          path: /var/run/nri
      - name: netns
        hostPath:
          path: /var/run/netns
---
