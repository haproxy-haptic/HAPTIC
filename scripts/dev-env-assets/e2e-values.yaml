# e2e-suite Helm values for the HAPTIC chart.
#
# Used by tests/e2e's TestMain as the default profile (anything other
# than HAPTIC_E2E_PROFILE=conformance). Distinct from dev-values.yaml
# because the dev environment (scripts/start-dev-env.sh, single
# operator manually applying ingresses) and the e2e suite (30+
# parallel tests each creating + deleting Ingresses) have different
# reload-cadence requirements.
#
# What's in here vs dev-values.yaml:
#
# IDENTICAL: credentials, ingressClass, image, controller config
# minus the timing knobs, validators, http-store demo, spoaHub
# config (including the e2e-specific coraza WAF rule that
# TestIngressHaproxyIngressWafDeny depends on), haproxy service
# shape, resources, webhook.
#
# CHANGED: configPublishInterval bumped from 50ms to 200ms and
# driftPreventionInterval raised to 10m. The reconciler now fires
# immediately (no refractory knob); reload throttling is the
# deployer's minDeploymentInterval at the chart default. At the
# dev-values tight preset, parallel
# ingress-create traffic produces sustained HAProxy worker-fork
# churn (5+ worker generations per second observed on shard [3.2]
# of pipeline 2549659472), and tests that poll-and-expect specific
# responses race the worker-fork windows. 100/100/200ms is the
# historical pre-conformance setting that works cleanly under
# parallel load; the upstream-conformance 5s-poll-vs-all-disabled-
# slots race only surfaces in the sequenced conformance suite,
# which uses its own conformance-values.yaml at the tighter 10ms.

# Explicit credentials for dev environment (avoids auto-generation complexity)
# In production, leave password empty to auto-generate secure random credentials
credentials:
  dataplane:
    username: admin
    password: adminpass

# IngressClass name must match what the demo ingresses use
ingressClass:
  name: haptic

# Use local development image
controller:
  image:
    repository: haptic
    tag: dev
    pullPolicy: Never  # Never pull, always use local image
  resources:
    limits:
      cpu: "4"
      # Keep the chart's memory limit; smaller requests fit both replicas on Kind.
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
  networkPolicy:
    enabled: true
  podSpec:
    podLabels:
      environment: e2e
      managed-by: e2e-suite
  livenessProbe: {}
  readinessProbe: {}
  monitoring:
    serviceMonitor:
      enabled: false
  # The e2e harness creates the certificate Secret and supplies its CA with
  # --set controller.webhook.caBundle.
  webhook:
    enabled: true
    certManager:
      enabled: false
  templateLibraries:
    gateway:
      enabled: true
    # All three vendor annotation libraries are ON, so every vendor test runs in
    # this one profile instead of a shard per vendor. That became possible with
    # the per-object config split (ADR-0014): the combination used to exceed
    # etcd's ~1.5 MiB per-object limit, and the largest object is now ~35% of it.
    #
    # They co-exist safely because a mixed-family Ingress is an error the chart
    # raises per resource, not per install — each test's Ingress uses one
    # family, and a vendor's annotations are inert on resources that don't carry
    # them. hapticAnnotations covers the ingress_haptic_* suite alongside them.
    #
    # The external-auth + coraza SPOA plugins the haptic-native auth-url / waf
    # tests need are enabled explicitly under spoaHub.plugins below rather than
    # inherited from a vendor library.
    haproxytech:
      enabled: true
    haproxyIngress:
      enabled: true
    nginxIngress:
      enabled: true
    kubernetesBackends:
      podReadinessGate:
        enabled: true

  # Route the rendered SPOA-hub TOML through the validator sidecar at
  # admission time. The webhook dry-renders the prospective config
  # (including any per-Ingress nginx.ingress.kubernetes.io/modsecurity-snippet
  # inlined into [plugins.params.coraza].directives) and the validator
  # calls each loaded plugin's validate() — the coraza plugin compiles
  # SecLang via Coraza and surfaces line-numbered diagnostics. Operators
  # applying an Ingress with a typo'd SecRule see the parser error in
  # the kubectl error message instead of a runtime hub crash.
  validators:
    entries:
      - name: spoa-hub
        socketPath: /var/run/haptic-validators/spoa-hub.sock
        files:
          - "general/spoa-hub-config.toml"

  logLevel: DEBUG  # LOG_LEVEL env var for controller startup
  config:
    logging:
      level: DEBUG  # Runtime log level (overrides env var if set)

    # Moderately-fast timings preset for the e2e suite (parallel
    # ingress-create tests). Production defaults (2s
    # minDeploymentInterval, 30s configPublishInterval, 60s
    # driftPreventionInterval) target steady-state load on real
    # clusters; in CI they only add latency. Safety ceilings
    # (reloadVerificationTimeout, syncTimeout, deploymentTimeout)
    # stay at chart defaults — they only matter on failure paths.
    #
    # 100/100/200ms is the historical pre-conformance setting that
    # works cleanly for the e2e suite. The conformance suite has a
    # tighter requirement (the 5s upstream-poll vs all-disabled-
    # slots race) and uses conformance-values.yaml's 10/10/50ms
    # preset — that race only surfaces in the conformance test loop,
    # not in the parallel-ingress e2e suite.
    #
    # Why not 10ms here too: the e2e suite runs 30+ tests in
    # parallel, each creating + deleting Ingresses. At 10ms
    # minDeploymentInterval every ingress event triggers a reload
    # within 10ms, producing sustained HAProxy worker-fork churn
    # (5+ worker generations per second observed on the [3.2]
    # shard of pipeline 2549619472's failure artifacts). Tests
    # that poll-and-expect specific responses race the worker-
    # fork windows; curls land mid-reload, either time out (000)
    # or hit a worker whose accept loop hasn't fully resumed
    # serving rules from the new config. 100/100/200ms is fast
    # enough that ingress-create -> serving latency stays well
    # under 1s (the e2e suite's ExpectOK poll tolerates that)
    # while slow enough that reload-window races mostly close.
    # Observed flake class on the [3.2] shard at 10/10/50ms:
    # TestIngressNginxPermanentRedirect, TestIngressNginxCanary,
    # TestIngressAppRoot, and three TestIngressAnnotations
    # subtests all timing out at ~91-93s with the same shape
    # (rendered config contains the expected rule, polling phase
    # never sees the response).
    #
    # configPublishInterval is overridden so tests asserting
    # `pod.checksum == spec.checksum` don't race the throttle window.
    # driftPreventionInterval stays at 10m so the background check
    # doesn't interleave with tight test windows.
    #
    # No reconciler-level refractory knob exists any more: the Reconciler
    # fires immediately on every event (spec.controller.reconciliationDebounceInterval
    # was removed). Batching is per-watcher (default 100ms; EndpointSlice "0")
    # and reload throttling is the deployer's minDeploymentInterval — both
    # apply here via the chart defaults, so there is nothing to override.
    dataplane:
      driftPreventionInterval: 10m
      configPublishInterval: 200ms

    templatingSettings:
      extraContext:
        diagnostics:
          routingHeaders:
            enabled: true  # Enable introspection headers for development
        # TestIngressAnnotations renders every library's raw configuration annotations.
        ingressPermissions:
          allowRawHAProxyConfig: true
        # Exercise one-annotation reusable WAF policies in the e2e suite.
        waf:
          # The e2e suite deliberately exercises every legacy/vendor escape
          # hatch. Production defaults keep these privileges disabled.
          ingressPermissions:
            allowPolicySelection: true
            allowEnforcementOverride: true
            allowWafDisable: true
            allowCustomRules: true
            allowRawHAProxyConfig: true
          policies:
            # TestMain creates this catalog in a separate namespace before Helm
            # install, exercising the security-team trust boundary.
            configMapRefs:
              security:
                namespace: security
                name: haptic-waf-policies
                key: policies.yaml
            # Keep namespaced self-service authoring enabled in CI so the
            # enabled path is exercised at the daemon load gate on every e2e
            # run — a baked test that only holds with self-service off (or
            # on) fails here instead of in a user's cluster.
            selfService:
              enabled: true

    # HTTP Store Demo: Block requests based on header values from HTTP-fetched blocklist.
    #
    # critical is intentionally absent (defaults to false): if the blocklist-server
    # is unreachable (e.g. during cluster startup, or under load when conformance
    # fixtures churn) the template renders an empty map rather than aborting the
    # whole HAProxy config render. The deny rule that consumes this map still
    # emits — it just matches nothing until the http-store's background refresh
    # populates the cache (delay: 60s). Critical-mode here was killing conformance
    # CI: a single failed fetch would block the entire chart render past the 30s
    # context deadline, leaving HAProxy with partial config (rule comments emitted
    # but http-request set-var lines truncated) and breaking every header-matching
    # / hostname-matching test in the suite.
    maps:
      header-blocklist.map:
        template: |
          {%- var blocklist_url = "http://blocklist-server.echo.svc:80/blocklist.txt" -%}
          {%- var blocklist_content, _ = http.Fetch(blocklist_url, map[string]any{"interval": "60s"}) -%}
          {%- for _, line := range (blocklist_content | tostring() | split("\n")) -%}
          {%- var value = trimSpace(line) -%}
          {%- if value != "" -%}
          {{ value }} 1
          {% end -%}
          {%- end %}

    templateSnippets:
      frontend-extra-100-forwarded-headers-test:
        template: |
          acl operator_forwarded_headers req.hdr(Host) -m beg xfwd-operator.
          http-request set-src hdr_ip(X-Operator-Source) if operator_forwarded_headers { req.hdr(X-Operator-Source) -m found }
          http-request set-header X-Forwarded-Host %[req.hdr(Host)] if operator_forwarded_headers !{ req.hdr(X-Forwarded-Host) -m found }
          http-request set-header X-Forwarded-Port 9443 if operator_forwarded_headers !{ req.hdr(X-Forwarded-Port) -m found }
          http-request set-header X-Forwarded-Proto operator if operator_forwarded_headers
          http-request set-header X-Forwarded-For 198.51.100.9 if operator_forwarded_headers
          http-request set-header Forwarded operator if operator_forwarded_headers
          http-request set-header X-Forwarded-Prefix operator if operator_forwarded_headers
          http-request set-header X-Forwarded-Server operator if operator_forwarded_headers
          http-request set-header X-Real-IP operator if operator_forwarded_headers
          http-request set-header X-Client-IP operator if operator_forwarded_headers
          http-request set-header Client-IP operator if operator_forwarded_headers
      frontend-extra-101-source-headers-test:
        template: |
          acl operator_source_headers req.hdr(Host) -m beg xfwd-source.
          http-request set-header X-Real-IP 198.51.100.8 if operator_source_headers { req.hdr(X-Test-Set-Source),lower -m str x-real-ip }
          http-request del-header X-Real-IP if operator_source_headers { req.hdr(X-Test-Delete-Source),lower -m str x-real-ip }
          http-request set-header X-Client-IP 198.51.100.8 if operator_source_headers { req.hdr(X-Test-Set-Source),lower -m str x-client-ip }
          http-request del-header X-Client-IP if operator_source_headers { req.hdr(X-Test-Delete-Source),lower -m str x-client-ip }
          http-request set-header Client-IP 198.51.100.8 if operator_source_headers { req.hdr(X-Test-Set-Source),lower -m str client-ip }
          http-request del-header Client-IP if operator_source_headers { req.hdr(X-Test-Delete-Source),lower -m str client-ip }
      # Hook into frontend routing to check header against blocklist
      # Uses "frontend-filters-*" naming convention to be auto-included by base.yaml
      frontend-filters-http-store-demo:
        template: |
          # HTTP Store Demo: Block requests with blacklisted header values
          http-request deny deny_status 403 if { req.hdr(X-Custom-Header) -m found } { req.hdr(X-Custom-Header),map({{ pathResolver.GetPath("header-blocklist.map", "map") }}) -m found }

# HAProxy Service - expose externally via NodePort for dev/testing
haproxy:
  service:
    type: NodePort
    # Explicit NodePorts must be set to match kind extraPortMappings
    http:
      nodePort: 30080
    https:
      nodePort: 30443
    stats:
      nodePort: 30404
  # kind cluster maps NodePort services to localhost via extraPortMappings
  # This makes HAProxy accessible at http://localhost:30080 and https://localhost:30443

  # Enable network policies in dev with permissive settings
  networkPolicy:
    enabled: true
    allowExternal: true  # Allow NodePort access from host

# External-auth plugin for the SPOA hub. allow_plaintext=true is needed
# because the dev auth-server.yaml fixture serves http://, not https://.
# hub.logLevel is bumped to debug so test failures surface the per-
# connection SPOE handshakes and per-request plugin invocations
# (the default `info` level only logs startup messages).
spoaHub:
  hub:
    logLevel: debug
  plugins:
    external-auth:
      # Enabled explicitly rather than inherited from the vendor-library OR
      # (values.yaml gates external-auth on nginxIngress): the haptic-native
      # TestHapticExternalAuth (haproxy-haptic.org/auth-url) must not depend on a
      # vendor library staying enabled. Chart default keeps it off unless a
      # vendor library that uses it is enabled.
      enabled: true
      params: |
        timeout_ms = 5000
        fail_open = false
        method = "GET"
        allow_plaintext = true
        forward_headers = [
          "authorization", "cookie",
          "x-forwarded-for", "x-forwarded-proto",
          "x-forwarded-host", "x-forwarded-uri"
        ]
        extract_headers = ["x-auth-user", "x-auth-roles"]
    # Enabled explicitly rather than inherited from the vendor-library OR
    # (values.yaml gates it on nginx-ingress OR haproxy-ingress): the
    # haptic-native TestHapticWAF (haproxy-haptic.org/waf) must not depend on a
    # vendor library staying enabled. Override
    # `directives` to
    # the smallest viable rule set — operators wanting OWASP CRS get
    # the chart default; CI keeps it minimal so per-test
    # `nginx.ingress.kubernetes.io/modsecurity-snippet` and
    # `haproxy-ingress.github.io/waf` rules are the only ones surfacing
    # 403s during e2e. The trigger SecRule (id:7700201) below is shared
    # by the haproxy-ingress.github.io/waf e2e test
    # (TestIngressHaproxyIngressWafDeny): it blocks any request with
    # `User-Agent: haptic-waf-block-probe`, so the test can prove that
    # /waf and /waf-mode wire dispatch + enforcement correctly without
    # depending on the per-Ingress modsec-snippet path. The 7700xxx ID
    # range is intentionally distant from the 91xx/92xx range used by
    # per-Ingress modsec-snippet tests — coraza rejects duplicate rule
    # IDs across global directives + per-Ingress snippet appends, so
    # any e2e test inlining a SecRule must use a non-overlapping ID.
    # The runtime hub reloads on file-watch (haproxy-spoa-hub MR1), so
    # per-Ingress rules land in the running config without a pod
    # restart.
    coraza:
      enabled: true
      directives: |
        SecRuleEngine On
        SecRule REQUEST_HEADERS:User-Agent "@streq haptic-waf-block-probe" "id:7700201,phase:1,deny,status:403,msg:'haptic-e2e-waf-probe blocked'"
        SecRule ARGS "@streq haptic-waf-query-probe" "id:7700202,phase:1,deny,status:403,tag:'attack-sqli',msg:'haptic-e2e-query-probe blocked'"
        SecRule REQUEST_BODY "@contains haptic-waf-body-probe" "id:7700203,phase:2,deny,status:403,tag:'attack-sqli',msg:'haptic-e2e-body-probe blocked'"
      params: |
        detect_only = false
        transaction_ttl_ms = 10000
