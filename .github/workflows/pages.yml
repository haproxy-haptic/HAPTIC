name: Publish website
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful canonical CI run for this publication
        required: true
        type: string
      version:
        description: dev or an existing published release version
        default: dev
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tooling_run: ${{ steps.tooling.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFICATION_RUN: ${{ inputs.verification_run || github.event.workflow_run.id }}
      WEBSITE_VERSION: ${{ inputs.version || 'dev' }}
      PAGES_BROWSERS: chromium,firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: tooling
        name: Require canonical verification for the exact publication tooling
        run: python3 .github/scripts/verify-website-tooling.py
      - id: source
        run: python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --resolve
      - name: Require canonical verification for the content Git objects
        env:
          CONTENT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --source-sha "$CONTENT_SHA" --allow-prose
      - name: Install packaging and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y brotli
          npm ci --prefix scripts/visual-qa
          node scripts/visual-qa/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Reuse verified builds and restore all archived releases
        env:
          CONTENT_SHA: ${{ steps.source.outputs.sha }}
        run: python3 -m scripts.ci.github_site_publication build --source-sha "$CONTENT_SHA" --output "$RUNNER_TEMP/public" --version "$WEBSITE_VERSION"
      - name: Verify every engine and legacy redirect before publication
        run: make test-github-pages-browser PAGES_OUTPUT="$RUNNER_TEMP/public"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-publication
          path: .publication/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-tooling
          path: .publication/verified-tooling.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/public
          retention-days: 1
  retain:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-publication
          path: .publication/
      - name: Recheck CI and retain the browser-verified version archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ inputs.verification_run || github.event.workflow_run.id }}
          CONTENT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          cp .publication/verified-source.json "$RUNNER_TEMP/expected-content.json"
          python3 .github/scripts/verify-website-tooling.py --run "${{ needs.build.outputs.tooling_run }}" --expected .publication/verified-tooling.json
          python3 .github/scripts/verify-publication-source.py --run "$VERIFICATION_RUN" --source-sha "$CONTENT_SHA" --allow-prose
          cmp .publication/verified-source.json "$RUNNER_TEMP/expected-content.json"
          python3 -m scripts.ci.github_site_publication retain --source-sha "$CONTENT_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-retention
          path: .publication/pages/retained.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: retain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_BROWSERS: chromium,firefox
      PAGES_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-tooling
          path: tooling-evidence/
      - name: Recheck the exact tooling receipt before live verification
        run: python3 .github/scripts/verify-website-tooling.py --run "${{ needs.build.outputs.tooling_run }}" --expected tooling-evidence/verified-tooling.json
      - name: Restore the exact deployed files and browser tools
        run: |
          mkdir "$RUNNER_TEMP/public"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/public"
          npm ci --prefix scripts/visual-qa
          node scripts/visual-qa/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Verify live content and every playground version
        run: make test-github-pages-browser PAGES_OUTPUT="$RUNNER_TEMP/public"
