name: Gateway API conformance report
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: conformance-report-${{ github.ref }}
  cancel-in-progress: false
env:
  CONFORMANCE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  CONFORMANCE_MODE: ${{ inputs.release && 'release' || 'candidate' }}
jobs:
  report:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      archive: ${{ steps.bundle.outputs.archive }}
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONFORMANCE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned native tools
        run: bash .github/scripts/install-arm-pilot-tools.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
          cache: false
      - name: Authenticate published image downloads
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Run the full suite and verify the tested controller
        env:
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        run: bash .github/scripts/run-conformance-report.sh
      - name: Bind the report archive to this source and run
        id: bundle
        run: python3 -m scripts.ci.github_conformance --bundle
      - name: Retain report evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/gateway-conformance/report.yaml
            build/gateway-conformance/provenance.json
            build/gateway-conformance/SHA256SUMS
            build/gateway-conformance/gateway-conformance-*.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: Retain startup and conformance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-conformance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug-logs/conformance-report/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: report
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-conformance
      - name: Attach permanent conformance evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.report.outputs.version }}
          ARCHIVE: ${{ needs.report.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/gateway-conformance/$ARCHIVE"
