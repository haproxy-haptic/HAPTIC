        TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)

        export TEST_RUN_PATTERN

        printf ''%s\n'' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt

        set +e

        make test-gateway-conformance 2>&1 | tee .pilot/conformance.log

        result=${PIPESTATUS[0]}

        printf ''%s\n'' "$result" > .pilot/conformance.exit

