name: CI migration speed proof
'on':
  workflow_call:
    inputs:
      verification_profile:
        type: string
        required: false
        default: full
      verification_job_prefix:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite_unit_command_1:
    name: unit-command-1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PILOT_GOGC: '300'
      PILOT_CAPTURE_NETWORK: '0'
      PILOT_GOMAXPROCS: '2'
      HAPTIC_E2E_CONTROLLER_STARTUP: parallel
      PILOT_CAPTURE_PROFILES: '0'
      PILOT_SOURCE_SHA: ${{ github.sha }}
      PILOT_VARNISH_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:2cb9e813ede03e1e272695d1b6ca2be6c50dacc75fdee69485989f4d7a6e97bb
      HAPROXY_VERSION: '3.4'
      E2E_SHARD_INDEX: '1'
      HAPTIC_E2E_PROFILE: ''
      HAPTIC_E2E_GWAPI_CHANNEL: standard
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      HAPTIC_E2E_EXTRA_SET: controller.resources.requests.cpu=600m;controller.resources.limits.cpu=4;controller.resources.limits.memory=4Gi
      PILOT_SUITE: unit-shard
      PILOT_CI_IMAGE: ghcr.io/haproxy-haptic/haptic-ci@sha256:b27b3629fe0597aa0e7f9222e02f3b95ca4edcbb7af12877fd7d34a833b9d3ad
      BASELINE_CHART_VERSION: ''
      GITOPS_PROVIDER: ''
      GITOPS_CERTIFICATES: ''
      SHARD_ID: command
      SHARD_COUNT: '4'
      E2E_SHARD_TOTAL: '4'
      SHARD_INDEX: '1'
      PILOT_STARTUP_ONLY: '0'
      CONFORMANCE_PARALLEL: '4'
      SCALE_SEED_WORKERS: '4'
      E2E_SHARD_WEIGHTS: .github/e2e-shard-weights.json
      PILOT_GO_CACHE_DIR: /tmp/haptic-go-cache
      PILOT_STARTUP_PROFILE: '0'
      PILOT_VALIDATION_TMPFS: '1'
      PILOT_NATIVE_BUILD: '1'
      CI_SUITE: '{"name":"unit-command-1","suite":"unit-shard","shard":"command","index":"1","kind":"x64","runner":"ubuntu-24.04","baseline":"","certificates":"","provider":"","haproxy":"","profile":"","channel":"","node":"","settings":"","image":"","startup":""}'
    steps: &id001
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse Go downloads and compilation
      id: go-cache-unit
      if: fromJSON(env.CI_SUITE).suite == 'unit-shard' && (fromJSON(env.CI_SUITE).shard == 'rest' || fromJSON(env.CI_SUITE).index
        == 1)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', 'ci/build-pins.yml')
          }}-${{ fromJSON(env.CI_SUITE).shard == 'command' && 'command-race' || fromJSON(env.CI_SUITE).shard }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ fromJSON(env.CI_SUITE).shard
          == 'command' && 'command-race' || fromJSON(env.CI_SUITE).shard }}-
    - name: Restore shared unit compilation
      if: fromJSON(env.CI_SUITE).suite == 'unit-shard' && fromJSON(env.CI_SUITE).shard != 'rest' && fromJSON(env.CI_SUITE).index
        != 1
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', 'ci/build-pins.yml')
          }}-${{ fromJSON(env.CI_SUITE).shard == 'command' && 'command-race' || fromJSON(env.CI_SUITE).shard }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ fromJSON(env.CI_SUITE).shard
          == 'command' && 'command-race' || fromJSON(env.CI_SUITE).shard }}-
    - name: Restore and maintain shared Helm compilation
      id: go-cache-helm
      if: fromJSON(env.CI_SUITE).suite == 'helm' && fromJSON(env.CI_SUITE).haproxy == '3.4'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', 'ci/build-pins.yml')
          }}
    - name: Restore shared Helm compilation
      if: (fromJSON(env.CI_SUITE).suite == 'helm' && fromJSON(env.CI_SUITE).haproxy != '3.4') || fromJSON(env.CI_SUITE).suite
        == 'chart' || fromJSON(env.CI_SUITE).suite == 'chart-minimum'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', 'ci/build-pins.yml')
          }}
    - name: Restore shared Go compilation for checks
      if: fromJSON(env.CI_SUITE).suite == 'lint' || fromJSON(env.CI_SUITE).suite == 'agent' || fromJSON(env.CI_SUITE).suite
        == 'test-support'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PILOT_GO_CACHE_DIR }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/haptic/default.pgo', 'ci/build-pins.yml')
          }}-rest
    - name: Restore and maintain SPOA plugin downloads
      if: fromJSON(env.CI_SUITE).suite == 'spoa'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/spoa-plugins
        key: spoa-plugins-${{ hashFiles('versions-spoa.env', 'scripts/prep-spoa-plugins.sh') }}
        restore-keys: spoa-plugins-
    - name: Restore SPOA plugin downloads
      if: fromJSON(env.CI_SUITE).runner == 'ubuntu-24.04-arm' || contains(fromJSON('["defaults", "plain"]'), fromJSON(env.CI_SUITE).suite)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/spoa-plugins
        key: spoa-plugins-${{ hashFiles('versions-spoa.env', 'scripts/prep-spoa-plugins.sh') }}
        restore-keys: spoa-plugins-
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      if: fromJSON(env.CI_SUITE).suite == 'snapshot' || fromJSON(env.CI_SUITE).suite == 'spoa'
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64,arm
        cache-image: false
    - name: Select native compiler cache
      if: fromJSON(env.CI_SUITE).runner == 'ubuntu-24.04-arm'
      run: 'mkdir -p .pilot

        printf ''%s\n'' host-cache > .pilot/compiler-cache-variant

        '
    - name: Install pinned native tools
      run: bash .github/scripts/install-arm-pilot-tools.sh
      if: fromJSON(env.CI_SUITE).runner == 'ubuntu-24.04-arm'
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.HAPTIC_NATIVE_GO_VERSION }}
        cache: true
        cache-dependency-path: 'go.mod

          go.sum

          cmd/haptic/default.pgo

          .pilot/compiler-cache-variant

          '
      if: fromJSON(env.CI_SUITE).runner == 'ubuntu-24.04-arm'
    - name: Run native ARM suite
      if: fromJSON(env.CI_SUITE).runner == 'ubuntu-24.04-arm' && fromJSON(env.CI_SUITE).suite != 'upgrade' && fromJSON(env.CI_SUITE).suite
        != 'gitops'
      run: bash .github/scripts/run-arm-pilot.sh
    - name: Run native ARM lifecycle checks
      if: fromJSON(env.CI_SUITE).suite == 'upgrade' || fromJSON(env.CI_SUITE).suite == 'gitops'
      run: bash .github/scripts/run-lifecycle-arm.sh
    - name: Run upstream Gateway conformance
      if: fromJSON(env.CI_SUITE).kind == 'gateway'
      run: 'set -euo pipefail

        TEST_RUN_PATTERN=$(scripts/shard-conformance-tests.sh "$SHARD_INDEX" 4)

        export TEST_RUN_PATTERN

        printf ''%s\n'' "$TEST_RUN_PATTERN" > .pilot/conformance-selection.txt

        set +e

        make test-gateway-conformance 2>&1 | tee .pilot/conformance.log

        result=${PIPESTATUS[0]}

        printf ''%s\n'' "$result" > .pilot/conformance.exit

        exit "$result"

        '
    - name: Collect conformance failure snapshots
      if: always() && fromJSON(env.CI_SUITE).kind == 'gateway'
      env:
        KUBECONFIG: /tmp/haproxy-e2e-kubeconfig
      run: "kubectl -n haptic get configmaps -l app.kubernetes.io/component=conformance-snapshot \\\n  -o json > .pilot/conformance-snapshots.json\n"
    - name: Collect conformance cluster diagnostics
      if: always() && fromJSON(env.CI_SUITE).kind == 'gateway'
      run: python3 -m scripts.ci.github_conformance --diagnostics .pilot/conformance-diagnostics
    - name: Run upstream Ingress conformance
      if: fromJSON(env.CI_SUITE).kind == 'ingress'
      run: bash .github/scripts/run-ingress-arm-pilot.sh
    - name: Check controller output
      if: fromJSON(env.CI_SUITE).kind == 'nightly'
      run: KUBECONFIG=/tmp/haproxy-e2e-kubeconfig make check-controller-output
    - name: Run existing x64 suite
      if: fromJSON(env.CI_SUITE).kind == 'x64'
      env:
        PILOT_GO_CACHE_SAVES: ${{ (steps.go-cache-unit.conclusion == 'success' && steps.go-cache-unit.outputs.cache-hit !=
          'true') || (steps.go-cache-helm.conclusion == 'success' && steps.go-cache-helm.outputs.cache-hit != 'true') }}
      run: bash .github/scripts/run-remaining-pilot.sh
    - name: Run native build and publication checks
      if: fromJSON(env.CI_SUITE).kind == 'build'
      run: bash .github/scripts/run-build-pilot.sh
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Retain verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-evidence-${{ fromJSON(env.CI_SUITE).name }}
        path: '.pilot/

          debug-logs/'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
    if: ${{ !cancelled() && inputs.verification_profile != 'prose' }}
