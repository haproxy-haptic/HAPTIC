      - Rejected resource changes: operations/input-isolation.md
      - Access logging: operations/access-logging.md
      - Metrics, alerts, and dashboards: operations/monitoring.md
      - Debugging: operations/debugging.md
      - Troubleshooting: troubleshooting.md
    - Protect the installation:
      - Security: operations/security.md
      - Agent certificates: operations/agent-certificates.md
      - Webhook certificates: operations/webhook-certificates.md
      - Enforce routing policies: operations/governance.md
      - Validate generated files: operations/pluggable-validators.md
  - Reference:
    - Controller and agent metrics: operations/metrics-reference.md
    - Chart values: reference.md
    - IngressClass: ingress-class.md
    - GatewayClass: gateway-class.md
    - Gateway API: libraries/gateway.md
    - HAProxyRoutePolicy: route-policy.md
    - Native Ingress annotations: libraries/haptic-annotations.md
    - Migration annotations:
      - Compatibility overview: annotation-compatibility.md
