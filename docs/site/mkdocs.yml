site_name: "HAPTIC - HAProxy Ingress Controller"
# Canonical base for every page (mkdocs also uses it for sitemap entries).
# The deploy script overrides it per build: /docs/dev/ while only dev exists,
# /docs/latest/ once a stable release publishes that alias — so canonicals
# always resolve (a bare /docs/<page>/ would 404) and all versions consolidate
# their search ranking onto the default version.
site_url: !ENV [DOCS_SITE_URL, 'https://haproxy-haptic.org/docs/dev/']
site_description: "Documentation for HAPTIC, a template-driven HAProxy ingress controller for Kubernetes with Ingress and Gateway API support."

repo_name: haproxy-haptic/HAPTIC
repo_url: https://github.com/haproxy-haptic/HAPTIC
edit_uri: edit/main/docs/site/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-icon.svg
  favicon: assets/favicon.svg
  icon:
    alternate: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - /shared/playground-embed.css

extra_javascript:
  - javascripts/development-notice.js
  - /shared/playground-embed.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Get started:
    - Install and try HAPTIC: getting-started.md
    - Migrate from another controller: migrating.md
    - Install the CLI: cli.md
  - Route traffic:
    - Choose a routing guide: routing.md
    - Ingress routing: libraries/ingress.md
    - Try Gateway API: gateway-api.md
    - Ingress annotations: annotations.md
    - TLS certificates: ssl-certificates.md
    - Gateway route policies: operations/gateway-policies.md
    - WAF policies: operations/waf-policies.md
    - Tune WAF rules: operations/waf-tuning.md
    - Response caching: operations/response-cache.md
    - Traffic processing plugins: operations/spoa-hub.md
    - Backend mTLS with SPIFFE/SPIRE: operations/spiffe-mtls.md
    - TCP with PROXY protocol: operations/tcp-proxy-protocol.md
  - Write templates:
    - Write your first template: templating.md
    - Template syntax: template-language.md
    - Read resources: template-resources.md
    - Watch resources: watching-resources.md
    - Generate configuration and files: template-files.md
    - Report resource status: template-status.md
    - Test templates: validation-tests.md
    - Share and extend libraries: template-libraries.md
  - Operate HAPTIC:
    - Overview: operations/index.md
    - Install and update:
      - Install and upgrade with Helm: deploying-with-helm.md
      - Upgrade notes: upgrade-notes.md
      - GitOps: operations/gitops.md
      - Validate before deploying: operations/validate-before-deploy.md
      - Configure HAProxy pods and access: haproxy-deployment.md
      - High availability: operations/high-availability.md
      - Roll out without dropped requests: operations/pod-readiness-gate.md
      - Resource sizing: operations/performance.md
      - Networking: operations/networking.md
    - Observe and troubleshoot:
