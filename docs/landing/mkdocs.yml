site_name: "HAPTIC – HAProxy Ingress and Gateway API Controller for Kubernetes"
site_url: https://haproxy-haptic.org/
site_description: "Route Kubernetes traffic through HAProxy with HAPTIC. Install with Helm, use Ingress or Gateway API, and extend routing with templates for your own resources."

repo_name: haproxy-haptic/HAPTIC
repo_url: https://github.com/haproxy-haptic/HAPTIC

docs_dir: docs

# The landing page markup lives in overrides/home.html (the theme custom_dir),
# which `mkdocs serve` does not watch by default — edits there wouldn't
# live-reload. Watch it explicitly so serve rebuilds on home.html changes.
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-icon.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - /shared/playground-embed.css

extra_javascript:
  - javascripts/development-notice.js
  - /shared/playground-embed.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md

plugins:
  - search: false

hooks:
  - ../site/hooks/agent_skills.py

extra:
  agent_skill_discovery: true
