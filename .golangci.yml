version: "2"

run:
  timeout: 10m
  go: '1.27'
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Error detection & correctness
    - errcheck        # Check for unchecked errors
    - govet           # Go vet examines Go source code
    - staticcheck     # Comprehensive static analysis (includes gosimple)
    - ineffassign     # Detect ineffectual assignments
    - unused          # Check for unused code
    - bodyclose       # Ensure HTTP response body is closed
    - errchkjson      # Check for unchecked errors in JSON marshaling
    - nilerr          # Detect returning nil when error should be returned
    - nilnil          # Detect returning nil when nil should be returned

    # Security
    - gosec           # Security problems

    # Style & best practices
    - revive          # Replacement for golint
    - gocritic        # Opinionated Go source code linter
    - misspell        # Detect commonly misspelled words
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Detect unused function parameters
    - nakedret        # Detect naked returns in functions > 30 lines
    - whitespace      # Detect leading/trailing whitespace
    - godot           # Check if comments end in a period
    - importas        # Enforce import aliases
    - goprintffuncname # Check that printf-like functions are named correctly

    # Code complexity
    - gocyclo         # Detect cyclomatic complexity
    - goconst         # Detect repeated strings that should be constants
    - dupl            # Detect code cloning

    # Performance
    - prealloc        # Detect slice declarations that could be preallocated
    - copyloopvar     # Detect loop variable reference issues (Go 1.22+)

    # Maintenance
    - depguard        # Ban imports that break an architectural rule
    - godox           # Detect TODO/FIXME/BUG comments
    - asciicheck      # Ensure only ASCII characters
    - bidichk         # Detect dangerous Unicode bidirectional characters
    - dogsled         # Detect too many blank identifiers
    - makezero        # Detect improper slice/map initialization
    - nolintlint      # Reports ill-formed or insufficient nolint directives

    # Testing
    - thelper         # Detect test helpers without t.Helper() call

  settings:
    gocyclo:
      min-complexity: 20

    depguard:
      rules:
        # Nothing in production parses HAProxy configuration: the generator
        # declares what it generated and HAProxy parses what it is given
        # (ADR-0022). client-native can parse and re-serialise a config, so it
        # reaches only the agent's master-socket client, the browser
        # playground's `haproxy_valid` fallback, and the differential test.
        # scripts/check-client-native-free.sh proves the same at the link site.
        client-native:
          list-mode: lax
          files:
            - $all
            # The differential CI test is client-native's parser as an oracle.
            - "!$test"
            # The agent's HAProxy runtime client. Its own rule is below.
            - "!**/pkg/dataplane/agent/cli/**"
            - "!**/pkg/dataplane/agent/server/**"
            - "!**/pkg/dataplane/agent/files/**"
            # The generator of the playground's schema validators. A chore
            # tool, in no image; check-client-native-free.sh covers the binaries.
            - "!**/cmd/gen-validators/**"
            # The syntax + schema check, behind the `playground` build tag.
            - "!**/pkg/dataplane/parser/**"
            - "!**/pkg/dataplane/validators/**"
            - "!**/pkg/dataplane/validate_syntax.go"
            - "!**/pkg/dataplane/validate_schema.go"
            - "!**/pkg/dataplane/validate_syntax_schema.go"
          deny:
            - pkg: github.com/haproxytech/client-native
              desc: >-
                client-native parses HAProxy configuration, which no production
                code may do. Declare the structure in renderplan instead; the
                master-socket client belongs under pkg/dataplane/agent.
        # The agent drives the HAProxy master socket with client-native's
        # runtime client. It still may not parse a configuration.
        client-native-agent:
          list-mode: lax
          files:
            - "**/pkg/dataplane/agent/cli/**"
            - "**/pkg/dataplane/agent/server/**"
            - "**/pkg/dataplane/agent/files/**"
          deny:
            - pkg: github.com/haproxytech/client-native/v6/config-parser
              desc: the agent executes commands; it never parses a configuration
            - pkg: github.com/haproxytech/client-native/v6/configuration
              desc: the agent executes commands; it never parses a configuration
            - pkg: github.com/haproxytech/client-native/v6/models
              desc: the agent's wire types are pkg/dataplane/agent/api, not client-native models

    goconst:
      min-len: 3
      min-occurrences: 3

    dupl:
      threshold: 500

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
      disabled-checks:
        # Style suggestion often unhelpful for boolean conditions.
        # See: github.com/go-critic/go-critic/issues/453
        - ifElseChain

    govet:
      enable-all: true
      disable:
        # Reordering fields for memory optimization hurts readability and auto-fix
        # removes comments. See: github.com/influxdata/telegraf/issues/15540
        - fieldalignment
        # Intentional shadowing (e.g., tc := tc for closures) is idiomatic Go.
        # Shadow check was removed from stable go vet (#29260, #34053).
        - shadow
        # Inline analyzer flags calls to small helper functions like ptrInt64.
        # Inlining test convenience helpers hurts readability without benefit.
        - inline

    revive:
      rules:
        # Disable some noisy rules
        - name: exported
          disabled: true # Too noisy for internal packages
        - name: package-comments
          disabled: true # Not all packages need comments
        - name: var-naming
          disabled: false
          arguments:
            - ["ID"] # Allow ID instead of Id
        - name: function-length
          disabled: false
          arguments: [50, 0] # Warn on functions > 50 lines
        - name: cognitive-complexity
          disabled: false
          arguments: [20]
        - name: cyclomatic
          disabled: false
          arguments: [20]

    importas:
      no-unaliased: true
      alias:
        # Kubernetes core
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/client-go/kubernetes/typed/core/v1
          alias: corev1client
        # HAProxy client
        - pkg: github.com/haproxytech/client-native/v6
          alias: haproxy

    gosec:
      excludes:
        # net/http serve timeouts handled at infrastructure level
        - G114
        # Safe: binary name "haproxy" is hardcoded, LookPath only resolves path
        - G204
        # math/rand not used for cryptographic purposes
        - G404

    godot:
      scope: declarations
      capital: false

    godox:
      keywords:
        - BUG
        - FIXME
        - HACK

    nakedret:
      max-func-lines: 30

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - ^vendor/
      - ^third_party/
      - ^charts/ # Helm charts directory
      - ^pkg/generated/ # Generated code (DataPlane API clients, K8s clientsets)
    rules:
      # Exclude zz_generated files (if any in future)
      - path: zz_generated\..*\.go$
        linters:
          - all

      # Relax rules for test files
      - path: _test\.go$
        linters:
          - errcheck
          - dupl
          - gosec
          - goconst
          - gocyclo
          - funlen

      # Copied-authority forgery tests copy lock-bearing structs on purpose:
      # the copy is the attack the seal checks must reject.
      - path: pkg/controller/renderer/(incremental_async_cache_reservation|incremental_publication_snapshot|output_publication)_test\.go$
        linters:
          - govet
        text: 'copylocks:'

      # The by-value parameter IS the ownership boundary: these entry points
      # copy so a caller cannot mutate what the plan/context now owns. A
      # pointer would alias caller memory into sealed state.
      - path: pkg/dataplane/renderplan/(delta|snapshot)\.go$
        linters:
          - gocritic
        text: 'hugeParam:'
      - path: (pkg/templating/incremental_component_context|pkg/incremental/cold_batch)\.go$
        linters:
          - gocritic
        text: 'hugeParam:'

      # slog.Handler requires its Record argument by value.
      - path: pkg/core/logging/cancellation\.go$
        linters:
          - gocritic
        text: 'hugeParam: record is heavy'

      # The upstream roundtripper.RoundTripper interface requires its Request argument by value.
      - path: ^tests/conformance/snapshotter\.go$
        linters:
          - gocritic
        text: 'hugeParam: req is heavy'

      # The always-nil error is mandated by the interface this benchmark
      # forwarder implements; dropping it fails the type assertion.
      - path: cmd/haptic/benchmark_incremental_test\.go$
        linters:
          - unparam

      # nil-with-nil-error is the documented "no session / no previous output"
      # contract these callers switch on; a sentinel would turn absence into
      # an error path at every call site.
      - path: (pkg/controller/rendercontext/render_document|pkg/controller/renderer/exact_cycle_previous_outputs|pkg/controller/deployer/plan_cache)\.go$
        linters:
          - nilnil

      # Disable dupl for section operation files - intentional structural similarity for type-specific wrappers
      - path: pkg/dataplane/comparator/sections/
        linters:
          - dupl
      - path: pkg/dataplane/auxiliaryfiles/
        linters:
          - dupl

      # Relax rules for integration test helpers
      - path: tests/integration/
        linters:
          - errcheck
          - gosec
          - goconst
          - gocyclo

      # Test tooling that builds a container image from a locally built binary.
      # Its paths come from the developer or the CI job (HAPTIC_BINARY, the
      # module root), never from anything a cluster or a request supplies, so
      # gosec's file-inclusion and taint findings have no attacker to protect
      # against. Untagged because two suites share it, which is why it reaches
      # the linter at all where tests/agent's tagged copy did not.
      - path: tests/kindutil/
        linters:
          - gosec

      # The test runner creates the artifact directory explicitly selected by its caller.
      - path: ^tests/runner/artifacts\.go$
        linters:
          - gosec
        text: "G703:"

      # Allow dot imports in test files (for gomega/ginkgo if used)
      - path: _test\.go$
        text: "should not use dot imports"

      # Ignore certain patterns
      - text: "G304: Potential file inclusion via variable"
        linters:
          - gosec
        path: tests/integration/
      # Same rationale as tests/integration/ — paths are built from
      # filepath.Join on a parent dir we just os.ReadDir'd, not from
      # external input. Used by the ingress-conformance feature
      # splitter (tests/conformance/ingress_sharding.go).
      - text: "G304: Potential file inclusion via variable"
        linters:
          - gosec
        path: tests/conformance/
      - text: "G703: Path traversal via taint analysis"
        linters:
          - gosec
        path: tests/conformance/

      # Non-root containers read mounts beneath an unmounted, owner-only parent.
      - path: ^cmd/haptic/preflight\.go$
        linters:
          - gosec
        text: "G30[16]:"

      # HAPTIC_HEAPDUMP_DIR is set by the operator in the pod spec; any existing absolute directory is allowed by design.
      - path: ^pkg/introspection/server\.go$
        linters:
          - gosec
        text: "G703:"

      # Allow TODO comments in example code
      - path: examples/
        linters:
          - godox

      # G118: context cancel not deferred — false positive for struct-field cancel pattern
      # (cancel stored in struct and called in Stop/Close lifecycle methods)
      - path: pkg/controller/(controller|leader|webhook/component|httpstore/component)\.go
        linters:
          - gosec
        text: "G118"
      - path: pkg/controller/testrunner/runner\.go
        linters:
          - gosec
        text: "G118"

      # G108: pprof intentionally exposed on debug port for production debugging
      - path: pkg/introspection/server\.go
        linters:
          - gosec
        text: "G108"

      # goconst exclusions: strings that look duplicated but are inherent API
      # identifiers (HAProxy parser keywords, template variable names, k8s
      # field names, assertion-DSL types). Extracting them into constants
      # adds indirection without making the contract clearer to readers.
      - path: pkg/dataplane/parser/enterprise/
        linters:
          - goconst
      - path: pkg/controller/rendercontext/
        linters:
          - goconst
      - path: pkg/controller/testrunner/
        linters:
          - goconst
      # resourceapplier reads/writes unstructured K8s objects via map keys
      # (apiVersion, kind, name, metadata) — extracting these into constants
      # adds indirection without clarifying the K8s API contract they encode.
      - path: pkg/controller/resourceapplier/
        linters:
          - goconst
      # projection.go computes the unstructured top-level map keys to retain
      # (apiVersion, kind, metadata) for the on-demand informer body-strip —
      # same K8s-field-name-as-map-key case as resourceapplier above.
      - path: pkg/k8s/watcher/projection.go
        linters:
          - goconst
      - path: pkg/templating/filters(_status|_string|_jsonpath)?\.go
        linters:
          - goconst

      # G101: Kubernetes Secret name constant, not actual credentials
      - path: tests/acceptance/env\.go
        linters:
          - gosec
        text: "G101"

      # These constants name Kubernetes objects; neither contains credential data.
      - path: ^tests/scenarios/resources\.go$
        source: '^\s*gitops(Credentials|Webhook)Secret\s*='
        linters:
          - gosec
        text: "G101"

      # G602: slice index out of range — false positive when index is validated
      # by the enclosing loop that found the element
      - path: pkg/k8s/configpublisher/name_helpers\.go
        linters:
          - gosec
        text: "G602"

      # nilerr: intentional nil return on context cancellation (graceful shutdown)
      - path: pkg/controller/controller\.go
        linters:
          - nilerr
      # nilerr: intentional nil return for missing fields during filtering
      - path: pkg/k8s/indexer/filter\.go
        linters:
          - nilerr

      # gocritic hugeParam: Config passed by value to prevent external mutation
      - path: pkg/k8s/watcher/watcher\.go
        linters:
          - gocritic
        text: "hugeParam"

      # revive cognitive-complexity: Large switch/formatting functions with acceptable complexity
      - path: pkg/controller/commentator/insights\.go
        linters:
          - revive
          - gocyclo
      - path: pkg/controller/testrunner/output\.go
        linters:
          - revive
      - path: tests/architecture_test\.go
        linters:
          - revive
      - path: pkg/k8s/watcher/single_test\.go
        linters:
          - revive

      # Exclude godot false positives for correctly formatted comments
      # These comments all end with periods but godot incorrectly flags them
      - path: pkg/controller/dryrunvalidator/component.go
        linters:
          - godot

      # Allow "types" package name in pkg/k8s/types - this is a well-organized
      # package containing interface definitions used across the k8s subpackages
      - path: pkg/k8s/types/
        text: "var-naming: avoid meaningless package names"
        linters:
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

output:
  formats:
    text:
      path: stdout
      colors: true
  show-stats: false
